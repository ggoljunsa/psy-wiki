<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1fa463" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한입 학습">
<title>심리학 기말 · 한입 학습</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #f6f7f4; --card: #ffffff; --fg: #1f2a24; --muted: #6b7570; --line: #e1e5df;
  --acc: #1fa463; --acc-d: #15804c; --acc-soft: #dff4e8;
  --red: #e5484d; --red-soft: #fde4e4; --gold: #f2b01e; --blue: #3478f6;
  --chip: #ffffff; --chip-b: #d7dcd5; --shadow: 0 2px 0 rgba(0,0,0,.08);
  --sa-t: env(safe-area-inset-top, 0px); --sa-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121614; --card: #1c221f; --fg: #e8ece9; --muted: #96a09a; --line: #2e3632;
    --acc: #2fc27a; --acc-d: #22955c; --acc-soft: #173826; --red: #ff6b6e; --red-soft: #3a1d1e;
    --gold: #f5c04a; --chip: #232a26; --chip-b: #3a443f; --shadow: 0 2px 0 rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif; word-break: keep-all; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
a { color: var(--blue); }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; background: var(--line); padding: 0 4px; border-radius: 4px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; } .hidden { display: none; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
#top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: calc(8px + var(--sa-t)) 12px 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
.cswitch { border: 1px solid var(--line); background: var(--card); border-radius: 12px; min-height: 40px; padding: 0 10px; font-weight: 700; font-size: 14px; max-width: 42%; display: flex; align-items: center; cursor: pointer; }
.ctitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hstats { display: flex; align-items: center; gap: 8px; }
.hs { display: flex; align-items: center; gap: 2px; font-size: 15px; }
.hs b { font-variant-numeric: tabular-nums; }
.hs.goal { border: 0; background: none; padding: 0; min-width: 40px; min-height: 40px; justify-content: center; cursor: pointer; }
#view { flex: 1; padding: 12px 14px calc(84px + var(--sa-b)); }
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; background: var(--card); border-top: 1px solid var(--line); padding-bottom: var(--sa-b); }
#tabs button { flex: 1; max-width: 140px; min-height: 56px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); cursor: pointer; }
#tabs button i { font-style: normal; font-size: 22px; line-height: 1.1; }
#tabs button.on { color: var(--acc); font-weight: 700; }
body.insession #top, body.insession #tabs { display: none; }
body.insession #view { padding-bottom: 12px; }

/* buttons */
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; margin: 8px 0 0; padding: 10px 16px; border-radius: 14px;
  border: 2px solid var(--chip-b); background: var(--card); font-weight: 700; font-size: 16px; text-decoration: none; color: var(--fg); cursor: pointer; box-shadow: var(--shadow); }
.btn.primary { background: var(--acc); border-color: var(--acc-d); color: #fff; }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--muted); }
.btn.ghost.danger { color: var(--red); background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.row2 { display: flex; gap: 8px; } .row2 .btn { flex: 1; }
.link { border: 0; background: none; color: var(--blue); padding: 8px 0; min-height: 40px; cursor: pointer; }

/* path */
.exam { margin: 0 0 10px; }
.duecard { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 12px 14px; margin-bottom: 12px; border-radius: 16px; border: 2px solid var(--gold); background: var(--card); cursor: pointer; }
.duecard span { font-size: 13px; color: var(--muted); }
.unit { margin-bottom: 18px; }
.uhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; color: #fff; background: var(--u); box-shadow: 0 3px 0 var(--ud); }
.utitle { font-weight: 800; font-size: 17px; } .udesc { font-size: 13px; opacity: .9; }
.uprog { font-weight: 700; font-size: 14px; background: rgba(255,255,255,.22); padding: 2px 10px; border-radius: 99px; white-space: nowrap; }
.hue0 { --u: #1fa463; --ud: #15804c; } .hue1 { --u: #3478f6; --ud: #2459bd; } .hue2 { --u: #b4579f; --ud: #87407a; }
.hue3 { --u: #e07a1f; --ud: #a95a14; } .hue4 { --u: #0f9fa8; --ud: #0b767c; } .hue5 { --u: #6f5bd6; --ud: #5243a5; }
.nodes { display: flex; flex-direction: column; align-items: center; padding: 14px 0 4px; }
.nwrap { position: relative; display: flex; flex-direction: column; align-items: center; width: 120px; margin: 6px 0; }
.node { width: 72px; height: 72px; border-radius: 50%; border: 0; cursor: pointer; position: relative; padding: 0;
  background: conic-gradient(var(--u) var(--p), var(--line) 0); display: flex; align-items: center; justify-content: center; }
.node > span { width: 60px; height: 60px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: var(--u); box-shadow: inset 0 -4px 0 rgba(0,0,0,.08); }
.node.done > span { background: var(--u); color: #fff; box-shadow: inset 0 -5px 0 var(--ud); }
.node.gold > span { background: var(--gold); color: #fff; }
.node.fresh { opacity: .75; }
.node.rec { animation: pulse 1.6s ease-in-out infinite; }
.node.rec > span { background: var(--u); color: #fff; box-shadow: inset 0 -5px 0 var(--ud); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--u) 50%, transparent); } 50% { box-shadow: 0 0 0 10px transparent; } }
.bubble { position: absolute; top: -26px; background: var(--card); border: 2px solid var(--u); color: var(--u); font-weight: 800; font-size: 13px; padding: 1px 10px; border-radius: 10px; z-index: 1; }
.crown { position: absolute; top: 50px; right: 12px; font-size: 12px; font-weight: 800; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 0 5px; }
.nlabel { font-size: 13px; text-align: center; margin-top: 4px; line-height: 1.25; max-width: 120px; }
.pend { text-align: center; margin: 10px 0; }
.lmeta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 6px 0; font-size: 14px; }

/* modal / toast */
#modal { display: none; position: fixed; inset: 0; z-index: 20; }
#modal.show { display: block; }
.mback { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.mbox { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 88vh; overflow: auto; background: var(--card);
  border-radius: 20px 20px 0 0; padding: 18px 16px calc(16px + var(--sa-b)); animation: up .18s ease-out; }
.mbox h3 { margin: 4px 0 8px; font-size: 19px; }
.big { font-size: 56px; text-align: center; line-height: 1.2; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.crow { display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 12px; margin: 6px 0; border-radius: 12px; border: 2px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 700; }
.crow.me { border-color: var(--acc); background: var(--acc-soft); }
.crow .muted { font-weight: 400; font-size: 14px; }
#toast { position: fixed; left: 50%; bottom: calc(80px + var(--sa-b)); transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; z-index: 30;
  background: #222; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw; transition: .2s; }
#toast.show { opacity: 1; transform: translateX(-50%); }
textarea.rep { width: 100%; height: 42vh; margin-top: 8px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 8px; }

/* lesson */
.lesson { display: flex; flex-direction: column; min-height: calc(100vh - 24px - var(--sa-t) - var(--sa-b)); padding-top: var(--sa-t); }
.lbar { display: flex; align-items: center; gap: 10px; }
.x { width: 44px; height: 44px; border: 0; background: none; font-size: 22px; color: var(--muted); cursor: pointer; }
.prog { flex: 1; height: 16px; border-radius: 99px; background: var(--line); overflow: hidden; }
.pfill { height: 100%; background: var(--acc); border-radius: 99px; transition: width .3s; }
.lh { font-weight: 700; min-width: 44px; text-align: right; }
.qbody { flex: 1; padding: 10px 2px; }
.qtype { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; color: var(--acc); margin-bottom: 6px; }
.prof { color: #a35b00; background: #fff0d6; border-radius: 99px; padding: 0 8px; font-weight: 700; }
@media (prefers-color-scheme: dark) { .prof { color: #ffcf7a; background: #3a2c12; } }
.combo { color: var(--gold); } .again { color: var(--red); }
.q { font-size: 19px; font-weight: 700; line-height: 1.5; margin: 4px 0 16px; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { display: flex; align-items: center; gap: 10px; text-align: left; min-height: 56px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--chip-b); background: var(--chip); cursor: pointer; box-shadow: var(--shadow); }
.choice.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--chip)); }
.cnum { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--chip-b); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.tfrow { display: flex; gap: 12px; }
.tf { flex: 1; min-height: 140px; border-radius: 18px; border: 2px solid var(--chip-b); background: var(--chip); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow); }
.tfbig { font-size: 56px; font-weight: 900; line-height: 1; }
.tf.t .tfbig { color: var(--acc); } .tf.f .tfbig { color: var(--red); }
.tf.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--chip)); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.chip { min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--chip-b); background: var(--chip); cursor: pointer; box-shadow: var(--shadow); font-size: 15px; text-align: left; max-width: 100%; }
.chip.used { visibility: hidden; }
.chip.mini { min-width: 48px; text-align: center; }
.cloze { line-height: 2.2; }
.slot { display: inline-block; min-width: 64px; min-height: 40px; margin: 2px 2px; padding: 2px 10px; border-radius: 10px; border: 2px solid var(--blue); background: color-mix(in srgb, var(--blue) 10%, var(--chip)); font-size: 15px; font-weight: 700; line-height: 1.4; vertical-align: middle; cursor: pointer; max-width: 100%; }
.slot.empty { border-style: dashed; border-color: var(--chip-b); background: transparent; color: var(--muted); font-weight: 400; }
.seq { min-height: 120px; display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 2px dashed var(--chip-b); border-radius: 14px; }
.chip.step { display: flex; align-items: center; gap: 8px; width: 100%; border-color: var(--blue); }
.snum { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mitem { min-height: 56px; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--chip-b); background: var(--chip); cursor: pointer; font-size: 14px; box-shadow: var(--shadow); text-align: center; }
.mitem.r { font-size: 13px; }
.mitem.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--chip)); }
.mitem.ok { border-color: var(--acc); background: var(--acc-soft); opacity: .55; box-shadow: none; }
.mitem.bad { border-color: var(--red); background: var(--red-soft); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.inp { width: 100%; min-height: 54px; font-size: 18px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--chip-b); background: var(--chip); color: var(--fg); }
.inp:focus { outline: none; border-color: var(--blue); }
.inp.sm { min-height: 46px; font-size: 15px; }
.numrow { display: flex; gap: 8px; align-items: center; }
.numrow .inp { flex: 1; min-width: 0; }
.unit { font-weight: 700; color: var(--muted); }
.lfoot { position: sticky; bottom: 0; padding: 8px 0 calc(8px + var(--sa-b)); background: var(--bg); }
.lfoot .skip { margin-top: 0; min-height: 40px; }

/* feedback sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-width: 560px; margin: 0 auto; transform: translateY(110%); transition: transform .2s ease-out;
  padding: 16px 16px calc(14px + var(--sa-b)); border-radius: 20px 20px 0 0; max-height: 75vh; overflow: auto; }
.sheet.show { transform: none; }
.sheet.ok { background: var(--acc-soft); } .sheet.bad { background: var(--red-soft); }
.shead { font-size: 21px; font-weight: 900; margin-bottom: 6px; }
.sheet.ok .shead { color: var(--acc-d); } .sheet.bad .shead { color: var(--red); }
@media (prefers-color-scheme: dark) { .sheet.ok .shead { color: var(--acc); } }
.sans, .sgiven { margin: 4px 0; } .sans b { color: var(--acc-d); } .sgiven b { color: var(--red); }
@media (prefers-color-scheme: dark) { .sans b { color: var(--acc); } }
.sexp { margin: 8px 0; font-size: 15px; }
.smeta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); align-items: center; }
.smeta a { font-weight: 700; padding: 6px 0; }

/* result */
.result { text-align: center; padding: calc(30px + var(--sa-t)) 4px 10px; }
.result h2 { margin: 6px 0 10px; }
.pill { display: inline-block; margin: 4px; padding: 4px 12px; border-radius: 99px; background: var(--acc-soft); font-weight: 700; font-size: 14px; }
.pill.gold { background: #fff0c2; color: #7a5600; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 8px; text-align: center; }
.tile { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 6px; }
.tk { font-size: 13px; color: var(--muted); } .tv { font-size: 21px; font-weight: 800; }
.xpbreak { margin-bottom: 8px; }

/* pages */
.page h2 { margin: 4px 0 12px; }
.ptop { display: flex; align-items: center; gap: 8px; } .ptop h2 { margin: 4px 0; }
.back { border: 0; background: none; color: var(--blue); font-size: 16px; min-height: 44px; padding: 0 6px 0 0; cursor: pointer; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 12px 0; }
.ctop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.badge { background: var(--acc-soft); color: var(--acc-d); font-weight: 800; font-size: 13px; padding: 1px 10px; border-radius: 99px; white-space: nowrap; }
.badge.red { background: var(--red-soft); color: var(--red); }
.tagrow { display: grid; grid-template-columns: minmax(0, 1.2fr) 1fr 44px; gap: 8px; align-items: center; width: 100%; min-height: 48px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; padding: 0; }
.tname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.tbar { display: block; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--acc); border-radius: 99px; }
.tbar.wide { height: 12px; margin-top: 3px; }
.tpct { font-size: 13px; text-align: right; font-weight: 700; }
.ubar { margin: 10px 0; } .ulabel { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 10px 0 6px; }
.hm { aspect-ratio: 1; border-radius: 8px; background: var(--line); position: relative; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.hm i { position: absolute; top: -2px; right: -2px; font-style: normal; font-size: 11px; }
.hm.l1 { background: color-mix(in srgb, var(--acc) 30%, var(--line)); } .hm.l2 { background: color-mix(in srgb, var(--acc) 55%, var(--line)); }
.hm.l3 { background: color-mix(in srgb, var(--acc) 80%, var(--line)); color: #fff; } .hm.l4 { background: var(--acc-d); color: #fff; }
.hm.today { outline: 2px solid var(--blue); }
.topmiss { padding: 10px 0; border-bottom: 1px solid var(--line); }
.tmq { display: flex; gap: 8px; font-weight: 600; font-size: 15px; }
.rank { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--red-soft); color: var(--red); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.miss .mq { font-weight: 600; margin: 6px 0; }
.mexp { padding: 8px 10px; border-radius: 10px; background: var(--bg); font-size: 14px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
.seg button { min-height: 46px; border-radius: 12px; border: 2px solid var(--chip-b); background: var(--chip); font-weight: 700; cursor: pointer; font-size: 14px; }
.seg button.on { border-color: var(--acc); background: var(--acc-soft); color: var(--acc-d); }
.chk { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.chk input { width: 22px; height: 22px; }
.fld { display: block; margin: 8px 0; } .fld span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.warn { background: #fff4d6; color: #6b4b00; border-radius: 10px; padding: 8px 10px; }
@media (prefers-color-scheme: dark) { .warn { background: #3a2f12; color: #ffd98a; } .pill.gold { background: #3a2f12; color: #ffd98a; } }
.katex-display { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
#probe { display: none; }

/* ---------- hub / shared extras ---------- */
.hs.moon { border: 0; background: none; font-size: 20px; min-width: 40px; min-height: 40px; padding: 0; cursor: pointer; }
#top .cswitch { flex: 1 1 auto; min-width: 0; max-width: none; }
#top .hstats { flex: none; gap: 6px; }
#focusbar { display: none; }
#focusbar.show { display: flex; position: sticky; top: calc(57px + var(--sa-t)); z-index: 4; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 14px; background: var(--acc-soft); font-size: 14px; font-weight: 700; }
#focusbar button { border: 1px solid var(--chip-b); background: var(--card); border-radius: 10px; min-height: 36px; padding: 0 10px; cursor: pointer; }
body.insession #focusbar { display: none; }
.cchips { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 10px; padding-bottom: 2px; scrollbar-width: none; }
.cchips button { flex: none; min-height: 40px; padding: 0 14px; border-radius: 99px; border: 2px solid var(--chip-b); background: var(--chip); font-weight: 700; font-size: 14px; cursor: pointer; }
.cchips button.on { border-color: var(--acc); background: var(--acc-soft); color: var(--acc-d); }
.row2.slim { margin-bottom: 10px; } .row2.slim .btn { min-height: 42px; font-size: 14px; margin-top: 0; }
.cbadge { background: var(--line); color: var(--fg); border-radius: 99px; padding: 0 8px; font-size: 12px; font-weight: 700; }
.pill.red { background: var(--red-soft); color: var(--red); }
.card.hl { border: 2px solid var(--acc); }
.crow.big { width: 100%; background: var(--card); cursor: pointer; font: inherit; font-weight: 700; min-height: 60px; }
.wlink { border: 0; background: none; color: var(--blue); font-weight: 700; padding: 6px 0; min-height: 36px; cursor: pointer; font-size: 13px; }
/* today */
.hello { display: flex; justify-content: space-between; align-items: center; }
.hello h2 { margin: 2px 0 8px; font-size: 24px; }
.ddays { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 6px 0 12px; }
.dd { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 4px; text-align: center; min-width: 0; }
.ddn { font-weight: 900; font-size: 18px; color: var(--red); }
.ddc { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ddd { font-size: 11px; }
.tbd { display: block; font-size: 10px; color: var(--gold); font-weight: 800; }
.btn.go { flex-direction: column; min-height: 78px; font-size: 20px; }
.btn.go small { font-size: 13px; font-weight: 600; opacity: .9; }
.split { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
.sp { border: 0; background: none; display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 4px 0; min-width: 0; }
.spn { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.btn.bedbtn { background: #2b2118; color: #e6c48f; border-color: #3d2f22; }
.tiles.three { grid-template-columns: repeat(3, 1fr); }
ol.check { padding-left: 20px; margin: 8px 0; font-size: 14px; } ol.check li { margin: 6px 0; }
.wrow, .erow { display: grid; grid-template-columns: 1fr 90px 44px; gap: 8px; align-items: center; margin: 6px 0; font-size: 14px; }
.erow { grid-template-columns: 1fr 150px 64px; }
.wrow .inp, .erow .inp { min-height: 42px; padding: 6px 8px; min-width: 0; }
.seg.five { grid-template-columns: repeat(5, 1fr); }
/* wiki viewer */
#wiki { display: none; position: fixed; inset: 0; z-index: 25; background: var(--bg); flex-direction: column; }
#wiki.show { display: flex; }
#wiki iframe { flex: 1; width: 100%; border: 0; background: var(--card); }
.wbar { display: flex; align-items: center; gap: 8px; padding: calc(4px + var(--sa-t)) 8px 4px; border-bottom: 1px solid var(--line); background: var(--card); min-height: 48px; }
.wback { border: 0; background: none; color: var(--blue); font-weight: 700; min-height: 44px; padding: 0 8px; cursor: pointer; font-size: 16px; }
.wtitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 700; }
.wext { min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 20px; }
.woff { background: var(--red-soft); color: var(--red); padding: 10px 12px; font-size: 14px; border-radius: 10px; margin: 8px; }
/* ---------- bed mode: warm, dim, no pure white ---------- */
body.bed {
  --bg: #0a0705; --card: #140e0a; --fg: #c79a5e; --muted: #7a6142; --line: #2a1f16;
  --acc: #9c6a2a; --acc-d: #7a521f; --acc-soft: #20170e; --red: #a8553f; --red-soft: #24130d;
  --gold: #a87c2c; --blue: #b08447; --chip: #120c08; --chip-b: #33261a; --shadow: none;
  font-size: 19px; color-scheme: dark;
}
body.bed .btn.primary, body.bed .btn.danger, body.bed .node.done > span, body.bed .node.rec > span, body.bed .uhead { color: #120c08; }
body.bed .q { font-size: 23px; }
body.bed .choice, body.bed .chip, body.bed .mitem { font-size: 18px; }
body.bed code { background: #241a12; }
body.bed .lesson { justify-content: flex-end; }
body.bed .qbody { flex: 0 1 auto; margin-top: auto; }
body.bed #toast { background: #20170e; color: var(--fg); }
body.bed .prof { background: #2a1d0c; color: #b8893a; }
body.bed .warn { background: #241a0f; color: var(--fg); }
.bedwrap { display: flex; flex-direction: column; min-height: calc(100vh - 24px - var(--sa-t) - var(--sa-b)); padding-top: var(--sa-t); }
.bedtop { text-align: center; padding-top: 6vh; }
.bclock { font-size: 64px; font-weight: 300; letter-spacing: 2px; line-height: 1.1; }
.bedctl { margin-top: auto; padding-bottom: calc(6px + var(--sa-b)); }
.btn.tall { min-height: 76px; font-size: 18px; }
.card-flow .cftop { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; }
.cfbody { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 14px 4px; }
.cfq { font-size: 24px; font-weight: 700; line-height: 1.5; margin-bottom: 10px; }
.cflist { padding-left: 24px; margin: 4px 0; } .cflist li { margin: 4px 0; }
.cfback { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.cfans { font-size: 22px; margin-bottom: 8px; } .cfans b { color: var(--acc); margin-right: 6px; }
.cfexp { font-size: 17px; color: var(--muted); margin-bottom: 6px; }
.cfbar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
.cfbar i { display: block; height: 100%; width: 0; background: var(--acc); }
.cfrow { display: grid; grid-template-columns: 1fr 76px 1fr; gap: 10px; }
.cfb { min-height: 84px; border-radius: 18px; border: 2px solid var(--chip-b); background: var(--chip); font-size: 20px; font-weight: 800; cursor: pointer; color: var(--fg); }
.cfb.no { border-color: var(--red); color: var(--red); } .cfb.yes { border-color: var(--acc); color: var(--acc); }
.cfb.pp { font-size: 26px; }
.sleep { animation: dusk 2.5s ease-out both; }
.moonbig { font-size: 72px; filter: saturate(.5) brightness(.8); }
@keyframes dusk { from { opacity: 0; } to { opacity: 1; } }
body.sleeping { --fg: #8a6a40; --muted: #5a4630; }

/* ---------- 탭만으로 풀기 + mouse friendliness ---------- */
.modechip { margin-left: auto; border: 1px solid var(--chip-b); background: var(--chip); color: var(--fg); border-radius: 99px; min-height: 36px; padding: 0 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
.selfans { background: var(--card); border: 2px solid var(--acc); border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; font-size: 18px; }
.selfans b { color: var(--acc-d); }
.selfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.selfrow .btn { min-height: 64px; font-size: 18px; }
.lfoot .row2.slim { margin-bottom: 4px; }
.lfoot .row2.slim .btn { min-height: 44px; margin-top: 0; font-size: 14px; }
.seg.two { grid-template-columns: 1fr 1fr; }
body.bed .selfans b { color: var(--acc); }
@media (hover: hover) and (pointer: fine) {
  .choice:hover:not(:disabled), .tf:hover:not(:disabled), .mitem:hover:not(:disabled), .chip:hover:not(:disabled), .slot:hover,
  .seg button:hover, .cchips button:hover, .crow:hover, .modechip:hover, .cfb:hover { border-color: var(--blue); }
  .btn:hover:not(:disabled), .node:hover, .duecard:hover, .tagrow:hover, .sp:hover { filter: brightness(1.06); }
  body.bed .btn:hover:not(:disabled), body.bed .cfb:hover { filter: brightness(1.25); }
  .x:hover, .link:hover, .back:hover, .wlink:hover, .wback:hover { text-decoration: underline; }
}

/* ---------- question images ---------- */
.qimg { position: relative; margin: 4px 0 12px; border-radius: 12px; background: #f4f4f1; border: 1px solid var(--line); padding: 6px; text-align: center; }
.qimg img { display: block; margin: 0 auto; max-width: 100%; max-height: 42vh; object-fit: contain; border-radius: 8px; cursor: zoom-in; }
.qimg .zoomhint { position: absolute; right: 8px; bottom: 8px; font-size: 14px; background: rgba(0,0,0,.45); color: #f5f5f5; border-radius: 99px; padding: 1px 7px; pointer-events: none; }
.qimg.exp { margin: 6px 0 10px; }
.qimg.exp img { max-height: 32vh; }
.qimg.thumb { display: inline-block; padding: 3px; margin: 0 0 8px; }
.qimg.thumb img { max-height: 18vh; }
.qimg.broken { background: var(--card); }
.imgalt { padding: 14px 10px; font-size: 14px; color: var(--muted); text-align: left; }
@media (prefers-color-scheme: dark) { .qimg { background: #e9e9e4; border-color: transparent; } .qimg img { filter: brightness(.92); } }
body.bed .qimg { background: #c9c2b4; border-color: transparent; }
body.bed .qimg img { max-height: 35vh; filter: brightness(.8) sepia(.25); }
body.bed .qimg.thumb img { max-height: 16vh; }
body.bed .qimg.broken { background: var(--card); }
.cfbody .qimg { margin-bottom: 10px; }
#zoom { position: fixed; inset: 0; z-index: 60; background: rgba(8,8,8,.94); display: flex; flex-direction: column; }
#zoom .zbar { display: flex; align-items: center; gap: 8px; padding: calc(6px + var(--sa-t)) 10px 6px; color: #ddd; }
#zoom .zalt { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#zoom .zbtn { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #555; background: #222; color: #eee; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
#zoom .zwrap { flex: 1; overflow: auto; touch-action: pinch-zoom pan-x pan-y; -webkit-overflow-scrolling: touch; padding: 8px; }
#zoom .zwrap img { display: block; max-width: none; margin: 0 auto; background: #f4f4f1; border-radius: 6px; }
#zoom.fit .zwrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
body.bed #zoom .zwrap img { filter: brightness(.8) sepia(.25); background: #c9c2b4; }
.sheet { -webkit-overflow-scrolling: touch; }

/* ---------- 📖 intro cards ---------- */
#intro { position: fixed; inset: 0; z-index: 50; max-width: 560px; margin: 0 auto; background: var(--bg); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: calc(8px + var(--sa-t)) 14px calc(10px + var(--sa-b)); }
#intro .ibar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#intro .ititle { font-size: 14px; font-weight: 800; color: var(--acc-d); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#intro .iskip { flex: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; min-height: 44px; padding: 0 6px; cursor: pointer; text-decoration: underline; }
#intro .idots { display: flex; align-items: center; gap: 6px; }
#intro .idots i { width: 8px; height: 8px; border-radius: 99px; background: var(--line); transition: width .2s; }
#intro .idots i.past { background: var(--acc-soft); border: 1px solid var(--acc); }
#intro .idots i.on { width: 22px; background: var(--acc); }
#intro .idots span { margin-left: auto; }
#intro .icard { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
#intro .icard h3 { margin: 4px 0 8px; font-size: 22px; }
#intro .ibody { font-size: 17px; line-height: 1.7; }
#intro .inav { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; background: var(--bg); padding-top: 4px; }
#intro .inav .btn { margin-top: 0; min-height: 56px; }
.qimg.intro img { max-height: 38vh; }
body.bed #intro .ititle { color: var(--acc); }
body.bed #intro .ibody { font-size: 19px; }
@media (prefers-color-scheme: dark) { #intro .ititle { color: var(--acc); } }
.nintro { position: absolute; left: -20px; top: 16px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
.cfrow.two { grid-template-columns: 76px 1fr; }
.cfexp.intro { color: var(--fg); font-size: 18px; line-height: 1.65; }
@media (hover: hover) and (pointer: fine) { .nintro:hover, #intro .iskip:hover { border-color: var(--blue); color: var(--fg); } }

<script type="application/json" id="duo-content">[{"course":{"id":"psy","title":"심리학 기말","subtitle":"심리학으로의 여행 (심리학의 이해) · Prof. 이소영 · 마이어스 심리학개론 13판","exam":"기말 범위 7장–10장 + 1장 통계적 추리 · 형식: 중간과 동일(객관식 + 단답형 명칭 쓰기)","wiki":"../index.html"},"units":[{"id":"u7","title":"7장 사고와 언어 그리고 지능","desc":"개념·문제 해결 · 발견법 · 창의성 · 언어 · 지능 이론 · 지능 검사","lessons":[{"id":"u7a","title":"개념과 문제 해결","intro":[{"title":"개념과 원형","body":"**개념**(concept) = 유사한 대상·사건·아이디어에 대한 **심적 집단**(수학으로 치면 집합). 덕분에 사고가 단순해진다.\n**원형**(prototype) = 그 개념의 **최선의 본보기**(예: 의자 = 다리 4개 + 앉는 판 + 등받이). 로시(Rosch, 1978): 범주 안에서 원형을 발달시켜 개념을 형성한다.","src":"7장 p.2–3"},{"title":"범주화 지각","body":"입력된 데이터를 **범주로 분리**하려는 **선천적 편향성**. 백인–동양인 얼굴을 비율로 합성하면 70% 얼굴도 90%처럼 한쪽 범주로 판단한다(Huart et al., 2005). 원형에서 멀수록 경계는 **모호**해진다(고래, 토마토).","src":"7장 p.3","img":"img/psy7-p3-faces.png","imgAlt":"백인 90~60%, 동양인 60~90% 비율로 합성한 얼굴 8장"},{"title":"알고리즘 vs 발견법","body":"**알고리즘** = 단계적 절차, 해결을 **보장**하지만 느리고 인지 자원이 많이 든다(성냥개비 배치를 하나씩 다 대 보기).\n**발견법**(heuristics, 어림법) = 효율적인 **사고의 지름길**, 빠르지만 **오류 위험**이 있다.","src":"7장 p.4, 6"},{"title":"통찰과 문제 해결의 장애물","body":"**통찰** = 해결책을 **갑작스레** 깨닫는 '아하!'. 직전엔 전두엽, 직후엔 우반구 측두엽 활동 증가(Kounios & Beeman).\n**확증 편향** = 지지 증거만 찾기 → **고착**(새 각도에서 못 봄) → 대표 형태가 **마음 갖춤새**(예전에 통한 방식만 고수).","src":"7장 p.5"}],"items":[{"id":"u7a-01","type":"sa","q":"유사한 대상·사건·아이디어 등에 대한 **심적 집단(mental grouping)**. 덕분에 사고가 크게 단순화된다 — 명칭을 쓰시오.","answer":"개념","alts":["Concept","개념(Concept)"],"explain":"**개념 (Concept)** — '공을 던진다' 한마디로 수많은 공·동작을 한 번에 가리킨다. 교수: 수학으로 치면 '집합'","src":"7장 p.2","wiki":"개념","explainImg":"img/psy7-p2-slide.jpg"},{"id":"u7a-02","type":"sa","q":"어떤 개념의 **최선의 본보기**(가장 전형적·평균에 가까운 사례). 예: 의자 = 다리 4개 + 앉는 판 + 등받이 — 명칭을 쓰시오.","answer":"원형","alts":["Prototype","원형(Prototype)"],"explain":"**원형 (Prototype)** — 그러나 빈백·등받이 없는 의자처럼 원형이 범주 전체를 설명하지는 못한다","src":"7장 p.2","wiki":"원형","explainImg":"img/psy7-p2-slide.jpg"},{"id":"u7a-03","type":"match","q":"용어와 설명을 연결하시오","explain":"개념은 집합, 원형은 그 집합의 대표 원소다. 알고리즘(정확·느림)과 발견법(빠름·오류)은 정확 vs 효율 축의 양 끝이다.","src":"7장 p.2–6","wiki":"개념","pairs":[["개념","유사한 대상·사건에 대한 심적 집단"],["원형","개념의 최선의 본보기"],["알고리즘","단계적 절차, 해결을 보장하지만 느림"],["통찰","해결책을 갑작스레 깨닫는 '아하!'"],["발견법","빠르지만 오류 위험이 있는 사고의 지름길"]],"explainImg":"img/psy7-p2-slide.jpg"},{"id":"u7a-04","type":"mc","q":"어떤 개념의 **최선의 본보기**, 즉 가장 전형적인 사례를 가리키는 용어는?","choices":["개념","범주화 지각","마음 갖춤새","원형"],"answer":3,"explain":"개념은 '집합', 원형은 그 집합의 '대표 원소'로 구분한다. 개념 안의 최선의 본보기 = 원형(prototype). 교수 예: 의자 = 다리 4개 + 판 + 등받이. (오답 ① 개념: 개념은 유사한 대상들의 **심적 집단** 자체이지 그 안의 대표 사례가 아니다.)","src":"7장 p.2","diff":1,"wiki":"원형","explainImg":"img/psy7-p2-slide.jpg"},{"id":"u7a-05","type":"sa","q":"입력된 데이터를 일련의 **범주로 분리**하려는 **선천적 편향성**. 합성 얼굴 70%도 90%처럼 한쪽 범주로 판단 — 명칭을 쓰시오.","answer":"범주화 지각","alts":["Categorical perception","범주화 지각(Categorical perception)"],"explain":"**범주화 지각 (Categorical perception)** — 원형에서 멀수록 경계가 모호(고래·토마토)","src":"7장 p.3","wiki":"범주화 지각","explainImg":"img/psy7-p3-slide.jpg"},{"id":"u7a-06","type":"mc","q":"백인–아시아인 얼굴을 비율로 합성한 실험에서, 70% 합성 얼굴도 90% 얼굴과 비슷하게 한쪽 범주로 판단되었다. 이 현상을 설명하는 개념은?","choices":["범주화 지각","확증 편향","가용성 발견법","고착"],"answer":0,"explain":"교수는 p.3 그림을 '90%는 당연히, 70%도 시간이 조금 더 걸릴 뿐 비슷하게 응답'으로 설명했다. 입력을 범주로 분리하려는 선천적 편향 — 판단이 원형 쪽으로 쏠린다(교수 설명 그대로). (오답 ② 확증 편향: 자기 생각을 지지하는 증거만 찾는 경향으로, 지각 범주와 무관하다.)","src":"7장 p.3","diff":2,"prof":true,"wiki":"범주화 지각","explainImg":"img/psy7-p3-slide.jpg"},{"id":"u7a-07","type":"sa","q":"범주 안에서 특정 심상·최선의 본보기(원형)를 발달시켜 개념을 형성한다고 본 학자 (1978) — 이 연구자(학자)는?","answer":"로시","alts":["Rosch","로시(Rosch)"],"explain":"**로시 (Rosch, 1978)** — 범주 안에서 특정 심상·최선의 본보기(원형)를 발달시켜 개념을 형성한다고 본 학자 (1978)","src":"7장 p.3","wiki":"원형","explainImg":"img/psy7-p3-slide.jpg"},{"id":"u7a-08","type":"tf","q":"범주화 지각에서는 원형에서 멀어질수록 범주의 경계가 더 뚜렷해진다.","explain":"반대다. 원형에서 멀수록 경계가 **모호**해진다(고래는 물고기? 토마토는 과일?). 원형에 가까울수록 빠르고 확실하게 판단한다.","src":"7장 p.3","wiki":"범주화 지각","answer":false,"explainImg":"img/psy7-p3-slide.jpg"},{"id":"u7a-09","type":"mc","q":"성냥개비 6개로 삼각형 4개를 만드는 퀴즈를, 가능한 배치를 하나씩 모두 대 보며 풀었다. 어떤 전략인가?","choices":["통찰","알고리즘","발견법","틀만들기"],"answer":1,"explain":"'하나씩 다 시도' = 알고리즘의 표지어. 가능한 경우를 단계적으로 다 시도 → 언젠가 반드시 답(삼각뿔)이 나온다. 교수가 든 예 그대로. (오답 ① 통찰: 통찰은 '아하!' 하고 **갑자기** 깨닫는 것이다.)","src":"7장 p.4","diff":1,"prof":true,"wiki":"알고리즘","explainImg":"img/psy7-p4-slide.jpg"},{"id":"u7a-10","type":"mc","q":"문제 해결 전략 중 **알고리즘**에 대한 설명으로 옳지 **않은** 것은?","choices":["해결책을 보장한다","단계적으로 처리하는 문제 해결 과정이다","발견법보다 빠르고 인지적 자원 소모가 적다","시행착오를 최소화한다"],"answer":2,"explain":"알고리즘 = 정확한 사고(보장·느림·자원 많이), 발견법 = 효율적 사고(빠름·오류·자원 적게). 반대다. 알고리즘은 단계적이라 **느리고** 자원 소모가 **크다**. 빠르고 자원이 적게 드는 것은 발견법. (오답 ① 해결책을 보장한다: 옳다 — 알고리즘의 장점.)","src":"7장 p.4","diff":1,"wiki":"알고리즘","explainImg":"img/psy7-p4-slide.jpg"},{"id":"u7a-11","type":"sa","q":"문제의 해결책을 **갑작스레 깨닫는** '아하!' 경험을 무엇이라 하는가?","answer":"통찰","alts":["insight","통찰(insight)"],"explain":"**통찰** — 직전 전두엽, 직후 우반구 측두엽 활동 증가(Kounios & Beeman). 단점: 발생하지 않을 수 있음.","src":"7장 p.5","diff":1,"wiki":"통찰","explainImg":"img/psy7-p5-slide.jpg"},{"id":"u7a-12","type":"mc","q":"Kounios & Beeman(2014)이 보고한 **통찰**의 신경 활동으로 옳은 것은?","choices":["직전에는 우반구 측두엽, 직후에는 전두엽 활동이 증가한다","직전에는 전두엽, 해결 직후에는 우반구 측두엽 활동이 증가한다","직전에는 좌반구 측두엽, 직후에는 후두엽 활동이 증가한다","직전에는 편도체, 직후에는 해마 활동이 증가한다"],"answer":1,"explain":"통찰: '전두엽(주의) → 우반구 측두엽(깨달음)' 순서로 외운다. 슬라이드 그대로 — 직전 주의 관련 전두엽, 직후 우반구 측두엽 급증. (오답 ① 직전에는 우반구 측두엽, 직후에는 전두엽 활동이 증가한다: 순서를 뒤바꾼 함정이다.)","src":"7장 p.5","diff":2,"wiki":"통찰","explainImg":"img/psy7-p5-slide.jpg"},{"id":"u7a-13","type":"sa","q":"과거에 통했던 방식으로만 문제에 접근하려는 경향 (고착의 대표 형태, 4장 지각 갖춤새와 연결) — 명칭을 쓰시오.","answer":"마음 갖춤새","alts":["mental set","마음 갖춤새(mental set)"],"explain":"**마음 갖춤새 (mental set)** — 틀만들기도 마음 갖춤새를 형성해 사고를 유도한다(p.12)","src":"7장 p.5, 12","wiki":"고착","explainImg":"img/psy7-p5-slide.jpg"},{"id":"u7a-14","type":"cloze","q":"확증 편향이 이어지면 새로운 각도에서 문제를 보지 못하는 ___ 상태가 되고, 그 대표 형태가 과거에 통한 방식으로만 접근하는 ___ 이다.","explain":"고착(fixation)은 새 관점을 못 여는 상태, 마음 갖춤새(mental set)는 그 대표 형태다. 통찰은 고착을 깬 결과다.","src":"7장 p.5","wiki":"고착","answer":["고착","마음 갖춤새"],"bank":["고착","마음 갖춤새","통찰","원형","넛지"],"explainImg":"img/psy7-p5-slide.jpg"},{"id":"u7a-15","type":"sa","q":"판단과 문제 해결을 **효율적**으로 만드는 **간단한 사고 방략**(사고의 지름길). 다른 이름: 어림법·추단법 — 명칭을 쓰시오.","answer":"발견법","alts":["Heuristics","발견법(Heuristics)"],"explain":"**발견법 (Heuristics)** — 신속하지만 실수 가능성 높음, 인지 자원 절약. 알고리즘과 혼용 가능","src":"7장 p.6","wiki":"발견법","explainImg":"img/psy7-p6-slide.jpg"},{"id":"u7a-16","type":"tf","q":"알고리즘은 발견법보다 빠르지만 오류 위험이 더 높다.","explain":"반대다. 알고리즘은 **느리지만 해결을 보장**하고, 발견법이 **빠르지만 오류 위험**이 높다(인지 자원: 알고리즘 많이, 발견법 적게).","src":"7장 p.4, 6, 21","wiki":"알고리즘","answer":false,"explainImg":"img/psy7-p6-slide.jpg"},{"id":"u7a-17","type":"tf","q":"그림처럼 백인–동양인 얼굴을 비율로 합성해 보여 주면, 사람들은 70% 합성 얼굴을 대체로 별도의 '중간 범주'로 분류한다.","explain":"아니다. 70% 얼굴도 90% 얼굴과 비슷하게 **한쪽 범주**로 판단한다(시간이 조금 더 걸릴 뿐). 입력을 범주로 나누려는 선천적 편향 = **범주화 지각**.","src":"7장 p.3","wiki":"범주화 지각","answer":false,"img":"img/psy7-p3-faces.png","imgAlt":"백인 90~60%, 동양인 60~90% 비율로 합성한 얼굴 8장","explainImg":"img/psy7-p3-slide.jpg"}]},{"id":"u7b","title":"발견법과 판단의 오류","intro":[{"title":"대표성 발견법","body":"사건의 가능성을 **원형과 비교**해 어림하고 실제 비율(기저율)은 무시한다. 예: '마르고 시를 즐겨 읽는 사람'을 트럭 운전수보다 영문학 교수라고 판단(실제는 교수 400명 vs 운전수 350만 명).","src":"7장 p.7"},{"title":"가용성 발견법","body":"**기억에서 쉽게 떠오를수록**(선명성·최신성·차별성) 그 사건의 가능성을 높게 추정. 예: 비행기 사고 보도 뒤 더 위험한 자동차를 택함. 두 발견법의 공통 뿌리 = **인지적 구두쇠**(효율을 위해 직관적 지름길로 생각하는 특성).","src":"7장 p.8–9"},{"title":"과신·계획 오류·신념 집착","body":"**과신** = 자기 판단의 정확성을 과대 추정(예: 1차 대전 독일의 '6개월 만에 프랑스 항복' 계획). **계획 오류** = 일이 걸릴 시간을 과소 추정.\n**신념 집착** = 생각의 토대가 반박돼도 매달림 → 대처는 **반대편 주장 고려**. 확증 편향은 증거를 **찾는 단계**의 편향.","src":"7장 p.10–11"},{"title":"틀만들기와 넛지","body":"**틀만들기**(framing) = 논제를 제기하는 방식에 따라 결정이 달라진다('생존율 90%' vs '사망률 10%', 장기 기증 기본값). **넛지** = 틀만들기로 특정 방향의 선택을 **유도**하는 것.","src":"7장 p.12–13"}],"items":[{"id":"u7b-01","type":"sa","q":"사건의 가능성을 **원형과 비교**해 어림 — 실제 통계적 분포(기저율)와 무관하게 과대 추정 — 명칭을 쓰시오.","answer":"대표성 발견법","alts":["Representative Heuristic","대표성 발견법(Representative Heuristic)"],"explain":"**대표성 발견법 (Representative Heuristic)** — 시 읽는 마른 사람 → 영문학 교수? (교수 400 vs 트럭 운전수 350만)","src":"7장 p.7","wiki":"대표성 발견법","explainImg":"img/psy7-p7-slide.jpg"},{"id":"u7b-02","type":"sa","q":"선명성·최신성·차별성 때문에 **기억에서 접근이 쉬울수록** 그 사건의 가능성을 높게 추정 — 명칭을 쓰시오.","answer":"가용성 발견법","alts":["Availability Heuristic","가용성 발견법(Availability Heuristic)"],"explain":"**가용성 발견법 (Availability Heuristic)** — 비행기 사고·범죄 보도 → 과도한 공포. 1장 '강력한 사례의 가용성'과 같은 내용","src":"7장 p.8","wiki":"발견법","explainImg":"img/psy7-p8-slide.jpg"},{"id":"u7b-03","type":"mc","q":"'키 작고 마르고 시를 즐겨 읽는 사람'을 보고 트럭 운전수보다 영문학 교수일 가능성이 높다고 판단했다(실제 인원은 영문학 교수 400명 vs 트럭 운전수 350만 명). 어떤 판단 오류인가?","choices":["가용성 발견법","신념 집착","과신","대표성 발견법"],"answer":3,"explain":"'…처럼 보여서/전형적이라서' → 대표성. 교수도 400명 vs 350만 명 수치를 그대로 인용했다. 원형(전형적인 교수 이미지)과 비교해 판단하면서 **기저율**(실제 비율)을 무시했다. (오답 ① 가용성 발견법: 기억에서 쉽게 떠오르는 사례에 근거한 판단이 아니다.)","src":"7장 p.7","diff":1,"prof":true,"wiki":"대표성 발견법","explainImg":"img/psy7-p7-slide.jpg"},{"id":"u7b-04","type":"mc","q":"비행기 추락 사고가 연일 보도된 뒤 많은 사람이 비행기 대신 통계적으로 더 위험한 자동차를 택했다. 이를 가장 잘 설명하는 것은?","choices":["가용성 발견법","대표성 발견법","틀만들기","고착"],"answer":0,"explain":"'뉴스에서 봤다/쉽게 떠오른다' → 가용성. 1장 '강력한 사례의 가용성'과 같은 내용. 선명·최근 사례가 기억에서 쉽게 떠올라 위험을 과대 평가 → 과도한 공포. (오답 ② 대표성 발견법: 원형과의 유사성 비교가 아니다.)","src":"7장 p.8","diff":1,"prof":true,"wiki":"발견법","explainImg":"img/psy7-p8-slide.jpg"},{"id":"u7b-05","type":"cloze","q":"'…처럼 보여서, 전형적이라서'는 ___ 발견법, '최근 뉴스에서 봐서 쉽게 떠오른다'는 ___ 발견법이다.","explain":"대표성 = 원형과 비교(기저율 무시), 가용성 = 기억 접근 용이성(선명성·최신성·차별성). 판별 요령 그대로다.","src":"7장 p.7–9","wiki":"대표성 발견법","answer":["대표성","가용성"],"bank":["대표성","가용성","확증","틀만들기"],"explainImg":"img/psy7-p7-slide.jpg"},{"id":"u7b-06","type":"sa","q":"효율을 추구해 직관적 지름길로 생각하는 인간의 특성으로, 대표성·가용성 발견법의 공통 뿌리로 제시된 명칭을 쓰시오.","answer":"인지적 구두쇠","alts":["cognitive miser","인지적구두쇠"],"explain":"**인지적 구두쇠(Cognitive Miser)** — 교수: 「여러 번 이제 소개를 했듯이」.","src":"7장 p.9","diff":2,"prof":true,"wiki":"인지적 구두쇠","explainImg":"img/psy7-p9-slide.jpg"},{"id":"u7b-07","type":"mc","q":"대표성 발견법과 가용성 발견법의 **공통점**으로 옳지 **않은** 것은?","choices":["사건의 가능성을 평가하는 방식이다","직관을 활용한 자동적이고 빠른 사고다","인지적 구두쇠의 산물이다","단계적 절차를 따르므로 해결을 보장한다"],"answer":3,"explain":"p.9: 공통 = 가능성 평가·직관·자동적·빠름·인지적 구두쇠. 그것은 알고리즘의 특징이다. 두 발견법은 빠르지만 오류 위험이 있다. (오답 ① 사건의 가능성을 평가하는 방식이다: 옳다 — p.9 공통점.)","src":"7장 p.9","diff":2,"prof":true,"wiki":"대표성 발견법","explainImg":"img/psy7-p9-slide.jpg"},{"id":"u7b-08","type":"mc","q":"1차 세계대전 때 독일 제국은 '프랑스를 6개월 만에 항복시키고 러시아로 군을 돌린다'는 계획을 믿었다가 패전했다. 이 사례가 보여 주는 판단의 오류는?","choices":["신념 집착","틀만들기","과신","확증 편향"],"answer":2,"explain":"교수가 슐리펜 계획 내용을 자세히 설명했다(37:47–40:34). 국가 단위 과신의 위험 — 실제 역량과 믿음의 괴리(슐리펜 계획). (오답 ① 신념 집착: 반박 증거 후에도 신념을 유지하는 것으로, 슬라이드는 이 사례를 과신에 배치했다.)","src":"7장 p.10","diff":1,"prof":true,"wiki":"과신","explainImg":"img/psy7-p10-slide.jpg"},{"id":"u7b-09","type":"sa","q":"과신이 일정에서 나타난 것 — 일이 걸릴 시간을 **과소 추정** — 명칭을 쓰시오.","answer":"계획 오류","alts":["planning fallacy","계획 오류(planning fallacy)"],"explain":"**계획 오류 (planning fallacy)** — 과신이 일정에서 나타난 것 — 일이 걸릴 시간을 **과소 추정**","src":"7장 p.10","wiki":"과신","explainImg":"img/psy7-p10-slide.jpg"},{"id":"u7b-10","type":"match","q":"용어와 설명을 연결하시오","explain":"계획 오류는 과신이 일정에서 나타난 것이다. 틀만들기는 같은 내용도 묻는 방식(생존율 90% vs 사망률 10%)에 따라 결정이 달라지는 것이다.","src":"7장 p.7–12","wiki":"발견법","pairs":[["대표성 발견법","원형과 비교해 가능성 어림"],["가용성 발견법","기억에서 잘 떠오를수록 가능성 높게 추정"],["과신","자신의 판단 정확성을 과대 추정"],["계획 오류","일이 걸릴 시간을 과소 추정"],["틀만들기","논제를 제기하는 방식이 결정을 바꿈"]],"explainImg":"img/psy7-p7-slide.jpg"},{"id":"u7b-11","type":"sa","q":"자기 생각의 토대가 잘못되었음이 판명되어도 그 생각에 매달리는 경향을 쓰시오.","answer":"신념 집착","alts":["belief perseverance","신념집착"],"explain":"**신념 집착** — 대처는 반대편 주장 고려(Catapano). 교수: 확증 편향과 거의 같음.","src":"7장 p.11","diff":1,"prof":true,"wiki":"신념 집착","explainImg":"img/psy7-p11-slide.jpg"},{"id":"u7b-12","type":"tf","q":"신념 집착에 대처하는 가장 적절한 방법은 반대편 주장을 고려하는 것이다.","explain":"슬라이드 p.11: 신념 집착(토대가 반박돼도 생각에 매달림)의 대처 = **반대편 주장 고려**.","src":"7장 p.11","wiki":"신념 집착","answer":true,"explainImg":"img/psy7-p11-slide.jpg"},{"id":"u7b-13","type":"tf","q":"확증 편향은 신념이 반박된 뒤에도 그 신념을 유지하는 경향을 말한다.","explain":"그건 **신념 집착**이다. 확증 편향은 증거를 **찾는 단계**에서 지지 증거만 모으는 것이다(교수는 둘이 「거의 같은 것」이라고도 했지만 정의는 구분).","src":"7장 p.5, 11, 22","wiki":"확증 편향","answer":false,"explainImg":"img/psy7-p11-slide.jpg"},{"id":"u7b-14","type":"mc","q":"장기 기증 의사를 묻는 설문의 **기본 응답(default)** 을 '원한다'로 두느냐 '원하지 않는다'로 두느냐에 따라 기증 비율이 달라졌다. 이 현상은?","choices":["틀만들기","대표성 발견법","가용성 발견법","확증 편향"],"answer":0,"explain":"교수: 「사람들이 의사결정을 잘 안 바꾼다」 — 기본값이 그대로 선택된다. 같은 결정이라도 문제 제기 방식(기본값)에 따라 선택이 달라진다(Hajhosseini et al., 2013). (오답 ② 대표성 발견법: 원형 비교에 의한 확률 판단이 아니다.)","src":"7장 p.13","diff":1,"prof":true,"wiki":"틀만들기","explainImg":"img/psy7-p13-slide.jpg"},{"id":"u7b-15","type":"sa","q":"틀만들기로 마음 갖춤새를 형성해 사람들이 특정 방향으로 선택하도록 **유도**하는 것을 무엇을 가한다고 하는가?","answer":"넛지","alts":["nudge","넛지(nudge)"],"explain":"**넛지(Nudge)** — 장기 기증 기본값, 작은 술잔 등.","src":"7장 p.12","diff":2,"wiki":"틀만들기","explainImg":"img/psy7-p12-slide.jpg"},{"id":"u7b-16","type":"mc","q":"연구자가 자기 가설을 **지지하는 논문만** 골라 검색하고 반대 결과를 낸 논문은 찾아보지도 않는다. 가장 직접적인 개념은?","choices":["확증 편향","신념 집착","과신","고착"],"answer":0,"explain":"시점으로 구분: 찾는 단계 = 확증 편향, 반박 후 = 신념 집착. 증거를 **찾는 단계**에서 지지 증거만 선택적으로 수집. (오답 ② 신념 집착: 신념이 **반박된 뒤에도** 유지하는 것 — 여기서는 반박을 접하기 전 단계다.)","src":"7장 p.5, 11, 22","diff":3,"wiki":"확증 편향","explainImg":"img/psy7-p5-slide.jpg"}]},{"id":"u7c","title":"창의성과 사고 과정 비교","intro":[{"title":"창의성과 두 가지 사고","body":"**창의성** = 새롭고 가치 있는 아이디어를 생성하는 능력.\n**확산적 사고** = 다양한 해결책(전두엽 손상 시 손상) / **수렴적 사고** = 최선의 하나(대부분의 적성검사, 전두엽 손상에도 유지).","src":"7장 p.14–15"},{"title":"창의성 5요소 (Sternberg & Lubart)","body":"전·상·모·내·환: **전문성**(기반 지식) · **상상력 사고 기술**(새로운 방식으로 분석) · **모험지향적 성격** · **내재적 동기**(흥미·즐거움) · **창의적 환경**(의견 공유·소통).","src":"7장 p.16–18"},{"title":"창의성을 기르는 방법","body":"전문성 발달 · **부화시간**(한 문제에 매달리지 말고 시간을 두어 무의식적 처리가 연합을 만들게) · 명상·산책 · 다른 문화 경험. 쉬지 않고 매달리기는 해당 없음.","src":"7장 p.19–20"},{"title":"인지 과정 비교표","body":"정확한 사고 vs 효율 추구: 알고리즘(단점 시간·노력) · 발견법(오류 위험) · 통찰(발생하지 않을 수 있음) · **직관**(빠르고 자동적인 감정과 사고, 지나치게 감정적일 수 있음). 창의성의 단점 = 구조화된 관례적 작업의 방해.\n사고를 왜곡하는 요인의 장점: 확증 편향 = 지지 증거의 신속한 재인, 과신 = **쉽고 행복한 결정**.","src":"7장 p.21–22"}],"items":[{"id":"u7c-01","type":"sa","q":"**새롭고 가치 있는** 아이디어를 생성하는 능력. 예: 페니실린의 발견 — 명칭을 쓰시오.","answer":"창의성","alts":["creativity","창의성(creativity)"],"explain":"**창의성 (creativity)** — Hennessey & Amabile(2010). 지능만으로는 설명 불가(뇌 활동이 다름)","src":"7장 p.14","wiki":"창의성","explainImg":"img/psy7-p14-slide.jpg"},{"id":"u7c-02","type":"sa","q":"문제 해결의 **다양성**을 추구하는 사고. 전두엽 손상 시 손상(상상력) — 명칭을 쓰시오.","answer":"확산적 사고","alts":["divergent thinking","확산적 사고(divergent thinking)","확산 사고"],"explain":"**확산적 사고 (divergent thinking)** — 예: 벽돌의 용도 많이 대기","src":"7장 p.15","wiki":"확산적 사고와 수렴적 사고","explainImg":"img/psy7-p15-slide.jpg"},{"id":"u7c-03","type":"sa","q":"**최선의 해결책 하나**를 결정하는 사고. **대부분의 적성검사**가 요구하며 전두엽 손상 시에도 유지 — 명칭을 쓰시오.","answer":"수렴적 사고","alts":["convergent thinking","수렴적 사고(convergent thinking)","수렴 사고"],"explain":"**수렴적 사고 (convergent thinking)** — 교수: 「가장 정확한 하나의 답을 고르는 능력」","src":"7장 p.15","wiki":"확산적 사고와 수렴적 사고","explainImg":"img/psy7-p15-slide.jpg"},{"id":"u7c-04","type":"mc","q":"전두엽 손상 환자에게서 손상되지 않고 **유지**되는 사고는?","choices":["확산적 사고","상상력","수렴적 사고","새로운 해결책을 다양하게 만들어 내는 능력"],"answer":2,"explain":"확산 = 다양성(전두엽 의존), 수렴 = 최선 하나(적성검사). 전두엽 손상 시 수렴적 사고는 유지되나 상상력(확산)은 손상된다(Kolb & Whishaw). (오답 ① 확산적 사고: 전두엽 손상 시 손상되는 쪽이다.)","src":"7장 p.15","diff":2,"wiki":"확산적 사고와 수렴적 사고","explainImg":"img/psy7-p15-slide.jpg"},{"id":"u7c-05","type":"tf","q":"수렴적 사고는 전두엽이 손상되면 함께 손상된다.","explain":"전두엽 손상 시 손상되는 것은 **확산적 사고**(상상력)다. 수렴적 사고(최선의 해결책 하나)는 유지되며, 대부분의 적성검사가 요구한다.","src":"7장 p.15","wiki":"확산적 사고와 수렴적 사고","answer":false,"explainImg":"img/psy7-p15-slide.jpg"},{"id":"u7c-06","type":"sa","q":"창의성 5요소(전문성·상상력 사고 기술·모험지향적 성격·내재적 동기·창의적 환경)를 제안 — 이 연구자(학자)는?","answer":"스턴버그 & 루바트","alts":["Sternberg & Lubart","스턴버그 & 루바트(Sternberg & Lubart)","스턴버그와 루바트","스턴버그, 루바트"],"explain":"**스턴버그 & 루바트 (Sternberg & Lubart, 1991·1992)** — 스턴버그는 삼원 이론(p.35)에도 등장","src":"7장 p.16","wiki":"창의성의 구성 요소","explainImg":"img/psy7-p16-slide.jpg"},{"id":"u7c-07","type":"mc","q":"Sternberg & Lubart의 **창의성 5요소**에 포함되지 **않는** 것은?","choices":["전문성","모험지향적 성격","창의적 환경","높은 일반 지능(g)"],"answer":3,"explain":"5요소 = 전·상·모·내·환(전문성, 상상력 사고 기술, 모험지향적 성격, 내재적 동기, 창의적 환경). 5요소에 없다. 슬라이드는 오히려 창의성이 지능만으로 설명되지 않는다고 한다. (오답 ① 전문성: 5요소 — 잘 갖춰진 기반 지식.)","src":"7장 p.16","diff":1,"wiki":"창의성의 구성 요소","explainImg":"img/psy7-p16-slide.jpg"},{"id":"u7c-08","type":"match","q":"창의성 5요소와 설명을 연결하시오","explain":"Sternberg & Lubart의 5요소 = 전·상·모·내·환. 전문성은 무에서 유를 만드는 게 아니라 기반 지식이다.","src":"7장 p.16–18","wiki":"창의성의 구성 요소","pairs":[["전문성","잘 갖춰진 기반 지식"],["상상력 사고 기술","새로운 방식으로 분석(관점 변화)"],["모험지향적 성격","새 경험 추구·단호함"],["내재적 동기","흥미·즐거움"],["창의적 환경","의견 공유·소통, 토론과 지도"]],"explainImg":"img/psy7-p16-slide.jpg"},{"id":"u7c-09","type":"sa","q":"한 문제에 계속 매달리지 말고 잠시 시간을 두어 **무의식적 처리**가 연합을 형성하게 하라는 창의성 함양법의 명칭을 쓰시오.","answer":"부화시간","alts":["부화 시간","incubation","부화기"],"explain":"**부화시간(incubation)** — 교수: 고착 방지, 하룻밤 자고 레포트 다시 보기.","src":"7장 p.19","diff":1,"prof":true,"wiki":"창의성","explainImg":"img/psy7-p19-slide.jpg"},{"id":"u7c-10","type":"mc","q":"**창의성을 기르는 방법**으로 제시된 것이 **아닌** 것은?","choices":["해결될 때까지 한 문제에 쉬지 않고 매달리기","부화시간 갖기","명상이나 산책 즐기기","다른 문화와 사고 방식 경험하기"],"answer":0,"explain":"함양법 4 = 전문성 발달 · 부화시간 · 명상·산책 · 다른 문화 경험. 반대다 — 계속 매달리면 좋은 해결책이 나오지 않으므로 **부화시간**을 두라고 한다. (오답 ② 부화시간 갖기: 함양법 — 무의식적 처리로 연합 형성.)","src":"7장 p.19–20","diff":1,"wiki":"창의성","explainImg":"img/psy7-p19-slide.jpg"},{"id":"u7c-11","type":"sa","q":"인지 과정 중 '**빠르고 자동적인 감정과 사고**'로, 적용 범위가 방대하고 적응적이지만 지나치게 감정적일 수 있는 것의 명칭을 쓰시오.","answer":"직관","alts":["intuition","직관(intuition)"],"explain":"p.21 표에만 독립 항목으로 등장하는 **직관**. 알고리즘·발견법·통찰과 함께 '정확 vs 효율' 축에 놓인다.","src":"7장 p.21","diff":2,"wiki":"발견법","explainImg":"img/psy7-p21-slide.jpg"},{"id":"u7c-12","type":"mc","q":"알고리즘·발견법·통찰·직관을 비교할 때, **통찰**의 단점은?","choices":["오류의 위험성 높음","시간과 노력이 필요","지나치게 감정적일 수 있음","발생하지 않을 수 있음"],"answer":3,"explain":"p.21 단점 칸: 알고리즘 시간·노력 / 발견법 오류 / 통찰 발생 안 할 수 있음 / 직관 감정적 / 틀만들기 오도 / 창의성 관례 작업 방해. 통찰은 즉각적 해결을 주지만 언제 일어날지 보장이 없다. (오답 ① 오류의 위험성 높음: 발견법의 단점이다.)","src":"7장 p.21","diff":3,"wiki":"통찰","explainImg":"img/psy7-p21-slide.jpg"},{"id":"u7c-13","type":"mc","q":"사고를 왜곡할 수 있는 요인(확증 편향·고착·과신·신념 집착)의 장점 중 **과신**의 장점은?","choices":["지지 증거에 대한 신속한 재인","생각에 몰두","쉽고 행복한 결정","지속적인 신념을 지지"],"answer":2,"explain":"장점 칸도 객관식 함정이 된다. 슬라이드 그대로. (오답 ① 지지 증거에 대한 신속한 재인: 확증 편향의 장점이다.)","src":"7장 p.22","diff":3,"wiki":"과신","explainImg":"img/psy7-p22-slide.jpg"},{"id":"u7c-14","type":"tf","q":"창의성의 단점은 '오류 위험성이 높다'는 것이다.","explain":"창의성의 단점 = **구조화된 관례적 작업의 방해**를 받음. '오류 위험성 높음'은 발견법, '시간·노력'은 알고리즘, '발생하지 않을 수 있음'은 통찰, '지나치게 감정적'은 직관이다.","src":"7장 p.21","wiki":"창의성","answer":false,"explainImg":"img/psy7-p21-slide.jpg"},{"id":"u7c-15","type":"cloze","q":"인지 과정 비교: 알고리즘·발견법·통찰·직관은 ___ vs ___ 축에 놓이고, 확증 편향·고착·과신·신념 집착은 사고를 ___ 할 수 있는 요인이다.","explain":"교수 정리: p.21 = 정확한 사고 vs 효율 추구, p.22 = 사고를 왜곡할 수 있는 요인. 틀만들기·창의성은 사고 과정에 영향을 주는 방향이다.","src":"7장 p.21–22 🎙","wiki":"발견법","prof":true,"answer":["정확한 사고","효율 추구","왜곡"],"bank":["정확한 사고","효율 추구","왜곡","창의성","가속"],"explainImg":"img/psy7-p21-slide.jpg"},{"id":"u7c-16","type":"tf","q":"스턴버그는 창의성 5요소(Sternberg & Lubart)와 지능의 삼원 이론 두 곳에 모두 등장한다.","explain":"창의성 5요소(p.16)와 삼원 이론(p.35) 둘 다 스턴버그다. 두 이론을 섞은 보기에 주의.","src":"7장 p.16, 35","wiki":"삼원 이론","answer":true,"explainImg":"img/psy7-p16-slide.jpg"}]},{"id":"u7d","title":"언어","intro":[{"title":"언어의 구조","body":"**음소** = 소리를 구분하는 최소 단위(ㄱ, ㅏ) · **형태소** = 의미의 최소 단위(먹- + -었- + -다) · 문법 = **의미론**(소리 → 의미) + **통사론**(단어 배열 규칙) · **언어의 생산성** = 제한된 기호로 무한한 메시지.","src":"7장 p.24"},{"title":"보편 문법 (촘스키)","body":"언어마다 보편적 통사 규칙이 있다. 문법 구조 자체가 아니라 그것을 **학습할 소양**을 타고난다.","src":"7장 p.25"},{"title":"언어 발달","body":"**수용성 언어**(이해)가 먼저 → **표현성 언어**(산출): 옹알이(약 4개월, 모방 아님) → 한 단어(12개월) → 두 단어(24개월, 명사 + 동사). **결정적 시기**(= 민감 시기, 대략 7세까지): 입양아는 출생국 언어를 쉽게 다시 배우고, 성인 학습엔 모국어 억양.","src":"7장 p.26–28"},{"title":"브로카 vs 베르니케","body":"**브로카 영역** = 언어 **표현(산출)** — 손상 시 말이 끊기지만 이해·의도는 유지. **베르니케 영역** = 언어 **이해** — 손상 시 유창하지만 내용이 와해. 둘 다 **좌반구**.","src":"7장 p.29","img":"img/psy7-p29-broca.png","imgAlt":"(a) 말하기 때 브로카 영역, (b) 듣기 때 베르니케 영역 활성"},{"title":"언어와 사고","body":"**언어결정론**(사피어-워프) = 언어가 사고를 **결정**(『1984』 신어). **언어상대성** = 언어가 사고에 **영향**(약화판).","src":"7장 p.30–31"}],"items":[{"id":"u7d-01","type":"sa","q":"소리를 구분할 수 있는 **최소 단위** (예: 'ㄱ', 'ㅏ', bat의 b·a·t) — 명칭을 쓰시오.","answer":"음소","alts":["Phoneme","음소(Phoneme)"],"explain":"**음소 (Phoneme)** — 소리를 구분할 수 있는 **최소 단위** (예: 'ㄱ', 'ㅏ', bat의 b·a·t)","src":"7장 p.24","wiki":"음소","explainImg":"img/psy7-p24-slide.jpg"},{"id":"u7d-02","type":"sa","q":"**의미**를 구성하는 최소 단위 (예: 먹- + -었- + -다, re- + read + -ing) — 명칭을 쓰시오.","answer":"형태소","alts":["Morpheme","형태소(Morpheme)"],"explain":"**형태소 (Morpheme)** — **의미**를 구성하는 최소 단위 (예: 먹- + -었- + -다, re- + read + -ing)","src":"7장 p.24","wiki":"형태소","explainImg":"img/psy7-p24-slide.jpg"},{"id":"u7d-03","type":"sa","q":"문법 중 단어의 **배열**로 문장을 구성하는 규칙을 쓰시오.","answer":"통사론","alts":["syntax","통사"],"explain":"**통사론(syntax)** — 소리에서 의미를 도출하는 규칙은 의미론(semantics).","src":"7장 p.24","diff":1,"wiki":"언어의 구조","explainImg":"img/psy7-p24-slide.jpg"},{"id":"u7d-04","type":"match","q":"언어 구조 용어와 설명을 연결하시오","explain":"음소(ㄱ, ㅏ) \u003c 형태소(먹-+-었-+-다). 문법 = 의미론 + 통사론.","src":"7장 p.24","wiki":"언어의 구조","pairs":[["음소","소리를 구분하는 최소 단위"],["형태소","의미를 구성하는 최소 단위"],["의미론","소리로부터 의미를 도출하는 규칙"],["통사론","단어 배열로 문장을 구성하는 규칙"],["언어의 생산성","제한된 기호로 무한한 메시지 생성"]],"explainImg":"img/psy7-p24-slide.jpg"},{"id":"u7d-05","type":"sa","q":"**제한된 기호의 조합**으로 **무한한 메시지**를 생성할 수 있는 언어의 특성을 쓰시오.","answer":"언어의 생산성","alts":["generativity","생성성","생산성"],"explain":"**언어의 생산성(generativity)** — 한국어 자음 19 + 모음 21로 무한한 문장.","src":"7장 p.24","diff":2,"wiki":"언어의 구조","explainImg":"img/psy7-p24-slide.jpg"},{"id":"u7d-06","type":"mc","q":"촘스키의 **보편 문법**에 대한 설명으로 옳은 것은?","choices":["구체적인 문법 구조 자체를 생득적으로 타고난다","문법 구조 자체가 아니라 그것을 학습할 수 있는 소양을 타고난다","실제 세상의 언어들은 구조적 다양성이 거의 없다","언어는 사고를 결정한다는 입장이다"],"answer":1,"explain":"보편 문법 = 공통 통사 규칙(명사·형용사·동사) + 학습 소양 생득. 슬라이드 그대로 — 교수 예: 지리적으로 먼 핀란드어와 한국어의 문법 유사성. (오답 ① 구체적인 문법 구조 자체를 생득적으로 타고난다: 슬라이드가 명시적으로 부정한 내용이다.)","src":"7장 p.25","diff":2,"prof":true,"wiki":"보편 문법","explainImg":"img/psy7-p25-slide.jpg"},{"id":"u7d-07","type":"tf","q":"보편 문법이란 사람이 특정 문법 구조 자체를 생득적으로 타고난다는 뜻이다.","explain":"아니다. 문법 구조 자체가 아니라 그것을 **학습할 수 있는 소양**을 타고난다는 것이다(촘스키).","src":"7장 p.25","wiki":"보편 문법","answer":false,"explainImg":"img/psy7-p25-slide.jpg"},{"id":"u7d-08","type":"order","q":"표현성 언어의 발달 단계를 순서대로 놓으시오","explain":"옹알이(언어와 무관한 소리) → 한 단어 → 두 단어(명사 + 동사). 이해(수용성 언어)가 산출보다 먼저 발달한다.","src":"7장 p.26–27","wiki":"표현성 언어","answer":["옹알이 단계 (약 4개월)","한 단어 단계 (약 12개월)","두 단어 단계 (약 24개월)"],"explainImg":"img/psy7-p27-slide.jpg"},{"id":"u7d-09","type":"mc","q":"표현성 언어의 발달 단계에 대한 설명으로 옳은 것은?","choices":["옹알이는 어른의 말소리를 모방한 것이다","표현성 언어가 수용성 언어보다 먼저 발달한다","두 단어 단계는 주로 명사 + 명사 조합이다","옹알이(약 4개월) → 한 단어(약 12개월) → 두 단어(약 24개월) 순이다"],"answer":3,"explain":"4 · 12 · 24개월, 모방 아님, 명사+동사. 슬라이드의 시기·순서 그대로. (오답 ① 옹알이는 어른의 말소리를 모방한 것이다: 옹알이는 언어와 무관한 소리로 **모방이 아니다**.)","src":"7장 p.26–27","diff":2,"wiki":"표현성 언어","explainImg":"img/psy7-p27-slide.jpg"},{"id":"u7d-10","type":"tf","q":"옹알이는 아기가 어른의 말소리를 모방하는 것이다.","explain":"아니다. 옹알이(약 4개월)는 언어와 무관한 소리 생성이며 어른 말소리의 **모방이 아니다**.","src":"7장 p.27","wiki":"표현성 언어","answer":false,"explainImg":"img/psy7-p27-slide.jpg"},{"id":"u7d-11","type":"sa","q":"언어 학습 효율이 가장 좋은 기간(대략 **7세까지**). 입양아는 출생 국가 언어를 쉽게 습득, 성인 학습 시 모국어 억양 — 명칭을 쓰시오.","answer":"결정적 시기","alts":["민감 시기","Critical Period","결정적 시기(= 민감 시기)"],"explain":"**결정적 시기 (= 민감 시기, Critical Period)** — 신경 가소성과 밀접. 노출 최선책 = 동화책 읽어 주기","src":"7장 p.28","wiki":"표현성 언어","explainImg":"img/psy7-p28-slide.jpg"},{"id":"u7d-12","type":"mc","q":"한국에서 태어나 잠깐 한국어에 노출된 뒤 미국으로 입양된 아이는 나중에 한국어를 훨씬 수월하게 배운다. 반면 성인이 되어 배운 외국어에는 모국어 억양이 섞인다. 관련 개념은?","choices":["수용성 언어","결정적 시기","보편 문법","언어상대성"],"answer":1,"explain":"교수 예: 해외 입양아, 러시아·독일식 영어 억양, 영어 유치원 과열. 언어 학습 효율이 가장 좋은 기간(대략 7세까지), 신경 가소성과 밀접. (오답 ① 수용성 언어: 말을 이해하는 초기 발달 단계로, 학습 시기 효과의 개념이 아니다.)","src":"7장 p.28","diff":1,"prof":true,"wiki":"표현성 언어","explainImg":"img/psy7-p28-slide.jpg"},{"id":"u7d-13","type":"sa","q":"손상되면 발화는 유창하지만 **내용이 와해**되는(예: '밥이 학교를 지나가니까…'), 언어 이해를 담당하는 영역을 쓰시오.","answer":"베르니케 영역","alts":["베르니케","wernicke","wernicke's area","베르니케영역"],"explain":"**베르니케 영역** — 좌반구 측두엽. 브로카(산출)와 대비.","src":"7장 p.29","diff":1,"prof":true,"wiki":"베르니케 영역","explainImg":"img/psy7-p29-slide.jpg"},{"id":"u7d-14","type":"mc","q":"**브로카 실어증**의 가장 큰 특징은?","choices":["말은 유창하지만 내용이 와해된다","우반구 손상으로 발생한다","문장이 끊기고 어눌하지만 하고 싶은 말·이해에는 큰 어려움이 없다","말소리를 입술 모양으로 구분하지 못한다"],"answer":2,"explain":"브로카 = 표현(산출), 베르니케 = 이해. 교수 강조(01:32:44) — 산출 장애이지 이해 장애가 아니다. (오답 ① 말은 유창하지만 내용이 와해된다: 베르니케 실어증의 특징이다.)","src":"7장 p.29","diff":2,"prof":true,"wiki":"브로카 영역","explainImg":"img/psy7-p29-slide.jpg"},{"id":"u7d-15","type":"cloze","q":"브로카 영역은 언어의 ___ 을 담당하고, 베르니케 영역은 언어의 ___ 를 담당한다. 둘 다 ___ 에 있다.","explain":"브로카 손상 = 말이 끊기지만 이해·의도는 유지, 베르니케 손상 = 유창하지만 내용 와해. 확실한 것은 둘 다 좌반구라는 점이다.","src":"7장 p.29","wiki":"브로카 영역","answer":["표현","이해","좌반구"],"bank":["표현","이해","좌반구","기억","우반구"],"explainImg":"img/psy7-p29-slide.jpg"},{"id":"u7d-16","type":"mc","q":"소설 『1984』에서 구세계 단어를 지우고 신어(Newspeak)만 쓰게 해 '불순한 생각'을 막으려 한 발상과 가장 가까운 입장은?","choices":["언어상대성","언어결정론","보편 문법","범주화 지각"],"answer":1,"explain":"비판: 말로 표현할 수 없어도 떠오르는 생각이 있다. 언어 자체가 생각을 **결정**한다 — 교수가 든 예(사피어-워프 가설). (오답 ① 언어상대성: 언어가 사고에 '영향'만 준다는 약화판 — 단어 삭제로 생각 자체를 막는다는 발상보다 약하다.)","src":"7장 p.30","diff":1,"prof":true,"wiki":"언어결정론","explainImg":"img/psy7-p30-slide.jpg"},{"id":"u7d-17","type":"sa","q":"그림 (a)는 말하기, (b)는 듣기 과제에서 뇌가 활성화되는 모습이다. (a)에서 활성화되는, 언어의 **표현(산출)**을 담당하는 영역의 명칭을 쓰시오.","explain":"(a) 말하기 = **브로카 영역**(+ 운동피질), (b) 듣기 = 베르니케 영역(+ 청각피질). 브로카 손상은 말이 끊기지만 이해는 유지된다.","src":"7장 p.29","wiki":"브로카 영역","answer":"브로카 영역","alts":["브로카","Broca's area","Broca"],"img":"img/psy7-p29-broca-q.png","imgAlt":"말하기(a)와 듣기(b) 때 활성화되는 좌반구 영역, 영역 이름은 가림","explainImg":"img/psy7-p29-slide.jpg"}]},{"id":"u7e","title":"지능 이론","intro":[{"title":"일반 지능 g (스피어만)","body":"지능은 **단일 지표 g** — **요인 분석**(상관된 점수의 군집 찾기)으로 산출.","src":"7장 p.32"},{"title":"1차 심적 능력 (서스톤) vs 다중 지능 (가드너)","body":"서스톤: 지능 **7가지**, 그러나 능력 간 **정적 상관** → g 영향 인정(**중간 입장**).\n가드너: **8개 영역**이 상대적으로 **독립**(한 영역이 손상돼도 다른 영역 온전). 근거: **현자 증후군**(특정 영역만 뛰어남).","src":"7장 p.33–34"},{"title":"삼원 이론 · 정서 지능","body":"스턴버그 **삼원 이론** = 분석·창의성·현실 지능 3개. **정서 지능** = 타인의 정서 이해 + 자기 정서 관리, 4성분: 지각·이해·관리·사용(사회 지능의 일환, 손다이크 1920).","src":"7장 p.35–38"},{"title":"지능 이론 비교 (숫자와 비판)","body":"스피어만 **1** · 스턴버그 **3** · 정서 지능 **4** · 서스톤 **7** · 가드너 **8**.\n비판: 가드너 = 모든 능력을 지능이라 칭할 필요 없음 / 스턴버그 = 세 영역이 독립적이지 않을 수 있음 / 정서 지능 = 지능 개념 과대 확장.","src":"7장 p.39"}],"items":[{"id":"u7e-01","type":"sa","q":"지능을 **단일 지표(g 요인)** 로, **요인 분석**을 통한 군집화로 산출 — 모든 지적 행동은 단일 능력에서 비롯 — 명칭을 쓰시오.","answer":"일반 지능","alts":["General intelligence","g","일반 지능(General intelligence)"],"explain":"**일반 지능 (General intelligence, g)** — **스피어만 (Spearman, 1904)**","src":"7장 p.32","wiki":"일반 지능","explainImg":"img/psy7-p32-slide.jpg"},{"id":"u7e-02","type":"sa","q":"서로 상관된 점수들의 **군집**을 찾아내는 통계 기법 — 스피어만이 g를 산출할 때 사용 — 명칭을 쓰시오.","answer":"요인 분석","alts":["factor analysis","요인 분석(factor analysis)"],"explain":"**요인 분석 (factor analysis)** — 서로 상관된 점수들의 **군집**을 찾아내는 통계 기법 — 스피어만이 g를 산출할 때 사용","src":"7장 p.32","wiki":"일반 지능","explainImg":"img/psy7-p32-slide.jpg"},{"id":"u7e-03","type":"sa","q":"지능을 1차적으로 **7가지**로 분류 — 스피어만에 반대했으나 능력 간 **정적 상관**이 나와 g의 영향력을 인정 — 명칭을 쓰시오.","answer":"1차 심적 능력","alts":["primary mental abilities","1차 심적 능력(primary mental abilities)"],"explain":"**1차 심적 능력 (primary mental abilities)** — **서스톤 (Thurstone)**. 교수: 「중간적인 위치」","src":"7장 p.33","wiki":"1차 심적 능력","explainImg":"img/psy7-p33-slide.jpg"},{"id":"u7e-04","type":"mc","q":"**서스톤**의 지능 이론에 대한 설명으로 옳은 것은?","choices":["지능을 7가지 1차 심적 능력으로 나누었으나 능력 간 정적 상관이 나타나 g의 영향력을 인정하는 중간 입장이다","지능은 서로 독립적인 8개 영역으로 이루어진다","모든 지적 행동은 단일 능력 g에서 비롯된다","지능은 분석·창의성·현실 지능으로 나뉜다"],"answer":0,"explain":"서스톤 = 7 + 상관 → g 인정(중간), 가드너 = 8 + 독립. 교수가 반복한 정리(「살짝 중간적인 위치」) — 슬라이드 기준 답. (오답 ② 지능은 서로 독립적인 8개 영역으로 이루어진다: 가드너의 다중 지능이다.)","src":"7장 p.33–34","diff":2,"prof":true,"wiki":"1차 심적 능력","explainImg":"img/psy7-p33-slide.jpg"},{"id":"u7e-05","type":"tf","q":"서스톤은 1차 심적 능력들 사이에 정적 상관이 있음을 인정해 g의 영향력을 받아들인 중간 입장이다.","explain":"슬라이드·교수 설명 그대로: 서스톤 = 7개 1차 심적 능력, 능력 간 상관 → g 영향 인정(중간 입장). 가드너는 독립.","src":"7장 p.33–34 🎙","wiki":"1차 심적 능력","prof":true,"answer":true,"explainImg":"img/psy7-p33-slide.jpg"},{"id":"u7e-06","type":"sa","q":"지능은 **상대적으로 독립적인 8개 영역** — 근거: 한 영역이 손상돼도 다른 영역은 온전 — 명칭을 쓰시오.","answer":"다중 지능 이론","alts":["multiple intelligences","다중 지능 이론(multiple intelligences)"],"explain":"**다중 지능 이론 (multiple intelligences)** — **가드너 (Gardner)**. 교수: 근거 = 이중 해리","src":"7장 p.34","wiki":"다중 지능","explainImg":"img/psy7-p34-slide.jpg"},{"id":"u7e-07","type":"sa","q":"지능 검사·언어 능력에는 제한이 있으나 특정 영역에서 굉장히 뛰어난 능력을 보이는 현상을 쓰시오.","answer":"현자 증후군","alts":["서번트 증후군","savant syndrome","현자증후군","서번트증후군"],"explain":"**현자 증후군(savant syndrome)** — 가드너 다중 지능의 근거, 자폐 스펙트럼 동반 많음.","src":"7장 p.34","diff":1,"wiki":"다중 지능","explainImg":"img/psy7-p34-slide.jpg"},{"id":"u7e-08","type":"mc","q":"지능 검사 점수와 언어 능력에는 제한이 있지만 수학·예술 등 특정 영역에서 굉장히 뛰어난 사례(현자 증후군)는 어떤 이론의 근거로 쓰이는가?","choices":["스피어만의 일반 지능","가드너의 다중 지능 이론","서스톤의 1차 심적 능력","정서 지능"],"answer":1,"explain":"현자 증후군 = 가드너 p.34, 자폐 스펙트럼과 동반 많음. 한 영역이 낮아도 다른 영역은 높을 수 있다 → 영역들이 독립적. (오답 ① 스피어만의 일반 지능: 단일 g라면 특정 영역만 뛰어난 현상을 설명하기 어렵다.)","src":"7장 p.34","diff":2,"wiki":"다중 지능","explainImg":"img/psy7-p34-slide.jpg"},{"id":"u7e-09","type":"match","q":"지능 이론과 그 이론이 나눈 지능(성분)의 개수를 연결하시오","explain":"교수가 두 번 정리한 p.39 표: 스피어만 1 · 스턴버그 3 · 정서 4 · 서스톤 7 · 가드너 8.","src":"7장 p.39 🎙","wiki":"다중 지능","prof":true,"pairs":[["스피어만","1 (g)"],["스턴버그 삼원 이론","3"],["정서 지능","4"],["서스톤","7"],["가드너","8"]],"explainImg":"img/psy7-p39-slide.jpg"},{"id":"u7e-10","type":"sa","q":"지능을 **분석·창의성·현실** 3개 하위 영역으로 분류 — 명칭을 쓰시오.","answer":"삼원 이론","alts":["triarchic theory","삼원 이론(triarchic theory)"],"explain":"**삼원 이론 (triarchic theory)** — **스턴버그 (Sternberg)** — 지능을 **분석·창의성·현실** 3개 하위 영역으로 분류","src":"7장 p.35","wiki":"삼원 이론","explainImg":"img/psy7-p35-slide.jpg"},{"id":"u7e-11","type":"mc","q":"지능 이론에 대한 비판 중 '**모든 능력을 지능이라 칭할 필요는 없다**'는 지적을 받는 이론은?","choices":["삼원 이론 (스턴버그)","정서 지능","다중 지능 이론 (가드너)","일반 지능 (스피어만)"],"answer":2,"explain":"교수가 두 번 정리한 5입장 표 — 비판 칸까지 짝지을 것. 8개 영역을 모두 '지능'이라 부르는 것에 대한 비판. (오답 ① 삼원 이론 (스턴버그): 비판은 '세 영역이 실제로는 독립적이지 않을 수 있다'.)","src":"7장 p.39","diff":3,"prof":true,"wiki":"다중 지능","explainImg":"img/psy7-p39-slide.jpg"},{"id":"u7e-12","type":"mc","q":"지능 이론과 숫자의 연결이 옳지 **않은** 것은?","choices":["스피어만 — 단일 지표 g","서스톤 — 7가지 1차 심적 능력","가드너 — 8개 독립 영역","정서 지능 — 3가지 성분"],"answer":3,"explain":"1(스피어만) · 3(스턴버그) · 4(정서) · 7(서스톤) · 8(가드너). 정서 지능은 **4가지** 성분(지각·이해·관리·사용). 3은 스턴버그 삼원 이론. (오답 ① 스피어만 — 단일 지표 g: 옳다.)","src":"7장 p.39","diff":2,"prof":true,"wiki":"정서 지능","explainImg":"img/psy7-p39-slide.jpg"},{"id":"u7e-13","type":"tf","q":"가드너의 8개 지능은 서로 상관이 높아 결국 하나의 g로 묶인다고 보았다.","explain":"가드너의 8영역은 **상대적으로 독립적**이다(한 영역이 손상돼도 다른 영역은 온전). 교수: 개수 차이가 아니라 독립성이 핵심.","src":"7장 p.34","wiki":"다중 지능","answer":false,"explainImg":"img/psy7-p34-slide.jpg"},{"id":"u7e-14","type":"sa","q":"사회 지능의 일환 — 타인의 정서를 **이해**하고 자신의 정서를 **관리**하는 능력 (4성분) — 명칭을 쓰시오.","answer":"정서 지능","alts":["emotional intelligence","정서 지능(emotional intelligence)"],"explain":"**정서 지능 (emotional intelligence)** — 지각·이해·관리·사용. 비판: 지능 개념 과도 확장(Waterhouse)","src":"7장 p.37–38","wiki":"정서 지능","explainImg":"img/psy7-p37-slide.jpg"},{"id":"u7e-15","type":"mc","q":"정서 지능의 4가지 성분에 해당하지 **않는** 것은?","choices":["정서 억제","정서 지각","정서 이해","정서 사용"],"answer":0,"explain":"지·이·관·사 = 지각·이해·관리·사용. 4성분에 없다. (오답 ② 정서 지각: 성분 — 외부 요인에서 정서를 재인.)","src":"7장 p.37","diff":1,"wiki":"정서 지능","explainImg":"img/psy7-p37-slide.jpg"},{"id":"u7e-16","type":"cloze","q":"지능 이론별 비판: 가드너 이론은 '모든 능력을 ___ 이라 칭할 필요는 없다', 스턴버그 이론은 세 영역이 ___ 이지 않을 수 있다, 정서 지능은 지능 개념을 과하게 ___ 했다는 지적을 받는다.","explain":"p.39 각 이론의 다른 고려사항: g(단일 지표로 못 묶음), 서스톤(g 영향 존재), 가드너(모든 능력=지능? X), 스턴버그(세 영역 비독립 가능), 정서 지능(과대 확장).","src":"7장 p.39 🎙","wiki":"다중 지능","prof":true,"answer":["지능","독립적","확대"],"bank":["지능","독립적","확대","보편적","축소"],"explainImg":"img/psy7-p39-slide.jpg"}]},{"id":"u7f","title":"지능 검사","intro":[{"title":"검사의 종류","body":"**지능 검사** = 심적 적성 평가 / **성취 검사** = 이미 학습한 것(과거, 예: 중간고사) / **적성 검사** = 미래 성취 예측.","src":"7장 p.40"},{"title":"지능 검사의 역사","body":"골턴(신체 지표, 실패) → **비네**(정신 연령으로 학업 성취 예측, 생득 지능 측정 목표 아님, 낮은 아동엔 **심적 정형술**) → 터먼 **스탠퍼드-비네**(생득 지능 측정 가능 가정) → 스턴 **IQ = 정신 연령 ÷ 생활 연령 × 100**(성인엔 부적합) → **WAIS**(15개 하위 검사, 전체 + 영역별 점수).","src":"7장 p.41–43"},{"title":"표준화","body":"사전 집단의 수행과 비교해 점수의 의미를 정의 — 검사 개발의 필수 요인. 충분한 표본으로 사전 검사해야 한다. 점수는 평균 근처에 몰리는 **정규곡선**을 이룬다(중심극한정리).","src":"7장 p.44–45","img":"img/psy7-p45-normal.png","imgAlt":"웩슬러 지능검사 점수의 정규분포"},{"title":"신뢰도와 타당도","body":"**신뢰도** = 점수가 일관된가: 검사-재검사 신뢰도(반복 실시), 반분 신뢰도(짝수·홀수 문항). **타당도** = 재려던 것을 재는가: 예측 타당도(점수 ↔ 기준 행동 상관). 신뢰도가 높아도 타당도는 낮을 수 있다.","src":"7장 p.46–47"}],"items":[{"id":"u7f-01","type":"mc","q":"이미 학습한 내용을 평가하는 검사로, 학기 중에 보는 **중간고사**가 대표적인 예인 검사 유형은?","choices":["적성 검사","성취 검사","지능 검사","표준화 검사"],"answer":1,"explain":"성취 = 과거, 적성 = 미래. 이미 학습한 내용을 평가 — 과거. (오답 ① 적성 검사: 미래 성취를 예측하는 검사다.)","src":"7장 p.40","diff":1,"prof":true,"wiki":"지능 검사","explainImg":"img/psy7-p40-slide.jpg"},{"id":"u7f-02","type":"sa","q":"개인의 **미래 성취를 예측**하는 검사 (IQ와 SAT 상관 약 0.82) — 명칭을 쓰시오.","answer":"적성 검사","alts":["aptitude test","적성 검사(aptitude test)"],"explain":"**적성 검사 (aptitude test)** — 개인의 **미래 성취를 예측**하는 검사 (IQ와 SAT 상관 약 0.82)","src":"7장 p.40","wiki":"지능 검사","explainImg":"img/psy7-p40-slide.jpg"},{"id":"u7f-03","type":"match","q":"검사 유형과 설명을 연결하시오","explain":"성취 = 과거, 적성 = 미래. 교수 예: 중간고사 = 성취 검사.","src":"7장 p.40, 46–47","wiki":"지능 검사","pairs":[["지능 검사","개인의 심적 적성 평가"],["성취 검사","이미 학습한 내용(과거) 평가"],["적성 검사","미래 성취 예측"],["신뢰도","검사 점수의 일관성"],["타당도","재려던 것을 실제로 재는가"]],"explainImg":"img/psy7-p40-slide.jpg"},{"id":"u7f-04","type":"mc","q":"**비네**의 지능 검사에 대한 설명으로 옳은 것은?","choices":["생득적 지능을 측정할 수 있다고 가정했다","근력·신체 비율·반응 시간으로 지능을 측정했다","정신 연령을 측정해 아동의 학업 성취를 예측하려 했고, 생득적 지능 측정을 목표로 하지 않았다","IQ = 정신 연령 ÷ 생활 연령 × 100 공식을 제안했다"],"answer":2,"explain":"골턴(신체, 실패) → 비네(정신 연령) → 터먼(스탠퍼드-비네, 생득) → 스턴(IQ 공식) → 웩슬러(WAIS). 슬라이드 그대로(프랑스 의무 교육 배경). (오답 ① 생득적 지능을 측정할 수 있다고 가정했다: **터먼**(스탠퍼드-비네)의 가정 — 비네와 정반대.)","src":"7장 p.41–42","diff":2,"wiki":"지능 검사","explainImg":"img/psy7-p41-slide.jpg"},{"id":"u7f-05","type":"sa","q":"비네가 점수가 낮은 아동을 위해 주의·자기훈련 능력을 발달시키도록 권장한 것을 쓰시오.","answer":"심적 정형술","alts":["mental orthopedics","심적정형술"],"explain":"**심적 정형술** — 비네는 생득 지능 측정이 아니라 도움이 필요한 아동 선별·지원을 목표로 했다.","src":"7장 p.41","diff":2,"wiki":"지능 검사","explainImg":"img/psy7-p41-slide.jpg"},{"id":"u7f-06","type":"sa","q":"비네 검사를 토대로 확대·개편, **생득적 지능을 측정할 수 있다고 가정** — 이 검사를 토대로 IQ 공식이 쓰임 — 명칭을 쓰시오.","answer":"스탠퍼드-비네 검사","alts":["Stanford-Binet","스탠퍼드-비네 검사(Stanford-Binet)"],"explain":"**스탠퍼드-비네 검사 (Stanford-Binet)** — **루이스 터먼 (Lewis Terman)**. 교수: 1차 세계대전 병력 선별에도 사용","src":"7장 p.42","wiki":"스탠퍼드-비네 검사","explainImg":"img/psy7-p42-slide.jpg"},{"id":"u7f-07","type":"mc","q":"생활 연령 8세인 아동이 10세 수준의 수행을 보였다. 스턴의 공식으로 계산한 IQ는?","choices":["125","80","100","120"],"answer":0,"explain":"IQ = 정신 연령 ÷ 생활 연령 × 100. $\\frac{10}{8}\\times 100 = 125$. (오답 ② 80: 생활 연령/정신 연령으로 뒤집어 계산한 값($\\frac{8}{10}\\times100$)이다.)","src":"7장 p.42","diff":1,"wiki":"스탠퍼드-비네 검사","explainImg":"img/psy7-p42-slide.jpg"},{"id":"u7f-08","type":"num","q":"생활 연령 10세인 아동이 12세 수준의 수행을 보였다. 스턴의 공식으로 IQ는?","explain":"IQ = 정신 연령 ÷ 생활 연령 × 100 = 12 ÷ 10 × 100 = **120**. 이 공식은 아동에게만 맞고 성인에는 부적합하다.","src":"7장 p.42","wiki":"스탠퍼드-비네 검사","answer":120,"unit":"","tol":0,"explainImg":"img/psy7-p42-slide.jpg"},{"id":"u7f-09","type":"sa","q":"총 **15개 하위 검사**(공통성·어휘·토막짜기·기호 쓰기 등) — **전반적 지능 점수 + 하위 영역별 점수**를 함께 제공 — 명칭을 쓰시오.","answer":"웩슬러 성인용 지능 검사","alts":["WAIS","웩슬러 성인용 지능 검사(WAIS)"],"explain":"**웩슬러 성인용 지능 검사 (WAIS)** — 교수: 다중지능 입장과 비슷, 요즘 많이 활용(약 1시간 반)","src":"7장 p.43","wiki":"웩슬러 성인용 지능 검사","explainImg":"img/psy7-p43-slide.jpg"},{"id":"u7f-10","type":"sa","q":"사전에 검사를 받은 집단의 수행과 개인의 수행을 비교해 점수의 의미를 정의하는, 검사 개발의 필수 요인을 쓰시오.","answer":"표준화","alts":["standardization","표준화(standardization)"],"explain":"**표준화** — 교수: 충분한 표본 수가 가장 중요(최소 300명 사례), K-검사도 재표준화.","src":"7장 p.44","diff":1,"prof":true,"wiki":"표준화","explainImg":"img/psy7-p44-slide.jpg"},{"id":"u7f-11","type":"mc","q":"지능 검사를 **표준화**할 때 가장 중요하게 확인해야 하는 것은?","choices":["문항을 가능한 한 어렵게 만드는 것","검사 시간을 최대한 줄이는 것","짝수 문항과 홀수 문항 점수를 비교하는 것","충분한 표본 수를 모아 사전 테스트를 했는가"],"answer":3,"explain":"표준화 = 표준화 집단과 비교, 정규곡선, 중심극한정리(표본이 클수록 정규분포). 교수 발언(02:04:33) — 치매 판별 도구는 최소 300명. (오답 ① 문항을 가능한 한 어렵게 만드는 것: 슬라이드·녹음 어디에도 없다.)","src":"7장 p.44–45","diff":2,"prof":true,"wiki":"표준화","explainImg":"img/psy7-p45-slide.jpg"},{"id":"u7f-12","type":"sa","q":"**동일 검사를 반복** 실시해도 유사한 점수가 나오는지로 확인하는 신뢰도 — 명칭을 쓰시오.","answer":"검사-재검사 신뢰도","alts":["test-retest reliability","검사-재검사 신뢰도(test-retest reliability)"],"explain":"**검사-재검사 신뢰도 (test-retest reliability)** — **동일 검사를 반복** 실시해도 유사한 점수가 나오는지로 확인하는 신뢰도","src":"7장 p.46","wiki":"신뢰도","explainImg":"img/psy7-p46-slide.jpg"},{"id":"u7f-13","type":"mc","q":"검사를 반으로 나누어 **짝수 문항과 홀수 문항**의 점수가 일치하는지 확인하는 것은?","choices":["검사-재검사 신뢰도","반분 신뢰도","예측 타당도","표준화"],"answer":1,"explain":"신뢰도 2종 = 검사-재검사 + 반분 — 교수: 「두 가지가 모두 갖춰져야」. split-half reliability. (오답 ① 검사-재검사 신뢰도: 같은 검사를 **반복** 실시해 비교한다.)","src":"7장 p.46","diff":1,"wiki":"신뢰도","explainImg":"img/psy7-p46-slide.jpg"},{"id":"u7f-14","type":"sa","q":"검사 점수와 **기준 행동** 사이의 상관을 계산해, 점수가 실제 행동을 예측할 수 있는지 보는 타당도의 종류를 쓰시오.","answer":"예측 타당도","alts":["predictive validity","예측타당도"],"explain":"**예측 타당도** — 타당도의 하위 유형(신뢰도 하위 = 검사-재검사·반분).","src":"7장 p.47","diff":2,"wiki":"타당도","explainImg":"img/psy7-p47-slide.jpg"},{"id":"u7f-15","type":"tf","q":"신뢰도가 높은 검사는 타당도도 반드시 높다.","explain":"아니다. 무관한 문항으로 만들어도 점수는 일관될 수 있다(신뢰도↑, 타당도↓). 신뢰도는 타당도의 필요조건일 뿐.","src":"7장 p.47","wiki":"타당도","answer":false,"explainImg":"img/psy7-p47-slide.jpg"},{"id":"u7f-16","type":"mc","q":"운동 능력 검사를 운동과 전혀 무관한 문항으로 만들었는데, 같은 사람에게 여러 번 실시해도 점수가 매번 비슷했다. 이 검사는?","choices":["타당도는 높지만 신뢰도는 낮다","신뢰도는 높지만 타당도는 낮다","신뢰도와 타당도가 모두 높다","신뢰도와 타당도가 모두 낮다"],"answer":1,"explain":"신뢰도와 타당도는 별개 — 둘 다 갖춰야 공인 검사. 점수는 일관(신뢰도↑)하지만 재려던 것을 재지 못한다(타당도↓) — 교수 예. (오답 ① 타당도는 높지만 신뢰도는 낮다: 반대로 말했다.)","src":"7장 p.47","diff":2,"prof":true,"wiki":"타당도","explainImg":"img/psy7-p47-slide.jpg"},{"id":"u7f-17","type":"mc","q":"그림은 웩슬러 지능검사 점수의 분포다. 이처럼 미리 검사를 받은 집단의 점수 분포와 비교해 개인 점수의 의미를 정하는, 검사 개발의 필수 과정은?","explain":"**표준화** = 사전 집단의 수행과 비교해 점수의 의미를 정의. 그 집단 점수는 평균 근처에 몰린 정규곡선을 이룬다. 반분 신뢰도·예측 타당도는 검사의 일관성·정확성 지표, 요인 분석은 g를 찾는 통계 기법.","src":"7장 p.44–45","wiki":"표준화","choices":["표준화","반분 신뢰도","예측 타당도","요인 분석"],"answer":0,"img":"img/psy7-p45-normal.png","imgAlt":"웩슬러 지능검사 점수의 종 모양 분포","explainImg":"img/psy7-p44-slide.jpg"}]}]},{"id":"u8","title":"8장 동기와 정서","desc":"동기 이론 · 배고픔 · 소속·성취 동기 · 정서 이론 · 정서 표현 · 행복","lessons":[{"id":"u8a","title":"동기 이론","intro":[{"title":"동기와 본능","body":"**동기** = 행동의 실현을 수반하거나 그 **방향성**을 설정해 주는 욕구. **본능** = 종 안에서 철저히 패턴화된, **학습하지 않은** 복잡한 행동(신생아 쥐기 반사). 본능 이론은 대부분의 동기를 설명하진 못하지만 유전 요인 가정은 진화심리학으로 이어졌다.","src":"8장 p.2"},{"title":"추동 감소 이론","body":"**추동** = 생리적 욕구를 채우려는 **긴장 상태**. 욕구(음식 결핍) → 추동(배고픔) → 추동 감소 행동(먹기). 목표는 **항상성**(일정한 내적 상태 유지). push = 내적 욕구, pull = 외적 **유인자극** — 둘이 함께면 추동이 강해진다.","src":"8장 p.3–4","img":"img/psy8-p3-drive.png","imgAlt":"욕구 → 추동 → 추동감소 행동 도식"},{"title":"각성 이론과 여키스-닷슨 법칙","body":"동기의 목표 = **최적의 각성 수준**(필요하면 각성을 높이기도: 호기심·번지점프). **여키스-닷슨 법칙**(1908): 적당한 각성에서 수행 최고(역U자), **어려운 과제는 낮은 각성**에서 더 잘한다.","src":"8장 p.5–6","img":"img/psy8-p6-yd.png","imgAlt":"각성 수준에 따른 수행의 역U자 곡선"},{"title":"매슬로우의 욕구 위계","body":"하위 욕구가 우선이고, 미충족이면 다음 단계로 이어지지 않는다. 아래부터 **생리적** → 안전 → 소속과 사랑 → 존중 → 자아실현 → 자기초월. 순서는 개인·문화에 따라 달라질 수 있다.","src":"8장 p.7–8","img":"img/psy8-p7-maslow.png","imgAlt":"매슬로우 욕구 위계 피라미드"}],"items":[{"id":"u8a-01","type":"mc","q":"'행동의 실현을 수반하거나 그 **방향성**을 설정해 주는 욕구'로 정의되는 것은?","choices":["정서","동기","추동","유인자극"],"answer":1,"explain":"동기 = 행동의 실현·방향성을 정하는 욕구. 교수: 생물·심리·환경으로 설명되는 광범위한 개념. p.2 동기의 정의. (오답 ① 정서: 정서는 동기와 함께 다루지만 이 정의의 대상이 아니다.)","src":"8장 p.2","diff":1,"prof":true,"wiki":"동기","explainImg":"img/psy8-p2-slide.jpg"},{"id":"u8a-02","type":"sa","q":"한 동물 종에서 **철저하게 패턴화**되어 있으며 **학습하지 않은** 복잡한 행동 — 명칭을 쓰시오.","answer":"본능","alts":["instinct","본능(instinct)"],"explain":"**본능 (instinct)** — 교수 예: 신생아가 손에 쥐여 주면 꼭 쥐고, 뺨에 닿으면 그쪽으로 고개를 돌림","src":"8장 p.2","prof":true,"wiki":"본능","explainImg":"img/psy8-p2-slide.jpg"},{"id":"u8a-03","type":"mc","q":"**본능 이론**에 대한 평가로 옳은 것은?","choices":["심리학에서 완전히 폐기되어 더 이상 쓰이지 않는다","학습된 행동의 중요성을 강조한 이론이다","인간의 모든 동기를 충분히 설명한다","대부분의 동기를 설명하기는 어렵지만, 유전적 요인의 영향력 가정은 진화심리학의 주요 기제로 남았다"],"answer":3,"explain":"본능: 한계(대부분 동기 설명 X) + 의의(유전 → 진화심리학). 슬라이드·교수 정리(15:18–15:45) 그대로. (오답 ① 심리학에서 완전히 폐기되어 더 이상 쓰이지 않는다: 유전적 요인 가정은 **유지**된다.)","src":"8장 p.2","diff":2,"prof":true,"wiki":"본능","explainImg":"img/psy8-p2-slide.jpg"},{"id":"u8a-04","type":"sa","q":"**생리적 욕구**를 충족시키기 위한 행동을 동기화하는 **긴장 상태**를 쓰시오.","answer":"추동","alts":["drive","추동(drive)"],"explain":"**추동(Drive)** — 추동 감소 이론의 핵심.","src":"8장 p.3","diff":1,"wiki":"추동","explainImg":"img/psy8-p3-slide.jpg"},{"id":"u8a-05","type":"order","q":"추동 감소 이론의 흐름을 순서대로 놓으시오","explain":"생리적 욕구가 긴장 상태(추동)를 만들고, 그 추동을 줄이는 행동으로 이어진다. 목표는 항상성 유지.","src":"8장 p.3","wiki":"추동 감소 이론","answer":["욕구 (음식 결핍)","추동 (배고픔)","추동 감소 행동 (먹기)"],"explainImg":"img/psy8-p3-slide.jpg"},{"id":"u8a-06","type":"mc","q":"'음식 결핍 → 배고픔 → 먹기'의 흐름으로 동기를 설명하는 이론은?","choices":["추동 감소 이론","각성 이론","욕구 위계 이론","2요인 이론"],"answer":0,"explain":"추동 감소는 항상성 유지의 핵심 기제. 생리적 욕구 → 추동 → 추동을 줄이는 행동. (오답 ② 각성 이론: 최적 각성 수준을 찾는 것이 목표 — 호기심·탐험 설명용.)","src":"8장 p.3","diff":1,"wiki":"추동 감소 이론","explainImg":"img/psy8-p3-slide.jpg"},{"id":"u8a-07","type":"sa","q":"**일정한 내적 상태를 유지하려는 경향성**(피드백 루프로 조절)을 쓰시오.","answer":"항상성","alts":["homeostasis","항상성(homeostasis)"],"explain":"**항상성** — 추동 감소는 항상성 유지의 핵심 기제.","src":"8장 p.3","diff":1,"wiki":"항상성","explainImg":"img/psy8-p3-slide.jpg"},{"id":"u8a-08","type":"sa","q":"사람의 행동을 이끌어 낼 수 있는 긍정/부정의 **모든 유형의 자극**으로, 환경의 영향을 받는 것을 쓰시오.","answer":"유인자극","alts":["유인 자극","incentive"],"explain":"**유인자극(Incentive)** — 욕구(push)와 동시에 있으면 추동 강화(pull).","src":"8장 p.4","diff":1,"wiki":"유인자극","explainImg":"img/psy8-p4-slide.jpg"},{"id":"u8a-09","type":"mc","q":"배가 고픈 상태에서 좋아하는 음식 냄새를 맡자 먹고 싶은 마음이 훨씬 강해졌다. 이에 대한 설명으로 옳은 것은?","choices":["욕구(push)와 유인자극(pull)이 동시에 존재하면 추동이 더 강화된다","유인자극은 생리적 요인일 뿐 환경의 영향을 받지 않는다","추동이 강화되려면 각성이 반드시 감소해야 한다","유인자극은 긍정적 자극만을 가리킨다"],"answer":0,"explain":"push = 욕구(내부), pull = 유인자극(외부). p.4 결론 — 동기는 생리 × 환경의 상호작용. (오답 ② 유인자극은 생리적 요인일 뿐 환경의 영향을 받지 않는다: 유인자극은 **환경**의 영향을 받는다.)","src":"8장 p.4","diff":2,"wiki":"유인자극","explainImg":"img/psy8-p4-slide.jpg"},{"id":"u8a-10","type":"tf","q":"push는 내적 욕구, pull은 외적 유인자극이며, 둘이 동시에 있으면 추동이 더 강해진다.","explain":"맞다. push = 내적 **욕구**(생리), pull = 외적 **유인자극**(환경). 둘이 동시에 있으면 추동이 더 강해진다.","src":"8장 p.4, 8","wiki":"유인자극","answer":true,"explainImg":"img/psy8-p4-slide.jpg"},{"id":"u8a-11","type":"sa","q":"추동 감소와 대비 — 각성의 **증진**으로도 동기가 생긴다(호기심·탐험). 동기의 목표 = **최적의 각성 수준** — 명칭을 쓰시오.","answer":"각성 이론","alts":["arousal theory","각성 이론(arousal theory)"],"explain":"**각성 이론 (arousal theory)** — 감각 추구 성향(Zuckerman, 2009)","src":"8장 p.5–6, 8","wiki":"각성 이론","explainImg":"img/psy8-p6-slide.jpg"},{"id":"u8a-12","type":"mc","q":"배고프지도 목마르지도 않은 사람이 번지점프·롤러코스터 같은 자극을 일부러 찾는다. 이를 가장 잘 설명하는 이론은?","choices":["추동 감소 이론","본능 이론","각성 이론","매슬로우 욕구 위계"],"answer":2,"explain":"'추동 감소로 설명하기 어렵다 → 각성 이론' 형식의 전형. 각성의 **증진**으로도 동기가 생긴다 — 최적 각성 추구(감각 추구, Zuckerman). (오답 ① 추동 감소 이론: 각성(긴장)을 **낮추는** 방향만 설명해 자극 추구를 설명하기 어렵다.)","src":"8장 p.5–6","diff":1,"wiki":"각성 이론","explainImg":"img/psy8-p5-slide.jpg"},{"id":"u8a-13","type":"sa","q":"**적당한 각성**이 최적의 수행을 유도(역U자) — **어려운 과제는 낮은 각성**에서 수행이 높다 — 명칭을 쓰시오.","answer":"여키스-닷슨 법칙","alts":["Yerkes-Dodson law","여키스-닷슨 법칙(Yerkes-Dodson law)"],"explain":"**여키스-닷슨 법칙 (Yerkes-Dodson law, 1908)** — Hembree(1988) 시험 불안 연구","src":"8장 p.5–6","wiki":"여키스-닷슨 법칙","explainImg":"img/psy8-p6-slide.jpg"},{"id":"u8a-14","type":"mc","q":"**여키스-닷슨 법칙**에 대한 설명으로 옳은 것은?","choices":["각성이 높을수록 수행이 직선적으로 높아진다","어려운 과제일수록 높은 각성이 유리하다","적당한 각성이 최적 수행을 낳으며, 어려운 과제는 상대적으로 낮은 각성에서 수행이 높다","각성 수준과 수행은 관련이 없다"],"answer":2,"explain":"어려운 시험일수록 긴장을 낮춰야 한다. 역U자 + 어려운 과제 = 낮은 각성(Hembree, 1988). (오답 ① 각성이 높을수록 수행이 직선적으로 높아진다: 역U자 관계이지 직선이 아니다.)","src":"8장 p.6","diff":2,"wiki":"여키스-닷슨 법칙","explainImg":"img/psy8-p6-slide.jpg"},{"id":"u8a-15","type":"tf","q":"여키스-닷슨 법칙에 따르면 어려운 과제일수록 각성 수준이 높아야 수행이 좋다.","explain":"반대다. 적당한 각성이 최적(역U자)이며, **어려운 과제는 낮은 각성**에서 수행이 높다.","src":"8장 p.6","wiki":"여키스-닷슨 법칙","answer":false,"explainImg":"img/psy8-p6-slide.jpg"},{"id":"u8a-16","type":"match","q":"고전적 동기 이론과 핵심 주장을 연결하시오","explain":"p.8 요약표 4개. 각성 이론은 각성을 낮추기만 하는 추동 감소와 달리 필요하면 각성을 높이기도 한다(호기심·탐험).","src":"8장 p.8","wiki":"동기","pairs":[["본능과 진화","학습하지 않은 종 특유의 행동, 유전"],["추동 감소 이론","생리적 욕구 → 추동 → 감소 행동"],["각성 이론","최적의 각성 수준 유지"],["욕구 위계","하위 욕구(생리)가 우선 충족"]],"explainImg":"img/psy8-p8-slide.jpg"},{"id":"u8a-17","type":"mc","q":"그림은 동기 이론의 도식이다. 가운데 가려진 칸(예: 배고픔, 갈증)에 들어갈 용어는?","explain":"욕구(음식·물) → **추동**(배고픔·갈증) → 추동 감소 행동(먹기·마시기). 추동 = 생리적 욕구를 채우려는 긴장 상태. 유인자극은 행동을 끌어내는 외부 자극(pull)이다.","src":"8장 p.3","wiki":"추동 감소 이론","choices":["추동","유인자극","각성","본능"],"answer":0,"img":"img/psy8-p3-drive-q.png","imgAlt":"욕구 → (가림) → 추동감소 행동 도식","explainImg":"img/psy8-p3-slide.jpg"},{"id":"u8a-18","type":"sa","q":"그림처럼 각성 수준이 적당할 때 수행이 가장 높고, 너무 낮거나 높으면 수행이 떨어지는 역U자 관계를 나타낸 법칙의 명칭을 쓰시오.","explain":"**여키스-닷슨 법칙**(1908). 덧붙여 어려운 과제는 상대적으로 낮은 각성에서 수행이 더 좋다.","src":"8장 p.6","wiki":"여키스-닷슨 법칙","answer":"여키스-닷슨 법칙","alts":["여키스닷슨 법칙","Yerkes-Dodson law","여키스-도슨 법칙","여키스 닷슨"],"img":"img/psy8-p6-yd-q.png","imgAlt":"각성 수준(가로)과 수행(세로)의 역U자 곡선, 제목은 가림","explainImg":"img/psy8-p6-slide.jpg"},{"id":"u8a-19","type":"sa","q":"그림은 매슬로우의 욕구 위계다. 맨 아래 가려진 칸(배고픔과 갈증을 해소하려는 욕구)의 명칭을 쓰시오.","explain":"가장 하위 = **생리적 욕구**. 아래부터 생리적 → 안전 → 소속과 사랑 → 존중 → 자아실현 → 자기초월. 하위 욕구가 먼저 충족돼야 다음으로 이어진다.","src":"8장 p.7","wiki":"매슬로우의 욕구 위계","answer":"생리적 욕구","alts":["생리 욕구","physiological needs","생리적욕구"],"img":"img/psy8-p7-maslow-q.png","imgAlt":"욕구 위계 피라미드, 맨 아래 칸 이름은 가림","explainImg":"im
