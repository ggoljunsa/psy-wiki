["obedience","복종(obedience)"],"explain":"**복종 (obedience)** — **명령에 따르기** — 비도덕적인 요구에 왜 따르는지에 대한 탐구에서 시작","src":"10장 p.18","wiki":"복종","explainImg":"img/psy10-p18-slide.jpg"},{"id":"u10c-02","type":"sa","q":"옆방 학습자에게 **15V → 450V** 전기 충격을 주라고 지시 → 대부분 마지막 단계까지 진행 (1963, 1974) — 명칭을 쓰시오.","answer":"밀그램의 복종 실험","alts":["밀그램 실험","밀그램 복종 실험","Milgram 복종 실험"],"explain":"**밀그램의 복종 실험** — 사전엔 대부분 '저항하겠다'고 응답 — 옆방 학습자에게 **15V → 450V** 전기 충격을 주라고 지시 → 대부분 마지막 단계까지 진행 (1963, 1974)","src":"10장 p.18","wiki":"밀그램의 복종 실험","explainImg":"img/psy10-p18-slide.jpg"},{"id":"u10c-03","type":"sa","q":"**복종 실험**(전기 충격) + 복종 요인 4가지 (1963, 1974) — 이 연구자(학자)는?","answer":"밀그램","alts":["Milgram","밀그램(Milgram)"],"explain":"**밀그램 (Milgram)** — **복종 실험**(전기 충격) + 복종 요인 4가지 (1963, 1974)","src":"10장 p.18–19","wiki":"밀그램의 복종 실험","explainImg":"img/psy10-p19-slide.jpg"},{"id":"u10c-04","type":"mc","q":"밀그램의 복종 실험에 대한 설명으로 옳지 않은 것은?","choices":["대부분의 참가자는 중간 단계에서 실험을 거부했다","실험 전에는 대부분이 부당한 명령에 저항할 수 있다고 응답했다","인간의 복종은 특질보다 상황에 의해 발생할 수 있음을 함의한다","타인의 환호가 있으면 더 많은 사람이 최고 강도의 버튼을 눌렀다"],"answer":0,"explain":"교수: '개인적인 특질보다는 상황에 의해'. 대부분 **마지막 단계까지** 진행했다(p.18). (오답 ② 실험 전에는 대부분이 부당한 명령에 저항할 수 있다고 응답했다: 옳다.)","src":"10장 p.18","diff":2,"wiki":"밀그램의 복종 실험","explainImg":"img/psy10-p18-slide.jpg"},{"id":"u10c-05","type":"tf","q":"밀그램 실험에서 참가자는 15V에서 시작해 450V까지 올라가는 전기 충격을 주라는 지시를 받았다.","explain":"15V → 450V. 대부분의 참가자가 마지막 단계까지 진행했다(1963, 1974).","src":"10장 p.18","wiki":"밀그램의 복종 실험","answer":true,"explainImg":"img/psy10-p18-slide.jpg"},{"id":"u10c-06","type":"cloze","q":"밀그램의 복종 요인: 명령자가 ___ 있고 ___ 권위자일 때, ___ 기관이 지지할 때, 희생자가 ___ 있고 몰개성화될 때, 저항하는 역할이 없을 때 복종이 늘어난다.","explain":"교수는 「합법적 권위」를 더 중요한 것으로 짚었다. 예일대 밖에서 하면 복종 ↓, 드론 조종사는 희생자가 멀어 PTSD ↓.","src":"10장 p.19 🎙","wiki":"복종","prof":true,"answer":["가까이","합법적","저명한","멀리"],"bank":["가까이","합법적","저명한","멀리","익명의","사적인"],"explainImg":"img/psy10-p19-slide.jpg"},{"id":"u10c-07","type":"mc","q":"밀그램이 제시한 복종에 영향을 주는 요인으로 옳지 않은 것은?","choices":["명령자가 가까이 있고 합법적 권위자로 지각될 때","저명한 기관이 권위자를 지지할 때","저항하는 역할이 부재할 때","희생자가 가까이 있고 개별적으로 드러나 보일 때"],"answer":3,"explain":"드론 조종사가 실제 전투 참가자보다 PTSD가 적다(Miller, 2012) — 희생자와의 거리. 반대 — 희생자가 **멀리** 떨어져 있거나 **몰개성화**되어 있을 때 복종 ↑. (오답 ① 명령자가 가까이 있고 합법적 권위자로 지각될 때: 요인 ①(교수: 합법적 권위가 더 중요).)","src":"10장 p.19","diff":2,"wiki":"밀그램의 복종 실험","explainImg":"img/psy10-p19-slide.jpg"},{"id":"u10c-08","type":"tf","q":"밀그램의 복종 요인 중 특히 중요한 것은 명령자가 **합법적 권위자**로 지각되는 것이다.","explain":"p.19 교수 강조: 명령자의 근접성과 함께 '합법적 권위'가 더 중요하다.","src":"10장 p.19 🎙","wiki":"복종","prof":true,"answer":true,"explainImg":"img/psy10-p19-slide.jpg"},{"id":"u10c-09","type":"mc","q":"동조와 복종에 대한 설명으로 옳은 것은?","choices":["동조 실험의 대표는 밀그램, 복종 실험의 대표는 애쉬다","동조는 집단 기준에 맞추는 것이고, 복종은 권위자의 명령에 따르는 것이다","'예일대가 아닌 곳에서 하면 감소'는 동조가 쉬운 조건이다","동조와 복종은 모두 큰 요구에서 시작될 때 잘 일어난다"],"answer":1,"explain":"p.20 교훈: 행동에는 사회적 제어가 상당 부분 개입. p.15·p.18 정의. (오답 ① 동조 실험의 대표는 밀그램, 복종 실험의 대표는 애쉬다: 반대 — 동조 = 애쉬, 복종 = 밀그램.)","src":"10장 p.15–20","diff":2,"wiki":"복종","explainImg":"img/psy10-p15-slide.jpg"},{"id":"u10c-10","type":"tf","q":"동조는 권위자의 명령에 따르는 것이고, 복종은 집단 기준에 맞추는 것이다.","explain":"반대다. 동조 = **집단 기준**에 맞춤(애쉬), 복종 = **명령**에 따름(밀그램). 조건 7개 vs 요인 4개를 섞는 보기에 주의.","src":"10장 p.15–19","wiki":"복종","answer":false,"explainImg":"img/psy10-p15-slide.jpg"},{"id":"u10c-11","type":"cloze","q":"동조와 복종 연구의 교훈: 동조는 ___ 것에서 시작된다 — 문 안에 발 들여놓기처럼, 밀그램 실험도 낮은 ___ 부터 시작했다.","explain":"p.20: 기준과 타인의 기대가 갈등하면 다수는 타인의 기대에 맞춘다. 행동에는 사회적 제어가 상당 부분 개입한다.","src":"10장 p.20","wiki":"복종","answer":["작은","전압"],"bank":["작은","전압","큰","보상"],"explainImg":"img/psy10-p20-slide.jpg"},{"id":"u10c-12","type":"sa","q":"소수가 다수의 태도·행동을 유도하는 힘 (Moscovici, 1985). 사진: 나치 경례 군중 속 팔짱 낀 란트메서 — 명칭을 쓰시오.","answer":"소수자 영향력","alts":["저항하는 소수","소수자 영향력(저항하는 소수)"],"explain":"**소수자 영향력 (저항하는 소수)** — 소수가 다수의 태도·행동을 유도하는 힘 (Moscovici, 1985). 사진: 나치 경례 군중 속 팔짱 낀 란트메서","src":"10장 p.21","wiki":"소수자 영향력","explainImg":"img/psy10-p21-slide.jpg"},{"id":"u10c-13","type":"sa","q":"**저항하는 소수**·소수자 영향력 (1985) — 이 연구자(학자)는?","answer":"모스코비치","alts":["Moscovici","모스코비치(Moscovici)"],"explain":"**모스코비치 (Moscovici)** — **저항하는 소수**·소수자 영향력 (1985)","src":"10장 p.21","wiki":"소수자 영향력","explainImg":"img/psy10-p21-slide.jpg"},{"id":"u10c-14","type":"mc","q":"나치 경례를 하는 군중 속에서 홀로 팔짱을 낀 아우구스트 란트메서의 사진이 보여 주는 개념은?","choices":["몰개인화","저항하는 소수(소수자 영향력)","집단 극화","사회적 촉진"],"answer":1,"explain":"복종 요인 ④(저항하는 역할 부재)와 같은 맥락. p.21(Moscovici, 1985). 교수: 단 한 명이라도 있으면 하나의 변수. (오답 ① 몰개인화: 집단 속 자기억제 약화 — 반대 방향.)","src":"10장 p.21","diff":1,"prof":true,"wiki":"소수자 영향력","explainImg":"img/psy10-p21-slide.jpg"},{"id":"u10c-15","type":"match","q":"학자와 연구를 연결하시오","explain":"10장 학자–연구 짝. 교수가 수업에서 큰 모자 실험을 밀그램이라 말했지만 슬라이드는 짐바르도(1970)다.","src":"10장 p.11–26","wiki":"밀그램의 복종 실험","pairs":[["애쉬","선분 길이 동조 실험"],["밀그램","전기 충격 복종 실험"],["모스코비치","저항하는 소수"],["짐바르도","스탠포드 감옥 실험"],["재니스","집단 사고(피그스만 침공)"]],"explainImg":"img/psy10-p26-slide.jpg"},{"id":"u10c-16","type":"mc","q":"그림은 학습자에게 전기 충격을 주라는 지시를 따르는지 본 실험의 장치와 결과 그래프(전압 단계별 복종 비율)다. 결과로 옳은 것은?","explain":"**밀그램의 복종 실험**: 15V → 450V, 대다수가 끝까지 복종했다(사전에는 대부분 저항할 수 있다고 답함). 저항하는 역할이 있으면 복종이 줄어든다.","src":"10장 p.18","wiki":"밀그램의 복종 실험","choices":["대부분의 참가자가 최고 단계(450V)까지 지시에 따랐다","대부분이 중간 단계에서 거부했다","처음부터 지시를 따른 참가자는 거의 없었다","타인이 저항할수록 더 많은 사람이 끝까지 따랐다"],"answer":0,"img":"img/psy10-p18-milgram.png","imgAlt":"충격 발생기, 학습자 결박 장면, 전압이 오를수록 서서히 내려가는 복종 비율 그래프","explainImg":"img/psy10-p18-slide.jpg"}]},{"id":"u10d","title":"집단 속의 개인","intro":[{"title":"사회적 촉진 vs 사회적 태만","body":"**촉진** = 남이 지켜보면 수행↑ — 단 **쉬운 과제**만(어려운 과제는 오답↑). **태만** = 집단 공동 과제에서 노력↓(기여 과소평가, 책임감↓, 무임승차).","src":"10장 p.22–23"},{"title":"몰개인화","body":"**각성 + 익명성** → 자기억제 약화(훌리건, 온라인 혐오). 큰 모자로 신원을 가리면 더 센 충격(짐바르도, 1970).","src":"10장 p.24","img":"img/psy10-p24-hooligan.png","imgAlt":"훌리건 일러스트"},{"title":"집단 극화 vs 집단 사고","body":"**집단 극화** = 비슷한 사람끼리 → 태도가 더 극단. **집단 사고**(재니스) = 화합을 위해 반대 의견 억제 → 비현실적 만장일치(피그스만 침공). 예방 = **다양한 의견 수용**.","src":"10장 p.25–26"}],"items":[{"id":"u10d-01","type":"sa","q":"**타인의 존재**가 **수행 증진**을 유도 — 단, **쉬운 과제**에서. 어려운 과제는 오히려 오답 ↑ — 명칭을 쓰시오.","answer":"사회적 촉진","alts":["social facilitation"],"explain":"**사회적 촉진** — 원인: 타인의 존재로 인한 각성 — **타인의 존재**가 **수행 증진**을 유도 — 단, **쉬운 과제**에서. 어려운 과제는 오히려 오답 ↑","src":"10장 p.22","wiki":"사회적 촉진","explainImg":"img/psy10-p22-slide.jpg"},{"id":"u10d-02","type":"mc","q":"사회적 촉진에 대한 설명으로 옳은 것은?","choices":["타인이 있으면 과제 난이도와 관계없이 수행이 향상된다","집단 공동 과제에서 개인의 노력이 줄어드는 현상이다","익명성 때문에 자기억제가 약해지는 현상이다","타인이 있으면 쉬운 과제는 정확한 반응이 촉진되지만, 어려운 과제에서는 오답 반응이 강화된다"],"answer":3,"explain":"교수: '누군가의 존재가 항상 도움이 되는 건 아니다'. Guerin(1986) — 타인의 존재로 인한 각성. (오답 ① 타인이 있으면 과제 난이도와 관계없이 수행이 향상된다: 난이도와 상호작용한다.)","src":"10장 p.22","diff":2,"prof":true,"wiki":"사회적 촉진","explainImg":"img/psy10-p22-slide.jpg"},{"id":"u10d-03","type":"tf","q":"사회적 촉진에 따르면 타인이 있으면 어떤 과제든 수행이 좋아진다.","explain":"아니다. 쉬운 과제는 정확한 반응이 늘지만 **어려운 과제는 오답이 늘어난다**(Guerin). 교수: '누군가의 존재가 항상 도움이 되는 건 아니다'.","src":"10장 p.22 🎙","wiki":"사회적 촉진","prof":true,"answer":false,"explainImg":"img/psy10-p22-slide.jpg"},{"id":"u10d-04","type":"sa","q":"집단 공동 과제에서 타인의 존재로 인해 개인의 수행 노력이 감소하는 현상을 쓰시오.","answer":"사회적 태만","alts":["사회적태만","social loafing","사회적 빈둥거림"],"explain":"**사회적 태만** — 반대: 사회적 촉진.","src":"10장 p.23","diff":1,"wiki":"사회적 태만","explainImg":"img/psy10-p23-slide.jpg"},{"id":"u10d-05","type":"mc","q":"**사회적 태만**이 생기는 이유가 **아닌** 것은?","choices":["타인의 존재로 각성 수준이 높아져서","개인의 기여를 과소평가해서","자신의 기여도는 과대추정하고 타인의 노력은 평가절하해서","책임감이 감소하고 타인의 노력에 무임승차해서"],"answer":0,"explain":"교수: 사회적 태만 = 팀플을 싫어하게 되는 1순위. 각성은 **사회적 촉진**(그리고 몰개인화)의 설명이다. (오답 ② 개인의 기여를 과소평가해서: 옳다(Harkins & Szymanski).)","src":"10장 p.23","diff":2,"wiki":"사회적 태만","explainImg":"img/psy10-p23-slide.jpg"},{"id":"u10d-06","type":"sa","q":"각성과 익명성을 조장하는 집단 상황에서 자기억제가 약해지는 현상을 쓰시오.","answer":"몰개인화","alts":["몰개성화","deindividuation","탈개인화"],"explain":"**몰개인화** — 훌리건, 온라인 혐오 발언.","src":"10장 p.24","diff":1,"wiki":"몰개인화","explainImg":"img/psy10-p24-slide.jpg"},{"id":"u10d-07","type":"sa","q":"**큰 모자**(신원 은폐)를 쓴 사람이 더 센 전기 충격 — 몰개인화 (1970) — 이 연구자(학자)는?","answer":"짐바르도","alts":["Zimbardo","짐바르도(Zimbardo)"],"explain":"**짐바르도 (Zimbardo)** — 교수는 '밀그램의 연장선'이라 했지만 슬라이드 = Zimbardo","src":"10장 p.24","wiki":"몰개인화","explainImg":"img/psy10-p24-slide.jpg"},{"id":"u10d-08","type":"mc","q":"몰개인화에 대한 설명으로 옳은 것은?","choices":["타인의 존재가 각성만 일으켜 쉬운 과제 수행을 돕는 현상이다","신원을 드러낸 사람이 전기 충격 강도를 더 높였다","각성과 익명성을 조장하는 집단 상황에서 자기억제가 약해지는 현상으로, 각성과 책임감 감소가 동시에 작용한다","비슷한 사람끼리 소통하면 태도가 극단화되는 현상이다"],"answer":2,"explain":"예: 훌리건, 온라인 커뮤니티의 혐오 발언. 교수는 큰 모자 실험을 밀그램의 연장선이라 했지만 출처는 슬라이드 기준(Zimbardo). p.24. 교수: '동시에 작용'. (오답 ① 타인의 존재가 각성만 일으켜 쉬운 과제 수행을 돕는 현상이다: 사회적 촉진.)","src":"10장 p.24","diff":2,"wiki":"몰개인화","explainImg":"img/psy10-p24-slide.jpg"},{"id":"u10d-09","type":"cloze","q":"몰개인화는 사회적 촉진의 ___ 과 사회적 태만의 ___ 감소가 합쳐진 것으로 볼 수 있다.","explain":"촉진 = 남이 지켜볼 때(각성) 수행 ↑, 태만 = 기여가 묻힐 때 노력 ↓. 몰개인화 = 각성 + 익명성 → 자기억제 약화.","src":"10장 p.22–24","wiki":"몰개인화","answer":["각성","책임감"],"bank":["각성","책임감","익명성","동기","수행"],"explainImg":"img/psy10-p24-slide.jpg"},{"id":"u10d-10","type":"sa","q":"**유사한 성향**의 사람들과의 소통이 **기존 태도를 더욱 강화**하는 현상 — 양극단, 온라인에서 극심 — 명칭을 쓰시오.","answer":"집단 극화","alts":["group polarization","집단 극화(group polarization)"],"explain":"**집단 극화 (group polarization)** — **유사한 성향**의 사람들과의 소통이 **기존 태도를 더욱 강화**하는 현상 — 양극단, 온라인에서 극심","src":"10장 p.25","wiki":"집단 극화","explainImg":"img/psy10-p25-slide.jpg"},{"id":"u10d-11","type":"mc","q":"정치 성향이 비슷한 사람들만 모인 온라인 커뮤니티에서 시간이 갈수록 구성원들의 의견이 더 극단적으로 변했다. 이 현상은?","choices":["집단 사고","사회적 촉진","집단 극화","정보적 사회 영향"],"answer":2,"explain":"온라인 공간에서 특히 극심(Hills, 2019), 상대 집단 배타성으로 이어짐. 유사한 성향의 사람들과의 소통 → 기존 태도 강화(p.25). (오답 ① 집단 사고: 화합을 위해 **반대 의견을 억제**하는 만장일치형 의사결정 과정.)","src":"10장 p.25","diff":2,"wiki":"집단 극화","explainImg":"img/psy10-p25-slide.jpg"},{"id":"u10d-12","type":"sa","q":"좋은 집단 감정을 유지하려고 반대 견해를 억제하는, 비판·반론이 없는 만장일치형 사고 과정(재니스)을 쓰시오.","answer":"집단 사고","alts":["집단사고","groupthink","집단 순응 사고"],"explain":"**집단 사고** — 피그스만 침공.","src":"10장 p.26","diff":1,"wiki":"집단 사고","explainImg":"img/psy10-p26-slide.jpg"},{"id":"u10d-13","type":"sa","q":"**집단 사고** (1982) — 피그스만 침공 — 이 연구자(학자)는?","answer":"재니스","alts":["Janis","재니스(Janis)"],"explain":"**재니스 (Janis)** — **집단 사고** (1982) — 피그스만 침공","src":"10장 p.26","wiki":"집단 사고","explainImg":"img/psy10-p26-slide.jpg"},{"id":"u10d-14","type":"mc","q":"집단 사고에 대한 설명으로 옳지 않은 것은?","choices":["집단의 의사결정은 항상 나쁜 결과를 낳는다","재니스(1982)가 제시한, 비판·반론이 제기되지 않는 만장일치형 사고 과정이다","구성원들이 좋은 집단 감정을 유지하려고 반대 견해를 억제한다","피그스만 침공은 집단 사고의 예로 제시된다"],"answer":0,"explain":"관건 = 얼마나 자유롭게 반대 의견을 내놓을 수 있는가. 교수: 소수 의견까지 수용할 준비. 반드시 그렇지는 않다 — 반례 **마셜 플랜**. (오답 ② 재니스(1982)가 제시한, 비판·반론이 제기되지 않는 만장일치형 사고 과정이다: 옳다.)","src":"10장 p.26","diff":2,"wiki":"집단 사고","explainImg":"img/psy10-p26-slide.jpg"},{"id":"u10d-15","type":"tf","q":"피그스만 침공은 집단 사고의 사례이고, 마셜 플랜은 집단 결정이 좋았던 반례다.","explain":"맞다 — 피그스만 침공은 **집단 사고**(재니스)의 사례다(집단 극화가 아님). 집단 결정이 좋았던 반례는 마셜 플랜.","src":"10장 p.26","wiki":"집단 사고","answer":true,"explainImg":"img/psy10-p26-slide.jpg"},{"id":"u10d-16","type":"tf","q":"집단 사고를 예방하려면 다양한 의견(자유로운 반대 의견)을 수용해야 한다.","explain":"p.26 교수 강조: 집단 극화와 집단 사고를 가르는 관건은 자유로운 반대 의견이다.","src":"10장 p.26 🎙","wiki":"집단 사고","prof":true,"answer":true,"explainImg":"img/psy10-p26-slide.jpg"},{"id":"u10d-17","type":"sa","q":"그림의 훌리건처럼 **각성**과 **익명성**을 조장하는 집단 상황에서 자기억제가 약해지는 현상의 명칭을 쓰시오.","explain":"**몰개인화** = 촉진의 각성 + 태만의 책임감 감소. 큰 모자로 신원을 가린 사람이 더 센 충격을 줬다(짐바르도, 1970). 온라인 혐오 언사도 같은 이유.","src":"10장 p.24","wiki":"몰개인화","answer":"몰개인화","alts":["몰개성화","deindividuation","탈개인화"],"img":"img/psy10-p24-hooligan.png","imgAlt":"방망이를 든 축구 훌리건 일러스트","explainImg":"img/psy10-p24-slide.jpg"}]},{"id":"u10e","title":"편견과 공격성","intro":[{"title":"편견","body":"다른 집단에 대한 **부정적 태도**. 3요소: 부정적 정서 · 고정관념 · 차별 성향. 암묵적 편견 = 무의식적 집단 연합 · 반사적 신체 반응 · 무의식적 후원.","src":"10장 p.27"},{"title":"편견의 뿌리","body":"사회적 불평등(**공평한 세상 현상** — SES 높은 사람, **희생자 비난하기**) / 내집단 편향(차별의 주된 경로) / 부정적 정서(**희생양 이론**) / 인지적 지름길(**외집단 동질성**, **다른 인종 효과**).","src":"10장 p.29–32"},{"title":"공격성","body":"해치려는 의도의 행동. 생물: MAOA 발현율 **낮음**, 전두엽 손상, 테스토스테론·알코올. 심리·사회: 혐오 사건(고온 등), **좌절-공격성 연계**(홈런 맞은 투수의 데드볼), 매체의 **사회 스크립트**.","src":"10장 p.33–35"}],"items":[{"id":"u10e-01","type":"mc","q":"편견의 3요소에 해당하지 않는 것은?","choices":["부정적 정서","고정관념","차별 성향","무의식적 후원"],"answer":3,"explain":"편견 = 부정적 정서 + 고정관념 + 차별 성향. 암묵적 편견 = 무의식적 집단 연합 · 반사적 신체 반응 · 무의식적 후원. **암묵적 편견**의 한 형태(p.27)이지 3요소가 아니다. (오답 ① 부정적 정서: 3요소.)","src":"10장 p.27","diff":2,"wiki":"편견","explainImg":"img/psy10-p27-slide.jpg"},{"id":"u10e-02","type":"cloze","q":"편견의 3요소: 부정적 ___ (공포) · ___ (일반화된 부정적 믿음) · 차별 성향","explain":"편견 = 속성이 다른 집단에 대한 부정적 태도. 무의식적 후원은 3요소가 아니라 암묵적 편견의 한 형태다.","src":"10장 p.27","wiki":"편견","answer":["정서","고정관념"],"bank":["정서","고정관념","기억","귀인","동기"],"explainImg":"img/psy10-p27-slide.jpg"},{"id":"u10e-03","type":"sa","q":"세상은 공평해서 모든 사람은 그에 걸맞는 것을 받는다고 믿는 경향을 쓰시오.","answer":"공평한 세상 현상","alts":["공정한 세상 현상","just-world phenomenon","공평한 세상 가설","공정한 세상 가설","공평한 세상"],"explain":"**공평한 세상 현상** — SES 높은 사람(🖍).","src":"10장 p.29","diff":1,"wiki":"공평한 세상 현상","explainImg":"img/psy10-p29-slide.jpg"},{"id":"u10e-04","type":"mc","q":"공평한 세상 현상에 대한 설명으로 옳은 것은?","choices":["사회경제적 지위가 낮은 사람들이 주로 보인다","사회경제적 지위가 높은 사람들이 주로 보이며, 불평등을 합리화하는 데 이용된다","세상은 불공평하므로 누구도 걸맞은 것을 받지 못한다고 믿는 경향이다","후견 편향을 토대로 차별 대상자에게 원인이 있다고 단정하는 것이다"],"answer":1,"explain":"그림: 큰 물고기일수록 '세상은 공평해'. p.29 🖍. 교수: '이름이랑은 다르게'. (오답 ① 사회경제적 지위가 낮은 사람들이 주로 보인다: **높은** 사람들.)","src":"10장 p.29","diff":2,"prof":true,"wiki":"공평한 세상 현상","explainImg":"img/psy10-p29-slide.jpg"},{"id":"u10e-05","type":"tf","q":"공평한 세상 현상은 주로 사회경제적 지위가 낮은 사람들이 보인다.","explain":"아니다 — **SES가 높은** 사람(슬라이드 형광펜). 교수: '이름이랑은 다르게'. 불평등 합리화에 이용된다.","src":"10장 p.29 🎙","wiki":"공평한 세상 현상","prof":true,"answer":false,"explainImg":"img/psy10-p29-slide.jpg"},{"id":"u10e-06","type":"sa","q":"**후견 편향**을 토대로 차별 대상자에게 **차별의 원인이 있다**고 단정 (Allport, 1954) — 명칭을 쓰시오.","answer":"희생자 비난하기","alts":["희생자 비난","victim blaming"],"explain":"**희생자 비난하기** — **후견 편향**을 토대로 차별 대상자에게 **차별의 원인이 있다**고 단정 (Allport, 1954)","src":"10장 p.29","wiki":"공평한 세상 현상","explainImg":"img/psy10-p29-slide.jpg"},{"id":"u10e-07","type":"mc","q":"편견에 의한 차별의 **주된 경로**는?","choices":["외집단에 대한 적개심","사회적 태만","단순 노출 효과","내집단 편향"],"answer":3,"explain":"교수: '팔은 안으로 굽는다'. 우리/그들 구분은 결속을 다지지만 편견의 가장 큰 요인. 외집단 적개심보다 **내집단 편향**을 통한 차별이 주요(Romano et al., 2017). (오답 ① 외집단에 대한 적개심: 슬라이드는 이것보다 내집단 편향이 주요하다고 했다.)","src":"10장 p.30","diff":2,"wiki":"내집단 편향","explainImg":"img/psy10-p30-slide.jpg"},{"id":"u10e-08","type":"sa","q":"편견이 **비난의 대상**을 설정해 **분노의 배출구**를 제공한다는 이론 (경제 하강기 차별 ↑, 좌절 → 남 비난으로 자존감 회복) — 명칭을 쓰시오.","answer":"희생양 이론","alts":["scapegoat theory"],"explain":"**희생양 이론** — 편견이 **비난의 대상**을 설정해 **분노의 배출구**를 제공한다는 이론 (경제 하강기 차별 ↑, 좌절 → 남 비난으로 자존감 회복)","src":"10장 p.31","wiki":"희생양 이론","explainImg":"img/psy10-p31-slide.jpg"},{"id":"u10e-09","type":"sa","q":"외집단 일원들의 **유사성을 과대추정**해 '다 똑같다'고 보는 인식 — 명칭을 쓰시오.","answer":"외집단 동질성","alts":["외집단 동질성 효과","outgroup homogeneity"],"explain":"**외집단 동질성** — 외집단 일원들의 **유사성을 과대추정**해 '다 똑같다'고 보는 인식","src":"10장 p.32","wiki":"외집단 동질성","explainImg":"img/psy10-p32-slide.jpg"},{"id":"u10e-10","type":"sa","q":"자신이 속한 인종의 얼굴을 더 잘 재인하는 현상을 쓰시오.","answer":"다른 인종 효과","alts":["타인종 효과","other-race effect","다른인종효과","다른 인종 효과(other-race effect)"],"explain":"**다른 인종 효과** — 인지적 지름길(외집단 동질성).","src":"10장 p.32","diff":1,"wiki":"외집단 동질성","explainImg":"img/psy10-p32-slide.jpg"},{"id":"u10e-11","type":"match","q":"편견의 뿌리와 예를 연결하시오","explain":"p.29–32 편견의 뿌리 4가지. 가용성 발견법도 인지적 지름길에 속한다.","src":"10장 p.29–32","wiki":"편견","pairs":[["사회적 불평등","공평한 세상 현상·희생자 비난하기"],["내집단·외집단","내집단 편향"],["부정적 정서","희생양 이론"],["인지적 지름길","외집단 동질성·다른 인종 효과"]],"explainImg":"img/psy10-p32-slide.jpg"},{"id":"u10e-12","type":"mc","q":"공격성의 생물학적 소인에 대한 설명으로 옳은 것은?","choices":["MAOA 발현율이 높을수록 공격성이 높다","알코올은 판단과 억제를 담당하는 두뇌 활동을 촉진한다","전두엽의 손상이나 미성숙은 공격성이 나타날 가능성을 높인다","테스토스테론은 공격성과 관련이 없다"],"answer":2,"explain":"유전(MAOA 낮음) · 신경(전두엽) · 생화학(테스토스테론·알코올). p.33 신경적 요인(Raine). (오답 ① MAOA 발현율이 높을수록 공격성이 높다: **낮으면** 공격성 ↑.)","src":"10장 p.33","diff":2,"wiki":"공격성","explainImg":"img/psy10-p33-slide.jpg"},{"id":"u10e-13","type":"tf","q":"MAOA 유전자의 발현율이 낮으면 공격성이 높아진다.","explain":"맞다 — 발현율이 **낮으면** 공격성이 높아진다(Tiihonen). 생물학적 소인: 유전(MAOA)·신경(전두엽)·생화학(테스토스테론·알코올).","src":"10장 p.33","wiki":"공격성","answer":true,"explainImg":"img/psy10-p33-slide.jpg"},{"id":"u10e-14","type":"sa","q":"어떤 사건으로 생긴 **좌절이 분노**를 초래하고 곧 **공격 행동**으로 이어진다는 원리 — 명칭을 쓰시오.","answer":"좌절-공격성 연계","alts":["좌절-공격성 원리","좌절 공격 가설","frustration-aggression principle"],"explain":"**좌절-공격성 연계** — 홈런 맞은 투수의 데드볼 — 어떤 사건으로 생긴 **좌절이 분노**를 초래하고 곧 **공격 행동**으로 이어진다는 원리","src":"10장 p.34","wiki":"좌절-공격성 연계","explainImg":"img/psy10-p34-slide.jpg"},{"id":"u10e-15","type":"mc","q":"이전 타자에게 홈런을 맞은 투수가 다음 타자에게 데드볼을 던질 확률이 높아진다. 이를 설명하는 원리는?","choices":["좌절-공격성 연계","사회적 촉진","호혜성 규범","단순 노출 효과"],"answer":0,"explain":"혐오 사건(고온)도 사구 비율을 높인다(Larrick et al., 2011). 좌절 → 분노 → 공격 행동(p.34). (오답 ② 사회적 촉진: 타인의 존재로 수행 증진.)","src":"10장 p.34","diff":1,"wiki":"좌절-공격성 연계","explainImg":"img/psy10-p34-slide.jpg"},{"id":"u10e-16","type":"sa","q":"대중 매체가 전달하는, 다양한 상황에서 **어떻게 행동할지에 대한 지침** — 명칭을 쓰시오.","answer":"사회 스크립트","alts":["사회적 스크립트","social script"],"explain":"**사회 스크립트** — 강화와 모델링(5장 관찰 학습) — 대중 매체가 전달하는, 다양한 상황에서 **어떻게 행동할지에 대한 지침**","src":"10장 p.35","wiki":"공격성","explainImg":"img/psy10-p35-slide.jpg"}]},{"id":"u10f","title":"매력·사랑·이타심·평화","intro":[{"title":"매력","body":"근접성(**단순 노출 효과** — 나는 거울상, 남은 실제 얼굴을 선호) → 외모 → 유사성 → **보상 이론**(나를 좋아한다는 걸 알기만 해도).","src":"10장 p.36–39"},{"title":"열정애와 동료애","body":"**열정애** = 일시적·강렬, 신체 각성 + 인지 평가(2요인). **동료애** = 성숙·안정, 형평성·자기 노출·지지.","src":"10장 p.40–41"},{"title":"방관자 효과","body":"주변 사람이 많을수록 책임감이 줄어 돕지 않는다. 도움까지: 사건을 알아차림 → 비상사태로 해석 → 책임을 느낌 → 도움(하나라도 아니면 돕지 않음).","src":"10장 p.42","img":"img/psy10-p42-bystander.png","imgAlt":"주변인 수에 따른 도움 비율 그래프와 의사결정 흐름도"},{"title":"도움의 이유와 평화","body":"**사회 교환 이론**(비용·이득 계산) · **호혜성 규범**(받은 만큼 돌려줌) · **사회적 책임 규범**(손해여도 도와야 할 사람은 도움). 갈등 해소: 접촉 · 협동(**상위 목표**) · 소통 · 화해(점증적이고 상보적 주도권).","src":"10장 p.43–44"}],"items":[{"id":"u10f-01","type":"sa","q":"자극에 대한 반복적 노출이 그 대상에 대한 호감도를 증가시키는 현상을 쓰시오.","answer":"단순 노출 효과","alts":["단순노출효과","mere exposure effect","단순 노출"],"explain":"**단순 노출 효과** — 근접성.","src":"10장 p.36","diff":1,"wiki":"단순 노출 효과","explainImg":"img/psy10-p36-slide.jpg"},{"id":"u10f-02","type":"mc","q":"단순 노출 효과에 대한 설명으로 옳은 것은?","choices":["본인도 자기 얼굴의 실제 이미지를 더 선호한다","본인은 자기 얼굴의 거울상을, 타인은 실제 이미지를 더 선호한다","사람 얼굴에만 적용되고 음악·도형에는 적용되지 않는다","친숙성에 기반한 선호는 성인이 되어야 나타난다"],"answer":1,"explain":"근접성(proximity)의 핵심. 8장 자이언스(역치 하 반복 → 선호)와 연결. p.36 — 각자 더 자주 본 쪽을 선호. (오답 ① 본인도 자기 얼굴의 실제 이미지를 더 선호한다: 본인은 **거울상**.)","src":"10장 p.36","diff":2,"wiki":"단순 노출 효과","explainImg":"img/psy10-p36-slide.jpg"},{"id":"u10f-03","type":"mc","q":"매력의 심리학에 대한 설명으로 옳지 않은 것은?","choices":["외모는 근접성이 충족된 뒤 첫인상에 가장 큰 영향을 준다","실제로 비슷한 점이 있으면 차이를 지각하더라도 유사성의 효과는 유지된다","누군가가 나를 좋아한다는 것을 아는 것만으로도 호감이 생길 수 있다","인터넷에서 형성된 관계는 현실 기반 관계보다 더 오래 지속될 가능성이 높다"],"answer":1,"explain":"오래 사귄 연인은 외모가 덜 중요(Hunt). 차이를 **지각**하면 유사성의 효과가 **상실**된다(얼룩말 만화). (오답 ① 외모는 근접성이 충족된 뒤 첫인상에 가장 큰 영향을 준다: 옳다(Eastwick).)","src":"10장 p.37–39","diff":2,"wiki":"매력의 심리학","explainImg":"img/psy10-p39-slide.jpg"},{"id":"u10f-04","type":"sa","q":"**일시적이고 강렬한** 사랑 — 갈망·집착 뇌 영역, **신체 각성 + 인지 평가**(2요인)로 설명 — 명칭을 쓰시오.","answer":"열정애","alts":["passionate love","열정애(passionate love)"],"explain":"**열정애 (passionate love)** — Hatfield. 2요인 이론 원조는 8장 샥터-싱어","src":"10장 p.40","wiki":"열정애","explainImg":"img/psy10-p40-slide.jpg"},{"id":"u10f-05","type":"sa","q":"열정애가 **성숙해진 안정적** 형태의 사랑 — 형평성·자기 노출·긍정적 지지 — 명칭을 쓰시오.","answer":"동료애","alts":["companionate love","동료애(companionate love)"],"explain":"**동료애 (companionate love)** — 열정애가 **성숙해진 안정적** 형태의 사랑 — 형평성·자기 노출·긍정적 지지","src":"10장 p.41","wiki":"동료애","explainImg":"img/psy10-p41-slide.jpg"},{"id":"u10f-06","type":"mc","q":"열정애와 동료애에 대한 설명으로 옳은 것은?","choices":["동료애는 일시적이고 강렬한 형태의 사랑이다","대인관계는 동료애 → 열정애 → 우정 순으로 변천한다","자기 노출은 동료애를 약하게 만든다","열정애는 신체 각성과 인지 평가의 2요인 이론으로 설명할 수 있다"],"answer":3,"explain":"동료애 요건(교수): 형평성 · 자기 노출 · 긍정적 지지. p.40(Hatfield). 교수: 8장 샥터-싱어의 2요인 이론. (오답 ① 동료애는 일시적이고 강렬한 형태의 사랑이다: 그것은 **열정애**. 동료애 = 성숙·안정.)","src":"10장 p.40–41","diff":2,"prof":true,"wiki":"열정애","explainImg":"img/psy10-p40-slide.jpg"},{"id":"u10f-07","type":"sa","q":"주변에 사람이 많을수록 책임감이 감소하여 비상 상황에 개입하지 않는 현상을 쓰시오.","answer":"방관자 효과","alts":["bystander effect","방관자효과","구경꾼 효과"],"explain":"**방관자 효과** — 단답형은 '사회적 태만'이 아니라 이 이름.","src":"10장 p.42","diff":1,"wiki":"방관자 효과","explainImg":"img/psy10-p42-slide.jpg"},{"id":"u10f-08","type":"mc","q":"방관자 효과에 대한 설명으로 옳은 것은?","choices":["주변에 사람이 많을수록 책임감이 감소해 비상 상황에 개입하지 않는다","주변에 사람이 많을수록 도울 확률이 높아진다","도움 여부를 결정하는 가장 큰 요인은 피해자의 외모다","긍정적 정서는 도움 행동과 관련이 없다"],"answer":0,"explain":"교수: CPR 상황에서 주변 사람 중 한 명을 지목하는 이유. 현상 이름은 방관자 효과(교수가 '사회적 태만으로 인해서'라고 한 것은 설명일 뿐). p.42. (오답 ② 주변에 사람이 많을수록 도울 확률이 높아진다: 반대 — 0명 ≈ 85% → 4명 ≈ 30%.)","src":"10장 p.42","diff":1,"prof":true,"wiki":"방관자 효과","explainImg":"img/psy10-p42-slide.jpg"},{"id":"u10f-09","type":"order","q":"비상 상황에서 이타적 행동(도움)이 일어나기까지의 의사결정 과정을 순서대로 놓으시오","explain":"하나라도 '아니요'면 돕지 않는다. 주변 사람이 많을수록 책임을 덜 느낀다(0명 ≈ 85% → 4명 ≈ 30%).","src":"10장 p.42 🎙","wiki":"방관자 효과","prof":true,"answer":["사건을 알아차림","비상사태로 해석","책임을 느낌","도움"],"explainImg":"img/psy10-p42-slide.jpg"},{"id":"u10f-10","type":"tf","q":"주변 사람이 많을수록 책임감이 줄어 비상 상황에 개입하지 않는 현상의 명칭은 '사회적 태만'이다.","explain":"슬라이드 명칭은 **방관자 효과**다. 교수가 수업에서 섞어 말했지만 시험은 슬라이드 기준.","src":"10장 p.42","wiki":"방관자 효과","answer":false,"explainImg":"img/psy10-p42-slide.jpg"},{"id":"u10f-11","type":"sa","q":"**비용과 이득의 계산**을 통해 도움 행동이 결정된다는 관점 — 명칭을 쓰시오.","answer":"사회 교환 이론","alts":["사회적 교환 이론","social exchange theory"],"explain":"**사회 교환 이론** — **비용과 이득의 계산**을 통해 도움 행동이 결정된다는 관점","src":"10장 p.43","wiki":"사회 교환 이론","explainImg":"img/psy10-p43-slide.jpg"},{"id":"u10f-12","type":"sa","q":"자신에게 도움을 준 이에게 **도움을 되돌려준다** — 호의에는 호의로 — 명칭을 쓰시오.","answer":"호혜성 규범","alts":["상호성 규범","reciprocity norm"],"explain":"**호혜성 규범** — 자신에게 도움을 준 이에게 **도움을 되돌려준다** — 호의에는 호의로","src":"10장 p.43","wiki":"호혜성 규범","explainImg":"img/psy10-p43-slide.jpg"},{"id":"u10f-13","type":"mc","q":"'비용이 이득보다 크더라도 어린아이처럼 마땅히 도와야 할 사람은 도와야 한다'는 생각에 해당하는 것은?","choices":["사회 교환 이론","호혜성 규범","사회적 책임 규범","정보적 사회 영향"],"answer":2,"explain":"교수: 세 관점 모두 어느 정도 설득력 / 이타주의 = 이기주의의 다른 형태라는 시각도. 비용이 이득을 상회해도 도와야 한다는 기대(p.43). (오답 ① 사회 교환 이론: 비용·이득 **계산**으로 결정 — 이득 > 비용일 때 돕는다.)","src":"10장 p.43","diff":2,"wiki":"사회적 책임 규범","explainImg":"img/psy10-p43-slide.jpg"},{"id":"u10f-14","type":"match","q":"상황과 도움 행동의 관점을 연결하시오","explain":"사회 교환 = 비용·이득 계산, 호혜성 = 호의에는 호의로, 사회적 책임 = 비용이 이득을 넘어도 도와야 할 사람은 돕는다.","src":"10장 p.42–43","wiki":"사회 교환 이론","pairs":[["도우면 나중에 나에게 득이 되겠지","사회 교환 이론"],["지난번에 나를 도와줬으니까","호혜성 규범"],["손해여도 아이·노인은 당연히 도와야지","사회적 책임 규범"],["사람이 많으니 누군가 돕겠지","방관자 효과"]],"explainImg":"img/psy10-p43-slide.jpg"},{"id":"u10f-15","type":"sa","q":"집단 갈등을 해소하고 단결력을 높이는, **함께 협력해야 달성되는 공동의 목표** — 명칭을 쓰시오.","answer":"상위 목표","alts":["superordinate goal","상위 목표(superordinate goal)"],"explain":"**상위 목표 (superordinate goal)** — 플로리다 해변 인간 사슬 — 집단 갈등을 해소하고 단결력을 높이는, **함께 협력해야 달성되는 공동의 목표**","src":"10장 p.44","wiki":"상위 목표","explainImg":"img/psy10-p44-slide.jpg"},{"id":"u10f-16","type":"mc","q":"집단 간 갈등 해소와 평화적 관계 구축 방법에 대한 설명으로 옳지 않은 것은?","choices":["접촉은 지위가 불평등한 당사자들 사이의 일시적 만남일 때 가장 효과적이다","공동의 상위 목표는 집단 내 갈등을 해소하고 단결력을 높인다","필요하면 제3의 중재자를 통해 호혜적 해결 방안을 찾는다","한쪽이 긴장 완화 의도를 천명하면 상대방이 응하는 점증적이고 상보적 주도권이 화해에 필요하다"],"answer":0,"explain":"접촉 · 협동(상위 목표) · 소통 · 화해. 예: 플로리다 해변 인간 사슬 = 상위 목표. **동등한 지위**의 당사자들 간의 **지속적** 접촉(Paluck et al., 2018). (오답 ② 공동의 상위 목표는 집단 내 갈등을 해소하고 단결력을 높인다: 옳다 — 협동.)","src":"10장 p.44","diff":2,"wiki":"상위 목표","explainImg":"img/psy10-p44-slide.jpg"},{"id":"u10f-17","type":"tf","q":"그래프처럼, 자기 말고도 도울 것이라고 생각되는 사람의 수가 많을수록 실제로 돕는 비율은 높아진다.","explain":"반대다. 0명일 때 약 85%였던 도움 비율이 4명이면 약 30%로 떨어진다 — **방관자 효과**(사람이 많을수록 책임감 감소).","src":"10장 p.42","wiki":"방관자 효과","answer":false,"img":"img/psy10-p42-graph.png","imgAlt":"도울 것으로 생각한 다른 사람 수(0~4)에 따라 돕는 비율이 내려가는 그래프","explainImg":"img/psy10-p42-slide.jpg"}]}]},{"id":"u1s","title":"1장 통계적 추리 (+ 연구 설계)","desc":"기술통계 · 변산성·정규분포 · 추론통계·p-value · 연구 과정 · 상관과 실험","lessons":[{"id":"u1sa","title":"통계적 추리와 집중 경향","intro":[{"title":"통계적 추리","body":"모집단(전체)에서 뽑은 **표본**의 결과를 모집단에 적용해도 되는지, 데이터의 효과가 진짜인지 통계로 검증. 그래프 축만 바꿔도 차이가 커 보이니 있는 그대로 해석하면 안 된다.","src":"1장 p.30"},{"title":"기술통계 vs 추론통계","body":"**기술통계** = 데이터를 요약·체제화. **추론통계** = 관찰된 차이가 유의한지 검정.","src":"1장 p.30"},{"title":"집중 경향 측정치","body":"데이터를 단일 점수로 요약: **최빈값**(가장 자주 나온 값) · **평균**(총합 ÷ 샘플 수, 극단치에 **왜곡**됨) · **중앙값**(서열상 50% 지점). 평균이 최빈값보다 크게 올라가 있으면 극단치를 의심.","src":"1장 p.31","img":"img/psy1-p31-skew.png","imgAlt":"가구당 수입 분포 — 최빈값 40, 중앙값 60, 평균 140(천 달러)"}],"items":[{"id":"u1sa-01","type":"sa","q":"모집단의 일부(표본)에서 얻은 데이터 결과를 모집단에도 적용할 수 있는지, 데이터에 나타난 효과의 진실성을 통계 분석으로 탐구하는 것 — 명칭을 쓰시오.","explain":"1장 p.30 제목. 교수: 데이터를 있는 그대로 해석하는 건 올바른 접근이 아니며, 관찰된 차이가 실제 의미가 있는지 검증하는 과정이 통계적 추리다.","src":"1장 p.30","answer":"통계적 추리","alts":["통계 추리","통계적추론","통계적 추론"],"wiki":"추론통계","explainImg":"img/psy1-p30-slide.jpg"},{"id":"u1sa-02","type":"sa","q":"연구 결과를 적용하려는 전체 집단(예: 전 세계 인구)을 무엇이라 하는가?","explain":"현대 심리학은 모집단에서 일부(표본)를 뽑아 데이터를 수집한다. 그래서 표본의 결과를 모집단에 적용할 수 있는지가 문제가 된다.","src":"1장 p.30, 21","answer":"모집단","alts":["population"],"wiki":"통계적 추리","explainImg":"img/psy1-p30-slide.jpg"},{"id":"u1sa-03","type":"sa","q":"모집단에서 뽑아 실제로 데이터를 수집하는 일부 대상을 무엇이라 하는가?","explain":"표본은 모집단을 잘 대표해야 한다(무선 표집). 표본 수가 많아도 대표성이 없으면 바람직한 표본이 아니다.","src":"1장 p.30, 21","wiki":"무선 표집","answer":"표본","alts":["sample","샘플"],"explainImg":"img/psy1-p30-slide.jpg"},{"id":"u1sa-04","type":"mc","q":"자사 브랜드의 10년 가동률 그래프가 y축 바닥이 95%일 때는 압도적으로 좋아 보였지만, 0% 기준으로 다시 그리자 차이가 거의 없었다. 이 예가 보여 주는 것은?","explain":"교수: 「이 차이가 실제 의미가 있는 것인지를 검증하는 과정이 통계적 추리」. 극단치 왜곡은 평균의 함정(p.31) 이야기로 다른 맥락이다.","src":"9/1 녹음 2:03:05","choices":["데이터를 있는 그대로 해석하지 말고, 관찰된 차이가 실제 의미가 있는지 검증해야 한다","그래프는 항상 0%에서 시작해야 통계적으로 유의하다","평균은 극단치에 의해 왜곡된다","표본 수가 많을수록 차이가 커진다"],"answer":0,"wiki":"P-value","explainImg":"img/psy1-p30-slide.jpg"},{"id":"u1sa-05","type":"sa","q":"데이터를 요약하고 의미 있게 체제화하는 통계 — 명칭을 쓰시오.","explain":"통계적 추리의 두 갈래: 기술통계(요약·체제화) + 추론통계(차이가 유의한지 검정).","src":"1장 p.30","answer":"기술통계","alts":["기술 통계","descriptive statistics"],"wiki":"기술통계","explainImg":"img/psy1-p30-slide.jpg"},{"id":"u1sa-06","type":"sa","q":"데이터에서 수집된 차이가 유의한지 검정하는 통계 — 명칭을 쓰시오.","explain":"추론통계는 표본 결과로 모집단 특성을 추정(일반화)하고, 관찰된 차이가 우연이 아님을 검증한다.","src":"1장 p.30, 33","answer":"추론통계","alts":["추론 통계","inferential statistics","추리통계"],"wiki":"P-value","explainImg":"img/psy1-p30-slide.jpg"},{"id":"u1sa-07","type":"match","q":"용어와 설명을 연결하시오","explain":"p.30 통계적 추리의 필요성: 기술통계로 요약하고, 추론통계로 차이의 유의성을 검정한다.","src":"1장 p.30","pairs":[["기술통계","데이터를 요약·체제화"],["추론통계","차이가 유의한지 검정"],["모집단","결과를 적용하려는 전체"],["표본","실제 데이터를 수집한 일부"]],"wiki":"P-value","explainImg":"img/psy1-p30-slide.jpg"},{"id":"u1sa-08","type":"sa","q":"수집된 데이터를 단일 점수로 정리·요약해 자료의 특성을 설명하는 기술통계 측정치 — 명칭을 쓰시오.","explain":"집중 경향 측정치 = 최빈값·평균·중앙값. 퍼진 정도를 보여 주는 것은 변산성 측정치(p.32)다.","src":"1장 p.31","answer":"집중 경향 측정치","alts":["집중 경향","집중경향 측정치","central tendency","중심 경향 측정치"],"wiki":"집중 경향 측정치","explainImg":"img/psy1-p31-slide.jpg"},{"id":"u1sa-09","type":"sa","q":"자료 내에서 가장 자주 보고된 값 — 명칭을 쓰시오.","explain":"집중 경향 측정치 3가지 중 하나. 교수: 이름 그대로 가장 자주 보고되는 값.","src":"1장 p.31","answer":"최빈값","alts":["mode","최빈치"],"wiki":"집중 경향 측정치","explainImg":"img/psy1-p31-slide.jpg"},{"id":"u1sa-10","type":"sa","q":"분포된 자료를 서열로 세웠을 때 50% 지점(중앙)에 위치한 값 — 명칭을 쓰시오.","explain":"교수: 데이터 포인트를 일렬로 세워 딱 50% 지점에 오는 값.","src":"1장 p.31","answer":"중앙값","alts":["median","중앙치","중간값"],"wiki":"집중 경향 측정치","explainImg":"img/psy1-p31-slide.jpg"},{"id":"u1sa-11","type":"mc","q":"집중 경향 측정치 중 **평균**에 대한 설명으로 옳은 것은?","explain":"평균 = 자료의 총합 ÷ 샘플 수이며, 비전형적 점수(극단치)로 왜곡될 수 있다. ②는 중앙값, ③은 최빈값, ④는 범위(변산성 측정치).","src":"1장 p.31","choices":["비전형적 점수로 인해 왜곡될 수 있다","서열상 50% 지점에 위치한 값이다","자료 내에서 가장 자주 보고된 값이다","최저 점수와 최고 점수의 차이다"],"answer":0,"wiki":"집중 경향 측정치","explainImg":"img/psy1-p31-slide.jpg"},{"id":"u1sa-12","type":"mc","q":"가구당 수입 조사에서 대다수 가구가 10만 달러 미만인데 평균은 14만 달러였다. 그 이유로 가장 적절한 것은?","explain":"교수: '평균의 함정 — 평균은 극단치에 의해 왜곡될 수 있다'. 그래서 분포 양상을 함께 봐야 한다.","src":"1장 p.31 · 9/1 녹음 2:05:54","wiki":"집중 경향 측정치","prof":true,"choices":["오른쪽 끝의 소수 가구(극단치)가 평균을 끌어올렸다","표본이 너무 커서 평균이 커졌다","최빈값이 평균보다 항상 크기 때문이다","중앙값을 잘못 계산했기 때문이다"],"answer":0,"explainImg":"img/psy1-p31-slide.jpg"},{"id":"u1sa-13","type":"tf","q":"평균이 최빈값보다 크게 올라가 있다면 극단치가 있을 가능성이 있다.","explain":"교수: 최빈값 대비 평균이 많이 올라갔다면 극단치가 있을 가능성, 최빈값·중앙값이 평균과 비슷하면 극단치 가능성이 낮다.","src":"9/1 녹음 2:06:54","answer":true,"wiki":"집중 경향 측정치","explainImg":"img/psy1-p31-slide.jpg"},{"id":"u1sa-14","type":"cloze","q":"집중 경향 측정치는 ___ · ___ · 중앙값 세 가지다.","explain":"표준 편차와 범위는 변산성 측정치다.","src":"1장 p.31","answer":["최빈값","평균"],"bank":["최빈값","평균","표준 편차","범위","P-value"],"wiki":"집중 경향 측정치","explainImg":"img/psy1-p31-slide.jpg"},{"id":"u1sa-15","type":"tf","q":"집중 경향 측정치는 자료 값들이 얼마나 넓게 퍼져 있는지를 보여 주는 값이다.","explain":"퍼진 정도는 **변산성 측정치**(범위·표준 편차)다. 집중 경향 측정치는 데이터를 단일 점수로 요약한다.","src":"1장 p.31–32","answer":false,"wiki":"집중 경향 측정치","explainImg":"img/psy1-p32-slide.jpg"},{"id":"u1sa-16","type":"mc","q":"그림은 가구당 수입(단위: 천 달러)의 분포이고, 세 대표값 이름은 가려 두었다. 140 지점에 표시된 대표값은?","explain":"40 = 최빈값(가장 많은 가구), 60 = 중앙값(50% 지점), 140 = **평균** — 오른쪽 극단치(950, 1,420)가 평균을 끌어올렸다. 범위는 변산성 측정치라 한 점으로 표시되지 않는다.","src":"1장 p.31","wiki":"집중 경향 측정치","choices":["평균","중앙값","최빈값","범위"],"answer":0,"img":"img/psy1-p31-skew-q.png","imgAlt":"오른쪽으로 꼬리가 긴 수입 분포, 40·60·140 지점의 이름표는 가림","explainImg":"img/psy1-p31-slide.jpg"}]},{"id":"u1sb","title":"변산성과 정규분포","intro":[{"title":"변산성 측정치","body":"값들이 퍼진 정도: **범위**(최고 − 최저, 정보가 적음) · **표준 편차**(평균에서 떨어진 정도, 클수록 넓게 퍼짐).","src":"1장 p.32"},{"title":"표준 편차 읽기","body":"표준 편차가 **크면** 값들이 평균에서 멀리 흩어져 분포가 넓고 납작하다. **작으면** 평균 근처에 밀집해 좁고 뾰족하다. 범위는 최저·최고 두 값만 보므로 시사하는 바가 적다.","src":"1장 p.32 · 9/1 녹음 2:06:54"},{"title":"정상 곡선과 중심극한정리","body":"**정상 곡선(정규분포)** = 평균을 중심으로 대칭인 종 모양. **중심극한정리** = 표본이 커질수록 분포가 정규분포에 가까워진다. 7장 지능 점수 분포도 같은 곡선.","src":"1장 p.32","img":"img/psy1-p32-normal.png","imgAlt":"웩슬러 지능 점수의 정규분포 그래프"}],"items":[{"id":"u1sb-01","type":"sa","q":"데이터 내 자료 값들의 분포 수준(넓게 퍼졌는지, 좁게 몰렸는지)을 보여 주는 기술통계 측정치 — 명칭을 쓰시오.","explain":"변산성 측정치 = 범위·표준 편차. 집중 경향 측정치(최빈값·평균·중앙값)와 짝.","src":"1장 p.32","answer":"변산성 측정치","alts":["변산성","variability","변산도"],"wiki":"변산성 측정치","explainImg":"img/psy1-p32-slide.jpg"},{"id":"u1sb-02","type":"sa","q":"최저 점수와 최고 점수 간 차이 — 명칭을 쓰시오.","explain":"교수: 범위는 단순히 최저·최고 차이라 크게 시사하는 바는 많지 않다. 중요한 건 표준 편차.","src":"1장 p.32","answer":"범위","alts":["range"],"wiki":"변산성 측정치","explainImg":"img/psy1-p32-slide.jpg"},{"id":"u1sb-03","type":"sa","q":"자료가 평균을 중심으로 얼마나 떨어져 있는지를 보여 주는 지표 — 명칭을 쓰시오.","explain":"표준 편차가 클수록 데이터의 변산성이 크다(넓게 퍼짐). 작으면 중앙으로 몰린 좁은 형태.","src":"1장 p.32","answer":"표준 편차","alts":["표준편차","standard deviation","SD"],"wiki":"변산성 측정치","explainImg":"img/psy1-p32-slide.jpg"},{"id":"u1sb-04","type":"mc","q":"최저·최고 점수의 차이일 뿐이어서 **시사하는 바가 가장 적은** 변산성 측정치는?","explain":"범위는 최저·최고 점수 차이일 뿐이라 정보가 적다. 교수: 「중요한 건 이제 표준 편차」. 평균·중앙값은 집중 경향 측정치.","src":"9/1 녹음 2:06:54","wiki":"변산성 측정치","prof":true,"choices":["범위","표준 편차","평균","중앙값"],"answer":0,"explainImg":"img/psy1-p32-slide.jpg"},{"id":"u1sb-05","type":"tf","q":"표준 편차가 클수록 데이터의 변산성이 크다.","explain":"슬라이드 p.32 그대로. 평균에서 멀리 떨어진 값이 많다 = 넓게 퍼짐.","src":"1장 p.32","answer":true,"wiki":"변산성 측정치","explainImg":"img/psy1-p32-slide.jpg"},{"id":"u1sb-06","type":"tf","q":"표준 편차가 작으면 데이터가 평균에서 넓게 퍼진 형태가 된다.","explain":"반대다. 표준 편차가 작으면 데이터가 평균 근처에 **밀집**해 좁은 형태가 된다.","src":"1장 p.32","answer":false,"wiki":"변산성 측정치","explainImg":"img/psy1-p32-slide.jpg"},{"id":"u1sb-07","type":"mc","q":"다음 중 **변산성 측정치**는?","explain":"변산성 측정치 = 범위·표준 편차. 최빈값·평균·중앙값은 집중 경향 측정치다.","src":"1장 p.31–32","choices":["표준 편차","최빈값","평균","중앙값"],"answer":0,"wiki":"변산성 측정치","explainImg":"img/psy1-p32-slide.jpg"},{"id":"u1sb-08","type":"cloze","q":"변산성 측정치에는 최저·최고 점수 차이인 ___ 와, 평균을 중심으로 떨어진 정도인 ___ 가 있다.","explain":"p.32 변산성 측정치 두 가지.","src":"1장 p.32","answer":["범위","표준 편차"],"bank":["범위","표준 편차","최빈값","중앙값","P-value"],"wiki":"변산성 측정치","explainImg":"img/psy1-p32-slide.jpg"},{"id":"u1sb-09","type":"match","q":"기술통계 용어와 정의를 연결하시오","explain":"앞의 셋은 집중 경향, 뒤의 둘은 변산성 측정치.","src":"1장 p.31–32","pairs":[["최빈값","가장 자주 보고된 값"],["평균","총합 ÷ 샘플 수"],["중앙값","서열상 50% 지점의 값"],["범위","최저·최고 점수 간 차이"],["표준 편차","평균을 중심으로 흩어진 정도"]],"wiki":"변산성 측정치","explainImg":"img/psy1-p31-slide.jpg"},{"id":"u1sb-10","type":"sa","q":"많은 유형의 데이터 분포를 기술하는, 평균을 중심으로 대칭적인 형태의 곡선 — 명칭을 쓰시오.","explain":"슬라이드 표기 = 정상 곡선(정규분포). 7장 p.45 지능 점수 분포도 같은 종 모양 곡선이다.","src":"1장 p.32","answer":"정상 곡선","alts":["정규분포","정규 분포","정규곡선","정규 곡선","normal curve","normal distribution"],"wiki":"정상 곡선","explainImg":"img/psy1-p32-slide.jpg"},{"id":"u1sb-11","type":"sa","q":"표본의 크기가 커질수록 데이터 분포 유형이 정규 분포에 가까워진다는 원리 — 명칭을 쓰시오.","explain":"1장 p.32와 7장 p.45(표준화)에 모두 나온다. 그래서 표준화에는 충분한 표본 수가 중요하다.","src":"1장 p.32","answer":"중심극한정리","alts":["중심 극한 정리","central limit theorem"],"wiki":"정상 곡선","explainImg":"img/psy1-p32-slide.jpg"},{"id":"u1sb-12","type":"tf","q":"중심극한정리에 따르면 표본의 크기가 커질수록 데이터 분포는 정규 분포에서 멀어진다.","explain":"반대다. 표본이 커질수록 정규 분포에 **가까워진다**.","src":"1장 p.32","answer":false,"wiki":"정상 곡선","explainImg":"img/psy1-p32-slide.jpg"},{"id":"u1sb-13","type":"mc","q":"정상 곡선(정규분포)에 대한 설명으로 옳은 것은?","explain":"정규분포는 평균 근처에 대부분이 몰리고 극단으로 갈수록 빈도가 낮아지는 대칭 곡선이다. 표본이 클수록 가까워진다(중심극한정리).","src":"1장 p.32","choices":["평균을 중심으로 대칭적인 형태다","극단으로 갈수록 빈도가 높아진다","최빈값 쪽으로 한쪽 꼬리가 길게 늘어진다","표본이 작을수록 더 잘 나타난다"],"answer":0,"wiki":"정상 곡선","explainImg":"img/psy1-p32-slide.jpg"},{"id":"u1sb-14","type":"tf","q":"7장의 지능 검사 점수 분포도 평균 근처에 몰리는 종 모양의 정규곡선으로 설명된다.","explain":"7장 p.45: 정규곡선 + 중심극한정리. 1장 통계와 7장 표준화가 이어지는 지점이다.","src":"7장 p.45","wiki":"표준화","answer":true,"explainImg":"img/psy7-p45-slide.jpg"},{"id":"u1sb-15","type":"tf","q":"그림처럼 평균을 중심으로 좌우 대칭인 종 모양 곡선을 정상 곡선(정규분포)이라 하며, 표본이 커질수록 데이터 분포는 이 모양에 가까워진다.","explain":"맞다. **정상 곡선**(정규분포) + **중심극한정리**. 7장 지능 점수 분포도 같은 곡선이다.","src":"1장 p.32","wiki":"정상 곡선","answer":true,"img":"img/psy1-p32-normal.png","imgAlt":"웩슬러 지능 점수의 종 모양 분포","explainImg":"img/psy1-p32-slide.jpg"}]},{"id":"u1sc","title":"추론통계와 유의성 검정","intro":[{"title":"추론통계의 목적","body":"표본 결과로 모집단을 추정(일반화)하고, 관찰된 차이가 **우연이 아님**을 검증. 믿을 만한 전제: 대표 표본 · 변산성이 **작을수록** · 사례 수가 **많을수록**(실험은 유효 인원 40명 이상 권장).","src":"1장 p.33"},{"title":"영가설과 대안 가설","body":"**영가설** = 조작한 변인이 효과가 **없다**. **대안(대립) 가설** = 효과가 있다. 차이가 없다는 걸 먼저 참으로 놓고, 그 확률이 낮으면 영가설을 기각하고 대안 가설을 채택한다.","src":"1장 p.34"},{"title":"P-value","body":"**P-value** = 영가설이 참일 확률(통계적 유의도). **0.05 미만**이면 유의. 평균 차이가 크고 집단별 변산성이 작을수록 유의해지기 쉽다. 실험뿐 아니라 차이를 보는 모든 연구에 쓴다.","src":"1장 p.34"}],"items":[{"id":"u1sc-01","type":"mc","q":"추론 통계의 목적으로 옳은 것은?","explain":"교수: 추론 통계의 목적은 두 가지 — 결과의 일반화, 관찰된 차이가 우연이 아님을 증명. ②③은 기술통계, ④는 무선 할당.","src":"1장 p.33 · 9/1 녹음 2:08:48","choices":["표본 결과로 모집단 특성을 추정하고, 관찰된 차이가 우연이 아님을 검증한다","데이터를 단일 점수로 요약한다","자료 값들이 퍼진 정도를 보여 준다","참가자를 실험 조건에 무작위로 배정한다"],"answer":0,"wiki":"추론통계","explainImg":"img/psy1-p33-slide.jpg"},{"id":"u1sc-02","type":"sa","q":"연구자가 조작한 변인이 효과가 **없다**고 가정하는 가설 — 명칭을 쓰시오.","explain":"교수: 차이가 있다는 예측은 검증되지 않았으니, 논리적으로 역으로 차이가 없다는 걸 먼저 참이라 전제한다 — 그게 영가설.","src":"1장 p.34","answer":"영가설","alts":["영 가설","귀무가설","null hypothesis","0가설"],"wiki":"영가설과 대안 가설","explainImg":"img/psy1-p34-slide.jpg"},{"id":"u1sc-03","type":"sa","q":"원래 연구자가 탐구하고자 했던 변인의 효과(차이)를 인정하는 가설 — 명칭을 쓰시오.","explain":"교수: 「혹은 이제 대립가설이라고도 표현」. 영가설을 기각하면 대안 가설을 채택한다.","src":"1장 p.34","answer":"대안 가설","alts":["대안가설","대립가설","대립 가설","alternative hypothesis"],"wiki":"영가설과 대안 가설","explainImg":"img/psy1-p34-slide.jpg"},{"id":"u1sc-04","type":"sa","q":"통계적 유의도를 나타내는 지표로, 영가설이 참일 확률로 정의되는 것 — 명칭을 쓰시오.","explain":"P-value가 0.05 미만일 때 통계적으로 유의하다고 본다.","src":"1장 p.34","answer":"P-value","alts":["p값","p 값","피밸류","유의확률","p value"],"wiki":"P-value","explainImg":"img/psy1-p34-slide.jpg"},{"id":"u1sc-05","type":"num","q":"관찰된 차이를 \"통계적으로 유의하다\"고 보는 P-value의 기준값은? (이 값 **미만**이면 유의)","explain":"슬라이드: P-value가 **0.05 미만**일 때 통계적으로 유의. 교수: 최소 기준이 0.05이고 0.01·0.001 등으로도 표기한다.","src":"1장 p.34","answer":0.05,"unit":"","tol":0,"wiki":"P-value","explainImg":"img/psy1-p34-slide.jpg"},{"id":"u1sc-06","type":"tf","q":"P-value가 0.05 미만이면 관찰된 차이가 통계적으로 유의하다고 본다.","explain":"교수: 차이가 우연히 관측될 확률이 5% 미만이어야 한다.","src":"1장 p.34","answer":true,"wiki":"P-value","explainImg":"img/psy1-p34-slide.jpg"},{"id":"u1sc-07","type":"tf","q":"P-value는 대안 가설이 참일 확률이다.","explain":"슬라이드 정의는 **영가설이 참일 확률**이다. 그래서 작을수록 차이가 있다고 해석한다.","src":"1장 p.34","answer":false,"wiki":"P-value","explainImg":"img/psy1-p34-slide.jpg"},{"id":"u1sc-08","type":"cloze","q":"심리과학의 가설 검증은 ___ 을 기각하고 ___ 을 채택하는 과정이다.","explain":"교수: 우연에 의해 관측될 확률이 낮을수록 진짜 차이가 있다고 해석 → 영가설 기각, 대안 가설 채택.","src":"9/1 녹음 2:12:28","answer":["영가설","대안 가설"],"bank":["영가설","대안 가설","이론","조작적 정의","중앙값"],"wiki":"영가설과 대안 가설","explainImg":"img/psy1-p34-slide.jpg"},{"id":"u1sc-09","type":"order","q":"가설 검증의 논리를 순서대로 놓으시오","explain":"교수: 변화가 있다는 예측은 아직 검증 전이라 참/거짓을 말할 수 없으니, 역으로 차이가 없다는 걸 먼저 전제한다.","src":"9/1 녹음 2:11:39–2:13:38","answer":["연구 가설 세우기 (조작하면 변화가 있을 것)","영가설(효과 없음)을 참이라고 전제","데이터가 우연히 관찰될 확률(P-value) 확인","P-value \u003c 0.05이면 영가설 기각·대안 가설 채택"],"wiki":"P-value","explainImg":"img/psy1-p34-slide.jpg"},{"id":"u1sc-10","type":"mc","q":"관찰한 차이를 신뢰할 수 있는 전제로 옳지 **않은** 것은?","explain":"슬라이드 p.33 전제 3가지: 대표 표본 > 편파 표본, 변산성이 **작을수록** 신뢰성↑, 사례 수가 많을수록 좋다.","src":"1장 p.33","choices":["대표 표본이 편파 표본보다 좋다","변산성이 작을수록 신뢰성이 높다","사례 수가 많을수록 좋다","변산성이 클수록 신뢰성이 높다"],"answer":3,"wiki":"추론통계","explainImg":"img/psy1-p33-slide.jpg"},{"id":"u1sc-11","type":"tf","q":"집단별 변산성이 클수록 통계적으로 유의할 가능성이 올라간다.","explain":"반대다. 집단 평균 차이가 크고 집단별 변산성이 **낮을수록** 유의할 가능성이 올라간다(분포가 좁아 구분이 잘 됨).","src":"1장 p.34","answer":false,"wiki":"P-value","explainImg":"img/psy1-p34-slide.jpg"},{"id":"u1sc-12","type":"mc","q":"통계적으로 유의할 가능성이 가장 높은 경우는?","explain":"교수: 평균 차이가 크면 중심점이 멀어지고, 변산성이 작으면 좁게 형성돼 구분이 더 잘 된다.","src":"1장 p.34 · 9/1 녹음 2:13:38","choices":["두 집단의 평균 차이가 크고 집단별 변산성이 낮을 때","두 집단의 평균 차이가 작고 변산성이 클 때","평균 차이와 무관하게 변산성이 클 때","사례 수가 적고 평균 차이가 작을 때"],"answer":0,"wiki":"P-value","explainImg":"img/psy1-p34-slide.jpg"},{"id":"u1sc-13","type":"match","q":"추론통계 용어와 설명을 연결하시오","explain":"1장 p.34 그대로.","src":"1장 p.34","pairs":[["영가설","조작한 변인이 효과가 없다고 가정"],["대안 가설","탐구하려던 변인 효과(차이)를 인정"],["P-value","영가설이 참일 확률"],["0.05","유의성 판단 기준(미만이면 유의)"]],"wiki":"P-value","explainImg":"img/psy1-p34-slide.jpg"},{"id":"u1sc-14","type":"tf","q":"통계적 유의성 검정은 실험법에만 쓰이고, 차이를 보는 다른 연구에는 쓰이지 않는다.","explain":"교수: 주로 실험법 기준으로 설명하지만 실험법뿐 아니라 차이를 보는 연구라면 다 통계적 검정을 거친다.","src":"9/1 녹음 2:14:39","answer":false,"wiki":"P-value","explainImg":"img/psy1-p30-slide.jpg"},{"id":"u1sc-15","type":"mc","q":"실험 심리학에서 통상 권장되는, 이탈자를 뺀 유효 데이터의 최종 인원수는?","explain":"교수: 보통 30~40명 대상으로 실험하며, 이탈자를 빼고 유효 데이터 최종 인원 40명 이상을 많이 권장한다. 300명은 7장 표준화(치매 판별 도구) 이야기.","src":"9/1 녹음 2:09:50","wiki":"추론통계","diff":3,"choices":["40명 이상","10명 이상","300명 이상","1000명 이상"],"answer":0,"explainImg":"img/psy1-p33-slide.jpg"}]},{"id":"u1sd","title":"연구 과정과 기술적 방법","intro":[{"title":"연구 과정 5단계","body":"현상/문제 인식 → **이론**(관찰을 체제화한 통합적 설명) → **가설**(검증 가능한 예측) → 연구 설계·집행 → 분석·해석. **조작적 정의** = 개념을 측정 가능하게 정확히 진술(수면 박탈 = 24시간 동안 수면 1시간 미만).","src":"1장 p.16"},{"title":"기술적 방법","body":"**사례 연구**(소수 심층 분석, 일반화 어려움) · **자연 관찰**(자연 상태 기록, 빅데이터) · **사회조사**(설문, 응답 위장·**말표현 효과**). 셋 다 처치가 없어 **설명은 불가**.","src":"1장 p.17–20"},{"title":"무선 표집","body":"모집단 구성원 모두에게 뽑힐 기회를 동등하게. 표본은 수보다 **대표성**이 중요. (무선 할당 = 뽑힌 사람을 조건에 무작위 배정 — 다른 절차)","src":"1장 p.21"}],"items":[{"id":"u1sd-01","type":"order","q":"심리과학의 연구 과정 5단계를 순서대로 놓으시오","explain":"교수: 교재는 3단계지만 세부적으로는 5단계. 분석 결과는 기존 이론을 지지·반박·확장한다.","src":"1장 p.16","wiki":"과학적 방법","answer":["현상/문제 인식","이론 제시","가설 수립","연구 설계 및 집행","데이터 분석 및 해석"],"explainImg":"img/psy1-p16-slide.jpg"},{"id":"u1sd-02","type":"sa","q":"이론을 기반으로 도출한, 검증 가능한 예측(\"~하면 ~할 것이다\") — 명칭을 쓰시오.","explain":"이론 = 관찰을 체제화하고 예측하는 통합적 설명, 가설 = 그로부터 도출한 검증 가능한 예측.","src":"1장 p.16","wiki":"가설","answer":"가설","alts":["hypothesis"],"explainImg":"img/psy1-p16-slide.jpg"},{"id":"u1sd-03","type":"sa","q":"연구에서 차용된 개념·연구 절차에 대한 정확한 진술(측정할 수 없는 심리 기제를 계량화할 수 있는 형태로 재정의) — 명칭을 쓰시오.","explain":"교수 예: 수면 박탈 = 최근 24시간 동안 수면 1시간 미만, 기억 = 정답 항목 수. 기준은 선행 문헌에 근거한다.","src":"1장 p.16","wiki":"조작적 정의","answer":"조작적 정의","alts":["operational definition","조작적정의"],"explainImg":"img/psy1-p16-slide.jpg"},{"id":"u1sd-04","type":"cloze","q":"조작적 정의 예: 수면 박탈 = 최근 ___ 시간 동안 수면 ___ 시간 미만","explain":"교수 예시(수면과 기억). 가설은 측정할 수 있는 형태로 재정립해야 한다.","src":"1장 p.16","wiki":"조작적 정의","answer":["24","1"],"bank":["24","1","12","8","3"],"explainImg":"img/psy1-p16-slide.jpg"},{"id":"u1sd-05","type":"mc","q":"기술적 방법(descriptive methods)에 해당하지 **않는** 것은?","explain":"기술적 방법 3가지 = 사례 연구·자연 관찰·사회조사. 처치·통제가 없어 설명은 불가하다. 실험법은 조작·통제를 가하는 유일한 방법.","src":"1장 p.17","wiki":"연구 방법 비교","choices":["실험법","사례 연구","자연 관찰","사회조사"],"answer":0,"explainImg":"img/psy1-p17-slide.jpg"},{"id":"u1sd-06","type":"tf","q":"기술적 방법은 현상이 왜 일어나는지 설명할 수 있다.","explain":"교수: 세 방법 모두 **설명은 불가**하며 현상이 일어남을 보여 줄 뿐이다.","src":"1장 p.17","wiki":"연구 방법 비교","answer":false,"explainImg":"img/psy1-p17-slide.jpg"},{"id":"u1sd-07","type":"sa","q":"소수의 개인이나 집단을 집중적으로 관찰하고 심층 분석하는 기법 — 명칭을 쓰시오.","explain":"약점: 대표적이지 않은 개별 사례는 결과를 오도할 수 있고 일반화하기 어렵다.","src":"1장 p.18","wiki":"사례 연구","answer":"사례 연구","alts":["case study","사례연구"],"explainImg":"img/psy1-p18-slide.jpg"},{"id":"u1sd-08","type":"mc","q":"자연 관찰에 대한 설명으로 옳은 것은?","explain":"자연 관찰은 자연 상태의 행동을 기록한다. 트위터 긍정 단어 추세(Golder & Macy)처럼 현상은 보이지만 왜 그런지는 알 수 없다.","src":"1장 p.19","wiki":"자연 관찰","choices":["빅데이터(SNS 등)로 대규모 연구가 가능해졌지만 행동 요인을 통제하지 않는다","변인에 처치를 가해 인과를 검증한다","참가자를 조건에 무작위로 배정한다","소수 사례만 다룰 수 있어 대규모 연구는 불가능하다"],"answer":0,"explainImg":"img/psy1-p19-slide.jpg"},{"id":"u1sd-09","type":"mc","q":"흡연량을 묻는 설문에서 응답자들이 실제보다 적게 답했다. 사회조사의 어떤 약점인가?","explain":"사회조사 약점 ① 응답 위장(사회적 바람직성), ② 말표현 효과(어휘에 따라 응답이 달라짐). 여기서는 어휘가 아니라 응답 위장이다.","src":"1장 p.20","wiki":"사회조사","choices":["사회적으로 바람직한 방향으로 응답을 위장","말표현 효과","평균으로의 회귀","착각 상관"],"answer":0,"explainImg":"img/psy1-p20-slide.jpg"},{"id":"u1sd-10","type":"sa","q":"'복지' 대신 '극빈자 지원'이라고 묻자 찬성이 늘었다처럼, 문항을 구성하는 어휘에 따라 응답이 달라지는 효과 — 명칭을 쓰시오.","explain":"사회조사의 약점 ②. 같은 내용도 어휘가 프레임을 만든다(7장 틀만들기와 연결).","src":"1장 p.20","wiki":"말표현 효과","answer":"말표현 효과","alts":["wording effect","말 표현 효과"],"explainImg":"img/psy1-p20-slide.jpg"},{"id":"u1sd-11","type":"sa","q":"모집단의 구성원이 동등하게 참여할 기회를 갖도록 표본을 뽑는 원칙 — 명칭을 쓰시오.","explain":"교수: 「표본 수가 큰 것보다 대표성을 띠는 표본이 더 중요」. 추론통계의 전제(대표 표본)와 같은 이야기.","src":"1장 p.21","wiki":"무선 표집","answer":"무선 표집","alts":["random sampling","무작위 표집","무선표집"],"explainImg":"img/psy1-p21-slide.jpg"},{"id":"u1sd-12","type":"tf","q":"표본은 수가 큰 것보다 모집단을 대표하는 것이 더 중요하다.","explain":"9/1 녹음 1:23:51. 통계 p.33 \"대표 표본이 편파 표본보다 좋다\"와 이어진다.","src":"1장 p.21 🎙","wiki":"무선 표집","prof":true,"answer":true,"explainImg":"img/psy1-p21-slide.jpg"},{"id":"u1sd-13","type":"tf","q":"무선 표집과 무선 할당은 같은 절차를 가리킨다.","explain":"다르다. 무선 표집 = 모집단에서 참가자를 **뽑는** 것, 무선 할당 = 뽑힌 참가자를 조건에 **배정**하는 것.","src":"1장 p.21, 23","wiki":"무선 할당","answer":false,"explainImg":"img/psy1-p23-slide.jpg"},{"id":"u1sd-14","type":"match","q":"용어와 설명을 연결하시오","explain":"1장 p.16–20의 연구 과정·기술적 방법 용어.","src":"1장 p.16–20","wiki":"과학적 방법","pairs":[["이론","관찰을 체제화하고 예측하는 통합적 설명"],["가설","이론에서 도출한 검증 가능한 예측"],["조작적 정의","개념·절차에 대한 정확한 진술"],["사례 연구","소수 대상 심층 분석"],["사회조사","설문·인터뷰 자기보고식 연구"]],"explainImg":"img/psy1-p16-slide.jpg"}]},{"id":"u1se","title":"상관과 실험법","intro":[{"title":"상관","body":"두 변인이 함께 변하는 정도(−1~1): 정적·부적·무상관. **예측은 되지만 인과는 아니다** — **제3의 변인**(식중독과 아이스크림 ← 날씨). 착각 상관, 평균으로의 회귀(못하던 팀이 다음엔 좀 나아짐)도 주의.","src":"1장 p.22"},{"title":"실험법","body":"변인에 **처치**하고 나머지를 통제해 **인과**를 검증하는 유일한 방법. 실험 조건 vs 통제 조건, **무선 할당**으로 개인차 최소화. 약점: 일반화의 한계, 윤리 문제.","src":"1장 p.23, 25"},{"title":"가짜약과 이중 은폐","body":"**가짜약(위약) 조건** = 처치를 받았다는 **인지**의 효과와 **처치** 자체의 효과를 구분. **이중 은폐** = 참가자와 실험자 모두 누가 어느 조건인지 모름.","src":"1장 p.24"}],"items":[{"id":"u1se-01","type":"sa","q":"두 변인이 함께 변하는 정도의 측정치(-1~1) — 명칭을 쓰시오.","explain":"정적 상관(함께 증가), 부적 상관(한쪽 증가·다른 쪽 감소), 상관 없음. 예측은 가능하지만 인과 설명은 불가.","src":"1장 p.22","wiki":"상관","answer":"상관","alts":["correlation","상관관계"],"explainImg":"img/psy1-p22-slide.jpg"},{"id":"u1se-02","type":"tf","q":"부적 상관은 한 변인이 증가할 때 다른 변인이 감소하는 관계다.","explain":"정적 = 한쪽↑ 다른 쪽↑, 부적 = 한쪽↑ 다른 쪽↓.","src":"1장 p.22","wiki":"상관","answer":true,"explainImg":"img/psy1-p22-slide.jpg"},{"id":"u1se-03","type":"sa","q":"실제로는 관계가 없는데 관계가 있다고 강하게 지각하는 현상 — 명칭을 쓰시오.","explain":"1장 p.22. 무선적 사건에서 질서를 지각하는 경향과 맞닿아 있다.","src":"1장 p.22","wiki":"착각 상관","answer":"착각 상관","alts":["illusory correlation","착각상관"],"explainImg":"img/psy1-p22-slide.jpg"},{"id":"u1se-04","type":"sa","q":"극단적이거나 이례적인 사건이 평균 방향으로 되돌아오는 경향 — 명칭을 쓰시오.","explain":"교수 예: 못하는 야구팀 감독을 비난했더니 다음 경기는 좀 더 잘하더라 — 실제로는 평균으로 회귀한 것.","src":"1장 p.22","wiki":"평균으로의 회귀","answer":"평균으로의 회귀","alts":["regression toward the mean","평균 회귀","평균으로 회귀"],"explainImg":"img/psy1-p22-slide.jpg"},{"id":"u1se-05","type":"sa","q":"식중독 발병률과 아이스크림 소비율이 함께 오르게 만든 날씨처럼, 두 변인 모두에 영향을 주는 변인 — 명칭을 쓰시오.","explain":"상관 ≠ 인과인 이유: 제3의 변인이 있을 수 있기 때문이다.","src":"1장 p.22","wiki":"제3의 변인","answer":"제3의 변인","alts":["제3 변인","제 3의 변인","third variable"],"explainImg":"img/psy1-p22-slide.jpg"},{"id":"u1se-06","type":"mc","q":"상관 연구 결과로 할 수 있는 것은?","explain":"교수: 「상관은 인과성을 입증하는 지표가 아니다 — 굉장히 중요한 사안」. 예측 O, 설명 X.","src":"1장 p.22 🎙","wiki":"상관","prof":true,"choices":["한 변인으로 다른 변인을 예측할 수 있지만, 인과를 설명할 수는 없다","두 변인의 인과관계를 입증할 수 있다","제3의 변인의 영향을 완전히 배제할 수 있다","참가자를 조건에 무선 할당할 수 있다"],"answer":0,"explainImg":"img/psy1-p22-slide.jpg"},{"id":"u1se-07","type":"tf","q":"두 변인의 상관 계수가 +0.9라면 한 변인이 다른 변인의 원인이라고 결론 내릴 수 있다.","explain":"상관이 아무리 높아도 인과를 입증하지 않는다. 제3의 변인 가능성이 남는다.","src":"1장 p.22 🎙","wiki":"상관","prof":true,"answer":false,"explainImg":"img/psy1-p22-slide.jpg"},{"id":"u1se-08","type":"mc","q":"기술적 방법·상관 연구·실험법 중 **인과성**을 탐구할 수 있는 유일한 방법은?","explain":"교수: 「직접적인 통제나 조작을 가하는 방법은 실험법 딱 하나」. 9/29 정리: 연구 방법 3가지를 '인과성을 탐구할 수 있는지'로 분류.","src":"1장 p.23, 25 🎙","wiki":"실험법","prof":true,"choices":["실험법","사례 연구","사회조사","상관 연구"],"answer":0,"explainImg":"img/psy1-p23-slide.jpg"},{"id":"u1se-09","type":"cloze","q":"실험에서 실제 처치를 받는 집단은 ___ 조건, 처치를 받지 않는 집단은 ___ 조건이다.","explain":"관심 변인에 처치를 가하고 나머지 변인을 일정하게 유지(통제)해 효과를 인과적으로 검증한다.","src":"1장 p.23","wiki":"실험법","answer":["실험","통제"],"bank":["실험","통제","가짜약","상관","기술"],"explainImg":"img/psy1-p23-slide.jpg"},{"id":"u1se-10","type":"sa","q":"모집된 참가자를 실험 조건과 통제 조건에 확률 기반으로 무작위 배정해 기존 개인차의 영향을 최소화하는 기법 — 명칭을 쓰시오.","explain":"교수 예: 원래 토익 점수가 높은 학생들이 우연히 한 집단에 몰리면 새 학습법 효과를 믿을 수 없다.","src":"1장 p.23","wiki":"무선 할당","answer":"무선 할당","alts":["random assignment","무작위 할당","무선할당"],"explainImg":"img/psy1-p23-slide.jpg"},{"id":"u1se-11","type":"mc","q":"가짜약(위약) 조건을 두는 목적은?","explain":"교수의 3조건 논리: 무투여 / 위약 / 신약 — 신약 > 위약 > 무투여라면 신약의 실제 효과가 있다.","src":"1장 p.24","wiki":"가짜약 효과","choices":["효과가 '처치를 받았다는 인지' 때문인지 '처치' 자체 때문인지 비교","참가자를 무작위로 뽑기 위해","실험자가 결과를 미리 알기 위해","상관 계수를 계산하기 위해"],"answer":0,"explainImg":"img/psy1-p24-slide.jpg"},{"id":"u1se-12","type":"sa","q":"참가자뿐 아니라 실험자도 어느 집단이 가짜약 조건인지 모르게 하는 절차 — 명칭을 쓰시오.","explain":"참가자·실험자 양쪽의 기대가 결과에 끼어드는 것을 막는다.","src":"1장 p.24","wiki":"이중 은폐","answer":"이중 은폐","alts":["double-blind","이중 맹검","이중맹검","이중 은폐 절차"],"explainImg":"img/psy1-p24-slide.jpg"},{"id":"u1se-13","type":"mc","q":"**실험법**의 약점으로 옳은 것은?","explain":"②는 상관 연구, ③④는 기술적 방법의 약점. 실험은 통제된 인위적 상황이라 일반화에 한계가 있다.","src":"1장 p.25","wiki":"연구 방법 비교","choices":["결과를 다른 상황에 일반화하지 못할 수 있고, 윤리적 문제로 처치가 불가할 수 있다","원인과 결과를 명세하지 못한다","변인 통제가 불가능하다","개별 사례가 결과를 오도한다"],"answer":0,"explainImg":"img/psy1-p25-slide.jpg"},{"id":"u1se-14","type":"match","q":"연구 방법과 기본 목적을 연결하시오","explain":"처치: 기술적·상관 = 없음, 실험 = 하나 이상의 독립변인.","src":"1장 p.24–25","wiki":"연구 방법 비교","pairs":[["기술적 방법","행동을 관찰 및 기록"],["상관 연구","한 변인이 다른 변인을 예측하는 정도 평가"],["실험","원인과 결과 탐색"],["가짜약 조건","처치를 받았다는 인지의 효과 확인"]],"explainImg":"img/psy1-p24-slide.jpg"},{"id":"u1se-15","type":"tf","q":"실험에서 두 집단의 평균 차이에 대한 P-value가 0.03이라면 통계적으로 유의한 차이로 본다.","explain":"0.03 \u003c 0.05이므로 유의하다 — 영가설을 기각하고 대안 가설을 채택한다(1장 p.34).","src":"1장 p.23, 34","wiki":"P-value","answer":true,"explainImg":"img/psy1-p34-slide.jpg"}]}]}]}]</script>
<script>
/* 한입 학습 — core logic shared by the app (browser), build.mjs, report.mjs, test.mjs.
   No DOM access here. Works as a plain <script> (sets globalThis.DuoCore) and as CommonJS. */
(function (root) {
  'use strict';

  var TYPES = ['mc', 'tf', 'cloze', 'match', 'order', 'sa', 'num'];
  var TYPE_KO = { mc: '객관식', tf: 'O/X', cloze: '빈칸', match: '짝 맞추기', order: '순서', sa: '단답', num: '계산' };
  var MIN = 60e3, DAY = 864e5;
  var BOX_DAYS = [0, 1, 2, 4, 8, 16];
  var LOG_CAP = 20000;

  /* ---------- dates (Asia/Seoul) ---------- */
  var dfmt = null;
  function dateKey(ms) {
    try {
      if (!dfmt) dfmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' });
      return dfmt.format(new Date(ms));
    } catch (e) {
      var d = new Date(ms + 9 * 3600e3);
      return d.toISOString().slice(0, 10);
    }
  }
  function shiftDay(key, delta) {
    var d = new Date(key + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + delta);
    return d.toISOString().slice(0, 10);
  }
  /** streak = consecutive days with lessons>0 ending today (or yesterday if today not yet done). */
  function calcStreak(days, today) {
    days = days || {};
    var k = today, n = 0;
    if (!(days[k] && days[k].lessons > 0)) k = shiftDay(k, -1);
    while (days[k] && days[k].lessons > 0) { n++; k = shiftDay(k, -1); }
    return n;
  }

  /* ---------- grading ---------- */
  function normSA(s) {
    return String(s == null ? '' : s).normalize('NFKC').trim().toLowerCase()
      .replace(/[.。]+$/, '')
      .replace(/[\s\-‐-―−·・•‧∙_]/g, '');
  }
  function parseNum(s, unit) {
    if (typeof s === 'number') return s;
    var t = String(s == null ? '' : s).normalize('NFKC').trim();
    if (unit) { var u = String(unit).trim(); if (u && t.toLowerCase().endsWith(u.toLowerCase())) t = t.slice(0, -u.length); }
    t = t.replace(/[,\s]/g, '').replace(/[−–]/g, '-').replace(/%$/, '');
    if (t === '') return NaN;
    var m = /^([-+]?[\d.]+(?:e[-+]?\d+)?)\/([-+]?[\d.]+(?:e[-+]?\d+)?)$/i.exec(t);
    if (m) return Number(m[1]) / Number(m[2]);
    m = /^([-+]?[\d.]+)\^([-+]?[\d.]+)$/.exec(t);
    if (m) return Math.pow(Number(m[1]), Number(m[2]));
    if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return NaN;
    return Number(t);
  }
  function numOk(item, given) {
    var g = parseNum(given, item.unit), a = Number(item.answer);
    if (!isFinite(g)) return false;
    var tol = item.tol == null ? 0.01 : Number(item.tol);
    if (tol === 0) return Math.abs(g - a) <= 1e-9 * Math.max(1, Math.abs(a));
    if (a === 0) return Math.abs(g) <= tol;
    return Math.abs(g - a) <= tol * Math.abs(a) + 1e-12;
  }
  function arrEq(a, b) {
    if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (String(a[i]).trim() !== String(b[i]).trim()) return false;
    return true;
  }
  /** match: given = list of attempted [left,right] pairs in tap order. ok iff no wrong attempt and every left matched. */
  function matchOk(item, given) {
    if (!Array.isArray(given)) return false;
    var map = {}; item.pairs.forEach(function (p) { map[p[0]] = p[1]; });
    var covered = {}, wrong = 0;
    given.forEach(function (p) { if (map[p[0]] === p[1]) covered[p[0]] = 1; else wrong++; });
    return wrong === 0 && Object.keys(covered).length === item.pairs.length;
  }
  function grade(item, given) {
    switch (item.type) {
      case 'mc': return Number(given) === item.answer && given !== null && given !== '';
      case 'tf': return given === item.answer;
      case 'cloze': return arrEq(given, item.answer);
      case 'match': return matchOk(item, given);
      case 'order': return arrEq(given, item.answer);
      case 'sa': {
        var g = normSA(given);
        if (!g) return false;
        return [item.answer].concat(item.alts || []).some(function (a) { return normSA(a) === g; });
      }
      case 'num': return numOk(item, given);
    }
    return false;
  }
  function clip(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  /** human-readable serialization of a user's answer (stored in the log, read by AI). */
  function serializeGiven(item, given) {
    switch (item.type) {
      case 'mc': return given == null ? '' : clip((item.choices[given] != null ? item.choices[given] : '?'), 120);
      case 'tf': return given === true ? 'O' : given === false ? 'X' : '';
      case 'cloze': return (given || []).join(' | ');
      case 'order': return (given || []).join(' → ');
      case 'match': {
        var map = {}; item.pairs.forEach(function (p) { map[p[0]] = p[1]; });
        var bad = (given || []).filter(function (p) { return map[p[0]] !== p[1]; });
        return bad.length ? '잘못 연결: ' + bad.map(function (p) { return p[0] + '→' + p[1]; }).join('; ') : '전부 맞게 연결';
      }
      default: return clip(given == null ? '' : given, 200);
    }
  }
  function answerText(item) {
    switch (item.type) {
      case 'mc': return item.choices[item.answer];
      case 'tf': return item.answer ? 'O (참)' : 'X (거짓)';
      case 'cloze': return item.answer.join(' | ');
      case 'order': return item.answer.join(' → ');
      case 'match': return item.pairs.map(function (p) { return p[0] + ' ↔ ' + p[1]; }).join('; ');
      case 'sa': return item.answer + (item.alts && item.alts.length ? ' (또는 ' + item.alts.join(', ') + ')' : '');
      case 'num': return item.answer + (item.unit ? ' ' + item.unit : '');
    }
    return '';
  }

  /* ---------- tap mode (no typing): choices for sa / num ---------- */
  function hash32(s) {
    var x = 2166136261 >>> 0; s = String(s);
    for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; }
    return x;
  }
  /** deterministic PRNG (mulberry32) from a number or string seed */
  function rngFrom(seed) {
    var a = typeof seed === 'number' ? seed >>> 0 : hash32(seed);
    return function () {
      a = (a + 0x6D2B79F5) >>> 0; var t = a;
      t = Math.imul(t ^ t >>> 15, 1 | t); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  /** other items split into [same lesson, same unit, rest of course] (items carry _u/_l from flatItems) */
  function tiers(item, items) {
    var T = [[], [], []];
    (items || []).forEach(function (x) {
      if (x === item || (x.id === item.id && x._l === item._l)) return;
      T[x._l === item._l ? 0 : x._u === item._u ? 1 : 2].push(x);
    });
    return T;
  }
  /** sa → [answer, up to n-1 distractors]. Distractors: other sa answers (lesson → unit → course),
      then other term-like strings (mc choices, cloze bank, match terms). Never equal (after normSA) to answer/alts or each other. */

        delete cd.intro.seen[IL0.l.id];
        startLesson(IL0);
        out0.introShown = !!$intro && !S;
        for (var ii = 0; ii < IL0.l.intro.length - 1; ii++) document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
        out0.introLast = !!$intro && /문제 풀기 시작/.test($intro.textContent);
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
        var ilog = cd.intro.log[cd.intro.log.length - 1];
        out0.introThenLesson = !$intro && !!S && !!cd.intro.seen[IL0.l.id] && ilog.lesson === IL0.l.id && ilog.intro === true && ilog.cards === IL0.l.intro.length;
        S = null; go('path');
        startLesson(IL0); out0.introNotAgain = !$intro && !!S; S = null;
      }
      ORDER.forEach(function (c) { DATA[c].lessons.forEach(function (x) { DATA[c].intro.seen[x.l.id] = DATA[c].intro.seen[x.l.id] || 1; }); });
      var out = out0, L0 = cd.lessons[0], xp0 = G.xp, logN = cd.log.length, hearts0 = G.hearts, n = 0, wrongDone = false, seenIds = {};
      startLesson(L0);
      while (S && n < 200) {
        var cur = S.cur, ok1 = wrongDone || seenIds[cur.id] ? true : false;
        if (!wrongDone) wrongDone = true;
        seenIds[cur.id] = 1;
        submit(makeGiven(cur, ok1)); afterFeedback(); n++;
      }
      out.lessonDone = !S; out.steps = n; out.xpGain = G.xp - xp0; out.logAdded = cd.log.length - logN; out.heartsLost = hearts0 - G.hearts;
      out.crown = (cd.ls[L0.l.id] || {}).c || 0; out.resultShown = !!document.querySelector('.result');
      // tap mode: sa as choices → click the right one → Enter → Enter
      G.input = 'tap';
      var saIt = cd.items.filter(function (x) { return x.type === 'sa'; })[0];
      startLesson(cd.lessons.filter(function (x) { return x.l.id === saIt._l; })[0], saIt);
      var chs = document.querySelectorAll('.qbody .choice'); out.tapChoices = chs.length;
      for (var ci = 0; ci < chs.length; ci++) if (D.normSA(chs[ci].lastChild.textContent) === D.normSA(saIt.answer)) chs[ci].click();
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      var lastE = cd.log[cd.log.length - 1]; out.tapLogged = lastE.id === saIt.id && lastE.mode === 'tap' && lastE.ok === true;
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      out.sheetClosedByEnter = !$sheet.classList.contains('show');
      S = null;
      // self-grade on a num item, answered with key "2"
      var numIt = cd.items.filter(function (x) { return x.type === 'num'; })[0];
      startLesson(cd.lessons.filter(function (x) { return x.l.id === numIt._l; })[0], numIt);
      selfReveal();
      document.dispatchEvent(new KeyboardEvent('keydown', { key: '2', bubbles: true }));
      lastE = cd.log[cd.log.length - 1]; out.selfLogged = lastE.id === numIt.id && lastE.mode === 'self' && lastE.ok === true && lastE.given === '(self:ok)';
      S = null; G.input = 'key';
      // keyboard 1–4 on an mc item
      var mcIt = cd.items.filter(function (x) { return x.type === 'mc'; })[0];
      startLesson(cd.lessons.filter(function (x) { return x.l.id === mcIt._l; })[0], mcIt);
      document.dispatchEvent(new KeyboardEvent('keydown', { key: '3', bubbles: true }));
      out.keySelect = document.querySelectorAll('.qbody .choice')[2].classList.contains('sel');
      S = null;
      if (HUB) { var m = 0; startMixed(); var cs = {}; while (S && m < 100) { cs[S.cur._c] = 1; submit(makeGiven(S.cur, true)); afterFeedback(); m++; } out.mixedDone = !S && m > 0; out.mixedCourses = Object.keys(cs).length; out.byC = Object.keys((G.days[today()] || {}).byC || {}).length; }
      enterBed(); bedFlow(false); var cl = cd.log.length; cfMark(true); cfMark(false);
      out.bedKnown = BED.known; out.bedUnknown = BED.unknown; out.cardLogs = ORDER.reduce(function (a, c) { return a + DATA[c].log.filter(function (e) { return e.m === 'card'; }).length; }, 0);
      sleepEnd(); out.slept = !!(BED && BED.slept && document.querySelector('.sleep')); out.nights = NIGHTS.length;
      var rep = HUB ? hubReportMd() : reportMd(cd);
      out.reportHasIntro = /개념 카드\(📖\) 본 레슨: [1-9]/.test(rep);
      out.reportLen = rep.length; out.reportHasNight = /누워서 모드 기록/.test(rep); out.reportHasMissed = /가장 많이 틀린 문항/.test(rep);
      exitBed(); out.bedExited = !BED && !document.body.classList.contains('bed');
      out.payloadOk = !!payload(cd).report && payload(cd).log.length === cd.log.length;
      if (HUB) out.hubPayloadOk = hubPayload().schema === 'duo-hub/1';
      window.__autoplay = out;
    }
    else go(scr);
  }

  /* ---------- keyboard shortcuts (mouse/keyboard users) ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || '', typing = tag === 'INPUT' || tag === 'TEXTAREA';
    if ($zoom) { if (e.key === 'Escape') closeZoom(); return; }
    if ($intro) {
      if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); introGo(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); introGo(-1); }
      else if (e.key === 'Escape') finishIntro(true);
      return;
    }
    if ($modal.classList.contains('show') || $wiki.classList.contains('show')) return;
    if ($sheet.classList.contains('show')) {
      if (e.key === 'Enter' || e.key === ' ') { var cb = $sheet.querySelector('.btn'); if (cb) { e.preventDefault(); cb.click(); } }
      return;
    }
    if (typing) return;
    if (CF) {
      if (e.key === '1' || e.key === 'ArrowLeft') cfMark(false);
      else if (e.key === '2' || e.key === 'ArrowRight') cfMark(true);
      else if (e.key === ' ') { e.preventDefault(); cfPause(); }
      else if (e.key === 'Enter') { if (CF.phase === 'q') { CF.gen++; cfReveal(); } else cfNext(); }
      return;
    }
    if (!S) return;
    if (/^[1-9]$/.test(e.key)) {
      var selfBtns = document.querySelectorAll('.selfrow button');
      var btns = selfBtns.length ? selfBtns : document.querySelectorAll('.qbody .choice, .qbody .tf');
      var b = btns[Number(e.key) - 1];
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    } else if (e.key === 'Enter') {
      var c = document.querySelector('.lfoot .check');
      if (c && !c.disabled) { e.preventDefault(); c.click(); }
    }
  });

  /* ---------- boot ---------- */
  if (DEMO) { seedDemo(); if (P.get('input')) G.input = P.get('input'); if (P.get('bed')) enterBed(); }
  ORDER.forEach(function (c) { touchCourse(DATA[c]); });
  heartsNow(); saveG();
  var scr = P.get('screen');
  setupSched();
  if (scr) demoScreen(scr); else go(current);
  if (!DEMO && SYNC.token && SYNC.repo) setTimeout(function () { syncNow(true); }, 1500);
  if (P.has('probe')) setTimeout(function () {
    var info = { sw: document.documentElement.scrollWidth, cw: document.documentElement.clientWidth, screen: scr, auto: window.__autoplay || null, imgOk: [].filter.call(document.images, function (i) { return i.complete && i.naturalWidth > 0; }).length, imgBroken: document.querySelectorAll('.qimg.broken').length };
    var pr = document.createElement('pre'); pr.id = 'probe'; pr.textContent = JSON.stringify(info);
    document.body.appendChild(pr);
    try { if (window.parent !== window) window.parent.postMessage({ duoProbe: info }, '*'); } catch (e) { /* ignore */ }
  }, 600);
  window.addEventListener('online', function () { if (current === 'wiki') renderWikiTab(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !DEMO) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache optional */ });
  }
})();

</script>
