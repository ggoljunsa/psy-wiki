g/psy8-p7-slide.jpg"}]},{"id":"u8b","title":"배고픔","intro":[{"title":"배고픔 연구","body":"키스(1950) **준기아 연구** → 냉담·무기력, 먹는 것에 강박. **캐넌 & 워시번**(1912): 풍선을 삼켜 위 수축 기록 — 그러나 위가 없는 쥐도 배고픔을 느낀다 → 화학적 기제가 있다.","src":"8장 p.9–10"},{"title":"혈당과 시상하부","body":"**혈당**이 떨어지면 배고픔. **시상하부**가 혈액의 화학 변화를 감지해 조절: 궁상핵·**오렉신**은 식욕 촉진, 식욕 억제 중추가 손상되면 섭식이 멈추지 않음(과식).","src":"8장 p.11–12"},{"title":"식욕 호르몬","body":"촉진: **그렐린**(공복의 위) · 오렉신(시상하부). 억제: **PYY**(소화관) · **렙틴**(지방세포).","src":"8장 p.12–13"},{"title":"조절점과 맛 선호","body":"**조절점** = 신체가 정한 체중 지점 — 아래로 가면 배고픔↑·**기초대사율**↓로 되돌아감(요요). 단맛·짠맛 선호만 유전적·보편적, 나머지는 경험(혐오 학습). **낯섦 공포증** = 처음 보는 음식 기피.","src":"8장 p.14–17"}],"items":[{"id":"u8b-01","type":"sa","q":"준기아(semistarvation) 연구 — 참가자들이 냉담·무기력해지고 먹는 것에만 강박적 — 이 연구자(학자)는?","answer":"앤슬 키스","alts":["Ancel Keys","앤슬 키스(Ancel Keys)"],"explain":"**앤슬 키스 (Ancel Keys, 1950)** — 생리적 욕구가 상위 욕구를 밀어낸다(매슬로우 근거)","src":"8장 p.9","wiki":"매슬로우의 욕구 위계","explainImg":"img/psy8-p9-slide.jpg"},{"id":"u8b-02","type":"mc","q":"앤슬 키스(1950)의 **준기아 연구** 참가자들에게 나타난 변화로 옳은 것은?","choices":["사회적 관계에 대한 욕구가 더 커졌다","냉담·무기력해지고 먹는 것과 관련된 것에만 강박적이 되었다","자기실현 욕구가 두드러졌다","공격성이 사라지고 이타 행동이 늘었다"],"answer":1,"explain":"매슬로우 위계(생리적 욕구 우선)의 근거. 슬라이드 그대로 — 생리적 욕구의 강력함. (오답 ① 사회적 관계에 대한 욕구가 더 커졌다: 반대 — 다른 것에는 무관심해졌다.)","src":"8장 p.9","diff":2,"wiki":"매슬로우의 욕구 위계","explainImg":"img/psy8-p9-slide.jpg"},{"id":"u8b-03","type":"sa","q":"풍선을 삼켜 **위 수축**을 기록 — 위가 수축할 때 배고픔을 느낀다 — 이 연구자(학자)는?","answer":"캐넌 & 워시번","alts":["Cannon & Washburn","캐넌 & 워시번(Cannon & Washburn)","캐넌과 워시번","캐넌, 워시번"],"explain":"**캐넌 & 워시번 (Cannon & Washburn, 1912)** — 그러나 위가 제거된 쥐도 배고픔을 느낌(Tsang)","src":"8장 p.10","wiki":"위 수축 실험","explainImg":"img/psy8-p10-slide.jpg"},{"id":"u8b-04","type":"tf","q":"위 수축은 배고픔의 유일한 원인이다.","explain":"아니다. 위가 제거된 쥐도 계속 배고픔을 느낀다(Tsang) → 혈당·시상하부·호르몬 같은 화학적 기제가 있다.","src":"8장 p.10","wiki":"위 수축 실험","answer":false,"explainImg":"img/psy8-p10-slide.jpg"},{"id":"u8b-05","type":"tf","q":"위 수축 실험(Cannon & Washburn)의 Cannon과 캐넌-바드 정서 이론의 Cannon은 같은 사람이다.","explain":"같은 사람(Walter Cannon)이다 — 위 수축 실험(Cannon & Washburn)과 캐넌-바드 이론 양쪽에 등장한다.","src":"8장 p.10, 29","wiki":"캐넌-바드 이론","answer":true,"explainImg":"img/psy8-p10-slide.jpg"},{"id":"u8b-06","type":"sa","q":"혈액 내 화학적 변화를 감지해 배고픔을 조절하는 두뇌 영역 — 손상 시 굶주린 동물도 먹이에 관심 없음 — 명칭을 쓰시오.","answer":"시상하부","alts":["hypothalamus","시상하부(hypothalamus)"],"explain":"**시상하부 (hypothalamus)** — 혈액 내 화학적 변화를 감지해 배고픔을 조절하는 두뇌 영역 — 손상 시 굶주린 동물도 먹이에 관심 없음","src":"8장 p.11–12","wiki":"시상하부","explainImg":"img/psy8-p12-slide.jpg"},{"id":"u8b-07","type":"mc","q":"두뇌의 **식욕 억제 중추**가 손상된 동물에게 나타나는 결과는?","choices":["굶주려도 먹이에 관심을 보이지 않는다","섭식의 중단이 이루어지지 않는다(과식)","배고픔 신호 호르몬 그렐린 분비가 멈춘다","기초대사율이 급격히 올라 체중이 줄어든다"],"answer":1,"explain":"촉진 부위 손상 → 무관심, 억제 중추 손상 → 멈추지 못함. Duggan & Booth(1986) — 억제가 안 되니 계속 먹는다. (오답 ① 굶주려도 먹이에 관심을 보이지 않는다: 식욕 **촉진** 부위(시상하부) 손상 시의 결과다.)","src":"8장 p.12","diff":3,"wiki":"식욕 관련 호르몬","explainImg":"img/psy8-p12-slide.jpg"},{"id":"u8b-08","type":"sa","q":"공복 상태의 **위**에서 분비되어 뇌에 '배고프다'는 신호를 보내는 호르몬을 쓰시오.","answer":"그렐린","alts":["ghrelin","그렐린(ghrelin)"],"explain":"**그렐린** — 반대로 PYY(소화관)·렙틴(지방세포)은 배고픔을 줄인다.","src":"8장 p.13","diff":1,"wiki":"그렐린","explainImg":"img/psy8-p13-slide.jpg"},{"id":"u8b-09","type":"sa","q":"**소화관**에서 분비되어 뇌에 '배가 고프지 않다' 신호 — 명칭을 쓰시오.","answer":"PYY","alts":["펩타이드 YY"],"explain":"**PYY** — **소화관**에서 분비되어 뇌에 '배가 고프지 않다' 신호","src":"8장 p.13","wiki":"식욕 관련 호르몬","explainImg":"img/psy8-p13-slide.jpg"},{"id":"u8b-10","type":"sa","q":"**지방세포**에서 분비되는 단백질 호르몬으로 배고픔을 감소시키는 것을 쓰시오.","answer":"렙틴","alts":["leptin","렙틴(leptin)"],"explain":"**렙틴** — '지방이 충분하다, 이제 그만'.","src":"8장 p.13","diff":1,"wiki":"렙틴","explainImg":"img/psy8-p13-slide.jpg"},{"id":"u8b-11","type":"match","q":"식욕 호르몬과 분비 부위·작용을 연결하시오","explain":"촉진: 그렐린·오렉신 / 억제: PYY·렙틴. 분비 부위를 바꾼 보기에 주의.","src":"8장 p.12–13","wiki":"식욕 관련 호르몬","pairs":[["그렐린","위(공복) — 배고픔 촉진"],["오렉신","시상하부 — 식욕 촉진"],["PYY","소화관 — 배고프지 않다는 신호"],["렙틴","지방세포 — 배고픔 감소"]],"explainImg":"img/psy8-p13-slide.jpg"},{"id":"u8b-12","type":"mc","q":"식욕 관련 호르몬과 분비 부위·신호의 연결이 옳은 것은?","choices":["렙틴 — 위 — '배고프다'","그렐린 — 위(공복) — '배고프다'","PYY — 지방세포 — 배고픔 증가","오렉신 — 소화관 — 식욕 억제"],"answer":1,"explain":"촉진 = 그렐린·오렉신, 억제 = PYY·렙틴. p.13 그대로. (오답 ① 렙틴 — 위 — '배고프다': 렙틴은 **지방세포**에서 분비되어 배고픔을 **감소**시킨다.)","src":"8장 p.12–13","diff":2,"wiki":"식욕 관련 호르몬","explainImg":"img/psy8-p13-slide.jpg"},{"id":"u8b-13","type":"sa","q":"신체가 설정한 **특정 체중 지점**으로, 요요 현상을 설명하는 개념을 쓰시오.","answer":"조절점","alts":["set point","체중 조절점","설정점"],"explain":"**조절점(set point)** — 기초대사율과 함께 일정 체중으로 회귀.","src":"8장 p.14","diff":1,"wiki":"조절점","explainImg":"img/psy8-p14-slide.jpg"},{"id":"u8b-14","type":"mc","q":"다이어트로 체중을 뺀 뒤 금세 원래 체중으로 돌아가는 **요요 현상**을 설명하는 개념은?","choices":["여키스-닷슨 법칙","낯섦 공포증","포만점","조절점과 기초대사율"],"answer":3,"explain":"사람은 일정한 체중을 유지하려는 경향(체중의 항상성)이 있다. 체중이 조절점 아래로 가면 배고픔↑·기초대사율↓ → 조절점으로 회귀. (오답 ① 여키스-닷슨 법칙: 각성과 수행의 관계다.)","src":"8장 p.14","diff":1,"wiki":"조절점","explainImg":"img/psy8-p14-slide.jpg"},{"id":"u8b-15","type":"sa","q":"**이전에 먹은 적 없는 음식**을 기피하는 경향 — 낯선 음식은 독이 있을 수 있다는 판단 — 명칭을 쓰시오.","answer":"낯섦 공포증","alts":["새것 공포증","neophobia","낯섦 공포증(새것 공포증)"],"explain":"**낯섦 공포증 (새것 공포증, neophobia)** — 서양권의 두족류·해조류 혐오 — **이전에 먹은 적 없는 음식**을 기피하는 경향 — 낯선 음식은 독이 있을 수 있다는 판단","src":"8장 p.17","wiki":"낯섦 공포증","explainImg":"img/psy8-p17-slide.jpg"},{"id":"u8b-16","type":"mc","q":"**맛 선호**에 대한 설명으로 옳지 **않은** 것은?","choices":["단맛과 짠맛에 대한 선호는 유전적이며 보편적이다","모든 맛 선호는 유전적이고 보편적이어서 경험의 영향을 받지 않는다","일부 음식에 대한 불쾌한 경험은 혐오를 발전시킨다","스트레스로 인한 단 음식 선호는 세로토닌 분비를 촉진한다"],"answer":1,"explain":"맛 선호 = 생물학적 + 문화적 요인. 단맛·짠맛만 유전·보편이고, 나머지는 **조건형성**된 부분이 있다. (오답 ① 단맛과 짠맛에 대한 선호는 유전적이며 보편적이다: 옳다.)","src":"8장 p.16","diff":2,"wiki":"낯섦 공포증","explainImg":"img/psy8-p16-slide.jpg"}]},{"id":"u8c","title":"소속 동기와 성취 동기","intro":[{"title":"소속 욕구","body":"**소속(친애) 욕구** = 사회적 동물의 핵심 동기. **내집단 편향** = 내집단 선호. **자기 결정 이론** = 유능성·자율성·관계성 욕구.","src":"8장 p.19–21"},{"title":"사회적 배척","body":"SNS 차단 같은 **배척(추방)**은 실제 고통처럼 **전측대상회**를 활성화 → 사회성 저하 → 다시 배척되는 **악순환**, 공격 행동↑. SNS 사용과 우울은 **약한 정적 상관**, 실험은 비일관 → 인과 단정 불가(Haidt & Twenge).","src":"8장 p.22–25"},{"title":"자기노출","body":"즐거움·걱정·약점을 타인과 **공유**하는 것 — 관계를 돈독하게 한다.","src":"8장 p.26"},{"title":"성취 동기와 그릿","body":"**성취 동기** = 높은 기준을 충족하려는 욕구, 재능보다 수행을 잘 예측. **그릿** = 장기 목표를 향한 열정과 집념(Duckworth). **내재적 동기** = 활동 자체가 좋아서 / **외재적 동기** = 보상·처벌 때문에.","src":"8장 p.27"}],"items":[{"id":"u8c-01","type":"sa","q":"사회적 동물로서 지니는 **핵심 동기** — 진화적으로 선천적 특질 — 명칭을 쓰시오.","answer":"소속 욕구","alts":["친애 욕구","need to belong","affiliation need","소속 욕구(need to belong / affiliation need)"],"explain":"**소속 욕구 / 친애 욕구 (need to belong / affiliation need)** — **Baumeister & Leary (1995)**","src":"8장 p.19","wiki":"소속 욕구","explainImg":"img/psy8-p19-slide.jpg"},{"id":"u8c-02","type":"sa","q":"대부분의 사람이 외집단보다 **내집단을 선호**하는 경향을 쓰시오.","answer":"내집단 편향","alts":["내집단 편향성","ingroup bias","in-group bias","내집단편향"],"explain":"**내집단 편향(ingroup bias)** — 사회적 정체성은 건강·안녕감을 증진.","src":"8장 p.20","diff":1,"wiki":"내집단 편향","explainImg":"img/psy8-p20-slide.jpg"},{"id":"u8c-03","type":"sa","q":"인간은 **유능성·자율성·관계성**의 욕구를 채우고자 한다 — 충족 시 스트레스 감소·자존감 고양 — 명칭을 쓰시오.","answer":"자기 결정 이론","alts":["Self-Determination Theory","자기 결정 이론(Self-Determination Theory)"],"explain":"**자기 결정 이론 (Self-Determination Theory)** — 교재: Deci & Ryan","src":"8장 p.21","wiki":"자기 결정 이론","explainImg":"img/psy8-p21-slide.jpg"},{"id":"u8c-04","type":"mc","q":"**자기 결정 이론**이 말하는 인간의 세 가지 욕구는?","choices":["생리 · 안전 · 소속","지각 · 이해 · 관리","목적 · 의의 · 응집력","유능성 · 자율성 · 관계성"],"answer":3,"explain":"유·자·관. Self-Determination Theory — 충족 시 스트레스 감소·자존감 고양. (오답 ① 생리 · 안전 · 소속: 매슬로우 위계의 하위 단계다.)","src":"8장 p.21","diff":1,"wiki":"자기 결정 이론","explainImg":"img/psy8-p21-slide.jpg"},{"id":"u8c-05","type":"cloze","q":"SNS에서 차단을 당하면 실제 신체 고통을 담당하는 ___ 이 활성화되고, 사회적 배척은 사회성 저하 → 다시 추방되는 ___ 을 만든다.","explain":"사회적 배척(ostracism)은 실제 고통과 유사하며(전측대상회, ACC), 자기파괴·공격적 행동을 늘린다.","src":"8장 p.22–23","wiki":"사회적 배척","answer":["전측대상회","악순환"],"bank":["전측대상회","악순환","편도체","선순환","시상하부"],"explainImg":"img/psy8-p22-slide.jpg"},{"id":"u8c-06","type":"sa","q":"실제 신체 고통과 유사한 경험 — 사회성 저하 → 다시 따돌려지는 **악순환**, 자기파괴·공격적 행동 증가로 이어지는 것 — 명칭을 쓰시오.","answer":"사회적 배척","alts":["추방","ostracism","사회적 배척(ostracism)"],"explain":"**사회적 배척 / 추방 (ostracism)** — 실제 고통과 유사 — 사회성 저하 → 다시 추방되는 **악순환**, 자기파괴·공격적 행동 증가","src":"8장 p.22–23","wiki":"사회적 배척","explainImg":"img/psy8-p23-slide.jpg"},{"id":"u8c-07","type":"mc","q":"SNS에서 차단을 당했을 때 활성화되며, **실제 신체의 고통**을 담당하는 대뇌 영역은?","choices":["편도체","전측대상회","시상하부","브로카 영역"],"answer":1,"explain":"anterior cingulate cortex(ACC). Rotge et al.(2015) — 사회적 배척의 고통 ≈ 신체적 고통. (오답 ① 편도체: 정서(공포) 회로의 중추로, 슬라이드가 이 연구에서 든 영역이 아니다.)","src":"8장 p.22","diff":2,"wiki":"사회적 배척","explainImg":"img/psy8-p22-slide.jpg"},{"id":"u8c-08","type":"mc","q":"Haidt & Twenge(2019)의 **SNS와 정신건강** 연구 결과로 옳은 것은?","choices":["사용 시간과 우울/불안은 약한 정적 상관을 보이지만 실험 연구 결과는 일관성이 떨어진다","SNS가 우울을 일으킨다는 인과 관계가 실험으로 명확히 입증되었다","SNS 사용과 우울/불안 사이에는 아무 상관도 없다","SNS 사용 여부는 미래의 정신 건강을 전혀 예측하지 못한다"],"answer":0,"explain":"1장 연결: 상관 ≠ 인과. 그래서 결론은 '일장일단' — 상관만으로 인과를 단정할 수 없다. (오답 ② SNS가 우울을 일으킨다는 인과 관계가 실험으로 명확히 입증되었다: 실험 결과는 **비일관**이다.)","src":"8장 p.25","diff":2,"wiki":"자기노출","explainImg":"img/psy8-p25-slide.jpg"},{"id":"u8c-09","type":"tf","q":"SNS 사용이 우울을 일으킨다는 인과관계가 실험으로 입증되었다.","explain":"아니다. 사용 시간과 우울/불안은 **약한 정적 상관**이고 실험 연구는 **일관성이 떨어진다**(Haidt & Twenge) → 인과 단정 불가.","src":"8장 p.25","wiki":"사회적 배척","answer":false,"explainImg":"img/psy8-p25-slide.jpg"},{"id":"u8c-10","type":"sa","q":"즐거움·걱정거리·약점 등을 타인과 **공유**하는 것 — SNS로 늘면 관계가 돈독해짐 — 명칭을 쓰시오.","answer":"자기노출","alts":["self-disclosure","자기노출(self-disclosure)"],"explain":"**자기노출 (self-disclosure)** — 동시에 자기애(나르시시즘) 촉진(Weiser)","src":"8장 p.26","wiki":"자기노출","explainImg":"img/psy8-p26-slide.jpg"},{"id":"u8c-11","type":"sa","q":"중요한 성취를 달성하고 **높은 기준을 충족**시키려는 욕구 — 타고난 재능보다 수행을 더 잘 예측(Bloom) — 명칭을 쓰시오.","answer":"성취 동기","alts":["Achievement motivation","성취 동기(Achievement motivation)"],"explain":"**성취 동기 (Achievement motivation)** — 중요한 성취를 달성하고 **높은 기준을 충족**시키려는 욕구 — 타고난 재능보다 수행을 더 잘 예측(Bloom)","src":"8장 p.27","wiki":"성취 동기","explainImg":"img/psy8-p27-slide.jpg"},{"id":"u8c-12","type":"sa","q":"Duckworth(2016)가 제안한, **장기적 목표**를 향한 **열정과 집념**을 쓰시오.","answer":"그릿","alts":["grit","불굴의 투지","투지"],"explain":"**그릿(불굴의 투지)** — 성실성·자기제어와 같은 개념이라는 비판도 있음.","src":"8장 p.27","diff":1,"wiki":"그릿","explainImg":"img/psy8-p27-slide.jpg"},{"id":"u8c-13","type":"mc","q":"**그릿(grit)** 에 대한 설명으로 옳은 것은?","choices":["Duckworth가 제안한, 장기적 목표를 향한 열정과 집념이며 성실성·자기제어와 같은 개념이라는 비판도 있다","단기적 보상을 얻으려는 순간적 의지를 말한다","타고난 재능이 수행을 가장 잘 예측한다는 개념이다","외부 보상에 연동해 형성되는 동기다"],"answer":0,"explain":"그릿 = 불굴의 투지. p.27 그대로. (오답 ② 단기적 보상을 얻으려는 순간적 의지를 말한다: 그릿은 **장기적** 목표에 대한 것이다.)","src":"8장 p.27","diff":2,"wiki":"그릿","explainImg":"img/psy8-p27-slide.jpg"},{"id":"u8c-14","type":"mc","q":"민수는 부모님께 용돈을 받으려고 공부한다. 민수의 동기는?","choices":["내재적 동기","외재적 동기","그릿","소속 욕구"],"answer":1,"explain":"동기 형성 요인의 위치: 외부 = 외재적. 외부의 보상(용돈)에 연동해 형성. (오답 ① 내재적 동기: 수행 자체가 좋아서 형성되는 동기다.)","src":"8장 p.27","diff":1,"wiki":"내재적 동기와 외재적 동기","explainImg":"img/psy8-p27-slide.jpg"},{"id":"u8c-15","type":"sa","q":"**외부의 보상 혹은 처벌**에 연동해 형성되는 동기 — 명칭을 쓰시오.","answer":"외재적 동기","alts":["extrinsic motivation","외재적 동기(extrinsic motivation)"],"explain":"**외재적 동기 (extrinsic motivation)** — 예: 용돈을 받으려고 공부","src":"8장 p.27","wiki":"내재적 동기와 외재적 동기","explainImg":"img/psy8-p27-slide.jpg"},{"id":"u8c-16","type":"tf","q":"내재적 동기와 외재적 동기를 가르는 기준은 동기를 만드는 요인의 위치(활동 자체 vs 외부 보상·처벌)다.","explain":"내재적 = 수행 자체가 좋아서, 외재적 = 외부 보상·처벌에 연동. 7장 창의성 요소에서도 내재적 동기가 창의성을 높인다고 했다.","src":"8장 p.27","wiki":"내재적 동기와 외재적 동기","answer":true,"explainImg":"img/psy8-p27-slide.jpg"}]},{"id":"u8d","title":"정서 이론","intro":[{"title":"제임스-랑게 vs 캐넌-바드","body":"**제임스-랑게**: 자극 → **신체 반응 → 정서**(떨려서 무섭다). **캐넌-바드**: 신체 반응과 정서가 **동시에** 독립적으로(신체 반응은 정서마다 비슷하고 느리다는 비판).","src":"8장 p.29","img":"img/psy8-p29-jlcb.png","imgAlt":"두 정서 이론의 흐름도"},{"title":"샥터-싱어 2요인 이론","body":"정서 = **신체적 각성 + 인지적 이름 붙이기**. 에피네프린 주사 실험(1962): 효과를 **고지받은** 집단은 흥분을 약 탓으로 돌려 정서 표식을 붙이지 않았다.","src":"8장 p.30"},{"title":"인지 없이도 정서 (자이언스·르두)","body":"정서 반응은 인지적 해석 없이도 생긴다 — 짧게 제시된 자극을 반복해 보면 더 좋아한다(단순 노출 효과).","src":"8장 p.31"},{"title":"정서의 두 경로","body":"**신중한 윗길** = 시상 → 대뇌 피질 → 편도체 → 신체(분석·명명 후 반응). **빠른 아랫길** = 시상 → 편도체(피질 우회, 즉각적, 의식 못 할 수도).","src":"8장 p.32","img":"img/psy8-p32-road.png","imgAlt":"(a) 생각하는 윗길, (b) 빠른 아랫길"}],"items":[{"id":"u8d-01","type":"sa","q":"**신체 반응이 정서를 유발**한다 — '곰을 보고 떨려서 무섭다', '울어서 슬프다' — 명칭을 쓰시오.","answer":"제임스-랑게 이론","alts":["James-Lange theory","제임스-랑게 이론(James-Lange theory)"],"explain":"**제임스-랑게 이론 (James-Lange theory)** — 지지 근거: Damasio(2003), 얼굴·행동 피드백","src":"8장 p.29, 33","wiki":"제임스-랑게 이론","explainImg":"img/psy8-p29-slide.jpg"},{"id":"u8d-02","type":"mc","q":"'숲에서 곰을 보고 → 심장이 뛰고 몸이 떨린다 → 그래서 두렵다'는 설명에 해당하는 정서 이론은?","choices":["캐넌-바드 이론","샥터-싱어 2요인 이론","자이언스·르두의 입장","제임스-랑게 이론"],"answer":3,"explain":"'떨려서 무섭다' = 제임스-랑게. 신체 반응이 정서를 유발한다. (오답 ① 캐넌-바드 이론: 신체 반응과 정서가 **동시에** 독립적으로 생긴다.)","src":"8장 p.29, 33","diff":1,"wiki":"제임스-랑게 이론","explainImg":"img/psy8-p29-slide.jpg"},{"id":"u8d-03","type":"order","q":"제임스-랑게 이론의 정서 발생 순서를 놓으시오","explain":"제임스-랑게: 신체 반응이 정서를 유발한다 — '떨려서 무섭다', '울어서 슬프다'.","src":"8장 p.29, 33","wiki":"제임스-랑게 이론","answer":["자극 (숲에서 곰을 봄)","신체 반응 (심장이 뛰고 몸이 떨림)","정서 (두려움)"],"explainImg":"img/psy8-p29-slide.jpg"},{"id":"u8d-04","type":"sa","q":"신체 반응과 정서는 **독립적으로 동시에** 발생 — 신체 반응은 정서마다 유사하고 변화가 느리다는 비판 — 명칭을 쓰시오.","answer":"캐넌-바드 이론","alts":["Cannon-Bard theory","캐넌-바드 이론(Cannon-Bard theory)"],"explain":"**캐넌-바드 이론 (Cannon-Bard theory)** — 신체 반응과 정서는 **독립적으로 동시에** 발생 — 신체 반응은 정서마다 유사하고 변화가 느리다는 비판","src":"8장 p.29, 33","wiki":"캐넌-바드 이론","explainImg":"img/psy8-p29-slide.jpg"},{"id":"u8d-05","type":"mc","q":"캐넌-바드 이론이 제임스-랑게 이론을 비판한 근거는?","choices":["신체 반응은 정서마다 유사한 점이 많고 변화가 느려 서로 다른 정서를 유발할 수 없다","정서는 반드시 인지적 이름 붙이기를 거쳐야 한다","역치 하 자극도 선호를 만든다","신체 감각과 정서 반응이 연관되어 있다"],"answer":0,"explain":"캐넌-바드: 자극 → (신체 반응 ∥ 정서). p.29 비판 그대로. (오답 ② 정서는 반드시 인지적 이름 붙이기를 거쳐야 한다: 샥터-싱어 2요인 이론의 주장이다.)","src":"8장 p.29","diff":2,"wiki":"제임스-랑게 이론","explainImg":"img/psy8-p29-slide.jpg"},{"id":"u8d-06","type":"tf","q":"캐넌-바드 이론은 신체 반응이 정서를 유발한다고 본다.","explain":"그건 제임스-랑게다. 캐넌-바드는 신체 반응과 정서가 **독립적으로 동시에** 발생한다고 본다.","src":"8장 p.29, 33","wiki":"캐넌-바드 이론","answer":false,"explainImg":"img/psy8-p29-slide.jpg"},{"id":"u8d-07","type":"sa","q":"정서를 경험하려면 **신체적 각성**과 그 각성에 대한 **인지적 이름 붙이기**가 모두 필요하다는 이론을 쓰시오.","answer":"2요인 이론","alts":["샥터-싱어 2요인 이론","샥터 싱어 이론","두 요인 이론","이요인 이론","two-factor theory","샥터-싱어 이론","2요인"],"explain":"**샥터-싱어 2요인 이론** — 신체적 각성 + 이름 붙이기 = 정서.","src":"8장 p.30","diff":2,"wiki":"샥터-싱어 2요인 이론","explainImg":"img/psy8-p30-slide.jpg"},{"id":"u8d-08","type":"mc","q":"Schachter & Singer(1962)의 에피네프린 실험에서 **주사의 효과를 미리 고지받은** 집단의 결과는?","choices":["고지받지 않은 집단보다 더 강한 정서를 느꼈다","옆 사람(공모자)의 기분을 따라 정서를 경험했다","에피네프린을 맞았는데도 신체 각성이 일어나지 않았다","신체 흥분을 약물 탓으로 돌려 어떤 정서 표식도 붙이지 않았다"],"answer":3,"explain":"2요인 = 신체적 각성 + 인지적 이름 붙이기. 각성의 원인을 알면 정서로 '명명'하지 않는다 → 해석의 중요성. (오답 ① 고지받지 않은 집단보다 더 강한 정서를 느꼈다: 반대다.)","src":"8장 p.30","diff":3,"wiki":"샥터-싱어 2요인 이론","explainImg":"img/psy8-p30-slide.jpg"},{"id":"u8d-09","type":"sa","q":"**정서 반응은 인지 기반 해석 없이도** 발생 가능 — 역치 하 점화로 탐구 — 이 연구자(학자)는?","answer":"자이언스 (Zajonc) · 르두","alts":["LeDoux","자이언스 (Zajonc) · 르두(LeDoux)","자이언스 (Zajonc), 르두","자이언스 (Zajonc)과 르두"],"explain":"**자이언스 (Zajonc) · 르두 (LeDoux)** — **정서 반응은 인지 기반 해석 없이도** 발생 가능 — 역치 하 점화로 탐구","src":"8장 p.31, 33","wiki":"자이언스·르두·라자루스의 입장","explainImg":"img/psy8-p31-slide.jpg"},{"id":"u8d-10","type":"mc","q":"지각할 수 없을 만큼 짧게 제시된 자극을 반복해서 본 사람들이 그 자극을 더 선호하게 되었다(Kunst-Wilson & Zajonc, 1980). 이 결과가 지지하는 주장은?","choices":["정서 반응은 인지 기반 해석 없이도 발생할 수 있다","정서는 신체 반응으로부터 도출된다","정서는 각성과 그에 대한 의식적 해석으로 결정된다","신체 반응과 정서는 동시에 독립적으로 일어난다"],"answer":0,"explain":"교재 용어: 단순 노출 효과. 신경학적 근거 = 아랫길. 자이언스·르두의 입장 — 역치 하 점화. (오답 ② 정서는 신체 반응으로부터 도출된다: 제임스-랑게 이론이다.)","src":"8장 p.31","diff":2,"wiki":"자이언스·르두·라자루스의 입장","explainImg":"img/psy8-p31-slide.jpg"},{"id":"u8d-11","type":"tf","q":"'정서 반응은 인지 기반 해석 없이도 발생할 수 있다'는 입장의 대표 학자는 자이언스와 르두다.","explain":"슬라이드 p.31·33은 라자루스를 같은 묶음에 넣었지만, 교재에서 라자루스는 인지적 평가를 강조한 반대편이다. 대표는 **자이언스·르두**.","src":"8장 p.31, 33","wiki":"자이언스·르두·라자루스의 입장","answer":true,"explainImg":"img/psy8-p31-slide.jpg"},{"id":"u8d-12","type":"sa","q":"정서 신경 회로 중 '**시상 → 대뇌 피질 → 편도체 → 신체**'로 이어지며 상대적으로 복잡한 감정을 처리하는 경로를 쓰시오.","answer":"윗길","alts":["신중한 윗길","high road","상위 경로"],"explain":"**신중한 윗길(high road)** — 아랫길(시상 → 편도체)과 대비.","src":"8장 p.32","diff":2,"wiki":"정서의 신경 회로","explainImg":"img/psy8-p32-slide.jpg"},{"id":"u8d-13","type":"order","q":"정서의 신중한 윗길 경로를 순서대로 놓으시오","explain":"윗길 = 피질 경유(분석·명명 후 반응). 아랫길 = 시상 → 편도체(피질 우회, 빠름).","src":"8장 p.32","wiki":"정서의 신경 회로","answer":["시상","대뇌 피질","편도체","신체 반응"],"explainImg":"img/psy8-p32-slide.jpg"},{"id":"u8d-14","type":"mc","q":"정서의 신경 회로 중 **빠른 아랫길**의 경로는?","choices":["시상 → 대뇌 피질 → 편도체 → 신체","편도체 → 시상 → 대뇌 피질","시상 → 편도체","시상하부 → 뇌하수체 → 부신"],"answer":2,"explain":"윗길 = 피질 경유(복잡·신중), 아랫길 = 피질 우회(빠름). 피질을 우회 — 즉각 반응, 의식적 자각을 못 할 수도 있다. (오답 ① 시상 → 대뇌 피질 → 편도체 → 신체: **신중한 윗길**이다.)","src":"8장 p.32","diff":2,"wiki":"편도체","explainImg":"img/psy8-p32-slide.jpg"},{"id":"u8d-15","type":"mc","q":"정서 이론과 그 주장의 연결로 옳지 **않은** 것은?","choices":["제임스-랑게 — 정서는 자극에 대한 신체 반응으로부터 도출","캐넌-바드 — 신체 반응과 정서가 동시에 촉발","자이언스·르두 — 어떤 정서 반응은 의식적 평가 없이 즉각 발생","샥터-싱어 — 정서 유발 자극이 신체 반응과 정서 반응을 동시에 촉발"],"answer":3,"explain":"제임스-랑게(신체 → 정서) / 캐넌-바드(동시) / 2요인(각성 + 평가) / 자이언스·르두(즉각). 이것은 **캐넌-바드**의 설명이다. 샥터-싱어 = 신체적 각성 + 의식적 인지 평가. (오답 ① 제임스-랑게 — 정서는 자극에 대한 신체 반응으로부터 도출: 옳다.)","src":"8장 p.33","diff":3,"wiki":"샥터-싱어 2요인 이론","explainImg":"img/psy8-p33-slide.jpg"},{"id":"u8d-16","type":"match","q":"정서 이론과 주장을 연결하시오","explain":"p.33 요약표 그대로. 2요인 실험은 에피네프린 주사 + 고지 여부.","src":"8장 p.33","wiki":"샥터-싱어 2요인 이론","pairs":[["제임스-랑게","신체 반응 → 정서"],["캐넌-바드","신체 반응과 정서가 동시에"],["샥터-싱어 2요인","신체 각성 + 인지적 이름 붙이기"],["자이언스·르두","인지 없이도 정서 가능"]],"explainImg":"img/psy8-p33-slide.jpg"},{"id":"u8d-17","type":"mc","q":"그림은 두 정서 이론의 흐름도다(이론 이름은 가림). **왼쪽**처럼 자극 → 신체 반응 → 정서 경험의 순서로 정서가 생긴다고 보는 이론은?","explain":"왼쪽 = **제임스-랑게**(신체 반응이 정서를 일으킨다). 오른쪽 = 캐넌-바드(신체 반응과 정서가 동시에). 2요인 이론은 각성 + 인지적 이름 붙이기.","src":"8장 p.29","wiki":"제임스-랑게 이론","choices":["제임스-랑게 이론","캐넌-바드 이론","샥터-싱어 2요인 이론","자이언스·르두의 입장"],"answer":0,"img":"img/psy8-p29-jlcb-q.png","imgAlt":"자극→신체 반응→정서(왼쪽), 자극→신체 반응·정서 동시(오른쪽), 이론 이름은 가림","explainImg":"img/psy8-p29-slide.jpg"},{"id":"u8d-18","type":"sa","q":"그림은 공포 자극이 처리되는 두 경로다. **오른쪽**처럼 시상에서 대뇌 피질을 거치지 않고 편도체로 바로 가서 즉각 반응하는 경로를 무엇이라 하는가?","explain":"오른쪽 = **빠른 아랫길**(시상 → 편도체), 왼쪽 = 신중한 윗길(시상 → 피질 → 편도체 → 신체). 아랫길은 빠르지만 의식적으로 자각하지 못할 수도 있다.","src":"8장 p.32","wiki":"정서의 신경 회로","answer":"빠른 아랫길","alts":["아랫길","low road","하위 경로","빠른아랫길"],"img":"img/psy8-p32-road-q.png","imgAlt":"두 머리 단면 — 왼쪽은 피질을 거치는 경로, 오른쪽은 시상에서 편도체로 직행, 경로 이름은 가림","explainImg":"img/psy8-p32-slide.jpg"}]},{"id":"u8e","title":"정서의 표현","intro":[{"title":"비언어적 의사소통","body":"표정·몸짓·시선으로 정서를 표현. 학대받은 아동은 모호한 표정을 **분노**로 빨리 지각(Pollak & Kistler). 26개 문화권에서 **여성**이 감정에 더 개방적(Costa).","src":"8장 p.34–35"},{"title":"에크만의 보편적 정서","body":"문화권에 관계없이 관찰되는 **6개**의 정서, 유아기부터. 단 **표출 수준**은 문화마다 다르다: 개인주의 = 표출 장려, 집단주의 = 억제(van Hemert).","src":"8장 p.36","img":"img/psy8-p36-ekman.png","imgAlt":"여섯 가지 보편적 표정 사진"},{"title":"얼굴·행동 피드백 효과","body":"**얼굴 피드백** = 표정이 정서를 증폭(펜을 이로 물어 미소 근육 → 만화가 더 재밌다). **행동 피드백** = 처진 채 걸으면 우울. 둘 다 신체 → 정서라 제임스-랑게를 지지.","src":"8장 p.37"}],"items":[{"id":"u8e-01","type":"sa","q":"표정·몸짓·시선 처리 등 언어 외적인 방식의 정서 표현 — 명칭을 쓰시오.","answer":"비언어적 의사소통","alts":["nonverbal communication","비언어적 의사소통(nonverbal communication)"],"explain":"**비언어적 의사소통 (nonverbal communication)** — 부정적 정서 탐지는 생득적(Burris)","src":"8장 p.34","wiki":"비언어적 의사소통","explainImg":"img/psy8-p34-slide.jpg"},{"id":"u8e-02","type":"mc","q":"어린 시절 학대를 받은 아동이 모호한 표정을 **분노**로 더 빨리 지각한다는 연구(Pollak & Kistler, 2002)가 보여 주는 것은?","choices":["부정적 정서 탐지 능력은 전적으로 학습된다","개인의 환경·경험에 따라 모호한 표정에서 정서를 탐지하는 방식이 달라진다","표정 인식에는 성별 차이가 없다","6개 보편 정서는 문화에 따라 다르다"],"answer":1,"explain":"정서 탐지 = 생득적 기반 + 경험의 영향. p.34 그대로. (오답 ① 부정적 정서 탐지 능력은 전적으로 학습된다: 슬라이드는 부정적 정서 탐지가 **생득적**이라고도 한다(Burris).)","src":"8장 p.34","diff":2,"wiki":"비언어적 의사소통","explainImg":"img/psy8-p34-slide.jpg"},{"id":"u8e-03","type":"sa","q":"학대받은 아동은 모호한 표정을 **분노**로 더 빨리 지각 — 경험에 따라 정서 탐지가 달라진다 — 이 연구자(학자)는?","answer":"Pollak & Kistler","alts":["Pollak & Kistler(2002)","Pollak와 Kistler","Pollak, Kistler"],"explain":"**Pollak & Kistler (2002)** — 학대받은 아동은 모호한 표정을 **분노**로 더 빨리 지각 — 경험에 따라 정서 탐지가 달라진다","src":"8장 p.34","wiki":"비언어적 의사소통","explainImg":"img/psy8-p34-slide.jpg"},{"id":"u8e-04","type":"tf","q":"Pollak & Kistler(2002)에 따르면 학대받은 아동은 모호한 표정을 공포로 더 빨리 지각한다.","explain":"**분노**로 더 빨리 지각한다. 경험에 따라 정서 탐지 방식이 달라진다는 근거다.","src":"8장 p.34","wiki":"비언어적 의사소통","answer":false,"explainImg":"img/psy8-p34-slide.jpg"},{"id":"u8e-05","type":"tf","q":"26개 문화권 연구에서 여성이 남성보다 감정에 더 개방적인 것으로 나타났다.","explain":"Costa et al.(2001): 여성이 더 감정에 개방적. 남성은 다소 단순한 정서 반응 기술(Barrett).","src":"8장 p.35","wiki":"비언어적 의사소통","answer":true,"explainImg":"img/psy8-p35-slide.jpg"},{"id":"u8e-06","type":"sa","q":"**문화권에 관계없이** 관찰되고 유아기부터 나타나는 **6개의 보편적 정서**를 제시한 학자는?","answer":"에크만","alts":["Ekman","폴 에크만","Paul Ekman"],"explain":"**에크만의 보편적 정서 (Ekman)** — 행복·슬픔·분노·공포·놀람·혐오. 단, **표출 수준**은 문화차","src":"8장 p.36","wiki":"비언어적 의사소통","explainImg":"img/psy8-p36-slide.jpg"},{"id":"u8e-07","type":"cloze","q":"에크만은 문화권에 관계없이 관찰되는 ___ 개의 보편적 정서를 제시했다. 그러나 정서를 표출하는 ___ 은 문화마다 다르다.","explain":"정서 자체는 보편적이지만 표출 수준은 문화권마다 다르다(Cordaro). 개인주의 = 표출 장려, 집단주의 = 억제.","src":"8장 p.36","wiki":"비언어적 의사소통","answer":["6","수준"],"bank":["6","수준","4","8","종류"],"explainImg":"img/psy8-p36-slide.jpg"},{"id":"u8e-08","type":"mc","q":"에크만의 보편적 정서와 문화에 대한 설명으로 옳지 **않은** 것은?","choices":["문화권에 관계없이 관찰되는 6개의 정서가 있다","보편적 정서는 유아기부터 관찰된다","보편 정서를 표출하는 수준도 모든 문화권에서 동일하다","개인주의 문화는 정서 표출을 장려하고 집단주의 문화는 억제한다"],"answer":2,"explain":"정서 자체 = 보편, 표출 수준·제스처 해석 = 문화차. 표출 **수준**은 문화권마다 다를 수 있다(Cordaro et al., 2018). (오답 ① 문화권에 관계없이 관찰되는 6개의 정서가 있다: 옳다.)","src":"8장 p.36","diff":3,"wiki":"에크만의 기본 감정","explainImg":"img/psy8-p36-slide.jpg"},{"id":"u8e-09","type":"tf","q":"개인주의 문화권은 눈에 띄는 정서 표출을 장려하고, 집단주의 문화권은 억제한다.","explain":"맞다. 개인주의 문화권이 표출을 **장려**하고 집단주의 문화권은 **억제**한다(van Hemert).","src":"8장 p.36","wiki":"비언어적 의사소통","answer":true,"explainImg":"img/psy8-p36-slide.jpg"},{"id":"u8e-10","type":"sa","q":"**표정**을 통해 정서가 더욱 **증폭·조절**되는 현상 — 미소 근육 하나만 조정해도 스트레스 압박이 줄어듦 — 명칭을 쓰시오.","answer":"얼굴 피드백 효과","alts":["facial feedback effect","얼굴 피드백 효과(facial feedback effect)"],"explain":"**얼굴 피드백 효과 (facial feedback effect)** — Soussignan(2001)","src":"8장 p.37","wiki":"얼굴 피드백 효과","explainImg":"img/psy8-p37-slide.jpg"},{"id":"u8e-11","type":"mc","q":"펜을 이로 물어 미소 짓는 근육을 쓰게 한 사람들이 같은 만화를 더 재미있다고 평가했다. 이 현상은?","choices":["행동 피드백 효과","카타르시스","얼굴 피드백 효과","단순 노출 효과"],"answer":2,"explain":"두 피드백 효과 모두 신체 → 정서 → 제임스-랑게 지지. 표정이 정서를 증폭·조절한다. (오답 ① 행동 피드백 효과: 걷는 자세처럼 **행동**이 정서를 조절하는 효과다 — 여기서는 표정 근육이다.)","src":"8장 p.37","diff":1,"wiki":"얼굴 피드백 효과","explainImg":"img/psy8-p37-slide.jpg"},{"id":"u8e-12","type":"sa","q":"처진 채 걸으면 우울해지고 힘을 내서 걸으면 기분이 나아지는 것처럼, **직접 행하는 행동**에 따라 정서가 조절되는 효과를 쓰시오.","answer":"행동 피드백 효과","alts":["behavior feedback effect","행동 피드백","행동피드백효과"],"explain":"**행동 피드백 효과**(Krahe et al., 2018) — 표정이면 얼굴 피드백 효과.","src":"8장 p.37","diff":2,"wiki":"얼굴 피드백 효과","explainImg":"img/psy8-p37-slide.jpg"},{"id":"u8e-13","type":"cloze","q":"얼굴 피드백 효과는 ___ 을, 행동 피드백 효과는 직접 행하는 ___ 을 통해 정서가 조절되는 현상이며, 둘 다 ___ 이론을 지지한다.","explain":"둘 다 신체 → 정서 방향이라 제임스-랑게를 지지한다. 예: 펜을 이로 물어 미소 근육 사용 → 만화가 더 재밌다.","src":"8장 p.37","wiki":"얼굴 피드백 효과","answer":["표정","행동","제임스-랑게"],"bank":["표정","행동","제임스-랑게","캐넌-바드","언어"],"explainImg":"img/psy8-p37-slide.jpg"},{"id":"u8e-14","type":"match","q":"연구와 결과를 연결하시오","explain":"8장 p.34–36에 나온 연구자와 결과 짝. 학자 이름은 객관식 보기로 섞여 나올 수 있다.","src":"8장 p.34–36","wiki":"비언어적 의사소통","pairs":[["Pollak & Kistler","학대 아동은 모호한 표정을 분노로 지각"],["Costa et al.","26개 문화권에서 여성이 감정에 더 개방적"],["에크만","문화 보편적 정서 6개"],["van Hemert","집단주의 문화는 정서 표출 억제"]],"explainImg":"img/psy8-p36-slide.jpg"}]},{"id":"u8f","title":"분노·행복·긍정심리학","intro":[{"title":"분노와 카타르시스","body":"**카타르시스**(분노 표출로 해소) = 일시적 해결책일 뿐 **부적응적** — 분노를 더 키운다. **기분 좋음, 선행 현상** = 기분이 좋을 때 남을 돕는다(역으로 도우면 행복).","src":"8장 p.38–39"},{"title":"긍정심리학","body":"**주관적 안녕감**이 삶의 만족에 미치는 영향을 연구(20세기 우울·불안 중심 연구와 차별). 세 기둥: **긍정적 안녕감**(과거 만족 · 현재 행복 · 미래 낙관) · **긍정적 품성**(창의성·용기·자기제어) · 긍정적 집단·사회·문화.","src":"8장 p.40"},{"title":"돈과 행복","body":"**포만점**에 이르기 전까지 수입은 행복을 늘리지만 그 뒤로는 아니다. **지니계수**(소득 불평등)가 높은 나라일수록 저소득층의 건강·심리 문제가 잦다.","src":"8장 p.41"}],"items":[{"id":"u8f-01","type":"sa","q":"분노를 표출하면 감정이 해소된다는 생각으로, '일시적 해결책일 뿐 부적응적'이라고 평가되는 것을 쓰시오.","answer":"카타르시스","alts":["catharsis","카타르시스(catharsis)"],"explain":"**카타르시스** — 분노 행동은 분노를 더 폭증. 대처: 기다리기·다른 활동·거리 두기.","src":"8장 p.38","diff":1,"wiki":"카타르시스","explainImg":"img/psy8-p38-slide.jpg"},{"id":"u8f-02","type":"mc","q":"**분노**에 대한 설명으로 옳은 것은?","choices":["분노를 표출해 해소하는 카타르시스는 일시적 해결책일 뿐 부적응적이다","분노는 가능한 한 즉시 강하게 표출하는 것이 최선의 대처다","분노를 겪으면 테스토스테론 수준이 낮아진다","분노는 Fight or Flight 중 Flight(도피)를 촉발한다"],"answer":0,"explain":"분노: Fight, 염증·테스토스테론↑, 카타르시스 X. p.38 — 분노에 입각한 행동은 분노를 더 폭증시킨다(Flack). (오답 ② 분노는 가능한 한 즉시 강하게 표출하는 것이 최선의 대처다: 대처법은 **기다리기·다른 활동·거리 두기**.)","src":"8장 p.38","diff":2,"wiki":"카타르시스","explainImg":"img/psy8-p38-slide.jpg"},{"id":"u8f-03","type":"tf","q":"카타르시스(분노 표출)로 분노를 해소하는 것은 적응적인 방법이다.","explain":"아니다. 일시적 해결책일 뿐 **부적응적** — 분노에 입각한 행동은 분노를 더 키운다.","src":"8장 p.38","wiki":"카타르시스","answer":false,"explainImg":"img/psy8-p38-slide.jpg"},{"id":"u8f-04","type":"sa","q":"**기분이 좋을 때 남에게 도움을 주는** 경향(Salovey, 1990)을 쓰시오.","answer":"기분 좋음, 선행 현상","alts":["기분 좋음 선행 현상","기분좋음선행현상","feel-good, do-good phenomenon","feel-good do-good phenomenon","기분 좋음·선행 현상"],"explain":"**기분 좋음, 선행 현상** — 역방향(남을 도우면 행복)도 성립.","src":"8장 p.39","diff":2,"wiki":"기분 좋음·선행 현상","explainImg":"img/psy8-p39-slide.jpg"},{"id":"u8f-05","type":"sa","q":"**주관적 안녕감**이 삶의 만족도에 미치는 영향을 탐구 — 20세기의 우울·불안 중심 연구와 차별 — 명칭을 쓰시오.","answer":"긍정심리학","alts":["positive psychology","긍정심리학(positive psychology)"],"explain":"**긍정심리학 (positive psychology)** — 교재: 셀리그먼 주도 — **주관적 안녕감**이 삶의 만족도에 미치는 영향을 탐구 — 20세기의 우울·불안 중심 연구와 차별","src":"8장 p.40","wiki":"긍정심리학","explainImg":"img/psy8-p40-slide.jpg"},{"id":"u8f-06","type":"sa","q":"스스로 지각한 행복감·삶의 만족 — 명칭을 쓰시오.","answer":"주관적 안녕감","alts":["subjective well-being","주관적 안녕감(subjective well-being)"],"explain":"**주관적 안녕감 (subjective well-being)** — 스스로 지각한 행복감·삶의 만족","src":"8장 p.40","wiki":"긍정심리학","explainImg":"img/psy8-p40-slide.jpg"},{"id":"u8f-07","type":"cloze","q":"긍정적 안녕감 = 과거에 대한 ___ + 현재에 대한 ___ + 미래에 대한 ___","explain":"시간 축 짝을 바꾼 보기에 주의: 과거–만족, 현재–행복, 미래–낙관.","src":"8장 p.40","wiki":"긍정심리학","answer":["만족","행복","낙관"],"bank":["만족","행복","낙관","후회","불안"],"explainImg":"img/psy8-p40-slide.jpg"},{"id":"u8f-08","type":"mc","q":"긍정심리학의 **긍정적 안녕감**을 이루는 시간 축의 짝으로 옳은 것은?","choices":["과거 — 만족, 현재 — 행복, 미래 — 낙관","과거 — 낙관, 현재 — 만족, 미래 — 행복","과거 — 행복, 현재 — 낙관, 미래 — 만족","과거 — 만족, 현재 — 낙관, 미래 — 행복"],"answer":0,"explain":"긍정심리학 3기둥 = 긍정적 안녕감 · 긍정적 품성 · 긍정적 집단·사회·문화. p.40 그대로. (오답 ② 과거 — 낙관, 현재 — 만족, 미래 — 행복: 짝을 뒤섞은 함정이다.)","src":"8장 p.40","diff":2,"wiki":"긍정심리학","explainImg":"img/psy8-p40-slide.jpg"},{"id":"u8f-09","type":"cloze","q":"긍정심리학의 세 기둥: 긍정적 안녕감 · 긍정적 ___ · 긍정적 집단·사회·문화","explain":"긍정적 품성 = 창의성·용기·자기제어 등의 역량. 긍정적 집단·사회·문화 = 안녕감을 조성하는 환경.","src":"8장 p.40","wiki":"긍정심리학","answer":["품성"],"bank":["품성","정서","동기","지능"],"explainImg":"img/psy8-p40-slide.jpg"},{"id":"u8f-10","type":"tf","q":"긍정심리학은 20세기 심리학처럼 우울·불안 연구를 중심으로 한다.","explain":"긍정심리학은 **주관적 안녕감**이 삶의 만족에 미치는 영향을 탐구하며, 우울·불안 중심의 20세기 연구와 차별화된다.","src":"8장 p.40","wiki":"긍정심리학","answer":false,"explainImg":"img/psy8-p40-slide.jpg"},{"id":"u8f-11","type":"sa","q":"그 수준에 도달하면 수입이 더 이상 행복을 증진하거나 우울을 줄이지 않는 지점을 쓰시오.","answer":"포만점","alts":["satiation point","포화점"],"explain":"**포만점(satiation point)** — Ruberton et al.(2016).","src":"8장 p.41","diff":2,"wiki":"긍정심리학","explainImg":"img/psy8-p41-slide.jpg"},{"id":"u8f-12","type":"mc","q":"**돈과 행복**의 관계에 대한 설명으로 옳은 것은?","choices":["수입이 늘수록 행복은 끝없이 비례해 증가한다","지니계수가 높은 국가일수록 저소득층의 건강·심리 문제가 줄어든다","포만점에 도달하기 전까지는 수입이 행복을 증진하지만, 그 이후에는 더 이상 증진하지 않는다","대부분의 사람은 수입 격차가 큰 사회를 선호한다"],"answer":2,"explain":"극단적 불평등은 해롭다. Ruberton et al.(2016). (오답 ① 수입이 늘수록 행복은 끝없이 비례해 증가한다: 일정 수준(포만점) 이후에는 늘지 않는다.)","src":"8장 p.41","diff":2,"wiki":"긍정심리학","explainImg":"img/psy8-p41-slide.jpg"},{"id":"u8f-13","type":"sa","q":"소득 불평등 지표 — 높은 국가일수록 저소득층의 건강·심리 장애 문제가 빈번 — 명칭을 쓰시오.","answer":"지니계수","alts":["Gini coefficient","지니계수(Gini coefficient)"],"explain":"**지니계수 (Gini coefficient)** — Sommet et al.(2018). 사람들은 격차가 적은 것을 선호","src":"8장 p.41","wiki":"긍정심리학","explainImg":"img/psy8-p41-slide.jpg"},{"id":"u8f-14","type":"match","q":"용어와 설명을 연결하시오","explain":"8장 마지막 절(p.38–41)의 용어. 지니계수가 높은 국가일수록 저소득층의 건강·심리 문제가 잦다.","src":"8장 p.38–41","wiki":"긍정심리학","pairs":[["카타르시스","분노 표출로 해소한다는 생각(부적응적)"],["기분 좋음, 선행 현상","기분이 좋을 때 남을 돕는 경향"],["주관적 안녕감","스스로 지각한 행복감·삶의 만족"],["포만점","수입이 더 이상 행복을 늘리지 않는 지점"],["지니계수","소득 불평등 지표"]],"explainImg":"img/psy8-p41-slide.jpg"}]}]},{"id":"u9","title":"9장 스트레스와 건강","desc":"스트레스원 · 투쟁-도피·GAS · 스트레스와 질병 · 대처와 통제 · 사회적 지원 · 스트레스 관리","lessons":[{"id":"u9a","title":"스트레스와 스트레스원","intro":[{"title":"스트레스의 정의","body":"**스트레스** = 위협적이거나 도전적인 사건을 **평가하고 대처하는 과정**(사건 + 반응 모두). **스트레스원** = 유발 사건, **스트레스 반응** = 정서·신체 반응. 같은 사건도 위협/도전 **평가**에 따라 반응이 달라지고, 스트레스가 너무 없어도 무기력해진다.","src":"9장 p.2–3"},{"title":"스트레스원 3종","body":"**재앙적 사건**(대규모 재해, 간접 노출도 해로움) · **심각한 삶의 변화**(결혼·취업 같은 행복한 사건 포함) · **일상적 다툼**(사소한 일상, 대인관계 — 가장 흔함).","src":"9장 p.4–6","img":"img/psy9-p6-stressor.png","imgAlt":"재앙적인 사건·심각한 삶의 변화·일상의 다툼"},{"title":"레빈의 갈등 3유형 (1935)","body":"**접근-접근** = 둘 다 좋음(짜장 vs 짬뽕, 강도 가장 낮음) · **접근-회피** = **한 대상**에 매력과 혐오(맛있지만 살찌는 케이크) · **회피-회피** = 둘 다 싫음(팀플 수업 vs 빡센 시험).","src":"9장 p.6"},{"title":"스트레스 측정","body":"**자기보고식 설문**(자기 상태를 잘 모르거나 응답을 위장할 수 있음) + **코르티솔 측정**(생리 지표, 타액·머리카락).","src":"9장 p.7"}],"items":[{"id":"u9a-01","type":"mc","q":"스트레스에 대한 설명으로 가장 옳은 것은?","choices":["반응을 유발하는 사건 자체만을 가리킨다","사건에 대한 신체 반응만을 가리키며 평가와는 무관하다","위협적이거나 도전적인 사건을 평가하고 대처하는 과정으로, 사건과 반응을 모두 포함한다","부정적인 사건만 스트레스원이 될 수 있다"],"answer":2,"explain":"사건 쪽 이름 = 스트레스원, 몸·마음 쪽 이름 = 스트레스 반응, 전체 과정 = 스트레스. p.2 정의 그대로. (오답 ① 반응을 유발하는 사건 자체만을 가리킨다: 그것은 **스트레스원**이다. 스트레스는 사건과 반응을 모두 포함한다.)","src":"9장 p.2","diff":1,"wiki":"스트레스","explainImg":"img/psy9-p2-slide.jpg"},{"id":"u9a-02","type":"sa","q":"스트레스 반응을 유발하는 요인·사건을 쓰시오.","answer":"스트레스원","alts":["stressor","스트레서"],"explain":"**스트레스원(stressor)** — 반응 쪽은 스트레스 반응.","src":"9장 p.2","diff":1,"wiki":"스트레스원","explainImg":"img/psy9-p2-slide.jpg"},{"id":"u9a-03","type":"sa","q":"같은 사건을 **어떻게 받아들이느냐**(위협 vs 도전)를 해석하는 과정 — 이것에 따라 반응이 달라진다 — 명칭을 쓰시오.","answer":"스트레스 평가","alts":["stress appraisal","평가"],"explain":"**스트레스 평가** — 교수: '지금 벌어지고 있는 일들을 어떻게 받아들이냐'. 8장 라자루스 인지 평가와 같은 축","src":"9장 p.3","prof":true,"wiki":"스트레스","explainImg":"img/psy9-p3-slide.jpg"},{"id":"u9a-04","type":"mc","q":"스트레스 평가에 관한 설명으로 옳지 않은 것은?","choices":["스트레스를 전혀 받지 않는 사람이 가장 활력 있고 수행도 높다","같은 사건이라도 위협으로 받아들이느냐 도전으로 받아들이느냐에 따라 반응이 달라진다","적절한 스트레스는 면역 활성화·수행 향상과 관련된다","지속적이고 심각한 스트레스는 의사 결정과 건강에 해롭다"],"answer":0,"explain":"교수는 8장 각성 이론(최적 각성)과 연결해 설명했다. 오히려 스트레스를 받지 않는 사람은 **무기력함**을 보고하는 경우가 많다(Ng & Feldman, 2009). (오답 ② 같은 사건이라도 위협으로 받아들이느냐 도전으로 받아들이느냐에 따라 반응이 달라진다: 옳다 — 스트레스 평가의 핵심.)","src":"9장 p.3","diff":2,"wiki":"스트레스","explainImg":"img/psy9-p3-slide.jpg"},{"id":"u9a-05","type":"match","q":"스트레스원 유형과 예를 연결하시오","explain":"재앙적 사건은 미디어로 간접 노출만 되어도 정신건강을 해친다. 교수: 일상적 다툼이 가장 많이 겪는 근원.","src":"9장 p.4–6","wiki":"스트레스원","pairs":[["재앙적 사건","허리케인 카트리나 같은 대규모 재해"],["심각한 삶의 변화","결혼·취업 같은 급격한 변화"],["일상적 다툼","대인관계 같은 사소한 일상 사건"],["접근-접근 갈등","짜장 vs 짬뽕"]],"explainImg":"img/psy9-p4-slide.jpg"},{"id":"u9a-06","type":"sa","q":"천재·인재를 포함한 **대규모 재해**. 미디어로 **간접 노출**만 되어도 정신건강이 나빠진다 — 명칭을 쓰시오.","answer":"재앙적 사건","alts":["catastrophe","재앙"],"explain":"**재앙적 사건** — 카트리나 이후 자살률 급증, 9·11 반복 시청 → 2~3년 뒤 건강 악화, 강제 이주","src":"9장 p.4","wiki":"재앙적 사건","explainImg":"img/psy9-p4-slide.jpg"},{"id":"u9a-07","type":"sa","q":"거대 사건이 아닌 **사소한 일상 사건**에서 오는 스트레스로, 사람들이 가장 많이 겪는 근원(예: 대인관계) — 명칭을 쓰시오.","answer":"일상적 다툼","alts":["daily hassles","일상적 다툼(daily hassles)"],"explain":"**일상적 다툼 (daily hassles)** — '일이 힘든 건 참는데 사람이 힘든 건 못 참는다'","src":"9장 p.6","prof":true,"wiki":"일상적 다툼","explainImg":"img/psy9-p6-slide.jpg"},{"id":"u9a-08","type":"mc","q":"스트레스원의 종류와 예의 연결이 옳지 않은 것은?","choices":["재앙적 사건 — 9·11 테러 장면을 미디어로 반복 시청","삶의 변화 — 결혼·취업 같은 행복한 사건","일상적 다툼 — 직장 상사·동료와의 사소한 마찰","일상적 다툼 — 허리케인 이후의 강제 이주"],"answer":3,"explain":"스트레스원 3종: 재앙적 사건 / 삶의 변화 / 일상적 다툼. 대규모 재해로 인한 강제 이주는 **재앙적 사건** 쪽이다(Pipher). (오답 ① 재앙적 사건 — 9·11 테러 장면을 미디어로 반복 시청: 옳다 — **간접 노출**도 2~3년 뒤 건강 악화를 예측(Silver et al.).)","src":"9장 p.4–6","diff":2,"wiki":"스트레스원","explainImg":"img/psy9-p4-slide.jpg"},{"id":"u9a-09","type":"tf","q":"결혼·취업 같은 행복한 사건은 스트레스원이 될 수 없다.","explain":"아니다. 행복한 사건도 각성을 일으켜 스트레스원이 될 수 있다(p.5). 변화가 동시다발일수록 더 위험하다.","src":"9장 p.5","wiki":"심각한 삶의 변화","answer":false,"explainImg":"img/psy9-p5-slide.jpg"},{"id":"u9a-10","type":"sa","q":"접근·회피 동기 사이의 **갈등 3유형**을 제시 (1935) — 이 연구자(학자)는?","answer":"레빈","alts":["Lewin","레빈(Lewin)"],"explain":"**레빈 (Lewin)** — 접근·회피 동기 사이의 **갈등 3유형**을 제시 (1935)","src":"9장 p.6","wiki":"접근-회피 갈등","explainImg":"img/psy9-p6-slide.jpg"},{"id":"u9a-11","type":"sa","q":"한 대상에서 매력과 혐오를 **동시에** 느끼는 갈등(예: 맛있지만 살찌는 케이크)을 쓰시오.","answer":"접근-회피 갈등","alts":["접근회피갈등","접근-회피","접근 회피 갈등"],"explain":"**접근-회피 갈등** — 레빈(1935). 교수: 선택지 하나에 대한 양가감정.","src":"9장 p.6","diff":1,"wiki":"접근-회피 갈등","explainImg":"img/psy9-p6-slide.jpg"},{"id":"u9a-12","type":"tf","q":"접근-회피 갈등은 좋은 선택지 하나와 싫은 선택지 하나 사이의 갈등이다.","explain":"아니다. 접근-회피는 **한 대상**에 매력과 혐오가 **함께** 있는 것(맛있지만 살찌는 케이크). 두 선택지 사이 갈등은 접근-접근·회피-회피.","src":"9장 p.6","wiki":"접근-회피 갈등","answer":false,"explainImg":"img/psy9-p6-slide.jpg"},{"id":"u9a-13","type":"sa","q":"**둘 다 싫은** 선택지 사이의 갈등. 예: 수강신청의 '죽음의 이지선다' — 팀플 많은 수업 vs 시험이 빡센 수업 — 명칭을 쓰시오.","answer":"회피-회피 갈등","alts":["avoidance-avoidance conflict"],"explain":"**회피-회피 갈등** — **둘 다 싫은** 선택지 사이의 갈등. 교수 예: 수강신청 '죽음의 이지선다' — 팀플 수업 vs 시험 빡센 수업","src":"9장 p.6","prof":true,"wiki":"회피-회피 갈등","explainImg":"img/psy9-p6-slide.jpg"},{"id":"u9a-14","type":"mc","q":"수강신청에서 '팀플이 많은 수업'과 '시험이 빡센 수업' 중 하나를 골라야 하는 상황('죽음의 이지선다')에 해당하는 갈등은?","choices":["접근-접근 갈등","회피-회피 갈등","접근-회피 갈등","정서중심 대처"],"answer":1,"explain":"교수 예: 접근-접근 = 치킨 vs 피자, 회피-회피 = 팀플 vs 빡센 시험, 접근-회피 = 오랜 친구와의 약속. 둘 다 싫은데 무엇을 덜 싫어하느냐의 문제. (오답 ① 접근-접근 갈등: 둘 다 **매력적**일 때다(치킨 vs 피자).)","src":"9장 p.6","diff":1,"prof":true,"wiki":"회피-회피 갈등","explainImg":"img/psy9-p6-slide.jpg"},{"id":"u9a-15","type":"mc","q":"레빈의 갈등 유형에 대한 설명으로 옳은 것은?","choices":["접근-회피 갈등은 매력적인 선택지 하나와 싫은 선택지 하나 사이의 갈등이다","레빈은 갈등 유형을 바탕으로 일반 적응 증후군을 제시했다","회피-회피 갈등은 두 선택지가 모두 매력적인 상황이다","접근-접근 갈등은 세 유형 중 강도가 가장 낮은 편이다"],"answer":3,"explain":"레빈(Lewin, 1935): 접근 동기와 회피 동기 사이의 일상적 갈등. 교수: '세 유형 중에서는 가장 강도도 낮은 편'(행복한 고민). (오답 ① 접근-회피 갈등은 매력적인 선택지 하나와 싫은 선택지 하나 사이의 갈등이다: 접근-회피는 **한 대상**에 매력과 혐오가 함께 있는 경우다.)","src":"9장 p.6","diff":2,"prof":true,"wiki":"접근-접근 갈등","explainImg":"img/psy9-p6-slide.jpg"},{"id":"u9a-16","type":"mc","q":"스트레스 측정법 중 **자기보고식 설문**의 한계로 옳은 것은?","choices":["참가자가 자기 상태를 잘 파악하지 못하거나, 사회적 시선 때문에 응답을 위장할 수 있다","표준화가 전혀 되어 있지 않아 같은 질문을 반복해 쓸 수 없다","타액이나 머리카락 시료가 필요해 비용이 크다","신체 각성만 측정하므로 주관적 평가를 알 수 없다"],"answer":0,"explain":"측정 두 축: 자기보고 설문(주관) + 코르티솔(생리 지표, 연설 전후 측정). 교수: '조사자가 통제할 수 없는 영역'. (오답 ② 표준화가 전혀 되어 있지 않아 같은 질문을 반복해 쓸 수 없다: 오히려 오랜 **표준화·검증**으로 질문 구성 문제는 어느 정도 보완된다고 했다.)","src":"9장 p.7","diff":2,"prof":true,"wiki":"코르티솔","explainImg":"img/psy9-p7-slide.jpg"},{"id":"u9a-17","type":"sa","q":"그림은 스트레스원의 세 종류다. 오른쪽 아래 가려진 칸(두 사람이 다투는 그림)처럼 거대 사건이 아닌 **사소한 일상 사건**에서 오는 스트레스원의 명칭을 쓰시오.","explain":"세 스트레스원 = 재앙적인 사건 · 심각한 삶의 변화 · **일상적 다툼**(대인관계 등, 가장 흔한 근원).","src":"9장 p.6","wiki":"일상적 다툼","answer":"일상적 다툼","alts":["일상의 다툼","daily hassles","일상적다툼"],"img":"img/psy9-p6-stressor-q.png","imgAlt":"재앙적인 사건·심각한 삶의 변화·(가림) 세 원","explainImg":"img/psy9-p6-slide.jpg"}]},{"id":"u9b","title":"스트레스 반응의 생물학","intro":[{"title":"빠른 경로 vs 느린 경로","body":"빠른: **교감신경계** → 에피네프린·노르에피네프린 → **투쟁 혹은 도피 반응**(캐넌, 1929). 느린: **부신 피질** → **코르티솔**(다소 장기적인 대처 전략 수립).","src":"9장 p.8","img":"img/psy9-p8-adrenal.png","imgAlt":"부신 단면도 — 부신 피질과 부신 수질"},{"title":"일반 적응 증후군 (셀리에)","body":"GAS 3단계: **경고 반응**(교감신경 활성) → **저항**(자원 총동원) → **소진**(자원 바닥 → 질병 취약, 큰 시험 직후 몸살). 단기 스트레스엔 잘 버티지만 만성화되면 위험.","src":"9장 p.9","img":"img/psy9-p9-gas.png","imgAlt":"스트레스 저항 수준의 3단계 곡선"},{"title":"누가 무엇을","body":"**투쟁 혹은 도피 반응** = 캐넌(1929) — 위협에 맞서거나 달아나도록 몸을 준비. **일반 적응 증후군** = 한스 셀리에(1936, 1976). 코르티솔은 부신 **피질**(수질이 아님).","src":"9장 p.8–9"}],"items":[{"id":"u9b-01","type":"sa","q":"교감신경계 각성으로 위협에 맞서거나 달아나도록 몸을 준비시키는 반응(Cannon, 1929)을 쓰시오.","answer":"투쟁 혹은 도피 반응","alts":["투쟁-도피 반응","투쟁도피반응","투쟁 도피","투쟁-도피","fight or flight","투쟁 혹은 도피","투쟁 또는 도피 반응"],"explain":"**투쟁 혹은 도피(fight or flight) 반응** — 에피네프린·노르에피네프린.","src":"9장 p.8","diff":1,"wiki":"투쟁-도피 반응","explainImg":"img/psy9-p8-slide.jpg"},{"id":"u9b-02","type":"sa","q":"**투쟁 혹은 도피** 반응 (1929) — 이 연구자(학자)는?","answer":"캐넌","alts":["Cannon","캐넌(Cannon)"],"explain":"**캐넌 (Cannon)** — 8장 캐넌-바드 이론의 그 캐넌 — **투쟁 혹은 도피** 반응 (1929)","src":"9장 p.8","wiki":"투쟁-도피 반응","explainImg":"img/psy9-p8-slide.jpg"},{"id":"u9b-03","type":"sa","q":"**부신 피질**에서 분비되어 스트레스 대처 **전략 수립**을 돕는, 다소 장기적인 호르몬 — 명칭을 쓰시오.","answer":"코르티솔","alts":["cortisol","코르티솔(cortisol)"],"explain":"**코르티솔 (cortisol)** — 교수: '다소 느린 반응', 유사 상황 재발에 대비하는 장기 관리 전략","src":"9장 p.8","wiki":"코르티솔","explainImg":"img/psy9-p8-slide.jpg"},{"id":"u9b-04","type":"mc","q":"스트레스 반응의 생물학적 기제에 대한 설명으로 옳은 것은?","choices":["코르티솔은 부신 수질에서 분비되어 즉각적인 위협에 대처하게 한다","투쟁 혹은 도피 반응은 한스 셀리에가 제시했다","교감신경계 작동으로 분비되는 에피네프린·노르에피네프린은 투쟁 혹은 도피 반응을 일으킨다","에피네프린 계통은 느린 반응, 코르티솔은 빠른 반응이다"],"answer":2,"explain":"빠른 = 교감신경 → 에피네프린·노르에피네프린 → 투쟁-도피 / 느린 = 부신 피질 → 코르티솔. p.8 빠른 경로(Cannon, 1929). (오답 ① 코르티솔은 부신 수질에서 분비되어 즉각적인 위협에 대처하게 한다: 코르티솔은 부신 **피질**, **다소 장기적인** 전략 수립.)","src":"9장 p.8","diff":2,"wiki":"스트레스","explainImg":"img/psy9-p8-slide.jpg"},{"id":"u9b-05","type":"cloze","q":"빠른 경로: 교감신경계 → ___ → 투쟁-도피 반응 / 느린 경로: 부신 피질 → ___ (대처 전략 수립)","explain":"교수: '간단하게 말하자면 빠른 반응이냐 다소 느린 반응이냐의 차이'.","src":"9장 p.8 🎙","wiki":"투쟁-도피 반응","prof":true,"answer":["에피네프린·노르에피네프린","코르티솔"],"bank":["에피네프린·노르에피네프린","코르티솔","도파민","세로토닌","렙틴"],"explainImg":"img/psy9-p8-slide.jpg"},{"id":"u9b-06","type":"mc","q":"스트레스 반응의 '빠른 반응 vs 다소 느린 반응' 대비에 해당하는 호르몬 짝은?","choices":["문제중심 대처 vs 정서중심 대처","내적 통제 소재 vs 외적 통제 소재","에피네프린·노르에피네프린 vs 코르티솔","A 유형 vs B 유형"],"answer":2,"explain":"빠른 경로·느린 경로는 p.8의 핵심 대비. p.8 — 즉각적 위협 대응 vs 장기적 관리 전략. (오답 ① 문제중심 대처 vs 정서중심 대처: 대처 방식의 차이(통제 가능 여부, 교수 비유 T vs F)다.)","src":"9장 p.8","diff":1,"prof":true,"wiki":"코르티솔","explainImg":"img/psy9-p8-slide.jpg"},{"id":"u9b-07","type":"tf","q":"코르티솔은 부신 피질에서 분비되며, 다소 장기적인 대처 전략 수립을 돕는다.","explain":"맞다. 슬라이드 기준 코르티솔 = 부신 **피질**(수질로 바꾼 보기에 주의). 에피네프린·노르에피네프린 계통이 교감신경계 쪽이다.","src":"9장 p.8","wiki":"코르티솔","answer":true,"explainImg":"img/psy9-p8-slide.jpg"},{"id":"u9b-08","type":"tf","q":"투쟁 혹은 도피 반응을 제시한 학자는 한스 셀리에다.","explain":"투쟁-도피 = **캐넌(1929)**. 셀리에는 일반 적응 증후군(GAS).","src":"9장 p.8–9","wiki":"투쟁-도피 반응","answer":false,"explainImg":"img/psy9-p9-slide.jpg"},{"id":"u9b-09","type":"sa","q":"경고 → 저항 → 소진 3단계로 이루어진 신체의 스트레스 적응 반응(한스 셀리에)을 쓰시오.","answer":"일반 적응 증후군","alts":["GAS","일반적응증후군","general adaptation syndrome","일반 적응 증후군(GAS)"],"explain":"**일반 적응 증후군(GAS)**.","src":"9장 p.9","diff":1,"wiki":"일반 적응 증후군","explainImg":"img/psy9-p9-slide.jpg"},{"id":"u9b-10","type":"sa","q":"**일반 적응 증후군**(경고 → 저항 → 소진) (1936, 1976) — 이 연구자(학자)는?","answer":"한스 셀리에","alts":["Hans Selye","한스 셀리에(Hans Selye)"],"explain":"**한스 셀리에 (Hans Selye)** — **일반 적응 증후군**(경고 → 저항 → 소진) (1936, 1976)","src":"9장 p.9","wiki":"한스 셀리에","explainImg":"img/psy9-p9-slide.jpg"},{"id":"u9b-11","type":"order","q":"일반 적응 증후군(GAS)의 단계를 순서대로 놓으시오","explain":"경고(교감신경계 활성) → 저항(자원 총동원) → 소진(바닥 → 질병 취약). 교수: 단기 스트레스엔 잘 버티지만 만성화되면 위험.","src":"9장 p.9 🎙","wiki":"일반 적응 증후군","prof":true,"answer":["경고 반응","저항","소진"],"explainImg":"img/psy9-p9-slide.jpg"},{"id":"u9b-12","type":"mc","q":"일반 적응 증후군(GAS)의 단계를 순서대로 바르게 나열한 것은?","choices":["경고 반응 → 저항 → 소진","저항 → 경고 반응 → 소진","경고 반응 → 소진 → 저항","소진 → 경고 반응 → 저항"],"answer":0,"explain":"한스 셀리에(1936, 1976). 만성화되면 소진. 셀리에의 3단계 순서. (오답 ② 저항 → 경고 반응 → 소진: 경고 반응이 **먼저**(스트레스원 직후 교감신경 활성화).)","src":"9장 p.9","diff":1,"wiki":"일반 적응 증후군","explainImg":"img/psy9-p9-slide.jpg"},{"id":"u9b-13","type":"sa","q":"GAS **1단계** — 스트레스원 직후 교감신경계가 활성화되고, 저항 체계가 본격적으로 발동하기 전의 단계 — 명칭을 쓰시오.","answer":"경고 반응","alts":["alarm","경고 반응(alarm)","경고 단계","경고"],"explain":"**경고 반응 (alarm)** — GAS **1단계** — 스트레스원 직후 교감신경계 활성화, 저항 체계 본격 발동 전 '일단 경고 받아서 시작'","src":"9장 p.9","wiki":"일반 적응 증후군","explainImg":"img/psy9-p9-slide.jpg"},{"id":"u9b-14","type":"sa","q":"GAS **2단계** — 에피네프린·노르에피네프린 기반 반응이 폭발적으로 늘어 대처 자원을 **총동원**, 웬만한 압박에도 버팀 — 명칭을 쓰시오.","answer":"저항","alts":["resistance","저항(resistance)","저항 단계"],"explain":"**저항 (resistance)** — GAS **2단계** — 에피네프린·노르에피네프린 기반 반응이 폭발적으로 늘어 대처 자원을 **총동원**, 웬만한 압박에도 버팀","src":"9장 p.9","wiki":"일반 적응 증후군","explainImg":"img/psy9-p9-slide.jpg"},{"id":"u9b-15","type":"sa","q":"GAS **3단계** — 2단계에서 자원을 다 써 바닥남 → 질병에 취약. 예: 큰 시험이 끝난 직후 몸살이 남 — 명칭을 쓰시오.","answer":"소진","alts":["exhaustion","소진(exhaustion)","소진 단계","탈진"],"explain":"**소진 (exhaustion)** — GAS **3단계** — 2단계에서 자원을 다 써 바닥남 → 질병에 취약. 교수 예: 큰 시험 끝난 직후 몸살","src":"9장 p.9","prof":true,"wiki":"일반 적응 증후군","explainImg":"img/psy9-p9-slide.jpg"},{"id":"u9b-16","type":"mc","q":"중요한 시험이 끝난 직후 몸살이 나는 현상을 일반 적응 증후군으로 설명할 때 가장 관련 깊은 단계는?","choices":["경고 반응","저항","투쟁 혹은 도피","소진"],"answer":3,"explain":"교수: '사람은 생각보다 단기적인 스트레스에는 꽤 잘 버틸 수 있다'. 저항 단계에서 자원을 총동원해 바닥난 상태 + 높은 각성을 유지할 이유도 사라짐(교수 설명). (오답 ① 경고 반응: 스트레스원 발생 **직후** 시작 단계다.)","src":"9장 p.9","diff":2,"prof":true,"wiki":"일반 적응 증후군","explainImg":"img/psy9-p9-slide.jpg"},{"id":"u9b-17","type":"sa","q":"그림은 일반 적응 증후군(GAS)의 스트레스 저항 곡선이다(단계 이름은 가림). 저항이 급격히 떨어지는 **3단계**의 명칭을 쓰시오.","explain":"1단계 경고 반응(자원 동원) → 2단계 저항(스트레스원에 대처) → 3단계 **소진**(자원 고갈 → 질병 취약).","src":"9장 p.9","wiki":"일반 적응 증후군","answer":"소진","alts":["소진 단계","exhaustion","탈진"],"img":"img/psy9-p9-gas-q.png","imgAlt":"스트레스 저항 수준이 1단계에 잠깐 떨어지고 2단계에 높게 유지되다 3단계에 급락하는 곡선","explainImg":"img/psy9-p9-slide.jpg"}]},{"id":"u9c","title":"스트레스와 질병","intro":[{"title":"스트레스와 건강을 다루는 분야","body":"**행동의학** = 심리학 + 의학 통합. **건강심리학** = 행동의학에 지식을 제공하는 심리학 하위 분야. **심리신경면역학(PNI)** = 심리·신경·내분비 → 면역·건강.","src":"9장 p.10"},{"title":"스트레스와 면역·암","body":"스트레스 → **림프구** 방출 억제, 상처 재생 **지연**, 감기 취약, 질병 진행 촉진. 암세포를 **직접** 만들진 않고 면역을 약화해 자랄 여지를 준다.","src":"9장 p.11–12"},{"title":"A 유형과 심장병","body":"**A 유형** = 경쟁적·조급·쉽게 화냄, **B 유형** = 차분·태평. 9년 뒤 심장병 환자의 69%가 A 유형(Evans). 핵심은 일이 아니라 **부정적 정서와 연합된 분노**. 비관론자 발병률은 낙관론자의 2배.","src":"9장 p.14–15"},{"title":"취약성의 악순환","body":"만성 스트레스 → 혈관 염증 → 면역 와해 → 우울증 → 흡연↑·운동↓ → 다시 악화. 스트레스는 질병을 직접 일으키기보다 **취약성**을 만든다.","src":"9장 p.16"}],"items":[{"id":"u9c-01","type":"sa","q":"심리학과 **의학** 지식을 통합한 분야 (심리 요인이 건강에 미치는 영향 탐구) — 명칭을 쓰시오.","answer":"행동의학","alts":["behavioral medicine","행동의학(behavioral medicine)"],"explain":"**행동의학 (behavioral medicine)** — 심리학과 **의학** 지식을 통합한 분야 (심리 요인이 건강에 미치는 영향 탐구)","src":"9장 p.10","wiki":"건강심리학","explainImg":"img/psy9-p10-slide.jpg"},{"id":"u9c-02","type":"sa","q":"심리학 지식을 행동의학에 **제공**하는 심리학의 **하위 분야** — 명칭을 쓰시오.","answer":"건강심리학","alts":["health psychology","건강심리학(health psychology)"],"explain":"**건강심리학 (health psychology)** — 심리학 지식을 행동의학에 **제공**하는 심리학의 **하위 분야**","src":"9장 p.10","wiki":"건강심리학","explainImg":"img/psy9-p10-slide.jpg"},{"id":"u9c-03","type":"sa","q":"심리·신경·내분비 처리과정이 면역 체계와 건강에 미치는 영향을 통합적으로 연구하는 분야를 쓰시오.","answer":"심리신경면역학","alts":["PNI","psychoneuroimmunology"],"explain":"**심리신경면역학(PNI)** — 건강심리학(하위 분야)·행동의학(통합 분야)과 구분.","src":"9장 p.10","diff":2,"wiki":"심리신경면역학","explainImg":"img/psy9-p10-slide.jpg"},{"id":"u9c-04","type":"cloze","q":"스트레스는 ___ 의 방출을 억제하고, 상처 재생을 ___ 시키며, 감기·호흡기 감염에 취약하게 만든다.","explain":"p.11 면역 영향 4가지: 림프구 방출 억제, 상처 재생 지연, 감기·호흡기 감염 취약, 질병 진행 촉진.","src":"9장 p.11","wiki":"심리신경면역학","answer":["림프구","지연"],"bank":["림프구","지연","적혈구","촉진","혈소판"],"explainImg":"img/psy9-p11-slide.jpg"},{"id":"u9c-05","type":"mc","q":"스트레스가 면역에 미치는 영향으로 옳지 않은 것은?","choices":["상처 재생이 지연된다","림프구 방출을 촉진해 박테리아 감염 대항력이 강해진다","감기·호흡기 감염에 더 취약해진다","에이즈 환자의 면역 쇠퇴가 더 빨라진다"],"answer":1,"explain":"p.11 네 가지: 림프구 억제 · 상처 지연 · 감기 취약 · 진행 촉진. 반대 — 림프구 방출을 **억제**한다(Maier et al., 1994). (오답 ① 상처 재생이 지연된다: 옳다(Kiecolt-Glaser) — 교수: 시험 앞두고 다치면 느리게 낫는다.)","src":"9장 p.11","diff":2,"wiki":"스트레스","explainImg":"img/psy9-p11-slide.jpg"},{"id":"u9c-06","type":"tf","q":"스트레스는 암세포를 직접 만들어 암을 유발한다.","explain":"아니다. 면역(림프구·대식세포·NK 세포)을 약화시켜 암세포가 자랄 **여지**를 줄 뿐이다. 교수: '암 걸린다'는 절반만 맞는 말.","src":"9장 p.12 🎙","wiki":"스트레스와 암","prof":true,"answer":false,"explainImg":"img/psy9-p12-slide.jpg"},{"id":"u9c-07","type":"mc","q":"스트레스와 암의 관계에 대한 결론으로 가장 옳은 것은?","choices":["스트레스는 암세포를 직접 생성하는 가장 강력한 원인이다","스트레스와 암은 어떤 연구에서도 관련이 없다","스트레스는 NK 세포 활동을 강화해 암을 예방한다","스트레스는 암세포를 직접 만들지 않지만, 면역을 약화시켜 암세포가 자랄 여지를 준다"],"answer":3,"explain":"교수: '암 걸린다'는 표현은 '절반만 맞는 말'. p.12 결론. 교수가 두 번 반복했다. (오답 ① 스트레스는 암세포를 직접 생성하는 가장 강력한 원인이다: **직접** 만들지 않는다. 일부 연구에선 가장 강력한 예측 변인도 아니다.)","src":"9장 p.12","diff":2,"prof":true,"wiki":"스트레스와 암","explainImg":"img/psy9-p12-slide.jpg"},{"id":"u9c-08","type":"sa","q":"**경쟁적**이고 동기가 강하며 조급하고 **쉽게 화를 내는** 성격 — 심장병 위험 ↑ — 명칭을 쓰시오.","answer":"A 유형","alts":["A 유형 성격","Type A"],"explain":"**A 유형** — 9년 뒤 심장병 환자의 69% (Evans et al., 1987) — **경쟁적**이고 동기가 강하며 조급하고 **쉽게 화를 내는** 성격 — 심장병 위험 ↑","src":"9장 p.14","wiki":"A 유형 성격","explainImg":"img/psy9-p14-slide.jpg"},{"id":"u9c-09","type":"sa","q":"상대적으로 **차분하고 태평한** 성격 — 명칭을 쓰시오.","answer":"B 유형","alts":["B 유형 성격","Type B"],"explain":"**B 유형** — 상대적으로 **차분하고 태평한** 성격","src":"9장 p.14","wiki":"A 유형 성격","explainImg":"img/psy9-p14-slide.jpg"},{"id":"u9c-10","type":"mc","q":"A 유형·B 유형 연구(Evans et al., 1987)에 대한 설명으로 옳은 것은?","choices":["9년 뒤 심장병 환자의 69%가 A 유형이었고, 핵심 위험 요소는 부정적 정서와 연합된 분노였다","9년 뒤 심장병 환자의 69%가 B 유형이었다","A 유형의 핵심 위험 요소는 열심히 일하는 성실성 자체였다","B 유형은 경쟁적이고 조급하며 쉽게 화를 낸다"],"answer":0,"explain":"숫자: 9년, 69%. 교수: '부정적 정서랑 연합된 분노가 심혈관 건강을 잘 예측'. p.14 + Chida & Hamer. (오답 ② 9년 뒤 심장병 환자의 69%가 B 유형이었다: **A** 유형이다.)","src":"9장 p.14","diff":2,"wiki":"A 유형 성격","explainImg":"img/psy9-p14-slide.jpg"},{"id":"u9c-11","type":"cloze","q":"A 유형 연구: ___ 년 뒤 심장병 환자의 69%가 A 유형이었고, 핵심 독성 요소는 부정적 정서와 연합된 ___ 이다.","explain":"Evans et al.(1987) 9년 종단 연구. 일 자체가 아니라 부정적 정서와 연합된 분노(적대감)가 핵심(Chida & Hamer).","src":"9장 p.14","wiki":"A 유형 성격","answer":["9","분노"],"bank":["9","분노","5","성실성","경쟁심"],"explainImg":"img/psy9-p14-slide.jpg"},{"id":"u9c-12","type":"tf","q":"A 유형의 심장병 위험은 열심히 일하는 것 자체 때문이다.","explain":"아니다. 핵심 독성 요소는 **부정적 정서와 연합된 분노**다. 교수: '화병', '뒷목 잡는다'.","src":"9장 p.14","wiki":"A 유형 성격","answer":false,"explainImg":"img/psy9-p14-slide.jpg"},{"id":"u9c-13","type":"mc","q":"비관주의와 심장병에 대한 설명으로 옳은 것은?","choices":["다른 위험 요인을 통제하면 비관론자와 낙관론자의 차이는 사라졌다","잘 웃는 사람은 대인관계가 원만하지만 수명과는 관련이 없다","다른 위험 요인을 제거해도 비관론자의 심장병 발병률은 낙관론자의 약 2배였다","비관론자의 발병률은 낙관론자의 약 69% 수준이었다"],"answer":2,"explain":"p.14(A 유형 69%)와 p.15(비관 2배) 숫자를 섞지 말 것. Kubzansky et al.(2001). 교수: '두 배 가까이'. (오답 ① 다른 위험 요인을 통제하면 비관론자와 낙관론자의 차이는 사라졌다: 통제한 뒤에도 2배 차이가 남았다.)","src":"9장 p.15","diff":2,"wiki":"설명 양식","explainImg":"img/psy9-p15-slide.jpg"},{"id":"u9c-14","type":"tf","q":"만성 스트레스는 혈관 염증 → 면역 와해 → 우울증 → 흡연↑·운동↓로 이어지는 악순환을 만들 수 있다.","explain":"p.16 요지: 스트레스는 질병을 직접 일으키기보다 생리 기제와 행동을 통해 **취약성**을 만든다.","src":"9장 p.16","wiki":"스트레스와 질병 취약성","answer":true,"explainImg":"img/psy9-p16-slide.jpg"},{"id":"u9c-15","type":"match","q":"연구와 결과를 연결하시오","explain":"p.14–15 연구 짝. 학자 이름을 바꾼 보기에 주의.","src":"9장 p.14–15","wiki":"A 유형 성격","pairs":[["Evans et al.","A 유형 9년 추적, 심장병 환자의 69%"],["Kubzansky","비관론자 심장병 발병률이 낙관론자의 2배"],["Hertenstein","잘 웃는 사람은 장수"],["Chida & Hamer","핵심 독성 요소는 분노"]],"explainImg":"img/psy9-p15-slide.jpg"}]},{"id":"u9d","title":"대처와 통제감","intro":[{"title":"문제중심 vs 정서중심 대처","body":"상황을 **바꿀 수 있으면** **문제중심 대처**(직접 상호작용, MBTI의 T). **바꿀 수 없으면** **정서중심 대처**(지지·보상으로 정서 개선, F).","src":"9장 p.17"},{"title":"학습된 무기력","body":"통제 불가한 상황 → 통제력 결핍의 지각 → 무기력한 행동의 일반화. 셀리그먼 & 마이어(1967) 개 실험. 통제 불가가 가장 강력한 스트레스원.","src":"9장 p.18","img":"img/psy9-p18-helpless.png","imgAlt":"세 단계 흐름도"},{"title":"선택지 증가의 역설","body":"선택지가 너무 많으면 만족↓·후회↑(30개 받은 쪽이 6개보다 덜 만족, Iyengar & Lepper) — 이유는 **기회 비용**. 통제감은 없어도, 너무 많아도 문제.","src":"9장 p.20"},{"title":"통제 소재","body":"**내적 통제 소재** = 결과를 스스로 만든다고 믿음(학업·건강↑). **외적 통제 소재** = 운·타인 탓(PTSD↑). 단, 통제 못 할 일까지 내 탓으로 돌리면 더 괴로우니 외적이 늘 나쁜 건 아니다.","src":"9장 p.21–22"}],"items":[{"id":"u9d-01","type":"sa","q":"문제 상황·요인과 **직접 상호작용**하는 대처. 상황을 **바꿀 수 있다**고 판단할 때 쓴다(MBTI로 치면 **T**의 방식) — 명칭을 쓰시오.","answer":"문제중심 대처","alts":["problem-focused coping","문제중심 대처(problem-focused coping)"],"explain":"**문제중심 대처 (problem-focused coping)** — 예: 시험이 걱정 → 공부 계획 세우고 공부","src":"9장 p.17","prof":true,"wiki":"문제중심 대처","explainImg":"img/psy9-p17-slide.jpg"},{"id":"u9d-02","type":"sa","q":"상황을 바꿀 수 없다고 판단될 때, 타인의 지지·보상 등으로 자기 정서 상태를 개선하는 대처를 쓰시오.","answer":"정서중심 대처","alts":["정서 중심 대처","emotion-focused coping","정서중심대처법","정서 중심 대처법","정서중심 대처법"],"explain":"**정서중심 대처** — 교수 비유: F의 방식. 반대는 문제중심 대처(T).","src":"9장 p.17","diff":1,"prof":true,"wiki":"정서중심 대처","explainImg":"img/psy9-p17-slide.jpg"},{"id":"u9d-03","type":"mc","q":"기말고사가 걱정되는 B가 남은 기간의 공부 계획을 세우고 매일 실천했다. 이 대처 방식은?","choices":["정서중심 대처","정서 억제","문제중심 대처","털어놓기"],"answer":2,"explain":"슬라이드 예: 시험 걱정 → 공부 계획 = 문제중심. 문제 상황과 **직접 상호작용**(상황을 바꿀 수 있다고 판단). (오답 ① 정서중심 대처: 타인의 지지·보상으로 **기분**을 개선하는 쪽이다.)","src":"9장 p.17","diff":1,"wiki":"문제중심 대처","explainImg":"img/psy9-p17-slide.jpg"},{"id":"u9d-04","type":"mc","q":"불합격 통보를 받아 결과를 바꿀 수 없는 C가 친구에게 하소연하고 운동으로 기분을 풀었다. 이 대처 방식과, 이를 MBTI에 빗댄 유형(T/F)의 짝으로 옳은 것은?","choices":["정서중심 대처 — F","문제중심 대처 — T","정서중심 대처 — T","문제중심 대처 — F"],"answer":0,"explain":"교수: 라면을 쏟으면 T '치우고 다시 끓이면 된다', F '안 다쳤냐'. 바꿀 수 없는 상황 → 정서 개선. 교수: 정서중심 = F의 방식. (오답 ② 문제중심 대처 — T: 상황을 바꿀 수 없으므로 문제중심이 아니다.)","src":"9장 p.17","diff":1,"prof":true,"wiki":"정서중심 대처","explainImg":"img/psy9-p17-slide.jpg"},{"id":"u9d-05","type":"sa","q":"반복되는 사건에 충분한 변화·통제를 가할 수 없을 때 형성되는 무력감을 쓰시오.","answer":"학습된 무기력","alts":["learned helplessness","학습된무기력감","학습된 무력감"],"explain":"**학습된 무기력** — Seligman & Maier(1967).","src":"9장 p.18","diff":1,"wiki":"학습된 무기력","explainImg":"img/psy9-p18-slide.jpg"},{"id":"u9d-06","type":"sa","q":"개 실험으로 **학습된 무기력**을 보인 연구 (1967) — 이 연구자(학자)는?","answer":"셀리그먼 & 마이어","alts":["Seligman & Maier","셀리그먼 & 마이어(Seligman & Maier)","셀리그먼과 마이어","셀리그먼, 마이어"],"explain":"**셀리그먼 & 마이어 (Seligman & Maier)** — 개 실험으로 **학습된 무기력**을 보인 연구 (1967)","src":"9장 p.18","wiki":"학습된 무기력","explainImg":"img/psy9-p18-slide.jpg"},{"id":"u9d-07","type":"order","q":"학습된 무기력의 형성 과정을 순서대로 놓으시오","explain":"교수: '키워드는 통제'. 통제 불가는 가장 강력한 스트레스원이다(Dickerson & Kemeny).","src":"9장 p.18 🎙","wiki":"학습된 무기력","prof":true,"answer":["통제 불가한 상황","통제력 결핍의 지각","무기력한 행동의 일반화"],"explainImg":"img/psy9-p18-slide.jpg"},{"id":"u9d-08","type":"mc","q":"학습된 무기력에 대한 설명으로 옳은 것은?","choices":["사람에게서만 나타나며 동물 실험에서는 확인되지 않았다","통제 가능한 상황이 반복될 때 형성된다","노년층에서는 통제감 상실이 건강에 영향을 주지 않는다","통제 불가한 상황 → 통제력 결핍의 지각 → 무기력한 행동의 일반화 순서로 형성된다"],"answer":3,"explain":"교수: '여기서의 키워드는 통제'. 통제 불가 = 가장 강력한 스트레스원. p.18 형성 과정. (오답 ① 사람에게서만 나타나며 동물 실험에서는 확인되지 않았다: **Seligman & Maier(1967)** 개 실험에서 확인.)","src":"9장 p.18","diff":2,"wiki":"학습된 무기력","explainImg":"img/psy9-p18-slide.jpg"},{"id":"u9d-09","type":"sa","q":"선택지가 **너무 많을 때** 오히려 삶의 만족 ↓, 우울 ↑, **행동 마비** (Schwartz) — 명칭을 쓰시오.","answer":"선택의 역설","alts":["선택지 증가의 역설","선택의 역설(선택지 증가의 역설)"],"explain":"**선택의 역설 (선택지 증가의 역설)** — 잼 실험: 30개 \u003c 6개 만족 — 선택지가 **너무 많을 때** 오히려 삶의 만족 ↓, 우울 ↑, **행동 마비** (Schwartz)","src":"9장 p.20","wiki":"선택지 증가의 역설","explainImg":"img/psy9-p20-slide.jpg"},{"id":"u9d-10","type":"mc","q":"선택지가 너무 많으면 오히려 만족이 떨어지는 '선택지 증가의 역설'이 생기는 이유를 설명하는 개념은?","choices":["학습된 무기력","일상적 다툼","초킹","기회 비용"],"answer":3,"explain":"교수 결론: 통제감은 너무 많아도 없어도 문제 — 적절한 수준. 고른 것 외의 나머지 중 더 나은 게 있었을 가능성 → 후회 ↑(30개면 29개, 6개면 5개). (오답 ① 학습된 무기력: 통제감이 **없을 때**의 문제 — 선택의 역설은 통제감(선택권)이 **너무 많을 때**.)","src":"9장 p.20","diff":2,"prof":true,"wiki":"선택지 증가의 역설","explainImg":"img/psy9-p20-slide.jpg"},{"id":"u9d-11","type":"tf","q":"선택지는 많을수록 선택에 대한 만족이 커진다.","explain":"아니다. 선택지 30개를 받은 쪽이 6개를 받은 쪽보다 **덜 만족**했다(Iyengar & Lepper). 교수: 기회 비용 → 후회 ↑.","src":"9장 p.20","wiki":"선택지 증가의 역설","answer":false,"explainImg":"img/psy9-p20-slide.jpg"},{"id":"u9d-12","type":"sa","q":"자신에게 닥친 상황과 결과를 스스로 결정하고 만들 수 있다고 믿는 경향을 쓰시오.","answer":"내적 통제 소재","alts":["내적 통제소재","internal locus of control","내적 통제의 소재","내적통제"],"explain":"**내적 통제 소재** — 반대는 외적 통제 소재(PTSD ↑).","src":"9장 p.21","diff":1,"wiki":"내적 통제 소재","explainImg":"img/psy9-p21-slide.jpg"},{"id":"u9d-13","type":"sa","q":"운·타인·운명 같은 **외부 요인**이 자신에게 영향을 준다고 믿는 경향 — 명칭을 쓰시오.","answer":"외적 통제 소재","alts":["external locus of control","외적 통제"],"explain":"**외적 통제 소재** — PTSD ↑, 현 세대가 이전 세대보다 더 많이 보고(Twenge)","src":"9장 p.22","wiki":"외적 통제 소재","explainImg":"img/psy9-p22-slide.jpg"},{"id":"u9d-14","type":"mc","q":"통제 소재에 대한 설명으로 옳은 것은?","choices":["10살 때 내적 통제 소재를 보인 사람은 30세에 비만·고혈압이 적었다","외적 통제 소재가 강할수록 PTSD가 적다","현 세대는 이전 세대보다 내적 통제 소재를 더 많이 보고한다","내적 통제 소재란 운·운명 같은 외부 요인이 결과를 결정한다고 믿는 경향이다"],"answer":0,"explain":"내적 = 스스로 결정·만든다 / 외적 = 외부 요인이 영향. p.21. (오답 ② 외적 통제 소재가 강할수록 PTSD가 적다: 외적 통제 소재 → **더 큰** PTSD(Hoffman et al., 2016).)","src":"9장 p.21–22","diff":2,"wiki":"통제 소재","explainImg":"img/psy9-p21-slide.jpg"},{"id":"u9d-15","type":"tf","q":"외적 통제 소재는 항상 나쁘다.","explain":"교수 답: 꼭 그렇진 않다 — 통제할 수 없는 일까지 내 탓으로 돌리면 더 스트레스. '적절한 수준'의 통제감이 중요.","src":"9장 p.22 🎙","wiki":"외적 통제 소재","prof":true,"answer":false,"explainImg":"img/psy9-p22-slide.jpg"},{"id":"u9d-16","type":"mc","q":"'외적 통제 소재는 꼭 나쁜 것인가?'라는 물음에 대한 답으로 가장 적절한 것은?","choices":["외적 통제 소재는 PTSD와 관련되므로 반드시 내적으로 고쳐야 한다","외적 통제 소재는 유전되므로 바꿀 수 없다","통제할 수 없는 상황까지 내 탓으로 돌리면 더 스트레스이므로, 항상 내적 통제 소재가 좋은 것은 아니다","외적 통제 소재가 내적 통제 소재보다 항상 건강에 이롭다"],"answer":2,"explain":"교수 예: 실험 참가자가 졸아 데이터가 망가진 것까지 연구자 탓? '남 탓도 가끔은 할 필요가 있다'. 교수: '항상 내적 통제 소재를 갖고 있는 게 좋은 건 아니라고 생각'. (오답 ① 외적 통제 소재는 PTSD와 관련되므로 반드시 내적으로 고쳐야 한다: 교수는 '꼭 나쁘다는 뉘앙스로 얘기할 필요가 있을까'라고 했다.)","src":"9장 p.22","diff":2,"prof":true,"wiki":"외적 통제 소재","explainImg":"img/psy9-p22-slide.jpg"},{"id":"u9d-17","type":"sa","q":"그림의 세 단계(통제 불가한 상황 → 통제력 결핍의 지각 → 무기력한 행동의 일반화)를 거쳐 형성되는 무력감의 명칭을 쓰시오.","explain":"**학습된 무기력** — 셀리그먼 & 마이어(1967)의 개 실험. 통제 불가는 가장 강력한 스트레스원이다.","src":"9장 p.18","wiki":"학습된 무기력","answer":"학습된 무기력","alts":["learned helplessness","학습된 무력감","학습된무기력"],"img":"img/psy9-p18-helpless.png","imgAlt":"위에서 아래로 이어지는 세 단계 흐름도","explainImg":"img/psy9-p18-slide.jpg"}]},{"id":"u9e","title":"자기 통제·설명 양식·사회적 지원","intro":[{"title":"자기 통제","body":"장기적 보상을 위해 단기 만족을 **지연**하는 능력(마시멜로 실험, 미셸). IQ보다 학업 성취를 잘 예측, 훈련으로 강화, 쓰고 나면 일시 고갈.","src":"9장 p.23"},{"title":"낙관성과 비관성","body":"**낙관성** = 극복 가능성을 열어 두는 설명 양식(유전 영향도 있지만 훈련 가능). **비관성** = 낮은 통제감. 인지행동 치료: 사건 → 정서·강도 → 사고 → 지지 증거 → **반박 증거**(핵심) → 재평가·강도 재측정.","src":"9장 p.24–25"},{"title":"사회적 지원","body":"문화와 무관하게 행복·건강을 예측. 배우자 손을 잡으면 위협 반응↓, 포옹이 잦으면 감기↓. 가장 강력한 이점 = **털어놓기**(일시적으로 각성되지만 곧 진정). **정서 억제**는 건강에 해롭다.","src":"9장 p.26–28"}],"items":[{"id":"u9e-01","type":"sa","q":"충동을 제어하여 장기적 보상을 위해 단기적 만족을 지연시키는 능력을 쓰시오.","answer":"자기 통제","alts":["자기통제","self-control","자기 통제력","자기통제력","만족 지연"],"explain":"**자기 통제** — 마시멜로 실험, 교수: 쿨타임.","src":"9장 p.23","diff":1,"wiki":"자기 통제","explainImg":"img/psy9-p23-slide.jpg"},{"id":"u9e-02","type":"sa","q":"지금 하나를 먹을지, 기다렸다 더 받을지로 아동의 **만족 지연**을 본 대표 실험 (미셸) — 명칭을 쓰시오.","answer":"마시멜로 실험","alts":["마시멜로 검사","marshmallow test"],"explain":"**마시멜로 실험** — 자기 통제의 예 — 지금 하나를 먹을지, 기다렸다 더 받을지로 아동의 **만족 지연**을 본 대표 실험 (미셸)","src":"9장 p.23","wiki":"자기 통제","explainImg":"img/psy9-p23-slide.jpg"},{"id":"u9e-03","type":"mc","q":"자기 통제에 대한 설명으로 옳지 않은 것은?","choices":["지능 검사 점수보다 학업 성취를 더 잘 예측한다","사용 후에는 일시적으로 고갈되었다가 회복된다","타고나는 능력이므로 훈련으로는 강화되지 않는다","장기적 보상을 위해 단기적 만족을 지연시키는 능력이다"],"answer":2,"explain":"손실과 회복을 반복하며 능력이 커진다. **반복 훈련으로 강화**된다(Baumeister & Vohs, 2016). (오답 ① 지능 검사 점수보다 학업 성취를 더 잘 예측한다: 옳다(Duckworth & Seligman).)","src":"9장 p.23","diff":2,"wiki":"자기 통제","explainImg":"img/psy9-p23-slide.jpg"},{"id":"u9e-04","type":"cloze","q":"자기 통제는 사용 후 일시적으로 ___ 되었다가 회복되며, 반복 ___ 으로 강화된다. 또 IQ보다 학업 성취를 더 잘 예측한다.","explain":"p.23 자기 통제의 특징 3가지(Baumeister & Vohs). 교수 비유: 쿨타임.","src":"9장 p.23","wiki":"자기 통제","answer":["고갈","훈련"],"bank":["고갈","훈련","증가","유전","처벌"],"explainImg":"img/psy9-p23-slide.jpg"},{"id":"u9e-05","type":"sa","q":"상황·난관의 **극복 가능성을 열어두는** 설명 양식 — 통제감·대처 능력 우수, 일란성 쌍둥이 연구로 **유전 영향** 확인 — 명칭을 쓰시오.","answer":"낙관성","alts":["낙관주의","optimism"],"explain":"**낙관성** — 교수: 문제중심 대처 전략을 세우는 쪽 — 상황·난관의 **극복 가능성을 열어두는** 설명 양식 — 통제감·대처 능력 우수, 일란성 쌍둥이 연구로 **유전 영향** 확인","src":"9장 p.24","wiki":"설명 양식","explainImg":"img/psy9-p24-slide.jpg"},{"id":"u9e-06","type":"mc","q":"낙관성·비관성에 대한 설명으로 옳은 것은?","choices":["낙관성은 유전의 영향을 받지만, 비관적인 사람도 훈련으로 낙관성을 갖출 수 있다","낙관성은 유전되므로 훈련으로는 바꿀 수 없다","비관성은 자신과 상황에 대한 높은 통제감을 뜻한다","훈련 연구에서는 사건을 있는 그대로 적는 단순 일기가 가장 효과적이었다"],"answer":0,"explain":"교수: '비관적인 인원도 훈련을 받으면 충분히 낙관성을 갖출 수가 있어요'. p.24(일란성 쌍둥이) + p.25(Malouff & Schutte). (오답 ② 낙관성은 유전되므로 훈련으로는 바꿀 수 없다: 훈련으로 바뀐다(p.25).)","src":"9장 p.24–25","diff":2,"wiki":"설명 양식","explainImg":"img/psy9-p25-slide.jpg"},{"id":"u9e-07","type":"tf","q":"낙관성은 유전되므로 훈련으로는 바꿀 수 없다.","explain":"아니다. 일란성 쌍둥이 연구로 유전 영향이 있지만, **훈련**으로 낙관성을 갖출 수도 있다 — 둘 다 맞다.","src":"9장 p.24–25","wiki":"설명 양식","answer":false,"explainImg":"img/psy9-p24-slide.jpg"},{"id":"u9e-08","type":"sa","q":"사건 → 정서·강도 → 사고 → **지지 증거** → **반박 증거** → 재평가·강도 재측정 순으로 인식을 바꾸는 치료 — 명칭을 쓰시오.","answer":"인지행동 치료","alts":["인지 행동 치료","CBT","인지행동치료법"],"explain":"**인지행동 치료** — 교수: '중요한 건 그 부분' = 반박 증거 — 사건 → 정서·강도 → 사고 → **지지 증거** → **반박 증거** → 재평가·강도 재측정 순으로 인식을 바꾸는 치료","src":"9장 p.25","prof":true,"wiki":"인지행동 치료","explainImg":"img/psy9-p25-slide.jpg"},{"id":"u9e-09","type":"order","q":"인지행동 치료로 사고를 재평가하는 절차를 순서대로 놓으시오","explain":"교수: 반박 증거 단계가 '중요한 건 그 부분'. 재측정한 강도가 줄면 성공.","src":"9장 p.25 🎙","wiki":"설명 양식","prof":true,"answer":["사건 적기","정서와 그 강도 적기","떠오른 사고 적기","그 사고를 지지하는 증거","그 사고를 반박하는 증거","재평가 후 강도 재측정"],"explainImg":"img/psy9-p25-slide.jpg"},{"id":"u9e-10","type":"mc","q":"인지행동 치료 절차에서 인식을 바꾸는 데 가장 중요한 단계는?","choices":["강한 정서를 일으킨 사건을 적는 단계","정서의 강도를 점수로 매기는 단계","그 사고를 지지하는 증거를 적는 단계","그 사고에 반박하는 증거를 스스로 떠올려 적는 단계"],"answer":3,"explain":"사건 → 정서·강도 → 사고 → 지지 증거 → 반박 증거 → 재평가·강도 재측정. 다른 관점으로 생각해 보는 핵심 단계. (오답 ① 강한 정서를 일으킨 사건을 적는 단계: 1차 기술(1단계) — 강조 지점이 아니다.)","src":"9장 p.25","diff":3,"prof":true,"wiki":"인지행동 치료","explainImg":"img/psy9-p25-slide.jpg"},{"id":"u9e-11","type":"sa","q":"문화권(집단주의·개인주의)과 **무관하게** 행복·건강을 예측하는, 긴밀한 인간관계에서 오는 도움 — 명칭을 쓰시오.","answer":"사회적 지원","alts":["지지","사회적 지원(지지)"],"explain":"**사회적 지원(지지)** — 고립 시 사망률 약 30% ↑. 교수: 아는 사람 수가 아니라 **깊은 관계**","src":"9장 p.26","wiki":"사회적 지원","explainImg":"img/psy9-p26-slide.jpg"},{"id":"u9e-12","type":"mc","q":"사회적 지원에 대한 설명으로 옳지 않은 것은?","choices":["고립된 사람은 사망률이 약 30% 더 높다","개인주의 문화권에서는 긴밀한 인간관계가 건강을 예측하지 못한다","아는 사람의 수보다 진짜 관심을 기울여 주는 관계가 중요하다","전기 충격 실험에서 배우자의 손을 잡으면 위협 관련 뇌 영역 활성이 줄었다"],"answer":1,"explain":"행복한 결혼 생활 = 건강한 노화의 최고 예측 요인(Vaillant). 문화권과 **무관하게** 예측한다(Rueger). 교수: '문화권에 따라서 큰 차이가 없어요'. (오답 ① 고립된 사람은 사망률이 약 30% 더 높다: 옳다(Holt-Lunstad).)","src":"9장 p.26–27","diff":2,"wiki":"사회적 지원","explainImg":"img/psy9-p26-slide.jpg"},{"id":"u9e-13","type":"tf","q":"자기 통제는 IQ보다 학업 성취를 더 잘 예측한다.","explain":"p.23: 자기 통제는 IQ보다 학업 성취를 더 잘 예측하고, 반복 훈련으로 강화되며, 사용 후 일시 고갈된다.","src":"9장 p.23","wiki":"자기 통제","answer":true,"explainImg":"img/psy9-p23-slide.jpg"},{"id":"u9e-14","type":"sa","q":"사회적 지원의 **가장 강력한 이점**으로, 고통스러운 감정을 꺼내면 일시적으로 각성되지만 곧 **빠르게 진정**되는 것 — 명칭을 쓰시오.","answer":"털어놓기","alts":["고백","감정 털어놓기"],"explain":"**털어놓기** — 혼자서 일기로 적어도 도움(Kallay) — 사회적 지원의 **가장 강력한 이점**(교수). 고통스러운 감정을 꺼내면 일시적으로 각성되지만 곧 **빠르게 진정**","src":"9장 p.28","prof":true,"wiki":"사회적 지원","explainImg":"img/psy9-p28-slide.jpg"},{"id":"u9e-15","type":"mc","q":"털어놓기에 대한 설명으로 옳은 것은?","choices":["고통스러운 기억을 다시 겪게 하므로 장기적으로 해롭다","스트레스 사건을 이야기하면 일시적으로 각성되지만 이후 빠르게 진정된다","정서를 억제하는 것이 털어놓는 것보다 신체 건강에 이롭다","들어줄 사람이 없으면 일기로 적는 것은 효과가 없다"],"answer":1,"explain":"교수: 털어놓기 = 사회적 지원의 가장 강력한 이점, '결국 이게 가장 중요'. Niles et al.(2015). 교수: 재경험 고통은 '일시적'. (오답 ① 고통스러운 기억을 다시 겪게 하므로 장기적으로 해롭다: 고통은 일시적이고 진정 효과가 더 크다.)","src":"9장 p.28","diff":2,"prof":true,"wiki":"사회적 지원","explainImg":"img/psy9-p28-slide.jpg"},{"id":"u9e-16","type":"sa","q":"감정을 꺼내지 않고 **담아두는 것** — 신체 건강에 악영향 (Wastell, 2002) — 명칭을 쓰시오.","answer":"정서 억제","alts":["감정 억제"],"explain":"**정서 억제** — 교수: 화병은 쌓아 둬서 생긴다 — 감정을 꺼내지 않고 **담아두는 것** — 신체 건강에 악영향 (Wastell, 2002)","src":"9장 p.28","wiki":"사회적 지원","explainImg":"img/psy9-p28-slide.jpg"}]},{"id":"u9f","title":"스트레스 관리","intro":[{"title":"초킹","body":"결과 압박으로 **작업 기억** 활용이 막혀 수행이 떨어지는 현상. 시험 전 불안을 **글로** 쓰면 막을 수 있다(Ramirez & Beilock).","src":"9장 p.29"},{"title":"유산소 운동","body":"스트레스 호르몬 반응 완화, 세로토닌·엔도르핀↑ → 항우울제에 가까운 효과. 유산소 집단의 우울이 가장 크게 감소(McCann & Holmes).","src":"9장 p.30–32"},{"title":"이완·명상·신앙 공동체","body":"심장마비 생존자에게 이완·생활양식 조언 → **재발률**↓(Friedman & Ulmer). **마음챙김 명상** = 판단 없이 관조 → 편도체↓ 전전두엽↑. **신앙 공동체** = 자기통제·**사회적 지원**(가장 큼)·긍정적 정서로 사망률↓.","src":"9장 p.33–35"},{"title":"생물심리사회적 스트레스 관리","body":"생물 = 유산소 운동 / 심리 = 명상·이완·재평가 / 사회문화 = 친밀한 관계·사회적 지지.","src":"9장 p.36"}],"items":[{"id":"u9f-01","type":"sa","q":"결과에 부담을 느껴 작업 기억 활용이 제약되고, 압박 속에서 수행이 떨어지는 현상을 쓰시오.","answer":"초킹","alts":["choking","초킹 현상","쵸킹"],"explain":"**초킹** — 시험 전 불안을 글로 표출하면 예방(Ramirez & Beilock).","src":"9장 p.29","diff":1,"wiki":"초킹","explainImg":"img/psy9-p29-slide.jpg"},{"id":"u9f-02","type":"mc","q":"결과 압박 때문에 작업 기억 활용이 제약되어 수행이 떨어지는 현상과, 이를 막는 방법의 연결이 옳은 것은?","choices":["초킹 — 시험 직전 감정을 억누르기","학습된 무기력 — 시험 직전 불안을 글로 표출하기","소진 — 유산소 운동","초킹 — 시험 직전 불안을 글로 표출하기"],"answer":3,"explain":"p.28 털어놓기·일기와 같은 원리(표현 → 부담 해소). Ramirez & Beilock(2011). 교수: '혼자서라도 글로 써놓는 게'. (오답 ① 초킹 — 시험 직전 감정을 억누르기: 억제가 아니라 **표출**이 예방법이다.)","src":"9장 p.29","diff":2,"wiki":"작업 기억","explainImg":"img/psy9-p29-slide.jpg"},{"id":"u9f-03","type":"sa","q":"스트레스 **호르몬 반응을 완화**하고, 항우울제와 거의 같은 수준의 항우울 효과를 내는 스트레스 감소법 — 명칭을 쓰시오.","answer":"유산소 운동","alts":["aerobic exercise"],"explain":"**유산소 운동** — 스코틀랜드 우편 배달부, 교수: 생물학적 차원의 가장 좋은 해결책 중 하나","src":"9장 p.30–32","wiki":"유산소 운동","explainImg":"img/psy9-p30-slide.jpg"},{"id":"u9f-04","type":"mc","q":"유산소 운동에 대한 설명으로 옳지 않은 것은?","choices":["McCann과 Holmes(1984)의 연구에서 이완 처치 집단의 우울 감소가 유산소 운동 집단보다 컸다","스코틀랜드 우편 배달부는 내근 직원보다 심장병 위험이 낮았다","항우울제와 거의 같은 수준의 효과를 보인다","세로토닌·엔도르핀 분비를 늘린다"],"answer":0,"explain":"교수: '가장 중요한 항우울 효과', '거의 항우울제랑 동일한 수준'. **유산소 운동** 집단의 우울 점수가 가장 급격히 감소했다. (오답 ② 스코틀랜드 우편 배달부는 내근 직원보다 심장병 위험이 낮았다: 옳다(Tigbe et al.).)","src":"9장 p.30–32","diff":2,"wiki":"유산소 운동","explainImg":"img/psy9-p30-slide.jpg"},{"id":"u9f-05","type":"tf","q":"유산소 운동은 항우울제와 거의 같은 수준의 항우울 효과를 낼 수 있다.","explain":"유산소 운동은 스트레스 호르몬 반응을 완화하고 세로토닌·엔도르핀 분비를 늘려 항우울 효과를 낸다(Salmon, 2001).","src":"9장 p.30–32","wiki":"유산소 운동","answer":true,"explainImg":"img/psy9-p32-slide.jpg"},{"id":"u9f-06","type":"sa","q":"심장마비 생존자에게 **이완·생활양식 수정** 조언을 추가 → 재발률 ↓ (1984) — 이 연구자(학자)는?","answer":"프리드먼 & 울머","alts":["Friedman & Ulmer","프리드먼 & 울머(Friedman & Ulmer)","프리드먼과 울머","프리드먼, 울머"],"explain":"**프리드먼 & 울머 (Friedman & Ulmer)** — 심장마비 생존자에게 **이완·생활양식 수정** 조언을 추가 → 재발률 ↓ (1984)","src":"9장 p.33","wiki":"이완과 명상","explainImg":"img/psy9-p33-slide.jpg"},{"id":"u9f-07","type":"mc","q":"Friedman과 Ulmer(1984)의 심장마비 생존자 연구 결과로 옳은 것은?","choices":["식이·운동 표준 조언만 받은 집단의 재발률이 더 낮았다","두 집단의 재발률에는 차이가 없었다","이완·생활양식 수정 조언을 추가로 받은 집단의 심장마비 재발률이 현저히 낮았다","추가 조언 집단은 우울 점수만 낮아지고 재발률은 같았다"],"answer":2,"explain":"교수는 '발병률'이라고 말했지만 슬라이드 표현은 심장마비 **재발률**. p.33. (오답 ① 식이·운동 표준 조언만 받은 집단의 재발률이 더 낮았다: 반대.)","src":"9장 p.33","diff":2,"wiki":"이완과 명상","explainImg":"img/psy9-p33-slide.jpg"},{"id":"u9f-08","type":"tf","q":"Friedman & Ulmer 연구에서 심장마비 생존자에게 이완·생활양식 수정 조언을 더하자 심장마비 재발률이 낮아졌다.","explain":"슬라이드 = '재발률'. 교수는 수업에서 '발병률'이라 말했지만 시험은 슬라이드 기준이다.","src":"9장 p.33","wiki":"이완과 명상","answer":true,"explainImg":"img/psy9-p33-slide.jpg"},{"id":"u9f-09","type":"sa","q":"내적 상태를 **판단 없이** 그 상태 자체에 집중(관조)하는 명상 — 편도체 ↓, 전전두엽 ↑ — 명칭을 쓰시오.","answer":"마음챙김 명상","alts":["mindfulness meditation","마음챙김 명상(mindfulness meditation)"],"explain":"**마음챙김 명상 (mindfulness meditation)** — 교수 실습: 바디 스캔, 건포도 1분","src":"9장 p.34","wiki":"마음챙김 명상","explainImg":"img/psy9-p34-slide.jpg"},{"id":"u9f-10","type":"mc","q":"마음챙김 명상에 대한 설명으로 옳은 것은?","choices":["편도체 활성은 늘고 전전두엽 활성은 줄어든다","떠오르는 감각을 좋다·나쁘다로 평가하도록 훈련한다","내적 상태를 판단 없이 관조하며, 편도체 활성은 줄고 전전두엽 활성은 늘어난다","사고에 반박하는 증거를 적어 재평가하는 기법이다"],"answer":2,"explain":"교수 실습: 바디 스캔, 건포도 한 알 1분 머금기. p.34(Creswell et al., 2007). (오답 ① 편도체 활성은 늘고 전전두엽 활성은 줄어든다: 반대.)","src":"9장 p.34","diff":2,"wiki":"마음챙김 명상","explainImg":"img/psy9-p34-slide.jpg"},{"id":"u9f-11","type":"cloze","q":"마음챙김 명상을 하면 ___ 활성은 줄고 ___ 활성은 늘어난다.","explain":"Creswell: 편도체 ↓, 전전두엽 ↑, 뇌 영역 간 연결 강화, 불안·우울 감소.","src":"9장 p.34","wiki":"마음챙김 명상","answer":["편도체","전전두엽"],"bank":["편도체","전전두엽","해마","소뇌","시상"],"explainImg":"img/psy9-p34-slide.jpg"},{"id":"u9f-12","type":"sa","q":"**자기통제·사회적 지원·긍정적 정서** 세 경로로 사망률을 낮추는 조직·환경 차원의 방법 — 명칭을 쓰시오.","answer":"신앙 공동체 생활","alts":["신앙 공동체","종교 공동체 생활"],"explain":"**신앙 공동체 생활** — 교수: 세 경로 중 **사회적 지원**이 가장 크다 — **자기통제·사회적 지원·긍정적 정서** 세 경로로 사망률을 낮추는 조직·환경 차원의 방법","src":"9장 p.35","wiki":"9장 스트레스와 건강","explainImg":"img/psy9-p35-slide.jpg"},{"id":"u9f-13","type":"mc","q":"신앙 공동체 생활이 사망률을 낮추는 세 경로(자기통제·사회적 지원·긍정적 정서) 중 효과가 **가장 큰** 것은?","choices":["사회적 지원","자기 통제 능력 증진","긍정적 정서(기도 = 이완적 명상)","유산소 운동"],"answer":0,"explain":"교수: 자기통제·명상은 혼자 할 수 있지만 사회적 지원은 관계가 있어야 → 동아리·서클도 좋다. 교수: '두 번째가 가장 크죠'. (오답 ② 자기 통제 능력 증진: 세 경로 중 첫째(흡연·음주 ↓)지만 가장 크다고 하지 않았다.)","src":"9장 p.35","diff":1,"prof":true,"wiki":"사회적 지원","explainImg":"img/psy9-p35-slide.jpg"},{"id":"u9f-14","type":"sa","q":"스트레스 관리를 생물(운동)·심리(명상·재평가)·사회문화(관계)로 나눈 틀 — 명칭을 쓰시오.","answer":"생물심리사회적 접근","alts":["생물심리사회적 접근법","biopsychosocial approach"],"explain":"**생물심리사회적 접근** — 교수: '늘 말했던 세 가지' — 스트레스 관리를 생물(운동)·심리(명상·재평가)·사회문화(관계)로 나눈 틀","src":"9장 p.36","wiki":"생물심리사회적 접근법","explainImg":"img/psy9-p36-slide.jpg"},{"id":"u9f-15","type":"mc","q":"스트레스 관리의 접근과 방법의 연결이 옳지 않은 것은?","choices":["생물적 접근 — 유산소 운동으로 스트레스 호르몬 감소","심리적 접근 — 내적·외적 통제 판단을 통한 재평가, 자기 통제감 증진","사회문화적 접근 — 친밀한 관계, 동아리·신앙 생활을 통한 사회적 지지","생물적 접근 — 명상으로 새로운 관점에서 재평가"],"answer":3,"explain":"p.36 = 생물심리사회적 접근의 틀. 명상·재평가는 **심리적** 접근이다. (오답 ① 생물적 접근 — 유산소 운동으로 스트레스 호르몬 감소: 옳다.)","src":"9장 p.36","diff":2,"wiki":"스트레스","explainImg":"img/psy9-p36-slide.jpg"},{"id":"u9f-16","type":"match","q":"연구와 결과를 연결하시오","explain":"9장 후반(p.29–34) 연구 짝. 연구자 이름을 바꾼 보기에 주의.","src":"9장 p.29–34","wiki":"이완과 명상","pairs":[["Ramirez & Beilock","시험 전 불안을 글로 쓰면 초킹이 없음"],["McCann & Holmes","유산소 운동 집단의 우울 점수가 가장 감소"],["Friedman & Ulmer","이완 조언 추가 → 심장마비 재발률 감소"],["Creswell","마음챙김 → 편도체 활성 감소"]],"explainImg":"img/psy9-p34-slide.jpg"}]}]},{"id":"u10","title":"10장 사회행동","desc":"귀인·태도 · 동조 · 복종·소수자 · 집단 속의 개인 · 편견·공격성 · 매력·이타심·평화","lessons":[{"id":"u10a","title":"귀인과 태도","intro":[{"title":"사회심리학","body":"같은 사람이 **다른 상황**에서 다르게 행동하는 이유(상황 초점). 성격심리학은 같은 상황에서 **다른 사람**이 다른 이유(특질 초점).","src":"10장 p.3"},{"title":"귀인 이론 (하이더, 1958)","body":"행동의 원인을 찾는 방식: **성향 귀인**(특질 탓) vs **상황 귀인**(외부 탓). **근본적 귀인 오류** = 남의 행동에서 상황은 **과소**, 성향은 **과대**평가. 나는 상황 귀인, 남은 성향 귀인. 개인주의 문화는 성향 귀인, 집단주의는 상황에 민감.","src":"10장 p.4–6"},{"title":"태도 ↔ 행위","body":"**태도** → 행위는 외부 영향이 없고 태도가 안정적일 때. 반대로 행위 → 태도: **문 안에 발 들여놓기**(작은 부탁 → 큰 부탁), **인지 부조화**(태도를 행위에 맞춤), **역할 놀이**(스탠포드 감옥 실험, 짐바르도).","src":"10장 p.8–11"}],"items":[{"id":"u10a-01","type":"mc","q":"사회심리학과 성격심리학에 대한 설명으로 옳은 것은?","choices":["성격심리학은 동일한 사람이 상이한 상황에서 다르게 행동하는 이유를 탐구한다","사회심리학은 동일한 사람이 상이한 상황에서 다르게 행동하는 이유를 탐구한다","사회심리학은 차이의 근본 요인을 개인의 특질과 성격에서 찾는다","두 학문은 사람이 다르게 행동하는 양상에 관심이 없다"],"answer":1,"explain":"같은 사람 + 다른 상황 = 사회, 같은 상황 + 다른 사람 = 성격. p.3 — 차이의 근본 요인 = 상황·환경. (오답 ① 성격심리학은 동일한 사람이 상이한 상황에서 다르게 행동하는 이유를 탐구한다: 그것은 **사회**심리학. 성격심리학은 같은 상황 + 여러 사람.)","src":"10장 p.3","diff":1,"wiki":"사회심리학","explainImg":"img/psy10-p3-slide.jpg"},{"id":"u10a-02","type":"sa","q":"사람이 어떤 행동에 대한 **원인을 찾는 방식**에 대한 이론 (하이더, 1958) — 명칭을 쓰시오.","answer":"귀인 이론","alts":["attribution theory","귀인 이론(attribution theory)"],"explain":"**귀인 이론 (attribution theory)** — 성향 귀인 vs 상황 귀인 — 사람이 어떤 행동에 대한 **원인을 찾는 방식**에 대한 이론 (하이더, 1958)","src":"10장 p.4","wiki":"귀인 이론","explainImg":"img/psy10-p4-slide.jpg"},{"id":"u10a-03","type":"sa","q":"**귀인 이론** (1958) — 이 연구자(학자)는?","answer":"하이더","alts":["Heider","하이더(Heider)"],"explain":"**하이더 (Heider)** — ⚠️ p.2 '인간은 사회적 동물' 캡션의 하이더는 잘못 붙은 것","src":"10장 p.4","wiki":"귀인 이론","explainImg":"img/psy10-p4-slide.jpg"},{"id":"u10a-04","type":"sa","q":"행동이 **개인의 특질**에 의해 발생했다고 보는 귀인. 예: '저 상사는 원래 성격이 꼬였어' — 명칭을 쓰시오.","answer":"성향 귀인","alts":["기질 귀인","dispositional attribution"],"explain":"**성향 귀인** (기질적 귀인) — 행동이 **개인의 특질**에 의해 발생했다고 보는 귀인. 예: '저 상사는 원래 성격이 꼬였어'","src":"10장 p.4","wiki":"귀인 이론","explainImg":"img/psy10-p4-slide.jpg"},{"id":"u10a-05","type":"sa","q":"상대방의 행동을 분석할 때 상황의 영향은 과소평가하고 개인의 성향은 과대평가하는 경향을 쓰시오.","answer":"근본적 귀인 오류","alts":["기본적 귀인 오류","fundamental attribution error","근본귀인오류","근본적귀인오류"],"explain":"**근본적 귀인 오류** — 🖍 p.4.","src":"10장 p.4","diff":1,"wiki":"근본적 귀인 오류","explainImg":"img/psy10-p4-slide.jpg"},{"id":"u10a-06","type":"mc","q":"근본적 귀인 오류에 대한 설명으로 옳은 것은?","choices":["상대방의 행동을 분석할 때 상황의 영향은 과대평가하고 개인의 성향은 과소평가하는 경향이다","타인의 행동이 외부 지시에 의한 것임을 알면 근본적 귀인 오류는 사라진다","자신의 행동을 개인의 성향 탓으로 돌리는 경향만을 가리킨다","상대방의 행동을 분석할 때 상황의 영향은 과소평가하고 개인의 성향은 과대평가하는 경향이다"],"answer":3,"explain":"교수: 정보가 제한된 상황에서 '이 사고방식을 피하기가 어렵다'. p.4 정의(🖍 형광펜). (오답 ① 상대방의 행동을 분석할 때 상황의 영향은 과대평가하고 개인의 성향은 과소평가하는 경향이다: 방향이 **반대**.)","src":"10장 p.4","diff":2,"prof":true,"wiki":"근본적 귀인 오류","explainImg":"img/psy10-p4-slide.jpg"},{"id":"u10a-07","type":"tf","q":"사람들은 자기 행동은 성향 탓으로, 남의 행동은 상황 탓으로 돌리는 경향이 있다.","explain":"반대다. **나**의 행동 → **상황** 귀인, **타인**의 행동 → **성향** 귀인(슬라이드 형광펜). 이것도 근본적 귀인 오류의 한 유형.","src":"10장 p.6 🖍","wiki":"근본적 귀인 오류","prof":true,"answer":false,"explainImg":"img/psy10-p6-slide.jpg"},{"id":"u10a-08","type":"mc","q":"지각한 친구를 보고는 '원래 게으른 애'라고 생각하면서, 자신이 지각했을 때는 '버스가 늦게 와서'라고 생각했다. 이 현상에 대한 설명으로 옳은 것은?","choices":["타인의 행동은 성향 귀인, 나의 행동은 상황 귀인 — 근본적 귀인 오류의 한 유형이다","타인의 행동은 상황 귀인, 나의 행동은 성향 귀인을 했다","집단주의 문화의 영향으로 모두 상황 귀인을 했다","인지 부조화를 줄이려고 태도를 바꾼 것이다"],"answer":0,"explain":"나 = 상황, 타인 = 성향. p.6 행동 주체에 따른 귀인 차이(🖍). (오답 ② 타인의 행동은 상황 귀인, 나의 행동은 성향 귀인을 했다: 반대로 연결했다.)","src":"10장 p.6","diff":2,"wiki":"근본적 귀인 오류","explainImg":"img/psy10-p6-slide.jpg"},{"id":"u10a-09","type":"mc","q":"귀인과 문화에 대한 설명으로 옳지 않은 것은?","choices":["서구권(개인주의)은 행동의 원인을 개인 특질에서 찾는 경향이 있다","중국·일본인은 상황의 위력에 더 민감하다","물고기 관찰 실험에서 미국인은 장면 전체를, 일본인은 물고기 자체의 속성을 주로 묘사했다","집단주의 문화권은 개인주의 문화권보다 동조가 강하게 나타나는 경향이 있다"],"answer":2,"explain":"개인주의 = 성향, 집단주의 = 상황. 반대 — **일본인 = 장면 전체**, **미국인 = 물고기 속성**(Chua et al., 2005). (오답 ① 서구권(개인주의)은 행동의 원인을 개인 특질에서 찾는 경향이 있다: 옳다.)","src":"10장 p.5","diff":2,"wiki":"귀인 이론","explainImg":"img/psy10-p5-slide.jpg"},{"id":"u10a-10","type":"cloze","q":"태도가 행위로 이어지려면 ___ 영향이 없고 태도가 ___ 이어야 한다. 사회적 압력 같은 상황 요인은 태도-행동 연계를 압도할 수 있다.","explain":"Glasman & Albarracin: 외부 영향이 없고 태도가 안정적일 때 태도 → 행위. 교수: 외부 압력이 태도를 '압도'.","src":"10장 p.8","wiki":"태도","answer":["외부","안정적"],"bank":["외부","안정적","내부","극단적","강렬"],"explainImg":"img/psy10-p8-slide.jpg"},{"id":"u10a-11","type":"sa","q":"작은 요청에 동의한 사람이 추후 더 큰 요청에도 응하도록 유도하는 설득 전략을 쓰시오.","answer":"문 안에 발 들여놓기","alts":["foot in the door","foot-in-the-door","문간에 발 들여놓기","문안에 발 들여놓기 기법","문 안에 발 들여놓기 기법"],"explain":"**문 안에 발 들여놓기(foot-in-the-door)**.","src":"10장 p.9","diff":1,"wiki":"문 안에 발 들여놓기","explainImg":"img/psy10-p9-slide.jpg"},{"id":"u10a-12","type":"sa","q":"태도와 행위가 일치하지 않을 때 느끼는 긴장으로, 이를 해소하려고 태도를 행위에 맞춰 바꾸게 만드는 것을 쓰시오.","answer":"인지 부조화","alts":["인지부조화","cognitive dissonance","인지적 부조화"],"explain":"**인지 부조화** — 6·25 중공군 포로 사례.","src":"10장 p.10","diff":1,"wiki":"인지 부조화","explainImg":"img/psy10-p10-slide.jpg"},{"id":"u10a-13","type":"tf","q":"인지 부조화를 줄이기 위해 사람들은 보통 행위를 태도에 맞춰 바꾼다.","explain":"아니다. 이미 한 행위는 되돌릴 수 없으니 **태도를 행위에 맞춘다**.","src":"10장 p.10","wiki":"인지 부조화","answer":false,"explainImg":"img/psy10-p10-slide.jpg"},{"id":"u10a-14","type":"mc","q":"행위가 먼저 일어나고 그에 맞춰 태도가 형성되는 사례가 **아닌** 것은?","choices":["문 안에 발 들여놓기","인지 부조화","단순 노출 효과","역할 놀이"],"answer":2,"explain":"행위 → 태도 = 문 안에 발 들여놓기 · 인지 부조화 · 역할 놀이. 반복 노출 → 호감(p.36) — 매력의 요인이지 행위 → 태도 사례로 제시되지 않았다. (오답 ① 문 안에 발 들여놓기: p.9 행위 → 태도.)","src":"10장 p.9–11","diff":2,"wiki":"태도","explainImg":"img/psy10-p10-slide.jpg"},{"id":"u10a-15","type":"sa","q":"평범한 대학생에게 간수·죄수 역할을 맡기자 폭압이 나타난 실험(짐바르도) — 명칭을 쓰시오.","answer":"스탠포드 감옥 실험","alts":["스탠퍼드 감옥 실험","Stanford prison experiment","스탠포드 교도소 실험"],"explain":"**스탠포드 감옥 실험** — 역할 놀이의 대표 사례 — 평범한 대학생에게 간수·죄수 역할을 맡기자 폭압이 나타난 실험 (교수: 짐바르도)","src":"10장 p.11","prof":true,"wiki":"역할 놀이","explainImg":"img/psy10-p11-slide.jpg"},{"id":"u10a-16","type":"mc","q":"행위가 태도를 만드는 가장 대표적이고 강력한 사례는?","choices":["애쉬의 동조 실험","역할 놀이 — 스탠포드 감옥 실험","밀그램의 복종 실험","카멜레온 효과"],"answer":1,"explain":"역할 놀이: 역할이 부여되면 그 역할에 맞는 행동을 수행하려 노력 — 단, 굴복하지 않는 사람도 있음. 교수: '자리가 사람을 만든다'(짐바르도, 영상 시청). (오답 ① 애쉬의 동조 실험: 동조(사회적 영향) 실험이다.)","src":"10장 p.11","diff":1,"prof":true,"wiki":"역할 놀이","explainImg":"img/psy10-p11-slide.jpg"}]},{"id":"u10b","title":"동조","intro":[{"title":"동조","body":"행동·생각을 **집단 기준**에 맞추는 것. 카멜레온 효과(하품 전염), 긍정적 군집(투표 인증), **베르테르 효과**(알려진 자살 뒤 자살률 급등). 집단주의 문화에서 더 강하다.","src":"10장 p.12–17"},{"title":"규범적 vs 정보적 사회 영향","body":"**규범적** = 인정받거나 배척을 피하려고(혼자 반대하면 미움받을까 봐). **정보적** = 정확하고 싶어서 남의 판단을 정보로(식당 리뷰).","src":"10장 p.15"},{"title":"애쉬의 동조 실험 (1955)","body":"기준 선분과 길이가 같은 비교 선분을 고르게 하면서, 다수가 틀린 답을 말할 때 그 오답을 따라가는지 보았다.","src":"10장 p.15","img":"img/psy10-p15-asch.png","imgAlt":"기준 선분·비교 선분 1~3과 실험 장면"},{"title":"동조가 쉬운 조건 7가지","body":"능력 없음·불확실 / 집단 **최소 3명** / **만장일치**(가장 큼) / 집단의 위상·매력 / 미리 반응을 정하지 않음 / **타인이 관찰**함 / 사회적 기준을 존중하는 문화.","src":"10장 p.16"}],"items":[{"id":"u10b-01","type":"sa","q":"사회적 압력에 순응 — 행동 혹은 생각을 **집단 기준에 맞추는** 것 — 명칭을 쓰시오.","answer":"동조","alts":["conformity","동조(conformity)"],"explain":"**동조 (conformity)** — 사회적 압력에 순응 — 행동 혹은 생각을 **집단 기준에 맞추는** 것","src":"10장 p.13, 15","wiki":"동조","explainImg":"img/psy10-p15-slide.jpg"},{"id":"u10b-02","type":"sa","q":"주변에 맞춰서 **행동을 같이하는** 현상 (하품이 전염되는 이유) — 차트랜드 & 바그(1999) — 명칭을 쓰시오.","answer":"카멜레온 효과","alts":["chameleon effect"],"explain":"**카멜레온 효과** — 주변에 맞춰서 **행동을 같이하는** 현상 (하품이 전염되는 이유) — 차트랜드 & 바그(1999)","src":"10장 p.13","wiki":"동조","explainImg":"img/psy10-p13-slide.jpg"},{"id":"u10b-03","type":"sa","q":"무언가에 대한 **긍정적 평가**가 끊임없이 다른 긍정적 평가로 이어지는 순환. 예: SNS 투표 인증 → 투표율 ↑ — 명칭을 쓰시오.","answer":"긍정적 군집","alts":["positive clustering"],"explain":"**긍정적 군집** — 무언가에 대한 **긍정적 평가**가 끊임없이 다른 긍정적 평가로 이어지는 순환. 예: SNS 투표 인증 → 투표율 ↑","src":"10장 p.14","wiki":"동조","explainImg":"img/psy10-p14-slide.jpg"},{"id":"u10b-04","type":"sa","q":"널리 알려진 자살 사건 뒤에 자살률이 급등하는 현상을 쓰시오.","answer":"베르테르 효과","alts":["werther effect","베르테르"],"explain":"**베르테르 효과** — 동조·사회적 전염의 부정적 요소.","src":"10장 p.14","diff":1,"wiki":"동조","explainImg":"img/psy10-p14-slide.jpg"},{"id":"u10b-05","type":"mc","q":"유명 연예인의 자살이 보도된 뒤 자살률이 급등하는 현상과 이것이 속하는 개념의 연결이 옳은 것은?","choices":["카멜레온 효과 — 복종의 부정적 요소","베르테르 효과 — 동조(사회적 전염)의 부정적 요소","긍정적 군집 — 동조의 부정적 요소","베르테르 효과 — 집단 극화"],"answer":1,"explain":"모방 범죄도 같은 줄기(Cooper; Porfiri). p.14. 교수: 동조의 '가장 극단적인 케이스'. (오답 ① 카멜레온 효과 — 복종의 부정적 요소: 카멜레온 효과는 행동을 따라 하는 현상이고, 복종이 아니다.)","src":"10장 p.14","diff":1,"wiki":"동조","explainImg":"img/psy10-p14-slide.jpg"},{"id":"u10b-06","type":"sa","q":"사회적 인정을 얻거나 배척을 피하기 위해 동조하게 만드는 영향을 쓰시오.","answer":"규범적 사회 영향","alts":["규범적 사회영향","normative social influence","규범적 영향"],"explain":"**규범적 사회 영향** — 반대: 정보적 사회 영향(정확성).","src":"10장 p.15","diff":1,"wiki":"규범적 사회 영향","explainImg":"img/psy10-p15-slide.jpg"},{"id":"u10b-07","type":"sa","q":"**정확성을 추구**하여 동조하는 것 — 남들의 판단을 정보로 사용. 예: 식당 리뷰 — 명칭을 쓰시오.","answer":"정보적 사회 영향","alts":["정보적 영향","informational social influence"],"explain":"**정보적 사회 영향** — **정확성을 추구**하여 동조하는 것 — 남들의 판단을 정보로 사용. 예: 식당 리뷰","src":"10장 p.15","wiki":"정보적 사회 영향","explainImg":"img/psy10-p15-slide.jpg"},{"id":"u10b-08","type":"mc","q":"처음 가 본 도시에서 어느 식당이 맛있는지 몰라 리뷰가 많은 집을 골랐다. 이 동조의 이유는?","choices":["규범적 사회 영향","사회적 태만","몰개인화","정보적 사회 영향"],"answer":3,"explain":"'남들이 더 잘 알 것 같아서' = 정보적, '튀기 싫어서' = 규범적. **정확성**을 추구해 남들의 판단을 정보로 사용(p.15 식당 리뷰 예). (오답 ① 규범적 사회 영향: 인정·배척 회피 때문 — 여기선 남의 시선이 아니라 정확한 판단이 목적.)","src":"10장 p.15","diff":1,"wiki":"정보적 사회 영향","explainImg":"img/psy10-p15-slide.jpg"},{"id":"u10b-09","type":"mc","q":"회의에서 팀장의 안이 틀렸다고 생각했지만, 혼자 반대하면 미움받을까 봐 찬성했다. 이 동조의 이유는?","choices":["규범적 사회 영향","정보적 사회 영향","사회적 촉진","호혜성 규범"],"answer":0,"explain":"다른 의견을 내면 대가를 치러야 하는 부담감(Culcutt et al.). 사회적 인정을 얻거나 **배척을 피하기** 위해(p.15). (오답 ② 정보적 사회 영향: 본인은 안이 틀렸다고 알고 있으니 정확성 추구가 아니다.)","src":"10장 p.15","diff":1,"wiki":"규범적 사회 영향","explainImg":"img/psy10-p15-slide.jpg"},{"id":"u10b-10","type":"sa","q":"기준 선분과 길이가 같은 비교 선분을 고르게 해 다수의 오답에 따라가는지 본 실험 (1955) — 명칭을 쓰시오.","answer":"애쉬의 동조 실험","alts":["애쉬 실험","애쉬의 선분 실험","Asch 동조 실험","애쉬 동조 실험"],"explain":"**애쉬의 동조 실험** — 기준 선분과 길이가 같은 비교 선분을 고르게 해 다수의 오답에 따라가는지 본 실험 (1955)","src":"10장 p.15","wiki":"애쉬의 동조 실험","explainImg":"img/psy10-p15-slide.jpg"},{"id":"u10b-11","type":"cloze","q":"애쉬: 동조가 쉬운 조건 — 집단이 최소 ___ 명 이상일 때, 집단이 ___ 일 때(가장 큰 조건), ___ 이 내 행동을 관찰함을 알 때","explain":"p.16 조건 7가지(교수: '잘 봐 두면 좋을 것'): 능력 없음·불확실 / 최소 3명 / 만장일치 / 집단의 위상·매력 / 미리 반응을 정하지 않음 / 타인이 관찰 / 사회적 기준 존중 문화.","src":"10장 p.16 🎙","wiki":"애쉬의 동조 실험","prof":true,"answer":["3","만장일치","타인"],"bank":["3","만장일치","타인","2","다수결","권위자"],"explainImg":"img/psy10-p16-slide.jpg"},{"id":"u10b-12","type":"mc","q":"애쉬(1955)가 제시한 동조가 발생하기 쉬운 조건으로 옳지 않은 것은?","choices":["자신이 능력이 없거나 불확실하다고 느낄 때","타인이 자신을 관찰한다는 것을 알 때","집단 구성원 중 한 명이라도 다른 의견을 낼 때","미리 어떤 반응을 할지 정하지 않았을 때"],"answer":2,"explain":"교수: '이 부분은 잘 봐 두면 좋을 것 같아요', 가장 큰 것 = 만장일치. 반대 — 집단이 **만장일치**일 때 동조가 쉽다. 한 명의 반대자는 동조를 줄인다. (오답 ① 자신이 능력이 없거나 불확실하다고 느낄 때: 조건 ①.)","src":"10장 p.16","diff":2,"prof":true,"wiki":"애쉬의 동조 실험","explainImg":"img/psy10-p16-slide.jpg"},{"id":"u10b-13","type":"mc","q":"애쉬가 제시한 동조가 쉬운 조건 중 **가장 큰 영향**을 주는 것은?","choices":["집단에 최소 3명 이상이 존재할 때","문화적으로 사회적 기준 존중을 요구할 때","집단이 만장일치일 때","명령자가 합법적 권위자로 지각될 때"],"answer":2,"explain":"동조 조건 7개(애쉬) vs 복종 요인 4개(밀그램)를 섞지 말 것. 교수: '가장 큰 게 … 집단이 만장일치일 때'. (오답 ① 집단에 최소 3명 이상이 존재할 때: 조건이지만 '가장 크다'고 하지 않았다.)","src":"10장 p.16","diff":2,"prof":true,"wiki":"애쉬의 동조 실험","explainImg":"img/psy10-p16-slide.jpg"},{"id":"u10b-14","type":"tf","q":"애쉬에 따르면 자신의 반응을 미리 공개적으로 정해 두었을 때 동조가 더 쉽게 일어난다.","explain":"조건은 반대로 **미리 반응을 정하지 않았을 때** 동조가 쉽다. 이미 공언한 사람은 입장을 덜 바꾼다.","src":"10장 p.16","wiki":"애쉬의 동조 실험","answer":false,"explainImg":"img/psy10-p16-slide.jpg"},{"id":"u10b-15","type":"tf","q":"집단주의 문화권에서는 개인주의 문화권보다 동조가 더 강하게 나타난다.","explain":"맞다. 집단주의 문화권에서 동조가 **강하게** 나타난다(Bond & Smith). 귀인도 집단주의 = 상황 쪽.","src":"10장 p.17","wiki":"동조","answer":true,"explainImg":"img/psy10-p17-slide.jpg"},{"id":"u10b-16","type":"match","q":"용어와 설명을 연결하시오","explain":"판별 요령: '따돌림이 무서워서' = 규범적, '남들이 더 잘 알 것 같아서·리뷰' = 정보적.","src":"10장 p.12–15","wiki":"동조","pairs":[["사회 규범","사회에서 기대·용납되는 행동 규칙"],["카멜레온 효과","주변에 맞춰 행동을 같이함(하품 전염)"],["베르테르 효과","알려진 자살 사건 뒤 자살률 급등"],["규범적 사회 영향","인정을 얻거나 배척을 피하려는 동조"],["정보적 사회 영향","정확성을 추구하는 동조"]],"explainImg":"img/psy10-p15-slide.jpg"},{"id":"u10b-17","type":"mc","q":"그림처럼 기준 선분과 같은 길이의 비교 선분(1~3)을 고르게 하는 실험이 확인한 것은?","explain":"**애쉬의 동조 실험**(1955): 정답이 뻔해도 다수의 오답에 따라가는지 본 것. 복종은 밀그램, 몰개인화(큰 모자)는 짐바르도.","src":"10장 p.15","wiki":"애쉬의 동조 실험","choices":["다수가 틀린 답을 말하면 그 오답을 따라가는가(동조)","권위자의 명령에 따라 전기 충격을 주는가(복종)","익명일 때 더 공격적이 되는가(몰개인화)","남이 지켜볼 때 수행이 좋아지는가(사회적 촉진)"],"answer":0,"img":"img/psy10-p15-asch.png","imgAlt":"기준 선분과 비교 선분 1·2·3, 실험 참가자들이 앉은 장면","explainImg":"img/psy10-p15-slide.jpg"}]},{"id":"u10c","title":"복종과 소수자 영향력","intro":[{"title":"밀그램의 복종 실험 (1963, 1974)","body":"옆방 학습자에게 **15V → 450V** 전기 충격을 주라고 지시 → 대부분이 마지막 단계까지 진행. 복종은 특질보다 **상황**에서 생긴다.","src":"10장 p.18","img":"img/psy10-p18-milgram.png","imgAlt":"충격 발생기, 학습자 결박 장면, 전압별 복종 비율 그래프"},{"title":"복종 요인 4가지","body":"명령자가 **가까이** 있고 **합법적 권위자**(특히 중요) / **저명한 기관**의 지지 / 희생자가 **멀리**·몰개성화 / 저항하는 역할 부재. 동조 = 집단 기준, 복종 = 명령.","src":"10장 p.19"},{"title":"교훈과 소수자 영향력","body":"동조·복종은 **작은 것**에서 시작한다(문 안에 발, 낮은 전압). **소수자 영향력**(모스코비치, 1985) = 일관된 소수가 다수를 바꾸는 힘(나치 경례 속 팔짱 낀 사람).","src":"10장 p.20–21"}],"items":[{"id":"u10c-01","type":"sa","q":"**명령에 따르기** — 비도덕적인 요구에 왜 따르는지에 대한 탐구에서 시작 — 명칭을 쓰시오.","answer":"복종","alts":
