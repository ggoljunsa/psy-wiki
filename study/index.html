해결될 때까지 한 문제에 쉬지 않고 매달리기</strong></p>\n<p>함양법 4 = 전문성 발달 · 부화시간 · 명상·산책 · 다른 문화 경험.</p>\n<ul>\n<li>① (정답) 해결될 때까지 한 문제에 쉬지 않고 매달리기: 반대다 — 계속 매달리면 좋은 해결책이 나오지 않으므로 <strong>부화시간</strong>을 두라고 한다.</li>\n<li>② (오답) 부화시간 갖기: 함양법 — 무의식적 처리로 연합 형성.</li>\n<li>③ (오답) 명상이나 산책 즐기기: 함양법 — 평온감으로 자발성 유지.</li>\n<li>④ (오답) 다른 문화와 사고 방식 경험하기: 함양법 — 다른 관점 취하기.</li>\n</ul>\n","src":"7장 p.19–20","diff":1,"prof":false},{"id":"q7016","ch":"ch7","type":"mc","q":"<p>p.21 인지과정 비교표에서 <strong>통찰</strong>의 단점은?</p>\n","choices":["오류의 위험성 높음","시간과 노력이 필요","지나치게 감정적일 수 있음","발생하지 않을 수 있음"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 발생하지 않을 수 있음</strong></p>\n<p>p.21 단점 칸: 알고리즘 시간·노력 / 발견법 오류 / 통찰 발생 안 할 수 있음 / 직관 감정적 / 틀만들기 오도 / 창의성 관례 작업 방해.</p>\n<ul>\n<li>① (오답) 오류의 위험성 높음: 발견법의 단점이다.</li>\n<li>② (오답) 시간과 노력이 필요: 알고리즘의 단점이다.</li>\n<li>③ (오답) 지나치게 감정적일 수 있음: 직관의 단점이다.</li>\n<li>④ (정답) 발생하지 않을 수 있음: 통찰은 즉각적 해결을 주지만 언제 일어날지 보장이 없다.</li>\n</ul>\n","src":"7장 p.21","diff":3,"prof":false},{"id":"q7017","ch":"ch7","type":"mc","q":"<p>p.22 표에서 <strong>과신</strong>의 장점으로 제시된 것은?</p>\n","choices":["지지 증거에 대한 신속한 재인","생각에 몰두","쉽고 행복한 결정","지속적인 신념을 지지"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 쉽고 행복한 결정</strong></p>\n<p>장점 칸도 객관식 함정이 된다.</p>\n<ul>\n<li>① (오답) 지지 증거에 대한 신속한 재인: 확증 편향의 장점이다.</li>\n<li>② (오답) 생각에 몰두: 고착의 장점이다.</li>\n<li>③ (정답) 쉽고 행복한 결정: 슬라이드 그대로.</li>\n<li>④ (오답) 지속적인 신념을 지지: 신념 집착의 장점이다.</li>\n</ul>\n","src":"7장 p.22","diff":3,"prof":false},{"id":"q7018","ch":"ch7","type":"mc","q":"<p>&#39;re- + read + -ing&#39;처럼 <strong>의미를 구성하는 최소 단위</strong>는?</p>\n","choices":["음소","통사론","의미론","형태소"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 형태소</strong></p>\n<p>음소 = 소리 단위, 형태소 = 의미 단위, 문법 = 규칙(의미론 + 통사론).</p>\n<ul>\n<li>① (오답) 음소: 소리를 구분하는 최소 단위다.</li>\n<li>② (오답) 통사론: 단어 배열로 문장을 구성하는 규칙이다.</li>\n<li>③ (오답) 의미론: 소리에서 의미를 도출하는 <strong>규칙</strong>이지 단위가 아니다.</li>\n<li>④ (정답) 형태소: 의미의 최소 단위 = 형태소(Morpheme).</li>\n</ul>\n","src":"7장 p.24","diff":1,"prof":false},{"id":"q7019","ch":"ch7","type":"mc","q":"<p>촘스키의 <strong>보편 문법</strong>에 대한 설명으로 옳은 것은?</p>\n","choices":["구체적인 문법 구조 자체를 생득적으로 타고난다","문법 구조 자체가 아니라 그것을 학습할 수 있는 소양을 타고난다","실제 세상의 언어들은 구조적 다양성이 거의 없다","언어는 사고를 결정한다는 입장이다"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 문법 구조 자체가 아니라 그것을 학습할 수 있는 소양을 타고난다</strong></p>\n<p>보편 문법 = 공통 통사 규칙(명사·형용사·동사) + 학습 소양 생득.</p>\n<ul>\n<li>① (오답) 구체적인 문법 구조 자체를 생득적으로 타고난다: 슬라이드가 명시적으로 부정한 내용이다.</li>\n<li>② (정답) 문법 구조 자체가 아니라 그것을 학습할 수 있는 소양을 타고난다: 슬라이드 그대로 — 교수 예: 지리적으로 먼 핀란드어와 한국어의 문법 유사성.</li>\n<li>③ (오답) 실제 세상의 언어들은 구조적 다양성이 거의 없다: 반대 — 비판(Bergen)은 실제 언어가 <strong>더 다양</strong>하다는 것.</li>\n<li>④ (오답) 언어는 사고를 결정한다는 입장이다: 언어결정론(사피어-워프)이다.</li>\n</ul>\n","src":"7장 p.25 🎙","diff":2,"prof":true},{"id":"q7020","ch":"ch7","type":"mc","q":"<p>표현성 언어의 발달 단계에 대한 설명으로 옳은 것은?</p>\n","choices":["옹알이는 어른의 말소리를 모방한 것이다","표현성 언어가 수용성 언어보다 먼저 발달한다","두 단어 단계는 주로 명사 + 명사 조합이다","옹알이(약 4개월) → 한 단어(약 12개월) → 두 단어(약 24개월) 순이다"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 옹알이(약 4개월) → 한 단어(약 12개월) → 두 단어(약 24개월) 순이다</strong></p>\n<p>4 · 12 · 24개월, 모방 아님, 명사+동사.</p>\n<ul>\n<li>① (오답) 옹알이는 어른의 말소리를 모방한 것이다: 옹알이는 언어와 무관한 소리로 <strong>모방이 아니다</strong>.</li>\n<li>② (오답) 표현성 언어가 수용성 언어보다 먼저 발달한다: 수용성(이해)이 먼저다.</li>\n<li>③ (오답) 두 단어 단계는 주로 명사 + 명사 조합이다: 슬라이드는 <strong>명사 + 동사</strong>(녹음 전사의 &#39;명사 플러스 명사&#39;는 채택하지 않음).</li>\n<li>④ (정답) 옹알이(약 4개월) → 한 단어(약 12개월) → 두 단어(약 24개월) 순이다: 슬라이드의 시기·순서 그대로.</li>\n</ul>\n","src":"7장 p.26–27","diff":2,"prof":false},{"id":"q7021","ch":"ch7","type":"mc","q":"<p>한국에서 태어나 잠깐 한국어에 노출된 뒤 미국으로 입양된 아이는 나중에 한국어를 훨씬 수월하게 배운다. 반면 성인이 되어 배운 외국어에는 모국어 억양이 섞인다. 관련 개념은?</p>\n","choices":["수용성 언어","결정적 시기","보편 문법","언어상대성"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 결정적 시기</strong></p>\n<p>교수 예: 해외 입양아, 러시아·독일식 영어 억양, 영어 유치원 과열.</p>\n<ul>\n<li>① (오답) 수용성 언어: 말을 이해하는 초기 발달 단계로, 학습 시기 효과의 개념이 아니다.</li>\n<li>② (정답) 결정적 시기: 언어 학습 효율이 가장 좋은 기간(대략 7세까지), 신경 가소성과 밀접.</li>\n<li>③ (오답) 보편 문법: 언어 공통 규칙과 학습 소양에 관한 입장이다.</li>\n<li>④ (오답) 언어상대성: 언어가 사고에 영향을 준다는 입장이다.</li>\n</ul>\n","src":"7장 p.28 🎙","diff":1,"prof":true},{"id":"q7022","ch":"ch7","type":"mc","q":"<p>교수가 「중요한 거는」이라며 강조한 <strong>브로카 실어증</strong>의 가장 큰 특징은?</p>\n","choices":["말은 유창하지만 내용이 와해된다","우반구 손상으로 발생한다","문장이 끊기고 어눌하지만 하고 싶은 말·이해에는 큰 어려움이 없다","말소리를 입술 모양으로 구분하지 못한다"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 문장이 끊기고 어눌하지만 하고 싶은 말·이해에는 큰 어려움이 없다</strong></p>\n<p>브로카 = 표현(산출), 베르니케 = 이해.</p>\n<ul>\n<li>① (오답) 말은 유창하지만 내용이 와해된다: 베르니케 실어증의 특징이다.</li>\n<li>② (오답) 우반구 손상으로 발생한다: 브로카·베르니케 모두 <strong>좌반구</strong>다.</li>\n<li>③ (정답) 문장이 끊기고 어눌하지만 하고 싶은 말·이해에는 큰 어려움이 없다: 교수 강조(01:32:44) — 산출 장애이지 이해 장애가 아니다.</li>\n<li>④ (오답) 말소리를 입술 모양으로 구분하지 못한다: 실어증과 무관한 수용성 언어 발달 내용이다.</li>\n</ul>\n","src":"7장 p.29 🎙","diff":2,"prof":true},{"id":"q7023","ch":"ch7","type":"mc","q":"<p>소설 『1984』에서 구세계 단어를 지우고 신어(Newspeak)만 쓰게 해 &#39;불순한 생각&#39;을 막으려 한 발상과 가장 가까운 입장은?</p>\n","choices":["언어상대성","언어결정론","보편 문법","범주화 지각"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 언어결정론</strong></p>\n<p>비판: 말로 표현할 수 없어도 떠오르는 생각이 있다.</p>\n<ul>\n<li>① (오답) 언어상대성: 언어가 사고에 &#39;영향&#39;만 준다는 약화판 — 단어 삭제로 생각 자체를 막는다는 발상보다 약하다.</li>\n<li>② (정답) 언어결정론: 언어 자체가 생각을 <strong>결정</strong>한다 — 교수가 든 예(사피어-워프 가설).</li>\n<li>③ (오답) 보편 문법: 언어 공통 규칙에 관한 입장이다.</li>\n<li>④ (오답) 범주화 지각: 입력을 범주로 나누는 지각 편향이다.</li>\n</ul>\n","src":"7장 p.30 🎙","diff":1,"prof":true},{"id":"q7024","ch":"ch7","type":"mc","q":"<p>다음 중 &#39;언어가 사고·지각에 <strong>영향</strong>을 준다(언어상대성)&#39;의 근거로 슬라이드가 든 것이 <strong>아닌</strong> 것은?</p>\n","choices":["영어는 자기중심 정서, 일본어는 대인관계 정서 어휘가 더 많다","이중언어 화자는 사용 언어에 따라 자기 개념이 다르다","핀란드어와 한국어의 문법이 비슷하다","러시아어 사용자는 두 종류의 파랑을 더 빨리 구별한다"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 핀란드어와 한국어의 문법이 비슷하다</strong></p>\n<p>p.30–31 근거들 vs p.25 보편 문법 예를 구분.</p>\n<ul>\n<li>① (오답) 영어는 자기중심 정서, 일본어는 대인관계 정서 어휘가 더 많다: 언어상대성 근거(Markus &amp; Kitayama).</li>\n<li>② (오답) 이중언어 화자는 사용 언어에 따라 자기 개념이 다르다: 언어상대성 근거(Pavlenko).</li>\n<li>③ (정답) 핀란드어와 한국어의 문법이 비슷하다: 이것은 교수가 <strong>보편 문법</strong>을 설명하며 든 예다.</li>\n<li>④ (오답) 러시아어 사용자는 두 종류의 파랑을 더 빨리 구별한다: 언어와 지각 근거(p.31).</li>\n</ul>\n","src":"7장 p.25, 30–31","diff":3,"prof":false},{"id":"q7025","ch":"ch7","type":"mc","q":"<p><strong>서스톤</strong>에 대한 이 강의의 설명으로 옳은 것은?</p>\n","choices":["지능을 7가지 1차 심적 능력으로 나누었으나 능력 간 정적 상관이 나타나 g의 영향력을 인정하는 중간 입장이다","지능은 서로 독립적인 8개 영역으로 이루어진다","모든 지적 행동은 단일 능력 g에서 비롯된다","지능은 분석·창의성·현실 지능으로 나뉜다"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 지능을 7가지 1차 심적 능력으로 나누었으나 능력 간 정적 상관이 나타나 g의 영향력을 인정하는 중간 입장이다</strong></p>\n<p>서스톤 = 7 + 상관 → g 인정(중간), 가드너 = 8 + 독립.</p>\n<ul>\n<li>① (정답) 지능을 7가지 1차 심적 능력으로 나누었으나 능력 간 정적 상관이 나타나 g의 영향력을 인정하는 중간 입장이다: 교수가 반복한 정리(「살짝 중간적인 위치」) — 슬라이드 기준 답.</li>\n<li>② (오답) 지능은 서로 독립적인 8개 영역으로 이루어진다: 가드너의 다중 지능이다.</li>\n<li>③ (오답) 모든 지적 행동은 단일 능력 g에서 비롯된다: 스피어만의 일반 지능이다.</li>\n<li>④ (오답) 지능은 분석·창의성·현실 지능으로 나뉜다: 스턴버그의 삼원 이론이다.</li>\n</ul>\n","src":"7장 p.33–34 🎙","diff":2,"prof":true},{"id":"q7026","ch":"ch7","type":"mc","q":"<p>지능 검사 점수와 언어 능력에는 제한이 있지만 수학·예술 등 특정 영역에서 굉장히 뛰어난 사례(현자 증후군)는 어떤 이론의 근거로 쓰이는가?</p>\n","choices":["스피어만의 일반 지능","가드너의 다중 지능 이론","서스톤의 1차 심적 능력","정서 지능"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 가드너의 다중 지능 이론</strong></p>\n<p>현자 증후군 = 가드너 p.34, 자폐 스펙트럼과 동반 많음.</p>\n<ul>\n<li>① (오답) 스피어만의 일반 지능: 단일 g라면 특정 영역만 뛰어난 현상을 설명하기 어렵다.</li>\n<li>② (정답) 가드너의 다중 지능 이론: 한 영역이 낮아도 다른 영역은 높을 수 있다 → 영역들이 독립적.</li>\n<li>③ (오답) 서스톤의 1차 심적 능력: 서스톤은 능력 간 상관을 인정하는 중간 입장이며, 슬라이드는 현자 증후군을 가드너 쪽에 둔다.</li>\n<li>④ (오답) 정서 지능: 정서를 지각·이해·관리·사용하는 능력이다.</li>\n</ul>\n","src":"7장 p.34","diff":2,"prof":false},{"id":"q7027","ch":"ch7","type":"mc","q":"<p>p.39 지능 이론 비교표에서 &#39;<strong>모든 능력을 지능이라 칭할 필요는 없다</strong>&#39;는 비판을 받는 이론은?</p>\n","choices":["삼원 이론 (스턴버그)","정서 지능","다중 지능 이론 (가드너)","일반 지능 (스피어만)"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 다중 지능 이론 (가드너)</strong></p>\n<p>교수가 두 번 정리한 5입장 표 — 비판 칸까지 짝지을 것.</p>\n<ul>\n<li>① (오답) 삼원 이론 (스턴버그): 비판은 &#39;세 영역이 실제로는 독립적이지 않을 수 있다&#39;.</li>\n<li>② (오답) 정서 지능: 비판은 &#39;지능 개념이 과하게 확대될 수 있다&#39;.</li>\n<li>③ (정답) 다중 지능 이론 (가드너): 8개 영역을 모두 &#39;지능&#39;이라 부르는 것에 대한 비판.</li>\n<li>④ (오답) 일반 지능 (스피어만): 비판은 &#39;지능을 단일 지표로 묶을 수 없다&#39;.</li>\n</ul>\n","src":"7장 p.39 🎙","diff":3,"prof":true},{"id":"q7028","ch":"ch7","type":"mc","q":"<p>지능 이론과 숫자의 연결이 옳지 <strong>않은</strong> 것은?</p>\n","choices":["스피어만 — 단일 지표 g","서스톤 — 7가지 1차 심적 능력","가드너 — 8개 독립 영역","정서 지능 — 3가지 성분"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 정서 지능 — 3가지 성분</strong></p>\n<p>1(스피어만) · 3(스턴버그) · 4(정서) · 7(서스톤) · 8(가드너).</p>\n<ul>\n<li>① (오답) 스피어만 — 단일 지표 g: 옳다.</li>\n<li>② (오답) 서스톤 — 7가지 1차 심적 능력: 옳다.</li>\n<li>③ (오답) 가드너 — 8개 독립 영역: 옳다.</li>\n<li>④ (정답) 정서 지능 — 3가지 성분: 정서 지능은 <strong>4가지</strong> 성분(지각·이해·관리·사용). 3은 스턴버그 삼원 이론.</li>\n</ul>\n","src":"7장 p.39 🎙","diff":2,"prof":true},{"id":"q7029","ch":"ch7","type":"mc","q":"<p>정서 지능의 4가지 성분에 해당하지 <strong>않는</strong> 것은?</p>\n","choices":["정서 억제","정서 지각","정서 이해","정서 사용"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 정서 억제</strong></p>\n<p>지·이·관·사 = 지각·이해·관리·사용.</p>\n<ul>\n<li>① (정답) 정서 억제: 4성분에 없다.</li>\n<li>② (오답) 정서 지각: 성분 — 외부 요인에서 정서를 재인.</li>\n<li>③ (오답) 정서 이해: 성분 — 정서를 예측하고 변화·완화하는 방법 모색.</li>\n<li>④ (오답) 정서 사용: 성분 — 적응적·창의적 사고를 촉진하려 정서 활용.</li>\n</ul>\n","src":"7장 p.37","diff":1,"prof":false},{"id":"q7030","ch":"ch7","type":"mc","q":"<p>교수가 &#39;여러분이 저번에 쳤던 <strong>중간고사</strong>&#39;를 예로 든 검사 유형은?</p>\n","choices":["적성 검사","성취 검사","지능 검사","표준화 검사"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 성취 검사</strong></p>\n<p>성취 = 과거, 적성 = 미래.</p>\n<ul>\n<li>① (오답) 적성 검사: 미래 성취를 예측하는 검사다.</li>\n<li>② (정답) 성취 검사: 이미 학습한 내용을 평가 — 과거.</li>\n<li>③ (오답) 지능 검사: 심적 적성을 평가하는 도구다.</li>\n<li>④ (오답) 표준화 검사: 표준화는 검사 제작 원리이지 검사 유형 분류(p.40)가 아니다.</li>\n</ul>\n","src":"7장 p.40 🎙","diff":1,"prof":true},{"id":"q7031","ch":"ch7","type":"mc","q":"<p><strong>비네</strong>의 지능 검사에 대한 설명으로 옳은 것은?</p>\n","choices":["생득적 지능을 측정할 수 있다고 가정했다","근력·신체 비율·반응 시간으로 지능을 측정했다","정신 연령을 측정해 아동의 학업 성취를 예측하려 했고, 생득적 지능 측정을 목표로 하지 않았다","IQ = 정신 연령 ÷ 생활 연령 × 100 공식을 제안했다"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 정신 연령을 측정해 아동의 학업 성취를 예측하려 했고, 생득적 지능 측정을 목표로 하지 않았다</strong></p>\n<p>골턴(신체, 실패) → 비네(정신 연령) → 터먼(스탠퍼드-비네, 생득) → 스턴(IQ 공식) → 웩슬러(WAIS).</p>\n<ul>\n<li>① (오답) 생득적 지능을 측정할 수 있다고 가정했다: <strong>터먼</strong>(스탠퍼드-비네)의 가정 — 비네와 정반대.</li>\n<li>② (오답) 근력·신체 비율·반응 시간으로 지능을 측정했다: <strong>골턴</strong>이다.</li>\n<li>③ (정답) 정신 연령을 측정해 아동의 학업 성취를 예측하려 했고, 생득적 지능 측정을 목표로 하지 않았다: 슬라이드 그대로(프랑스 의무 교육 배경).</li>\n<li>④ (오답) IQ = 정신 연령 ÷ 생활 연령 × 100 공식을 제안했다: <strong>윌리엄 스턴</strong>이다.</li>\n</ul>\n","src":"7장 p.41–42","diff":2,"prof":false},{"id":"q7032","ch":"ch7","type":"mc","q":"<p>생활 연령 8세인 아동이 10세 수준의 수행을 보였다. 스턴의 공식으로 계산한 IQ는?</p>\n","choices":["125","80","100","120"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 125</strong></p>\n<p>IQ = 정신 연령 ÷ 생활 연령 × 100.</p>\n<ul>\n<li>① (정답) 125: <span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"katex-base\"><span class=\"katex-strut\" style=\"height:1.1901em;vertical-align:-0.345em;\"></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8451em;\"><span style=\"top:-2.655em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"katex-sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mtight\">8</span></span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.394em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"katex-sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mtight\">10</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.345em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"katex-base\"><span class=\"katex-strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">100</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"katex-base\"><span class=\"katex-strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">125</span></span></span></span>.</li>\n<li>② (오답) 80: 생활 연령/정신 연령으로 뒤집어 계산한 값(<span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"katex-base\"><span class=\"katex-strut\" style=\"height:1.1901em;vertical-align:-0.345em;\"></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8451em;\"><span style=\"top:-2.655em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"katex-sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mtight\">10</span></span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.394em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"katex-sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mtight\">8</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.345em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"katex-base\"><span class=\"katex-strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">100</span></span></span></span>)이다.</li>\n<li>③ (오답) 100: 정신 연령 = 생활 연령일 때의 값이다.</li>\n<li>④ (오답) 120: 계산 오류 — 10/8 = 1.25.</li>\n</ul>\n","src":"7장 p.42","diff":1,"prof":false},{"id":"q7033","ch":"ch7","type":"mc","q":"<p>교수가 표준화 과정에서 「<strong>가장 중요하게</strong> 여긴다」고 말한 것은?</p>\n","choices":["문항을 가능한 한 어렵게 만드는 것","검사 시간을 최대한 줄이는 것","짝수 문항과 홀수 문항 점수를 비교하는 것","충분한 표본 수를 모아 사전 테스트를 했는가"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 충분한 표본 수를 모아 사전 테스트를 했는가</strong></p>\n<p>표준화 = 표준화 집단과 비교, 정규곡선, 중심극한정리(표본이 클수록 정규분포).</p>\n<ul>\n<li>① (오답) 문항을 가능한 한 어렵게 만드는 것: 슬라이드·녹음 어디에도 없다.</li>\n<li>② (오답) 검사 시간을 최대한 줄이는 것: 언급되지 않았다.</li>\n<li>③ (오답) 짝수 문항과 홀수 문항 점수를 비교하는 것: 반분 <strong>신뢰도</strong>의 방법이다.</li>\n<li>④ (정답) 충분한 표본 수를 모아 사전 테스트를 했는가: 교수 발언(02:04:33) — 치매 판별 도구는 최소 300명.</li>\n</ul>\n","src":"7장 p.44–45 🎙","diff":2,"prof":true},{"id":"q7034","ch":"ch7","type":"mc","q":"<p>검사를 반으로 나누어 <strong>짝수 문항과 홀수 문항</strong>의 점수가 일치하는지 확인하는 것은?</p>\n","choices":["검사-재검사 신뢰도","반분 신뢰도","예측 타당도","표준화"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 반분 신뢰도</strong></p>\n<p>신뢰도 2종 = 검사-재검사 + 반분 — 교수: 「두 가지가 모두 갖춰져야」.</p>\n<ul>\n<li>① (오답) 검사-재검사 신뢰도: 같은 검사를 <strong>반복</strong> 실시해 비교한다.</li>\n<li>② (정답) 반분 신뢰도: split-half reliability.</li>\n<li>③ (오답) 예측 타당도: 점수와 기준 행동의 상관이다.</li>\n<li>④ (오답) 표준화: 표준화 집단과 비교해 점수의 의미를 정하는 것이다.</li>\n</ul>\n","src":"7장 p.46","diff":1,"prof":false},{"id":"q7035","ch":"ch7","type":"mc","q":"<p>운동 능력 검사를 운동과 전혀 무관한 문항으로 만들었는데, 같은 사람에게 여러 번 실시해도 점수가 매번 비슷했다. 이 검사는?</p>\n","choices":["타당도는 높지만 신뢰도는 낮다","신뢰도는 높지만 타당도는 낮다","신뢰도와 타당도가 모두 높다","신뢰도와 타당도가 모두 낮다"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 신뢰도는 높지만 타당도는 낮다</strong></p>\n<p>신뢰도와 타당도는 별개 — 둘 다 갖춰야 공인 검사.</p>\n<ul>\n<li>① (오답) 타당도는 높지만 신뢰도는 낮다: 반대로 말했다.</li>\n<li>② (정답) 신뢰도는 높지만 타당도는 낮다: 점수는 일관(신뢰도↑)하지만 재려던 것을 재지 못한다(타당도↓) — 교수 예.</li>\n<li>③ (오답) 신뢰도와 타당도가 모두 높다: 무관한 문항이므로 타당하지 않다.</li>\n<li>④ (오답) 신뢰도와 타당도가 모두 낮다: 반복 점수가 일관되므로 신뢰도는 높다.</li>\n</ul>\n","src":"7장 p.47 🎙","diff":2,"prof":true},{"id":"q7036","ch":"ch7","type":"mc","q":"<p>연구자가 자기 가설을 <strong>지지하는 논문만</strong> 골라 검색하고 반대 결과를 낸 논문은 찾아보지도 않는다. 가장 직접적인 개념은?</p>\n","choices":["확증 편향","신념 집착","과신","고착"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 확증 편향</strong></p>\n<p>시점으로 구분: 찾는 단계 = 확증 편향, 반박 후 = 신념 집착.</p>\n<ul>\n<li>① (정답) 확증 편향: 증거를 <strong>찾는 단계</strong>에서 지지 증거만 선택적으로 수집.</li>\n<li>② (오답) 신념 집착: 신념이 <strong>반박된 뒤에도</strong> 유지하는 것 — 여기서는 반박을 접하기 전 단계다.</li>\n<li>③ (오답) 과신: 자기 판단 정확성의 과대 추정이다.</li>\n<li>④ (오답) 고착: 새로운 각도에서 문제를 보지 못하는 것으로, 증거 선택의 문제가 아니다.</li>\n</ul>\n","src":"7장 p.5, 11, 22","diff":3,"prof":false},{"id":"q7037","ch":"ch7","type":"sa","q":"<p>p.21 표에서 &#39;<strong>빠르고 자동적인 감정과 사고</strong>&#39;로 정의되며, 적용 범위가 방대하고 적응적이지만 지나치게 감정적일 수 있는 것의 명칭을 쓰시오.</p>\n","choices":[],"answer":"직관","alts":["intuition","직관(intuition)"],"answerHtml":"직관","solution":"<p>p.21 표에만 독립 항목으로 등장하는 <strong>직관</strong>. 알고리즘·발견법·통찰과 함께 &#39;정확 vs 효율&#39; 축에 놓인다.</p>\n","src":"7장 p.21","diff":2,"prof":false},{"id":"q7038","ch":"ch7","type":"sa","q":"<p>문제의 해결책을 <strong>갑작스레 깨닫는</strong> &#39;아하!&#39; 경험을 무엇이라 하는가?</p>\n","choices":[],"answer":"통찰","alts":["insight","통찰(insight)"],"answerHtml":"통찰","solution":"<p><strong>통찰</strong> — 직전 전두엽, 직후 우반구 측두엽 활동 증가(Kounios &amp; Beeman). 단점: 발생하지 않을 수 있음.</p>\n","src":"7장 p.5","diff":1,"prof":false},{"id":"q7039","ch":"ch7","type":"sa","q":"<p>효율을 추구해 직관적 지름길로 생각하는 인간의 특성으로, 대표성·가용성 발견법의 공통 뿌리로 제시된 명칭을 쓰시오.</p>\n","choices":[],"answer":"인지적 구두쇠","alts":["cognitive miser","인지적구두쇠"],"answerHtml":"인지적 구두쇠","solution":"<p><strong>인지적 구두쇠(Cognitive Miser)</strong> — 교수: 「여러 번 이제 소개를 했듯이」.</p>\n","src":"7장 p.9 🎙","diff":2,"prof":true},{"id":"q7040","ch":"ch7","type":"sa","q":"<p>자기 생각의 토대가 잘못되었음이 판명되어도 그 생각에 매달리는 경향을 쓰시오.</p>\n","choices":[],"answer":"신념 집착","alts":["belief perseverance","신념집착"],"answerHtml":"신념 집착","solution":"<p><strong>신념 집착</strong> — 대처는 반대편 주장 고려(Catapano). 교수: 확증 편향과 거의 같음.</p>\n","src":"7장 p.11","diff":1,"prof":true},{"id":"q7041","ch":"ch7","type":"sa","q":"<p>틀만들기로 마음 갖춤새를 형성해 사람들이 특정 방향으로 선택하도록 <strong>유도</strong>하는 것을 무엇을 가한다고 하는가?</p>\n","choices":[],"answer":"넛지","alts":["nudge","넛지(nudge)"],"answerHtml":"넛지","solution":"<p><strong>넛지(Nudge)</strong> — 장기 기증 기본값, 작은 술잔 등.</p>\n","src":"7장 p.12","diff":2,"prof":false},{"id":"q7042","ch":"ch7","type":"sa","q":"<p>한 문제에 계속 매달리지 말고 잠시 시간을 두어 <strong>무의식적 처리</strong>가 연합을 형성하게 하라는 창의성 함양법의 명칭을 쓰시오.</p>\n","choices":[],"answer":"부화시간","alts":["부화 시간","incubation","부화기"],"answerHtml":"부화시간","solution":"<p><strong>부화시간(incubation)</strong> — 교수: 고착 방지, 하룻밤 자고 레포트 다시 보기.</p>\n","src":"7장 p.19 🎙","diff":1,"prof":true},{"id":"q7043","ch":"ch7","type":"sa","q":"<p>문법 중 단어의 <strong>배열</strong>로 문장을 구성하는 규칙을 쓰시오.</p>\n","choices":[],"answer":"통사론","alts":["syntax","통사"],"answerHtml":"통사론","solution":"<p><strong>통사론(syntax)</strong> — 소리에서 의미를 도출하는 규칙은 의미론(semantics).</p>\n","src":"7장 p.24","diff":1,"prof":false},{"id":"q7044","ch":"ch7","type":"sa","q":"<p><strong>제한된 기호의 조합</strong>으로 <strong>무한한 메시지</strong>를 생성할 수 있는 언어의 특성을 쓰시오.</p>\n","choices":[],"answer":"언어의 생산성","alts":["generativity","생성성","생산성"],"answerHtml":"언어의 생산성","solution":"<p><strong>언어의 생산성(generativity)</strong> — 한국어 자음 19 + 모음 21로 무한한 문장.</p>\n","src":"7장 p.24","diff":2,"prof":false},{"id":"q7045","ch":"ch7","type":"sa","q":"<p>말은 못 하지만 말소리의 차이를 재인하고 입술 모양으로 소리를 구분하는, <strong>말한 것을 이해</strong>하는 능력이 발달하는 초기 단계를 쓰시오.</p>\n","choices":[],"answer":"수용성 언어","alts":["receptive language","수용성언어","수용 언어"],"answerHtml":"수용성 언어","solution":"<p><strong>수용성 언어</strong> — 표현성 언어보다 먼저 발달. 교수: 4장 맥거크 효과와 연결.</p>\n","src":"7장 p.26 🎙","diff":2,"prof":true},{"id":"q7046","ch":"ch7","type":"sa","q":"<p>손상되면 발화는 유창하지만 <strong>내용이 와해</strong>되는(예: &#39;밥이 학교를 지나가니까…&#39;), 언어 이해를 담당하는 영역을 쓰시오.</p>\n","choices":[],"answer":"베르니케 영역","alts":["베르니케","wernicke","wernicke's area","베르니케영역"],"answerHtml":"베르니케 영역","solution":"<p><strong>베르니케 영역</strong> — 좌반구 측두엽. 브로카(산출)와 대비.</p>\n","src":"7장 p.29","diff":1,"prof":true},{"id":"q7047","ch":"ch7","type":"sa","q":"<p>지능 검사·언어 능력에는 제한이 있으나 특정 영역에서 굉장히 뛰어난 능력을 보이는 현상을 쓰시오.</p>\n","choices":[],"answer":"현자 증후군","alts":["서번트 증후군","savant syndrome","현자증후군","서번트증후군"],"answerHtml":"현자 증후군","solution":"<p><strong>현자 증후군(savant syndrome)</strong> — 가드너 다중 지능의 근거, 자폐 스펙트럼 동반 많음.</p>\n","src":"7장 p.34","diff":1,"prof":false},{"id":"q7048","ch":"ch7","type":"sa","q":"<p>비네가 점수가 낮은 아동을 위해 주의·자기훈련 능력을 발달시키도록 권장한 것을 쓰시오.</p>\n","choices":[],"answer":"심적 정형술","alts":["mental orthopedics","심적정형술"],"answerHtml":"심적 정형술","solution":"<p><strong>심적 정형술</strong> — 비네는 생득 지능 측정이 아니라 도움이 필요한 아동 선별·지원을 목표로 했다.</p>\n","src":"7장 p.41","diff":2,"prof":false},{"id":"q7049","ch":"ch7","type":"sa","q":"<p>검사 점수와 <strong>기준 행동</strong> 사이의 상관을 계산해, 점수가 실제 행동을 예측할 수 있는지 보는 타당도의 종류를 쓰시오.</p>\n","choices":[],"answer":"예측 타당도","alts":["predictive validity","예측타당도"],"answerHtml":"예측 타당도","solution":"<p><strong>예측 타당도</strong> — 타당도의 하위 유형(신뢰도 하위 = 검사-재검사·반분).</p>\n","src":"7장 p.47","diff":2,"prof":false},{"id":"q7050","ch":"ch7","type":"sa","q":"<p>사회 상황을 이해하고 자신을 공적으로 관리하는 노하우인 <strong>사회 지능</strong>을 제안한 학자(1920)를 쓰시오.</p>\n","choices":[],"answer":"손다이크","alts":["thorndike","손다이크(thorndike)"],"answerHtml":"손다이크","solution":"<p><strong>손다이크(1920)</strong> — 정서 지능은 사회 지능의 일환. 교수는 이름을 언급하지 않았지만 슬라이드에 있다.</p>\n","src":"7장 p.37","diff":2,"prof":false},{"id":"q7051","ch":"ch7","type":"sa","q":"<p>사전에 검사를 받은 집단의 수행과 개인의 수행을 비교해 점수의 의미를 정의하는, 검사 개발의 필수 요인을 쓰시오.</p>\n","choices":[],"answer":"표준화","alts":["standardization","표준화(standardization)"],"answerHtml":"표준화","solution":"<p><strong>표준화</strong> — 교수: 충분한 표본 수가 가장 중요(최소 300명 사례), K-검사도 재표준화.</p>\n","src":"7장 p.44 🎙","diff":1,"prof":true},{"id":"q8001","ch":"ch8","type":"mc","q":"<p>교수가 &#39;슬라이드 문장 그대로 한 줄 요약&#39;이라고 강조한 정의 — &#39;행동의 실현을 수반하거나 그 <strong>방향성</strong>을 설정해 주는 욕구&#39;는?</p>\n","choices":["정서","동기","추동","유인자극"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 동기</strong></p>\n<p>동기 = 행동의 실현·방향성을 정하는 욕구. 교수: 생물·심리·환경으로 설명되는 광범위한 개념.</p>\n<ul>\n<li>① (오답) 정서: 정서는 동기와 함께 다루지만 이 정의의 대상이 아니다.</li>\n<li>② (정답) 동기: p.2 동기의 정의.</li>\n<li>③ (오답) 추동: 추동은 &#39;생리적 욕구 충족 행동을 동기화하는 <strong>긴장 상태</strong>&#39;다.</li>\n<li>④ (오답) 유인자극: 행동을 끌어내는 환경의 긍정/부정 자극이다.</li>\n</ul>\n","src":"8장 p.2 🎙","diff":1,"prof":true},{"id":"q8002","ch":"ch8","type":"mc","q":"<p>신생아가 손바닥에 쥐여 준 것을 꼭 쥐고, 뺨에 닿으면 그쪽으로 고개를 돌린다. 교수가 이 예로 설명한 개념은?</p>\n","choices":["추동","유인자극","외재적 동기","본능"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 본능</strong></p>\n<p>교수 해석: 시각이 미숙한 신생아가 닿은 것(부모)을 놓지 않는 것이 생존에 유리 → 진화적으로 전해짐.</p>\n<ul>\n<li>① (오답) 추동: 생리적 욕구가 만든 긴장 상태다.</li>\n<li>② (오답) 유인자극: 행동을 끌어내는 외부 자극이다.</li>\n<li>③ (오답) 외재적 동기: 외부 보상·처벌에 연동된 동기로, 학습되지 않은 반사와 무관하다.</li>\n<li>④ (정답) 본능: 종 특유의, 패턴화된, <strong>학습하지 않은</strong> 복잡한 행동.</li>\n</ul>\n","src":"8장 p.2 🎙","diff":1,"prof":true},{"id":"q8003","ch":"ch8","type":"mc","q":"<p>본능 이론에 대한 교수·슬라이드의 평가로 옳은 것은?</p>\n","choices":["심리학에서 완전히 폐기되어 더 이상 쓰이지 않는다","학습된 행동의 중요성을 강조한 이론이다","인간의 모든 동기를 충분히 설명한다","대부분의 동기를 설명하기는 어렵지만, 유전적 요인의 영향력 가정은 진화심리학의 주요 기제로 남았다"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 대부분의 동기를 설명하기는 어렵지만, 유전적 요인의 영향력 가정은 진화심리학의 주요 기제로 남았다</strong></p>\n<p>본능: 한계(대부분 동기 설명 X) + 의의(유전 → 진화심리학).</p>\n<ul>\n<li>① (오답) 심리학에서 완전히 폐기되어 더 이상 쓰이지 않는다: 유전적 요인 가정은 <strong>유지</strong>된다.</li>\n<li>② (오답) 학습된 행동의 중요성을 강조한 이론이다: 본능은 <strong>학습하지 않은</strong> 행동이다.</li>\n<li>③ (오답) 인간의 모든 동기를 충분히 설명한다: 한계가 있다고 명시했다.</li>\n<li>④ (정답) 대부분의 동기를 설명하기는 어렵지만, 유전적 요인의 영향력 가정은 진화심리학의 주요 기제로 남았다: 슬라이드·교수 정리(15:18–15:45) 그대로.</li>\n</ul>\n","src":"8장 p.2 🎙","diff":2,"prof":true},{"id":"q8004","ch":"ch8","type":"mc","q":"<p>&#39;음식 결핍 → 배고픔 → 먹기&#39;의 흐름으로 동기를 설명하는 이론은?</p>\n","choices":["추동 감소 이론","각성 이론","욕구 위계 이론","2요인 이론"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 추동 감소 이론</strong></p>\n<p>추동 감소는 항상성 유지의 핵심 기제.</p>\n<ul>\n<li>① (정답) 추동 감소 이론: 생리적 욕구 → 추동 → 추동을 줄이는 행동.</li>\n<li>② (오답) 각성 이론: 최적 각성 수준을 찾는 것이 목표 — 호기심·탐험 설명용.</li>\n<li>③ (오답) 욕구 위계 이론: 욕구를 위계로 배열한 이론으로, 이 흐름 자체를 설명하는 이론은 아니다.</li>\n<li>④ (오답) 2요인 이론: 정서 이론(각성 + 명명)이다.</li>\n</ul>\n","src":"8장 p.3","diff":1,"prof":false},{"id":"q8005","ch":"ch8","type":"mc","q":"<p>배가 고픈 상태에서 좋아하는 음식 냄새를 맡자 먹고 싶은 마음이 훨씬 강해졌다. 슬라이드의 설명으로 옳은 것은?</p>\n","choices":["욕구(push)와 유인자극(pull)이 동시에 존재하면 추동이 더 강화된다","유인자극은 생리적 요인일 뿐 환경의 영향을 받지 않는다","추동이 강화되려면 각성이 반드시 감소해야 한다","유인자극은 긍정적 자극만을 가리킨다"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 욕구(push)와 유인자극(pull)이 동시에 존재하면 추동이 더 강화된다</strong></p>\n<p>push = 욕구(내부), pull = 유인자극(외부).</p>\n<ul>\n<li>① (정답) 욕구(push)와 유인자극(pull)이 동시에 존재하면 추동이 더 강화된다: p.4 결론 — 동기는 생리 × 환경의 상호작용.</li>\n<li>② (오답) 유인자극은 생리적 요인일 뿐 환경의 영향을 받지 않는다: 유인자극은 <strong>환경</strong>의 영향을 받는다.</li>\n<li>③ (오답) 추동이 강화되려면 각성이 반드시 감소해야 한다: 슬라이드에 없는 내용이다.</li>\n<li>④ (오답) 유인자극은 긍정적 자극만을 가리킨다: 긍정/부정 <strong>모든 유형</strong>의 자극이다.</li>\n</ul>\n","src":"8장 p.4","diff":2,"prof":false},{"id":"q8006","ch":"ch8","type":"mc","q":"<p>배고프지도 목마르지도 않은 사람이 번지점프·롤러코스터 같은 자극을 일부러 찾는다. 이를 가장 잘 설명하는 이론은?</p>\n","choices":["추동 감소 이론","본능 이론","각성 이론","매슬로우 욕구 위계"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 각성 이론</strong></p>\n<p>&#39;추동 감소로 설명하기 어렵다 → 각성 이론&#39; 형식의 전형.</p>\n<ul>\n<li>① (오답) 추동 감소 이론: 각성(긴장)을 <strong>낮추는</strong> 방향만 설명해 자극 추구를 설명하기 어렵다.</li>\n<li>② (오답) 본능 이론: 학습하지 않은 종 특유 행동으로 설명하기 어렵다.</li>\n<li>③ (정답) 각성 이론: 각성의 <strong>증진</strong>으로도 동기가 생긴다 — 최적 각성 추구(감각 추구, Zuckerman).</li>\n<li>④ (오답) 매슬로우 욕구 위계: 욕구 위계로 자극 추구 행동을 직접 설명하지 않는다.</li>\n</ul>\n","src":"8장 p.5–6","diff":1,"prof":false},{"id":"q8007","ch":"ch8","type":"mc","q":"<p><strong>여키스-닷슨 법칙</strong>에 대한 설명으로 옳은 것은?</p>\n","choices":["각성이 높을수록 수행이 직선적으로 높아진다","어려운 과제일수록 높은 각성이 유리하다","적당한 각성이 최적 수행을 낳으며, 어려운 과제는 상대적으로 낮은 각성에서 수행이 높다","각성 수준과 수행은 관련이 없다"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 적당한 각성이 최적 수행을 낳으며, 어려운 과제는 상대적으로 낮은 각성에서 수행이 높다</strong></p>\n<p>어려운 시험일수록 긴장을 낮춰야 한다.</p>\n<ul>\n<li>① (오답) 각성이 높을수록 수행이 직선적으로 높아진다: 역U자 관계이지 직선이 아니다.</li>\n<li>② (오답) 어려운 과제일수록 높은 각성이 유리하다: 반대다.</li>\n<li>③ (정답) 적당한 각성이 최적 수행을 낳으며, 어려운 과제는 상대적으로 낮은 각성에서 수행이 높다: 역U자 + 어려운 과제 = 낮은 각성(Hembree, 1988).</li>\n<li>④ (오답) 각성 수준과 수행은 관련이 없다: 관련이 있다(역U자).</li>\n</ul>\n","src":"8장 p.6","diff":2,"prof":false},{"id":"q8008","ch":"ch8","type":"mc","q":"<p>매슬로우의 욕구 위계에 대한 설명으로 옳지 <strong>않은</strong> 것은?</p>\n","choices":["하위 차원의 욕구가 상위 차원보다 우선한다","하위 욕구가 충족되지 않으면 다음 단계로 이어지지 않는다","생리적 욕구가 가장 하위에 있다","위계의 순서는 모든 문화와 개인에게 보편적으로 고정되어 있다"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 위계의 순서는 모든 문화와 개인에게 보편적으로 고정되어 있다</strong></p>\n<p>단계: 생리 → 안전 → 소속·사랑 → 존중 → 자기실현.</p>\n<ul>\n<li>① (오답) 하위 차원의 욕구가 상위 차원보다 우선한다: 옳다.</li>\n<li>② (오답) 하위 욕구가 충족되지 않으면 다음 단계로 이어지지 않는다: 옳다.</li>\n<li>③ (오답) 생리적 욕구가 가장 하위에 있다: 옳다 — p.8 표.</li>\n<li>④ (정답) 위계의 순서는 모든 문화와 개인에게 보편적으로 고정되어 있다: 슬라이드는 개인 가치관·사회문화에 따라 <strong>다를 수 있다</strong>고 한다.</li>\n</ul>\n","src":"8장 p.7–8","diff":2,"prof":false},{"id":"q8009","ch":"ch8","type":"mc","q":"<p>앤슬 키스(1950)의 <strong>준기아 연구</strong> 참가자들에게 나타난 변화로 옳은 것은?</p>\n","choices":["사회적 관계에 대한 욕구가 더 커졌다","냉담·무기력해지고 먹는 것과 관련된 것에만 강박적이 되었다","자기실현 욕구가 두드러졌다","공격성이 사라지고 이타 행동이 늘었다"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 냉담·무기력해지고 먹는 것과 관련된 것에만 강박적이 되었다</strong></p>\n<p>매슬로우 위계(생리적 욕구 우선)의 근거.</p>\n<ul>\n<li>① (오답) 사회적 관계에 대한 욕구가 더 커졌다: 반대 — 다른 것에는 무관심해졌다.</li>\n<li>② (정답) 냉담·무기력해지고 먹는 것과 관련된 것에만 강박적이 되었다: 슬라이드 그대로 — 생리적 욕구의 강력함.</li>\n<li>③ (오답) 자기실현 욕구가 두드러졌다: 생리적 욕구가 채워지지 않으면 상위 욕구가 밀려난다.</li>\n<li>④ (오답) 공격성이 사라지고 이타 행동이 늘었다: 슬라이드에 없는 내용이다.</li>\n</ul>\n","src":"8장 p.9","diff":2,"prof":false},{"id":"q8010","ch":"ch8","type":"mc","q":"<p>식욕 관련 호르몬과 분비 부위·신호의 연결이 옳은 것은?</p>\n","choices":["렙틴 — 위 — &#39;배고프다&#39;","그렐린 — 위(공복) — &#39;배고프다&#39;","PYY — 지방세포 — 배고픔 증가","오렉신 — 소화관 — 식욕 억제"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 그렐린 — 위(공복) — &#39;배고프다&#39;</strong></p>\n<p>촉진 = 그렐린·오렉신, 억제 = PYY·렙틴.</p>\n<ul>\n<li>① (오답) 렙틴 — 위 — &#39;배고프다&#39;: 렙틴은 <strong>지방세포</strong>에서 분비되어 배고픔을 <strong>감소</strong>시킨다.</li>\n<li>② (정답) 그렐린 — 위(공복) — &#39;배고프다&#39;: p.13 그대로.</li>\n<li>③ (오답) PYY — 지방세포 — 배고픔 증가: PYY는 <strong>소화관</strong>에서 분비, &#39;배고프지 않다&#39;.</li>\n<li>④ (오답) 오렉신 — 소화관 — 식욕 억제: 오렉신은 <strong>시상하부</strong>의 식욕 <strong>촉진</strong> 호르몬.</li>\n</ul>\n","src":"8장 p.12–13","diff":2,"prof":false},{"id":"q8011","ch":"ch8","type":"mc","q":"<p>두뇌의 <strong>식욕 억제 중추</strong>가 손상된 동물에게 나타나는 결과는?</p>\n","choices":["굶주려도 먹이에 관심을 보이지 않는다","섭식의 중단이 이루어지지 않는다(과식)","배고픔 신호 호르몬 그렐린 분비가 멈춘다","기초대사율이 급격히 올라 체중이 줄어든다"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 섭식의 중단이 이루어지지 않는다(과식)</strong></p>\n<p>촉진 부위 손상 → 무관심, 억제 중추 손상 → 멈추지 못함.</p>\n<ul>\n<li>① (오답) 굶주려도 먹이에 관심을 보이지 않는다: 식욕 <strong>촉진</strong> 부위(시상하부) 손상 시의 결과다.</li>\n<li>② (정답) 섭식의 중단이 이루어지지 않는다(과식): Duggan &amp; Booth(1986) — 억제가 안 되니 계속 먹는다.</li>\n<li>③ (오답) 배고픔 신호 호르몬 그렐린 분비가 멈춘다: 그렐린은 위에서 분비되며 슬라이드 내용이 아니다.</li>\n<li>④ (오답) 기초대사율이 급격히 올라 체중이 줄어든다: 슬라이드에 없는 내용이다.</li>\n</ul>\n","src":"8장 p.12","diff":3,"prof":false},{"id":"q8012","ch":"ch8","type":"mc","q":"<p>다이어트로 체중을 뺀 뒤 금세 원래 체중으로 돌아가는 <strong>요요 현상</strong>을 설명하는 개념은?</p>\n","choices":["여키스-닷슨 법칙","낯섦 공포증","포만점","조절점과 기초대사율"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 조절점과 기초대사율</strong></p>\n<p>사람은 일정한 체중을 유지하려는 경향(체중의 항상성)이 있다.</p>\n<ul>\n<li>① (오답) 여키스-닷슨 법칙: 각성과 수행의 관계다.</li>\n<li>② (오답) 낯섦 공포증: 처음 보는 음식 기피다.</li>\n<li>③ (오답) 포만점: 수입과 행복의 관계에서 쓰는 개념이다.</li>\n<li>④ (정답) 조절점과 기초대사율: 체중이 조절점 아래로 가면 배고픔↑·기초대사율↓ → 조절점으로 회귀.</li>\n</ul>\n","src":"8장 p.14","diff":1,"prof":false},{"id":"q8013","ch":"ch8","type":"mc","q":"<p><strong>맛 선호</strong>에 대한 슬라이드 내용으로 옳지 <strong>않은</strong> 것은?</p>\n","choices":["단맛과 짠맛에 대한 선호는 유전적이며 보편적이다","모든 맛 선호는 유전적이고 보편적이어서 경험의 영향을 받지 않는다","일부 음식에 대한 불쾌한 경험은 혐오를 발전시킨다","스트레스로 인한 단 음식 선호는 세로토닌 분비를 촉진한다"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 모든 맛 선호는 유전적이고 보편적이어서 경험의 영향을 받지 않는다</strong></p>\n<p>맛 선호 = 생물학적 + 문화적 요인.</p>\n<ul>\n<li>① (오답) 단맛과 짠맛에 대한 선호는 유전적이며 보편적이다: 옳다.</li>\n<li>② (정답) 모든 맛 선호는 유전적이고 보편적이어서 경험의 영향을 받지 않는다: 단맛·짠맛만 유전·보편이고, 나머지는 <strong>조건형성</strong>된 부분이 있다.</li>\n<li>③ (오답) 일부 음식에 대한 불쾌한 경험은 혐오를 발전시킨다: 옳다 — 5장 맛 혐오 학습과 연결.</li>\n<li>④ (오답) 스트레스로 인한 단 음식 선호는 세로토닌 분비를 촉진한다: 옳다(Boggiano et al., 2005).</li>\n</ul>\n","src":"8장 p.16","diff":2,"prof":false},{"id":"q8014","ch":"ch8","type":"mc","q":"<p>처음 여행 간 나라에서 한 번도 먹어 본 적 없는 음식을 보고 독이 있을까 꺼림칙해 손을 대지 않았다. 해당하는 개념은?</p>\n","choices":["맛 혐오 학습","내집단 편향","낯섦 공포증","카타르시스"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 낯섦 공포증</strong></p>\n<p>낯선 음식 = 독일 가능성(진화적 적응). 문화권별 차이: 서양권의 두족류·해조류 혐오.</p>\n<ul>\n<li>① (오답) 맛 혐오 학습: 실제로 먹고 <strong>불쾌한 경험</strong>을 한 뒤 생기는 혐오다 — 여기서는 먹어 본 적이 없다.</li>\n<li>② (오답) 내집단 편향: 외집단보다 내집단을 선호하는 사회적 경향이다.</li>\n<li>③ (정답) 낯섦 공포증: 이전에 먹은 적 없는 음식을 기피하는 경향(neophobia).</li>\n<li>④ (오답) 카타르시스: 분노 표출로 해소한다는 생각이다.</li>\n</ul>\n","src":"8장 p.17","diff":1,"prof":false},{"id":"q8015","ch":"ch8","type":"mc","q":"<p><strong>식사 상황</strong>의 영향에 대한 슬라이드 내용으로 옳지 <strong>않은</strong> 것은?</p>\n","choices":["데이트 중에는 평소보다 더 많이 먹는다","친구와 같이 있을 때 더 많이 먹는다","제공되는 음식 양에 맞춰 섭취량을 조절한다","지정 메뉴보다 뷔페에서 섭취량이 늘어난다"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 데이트 중에는 평소보다 더 많이 먹는다</strong></p>\n<p>친구 ↑, 데이트 ↓, 양 맞춤, 뷔페 ↑.</p>\n<ul>\n<li>① (정답) 데이트 중에는 평소보다 더 많이 먹는다: 반대 — 데이트 중에는 <strong>더 적게</strong> 먹는다(Baker et al., 2019).</li>\n<li>② (오답) 친구와 같이 있을 때 더 많이 먹는다: 옳다(Cummings &amp; Tomiyama).</li>\n<li>③ (오답) 제공되는 음식 양에 맞춰 섭취량을 조절한다: 옳다(DiSantis et al.).</li>\n<li>④ (오답) 지정 메뉴보다 뷔페에서 섭취량이 늘어난다: 옳다.</li>\n</ul>\n","src":"8장 p.18","diff":2,"prof":false},{"id":"q8016","ch":"ch8","type":"mc","q":"<p>SNS에서 차단을 당했을 때 활성화되며, <strong>실제 신체의 고통</strong>을 담당하는 대뇌 영역은?</p>\n","choices":["편도체","전측대상회","시상하부","브로카 영역"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 전측대상회</strong></p>\n<p>anterior cingulate cortex(ACC).</p>\n<ul>\n<li>① (오답) 편도체: 정서(공포) 회로의 중추로, 슬라이드가 이 연구에서 든 영역이 아니다.</li>\n<li>② (정답) 전측대상회: Rotge et al.(2015) — 사회적 배척의 고통 ≈ 신체적 고통.</li>\n<li>③ (오답) 시상하부: 배고픔·항상성 조절 영역이다.</li>\n<li>④ (오답) 브로카 영역: 언어 산출 영역이다.</li>\n</ul>\n","src":"8장 p.22","diff":2,"prof":false},{"id":"q8017","ch":"ch8","type":"mc","q":"<p><strong>자기 결정 이론</strong>이 말하는 인간의 세 가지 욕구는?</p>\n","choices":["생리 · 안전 · 소속","지각 · 이해 · 관리","목적 · 의의 · 응집력","유능성 · 자율성 · 관계성"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 유능성 · 자율성 · 관계성</strong></p>\n<p>유·자·관.</p>\n<ul>\n<li>① (오답) 생리 · 안전 · 소속: 매슬로우 위계의 하위 단계다.</li>\n<li>② (오답) 지각 · 이해 · 관리: 정서 지능(7장)의 성분이다.</li>\n<li>③ (오답) 목적 · 의의 · 응집력: p.7 삶의 의미의 조화 요소(Oishi &amp; Diener)다.</li>\n<li>④ (정답) 유능성 · 자율성 · 관계성: Self-Determination Theory — 충족 시 스트레스 감소·자존감 고양.</li>\n</ul>\n","src":"8장 p.21","diff":1,"prof":false},{"id":"q8018","ch":"ch8","type":"mc","q":"<p>Haidt &amp; Twenge(2019)의 <strong>SNS와 정신건강</strong> 연구 결과로 옳은 것은?</p>\n","choices":["사용 시간과 우울/불안은 약한 정적 상관을 보이지만 실험 연구 결과는 일관성이 떨어진다","SNS가 우울을 일으킨다는 인과 관계가 실험으로 명확히 입증되었다","SNS 사용과 우울/불안 사이에는 아무 상관도 없다","SNS 사용 여부는 미래의 정신 건강을 전혀 예측하지 못한다"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 사용 시간과 우울/불안은 약한 정적 상관을 보이지만 실험 연구 결과는 일관성이 떨어진다</strong></p>\n<p>1장 연결: 상관 ≠ 인과.</p>\n<ul>\n<li>① (정답) 사용 시간과 우울/불안은 약한 정적 상관을 보이지만 실험 연구 결과는 일관성이 떨어진다: 그래서 결론은 &#39;일장일단&#39; — 상관만으로 인과를 단정할 수 없다.</li>\n<li>② (오답) SNS가 우울을 일으킨다는 인과 관계가 실험으로 명확히 입증되었다: 실험 결과는 <strong>비일관</strong>이다.</li>\n<li>③ (오답) SNS 사용과 우울/불안 사이에는 아무 상관도 없다: <strong>약한 정적 상관</strong>이 있다.</li>\n<li>④ (오답) SNS 사용 여부는 미래의 정신 건강을 전혀 예측하지 못한다: 사용 여부는 미래 정신 건강을 <strong>예측</strong>한다.</li>\n</ul>\n","src":"8장 p.25","diff":2,"prof":false},{"id":"q8019","ch":"ch8","type":"mc","q":"<p><strong>그릿(grit)</strong> 에 대한 설명으로 옳은 것은?</p>\n","choices":["Duckworth가 제안한, 장기적 목표를 향한 열정과 집념이며 성실성·자기제어와 같은 개념이라는 비판도 있다","단기적 보상을 얻으려는 순간적 의지를 말한다","타고난 재능이 수행을 가장 잘 예측한다는 개념이다","외부 보상에 연동해 형성되는 동기다"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① Duckworth가 제안한, 장기적 목표를 향한 열정과 집념이며 성실성·자기제어와 같은 개념이라는 비판도 있다</strong></p>\n<p>그릿 = 불굴의 투지.</p>\n<ul>\n<li>① (정답) Duckworth가 제안한, 장기적 목표를 향한 열정과 집념이며 성실성·자기제어와 같은 개념이라는 비판도 있다: p.27 그대로.</li>\n<li>② (오답) 단기적 보상을 얻으려는 순간적 의지를 말한다: 그릿은 <strong>장기적</strong> 목표에 대한 것이다.</li>\n<li>③ (오답) 타고난 재능이 수행을 가장 잘 예측한다는 개념이다: 슬라이드는 재능보다 <strong>성취 동기</strong>가 수행을 더 잘 예측한다고 한다(Bloom).</li>\n<li>④ (오답) 외부 보상에 연동해 형성되는 동기다: 외재적 동기의 정의다.</li>\n</ul>\n","src":"8장 p.27","diff":2,"prof":false},{"id":"q8020","ch":"ch8","type":"mc","q":"<p>민수는 부모님께 용돈을 받으려고 공부한다. 민수의 동기는?</p>\n","choices":["내재적 동기","외재적 동기","그릿","소속 욕구"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 외재적 동기</strong></p>\n<p>동기 형성 요인의 위치: 외부 = 외재적.</p>\n<ul>\n<li>① (오답) 내재적 동기: 수행 자체가 좋아서 형성되는 동기다.</li>\n<li>② (정답) 외재적 동기: 외부의 보상(용돈)에 연동해 형성.</li>\n<li>③ (오답) 그릿: 장기 목표에 대한 열정·집념으로, 보상 연동 여부를 가리키지 않는다.</li>\n<li>④ (오답) 소속 욕구: 사회적 유대에 대한 욕구다.</li>\n</ul>\n","src":"8장 p.27","diff":1,"prof":false},{"id":"q8021","ch":"ch8","type":"mc","q":"<p>&#39;숲에서 곰을 보고 → 심장이 뛰고 몸이 떨린다 → 그래서 두렵다&#39;는 설명에 해당하는 정서 이론은?</p>\n","choices":["캐넌-바드 이론","샥터-싱어 2요인 이론","자이언스·르두의 입장","제임스-랑게 이론"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 제임스-랑게 이론</strong></p>\n<p>&#39;떨려서 무섭다&#39; = 제임스-랑게.</p>\n<ul>\n<li>① (오답) 캐넌-바드 이론: 신체 반응과 정서가 <strong>동시에</strong> 독립적으로 생긴다.</li>\n<li>② (오답) 샥터-싱어 2요인 이론: 각성에 대한 <strong>인지적 해석(명명)</strong> 이 필요하다.</li>\n<li>③ (오답) 자이언스·르두의 입장: 인지 해석 없이 즉각 정서가 생길 수 있다는 입장으로, 신체 반응 → 정서의 순서를 말하는 것은 아니다.</li>\n<li>④ (정답) 제임스-랑게 이론: 신체 반응이 정서를 유발한다.</li>\n</ul>\n","src":"8장 p.29, 33","diff":1,"prof":false},{"id":"q8022","ch":"ch8","type":"mc","q":"<p>캐넌-바드 이론이 제임스-랑게 이론을 비판한 근거는?</p>\n","choices":["신체 반응은 정서마다 유사한 점이 많고 변화가 느려 서로 다른 정서를 유발할 수 없다","정서는 반드시 인지적 이름 붙이기를 거쳐야 한다","역치 하 자극도 선호를 만든다","신체 감각과 정서 반응이 연관되어 있다"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 신체 반응은 정서마다 유사한 점이 많고 변화가 느려 서로 다른 정서를 유발할 수 없다</strong></p>\n<p>캐넌-바드: 자극 → (신체 반응 ∥ 정서).</p>\n<ul>\n<li>① (정답) 신체 반응은 정서마다 유사한 점이 많고 변화가 느려 서로 다른 정서를 유발할 수 없다: p.29 비판 그대로.</li>\n<li>② (오답) 정서는 반드시 인지적 이름 붙이기를 거쳐야 한다: 샥터-싱어 2요인 이론의 주장이다.</li>\n<li>③ (오답) 역치 하 자극도 선호를 만든다: 자이언스의 연구다.</li>\n<li>④ (오답) 신체 감각과 정서 반응이 연관되어 있다: Damasio(2003) — 오히려 제임스-랑게를 <strong>지지</strong>하는 근거다.</li>\n</ul>\n","src":"8장 p.29","diff":2,"prof":false},{"id":"q8023","ch":"ch8","type":"mc","q":"<p>Schachter &amp; Singer(1962)의 에피네프린 실험에서 <strong>주사의 효과를 미리 고지받은</strong> 집단의 결과는?</p>\n","choices":["고지받지 않은 집단보다 더 강한 정서를 느꼈다","옆 사람(공모자)의 기분을 따라 정서를 경험했다","에피네프린을 맞았는데도 신체 각성이 일어나지 않았다","신체 흥분을 약물 탓으로 돌려 어떤 정서 표식도 붙이지 않았다"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 신체 흥분을 약물 탓으로 돌려 어떤 정서 표식도 붙이지 않았다</strong></p>\n<p>2요인 = 신체적 각성 + 인지적 이름 붙이기.</p>\n<ul>\n<li>① (오답) 고지받지 않은 집단보다 더 강한 정서를 느꼈다: 반대다.</li>\n<li>② (오답) 옆 사람(공모자)의 기분을 따라 정서를 경험했다: <strong>고지받지 못한</strong> 집단의 결과다.</li>\n<li>③ (오답) 에피네프린을 맞았는데도 신체 각성이 일어나지 않았다: 각성은 일어났고, 해석이 달랐다.</li>\n<li>④ (정답) 신체 흥분을 약물 탓으로 돌려 어떤 정서 표식도 붙이지 않았다: 각성의 원인을 알면 정서로 &#39;명명&#39;하지 않는다 → 해석의 중요성.</li>\n</ul>\n","src":"8장 p.30","diff":3,"prof":false},{"id":"q8024","ch":"ch8","type":"mc","q":"<p>지각할 수 없을 만큼 짧게 제시된 자극을 반복해서 본 사람들이 그 자극을 더 선호하게 되었다(Kunst-Wilson &amp; Zajonc, 1980). 이 결과가 지지하는 주장은?</p>\n","choices":["정서 반응은 인지 기반 해석 없이도 발생할 수 있다","정서는 신체 반응으로부터 도출된다","정서는 각성과 그에 대한 의식적 해석으로 결정된다","신체 반응과 정서는 동시에 독립적으로 일어난다"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 정서 반응은 인지 기반 해석 없이도 발생할 수 있다</strong></p>\n<p>교재 용어: 단순 노출 효과. 신경학적 근거 = 아랫길.</p>\n<ul>\n<li>① (정답) 정서 반응은 인지 기반 해석 없이도 발생할 수 있다: 자이언스·르두의 입장 — 역치 하 점화.</li>\n<li>② (오답) 정서는 신체 반응으로부터 도출된다: 제임스-랑게 이론이다.</li>\n<li>③ (오답) 정서는 각성과 그에 대한 의식적 해석으로 결정된다: 2요인 이론 — 이 실험은 의식적 해석 없이 선호가 생겼다는 결과다.</li>\n<li>④ (오답) 신체 반응과 정서는 동시에 독립적으로 일어난다: 캐넌-바드 이론이다.</li>\n</ul>\n","src":"8장 p.31","diff":2,"prof":false},{"id":"q8025","ch":"ch8","type":"mc","q":"<p>정서의 신경 회로 중 <strong>빠른 아랫길</strong>의 경로는?</p>\n","choices":["시상 → 대뇌 피질 → 편도체 → 신체","편도체 → 시상 → 대뇌 피질","시상 → 편도체","시상하부 → 뇌하수체 → 부신"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 시상 → 편도체</strong></p>\n<p>윗길 = 피질 경유(복잡·신중), 아랫길 = 피질 우회(빠름).</p>\n<ul>\n<li>① (오답) 시상 → 대뇌 피질 → 편도체 → 신체: <strong>신중한 윗길</strong>이다.</li>\n<li>② (오답) 편도체 → 시상 → 대뇌 피질: 슬라이드에 없는 경로다.</li>\n<li>③ (정답) 시상 → 편도체: 피질을 우회 — 즉각 반응, 의식적 자각을 못 할 수도 있다.</li>\n<li>④ (오답) 시상하부 → 뇌하수체 → 부신: 스트레스 호르몬 축으로 정서 회로 슬라이드 내용이 아니다.</li>\n</ul>\n","src":"8장 p.32","diff":2,"prof":false},{"id":"q8026","ch":"ch8","type":"mc","q":"<p>어린 시절 학대를 받은 아동이 모호한 표정을 <strong>분노</strong>로 더 빨리 지각한다는 연구(Pollak &amp; Kistler, 2002)가 보여 주는 것은?</p>\n","choices":["부정적 정서 탐지 능력은 전적으로 학습된다","개인의 환경·경험에 따라 모호한 표정에서 정서를 탐지하는 방식이 달라진다","표정 인식에는 성별 차이가 없다","6개 보편 정서는 문화에 따라 다르다"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 개인의 환경·경험에 따라 모호한 표정에서 정서를 탐지하는 방식이 달라진다</strong></p>\n<p>정서 탐지 = 생득적 기반 + 경험의 영향.</p>\n<ul>\n<li>① (오답) 부정적 정서 탐지 능력은 전적으로 학습된다: 슬라이드는 부정적 정서 탐지가 <strong>생득적</strong>이라고도 한다(Burris).</li>\n<li>② (정답) 개인의 환경·경험에 따라 모호한 표정에서 정서를 탐지하는 방식이 달라진다: p.34 그대로.</li>\n<li>③ (오답) 표정 인식에는 성별 차이가 없다: p.35 내용과 무관하며 이 연구의 결론도 아니다.</li>\n<li>④ (오답) 6개 보편 정서는 문화에 따라 다르다: 보편 정서는 문화와 무관 — 에크만(p.36).</li>\n</ul>\n<p>(사례 지문은 교재 예시 — 슬라이드 원문은 해당 쪽 참고)</p>\n","src":"8장 p.34","diff":2,"prof":false},{"id":"q8027","ch":"ch8","type":"mc","q":"<p>에크만의 보편적 정서와 문화에 대한 설명으로 옳지 <strong>않은</strong> 것은?</p>\n","choices":["문화권에 관계없이 관찰되는 6개의 정서가 있다","보편적 정서는 유아기부터 관찰된다","보편 정서를 표출하는 수준도 모든 문화권에서 동일하다","개인주의 문화는 정서 표출을 장려하고 집단주의 문화는 억제한다"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 보편 정서를 표출하는 수준도 모든 문화권에서 동일하다</strong></p>\n<p>정서 자체 = 보편, 표출 수준·제스처 해석 = 문화차.</p>\n<ul>\n<li>① (오답) 문화권에 관계없이 관찰되는 6개의 정서가 있다: 옳다.</li>\n<li>② (오답) 보편적 정서는 유아기부터 관찰된다: 옳다.</li>\n<li>③ (정답) 보편 정서를 표출하는 수준도 모든 문화권에서 동일하다: 표출 <strong>수준</strong>은 문화권마다 다를 수 있다(Cordaro et al., 2018).</li>\n<li>④ (오답) 개인주의 문화는 정서 표출을 장려하고 집단주의 문화는 억제한다: 옳다(van Hemert et al.).</li>\n</ul>\n","src":"8장 p.36","diff":3,"prof":false},{"id":"q8028","ch":"ch8","type":"mc","q":"<p>펜을 이로 물어 미소 짓는 근육을 쓰게 한 사람들이 같은 만화를 더 재미있다고 평가했다. 이 현상은?</p>\n","choices":["행동 피드백 효과","카타르시스","얼굴 피드백 효과","단순 노출 효과"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 얼굴 피드백 효과</strong></p>\n<p>두 피드백 효과 모두 신체 → 정서 → 제임스-랑게 지지.</p>\n<ul>\n<li>① (오답) 행동 피드백 효과: 걷는 자세처럼 <strong>행동</strong>이 정서를 조절하는 효과다 — 여기서는 표정 근육이다.</li>\n<li>② (오답) 카타르시스: 분노 표출로 해소한다는 생각이다.</li>\n<li>③ (정답) 얼굴 피드백 효과: 표정이 정서를 증폭·조절한다.</li>\n<li>④ (오답) 단순 노출 효과: 반복 노출된 자극을 더 선호하는 것이다.</li>\n</ul>\n<p>(사례 지문은 교재 예시 — 슬라이드 원문은 해당 쪽 참고)</p>\n","src":"8장 p.37","diff":1,"prof":false},{"id":"q8029","ch":"ch8","type":"mc","q":"<p><strong>분노</strong>에 대한 슬라이드 내용으로 옳은 것은?</p>\n","choices":["분노를 표출해 해소하는 카타르시스는 일시적 해결책일 뿐 부적응적이다","분노는 가능한 한 즉시 강하게 표출하는 것이 최선의 대처다","분노를 겪으면 테스토스테론 수준이 낮아진다","분노는 Fight or Flight 중 Flight(도피)를 촉발한다"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 분노를 표출해 해소하는 카타르시스는 일시적 해결책일 뿐 부적응적이다</strong></p>\n<p>분노: Fight, 염증·테스토스테론↑, 카타르시스 X.</p>\n<ul>\n<li>① (정답) 분노를 표출해 해소하는 카타르시스는 일시적 해결책일 뿐 부적응적이다: p.38 — 분노에 입각한 행동은 분노를 더 폭증시킨다(Flack).</li>\n<li>② (오답) 분노는 가능한 한 즉시 강하게 표출하는 것이 최선의 대처다: 대처법은 <strong>기다리기·다른 활동·거리 두기</strong>.</li>\n<li>③ (오답) 분노를 겪으면 테스토스테론 수준이 낮아진다: <strong>높아진다</strong>(염증도 증가).</li>\n<li>④ (오답) 분노는 Fight or Flight 중 Flight(도피)를 촉발한다: <strong>Fight(싸움)</strong> 를 촉발한다.</li>\n</ul>\n","src":"8장 p.38","diff":2,"prof":false},{"id":"q8030","ch":"ch8","type":"mc","q":"<p>긍정심리학의 <strong>긍정적 안녕감</strong>을 이루는 시간 축의 짝으로 옳은 것은?</p>\n","choices":["과거 — 만족, 현재 — 행복, 미래 — 낙관","과거 — 낙관, 현재 — 만족, 미래 — 행복","과거 — 행복, 현재 — 낙관, 미래 — 만족","과거 — 만족, 현재 — 낙관, 미래 — 행복"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 과거 — 만족, 현재 — 행복, 미래 — 낙관</strong></p>\n<p>긍정심리학 3기둥 = 긍정적 안녕감 · 긍정적 품성 · 긍정적 집단·사회·문화.</p>\n<ul>\n<li>① (정답) 과거 — 만족, 현재 — 행복, 미래 — 낙관: p.40 그대로.</li>\n<li>② (오답) 과거 — 낙관, 현재 — 만족, 미래 — 행복: 짝을 뒤섞은 함정이다.</li>\n<li>③ (오답) 과거 — 행복, 현재 — 낙관, 미래 — 만족: 짝을 뒤섞은 함정이다.</li>\n<li>④ (오답) 과거 — 만족, 현재 — 낙관, 미래 — 행복: 현재·미래를 뒤바꿨다.</li>\n</ul>\n","src":"8장 p.40","diff":2,"prof":false},{"id":"q8031","ch":"ch8","type":"mc","q":"<p><strong>돈과 행복</strong>에 대한 슬라이드 내용으로 옳은 것은?</p>\n","choices":["수입이 늘수록 행복은 끝없이 비례해 증가한다","지니계수가 높은 국가일수록 저소득층의 건강·심리 문제가 줄어든다","포만점에 도달하기 전까지는 수입이 행복을 증진하지만, 그 이후에는 더 이상 증진하지 않는다","대부분의 사람은 수입 격차가 큰 사회를 선호한다"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 포만점에 도달하기 전까지는 수입이 행복을 증진하지만, 그 이후에는 더 이상 증진하지 않는다</strong></p>\n<p>극단적 불평등은 해롭다.</p>\n<ul>\n<li>① (오답) 수입이 늘수록 행복은 끝없이 비례해 증가한다: 일정 수준(포만점) 이후에는 늘지 않는다.</li>\n<li>② (오답) 지니계수가 높은 국가일수록 저소득층의 건강·심리 문제가 줄어든다: 반대 — 불평등이 클수록 저소득층 문제가 <strong>빈번</strong>(Sommet).</li>\n<li>③ (정답) 포만점에 도달하기 전까지는 수입이 행복을 증진하지만, 그 이후에는 더 이상 증진하지 않는다: Ruberton et al.(2016).</li>\n<li>④ (오답) 대부분의 사람은 수입 격차가 큰 사회를 선호한다: 격차가 <strong>적은</strong> 것을 선호한다(Arsenio).</li>\n</ul>\n","src":"8장 p.41","diff":2,"prof":false},{"id":"q8032","ch":"ch8","type":"mc","q":"<p>p.33 정서 이론 요약표의 연결로 옳지 <strong>않은</strong> 것은?</p>\n","choices":["제임스-랑게 — 정서는 자극에 대한 신체 반응으로부터 도출","캐넌-바드 — 신체 반응과 정서가 동시에 촉발","자이언스·르두 — 어떤 정서 반응은 의식적 평가 없이 즉각 발생","샥터-싱어 — 정서 유발 자극이 신체 반응과 정서 반응을 동시에 촉발"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 샥터-싱어 — 정서 유발 자극이 신체 반응과 정서 반응을 동시에 촉발</strong></p>\n<p>제임스-랑게(신체 → 정서) / 캐넌-바드(동시) / 2요인(각성 + 평가) / 자이언스·르두(즉각).</p>\n<ul>\n<li>① (오답) 제임스-랑게 — 정서는 자극에 대한 신체 반응으로부터 도출: 옳다.</li>\n<li>② (오답) 캐넌-바드 — 신체 반응과 정서가 동시에 촉발: 옳다.</li>\n<li>③ (오답) 자이언스·르두 — 어떤 정서 반응은 의식적 평가 없이 즉각 발생: 옳다.</li>\n<li>④ (정답) 샥터-싱어 — 정서 유발 자극이 신체 반응과 정서 반응을 동시에 촉발: 이것은 <strong>캐넌-바드</strong>의 설명이다. 샥터-싱어 = 신체적 각성 + 의식적 인지 평가.</li>\n</ul>\n","src":"8장 p.33","diff":3,"prof":false},{"id":"q8033","ch":"ch8","type":"mc","q":"<p>p.8 고전 동기 이론 요약표의 연결로 옳지 <strong>않은</strong> 것은?</p>\n","choices":["본능과 진화 — 학습하지 않은 종 특유 행동은 유전적 요인에 의해 발생","추동 감소 — 내적 추진력(push)과 외적 제어(pull)에 반응하는 방식에 초점","각성 이론 — 생리적 욕구 충족을 위해 추동을 형성하고 감소 행동으로 이어짐","매슬로우 — 생리적 욕구가 가장 하위, 사회적 욕구가 상위"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 각성 이론 — 생리적 욕구 충족을 위해 추동을 형성하고 감소 행동으로 이어짐</strong></p>\n<p>4개 이론의 핵심 한 줄을 짝지을 것.</p>\n<ul>\n<li>① (오답) 본능과 진화 — 학습하지 않은 종 특유 행동은 유전적 요인에 의해 발생: 옳다.</li>\n<li>② (오답) 추동 감소 — 내적 추진력(push)과 외적 제어(pull)에 반응하는 방식에 초점: 옳다.</li>\n<li>③ (정답) 각성 이론 — 생리적 욕구 충족을 위해 추동을 형성하고 감소 행동으로 이어짐: 이것은 <strong>추동 감소</strong> 이론이다. 각성 이론 = 최적 각성 수준 유지.</li>\n<li>④ (오답) 매슬로우 — 생리적 욕구가 가장 하위, 사회적 욕구가 상위: 옳다.</li>\n</ul>\n","src":"8장 p.8","diff":3,"prof":false},{"id":"q8034","ch":"ch8","type":"sa","q":"<p><strong>생리적 욕구</strong>를 충족시키기 위한 행동을 동기화하는 <strong>긴장 상태</strong>를 쓰시오.</p>\n","choices":[],"answer":"추동","alts":["drive","추동(drive)"],"answerHtml":"추동","solution":"<p><strong>추동(Drive)</strong> — 추동 감소 이론의 핵심.</p>\n","src":"8장 p.3","diff":1,"prof":false},{"id":"q8035","ch":"ch8","type":"sa","q":"<p><strong>일정한 내적 상태를 유지하려는 경향성</strong>(피드백 루프로 조절)을 쓰시오.</p>\n","choices":[],"answer":"항상성","alts":["homeostasis","항상성(homeostasis)"],"answerHtml":"항상성","solution":"<p><strong>항상성</strong> — 추동 감소는 항상성 유지의 핵심 기제.</p>\n","src":"8장 p.3","diff":1,"prof":false},{"id":"q8036","ch":"ch8","type":"sa","q":"<p>사람의 행동을 이끌어 낼 수 있는 긍정/부정의 <strong>모든 유형의 자극</strong>으로, 환경의 영향을 받는 것을 쓰시오.</p>\n","choices":[],"answer":"유인자극","alts":["유인 자극","incentive"],"answerHtml":"유인자극","solution":"<p><strong>유인자극(Incentive)</strong> — 욕구(push)와 동시에 있으면 추동 강화(pull).</p>\n","src":"8장 p.4","diff":1,"prof":false},{"id":"q8037","ch":"ch8","type":"sa","q":"<p>신체가 설정한 <strong>특정 체중 지점</strong>으로, 요요 현상을 설명하는 개념을 쓰시오.</p>\n","choices":[],"answer":"조절점","alts":["set point","체중 조절점","설정점"],"answerHtml":"조절점","solution":"<p><strong>조절점(set point)</strong> — 기초대사율과 함께 일정 체중으로 회귀.</p>\n","src":"8장 p.14","diff":1,"prof":false},{"id":"q8038","ch":"ch8","type":"sa","q":"<p>공복 상태의 <strong>위</strong>에서 분비되어 뇌에 &#39;배고프다&#39;는 신호를 보내는 호르몬을 쓰시오.</p>\n","choices":[],"answer":"그렐린","alts":["ghrelin","그렐린(ghrelin)"],"answerHtml":"그렐린","solution":"<p><strong>그렐린</strong> — 반대로 PYY(소화관)·렙틴(지방세포)은 배고픔을 줄인다.</p>\n","src":"8장 p.13","diff":1,"prof":false},{"id":"q8039","ch":"ch8","type":"sa","q":"<p><strong>지방세포</strong>에서 분비되는 단백질 호르몬으로 배고픔을 감소시키는 것을 쓰시오.</p>\n","choices":[],"answer":"렙틴","alts":["leptin","렙틴(leptin)"],"answerHtml":"렙틴","solution":"<p><strong>렙틴</strong> — &#39;지방이 충분하다, 이제 그만&#39;.</p>\n","src":"8장 p.13","diff":1,"prof":false},{"id":"q8040","ch":"ch8","type":"sa","q":"<p>대부분의 사람이 외집단보다 <strong>내집단을 선호</strong>하는 경향을 쓰시오.</p>\n","choices":[],"answer":"내집단 편향","alts":["내집단 편향성","ingroup bias","in-group bias","내집단편향"],"answerHtml":"내집단 편향","solution":"<p><strong>내집단 편향(ingroup bias)</strong> — 사회적 정체성은 건강·안녕감을 증진.</p>\n","src":"8장 p.20","diff":1,"prof":false},{"id":"q8041","ch":"ch8","type":"sa","q":"<p>Duckworth(2016)가 제안한, <strong>장기적 목표</strong>를 향한 <strong>열정과 집념</strong>을 쓰시오.</p>\n","choices":[],"answer":"그릿","alts":["grit","불굴의 투지","투지"],"answerHtml":"그릿","solution":"<p><strong>그릿(불굴의 투지)</strong> — 성실성·자기제어와 같은 개념이라는 비판도 있음.</p>\n","src":"8장 p.27","diff":1,"prof":false},{"id":"q8042","ch":"ch8","type":"sa","q":"<p>정서를 경험하려면 <strong>신체적 각성</strong>과 그 각성에 대한 <strong>인지적 이름 붙이기</strong>가 모두 필요하다는 이론을 쓰시오.</p>\n","choices":[],"answer":"2요인 이론","alts":["샥터-싱어 2요인 이론","샥터 싱어 이론","두 요인 이론","이요인 이론","two-factor theory","샥터-싱어 이론","2요인"],"answerHtml":"2요인 이론","solution":"<p><strong>샥터-싱어 2요인 이론</strong> — 신체적 각성 + 이름 붙이기 = 정서.</p>\n","src":"8장 p.30","diff":2,"prof":false},{"id":"q8043","ch":"ch8","type":"sa","q":"<p>정서 신경 회로 중 &#39;<strong>시상 → 대뇌 피질 → 편도체 → 신체</strong>&#39;로 이어지며 상대적으로 복잡한 감정을 처리하는 경로를 쓰시오.</p>\n","choices":[],"answer":"윗길","alts":["신중한 윗길","high road","상위 경로"],"answerHtml":"윗길","solution":"<p><strong>신중한 윗길(high road)</strong> — 아랫길(시상 → 편도체)과 대비.</p>\n","src":"8장 p.32","diff":2,"prof":false},{"id":"q8044","ch":"ch8","type":"sa","q":"<p>처진 채 걸으면 우울해지고 힘을 내서 걸으면 기분이 나아지는 것처럼, <strong>직접 행하는 행동</strong>에 따라 정서가 조절되는 효과를 쓰시오.</p>\n","choices":[],"answer":"행동 피드백 효과","alts":["behavior feedback effect","행동 피드백","행동피드백효과"],"answerHtml":"행동 피드백 효과","solution":"<p><strong>행동 피드백 효과</strong>(Krahe et al., 2018) — 표정이면 얼굴 피드백 효과.</p>\n","src":"8장 p.37","diff":2,"prof":false},{"id":"q8045","ch":"ch8","type":"sa","q":"<p><strong>기분이 좋을 때 남에게 도움을 주는</strong> 경향(Salovey, 1990)을 쓰시오.</p>\n","choices":[],"answer":"기분 좋음, 선행 현상","alts":["기분 좋음 선행 현상","기분좋음선행현상","feel-good, do-good phenomenon","feel-good do-good phenomenon","기분 좋음·선행 현상"],"answerHtml":"기분 좋음, 선행 현상","solution":"<p><strong>기분 좋음, 선행 현상</strong> — 역방향(남을 도우면 행복)도 성립.</p>\n","src":"8장 p.39","diff":2,"prof":false},{"id":"q8046","ch":"ch8","type":"sa","q":"<p>분노를 표출하면 감정이 해소된다는 생각으로, 슬라이드가 &#39;일시적 해결책이며 부적응적&#39;이라고 한 것을 쓰시오.</p>\n","choices":[],"answer":"카타르시스","alts":["catharsis","카타르시스(catharsis)"],"answerHtml":"카타르시스","solution":"<p><strong>카타르시스</strong> — 분노 행동은 분노를 더 폭증. 대처: 기다리기·다른 활동·거리 두기.</p>\n","src":"8장 p.38","diff":1,"prof":false},{"id":"q8047","ch":"ch8","type":"sa","q":"<p>그 수준에 도달하면 수입이 더 이상 행복을 증진하거나 우울을 줄이지 않는 지점을 쓰시오.</p>\n","choices":[],"answer":"포만점","alts":["satiation point"],"answerHtml":"포만점","solution":"<p><strong>포만점(satiation point)</strong> — Ruberton et al.(2016).</p>\n","src":"8장 p.41","diff":2,"prof":false}],"plan":{"sessions":[{"id":"s7","name":"7장 하루 완주 (4h 20m)","goal":"7장 p.1–47: 정리본 정독 → 명칭 셀프 테스트 → 문제 35개","blocks":[{"min":10,"kind":"read","ref":"ch7note","title":"① 큰 그림 — 머리말 + p.N 제목만","note":"사고(p.2–22) · 언어(p.23–31) · 지능(p.32–39) · 검사(p.40–47) 네 덩어리로 나눈다"},{"min":45,"kind":"read","ref":"ch7note","title":"② 사고 파트 정독 (p.1–22)","note":"⭐⭐ 이상은 소리 내어 설명. p.21–22 표는 장점·단점 칸까지"},{"min":5,"kind":"break","title":"휴식"},{"min":25,"kind":"cards","ref":"ch7","title":"④ 명칭 셀프 테스트 1회차","note":"앞면(설명)만 보고 명칭을 소리 내어 답한 뒤 뒤집기"},{"min":40,"kind":"read","ref":"ch7note","title":"② 언어·지능·검사 정독 (p.23–47)","note":"p.39 지능 5입장 표 = 교수가 두 번 정리한 핵심"},{"min":10,"kind":"break","title":"휴식 (스트레칭)"},{"min":10,"kind":"read","ref":"ch7note","title":"③ 🎙 실제 수업 기록 (10/20)","note":"교수 예시(의자·슐리펜·1984·운동 능력 검사)를 해당 p.N에 연결"},{"min":25,"kind":"cards","ref":"ch7","title":"명칭 카드 2회차 — 틀린 것 위주","note":""},{"min":35,"kind":"quiz","ref":"ch7","title":"7장 문제 20개","count":20,"note":"틀리면 풀이의 ①②③④ 오답 이유까지 읽기"},{"min":5,"kind":"break","title":"휴식"},{"min":10,"kind":"read","ref":"ch7note","title":"⑤ 쌍 구분 — 시험 대비 핵심 요약 §20","note":"대표성 vs 가용성, 서스톤 vs 가드너, 신뢰도 vs 타당도 … '가르는 한 문장'을 직접 써 보기"},{"min":25,"kind":"quiz","ref":"ch7","title":"7장 문제 15개 더","count":15,"note":""},{"min":10,"kind":"review","title":"오답노트 다시 풀기","note":""},{"min":5,"kind":"cards","ref":"weak","title":"⑥ 마무리 — 약한 카드만","note":"✗ 카드는 다음 날 다시"}]},{"id":"s8","name":"8장 하루 완주 + 7–8장 섞어 복습 (4h 20m)","goal":"8장 p.1–42 완주 + 7장 ✗ 재확인 + 섞어 풀기","blocks":[{"min":15,"kind":"cards","ref":"weak","title":"전날 ✗ 카드 (7장 간격 복습)","note":"간격 두기 효과 — 다음 날 ✗만"},{"min":10,"kind":"read","ref":"ch8note","title":"① 큰 그림 — 머리말 + p.N 제목만","note":"동기 이론(p.2–8) · 배고픔(p.9–18) · 소속·성취(p.19–28) · 정서(p.29–42)"},{"min":40,"kind":"read","ref":"ch8note","title":"② 동기 파트 정독 (p.1–28)","note":"p.8 동기 이론 표, 식욕 호르몬 촉진/억제 표"},{"min":5,"kind":"break","title":"휴식"},{"min":20,"kind":"cards","ref":"ch8","title":"④ 명칭 셀프 테스트 — 동기","note":""},{"min":35,"kind":"read","ref":"ch8note","title":"② 정서 파트 정독 (p.29–42)","note":"p.33 정서 이론 표. 라자루스 ⚠️ 주의"},{"min":10,"kind":"break","title":"휴식 (스트레칭)"},{"min":10,"kind":"read","ref":"ch8note","title":"③ 🎙 수업 기록 + ⑤ 헷갈리는 쌍","note":"10/27 녹음은 p.1–2까지만 — 본능 예시(신생아 반사) 확인"},{"min":20,"kind":"cards","ref":"ch8","title":"명칭 카드 2회차 — 정서","note":""},{"min":30,"kind":"quiz","ref":"ch8","title":"8장 문제 18개","count":18,"note":""},{"min":5,"kind":"break","title":"휴식"},{"min":35,"kind":"quiz","ref":"all","title":"7–8장 섞어 20개","count":20,"note":"실전처럼 — 객관식은 보기 전부 판정"},{"min":15,"kind":"review","title":"오답노트 다시 풀기","note":""},{"min":10,"kind":"cards","ref":"all","title":"⑥ 마무리 — 전체 카드 훑기","note":"✗ 표시한 명칭만 다음 날 다시"}]}]}}</script>
<script>window.BUILT="2026-11-02 08:12";window.COURSE_ID="psy-final";</script>
<script>/* 기내학습 앱 — 의존성 없음, localStorage 상태 */
(() => {
  const D = JSON.parse(document.getElementById('data').textContent);
  const KEY = 'pocket-' + window.COURSE_ID;
  const $ = (s, r = document) => r.querySelector(s);
  const app = $('#app');
  const CH = Object.fromEntries(D.course.chapters.map(c => [c.id, c.label]));
  const chLabel = id => id === 'all' ? '전체' : id === 'weak' ? '약한 카드' : id === 'wrong' ? '오답' : (CH[id] || id);

  // ---------- state ----------
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { S = {}; }
  S.cards ||= {};      // id -> {box, seen, wrong, due}
  S.quiz ||= {};       // id -> {n, wrong, last:'ok'|'no'}
  S.done ||= {};       // plan block key -> true
  S.read ||= {};       // reading id -> {done, pos}
  S.timer ||= null;    // {key, end, left, running}
  S.set ||= { fs: 17, theme: 'auto' };
  S.log ||= [];        // quiz session results [{t, ch, n, ok}]
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } };
  const applySet = () => { document.documentElement.style.setProperty('--fs', S.set.fs + 'px'); document.documentElement.dataset.theme = S.set.theme === 'auto' ? '' : S.set.theme; };
  applySet();

  // ---------- helpers ----------
  const h = (s) => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[a[i], a[j]] = [a[j], a[i]]; } return a; };
  const norm = s => (s || '').toString().toLowerCase().normalize('NFC').replace(/[\s\-_·,.()\[\]'"’“”「」]/g, '');
  const fmt = sec => { sec = Math.max(0, Math.round(sec)); return `${String(sec / 60 | 0).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`; };
  const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch { } };
  const cardsOf = ref => ref === 'all' ? D.cards : ref === 'weak' ? D.cards.filter(c => (S.cards[c.id]?.box ?? 0) <= 1 && S.cards[c.id]?.seen) : D.cards.filter(c => c.ch === ref);
  const quizOf = ref => ref === 'all' ? D.quiz : ref === 'wrong' ? D.quiz.filter(q => S.quiz[q.id]?.last === 'no') : D.quiz.filter(q => q.ch === ref);

  // ---------- router ----------
  let tab = location.hash.slice(1).split('/')[0] || 'home';
  const view = { home: {}, read: {}, cards: {}, quiz: {}, stats: {} };
  const render = () => {
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    ({ home: renderHome, read: renderRead, cards: renderCards, quiz: renderQuiz, stats: renderStats })[tab]();
    if (!view[tab].keepScroll) window.scrollTo(0, 0);
  };
  const go = (t, extra = {}) => { tab = t; Object.assign(view[t], extra); location.hash = t; render(); };
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));

  // ---------- 홈: 플랜 + 타이머 ----------
  let tick = null;
  function timerLeft() { const t = S.timer; if (!t) return 0; return t.running ? (t.end - Date.now()) / 1000 : t.left; }
  function startTimer(key, min) { S.timer = { key, running: true, end: Date.now() + min * 60000, left: min * 60, total: min * 60 }; save(); }
  function toggleTimer() { const t = S.timer; if (!t) return; if (t.running) { t.left = timerLeft(); t.running = false; } else { t.end = Date.now() + t.left * 1000; t.running = true; } save(); render(); }
  function renderHome() {
    clearInterval(tick);
    const sid = view.home.session || D.plan.sessions[0].id;
    const ses = D.plan.sessions.find(s => s.id === sid) || D.plan.sessions[0];
    const total = ses.blocks.reduce((a, b) => a + b.min, 0);
    const doneMin = ses.blocks.reduce((a, b, i) => a + (S.done[`${ses.id}:${i}`] ? b.min : 0), 0);
    const curIdx = ses.blocks.findIndex((b, i) => !S.done[`${ses.id}:${i}`]);
    const t = S.timer;
    const kindLabel = { read: '읽기', cards: '카드', quiz: '문제', review: '복습', break: '휴식' };
    app.innerHTML = `
      <h1>${h(D.course.title)}</h1>
      <div class="mute">${h(D.course.subtitle || '')}</div>
      <div class="card small">📅 ${h(D.course.exam || '')}</div>
      ${t ? `<div class="card timer">
        <div class="mute">${h(t.key)}</div>
        <div class="big" id="tbig">${fmt(timerLeft())}</div>
        <div class="bar"><i id="tbar" style="width:${(1 - timerLeft() / t.total) * 100}%"></i></div>
        <div class="row" style="justify-content:center;margin-top:10px">
          <button id="tpause">${t.running ? '⏸ 일시정지' : '▶ 계속'}</button>
          <button id="tplus" class="sm">+5분</button>
          <button id="tstop" class="sm">■ 끝</button>
        </div></div>` : ''}
      <div class="chips">${D.plan.sessions.map(s => `<button class="${s.id === ses.id ? 'on' : ''}" data-s="${s.id}">${h(s.name)}</button>`).join('')}</div>
      <div class="card">
        <div class="row" style="justify-content:space-between"><b>${h(ses.goal || '')}</b><span class="mute">${doneMin} / ${total}분</span></div>
        <div class="bar" style="margin:8px 0 6px"><i style="width:${total ? doneMin / total * 100 : 0}%"></i></div>
        ${ses.blocks.map((b, i) => {
          const k = `${ses.id}:${i}`, done = !!S.done[k];
          return `<div class="block ${done ? 'done' : ''} ${i === curIdx ? 'cur' : ''}" data-i="${i}">
            <div class="chk" data-chk="${k}">${done ? '✓' : ''}</div>
            <div style="flex:1">
              <div class="t"><span class="kind">${kindLabel[b.kind] || b.kind}</span>${h(b.title)}</div>
              ${b.note ? `<div class="n">${h(b.note)}</div>` : ''}
              ${b.kind !== 'break' && b.kind !== 'review' && b.ref ? `<div class="n">→ ${h(b.kind === 'read' ? (D.reading.find(r => r.id === b.ref)?.title || b.ref) : chLabel(b.ref))}${b.count ? ` · ${b.count}문제` : ''}</div>` : ''}
              <div class="row" style="margin-top:6px"><button class="sm acc" data-go="${i}">▶ 시작 (${b.min}분)</button></div>
            </div>
            <div class="min">${b.min}분</div>
          </div>`; }).join('')}
      </div>
      <div class="card small">
        <b>시험장 체크</b><ul class="clean">${(D.course.tips || []).map(t => `<li>${t}</li>`).join('')}</ul>
      </div>
      <div class="card small">
        <div class="row" style="justify-content:space-between">
          <span>글자 크기</span><span><button class="sm" id="fsm">A−</button> <button class="sm" id="fsp">A+</button></span></div>
        <div class="row" style="justify-content:space-between;margin-top:6px">
          <span>테마</span><span>${['auto', 'light', 'dark'].map(x => `<button class="sm ${S.set.theme === x ? 'acc' : ''}" data-th="${x}">${{ auto: '자동', light: '밝게', dark: '어둡게' }[x]}</button>`).join(' ')}</span></div>
        <div class="mute" style="margin-top:8px">빌드 ${window.BUILT} · 오프라인 동작 (한 번 열어두면 비행기에서도 열림)</div>
      </div>`;
    app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { view.home.session = b.dataset.s; render(); });
    app.querySelectorAll('[data-chk]').forEach(b => b.onclick = () => { const k = b.dataset.chk; S.done[k] = !S.done[k]; save(); render(); });
    app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
      const i = +b.dataset.go, blk = ses.blocks[i];
      startTimer(`${ses.name} · ${blk.title}`, blk.min);
      if (blk.kind === 'read') go('read', { open: blk.ref });
      else if (blk.kind === 'cards') { view.cards.ref = blk.ref || 'all'; startDeck(); go('cards'); }
      else if (blk.kind === 'quiz') { view.quiz.ref = blk.ref || 'all'; view.quiz.count = blk.count || 10; startQuiz(); go('quiz'); }
      else if (blk.kind === 'review') { view.quiz.ref = 'wrong'; view.quiz.count = 99; startQuiz(); go('quiz'); }
      else render();
    });
    $('#fsm').onclick = () => { S.set.fs = Math.max(14, S.set.fs - 1); save(); applySet(); };
    $('#fsp').onclick = () => { S.set.fs = Math.min(24, S.set.fs + 1); save(); applySet(); };
    app.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { S.set.theme = b.dataset.th; save(); applySet(); render(); });
    if (t) {
      $('#tpause').onclick = toggleTimer;
      $('#tplus').onclick = () => { if (t.running) t.end += 300000; else t.left += 300; t.total += 300; save(); render(); };
      $('#tstop').onclick = () => { S.timer = null; save(); render(); };
      tick = setInterval(() => { const l = timerLeft(); const e = $('#tbig'); if (!e) return clearInterval(tick); e.textContent = fmt(l); $('#tbar').style.width = `${(1 - l / t.total) * 100}%`; if (t.running && l <= 0) { t.running = false; t.left = 0; save(); vib([200, 100, 200, 100, 400]); e.textContent = '⏰ 끝'; clearInterval(tick); } }, 500);
    }
  }

  // ---------- 읽기 ----------
  function renderRead() {
    const id = view.read.open;
    if (id) {
      const r = D.reading.find(x => x.id === id); if (!r) { view.read.open = null; return renderRead(); }
      const st = S.read[id] || {};
      app.innerHTML = `
        <div class="sticky row" style="justify-content:space-between">
          <button class="sm" id="back">‹ 목록</button>
          <span class="mute small ttl">${h(r.title)}</span>
          <span><button class="sm" id="fsm">A−</button> <button class="sm" id="fsp">A+</button></span>
        </div>
        <div class="article">${r.html}</div>
        <div class="fab"><button id="back2">‹ 목록</button><button class="acc" id="donebtn">${st.done ? '✓ 읽음 (해제)' : '✓ 다 읽음'}</button></div>`;
      const back = () => { st.pos = window.scrollY; S.read[id] = st; save(); view.read.open = null; render(); };
      $('#back').onclick = back; $('#back2').onclick = back;
      $('#donebtn').onclick = () => { st.done = !st.done; S.read[id] = st; save(); back(); };
      $('#fsm').onclick = () => { S.set.fs = Math.max(14, S.set.fs - 1); save(); applySet(); };
      $('#fsp').onclick = () => { S.set.fs = Math.min(24, S.set.fs + 1); save(); applySet(); };
      requestAnimationFrame(() => window.scrollTo(0, st.pos || 0));
      let saveT; window.onscroll = () => { clearTimeout(saveT); saveT = setTimeout(() => { if (view.read.open === id) { st.pos = window.scrollY; S.read[id] = st; save(); } }, 400); };
      return;
    }
    window.onscroll = null;
    app.innerHTML = `<h1>읽기</h1><div class="mute">정리본·공식집·풀이. 위치가 저장되니 끊겼다 이어 읽어도 됩니다.</div>
      ${D.reading.map(r => `<div class="card" data-open="${r.id}" style="cursor:pointer">
        <div class="row" style="justify-content:space-between"><b>${S.read[r.id]?.done ? '✅ ' : ''}${h(r.title)}</b><span class="mute small">~${r.min}분</span></div>
        <div class="mute small">${h(r.desc)}</div></div>`).join('')}`;
    app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { view.read.open = b.dataset.open; render(); });
  }

  // ---------- 카드 (Leitner 3상자 + 세션 내 재출제) ----------
  const deck = { queue: [], cur: null, flipped: false, n: 0, again: 0 };
  function startDeck() {
    const ref = view.cards.ref || 'all';
    let pool = cardsOf(ref);
    // 우선순위: 모르는(box0) > 안 본 > box1 > box2 > box3, 각 그룹 셔플
    const key = c => { const s = S.cards[c.id]; return !s ? 1 : s.box === 0 ? 0 : s.box + 1; };
    const groups = {}; for (const c of shuffle(pool)) (groups[key(c)] ||= []).push(c);
    deck.queue = [0, 1, 2, 3, 4].flatMap(k => groups[k] || []);
    deck.total = deck.queue.length; deck.n = 0; deck.again = 0; deck.flipped = false; deck.cur = deck.queue.shift() || null;
  }
  function grade(g) {
    const c = deck.cur; if (!c) return;
    const s = S.cards[c.id] || { box: 0, seen: 0, wrong: 0 };
    s.seen++;
    if (g === 0) { s.box = 0; s.wrong++; deck.queue.splice(Math.min(6, deck.queue.length), 0, c); deck.again++; }
    else if (g === 1) { s.box = Math.max(1, s.box); deck.queue.splice(Math.min(15, deck.queue.length), 0, c); }
    else s.box = Math.min(3, (s.box || 0) + 1);
    S.cards[c.id] = s; save();
    deck.n++; deck.flipped = false; deck.cur = deck.queue.shift() || null; render();
  }
  function renderCards() {
    const ref = view.cards.ref || 'all';
    if (!deck.cur && deck.total === undefined) startDeck();
    const boxes = [0, 0, 0, 0], pool = cardsOf(ref); let unseen = 0;
    for (const c of pool) { const s = S.cards[c.id]; if (!s) unseen++; else boxes[s.box]++; }
    const chips = ['all', ...D.course.chapters.map(c => c.id), 'weak'];
    const head = `<h1>카드</h1>
      <div class="chips">${chips.map(x => `<button class="${x === ref ? 'on' : ''}" data-ref="${x}">${h(chLabel(x))}${x === 'weak' ? ` (${cardsOf('weak').length})` : ''}</button>`).join('')}</div>
      <div class="mute small">${pool.length}장 · 안 봄 ${unseen} · <span style="color:var(--bad)">모름 ${boxes[0]}</span> · <span style="color:var(--warn)">애매 ${boxes[1]}</span> · <span style="color:var(--ok)">앎 ${boxes[2] + boxes[3]}</span></div>`;
    const c = deck.cur;
    if (!c) {
      app.innerHTML = head + `<div class="card center"><p>${deck.total ? `이 묶음 끝. ${deck.n}번 넘김, 다시 ${deck.again}회.` : '카드가 없습니다.'}</p>
        <button class="acc" id="restart">${deck.total ? '다시 (모름 → 안 본 것 순)' : '시작'}</button></div>`;
    } else {
      app.innerHTML = head + `
        <div class="mute small">${deck.n + 1} / ${deck.n + deck.queue.length + 1} · <span class="tag">${h(CH[c.ch] || c.ch)}</span><span class="tag">${h(c.tag)}</span></div>
        <div class="card flash" id="flash">
          <div><div class="side">Q</div>${c.front}</div>
          ${deck.flipped ? `<div class="back"><div class="side">A</div>${c.back}<div class="src">${h(c.src)}</div></div>` : `<div class="mute center" style="margin-top:20px">탭해서 뒤집기</div>`}
        </div>
        ${deck.flipped ? `<div class="grade"><button class="b0" data-g="0">모름<br><span class="small">곧 다시</span></button><button class="b1" data-g="1">애매<br><span class="small">나중에 다시</span></button><button class="b2" data-g="2">앎<br><span class="small">다음 상자</span></button></div>`
          : `<div class="row" style="justify-content:space-between"><button class="sm" id="skip">건너뛰기</button><button class="acc" id="flip">뒤집기</button></div>`}`;
      $('#flash').onclick = () => { deck.flipped = !deck.flipped; render(); };
      if (deck.flipped) app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => grade(+b.dataset.g));
      else { $('#flip').onclick = () => { deck.flipped = true; render(); }; $('#skip').onclick = () => { deck.queue.push(deck.cur); deck.cur = deck.queue.shift(); render(); }; }
    }
    app.querySelectorAll('[data-ref]').forEach(b => b.onclick = () => { view.cards.ref = b.dataset.ref; startDeck(); render(); });
    const rs = $('#restart'); if (rs) rs.onclick = () => { startDeck(); render(); };
  }

  // ---------- 문제 ----------
  const qz = { list: [], i: 0, picked: null, input: '', shown: false, ok: 0, results: [] };
  function startQuiz() {
    const ref = view.quiz.ref || 'all', count = view.quiz.count || 10;
    let pool = quizOf(ref);
    // 우선순위: 틀린 것 > 안 푼 것 > 맞힌 것
    const key = q => { const s = S.quiz[q.id]; return !s ? 1 : s.last === 'no' ? 0 : 2; };
    const groups = {}; for (const q of shuffle(pool)) (groups[key(q)] ||= []).push(q);
    qz.list = [0, 1, 2].flatMap(k => groups[k] || []).slice(0, count);
    qz.i = 0; qz.picked = null; qz.input = ''; qz.shown = false; qz.ok = 0; qz.results = []; qz.started = true;
  }
  function check(q) {
    if (q.type === 'mc') return qz.picked === q.answer;
    if (q.type === 'num') { const raw = qz.input.replace(/,/g, '').replace(/[\u2212\u2013]/g, '-').replace(/\uFF0B/g, '+').trim(); const fr = raw.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/); const v = fr ? +fr[1] / +fr[2] : parseFloat(raw); if (isNaN(v)) return false; const a = q.answer.value, tol = q.answer.tol ?? 0.03; return Math.abs(v - a) <= Math.max(Math.abs(a) * tol, 1e-12); }
    const n = norm(qz.input); return !!n && [q.answer, ...(q.alts || [])].some(a => norm(a) === n);
  }
  function submit(q, forceOk) {
    const ok = forceOk ?? check(q);
    const s = S.quiz[q.id] || { n: 0, wrong: 0 }; s.n++; if (!ok) s.wrong++; s.last = ok ? 'ok' : 'no'; S.quiz[q.id] = s;
    if (forceOk === undefined) { qz.results.push({ id: q.id, ok }); if (ok) qz.ok++; }
    else { const r = qz.results.find(x => x.id === q.id); if (r && !r.ok) { r.ok = true; qz.ok++; } }
    qz.shown = true; save(); render();
  }
  function renderQuiz() {
    const ref = view.quiz.ref || 'all', count = view.quiz.count || 10;
    const chips = ['all', ...D.course.chapters.map(c => c.id), 'wrong'];
    const head = `<h1>문제</h1>
      <div class="chips">${chips.map(x => `<button class="${x === ref ? 'on' : ''}" data-ref="${x}">${h(chLabel(x))}${x === 'wrong' ? ` (${quizOf('wrong').length})` : ''}</button>`).join('')}</div>`;
    if (!qz.started) {
      const pool = quizOf(ref); const solved = pool.filter(q => S.quiz[q.id]).length;
      app.innerHTML = head + `<div class="card">
        <div><b>${h(chLabel(ref))}</b> · ${pool.length}문제 (푼 것 ${solved})</div>
        <div class="row" style="margin:10px 0">문항 수 ${[5, 10, 20, 99].map(n => `<button class="sm ${count === n ? 'acc' : ''}" data-n="${n}">${n === 99 ? '전부' : n}</button>`).join('')}</div>
        <div class="mute small">틀린 것 → 안 푼 것 → 맞힌 것 순으로 나옵니다. 단답은 띄어쓰기·대소문자 무시, 숫자는 오차 허용.</div>
        <button class="acc" id="start" style="margin-top:10px;width:100%" ${pool.length ? '' : 'disabled'}>시작</button></div>`;
      app.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { view.quiz.count = +b.dataset.n; render(); });
      $('#start').onclick = () => { startQuiz(); render(); };
    } else if (qz.i >= qz.list.length) {
      const wrong = qz.results.filter(r => !r.ok);
      if (!qz.logged) { S.log.push({ t: Date.now(), ch: ref, n: qz.list.length, ok: qz.ok }); qz.logged = true; save(); }
      app.innerHTML = head + `<div class="card center"><h2>${qz.ok} / ${qz.list.length}</h2>
        <div class="mute">${wrong.length ? `틀린 ${wrong.length}문제는 오답 목록에 들어갔습니다.` : '전부 정답 🎉'}</div>
        <div class="row" style="justify-content:center;margin-top:10px">
          ${wrong.length ? `<button class="acc" id="retry">틀린 것만 다시</button>` : ''}<button id="again">새로 ${count === 99 ? '전부' : count + '문제'}</button></div></div>
        ${wrong.map(r => { const q = D.quiz.find(x => x.id === r.id); return `<div class="card small"><div>${q.q}</div><div class="sol">${q.type === 'mc' ? `정답 ${'①②③④'[q.answer]} ${q.choices[q.answer]}` : q.type === 'num' ? `정답 ${q.answer.value} ${h(q.answer.unit || '')}` : `정답 ${q.answerHtml}`}</div></div>`; }).join('')}`;
      const rt = $('#retry'); if (rt) rt.onclick = () => { qz.list = wrong.map(r => D.quiz.find(x => x.id === r.id)); qz.i = 0; qz.picked = null; qz.input = ''; qz.shown = false; qz.ok = 0; qz.results = []; qz.logged = false; render(); };
      $('#again').onclick = () => { startQuiz(); render(); };
    } else {
      const q = qz.list[qz.i]; const st = S.quiz[q.id];
      const ok = qz.shown ? (qz.results.find(r => r.id === q.id)?.ok) : null;
      app.innerHTML = head + `
        <div class="row" style="justify-content:space-between"><span class="mute small">${qz.i + 1} / ${qz.list.length} · <span class="tag">${h(CH[q.ch] || q.ch)}</span><span class="tag">${{ mc: '객관식', sa: '단답', num: '계산' }[q.type]}</span>${'★'.repeat(q.diff || 1)}${q.prof ? ' <span class="prof">🎙</span>' : ''}</span><button class="sm" id="quit">그만</button></div>
        <div class="card"><div>${q.q}</div>
        ${q.type === 'mc' ? q.choices.map((c, i) => `<button class="choice ${qz.shown ? (i === q.answer ? 'ok' : i === qz.picked ? 'no' : '') : (i === qz.picked ? 'pick' : '')}" data-c="${i}" ${qz.shown ? 'disabled' : ''}>${'①②③④'[i]} ${c}</button>`).join('')
          : `<div style="margin-top:10px"><input type="text" id="ans" inputmode="${q.type === 'num' ? 'decimal' : 'text'}" placeholder="${q.type === 'num' ? `숫자 (${h(q.answer.unit || '')})` : '답 입력'}" value="${h(qz.input)}" ${qz.shown ? 'disabled' : ''} autocomplete="off"></div>`}
        ${qz.shown ? `<div class="verdict ${ok ? 'ok' : 'no'}">${ok ? '⭕ 정답' : '❌ 오답'} ${q.type === 'mc' ? '' : q.type === 'num' ? `· 정답 <b>${q.answer.value} ${h(q.answer.unit || '')}</b>` : `· 정답 <b>${q.answerHtml}</b>${q.alts?.length ? ` <span class="mute small">(${q.alts.map(h).join(', ')})</span>` : ''}`}</div>
           <div class="sol">${q.solution}</div><div class="src">${h(q.src)}${st ? ` · 시도 ${st.n}회, 오답 ${st.wrong}회` : ''}</div>` : ''}
        </div>
        <div class="fab">${qz.shown
          ? `${!ok && q.type !== 'mc' ? `<button class="sm" id="selfok">맞은 걸로 처리</button>` : '<span></span>'}<button class="acc" id="next">${qz.i + 1 < qz.list.length ? '다음 →' : '결과 보기'}</button>`
          : `<button class="sm" id="reveal">모르겠음 (정답 보기)</button><button class="acc" id="submit" ${q.type === 'mc' && qz.picked === null ? 'disabled' : ''}>확인</button>`}</div>`;
      app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { if (qz.shown) return; qz.picked = +b.dataset.c; render(); });
      const inp = $('#ans'); if (inp) { inp.oninput = e => { qz.input = e.target.value; $('#submit') && ($('#submit').disabled = false); }; inp.onkeydown = e => { if (e.key === 'Enter' && !qz.shown) submit(q); }; if (!qz.shown && view.quiz.focus) inp.focus(); }
      $('#quit').onclick = () => { qz.started = false; qz.list = []; render(); };
      if (qz.shown) { $('#next').onclick = () => { qz.i++; qz.picked = null; qz.input = ''; qz.shown = false; render(); }; const so = $('#selfok'); if (so) so.onclick = () => submit(q, true); }
      else { $('#submit').onclick = () => submit(q); $('#reveal').onclick = () => { qz.picked = qz.picked ?? -1; submit(q, false); }; }
    }
    app.querySelectorAll('[data-ref]').forEach(b => b.onclick = () => { view.quiz.ref = b.dataset.ref; qz.started = false; render(); });
  }

  // ---------- 기록 ----------
  function renderStats() {
    const rows = D.course.chapters.map(c => {
      const cs = D.cards.filter(x => x.ch === c.id), qs = D.quiz.filter(x => x.ch === c.id);
      const know = cs.filter(x => (S.cards[x.id]?.box ?? 0) >= 2).length, dont = cs.filter(x => S.cards[x.id]?.box === 0).length;
      const tried = qs.filter(x => S.quiz[x.id]).length, right = qs.filter(x => S.quiz[x.id]?.last === 'ok').length;
      return `<tr><td>${h(c.label)}</td><td><span style="color:var(--ok)">${know}</span>/<span style="color:var(--bad)">${dont}</span>/${cs.length}</td><td>${right}/${tried}/${qs.length}</td></tr>`;
    }).join('');
    const wrong = D.quiz.filter(q => S.quiz[q.id]?.last === 'no');
    const weak = D.cards.filter(c => S.cards[c.id]?.box === 0);
    const readDone = D.reading.filter(r => S.read[r.id]?.done).length;
    app.innerHTML = `<h1>기록</h1>
      <div class="card"><table class="tbl"><tr><th>단원</th><th>카드 앎/모름/전체</th><th>문제 정답/시도/전체</th></tr>${rows}</table>
      <div class="mute small" style="margin-top:6px">읽기 완료 ${readDone}/${D.reading.length}</div></div>
      <div class="card"><div class="row" style="justify-content:space-between"><b>오답 ${wrong.length}</b>${wrong.length ? `<button class="sm acc" id="rewrong">오답 다시 풀기</button>` : ''}</div>
        ${wrong.slice(0, 40).map(q => `<div class="small" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="tag">${h(CH[q.ch] || q.ch)}</span>${q.q}</div>`).join('')}</div>
      <div class="card"><div class="row" style="justify-content:space-between"><b>모름 카드 ${weak.length}</b>${weak.length ? `<button class="sm acc" id="reweak">모름 카드 돌리기</button>` : ''}</div>
        ${weak.slice(0, 40).map(c => `<div class="small" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="tag">${h(CH[c.ch] || c.ch)}</span>${c.front}<div class="mute">${c.back}</div></div>`).join('')}</div>
      <div class="card small"><b>문제 세션 기록</b>${S.log.slice(-15).reverse().map(l => `<div>${new Date(l.t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })} · ${h(chLabel(l.ch))} · ${l.ok}/${l.n}</div>`).join('') || '<div class="mute">아직 없음</div>'}</div>
      <div class="card small"><div class="row"><button class="sm" id="exp">진행 상태 복사</button><button class="sm" id="imp">붙여넣어 복원</button><button class="sm" id="reset" style="color:var(--bad)">전체 초기화</button></div>
        <div class="mute" style="margin-top:6px">기기를 바꿀 때 복사 → 붙여넣기. 초기화는 되돌릴 수 없습니다.</div></div>`;
    const rw = $('#rewrong'); if (rw) rw.onclick = () => { view.quiz.ref = 'wrong'; view.quiz.count = 99; startQuiz(); go('quiz'); };
    const rk = $('#reweak'); if (rk) rk.onclick = () => { view.cards.ref = 'weak'; startDeck(); go('cards'); };
    $('#exp').onclick = async () => { const s = JSON.stringify(S); try { await navigator.clipboard.writeText(s); alert('복사됨'); } catch { prompt('복사하세요', s); } };
    $('#imp').onclick = () => { const s = prompt('상태 JSON 붙여넣기'); if (!s) return; try { const o = JSON.parse(s); if (!o.cards) throw 0; S = o; save(); location.reload(); } catch { alert('형식 오류'); } };
    $('#reset').onclick = () => { if (confirm('카드·문제·플랜 진행을 모두 지울까요?')) { localStorage.removeItem(KEY); location.reload(); } };
  }

  // ---------- boot ----------
  render();
  window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (view[t] && t !== tab) { tab = t; render(); } });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
</body>
</html>
