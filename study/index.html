고픔</strong>을 느낌(Tsang). 위 수축·쓰라림만이 배고픔의 유일한 요인은 아니다.</li>\n<li>⚠️ 슬라이드 &quot;Tsang, 1989&quot; — 교재(마이어스)에는 <strong>Tsang, 1938</strong>로 실려 있음. 연도 오기 가능성. 연도를 묻는 문제는 피할 것.</li>\n</ul>\n<h2>p.11 — 신체의 화학적 기제와 두뇌 (1): 혈당 ⭐⭐</h2>\n<ul>\n<li><strong>혈당(blood glucose)</strong>: 신체의 주 에너지원. 혈당의 변화를 감지해 배고픔에 대한 <strong>화학적 기제</strong> 수행(혈당이 떨어지면 배고픔 — 교재 표준).</li>\n<li>혈액 내 화학적 변화와 신체 내적 상태를 <strong>두뇌의 담당 영역(시상하부)</strong> 에서 감지 → 배고픔에 대한 행동 기제 추진.</li>\n<li>그림: &quot;시상하부의 위치(좌)&quot;, &quot;식욕 관련 호르몬(우)&quot;(p.11–14 공통).</li>\n</ul>\n<h2>p.12 — 신체의 화학적 기제와 두뇌 (2): 시상하부 ⭐⭐⭐</h2>\n<ul>\n<li><strong>시상하부의 궁상핵(arcuate nucleus)</strong>: 입맛(식욕)을 <strong>촉진</strong>하는 호르몬 분비(슬라이드: <strong>오렉신</strong>).</li>\n<li>혈관을 통해 시상하부와 신체 각 영역이 연결 → 혈액의 화학 신호를 읽는다.</li>\n<li><strong>시상하부(식욕 촉진 부위) 손상</strong> 시 굶주린 동물도 먹이에 <strong>관심을 보이지 않음</strong>.</li>\n<li>반대로 두뇌의 <strong>식욕 억제 중추</strong>가 손상되면 섭식의 <strong>중단이 이루어지지 않음</strong>(Duggan &amp; Booth, 1986) → 과식·비만.</li>\n<li>교재 표준 보충: 식욕 촉진 = 외측 시상하부 쪽, 식욕 억제 = 복내측 시상하부 쪽(구식 &quot;배고픔 중추/포만 중추&quot; 구분). 슬라이드는 부위 이름 없이 &quot;식욕 억제 중추&quot;로만 적음.</li>\n<li>⚠️ 마이어스 교재에서 <strong>오렉신(orexin)</strong> 은 &quot;시상하부가 분비하는 배고픔 유발 호르몬&quot;이고, 궁상핵은 &quot;식욕 촉진 호르몬(과 억제 호르몬)을 분비하는 신경 회로&quot;로 따로 서술된다. 슬라이드처럼 &quot;궁상핵 = 오렉신&quot;으로 직결하는 것은 다소 단순화 — 시험에서는 <strong>오렉신 = 식욕 촉진(배고픔 유발)</strong>, <strong>시상하부 = 배고픔 조절 중추</strong>로 기억하면 안전.</li>\n</ul>\n<h2>p.13 — 식욕 관련 호르몬: 그렐린·PYY·렙틴 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>호르몬</th>\n<th>분비 부위</th>\n<th>신호</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>그렐린(ghrelin)</strong></td>\n<td><strong>위</strong>(공복 상태)</td>\n<td>뇌에 &quot;<strong>배고프다</strong>&quot;</td>\n</tr>\n<tr>\n<td><strong>PYY</strong></td>\n<td><strong>소화관</strong></td>\n<td>뇌에 &quot;<strong>배가 고프지 않다</strong>&quot;</td>\n</tr>\n<tr>\n<td><strong>렙틴(leptin)</strong></td>\n<td><strong>지방세포</strong> (단백질 호르몬)</td>\n<td><strong>배고픔 감소</strong> (지방이 충분하다는 신호)</td>\n</tr>\n<tr>\n<td><strong>오렉신(orexin)</strong> (p.12)</td>\n<td>시상하부</td>\n<td>식욕 <strong>촉진</strong></td>\n</tr>\n</tbody></table>\n<ul>\n<li>외우는 요령: <strong>그렐린 = 꼬르륵(위, 배고픔)</strong>, <strong>렙틴 = 지방이 &quot;이제 그만&quot;</strong>. 촉진(그렐린·오렉신) vs 억제(PYY·렙틴) 구분이 객관식 단골.</li>\n<li>교재 표준 보충: 이 밖에 <strong>인슐린</strong>(췌장, 혈당 조절)도 식욕 관련 호르몬으로 교재 표에 나온다(슬라이드에는 없음).</li>\n<li>⚠️ 슬라이드 &quot;렙틴을 <strong>분배</strong>하여&quot; = <strong>분비</strong>의 오타.</li>\n</ul>\n<h2>p.14 — 조절점과 기초대사율: 요요 현상 ⭐⭐⭐</h2>\n<ul>\n<li>섭식 호르몬과 두뇌 활동의 상호작용으로 <strong>요요 현상</strong>을 설명할 수 있다. 사람은 <strong>일정한 체중을 유지하려는 경향성</strong>이 있다(체중의 항상성).</li>\n<li><strong>조절점(set point)</strong>: 신체가 설정한 특정 체중 지점.</li>\n<li><strong>기초대사율(basal metabolic rate, BMR)</strong>: 신체의 기본 에너지 소비율(휴식 상태에서).</li>\n<li>체중이 조절점 아래로 내려가면 배고픔이 늘고 <strong>기초대사율이 낮아져</strong>(에너지 절약), 위로 올라가면 반대 → <strong>기초대사율과 신체 활동의 비율을 조정</strong>해 <strong>일정한 조절점으로 회귀</strong>. 다이어트 후 요요가 오는 이유.</li>\n<li>교재 표준 보충: 조절점이 고정된 값이 아니라 환경에 따라 서서히 바뀐다는 뜻에서 <strong>안착점(settling point)</strong> 이라는 용어도 쓰인다.</li>\n</ul>\n<h2>p.15 — 배고픔의 심리학: 기억과 식사 ⭐⭐</h2>\n<ul>\n<li>식사와 <strong>포만감에 대한 인식은 기억에 근거</strong>하여 작동.</li>\n<li><strong>기억상실증 환자</strong>(6장: 새 기억을 못 만드는 순행성)는 점심 식사 후 그 기억을 유지하지 못해 <strong>끊임없이 식사를 반복</strong>(Rozin et al., 1998).</li>\n<li>언제 먹을지 결정하는 요인 중 하나가 <strong>마지막 식사에 대한 기억</strong>(&quot;밥 먹은 지 OO시간밖에 안 됐어&quot;).</li>\n<li>그림: &quot;기억 상실증 환자의 반복 식사(Rozin et al., 1998)&quot;.</li>\n</ul>\n<h2>p.16 — 맛 선호: 생물학적 + 문화적 요인 ⭐⭐</h2>\n<ul>\n<li><strong>맛 선호</strong>에는 생물학적 요인과 문화적 요인이 모두 개입(선천 + 후천).</li>\n<li>스트레스로 인한 <strong>단 음식 선호</strong>는 <strong>세로토닌</strong> 분비를 촉진(Boggiano et al., 2005) — 탄수화물이 기분을 진정시키는 기제(교재 표준).</li>\n<li><strong>단맛과 짠맛에 대한 선호는 유전적이며 보편적</strong>.</li>\n<li>그러나 다른 맛에 대한 선호는 <strong>조건형성</strong>된 부분이 존재 → 일부 음식에 대한 <strong>불쾌한 경험은 혐오를 발전</strong>시킴(5장 <strong>맛 혐오 학습</strong>, Garcia 효과와 연결).</li>\n</ul>\n<h2>p.17 — 낯섦 공포증 (neophobia) ⭐⭐⭐</h2>\n<ul>\n<li><strong>낯섦 공포증(새것 공포증, neophobia)</strong>: <strong>이전에 먹은 적 없는 음식을 기피</strong>하는 경향성.<ul>\n<li>근거: 낯선 음식은 <strong>독이 들어 있을 가능성</strong>이 높다는 판단(진화적 적응).</li>\n<li>문화권별 차이: 서양권의 <strong>두족류·해조류 혐오</strong>, 종교별 <strong>금기 음식</strong>.</li>\n</ul>\n</li>\n<li>교재 표준 보충: 낯선 음식도 <strong>반복 노출</strong>하면 점점 좋아진다.</li>\n<li>단답형 후보: &quot;처음 보는 음식을 꺼리는 경향&quot; → <strong>낯섦 공포증</strong>.</li>\n</ul>\n<h2>p.18 — 식사 상황의 영향 ⭐</h2>\n<ul>\n<li><strong>친구와 같이 있을 때 더 많이</strong> 먹는 경향(Cummings &amp; Tomiyama, 2019) — 교재의 <strong>사회적 촉진</strong>.</li>\n<li>반면 <strong>데이트 중에는 더 적게</strong> 먹음(Baker et al., 2019) — 인상 관리.</li>\n<li><strong>제공되는 음식 양</strong>에 맞춰 섭취량을 조절(DiSantis et al., 2013) — 교재의 <strong>단위 편향(unit bias)</strong>: 1인분 크기가 크면 더 먹는다.</li>\n<li><strong>지정 메뉴보다 뷔페</strong>에서 섭취량이 늘어남(다양성이 섭취를 늘림).</li>\n</ul>\n<h2>p.19 — 친애와 성취: 소속 욕구의 특성 (1) ⭐⭐⭐</h2>\n<ul>\n<li><strong>소속 욕구(need to belong)</strong>: 인간은 사회적 동물로서 <strong>친애 욕구(affiliation need)</strong> 를 <strong>핵심 동기</strong>로 지님(<strong>Baumeister &amp; Leary, 1995</strong>).</li>\n<li>사회적 유대는 <strong>자녀 양육 의지</strong>를 고취하고 위협으로부터 자녀를 보호(Esposito et al., 2013).</li>\n<li><strong>진화적 설명</strong>: 소속 욕구를 가진 개체가 성공적으로 생존 → 사회적 기질이 후손에게 전해짐. 사회적 욕구의 <strong>선천적(유전적)</strong> 특질.</li>\n<li>그림: &quot;코로나 때의 사회적 거리두기&quot;(p.19–20).</li>\n<li>⚠️ 슬라이드 &quot;보호Esposito et al., 2013)&quot; — 여는 괄호 누락(표기 오류).</li>\n</ul>\n<h2>p.20 — 소속 욕구의 특성 (2) ⭐⭐</h2>\n<ul>\n<li><strong>사회적 정체성</strong>은 건강과 안녕감을 증진(Allen et al., 2015).</li>\n<li>대부분의 사람은 외집단보다 <strong>내집단을 선호</strong> → <strong>내집단 편향(성)(ingroup bias)</strong>.</li>\n<li>타인과의 관계는 <strong>물질적 부유함보다 더 크게</strong> 작용하는 경우가 상당수(Diener et al., 2018).</li>\n<li>타인과의 <strong>우정</strong>은 연계와 협력을 조성하는 가장 기본적인 요인(Canavello &amp; Crocker, 2017).</li>\n</ul>\n<h2>p.21 — 자기 결정 이론 ⭐⭐⭐</h2>\n<ul>\n<li><strong>자기 결정 이론(Self-Determination Theory, SDT)</strong>: 인간은 <strong>유능성(competence)·자율성(autonomy)·관계성(relatedness)</strong> 의 욕구를 채우고자 한다.<ul>\n<li>인간의 만족감에 영향을 주는 강력한 요인은 <strong>자존감</strong>과 <strong>타인과의 관계</strong>.</li>\n<li>세 동기의 만족 → <strong>스트레스 감소</strong>와 <strong>자존감 고양</strong>(Campbell et al., 2018).</li>\n<li>자기 결정은 인간 동기를 설명하는 핵심(Howard et al., 2017).</li>\n</ul>\n</li>\n<li>교재 표준 보충: Deci &amp; Ryan이 제안.</li>\n<li>단답형 후보: &quot;유능성·자율성·관계성의 세 욕구&quot; → <strong>자기 결정 이론</strong>.</li>\n<li>⚠️ 그림 캡션 &quot;자기결정 이론(Self Determination Theory&quot; — 닫는 괄호 누락(표기 오류).</li>\n</ul>\n<h2>p.22 — 추방의 고통 (1): 사회적 고립·배척 ⭐⭐⭐</h2>\n<ul>\n<li><strong>사회적 고립</strong>의 위험성<ul>\n<li><strong>심적 와해</strong>로 이어짐(Cacioppo et al., 2015).</li>\n<li><strong>독거 노인은 치매 위험성이 더 높음</strong>(Holwerda et al., 2014).</li>\n</ul>\n</li>\n<li><strong>사회적 배척(ostracism)은 실제 고통을 겪는 것과 유사</strong><ul>\n<li>SNS상에서의 차단은 대뇌의 <strong>전측대상회(anterior cingulate cortex, ACC)</strong> 를 활성화 — 이 영역은 <strong>실제 신체의 고통</strong>을 담당(Rotge et al., 2015). → &quot;사회적 고통 = 신체적 고통&quot;의 뇌 근거.</li>\n<li>고통의 완화를 위해 <strong>종교적 신념을 강화</strong>하거나 <strong>폭식</strong>을 함(Sproesser et al., 2014).</li>\n</ul>\n</li>\n<li>그림: &quot;추방과 사회적 배척의 예시&quot;.</li>\n<li>⚠️ 슬라이드 &quot;Caccioppo&quot; = <strong>Cacioppo</strong>(John Cacioppo)의 철자 오류.</li>\n</ul>\n<h2>p.23 — 추방의 고통 (2): 악순환 ⭐⭐</h2>\n<ul>\n<li>사회적 추방 → <strong>사회성 저하</strong> → 다시 추방으로 이어지는 <strong>악순환</strong>(Rudert et al., 2019).</li>\n<li>다른 사람이 자신을 배척한다는 이야기를 들은 사람들은 <strong>자기파괴적이거나 공격적 행동</strong>을 더 자주 보임(Gaertner et al., 2008).</li>\n<li>사회적 배척이 큰 사건으로 자주 돌아오는 이유 중 하나(Leary et al., 2003) — 교재: 미국 학교 총기 사건 대다수에 가해자가 따돌림·거부를 당한 경험이 있었다는 분석.</li>\n<li>그림: &quot;추방에 의한 악순환 양상&quot;.</li>\n</ul>\n<h2>p.24 — 모바일/SNS: 매체별 사용 양상 ⭐</h2>\n<table>\n<thead>\n<tr>\n<th>매체</th>\n<th>수치 (출처)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>휴대폰</td>\n<td>2018년 기준 세계 인구의 <strong>96%</strong> 가 모바일 네트워크 가능 영역에 거주 (ITU, 2018)</td>\n</tr>\n<tr>\n<td>문자 메시지</td>\n<td>미국인은 통상 하루 <strong>94통</strong> (Burke, 2018)</td>\n</tr>\n<tr>\n<td>인터넷</td>\n<td>세계 인구의 <strong>81%</strong> 가 인터넷 사용 가능, <strong>6%</strong> 가 인터넷 중독 증상 보고 (Cheng &amp; Li, 2014)</td>\n</tr>\n<tr>\n<td>소셜 네트워킹</td>\n<td>미국 대학 신입생의 <strong>절반</strong>이 주당 <strong>6시간</strong> 정도 SNS 접속 (Stolzenberg et al., 2019)</td>\n</tr>\n</tbody></table>\n<ul>\n<li>수치 자체보다는 &quot;연결 욕구가 기술 사용을 이끈다&quot;는 맥락으로 이해. 그림: &quot;SNS 예시&quot;.</li>\n</ul>\n<h2>p.25 — SNS의 사회적 효과, SNS와 정신건강 ⭐⭐</h2>\n<ul>\n<li>긍정: <strong>유사 관심 소재</strong>를 매개로 사람들을 연결(물리적 거리 제한 없음).</li>\n<li>부정: <strong>&#39;비교&#39;의 장</strong> — 자신과 타인의 삶을 비교 → <strong>우울감</strong>(Verduyn et al., 2017). (교재 표준: 타인의 &quot;하이라이트&quot;와 나의 일상을 비교)</li>\n<li><strong>SNS와 정신건강(Haidt &amp; Twenge, 2019)</strong><ul>\n<li>SNS 사용 시간과 우울/불안은 <strong>약한 정적 상관</strong>.</li>\n<li>SNS 사용 여부는 <strong>미래의 정신 건강을 예측</strong>(종단 연구).</li>\n<li><strong>실험 연구</strong>에서는 <strong>일관성이 떨어지는</strong> 결과.</li>\n</ul>\n</li>\n<li>결론: 온라인 네트워킹은 <strong>일장일단</strong>. (1장 연결: 상관 ≠ 인과 — 상관은 있으나 실험 증거가 비일관이므로 &quot;SNS가 우울을 일으킨다&quot;고 단정할 수 없음.)</li>\n</ul>\n<h2>p.26 — SNS와 자기노출, 자기애 ⭐⭐</h2>\n<ul>\n<li><strong>자기노출(self-disclosure)</strong>: 즐거움, 걱정거리, 약점 등을 타인과 공유하는 것.<ul>\n<li>양면성이 있으나, SNS를 통한 자기노출 증가는 <strong>관계의 돈독함 증진</strong>(Valkenburg &amp; Peter, 2009).</li>\n</ul>\n</li>\n<li><strong>자기애(나르시시즘)의 촉진</strong>: SNS를 통한 자기노출은 <strong>자기도취적 특성</strong>을 더 드러냄(Weiser, 2015).</li>\n<li>적절한 <strong>자기 조절</strong>로 균형 유지 필요 — 핵심은 기술이 아니라 <strong>자기 제어 전략</strong>의 개발.</li>\n<li>그림: &quot;SNS를 통한 자기 노출&quot;.</li>\n</ul>\n<h2>p.27 — 성취 동기, 그릿, 내재적 vs 외재적 동기 ⭐⭐⭐</h2>\n<ul>\n<li><strong>성취 동기(Achievement motivation)</strong>: 중요한 성취를 달성하고 <strong>높은 기준을 충족</strong>시키려는 욕구.<ul>\n<li><strong>타고난 재능보다 성취 동기</strong>가 수행 향상을 더 잘 예측(Bloom, 1985 — 뛰어난 피아니스트·운동선수 연구).</li>\n</ul>\n</li>\n<li><strong>불굴의 투지 = 그릿(Grit)</strong> (<strong>Duckworth, 2016</strong>): <strong>장기적 목표를 향한 열정과 집념</strong>.<ul>\n<li>다른 연구자들은 그릿을 <strong>성실성과 자기제어</strong>의 개념으로 보기도 함(Crede, 2018; Schmidt et al., 2018) — 새로운 개념이 아니라는 비판.</li>\n</ul>\n</li>\n<li><strong>내재적 동기 vs 외재적 동기</strong>: 동기 형성 요인의 <strong>위치</strong>(내부/외부)에 따라 결정.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>동기 유형</th>\n<th>정의</th>\n<th>예</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>내재적 동기(intrinsic motivation)</strong></td>\n<td><strong>수행 자체가 좋아서</strong> 형성</td>\n<td>재미있어서 퍼즐을 푼다</td>\n</tr>\n<tr>\n<td><strong>외재적 동기(extrinsic motivation)</strong></td>\n<td><strong>외부의 보상 혹은 처벌</strong>에 연동해 형성</td>\n<td>용돈을 받으려고 공부한다</td>\n</tr>\n</tbody></table>\n<ul>\n<li>교재 표준 보충: 이미 즐기던 활동에 외적 보상을 주면 내재적 동기가 떨어질 수 있다(과잉정당화 효과, 5장 강화와 연결).</li>\n</ul>\n<h2>p.28 — 목표 설정 팁 ⭐</h2>\n<ol>\n<li><strong>확실한 다짐</strong></li>\n<li>목표를 친구나 가족에게 <strong>공언</strong></li>\n<li><strong>구현 계획</strong>(implementation intention)을 구체적으로 수립 — 언제·어디서·어떻게</li>\n<li>장기적 목표를 지원하는 <strong>단기적 보상</strong> 설정</li>\n<li>진척 상황을 <strong>모니터링하고 기록</strong></li>\n<li><strong>지지적 환경</strong> 조성</li>\n<li>하기 어려운 것을 해야만 하는 행동으로 변형(<strong>습관화</strong>)</li>\n</ol>\n<h2>p.29 — 정서 이론 (1): 제임스-랑게 vs 캐넌-바드 ⭐⭐⭐</h2>\n<ul>\n<li><strong>제임스-랑게 이론(James-Lange theory)</strong>: <strong>신체 반응이 정서를 유발</strong>한다. 신체적 상태가 곧 정서를 이끌어 냄.<ul>\n<li>예(교재 표준): &quot;곰을 보고 → 심장이 뛰고 몸이 떨린다 → 그래서 두렵다.&quot; &quot;슬퍼서 우는 게 아니라 울어서 슬프다.&quot;</li>\n</ul>\n</li>\n<li><strong>캐넌-바드 이론(Cannon-Bard theory)</strong>: <strong>신체 반응과 정서는 독립적으로 동시에</strong> 발생.<ul>\n<li>제임스-랑게 비판: 신체 반응은 정서마다 <strong>유사한 점이 많고 변화가 느리기</strong> 때문에 상이한 정서를 유발할 수 없다.</li>\n</ul>\n</li>\n<li>그러나 <strong>신체 감각과 정서 반응이 연관</strong>되어 있다는 연구도 존재(<strong>Damasio, 2003</strong>) → 제임스-랑게 쪽 손을 들어주는 근거.</li>\n<li>주의: p.10의 Cannon(배고픔·위 수축)과 같은 사람(Walter Cannon). 배고픔과 정서 양쪽에 나온다.</li>\n</ul>\n<h2>p.30 — 정서 이론 (2): 샥터-싱어 2요인 이론 ⭐⭐⭐</h2>\n<ul>\n<li><strong>샥터-싱어 2요인 이론(two-factor theory)</strong>: 정서를 경험하려면 <strong>① 신체적 각성</strong>이 발생하고 <strong>② 그 각성에 대한 인지적 해석(이름 붙이기, 명명)</strong> 이 추가되어야 한다.<ul>\n<li>공식: <strong>신체적 각성 + 이름 붙이기 = 정서</strong>.</li>\n</ul>\n</li>\n<li>실험(<strong>Schachter &amp; Singer, 1962</strong>): <strong>에피네프린</strong>(각성 유발)을 주사받은 집단 중 <strong>주사의 효과를 고지받은</strong> 사람들은 신체 흥분을 약물 탓으로 돌려 <strong>어떤 정서 표식도 붙이지 않음</strong>. 고지받지 못한 사람들은 옆 사람(실험 공모자)의 기분(즐거움/분노)을 따라 정서를 경험(교재 표준).</li>\n<li>신체 반응(각성)과 정서 경험에 대한 <strong>인지적 해석</strong>을 강조.</li>\n<li>교재 표준 보충: 한 상황의 각성이 다음 상황으로 넘어가 정서를 증폭시키는 <strong>흥분 전이(spillover effect)</strong> 도 2요인 이론으로 설명된다.</li>\n</ul>\n<h2>p.31 — 정서 이론 (3): 자이언스, 르두, 라자루스 ⭐⭐⭐</h2>\n<ul>\n<li><strong>자이언스(Zajonc)·르두(LeDoux)</strong> 의 입장: <strong>정서 반응은 인지 기반 해석 없이도 발생</strong> 가능 — <strong>역치 하 점화</strong>로 탐구.<ul>\n<li>지각할 수 없을 정도로 <strong>짧게 제시</strong>하는 자극을 반복 경험하면 그 자극을 <strong>더 선호</strong>(Kunst-Wilson &amp; Zajonc, 1980) — 교재의 <strong>단순 노출 효과(mere exposure effect)</strong>.</li>\n</ul>\n</li>\n<li><strong>라자루스(Lazarus)</strong>: 슬라이드 &quot;정서 반응 후에 해석이 개입&quot;.</li>\n<li>⚠️ 교재(마이어스)의 표준 서술에서 <strong>라자루스는 &quot;인지적 평가(appraisal)가 정서를 정의한다 — 다만 그 평가는 의식 밖에서 순간적으로 일어날 수 있다&quot;</strong> 는 입장으로, 자이언스·르두(인지 없이 정서 가능)와 <strong>논쟁한 반대편</strong>이다. 슬라이드는 셋을 한 묶음으로 두고 라자루스를 &quot;정서 후 해석&quot;으로 적었는데, 이는 교재와 어긋날 수 있다. 시험에서는 <strong>슬라이드 표현(p.31·p.33의 묶음)</strong> 을 우선 따르되, &quot;라자루스 = 평가 중시&quot; 선지가 나오면 이 차이를 떠올릴 것.</li>\n</ul>\n<h2>p.32 — 정서의 신경 회로: 윗길과 아랫길 ⭐⭐⭐</h2>\n<p><strong>정서의 이원화된 신경 회로 (Ochsner et al., 2009; LeDoux)</strong></p>\n<table>\n<thead>\n<tr>\n<th>경로</th>\n<th>경로 구성</th>\n<th>특징</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>신중한 윗길(high road)</strong></td>\n<td><strong>시상 → 대뇌 피질 → 편도체 → 신체</strong></td>\n<td>상대적으로 <strong>복잡한 감정</strong> 처리. 피질에서 자극을 <strong>분석·명명</strong>한 다음, 반응 명령이 편도체를 거쳐 각 신체 기관에 전달</td>\n</tr>\n<tr>\n<td><strong>빠른 아랫길(low road)</strong></td>\n<td><strong>시상 → 편도체</strong> (피질 우회)</td>\n<td>시상을 경유해 <strong>직접 편도체</strong>로 → <strong>즉각적 반응</strong>. 단순한 정서(호오, 공포)나 신속한 반응이 필요할 때 <strong>의식적 자각을 못 할 수도</strong> 있음(Dimberg et al., 2000)</td>\n</tr>\n</tbody></table>\n<ul>\n<li>아랫길로 먼저 반응한 뒤, 두뇌가 위험을 탐지함에 따라 <strong>의식적 공포 경험</strong>이 발생(LeDoux &amp; Brown, 2017).</li>\n<li>아랫길 = 자이언스·르두 입장(&quot;인지 없이 정서&quot;)의 <strong>신경학적 근거</strong>. 윗길 = 2요인/라자루스 쪽(해석 후 정서).</li>\n<li>예(교재 표준): 숲에서 뱀 같은 것을 보고 몸이 먼저 움찔(아랫길) → 다시 보니 막대기(윗길)라 안도.</li>\n</ul>\n<h2>p.33 — 정서 이론 정리 ⭐⭐⭐ (요약표)</h2>\n<table>\n<thead>\n<tr>\n<th>이론</th>\n<th>정서에 대한 설명</th>\n<th>한 줄 공식</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>제임스-랑게</strong></td>\n<td>정서는 자극에 대한 <strong>신체 반응으로부터 도출</strong></td>\n<td>자극 → 신체 반응 → 정서</td>\n</tr>\n<tr>\n<td><strong>캐넌-바드</strong></td>\n<td>정서 유발 자극이 신체 반응과 정서 반응을 <strong>동시에</strong> 촉발</td>\n<td>자극 → (신체 반응 ∥ 정서)</td>\n</tr>\n<tr>\n<td><strong>샥터-싱어(2요인)</strong></td>\n<td>정서 경험은 <strong>신체적 각성</strong>과 <strong>의식적인 인지 평가</strong>, 두 가지에 의해 결정</td>\n<td>각성 + 명명 → 정서</td>\n</tr>\n<tr>\n<td><strong>자이언스, 르두, 라자루스</strong></td>\n<td><strong>어떤 정서 반응은 의식적 평가 없이 즉각적으로</strong> 발생</td>\n<td>자극 → 즉각 정서(아랫길)</td>\n</tr>\n</tbody></table>\n<ul>\n<li>단골 문제 형태: &quot;곰을 보고 떨려서 무섭다&quot; → 제임스-랑게 / &quot;떨림과 공포가 동시에&quot; → 캐넌-바드 / &quot;각성을 무엇 때문이라 해석하느냐에 따라 정서가 달라진다&quot; → 2요인 / &quot;역치 하 자극에도 선호가 생긴다&quot; → 자이언스.</li>\n</ul>\n<h2>p.34 — 타인 정서의 탐지: 비언어적 의사소통 ⭐⭐</h2>\n<ul>\n<li><strong>비언어적 의사소통</strong>: 표정, 몸짓, 시선 처리 등은 언어 외적인 방식으로 정서를 표현(Bolmont et al., 2014).</li>\n<li>특히 <strong>부정적 정서에 대한 탐지는 생득적</strong>으로 타고남(Burris et al., 2019) — 위협 탐지의 생존 가치.</li>\n<li>개인의 환경·경험에 따라 <strong>모호한 표정</strong>에서 정서를 탐지하는 방식이 달라짐(<strong>Pollak &amp; Kistler, 2002</strong>) — 교재 표준: <strong>학대받은 아동</strong>은 모호한 표정을 <strong>분노</strong>로 더 빨리 지각.</li>\n<li>그림: &quot;정서표정의 스펙트럼(Pollak &amp; Kistler, 2002)&quot;.</li>\n</ul>\n<h2>p.35 — 성별, 정서, 비언어적 행동 ⭐⭐</h2>\n<ul>\n<li><strong>정서 표정에 대한 고정관념</strong>: 중성적인 얼굴에서 <strong>표정에 따라 성별 판단이 달라짐</strong>(Becker et al., 2007) — 교재: 화난 표정은 남성으로, 웃는 표정은 여성으로 판단하는 경향.</li>\n<li><strong>성별에 따른 정서 인식 차이</strong><ul>\n<li><strong>26개 문화권</strong>에서 <strong>여성이 더 감정에 개방적</strong>(Costa et al., 2001).</li>\n<li>남성은 다소 <strong>단순한 정서 반응</strong>을 기술하는 경향(Barrett et al., 2000).</li>\n<li>타인의 정서를 관찰하는 과정에서도 <strong>정서 표현</strong>의 차이가 성별에 따라 다름(Kring &amp; Gordon, 1998) — 교재: 같은 영화를 볼 때 여성이 더 많은 정서를 표정으로 드러냄.</li>\n</ul>\n</li>\n<li>그림: &quot;Becker et al.(2007)의 실험 자극(상)&quot;, &quot;Kring &amp; Gordon(1998)의 결과(하)&quot;.</li>\n<li>⚠️ 슬라이드 &quot;Barret et al., 2000&quot; = <strong>Barrett</strong>(Lisa Feldman Barrett)의 철자 오류.</li>\n</ul>\n<h2>p.36 — 문화와 정서적 표현: 에크만의 보편적 정서 ⭐⭐⭐</h2>\n<ul>\n<li><strong>에크만의 보편적 정서(Ekman, 2016)</strong>: <strong>문화권에 관계없이</strong> 관찰되는 <strong>6개의 보편적 정서</strong>.<ul>\n<li>교재 표준 6개: <strong>행복, 슬픔, 분노, 공포, 놀람, 혐오</strong> (그림 내용은 추출되지 않음 — 교재 기준).</li>\n<li>보편 정서를 <strong>표출하는 수준</strong>은 문화권에 따라 다를 수 있음(Cordaro et al., 2018).</li>\n<li>보편적 정서는 <strong>유아기부터</strong> 관찰 가능 → 선천성의 근거.</li>\n</ul>\n</li>\n<li><strong>문화권별 정서와 표현의 차이</strong><ul>\n<li><strong>개인주의 문화권</strong>은 눈에 띄는 정서 표출을 <strong>장려</strong>, <strong>집단주의 문화권</strong>은 <strong>반대</strong>(억제)(van Hemert et al., 2007).</li>\n<li><strong>동일한 표현이어도 문화권에 따라 해석이 다름</strong>(예: 손으로 V자 표시) — 제스처는 문화 특수적, 표정은 상대적으로 보편적.</li>\n</ul>\n</li>\n<li>그림: &quot;문화권 별 보편적 표정(Matsumoto &amp; Ekman, 1989)&quot;.</li>\n<li>⚠️ 슬라이드 &quot;Mastumoto&quot; = <strong>Matsumoto</strong>의 철자 오류.</li>\n</ul>\n<h2>p.37 — 얼굴 표정의 효과: 얼굴 피드백 효과, 행동 피드백 효과 ⭐⭐⭐</h2>\n<ul>\n<li><strong>얼굴 피드백 효과(facial feedback effect)</strong>: 표정을 통해 정서를 표현·소통하고, 그 정서를 <strong>더욱 증폭 및 조절</strong>시키는 현상.<ul>\n<li><strong>표정의 표현을 통해 정서의 강도</strong>가 영향을 받을 수 있음.</li>\n<li>미소를 짓게 하는 <strong>근육 하나만 조정</strong>되어도 스트레스에 대한 압박을 덜 받음(Soussignan, 2001). (교재 표준: 펜을 이로 물어 미소 근육을 쓰게 하면 만화가 더 재미있게 느껴짐)</li>\n</ul>\n</li>\n<li><strong>행동 피드백 효과(behavior feedback effect)</strong>: 사람이 <strong>직접 행하는 행동</strong>에 따라 정서 경험이 조절되는 효과.<ul>\n<li>처진 채로 걸으면 우울해지나, 힘을 내서 걸으면 기분이 나아짐(Krahe et al., 2018).</li>\n</ul>\n</li>\n<li>연결: 두 효과 모두 &quot;신체 → 정서&quot; 방향 → <strong>제임스-랑게 이론</strong>을 지지하는 근거.</li>\n<li>그림: &quot;얼굴 표정에 따른 정서 지각 차이(카즈오 &amp; 히데코, 2009)&quot;.</li>\n</ul>\n<h2>p.38 — 분노 ⭐⭐⭐</h2>\n<ul>\n<li>보편적 정서 중 하나로, <strong>Fight or Flight 반응</strong> 중 <strong>Fight(싸움)</strong> 를 촉발.</li>\n<li>분노를 겪을 때 <strong>염증이 증가</strong>하고 <strong>테스토스테론</strong> 수준이 높아짐(Barlow et al., 2019).</li>\n<li><strong>분노에 입각한 행동은 분노를 더욱 폭증</strong>시킴(Flack, 2006).</li>\n<li><strong>카타르시스(catharsis)</strong>: 분노 표출로 감정을 해소한다는 생각 → <strong>일시적 해결책</strong>일 뿐, <strong>부적응적인 접근법</strong>. (교재 표준: &quot;카타르시스 가설&quot;은 실증적으로 지지되지 않음 — 표출하면 오히려 분노가 습관화)</li>\n<li><strong>분노 대처법</strong>: <strong>기다리기</strong>(생리적 각성이 가라앉도록), <strong>다른 활동에 집중하기</strong>, <strong>거리 두기</strong>.</li>\n<li>그림: &quot;두 보편적 정서 — 행복과 분노&quot;(p.38–39).</li>\n<li>⚠️ 슬라이드 &quot;테스토스테른&quot; = <strong>테스토스테론</strong>의 오타. &quot;Flight or Fight&quot;는 보통 &quot;Fight or Flight(투쟁-도피)&quot;로 쓴다(의미는 같음).</li>\n</ul>\n<h2>p.39 — 행복 ⭐⭐⭐</h2>\n<ul>\n<li>행복한 사람은<ul>\n<li>정서적으로 <strong>긍정적인 정보에 더 집중</strong>(Raila et al., 2015).</li>\n<li>전반적으로 <strong>삶의 만족도가 높음</strong>(Boehm et al., 2015).</li>\n<li><strong>20세의 행복도</strong>가 추후 <strong>결혼 생활의 만족도</strong>를 예측(Stutzer &amp; Frey, 2006).</li>\n</ul>\n</li>\n<li><strong>기분 좋음, 선행 현상(feel-good, do-good phenomenon)</strong> (<strong>Salovey, 1990</strong>): <strong>기분이 좋을 때 남에게 도움을 주는</strong> 경향.<ul>\n<li>역방향도 성립: <strong>남을 돕는 행동</strong>을 취함으로써 <strong>행복한 기분</strong>을 형성할 수 있음.</li>\n</ul>\n</li>\n<li>단답형 후보: &quot;기분이 좋으면 남을 더 돕는다&quot; → <strong>기분 좋음·선행 현상</strong>.</li>\n</ul>\n<h2>p.40 — 긍정심리학 ⭐⭐⭐</h2>\n<ul>\n<li><strong>긍정심리학(positive psychology)</strong>: <strong>주관적 안녕감(subjective well-being, 행복감)</strong> 이 삶의 만족도에 미치는 영향력을 탐구. 교재 표준: <strong>마틴 셀리그먼(Martin Seligman)</strong> 이 주도(슬라이드에는 이름 없음).</li>\n<li><strong>긍정심리학의 핵심 3요소(세 기둥)</strong></li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>기둥</th>\n<th>내용</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>긍정적 안녕감</strong></td>\n<td><strong>과거에 대한 만족감 + 현재에 대한 행복감 + 미래에 대한 낙관</strong></td>\n</tr>\n<tr>\n<td><strong>긍정적 품성</strong></td>\n<td>창의성, 용기, 자기제어 등의 역량</td>\n</tr>\n<tr>\n<td><strong>긍정적 집단·사회·문화</strong></td>\n<td>긍정적 안녕감을 조성할 수 있는 환경적 요인</td>\n</tr>\n</tbody></table>\n<ul>\n<li><strong>우울, 불안 등 부정적 측면에 집중하던 기존 20세기 연구와 차별</strong>.</li>\n<li>시간 축 함정: 과거=<strong>만족</strong>, 현재=<strong>행복</strong>, 미래=<strong>낙관</strong> — 짝을 바꿔 내는 객관식 주의.</li>\n</ul>\n<h2>p.41 — 돈과 행복 ⭐⭐⭐</h2>\n<ul>\n<li><strong>더 많은 돈 = 더 높은 행복?</strong><ul>\n<li><strong>일정 수준까지는</strong> 더 높은 수입이 행복을 증진. <strong>포만점(satiation point)</strong> 도달 전까지는 행복 예측이 가능(Ruberton et al., 2016).</li>\n<li>일정 수준에 도달하면 <strong>더 이상 행복 증진이나 우울 감소를 초래하지 않음</strong>.</li>\n</ul>\n</li>\n<li><strong>극단적 불평등은 해로움</strong><ul>\n<li><strong>지니계수</strong>(소득 불평등 지표)가 높은 국가에서는 개인의 건강·심리 장애 문제가 <strong>저소득층에서 매우 빈번</strong>(Sommet et al., 2018).</li>\n<li>대부분의 사람은 <strong>수입 격차가 적은 것</strong>을 선호(Arsenio, 2018).</li>\n</ul>\n</li>\n<li>그림: &quot;연도별 수입 및 행복감의 변화 양상(미국 국립 여론조사 센터)&quot; — 교재 표준 해석: 미국의 실질 소득은 수십 년간 크게 늘었지만 &quot;매우 행복하다&quot;는 비율은 거의 변하지 않음.</li>\n<li>교재 표준 보충: 이를 설명하는 개념으로 <strong>적응 수준 현상</strong>(새 수준에 금방 익숙해짐)과 <strong>상대적 박탈감</strong>(남과 비교)이 교재에 나온다(슬라이드에는 없음).</li>\n</ul>\n<h2>p.42 — 그래서 행복이란? ⭐⭐</h2>\n<ul>\n<li><strong>선천성-후천성 간의 상호작용</strong>: <strong>생득적 특질, 개인사와 문화, 경험</strong>이 적절한 균형을 갖추어야 행복을 얻을 수 있음.</li>\n<li>행복을 얻는 방식은 <strong>문화권별로, 개인별로 상이</strong>.</li>\n<li><strong>스스로에 대한 관찰</strong>을 통해 경험을 더욱 성숙시킬 수 있음.</li>\n<li>그림: &quot;행복한 자신을 구성하는 3요소&quot;(그림 내용 미추출 — 위의 생득적 특질 / 개인사·문화 / 경험으로 보임).</li>\n</ul>\n<hr>\n<h2>🎙 실제 수업 기록 (10/27 화, 녹음본 기준 — 앞 16분만)</h2>\n<p>원본 <code>녹음본/음성 261027_143425.m4a</code>(16분 10초), whisper 전사 <code>녹음본/1027_심리_whisper.txt</code>. 녹음은 첫 번째 전달사항 끝(&quot;메일을 보내주시면&quot;)부터 시작하고 16:07에서 끊긴다.</p>\n<p><strong>00:00–09:15 레포트 과제 설명</strong> → 상세는 <a href=\"../%EA%B3%BC%EC%A0%9C/%EA%B3%BC%EC%A0%9C1_%EC%9D%B4%ED%95%B4%EA%B0%80%EC%9D%B4%EB%93%9C.md\">../과제/과제1_이해가이드.md</a>. 마감 <strong>11/30(월) 23:00</strong>, 지각 제출 불가(LMS 차단, 원문 기준 0점), 15점, 4–7쪽, Word/PDF, 11–12pt, AI 사용 금지.</p>\n<ul>\n<li>마감 정하기(06:05–06:58): 학생들이 4주·5주를 부르자 교수가 &quot;일단 크게 질러보고 하나씩 물러나면서 타협점을 찾는&quot; 심리 기법이 있다며 <strong>다음 주에 다룰 것</strong>이라고 했다 → 설득 기법(<strong>면전에서 문 닫기, door-in-the-face</strong>로 추정; 녹음 &quot;후딩&quot;은 foot-in-the-door와 헷갈린 것일 수 있음). 사회심리 장에서 확인.</li>\n</ul>\n<p><strong>09:15–16:07 8장 도입 (p.1–2)</strong></p>\n<ul>\n<li>도입 질문(09:43–10:13): 사람에게 &quot;왜 그랬어?&quot;라고 물으면 &quot;그냥&quot;이라고 답할 때도 있지만, 의식적으로 표현하지 못할 뿐 행동이 나오는 데에는 <strong>은연중에 존재하는 일련의 힘</strong>이 있다 → 그것이 <strong>동기</strong>.</li>\n<li>동기는 <strong>생물학적·심리적·외부 환경(타인)</strong> 으로 다 설명할 수 있는 광범위한 개념(10:15–10:34) — 서막의 생물심리사회적 접근과 같은 틀.</li>\n<li><strong>정서</strong>가 행동 방향을 바꾼다(10:40–11:04): 4장 지각에서 감정 상태에 따라 <strong>발음이 애매한 단어를 긍정/부정으로 다르게 지각</strong>한 예를 다시 언급.</li>\n<li>동기 정의(11:24–11:38): &quot;행동의 실현을 수반하거나 그 방향성을 설정해 주는 욕구&quot; — 슬라이드 문장 그대로 한 줄 요약이라고 강조.</li>\n<li><strong>본능</strong>(11:45–12:19): 진화론에 입각한 설명. &quot;한 동물 종에서 패턴화되어 있고 <strong>학습하지 않은 복잡한 행동</strong>&quot; — 본능이라는 말은 흔히 쓰지만 심리학의 정의는 이것.</li>\n<li>본능 예시(12:32–15:15): 신생아가 손바닥에 쥐여 주면 꼭 쥐고 안 놓는 행동, 뺨에 닿으면 그쪽으로 고개 돌리는 행동(교재 명칭은 쥐기 반사·젖찾기 반사, 교수 발언엔 명칭 없음). 3장 발달에서 소개한 내용이라고 함. 신생아는 시각계가 덜 발달해 앞의 사물이 무엇인지 모르므로, 닿은 것(대개 안아 주는 부모)을 놓지 않는 것이 보호받기에 유리 → 진화적으로 이어졌다는 해석.</li>\n<li>한계와 의의(15:18–15:45): 본능만으로 인간의 모든 동기 유형을 설명하는 데는 <strong>한계</strong>가 있지만, <strong>유전적 요인의 영향력</strong>이 있다는 가정은 심리학에서 계속 유지 → <strong>진화심리학의 주요 기제</strong>로 연결.</li>\n<li>16:07 이후 녹음 없음 (p.3 추동 감소 이론부터는 녹음 미확인).</li>\n</ul>\n<h2>명칭 암기표</h2>\n<table>\n<thead>\n<tr>\n<th>명칭 (영문)</th>\n<th>한 줄 정의/단서</th>\n<th>슬라이드</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>동기 (motivation)</td>\n<td>행동을 일으키고 방향을 정하는 욕구</td>\n<td>2</td>\n</tr>\n<tr>\n<td>본능 (instinct)</td>\n<td>종 특유의, 패턴화된, 학습하지 않은 복잡한 행동</td>\n<td>2, 8</td>\n</tr>\n<tr>\n<td>추동 (drive)</td>\n<td>생리적 욕구 충족 행동을 동기화하는 긴장 상태</td>\n<td>3</td>\n</tr>\n<tr>\n<td>추동 감소 이론 (drive-reduction theory)</td>\n<td>생리적 욕구 → 추동 → 추동을 줄이는 행동</td>\n<td>3, 8</td>\n</tr>\n<tr>\n<td>항상성 (homeostasis)</td>\n<td>일정한 내적 상태를 유지하려는 경향 (피드백 루프)</td>\n<td>3</td>\n</tr>\n<tr>\n<td>유인자극 (incentive)</td>\n<td>행동을 끌어내는 긍정/부정의 환경 자극</td>\n<td>4</td>\n</tr>\n<tr>\n<td>각성 이론 (arousal theory)</td>\n<td>최적 각성 수준을 찾는 것이 동기의 목표</td>\n<td>5, 6, 8</td>\n</tr>\n<tr>\n<td>여키스-닷슨 법칙 (Yerkes-Dodson law)</td>\n<td>적당한 각성 → 최적 수행 (어려운 과제는 낮은 각성)</td>\n<td>5, 6</td>\n</tr>\n<tr>\n<td>욕구 위계 (hierarchy of needs) / 매슬로우</td>\n<td>하위(생리) 욕구가 채워져야 상위 욕구로</td>\n<td>7, 8</td>\n</tr>\n<tr>\n<td>앤슬 키스 (Ancel Keys)</td>\n<td>준기아 연구 — 음식에 강박, 냉담·무기력</td>\n<td>9</td>\n</tr>\n<tr>\n<td>Cannon &amp; Washburn (1912)</td>\n<td>위 수축 실험 — 위 수축 때 배고픔</td>\n<td>10</td>\n</tr>\n<tr>\n<td>혈당 (blood glucose)</td>\n<td>주 에너지원, 변화 감지 → 배고픔</td>\n<td>11</td>\n</tr>\n<tr>\n<td>시상하부 (hypothalamus) / 궁상핵 (arcuate nucleus)</td>\n<td>배고픔 조절 중추 / 식욕 촉진 호르몬 분비</td>\n<td>11, 12</td>\n</tr>\n<tr>\n<td>오렉신 (orexin)</td>\n<td>시상하부의 식욕 촉진 호르몬</td>\n<td>12</td>\n</tr>\n<tr>\n<td>그렐린 (ghrelin)</td>\n<td>공복 시 위에서 분비, &quot;배고프다&quot;</td>\n<td>13</td>\n</tr>\n<tr>\n<td>PYY</td>\n<td>소화관에서 분비, &quot;배고프지 않다&quot;</td>\n<td>13</td>\n</tr>\n<tr>\n<td>렙틴 (leptin)</td>\n<td>지방세포의 단백질 호르몬, 배고픔 감소</td>\n<td>13</td>\n</tr>\n<tr>\n<td>조절점 (set point)</td>\n<td>신체가 설정한 특정 체중 지점 — 요요의 원인</td>\n<td>14</td>\n</tr>\n<tr>\n<td>기초대사율 (basal metabolic rate)</td>\n<td>신체의 기본(휴식 시) 에너지 소비율</td>\n<td>14</td>\n</tr>\n<tr>\n<td>낯섦 공포증 (neophobia)</td>\n<td>먹어 본 적 없는 음식을 기피</td>\n<td>17</td>\n</tr>\n<tr>\n<td>소속 욕구 / 친애 욕구 (need to belong / affiliation need)</td>\n<td>사회적 동물의 핵심 동기 (Baumeister &amp; Leary)</td>\n<td>19</td>\n</tr>\n<tr>\n<td>내집단 편향 (ingroup bias)</td>\n<td>외집단보다 내집단을 선호</td>\n<td>20</td>\n</tr>\n<tr>\n<td>자기 결정 이론 (self-determination theory)</td>\n<td>유능성·자율성·관계성의 세 욕구</td>\n<td>21</td>\n</tr>\n<tr>\n<td>전측대상회 (anterior cingulate cortex)</td>\n<td>사회적 배척(SNS 차단)에도 활성 — 신체 고통 담당</td>\n<td>22</td>\n</tr>\n<tr>\n<td>사회적 배척 / 추방 (ostracism)</td>\n<td>실제 고통과 유사, 악순환·공격성</td>\n<td>22, 23</td>\n</tr>\n<tr>\n<td>자기노출 (self-disclosure)</td>\n<td>즐거움·걱정·약점을 타인과 공유</td>\n<td>26</td>\n</tr>\n<tr>\n<td>성취 동기 (achievement motivation)</td>\n<td>중요한 성취·높은 기준 충족 욕구</td>\n<td>27</td>\n</tr>\n<tr>\n<td>그릿 / 불굴의 투지 (grit)</td>\n<td>장기 목표를 향한 열정과 집념 (Duckworth)</td>\n<td>27</td>\n</tr>\n<tr>\n<td>내재적 동기 (intrinsic motivation)</td>\n<td>수행 자체가 좋아서</td>\n<td>27</td>\n</tr>\n<tr>\n<td>외재적 동기 (extrinsic motivation)</td>\n<td>외부 보상·처벌에 연동</td>\n<td>27</td>\n</tr>\n<tr>\n<td>제임스-랑게 이론 (James-Lange theory)</td>\n<td>신체 반응 → 정서</td>\n<td>29, 33</td>\n</tr>\n<tr>\n<td>캐넌-바드 이론 (Cannon-Bard theory)</td>\n<td>신체 반응과 정서가 독립적·동시 발생</td>\n<td>29, 33</td>\n</tr>\n<tr>\n<td>샥터-싱어 2요인 이론 (two-factor theory)</td>\n<td>신체적 각성 + 인지적 이름 붙이기 = 정서</td>\n<td>30, 33</td>\n</tr>\n<tr>\n<td>에피네프린 주사 실험 (Schachter &amp; Singer, 1962)</td>\n<td>효과를 고지받은 집단은 정서 표식 안 붙임</td>\n<td>30</td>\n</tr>\n<tr>\n<td>자이언스·르두 (Zajonc, LeDoux)</td>\n<td>인지 없이도 정서 반응 가능 (역치 하 점화)</td>\n<td>31, 33</td>\n</tr>\n<tr>\n<td>단순 노출 효과 (mere exposure effect) — 교재 용어</td>\n<td>반복 노출(역치 하 포함)된 자극을 더 선호 (Kunst-Wilson &amp; Zajonc)</td>\n<td>31</td>\n</tr>\n<tr>\n<td>신중한 윗길 (high road)</td>\n<td>시상 → 피질 → 편도체 → 신체, 복잡한 감정</td>\n<td>32</td>\n</tr>\n<tr>\n<td>빠른 아랫길 (low road)</td>\n<td>시상 → 편도체, 즉각 반응·의식 못 할 수도</td>\n<td>32</td>\n</tr>\n<tr>\n<td>편도체 (amygdala)</td>\n<td>두 경로가 모두 거치는 정서(공포) 중추</td>\n<td>32</td>\n</tr>\n<tr>\n<td>비언어적 의사소통 (nonverbal communication)</td>\n<td>표정·몸짓·시선으로 정서 표현</td>\n<td>34</td>\n</tr>\n<tr>\n<td>에크만의 보편적 정서 (Ekman)</td>\n<td>문화 무관 6개 정서, 유아기부터 관찰</td>\n<td>36</td>\n</tr>\n<tr>\n<td>얼굴 피드백 효과 (facial feedback effect)</td>\n<td>표정이 정서를 증폭·조절</td>\n<td>37</td>\n</tr>\n<tr>\n<td>행동 피드백 효과 (behavior feedback effect)</td>\n<td>행동(걷는 자세 등)이 정서를 조절</td>\n<td>37</td>\n</tr>\n<tr>\n<td>카타르시스 (catharsis)</td>\n<td>분노 표출로 해소 — 일시적·부적응적</td>\n<td>38</td>\n</tr>\n<tr>\n<td>기분 좋음·선행 현상 (feel-good, do-good phenomenon)</td>\n<td>기분이 좋으면 남을 돕는다 (Salovey)</td>\n<td>39</td>\n</tr>\n<tr>\n<td>긍정심리학 (positive psychology)</td>\n<td>주관적 안녕감·긍정적 품성·긍정적 집단 연구</td>\n<td>40</td>\n</tr>\n<tr>\n<td>주관적 안녕감 (subjective well-being)</td>\n<td>스스로 지각한 행복감·삶의 만족</td>\n<td>40</td>\n</tr>\n<tr>\n<td>긍정적 안녕감</td>\n<td>과거 만족 + 현재 행복 + 미래 낙관</td>\n<td>40</td>\n</tr>\n<tr>\n<td>포만점 (satiation point)</td>\n<td>이 수준 이후 수입이 행복을 더 늘리지 않음</td>\n<td>41</td>\n</tr>\n<tr>\n<td>지니계수 (Gini coefficient)</td>\n<td>소득 불평등 지표 — 높을수록 저소득층 건강·심리 문제</td>\n<td>41</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>시험 대비 핵심 요약</h2>\n<ol>\n<li><strong>동기 이론 4개</strong>(p.8 표): <strong>본능</strong>(학습 안 한 종 특유 행동, 유전) / <strong>추동 감소</strong>(생리적 욕구 → 추동 → 감소 행동, 항상성) / <strong>각성</strong>(최적 각성 수준, 여키스-닷슨) / <strong>매슬로우 욕구 위계</strong>(하위 생리 욕구 우선, 단 순서가 보편 고정은 아님).</li>\n<li><strong>추동(push) + 유인자극(pull)</strong> 이 동시에 있으면 추동이 더 강해진다 — 동기는 생리 × 환경의 상호작용.</li>\n<li><strong>여키스-닷슨 법칙</strong>: 적당한 각성이 최적 수행. <strong>어려운 과제는 낮은 각성</strong>이 유리.</li>\n<li><strong>배고픔의 생리</strong>: 위 수축(Cannon &amp; Washburn) — 그러나 위 없는 쥐도 배고픔 → 위가 전부 아님. 혈당 → <strong>시상하부</strong>(궁상핵) 감지.</li>\n<li><strong>식욕 호르몬</strong>: <strong>그렐린</strong>(위, 배고픔↑), <strong>오렉신</strong>(시상하부, 식욕↑) vs <strong>PYY</strong>(소화관, 배고픔↓), <strong>렙틴</strong>(지방세포, 배고픔↓).</li>\n<li><strong>조절점</strong>과 <strong>기초대사율</strong> → 일정 체중으로 회귀하려는 경향 = 요요 현상.</li>\n<li><strong>배고픔의 심리·사회문화</strong>: 마지막 식사의 <strong>기억</strong>(기억상실증 환자 반복 식사), 단맛·짠맛 선호는 <strong>유전·보편</strong>, 나머지는 <strong>조건형성</strong>, <strong>낯섦 공포증</strong>, 친구와는 더 먹고 데이트에선 덜 먹고, 양·뷔페 효과.</li>\n<li><strong>소속 욕구</strong>(Baumeister &amp; Leary): 진화적·선천적. 사회적 배척 = <strong>전측대상회</strong> 활성(신체 고통과 같은 영역), 악순환·공격성. <strong>자기 결정 이론</strong> = 유능성·자율성·관계성.</li>\n<li><strong>SNS</strong>: 연결 vs 비교(우울). 정신건강과는 <strong>약한 정적 상관</strong>, 실험 결과는 <strong>비일관</strong> → 일장일단. 자기노출은 관계 증진, 동시에 자기애 촉진.</li>\n<li><strong>성취 동기</strong>가 재능보다 수행을 더 잘 예측(Bloom). <strong>그릿</strong>(Duckworth) = 장기 목표 열정·집념(성실성·자기제어와 같다는 비판). <strong>내재적</strong>(활동 자체) vs <strong>외재적</strong>(보상·처벌).</li>\n<li><strong>정서 이론 4개</strong>(p.33 표): <strong>제임스-랑게</strong>(신체 → 정서) / <strong>캐넌-바드</strong>(동시·독립) / <strong>샥터-싱어 2요인</strong>(각성 + 명명) / <strong>자이언스·르두(·라자루스)</strong>(의식적 평가 없이 즉각 정서 가능).</li>\n<li><strong>샥터-싱어 실험</strong>: 에피네프린 효과를 <strong>고지받은</strong> 집단은 정서 표식을 붙이지 않음 → 해석(명명)의 중요성.</li>\n<li><strong>정서 신경 회로</strong>: <strong>윗길</strong>(시상 → 피질 → 편도체, 복잡·신중) vs <strong>아랫길</strong>(시상 → 편도체, 빠름·무의식 가능).</li>\n<li><strong>정서 탐지·표현</strong>: 부정적 정서 탐지는 <strong>생득적</strong>, 경험에 따라 모호한 표정 해석이 달라짐(Pollak &amp; Kistler). 여성이 감정에 더 개방적(26개 문화권). <strong>에크만의 6개 보편 정서</strong>, 표출 수준은 문화차(개인주의 장려 / 집단주의 억제), 제스처(V자) 해석은 문화마다 다름.</li>\n<li><strong>얼굴 피드백 효과 / 행동 피드백 효과</strong> — 신체가 정서를 바꾼다(제임스-랑게 지지).</li>\n<li><strong>분노</strong>: Fight 촉발, 염증·테스토스테론↑. <strong>카타르시스는 일시적·부적응적</strong>. 대처: 기다리기·다른 활동·거리 두기.</li>\n<li><strong>행복</strong>: 긍정 정보 집중, 삶 만족 높음, 20세 행복도가 결혼 만족 예측. <strong>기분 좋음·선행 현상</strong>(양방향).</li>\n<li><strong>긍정심리학</strong>: 긍정적 안녕감(과거 <strong>만족</strong> + 현재 <strong>행복</strong> + 미래 <strong>낙관</strong>) / 긍정적 품성 / 긍정적 집단·사회·문화. 20세기 부정 정서 연구와 차별.</li>\n<li><strong>돈과 행복</strong>: <strong>포만점</strong>까지만 증가. <strong>지니계수</strong> 높은(불평등) 국가는 저소득층 건강·심리 문제 빈번. 사람들은 격차가 적은 것을 선호.</li>\n<li>헷갈리는 쌍<ul>\n<li>추동 감소 이론(각성↓) vs 각성 이론(최적 수준, 때로 각성↑)</li>\n<li>그렐린(위, 배고픔↑) vs 렙틴(지방, 배고픔↓) vs PYY(소화관, 배고픔↓)</li>\n<li>조절점(체중 지점) vs 기초대사율(에너지 소비율)</li>\n<li>제임스-랑게(신체 → 정서) vs 캐넌-바드(동시) vs 2요인(각성 + 해석)</li>\n<li>윗길(피질 경유) vs 아랫길(피질 우회)</li>\n<li>내재적 동기(활동 자체) vs 외재적 동기(보상·처벌)</li>\n<li>얼굴 피드백(표정) vs 행동 피드백(걸음·자세)</li>\n<li>긍정적 안녕감의 시간 축: 과거=만족, 현재=행복, 미래=낙관</li>\n</ul>\n</li>\n</ol>\n","len":25823}],"cards":[{"id":"c7001","ch":"ch7","tag":"명칭","front":"<p>유사한 대상·사건·아이디어 등에 대한 <strong>심적 집단(mental grouping)</strong>. 덕분에 사고가 크게 단순화된다</p>\n","back":"<p><strong>개념 (Concept)</strong> — &#39;공을 던진다&#39; 한마디로 수많은 공·동작을 한 번에 가리킨다. 교수: 수학으로 치면 &#39;집합&#39;</p>\n","src":"7장 p.2"},{"id":"c7002","ch":"ch7","tag":"명칭","front":"<p>어떤 개념의 <strong>최선의 본보기</strong>(가장 전형적·평균에 가까운 사례). 교수 예: 의자 = 다리 4개 + 앉는 판 + 등받이</p>\n","back":"<p><strong>원형 (Prototype)</strong> — 그러나 빈백·등받이 없는 의자처럼 원형이 범주 전체를 설명하지는 못한다</p>\n","src":"7장 p.2"},{"id":"c7003","ch":"ch7","tag":"명칭","front":"<p>입력된 데이터를 일련의 <strong>범주로 분리</strong>하려는 <strong>선천적 편향성</strong>. 합성 얼굴 70%도 90%처럼 한쪽 범주로 판단</p>\n","back":"<p><strong>범주화 지각 (Categorical perception)</strong> — 원형에서 멀수록 경계가 모호(고래·토마토)</p>\n","src":"7장 p.3"},{"id":"c7004","ch":"ch7","tag":"학자","front":"<p>범주 안에서 특정 심상·최선의 본보기(원형)를 발달시켜 개념을 형성한다고 본 학자 (1978)</p>\n","back":"<p><strong>로시 (Rosch, 1978)</strong></p>\n","src":"7장 p.3"},{"id":"c7005","ch":"ch7","tag":"명칭","front":"<p>시행착오를 최소화하는 <strong>단계적</strong> 문제 해결 과정. 해결책을 <strong>보장</strong>하지만 느리고 인지적 자원 소모가 크다</p>\n","back":"<p><strong>알고리즘 (algorithm)</strong> — 교수 예: 성냥개비 6개로 삼각형 4개를 하나씩 대 보며 찾기(정답 삼각뿔)</p>\n","src":"7장 p.4"},{"id":"c7006","ch":"ch7","tag":"명칭","front":"<p>문제의 해결책을 <strong>갑작스레 깨닫는</strong> 현상(&#39;아하!&#39; 경험)</p>\n","back":"<p><strong>통찰 (insight)</strong> — 교수 예: 「레이튼 교수」 수수께끼. 직전 전두엽, 직후 우반구 측두엽 활동 급증</p>\n","src":"7장 p.5"},{"id":"c7007","ch":"ch7","tag":"명칭","front":"<p>어떤 생각을 <strong>지지하는 증거만</strong> 선택적으로 찾으려는 인지적 경향</p>\n","back":"<p><strong>확증 편향 (confirmation bias)</strong> — p.22: 장점 &#39;지지 증거에 대한 신속한 재인&#39;, 단점 &#39;상반된 증거의 재인 방해&#39;</p>\n","src":"7장 p.5, 22"},{"id":"c7008","ch":"ch7","tag":"명칭","front":"<p>확증 편향이 이어져 <strong>새로운 각도에서 문제를 보지 못하는</strong> 상태</p>\n","back":"<p><strong>고착 (Fixation)</strong> — p.22: 장점 &#39;생각에 몰두&#39;, 단점 &#39;창의적 문제 해결 방해&#39;</p>\n","src":"7장 p.5, 22"},{"id":"c7009","ch":"ch7","tag":"명칭","front":"<p>과거에 통했던 방식으로만 문제에 접근하려는 경향 (고착의 대표 형태, 4장 지각 갖춤새와 연결)</p>\n","back":"<p><strong>마음 갖춤새 (mental set)</strong> — 틀만들기도 마음 갖춤새를 형성해 사고를 유도한다(p.12)</p>\n","src":"7장 p.5, 12"},{"id":"c7010","ch":"ch7","tag":"명칭","front":"<p>판단과 문제 해결을 <strong>효율적</strong>으로 만드는 <strong>간단한 사고 방략</strong>(사고의 지름길). 다른 이름: 어림법·추단법</p>\n","back":"<p><strong>발견법 (Heuristics)</strong> — 신속하지만 실수 가능성 높음, 인지 자원 절약. 알고리즘과 혼용 가능</p>\n","src":"7장 p.6"},{"id":"c7011","ch":"ch7","tag":"명칭","front":"<p>사건의 가능성을 <strong>원형과 비교</strong>해 어림 — 실제 통계적 분포(기저율)와 무관하게 과대 추정</p>\n","back":"<p><strong>대표성 발견법 (Representative Heuristic)</strong> — 시 읽는 마른 사람 → 영문학 교수? (교수 400 vs 트럭 운전수 350만)</p>\n","src":"7장 p.7"},{"id":"c7012","ch":"ch7","tag":"명칭","front":"<p>선명성·최신성·차별성 때문에 <strong>기억에서 접근이 쉬울수록</strong> 그 사건의 가능성을 높게 추정</p>\n","back":"<p><strong>가용성 발견법 (Availability Heuristic)</strong> — 비행기 사고·범죄 보도 → 과도한 공포. 1장 &#39;강력한 사례의 가용성&#39;과 같은 내용</p>\n","src":"7장 p.8"},{"id":"c7013","ch":"ch7","tag":"명칭","front":"<p>효율을 추구해 직관적·자동적 지름길로 생각하는 인간의 특성 — 대표성·가용성 발견법의 공통 뿌리</p>\n","back":"<p><strong>인지적 구두쇠 (Cognitive Miser)</strong></p>\n","src":"7장 p.9"},{"id":"c7014","ch":"ch7","tag":"명칭","front":"<p>자신의 성과(지식·판단의 정확성)를 <strong>과대 추정</strong>하는 경향. 주식 중개인·투자 매니저에게서 많이 나타남</p>\n","back":"<p><strong>과신 (Overconfidence)</strong> — Metcalfe(1998). 국가 단위 예 = 1차 세계대전 슐리펜 계획</p>\n","src":"7장 p.10"},{"id":"c7015","ch":"ch7","tag":"명칭","front":"<p>과신이 일정에서 나타난 것 — 일이 걸릴 시간을 <strong>과소 추정</strong></p>\n","back":"<p><strong>계획 오류 (planning fallacy)</strong></p>\n","src":"7장 p.10"},{"id":"c7016","ch":"ch7","tag":"명칭","front":"<p>자기 인지에 대한 인지 — 과신의 사례가 그 중요성을 보여 준다 (1장에서도 등장)</p>\n","back":"<p><strong>메타인지 (Metacognition)</strong></p>\n","src":"7장 p.10"},{"id":"c7017","ch":"ch7","tag":"명칭","front":"<p>자기 생각의 <strong>토대가 잘못되었음이 판명되어도</strong> 그 생각에 매달리는 경향. 대처 = 반대편 주장 고려</p>\n","back":"<p><strong>신념 집착 (Belief perseverance)</strong> — 교수: 「확증 편향이랑 거의 같은 거」. 반대 증거는 평가 절하(Anglin)</p>\n","src":"7장 p.11"},{"id":"c7018","ch":"ch7","tag":"명칭","front":"<p>어떤 사안에 대해 <strong>논제를 제기하는 방식</strong> — 어떤 틀로 묻느냐에 따라 의사 결정이 달라진다(&#39;생존율 90%&#39; vs &#39;사망률 10%&#39;)</p>\n","back":"<p><strong>틀만들기 (Framing)</strong> — 1장 사회조사의 &#39;말 표현 효과&#39;와 같은 원리</p>\n","src":"7장 p.12"},{"id":"c7019","ch":"ch7","tag":"명칭","front":"<p>틀만들기로 마음 갖춤새를 형성해 특정 방향의 선택을 <strong>유도하는 것</strong></p>\n","back":"<p><strong>넛지 (Nudge)</strong> 를 가하기</p>\n","src":"7장 p.12"},{"id":"c7020","ch":"ch7","tag":"명칭","front":"<p>p.21 표: &#39;<strong>빠르고 자동적인 감정과 사고</strong>&#39; — 장점 적용 범위가 방대하고 적응적, 단점 지나치게 감정적일 수 있음</p>\n","back":"<p><strong>직관 (intuition)</strong> — 이 표에만 독립 항목으로 등장</p>\n","src":"7장 p.21"},{"id":"c7021","ch":"ch7","tag":"명칭","front":"<p><strong>새롭고 가치 있는</strong> 아이디어를 생성하는 능력. 예: 페니실린의 발견</p>\n","back":"<p><strong>창의성 (creativity)</strong> — Hennessey &amp; Amabile(2010). 지능만으로는 설명 불가(뇌 활동이 다름)</p>\n","src":"7장 p.14"},{"id":"c7022","ch":"ch7","tag":"명칭","front":"<p>문제 해결의 <strong>다양성</strong>을 추구하는 사고. 전두엽 손상 시 손상(상상력)</p>\n","back":"<p><strong>확산적 사고 (divergent thinking)</strong> — 예: 벽돌의 용도 많이 대기</p>\n","src":"7장 p.15"},{"id":"c7023","ch":"ch7","tag":"명칭","front":"<p><strong>최선의 해결책 하나</strong>를 결정하는 사고. <strong>대부분의 적성검사</strong>가 요구하며 전두엽 손상 시에도 유지</p>\n","back":"<p><strong>수렴적 사고 (convergent thinking)</strong> — 교수: 「가장 정확한 하나의 답을 고르는 능력」</p>\n","src":"7장 p.15"},{"id":"c7024","ch":"ch7","tag":"학자","front":"<p>창의성 5요소(전문성·상상력 사고 기술·모험지향적 성격·내재적 동기·창의적 환경)를 제안</p>\n","back":"<p><strong>스턴버그 &amp; 루바트 (Sternberg &amp; Lubart, 1991·1992)</strong> — 스턴버그는 삼원 이론(p.35)에도 등장</p>\n","src":"7장 p.16"},{"id":"c7025","ch":"ch7","tag":"명칭","front":"<p>창의성 요소: <strong>흥미·즐거움</strong>(자아 실현감)에 기반한 추진력 — 외적 보상보다 창의성을 더 높인다</p>\n","back":"<p><strong>내재적 동기 (intrinsic motivation)</strong> — Amabile &amp; Hennessy(1992). 교수: 「즐기는 사람은 이기기 어렵다」</p>\n","src":"7장 p.16, 18"},{"id":"c7026","ch":"ch7","tag":"명칭","front":"<p>한 문제에 계속 매달리지 말고 <strong>잠시 시간을 두어</strong> 무의식적 처리가 연합을 형성하게 하는 창의성 함양법</p>\n","back":"<p><strong>부화시간 (incubation)</strong> — 고착 방지. 예: 하룻밤 자고 레포트를 다시 보기(Zhong et al., 2008)</p>\n","src":"7장 p.19"},{"id":"c7027","ch":"ch7","tag":"명칭","front":"<p>소리를 구분할 수 있는 <strong>최소 단위</strong> (예: &#39;ㄱ&#39;, &#39;ㅏ&#39;, bat의 b·a·t)</p>\n","back":"<p><strong>음소 (Phoneme)</strong></p>\n","src":"7장 p.24"},{"id":"c7028","ch":"ch7","tag":"명칭","front":"<p><strong>의미</strong>를 구성하는 최소 단위 (예: 먹- + -었- + -다, re- + read + -ing)</p>\n","back":"<p><strong>형태소 (Morpheme)</strong></p>\n","src":"7장 p.24"},{"id":"c7029","ch":"ch7","tag":"명칭","front":"<p>단어를 조직화해 소통할 수 있게 해 주는 <strong>규칙 시스템</strong> (의미론 + 통사론)</p>\n","back":"<p><strong>문법 (Grammar)</strong></p>\n","src":"7장 p.24"},{"id":"c7030","ch":"ch7","tag":"명칭","front":"<p>소리로부터 <strong>의미</strong>를 도출하는 규칙</p>\n","back":"<p><strong>의미론 (semantics)</strong></p>\n","src":"7장 p.24"},{"id":"c7031","ch":"ch7","tag":"명칭","front":"<p>단어의 <strong>배열</strong>로 문장을 구성하는 규칙</p>\n","back":"<p><strong>통사론 (syntax)</strong></p>\n","src":"7장 p.24"},{"id":"c7032","ch":"ch7","tag":"명칭","front":"<p><strong>제한된 기호의 조합</strong>으로 <strong>무한한 메시지</strong>를 생성하는 언어의 특성 (한국어 자음 19 + 모음 21)</p>\n","back":"<p><strong>언어의 생산성 (generativity)</strong></p>\n","src":"7장 p.24"},{"id":"c7033","ch":"ch7","tag":"명칭","front":"<p>언어마다 보편적인 통사 규칙이 존재 — 문법 구조 자체가 아니라 <strong>그것을 학습할 소양</strong>을 타고난다</p>\n","back":"<p><strong>보편 문법 (universal grammar)</strong> — <strong>촘스키</strong>. 교수 예: 핀란드어와 한국어의 문법 유사성. 비판: 실제 언어는 더 다양(Bergen)</p>\n","src":"7장 p.25"},{"id":"c7034","ch":"ch7","tag":"명칭","front":"<p><strong>말한 것을 이해</strong>하는 능력이 발달하는 초기 단계 — 말은 못 해도 말소리 차이를 재인, 입술 모양으로 소리 구분</p>\n","back":"<p><strong>수용성 언어 (receptive language)</strong> — 표현성보다 먼저. 교수: 4장 맥거크 효과와 연결</p>\n","src":"7장 p.26"},{"id":"c7035","ch":"ch7","tag":"명칭","front":"<p><strong>말을 할 수 있는</strong> 능력 — 옹알이 → 한 단어 → 두 단어 단계로 발달</p>\n","back":"<p><strong>표현성 언어 (productive language)</strong></p>\n","src":"7장 p.27"},{"id":"c7036","ch":"ch7","tag":"명칭","front":"<p>약 <strong>4개월</strong>, 언어와 무관한 소리 생성 — 어른 말소리의 <strong>모방이 아님</strong></p>\n","back":"<p><strong>옹알이 단계 (babbling stage)</strong></p>\n","src":"7장 p.27"},{"id":"c7037","ch":"ch7","tag":"명칭","front":"<p>약 <strong>24개월</strong>, 2개 단어로 간단한 문장 — 주로 <strong>명사 + 동사</strong> 통사 규칙</p>\n","back":"<p><strong>두 단어 단계 (two-word stage)</strong> — 이후 문장 구성 능력 급속 발전</p>\n","src":"7장 p.27"},{"id":"c7038","ch":"ch7","tag":"명칭","front":"<p>언어 학습 효율이 가장 좋은 기간(대략 <strong>7세까지</strong>). 입양아는 출생 국가 언어를 쉽게 습득, 성인 학습 시 모국어 억양</p>\n","back":"<p><strong>결정적 시기 (= 민감 시기, Critical Period)</strong> — 신경 가소성과 밀접. 노출 최선책 = 동화책 읽어 주기</p>\n","src":"7장 p.28"},{"id":"c7039","ch":"ch7","tag":"명칭","front":"<p>언어의 <strong>표현(산출)</strong> 담당 영역(좌반구 전두엽). 손상 시 온전한 문장 발화 불가 — 그러나 의도 이해는 큰 어려움 없음</p>\n","back":"<p><strong>브로카 영역 (Broca&#39;s area)</strong> — 「아침… 밥… 먹고… 학교… 갔어요」. 교수 「중요한 거는」 이해는 가능하다는 점</p>\n","src":"7장 p.29"},{"id":"c7040","ch":"ch7","tag":"명칭","front":"<p>언어의 <strong>이해</strong> 담당 영역(좌반구 측두엽). 손상 시 발화는 유창하나 <strong>내용이 와해</strong></p>\n","back":"<p><strong>베르니케 영역 (Wernicke&#39;s area)</strong> — 「밥이 학교를 지나가니까 … 좋은 시간을 했어요」</p>\n","src":"7장 p.29"},{"id":"c7041","ch":"ch7","tag":"명칭","front":"<p>언어 자체가 사람의 기본 생각을 <strong>결정</strong>한다는 입장 — 교수 예: 『1984』의 신어</p>\n","back":"<p><strong>언어결정론 (= 사피어-워프 가설)</strong> — 비판: 지칭하는 단어가 없어도 생각할 수 있다</p>\n","src":"7장 p.30"},{"id":"c7042","ch":"ch7","tag":"명칭","front":"<p>언어가 사고에 <strong>영향</strong>을 미친다는 입장(결정론의 약화된 버전) — 영어는 자기중심 정서, 일본어는 대인관계 정서 어휘가 많다</p>\n","back":"<p><strong>언어상대성 (linguistic relativity)</strong> — Gentner(2016). 이중언어 화자는 언어별로 자기 개념이 다름(Pavlenko)</p>\n","src":"7장 p.30"},{"id":"c7043","ch":"ch7","tag":"명칭","front":"<p>지능을 <strong>단일 지표(g 요인)</strong> 로, <strong>요인 분석</strong>을 통한 군집화로 산출 — 모든 지적 행동은 단일 능력에서 비롯</p>\n","back":"<p><strong>일반 지능 (General intelligence, g)</strong> — <strong>스피어만 (Spearman, 1904)</strong></p>\n","src":"7장 p.32"},{"id":"c7044","ch":"ch7","tag":"명칭","front":"<p>서로 상관된 점수들의 <strong>군집</strong>을 찾아내는 통계 기법 — 스피어만이 g를 산출할 때 사용</p>\n","back":"<p><strong>요인 분석 (factor analysis)</strong></p>\n","src":"7장 p.32"},{"id":"c7045","ch":"ch7","tag":"명칭","front":"<p>지능을 1차적으로 <strong>7가지</strong>로 분류 — 스피어만에 반대했으나 능력 간 <strong>정적 상관</strong>이 나와 g의 영향력을 인정</p>\n","back":"<p><strong>1차 심적 능력 (primary mental abilities)</strong> — <strong>서스톤 (Thurstone)</strong>. 교수: 「중간적인 위치」</p>\n","src":"7장 p.33"},{"id":"c7046","ch":"ch7","tag":"명칭","front":"<p>지능은 <strong>상대적으로 독립적인 8개 영역</strong> — 근거: 한 영역이 손상돼도 다른 영역은 온전</p>\n","back":"<p><strong>다중 지능 이론 (multiple intelligences)</strong> — <strong>가드너 (Gardner)</strong>. 교수: 근거 = 이중 해리</p>\n","src":"7장 p.34"},{"id":"c7047","ch":"ch7","tag":"명칭","front":"<p>지능 검사·언어 능력에는 제한이 있으나 특정 영역(수학·예술 등)에서 굉장히 뛰어난 능력 — 자폐 스펙트럼 장애를 함께 갖는 경우가 많음</p>\n","back":"<p><strong>현자 증후군 (savant syndrome)</strong> — Treffert(2010). 가드너 다중 지능의 근거</p>\n","src":"7장 p.34"},{"id":"c7048","ch":"ch7","tag":"명칭","front":"<p>교수 용어(슬라이드 없음): A 영역만 손상 → A 기능만, B 영역만 손상 → B 기능만 손상되는 패턴 (예: 브로카/베르니케 실어증)</p>\n","back":"<p><strong>이중 해리 (double dissociation)</strong> — 가드너가 영역의 독립성을 주장하는 근거</p>\n","src":"7장 p.34 🎙"},{"id":"c7049","ch":"ch7","tag":"명칭","front":"<p>지능을 <strong>분석·창의성·현실</strong> 3개 하위 영역으로 분류</p>\n","back":"<p><strong>삼원 이론 (triarchic theory)</strong> — <strong>스턴버그 (Sternberg)</strong></p>\n","src":"7장 p.35"},{"id":"c7050","ch":"ch7","tag":"명칭","front":"<p>사회 상황을 이해하고 자신을 공적으로 관리하는 <strong>노하우</strong></p>\n","back":"<p><strong>사회 지능 (social intelligence)</strong> — <strong>손다이크 (1920)</strong></p>\n","src":"7장 p.37"},{"id":"c7051","ch":"ch7","tag":"명칭","front":"<p>사회 지능의 일환 — 타인의 정서를 <strong>이해</strong>하고 자신의 정서를 <strong>관리</strong>하는 능력 (4성분)</p>\n","back":"<p><strong>정서 지능 (emotional intelligence)</strong> — 지각·이해·관리·사용. 비판: 지능 개념 과도 확장(Waterhouse)</p>\n","src":"7장 p.37–38"},{"id":"c7052","ch":"ch7","tag":"명칭","front":"<p>개인의 <strong>심적 적성</strong>을 평가하는 도구</p>\n","back":"<p><strong>지능 검사 (intelligence test)</strong></p>\n","src":"7장 p.40"},{"id":"c7053","ch":"ch7","tag":"명칭","front":"<p><strong>이미 학습한 내용</strong>을 평가하는 검사 (교수 예: 여러분이 쳤던 중간고사)</p>\n","back":"<p><strong>성취 검사 (achievement test)</strong></p>\n","src":"7장 p.40"},{"id":"c7054","ch":"ch7","tag":"명칭","front":"<p>개인의 <strong>미래 성취를 예측</strong>하는 검사 (IQ와 SAT 상관 약 0.82)</p>\n","back":"<p><strong>적성 검사 (aptitude test)</strong></p>\n","src":"7장 p.40"},{"id":"c7055","ch":"ch7","tag":"학자","front":"<p>근력·신체 비율·반응 시간으로 &#39;지적 강도&#39;를 재려 했으나 지표 간 상관이 유의하지 않아 실패</p>\n","back":"<p><strong>프랜시스 골턴 (Francis Galton)</strong></p>\n","src":"7장 p.41"},{"id":"c7056","ch":"ch7","tag":"학자","front":"<p>아동의 <strong>정신 연령</strong>을 측정해 학업 성취를 예측 — 생득적 지능 측정은 목표가 아님 (프랑스 의무 교육 배경)</p>\n","back":"<p><strong>알프레드 비네 (Alfred Binet)</strong></p>\n","src":"7장 p.41"},{"id":"c7057","ch":"ch7","tag":"명칭","front":"<p>비네 검사 점수가 낮은 아동을 위해 주의·자기훈련 능력을 발달시키도록 &#39;권장&#39;한 것</p>\n","back":"<p><strong>심적 정형술 (mental orthopedics)</strong></p>\n","src":"7장 p.41"},{"id":"c7058","ch":"ch7","tag":"명칭","front":"<p>비네 검사를 토대로 확대·개편, <strong>생득적 지능을 측정할 수 있다고 가정</strong> — 이 검사를 토대로 IQ 공식이 쓰임</p>\n","back":"<p><strong>스탠퍼드-비네 검사 (Stanford-Binet)</strong> — <strong>루이스 터먼 (Lewis Terman)</strong>. 교수: 1차 세계대전 병력 선별에도 사용</p>\n","src":"7장 p.42"},{"id":"c7059","ch":"ch7","tag":"학자","front":"<p>IQ = 정신 연령 ÷ 생활 연령 × 100 공식을 제안</p>\n","back":"<p><strong>윌리엄 스턴 (William Stern)</strong> — 예: 8세가 10세 수준 → 125. 성인에게는 부적합</p>\n","src":"7장 p.42"},{"id":"c7060","ch":"ch7","tag":"명칭","front":"<p>총 <strong>15개 하위 검사</strong>(공통성·어휘·토막짜기·기호 쓰기 등) — <strong>전반적 지능 점수 + 하위 영역별 점수</strong>를 함께 제공</p>\n","back":"<p><strong>웩슬러 성인용 지능 검사 (WAIS)</strong> — 교수: 다중지능 입장과 비슷, 요즘 많이 활용(약 1시간 반)</p>\n","src":"7장 p.43"},{"id":"c7061","ch":"ch7","tag":"명칭","front":"<p>사전에 검사를 받은 집단의 수행과 개인의 수행을 <strong>비교</strong>해 점수의 의미를 정의하는 것 — 검사 개발의 필수 요인</p>\n","back":"<p><strong>표준화 (Standardization)</strong> — 비교 기준 집단 = 표준화 집단. 교수: 충분한 표본 수가 가장 중요</p>\n","src":"7장 p.44"},{"id":"c7062","ch":"ch7","tag":"명칭","front":"<p>평균 근처에 대부분이 몰리고 극단으로 갈수록 빈도가 낮아지는 <strong>종 모양</strong> 분포</p>\n","back":"<p><strong>정규곡선 (normal curve, 정규분포)</strong> — 지능 검사 평균 100</p>\n","src":"7장 p.45"},{"id":"c7063","ch":"ch7","tag":"명칭","front":"<p>슬라이드: &#39;표본이 커질수록 데이터 곡선은 정규분포에 가까워짐&#39;</p>\n","back":"<p><strong>중심극한정리</strong> — 교수: 충분한 표본 수를 모아 사전 테스트했느냐가 가장 중요(치매 판별 도구 최소 300명)</p>\n","src":"7장 p.45"},{"id":"c7064","ch":"ch7","tag":"명칭","front":"<p>검사가 <strong>일관된 점수</strong>를 산출하는지의 여부</p>\n","back":"<p><strong>신뢰도 (Reliability)</strong> — 검사-재검사 + 반분, 교수: 「두 가지가 모두 갖춰져야」</p>\n","src":"7장 p.46"},{"id":"c7065","ch":"ch7","tag":"명칭","front":"<p><strong>동일 검사를 반복</strong> 실시해도 유사한 점수가 나오는지로 확인하는 신뢰도</p>\n","back":"<p><strong>검사-재검사 신뢰도 (test-retest reliability)</strong></p>\n","src":"7장 p.46"},{"id":"c7066","ch":"ch7","tag":"명칭","front":"<p>검사를 절반으로 나눠 <strong>짝수 문항과 홀수 문항</strong> 점수가 일치하는지로 확인하는 신뢰도</p>\n","back":"<p><strong>반분 신뢰도 (split-half reliability)</strong></p>\n","src":"7장 p.46"},{"id":"c7067","ch":"ch7","tag":"명칭","front":"<p>검사가 <strong>측정·예측하고자 하는 것</strong>을 실제로 해내는지의 여부</p>\n","back":"<p><strong>타당도 (Validity)</strong> — 교수 예: 운동 능력 검사를 운동과 무관한 문항으로 만들면 타당하지 않음</p>\n","src":"7장 p.47"},{"id":"c7068","ch":"ch7","tag":"명칭","front":"<p>검사 점수와 <strong>기준 행동</strong> 사이의 상관 — 점수가 실제 행동을 예측하는가</p>\n","back":"<p><strong>예측 타당도 (predictive validity)</strong></p>\n","src":"7장 p.47"},{"id":"c7069","ch":"ch7","tag":"개념","front":"<p>창의성 5요소 각각의 정의 (전·상·모·내·환)</p>\n","back":"<p><strong>전문성</strong> = 잘 갖춰진 기반 지식(무에서 유 X) / <strong>상상력 사고 기술</strong> = 새로운 방식으로 분석(관점 변화) / <strong>모험지향적 성격</strong> = 새 경험 추구·단호함 / <strong>내재적 동기</strong> = 흥미·즐거움 / <strong>창의적 환경</strong> = 의견 공유·소통, 토론과 지도</p>\n","src":"7장 p.16–18"},{"id":"c7070","ch":"ch7","tag":"개념","front":"<p>정서 지능 4성분 각각의 정의 (지·이·관·사)</p>\n","back":"<p><strong>정서 지각</strong> = 얼굴·음악·이야기에서 정서 재인 / <strong>정서 이해</strong> = 정서를 예측·변화·완화 / <strong>정서 관리</strong> = 정서 표현 + 타인 정서에 대처 / <strong>정서 사용</strong> = 적응적·창의적 사고 촉진에 정서 활용</p>\n","src":"7장 p.37"},{"id":"c7071","ch":"ch7","tag":"개념","front":"<p>삼원 이론의 세 지능</p>\n","back":"<p><strong>분석 지능</strong> = 지정된 하나의 답 → 학업 성적 예측(수렴적 사고) / <strong>창의성 지능</strong> = 새로운 아이디어 / <strong>현실 지능</strong> = 다중 해법의 일상 문제. 장점: 측정상 신뢰도 높음, 비판: 세 영역이 독립적이지 않을 수 있음</p>\n","src":"7장 p.35, 39"},{"id":"c7072","ch":"ch7","tag":"개념","front":"<p>알고리즘 vs 발견법 — 둘을 가르는 한 문장</p>\n","back":"<p>알고리즘은 <strong>느리지만 해결을 보장</strong>, 발견법은 <strong>빠르지만 오류 위험</strong>이 높다(인지 자원: 많이 vs 적게). 사람은 둘을 혼용한다</p>\n","src":"7장 p.4, 6, 21"},{"id":"c7073","ch":"ch7","tag":"개념","front":"<p>대표성 vs 가용성 발견법 — 판별 요령</p>\n","back":"<p>&#39;…처럼 보여서 / 전형적이라서&#39; → <strong>대표성</strong>(원형 비교, 기저율 무시). &#39;최근 봤다 / 쉽게 떠오른다 / 뉴스에서&#39; → <strong>가용성</strong>(기억 접근 용이성)</p>\n","src":"7장 p.9"},{"id":"c7074","ch":"ch7","tag":"개념","front":"<p>확증 편향 vs 신념 집착</p>\n","back":"<p>확증 편향 = 증거를 <strong>찾는 단계</strong>에서 지지 증거만 수집. 신념 집착 = 신념이 <strong>반박된 뒤에도</strong> 유지(반대 증거 무시·평가 절하). 교수는 「거의 같은 것」이라고도 함</p>\n","src":"7장 p.11, 22"},{"id":"c7075","ch":"ch7","tag":"개념","front":"<p>확산적 vs 수렴적 사고</p>\n","back":"<p>확산 = <strong>다양한</strong> 해결책(창의성 검사, 전두엽 손상 시 손상) / 수렴 = <strong>최선의 하나</strong>(적성검사, 전두엽 손상 시 유지). 교수: 연구자에게는 둘 다 필요</p>\n","src":"7장 p.15"},{"id":"c7076","ch":"ch7","tag":"개념","front":"<p>수용성 vs 표현성 언어</p>\n","back":"<p>수용성 = <strong>이해</strong>(먼저 발달) / 표현성 = <strong>산출</strong>(옹알이 4개월 → 한 단어 12개월 → 두 단어 24개월)</p>\n","src":"7장 p.26–27"},{"id":"c7077","ch":"ch7","tag":"개념","front":"<p>브로카 vs 베르니케 실어증</p>\n","back":"<p>브로카 = 산출 장애: 말이 끊기지만 <strong>이해·의도는 유지</strong> / 베르니케 = 이해 장애: 말은 <strong>유창</strong>하나 <strong>내용 와해</strong>. 둘 다 좌반구</p>\n","src":"7장 p.29"},{"id":"c7078","ch":"ch7","tag":"개념","front":"<p>언어결정론 vs 언어상대성</p>\n","back":"<p>결정론(사피어-워프) = 언어가 사고를 <strong>결정</strong>(극단적) / 상대성 = 언어가 사고에 <strong>영향</strong>(약화판). 최종 결론: 언어와 사고는 양방향</p>\n","src":"7장 p.30–31"},{"id":"c7079","ch":"ch7","tag":"개념","front":"<p>서스톤 vs 가드너 — 단순히 개수 차이가 아닌 이유</p>\n","back":"<p>서스톤 7능력은 서로 <strong>상관이 있어</strong> g의 영향 인정(중간 입장) / 가드너 8영역은 <strong>독립적</strong>. 교수: 「단순히 영역 개수를 다르게 봤다는 게 아니라」 독립성이 핵심</p>\n","src":"7장 p.33–34, 39"},{"id":"c7080","ch":"ch7","tag":"개념","front":"<p>지능 이론 숫자 매칭 (p.39)</p>\n","back":"<p><strong>스피어만 1(g) · 스턴버그 3 · 정서 지능 4 · 서스톤 7 · 가드너 8</strong></p>\n","src":"7장 p.39"},{"id":"c7081","ch":"ch7","tag":"개념","front":"<p>p.39 지능 이론별 비판(다른 고려사항)</p>\n","back":"<p>g: 단일 지표로 묶을 수 없음 / 서스톤: 분할되나 g 영향 존재 / 가드너: <strong>모든 능력을 지능이라 칭할 필요 없음</strong> / 스턴버그: 세 영역이 <strong>독립적이지 않을 수</strong> 있음 / 정서 지능: 지능 개념 <strong>과하게 확대</strong></p>\n","src":"7장 p.39"},{"id":"c7082","ch":"ch7","tag":"개념","front":"<p>비네 vs 터먼</p>\n","back":"<p>비네 = 정신 연령, 학업 성취 예측, <strong>생득 지능 측정 목표 아님</strong> / 터먼 = 스탠퍼드-비네, <strong>생득 지능 측정 가능</strong>하다고 가정</p>\n","src":"7장 p.41–42"},{"id":"c7083","ch":"ch7","tag":"개념","front":"<p>지능 검사 vs 성취 검사 vs 적성 검사</p>\n","back":"<p>지능 = 심적 적성 / 성취 = <strong>과거</strong>(이미 학습한 것) / 적성 = <strong>미래</strong> 성취 예측</p>\n","src":"7장 p.40"},{"id":"c7084","ch":"ch7","tag":"개념","front":"<p>신뢰도 vs 타당도</p>\n","back":"<p>신뢰도 = 매번 <strong>같은</strong> 점수가 나오나(일관성) / 타당도 = <strong>재려던 것</strong>을 재고 있나. 신뢰도가 높아도 타당도는 낮을 수 있다</p>\n","src":"7장 p.46–47"},{"id":"c7085","ch":"ch7","tag":"개념","front":"<p>교수의 p.21–22 표 읽는 법</p>\n","back":"<p>알고리즘·발견법·통찰·직관 = <strong>정확한 사고 vs 효율 추구</strong> / 틀만들기·창의성 = 사고 과정에 <strong>영향</strong>을 주는 방향 / p.22 확증 편향·고착·과신·신념 집착 = 사고를 <strong>왜곡</strong>할 수 있는 요인</p>\n","src":"7장 p.21–22 🎙"},{"id":"c7086","ch":"ch7","tag":"함정","front":"<p>p.21 표의 단점 칸: 통찰의 단점은? 창의성의 단점은?</p>\n","back":"<p>통찰 = <strong>발생하지 않을 수 있음</strong> / 창의성 = <strong>구조화된 관례적 작업</strong>의 방해를 받음 (오류 위험성 높음은 발견법, 시간·노력은 알고리즘, 지나치게 감정적은 직관)</p>\n","src":"7장 p.21"},{"id":"c7087","ch":"ch7","tag":"함정","front":"<p>p.22 표의 장점 칸: 과신의 장점은?</p>\n","back":"<p><strong>쉽고 행복한 결정</strong> (확증 편향 = 지지 증거의 신속한 재인, 고착 = 생각에 몰두, 신념 집착 = 지속적인 신념 지지)</p>\n","src":"7장 p.22"},{"id":"c7088","ch":"ch7","tag":"함정","front":"<p>보편 문법 = 문법 구조 자체를 타고난다?</p>\n","back":"<p><strong>아니다.</strong> 문법 구조 자체를 생득적으로 타고나는 것이 아니라 그것을 <strong>학습할 수 있는 소양</strong>을 타고난다</p>\n","src":"7장 p.25"},{"id":"c7089","ch":"ch7","tag":"함정","front":"<p>옹알이는 어른 말소리를 모방한 것?</p>\n","back":"<p><strong>아니다.</strong> 옹알이(약 4개월)는 언어와 무관한 소리 — 어른 말소리의 <strong>모방이 아님</strong></p>\n","src":"7장 p.27"},{"id":"c7090","ch":"ch7","tag":"함정","front":"<p>두 단어 단계의 통사 규칙: 명사+명사? 명사+동사?</p>\n","back":"<p><strong>명사 + 동사</strong>(슬라이드). 녹음 전사의 &#39;명사 플러스 명사&#39;는 오인식/말실수로 판별 불가 → 슬라이드 우선</p>\n","src":"7장 p.27"},{"id":"c7091","ch":"ch7","tag":"함정","front":"<p>슬라이드 p.24 &#39;일반적으로 모음 음소가 더 많은 정보 포함&#39; — 외워도 되나?</p>\n","back":"<p><strong>의심 문장.</strong> 교과서(Myers)는 반대로 <strong>자음</strong>이 더 많은 정보를 담는다고 설명하고, 이 부분은 녹음도 없다. 이 문장을 정답 근거로 삼지 말 것</p>\n","src":"7장 p.24 ⚠️"},{"id":"c7092","ch":"ch7","tag":"함정","front":"<p>p.34 &#39;서스톤은 각 능력이 유의미한 상관 관계가 존재한다고 주장함&#39; — 수업 답은?</p>\n","back":"<p><strong>슬라이드대로</strong>: 서스톤 = 7능력, 능력 간 상관 인정 → g 영향 인정(중간 입장). 교수가 10/20에 슬라이드 그대로 설명했다(교재 서술과는 결이 다름). 대비: 가드너 = 독립</p>\n","src":"7장 p.33–34 🎙"},{"id":"c7093","ch":"ch7","tag":"함정","front":"<p>WAIS &#39;기호 쓰기&#39; = 숫자·문자 연속을 듣고 규칙대로 정렬?</p>\n","back":"<p>슬라이드 설명은 교과서의 <strong>순서화(letter-number sequencing)</strong> 하위 검사에 해당한다. 하위 검사 이름–설명 짝짓기가 나오면 주의 (교수는 언급 안 함)</p>\n","src":"7장 p.43 ⚠️"},{"id":"c7094","ch":"ch7","tag":"함정","front":"<p>브로카 영역의 위치 — 교수는 「둘 다 … 왼쪽 측두엽 쪽」이라고 말했는데?</p>\n","back":"<p>교과서: 브로카 = <strong>좌반구 전두엽</strong>, 베르니케 = <strong>좌반구 측두엽</strong>. 확실한 것은 &#39;둘 다 좌반구&#39;</p>\n","src":"7장 p.29 🎙"},{"id":"c7095","ch":"ch7","tag":"함정","front":"<p>결정적 시기와 민감 시기는 다른 개념?</p>\n","back":"<p>이 강의 슬라이드는 <strong>같은 것(동의어)</strong> 으로 묶는다: 결정적 시기(= 민감 시기), 대략 7세까지</p>\n","src":"7장 p.28"},{"id":"c7096","ch":"ch7","tag":"함정","front":"<p>스턴버그가 나오는 두 곳</p>\n","back":"<p><strong>창의성 5요소</strong>(Sternberg &amp; Lubart, p.16) + <strong>삼원 이론</strong>(p.35). 둘을 섞은 보기에 주의</p>\n","src":"7장 p.16, 35"},{"id":"c7097","ch":"ch7","tag":"함정","front":"<p>신뢰도가 높으면 타당도도 높다?</p>\n","back":"<p><strong>아니다.</strong> 무관한 문항으로 만들면 점수가 일관돼도(신뢰도↑) 타당도는 낮다. 신뢰도는 타당도의 필요조건일 뿐</p>\n","src":"7장 p.47"},{"id":"c7098","ch":"ch7","tag":"함정","front":"<p>IQ = 정신 연령 ÷ 생활 연령 × 100 은 성인에게도 잘 맞나?</p>\n","back":"<p><strong>아니다.</strong> 아동에게는 맞지만 성인은 부적합(40세가 20세 수준이면 50?). 현대 검사는 <strong>동일 연령 집단 내 상대 위치</strong>(평균 100)로 계산</p>\n","src":"7장 p.42"},{"id":"c8001","ch":"ch8","tag":"명칭","front":"<p>행동의 실현을 수반하거나 그 <strong>방향성</strong>을 설정해 주는 욕구 (교수: 슬라이드 문장 그대로 한 줄 요약)</p>\n","back":"<p><strong>동기 (Motivation)</strong> — 교수: 생물학적·심리적·외부 환경으로 다 설명할 수 있는 광범위한 개념</p>\n","src":"8장 p.2 🎙"},{"id":"c8002","ch":"ch8","tag":"명칭","front":"<p>한 동물 종에서 <strong>철저하게 패턴화</strong>되어 있으며 <strong>학습하지 않은</strong> 복잡한 행동</p>\n","back":"<p><strong>본능 (instinct)</strong> — 교수 예: 신생아가 손에 쥐여 주면 꼭 쥐고, 뺨에 닿으면 그쪽으로 고개를 돌림</p>\n","src":"8장 p.2 🎙"},{"id":"c8003","ch":"ch8","tag":"개념","front":"<p>본능 이론의 한계와 의의 (교수 정리)</p>\n","back":"<p>한계: 인간의 <strong>대부분 동기</strong>를 설명하기 어렵다 / 의의: <strong>유전적 요인의 영향력</strong> 가정은 유지 → <strong>진화심리학의 주요 기제</strong></p>\n","src":"8장 p.2 🎙"},{"id":"c8004","ch":"ch8","tag":"명칭","front":"<p><strong>생리적 욕구</strong>를 충족시키기 위한 행동을 동기화하는 <strong>긴장 상태</strong></p>\n","back":"<p><strong>추동 (Drive)</strong></p>\n","src":"8장 p.3"},{"id":"c8005","ch":"ch8","tag":"명칭","front":"<p>생리적 욕구가 그 욕구를 충족(감소)시키려는 추동을 생성한다 — 욕구(음식 결핍) → 추동(배고픔) → 감소 행동(먹기)</p>\n","back":"<p><strong>추동 감소 이론 (drive-reduction theory)</strong></p>\n","src":"8장 p.3, 8"},{"id":"c8006","ch":"ch8","tag":"명칭","front":"<p><strong>일정한 내적 상태를 유지하려는 경향성</strong> — 피드백 루프로 조절(온도조절기 비유)</p>\n","back":"<p><strong>항상성 (Homeostasis)</strong> — 추동 감소는 항상성 유지의 핵심 기제</p>\n","src":"8장 p.3"},{"id":"c8007","ch":"ch8","tag":"명칭","front":"<p>사람의 행동을 이끌어 낼 수 있는 <strong>모든 유형(긍정/부정)의 자극</strong> — 환경의 영향을 받음, 긍정 자극은 도파민 증가</p>\n","back":"<p><strong>유인자극 (Incentive)</strong> — 욕구(push) + 유인자극(pull)이 동시에 있으면 추동이 더 강화</p>\n","src":"8장 p.4"},{"id":"c8008","ch":"ch8","tag":"명칭","front":"<p>추동 감소와 대비 — 각성의 <strong>증진</strong>으로도 동기가 생긴다(호기심·탐험). 동기의 목표 = <strong>최적의 각성 수준</strong></p>\n","back":"<p><strong>각성 이론 (arousal theory)</strong> — 감각 추구 성향(Zuckerman, 2009)</p>\n","src":"8장 p.5–6, 8"},{"id":"c8009","ch":"ch8","tag":"명칭","front":"<p><strong>적당한 각성</strong>이 최적의 수행을 유도(역U자) — <strong>어려운 과제는 낮은 각성</strong>에서 수행이 높다</p>\n","back":"<p><strong>여키스-닷슨 법칙 (Yerkes-Dodson law, 1908)</strong> — Hembree(1988) 시험 불안 연구</p>\n","src":"8장 p.5–6"},{"id":"c8010","ch":"ch8","tag":"명칭","front":"<p>욕구를 위계로 배열 — <strong>하위 욕구가 우선</strong>, 하위가 미충족이면 다음 단계로 이어지지 않음</p>\n","back":"<p><strong>욕구 위계 (Hierarchy of Needs)</strong> — <strong>매슬로우 (Maslow, 1970)</strong>. 생리 → 안전 → 소속·사랑 → 존중 → 자기실현</p>\n","src":"8장 p.7–8"},{"id":"c8011","ch":"ch8","tag":"학자","front":"<p>준기아(semistarvation) 연구 — 참가자들이 냉담·무기력해지고 먹는 것에만 강박적</p>\n","back":"<p><strong>앤슬 키스 (Ancel Keys, 1950)</strong> — 생리적 욕구가 상위 욕구를 밀어낸다(매슬로우 근거)</p>\n","src":"8장 p.9"},{"id":"c8012","ch":"ch8","tag":"학자","front":"<p>풍선을 삼켜 <strong>위 수축</strong>을 기록 — 위가 수축할 때 배고픔을 느낀다</p>\n","back":"<p><strong>캐넌 &amp; 워시번 (Cannon &amp; Washburn, 1912)</strong> — 그러나 위가 제거된 쥐도 배고픔을 느낌(Tsang)</p>\n","src":"8장 p.10"},{"id":"c8013","ch":"ch8","tag":"명칭","front":"<p>신체의 <strong>주 에너지원</strong> — 그 변화를 감지해 배고픔의 화학적 기제를 수행(떨어지면 배고픔)</p>\n","back":"<p><strong>혈당 (blood glucose)</strong></p>\n","src":"8장 p.11"},{"id":"c8014","ch":"ch8","tag":"명칭","front":"<p>혈액 내 화학적 변화를 감지해 배고픔을 조절하는 두뇌 영역 — 손상 시 굶주린 동물도 먹이에 관심 없음</p>\n","back":"<p><strong>시상하부 (hypothalamus)</strong></p>\n","src":"8장 p.11–12"},{"id":"c8015","ch":"ch8","tag":"명칭","front":"<p>시상하부 안에서 입맛(식욕)을 <strong>촉진</strong>하는 호르몬을 분비하는 부위</p>\n","back":"<p><strong>궁상핵 (arcuate nucleus)</strong> — 슬라이드: 오렉신 분비</p>\n","src":"8장 p.12"},{"id":"c8016","ch":"ch8","tag":"명칭","front":"<p>시상하부가 분비하는 <strong>식욕 촉진</strong>(배고픔 유발) 호르몬</p>\n","back":"<p><strong>오렉신 (orexin)</strong></p>\n","src":"8장 p.12"},{"id":"c8017","ch":"ch8","tag":"명칭","front":"<p>두뇌의 이 부위가 손상되면 섭식의 <strong>중단이 이루어지지 않음</strong>(과식)</p>\n","back":"<p><strong>식욕 억제 중추</strong> — Duggan &amp; Booth(1986). 교재 보충: 복내측 시상하부 쪽</p>\n","src":"8장 p.12"},{"id":"c8018","ch":"ch8","tag":"명칭","front":"<p><strong>공복</strong> 상태의 <strong>위</strong>에서 분비되어 뇌에 &#39;배고프다&#39; 신호</p>\n","back":"<p><strong>그렐린 (ghrelin)</strong> — 그렐린 = 꼬르륵</p>\n","src":"8장 p.13"},{"id":"c8019","ch":"ch8","tag":"명칭","front":"<p><strong>소화관</strong>에서 분비되어 뇌에 &#39;배가 고프지 않다&#39; 신호</p>\n","back":"<p><strong>PYY</strong></p>\n","src":"8장 p.13"},{"id":"c8020","ch":"ch8","tag":"명칭","front":"<p><strong>지방세포</strong>가 분비하는 단백질 호르몬 — 배고픔 감소</p>\n","back":"<p><strong>렙틴 (leptin)</strong> — 지방이 &#39;이제 그만&#39;</p>\n","src":"8장 p.13"},{"id":"c8021","ch":"ch8","tag":"명칭","front":"<p>신체가 설정한 <strong>특정 체중 지점</strong> — 그 아래로 내려가면 배고픔↑·대사↓로 회귀(요요)</p>\n","back":"<p><strong>조절점 (set point)</strong></p>\n","src":"8장 p.14"},{"id":"c8022","ch":"ch8","tag":"명칭","front":"<p>휴식 상태에서 신체의 <strong>기본 에너지 소비율</strong></p>\n","back":"<p><strong>기초대사율 (basal metabolic rate, BMR)</strong> — 조절점과 함께 요요 현상 설명</p>\n","src":"8장 p.14"},{"id":"c8023","ch":"ch8","tag":"명칭","front":"<p><strong>이전에 먹은 적 없는 음식</strong>을 기피하는 경향 — 낯선 음식은 독이 있을 수 있다는 판단</p>\n","back":"<p><strong>낯섦 공포증 (새것 공포증, neophobia)</strong> — 서양권의 두족류·해조류 혐오</p>\n","src":"8장 p.17"},{"id":"c8024","ch":"ch8","tag":"개념","front":"<p>기억상실증 환자가 점심 직후에도 다시 식사를 반복하는 현상이 보여 주는 것</p>\n","back":"<p>식사·포만감 인식은 <strong>기억에 근거</strong>한다 — 마지막 식사에 대한 기억(Rozin et al., 1998)</p>\n","src":"8장 p.15"},{"id":"c8025","ch":"ch8","tag":"개념","front":"<p>유전적이며 <strong>보편적</strong>인 맛 선호 두 가지</p>\n","back":"<p><strong>단맛과 짠맛</strong> — 나머지 맛 선호는 조건형성된 부분(불쾌한 경험 → 혐오). 스트레스 시 단 음식 → 세로토닌</p>\n","src":"8장 p.16"},{"id":"c8026","ch":"ch8","tag":"명칭","front":"<p>사회적 동물로서 지니는 <strong>핵심 동기</strong> — 진화적으로 선천적 특질</p>\n","back":"<p><strong>소속 욕구 / 친애 욕구 (need to belong / affiliation need)</strong> — <strong>Baumeister &amp; Leary (1995)</strong></p>\n","src":"8장 p.19"},{"id":"c8027","ch":"ch8","tag":"명칭","front":"<p>대부분의 사람이 외집단보다 <strong>내집단을 선호</strong>하는 경향</p>\n","back":"<p><strong>내집단 편향 (ingroup bias)</strong></p>\n","src":"8장 p.20"},{"id":"c8028","ch":"ch8","tag":"명칭","front":"<p>인간은 <strong>유능성·자율성·관계성</strong>의 욕구를 채우고자 한다 — 충족 시 스트레스 감소·자존감 고양</p>\n","back":"<p><strong>자기 결정 이론 (Self-Determination Theory)</strong> — 교재: Deci &amp; Ryan</p>\n","src":"8장 p.21"},{"id":"c8029","ch":"ch8","tag":"명칭","front":"<p>SNS상 차단을 당할 때 활성화되는, <strong>실제 신체의 고통</strong>을 담당하는 대뇌 영역</p>\n","back":"<p><strong>전측대상회 (anterior cingulate cortex, ACC)</strong> — 사회적 고통 ≈ 신체적 고통(Rotge et al., 2015)</p>\n","src":"8장 p.22"},{"id":"c8030","ch":"ch8","tag":"명칭","front":"<p>실제 고통과 유사 — 사회성 저하 → 다시 추방되는 <strong>악순환</strong>, 자기파괴·공격적 행동 증가</p>\n","back":"<p><strong>사회적 배척 / 추방 (ostracism)</strong></p>\n","src":"8장 p.22–23"},{"id":"c8031","ch":"ch8","tag":"명칭","front":"<p>즐거움·걱정거리·약점 등을 타인과 <strong>공유</strong>하는 것 — SNS로 늘면 관계가 돈독해짐</p>\n","back":"<p><strong>자기노출 (self-disclosure)</strong> — 동시에 자기애(나르시시즘) 촉진(Weiser)</p>\n","src":"8장 p.26"},{"id":"c8032","ch":"ch8","tag":"학자","front":"<p>SNS 사용과 우울·불안은 <strong>약한 정적 상관</strong>, 사용 여부가 미래 정신 건강 예측, 실험 연구는 비일관</p>\n","back":"<p><strong>Haidt &amp; Twenge (2019)</strong> — 결론: 온라인 네트워킹은 일장일단(상관 ≠ 인과)</p>\n","src":"8장 p.25"},{"id":"c8033","ch":"ch8","tag":"명칭","front":"<p>중요한 성취를 달성하고 <strong>높은 기준을 충족</strong>시키려는 욕구 — 타고난 재능보다 수행을 더 잘 예측(Bloom)</p>\n","back":"<p><strong>성취 동기 (Achievement motivation)</strong></p>\n","src":"8장 p.27"},{"id":"c8034","ch":"ch8","tag":"명칭","front":"<p><strong>장기적 목표</strong>를 향한 <strong>열정과 집념</strong></p>\n","back":"<p><strong>그릿 / 불굴의 투지 (Grit)</strong> — <strong>Duckworth (2016)</strong>. 비판: 성실성·자기제어와 같은 개념</p>\n","src":"8장 p.27"},{"id":"c8035","ch":"ch8","tag":"명칭","front":"<p><strong>수행 자체가 좋아서</strong> 형성되는 동기</p>\n","back":"<p><strong>내재적 동기 (intrinsic motivation)</strong> — 예: 재미있어서 퍼즐을 푼다</p>\n","src":"8장 p.27"},{"id":"c8036","ch":"ch8","tag":"명칭","front":"<p><strong>외부의 보상 혹은 처벌</strong>에 연동해 형성되는 동기</p>\n","back":"<p><strong>외재적 동기 (extrinsic motivation)</strong> — 예: 용돈을 받으려고 공부</p>\n","src":"8장 p.27"},{"id":"c8037","ch":"ch8","tag":"명칭","front":"<p><strong>신체 반응이 정서를 유발</strong>한다 — &#39;곰을 보고 떨려서 무섭다&#39;, &#39;울어서 슬프다&#39;</p>\n","back":"<p><strong>제임스-랑게 이론 (James-Lange theory)</strong> — 지지 근거: Damasio(2003), 얼굴·행동 피드백</p>\n","src":"8장 p.29, 33"},{"id":"c8038","ch":"ch8","tag":"명칭","front":"<p>신체 반응과 정서는 <strong>독립적으로 동시에</strong> 발생 — 신체 반응은 정서마다 유사하고 변화가 느리다는 비판</p>\n","back":"<p><strong>캐넌-바드 이론 (Cannon-Bard theory)</strong></p>\n","src":"8장 p.29, 33"},{"id":"c8039","ch":"ch8","tag":"명칭","front":"<p>정서 = <strong>① 신체적 각성 + ② 그 각성에 대한 인지적 해석(이름 붙이기)</strong></p>\n","back":"<p><strong>샥터-싱어 2요인 이론 (two-factor theory)</strong></p>\n","src":"8장 p.30, 33"},{"id":"c8040","ch":"ch8","tag":"학자","front":"<p><strong>에피네프린</strong> 주사 실험 — 주사 효과를 <strong>고지받은</strong> 집단은 흥분을 약물 탓으로 돌려 정서 표식을 붙이지 않음</p>\n","back":"<p><strong>샥터 &amp; 싱어 (Schachter &amp; Singer, 1962)</strong></p>\n","src":"8장 p.30"},{"id":"c8041","ch":"ch8","tag":"학자","front":"<p><strong>정서 반응은 인지 기반 해석 없이도</strong> 발생 가능 — 역치 하 점화로 탐구</p>\n","back":"<p><strong>자이언스 (Zajonc) · 르두 (LeDoux)</strong></p>\n","src":"8장 p.31, 33"},{"id":"c8042","ch":"ch8","tag":"명칭","front":"<p>지각할 수 없을 만큼 <strong>짧게 제시</strong>된 자극도 반복 경험하면 <strong>더 선호</strong>하게 됨 (Kunst-Wilson &amp; Zajonc, 1980)</p>\n","back":"<p><strong>단순 노출 효과 (mere exposure effect)</strong> — 교재 용어. &#39;인지 없는 정서&#39;의 근거</p>\n","src":"8장 p.31"},{"id":"c8043","ch":"ch8","tag":"명칭","front":"<p><strong>시상 → 대뇌 피질 → 편도체 → 신체</strong> — 피질에서 분석·명명한 뒤 반응, 복잡한 감정 처리</p>\n","back":"<p><strong>신중한 윗길 (high road)</strong></p>\n","src":"8장 p.32"},{"id":"c8044","ch":"ch8","tag":"명칭","front":"<p><strong>시상 → 편도체</strong>(피질 우회) — 즉각 반응, 의식적 자각을 못 할 수도 있음</p>\n","back":"<p><strong>빠른 아랫길 (low road)</strong> — 자이언스·르두 입장의 신경학적 근거</p>\n","src":"8장 p.32"},{"id":"c8045","ch":"ch8","tag":"명칭","front":"<p>정서의 윗길·아랫길이 모두 거치는 정서(공포) 중추</p>\n","back":"<p><strong>편도체 (amygdala)</strong></p>\n","src":"8장 p.32"},{"id":"c8046","ch":"ch8","tag":"명칭","front":"<p>표정·몸짓·시선 처리 등 언어 외적인 방식의 정서 표현</p>\n","back":"<p><strong>비언어적 의사소통 (nonverbal communication)</strong> — 부정적 정서 탐지는 생득적(Burris)</p>\n","src":"8장 p.34"},{"id":"c8047","ch":"ch8","tag":"학자","front":"<p>학대받은 아동은 모호한 표정을 <strong>분노</strong>로 더 빨리 지각 — 경험에 따라 정서 탐지가 달라진다</p>\n","back":"<p><strong>Pollak &amp; Kistler (2002)</strong></p>\n","src":"8장 p.34"},{"id":"c8048","ch":"ch8","tag":"개념","front":"<p><strong>26개 문화권</strong>에서 더 감정에 개방적인 쪽은?</p>\n","back":"<p><strong>여성</strong> (Costa et al., 2001). 남성은 다소 단순한 정서 반응 기술(Barrett). 화난 중성 얼굴은 남성으로 판단(Becker)</p>\n","src":"8장 p.35"},{"id":"c8049","ch":"ch8","tag":"명칭","front":"<p><strong>문화권에 관계없이</strong> 관찰되는 <strong>6개의 보편적 정서</strong> — 유아기부터 관찰</p>\n","back":"<p><strong>에크만의 보편적 정서 (Ekman)</strong> — 행복·슬픔·분노·공포·놀람·혐오. 단, <strong>표출 수준</strong>은 문화차</p>\n","src":"8장 p.36"},{"id":"c8050","ch":"ch8","tag":"개념","front":"<p>개인주의 vs 집단주의 문화권의 정서 표출</p>\n","back":"<p>개인주의 = 눈에 띄는 표출 <strong>장려</strong>, 집단주의 = <strong>억제</strong>(van Hemert). V자 손 표시처럼 같은 제스처도 문화마다 해석이 다름</p>\n","src":"8장 p.36"},{"id":"c8051","ch":"ch8","tag":"명칭","front":"<p><strong>표정</strong>을 통해 정서가 더욱 <strong>증폭·조절</strong>되는 현상 — 미소 근육 하나만 조정해도 스트레스 압박이 줄어듦</p>\n","back":"<p><strong>얼굴 피드백 효과 (facial feedback effect)</strong> — Soussignan(2001)</p>\n","src":"8장 p.37"},{"id":"c8052","ch":"ch8","tag":"명칭","front":"<p><strong>직접 행하는 행동</strong>에 따라 정서가 조절 — 처진 채 걸으면 우울, 힘내 걸으면 기분이 나아짐</p>\n","back":"<p><strong>행동 피드백 효과 (behavior feedback effect)</strong> — Krahe et al.(2018)</p>\n","src":"8장 p.37"},{"id":"c8053","ch":"ch8","tag":"명칭","front":"<p>분노 표출로 감정을 해소한다는 생각 — <strong>일시적 해결책</strong>일 뿐 <strong>부적응적</strong></p>\n","back":"<p><strong>카타르시스 (catharsis)</strong> — 분노 행동은 분노를 더 폭증(Flack). 대처: 기다리기·다른 활동·거리 두기</p>\n","src":"8장 p.38"},{"id":"c8054","ch":"ch8","tag":"명칭","front":"<p><strong>기분이 좋을 때 남에게 도움을 주는</strong> 경향 — 역으로 남을 도우면 행복해진다</p>\n","back":"<p><strong>기분 좋음, 선행 현상 (feel-good, do-good phenomenon)</strong> — Salovey(1990)</p>\n","src":"8장 p.39"},{"id":"c8055","ch":"ch8","tag":"명칭","front":"<p><strong>주관적 안녕감</strong>이 삶의 만족도에 미치는 영향을 탐구 — 20세기의 우울·불안 중심 연구와 차별</p>\n","back":"<p><strong>긍정심리학 (positive psychology)</strong> — 교재: 셀리그먼 주도</p>\n","src":"8장 p.40"},{"id":"c8056","ch":"ch8","tag":"명칭","front":"<p>스스로 지각한 행복감·삶의 만족</p>\n","back":"<p><strong>주관적 안녕감 (subjective well-being)</strong></p>\n","src":"8장 p.40"},{"id":"c8057","ch":"ch8","tag":"명칭","front":"<p>긍정심리학 기둥: <strong>과거에 대한 만족 + 현재에 대한 행복 + 미래에 대한 낙관</strong></p>\n","back":"<p><strong>긍정적 안녕감</strong></p>\n","src":"8장 p.40"},{"id":"c8058","ch":"ch8","tag":"명칭","front":"<p>긍정심리학 기둥: 창의성·용기·자기제어 등의 역량</p>\n","back":"<p><strong>긍정적 품성</strong></p>\n","src":"8장 p.40"},{"id":"c8059","ch":"ch8","tag":"명칭","front":"<p>긍정심리학 기둥: 긍정적 안녕감을 조성하는 환경적 요인</p>\n","back":"<p><strong>긍정적 집단·사회·문화</strong></p>\n","src":"8장 p.40"},{"id":"c8060","ch":"ch8","tag":"명칭","front":"<p>그 수준에 도달하면 수입이 더 이상 행복을 늘리거나 우울을 줄이지 않는 지점</p>\n","back":"<p><strong>포만점 (satiation point)</strong> — Ruberton et al.(2016)</p>\n","src":"8장 p.41"},{"id":"c8061","ch":"ch8","tag":"명칭","front":"<p>소득 불평등 지표 — 높은 국가일수록 저소득층의 건강·심리 장애 문제가 빈번</p>\n","back":"<p><strong>지니계수 (Gini coefficient)</strong> — Sommet et al.(2018). 사람들은 격차가 적은 것을 선호</p>\n","src":"8장 p.41"},{"id":"c8062","ch":"ch8","tag":"개념","front":"<p>추동 감소 이론 vs 각성 이론</p>\n","back":"<p>추동 감소 = 긴장(각성)을 <strong>낮추는</strong> 방향(먹기·마시기) / 각성 = <strong>최적 수준</strong>으로, 필요하면 <strong>높이기</strong>도(호기심·탐험·자극 추구)</p>\n","src":"8장 p.5–6"},{"id":"c8063","ch":"ch8","tag":"개념","front":"<p>push vs pull</p>\n","back":"<p>push = 내적 <strong>욕구</strong>(생리) / pull = 외적 <strong>유인자극</strong>(환경). 둘이 동시에 있으면 추동이 더 강해진다 → 동기 = 생리 × 환경 상호작용</p>\n","src":"8장 p.4, 8"},{"id":"c8064","ch":"ch8","tag":"개념","front":"<p>식욕 호르몬 — 촉진 vs 억제</p>\n","back":"<p>촉진: <strong>그렐린</strong>(위), <strong>오렉신</strong>(시상하부) / 억제: <strong>PYY</strong>(소화관), <strong>렙틴</strong>(지방세포)</p>\n","src":"8장 p.12–13"},{"id":"c8065","ch":"ch8","tag":"개념","front":"<p>조절점 vs 기초대사율</p>\n","back":"<p>조절점 = 신체가 정한 <strong>체중 지점</strong> / 기초대사율 = 휴식 시 <strong>에너지 소비율</strong>. 체중이 조절점 아래로 가면 대사율을 낮춰 회귀 → 요요</p>\n","src":"8장 p.14"},{"id":"c8066","ch":"ch8","tag":"개념","front":"<p>제임스-랑게 vs 캐넌-바드 vs 2요인</p>\n","back":"<p>제임스-랑게: 자극 → <strong>신체 반응 → 정서</strong> / 캐넌-바드: 자극 → 신체 반응 ∥ 정서 <strong>동시</strong> / 2요인: <strong>각성 + 명명(해석)</strong> → 정서</p>\n","src":"8장 p.29–30, 33"},{"id":"c8067","ch":"ch8","tag":"개념","front":"<p>윗길 vs 아랫길</p>\n","back":"<p>윗길 = <strong>피질 경유</strong>(시상 → 피질 → 편도체), 신중·복잡 / 아랫길 = <strong>피질 우회</strong>(시상 → 편도체), 빠름·무의식 가능. 예: 뱀인 줄 알고 움찔(아랫길) → 막대기 확인(윗길)</p>\n","src":"8장 p.32"},{"id":"c8068","ch":"ch8","tag":"개념","front":"<p>내재적 vs 외재적 동기</p>\n","back":"<p>동기 형성 요인의 <strong>위치</strong>: 내부(활동 자체가 좋아서) vs 외부(보상·처벌)</p>\n","src":"8장 p.27"},{"id":"c8069","ch":"ch8","tag":"개념","front":"<p>얼굴 피드백 vs 행동 피드백</p>\n","back":"<p>얼굴 = <strong>표정</strong>(미소 근육) / 행동 = <strong>행동</strong>(걷는 자세). 둘 다 신체 → 정서 방향 → 제임스-랑게 지지</p>\n","src":"8장 p.37"},{"id":"c8070","ch":"ch8","tag":"개념","front":"<p>p.8 고전 동기 이론 4개</p>\n","back":"<p><strong>본능과 진화</strong>(학습 안 한 종 특유 행동, 유전) / <strong>추동 감소</strong>(생리적 욕구 → 추동 → 감소 행동, push·pull) / <strong>각성</strong>(최적 각성 유지) / <strong>매슬로우 욕구 위계</strong>(생리적 욕구가 가장 하위)</p>\n","src":"8장 p.8"},{"id":"c8071","ch":"ch8","tag":"함정","front":"<p>여키스-닷슨: 어려운 과제일수록 각성이 높아야 잘한다?</p>\n","back":"<p><strong>반대.</strong> 어려운 과제는 <strong>낮은 각성</strong>에서 수행이 높다(쉬운 과제는 상대적으로 높은 각성에서)</p>\n","src":"8장 p.6"},{"id":"c8072","ch":"ch8","tag":"함정","front":"<p>매슬로우 욕구 위계의 순서는 보편적으로 고정되어 있다?</p>\n","back":"<p><strong>아니다.</strong> 개인 가치관·사회문화 환경에 따라 다를 수 있다는 비판·보완이 슬라이드에 있다</p>\n","src":"8장 p.7"},{"id":"c8073","ch":"ch8","tag":"함정","front":"<p>위 수축이 배고픔의 유일한 원인?</p>\n","back":"<p><strong>아니다.</strong> 위가 제거된 쥐도 지속적으로 배고픔을 느낀다(Tsang) → 혈당·시상하부·호르몬 등 화학적 기제. ⚠️ 슬라이드 연도 &#39;Tsang, 1989&#39;는 교재 1938 — 연도는 외우지 말 것</p>\n","src":"8장 p.10 ⚠️"},{"id":"c8074","ch":"ch8","tag":"함정","front":"<p>p.31·33에서 라자루스가 자이언스·르두와 한 묶음 — 그대로 외워도 되나?</p>\n","back":"<p><strong>주의.</strong> 교재에서 라자루스는 &#39;인지적 <strong>평가</strong>가 정서를 정의한다&#39;는 쪽으로, 자이언스·르두와 <strong>논쟁한 상대편</strong>이다. &#39;인지 없이 정서 가능&#39;의 대표는 <strong>자이언스·르두</strong>로 기억할 것</p>\n","src":"8장 p.31, 33 ⚠️"},{"id":"c8075","ch":"ch8","tag":"함정","front":"<p>p.10 배고픔의 Cannon과 p.29 정서 이론의 Cannon은 다른 사람?</p>\n","back":"<p><strong>같은 사람</strong>(Walter Cannon) — 위 수축 실험(Cannon &amp; Washburn)과 캐넌-바드 이론 양쪽에 등장</p>\n","src":"8장 p.10, 29"},{"id":"c8076","ch":"ch8","tag":"함정","front":"<p>카타르시스로 분노를 표출하면 해소된다?</p>\n","back":"<p><strong>아니다.</strong> 일시적 해결책일 뿐 <strong>부적응적</strong> 접근 — 분노에 입각한 행동은 분노를 더 폭증시킨다</p>\n","src":"8장 p.38"},{"id":"c8077","ch":"ch8","tag":"함정","front":"<p>긍정적 안녕감의 시간 축 짝</p>\n","back":"<p>과거 = <strong>만족</strong>, 현재 = <strong>행복</strong>, 미래 = <strong>낙관</strong>. 짝을 바꾼 보기에 주의</p>\n","src":"8장 p.40"},{"id":"c8078","ch":"ch8","tag":"함정","front":"<p>에크만의 보편 정서 = 표출 방식까지 전 세계 동일?</p>\n","back":"<p><strong>아니다.</strong> 정서 자체는 보편적이지만 <strong>표출 수준</strong>은 문화권마다 다르다(Cordaro). 제스처 해석도 문화 특수적</p>\n","src":"8장 p.36"},{"id":"c8079","ch":"ch8","tag":"함정","front":"<p>SNS가 우울을 일으킨다는 것이 입증되었다?</p>\n","back":"<p><strong>아니다.</strong> 사용 시간과 우울/불안은 <strong>약한 정적 상관</strong>, 실험 연구는 <strong>일관성이 떨어짐</strong> → 인과 단정 불가, 일장일단</p>\n","src":"8장 p.25"},{"id":"c8080","ch":"ch8","tag":"함정","front":"<p>샥터-싱어 실험에서 주사 효과를 고지받은 집단은 더 강한 정서를 느꼈다?</p>\n","back":"<p><strong>아니다.</strong> 고지 집단은 흥분을 약물 탓으로 돌려 <strong>정서 표식을 붙이지 않았다</strong>. 옆 사람 기분을 따라간 것은 <strong>고지받지 못한</strong> 집단</p>\n","src":"8장 p.30"}],"quiz":[{"id":"q7001","ch":"ch7","type":"mc","q":"<p>어떤 개념의 <strong>최선의 본보기</strong>, 즉 가장 전형적인 사례를 가리키는 용어는?</p>\n","choices":["개념","범주화 지각","마음 갖춤새","원형"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 원형</strong></p>\n<p>개념은 &#39;집합&#39;, 원형은 그 집합의 &#39;대표 원소&#39;로 구분한다.</p>\n<ul>\n<li>① (오답) 개념: 개념은 유사한 대상들의 <strong>심적 집단</strong> 자체이지 그 안의 대표 사례가 아니다.</li>\n<li>② (오답) 범주화 지각: 데이터를 범주로 나누려는 <strong>선천적 편향</strong>이다.</li>\n<li>③ (오답) 마음 갖춤새: 과거에 통한 방식으로만 접근하려는 경향(고착)이다.</li>\n<li>④ (정답) 원형: 개념 안의 최선의 본보기 = 원형(prototype). 교수 예: 의자 = 다리 4개 + 판 + 등받이.</li>\n</ul>\n","src":"7장 p.2","diff":1,"prof":false},{"id":"q7002","ch":"ch7","type":"mc","q":"<p>백인–아시아인 얼굴을 비율로 합성한 실험에서, 70% 합성 얼굴도 90% 얼굴과 비슷하게 한쪽 범주로 판단되었다. 이 현상을 설명하는 개념은?</p>\n","choices":["범주화 지각","확증 편향","가용성 발견법","고착"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 범주화 지각</strong></p>\n<p>교수는 p.3 그림을 &#39;90%는 당연히, 70%도 시간이 조금 더 걸릴 뿐 비슷하게 응답&#39;으로 설명했다.</p>\n<ul>\n<li>① (정답) 범주화 지각: 입력을 범주로 분리하려는 선천적 편향 — 판단이 원형 쪽으로 쏠린다(교수 설명 그대로).</li>\n<li>② (오답) 확증 편향: 자기 생각을 지지하는 증거만 찾는 경향으로, 지각 범주와 무관하다.</li>\n<li>③ (오답) 가용성 발견법: 기억에서 쉽게 떠오르는 정도로 확률을 추정하는 것이다.</li>\n<li>④ (오답) 고착: 새로운 각도에서 문제를 보지 못하는 문제 해결의 장애물이다.</li>\n</ul>\n","src":"7장 p.3 🎙","diff":2,"prof":true},{"id":"q7003","ch":"ch7","type":"mc","q":"<p>문제 해결 전략 중 <strong>알고리즘</strong>에 대한 설명으로 옳지 <strong>않은</strong> 것은?</p>\n","choices":["해결책을 보장한다","단계적으로 처리하는 문제 해결 과정이다","발견법보다 빠르고 인지적 자원 소모가 적다","시행착오를 최소화한다"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 발견법보다 빠르고 인지적 자원 소모가 적다</strong></p>\n<p>알고리즘 = 정확한 사고(보장·느림·자원 많이), 발견법 = 효율적 사고(빠름·오류·자원 적게).</p>\n<ul>\n<li>① (오답) 해결책을 보장한다: 옳다 — 알고리즘의 장점.</li>\n<li>② (오답) 단계적으로 처리하는 문제 해결 과정이다: 옳다 — 체계적 규칙이나 절차.</li>\n<li>③ (정답) 발견법보다 빠르고 인지적 자원 소모가 적다: 반대다. 알고리즘은 단계적이라 <strong>느리고</strong> 자원 소모가 <strong>크다</strong>. 빠르고 자원이 적게 드는 것은 발견법.</li>\n<li>④ (오답) 시행착오를 최소화한다: 옳다 — 슬라이드 정의 &#39;시행착오를 최소화하는 단계적 문제 해결 과정&#39;.</li>\n</ul>\n","src":"7장 p.4","diff":1,"prof":false},{"id":"q7004","ch":"ch7","type":"mc","q":"<p>성냥개비 6개로 삼각형 4개를 만드는 퀴즈를, 가능한 배치를 하나씩 모두 대 보며 풀었다. 어떤 전략인가?</p>\n","choices":["통찰","알고리즘","발견법","틀만들기"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 알고리즘</strong></p>\n<p>&#39;하나씩 다 시도&#39; = 알고리즘의 표지어.</p>\n<ul>\n<li>① (오답) 통찰: 통찰은 &#39;아하!&#39; 하고 <strong>갑자기</strong> 깨닫는 것이다.</li>\n<li>② (정답) 알고리즘: 가능한 경우를 단계적으로 다 시도 → 언젠가 반드시 답(삼각뿔)이 나온다. 교수가 든 예 그대로.</li>\n<li>③ (오답) 발견법: 발견법은 후보를 지름길로 <strong>줄이는</strong> 방략이다.</li>\n<li>④ (오답) 틀만들기: 틀만들기는 질문 제기 방식으로 결정을 유도하는 것이다.</li>\n</ul>\n","src":"7장 p.4 🎙","diff":1,"prof":true},{"id":"q7005","ch":"ch7","type":"mc","q":"<p>Kounios &amp; Beeman(2014)이 보고한 <strong>통찰</strong>의 신경 활동으로 옳은 것은?</p>\n","choices":["직전에는 우반구 측두엽, 직후에는 전두엽 활동이 증가한다","직전에는 전두엽, 해결 직후에는 우반구 측두엽 활동이 증가한다","직전에는 좌반구 측두엽, 직후에는 후두엽 활동이 증가한다","직전에는 편도체, 직후에는 해마 활동이 증가한다"],"answer":1,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ② 직전에는 전두엽, 해결 직후에는 우반구 측두엽 활동이 증가한다</strong></p>\n<p>통찰: &#39;전두엽(주의) → 우반구 측두엽(깨달음)&#39; 순서로 외운다.</p>\n<ul>\n<li>① (오답) 직전에는 우반구 측두엽, 직후에는 전두엽 활동이 증가한다: 순서를 뒤바꾼 함정이다.</li>\n<li>② (정답) 직전에는 전두엽, 해결 직후에는 우반구 측두엽 활동이 증가한다: 슬라이드 그대로 — 직전 주의 관련 전두엽, 직후 우반구 측두엽 급증.</li>\n<li>③ (오답) 직전에는 좌반구 측두엽, 직후에는 후두엽 활동이 증가한다: 좌반구 측두엽·후두엽은 슬라이드에 없다.</li>\n<li>④ (오답) 직전에는 편도체, 직후에는 해마 활동이 증가한다: 정서·기억 구조로, 통찰 연구 내용이 아니다.</li>\n</ul>\n","src":"7장 p.5","diff":2,"prof":false},{"id":"q7006","ch":"ch7","type":"mc","q":"<p>&#39;키 작고 마르고 시를 즐겨 읽는 사람&#39;을 보고 트럭 운전수보다 영문학 교수일 가능성이 높다고 판단했다(실제로는 교수 400명 vs 트럭 운전수 350만 명). 어떤 판단 오류인가?</p>\n","choices":["가용성 발견법","신념 집착","과신","대표성 발견법"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 대표성 발견법</strong></p>\n<p>&#39;…처럼 보여서/전형적이라서&#39; → 대표성. 교수도 400명 vs 350만 명 수치를 그대로 인용했다.</p>\n<ul>\n<li>① (오답) 가용성 발견법: 기억에서 쉽게 떠오르는 사례에 근거한 판단이 아니다.</li>\n<li>② (오답) 신념 집착: 반박된 신념을 유지하는 상황이 아니다.</li>\n<li>③ (오답) 과신: 자기 판단 정확성의 과대 추정 문제가 아니라 원형 비교의 문제다.</li>\n<li>④ (정답) 대표성 발견법: 원형(전형적인 교수 이미지)과 비교해 판단하면서 <strong>기저율</strong>(실제 비율)을 무시했다.</li>\n</ul>\n","src":"7장 p.7 🎙","diff":1,"prof":true},{"id":"q7007","ch":"ch7","type":"mc","q":"<p>비행기 추락 사고가 연일 보도된 뒤 많은 사람이 비행기 대신 통계적으로 더 위험한 자동차를 택했다. 이를 가장 잘 설명하는 것은?</p>\n","choices":["가용성 발견법","대표성 발견법","틀만들기","고착"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 가용성 발견법</strong></p>\n<p>&#39;뉴스에서 봤다/쉽게 떠오른다&#39; → 가용성. 1장 &#39;강력한 사례의 가용성&#39;과 같은 내용.</p>\n<ul>\n<li>① (정답) 가용성 발견법: 선명·최근 사례가 기억에서 쉽게 떠올라 위험을 과대 평가 → 과도한 공포.</li>\n<li>② (오답) 대표성 발견법: 원형과의 유사성 비교가 아니다.</li>\n<li>③ (오답) 틀만들기: 질문 제기 방식에 따른 결정 변화가 아니다.</li>\n<li>④ (오답) 고착: 문제를 새 관점으로 보지 못하는 것과 무관하다.</li>\n</ul>\n","src":"7장 p.8","diff":1,"prof":true},{"id":"q7008","ch":"ch7","type":"mc","q":"<p>대표성 발견법과 가용성 발견법의 <strong>공통점</strong>으로 옳지 <strong>않은</strong> 것은?</p>\n","choices":["사건의 가능성을 평가하는 방식이다","직관을 활용한 자동적이고 빠른 사고다","인지적 구두쇠의 산물이다","단계적 절차를 따르므로 해결을 보장한다"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 단계적 절차를 따르므로 해결을 보장한다</strong></p>\n<p>p.9: 공통 = 가능성 평가·직관·자동적·빠름·인지적 구두쇠.</p>\n<ul>\n<li>① (오답) 사건의 가능성을 평가하는 방식이다: 옳다 — p.9 공통점.</li>\n<li>② (오답) 직관을 활용한 자동적이고 빠른 사고다: 옳다 — p.9 공통점.</li>\n<li>③ (오답) 인지적 구두쇠의 산물이다: 옳다 — 효율을 추구한 결과.</li>\n<li>④ (정답) 단계적 절차를 따르므로 해결을 보장한다: 그것은 알고리즘의 특징이다. 두 발견법은 빠르지만 오류 위험이 있다.</li>\n</ul>\n","src":"7장 p.9","diff":2,"prof":true},{"id":"q7009","ch":"ch7","type":"mc","q":"<p>1차 세계대전 때 독일 제국이 &#39;프랑스를 6개월 만에 항복시키고 러시아로 군을 돌린다&#39;는 계획을 믿었다가 패전했다. 슬라이드가 이 사례로 설명한 개념은?</p>\n","choices":["신념 집착","틀만들기","과신","확증 편향"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 과신</strong></p>\n<p>교수가 슐리펜 계획 내용을 자세히 설명했다(37:47–40:34).</p>\n<ul>\n<li>① (오답) 신념 집착: 반박 증거 후에도 신념을 유지하는 것으로, 슬라이드는 이 사례를 과신에 배치했다.</li>\n<li>② (오답) 틀만들기: 질문 제기 방식의 효과가 아니다.</li>\n<li>③ (정답) 과신: 국가 단위 과신의 위험 — 실제 역량과 믿음의 괴리(슐리펜 계획).</li>\n<li>④ (오답) 확증 편향: 지지 증거만 찾는 경향으로, 이 슬라이드의 사례는 아니다.</li>\n</ul>\n","src":"7장 p.10 🎙","diff":1,"prof":true},{"id":"q7010","ch":"ch7","type":"mc","q":"<p><strong>과신</strong>과 관련된 슬라이드 내용이 <strong>아닌</strong> 것은?</p>\n","choices":["가장 적절한 대처는 반대편 주장을 고려하는 것이다","계획 오류로 이어질 수 있다","주식 중개인·투자 매니저에게서 많이 나타난다","메타인지의 중요성을 보여 준다"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 가장 적절한 대처는 반대편 주장을 고려하는 것이다</strong></p>\n<p>과신(p.10)과 신념 집착(p.11)의 세부 내용을 섞은 문제.</p>\n<ul>\n<li>① (정답) 가장 적절한 대처는 반대편 주장을 고려하는 것이다: 이것은 <strong>신념 집착</strong>의 대처(Catapano et al., 2019)다.</li>\n<li>② (오답) 계획 오류로 이어질 수 있다: 옳다 — 일에 걸릴 시간을 과소 추정.</li>\n<li>③ (오답) 주식 중개인·투자 매니저에게서 많이 나타난다: 옳다 — p.10.</li>\n<li>④ (오답) 메타인지의 중요성을 보여 준다: 옳다 — 자기 인지에 대한 인지.</li>\n</ul>\n","src":"7장 p.10–11","diff":2,"prof":false},{"id":"q7011","ch":"ch7","type":"mc","q":"<p>장기 기증 의사를 묻는 설문의 <strong>기본 응답(default)</strong> 을 &#39;원한다&#39;로 두느냐 &#39;원하지 않는다&#39;로 두느냐에 따라 기증 비율이 달라졌다. 이 현상은?</p>\n","choices":["틀만들기","대표성 발견법","가용성 발견법","확증 편향"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ① 틀만들기</strong></p>\n<p>교수: 「사람들이 의사결정을 잘 안 바꾼다」 — 기본값이 그대로 선택된다.</p>\n<ul>\n<li>① (정답) 틀만들기: 같은 결정이라도 문제 제기 방식(기본값)에 따라 선택이 달라진다(Hajhosseini et al., 2013).</li>\n<li>② (오답) 대표성 발견법: 원형 비교에 의한 확률 판단이 아니다.</li>\n<li>③ (오답) 가용성 발견법: 기억 접근성 문제가 아니다.</li>\n<li>④ (오답) 확증 편향: 지지 증거 수집과 무관하다.</li>\n</ul>\n","src":"7장 p.13 🎙","diff":1,"prof":true},{"id":"q7012","ch":"ch7","type":"mc","q":"<p>슬라이드가 소개한 <strong>틀만들기의 응용</strong> 사례가 <strong>아닌</strong> 것은?</p>\n","choices":["결정 전 도덕적 판단 질문을 던지면 기부가 늘어난다","설문 기본 응답을 바꾸면 장기 기증 비율이 바뀐다","유학 경험자가 창의성 면에서 유리하다","술잔 크기를 줄이면 전체 음주량이 줄어든다"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 유학 경험자가 창의성 면에서 유리하다</strong></p>\n<p>교수가 &#39;세 가지 예시&#39;로 정리: 기부 · 장기 기증 · 술잔.</p>\n<ul>\n<li>① (오답) 결정 전 도덕적 판단 질문을 던지면 기부가 늘어난다: 틀만들기 응용(Capraro et al., 2019).</li>\n<li>② (오답) 설문 기본 응답을 바꾸면 장기 기증 비율이 바뀐다: 틀만들기 응용(Hajhosseini et al., 2013).</li>\n<li>③ (정답) 유학 경험자가 창의성 면에서 유리하다: 이것은 창의성 함양법(다른 문화 경험, Godart et al., 2015)이다.</li>\n<li>④ (오답) 술잔 크기를 줄이면 전체 음주량이 줄어든다: 틀만들기 응용(Reynolds et al., 2019) — 잔 수로 음주량을 추산.</li>\n</ul>\n","src":"7장 p.13, 20 🎙","diff":2,"prof":true},{"id":"q7013","ch":"ch7","type":"mc","q":"<p>전두엽 손상 환자에게서 손상되지 않고 <strong>유지</strong>되는 사고는?</p>\n","choices":["확산적 사고","상상력","수렴적 사고","새로운 해결책을 다양하게 만들어 내는 능력"],"answer":2,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ③ 수렴적 사고</strong></p>\n<p>확산 = 다양성(전두엽 의존), 수렴 = 최선 하나(적성검사).</p>\n<ul>\n<li>① (오답) 확산적 사고: 전두엽 손상 시 손상되는 쪽이다.</li>\n<li>② (오답) 상상력: 확산적 사고와 같은 쪽으로 손상된다.</li>\n<li>③ (정답) 수렴적 사고: 전두엽 손상 시 수렴적 사고는 유지되나 상상력(확산)은 손상된다(Kolb &amp; Whishaw).</li>\n<li>④ (오답) 새로운 해결책을 다양하게 만들어 내는 능력: 확산적 사고의 정의이므로 손상된다.</li>\n</ul>\n","src":"7장 p.15","diff":2,"prof":false},{"id":"q7014","ch":"ch7","type":"mc","q":"<p>Sternberg &amp; Lubart의 <strong>창의성 5요소</strong>에 포함되지 <strong>않는</strong> 것은?</p>\n","choices":["전문성","모험지향적 성격","창의적 환경","높은 일반 지능(g)"],"answer":3,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ④ 높은 일반 지능(g)</strong></p>\n<p>5요소 = 전·상·모·내·환(전문성, 상상력 사고 기술, 모험지향적 성격, 내재적 동기, 창의적 환경).</p>\n<ul>\n<li>① (오답) 전문성: 5요소 — 잘 갖춰진 기반 지식.</li>\n<li>② (오답) 모험지향적 성격: 5요소 — 새로운 경험 추구, 단호함.</li>\n<li>③ (오답) 창의적 환경: 5요소 — 의견 공유·소통 중심 환경.</li>\n<li>④ (정답) 높은 일반 지능(g): 5요소에 없다. 슬라이드는 오히려 창의성이 지능만으로 설명되지 않는다고 한다.</li>\n</ul>\n","src":"7장 p.16","diff":1,"prof":false},{"id":"q7015","ch":"ch7","type":"mc","q":"<p>슬라이드의 <strong>창의성 함양법</strong>이 <strong>아닌</strong> 것은?</p>\n","choices":["해결될 때까지 한 문제에 쉬지 않고 매달리기","부화시간 갖기","명상이나 산책 즐기기","다른 문화와 사고 방식 경험하기"],"answer":0,"alts":[],"answerHtml":"","solution":"<p><strong>정답 ①
