<style>:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--acc:#2563eb;--acc2:#dbeafe;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--tab:#fff;--r:14px;--fs:17px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e6e8ee;--mute:#9aa3b2;--line:#262b36;--acc:#7dd3fc;--acc2:#12304a;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--tab:#12151b}}
:root[data-theme=dark]{--bg:#0f1115;--card:#171a21;--ink:#e6e8ee;--mute:#9aa3b2;--line:#262b36;--acc:#7dd3fc;--acc2:#12304a;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--tab:#12151b}
:root[data-theme=light]{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--acc:#2563eb;--acc2:#dbeafe;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--tab:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;line-height:1.55;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
#app{max-width:760px;margin:0 auto;padding:12px 16px 24px;overflow-wrap:break-word;word-break:break-word}
#app>*,.block>div,.flash>div,.card{min-width:0}
h1{font-size:1.35rem;margin:6px 0 2px}h2{font-size:1.15rem;margin:18px 0 8px}h3{font-size:1.02rem;margin:14px 0 6px}
.mute{color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
button.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-theme=dark] button.acc,html:not([data-theme=light]) button.acc{color:#06202f}
@media(prefers-color-scheme:light){html:not([data-theme=dark]) button.acc{color:#fff}}
button.sm{min-height:34px;padding:5px 10px;font-size:.88rem;border-radius:10px}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.chips button{white-space:nowrap;min-height:36px;padding:6px 12px;border-radius:999px;font-size:.9rem}
.chips button.on{background:var(--acc2);border-color:var(--acc);color:var(--ink)}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--tab);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:9}
#tabs button{flex:1;border:0;border-radius:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--mute);padding:8px 0 6px;min-height:56px}
#tabs button.on{color:var(--acc);font-weight:700}
#tabs .ic{font-size:1.25rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.block{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.block>div:nth-child(2){flex:1;min-width:0}
.block:last-child{border-bottom:0}
.block .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.9rem;margin-top:2px}
.block.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.block.done .t{text-decoration:line-through;color:var(--mute)}
.block .t{font-weight:600}.block .n{font-size:.86rem;color:var(--mute)}
.block .min{font-variant-numeric:tabular-nums;color:var(--mute);font-size:.86rem;flex:none}
.block.cur{background:var(--acc2);margin:0 -16px;padding:10px 16px;border-radius:10px}
.timer{text-align:center;padding:14px 0 6px}
.timer .big{font-size:3.2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.kind{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:6px;background:var(--acc2);margin-right:6px;vertical-align:middle}
pre{background:var(--line);padding:10px;border-radius:8px;overflow-x:auto;font-size:.85em;max-width:100%}code{font-size:.9em}table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-size:.9em}th,td{border:1px solid var(--line);padding:5px 8px;min-width:5.5em;vertical-align:top}img{max-width:100%;height:auto}.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}.katex{white-space:normal}
.article{font-size:1rem}
.article img{max-width:100%;height:auto;border-radius:8px}
.article table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-size:.9em}
.article th,.article td{border:1px solid var(--line);padding:5px 8px;min-width:5.5em;vertical-align:top}
.article pre{background:var(--line);padding:10px;border-radius:8px;overflow-x:auto;font-size:.85em}
.article code{font-size:.9em}
.article blockquote{margin:0;padding:2px 12px;border-left:3px solid var(--acc);color:var(--mute)}
.article .katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
.katex{font-size:1.05em}
.flash{min-height:44vh;display:flex;flex-direction:column;justify-content:center;font-size:1.08rem;cursor:pointer}
.flash .side{font-size:.75rem;color:var(--mute);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.flash .back{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.flash .katex-display{overflow-x:auto}
.grade{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.grade button{min-height:54px;font-weight:700}
.grade .b0{border-color:var(--bad);color:var(--bad)}.grade .b1{border-color:var(--warn);color:var(--warn)}.grade .b2{border-color:var(--ok);color:var(--ok)}
.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;line-height:1.45}.choice:disabled{opacity:1;color:var(--mute)}.choice.ok:disabled{color:var(--ink);font-weight:600}.choice p{margin:4px 0}
.choice.pick{border-color:var(--acc);background:var(--acc2)}
.choice.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.choice.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
input[type=text]{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.verdict{font-weight:700;margin:10px 0 4px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.sol{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:.98rem}
.sol .katex-display{overflow-x:auto}
.src{font-size:.78rem;color:var(--mute);margin-top:8px}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mute);margin-right:4px}
.prof{color:var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.sticky{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;flex-wrap:nowrap}.sticky .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.fab{display:flex;gap:8px;justify-content:space-between;margin:10px 0}
.small{font-size:.86rem}
.center{text-align:center}
ul.clean{padding-left:18px;margin:6px 0}
.tex-err{color:var(--bad)}
</style>

<script id="data" type="application/json">{"course":{"id":"psy-final","title":"심리학 기말 (7–8장)","subtitle":"심리학으로의 여행 (심리학의 이해) · Prof. 이소영 · DGIST 기초학부 교양","exam":"기말고사 · 일시·범위 미공지 (중간과 동일 방식 예상: 객관식 + 단답형 명칭 쓰기) · 현재 7–8장","icon":"심","chapters":[{"id":"ch7","label":"7장 사고·언어·지능"},{"id":"ch8","label":"8장 동기·정서"}],"tips":["<p>교수 10/20 발언: 기말도 중간과 <strong>동일한 방식</strong> — 중간은 객관식 25 + 단답형 5(명칭 쓰기)였다. 카드는 <strong>설명 → 명칭</strong> 방향으로 소리 내어 답할 것.</p>\n","<p>7장은 <strong>p.39 지능 5입장 표</strong>(스피어만 1 · 스턴버그 3 · 정서 4 · 서스톤 7 · 가드너 8)와 <strong>서스톤 = 중간 입장</strong>을 교수가 두 번 이상 정리했다.</p>\n","<p>8장은 <strong>p.8 동기 이론 표</strong>와 <strong>p.33 정서 이론 표</strong>가 핵심. 이론 이름 ↔ 한 줄 주장 짝짓기를 먼저 끝낼 것.</p>\n","<p>슬라이드 오류는 정답으로 외우지 말 것: 7장 p.24 &#39;모음 음소가 더 많은 정보&#39;, p.43 기호 쓰기 설명, 8장 p.10 &#39;Tsang, 1989&#39;, p.31·33 라자루스 묶음. 단, 7장 서스톤(능력 간 상관 인정)은 <strong>슬라이드대로</strong>가 수업 답.</p>\n","<p>8장은 10/27 녹음이 앞 16분(p.1–2)뿐 — 11/3 수업에서 이어지는 쪽을 확인하고 범위를 고칠 것.</p>\n"]},"reading":[{"id":"ch7note","title":"7장 사고와 언어 그리고 지능 — 페이지별 해설","desc":"p.1–47 + 🎙 10/20 수업 기록 + 명칭 암기표","ch":"ch7","min":90,"html":"<h1>7장 — 사고와 언어 그리고 지능 페이지별 해설</h1>\n<p>심리학으로의 여행 (Prof. 이소영) · 마이어스 심리학 개론 13판</p>\n<p>7장의 핵심 질문은 &quot;사람은 어떻게 생각하고(개념·문제 해결·판단), 그 생각을 어떤 도구로 표현하며(언어), 그 능력의 개인차를 어떻게 정의하고 재는가(지능)&quot;이다. 개념과 원형 → 문제 해결 전략(알고리즘·통찰·발견법) → 판단을 비트는 요인(대표성·가용성 발견법, 과신, 신념 집착, 틀만들기) → 창의성 → 언어의 구조·획득·뇌·사고와의 관계 → 지능 이론(스피어만·서스톤·가드너·스턴버그·정서 지능) → 지능 검사의 역사와 제작 원리(표준화·신뢰도·타당도) 순으로 진행된다. 슬라이드 21·22(인지과정과 전략 비교)와 39(지능 이론 비교)는 장 전체를 한 장에 압축한 표이므로 ⭐ 가중.</p>\n<p>페이지 번호 = 슬라이드 번호 (총 47장, 숨김 슬라이드 없음). 슬라이드 속 그림(&quot;~의 예시&quot;)은 텍스트로 확인할 수 없어 내용을 적지 않았다. <strong>7장 수업(10/20 화, 9주차) 녹음은 <code>녹음본/1020.md</code></strong>(Clova, 약 2시간 13분)이다. 이 한 번의 수업에서 <strong>p.1–47 전부</strong>를 끝냈고, 02:13:24 「오늘 수업은 여기까지」로 마쳤다(레포트 세부 공지는 다음 주). 단, 휴식 뒤 마이크 문제로 <strong>p.23–24와 p.25 전반은 녹음에 없다</strong>. 수업 내용은 끝의 <code>🎙 실제 수업 기록</code> 절에, 슬라이드에 없는 교수 예시는 각 p.N 절의 <code>- 🎙</code> 줄에 달았다(10/27 녹음은 과제 설명 + 8장 도입).</p>\n<p>기말고사는 <strong>중간과 「동일한 방식」(객관식 25 + 단답형 5, 명칭 쓰기)</strong> 이다(10/20 수업 01:28 교수 발언). 끝의 <strong>명칭 암기표(설명 → 명칭)</strong> 를 특히 챙길 것.</p>\n<hr>\n<h2>0. 앞 장과의 연결</h2>\n<table>\n<thead>\n<tr>\n<th>앞에서 배운 것</th>\n<th>7장에서 다시 쓰이는 곳</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>3장 발달 — 피아제의 인지 발달, 결정적 시기 개념</td>\n<td>p.27–28 언어 발달 단계(옹알이→한 단어→두 단어), 언어의 <strong>결정적 시기</strong>, p.31 &quot;아동의 사고는 언어와 함께 발달&quot;</td>\n</tr>\n<tr>\n<td>4장 감각과 지각 — 지각 갖춤새, 하향 처리</td>\n<td>p.3 <strong>범주화 지각</strong>, p.5·12 <strong>마음 갖춤새</strong>(문제 해결·틀만들기), p.31 언어에 따른 <strong>색 지각</strong> 차이</td>\n</tr>\n<tr>\n<td>5장 학습 — 강화·동기</td>\n<td>p.16·18 창의성의 <strong>내재적 동기</strong>, p.36 성취에 필요한 훈련·투지</td>\n</tr>\n<tr>\n<td>6장 기억 — 작업 기억, 인출, 가용성, 수면·응고화</td>\n<td>p.8 <strong>가용성 발견법</strong>(기억에서 쉽게 꺼내지는 정도로 확률 판단), p.19 <strong>부화시간</strong>(무의식적 처리), p.40 학습 속도와 장기 유지</td>\n</tr>\n<tr>\n<td>2장 마음의 생물학 — 좌반구 언어 영역, 가소성</td>\n<td>p.29 <strong>브로카·베르니케 영역</strong>, p.28 결정적 시기와 <strong>신경 가소성</strong></td>\n</tr>\n</tbody></table>\n<hr>\n<h2>p.1 — 표지</h2>\n<p>7장. 사고와 언어 그리고 지능.</p>\n<h2>p.2 — 사고와 개념: 개념과 원형 ⭐⭐⭐</h2>\n<ul>\n<li><strong>개념(Concept)</strong>: 유사한 대상·사건·아이디어 등에 대한 <strong>심적 집단(mental grouping)</strong>. 개념 덕분에 사고를 크게 단순화할 수 있다 — &quot;공을 던진다&quot;라는 말 한마디로 수많은 공·던지기 동작을 한 번에 가리킨다.</li>\n<li><strong>원형(Prototype)</strong>: 어떤 개념의 <strong>최선의 본보기</strong>(가장 전형적인 사례). 예: &#39;새&#39;의 원형은 참새·까치에 가깝고 펭귄·타조와는 멀다.</li>\n<li>지각 등의 사고 활동은 해당 개념의 <strong>더 가까운 원형 쪽으로</strong> 이루어진다(Corneille et al., 2004).</li>\n<li>🎙 (07:04–08:51) 교수는 교재의 &#39;공 던지기&#39; 대신 <strong>의자</strong>로 설명: 원형 = <strong>다리 4개 + 앉는 판 + 등받이</strong>. 그러나 원형은 「가장 전형적이고 평균에 가까운 본보기」일 뿐 전체를 설명하지 못한다 — <strong>빈백</strong>(다리 없음), 등받이 없는 의자, 둥근 판. 개념의 이점 = 수백 가지 사례를 일일이 따지면 <strong>정보 처리 용량의 한계</strong>에 걸리므로 사고를 <strong>단순화</strong>(10:01–11:10).</li>\n</ul>\n<h2>p.3 — 범주화 지각 ⭐⭐</h2>\n<ul>\n<li><strong>범주화 지각(Categorical perception)</strong>: 사람은 입력된 데이터를 일련의 <strong>범주로 분리</strong>하려는 <strong>선천적 편향성</strong>을 지닌다.</li>\n<li>범주 안에서 특정 심상이나 최선의 본보기(= <strong>원형</strong>)를 발달시켜 개념을 형성한다(<strong>Rosch, 1978</strong>).</li>\n<li>원형에서 멀어질수록 <strong>범주 경계가 모호</strong>해진다 — 고래(어류처럼 보이지만 포유류), 토마토(채소처럼 쓰이지만 과일).</li>\n<li>개념은 사고를 <strong>촉진</strong>하지만 <strong>항상 최선의 사고</strong>로 이끄는 것은 아니다(→ p.7 대표성 발견법의 오류로 이어짐).</li>\n<li>그림: 범주화 지각의 예시(Huart et al., 2005).</li>\n<li>🎙 (11:10–13:20) 그림 = 백인·아시아인 얼굴을 비율로 합성한 연속 스펙트럼. <strong>90%</strong> 얼굴은 당연히 명확히 판단하고, <strong>70%</strong> 얼굴도 시간이 조금 더 걸릴 뿐 <strong>90%와 비슷하게</strong> 한쪽 범주로 응답 → 판단 기준이 전형적 형태(원형) 쪽으로 쏠린다. 고래 예: 포유류이지만 「포유류를 대표할 수 있냐」에는 다들 고개를 갸우뚱(13:20–14:26).</li>\n</ul>\n<h2>p.4 — 문제 해결 전략 (1): 알고리즘 ⭐⭐⭐</h2>\n<ul>\n<li>주제: <strong>&#39;정확한 사고&#39;와 &#39;효율적인 사고&#39;</strong>. 문제 해결 과정에서 <strong>시행착오</strong>는 불가피한 요소.</li>\n<li><strong>알고리즘(algorithm)</strong>: 시행착오를 최소화하는 <strong>단계적</strong> 문제 해결 과정.<ul>\n<li>해결책을 <strong>보장</strong>한다.</li>\n<li>단계별 처리라 발견법보다 상대적으로 <strong>느리다</strong>.</li>\n<li><strong>인지적 자원 소모가 크다</strong>.</li>\n</ul>\n</li>\n<li>교과서식 예: SPLOYOCHYG 철자를 재배열해 단어 만들기 — 모든 조합을 하나씩 다 시도하면(알고리즘) 언젠가 반드시 답이 나오지만 엄청나게 오래 걸린다.</li>\n<li>🎙 (17:01–18:06) 슬라이드 퀴즈 = <strong>성냥개비 6개로 삼각형 4개</strong> 만들기(전사 &quot;성향 개비&quot;). 정답 = <strong>삼각뿔</strong>(윗면 1 + 옆면 3). 하나씩 대 보며 찾았다면 알고리즘적 해결. 「정확한 사고」 = <strong>의식적 노력</strong>이 많이 드는 방식(15:04–15:55).</li>\n</ul>\n<h2>p.5 — 문제 해결 전략 (2): 통찰, 확증 편향, 고착 ⭐⭐⭐</h2>\n<ul>\n<li><strong>통찰(insight)</strong>: 문제의 해결책을 <strong>갑작스레 깨닫는</strong> 현상(&quot;아하!&quot; 경험).<ul>\n<li>전략 기반 해결책과 대비되며, 완벽하지는 않으나 올바른 해결책을 찾는 데 유용(Danek &amp; Salvi, 2018).</li>\n</ul>\n</li>\n<li><strong>확증 편향(confirmation bias)</strong>: 어떤 생각을 <strong>지지하는 증거만 찾으려는</strong> 인지적 경향 → 왜곡 발생. 슬라이드는 통찰이 확증 편향의 영향을 받기 쉽다(<strong>마음 갖춤새</strong>의 형성)고 정리.</li>\n<li><strong>고착(Fixation)</strong>: 확증 편향이 이어져 <strong>새로운 각도에서 문제를 보지 못하는</strong> 상태. 대표적 형태가 <strong>마음 갖춤새(mental set)</strong> — 과거에 통했던 방식으로만 접근하려는 경향.</li>\n<li>통찰의 신경 활동(<strong>Kounios &amp; Beeman, 2014</strong>):<ul>\n<li>통찰 <strong>직전</strong>: 주의와 관련된 <strong>전두엽</strong> 활성화.</li>\n<li>해결책 발견 <strong>직후</strong>: <strong>우반구 측두엽</strong>의 신경 활동이 급격히 증가.</li>\n</ul>\n</li>\n<li>🎙 (19:17–22:17) 통찰 예 = 닌텐도 <strong>「레이튼 교수」</strong> 수수께끼를 보다가 순간적으로 「이렇게 하면 되지 않을까」 깨닫는 것. 비유로 알고리즘이 90% 확률로 정답을 보장한다면 통찰은 70–80% 정도(교수의 예시 수치). 통찰은 사전의 <strong>마음 갖춤새</strong>(4장 <strong>지각 갖춤새</strong>와 연결)에 영향받기 쉬워 <strong>확증 편향에 취약</strong>하고, 한 방향으로 고정되면 <strong>고착</strong>.</li>\n<li>⚠️ 교과서(Myers)에서는 확증 편향·고착을 통찰 자체의 특성이라기보다 <strong>문제 해결 일반의 장애물</strong>로 다룬다. 슬라이드 22의 표도 확증 편향·고착을 별도 항목으로 분리해 두었으니, 시험에서는 &quot;확증 편향 = 지지 증거만 찾음&quot;, &quot;고착 = 새 관점 결여&quot;로 정의를 잡을 것.</li>\n</ul>\n<h2>p.6 — 문제 해결 전략 (3): 발견법 ⭐⭐⭐</h2>\n<ul>\n<li><strong>발견법(Heuristics)</strong>: 판단과 문제 해결을 <strong>효율적</strong>으로 만들어 주는 <strong>간단한 사고 방략</strong>(사고의 지름길). 다른 이름 <strong>어림법, 추단법</strong>.<ul>\n<li>알고리즘보다 <strong>신속</strong>하지만 <strong>실수 가능성이 높다</strong>.</li>\n<li>해결 가짓수를 1차로 줄인 뒤 시행착오를 적용하는 식으로 <strong>혼용</strong> 가능(예: 철자 재배열에서 &quot;Y는 끝에 오기 쉽다&quot;로 후보를 줄이고 나머지를 시도).</li>\n<li>결과적으로 <strong>인지적 자원 소모를 줄이는</strong> 방향의 접근.</li>\n</ul>\n</li>\n<li>그림: 발견법(가용성 발견법)의 예시.</li>\n<li>🎙 (23:45–25:19) 1장에서 사고를 왜곡하는 위험 요인으로 소개한 <strong>가용성 어림법</strong>이 바로 이 발견법이지만, 「완전히 틀린 말은 아니에요」 — 확률적으로 그럴듯한 근거라 일상에서 유용. 사람은 <strong>두 방식을 자유롭게 혼용</strong>: 크게 단순하게 접근했다가 단계별로 풀거나, 단계별로 하다 패턴이 보이면 단순한 방식으로 전환.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>전략</th>\n<th>방식</th>\n<th>속도</th>\n<th>정확성</th>\n<th>인지 자원</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>알고리즘</strong></td>\n<td>단계적·체계적 절차</td>\n<td>느림</td>\n<td>해결 <strong>보장</strong></td>\n<td>많이 소모</td>\n</tr>\n<tr>\n<td><strong>발견법</strong></td>\n<td>단순화된 지름길</td>\n<td>빠름</td>\n<td>오류 위험 높음</td>\n<td>적게 소모</td>\n</tr>\n<tr>\n<td><strong>통찰</strong></td>\n<td>갑작스러운 깨달음</td>\n<td>즉각적</td>\n<td>대체로 옳음(보장 X)</td>\n<td>— (발생 안 할 수 있음)</td>\n</tr>\n</tbody></table>\n<h2>p.7 — 대표성 발견법 ⭐⭐⭐</h2>\n<ul>\n<li><strong>대표성 발견법(Representative Heuristics)</strong>: 사건의 가능성을 <strong>원형과 비교</strong>하여 어림하는 방법.<ul>\n<li>원형에 잘 부합하는 방향으로 사고가 흐른다. 어떤 범주가 지닌 <strong>전형적 속성</strong>에 의해 판단이 형성.</li>\n<li>대표 예: <strong>외형·복식에 따른 직업 추론</strong>(Nisbett &amp; Ross, 1980).</li>\n<li>실제 <strong>통계적 분포(기저율)와 무관하게</strong> 원형에 맞는 정도로 가능성을 <strong>과대 추정</strong>.</li>\n</ul>\n</li>\n<li>고전 예: &quot;키 작고, 마르고, 시를 즐겨 읽는 사람&quot; → 영문학 교수일까, 트럭 운전수일까? 원형상 교수 같지만 <strong>영문학 교수 400명 vs 트럭 운전수 350만 명</strong>이므로 실제로는 트럭 운전수일 확률이 훨씬 높다.</li>\n<li>🎙 (26:24–30:14) 슬라이드 그림은 <strong>양복을 입고 서류 가방을 든 사람</strong> → 영문학과 교수 vs 트럭 운전수 이지선다. 미국 연구 수치 <strong>교수 400명 vs 트럭 운전수 350만 명</strong>을 교수도 그대로 인용. 「영문학과 교수님들이 양복을 자주 입으시는지는 글쎄요」 — 그래서 회사원·변호사로 바꿔 소개하기도 한다고.</li>\n</ul>\n<h2>p.8 — 가용성 발견법 ⭐⭐⭐</h2>\n<ul>\n<li><strong>가용성 발견법(Availability Heuristics)</strong>: <strong>선명성·최신성·차별성</strong> 등으로 기억에서 <strong>접근이 쉬울수록</strong> 그 사건의 가능성을 <strong>높게 추정</strong>하는 경향.<ul>\n<li>매스컴·SNS에서 충격적 사건을 접하면 그런 사건이 <strong>자주 일어난다고</strong> 믿게 됨.</li>\n<li>아주 강력한 사례(유명인 이야기, 특종)가 생기면 그 사례를 중심으로 확률을 평가(Hoffman, 2019).</li>\n<li><strong>위험·현실 판단 왜곡</strong>: 강력한 사례 때문에 발생 빈도·위험 수준을 과대 평가 → 특정 대상에 대한 <strong>과도한 공포</strong>와 연관(예: 비행기 사고 보도 후 비행기를 피하고 더 위험한 자동차를 탐).</li>\n</ul>\n</li>\n<li>6장 연결: &#39;가용성&#39; = 기억에서 얼마나 쉽게 <strong>인출</strong>되는가.</li>\n<li>🎙 (30:14–33:47) 1장의 「<strong>강력한 사례의 가용성</strong>」과 같은 내용. 예 = 충격적 범죄 보도 → 치안이 나쁘다고 과대 추정. 그래도 제로베이스에서 생각하기는 어렵고 근거는 결국 과거 경험 = 기억이므로, 잘 떠오르는 정보로 생각하는 것은 「사람으로서 … 어쩔 수 없는 자연스러운 특성」. 정확한 사고와 효율적 사고 사이의 <strong>줄다리기</strong>.</li>\n</ul>\n<h2>p.9 — 대표성 vs 가용성 비교 ⭐⭐⭐</h2>\n<p>공통점: 둘 다 <strong>사건의 가능성을 평가</strong>하는 방식이고, <strong>직관</strong>을 활용해 <strong>자동적이고 빠른</strong> 사고를 따르며, <strong>인지적 구두쇠(Cognitive Miser)</strong> 의 산물(효율 추구).</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><strong>대표성 발견법</strong></th>\n<th><strong>가용성 발견법</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>판단 기준</td>\n<td>특정 <strong>원형</strong>과 직관적으로 비교</td>\n<td><strong>기억의 가용성</strong>(떠올리기 쉬움)에 근거</td>\n</tr>\n<tr>\n<td>작동</td>\n<td>제시된 특성에 <strong>가장 부합하는 대상</strong> 연상</td>\n<td><strong>아주 강력한 사례</strong> 중심의 사고</td>\n</tr>\n<tr>\n<td>무시하는 것</td>\n<td>기저율(실제 비율)</td>\n<td>실제 빈도</td>\n</tr>\n<tr>\n<td>예</td>\n<td>시 읽는 사람 → 영문학 교수</td>\n<td>비행기 사고 뉴스 → 비행이 위험</td>\n</tr>\n</tbody></table>\n<ul>\n<li>판별 요령: 문제에 &quot;~처럼 보여서/전형적이라서&quot;가 있으면 <strong>대표성</strong>, &quot;최근 봤다/쉽게 떠오른다/뉴스에서&quot;가 있으면 <strong>가용성</strong>.</li>\n</ul>\n<h2>p.10 — 과신 ⭐⭐⭐</h2>\n<ul>\n<li><strong>과신(Overconfidence)</strong>: 자신의 성과(지식·판단의 정확성)를 <strong>과대 추정</strong>하는 경향(Metcalfe, 1998).<ul>\n<li>실제 역량과 믿음의 괴리 → <strong>계획 오류(planning fallacy)</strong>(일이 걸릴 시간을 과소 추정)로 이어짐.</li>\n<li><strong>주식 중개인·투자 매니저</strong>에게서 많이 나타남.</li>\n<li><strong>메타인지(Meta Cognition)</strong> — 자기 인지에 대한 인지 — 의 중요성을 보여 주는 사례.</li>\n<li>국가 단위의 과신은 위험이 매우 큼: <strong>제1차 세계대전의 슐리펜 계획</strong>.</li>\n</ul>\n</li>\n<li>🎙 (37:47–40:34) <strong>슐리펜 계획</strong> 내용: 독일 제국이 서쪽 프랑스·동쪽 러시아와 <strong>양면 전쟁</strong> → 먼저 프랑스를 <strong>6개월 만에 항복</strong>시키고 군대를 동쪽으로 돌려 러시아를 이긴다는 계획. 체급이 비슷한 프랑스를 6개월에 항복시킨다는 비현실적 계획을 진지하게 믿었고, 실패 → 패전·<strong>독일 제국 해체</strong>. 주식 중개인 예(36:40): 초 단위로 차트를 보며 신중한 판단이 요구되지만 모든 요인을 다 고려할 수는 없는데도 정확히 예측할 수 있다고 과신. 「할 수 있다, 나라면」이라는 생각 자체가 과신의 일환일 수 있음.</li>\n</ul>\n<h2>p.11 — 신념 집착 ⭐⭐⭐</h2>\n<ul>\n<li><strong>신념 집착(Belief perseverance)</strong>: 자기 생각의 <strong>토대가 잘못되었음이 판명되어도</strong> 그 생각에 매달리는 경향.<ul>\n<li><strong>확증 편향</strong>·<strong>진영 논리</strong>와 밀접.</li>\n<li>가장 적절한 대처: <strong>반대편 주장을 고려</strong>하기(Catapano et al., 2019) — &quot;반대로 생각해 보라(consider the opposite)&quot;.</li>\n<li>반대 증거를 다소 인정하더라도 그 효과성을 <strong>평가 절하</strong>(Anglin, 2019).</li>\n</ul>\n</li>\n<li>🎙 (41:00–47:07) 교수: 신념 집착은 「결국엔 <strong>확증 편향이랑 거의 같은 거</strong>라고 보면 될 것 같아요」. 일화 — 2019년 미국 학회, 주의 연구 세션에서 반대 의견을 낸 청중에게 발표자가 「저번 학회에서도 똑같은 질문을 했는데 … 나가서 따로 얘기하자」. 주의 연구의 <strong>초기 선택설 vs 후기 선택설</strong> 논쟁도 예로 듦. 연구자 태도: 반대 결과가 나오면 허점부터 찾지 말고 <strong>상대의 실험 설계에서 왜 그런 결과가 나왔는지</strong> 생각하라.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>헷갈리는 쌍</th>\n<th><strong>확증 편향</strong></th>\n<th><strong>신념 집착</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>시점</td>\n<td>증거를 <strong>찾는</strong> 단계</td>\n<td>신념이 <strong>반박된 뒤</strong></td>\n</tr>\n<tr>\n<td>행동</td>\n<td>지지 증거만 선택적으로 수집</td>\n<td>반대 증거를 무시하고 신념 유지</td>\n</tr>\n</tbody></table>\n<h2>p.12 — 틀만들기 효과 ⭐⭐⭐</h2>\n<ul>\n<li><strong>틀만들기(Framing)</strong>: 어떤 사안에 대해 <strong>논제를 제기하는 방식</strong>.<ul>\n<li>어떤 틀로 문제를 제기하느냐에 따라 <strong>의사 결정이 달라짐</strong>. 설문 문항 구성에 따라 응답이 변한다(예: &quot;생존율 90%&quot; vs &quot;사망률 10%&quot;).</li>\n<li><strong>마음 갖춤새</strong>를 형성해 특정 방향으로 사고를 유도하는 기법 = <strong>넛지(Nudge)</strong> 를 가하기.</li>\n</ul>\n</li>\n<li>그림: 틀만들기를 통한 음주량 감소법.</li>\n<li>🎙 (47:07–48:05) 1장 사회조사의 <strong>말 표현 효과</strong>(용어에 따라 응답이 달라짐)와 같은 원리 — 표현이 응답자의 틀을 짠다. 언론의 「프레임을 짠다」도 같은 뜻: 판이 짜이면 그 안에서 생각하려는 경향이 강해 <strong>여러 정보 원천을 종합</strong>해야 한다(52:16–53:21).</li>\n</ul>\n<h2>p.13 — 틀만들기의 응용 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>응용</th>\n<th>방법</th>\n<th>출처</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>기부 증가</strong></td>\n<td>결정 전 &quot;어떻게 해야 도덕적으로 올바른가?&quot; 같은 도덕적 판단 질문 → 도덕적 사고의 틀 형성</td>\n<td>Capraro et al., 2019</td>\n</tr>\n<tr>\n<td><strong>장기 기증</strong></td>\n<td>설문 문항의 <strong>기본 응답(default)</strong> 을 &quot;원한다&quot; vs &quot;원하지 않는다&quot;로 다르게 → 기증 비율 변화</td>\n<td>Hajhosseini et al., 2013</td>\n</tr>\n<tr>\n<td><strong>음주량 감소</strong></td>\n<td><strong>술잔 크기를 줄여</strong> 잔 수가 많아 보이게 → 전체 음주량 감소</td>\n<td>Reynolds et al., 2019</td>\n</tr>\n</tbody></table>\n<ul>\n<li>장기 기증: 기본값이 &#39;기증함&#39;(옵트아웃)인 나라가 &#39;기증 안 함&#39;(옵트인)인 나라보다 기증률이 훨씬 높다 — 사람들은 기본값을 그대로 두는 경향.</li>\n<li>🎙 (48:05–52:16) 세 예를 모두 설명. 기부 = 실험 참가로 받은 <strong>금전 보상</strong>을 어떻게 할지 묻기 전에 「어떻게 해야 도덕적으로 올바른 일일까요」를 던지면 기부 금액 증가. 장기 기증 = 「사람들이 <strong>의사결정을 잘 안 바꾼다</strong>」. 음주 = 사람들은 마신 양을 <strong>잔 수</strong>로 추산하므로 잔을 작게 해 잔 수를 늘리면 「내가 요즘 너무 많이 마셨나」라는 틀이 씌워져 다음 음주량이 준다.</li>\n</ul>\n<h2>p.14 — 창의성 (1): 정의와 지능과의 관계 ⭐⭐</h2>\n<ul>\n<li><strong>창의성(creativity)</strong>: <strong>새롭고 가치 있는</strong> 아이디어를 생성하는 능력(Hennessey &amp; Amabile, 2010). 예: 페니실린의 발견.</li>\n<li>특정 수준의 <strong>학습 능력</strong>이 뒷받침되는 경우가 많다 — 아동기 <strong>정량적 적성</strong> 점수가 높은 사람이 논문·특허를 낼 가능성이 높음(Bernstein et al., 2019).</li>\n<li>다만 <strong>지능만으로는 설명할 수 없다</strong> — 지능 관련 두뇌 활동과 창의성 관련 두뇌 활동은 다르다(Jung &amp; Haier, 2013; Shen et al., 2017).</li>\n<li>🎙 (53:21–55:24) 창의성 = 프레임(틀)을 <strong>깰 수 있게 해 주는 능력</strong>으로 도입. 페니실린 = 「곰팡이」라는 틀에 머물지 않고 푸른곰팡이에서 나온 물질을 시험해 본 결과. 정량적 적성–논문·특허는 「상관이 좀 있다라는 거지 반드시 그렇다라는 건 아니에요」.</li>\n</ul>\n<h2>p.15 — 확산적 사고 vs 수렴적 사고 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><strong>확산적 사고(divergent thinking)</strong></th>\n<th><strong>수렴적 사고(convergent thinking)</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>추구</td>\n<td>문제 해결의 <strong>다양성</strong></td>\n<td><strong>최선의 해결책 하나</strong> 결정</td>\n</tr>\n<tr>\n<td>요구 능력</td>\n<td>다양한 선택지, 새로운 방식으로 생각하기</td>\n<td>답을 좁혀 고르기</td>\n</tr>\n<tr>\n<td>측정</td>\n<td>창의성 검사(예: 벽돌의 용도 많이 대기)</td>\n<td><strong>대부분의 적성검사</strong></td>\n</tr>\n<tr>\n<td>뇌</td>\n<td><strong>전두엽 손상</strong> 시 상상력(확산)이 손상</td>\n<td>전두엽 손상 시에도 <strong>유지</strong></td>\n</tr>\n</tbody></table>\n<ul>\n<li>전두엽 손상 사례: 수렴적 사고는 유지되나 <strong>상상력이 손상</strong>(Kolb &amp; Whishaw, 2006).</li>\n<li>연구의 두 축: <strong>새로운 결과를 창출</strong>(확산) + <strong>여러 결과를 하나로</strong>(수렴).</li>\n<li>🎙 (58:20–01:01:05) 교수 박사논문 일화: 실험 3개를 했는데 심사 교수가 「이 세 개의 실험을 통해서 말하고 싶은 너만의 … 큰 이야기 하나가 뭔데, 한 문장으로」, 「너만의 모형」을 요구 → 다양한 연구를 하는 것(확산)과 하나의 큰 흐름으로 묶는 것(수렴)이 <strong>둘 다 필요</strong>. 적성검사가 수렴적인 이유 = 「가장 정확한 하나의 답을 고르는 능력」을 요구하므로(57:23–58:20).</li>\n</ul>\n<h2>p.16 — 창의성의 5요소 (Sternberg &amp; Lubart) ⭐⭐⭐</h2>\n<p><strong>Sternberg &amp; Lubart (1991, 1992)</strong> 의 창의성 구성 요소:</p>\n<table>\n<thead>\n<tr>\n<th>요소</th>\n<th>정의</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>전문성(expertise)</strong></td>\n<td>잘 갖춰진 기반 지식</td>\n</tr>\n<tr>\n<td><strong>상상력 사고 기술(imaginative thinking skills)</strong></td>\n<td>새로운 방식으로 대상 분석하기</td>\n</tr>\n<tr>\n<td><strong>모험지향적 성격(venturesome personality)</strong></td>\n<td>새로운 경험 추구, 단호함</td>\n</tr>\n<tr>\n<td><strong>내재적 동기(intrinsic motivation)</strong></td>\n<td>흥미·즐거움에 기반한 추진력</td>\n</tr>\n<tr>\n<td><strong>창의적 환경(creative environment)</strong></td>\n<td>다양한 의견의 공유·소통이 중심인 환경</td>\n</tr>\n</tbody></table>\n<ul>\n<li>암기 팁: <strong>전·상·모·내·환</strong>.</li>\n</ul>\n<h2>p.17–18 — 각 구성 요소가 함의하는 바 ⭐⭐</h2>\n<ul>\n<li><strong>전문성</strong>: 무에서 유를 창출할 수 없다. 새로운 것은 <strong>기존 지식</strong>에서 시작.</li>\n<li><strong>상상력 사고 기술</strong>: 대상에 대한 <strong>관점의 변화</strong>로 전혀 다른 방식으로 해석.</li>\n<li><strong>모험지향적 성격</strong>: 새것에 도전하려면 보수적 성향보다 <strong>진취적</strong> 성격이 적합.</li>\n<li><strong>내재적 동기</strong>: 내면화된 동기(즐거움, 자아 실현감)가 더 높은 창의성을 유도(<strong>Amabile &amp; Hennessy, 1992</strong>). 외적 보상(돈·마감)보다 흥미가 중요.</li>\n<li><strong>창의적 환경</strong>: 개인뿐 아니라 <strong>환경</strong>도 뒷받침되어야 창의성 극대화. 인간의 심적 과정은 <strong>사회적·심리적·생물적 요인</strong>이 항상 함께 작용(→ 서막의 <strong>생물심리사회적 접근</strong>). 동료와의 <strong>토론과 지도</strong>가 중요한 요인(Simonton, 1992).</li>\n<li>🎙 (01:02:37–01:07:21) 내재적 동기 = 즐거움·「나는 이런 일이 잘 맞는 사람」이라는 <strong>자아 실현감</strong>, 외재적 동기와 대비(동기는 이후 수업에서 다시 다룸) — 「즐기는 사람은 이기기 어렵다」. 창의적 환경 예 = 논문 초고를 공동 저자·연구실 동료가 읽고 「이 말이 나는 잘 이해가 안 돼」 식으로 피드백(주저자는 당연하다고 생각해 생략한 부분을 심사위원은 모를 수 있음). 첫 수업의 「대인관계에 우선권을 부여하라」 조언과 연결.</li>\n<li>⚠️ 같은 연구자를 p.14는 &quot;Hennessey&quot;, p.18은 &quot;Hennessy&quot;로 표기. 교과서 표기는 <strong>Hennessey</strong>(Beth Hennessey).</li>\n</ul>\n<h2>p.19 — 창의성을 함양시키는 방법 (1) ⭐⭐</h2>\n<ul>\n<li><strong>전문성을 발달시킬 것</strong>: &quot;내가 무엇을 좋아하고 잘하는가?&quot;라는 물음에서 시작.</li>\n<li><strong>부화시간(incubation)을 가질 것</strong>: 한 문제에 계속 매달리면 좋은 해결책이 나오지 않는다. <strong>몰입해서 고민 → 잠시 시간을 두어</strong> 무의식적 처리가 연합을 형성하게 하라(Zhong et al., 2008).</li>\n<li>🎙 (01:07:21–01:08:51) 부화시간(전사 &quot;부하 시간&quot;)은 <strong>고착</strong>과 관련 — 「너무 한 문제에 매달리지 말자」. 예: 밤새 고민해도 안 풀리던 레포트가 하룻밤 자고 나서 다시 보면 방향이 잡힘 = 무의식적 처리로 조직화(연합)가 일어남.</li>\n</ul>\n<h2>p.20 — 창의성을 함양시키는 방법 (2) ⭐⭐</h2>\n<ul>\n<li><strong>명상이나 산책을 즐기기</strong>: 주의를 요구하는 자극은 인지 자원을 소모. <strong>평온감</strong>으로 자발성을 유지.</li>\n<li><strong>다른 문화와 사고 방식을 경험</strong>: 창의성 증대는 <strong>다른 관점을 취하는 것</strong>에서 시작. <strong>유학 생활 경험자</strong>가 창의성 면에서 유리(Godart et al., 2015).</li>\n<li>정리: 함양법 4가지 = <strong>전문성 발달, 부화시간, 명상·산책, 다른 문화 경험</strong>.</li>\n</ul>\n<h2>p.21 — 인지과정과 전략 비교 (1) ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>전략</th>\n<th>설명</th>\n<th>장점</th>\n<th>단점</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>알고리즘</strong></td>\n<td>체계적 규칙이나 절차</td>\n<td>해결책을 <strong>보장</strong></td>\n<td>시간과 노력이 필요</td>\n</tr>\n<tr>\n<td><strong>발견법</strong></td>\n<td>단순화된 사고의 지름길</td>\n<td>신속하고 효율적인 행동 가능</td>\n<td>오류의 위험성 높음</td>\n</tr>\n<tr>\n<td><strong>통찰</strong></td>\n<td>갑작스러운 해결책의 표상</td>\n<td>해결책의 즉각적 실현 제공</td>\n<td><strong>발생하지 않을 수 있음</strong></td>\n</tr>\n<tr>\n<td><strong>직관(intuition)</strong></td>\n<td>빠르고 자동적인 감정과 사고</td>\n<td>적용 범위가 방대하고 적응적</td>\n<td>지나치게 감정적일 수 있음</td>\n</tr>\n<tr>\n<td><strong>틀만들기</strong></td>\n<td>특정 반응을 유도하는 질문 방식</td>\n<td>타인의 결정에 영향을 줄 수 있음</td>\n<td>오도하는 결과를 내놓을 수 있음</td>\n</tr>\n<tr>\n<td><strong>창의성</strong></td>\n<td>가치 있는 아이디어를 생성하는 능력</td>\n<td>새로운 통찰과 산물 생성</td>\n<td><strong>구조화된 관례적 작업</strong>의 방해를 받음</td>\n</tr>\n</tbody></table>\n<ul>\n<li>🎙 (01:09:12–01:10:49) 교수의 표 읽는 법: 위 4개(<strong>알고리즘·발견법·통찰·직관</strong>)는 크게 「정확한 사고 vs 효율 추구」 두 갈래, 아래 <strong>틀만들기·창의성</strong>은 사고 과정에 영향을 주는 방향, p.22의 4개는 사고를 <strong>왜곡할 수 있는 요인</strong>.</li>\n<li><strong>직관</strong>은 이 표에만 독립 항목으로 등장 — &quot;빠르고 자동적인 감정과 사고&quot;라는 정의를 명칭으로 쓸 수 있게 외워 둘 것.</li>\n</ul>\n<h2>p.22 — 인지과정과 전략 비교 (2): 장애물 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>전략</th>\n<th>설명</th>\n<th>장점</th>\n<th>단점</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>확증 편향</strong></td>\n<td>자신의 견해를 지지하는 증거를 선택적으로 취합</td>\n<td>지지 증거에 대한 신속한 재인</td>\n<td>상반된 증거의 재인 방해</td>\n</tr>\n<tr>\n<td><strong>고착</strong></td>\n<td>새로운 각도에서 문제를 바라보는 능력의 결여</td>\n<td>생각에 몰두</td>\n<td>창의적 문제 해결을 방해</td>\n</tr>\n<tr>\n<td><strong>과신</strong></td>\n<td>자신의 판단에 대한 과대 추정</td>\n<td>쉽고 행복한 결정</td>\n<td>오류의 위험성 높음</td>\n</tr>\n<tr>\n<td><strong>신념 집착</strong></td>\n<td>반대되는 증거의 무시</td>\n<td>지속적인 신념을 지지</td>\n<td>새로운 아이디어의 차단</td>\n</tr>\n</tbody></table>\n<ul>\n<li>객관식 함정: 장점 칸도 외워 둘 것(예: 과신의 장점 = &quot;쉽고 행복한 결정&quot;).</li>\n</ul>\n<h2>p.23 — 언어와 사고 ⭐</h2>\n<ul>\n<li><strong>언어</strong>: 인간의 <strong>의사소통 수단</strong>이자 <strong>사고를 수행하는 매개체</strong>.</li>\n<li>소리·글자·몸짓·표정 등 다양한 매개체로 의미를 이해·전달.</li>\n<li>언어를 기반으로 세상을 이해·정의. 지식 속 개념은 결국 언어로 표현되고, <strong>범주 자체도 언어로 정의</strong>된다(→ p.2 개념).</li>\n</ul>\n<h2>p.24 — 언어의 구조 ⭐⭐⭐</h2>\n<p>구어 기준 <strong>3요소</strong>:</p>\n<table>\n<thead>\n<tr>\n<th>요소</th>\n<th>정의</th>\n<th>예</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>음소(Phoneme)</strong></td>\n<td>소리를 구분할 수 있는 <strong>최소 단위</strong></td>\n<td>&#39;ㄱ&#39;, &#39;ㅏ&#39; / bat의 b, a, t</td>\n</tr>\n<tr>\n<td><strong>형태소(Morpheme)</strong></td>\n<td><strong>의미</strong>를 구성하는 <strong>최소 단위</strong></td>\n<td>&#39;먹-&#39; + &#39;-었-&#39; + &#39;-다&#39; / re-+read+-ing</td>\n</tr>\n<tr>\n<td><strong>문법(Grammar)</strong></td>\n<td>단어를 조직화해 소통하게 해 주는 <strong>규칙 시스템</strong></td>\n<td>—</td>\n</tr>\n</tbody></table>\n<ul>\n<li>문법의 두 측면:<ul>\n<li><strong>의미론(semantics)</strong>: 소리로부터 <strong>의미</strong>를 도출하는 규칙.</li>\n<li><strong>통사론(syntax)</strong>: 단어의 <strong>배열</strong>로 문장을 구성하는 규칙.</li>\n</ul>\n</li>\n<li><strong>언어의 생산성(generativity)</strong>: <strong>제한된 기호의 조합</strong>으로 <strong>무한한 메시지</strong> 생성. 예: 한국어 자모 개수 자음 19개, 모음 21개(겹자음·이중모음 포함)로 무한한 문장.</li>\n<li>⚠️ 슬라이드 &quot;일반적으로 <strong>모음</strong> 음소가 더 많은 정보 포함&quot; — 교과서(Myers)는 반대로 <strong>자음</strong>이 모음보다 더 많은 정보를 담는다고 설명한다(모음을 빼도 &quot;Th ts f ths sntnc&quot; 처럼 읽힘). 시험에 나오면 교수 슬라이드 표현을 확인할 것. <strong>🎙 10/20: 미해결</strong> — p.23–24 설명은 휴식 뒤 마이크 문제로 녹음에 없다.</li>\n</ul>\n<h2>p.25 — 언어 획득: 보편 문법 ⭐⭐⭐</h2>\n<ul>\n<li><strong>보편 문법(universal grammar)</strong> — <strong>촘스키(Chomsky)</strong> 의 입장.<ul>\n<li>언어마다 <strong>보편적인 통사 규칙</strong>이 존재(Aryawibawa &amp; Ambridge, 2019).</li>\n<li><strong>명사·형용사·동사</strong>는 상당수 언어에 공통으로 존재(Blasi et al., 2016).</li>\n<li>단, 문법 구조 자체를 <strong>생득적으로 타고나는 것은 아니며</strong>, 이를 <strong>학습할 수 있는 소양</strong>을 타고나는 것.</li>\n</ul>\n</li>\n<li>비판: 실제 세상의 언어는 보편 문법이 제안하는 것보다 <strong>구조적 다양성이 높다</strong>(Bergen, 2014).</li>\n<li>🎙 (01:26:25–01:27:00, 녹음 재개 지점) 예: 지리적으로 동떨어진 <strong>핀란드어와 한국어의 문법적 특성이 비슷하다</strong>는 점 → 문법 규칙을 학습할 수 있는 소양을 타고난다는 관점으로 이해하기 좋다.</li>\n</ul>\n<h2>p.26 — 수용성 언어 ⭐⭐</h2>\n<ul>\n<li><strong>수용성 언어(receptive language)</strong>: <strong>말한 것을 이해</strong>하는 능력이 발달하는 <strong>초기 단계</strong>.<ul>\n<li>말은 못 하지만 <strong>말소리의 차이를 재인</strong>(Stager &amp; Werker, 1997).</li>\n<li>유아는 <strong>입술 모양</strong>으로 소리를 구분하는 능력을 발달시킴(Kuhl &amp; Meltzoff, 1982).</li>\n<li>수용성 언어 발달 = 이해 능력 발달의 지표.</li>\n</ul>\n</li>\n<li>🎙 (01:27:40) 입술 모양으로 소리를 구분하는 능력 = 4장에서 배운 <strong>맥거크 효과</strong>(입 모양과 들리는 소리가 다르면 제3의 소리로 지각; 전사 &quot;메커트 효과&quot;)와 연결.</li>\n</ul>\n<h2>p.27 — 표현성 언어와 발달 단계 ⭐⭐⭐</h2>\n<ul>\n<li><strong>표현성 언어(productive language)</strong>: <strong>말을 할 수 있는</strong> 능력.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>단계</th>\n<th>시기</th>\n<th>특징</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>옹알이 단계(babbling stage)</strong></td>\n<td>약 <strong>4개월</strong></td>\n<td>언어와 무관한 소리 생성 (<strong>어른 말소리의 모방이 아님</strong>)</td>\n</tr>\n<tr>\n<td><strong>한 단어 단계(one-word stage)</strong></td>\n<td>약 <strong>12개월</strong></td>\n<td>단일 단어로 의사 표현</td>\n</tr>\n<tr>\n<td><strong>두 단어 단계(two-word stage)</strong></td>\n<td>약 <strong>24개월</strong></td>\n<td>2개 단어로 간단한 문장 (주로 <strong>명사+동사</strong> 통사 규칙)</td>\n</tr>\n<tr>\n<td>이후</td>\n<td>—</td>\n<td>문장 구성 능력 <strong>급속 발전</strong></td>\n</tr>\n</tbody></table>\n<ul>\n<li>교과서 용어: 두 단어 단계의 말은 조사·관사가 빠진 전보 같아서 <strong>전보식 말(telegraphic speech)</strong> 이라 부른다.</li>\n<li>수용성(이해)이 표현성(산출)보다 <strong>먼저</strong> 발달.</li>\n<li>🎙 (01:28:49–01:29:37) 옹알이(전사 &quot;동아리&quot;)는 「어른의 말을 모방하는 것과는 사뭇 다른 양상」, 한 단어 단계 예 「마마」. 두 단어 단계를 전사는 「보통 <strong>명사 플러스 명사</strong>의 형태」로 받아 적었다 — 슬라이드는 <strong>명사+동사</strong>. 오인식인지 말실수인지 판별할 수 없으므로 <strong>슬라이드(명사+동사)</strong> 로 외울 것.</li>\n</ul>\n<h2>p.28 — 결정적 시기 ⭐⭐⭐</h2>\n<ul>\n<li><strong>결정적 시기(= 민감 시기, Critical Period)</strong>: 언어 학습 효율이 가장 좋은 기간(Hernandez &amp; Li, 2007). <strong>대략 7세까지</strong>.<ul>\n<li>일시적 노출만 있어도 <strong>입양아</strong>는 출생 국가의 언어를 훨씬 쉽게 습득(Choi et al., 2017).</li>\n<li>언어 노출의 가장 좋은 방법: <strong>동화책 읽어 주기</strong>.</li>\n<li>성인이 되어 외국어를 배우면 <strong>모국어 억양</strong>이 섞임(Hartshorne et al., 2018).</li>\n<li><strong>신경 가소성</strong>과 밀접.</li>\n</ul>\n</li>\n<li>그림: 이민 연령에 따른 외국어 문법 정답률.</li>\n<li>🎙 (01:29:37–01:31:59) 예: 한국에서 태어나 잠깐 한국어에 노출된 뒤 미국으로 간 아이는 나중에 한국어를 배울 때 다른 사람보다 훨씬 수월. <strong>이중언어 화자</strong>(전사 &quot;이중어 학자&quot;) — 「여기 계신 분들은 전부」 해당. 결정적 시기에 배우면 두 언어를 <strong>비슷한 수준</strong>으로 발전시키기 유리, 나중에 배우면 모국어 지식이 개입 → <strong>러시아인·독일인 특유의 영어 억양</strong>. <strong>영어 유치원</strong> 과열도 이 때문.</li>\n<li>참고: 슬라이드는 결정적 시기 = 민감 시기로 같은 것으로 묶는다. 교과서에서는 &#39;결정적&#39;은 그 시기를 놓치면 습득 불가, &#39;민감&#39;은 습득이 가장 쉬운 시기라는 뉘앙스 차이가 있지만, 이 강의 기준으로는 동의어로 외우면 된다.</li>\n</ul>\n<h2>p.29 — 두뇌와 언어: 브로카·베르니케 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><strong>브로카(Broca) 영역</strong></th>\n<th><strong>베르니케(Wernicke) 영역</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>위치(교과서)</td>\n<td>좌반구 <strong>전두엽</strong></td>\n<td>좌반구 <strong>측두엽</strong></td>\n</tr>\n<tr>\n<td>담당</td>\n<td>언어의 <strong>표현(산출)</strong></td>\n<td>언어의 <strong>이해</strong></td>\n</tr>\n<tr>\n<td>손상 시</td>\n<td><strong>브로카 실어증</strong>: 온전한 문장 발화 불가</td>\n<td><strong>베르니케 실어증</strong>: 발화는 유창하나 <strong>내용이 와해</strong></td>\n</tr>\n<tr>\n<td>예</td>\n<td>&quot;아침… 밥… 먹고… 학교… 갔어요.&quot;</td>\n<td>&quot;아침에는 그게 아주 잘 돌아가서, 밥이 학교를 지나가니까 제가 거기서 좋은 시간을 했어요.&quot;</td>\n</tr>\n</tbody></table>\n<ul>\n<li>언어의 신경과학:<ul>\n<li>2개 언어를 <strong>동일하게 숙달</strong>하면 <strong>동일 영역</strong>이 활성화(Kim et al., 2017).</li>\n<li><strong>성인 때</strong> 외국어를 학습하면 두뇌 영역이 <strong>분할</strong>됨.</li>\n<li>언어 활동은 수많은 인지 기능 영역이 <strong>보조</strong>한다(두 영역만으로 언어가 이루어지지 않음).</li>\n</ul>\n</li>\n<li>🎙 (01:31:59–01:34:39) 「<strong>중요한 거는</strong>」 브로카 실어증은 문장이 어눌해도 <strong>무슨 말을 하고 싶은지 이해하는 데는 큰 어려움이 없다</strong> — 「그게 브로카 실어증의 가장 큰 특징」. 베르니케 실어증은 표현은 자연스러우나 이해 영역이 망가져 와해된 내용. 교수는 「둘 다 <strong>좌반구</strong> … 왼쪽 측두엽 쪽」이라고 말했다 — 교과서상 브로카는 <strong>좌반구 전두엽</strong>이므로 위치는 위 표(교과서)대로 두고, &quot;둘 다 좌반구&quot;만 확실히 할 것. 이중언어: 두 언어를 비슷하게 구사 = <strong>균형 이중언어 화자</strong>(→ 동일 영역 활성화), 그렇지 않으면 <strong>불균형 이중언어 화자</strong>(→ 다른 영역) — 슬라이드에 없는 용어.</li>\n</ul>\n<h2>p.30 — 언어결정론 vs 언어상대성 ⭐⭐⭐</h2>\n<p>질문: <strong>사고와 언어 중 무엇이 먼저인가?</strong></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><strong>언어결정론(= 사피어-워프 가설)</strong></th>\n<th><strong>언어상대성(linguistic relativity)</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>주장</td>\n<td>언어 자체가 사람의 기본 생각을 <strong>결정</strong></td>\n<td>언어가 사고에 <strong>영향</strong>을 미침 (결정론의 <strong>약화된 버전</strong>, Gentner, 2016)</td>\n</tr>\n<tr>\n<td>비판·근거</td>\n<td>너무 극단적 — <strong>지칭하는 단어가 없어도 개념을 생각할 수 있다</strong>는 비판</td>\n<td>영어는 <strong>자기중심 정서</strong> 어휘, 일본어는 <strong>대인관계 정서</strong> 어휘가 더 많음(Markus &amp; Kitayama, 1991)</td>\n</tr>\n<tr>\n<td></td>\n<td></td>\n<td><strong>이중언어 화자</strong>는 사용 언어에 따라 <strong>자기 개념</strong>이 다름(Pavlenko, 2014)</td>\n</tr>\n</tbody></table>\n<ul>\n<li>명칭 주의: 가설 이름은 <strong>사피어-워프(Sapir–Whorf)</strong>. 언어결정론을 처음 제기한 사람으로 교과서는 <strong>벤저민 리 워프(Benjamin Lee Whorf)</strong> 를 든다.</li>\n<li>🎙 (01:34:39–01:37:36) 언어결정론 예 = 소설 <strong>『1984』의 신어(Newspeak)</strong>: 구세계 단어를 지우고 새 단어를 강제로 학습시켜 「불순한 생각」을 막으려 함. 비판 = 「말로 표현할 수 없는데 우리 머릿속에 떠오르는 그런 생각들도 분명히 존재」. 언어상대성 = 「한 발자국 물러난 입장」. 영어(개인주의)·일본어(집단주의) 정서 어휘 차이, 이중언어 화자는 한국어를 쓸 때와 영어를 쓸 때 자기 개념이 달라질 수 있다.</li>\n</ul>\n<h2>p.31 — 언어와 지각, 아동의 언어와 사고 ⭐⭐</h2>\n<ul>\n<li><strong>언어와 지각</strong>: 특정 표현의 <strong>존재 유무</strong>가 물리적 <strong>지각</strong>에도 영향(He et al., 2019; Ozgen, 2004).<ul>\n<li><strong>몽골인과 중국인의 색 지각 차이</strong>(He et al., 2019).</li>\n<li><strong>러시아어와 영어</strong> 사용자의 색 지각 차이 — 러시아어는 연파랑(goluboy)과 진파랑(siniy)을 다른 단어로 구분 → 두 파랑을 더 빨리 구별.</li>\n</ul>\n</li>\n<li><strong>아동의 언어 학습과 사고 발달</strong>: 아동의 사고는 언어와 <strong>함께</strong> 발달(Gopnik &amp; Meltzoff, 1986). 언어와 사고는 <strong>양방향적</strong> 관계.</li>\n<li>🎙 (01:37:36–01:40:49) 몽골·중국 색 지각은 4장(지각의 후천적 요인)에서 이미 소개한 연구. 러시아어는 파랑 스펙트럼 각각에 고유 명칭이 있어 러시아인은 차이를 다 식별하지만 미국인은 잘 못 함; 우리(한국어)도 색 명칭이 세분화돼 구별 가능. 최종 결론: 어느 한쪽이 일방적으로 영향을 주는 것이 아니라 <strong>양방향</strong>.</li>\n</ul>\n<h2>p.32 — 지능이란? 일반 지능(스피어만) ⭐⭐⭐</h2>\n<ul>\n<li>대다수 연구는 지능을 <strong>지능검사가 측정한 수치</strong>로 정의. 학업 성취와 연관이 큼.</li>\n<li>그러나 지능은 <strong>시대와 문화에 따라</strong> 다르게 정의될 수 있다(Sternberg &amp; Kaufman, 1998).</li>\n<li><strong>일반 지능(General intelligence)</strong> — <strong>스피어만(Spearman, 1904)</strong>:<ul>\n<li>지능을 <strong>단일 지표(g 요인)</strong> 로 산출.</li>\n<li><strong>요인 분석(factor analysis)</strong> 을 통한 군집화로 산출.</li>\n<li>인간의 모든 지적 행동은 <strong>일반 지능이라는 단일 능력</strong>에서 비롯된다.</li>\n</ul>\n</li>\n</ul>\n<h2>p.33 — 1차 심적 능력(서스톤) ⭐⭐⭐</h2>\n<ul>\n<li><strong>서스톤(Thurstone)</strong>: 지능을 1차적으로 <strong>7가지</strong>로 분류(<strong>1차 심적 능력, primary mental abilities</strong>) — 스피어만의 단일 지능 이론에 <strong>반대</strong>.</li>\n<li>그러나 7가지 능력의 상관을 분석한 결과 <strong>각 능력 간 정적 상관</strong>이 나타남(Warne &amp; Burningham, 2019) → 단일 지표는 아니지만 <strong>g 요인의 영향력</strong>을 인정.</li>\n<li>각 두뇌 영역이 서로 다른 능력을 담당하고, <strong>영역 간 협응 활동</strong>이 g 요인을 설명(Cole et al., 2015).</li>\n<li>교과서식 7능력 예: 언어 이해, 단어 유창성, 수, 공간, 지각 속도, 기억, 추리.</li>\n<li>🎙 (01:42:50–01:45:07) 교수 설명: 서스톤 <strong>본인이</strong> 7능력 점수를 각각 재 보니 능력 간 <strong>유의미한 정적 상관</strong> → 7영역으로 나눌 수는 있지만 완전히 독립적이라 보기 어렵다 → 단일 지표로 보지는 않으나 <strong>g 요인의 영향력은 인정</strong>. 「살짝 이제 <strong>중간적인 위치</strong>」(01:52:51 정리 때도 반복).</li>\n</ul>\n<h2>p.34 — 다중 지능(가드너), 현자 증후군 ⭐⭐⭐</h2>\n<ul>\n<li><strong>가드너(Gardner)</strong>: 지능은 <strong>상대적으로 독립적인 8개 영역</strong>으로 구성(<strong>다중 지능, multiple intelligences</strong>).<ul>\n<li>근거: 두뇌의 한 영역이 손상되어도 다른 영역이 온전하면 해당 능력은 높은 수준을 유지.</li>\n<li><strong>현자 증후군(savant syndrome)</strong>: 지능 검사·언어 능력에는 제한이 있으나 특정 영역(수학·예술 등)에서는 굉장히 뛰어난 능력(Treffert, 2010). <strong>자폐 스펙트럼 장애</strong>를 같이 갖는 경우가 많음.</li>\n</ul>\n</li>\n<li>그림: Gardner(1998)의 8가지 지능 유형 — 교과서 기준 언어, 논리-수학, 음악, 공간, 신체-운동, 대인관계, 개인 내적(자기 성찰), 자연 탐구.</li>\n<li>⚠️ 슬라이드 문장 &quot;<strong>서스톤은</strong> 각 능력이 유의미한 상관 관계가 존재한다고 주장함&quot;은 어색하다. 서스톤은 오히려 <strong>단일 g에 반대</strong>한 쪽이고, 7능력 간 상관을 보인 것은 이후의 분석(p.33 Warne &amp; Burningham)이다. 가드너와 대비시키려는 문장(&quot;서스톤의 능력들은 서로 상관이 있지만 가드너의 영역은 독립적&quot;)으로 읽는 것이 맞다.<ul>\n<li><strong>🎙 10/20 교수 설명으로 정리됨</strong>: 교수는 슬라이드 문장 그대로 「서스톤은 각 영역 간의 점수가 유의미한 정적 상관관계가 있다라고 했습니다」(01:46:13)라고 설명했다. 이 강의 기준 답 = <strong>서스톤 = 7능력, 상관 있음 → g 영향 인정(중간 입장)</strong> vs <strong>가드너 = 8영역, 독립</strong>. 예: 「언어 능력 검사 점수가 높은 사람들은 … 수리 능력에서도 높은 점수를 받는 경향」(01:46:13–01:47:00).</li>\n</ul>\n</li>\n<li>🎙 (01:47:00–01:48:46) 가드너의 근거(한 영역이 손상돼도 다른 영역은 온전) = <strong>이중 해리</strong>(double dissociation; 슬라이드에 없는 용어), 예 = 브로카 영역만 손상 → 브로카 실어증만, 베르니케 영역만 손상 → 베르니케 실어증만.</li>\n</ul>\n<h2>p.35 — 삼원 이론(스턴버그) ⭐⭐⭐</h2>\n<ul>\n<li><strong>스턴버그(Sternberg)의 삼원 이론(triarchic theory)</strong>: 지능을 <strong>3개 하위 영역</strong>으로 분류.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>지능</th>\n<th>내용</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>분석 지능(analytical, 학업 문제해결)</strong></td>\n<td>지정된 <strong>하나의 답</strong>을 도출하는 능력 → <strong>학업 성적</strong> 예측</td>\n</tr>\n<tr>\n<td><strong>창의성 지능(creative)</strong></td>\n<td><strong>새로운 아이디어</strong> 창출</td>\n</tr>\n<tr>\n<td><strong>현실 지능(practical)</strong></td>\n<td><strong>다중 해법</strong>을 갖는 <strong>일상 속 문제</strong> 해결에 필요</td>\n</tr>\n</tbody></table>\n<ul>\n<li>주의: 스턴버그는 <strong>창의성 5요소(p.16, Sternberg &amp; Lubart)</strong> 와 <strong>삼원 이론</strong> 두 곳에 모두 등장.</li>\n<li>🎙 (01:48:46–01:49:28) 분석 지능 = p.15의 <strong>수렴적 사고</strong>와 관련된 능력, 창의성 지능 = 새로운 아이디어 창출, 현실 지능 = 적성 검사와 달리 일상 문제는 해법이 하나가 아님(다중 해법).</li>\n</ul>\n<h2>p.36 — 일반 지능의 영향력 ⭐⭐</h2>\n<ul>\n<li><strong>g 요인</strong>은 다양한 과제·직업에서의 높은 성취를 예측(Gottfredson, 2002a,b).</li>\n<li>일반 지능은 <strong>높은 소득</strong>을 예측(Ganzach &amp; Patel, 2018). 그림: 지능과 소득 간의 상관(자고스키, 2007).</li>\n<li>극단적으로 높은 인지능력 점수는 <strong>박사학위 성취</strong>를 예측(Kuncel &amp; Hezlett, 2010).</li>\n<li>그러나 <strong>타고난 능력만으로 성공이 보장되지 않는다</strong> — <strong>내적 동기(투지, grit)</strong> 와 <strong>훈련</strong>이 병행되어야 함. 운동선수의 성취에는 생득적 능력 외에 <strong>최소 3천 시간 이상의 훈련</strong>이 필요(Campitelli &amp; Gobet, 2011).</li>\n<li>🎙 (01:49:28–01:50:54) 그래프(자고스키, 전사 &quot;자버스킨&quot;)의 지능–소득 <strong>상관은 약 0.3</strong> — 「영향력이 없다라는 건 아니지만 … 모든 걸 지능으로서만 해결하지는 않는다」. 운동선수 훈련 시간은 전사가 「최소 30시간」으로 받았지만 슬라이드 <strong>3천 시간</strong>이 맞다(오인식).</li>\n<li>⚠️ 슬라이드 표기 &quot;Ganzach Patel&quot; → &quot;Ganzach &amp; Patel&quot;의 &#39;&amp;&#39; 누락으로 보임.</li>\n</ul>\n<h2>p.37 — 사회 지능과 정서 지능 ⭐⭐⭐</h2>\n<ul>\n<li><strong>사회 지능(social intelligence)</strong>: 사회 상황을 이해하고 자신을 공적으로 관리하는 <strong>노하우</strong>(<strong>손다이크, 1920</strong>).</li>\n<li><strong>정서 지능(emotional intelligence)</strong>: 사회 지능의 일환으로, 타인의 정서를 <strong>이해</strong>하고 자신의 정서를 <strong>관리</strong>하는 능력. <strong>4가지 성분</strong>:</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>성분</th>\n<th>내용</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>정서 지각</strong></td>\n<td>외부 요인(얼굴·음악·이야기)에서 정서를 <strong>재인</strong>하고 자신의 정서를 확인</td>\n</tr>\n<tr>\n<td><strong>정서 이해</strong></td>\n<td>정서를 <strong>예측</strong>하고 변화시키며 완화하는 방법을 모색</td>\n</tr>\n<tr>\n<td><strong>정서 관리</strong></td>\n<td>다양한 상황에서 정서를 <strong>표현</strong>하고 타인의 정서에 <strong>대처</strong></td>\n</tr>\n<tr>\n<td><strong>정서 사용</strong></td>\n<td><strong>적응적·창의적 사고를 촉진</strong>하기 위해 정서를 활용</td>\n</tr>\n</tbody></table>\n<ul>\n<li>암기 팁: <strong>지·이·관·사</strong> (지각 → 이해 → 관리 → 사용).</li>\n</ul>\n<h2>p.38 — 정서 지능의 영향력 ⭐⭐</h2>\n<ul>\n<li>정서 지능이 높은 사람: 사회 상황과 자신을 모두 잘 자각. <strong>우울·불안에 휩쓸리지 않는 안정성</strong>, 행복·건강한 경향(Schutte et al., 2016).</li>\n<li><strong>사회관계·경력·자녀 양육</strong> 등에서 성공적인 경우가 많음(Miao et al., 2016).</li>\n<li>비판: 정서 지능은 <strong>지능 개념을 과도하게 확장</strong>한 것(Waterhouse, 2006).</li>\n<li>🎙 (01:52:06–01:52:51) 비판을 교수는 「지능 개념을 과하게 여기저기 갖다 붙여서 해석하는 게 아니냐」로 표현.</li>\n</ul>\n<h2>p.39 — 지능 이론 비교표 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>이론</th>\n<th>요약</th>\n<th>장점</th>\n<th>다른 고려사항(비판)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>일반 지능(g)</strong> (스피어만)</td>\n<td>지능을 <strong>하나의 지표</strong>로 산출, 다양한 학문 분야 능력 예측</td>\n<td>상이한 능력 간의 <strong>상관</strong></td>\n<td>지능을 단일 지표로 묶을 수 없음</td>\n</tr>\n<tr>\n<td><strong>일차 심적 능력</strong> (서스톤)</td>\n<td>지능이 <strong>7개 요인</strong>으로 분할되나 <strong>상호 상관이 높음</strong></td>\n<td>단일 g 점수보다 설명력 높음</td>\n<td>영역이 분할되어 있으나 <strong>g 요인의 영향력</strong> 존재</td>\n</tr>\n<tr>\n<td><strong>다중 지능 이론</strong> (가드너)</td>\n<td>지능을 <strong>8개의 독립적 영역</strong>으로 분류</td>\n<td>지능은 언어·수리 능력에 국한되지 않음</td>\n<td><strong>모든 능력을 지능이라 칭할 필요 없음</strong></td>\n</tr>\n<tr>\n<td><strong>삼원 이론</strong> (스턴버그)</td>\n<td>지능을 <strong>3개 영역</strong>으로 분류, <strong>실세계 성공</strong> 예측</td>\n<td><strong>측정 상 신뢰도가 높음</strong></td>\n<td>실제 세 영역은 <strong>독립적이지 않을 수</strong> 있음</td>\n</tr>\n<tr>\n<td><strong>정서 지능</strong></td>\n<td>사회 지능의 일환, 삶의 성공 예언. 정서의 지각·이해 등과 연관</td>\n<td>정서의 <strong>4가지 성분</strong>이 사회적 성공 예측</td>\n<td>지능 개념이 <strong>과하게 확대</strong>될 수 있음</td>\n</tr>\n</tbody></table>\n<ul>\n<li>숫자 매칭: <strong>스피어만 1(g) · 스턴버그 3 · 정서 4 · 서스톤 7 · 가드너 8</strong>.</li>\n<li>🎙 (01:52:51–01:55:00) 교수가 「총 5개의 지능 입장」을 한 번 더 정리했고, 수업 마지막(02:12:24)에도 「다섯 가지 입장」을 다시 짚었다 — 이 표가 7장 지능 파트의 핵심. 정리 순서: 스피어만(단일 지표) → 서스톤(7영역, 상관 → 중간 입장) → 가드너(8 독립, 「서스톤보다 확실하게」 분리) → 스턴버그(3영역) → 정서 지능(사회·정서로 확장).</li>\n</ul>\n<h2>p.40 — 지능 검사·성취 검사·적성 검사 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>검사</th>\n<th>정의</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>지능 검사(intelligence test)</strong></td>\n<td>개인의 <strong>심적 적성</strong>을 평가하는 도구</td>\n</tr>\n<tr>\n<td><strong>성취 검사(achievement test)</strong></td>\n<td><strong>이미 학습한 내용</strong>을 평가 (과거)</td>\n</tr>\n<tr>\n<td><strong>적성 검사(aptitude test)</strong></td>\n<td>개인의 <strong>미래 성취를 예측</strong> (적성 = 학습 능력)</td>\n</tr>\n</tbody></table>\n<ul>\n<li>일반 지능 점수(IQ)와 <strong>SAT</strong> 간 상관 약 <strong>0.82</strong>(Detterman, 2004) — 적성 검사가 사실상 일반 지능을 재고 있음.</li>\n<li>적성은 성취를 지원하며, <strong>학습 속도가 빠른</strong> 사람은 정보의 <strong>장기적 유지</strong>에도 유리(Zerr et al., 2018).</li>\n<li>🎙 (01:55:00) 성취 검사 예 = 「여러분이 저번에 쳤던 <strong>중간고사</strong>」.</li>\n</ul>\n<h2>p.41 — 초기 지능 검사: 골턴, 비네 ⭐⭐⭐</h2>\n<ul>\n<li><strong>프랜시스 골턴(Francis Galton)</strong>: 근력·신체 비율·반응 시간 등으로 &#39;지적 강도&#39;를 평가 → 측정 지표 간 <strong>상관이 유의하지 않음</strong>(실패).</li>\n<li><strong>알프레드 비네(Alfred Binet)</strong>: 아동의 <strong>정신 연령(mental age)</strong> 과 연합된 수행 수준을 측정.<ul>\n<li>목적: 아동의 <strong>학업 성취 예측</strong>(도움이 필요한 아이 선별). <strong>생득적 지능 측정을 목표로 하지 않음.</strong></li>\n<li>가정: 모든 아동은 <strong>동일한 발달 과정</strong>을 거치지만 어떤 아동은 <strong>더 빠르게</strong> 발달.</li>\n<li>심적 적성을 다양한 방식으로 구현된 <strong>보편 능력</strong>으로 가정.</li>\n<li>점수가 낮은 아동을 위해 주의·자기훈련 능력을 발달시키는 <strong>심적 정형술(mental orthopedics)</strong> 을 &#39;권장&#39;.</li>\n</ul>\n</li>\n<li>🎙 (01:56:50–01:57:32) 비네 검사의 배경: 프랑스에서 <strong>의무 교육</strong>이 법으로 정해져 모든 아이가 학교에 가게 되었는데, 모두가 같은 속도로 수업을 따라갈 수는 없으니 그 수준을 예측하려고 만듦.</li>\n</ul>\n<h2>p.42 — 스탠퍼드-비네 검사와 IQ ⭐⭐⭐</h2>\n<ul>\n<li><strong>스탠퍼드-비네 검사(Stanford-Binet)</strong> — <strong>루이스 터먼(Lewis Terman)</strong>:<ul>\n<li>비네 검사를 토대로 확대·개편.</li>\n<li><strong>생득적 지능을 측정할 수 있다고 가정</strong> (← 비네와 정반대).</li>\n<li>이 검사를 토대로 <strong>IQ 공식</strong>이 쓰임.</li>\n</ul>\n</li>\n<li><strong>IQ 계산 공식 — 윌리엄 스턴(William Stern)</strong>:\n<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"katex-base\"><span class=\"katex-strut\" style=\"height:0.8778em;vertical-align:-0.1944em;\"></span><span class=\"mord text\"><span class=\"mord\">IQ</span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"katex-base\"><span class=\"katex-strut\" style=\"height:2.2963em;vertical-align:-0.936em;\"></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.3603em;\"><span style=\"top:-2.314em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord text\"><span class=\"mord hangul_fallback\">생활</span><span class=\"mord\">(</span><span class=\"mord hangul_fallback\">실제</span><span class=\"mord\">) </span><span class=\"mord hangul_fallback\">연령</span></span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.677em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord text\"><span class=\"mord hangul_fallback\">정신</span><span class=\"mord\"> </span><span class=\"mord hangul_fallback\">연령</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.936em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"katex-base\"><span class=\"katex-strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">100</span></span></span></span></span><ul>\n<li>예: 생활 연령 8세 아동이 10세 수준 수행 → <span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"katex-base\"><span class=\"katex-strut\" style=\"height:1.1901em;vertical-align:-0.345em;\"></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8451em;\"><span style=\"top:-2.655em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"katex-sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mtight\">8</span></span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.394em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"katex-sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mtight\">10</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.345em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"katex-base\"><span class=\"katex-strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">100</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"katex-base\"><span class=\"katex-strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">125</span></span></span></span>.</li>\n<li>어린이에게는 잘 맞지만 <strong>어른</strong>의 지능 측정에는 부적합(40세가 20세 수준이면 IQ 50?). → 현대 검사는 <strong>동일 연령 집단 내 상대 위치</strong>(평균 100)로 IQ를 계산.</li>\n</ul>\n</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>헷갈리는 쌍</th>\n<th><strong>비네</strong></th>\n<th><strong>터먼</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>검사</td>\n<td>최초 지능 검사(정신 연령)</td>\n<td>스탠퍼드-비네</td>\n</tr>\n<tr>\n<td>생득적 지능</td>\n<td>측정 목표 <strong>아님</strong></td>\n<td>측정 <strong>가능</strong>하다고 가정</td>\n</tr>\n</tbody></table>\n<ul>\n<li>🎙 (01:59:37–02:00:22) 스탠퍼드-비네는 아동뿐 아니라 <strong>성인</strong>도 대상 — <strong>제1차 세계대전</strong> 때 대규모로 모인 병력 중 명령을 이해·수행할 수 있는 사람을 가리는 데 썼다(슬라이드에 없음). 현대 IQ: 수행을 잰 뒤 <strong>모집단 데이터의 평균을 100</strong>으로 두고 그 분포에서의 상대 위치로 계산.</li>\n</ul>\n<h2>p.43 — 현대 지능 검사: WAIS ⭐⭐⭐</h2>\n<ul>\n<li><strong>웩슬러 성인용 지능 검사(WAIS, Wechsler Adult Intelligence Scale)</strong>: 총 <strong>15개 하위 검사</strong>.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>하위 검사 예</th>\n<th>내용</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>공통성</strong></td>\n<td>두 사물·개념의 공통점 추리</td>\n</tr>\n<tr>\n<td><strong>어휘</strong></td>\n<td>그림 속 사물 이름 붙이기, 단어 정의</td>\n</tr>\n<tr>\n<td><strong>토막짜기</strong></td>\n<td>시각적 추상 처리(패턴 맞추기)</td>\n</tr>\n<tr>\n<td><strong>기호 쓰기</strong></td>\n<td>숫자·문자의 연속 패턴을 듣고 일정 규칙에 맞게 정렬</td>\n</tr>\n</tbody></table>\n<ul>\n<li>WAIS는 <strong>전반적 지능 점수</strong>와 함께 <strong>하위 영역별 개별 점수</strong>도 제공.</li>\n<li>⚠️ &quot;기호 쓰기&quot; 설명(숫자·문자의 연속을 <strong>듣고</strong> 규칙대로 정렬)은 교과서의 <strong>순서화(letter-number sequencing)</strong> 하위 검사 설명에 해당한다. 슬라이드 그대로 외우되, 이름-설명 짝이 다르게 나오면 이 점을 떠올릴 것. <strong>🎙 10/20: 미해결</strong> — 교수는 네 하위 검사를 「추론(공통성)·언어(어휘)·패턴 맞추기의 시각적 추상 처리(토막짜기)·기호를 규칙에 맞게 정리」로만 읽고, &#39;듣고&#39;·순서화 문제는 언급하지 않았다(02:01:43).</li>\n<li>🎙 (02:01:01–02:02:23) 교수는 학부 때 임상 교수의 체험으로 웩슬러 검사를 받아 봤는데 <strong>약 1시간 반</strong> 걸렸다. 15개 하위 영역 구성은 「다중지능 입장이랑 비슷한 거」, <strong>영역별 개별 점수 + 통합 점수 두 가지를 모두 제공</strong>하는 것이 특징, 「요즘에는 … 웩슬러 검사를 많이 활용」.</li>\n</ul>\n<h2>p.44 — 지능 검사 제작 원리 (1): 표준화 ⭐⭐⭐</h2>\n<ul>\n<li><strong>표준화(Standardization)</strong>: 사전에 검사를 받은 집단(<strong>표준화 집단</strong>)의 수행과 개인의 수행을 <strong>비교</strong>하여 점수의 의미를 정의하는 것.<ul>\n<li>개인의 수준을 논할 <strong>기준점</strong>이 필요.</li>\n<li>다수 참가자의 데이터를 종합해 <strong>분포</strong> 양상을 분석.</li>\n<li>집단 데이터 안에서 개인이 어느 범위에 속하는가로 의미 부여.</li>\n</ul>\n</li>\n<li>검사 도구 개발의 <strong>필수 요인</strong>.</li>\n<li>🎙 (02:02:46–02:05:39) 지능 검사 문항은 쉬워 보여도 「수많은 절차를 거쳐서 엄격하게」 구성된 것. 절차: 문항 제작 → <strong>많은 사람에게 시범 실시</strong> → 지표가 일관되게 나오는지·의도한 것을 재는지·분포가 <strong>편포되지 않고 정규곡선</strong>인지 검증. 그냥 점수가 높다고 지능이 높다고 하는 것이 아니라, 최대한 많은 사람의 데이터 안에서 어느 수준인지로 평가해야 객관적.</li>\n</ul>\n<h2>p.45 — 표준화 (2): 정규곡선 ⭐⭐⭐</h2>\n<ul>\n<li>검사 집단의 점수는 통상 <strong>정규곡선(= 정규분포, normal curve)</strong> 형태.<ul>\n<li>평균을 기준으로 각 점수별 분포를 그린 <strong>종 모양</strong> 곡선.</li>\n<li>대부분이 <strong>평균 근처</strong>에 분포하고, <strong>극단으로 갈수록 빈도가 낮아짐</strong>.</li>\n<li>지능 검사 기준: 평균 100, 약 68%가 85–115 사이(교과서).</li>\n</ul>\n</li>\n<li><strong>중심극한정리</strong>: 표본이 커질수록 데이터 곡선은 정규분포에 가까워짐.</li>\n<li>⚠️ 엄밀히는 중심극한정리는 <strong>표본 평균의 분포</strong>가 정규분포에 가까워진다는 정리이고, 원자료 자체가 정규분포가 된다는 뜻은 아니다. 시험에서는 슬라이드 표현대로 답하되 개념은 구분해 둘 것. <strong>🎙 10/20: 교수는 이 구분을 다루지 않았다</strong> — 중심극한정리를 「<strong>충분한 표본 수</strong>를 모아서 … 사전 테스트를 해봤냐라는 걸 가장 중요하게 여긴다」는 맥락에서 이름만 언급(02:05:39–02:06:46). 슬라이드 표현(표본이 커질수록 정규분포에 가까워짐)대로 답할 것.</li>\n<li>🎙 (02:05:39–02:09:13) 수업 첫머리의 <strong>중간고사 점수 분포</strong>를 다시 예로 듦(평균 근처에 몰림; 전사 「평균 근처에 있는 사람들이 빈도가 가장 낮고」는 문맥상 「높고」의 오인식·말실수). 교수가 참여한 <strong>치매 판별 도구 개발</strong>에서 요구된 최소 표본 = <strong>300명</strong>(일반 실험은 40–60명, 100명 넘으면 대형 프로젝트) — 「많으면 많을수록 좋고요」. <strong>K-○○ 검사</strong>(해외 검사의 한국어판)도 번역하면 받아들이는 양상이 같다는 보장이 없어 <strong>한국인 대상으로 표준화를 다시</strong> 거친다.</li>\n</ul>\n<h2>p.46 — 제작 원리 (2): 신뢰도 ⭐⭐⭐</h2>\n<ul>\n<li><strong>신뢰도(Reliability)</strong>: 검사가 <strong>일관된 점수</strong>를 산출하는지의 여부.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>종류</th>\n<th>방법</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>검사-재검사 신뢰도(test-retest)</strong></td>\n<td><strong>동일 검사를 반복</strong> 실시해도 유사한 점수가 나오는지</td>\n</tr>\n<tr>\n<td><strong>반분 신뢰도(split-half)</strong></td>\n<td>검사를 <strong>절반으로 분할</strong>해 <strong>짝수 문항과 홀수 문항</strong> 점수가 일치하는지</td>\n</tr>\n</tbody></table>\n<ul>\n<li>두 점수의 <strong>상관이 높을수록</strong> 신뢰도가 높다.</li>\n<li>슬라이드 괄호: &quot;다른 검사 간 비교 때는 두 검사 간의 상관 점수 활용&quot; — 교과서에서는 이를 <strong>대안 형태(동형 검사) 신뢰도</strong>로 따로 부른다.</li>\n<li>🎙 (02:09:13–02:10:23) 교수: 다른 사람 사이에서도, 같은 사람이 반복 응시해도 점수 차이가 크지 않아야 최소한의 신뢰도. 「검사-재검사 신뢰도 … 반분 신뢰도(전사 &quot;반문 신뢰도&quot;) … 이 두 가지가 모두 갖춰져야 해당 검사가 신뢰도가 있다」.</li>\n</ul>\n<h2>p.47 — 제작 원리 (3): 타당도 ⭐⭐⭐</h2>\n<ul>\n<li><strong>타당도(Validity)</strong>: 검사가 <strong>측정·예측하고자 하는 것</strong>을 실제로 해내고 있는지 여부.</li>\n<li><strong>예측 타당도(predictive validity)</strong>: 검사 점수와 <strong>기준 행동</strong> 사이의 상관을 계산 → 검사 점수가 <strong>실제 행동을 예측</strong>할 수 있는가.</li>\n<li><strong>신뢰도와 타당도는 별개</strong>: 측정하려는 심적 과정과 전혀 무관한 문항으로 구성하면, 점수가 아무리 일관되어도(신뢰도 높음) <strong>타당도는 낮다</strong>. (신뢰도는 타당도의 필요조건이지 충분조건이 아님.)</li>\n<li>⚠️ 슬라이드 표기 &quot;Vailidity&quot;는 <strong>Validity</strong>의 오타.</li>\n<li>🎙 (02:10:23–02:12:24) 타당도 예 = <strong>운동 능력</strong> 검사를 운동과 무관한 문항으로 만들면 타당하지 않다. 신뢰도·타당도를 <strong>모두</strong> 갖춰야 공인된 검사로 쓰인다. 「타당화 연구」「표준화 연구」 제목의 논문이 나왔다는 것 = 그 검사가 쓸 만한 수준이라는 일종의 <strong>보증</strong>.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>헷갈리는 쌍</th>\n<th><strong>신뢰도</strong></th>\n<th><strong>타당도</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>질문</td>\n<td>매번 <strong>같은</strong> 점수가 나오나?</td>\n<td><strong>재려던 것</strong>을 재고 있나?</td>\n</tr>\n<tr>\n<td>예</td>\n<td>체중계가 잴 때마다 같은 값</td>\n<td>체중계로 키를 재면 일관돼도 타당하지 않음</td>\n</tr>\n<tr>\n<td>하위 유형</td>\n<td>검사-재검사, 반분</td>\n<td>예측 타당도</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>🎙 실제 수업 기록 (10/20 화, 녹음본 기준)</h2>\n<p>출처: <code>녹음본/1020.md</code> (Clova Note, 약 2시간 13분, <code>참석자 1 hh:mm:ss</code> 블록). 화자 분리가 흔들려 교수 발언 일부가 <code>참석자 3</code>으로도 잡혀 있다(같은 교수). Clova 오인식은 슬라이드 용어로 고치고 <code>(전사 &quot;…&quot;)</code>에 원문을 남겼다. 시각은 녹음 경과 시간.</p>\n<p><strong>진도: p.1–47 전부(7장 완료).</strong> 00:04–02:40 출석·중간고사 결과 → p.1–22 → 01:10:49 휴식(「지금 3시 48분이니까 4시 5분까지」) → 01:11–01:26 학생 잡담·<strong>마이크 고장</strong> 관련 대화(강의 내용 없음; 01:15:47 「마이크가 좀 상태가…」, 01:22:40 담당자가 오는 데 10–15분) → <strong>01:26:25 p.25 끝부분부터 녹음 재개</strong> → p.26–47 → 02:12:24 전체 정리 → 02:13:24 「오늘 수업은 여기까지」. <strong>녹음에 없는 부분: p.23(언어와 사고), p.24(언어의 구조), p.25 전반</strong> — 휴식 뒤 마이크 문제 구간에 강의된 것으로 보인다.</p>\n<p><strong>📢 공지·운영</strong></p>\n<ul>\n<li><strong>출석</strong>: 시작 시 호명(00:04 「또 호명 안 되신 분 계실까요?」), 휴식 때 「출석 소명 안 된 친구 아직 있으면은 앞으로 나와서 저한테 성함 한 번만」(01:10:49).</li>\n<li><strong>중간고사 결과</strong> (00:12–02:40) ⭐: 채점 완료. 「점수가 굉장히 높게 나오더라고요」 — 분포가 평균 근처에서 가장 높은데 그 기준이 높았다(정규곡선은 오늘 지능 검사에서 다시 다룬다고 예고). <strong>환산 점수 35점 만점 기준 평균 약 27, 중앙값 약 29</strong> — 점수 차가 크지 않아 대부분 비슷한 점수대.</li>\n<li><strong>기말고사 형식</strong> ⭐⭐⭐: 「제 출제 스타일이 어떤지(전사 &quot;취업 스타일&quot;) … 이번 경험을 토대로 삼아서 <strong>기말 때도 동일한 방식으로 진행이 될 거니까</strong>」(01:28–02:40) → 객관식 25 + 단답형 5(명칭 쓰기) 유지로 본다. 중간고사 관련 질문을 받았으나 없었다.</li>\n<li><strong>레포트</strong> (02:13:24): 학기 초에 예고한 레포트 하나 — 「심리학적인 현상에 대한 … 개인 일상이라든가 사회 현상에 대한 심리학적 해석」 — <strong>세부 공지는 다음 주(10/27) 수업</strong>에서.</li>\n<li><strong>마지막 당부</strong> (02:12:24–02:13:24): 지능 검사를 받을 기회가 언젠가 있을 텐데, 알고 받는 것과 모르고 받는 것이 꽤 다르니 그때는 자연스럽게 임해야 더 객관적인 지표가 나온다.</li>\n</ul>\n<p><strong>전반 — p.1–22 (사고)</strong></p>\n<ul>\n<li><strong>[02:40–04:57] p.1 도입.</strong> 오늘은 <strong>사고·언어·지능</strong> 세 가지. 사고는 개념을 떠올리고 의사를 표현하는 활동을 아우르며 그 매개체가 <strong>언어</strong>, 이런 활동을 수행하는 기반 능력이 <strong>지능</strong>. 「오늘 측정 검사도 몇 가지를 다루게 될 건데 그 측정 과정이 어떻게 이루어지는가」.</li>\n<li><strong>[04:57–11:10] p.2 개념·원형.</strong> 개념 = 유사한 대상·사건·아이디어에 대한 <strong>심적 집단</strong>, 「수학적으로 표현하자면 … 집합」. 프로토타입은 흔히 &#39;시제품&#39; 뜻이지만 심리학에서는 집단 내 <strong>가장 전형적인 대표 본보기</strong>. <strong>의자</strong> 예(교재의 공 던지기 대신): 다리 4개·앉는 판·등받이 = 원형, 그러나 빈백·등받이 없는 의자·둥근 판도 의자. 원형이 전체를 설명하지 못하는데도 발달한 이유 = 사고 <strong>단순화</strong>(정보 처리 용량·인지 자원 효율).</li>\n<li><strong>[11:10–15:04] p.3 범주화 지각</strong>(전사 &quot;범주와 지각&quot;). 합성 얼굴(백인/아시아인) 90%·70% 실험 — 70%도 90%와 비슷하게 판단. 고래–포유류: 원형에서 멀수록 경계가 모호. 개념은 빠르고 효율적인 판단을 돕지만 항상 최선의 결론은 아닌 「이중적인 측면」.</li>\n<li><strong>[15:04–19:17] p.4 알고리즘.</strong> 사람은 정확성과 효율성 「두 가지 방식을 모두 채택」, 심리학에서는 둘이 다른 개념. 정확한 사고 = 의식적 노력. 「제가 이공계 전공이 아니다 보니까」 컴퓨터의 알고리즘 정의 대신 심리학 정의(시행착오 최소화하는 단계적 과정): 해결 보장, 자원 소모 큼, 느림. 성냥개비 6개 → 삼각형 4개 = 삼각뿔(전사 &quot;삼각부&quot;), 철자 재배열.</li>\n<li><strong>[19:17–23:45] p.5 통찰.</strong> 아하 경험, 닌텐도(전사 &quot;리텐도&quot;) 「레이튼 교수」. 알고리즘과 대비, 완벽하진 않지만 유용(알고리즘 90% vs 통찰 70–80% 비유). 마음 갖춤새(4장 지각 갖춤새, 전사 &quot;지각 갖춘세&quot;) → <strong>확증 편향</strong>(전사 &quot;확장 편향/확정 편향/확진 편향&quot;)에 취약 → <strong>고착</strong>. 신경 활동: 직전 <strong>전두엽</strong>(고차 인지·주의) 강하게 활성화, 직후 <strong>우반구 측두엽</strong>(전사 &quot;우반로 측두엽&quot;) 급증.</li>\n<li><strong>[23:45–25:19] p.6 발견법.</strong> 판단·문제 해결을 효율적으로 만드는 간단한 사고 방향, 신속하지만 실수 가능성. 1장의 <strong>가용성 어림법</strong>(전사 &quot;가용성 어리법&quot;)이 그 예 — 위험 요인으로 소개했지만 「완전히 틀린 말은 아니에요」. 두 방식은 자유롭게 혼용.</li>\n<li><strong>[25:19–30:14] p.7 대표성 발견법.</strong> 원형과 비교해 어림. 양복·서류 가방 사람 → 영문학과 교수(전사 &quot;명문학과&quot;) vs 트럭 운전수; 미국 연구 교수 400명 vs 운전수 350만 명 → 확률적으로는 운전수가 합리적인데도 과대 추정. 「복식을 보고 우리가 사람을 판단하면 안 된다」고 하지만, 인상에서 속성을 추출해 결론을 내는 것은 자연스러운 기제이며 그 틀에 묶여 있음을 알아 두라.</li>\n<li><strong>[30:14–33:47] p.8 가용성 발견법</strong>(전사 &quot;가연성 발견법&quot;, 33:18 &quot;가연성 어림법&quot; = <strong>가용성</strong>). 1장 「강력한 사례의 가용성」과 함께 소개했던 내용. 선명성·최신성·차별성 → 강력한 기억(전사 &quot;기업&quot;). 범죄 보도 → 치안 과대 추정, 위험·현실 판단 왜곡, <strong>과도한 공포</strong>. 그래도 기억에 기대 생각하는 것은 어쩔 수 없는 자연스러운 특성 → 정확한 사고와 효율적 사고 사이의 「중요한 줄다리기」.</li>\n<li><strong>[33:47–35:20] p.9 대표성 vs 가용성.</strong> 공통 = 사건 가능성 평가, 직관을 활용한 자동적·빠른 사고, <strong>인지적 구두쇠</strong>(전사 &quot;인지적 수정/구두세&quot;)의 산물 — 「여러 번 이제 소개를 했듯이」. 차이 = 원형 비교·제시된 특성에 가장 부합한 대상 연상 vs 기억 접근 용이성·아주 강력한 사례 중심.</li>\n<li><strong>[35:20–41:00] p.10 과신</strong>(전사 &quot;과식/과심&quot;). 「이다음에 나올 내용 상당 부분은 그때 <strong>1장</strong>에서 다뤄졌던 내용들이랑 많이 겹치는」. 성과·역량 과대 추정 → 계획 오류. 주식 중개인·투자 매니저(초 단위 차트). 1장의 <strong>메타인지</strong>가 방지책. 개인을 넘어 국가 단위 = <strong>슐리펜 계획</strong>(프랑스 6개월 항복 → 러시아, 실패, 독일 제국 해체). 실제 역량 범위 안에서 계획을 세우는지 검토하라.</li>\n<li><strong>[41:00–47:07] p.11 신념 집착</strong>(전사 &quot;신경 집착&quot;, 47:07 &quot;10년 직책&quot;). 확증 편향과 거의 같음. 대처 = 반대 의견 고려 — 하지만 「내가 맞을지도 모르는데 왜」라는 생각에 휩싸이기 쉽다. 반대 증거는 평가 절하. 일화: 2019년 미국 학회(교수는 <strong>언어 심리학 전공</strong>이라 언어 세션에 있었고, 동료에게 들은 다른 세션 이야기) — 주의 연구 발표에 반대한 청중에게 「저번 학회에서도 똑같은 질문」, 「나가서 따로 얘기하자」. 주의의 <strong>초기 선택설 vs 후기 선택설</strong> 논쟁. 반대 결과는 상대의 실험 설계 입장에서 이해하라; 교수 자신도 실험 결과가 가설·기존 이론과 잘 맞지 않았던 경험이 많다.</li>\n<li><strong>[47:07–53:21] p.12–13 틀만들기</strong>(프레이밍). 1장 사회조사의 <strong>말 표현 효과</strong>와 연결, 마음 갖춤새를 형성해 사고를 유도. 응용 3가지: <strong>기부</strong>(금전 보상 + 도덕적 질문), <strong>장기 기증</strong>(교수도 「이번에 조사하면서 알게」 — 기본 응답이 동의인 국가 vs 거부를 밝혀야 하는 국가; 「사람들이 의사결정을 잘 안 바꾼다」), <strong>술잔 크기</strong>(잔 수로 음주량을 추산). 「세 가지 예시」로 정리. 언론의 프레임 → 여러 정보 원천을 종합해 검토할 필요.</li>\n<li><strong>[53:21–56:14] p.14 창의성.</strong> 틀을 깰 수 있게 하는 능력 = 새롭고 가치 있는 아이디어 생성. 페니실린(푸른곰팡이). 타고난 요인만이 아니라 후천적 요인도; 학습 능력 뒷받침 — 아동기 정량적 적성 → 논문·특허(상관일 뿐). 지능만으로는 설명 불가 — 지능 과제와 창의성 과제의 뇌 활동이 다름 = 두 영역이 분리된 부분이 있음.</li>\n<li><strong>[56:14–01:01:05] p.15 확산적 vs 수렴적 사고.</strong> 확산 = 창의성에 부합, 다양성 추구; <strong>전두엽 손상 시 수렴은 유지되나 확산은 잘 나타나지 않음</strong>. 수렴(전사 &quot;수용적/수렵적&quot;) = 하나의 결론, 대부분의 <strong>적성 검사</strong>. 연구자에게는 둘 다 필요 — 박사논문 실험 3개 → 심사 교수 「큰 이야기 하나 … 한 문장」, 「너만의 모형」.</li>\n<li><strong>[01:01:05–01:07:21] p.16–18 창의성 5요소.</strong> 전문성(선행 문헌 탐색), 상상력 사고 기술(관점 변화), 모험지향적 성격(전사 &quot;모범 지향적&quot;), <strong>내재적 동기</strong>(외재적 동기와 대비, 즐거움·자아 실현감 — 「즐기는 사람은 이기기 어렵다」; 동기는 추후 수업에서 다룰 예정), 창의적 환경(앞의 4개는 개인 요인, 환경은 외부 요인 — 공동 연구·토론·지도, 논문 초고 동료 검토 일화, 첫 수업의 「대인관계에 우선권」 조언).</li>\n<li><strong>[01:07:21–01:09:12] p.19–20 함양법.</strong> 전문성 발달; <strong>부화시간</strong>(전사 &quot;부하 시간&quot;) = 고착 방지, 하룻밤 자고 다시 보기, 무의식적 처리로 조직화·연합(전사 &quot;영업&quot;); <strong>명상·산책</strong> = 인지 자원(전사 &quot;인지 저항&quot;) 회복 후 다시 몰두; 다른 관점 경험.</li>\n<li><strong>[01:09:12–01:10:49] p.21–22 비교표.</strong> 알고리즘·발견법·통찰·직관 = 정확 vs 효율, 틀만들기·창의성 = 사고에 영향을 주는 방향, p.22 = 왜곡 요인. 사고에 영향을 주는 요인과 전략은 「다각화」되어 있다. → 휴식.</li>\n</ul>\n<p><strong>후반 — p.25 끝–47 (언어·지능)</strong> (p.23–24·p.25 전반은 녹음 없음)</p>\n<ul>\n<li><strong>[01:26:25–01:27:40] p.25 끝 + p.26 수용성 언어.</strong> 핀란드–한국 문법 유사성 → 문법을 학습할 소양을 타고남. 언어 획득은 크게 <strong>수용성 → 표현성</strong> 두 단계. 수용성 = 말한 것을 이해하는 초기 단계, 말은 못 해도 말소리 인식, 입술 모양으로 소리 구분 — 4장 <strong>맥거크 효과</strong>(전사 &quot;메커트 효과&quot;).</li>\n<li><strong>[01:27:40–01:29:37] p.27 표현성 언어.</strong> 옹알이(전사 &quot;동아리&quot;) <strong>4개월</strong>, 언어와 무관한 소리, 어른 말 모방과 다름 → 한 단어 <strong>12개월</strong>(「마마」) → 두 단어 <strong>24개월</strong>(전사 「명사 플러스 명사」 — 슬라이드는 명사+동사) → 이후(전사 &quot;전투 사러 단계&quot; = 두 단어 단계 이후) 문장 구성 능력 급속 발전.</li>\n<li><strong>[01:29:37–01:31:59] p.28 결정적 시기</strong>(크리티컬 피리어드) <strong>~7세</strong>. 해외 입양아, 한국 출생 후 미국 이주 사례, <strong>이중언어 화자</strong>(동시 노출 = 동시 이중언어 화자). 결정적 시기 이후 학습 → 러시아·독일식 영어 억양. 영어 유치원 조기 입학 과열.</li>\n<li><strong>[01:31:59–01:34:39] p.29 브로카·베르니케</strong>(전사 &quot;그로파/프로파&quot;, &quot;베르키/베르케&quot;). 브로카 = 산출, 베르니케 = 이해. 「<strong>중요한 거는</strong>」 브로카 실어증은 문장이 어눌해도 의도는 이해 가능 = 가장 큰 특징. 「둘 다 좌반구 … 왼쪽 측두엽 쪽」 발언(교과서: 브로카 = 좌 전두엽). 베르니케 실어증 영상 언  — 전사 「명사 플러스 명사」 vs 슬라이드 <strong>명사+동사</strong> → 슬라이드 우선.</li>\n<li>p.29 브로카 위치 — 교수 「둘 다 … 왼쪽 측두엽」 vs 교과서 <strong>브로카 = 좌 전두엽</strong> → 교과서 우선, &quot;좌반구&quot;는 확실.</li>\n<li>p.36 운동선수 훈련 — 전사 「30시간」 = 슬라이드 <strong>3천 시간</strong>의 오인식.</li>\n<li>p.45 — 전사 「평균 근처 … 빈도가 가장 낮고」 = 문맥상 「높고」.</li>\n<li>p.42 스탠퍼드-비네의 문제점(「다소 ○○을 지지하는 측면」) — 판독 불가.</li>\n</ul>\n<hr>\n<h2>명칭 암기표 (설명 → 명칭)</h2>\n<table>\n<thead>\n<tr>\n<th>설명</th>\n<th>명칭</th>\n<th>슬라이드</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>유사한 대상·사건·아이디어에 대한 심적 집단</td>\n<td>개념 (concept)</td>\n<td>2</td>\n</tr>\n<tr>\n<td>어떤 개념의 최선의 본보기</td>\n<td>원형 (prototype)</td>\n<td>2</td>\n</tr>\n<tr>\n<td>입력된 데이터를 범주로 분리하려는 선천적 편향</td>\n<td>범주화 지각 (categorical perception)</td>\n<td>3</td>\n</tr>\n<tr>\n<td>범주 내 원형으로 개념을 형성한다고 본 학자</td>\n<td>로시 (Rosch, 1978)</td>\n<td>3</td>\n</tr>\n<tr>\n<td>시행착오를 최소화하는 단계적 절차, 해결 보장·느림</td>\n<td>알고리즘 (algorithm)</td>\n<td>4</td>\n</tr>\n<tr>\n<td>문제의 해결책을 갑작스레 깨닫는 현상</td>\n<td>통찰 (insight)</td>\n<td>5</td>\n</tr>\n<tr>\n<td>자기 생각을 지지하는 증거만 찾는 경향</td>\n<td>확증 편향 (confirmation bias)</td>\n<td>5, 22</td>\n</tr>\n<tr>\n<td>새로운 각도에서 문제를 보는 능력의 결여</td>\n<td>고착 (fixation)</td>\n<td>5, 22</td>\n</tr>\n<tr>\n<td>과거에 통한 방식으로만 접근하려는 경향</td>\n<td>마음 갖춤새 (mental set)</td>\n<td>5, 12</td>\n</tr>\n<tr>\n<td>판단을 효율적으로 만드는 간단한 사고 방략 (어림법·추단법)</td>\n<td>발견법 (heuristics)</td>\n<td>6</td>\n</tr>\n<tr>\n<td>원형과 비교해 가능성을 어림 (기저율 무시)</td>\n<td>대표성 발견법 (representative heuristic)</td>\n<td>7</td>\n</tr>\n<tr>\n<td>기억에서 쉽게 떠오를수록 가능성을 높게 추정</td>\n<td>가용성 발견법 (availability heuristic)</td>\n<td>8</td>\n</tr>\n<tr>\n<td>효율을 추구해 직관적 지름길을 쓰는 인간</td>\n<td>인지적 구두쇠 (cognitive miser)</td>\n<td>9</td>\n</tr>\n<tr>\n<td>자신의 성과·판단을 과대 추정</td>\n<td>과신 (overconfidence)</td>\n<td>10</td>\n</tr>\n<tr>\n<td>과신이 일정 계획에서 나타난 것</td>\n<td>계획 오류 (planning fallacy)</td>\n<td>10</td>\n</tr>\n<tr>\n<td>자기 인지에 대한 인지</td>\n<td>메타인지 (metacognition)</td>\n<td>10</td>\n</tr>\n<tr>\n<td>근거가 틀렸다고 판명돼도 생각에 매달림</td>\n<td>신념 집착 (belief perseverance)</td>\n<td>11</td>\n</tr>\n<tr>\n<td>논제를 제기하는 방식에 따라 결정이 달라짐</td>\n<td>틀만들기 (framing)</td>\n<td>12</td>\n</tr>\n<tr>\n<td>틀만들기로 특정 방향의 선택을 유도하기</td>\n<td>넛지 (nudge)</td>\n<td>12</td>\n</tr>\n<tr>\n<td>빠르고 자동적인 감정과 사고</td>\n<td>직관 (intuition)</td>\n<td>21</td>\n</tr>\n<tr>\n<td>새롭고 가치 있는 아이디어를 생성하는 능력</td>\n<td>창의성 (creativity)</td>\n<td>14</td>\n</tr>\n<tr>\n<td>다양한 해결책을 추구하는 사고 (전두엽 손상 시 손상)</td>\n<td>확산적 사고 (divergent thinking)</td>\n<td>15</td>\n</tr>\n<tr>\n<td>최선의 해결책 하나를 결정 (적성검사가 요구)</td>\n<td>수렴적 사고 (convergent thinking)</td>\n<td>15</td>\n</tr>\n<tr>\n<td>창의성 5요소를 제안한 학자</td>\n<td>스턴버그 &amp; 루바트 (Sternberg &amp; Lubart)</td>\n<td>16</td>\n</tr>\n<tr>\n<td>흥미·즐거움에 기반한 추진력</td>\n<td>내재적 동기 (intrinsic motivation)</td>\n<td>16, 18</td>\n</tr>\n<tr>\n<td>문제에서 잠시 떨어져 무의식적 처리를 기다리는 시간</td>\n<td>부화시간 (incubation)</td>\n<td>19</td>\n</tr>\n<tr>\n<td>소리를 구분하는 최소 단위</td>\n<td>음소 (phoneme)</td>\n<td>24</td>\n</tr>\n<tr>\n<td>의미를 구성하는 최소 단위</td>\n<td>형태소 (morpheme)</td>\n<td>24</td>\n</tr>\n<tr>\n<td>단어를 조직화해 소통하게 하는 규칙 시스템</td>\n<td>문법 (grammar)</td>\n<td>24</td>\n</tr>\n<tr>\n<td>소리에서 의미를 도출하는 규칙</td>\n<td>의미론 (semantics)</td>\n<td>24</td>\n</tr>\n<tr>\n<td>단어 배열로 문장을 구성하는 규칙</td>\n<td>통사론 (syntax)</td>\n<td>24</td>\n</tr>\n<tr>\n<td>제한된 기호 조합으로 무한한 메시지 생성</td>\n<td>언어의 생산성 (generativity)</td>\n<td>24</td>\n</tr>\n<tr>\n<td>언어마다 보편적 통사 규칙이 있고 이를 배울 소양을 타고남</td>\n<td>보편 문법 (촘스키)</td>\n<td>25</td>\n</tr>\n<tr>\n<td>말한 것을 이해하는 능력 (먼저 발달)</td>\n<td>수용성 언어 (receptive language)</td>\n<td>26</td>\n</tr>\n<tr>\n<td>말을 할 수 있는 능력</td>\n<td>표현성 언어 (productive language)</td>\n<td>27</td>\n</tr>\n<tr>\n<td>4개월경, 언어와 무관한 소리 (모방 아님)</td>\n<td>옹알이 단계 (babbling stage)</td>\n<td>27</td>\n</tr>\n<tr>\n<td>24개월경, 명사+동사 두 단어 문장</td>\n<td>두 단어 단계 (two-word stage)</td>\n<td>27</td>\n</tr>\n<tr>\n<td>언어 학습 효율이 가장 좋은 기간 (~7세)</td>\n<td>결정적 시기 (= 민감 시기, critical period)</td>\n<td>28</td>\n</tr>\n<tr>\n<td>언어 표현(산출) 담당, 손상 시 문장 발화 불가</td>\n<td>브로카 영역 (Broca&#39;s area)</td>\n<td>29</td>\n</tr>\n<tr>\n<td>언어 이해 담당, 손상 시 말은 유창하나 내용 와해</td>\n<td>베르니케 영역 (Wernicke&#39;s area)</td>\n<td>29</td>\n</tr>\n<tr>\n<td>언어가 사고를 결정한다</td>\n<td>언어결정론 (= 사피어-워프 가설)</td>\n<td>30</td>\n</tr>\n<tr>\n<td>언어가 사고에 영향을 준다 (결정론의 약화판)</td>\n<td>언어상대성 (linguistic relativity)</td>\n<td>30</td>\n</tr>\n<tr>\n<td>지능을 단일 지표 g로, 요인 분석으로 산출</td>\n<td>일반 지능 (g 요인) / 스피어만</td>\n<td>32</td>\n</tr>\n<tr>\n<td>상관된 문항 군집을 찾는 통계 기법</td>\n<td>요인 분석 (factor analysis)</td>\n<td>32</td>\n</tr>\n<tr>\n<td>지능을 7가지 1차 능력으로 분류</td>\n<td>1차 심적 능력 / 서스톤</td>\n<td>33</td>\n</tr>\n<tr>\n<td>지능은 독립적인 8개 영역</td>\n<td>다중 지능 이론 / 가드너</td>\n<td>34</td>\n</tr>\n<tr>\n<td>전반적 지능은 낮으나 특정 영역에서 탁월</td>\n<td>현자 증후군 (savant syndrome)</td>\n<td>34</td>\n</tr>\n<tr>\n<td>분석·창의성·현실 지능의 3영역</td>\n<td>삼원 이론 / 스턴버그</td>\n<td>35</td>\n</tr>\n<tr>\n<td>사회 상황 이해와 자기 관리의 노하우</td>\n<td>사회 지능 / 손다이크(1920)</td>\n<td>37</td>\n</tr>\n<tr>\n<td>정서를 지각·이해·관리·사용하는 능력</td>\n<td>정서 지능 (emotional intelligence)</td>\n<td>37</td>\n</tr>\n<tr>\n<td>개인의 심적 적성을 평가하는 도구</td>\n<td>지능 검사</td>\n<td>40</td>\n</tr>\n<tr>\n<td>이미 학습한 내용을 평가</td>\n<td>성취 검사 (achievement test)</td>\n<td>40</td>\n</tr>\n<tr>\n<td>미래 성취를 예측</td>\n<td>적성 검사 (aptitude test)</td>\n<td>40</td>\n</tr>\n<tr>\n<td>신체 측정으로 지능을 재려다 실패한 학자</td>\n<td>프랜시스 골턴</td>\n<td>41</td>\n</tr>\n<tr>\n<td>정신 연령으로 아동 학업 성취를 예측, 생득 지능 측정 목표 아님</td>\n<td>알프레드 비네</td>\n<td>41</td>\n</tr>\n<tr>\n<td>낮은 점수 아동의 주의·자기훈련 능력 훈련</td>\n<td>심적 정형술 (mental orthopedics)</td>\n<td>41</td>\n</tr>\n<tr>\n<td>비네 검사를 개편, 생득적 지능 측정 가능 가정</td>\n<td>스탠퍼드-비네 검사 / 루이스 터먼</td>\n<td>42</td>\n</tr>\n<tr>\n<td>정신 연령 ÷ 생활 연령 × 100 공식을 제안</td>\n<td>윌리엄 스턴 (IQ)</td>\n<td>42</td>\n</tr>\n<tr>\n<td>15개 하위 검사, 전체+하위 점수 제공</td>\n<td>웩슬러 성인용 지능 검사 (WAIS)</td>\n<td>43</td>\n</tr>\n<tr>\n<td>표준화 집단과 비교해 점수 의미를 정의</td>\n<td>표준화 (standardization)</td>\n<td>44</td>\n</tr>\n<tr>\n<td>평균 근처에 몰리고 극단으로 갈수록 적은 종 모양 분포</td>\n<td>정규곡선 (normal curve)</td>\n<td>45</td>\n</tr>\n<tr>\n<td>검사가 일관된 점수를 내는 정도</td>\n<td>신뢰도 (reliability)</td>\n<td>46</td>\n</tr>\n<tr>\n<td>같은 검사를 반복 실시해 점수 비교</td>\n<td>검사-재검사 신뢰도</td>\n<td>46</td>\n</tr>\n<tr>\n<td>짝수/홀수 문항 점수 비교</td>\n<td>반분 신뢰도 (split-half)</td>\n<td>46</td>\n</tr>\n<tr>\n<td>측정하려는 것을 실제로 재는 정도</td>\n<td>타당도 (validity)</td>\n<td>47</td>\n</tr>\n<tr>\n<td>검사 점수가 기준 행동을 예측하는 정도</td>\n<td>예측 타당도 (predictive validity)</td>\n<td>47</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>시험 대비 핵심 요약</h2>\n<ol start=\"0\">\n<li>🎙 <strong>기말 = 중간과 「동일한 방식」</strong>(객관식 25 + 단답형 5 명칭 쓰기, 10/20). 교수가 반복한 것 = <strong>지능 5입장 표(p.39)</strong>, <strong>서스톤 = 중간 입장</strong>, 정확한 사고 vs 효율적 사고. 1장(가용성·과신·메타인지·말 표현 효과)과 겹친다고 직접 말했으니 1장 해당 부분도 같이 볼 것.</li>\n<li><strong>개념</strong> = 심적 집단, <strong>원형</strong> = 최선의 본보기(Rosch). <strong>범주화 지각</strong>: 범주로 나누려는 선천적 편향, 원형에서 멀수록 경계 모호(고래·토마토).</li>\n<li>문제 해결 전략: <strong>알고리즘</strong>(보장·느림·자원 소모 큼) / <strong>발견법</strong>(빠름·오류 위험, 어림법·추단법) / <strong>통찰</strong>(갑작스러운 깨달음; 직전 전두엽, 직후 <strong>우반구 측두엽</strong>, Kounios &amp; Beeman).</li>\n<li>장애물: <strong>확증 편향</strong>(지지 증거만 수집), <strong>고착</strong>(새 관점 결여, 마음 갖춤새).</li>\n<li><strong>대표성 발견법</strong>(원형과 비교, 기저율 무시 — 영문학 교수 400 vs 트럭 운전수 350만) vs <strong>가용성 발견법</strong>(떠올리기 쉬운 정도 — 선명성·최신성·차별성, 과도한 공포). 둘 다 <strong>인지적 구두쇠</strong>의 산물.</li>\n<li><strong>과신</strong>(계획 오류, 주식 중개인, 메타인지, 슐리펜 계획), <strong>신념 집착</strong>(반박돼도 유지; 대처 = 반대편 주장 고려), <strong>틀만들기</strong>(질문 방식 → 결정 변화, 넛지; 기부·장기 기증 기본값·작은 술잔).</li>\n<li>창의성 = 새롭고 가치 있는 아이디어. 지능만으론 설명 불가. <strong>확산적</strong>(다양성, 전두엽 손상 시 손상) vs <strong>수렴적</strong>(최선 하나, 적성검사).</li>\n<li>창의성 5요소(<strong>Sternberg &amp; Lubart</strong>): 전문성·상상력 사고 기술·모험지향적 성격·<strong>내재적 동기</strong>·창의적 환경. 함양법: 전문성 발달, <strong>부화시간</strong>, 명상·산책, 다른 문화 경험.</li>\n<li>p.21–22 표의 <strong>장점/단점 칸</strong>까지 외울 것 — 통찰 단점 &quot;발생하지 않을 수 있음&quot;, 창의성 단점 &quot;관례적 작업의 방해&quot;, 과신 장점 &quot;쉽고 행복한 결정&quot;, <strong>직관</strong> = 빠르고 자동적인 감정과 사고.</li>\n<li>언어 구조: <strong>음소</strong>(소리 최소 단위) · <strong>형태소</strong>(의미 최소 단위) · <strong>문법</strong>(의미론 + 통사론). <strong>생산성</strong> = 유한 기호로 무한 메시지. (이 부분 수업은 녹음 없음 — 슬라이드 기준.)</li>\n<li><strong>보편 문법(촘스키)</strong>: 문법 자체가 아니라 <strong>배울 소양</strong>을 타고남. 비판 — 실제 언어는 더 다양(Bergen).</li>\n<li>언어 발달: <strong>수용성</strong>(이해, 먼저) → <strong>표현성</strong>: 옹알이 4개월(모방 아님) → 한 단어 12개월 → 두 단어 24개월(명사+동사). <strong>결정적 시기 ~7세</strong>, 신경 가소성, 성인 학습 시 억양.</li>\n<li><strong>브로카</strong>(산출, 끊기는 말 — 🎙 교수가 「중요」: 말은 어눌해도 <strong>의도는 이해 가능</strong>) vs <strong>베르니케</strong>(이해, 유창하나 무의미). 동일 숙달 이중언어 → 동일 영역, 성인 학습 → 영역 분할.</li>\n<li><strong>언어결정론(사피어-워프)</strong> = 언어가 사고 결정(너무 극단적) vs <strong>언어상대성</strong> = 영향(영어 자기중심/일본어 대인관계 정서 어휘, 이중언어 화자 자기 개념, 몽골·중국/러시아·영어 색 지각). 언어와 사고는 <strong>양방향</strong>.</li>\n<li>지능 이론 숫자: <strong>스피어만 g(1, 요인 분석)</strong> · <strong>스턴버그 3(분석·창의·현실)</strong> · <strong>정서 지능 4(지각·이해·관리·사용)</strong> · <strong>서스톤 7(상관 있음 → g 인정, 🎙 중간 입장)</strong> · <strong>가드너 8(독립, 근거 = 이중 해리, 현자 증후군)</strong>. 사회 지능 = <strong>손다이크</strong>.</li>\n<li>각 이론의 비판: g — 단일 지표로 못 묶음 / 가드너 — 모든 능력을 지능이라 할 필요 없음 / 스턴버그 — 세 영역이 독립적이지 않을 수 있음 / 정서 지능 — 지능 개념 과잉 확대(Waterhouse).</li>\n<li>g의 영향: 직업 성취·소득(상관 약 0.3)·박사학위 예측. 단, <strong>투지와 훈련</strong>(운동선수 3천 시간) 필요.</li>\n<li>검사 종류: <strong>지능</strong>(심적 적성) / <strong>성취</strong>(과거 학습, 예: 중간고사) / <strong>적성</strong>(미래 예측). IQ–SAT 상관 0.82.</li>\n<li>검사 역사: <strong>골턴</strong>(신체 측정, 실패) → <strong>비네</strong>(정신 연령, 학업 예측, 생득 지능 측정 목표 X, 심적 정형술) → <strong>터먼</strong>(스탠퍼드-비네, 생득 지능 가정) → <strong>스턴</strong>(IQ = 정신 연령/생활 연령 × 100, 성인 부적합) → <strong>웩슬러 WAIS</strong>(15 하위 검사, 전체+하위 점수).</li>\n<li>검사 제작 3원리: <strong>표준화</strong>(표준화 집단과 비교, 정규곡선, 🎙 충분한 표본 수가 가장 중요) · <strong>신뢰도</strong>(일관성: 검사-재검사, 반분) · <strong>타당도</strong>(재려는 것을 재는가: 예측 타당도). 신뢰도 높아도 타당도 낮을 수 있음.</li>\n<li>헷갈리는 쌍<ul>\n<li>알고리즘(보장·느림) vs 발견법(빠름·오류)</li>\n<li>대표성(원형 비교) vs 가용성(떠올리기 쉬움)</li>\n<li>확증 편향(증거 수집 단계) vs 신념 집착(반박 후에도 유지)</li>\n<li>확산적(다양성) vs 수렴적(최선 하나)</li>\n<li>수용성(이해) vs 표현성(산출)</li>\n<li>브로카(산출) vs 베르니케(이해)</li>\n<li>언어결정론(결정) vs 언어상대성(영향)</li>\n<li>서스톤(7, 상관 있음) vs 가드너(8, 독립)</li>\n<li>비네(생득 지능 측정 목표 아님) vs 터먼(생득 지능 가정)</li>\n<li>성취 검사(과거) vs 적성 검사(미래)</li>\n<li>신뢰도(일관성) vs 타당도(정확성)</li>\n</ul>\n</li>\n</ol>\n","len":43201},{"id":"ch8note","title":"8장 동기와 정서 — 페이지별 해설","desc":"p.1–42 + 🎙 10/27(앞 16분) + 명칭 암기표","ch":"ch8","min":80,"html":"<h1>8장 — 동기와 정서 페이지별 해설</h1>\n<p>심리학으로의 여행 (Prof. 이소영) · 마이어스 심리학 개론 13판</p>\n<p>8장의 핵심 질문은 두 가지다. ① &quot;무엇이 행동을 일으키고 방향을 정하는가(동기)&quot; — 본능 → 추동 감소 → 각성 → 욕구 위계라는 고전 이론과, 배고픔(생리 vs 심리·사회문화)·소속 욕구·성취 동기라는 구체적 동기. ② &quot;정서는 몸과 생각 중 무엇이 먼저인가(정서)&quot; — 제임스-랑게 / 캐넌-바드 / 샥터-싱어 2요인 / 자이언스·르두·라자루스의 네 입장, 정서의 신경 회로(윗길·아랫길), 정서의 표현·탐지(에크만 보편 정서), 정서 경험(얼굴 피드백, 분노, 행복, 긍정심리학, 돈과 행복). 이론 이름 ↔ 핵심 주장 짝짓기가 이 장 시험의 중심이 될 가능성이 크다. <strong>p.8(고전 동기 이론 요약표)과 p.33(정서 이론 요약표)</strong> 은 교수가 직접 정리해 둔 표이므로 ⭐⭐⭐.</p>\n<p>페이지 번호 = 슬라이드 번호 (총 42장, 숨김 슬라이드 없음). 이미지 슬라이드의 그림 내용은 텍스트로 추출되지 않아, 캡션(&quot;<del>의 예시&quot;, &quot;</del> 도식&quot;)만 적어 둔다. <strong>10/27 수업 녹음은 앞 16분뿐</strong>(<code>기말고사/녹음본/1027_심리_whisper.txt</code>): 00:00–09:15는 레포트 과제 설명, 09:15–16:07이 8장 도입(p.1–2 본능까지). 그 뒤 진도는 녹음이 없어 확인 불가 — 11/3 수업 시작 쪽으로 확정할 것. 교수 설명은 <code>🎙 실제 수업 기록</code> 절.</p>\n<p>시험은 중간고사와 같은 형식(객관식 25 + 단답형 5, 명칭 쓰기)일 가능성이 높으므로 굵게 표시한 <strong>명칭</strong>과 끝의 명칭 암기표를 특히 챙길 것. 슬라이드 오타·의심 지점은 ⚠️ 로 표시했다(정답으로 외우지 말 것).</p>\n<hr>\n<h2>0. 앞 장과의 연결</h2>\n<table>\n<thead>\n<tr>\n<th>앞 장에서 배운 것</th>\n<th>8장에서 쓰이는 곳</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>2장 <strong>시상하부</strong>(항상성·섭식·체온 조절), 자율신경계(교감=Fight or Flight)</td>\n<td>p.3 항상성, p.11–14 배고픔의 뇌 기제, p.38 분노</td>\n</tr>\n<tr>\n<td>2장 <strong>편도체</strong>(공포·공격성), <strong>도파민</strong>(보상)</td>\n<td>p.4 유인자극과 도파민, p.32 정서의 신경 회로(아랫길)</td>\n</tr>\n<tr>\n<td>서막·1장 <strong>진화심리학</strong>, 선천성 vs 후천성</td>\n<td>p.2 본능과 진화론, p.19 소속 욕구의 진화적 설명, p.42 행복의 선천-후천 상호작용</td>\n</tr>\n<tr>\n<td>1장 <strong>상관 vs 실험</strong>(상관은 인과를 말하지 못함)</td>\n<td>p.25 SNS와 정신건강 — 상관은 약한 정적, 실험은 비일관</td>\n</tr>\n<tr>\n<td>3장 발달(애착, 사회적 유대)</td>\n<td>p.19 사회적 유대와 자녀 보호</td>\n</tr>\n<tr>\n<td>5장 학습: <strong>강화</strong>, <strong>맛 혐오 학습</strong>(Garcia), 내재/외재 보상</td>\n<td>p.4 충동이 강화될수록 추동 강화, p.16 불쾌한 경험 → 음식 혐오, p.27 내재적 vs 외재적 동기</td>\n</tr>\n<tr>\n<td>6장 기억: <strong>기억상실증</strong>(순행성), 편도체와 정서 기억</td>\n<td>p.15 기억상실증 환자의 반복 식사, p.32 공포 회로</td>\n</tr>\n<tr>\n<td>7장 사고: 역치 하 자극, 직관</td>\n<td>p.31 역치 하 점화로 본 &quot;인지 없는 정서&quot;</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>p.1 — 표지</h2>\n<p>8장. 동기와 정서.</p>\n<h2>p.2 — 동기, 정서, 추동: 동기의 정의, 본능과 진화론 ⭐⭐</h2>\n<ul>\n<li><strong>동기(Motivation)</strong>: 행동의 실현을 수반하거나 그 <strong>방향성</strong>을 설정해 주는 욕구.</li>\n<li><strong>본능과 진화론</strong>: 동기의 출처 중 하나로 <strong>본능</strong>을 제안.<ul>\n<li><strong>본능(instinct)</strong>: 한 동물 종에서 <strong>철저하게 패턴화</strong>되어 있으며 <strong>학습하지 않은</strong> 복잡한 행동. 예: 유아의 입(빨기)·손(쥐기) 관련 반사.</li>\n<li>한계: 대부분의 동기를 설명하기 어렵다(행동에 이름만 붙이는 순환 설명이 된다는 비판이 교재 표준 설명). 그러나 <strong>유전적 요인의 영향력</strong>에 대한 가정은 유지되어 <strong>진화심리학의 주요 기제</strong>로 남음.</li>\n<li>🎙 교수 예시(10/27 12:32–15:15): 발달 챕터에서 소개한 신생아 반사 두 가지(3장 정리본 p.6 신생아 반사) — 손에 쥐여 주면 꼭 쥐는 행동, 뺨에 뭔가 닿으면 그쪽으로 고개를 돌리는 행동(교재 명칭: 쥐기 반사·젖찾기 반사 — 교수는 이름을 말하지 않음). 의식적 판단 없이 나오는 행동이라 본능의 대표 예. 해석: 시각이 미숙한 신생아가 부모 보호를 받으려면 &quot;닿은 것을 안 놓는&quot; 것이 확률적으로 유리 → 진화적으로 전해졌다는 설명.</li>\n</ul>\n</li>\n<li>그림: &quot;추동 감소 이론 도식&quot;(p.2–4 공통 이미지).</li>\n</ul>\n<h2>p.3 — 추동(Drive)과 추동 감소 이론, 항상성 ⭐⭐⭐</h2>\n<ul>\n<li><strong>추동(Drive)</strong>: <strong>생리적 욕구</strong>를 충족시키기 위한 행동을 동기화하는 <strong>긴장 상태</strong>.</li>\n<li><strong>추동 감소 이론(drive-reduction theory)</strong>: 생리적 욕구가 유기체로 하여금 그 욕구를 충족(감소)시키려는 추동을 생성한다.<ul>\n<li>생리적 욕구 증가 → 심리적 추동 증가.</li>\n<li>흐름: 욕구(예: 음식 결핍) → 추동(배고픔) → 추동 감소 행동(먹기).</li>\n</ul>\n</li>\n<li><strong>항상성(Homeostasis)</strong>: <strong>일정한 내적 상태를 유지하려는 경향성</strong>. 추동 감소는 항상성을 유지하는 핵심 기제.<ul>\n<li><strong>피드백 루프</strong>를 통해 내적 상태를 조절(교재 비유: 온도조절기).</li>\n</ul>\n</li>\n<li>⚠️ 슬라이드 &quot;총족(감소)&quot; = <strong>충족</strong>의 오타.</li>\n</ul>\n<h2>p.4 — 유인자극(Incentive): 생리 × 환경의 상호작용 ⭐⭐⭐</h2>\n<ul>\n<li>추동은 <strong>유인자극(Incentive)</strong> 을 통해서도 행동을 동기화한다.<ul>\n<li><strong>유인자극</strong>: 사람의 행동을 이끌어 낼 수 있는 <strong>모든 유형(긍정/부정)의 자극</strong>. <strong>환경의 영향</strong>을 받는다.</li>\n<li>긍정적 자극은 <strong>도파민</strong> 수준 증가를 통해 기저의 충동을 표면화(Hamid et al., 2016).</li>\n<li>충동이 만족되고 <strong>강화</strong>될수록 추동도 점점 강화(5장 강화와 연결).</li>\n</ul>\n</li>\n<li><strong>욕구(push)와 유인자극(pull)이 동시에 존재하면 추동이 더 강화</strong>된다. 예: 배가 고픈데(욕구) 눈앞에 좋아하는 음식 냄새(유인자극).</li>\n<li>결론: 동기는 <strong>생리적 요인(욕구)과 환경적 요인(유인자극)의 상호작용</strong>에 의한 메커니즘.</li>\n</ul>\n<h2>p.5 — 각성 이론 (1) ⭐⭐⭐</h2>\n<ul>\n<li><strong>각성 이론(arousal theory)</strong>: 추동 감소 이론과 <strong>대비</strong>.<ul>\n<li>추동 감소 = 항상성 유지를 위해 주로 각성을 <strong>감소</strong>시키는 방향.</li>\n<li>그러나 <strong>각성의 증진</strong>을 통해서도 행동의 동기가 만들어질 수 있음 → 호기심·탐험 행동 설명.</li>\n</ul>\n</li>\n<li>높은 각성 상태를 즐기는 사람은 자극적인 취향을 지닐 가능성이 높다(<strong>Zuckerman, 2009</strong> — 감각 추구 성향 연구). 모험적 성향을 통한 <strong>탐험 행동</strong>이 나타나는 이유.</li>\n<li>그림: &quot;여키스-닷슨 법칙(Yerkes-Dodson, 1908)&quot; 그래프.</li>\n</ul>\n<h2>p.6 — 각성 이론 (2): 최적 각성 수준, 여키스-닷슨 법칙 ⭐⭐⭐</h2>\n<ul>\n<li>동기의 목표 = <strong>최적의 각성 수준</strong> 찾기.<ul>\n<li>생물학적 욕구가 충족되면 <strong>다른 자극을 경험하려는 추동</strong>이 발생(지루함 회피).</li>\n<li>무조건적인 각성의 감소 혹은 증가만이 동기로 귀결되지는 않는다.</li>\n</ul>\n</li>\n<li><strong>여키스-닷슨 법칙(Yerkes-Dodson law, 1908)</strong>: <strong>적당한 각성이 최적의 수행</strong>을 유도(역U자형 관계).<ul>\n<li><strong>어려운 과제는 오히려 낮은 각성</strong>에서 수행이 높다(Hembree, 1988 — 시험 불안 연구). 쉬운 과제는 상대적으로 높은 각성에서 수행이 좋다(교재 표준).</li>\n</ul>\n</li>\n<li>흔히 &quot;도파민을 채우고 싶다&quot;고 말하는 것들은 즐거움을 통해 최적의 각성 상태를 찾아가는 것과 유사.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>이론</th>\n<th>각성의 방향</th>\n<th>설명하는 행동</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>추동 감소 이론</td>\n<td>각성(긴장)을 <strong>낮추는</strong> 쪽</td>\n<td>배고프면 먹기, 목마르면 마시기</td>\n</tr>\n<tr>\n<td>각성 이론</td>\n<td><strong>최적 수준</strong>으로 — 필요하면 <strong>높이기</strong>도</td>\n<td>호기심, 탐험, 자극 추구</td>\n</tr>\n</tbody></table>\n<h2>p.7 — 매슬로우의 욕구 위계 ⭐⭐⭐</h2>\n<ul>\n<li><strong>욕구 위계(Hierarchy of Needs, Maslow, 1970)</strong>: 다양한 유형의 욕구를 위계로 배열.<ul>\n<li><strong>하위 차원의 욕구가 상위 차원보다 우선</strong> 순위를 지님.</li>\n<li>하위 욕구가 <strong>미충족 시 다음 단계로 이어지지 않음</strong>.</li>\n</ul>\n</li>\n<li>교재 표준 단계(그림 내용은 슬라이드에서 추출되지 않음 — 교재 기준): <strong>생리적 욕구 → 안전 욕구 → 소속과 사랑 욕구 → 존중 욕구 → 자기실현 욕구</strong>(13판은 꼭대기에 <strong>자기초월</strong>을 덧붙임).</li>\n<li>비판·보완: 위계의 순서는 <strong>보편적으로 고정되어 있지 않다</strong> — 개인의 가치관 혹은 사회문화적 환경에 따라 다를 수 있음.</li>\n<li>개인의 대부분은 삶에 대한 중요한 목표나 의미가 있다고 믿음(Oishi &amp; Diener, 2014). <strong>목적(목표), 의의(가치), 응집력(감성)</strong> 의 조화가 중요.</li>\n</ul>\n<h2>p.8 — 고전적 동기 이론 정리 ⭐⭐⭐ (요약표)</h2>\n<table>\n<thead>\n<tr>\n<th>이론</th>\n<th>핵심 아이디어</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>본능과 진화</strong></td>\n<td>학습하지 않은 <strong>종 특유의 행동</strong>은 <strong>유전적 요인</strong>에 의해 발생</td>\n</tr>\n<tr>\n<td><strong>추동 감소</strong></td>\n<td><strong>생리적 욕구</strong> 충족을 위해 추동을 형성하고 <strong>감소 행동</strong>으로 이어짐. 내적 추진력(push)과 외적 제어(유인, pull)에 반응하는 방식에 초점</td>\n</tr>\n<tr>\n<td><strong>각성</strong></td>\n<td><strong>최적의 각성 수준</strong>을 유지하여 최고의 수행을 이끌어 내도록 동기 형성</td>\n</tr>\n<tr>\n<td><strong>매슬로우의 욕구 위계</strong></td>\n<td>욕구는 여러 차원으로 분류. <strong>생리적 욕구가 가장 하위</strong>, 사회적 욕구가 상위</td>\n</tr>\n</tbody></table>\n<ul>\n<li>시험 포인트: 설명 한 줄을 주고 이론 이름을 쓰게 하거나, &quot;~는 추동 감소 이론으로 설명하기 어렵다(→ 각성 이론)&quot; 형식이 나오기 좋다.</li>\n</ul>\n<h2>p.9 — 생리적 욕구의 강력함: 앤슬 키스의 준기아 연구 ⭐⭐</h2>\n<ul>\n<li>매슬로우 위계에서처럼 생리적 욕구는 <strong>가장 기초적</strong>인 동시에 <strong>강력한 효과</strong>를 반영.</li>\n<li><strong>앤슬 키스(Ancel Keys, 1950)</strong> 의 준기아(semistarvation) 연구: 준 기아 상태의 사람들은<ul>\n<li>성격이 <strong>냉담·무기력</strong>해지고,</li>\n<li><strong>먹는 것과 관련된 요소에만 강박적</strong> 증상, 다른 것에는 무관심.</li>\n</ul>\n</li>\n<li>→ 생리적 욕구가 채워지지 않으면 상위 욕구(사회적 관계 등)가 뒤로 밀린다는 매슬로우 위계의 근거.</li>\n</ul>\n<h2>p.10 — 배고픔의 생리학: 위 수축 ⭐⭐</h2>\n<ul>\n<li>배고픔은 생리적 욕구라 생리적 요인의 비중이 높다.</li>\n<li><strong>위의 수축</strong>이 발생할 때마다 배고픔 반응이 나타남(<strong>Cannon, 1929</strong>). 그림: <strong>Cannon &amp; Washburn(1912)의 위 수축 실험</strong> — 풍선을 삼켜 위 수축을 기록하면서 배고픔을 느낄 때 버튼을 누르게 함(교재 표준 설명).</li>\n<li>그러나 &quot;생리적 요인(위)이 배고픔의 전부인가?&quot; → <strong>위가 제거된 쥐도 지속적으로 배
