   "이론"
  ],
  "body": "'''진화심리학'''(Evolutionary Psychology)은 '''공통적인 생물학적 특성과 진화 과정이 사람들의 보편성에 미친 영향'''을 연구한다. [[선천성-후천성 논제]]의 핵심 논제를 [[행동유전학]]과 나눠 맡는데, 진화심리학은 \"'''왜 우리는 모두 비슷한가'''\"를, 행동유전학은 \"'''왜 우리는 서로 다른가'''\"를 묻는다.\n\n{def}\n'''설명''': 공통적인 생물학적 특성과 진화 과정이 사람들의 보편성에 미친 영향을 연구하는 분야 (서막 p.17)\n'''명칭''': [[진화심리학]] (Evolutionary Psychology)\n{/def}\n\n[[img:L0-17.png|서막 p.17 생물학적 특성과 환경의 상호작용 — 진화심리학(보편성)/행동유전학(차이점)|medium]]\n\n{analogy}\n전 세계 스마트폰은 제조사가 달라도 '''화면·배터리·카메라'''가 있다 — 시장(환경)에서 살아남은 공통 설계다. 진화심리학은 인간 마음의 이런 '''공통 사양'''(문화가 달라도 모두가 기쁨·분노 같은 기본 감정과 미소를 알아보는 것)이 왜 생겼는지를 \"그게 조상의 생존에 유리했으니까\"로 설명한다.\n{/analogy}\n\n== 서막에서의 위치 ==\n* p.17: \"진화심리학/행동유전학의 핵심 논제\" — 전 인류 공통적인 요소(생득-선천적) 쪽 담당\n* p.20: [[에크만의 기본 감정]]이 문화와 무관하게 식별됨 = 선천성의 예시 → 진화심리학적 설명과 맞닿음\n* p.22: 생물학적 [[분석 수준]]의 관련 분야 \"생물, '''진화심리학''', 신경과학\"\n* p.24–25: [[이론적 조망]]의 '''진화론''' — 분노 = 유전자가 분노를 어떻게 촉진시켰는가('''Fight or Flight''' 반응). 연구 질문 \"특질의 자연선택은 어떻게 유전자의 생존을 촉진시키는가?\" 관련 분야 생물·발달·사회\n\n{| class=\"table\"\n! 구분 || 진화심리학 || [[행동유전학]]\n|-\n| 초점 || 공통 생물학적 특성 → '''보편성''' || 상이한 유전자와 환경 → '''차이점(개인차)'''\n|-\n| 질문 || 왜 모두 비슷한가 || 왜 서로 다른가\n|-\n| 예 || 기본 감정, Fight or Flight || 일란성 쌍둥이의 같은 점·다른 점\n|}\n\n{tip}\n교수 설명(🎙 8/25): 진화론 조망에서 '''공포 = 도주(Flight), 분노 = 맞서기(Fight)'''. 둘 다 생존에 유리해서 남은 반응이다.\n{/tip}\n\n{warn}\n\"유전자\"라는 단어만 보고 행동유전학을 고르면 틀린다. '''보편성·공통·진화·자연선택''' → 진화심리학/진화론, '''개인차·차이·유전자와 환경''' → 행동유전학.\n{/warn}\n\n== 관련 문서 ==\n* [[행동유전학]] — 대비 짝\n* [[자연선택]]\n* [[이론적 조망]] · [[선천성-후천성 논제]]\n\n근거: 서막 p.17, p.22, p.25"
 },
 "행동유전학": {
  "title": "행동유전학 (Behavior Genetics)",
  "category": [
   "서막 심리학 이야기",
   "이론"
  ],
  "body": "'''행동유전학'''(Behavior Genetics)은 '''상이한 유전자와 환경으로 인하여 발생하는 차이점'''을 연구한다. 이론적 조망 표(p.25)에서의 연구 질문은 \"'''유전자와 환경은 어떻게 개인차에 영향을 미치는가?'''\" — 이 문장이 bank 객관식의 정답 지문이다.\n\n{def}\n'''설명''': 상이한 유전자와 환경으로 인하여 발생하는 차이점을 연구하는 분야. 주요 연구 질문 \"유전자와 환경은 어떻게 개인차에 영향을 미치는가?\" (서막 p.17, p.25)\n'''명칭''': [[행동유전학]] (Behavior Genetics)\n{/def}\n\n[[img:L0-17.png|서막 p.17 진화심리학/행동유전학의 핵심 논제 — 행동유전학: 상이한 유전자와 환경으로 인하여 발생하는 차이점|medium]]\n\n{analogy}\n같은 레시피(유전자)로 만든 빵 두 개를 서로 다른 오븐(환경)에 굽고, 다른 레시피로 만든 빵을 같은 오븐에 구워 본다. 결과 차이가 레시피 탓인지 오븐 탓인지 나눠 보는 것이 행동유전학이다 — 그리고 사람에게 \"같은 레시피\"를 제공하는 자연 실험이 [[쌍둥이 연구|일란성 쌍둥이]]다.\n{/analogy}\n\n== p.25 조망 카드 ==\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 이론적 조망 || 행동유전학\n|-\n| 주요 연구 질문 || 유전자와 환경은 어떻게 '''개인차'''에 영향을 미치는가?\n|-\n| 관련 하위 분야 || '''성격, 발달, 법'''\n|-\n| 서막 p.17 정의 || 상이한 유전자와 환경으로 인하여 발생하는 '''차이점'''\n|-\n| 교수(🎙 8/25) || 같은 유전자라도 환경에 따라 생기는 차이. 행동유전학·진화론은 발달·법·사회 등 여러 분야에 걸쳐 있다\n|}\n\n== 헷갈리는 짝 ==\n{| class=\"table\"\n! 조망 || 연구 질문 (p.25) || 키워드\n|-\n| '''행동유전학''' || 유전자와 환경은 어떻게 '''개인차'''에 영향을 미치는가? || 차이, 개인차\n|-\n| [[진화심리학|진화론]] || 특질의 '''자연선택'''은 어떻게 유전자의 생존을 촉진시키는가? || 보편성, 종 전체\n|-\n| 정신역동 || 무의식적 추동과 갈등이 어떻게 행동을 유도하는가? || 무의식\n|-\n| 사회문화 || 행동 및 사고가 상황과 문화에 따라 어떻게 달라지는가? || 문화\n|}\n\n{quiz}\n「유전자와 환경은 어떻게 개인차에 영향을 미치는가?」를 주요 연구 질문으로 삼는 이론적 조망은? ① 진화론 ② 정신역동 ③ 사회문화 ④ 행동유전학\n{/quiz}\n{answer}\n'''④ 행동유전학'''. ① 진화론도 \"유전자\"가 들어가지만 개인차가 아니라 '''종 전반의 보편적 특질'''(자연선택)을 다룬다. ③ 사회문화는 \"달라진다\"가 들어가지만 원인이 '''상황과 문화'''다.\n{/answer}\n\n== 관련 문서 ==\n* [[진화심리학]] — 대비 짝\n* [[쌍둥이 연구]] — 행동유전학의 대표 방법\n* [[이론적 조망]] · [[선천성-후천성 논제]]\n\n근거: 서막 p.17, p.25"
 },
 "쌍둥이 연구": {
  "title": "쌍둥이 연구 (일란성·이란성 쌍둥이)",
  "category": [
   "서막 심리학 이야기",
   "연구 방법"
  ],
  "body": "'''쌍둥이 연구'''는 유전 특성이 같은 '''일란성 쌍둥이'''와 그렇지 않은 '''이란성 쌍둥이'''를 비교해 유전(선천성)과 환경(후천성)의 영향을 나눠 보는 방법이다. 슬라이드 결론: 쌍둥이 연구는 대부분 '''선천성, 후천성 모두의 중요성'''을 강조한다.\n\n{def}\n'''설명''': 쌍둥이의 보편성(유전에 의한 선천성)과 차이점(환경·경험에 의한 후천성)을 통해 인간 심리 기제에 대한 시사점을 얻는 연구 — 대부분 선천성·후천성 모두의 중요성을 강조 (서막 p.18)\n'''명칭''': [[쌍둥이 연구]]\n{/def}\n\n[[img:L0-18.png|서막 p.18 일란성 쌍둥이(왼쪽 두 여성)/이란성 쌍둥이(오른쪽 남녀)|medium]]\n\n{analogy}\n쌍둥이 연구는 '''같은 코드를 두 서버에 배포'''하는 A/B 실험이다. 일란성 쌍둥이 = 완전히 같은 코드(유전자)를 서로 다른 서버 환경에 올린 것 → 결과가 다르면 환경 탓. 이란성 쌍둥이 = 코드가 절반쯤 다른 두 버전 → 일란성과 비교하는 '''기준점(baseline)'''.\n{/analogy}\n\n=== 일란성 쌍둥이 ===\n{def}\n'''설명''': 유전 특성이 동일하여, 기질 및 여러 특질에서 유전과 환경의 상호작용을 탐구하기 적합한 쌍둥이 (서막 p.18)\n'''명칭''': '''일란성 쌍둥이''' (identical twins)\n{/def}\n교수(🎙 8/25 1:29:33): 하나의 수정란에서 분할되어 유전적 특성이 '''완전히 동일'''.\n\n=== 이란성 쌍둥이 ===\n{def}\n'''설명''': 유전적 동일성이 낮아, 일란성 쌍둥이와 비교하는 기준점이 되는 쌍둥이 (서막 p.18, 정리본)\n'''명칭''': '''이란성 쌍둥이''' (fraternal twins)\n{/def}\n\n== 비교 ==\n{| class=\"table\"\n! 구분 || 일란성 쌍둥이 || 이란성 쌍둥이\n|-\n| 유전 || '''동일''' (하나의 수정란) || 동일성 낮음\n|-\n| 연구에서의 역할 || 유전과 환경의 상호작용 탐구 || 일란성과 비교하는 기준점\n|-\n| 둘이 다르면? || 차이 = '''환경·경험''' (후천성) || 유전 + 환경이 섞임\n|-\n| 둘이 같으면? || 공통점 = 유전 (선천성) 가능성 || —\n|}\n\n<pre class=\"ascii\">\n  일란성:  [수정란 1개] ──분할──▶ A · A'   유전 100% 같음  → 차이가 나면 '''환경''' 때문\n  이란성:  [수정란 2개] ─────────▶ A · B    유전 덜 같음   → 일란성과 비교하는 '''기준점'''\n                         결론: 대부분 '''선천성 · 후천성 모두 중요'''\n<\/pre>\n\n{warn}\n\"쌍둥이 연구는 유전이 환경보다 중요함을 증명했다\" ✗ — 슬라이드 결론은 '''둘 다 중요'''. 또 \"이란성 쌍둥이가 유전 특성이 동일하다\" ✗.\n{/warn}\n\n== 관련 문서 ==\n* [[행동유전학]] — 쌍둥이 연구의 주 무대\n* [[선천성-후천성 논제]]\n* [[종단 연구]] — 같은 사람을 오래 추적하는 3장의 연구 설계\n\n근거: 서막 p.18"
 },
 "비교문화심리학": {
  "title": "비교문화심리학 (Cross-cultural Psychology)",
  "category": [
   "서막 심리학 이야기",
   "이론"
  ],
  "body": "'''비교문화심리학'''(Cross-cultural Psychology)은 문화에 따라 인간의 사고와 행동이 어떻게 다른지, 그리고 그 차이의 '''기저에 어떤 보편성'''이 있는지를 연구한다. 서막 p.19 의 핵심 문장은 \"문화에 따라 인간의 사고와 행동에는 차이가 존재함에도 그 기저에는 일련의 보편성이 존재\".\n\n{def}\n'''설명''': 문화에 따라 인간의 사고와 행동에는 차이가 존재함에도 그 기저에는 일련의 보편성이 존재함을 다루는 분야 (서막 p.19)\n'''명칭''': [[비교문화심리학]] (Cross-cultural Psychology)\n{/def}\n\n[[img:L0-19.png|서막 p.19 미소의 보편성 — 서로 다른 문화권 두 사람의 같은 미소|medium]]\n\n=== 문화 ===\n{def}\n'''설명''': 한 세대에서 다음 세대로 전달되는 공유한 생각과 행동 (서막 p.19)\n'''명칭''': '''문화''' (Culture)\n{/def}\n\n{analogy}\n문화는 '''운영체제 위의 테마·언어 설정'''과 같다. 한국어 Windows와 일본어 Windows는 메뉴 글자도, 기본 앱도 다르지만 커널(인간의 보편적 마음)은 같다. 비교문화심리학은 \"설정 차이\"와 \"공통 커널\"을 함께 찾는다.\n{/analogy}\n\n== 슬라이드의 연구 예시: 외로움 ==\n{| class=\"table\"\n! 차이 (문화마다 다름) || 보편성 (문화와 무관)\n|-\n| 문화권에 따라 외로움의 감정에 차이를 보임 (Lykes & Kemmelmeier, 2014) || 수줍음, 낮은 자존감, 독신 생활 등이 외로움을 증폭시킨다는 것은 공통적 (Rokach et al., 2002)\n|-\n| 그림: 문화권이 다른 두 사람 || 그림 캡션: '''미소의 보편성'''\n|}\n\n== 교수 예시: 일본의 메이와쿠 문화 (🎙 8/25) ==\n* '''메이와쿠(迷惑)''': \"남에게 폐를 끼치면 안 된다\"의 일본 버전.\n* '''다테마에'''(사회적 가면) vs '''혼네'''(본연의 모습).\n* 외로움·힘듦을 드러내는 것조차 폐로 여겨 감춤 → 보편적 감정(외로움)도 문화에 따라 '''표현'''이 달라진다.\n\n== 서막 안에서 문화가 나오는 곳 ==\n{| class=\"table\"\n! p. || 내용 || 연결\n|-\n| 19 || 문화 정의, 외로움 연구, 미소의 보편성 || 이 문서\n|-\n| 21 || 몽골어/중국어 색 지각 차이 → 문화사회심리학 주제 || [[선천성-후천성 논제|문화에 따른 색 지각 차이]]\n|-\n| 23 || 사회문화적 수준 — 타인의 기대, 소속 집단, 대중 매체의 모델 || [[분석 수준]]\n|-\n| 24–25 || 사회문화 조망 — 분노의 표현이 문화 맥락에 따라 다름 || [[이론적 조망]]\n|}\n\n{warn}\n비교문화심리학의 결론은 \"문화마다 완전히 다르다\"가 아니라 '''차이 + 그 기저의 보편성'''이다. 반대로 [[에크만의 기본 감정]]은 \"보편성(선천성)\" 쪽의 예시로 쓰인다.\n{/warn}\n\n== 관련 문서 ==\n* [[선천성-후천성 논제]] · [[에크만의 기본 감정]]\n* [[분석 수준]] — 사회문화적 수준\n* [[자기참조 효과]] — 6장의 개인주의 vs 집단주의 문화 차이\n\n근거: 서막 p.19, p.21"
 },
 "에크만의 기본 감정": {
  "title": "폴 에크만의 기본 감정 (Basic Emotions)",
  "category": [

  "body": "'''에크만의 기본 감정'''(Paul Ekman's Basic Emotions)은 문화권과 상관없이 전 인류가 공유하는 '''6개의 감정''' — '''기쁨, 슬픔, 분노, 공포, 혐오, 놀람''' — 이 있다는 주장이다. 기본 감정의 식별이 문화·인종과 무관하게 이루어지므로, 서막에서는 '''선천성의 예시'''로 쓰인다.\n\n{def}\n'''설명''': 문화권과 상관없이 전 인류가 공유하는 6개의 감정(기쁨, 슬픔, 분노, 공포, 혐오, 놀람)이 존재하며, 그 식별은 문화/인종과 무관하게 이루어진다는 이론 (서막 p.20)\n'''명칭''': [[에크만의 기본 감정]] (폴 에크만, Paul Ekman)\n{/def}\n\n[[img:L0-20.png|서막 p.20 폴 에크만의 6가지 기본 감정 — 기쁨·공포·혐오 / 분노·놀람·슬픔|medium]]\n\n{analogy}\n기본 감정은 '''이모지의 기본 세트'''다. 어느 나라 키보드를 열어도 😀😢😠😨🤢😲 는 같은 뜻으로 읽힌다. 나라마다 추가된 스티커(문화별 감정 표현)는 다르지만, 기본 6개는 설명서 없이도 모두가 알아본다 — 그래서 \"타고난 것(선천성)\"의 증거로 쓰인다.\n{/analogy}\n\n== 6개 감정 암기 ==\n<pre class=\"ascii\">\n   기쁨  슬픔  분노  공포  혐오  놀람\n   ─────────────────────────────────\n   \"기슬분 공혐놀\"  — 6개, 문화·인종 무관하게 식별 → '''선천성'''\n<\/pre>\n\n== 핵심 내용 (p.20) ==\n* 문화권과 상관없이 전 인류가 공유하는 '''6개'''의 감정이 존재\n* 기본 감정에 대한 식별은 문화/인종과 '''무관'''하게 이루어짐\n** '''선천성의 예시'''\n** 유전적으로 기본 감정에 대한 식별을 할 수 있게 타고난 것일 수 있음\n* 정리본 노트·🎙 8/25: 감정 식별의 주요 단서는 '''눈'''. 그래서 모자이크할 때 눈을 가리고, 대인관계에서 아이컨택을 하라고 한다.\n\n== 선천성 vs 후천성 예시 ==\n{| class=\"table\"\n! 구분 || 에크만의 기본 감정 || 문화에 따른 색 지각 차이\n|-\n| 슬라이드 || p.20 \"선천성 심리 기제\" || p.21 \"후천성 심리 기제\"\n|-\n| 문화의 영향 || 없음 (보편적) || 있음 (몽골어 세분화 / 중국어 통일)\n|-\n| 문서 || 이 문서 || [[선천성-후천성 논제]]\n|}\n\n{warn}\n'''개수 함정''': 6개다(7개·5개 아님). '''목록 함정''': \"사랑\"·\"수치심\"은 없다 — 기쁨·슬픔·분노·공포·혐오·놀람. '''짝 함정''': bank MC ② \"선천성 = 색 지각, 후천성 = 기본 감정\"은 뒤집힌 오답.\n{/warn}\n\n{quiz}\n문화권과 상관없이 전 인류가 공유하는 6가지 감정이 있다고 제안해 선천성의 예시로 쓰이는 이론의 이름은?\n{/quiz}\n{answer}\n'''(폴) 에크만의 기본 감정'''\n{/answer}\n\n== 관련 문서 ==\n* [[선천성-후천성 논제]] — 선천성 예시\n* [[진화심리학]] — 보편성의 진화적 설명\n* [[비교문화심리학]] — 미소의 보편성\n\n근거: 서막 p.20"
 },
 "생물심리사회적 접근법": {
  "title": "생물심리사회적 접근법 (Biopsychosocial Approach)",
  "category": [
   "서막 심리학 이야기",
   "이론"
  ],
  "body": "'''생물심리사회적 접근법'''(Biopsychosocial Approach)은 인간의 심적 과정과 행동을 '''생물학적, 심리적, 사회문화적 수준의 통합된 결과물'''로 보는 접근이다. ⭐⭐⭐ '''서막 최우선 명칭'''(통합요약 §0-1)이고, 교수가 서막에서 \"가장 중요한 포인트\"라고 직접 말한 내용이다.\n\n{def}\n'''설명''': 인간의 심적 과정과 행동이 생물학적, 심리적, 사회문화적 수준의 통합된 결과물이라고 보는 접근법. 각 분석 수준의 관점에 따라 심적 과정에 대한 접근 양상이 달라짐 (서막 p.22)\n'''명칭''': [[생물심리사회적 접근법]] (Biopsychosocial Approach)\n{/def}\n{def}\n'''사례형 설명''': 민수는 시험 때마다 크게 불안해한다. 연구자는 이를 유전적 기질과 뇌 활동, 실패할 것이라는 부정적 기대와 상황 해석, 가족의 높은 기대와 경쟁적인 학교 문화가 모두 함께 작용한 결과로 설명한다. (bank 단답형)\n'''명칭''': [[생물심리사회적 접근법]]\n{/def}\n\n[[img:L0-22.png|서막 p.22–23 심리학의 생물심리사회적 접근법 — 생물학적 수준(환경에 반응하는 유전자·자연선택·세대에 걸쳐 전달되는 적응적 특질·유전의 변이), 심리적 수준(정서적 반응·인지적 처리 및 지각적 해석·학습된 공포·기대), 사회문화적 수준(타인의 존재·문화/사회/가족의 기대·소속집단의 영향·주목을 끄는 모델) → 가운데 '행동 및 심적 과정'|large]]\n\n{analogy}\n비행기 사고 조사단을 떠올려 보라. 기체 결함(생물학적), 조종사의 판단 착오(심리적), 항공사의 무리한 운항 문화(사회문화적) — 조사 보고서가 \"기체 결함 하나 때문\"이라고 쓰는 일은 거의 없다. 사람의 행동도 '''세 수준이 동시에''' 작용한 결과이고, 연구자마다 '''어느 쪽에 중점을 두느냐'''만 다르다.\n{/analogy}\n\n[[anim:biopsychosocial|가운데 '분노'에 생물학적(유전자·뇌 회로, Fight or Flight) → 심리적(상황 해석·기대) → 사회문화적(문화별 표현) 화살표가 차례로 꽂히고 세 원이 겹칩니다. 마지막 자막 \"어느 하나의 요인만으로는 설명할 수 없다\"가 이 문서의 결론입니다.]]\n\n== 세 분석 수준 (p.22–23) ==\n{| class=\"table\"\n! 수준 || 무엇을 중점으로 (슬라이드) || 내면/외부 || 관련 분야\n|-\n| 생물학적 수준 || 유전자, 자연선택, 적응적 특질 || 몸 || 생물, [[진화심리학]], 신경과학\n|-\n| 심리적 수준 || 정서, 인지 처리 및 해석, 개인 내면의 기대 || 개인 '''내면''' || 인지·정서\n|-\n| 사회문화적 수준 || 타인의 기대, 소속 집단, 대중 매체의 모델 || 개인 '''외부''' 환경 || 사회, 문화\n|}\n세 수준 각각의 정의는 [[분석 수준]] 문서에.\n\n{exam}\n교수(🎙 8/25 1:44:27): \"동일한 행동이라 하더라도 '''어느 하나의 요인만으로는 설명을 하지 않는다''' 라는 게 이제 '''가장 중요한 포인트'''라고 볼 수가 있겠습니다.\" 슬라이드 p.23: \"중점의 차이일 뿐, 사람의 심리를 설명하는데 어느 하나의 요인만으로는 설명할 수 없음\". 예: 중동에서는 발바닥을 보이는 것이 큰 무례 — 같은 행동도 문화에 따라 해석이 달라진다.\n{/exam}\n\n== 이론적 조망과의 관계 ==\np.24: \"생물심리사회적 접근법을 '''기반'''으로 심리학의 세부 하위 분야가 발전\". 즉 [[이론적 조망]] 7개는 이 접근법의 세 수준 중 어디에 중점을 두느냐에 따라 갈라진 가지다(대략 신경과학·진화론 → 생물학적, 인지·정신역동 → 심리적, 사회문화 → 사회문화적. 슬라이드에 이 대응표가 따로 있지는 않다).\n\n{warn}\n* \"생물학적 요인이 가장 근본적이므로 나머지는 부차적이다\" ✗ — '''중점의 차이일 뿐''' 우열이 아니다.\n* 이름 함정: '''생물심리사회적''' 접근법 (생물 → 심리 → 사회 순서). \"사회심리생물학적\", \"생물사회심리적\" 등 순서를 바꾼 이름은 오답. 단답형 허용 변형은 \"생물심리사회적 접근\", \"biopsychosocial approach\" 정도.\n* [[선천성-후천성 논제]]의 결론(\"둘 다 중요\")과 비슷하지만, 이쪽은 '''세 수준'''의 통합이다.\n{/warn}\n\n{quiz}\n인간의 심적 과정과 행동을 생물학적·심리적·사회문화적 수준의 통합된 결과물로 보는 접근법의 이름을 쓰시오.\n{/quiz}\n{answer}\n'''생물심리사회적 접근법''' (Biopsychosocial Approach)\n{/answer}\n\n== 관련 문서 ==\n* [[분석 수준]] — 세 수준의 상세\n* [[이론적 조망]] — 이 접근법 위에서 발전한 7개 관점\n* [[선천성-후천성 논제]]\n* [[명칭 암기표]]\n\n근거: 서막 p.22–24"
 },
 "분석 수준": {
  "title": "분석 수준 (생물학적·심리적·사회문화적 수준)",
  "category": [
   "서막 심리학 이야기",
   "용어"
  ],
  "body": "'''분석 수준'''은 [[생물심리사회적 접근법]]이 마음과 행동을 바라보는 세 개의 층 — '''생물학적 수준, 심리적 수준, 사회문화적 수준''' — 이다. 슬라이드 p.22–23 의 제목이 \"심리학의 주요 분석 수준\"이다. 단답형에서는 \"설명 → 어느 수준인가\"가 나오기 좋으므로 세 수준의 '''키워드'''를 정확히 구별해야 한다.\n\n{def}\n'''설명''': 인간의 심적 과정과 행동을 바라보는 생물학적·심리적·사회문화적 관점의 층위. 각 분석 수준의 관점에 따라 심적 과정에 대한 접근 양상이 달라짐 (서막 p.22)\n'''명칭''': [[분석 수준]] (생물심리사회적 접근법의 세 수준)\n{/def}\n\n[[img:L0-23.png|서막 p.23 심리적 수준과 사회문화적 수준 — 왼쪽 그림의 빨간 칸(심리적)과 파란 칸(사회문화적), 아래 \"중점의 차이일 뿐, 어느 하나의 요인만으로는 설명할 수 없음\"|medium]]\n\n{analogy}\n한 사람의 행동을 '''지도 앱의 세 레이어'''로 본다. 위성 레이어(생물학적: 지형·몸), 교통 레이어(심리적: 지금 머릿속의 해석과 기대), 행정구역 레이어(사회문화적: 내가 속한 집단과 문화). 레이어를 하나만 켜면 길을 잘못 찾는다 — 세 개를 겹쳐 봐야 실제 길이 보인다.\n{/analogy}\n\n[[anim:biopsychosocial|세 수준의 화살표가 하나씩 '분노'로 들어오는 순서(생물학적 → 심리적 → 사회문화적)를 보고 각 화살표에 붙은 키워드를 따라 말해 보세요.]]\n\n=== 생물학적 수준 ===\n{def}\n'''설명''': 유전자, 자연선택, 적응적 특질 등을 중점으로 심리를 바라보는 수준 — 생물, 진화심리학, 신경과학 (서막 p.22)\n'''명칭''': '''생물학적 수준'''\n{/def}\n그림 속 항목: 환경에 반응하는 유전자 · 자연선택 · 세대에 걸쳐 전달되는 적응적 특질 · 유전자의 한 특질 · 유전의 변이.\n\n=== 심리적 수준 ===\n{def}\n'''설명''': 정서, 인지 처리 및 해석, 개인 내면의 기대 등을 중점으로 심리 및 행동을 해석하는 관점 — 개인의 내면에서 발생하는 기제가 핵심 (서막 p.23)\n'''명칭''': '''심리적 수준'''\n{/def}\n그림 속 항목: 정서적 반응 · 인지적 처리 및 지각적 해석 · 학습된 공포 · 기대.\n\n=== 사회문화적 수준 ===\n{def}\n'''설명''': 타인의 기대, 소속 집단, 대중 매체의 모델 등을 중점으로 심리 및 행동을 해석하는 관점 — 개인의 외부에 존재하는 환경적인 요인에 의한 행동, 사고의 변화 (서막 p.23)\n'''명칭''': '''사회문화적 수준'''\n{/def}\n그림 속 항목: 타인의 존재 · 문화/사회/가족의 기대 · 소속집단의 영향 · 주목을 끄는 모델.\n\n== 한눈에 구별 ==\n{| class=\"table\"\n! 수준 || 키워드 || 어디에 있나 || \"시험 불안 민수\" 사례(bank)\n|-\n| 생물학적 || 유전자, 자연선택, 적응적 특질 || 몸 || 유전적 기질, 뇌 활동\n|-\n| 심리적 || 정서, 인지 처리·해석, '''내면의 기대''' || 개인 '''내면''' || 실패할 것이라는 부정적 기대, 상황 해석\n|-\n| 사회문화적 || '''타인의 기대''', 소속 집단, 대중 매체 모델 || 개인 '''외부''' || 가족의 높은 기대, 경쟁적인 학교 문화\n|}\n\n{warn}\n'''\"기대\" 함정''': \"개인 내면의 기대\"는 '''심리적''' 수준, \"'''타인의''' 기대\"(가족·문화의 기대)는 '''사회문화적''' 수준. 같은 단어 \"기대\"가 양쪽에 다 나온다 — '''누구의''' 기대인지로 가른다.\n{/warn}\n\n{exam}\n슬라이드 p.23 마지막 줄 = 교수의 \"가장 중요한 포인트\"(🎙 8/25 1:44:27): \"중점의 차이일 뿐, 사람의 심리를 설명하는데 '''어느 하나의 요인만으로는 설명할 수 없음'''\".\n{/exam}\n\n== 관련 문서 ==\n* [[생물심리사회적 접근법]] — 세 수준을 통합하는 상위 개념\n* [[이론적 조망]] — 수준별로 발전한 7개 관점\n* [[진화심리학]] · [[비교문화심리학]]\n\n근거: 서막 p.22–23"
 },

  "body": "'''이론적 조망'''(Theoretical Perspectives)은 심리를 바라보는 다양한 이론적 관점들이다. [[생물심리사회적 접근법]]을 기반으로 심리학의 세부 하위 분야가 발전했고, '''동일한 현상이라도 어떤 조망을 취하느냐에 따라 연구 방법과 현상에 대한 설명 방식이 달라진다'''. 슬라이드는 '''7개 조망'''(p.25 표)과 '''분노 예시'''(p.24)로 정리한다.\n\n{def}\n'''설명''': 생물심리사회적 접근법을 기반으로, 같은 현상이나 심리 기제를 서로 다른 관점에서 연구·설명하는 심리학의 다양한 이론적 관점들 (서막 p.24)\n'''명칭''': [[이론적 조망]] (Theoretical Perspectives)\n{/def}\n\n[[img:L0-24.png|서막 p.24 다양한 심리 이론적 조망 — 신경과학적·진화론적·행동주의적·인지적·사회문화적 조망이 가운데 뇌로 화살표|medium]]\n\n{analogy}\n같은 '''교통사고 영상'''을 보는 다섯 전문가: 의사는 운전자의 뇌와 몸을(신경과학), 생물학자는 \"왜 사람은 위험할 때 얼어붙나\"를(진화론), 상담가는 운전자의 억눌린 분노를(정신역동), 인지심리학자는 운전자가 상황을 어떻게 해석했는지를(인지), 사회학자는 그 나라 운전 문화를(사회문화) 본다. 영상은 하나, '''조망'''은 다섯.\n{/analogy}\n\n[[anim:biopsychosocial|세 분석 수준이 하나의 '분노'로 모이는 그림입니다. 아래 분노 예시 표의 다섯 조망이 각각 어느 화살표 쪽인지 짝지어 보세요.]]\n\n== 분노 예시 (p.24) ⭐⭐⭐ ==\n{| class=\"table\"\n! 조망 || 분노에 대한 접근\n|-\n| 신경과학 || '''흥분 상태'''를 유발하는 '''두뇌 회로''' 탐구\n|-\n| 진화론 || 유전자가 분노를 어떻게 촉진시켰는가 ('''Fight or Flight''' 반응)\n|-\n| 정신역동 || '''무의식적 적대감'''의 방출\n|-\n| 인지 || '''상황의 해석'''이 분노에 미치는 영향력\n|-\n| 사회문화 || '''문화 맥락'''에 따라 분노의 표현이 어떻게 달라지는가\n|}\n교수 보충(🎙 8/25): 진화론에서 공포 = 도주(Flight), 분노 = 맞서기(Fight).\n\n== 7개 조망 × 연구 질문 × 관련 하위 분야 (p.25) ⭐⭐⭐ ==\n{| class=\"table\"\n! 이론적 조망 || 주요 연구 질문 || 관련 하위 분야\n|-\n| 신경과학 || 신체와 두뇌가 어떻게 정서, 기억, 감각 경험을 가능케 하는가? || 생물, 인지, 임상\n|-\n| 진화론 || 특질의 자연선택은 어떻게 유전자의 생존을 촉진시키는가? || 생물, 발달, 사회\n|-\n| [[행동유전학]] || 유전자와 환경은 어떻게 '''개인차'''에 영향을 미치는가? || 성격, 발달, 법\n|-\n| 정신 역동 || 무의식적 추동과 갈등이 어떻게 행동을 유도하는가? || 임상, 상담, 성격\n|-\n| [[행동주의]] || 관찰 가능한 반응을 어떻게 학습하는가? || 임상, 상담, 산업조직\n|-\n| [[인지심리학]] || 정보의 부호화 및 처리, 저장, 인출은 어떻게 이루어지는가? || 인지신경과학, 임상, 상담, 산업조직\n|-\n| 사회문화 || 행동 및 사고가 상황과 문화에 따라 어떻게 달라지는가? || 발달, 사회, 임상, 상담\n|}\n정신 역동 = [[정신분석|정신역동]](프로이트 계열), 진화론 = [[진화심리학]]·[[자연선택]]과 연결.\n\n<pre class=\"ascii\">\n  연구 질문 키워드 → 조망  (단답형·객관식용 압축)\n  ─────────────────────────────────────────────\n  두뇌·신체가 정서·기억·감각을 가능케      → 신경과학\n  자연선택 · 유전자의 생존                → 진화론\n  유전자와 환경 · '''개인차'''               → 행동유전학\n  무의식적 추동과 갈등                    → 정신 역동\n  관찰 가능한 반응의 학습                 → 행동주의\n  부호화 · 처리 · 저장 · 인출              → 인지심리학\n  상황과 문화에 따라 달라짐               → 사회문화\n<\/pre>\n\n{warn}\nbank MC 함정 모음:\n* \"무의식적 적대감의 방출 – 인지심리학\" ✗ → 정신역동\n* \"문화 맥락에 따른 분노 표현 – 신경과학\" ✗ → 사회문화\n* \"상황의 해석 – 정신역동\" ✗ → 인지\n* \"개인차\" 질문에 \"진화론\" ✗ → 행동유전학 (진화론은 종 전반의 '''보편적''' 특질)\n{/warn}\n\n{quiz}\n분노를 설명하는 접근과 조망이 옳게 짝지어진 것은?\n① 무의식적 적대감의 방출 – 인지심리학\n② Fight or Flight 반응의 진화적 기능 – 진화론\n③ 문화 맥락에 따른 분노 표현의 차이 – 신경과학\n④ 상황의 해석이 분노에 미치는 영향 – 정신역동\n{/quiz}\n{answer}\n'''②'''. ①은 정신역동, ③은 사회문화, ④는 인지.\n{/answer}\n\n{tip}\n노트(정리본): 각 조망은 하나의 관점일 뿐 모든 것을 설명하지 못한다 — 인지 조망에서도 문화 요인을 고려할 수 있다. 교수: 하위 분야는 세분화됐지만 결국 모든 관점을 아우르는 복합적 학문(🎙 8/25 1:50:15).\n{/tip}\n\n== 관련 문서 ==\n* [[생물심리사회적 접근법]] · [[분석 수준]] — 조망의 토대\n* [[심리학의 하위 분야]] — 표의 세 번째 열\n* [[행동유전학]] · [[진화심리학]] · [[정신분석]] · [[행동주의]] · [[인지심리학]]\n\n근거: 서막 p.24–25"
 },
 "심리학의 하위 분야": {
  "title": "심리학의 하위 분야 (기초·응용)",
  "category": [
   "서막 심리학 이야기",
   "용어"
  ],
  "body": "'''심리학의 하위 분야'''는 원리를 탐구하는 '''기초 학문''' 5개와, 그 원리를 실생활에 적용하는 '''응용 학문''' 4개로 나뉜다(서막 p.26 표). \"연구 목적 설명 → 분야 이름\"이 단답형으로 나오기 좋은 장표다.\n\n{def}\n'''설명''': 심리학의 세부 분야를 원리 탐구 중심의 기초 학문과 실생활 적용 중심의 응용 학문으로 나눈 것 (서막 p.26)\n'''명칭''': [[심리학의 하위 분야]]\n{/def}\n\n[[img:L0-26.png|서막 p.26 심리학의 세부 하위 분야 — 기초 학문(생물심리학/신경과학·발달·인지·성격·사회) / 응용 학문(산업조직·상담·임상·정신의학)|large]]\n\n{analogy}\n기초 학문은 '''물리학·재료공학''', 응용 학문은 '''건축·토목'''이다. 물리학자는 \"철근이 왜 버티나\"를 연구하고(원리 탐구), 건축가는 그 원리로 실제 다리를 놓는다(실생활 적용). 심리학도 인지심리학자가 기억의 원리를 밝히면, 상담·임상심리학자가 그것으로 사람을 돕는다.\n{/analogy}\n\n=== 기초 학문·응용 학문 ===\n{def}\n'''설명''': 특정 현상 혹은 기제에 대한 원리 탐구를 중점(지식 기반 형성)으로 하는 학문 (서막 p.26)\n'''명칭''': '''기초 학문'''\n{/def}\n{def}\n'''설명''': 기초 학문의 원리를 실생활에 적용하는 방법을 개발하는 것을 중점으로 하는 학문 (서막 p.26)\n'''명칭''': '''응용 학문'''\n{/def}\n\n== p.26 표 ==\n{| class=\"table\"\n! 영역 || 분야 || 연구 목적\n|-\n| 기초 || 생물심리학/신경과학 || 두뇌 및 신경 활동과 심적 과정 간의 연관성\n|-\n| 기초 || 발달심리학 || 탄생~노년기까지의 인간의 다양한 능력 변화 (→ [[3장 일생에 걸친 발달]])\n|-\n| 기초 || [[인지심리학]] || 지각, 사고, 정보 처리 등에 대한 실험적 접근\n|-\n| 기초 || 성격심리학 || 지속적인 특질과 성격이 행동에 미치는 영향\n|-\n| 기초 || 사회심리학 || 문화와 사회 등 환경이 개인에게 미치는 영향\n|-\n| 응용 || 산업조직심리학 || 조직체와 구성원 간의 효율성 증대(검사 도구)\n|-\n| 응용 || '''[[상담심리학]]''' || 다양한 요인(학업, 직업, 대인관계 등)으로 인한 개인의 위기 상황 대처 능력 지원\n|-\n| 응용 || 임상심리학 || 심리, 정서, 행동 장애에 대한 평가 및 치료 제공\n|-\n| 응용 || 정신의학 || 심리 치료 외에 '''약물 치료를 병행'''\n|}\n\n=== 임상심리학 ===\n{def}\n'''설명''': 심리, 정서, 행동 장애에 대한 평가 및 치료를 제공하는 응용 분야 (서막 p.26)\n'''명칭''': '''임상심리학'''\n{/def}\n\n=== 정신의학 ===\n{def}\n'''설명''': 심리 치료 외에 약물 치료를 병행하는 응용 분야 (서막 p.26)\n'''명칭''': '''정신의학'''\n{/def}\n\n{tip}\n교수 추가(🎙 8/25): 슬라이드엔 없지만 '''소비자 심리학'''(마케팅·구매 유도 연구)도 있다. 산업조직심리학은 직장 만족도(대인관계·직무 특성)와 적성 검사 개발을 다룬다. 응용 학문은 기초 학문의 원리를 가져와 활용한다.\n{/tip}\n\n{warn}\n* '''약물''' 키워드 → '''정신의학'''(임상심리학 아님).\n* '''장애의 평가·치료''' → 임상심리학 / '''일상적 위기(학업·직업·대인관계) 대처 지원''' → 상담심리학.\n* 인지심리학은 '''기초''' 학문(응용 아님). 산업조직심리학은 '''응용'''(기초 아님).\n{/warn}\n\n<pre class=\"ascii\">\n  기초 5:  생물(신경) · 발달 · 인지 · 성격 · 사회          ← 원리 탐구\n  응용 4:  산업조직 · 상담 · 임상 · 정신의학(+약물)        ← 실생활 적용\n  암기:   \"생발인성사 / 산상임정\"\n<\/pre>\n\n== 관련 문서 ==\n* [[상담심리학]] — 통합요약 단답형 후보\n* [[이론적 조망]] — p.25 표의 \"관련 하위 분야\" 열\n* [[인지심리학]]\n\n근거: 서막 p.26"
 },
 "상담심리학": {
  "title": "상담심리학 (Counseling Psychology)",
  "category": [
   "서막 심리학 이야기",
   "용어"
  ],
  "body": "'''상담심리학'''(Counseling Psychology)은 학업, 직업, 대인관계 등 다양한 요인으로 인한 '''개인의 위기 상황 대처 능력을 지원'''하는 '''응용''' 심리학 분야다. 통합요약 \"출제 예상 (단답형 명칭)\" 15번에 올라 있다. 가장 헷갈리는 짝은 '''임상심리학'''.\n\n{def}\n'''설명''': 다양한 요인(학업, 직업, 대인관계 등)으로 인한 개인의 위기 상황 대처 능력을 지원하는 응용 학문 분야 (서막 p.26)\n'''명칭''': [[상담심리학]] (Counseling Psychology)\n{/def}\n{def}\n'''사례형 설명''': 취업 준비와 대인관계 문제로 힘들어하는 대학생이 학생상담센터를 찾아, 위기 상황을 스스로 헤쳐 나갈 수 있도록 지원을 받았다. 이 학생을 도운 심리학의 응용 분야는?\n'''명칭''': [[상담심리학]]\n{/def}\n\n[[img:L0-26.png|서막 p.26 하위 분야 표 — 응용 학문 칸의 상담심리학: \"다양한 요인(학업, 직업, 대인관계 등)으로 인한 개인의 위기 상황 대처 능력 지원\"|medium]]\n\n{analogy}\n상담심리학은 '''헬스장 PT 트레이너''', 임상심리학은 '''재활의학과 치료사''', 정신의학은 '''약을 처방할 수 있는 의사'''다. 트레이너는 아프지 않은 사람이 위기를 더 잘 넘기도록 돕고, 재활 치료사는 다친(장애가 있는) 부분을 평가하고 치료하며, 의사는 거기에 약까지 쓴다.\n{/analogy}\n\n== 비교: 상담심리학 vs 임상심리학 vs 정신의학 ==\n{| class=\"table\"\n! 분야 || 대상 || 하는 일 (p.26) || 키워드\n|-\n| '''상담심리학''' || 학업·직업·대인관계 등으로 '''위기'''를 겪는 개인 || 위기 상황 '''대처 능력 지원''' || 지원, 대처\n|-\n| [[심리학의 하위 분야|임상심리학]] || 심리·정서·행동 '''장애''' || 장애의 '''평가 및 치료''' || 장애, 평가\n|-\n| [[심리학의 하위 분야|정신의학]] || (장애) || 심리 치료 외에 '''약물 치료 병행''' || 약물\n|}\n\n== 상담과 연결되는 다른 내용 ==\n* [[이론적 조망]] 표(p.25): 상담이 관련 하위 분야로 등장하는 조망 — '''정신 역동, 행동주의, 인지심리학, 사회문화'''.\n* p.27 \"심리학을 통한 성장\": 임상·상담에서 강조하는 것 중 하나가 자신의 감정과 사고에 대한 이해도를 높여 '''대안적 관점'''을 갖는 것. 교수 예시: 인지행동치료 — 사건 → 감정 → 사고 → 지지/반박 근거 → 대안적 관점(🎙 8/25).\n* [[인본주의 심리학|칼 로저스]]: 상담에서 말하는 \"무조건적 긍정\"의 기반(정리본).\n\n{warn}\n\"심리·정서·행동 장애에 대한 평가 및 치료 → 상담심리학\" ✗ — 그건 '''임상심리학'''. \"상담심리학은 기초 학문\" ✗ — '''응용''' 학문.\n{/warn}\n\n== 관련 문서 ==\n* [[심리학의 하위 분야]] — 전체 표\n* [[인본주의 심리학]]\n* [[이론적 조망]]\n\n근거: 서막 p.26 (+p.25, p.27)"
 },
 "1장 심리과학을 비판적으로 생각하기": {
  "title": "1장. 심리과학을 비판적으로 생각하기",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "메인"
  ],
  "body": "'''1장 심리과학을 비판적으로 생각하기'''는 \"'''일상의 상식과 직관은 왜 믿을 수 없고, 심리학은 어떻게 마음에 대한 검증된 결론을 얻는가?'''\"라는 질문 하나로 묶인 장이다. 전반부(p.2–15)는 우리 머리가 저지르는 실수 — [[후견 편향]], [[과신]], [[무선적 사건에서의 질서 지각]], 그리고 [[탈진실]] 세상의 [[탈진실의 취약성 요인|취약성 요인 4가지]] — 를 보여 주고, 후반부(p.16–29)는 그 실수를 피하기 위한 도구 — [[과학적 방법]], 세 가지 연구 방법([[연구 방법 비교|기술적 방법]]·[[상관]]·[[실험법]]), [[기관 생명 윤리 위원회|연구 윤리와 IRB]] — 를 준다.\n\n{info}\n'''시험 범위: 슬라이드 p.1–29 (IRB 연구 승인 절차)까지.''' p.30–34(통계적 추리: 기술통계·추론통계)는 중간고사 범위 밖이다 (🎙 9/22 공지). 페이지 번호는 '''인쇄 슬라이드 번호'''이며 숨김 슬라이드는 없다. → [[시험 정보]]\n{/info}\n\n{analogy}\n1장은 '''\"내 눈을 못 믿겠으니 CCTV를 달자\"'''는 이야기다. 전반부는 목격자(상식)가 얼마나 엉터리로 증언하는지 보여 주는 재판 기록이다 — 결과를 보고 나서 \"처음부터 수상했다\"고 말하고([[후견 편향]]), 자기 기억을 과하게 믿고([[과신]]), 우연을 음모로 엮는다([[착각 상관]]). 후반부는 그래서 '''CCTV(과학적 방법)'''를 설치하는 매뉴얼이다. 다만 CCTV도 종류가 있다 — 그냥 찍기만 하는 것([[연구 방법 비교|기술적 방법]]), 두 사건이 같이 찍힌 횟수를 세는 것([[상관]]), 범인을 일부러 바꿔 넣어 보는 함정 수사([[실험법]]). '''누가 범인인지(인과) 확정할 수 있는 건 함정 수사뿐'''이고, 그 함정 수사에도 지켜야 할 법([[기관 생명 윤리 위원회|IRB]])이 있다.\n{/analogy}\n\n== 0. 이 장이 다른 장과 이어지는 곳 ==\n\n{| class=\"table\"\n! 1장에서 배우는 도구 || 다른 장에서 다시 쓰이는 곳\n|-\n| 심리과학 = 인과성 탐구 || [[서막 심리학 이야기|서막]]의 [[생물심리사회적 접근법]] — \"어느 하나의 요인만으로는 설명 못 함\"을 '''검증'''하는 방법이 1장이다\n|-\n| [[사회조사]]의 자기보고 한계 || 서막 [[내성법]]([[구조주의]])의 신뢰도 한계와 같은 문제\n|-\n| [[무선적 사건에서의 질서 지각]] || 4장 [[집단화]](근접성·폐쇄) — 무선 자극에도 패턴을 부여하는 지각 원리\n|-\n| [[상관]] ≠ 인과 || 3장 [[권위적·권위주의적·허용적 양육]] — 교수: \"양육 방식과 아이 결과는 '''상관이지 인과가 아니다'''\"\n|-\n| [[가짜약 효과]] || 4장 [[지각 갖춤새]] — 기대가 지각(통증)을 바꾼다\n|-\n| 연구 방법(관찰·실험) || 3장 [[횡단 연구]]·[[종단 연구]], 2장 [[손상법]](인과 추론 가능, 그러나 윤리 문제), 서막 [[쌍둥이 연구]]\n|-\n| 연구 윤리 (쥐 [[편도체]] 실험, 뇌 손상 환자 연구) || 2장 [[편도체]], [[2장 마음의 생물학과 의식|2장]]의 뇌 연구 기법\n|-\n| [[과신]]을 줄이는 [[메타인지]] || 6장 [[검증 효과]] — 스스로 시험 보며 \"아는 것/모르는 것\"을 점검\n|}\n\n== p.1–2 — 심리과학의 필요성과 목표 ⭐⭐ ==\n\n[[img:L1-02.png|1장 p.2 — 심리과학의 목표: 인간 심리에 대한 '과학적이고 재현 가능한 설명'(과학적 방법·경험적 근거·재현 가능성·일반화 가능성)|medium]]\n\n[[심리학|심리과학]]의 목표는 '''인간의 행동과 심적 과정에 대한 과학적이고 재현 가능한 설명'''을 제공하는 것이다. 다시 말해 '''단순한 견해를 검증된 결론과 구분'''하려는 것이다. 그리고 핵심 질문은 \"어떤 심적 과정이나 행동('''결과''')이 나타나는 데 '''무엇(원인)'''이 영향을 주는가?\" — 즉 '''인과성 탐구'''다.\n\n교수는 결과가 모든 사람에게 적용되는 '''일반화 가능성'''이 있어야 하고, 실험·설문 같은 경험 기반 데이터로 결론을 낸다고 덧붙였다(🎙 9/1). 결과 쪽에 신경과학을 접목하면 [[인지신경과학]]으로 이어진다.\n\n== p.3 — 현상에 대한 과학적 검증의 필요성 ⭐ ==\n\n[[img:L1-03.png|1장 p.3 — 심리학에 대한 오해: \"일상 경험을 그럴 듯하게 포장하는 것이 심리학이다\"(✗)|medium]]\n\n심리학은 \"일상 경험을 전문용어로 포장하는 것\"처럼 보일 수 있다. '기억력이 좋은 사람이 학업 성취도가 높다', '시험에 대한 부담감을 느끼면 성적이 떨어진다' — 다 당연해 보인다. 그러나 '''일상적 사고는 잘못된 결론에 도달하게 할 수 있다.'''\n\n교수 예시(🎙 9/1): 암산 과제에서 한 집단에만 \"과정을 기록해 남길 것\"이라고 추가 고지해 압박을 주었더니 정답률이 더 낮았다 — 압박감으로 수행이 떨어지는 '''초킹(choking) 현상'''. 「당연해 보이는 것을 진술로만 끝내지 않고 '''객관화된 형태로 검증'''하는 것이 심리학의 주요 목표」.\n\n== p.4 — 우연한 관찰의 진리화 ⭐⭐ ==\n\n[[img:L1-04.png|1장 p.4 — 우연한 관찰(\"일요일마다 날씨가 좋네!\") → 진실처럼 느낌(\"일요일 = 날씨가 좋다\")|medium]]\n\n'''일상 경험에 대한 '반복적' 관찰 = 진실'''이라는 공식은 성립하지 않는다. 진술의 단순한 반복은 '''처리하고 기억하기 쉽게''' 만들어서 더욱 참처럼 보이게 할 뿐이다(Fazio et al., 2015). 4주 연속 일요일이 맑았다고 \"일요일은 항상 날씨가 좋다\"고 결론 내리면 안 된다(🎙 9/1). 이 \"반복 = 진실처럼 느껴짐\"은 p.13 [[탈진실의 취약성 요인|반복]]에서 다시 나온다.\n\n== p.5 — 후견 편향 (Hindsight Bias) ⭐⭐⭐ ==\n\n[[img:L1-05.png|1장 p.5 — 사건 발생 전 \"결과는 알 수 없음(확신도 낮음)\" → 사건 발생 후 \"역시 내가 그럴 줄 알았어!\"|medium]]\n\n{def}\n'''설명''': 실제로는 결과를 예측할 수 없었으나, 결과를 알고 난 후 자신이 그 결과를 예측할 수 있었다고 믿는 경향 (1장 p.5)\n'''명칭''': [[후견 편향]] (Hindsight Bias)\n{/def}\n\n연령·문화와 무관하게 발생하는 '''보편적 현상'''이다(Roese & Vohs, 2012). 슬라이드 예시는 2026 북중미 월드컵 한국 vs 남아공/체코/멕시코 — \"확신을 갖고 예측했고 맞았다고 말할 만한 경기가 있었는가?\" 노트 예시는 '''콜럼버스의 달걀'''.\n\n{exam}\n교수(🎙 9/1 12:18): 「경기가 끝난 뒤 '''\"역시 이렇게 될 줄 알았어\"를 한 번이라도 생각했다면 후견 편향에 잡힌 것'''」. bank 단답형 정답. 결과를 '''안 뒤'''의 착각이라는 점이 [[과신]](결과 '''전'''의 착각)과의 구분점.\n{/exam}\n\n== p.6 — 과신 (Overconfidence) ⭐⭐⭐ ==\n\n[[img:L1-06.png|1장 p.6 — 과신의 모습: 내가 안다고 생각하는 양 vs 실제로 아는 양. 아래는 단어 완성하기 과제(Goranson, 1978) WREAT→WATER, OCHSA→?|medium]]\n\n{def}\n'''설명''': 실제로 알고 있는 것보다 더 많이 알고 있다고 생각하는 경향 (1장 p.6)\n'''명칭''': [[과신]] (Overconfidence)\n{/def}\n\n개인의 주관적 확신도와 실제 사실 사이에는 괴리가 있다([[과신|테틀록]], 1998, 2005). 노트: 전문가들이 '''평균 80% 확신'''을 보인 사건의 실제 적중률은 '''40% 이하'''. 정확히 예측하는 [[과신|슈퍼 예측자]]는 극소수(테틀록 & 가드너, 2016; 교수: 약 2%). 그리고 '''과신은 후견 편향에 의해서도 생성될 수 있다'''. 수업에서는 '''단어 완성하기 과제'''(Goranson, 1978; OCHSA → CHAOS)를 시작 전 예상 시간과 실제 시간을 비교하며 직접 해 봤다.\n\n== p.7 — 번외: 메타인지 (Metacognition) ⭐⭐ ==\n\n[[img:L1-07.png|1장 p.7 — 메타인지의 구도: \"내가 지금 어떻게 생각하고 있지?\" 목표 설정·이해 점검·전략 조절의 순환|medium]]\n\n[[메타인지]] = '''\"인지에 대한 인지\"'''(Flavell, 1979). 나의 인지 능력과 과정, 아는 것·모르는 것에 대한 인지 능력이다. 메타인지가 발전하면 내면 사고에 대한 인지가 확장되어 '''후견 편향·과신이 감소'''한다. 교수: 교재에는 없고 논문을 찾아 추가한 내용(🎙 9/1).\n\n== p.8 — 무선적 사건에서 질서 지각하기 ⭐⭐ ==\n\n[[img:L1-08.png|1장 p.8 — 우연히 벌어진 사건들 → \"뭔가 패턴이 있는 것 같은데?\" → 무언가 패턴처럼 인식. 아래: 지각에서의 집단화 원리|medium]]\n\n사람은 세상을 의미 있는 것으로 이해하려 하므로 '''무선적인 현상을 매우 불편하게''' 여긴다(Tullet et al., 2015). 그래서 '''무선 배열을 무선적이지 않은 것으로 인식'''한다(Falk et al., 2009). 하지만 무선 연속에서도 패턴은 충분히 우연히 반복된다(Oskarsson et al., 2009). 그 패턴은 정말 실존하는가? → [[착각 상관]]·[[평균으로의 회귀]]와 연관. 아래 그림은 4장 [[집단화|근접성]]·[[집단화|폐쇄]] 원리와 같은 것이다. → [[무선적 사건에서의 질서 지각]]\n\n== p.9–11 — 탈진실 세상에서의 심리과학 ⭐⭐ ==\n\n[[img:L1-09.png|1장 p.9 — 범죄 통계가 보여 주는 현실(범죄율 지속적 감소)과 대중의 인식(범죄가 증가하고 있다) 사이의 큰 괴리|medium]]\n\n[[탈진실]](post-truth): 정서와 개인의 신념이 객관적 사실에 대한 인정을 압도하는 현상. 슬라이드의 세 예시:\n* '''범죄율''': 갤럽 조사에서 10명 중 7명이 \"작년보다 범죄가 증가했다\"고 응답(Swift, 2016) — 실제로는 꾸준히 감소, 2015년 범죄율은 1990년의 절반(Statista, 2017).\n* '''이민자 편견''': 이민자가 범죄자라는 믿음(McCarthy, 2017) — 실제로는 그 나라 사람보다 투옥 가능성이 '''44% 낮음'''(Flagg, 2018, 2019).\n* '''정당 편향성''' (p.10): 정치 성향과 무관하게 발생(Ditto et al., 2019), 당파에 따라 사실과 정반대의 인식(Gelman, 2009).\n\n[[img:L1-10.png|1장 p.10 — 미국인의 정당별 지지자들의 SNS 사용 패턴(William et al., 2017): 파랑과 빨강이 각자 덩어리로 뭉친다|medium]]\n\n[[img:L1-11.png|1장 p.11 — 대한민국 최근 11년간의 형법범죄율(인구 10만 명당, 지표누리): 거의 평평하다|medium]]\n\n교수(🎙 9/1): 국내 형법범죄율은 '''큰 변동이 없다'''. 「이 자료를 찾는 데 30초도 안 걸렸다」 — 사실은 쉽게 확인할 수 있는데 사람들은 확인하지 않는다.\n\n== p.12–15 — 탈진실 세상에서 개인의 취약성을 형성하는 요인 ⭐⭐⭐ ==\n\n교수는 이를 '''크게 네 가지'''로 정리했다(🎙 9/1 39:37). 자세히는 [[탈진실의 취약성 요인]].\n\n{| class=\"table\"\n! # || 요인 || 슬라이드 핵심 || 연결 개념\n|-\n| ① || '''[[탈진실의 취약성 요인|거짓뉴스(가짜뉴스)]]''' (p.12) || 2016 미국 선거 기간 트위터의 6%가 거짓 뉴스, 거짓은 더 멀리·빠르게·심층적으로 확산. '''\"진실은 기어가지만, 거짓은 날아간다\"''' || —\n|-\n| ② || '''[[탈진실의 취약성 요인|반복]]''' (p.13) || 반복될수록 진실이라는 확신도↑. '''삼인성호(三人成虎)''' || p.4 우연한 관찰의 진리화\n|-\n| ③ || '''[[탈진실의 취약성 요인|강력한 사례의 가용성]]''' (p.14) || 자극적·강력한 예시 → 위험성 과대 추정(사고·범죄) || [[가용성 어림법]], [[인지적 구두쇠]]\n|-\n| ④ || '''[[탈진실의 취약성 요인|집단 정체성]]''' (p.15) || 내집단/외집단 편향, 같은 생각끼리 어울림 → 유리한 정보만 선택 취득 || [[확증 편향]]\n|}\n\n[[img:L1-14.png|1장 p.14 — 강력한 사례 → 쉽게 연상 → 실제보다 과대평가. 교통사고 비율: 자동차 VS 지하철|medium]]\n\n[[img:L1-15.png|1장 p.15 — 내 집단 vs 외부 집단: 내집단/외집단 간의 갈등|small]]\n\n{exam}\n교수(🎙 9/1 55:10): 「이 '''네 요인은 결국 하나로 맞물려 작동'''한다」 — 가짜뉴스는 자극적이라 기억에 남고(가용성) → 반복 재생산되고(반복) → 자기 성향에 맞는 것만 받아들여진다(집단 정체성·확증 편향). 객관식은 '''사례 → 요인 매칭'''(지하철 사고 경험 → 강력한 사례의 가용성)으로 나온다(bank).\n{/exam}\n\n== p.16 — 과학적 방법: 심리과학의 연구 과정 ⭐⭐⭐ ==\n\n[[img:L1-16.png|1장 p.16 — 심리과학의 연구 과정: 연구와 관찰 → 이론 → 가설 → 다시 관찰로 도는 순환|medium]]\n\n<pre class=\"ascii\">\n 1. 현상/문제 인식\n        ↓\n 2. '''[[이론]]''' 제시     = 관찰을 체제화하고 행동/사건을 예측하는 원리의 '''통합적 설명'''\n        ↓\n 3. '''[[가설]]''' 수립     = 이론을 기반으로 도출한 '''검증 가능한 예측'''\n        │                  + '''[[조작적 정의]]''' = 개념·연구 절차에 대한 '''정확한 진술'''\n        ↓\n 4. 연구 설계 및 집행  = 가설을 검증할 적절한 연구 방법 구성\n        ↓\n 5. 데이터 분석 및 해석 = 기존 이론의 '''지지 · 반박 · 확장'''  ──→ 다시 2로 (순환)\n<\/pre>\n\n교수 예시(🎙 9/1 1:02:13): 이론 \"수면이 기억을 증진시킨다\" → 가설 \"수면을 박탈하면 기억이 더 떨어질 것이다\" → '''조작적 정의''': 수면 박탈 = '''최근 24시간 동안 수면 1시간 미만''', 기억 = '''기억력 검사의 정답 항목 수'''. 「가설은 '''측정할 수 있는 형태로 재정립'''해야 한다」. 조작적 정의의 기준은 연구자 임의가 아니라 '''선행 문헌'''이 근거. → [[과학적 방법]]\n\n{warn}\n'''[[조작적 정의]](Operational Definition) ≠ 5장 [[조작적 조건화]](Operant Conditioning).''' 이름만 비슷하고 전혀 다른 개념이다. 하나는 연구 방법(개념을 측정 가능하게 진술), 하나는 학습 이론(행동의 결과로 학습).\n{/warn}\n\n== p.17 — 연구 방법 ①: 기술적 방법 ⭐⭐⭐ ==\n\n[[img:L1-17.png|1장 p.17 — 기술적 방법의 목표(현상 관찰 → 현상 기술)와 유형(사례 연구·자연 관찰·사회조사)|medium]]\n\n[[연구 방법 비교|기술적 방법]](descriptive methods)은 현상에 대한 '''기술(description)'''을 중점으로 두는 방법이다. 어떤 행동·패턴·사회 현상이 '''실제로 발생하고 있음을 제시'''하는 것이 목표이고, 연구 초기에 어떤 현상에 접근할 때 유용하다. 종류는 셋: [[사례 연구]](Case Study), [[자연 관찰]](Natural Observation), [[사회조사]]와 인터뷰(Survey).\n\n{exam}\n교수(🎙 9/1 1:17:18): 「이 소개 범위에서 '''직접적인 통제나 조작을 가하는 연구 방법은 실험법 딱 하나'''」. 기술적 방법 세 가지는 '''왜''' 일어나는지 설명할 수 없고, 현상이 일어남을 보여 줄 뿐이다.\n{/exam}\n\n== p.18 — 사례 연구 (Case Study) ⭐⭐⭐ ==\n\n[[img:L1-18.png|1장 p.18 — 사례 연구의 예시: 소수를 돋보기로 깊이 들여다보는 '깊이 있는 이해'|small]]\n\n'''소수의 개인이나 집단을 집중적으로 관찰하고 심층 분석'''하는 기법. 후속 연구의 방향성을 설정하는 기반이 될 수 있지만, '''대표적이지 않은 개별 사례는 결과를 오도'''할 수 있고 '''일반화하기 어렵다'''. → [[사례 연구]]\n\n== p.19 — 자연 관찰 (Natural Observation) ⭐⭐⭐ ==\n\n[[img:L1-19.png|1장 p.19 — 시간대에 따른 트위터 용어 사용 추세(Golder & Macy, 2011): 하루 동안 긍정 단어 비율이 출렁인다|medium]]\n\n'''자연 활동에서의 행동을 기록'''하는 방법(예: 아동 행동 관찰). 현상 설명은 어렵지만 현상 자체를 명확히 제시한다. 본래 소규모였으나(Provine, 2012) 지금은 SNS·리뷰 등 '''빅데이터'''로 대규모 연구가 가능해 \"거대 과학\"이 되었다. '''행동에 영향을 미칠 수 있는 요인은 통제하지 않고''' 진행한다. → [[자연 관찰]]\n\n== p.20–21 — 사회조사 (Survey)·말표현 효과·무선 표집 ⭐⭐⭐ ==\n\n[[img:L1-20.png|1장 p.20 — 설문을 통한 사회조사와 말표현 효과: 찬성을 유도하는 어휘(극빈자 지원) vs 반대를 유도하는 어휘(복지)|medium]]\n\n[[사회조사]] = 설문지·인터뷰 등을 통한 '''자기보고식''' 연구 방법. 많은 사례를 간편하게 수집하지만 약점이 둘이다.\n# 응답자가 자신의 응답을 '''사회적으로 바람직한 방향으로 위장'''할 수 있다.\n# '''[[말표현 효과]]''' — 문항을 구성하는 어휘에 따라 참가자의 응답이 달라지는 효과(극빈자 지원 vs 복지, 총기 안전법 vs 총기 통제법, 선전적 심문 vs 고문…).\n\n[[img:L1-21.png|1장 p.21 — 무선 표집의 원칙: ① 모집단(전체 구성원) → ② 무선 표집 과정(추첨) → ③ 표본|medium]]\n\n'''[[무선 표집]]''': 모집단의 인원이 '''동등하게 참여할 기회'''를 지니도록 표집한다. '''표본 수가 많아도 대표성이 없으면 바람직한 표본이 될 수 없다.''' 사회조사뿐 아니라 실험 모집에서도 동일하게 적용된다.\n\n{exam}\n교수(🎙 9/1 1:23:51): 「'''표본 수가 큰 것보다 대표성을 띠는 표본이 더 중요'''하다」 — \"표본만 크면 된다\"는 보기는 오답.\n{/exam}\n\n== p.22 — 상관 (Correlation) ⭐⭐⭐ ==\n\n[[img:L1-22.png|1장 p.22 — 상관 구도의 유형: 완벽한 정적 상관(+1.00), 상관 없음(0.00), 완벽한 부적 상관(−1.00). 오른쪽 빨간 글씨 = 교수 강조|medium]]\n\n{def}\n'''설명''': 두 변인이 함께 변하는 정도에 대한 측정치(−1~1). 한 변인이 다른 변인을 얼마나 잘 예측할 수 있는지를 시사 (1장 p.22)\n'''명칭''': [[상관]] (Correlation)\n{/def}\n\n* '''[[착각 상관]]''': 실제로는 관계가 없으나, 관계가 있다고 강하게 지각하는 현상.\n* '''[[평균으로의 회귀]]''': 극단적이거나 이례적인 사건은 평균 방향으로 되돌아오는 경향성.\n* 상관은 두 변인 간의 '''연관성을 보여 줄 수는 있으나 인과성을 입증해 주는 지표는 아님''' — '''예측은 할 수 있지만, 설명을 할 수는 없음''', 두 변인에 영향을 줄 수 있는 '''[[제3의 변인]]'''이 존재할 수 있기 때문.\n\n[[anim:correlation_not_causation|아이스크림 소비와 식중독이 함께 오르는 산점도를 본 뒤, 위에서 '기온' 상자가 내려오는 순간을 놓치지 말 것 — 그게 제3의 변인이다]]\n\n{exam}\n교수(🎙 9/1 1:29:10): 「'''상관은 인과성을 입증하는 지표가 아니다 — 굉장히 중요한 사안'''」. 슬라이드에서도 이 문장만 '''빨간 글씨'''다. 노트 예: 식중독 발병률과 아이스크림 소비율(제3의 변인 = 날씨·기온).\n{/exam}\n\n== p.23 — 실험법 (Experiment) ⭐⭐⭐ ==\n\n[[img:L1-23.png|1장 p.23 — 실험법의 예시: 참가자 → 무선 할당 → 새 토익 학습법(실험 조건) vs 기존 학습법(통제 조건)|medium]]\n\n{def}\n'''설명''': 관심 변인에 대한 처치를 가하고, 다른 변인을 일정하게 유지하여 처치 변인의 효과를 인과적으로 검증하는 방법 (1장 p.23)\n'''명칭''': [[실험법]] (Experiment)\n{/def}\n\n* '''[[실험법|실험 조건]](집단)''': 실제 처치를 가하는 조건 혹은 집단.\n* '''[[실험법|통제 조건]](집단)''': 실험 처치를 받지 않는 조건 혹은 집단.\n* '''[[무선 할당]]''': 모집된 실험 참가자를 실험 조건과 통제 조건에 '''확률을 기반으로 무작위 할당'''하여 '''기존에 존재하던 개인차의 영향을 최소화'''하는 기법. (슬라이드에서 \"무선 할당이\" 가 빨간 글씨)\n\n교수 예시(🎙 9/1): 새 토익 학습법의 효과를 보려는데, 원래 토익 점수가 높은 학생들이 우연히 한쪽 집단에 몰리면 결과를 믿을 수 없다 → 무선 할당.\n\n== p.24 — 가짜약 조건(Placebo)과 이중 은폐 ⭐⭐⭐ ==\n\n[[img:L1-24.png|1장 p.24 — 신약 투여(실험 조건) VS 위약 투여(가짜약 조건, Placebo) VS 투여 없음|medium]]\n\n'''[[가짜약 효과|가짜약 조건]](Placebo)''': 의약·심리치료법 개발에 쓰는 실험 조건으로, 특정 요인에 대한 '''처치를 참가자가 받았다고 착각하게 만드는 조건'''이다. 처치를 받았다는 '''‘인지’'''에 의한 효과인지 정말 '''‘처치’'''의 효과인지 비교할 수 있다. '''참가자뿐 아니라 실험자도''' 어떤 집단이 가짜약 조건인지 모르면 '''[[이중 은폐]] 절차(Double-blind)'''를 적용한 것이다. 가짜약 효과는 일상에서도 보고된다 — 디카페인 커피의 위약 효과(Dawkins et al., 2011), 우울·불안으로 인한 청각적 환각 완화(Dolfus et al., 2016; Kirsch, 2010).\n\n[[anim:experiment_design|모집단 → 무선 표집 → 동전으로 무선 할당 → 세 조건 → 눈가리개(이중 은폐) 순서를 따라가며, 각 단계가 무엇을 막는지 말해 볼 것]]\n\n== p.25 — 연구 방법 간 비교 ⭐⭐⭐ ==\n\n[[img:L1-25.png|1장 p.25 — 연구 방법 간 비교 표: 기술적 방법 / 상관 연구 / 실험|large]]\n\n{| class=\"table\"\n! 방법 || 기본 목적 || 수행 방법 || 처치 || 약점\n|-\n| '''[[연구 방법 비교|기술적 방법]]''' || 행동을 관찰 및 기록 || [[사례 연구]], [[자연 관찰]], [[사회조사]] || 없음 || 변인 통제 불가, 개별 사례가 결과 오도 가능\n|-\n| '''[[상관|상관 연구]]''' || 한 변인이 다른 변인을 예측하는 정도를 평가 || 둘 이상의 변인에 대한 데이터 수집 후 상관 분석 || 없음 || 원인과 결과를 명세하지 못함\n|-\n| '''[[실험법|실험]]''' || '''원인과 결과 탐색''' || 하나 이상의 변인에 처치를 가하며, '''[[무선 할당]]''' 활용 || 하나 이상의 '''[[실험법|독립변인]]''' || 결과를 다른 상황에 일반화하지 못할 수 있음, 주제에 따라 사용 불가, 특정 변인에 처치 불가(윤리적 문제)\n|}\n\n[[sim:research_methods]]\n\n{warn}\nbank 함정 보기: \"상관 연구는 처치를 가해야 해서 윤리 문제가 잦다\"(✗ — 상관 연구는 처치 '''없음'''), \"실험은 변인을 통제하지 않아 인과를 검증 못 한다\"(✗ — 정반대), \"표본 수만 크면 대표성 문제 없음\"(✗). 실험의 진짜 약점은 '''일반화'''와 '''윤리'''다.\n{/warn}\n\n== p.26–27 — 연구 윤리 ⭐⭐⭐ ==\n\n[[img:L1-26.png|1장 p.26 — 심리학의 인간 대상 연구(면담·설문조사·인지 과제)와 동물 대상 연구(학습 행동·생리적 반응·행동 분석)|medium]]\n\n심리학은 쥐를 활용한 [[편도체]] 실험, 뇌 손상 환자 연구, 사회적 의사결정 탐구 등 인간·동물 대상 실험을 집행한다. 세계 각국은 '''[[기관 생명 윤리 위원회|뉘른베르크 강령, 헬싱키 선언, 벨몬트 보고서]]'''의 취지를 따른 윤리 지침을 요구한다. 교수(🎙 9/1): 앞의 둘은 나치 독일의 인체 실험, 벨몬트 보고서는 1970년대 미국의 터스키기 매독 실험이 계기.\n\np.27 연구 윤리 준수의 필요성 (글자 슬라이드):\n* 연구 시작 전 참가자로부터 '''[[고지된 동의]](informed consent)'''를 받고, 연구로 인한 모든 불편함과 상해로부터 보호해야 한다.\n* 참가자 개인 정보는 비밀에 붙이고, 실험 종료 후 실험에 대한 상세한 설명('''[[디브리핑]], debriefing''')을 전달한다.\n* 각 연구 기관에 배치된 '''[[기관 생명 윤리 위원회]](Institutional Review Board, IRB)'''에서 '''사전 연구 승인'''이 필요하다 — 대학 등에서 인간·동물 대상 연구의 '''윤리적 적합성을 검토'''.\n\n== p.28–29 — 번외: IRB를 통한 연구 승인 절차 ⭐⭐ ==\n\n[[img:L1-28.png|1장 p.28 — 기관 생명 윤리 위원회(IRB) 연구 승인 절차: 서류 제출 → 양식 검토·1차 수정 → 본 심의 → 2차 심의 → 승인 결과 통보|medium]]\n\n주요 심의 내용 다섯 가지: ① 연구 내용 및 실험 방법 ② '''모집 표본 수'''(인원 수와 그 '''객관적 근거''', '''승인받은 인원 초과 모집 금지''' — 증원 시 변경 심의) ③ 참가자 '''보상'''(구체적 금액 및 '''재원''') ④ 개인 정보 수집 범위 및 보호 방안 ⑤ 참가자에게 발생할 수 있는 위험 요소. 슬라이드 빨간 글씨 = 모집 표본 수.\n\n{exam}\n교수(🎙 9/1 1:59:03–2:01:20): IRB가 특히 중시하는 것 = '''모집 인원수와 객관적 근거'''(선행 논문·검정력 계산), '''참가자 보상의 재원'''. 「'''승인 전에 참가자를 모집하면 연구 윤리 위반'''」. 참가자가 그만두고 싶다면 '''이유 불문 즉시 중단'''. bank 단답형 정답: '''기관 생명 윤리 위원회(IRB)'''.\n{/exam}\n\n{info}\n범위 밖(기말): p.30–34(통계적 추리: 기술통계·추론통계)는 '''중간고사 범위 밖'''이다(🎙 9/22 2:12:52: \"1장은 29번 슬라이드까지\"; 9/1 수업 2:02:13 이후 부분). 이 위키에서는 다루지 않는다.\n{/info}\n\n== 🎙 실제 수업 기록 (9/1 화, 녹음본 기준) ==\n\n* '''도입 (00:00–03:31)''': 서막의 [[생물심리사회적 접근법]] 복습 → 오늘은 (1) 심리학이 왜 과학성을 추구하나 (2) 어떻게 연구하나. 「심리학의 목표 = 마음이 어떻게·왜 작동하는지에 대한 '''객관적·과학적 설명''', 원인과 결과의 '''인과성 탐구'''」(02:27).\n* '''초킹 실험 (04:38–05:39)''': 추가 고지로 압박받은 집단의 정답률이 낮았다.\n* '''상식적 사고의 세 현상 (08:04~)''': [[후견 편향]](콜럼버스의 달걀 09:03, 월드컵 10:59–12:18), [[과신]](테틀록 15:12 — 80% 확신 사건 적중률 40% 미만, 슈퍼 예측자 약 2% 16:06, 단어 완성 과제 17:02–20:48), [[무선적 사건에서의 질서 지각]](25:11–30:39 — 동전 던지기, 근접성 원리, 첫 수업일 8/25가 교수의 졸업일과 같은 우연). [[메타인지]](20:48–25:11)는 교재에 없는 추가 내용.\n* '''탈진실 (30:39–39:37)''': 범죄율 인식 vs 실제, 이민자 투옥 가능성 44% 낮음(33:53), 정당 편향성 = 진영 논리·확증 편향(34:55), 국내 범죄율 큰 변동 없음(37:11).\n* '''취약성 4요인 (39:37~)''': 가짜뉴스(40:45), 반복(삼인성호·사회적 동조 실험 43:49–46:53), 강력한 사례의 가용성([[가용성 어림법]]·[[인지적 구두쇠]] 47:55–54:11), 집단 정체성(54:11). 「네 요인이 결국 하나로 맞물려 작동」(55:10).\n* '''연구 과정 5단계 (1:00:09)''': 교재는 3단계지만 세부적으로는 5단계. 조작적 정의 예시(1:02:13–1:05:21).\n* '''기술적 방법 (1:09:48)''': 셋 다 설명 불가·통제 없음. 「직접적인 통제나 조작을 가하는 방법은 실험법 딱 하나」(1:17:18). 사회조사의 두 리스크(1:18:18–1:19:57), 「표본 수가 큰 것보다 대표성을 띠는 표본이 더 중요」(1:23:51).\n* '''상관 (1:24:51)''': 정적/부적/무상관, 착각 상관, 평균으로의 회귀(야구팀 감독 비난 예 1:26:12). 「상관은 인과성을 입증하는 지표가 아니다 — 굉장히 중요한 사안」(1:29:10).\n* '''실험법 (1:31:48)''': 실험 조건 vs 통제 조건, 무선 할당(1:34:42), 플라시보 조건(1:36:38), 교수의 tACS(경두개 교류 자극) 가짜 자극 경험, 디카페인 커피. 연구 방법 비교(1:44:22–1:49:44).\n* '''연구 윤리 (1:49:44–2:02:13)''': 뉘른베르크 강령·헬싱키 선언·벨몬트 보고서(1:50:29–1:53:30), 고지된 동의·중단 권리·비밀 보장·기만 후 디브리핑(1:53:30–1:56:08), IRB(1:56:08 — 보건복지부 감독, 승인 전 모집은 위반 1:58:04, 인원수 근거·보상 재원 1:59:03–2:01:20).\n\n{joke}\n교수가 2014년에 직접 지하철 사고를 겪었다는 이야기는 p.14 [[가용성 어림법]]의 살아 있는 예시가 되었다. 통계상으로는 자동차가 훨씬 위험한데도, 겪어 본 사람에게는 지하철이 더 무섭다. 시험지에 \"A씨는 2014년에…\"가 나오면 교수 본인 이야기다.\n{/joke}\n\n== 시험 대비 핵심 요약 ==\n\n# 심리과학의 목표 = '''과학적이고 재현 가능한 설명''', 견해와 검증된 결론 구분, '''인과성 탐구'''.\n# 상식적 사고의 세 현상: '''[[후견 편향]]'''(결과 안 뒤 \"그럴 줄 알았어\"), '''[[과신]]'''(실제보다 더 안다고 믿음, 테틀록 80% → 40% 이하), '''[[무선적 사건에서의 질서 지각]]'''(→ 착각 상관·평균으로의 회귀). '''[[메타인지]]''' = 인지에 대한 인지, 이들을 줄인다.\n# '''[[탈진실]]''' 취약성 4요인: 거짓뉴스 · 반복(삼인성호) · 강력한 사례의 가용성([[가용성 어림법]], [[인지적 구두쇠]]) · 집단 정체성([[확증 편향]]).\n# 연구 과정: 현상 인식 → '''[[이론]]'''(통합적 설명) → '''[[가설]]'''(검증 가능한 예측) + '''[[조작적 정의]]''' → 설계·집행 → 분석·해석(지지·반박·확장).\n# 세 연구 방법: '''기술적 방법'''(관찰·기록, 통제 불가) / '''상관'''(예측 O, 인과 X) / '''실험'''(인과 탐색, 일반화·윤리 한계). → [[연구 방법 비교]]\n# 기술적 방법 3종: [[사례 연구]](일반화 곤란) · [[자연 관찰]](통제 없음, 빅데이터) · [[사회조사]](응답 위장, '''[[말표현 효과]]''').\n# '''[[무선 표집]]'''(모집단 → 표본, 대표성) vs '''[[무선 할당]]'''(표본 → 실험/통제 조건, 개인차 최소화). '''표본은 크기보다 대표성.'''\n# '''상관 ≠ 인과''', [[제3의 변인]](아이스크림-식중독-기온). [[착각 상관]](없는 관계를 봄) vs [[평균으로의 회귀]](극단 뒤 평균으로).\n# '''조작·통제가 가능한 방법은 [[실험법]]뿐.''' 실험 조건 vs 통제 조건, 독립변인. [[가짜약 효과|가짜약 조건]](처치 받았다고 착각) + '''[[이중 은폐]]'''(참가자·실험자 모두 모름).\n# 연구 윤리: [[고지된 동의]], 상해로부터 보호, 비밀 보장, [[디브리핑]], '''[[기관 생명 윤리 위원회|IRB]] 사전 승인'''. 심의: 연구 방법, 모집 인원(객관적 근거·초과 금지), 보상(금액·재원), 개인 정보, 위험 요소.\n\n== 관련 문서 ==\n* 상식의 함정: [[후견 편향]] · [[과신]] · [[메타인지]] · [[무선적 사건에서의 질서 지각]]\n* 탈진실: [[탈진실]] · [[탈진실의 취약성 요인]] · [[가용성 어림법]] · [[인지적 구두쇠]] · [[확증 편향]]\n* 과학적 방법: [[과학적 방법]] · [[이론]] · [[가설]] · [[조작적 정의]]\n* 연구 방법: [[연구 방법 비교]] · [[사례 연구]] · [[자연 관찰]] · [[사회조사]] · [[말표현 효과]] · [[무선 표집]]\n* 상관: [[상관]] · [[착각 상관]] · [[평균으로의 회귀]] · [[제3의 변인]]\n* 실험: [[실험법]] · [[무선 할당]] · [[가짜약 효과]] · [[이중 은폐]]\n* 윤리: [[고지된 동의]] · [[디브리핑]] · [[기관 생명 윤리 위원회]]\n* 앞뒤 장: [[서막 심리학 이야기]] · [[2장 마음의 생물학과 의식]] · 시험 대비 [[명칭 암기표]] · [[자주 틀리는 함정 모음]] · [[모의고사 복기]]"

  "body": "'''후견 편향'''(Hindsight Bias)은 [[1장 심리과학을 비판적으로 생각하기|1장]]이 소개하는 \"상식적 사고에서의 보편적 현상\" 세 가지 중 첫째다. 한 줄로 줄이면 '''\"내 그럴 줄 알았어\"'''. 결과를 알고 나면 그 결과가 처음부터 뻔했던 것처럼 느껴지는 착각이다.\n\n{def}\n'''설명''': 실제로는 결과를 예측할 수 없었으나, 결과를 알고 난 후 자신이 그 결과를 예측할 수 있었다고 믿는 경향 (1장 p.5)\n'''명칭''': [[후견 편향]] (Hindsight Bias)\n{/def}\n\n{def}\n'''사례형 설명''': 시우는 축구 경기 결과를 확인한 뒤 「내 그럴 줄 알았다니까, 처음부터 그렇게 될 것 같았어」라고 말한다. 그러나 경기 전에는 누구에게도 결과를 확신 있게 예측하지 못했다.\n'''명칭''': [[후견 편향]]\n{/def}\n\n[[img:L1-05.png|1장 p.5 — 사건 발생 전: \"내 생각에 아마 이런 일이 일어날 것 같아\"(결과는 알 수 없음, 확신도 낮음) → 사건 발생 후: \"역시 내가 그럴 줄 알았어!\"(처음부터 내가 맞았다고 확신)|medium]]\n\n{analogy}\n후견 편향은 '''정답지를 본 뒤에 문제를 다시 읽는 것'''이다. 정답을 알고 나서 보면 모든 문제가 \"이거 쉬운데?\" 싶다. 하지만 정답지를 덮고 시험장에 앉아 있을 때 그 문제를 확실히 풀 수 있었는지는 전혀 다른 이야기다. 시험 끝나고 \"아 그거 알았는데!\"라는 친구가 바로 후견 편향의 현장이다.\n{/analogy}\n\n== 슬라이드 내용 (p.5) ==\n* 실제로는 결과를 예측할 수 없었으나, 결과를 알고 난 후 자신이 그 결과를 예측할 수 있었다고 믿는 경향.\n* 다양한 학술 논문의 연구 결과들은 후견 편향이 '''연령·문화와 무관하게 발생하는 보편적 현상'''임을 시사(Roese & Vohs, 2012).\n* 어떤 상황에 대한 '''예측 자체는 굉장히 어려운 일'''.\n* 2026 북중미 월드컵 승패 예측해 보기: 대한민국 vs 남아공 / 체코 / 멕시코 — \"이 경기 중 확신을 갖고 결과를 예측했으며 맞았다라고 말할 만한 경기가 있었는가?\"\n\n노트 예시: '''콜럼버스의 달걀''' — 아무도 달걀을 세우지 못했는데 콜럼버스가 한쪽을 깨뜨려 세우자 \"그건 누구나 할 수 있다\"고 말했다. 결과를 보고 나면 당연해 보인다.\n\n{exam}\n교수(🎙 9/1 12:18): 「경기가 끝난 뒤 '''\"역시 이렇게 될 줄 알았어\"'''를 한 번이라도 생각했다면 후견 편향에 잡힌 것」. 결과에 영향을 주는 요인이 너무 많아 예측은 원래 어렵고, 모든 요인을 계산하는 건 피곤한 일이라 사람의 사고는 에너지를 아끼는 쪽으로 발전했다(→ [[인지적 구두쇠]]). bank 단답형 정답.\n{/exam}\n\n== 헷갈리는 짝 ==\n{| class=\"table\"\n! 구분 || 후견 편향 || [[과신]] || [[착각 상관]]\n|-\n| 언제 생기나 || 결과를 '''안 뒤''' || 결과를 '''알기 전'''(예측·판단 시점) || 두 사건을 함께 볼 때\n|-\n| 착각의 내용 || \"나는 예측할 수 있었다\" || \"나는 실제보다 더 많이 안다\" || \"두 사건은 관계가 있다\"\n|-\n| 대표 예 || 콜럼버스의 달걀, 월드컵 결과 || 테틀록의 전문가(80% 확신 → 40% 이하 적중) || 우연의 일치에 의미 부여\n|}\n\n{warn}\n\"과신은 후견 편향에 의해서도 생성될 수 있다\"(p.6)는 슬라이드 문장이 있으므로 둘은 '''연결'''되지만 '''같은 개념은 아니다'''. 시점(결과 전/후)으로 구분하라. 둘 다 [[메타인지]]가 발달하면 줄어든다(p.7).\n{/warn}\n\n== 관련 문서 ==\n* [[과신]] · [[메타인지]] · [[무선적 사건에서의 질서 지각]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.5"
 },
 "과신": {
  "title": "과신 (Overconfidence)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "용어"
  ],
  "body": "'''과신'''(Overconfidence)은 \"상식적 사고에서의 보편적 현상\" 둘째로, '''내가 아는 양을 실제보다 크게 잡는''' 경향이다. 전문가도 예외가 아니라는 것이 핵심이고, 그 증거가 테틀록의 전문가 예측 연구다.\n\n{def}\n'''설명''': 실제로 알고 있는 것보다 더 많이 알고 있다고 생각하는 경향. 개인의 주관적 확신도와 실제 사실 간에 괴리가 발생 (1장 p.6)\n'''명칭''': [[과신]] (Overconfidence)\n{/def}\n\n[[img:L1-06.png|1장 p.6 — \"이 정도는 다 알고 있지!\" 내가 안다고 생각하는 양(큰 원) vs 실제로 아는 양(작은 원). 아래: 단어 완성하기 과제(Goranson, 1978)|medium]]\n\n{analogy}\n과신은 '''배터리 잔량 표시가 고장 난 휴대폰'''이다. 화면엔 80%라고 뜨는데 실제로는 40%도 안 남아서, 믿고 외출했다가 길에서 꺼진다. 테틀록의 전문가들이 정확히 이 상태였다 — \"80% 확신\"이라고 표시했지만 실제 적중률은 40% 이하.\n{/analogy}\n\n== 슬라이드 내용 (p.6) ==\n* 실제로 알고 있는 것보다 더 많이 알고 있다고 생각하는 경향성.\n* 개인의 주관적 확신도와 실제 사실 간에는 괴리가 발생(테틀록, 1998, 2005).\n* 극소수의 사람들만이 슈퍼 예측자로서 정확하게 사회 행동을 예측(테틀록 & 가드너, 2016).\n* '''과신은 [[후견 편향]]에 의해서도 생성될 수 있음.'''\n* 단어 생성해 보기: 무작위로 배열된 철자를 하나의 단어로 재구성 — 시작 전 몇 초 걸릴지 먼저 예상하고, 과제 직후 시간을 재서 비교.\n\n=== 테틀록 ===\n{def}\n'''설명''': 세계적 사건에 대한 전문가 예측을 수집해, 전문가의 주관적 확신도와 실제 사실 사이의 괴리(과신)를 보여 준 연구자 (1장 p.6)\n'''명칭''': [[과신|테틀록]] (Tetlock, 1998, 2005)\n{/def}\n노트·🎙 9/1(15:12): 전문가 예측 약 2만 7천–2만 8천 개를 모았더니, 전문가들이 '''평균 80% 확신'''을 보인 사건의 실제 예측 정확도는 '''40% 이하'''였다. 지식이 많다고 과신에서 자유로운 것이 아니다.\n\n=== 슈퍼 예측자 ===\n{def}\n'''설명''': 사회 행동을 정확하게 예측하는 극소수의 사람들 (1장 p.6; 테틀록 & 가드너, 2016)\n'''명칭''': [[과신|슈퍼 예측자]] (Superforecaster)\n{/def}\n교수(🎙 9/1 16:06): 약 '''2%'''. 요인을 하나하나 검증하고 상충되는 주장을 비교하는 이상적인 접근은 시간과 정신 자원이 너무 많이 든다.\n\n=== 단어 완성하기 과제 (Goranson, 1978) ===\n<pre class=\"ascii\">\n 슬라이드 예시     WREAT → WATER    ETRYN → ENTRY    GRABE → BARGE\n 수업 과제         OCHSA → ?        (정답: CHAOS)\n\n ① 시작 전: \"몇 초 걸릴까?\" 예상 적기\n ② 실제로 풀면서 시간 재기\n ③ 비교 →  예상 < 실제   = '''과신''' 경향\n            예상 ≈ 실제   = 자기 능력을 정확히 인식\n            예상 > 실제   = 보수적 기준\n<\/pre>\n\n{quiz}\n테틀록의 전문가 예측 연구에 대한 설명으로 옳은 것은? ① 전문가는 지식이 풍부해 과신에서 자유로웠다 ② 평균 80% 확신도를 보인 사건의 실제 정확도는 40% 이하였다 ③ 슈퍼 예측자가 전문가의 절반 이상이었다 ④ 정확도는 확신도에 정비례했다\n{/quiz}\n{answer}\n'''②'''. ①은 결과와 정반대(전문가도 과신), ③ 슈퍼 예측자는 극소수(약 2%), ④ 확신도와 정확도는 '''괴리'''됐다는 것이 연구의 요지다. (bank ch1 MC, 1장 p.6)\n{/answer}\n\n== 헷갈리는 짝 ==\n{| class=\"table\"\n! 구분 || 과신 || [[후견 편향]]\n|-\n| 시점 || 결과를 '''모를 때''' \"나는 안다\" || 결과를 '''안 뒤''' \"나는 알았다\"\n|-\n| 핵심 수치/예 || 80% 확신 → 40% 이하 적중 || 콜럼버스의 달걀, 월드컵\n|-\n| 관계 || 후견 편향이 과신을 만들 수 있음 || —\n|}\n\n{tip}\n과신을 줄이는 능력이 [[메타인지]]다(p.7). \"내가 정말 아는가?\"를 점검하는 습관 — 6장 [[검증 효과]]처럼 스스로 시험 보기가 실전 처방이다.\n{/tip}\n\n== 관련 문서 ==\n* [[후견 편향]] · [[메타인지]] · [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.6"
 },
 "메타인지": {
  "title": "메타인지 (Metacognition)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "용어"
  ],
  "body": "'''메타인지'''(Metacognition, 슬라이드 표기 Meta Cognition)는 '''\"인지에 대한 인지\"''' — 내가 무엇을 알고 무엇을 모르는지, 지금 어떻게 생각하고 있는지를 한 발 떨어져서 아는 능력이다. 1장 p.7에 '''번외'''로 붙은 슬라이드인데, 교수가 교재에 없는 내용을 논문에서 찾아 추가했다(🎙 9/1).\n\n{def}\n'''설명''': '인지에 대한 인지'(Flavell, 1979). 나의 인지 능력과 그 과정, 사고에 대한 범위와 알고 있는 것·모르는 것 등에 대한 인지 능력 (1장 p.7)\n'''명칭''': [[메타인지]] (Metacognition)\n{/def}\n\n[[img:L1-07.png|1장 p.7 — 메타인지의 구도: \"내가 지금 어떻게 생각하고 있지?\" 목표 설정 → 이해 점검 → 전략 조절, 점검과 조절이 순환한다|medium]]\n\n{analogy}\n메타인지는 '''게임 화면의 미니맵'''이다. 플레이어(인지)는 눈앞의 적만 보고 싸우지만, 미니맵(메타인지)을 보면 \"나 지금 어디 있지? 어디가 아직 안 밝혀졌지?\"가 보인다. 미니맵을 자주 보는 사람은 길을 잃었는데 맞는 길이라고 우기는 일([[과신]])이 줄어든다.\n{/analogy}\n\n== 슬라이드 내용 (p.7) ==\n* '인지에 대한 인지'(Flavell, 1979).\n* 나의 인지 능력과 그 과정, 사고에 대한 범위와 알고 있는 것 모르는 것 등에 대한 인지 능력(Efklides, 2006; Flavell, 1979).\n* '나는 나의 사고와 인지에 대해서 알고 있다'.\n* '''자기 객관화'''를 통해 필요한 능력으로 볼 수 있음.\n* 메타인지의 발전 → 내면 사고에 대한 인지 확장 → '''[[후견 편향]]/[[과신]] 감소'''.\n\n교수(🎙 9/1 20:48–25:11): 메타인지가 좋으면 학습 중에 중간 점검을 해서 목표를 상향 조정하거나, 현실적으로 하향 조정할 수 있다.\n\n<pre class=\"ascii\">\n       ┌─────────── 메타인지 (나를 보는 나) ───────────┐\n       │   목표 설정   →   이해 점검   →   전략 조절   │\n       └──────┬──────────────────────────────▲──────────┘\n         점검 │                              │ 조절\n              ▼                              │\n        [ 인지: 읽기·풀기·기억하기 ] ─────────┘\n   메타인지 ↑  →  후견 편향 ↓ , 과신 ↓\n<\/pre>\n\n{tip}\n시험 공부에 바로 쓰는 메타인지: 이 위키의 ❓ 예상문제 박스를 정답 보기 전에 먼저 소리 내어 답해 보라. 맞았는지 틀렸는지가 곧 \"아는 것 / 안다고 착각한 것\"의 지도다(6장 [[검증 효과]]와 같은 원리).\n{/tip}\n\n== 헷갈리는 짝 ==\n{| class=\"table\"\n! 구분 || 메타인지 || [[과신]] || [[후견 편향]]\n|-\n| 정의 || 인지에 대한 인지 || 실제보다 더 안다고 믿음 || 결과 안 뒤 예측할 수 있었다고 믿음\n|-\n| 관계 || '''해독제''' — 발전하면 오른쪽 둘이 감소 || 메타인지 부족의 증상 || 메타인지 부족의 증상\n|}\n\n== 관련 문서 ==\n* [[과신]] · [[후견 편향]] · [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.7"
 },

  "body": "'''무선적 사건에서 질서 지각하기'''는 \"상식적 사고에서의 보편적 현상\" 셋째다. 사람은 '''우연을 우연으로 두지 못한다''' — 무작위로 흩어진 점에서도 선을 긋고, 동전의 연속된 앞면에서 \"흐름\"을 본다.\n\n{def}\n'''설명''': 사람은 세상을 의미 있는 것으로 이해하고자 하므로, 무선 배열을 무선적이지 않은 것으로 인식하는 경향 (1장 p.8)\n'''명칭''': [[무선적 사건에서의 질서 지각|무선적 사건에서 질서 지각하기]]\n{/def}\n\n[[img:L1-08.png|1장 p.8 — 우연히 벌어진 사건들 → \"어? 뭔가 패턴이 있는 것 같은데?\" → 무언가 패턴처럼 인식. 아래: 지각에서의 집단화 원리(가까운 선끼리 묶이고, 끊긴 원들 사이에 삼각형이 보인다)|medium]]\n\n{analogy}\n'''밤하늘의 별자리'''가 이것이다. 별들은 서로 수백 광년씩 떨어져 아무 관계도 없이 흩어져 있는데, 사람은 거기서 국자(북두칠성)와 사냥꾼(오리온)을 본다. 별자리는 하늘에 있는 게 아니라 '''보는 사람의 머릿속에''' 있다.\n{/analogy}\n\n== 슬라이드 내용 (p.8) ==\n* 사람은 세상을 의미 있는 것으로 이해하고자 함.\n** 무선적인 현상을 '''매우 불편하게''' 여기기 때문(Tullet et al., 2015).\n** 무선 배열을 '''무선적이지 않은 것으로 인식'''하는 경향 존재(Falk et al., 2009).\n** 그러나, 무선적 연속에서 어떤 패턴이 반복되는 것은 '''충분히 발생 가능'''(Oskarsson et al., 2009).\n* 그렇다면 그 패턴은 정말 실존하는 것일까? → '''[[착각 상관]]'''이나 '''[[평균으로의 회귀]]'''와 연관.\n\n== 수업 예시 (🎙 9/1 25:11–30:39) ==\n* '''동전 던지기''': 앞면이 6–7번 연속 나오면 \"이제 뒷면이 나올 차례\"라고 생각하지만, 매 시행은 독립이다.\n* '''지각의 집단화 원리''': 슬라이드 아래 그림 — 가까운 선끼리 묶어 보기(4장 [[집단화|근접성]]), C 모양 세 개 사이에 없는 삼각형 보기(4장 [[집단화|폐쇄]]). 자극을 단순한 무선 자극으로 두지 않고 일정한 원리로 의미를 부여한다.\n* 첫 수업 날짜(8/25)가 교수의 졸업일과 우연히 같았다 — 여기에 의미를 부여하는 것도 같은 현상.\n\n<pre class=\"ascii\">\n  무선 배열        →   사람의 지각          →   어디로 이어지나\n  ·  ·    ·  ·         ·──·    ·──·              \"둘이 관련 있다\"   → [[착각 상관]]\n    ·  ·   ·             ·──·   ·                \"벌 줬더니 나아졌다\" → [[평균으로의 회귀]] 를 간과\n  (그냥 우연)          (패턴이다!)\n<\/pre>\n\n{warn}\n이 현상 자체의 이름은 \"무선적 사건에서 질서 지각하기\"이고, 그 결과로 생기는 구체적 오류가 [[착각 상관]](없는 관계를 봄)과 [[평균으로의 회귀]] 무시(우연한 회복을 원인 탓으로 돌림)다. 셋을 같은 것으로 보지 말 것.\n{/warn}\n\n== 관련 문서 ==\n* [[착각 상관]] · [[평균으로의 회귀]] · [[집단화]] · [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.8"
 },
 "탈진실": {
  "title": "탈진실 (Post-truth)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "용어"
  ],
  "body": "'''탈진실'''(Post-truth)은 '''객관적 사실보다 감정과 개인의 신념이 여론을 더 크게 움직이는''' 현상, 또는 그런 시대를 가리킨다. 1장 p.9–15 \"탈진실 세상에서의 심리과학\"의 표제어이고, 그 원인(개인의 취약성)은 [[탈진실의 취약성 요인]] 문서에서 따로 다룬다.\n\n{def}\n'''설명''': 정서와 개인의 신념이 객관적 사실에 대한 인정을 압도하는 현상·문화. 사람들이 실제 데이터와 정반대로 세상을 인식하는 상태 (1장 p.9 노트)\n'''명칭''': [[탈진실]] (Post-truth)\n{/def}\n\n{info}\n수업 노트 표기: \"'''2017년 옥스퍼드 영어 사전 올해의 단어'''\". (참고: 옥스퍼드 사전이 post-truth를 올해의 단어로 발표한 시점 자체는 2016년 11월이다. 시험에 연도를 묻는다면 수업 표기를 따르되, 핵심은 연도가 아니라 정의다.)\n{/info}\n\n[[img:L1-09.png|1장 p.9 — 범죄 통계가 보여 주는 현실(범죄율 지속적 감소) vs 대중의 인식(범죄가 증가하고 있다) — 그 사이의 큰 괴리|medium]]\n\n{analogy}\n탈진실은 '''체중계보다 거울을 믿는 다이어트'''다. 체중계(통계)는 분명히 3kg 빠졌다고 말하는데, 오늘 기분이 별로라 거울 속 내가 더 뚱뚱해 보이면 \"살쪘다\"고 확신한다. 데이터는 바로 옆에 있는데(교수: \"찾는 데 30초도 안 걸렸다\") 굳이 올라가 보지 않는다.\n{/analogy}\n\n== 슬라이드의 세 예시 (p.9–11) ==\n{| class=\"table\"\n! 예시 || 사람들의 인식 || 실제 데이터\n|-\n| '''범죄율''' (p.9) || 갤럽 조사: 10명 중 7명이 \"작년보다 범죄 증가\"(Swift, 2016) || 재산·폭력 범죄 꾸준히 감소, 2015년 범죄율은 1990년의 '''절반'''(Statista, 2017)\n|-\n| '''이민자 편견''' (p.9) || 이민자는 범죄자(McCarthy, 2017), 북미·유럽·호주에 널리 퍼짐(Nunziata, 2015) || 그 나라 사람보다 투옥될 가능성 '''44% 낮음'''(Flagg, 2018, 2019)\n|-\n| '''정당 편향성''' (p.10) || 당파에 따라 사실과 '''정반대'''의 인식(Gelman, 2009) || 당파적 편향성은 '''정치 성향과 무관하게''' 발생(Ditto et al., 2019a,b)\n|}\n\n[[img:L1-10.png|1장 p.10 — 미국인의 정당별 지지자들의 SNS 사용 패턴(William et al., 2017): 같은 정당 지지자끼리만 강하게 묶인다|medium]]\n\n[[img:L1-11.png|1장 p.11 — 대한민국 최근 11년간의 형법범죄율(인구 10만 명당 발생 건수, 지표누리): 큰 변동 없음|medium]]\n\n교수(🎙 9/1 34:55–37:11): 정당 편향성은 진영 논리이고 [[확증 편향]]으로 이어질 수 있다. 국내 형법범죄율은 최근 11년 동안 '''큰 변동이 없다''' — 사실은 검색 30초면 확인되는데 사람들은 확인하지 않으니 인식과 데이터가 벌어진다.\n\n{warn}\n\"탈진실\"은 '''현상(결과)'''의 이름이고, 그 원인인 거짓뉴스·반복·강력한 사례의 가용성·집단 정체성은 '''[[탈진실의 취약성 요인]]'''이다. \"탈진실 세상에서 개인의 취약성을 형성하는 요인이 아닌 것은?\" 같은 문항에서 이 구분이 필요하다.\n{/warn}\n\n== 관련 문서 ==\n* [[탈진실의 취약성 요인]] · [[확증 편향]] · [[가용성 어림법]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.9–11"
 },
 "탈진실의 취약성 요인": {
  "title": "탈진실 세상에서 개인의 취약성을 형성하는 요인",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "용어"
  ],
  "body": "'''탈진실 세상에서 개인의 취약성을 형성하는 요인'''은 1장 p.12–15에 걸친 네 가지 — '''거짓뉴스(가짜뉴스) · 반복 · 강력한 사례의 가용성 · 집단 정체성''' — 이다. 교수는 「크게 네 가지」로 묶고(🎙 9/1 39:37), 「이 네 요인은 결국 하나로 맞물려 작동한다」고 정리했다(55:10). → 결과 현상은 [[탈진실]].\n\n{analogy}\n네 요인은 '''헛소문이 동네를 장악하는 4단계'''다. ① 누군가 자극적인 거짓말을 퍼뜨린다(거짓뉴스) → ② 그 말이 반찬가게, 미용실, 단톡방에서 계속 들린다(반복) → ③ 마침 \"옆 동네에서 진짜 그런 일 있었대\"라는 생생한 일화 하나가 떠오른다(강력한 사례의 가용성) → ④ 우리 동네 사람들끼리만 이야기하니 반대 증거는 들어오지 않는다(집단 정체성). 한 단계씩은 약해도 넷이 맞물리면 거짓이 상식이 된다.\n{/analogy}\n\n{| class=\"table\"\n! # || 요인 || 핵심 || 슬라이드\n|-\n| ① || 거짓뉴스(가짜뉴스) || 거짓은 진실보다 더 멀리·빠르게·심층적으로 확산 || p.12\n|-\n| ② || 반복 || 반복될수록 진실에 대한 확신도↑, 삼인성호 || p.13\n|-\n| ③ || 강력한 사례의 가용성 || 자극적 사례 → 위험성 과대 추정, [[가용성 어림법]] || p.14\n|-\n| ④ || 집단 정체성(내집단/외집단 편향) || 같은 생각끼리 어울림 → [[확증 편향]] || p.15\n|}\n\n=== 거짓뉴스 (가짜뉴스) ===\n{def}\n'''설명''': 탈진실 세상에서 개인의 취약성을 형성하는 요인 중, 정치 관련 거짓 정보가 진실보다 더 멀리·빠르게·심층적으로 확산되는 것 (1장 p.12)\n'''명칭''': [[탈진실의 취약성 요인|거짓뉴스(가짜뉴스)]]\n{/def}\n[[img:L1-12.png|1장 p.12 — 가짜뉴스의 확산: \"충격! OO이 사실이었다!\" 한 명에게서 여러 명으로 퍼진다|small]]\n* 2016년 미국 선거 기간에 트위터의 '''6%'''는 거짓 뉴스(Grinberg et al., 2019).\n* 126,000개의 트위터 분석 결과 정치 관련 거짓 뉴스는 '''더 멀리, 빠르게, 심층적으로''' 확산(Vosoughi et al., 2018).\n* '''\"진실은 기어가지만, 거짓은 날아간다.\"'''\n* 노트: 그래도 사람들은 정보 출처의 질을 어느 정도 구별할 능력이 있다(Pennycook & Rand, 2019).\n\n=== 반복 (삼인성호) ===\n{def}\n'''설명''': 진술은 반복될수록 진실에 대한 확신도가 높아지고, 남에 대한 비방도 계속 들으면 진실로 받아들이게 되는 취약성 요인. 세 사람이 말하면 없던 호랑이도 생긴다 (1장 p.13)\n'''명칭''': [[탈진실의 취약성 요인|반복]] (삼인성호, 三人成虎)\n{/def}\n[[img:L1-13.png|1장 p.13 — 반복된 관찰로 인한 믿음의 형성(p.4와 같은 그림: \"일요일마다 날씨가 좋네!\" → \"일요일 = 날씨가 좋다\")|small]]\n* 진술은 반복될수록 진실에 대한 확신도가 높아짐(De keersmaecker et al., 2019).\n* 남에 대한 비방을 계속 듣게 되면 그것을 곧 진실로 받아들임(Fazio et al., 2019).\n* 노트·🎙 9/1(43:49–46:53): '''사회적 동조 실험''' — 안드로이드 폰을 보여 주며 앞사람들이 모두 \"아이폰\"이라고 답하면 마지막 사람도 따라간다. 교수 학부 팀플 일화: 다섯 명 중 넷이 A4 용지를 가져가자 나머지도 따라 했다.\n\n=== 강력한 사례의 가용성 ===\n{def}\n'''설명''': 무언가 자극적이고 강력한 예시를 보여 주면 정확한 판단이 흐려지고, 사고·범죄 등의 위험성을 과대 추정하게 되는 취약성 요인. 가용성 어림법과 직접 관련 (1장 p.14)\n'''명칭''': [[탈진실의 취약성 요인|강력한 사례의 가용성]]\n{/def}\n[[img:L1-14.png|1장 p.14 — ① 강력한 사례 → ② 쉽게 연상 → ③ 실제보다 과대평가. 교통사고 비율: 자동차 VS 지하철|medium]]\n→ 메커니즘은 [[가용성 어림법]], 그 배경은 [[인지적 구두쇠]].\n\n=== 집단 정체성 (내집단/외집단 편향) ===\n{def}\n'''설명''': 소셜 미디어 상에서 자신과 같은 생각을 지닌 사람들과 사귀며, 자신에게 유리한 정보만 선택적으로 취득하게 되는 취약성 요인. 확증 편향으로 이어질 수 있음 (1장 p.15)\n'''명칭''': [[탈진실의 취약성 요인|집단 정체성]] (내집단/외집단 편향)\n{/def}\n[[img:L1-15.png|1장 p.15 — 내 집단 VS 외부 집단: 내집단/외집단 간의 갈등|small]]\n노트: 타인에 대한 악마화, 이민자 혐오 등이 집단 정체성 때문에 생기는 경우가 많다. 교수: 언론사도 각자 관점이 있으니 다양한 입장을 직접 비교해야 한다. (슬라이드의 \"슬라이드 36 참고\"는 1장 덱이 34쪽까지라 이 PPTX에서는 찾을 수 없다 — 신경 쓰지 않아도 된다.)\n\n{quiz}\n「A씨는 2014년에 지하철 추돌 사고를 직접 겪은 뒤로, 통계상 자동차 사고가 훨씬 많음에도 지하철이 더 위험하다고 생각한다.」 이 사례에 해당하는 취약성 요인은? ① 반복 ② 집단 정체성 ③ 거짓뉴스 ④ 강력한 사례의 가용성\n{/quiz}\n{answer}\n'''④ 강력한 사례의 가용성'''. 강렬한 경험이 쉽게 떠올라 위험을 과대 추정한다([[가용성 어림법]]). ① 반복은 같은 진술을 되풀이해 들어서 믿게 되는 것, ② 집단 정체성은 같은 편끼리만 어울려 확증 편향으로 가는 것, ③ 거짓뉴스는 거짓 정보의 빠른 확산이라 이 사례와 다르다. (bank ch1 MC, 1장 p.14)\n{/answer}\n\n{exam}\n교수(🎙 9/1 55:10): 「네 요인은 '''하나로 맞물려''' 작동」 — 가짜뉴스는 자극적이라 기억에 남고(가용성) → 반복 재생산되고(반복) → 자기 성향에 맞는 정보로 수용된다(집단 정체성). 객관식은 '''사례 → 요인''' 매칭이 정석이다.\n{/exam}\n\n== 관련 문서 ==\n* [[탈진실]] · [[가용성 어림법]] · [[인지적 구두쇠]] · [[확증 편향]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.12–15"
 },
 "가용성 어림법": {
  "title": "가용성 어림법 (Availability Heuristic)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "용어"
  ],
  "body": "'''가용성 어림법'''(Availability Heuristic, 슬라이드 표기 Availability Heuristics)은 '''머릿속에 쉽게 떠오르는 사례일수록 더 자주 일어난다고(더 위험하다고) 판단'''하는 직관적 사고 방식이다. 1장 p.14에서 탈진실의 취약성 요인 ③ '''강력한 사례의 가용성'''과 \"직접적 관련\"이 있다고 소개된다.\n\n{def}\n'''설명''': 떠올리기 쉬운(기억에서 쉽게 꺼낼 수 있는) 강한 사례를 중심으로 빈도나 위험을 판단하는 사고 방식. 정확도는 낮지만 정신 자원 소모가 적다 (1장 p.14, 노트·🎙 9/1)\n'''명칭''': [[가용성 어림법]] (Availability Heuristic)\n{/def}\n\n{def}\n'''사례형 설명''': 비행기 추락 뉴스를 며칠 연속 본 사람이 통계상 훨씬 위험한 자동차 대신 비행기를 더 무서워한다 — 쉽게 떠오르는 장면이 판단을 좌우했다.\n'''명칭''': [[가용성 어림법]]\n{/def}\n\n[[img:L1-14.png|1장 p.14 — ① 강력한 사례 → ② 쉽게 연상 → ③ 실제보다 과대평가. 아래: 교통사고 비율 자동차 VS 지하철|medium]]\n\n{analogy}\n가용성 어림법은 '''검색창 자동완성'''으로 세상을 판단하는 것이다. \"지하철 ㅅ\"까지 쳤는데 '사고'가 맨 위에 뜨면 지하철이 사고투성이라고 느낀다. 그런데 자동완성 순위는 '''실제 빈도'''가 아니라 '''최근에 얼마나 화제였나'''로 정해진다. 뇌의 기억 검색도 똑같이 \"생생하고 최근 것\"을 맨 위에 올린다.\n{/analogy}\n\n== 슬라이드·수업 내용 ==\n* p.14 강력한 사례의 가용성: 무언가 '''자극적이고 강력한 예시'''를 보여 주면 정확한 판단이 흐려질 수 있고, '''위험성에 대한 과대 추정'''(사고, 범죄 등)이 발생할 수 있다 → 가용성 어림법과 직접적 관련.\n* 그림: 교통사고 비율 '''자동차 vs 지하철''' — 실제로는 자동차 사고가 훨씬 많지만, 2014년 지하철 사고를 직접 겪은 교수는 지하철 위험도를 더 높게 평가할 수 있다(🎙 9/1 47:55~).\n* 노트: 이 어림법은 정확도는 낮지만 소모가 적어 널리 쓰이며, '''꼭 나쁜 것만은 아니다''' — 배경에는 [[인지적 구두쇠]]가 있다.\n\n<pre class=\"ascii\">\n 실제 빈도      자동차 사고 ██████████████   지하철 사고 █\n 기억 속 생생함  자동차 사고 ██               지하철 사고 ██████████  (직접 겪음 / 뉴스)\n                                   ↓ 가용성 어림법\n 판단           \"지하철이 더 위험하다\"   ← 떠오르기 쉬운 쪽이 이긴다\n<\/pre>\n\n{warn}\n명칭 구분: '''가용성 어림법'''은 판단 방식(휴리스틱)의 이름, '''강력한 사례의 가용성'''은 [[탈진실의 취약성 요인]] 중 하나의 이름이다. \"취약성 요인은?\"이라고 물으면 후자, \"어떤 사고 방식(어림법)인가?\"라고 물으면 전자로 답한다.\n{/warn}\n\n== 관련 문서 ==\n* [[탈진실의 취약성 요인]] · [[인지적 구두쇠]] · [[사례 연구]](극적인 사례가 일반화에 오용되는 이유)\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.14"
 },
 "인지적 구두쇠": {
  "title": "인지적 구두쇠 (Cognitive Miser)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "용어"
  ],
  "body": "'''인지적 구두쇠'''(Cognitive Miser)는 '''사람의 심리 체계는 정신 자원(에너지) 소모를 최소화하는 방향으로 작동한다'''는 입장이다. 후견 편향·가용성 어림법 같은 \"생각의 지름길\"이 왜 존재하는지를 설명하는 배경 개념이다.\n\n{info}\n'''근거 주의''': 이 용어는 '''슬라이드 본문에 없다.''' 1장 p.14(강력한 사례의 가용성) 설명 중 교수가 말한 내용(🎙 9/1 47:55–54:11)과 정리본 노트가 근거다. 그래도 통합요약의 \"출제 예상 (단답형 명칭)\" 목록에 올라 있으므로 명칭은 외워 둘 것.\n{/info}\n\n{def}\n'''설명''': 인간의 심리 체계는 에너지(정신 자원) 소모를 최소화하는 방향으로 작동한다는 입장. 진화(생존)의 결과로, 정확도가 낮더라도 소모가 적은 판단 방식을 선호한다 (1장 p.14 노트·🎙 9/1)\n'''명칭''': [[인지적 구두쇠]] (Cognitive Miser)\n{/def}\n\n{analogy}\n뇌는 '''배터리 절약 모드가 기본값인 스마트폰'''이다. 모든 요인을 하나하나 계산하는 고성능 모드(슈퍼 예측자식 사고)는 정확하지만 배터리를 엄청 먹는다. 그래서 뇌는 평소엔 절전 모드로 \"대충 떠오르는 걸로\"([[가용성 어림법]]) 처리한다. 대부분은 충분히 잘 돌아가지만, 가끔 중요한 판단에서 화면이 버벅인다 — 그게 편향이다.\n{/analogy}\n\n== 수업에서 나온 맥락 ==\n* '''p.5 후견 편향''' 설명 중: 결과에 영향을 주는 요인이 너무 많아 예측이 어려운데, 모든 요인을 계산하는 것은 피곤한 일이라 '''사람의 사고 체계는 에너지 소모를 최소화하는 쪽으로 발전했다'''(🎙 9/1).\n* '''p.6 과신''': 슈퍼 예측자처럼 요인을 하나하나 검증하는 이상적 접근은 '''시간과 정신 자원이 너무 많이 든다'''.\n* '''p.14 강력한 사례의 가용성''': [[가용성 어림법]]은 정확도는 낮지만 소모가 적어 널리 쓰인다 — '''꼭 나쁜 것은 아니다'''. 진화(생존)의 결과.\n\n<pre class=\"ascii\">\n              ┌──────── 정확하지만 비싼 길 ────────┐\n  판단 문제 ──┤  모든 요인 계산·검증 (슈퍼 예측자)   ├──→ 정답 (드묾, 약 2%)\n              └──────── 싸고 빠른 지름길 ───────────┘\n                 '''[[인지적 구두쇠]]''' 가 기본으로 고르는 쪽\n                   → [[가용성 어림법]] , [[후견 편향]] 같은 착각의 토양\n<\/pre>\n\n{warn}\n인지적 구두쇠는 \"게으르다\"는 비난이 아니라 '''자원 절약 전략'''이라는 설명이다. \"인지적 구두쇠의 판단은 항상 틀린다\"는 보기가 나오면 ✗ — 교수는 \"꼭 나쁜 것만은 아니다\"라고 했다.\n{/warn}\n\n== 관련 문서 ==\n* [[가용성 어림법]] · [[탈진실의 취약성 요인]] · [[후견 편향]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.14 (슬라이드 아님 — 정리본 노트·🎙 9/1)"
 },
 "확증 편향": {
  "title": "확증 편향 (Confirmation Bias)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "용어"
  ],
  "body": "'''확증 편향'''(Confirmation Bias)은 '''자신의 생각에 맞는 정보만 골라 받아들이고, 반대되는 정보는 무시하는''' 경향이다. 1장 p.15에서 탈진실 취약성 요인 ④ 집단 정체성이 \"확증 편향으로 이어질 수 있음\"으로 등장한다.\n\n{def}\n'''설명''': 자신의 견해·신념에 유리한 정보만 선택적으로 취득하려는 경향 (1장 p.15)\n'''명칭''': [[확증 편향]] (Confirmation Bias)\n{/def}\n\n{def}\n'''사례형 설명''': 특정 정당 지지자가 SNS에서 같은 정당 지지자들만 팔로우하고, 자기 생각과 맞는 기사만 공유하며, 반대 기사는 \"가짜뉴스\"라며 열어 보지도 않는다.\n'''명칭''': [[확증 편향]]\n{/def}\n\n[[img:L1-15.png|1장 p.15 — 내 집단 VS 외부 집단: 내집단/외집단 간의 갈등. 집단 정체성 → 확증 편향|medium]]\n\n{analogy}\n확증 편향은 '''내가 좋아하는 노래만 틀어 주는 추천 알고리즘'''이다. 한 번 발라드를 누르면 계속 발라드가 나오고, 결국 \"요즘 노래는 다 발라드\"라고 믿게 된다. 다만 알고리즘은 앱이 만들지만, 확증 편향은 '''내 머리가 스스로''' 만든다.\n{/analogy}\n\n== 슬라이드·수업 내용 ==\n* p.15 집단 정체성(내집단/외집단 편향): 소셜 미디어 상에서 자신들과 같은 생각을 지닌 사람들과 사귀는 경향 → '''자신에게 유리한 정보만 선택적으로 취득'''하려는 경향 발생 → '''확증 편향으로 이어질 수 있음'''.\n* p.10 정당 편향성: 교수(🎙 9/1 34:55)는 SNS에서 같은 정당 지지자끼리만 뭉치는 그림을 \"진영 논리 → 확증 편향 가능성\"으로 설명했다.\n\n[[img:L1-10.png|1장 p.10 — 미국인의 정당별 지지자들의 SNS 사용 패턴(William et al., 2017): 파랑과 빨강이 서로 섞이지 않는다|small]]\n\n=== 내집단/외집단 편향 ===\n내 집단(우리 편)과 외부 집단(남의 편)을 나누고 우리 편 정보는 믿고 남의 편 정보는 깎아내리는 경향. 슬라이드는 이것을 '''집단 정체성'''이라는 취약성 요인의 다른 이름으로 괄호에 넣었다. 자세한 정의 박스는 [[탈진실의 취약성 요인|집단 정체성]] 소절에 있다.\n\n== 헷갈리는 짝 ==\n{| class=\"table\"\n! 구분 || 확증 편향 || [[탈진실의 취약성 요인|집단 정체성]] || [[가용성 어림법]]\n|-\n| 무엇 || 유리한 정보만 '''골라 받는''' 경향 || 같은 생각끼리 '''어울리는''' 경향(원인 쪽) || '''떠오르기 쉬운''' 사례로 판단\n|-\n| 관계 || 집단 정체성의 결과로 생길 수 있음 || → 확증 편향으로 이어짐 || 별개의 요인(강력한 사례의 가용성)\n|-\n| 예 || 반대 기사는 안 읽음 || 같은 정당 지지자끼리 팔로우 || 지하철 사고 경험 → 지하철이 더 위험\n|}\n\n== 관련 문서 ==\n* [[탈진실의 취약성 요인]] · [[탈진실]] · [[가용성 어림법]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.15 (p.10)"
 },

  "body": "'''과학적 방법'''(Scientific Method)은 1장 p.16 \"심리과학의 연구 과정\"이다. 상식의 함정(p.5–15)을 피하기 위해 심리학이 쓰는 절차로, '''현상/문제 인식 → 이론 제시 → 가설 수립 → 연구 설계 및 집행 → 데이터 분석 및 해석'''의 5단계가 '''순환'''한다. 교수: 「교재는 3단계지만 세부적으로는 5단계」(🎙 9/1 1:00:09).\n\n{def}\n'''설명''': 현상/문제 인식 → 이론 제시 → 가설 수립 → 연구 설계 및 집행 → 데이터 분석 및 해석으로 이어지며, 분석 결과가 기존 이론을 지지·반박·확장하는 심리과학의 연구 과정 (1장 p.16)\n'''명칭''': [[과학적 방법]] (심리과학의 연구 과정)\n{/def}\n\n[[img:L1-16.png|1장 p.16 — 심리과학의 연구 과정: 연구와 관찰 → 이론 → 가설 → 다시 연구와 관찰로 도는 순환 도식|medium]]\n\n{analogy}\n과학적 방법은 '''요리 레시피 개발'''이다. ① \"이 집 찌개가 왜 맛있지?\"(현상 인식) → ② \"육수가 비결인 것 같다\"(이론) → ③ \"멸치 육수를 쓰면 맛 평가 점수가 오를 것이다\"(가설) + \"맛 평가 = 10명 시식단의 10점 척도 평균\"(조작적 정의) → ④ 멸치 육수 찌개 vs 맹물 찌개를 끓여 블라인드 시식(설계·집행) → ⑤ 점수 비교(분석) → \"육수가 비결 맞네 / 아니네 / 육수+된장 조합이 비결이네\"(지지·반박·확장) → 다시 ②로.\n{/analogy}\n\n== 5단계 (p.16) ==\n{| class=\"table\"\n! 단계 || 내용 || 슬라이드 정의\n|-\n| 1 || 현상/문제 인식 || —\n|-\n| 2 || '''[[이론]](theory)''' 제시 || 관찰을 체제화하고 행동/사건을 예측하는 원리의 '''통합적 설명'''\n|-\n| 3 || '''[[가설]]''' 수립 || 이론을 기반으로 도출한 '''검증 가능한 예측'''. '''[[조작적 정의]]'''(Operational Definition): 연구에서 차용된 개념, 연구 절차 등에 대한 정확한 진술\n|-\n| 4 || 연구 설계 및 집행 || 연구 주제 및 가설을 검증할 수 있는 적절한 연구 방법을 구성하는 것 → [[연구 방법 비교]]\n|-\n| 5 || 데이터 분석 및 해석 || 기존 이론의 '''지지, 반박, 확장''' 수행\n|}\n\n<pre class=\"ascii\">\n   ┌──→ 1 현상/문제 인식 ──→ 2 [[이론]] ──→ 3 [[가설]] (+ [[조작적 정의]])\n   │                                              │\n   │                                              ▼\n   └── 5 분석·해석 (지지 / 반박 / 확장) ◀── 4 연구 설계·집행\n<\/pre>\n\n== 교수 예시: 수면과 기억 (🎙 9/1 1:02:13–1:05:21) ==\n# 이론: 수면이 기억을 증진시킨다.\n# 가설: 수면을 박탈하면 기억이 더 떨어질 것이다.\n# 조작적 정의: 수면 박탈 = 최근 24시간 동안 수면 1시간 미만 / 기억 = 기억력 검사의 정답 항목 수. (기준은 '''선행 문헌'''에 근거)\n# 결과는 이론을 지지·기각·수정하며 반복된다.\n노트: 요즘은 '''사전 등록(preregistration)'''으로 연구 전에 피드백을 받으며 연구를 보완한다.\n\n{quiz}\n분석 결과 가설이 지지되지 않았다. 다음 중 옳은 것은? ① 이론은 반드시 폐기해야 한다 ② 결과는 기존 이론을 지지·반박·확장하는 데 쓰인다 ③ 이론과 가설은 분석이 끝난 뒤에 세운다\n{/quiz}\n{answer}\n'''②'''. 5단계는 기존 이론의 '''지지, 반박, 확장'''이다. ① \"반드시 폐기\"는 과장(수정·확장도 가능), ③ 이론·가설은 분석 '''이전''' 단계(2·3단계)에서 세운다. (bank ch1 MC 변형, 1장 p.16)\n{/answer}\n\n== 관련 문서 ==\n* [[이론]] · [[가설]] · [[조작적 정의]] · [[연구 방법 비교]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.16"

  "body": "'''이론'''(Theory)은 [[과학적 방법]] 5단계 중 2단계 \"이론 제시\"의 산물이다. 여러 관찰을 하나로 묶어 정리하고, 앞으로 일어날 행동·사건을 예측할 수 있게 해 주는 '''큰 설명 틀'''이다. 가설과 짝으로 시험에 나온다.\n\n{def}\n'''설명''': 관찰을 체제화하고 행동/사건을 예측하는 원리의 통합적 설명 (1장 p.16)\n'''명칭''': [[이론]] (Theory)\n{/def}\n\n{analogy}\n이론은 '''지도'''이고 [[가설]]은 '''그 지도를 보고 정한 \"이 길로 가면 10분 뒤 편의점이 나온다\"는 예측'''이다. 지도(이론)는 동네 전체를 정리해 보여 주지만 그 자체로 \"맞다/틀리다\"를 한 번에 확인할 수는 없다. 대신 예측(가설) 하나를 실제로 걸어가 확인하고, 틀리면 지도를 고친다(반박·확장).\n{/analogy}\n\n== 이론 vs 가설 ==\n{| class=\"table\"\n! 구분 || 이론 || [[가설]]\n|-\n| 슬라이드 정의 || 관찰을 체제화하고 행동/사건을 예측하는 원리의 '''통합적 설명''' || 이론을 기반으로 도출한 '''검증 가능한 예측'''\n|-\n| 범위 || 넓다 (여러 현상을 묶음) || 좁다 (하나의 구체적 예측)\n|-\n| 단계 || 연구 과정 2단계 || 연구 과정 3단계\n|-\n| 형태 || \"수면이 기억을 증진시킨다\" || \"수면을 박탈하면 기억이 더 떨어질 것이다\" (\"~하면 ~할 것이다\")\n|-\n| 검증 후 || 지지·반박·확장된다 || 지지되거나 지지되지 않는다\n|}\n\n<pre class=\"ascii\">\n   관찰1  관찰2  관찰3        ← 흩어진 관찰들\n      \\     |     /\n       '''[[이론]]'''  (체제화 + 예측하는 통합적 설명)\n           │ 도출\n       '''[[가설]]'''  (검증 가능한 예측) ──[[조작적 정의]]──→ 측정\n<\/pre>\n\n{warn}\nbank 함정: \"이론은 검증 가능한 개별 예측이고, 가설은 관찰을 체제화한 통합적 설명이다\" — '''정의를 서로 바꿔 놓은''' 오답. 그리고 \"가설이 지지되지 않으면 이론은 반드시 폐기\"도 ✗ — 분석 결과는 이론을 '''지지·반박·확장'''한다(p.16).\n{/warn}\n\n== 관련 문서 ==\n* [[가설]] · [[과학적 방법]] · [[조작적 정의]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.16"

  "body": "'''가설'''(Hypothesis)은 [[과학적 방법]] 3단계 \"가설 수립\"의 산물로, [[이론]]에서 끌어낸 '''실제로 확인해 볼 수 있는 구체적 예측'''이다. 보통 \"~하면 ~할 것이다\" 꼴이고, 측정하려면 [[조작적 정의]]가 함께 붙어야 한다.\n\n{def}\n'''설명''': 이론을 기반으로 도출한 검증 가능한 예측 (1장 p.16)\n'''명칭''': [[가설]] (Hypothesis)\n{/def}\n\n{def}\n'''사례형 설명''': \"수면이 기억을 증진시킨다\"는 생각에서 출발해, 연구자가 \"수면을 박탈하면 기억력 검사 점수가 더 떨어질 것이다\"라는 확인 가능한 예측을 세웠다.\n'''명칭''': [[가설]]\n{/def}\n\n{analogy}\n가설은 '''내기'''다. \"내일 비 올 것 같아\"(막연한 생각)는 내기가 안 되지만, \"내일 오후 3시 대구에 강수량 1mm 이상\"은 내기가 된다 — 맞았는지 틀렸는지 '''판정할 수 있으니까'''. 가설은 반드시 판정 가능한 내기여야 하고, 판정 기준을 적은 계약서가 [[조작적 정의]]다.\n{/analogy}\n\n== 슬라이드·수업 내용 ==\n* p.16 3단계 가설 수립: 가설 = 이론을 기반으로 도출한 '''검증 가능한''' 예측. 같은 단계에 [[조작적 정의]](연구에서 차용된 개념, 연구 절차 등에 대한 정확한 진술)가 붙어 있다.\n* 교수(🎙 9/1 1:03:28): 「가설은 '''측정할 수 있는 형태로 재정립'''해야 한다」 — 수면 박탈 = 24시간 수면 1시간 미만, 기억 = 정답 항목 수.\n\n<pre class=\"ascii\">\n [[이론]]     수면이 기억을 증진시킨다\n   │ 도출\n '''[[가설]]'''   수면을 박탈하면 기억이 더 떨어질 것이다\n   │ [[조작적 정의]]\n 측정     수면 박탈 = 최근 24시간 수면 < 1시간  /  기억 = 기억력 검사 정답 수\n   │ 4단계 설계·집행 → 5단계 분석\n 판정     지지 ✓ 또는 지지 안 됨 ✗  → 이론을 지지·반박·확장\n<\/pre>\n\n== 헷갈리는 짝 ==\n{| class=\"table\"\n! 구분 || [[이론]] || 가설 || [[조작적 정의]]\n|-\n| 정의 || 관찰을 체제화·예측하는 통합적 설명 || 이론에서 도출한 검증 가능한 예측 || 개념·절차에 대한 정확한 진술\n|-\n| 역할 || 큰 틀 || 확인할 예측 || 그 예측을 측정 가능하게 만드는 규칙\n|}\n\n== 관련 문서 ==\n* [[이론]] · [[조작적 정의]] · [[과학적 방법]] · [[실험법]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.16"
 },
 "조작적 정의": {

  "category": [

  ],
  "body": "'''조작적 정의'''(Operational Definition)는 \"스트레스\", \"기억력\", \"수면 부족\"처럼 '''눈에 보이지 않는 개념을 숫자로 잴 수 있게 정확히 못 박는 것'''이다. [[가설]]이 검증 가능하려면 반드시 필요하다. bank 단답형 정답.\n\n{def}\n'''설명''': 연구에서 차용된 개념, 연구 절차 등에 대한 정확한 진술 — 측정할 수 없는 심리 기제를 구체적이고 계량화할 수 있는 형태로 재정의한 것 (1장 p.16)\n'''명칭''': [[조작적 정의]] (Operational Definition)\n{/def}\n\n{def}\n'''사례형 설명''': 연구자는 「스트레스가 높은 상태」를 「지각된 스트레스 척도에서 30점 이상을 받은 상태」로, 「학업 수행」을 「기말고사 총점」으로 구체적이고 측정 가능한 형태로 진술하였다.\n'''명칭''': [[조작적 정의]]\n{/def}\n\n{analogy}\n조작적 정의는 '''축구 규칙집의 \"골\" 조항'''이다. \"골은 멋진 슛\"이라고 하면 심판마다 판정이 다르다. 그래서 규칙집은 \"공 전체가 골라인을 완전히 넘었을 때\"라고 '''측정 가능하게''' 정해 둔다. 그래야 누가 판정해도 같은 결과가 나온다(재현 가능성).\n{/analogy}\n\n== 교수 예시 (🎙 9/1 1:02:13–1:05:21) ==\n{| class=\"table\"\n! 개념 (추상적) || 조작적 정의 (측정 가능)\n|-\n| 수면 박탈 || 최근 '''24시간 동안 수면 1시간 미만'''\n|-\n| 기억 || 기억력 검사의 '''정답 항목 수'''\n|-\n| 스트레스가 높은 상태 (bank) || 지각된 스트레스 척도 '''30점 이상'''\n|-\n| 학업 수행 (bank) || '''기말고사 총점'''\n|}\n\n{exam}\n교수(🎙 9/1 1:03:28): 「가설은 '''측정할 수 있는 형태로 재정립'''해야 한다」. 그리고 조작적 정의의 기준은 연구자 마음대로가 아니라 '''선행 문헌'''을 근거로 정한다. bank 단답형 정답: '''조작적 정의'''.\n{/exam}\n\n{warn}\n'''조작적 정의 ≠ [[조작적 조건화]]'''. \"조작적\"이라는 글자가 같아서 단답형에서 섞어 쓰기 쉽다.\n* 조작적 '''정의''' (Operational Definition) — 1장, '''연구 방법''': 개념을 측정 가능하게 진술.\n* 조작적 '''조건화''' (Operant Conditioning) — 5장, '''학습 이론''': 행동의 결과(강화·처벌)로 행동 빈도가 변함. (5장 슬라이드의 \"Operational Conditioning\"은 오기다.)\n{/warn}\n\n== 관련 문서 ==\n* [[가설]] · [[이론]] · [[과학적 방법]] · [[조작적 조건화]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.16"
 },

  "body": "'''연구 방법 비교'''는 1장 p.25 \"연구 방법 간 비교\" 표 하나를 중심으로, 심리학의 세 연구 방법 — '''기술적 방법 · 상관 연구 · 실험''' — 이 각각 무엇을 할 수 있고 무엇을 못 하는지 정리한 문서다. 결론은 한 줄: '''인과를 밝힐 수 있는 것은 실험뿐.'''\n\n{analogy}\n세 방법은 '''날씨 연구의 세 단계'''다. '''기술적 방법''' = 창밖을 보고 \"오늘 비 온다\"고 일기를 쓴다(무슨 일이 일어나는지). '''상관 연구''' = 10년치 일기를 모아 \"개구리가 울면 대체로 비가 오더라\"를 찾는다(예측은 된다, 하지만 개구리가 비를 부르는 건 아니다). '''실험''' = 인공강우 장치로 구름에 요오드화은을 뿌린 구역과 안 뿌린 구역을 '''무작위로''' 정해 비교한다(이제야 \"이걸 뿌리면 비가 온다\"는 인과).\n{/analogy}\n\n== p.25 연구 방법 간 비교 ==\n[[img:L1-25.png|1장 p.25 — 연구 방법 간 비교 표(방법 / 기본 목적 / 수행 방법 / 처치 / 약점)|large]]\n\n{| class=\"table\"\n! 방법 || 기본 목적 || 수행 방법 || 처치 || 약점\n|-\n| '''기술적 방법''' || 행동을 관찰 및 기록 || [[사례 연구]], [[자연 관찰]], [[사회조사]] || 없음 || 변인 통제 불가, 개별 사례가 결과 오도 가능\n|-\n| '''[[상관|상관 연구]]''' || 한 변인이 다른 변인을 예측하는 정도를 평가 || 둘 이상의 변인에 대한 데이터 수집 후, 상관 분석 || 없음 || 원인과 결과를 명세하지 못함\n|-\n| '''[[실험법|실험]]''' || 원인과 결과 탐색 || 하나 이상의 변인에 처치를 가하며, [[무선 할당]] 활용 || 하나 이상의 [[실험법|독립변인]] || 결과를 다른 상황에 일반화하지 못할 수 있음, 주제에 따라 사용 불가, 특정 변인에 처치 불가할 수 있음(윤리적 문제)\n|}\n\n[[sim:research_methods]]\n\n=== 기술적 방법 ===\n{def}\n'''설명''': 현상에 대한 기술(Description)을 중점으로 두는 방법. 어떤 행동이나 패턴, 사회 현상 등이 실제로 발생하고 있음을 제시하는 것이 목표이며, 연구 초기에 어떤 현상(Phenomenon)에 접근할 때 유용 (1장 p.17)\n'''명칭''': [[연구 방법 비교|기술적 방법]] (Descriptive Methods)\n{/def}\n\n[[img:L1-17.png|1장 p.17 — 기술적 방법의 목표(① 현상 관찰 → ② 현상 기술)와 유형: 사례연구(Case Study)·자연 관찰(Natural Observation)·사회조사(Survey)|medium]]\n\n종류는 세 가지: '''[[사례 연구]](Case Study)''', '''[[자연 관찰]](Natural Observation)''', '''[[사회조사]]와 인터뷰(Survey)'''. 교수(🎙 9/1 1:09:48): 이 셋은 '''왜''' 일어나는지 설명할 수 없고, 현상이 일어남을 보여 줄 뿐이다. 처치도 통제도 없다.\n\n{| class=\"table\"\n! 기술적 방법 || 정의 핵심 || 강점 || 약점\n|-\n| [[사례 연구]] || 소수의 개인·집단을 집중 관찰·심층 분석 || 후속 연구 방향 설정, 어느 정도 설득력 || 대표적이지 않은 사례가 오도, '''일반화 곤란'''\n|-\n| [[자연 관찰]] || 자연 활동에서의 행동을 기록 || 현상 자체를 명확히 제시, 빅데이터로 대규모 가능 || 요인을 '''통제하지 않음''', 설명 어려움\n|-\n| [[사회조사]] || 설문·인터뷰 등 자기보고식 || 많은 사례를 간편하게 수집 || 응답 위장(사회적 바람직성), '''[[말표현 효과]]'''\n|}\n\n== 세 방법 한눈에 ==\n<pre class=\"ascii\">\n                 처치(조작)   변인 통제   무선 할당   할 수 있는 것\n 기술적 방법        ✗           ✗           ✗         \"무엇이 일어나는가\" (기술)\n 상관 연구          ✗           ✗           ✗         \"X로 Y를 예측할 수 있나\" (예측)\n '''실험'''             ✓           ✓           ✓         \"X가 Y의 원인인가\" ('''인과''')\n<\/pre>\n\n{exam}\n교수(🎙 9/1 1:17:18): 「이 소개 범위에서 '''직접적인 통제나 조작을 가하는 연구 방법은 실험법 딱 하나'''」. 그리고 「'''상관은 인과성을 입증하는 지표가 아니다'''」(1:29:10). 실험의 약점은 통제된 인위적 상황이라 '''일반화'''에 한계가 있고, 뇌를 일부러 손상시키는 처치처럼 '''윤리적으로 불가'''한 경우가 있다는 것(1:46:01–1:49:44).\n{/exam}\n\n{quiz}\n연구 방법과 그 약점을 옳게 짝지은 것은? ① 사례 연구 – 대표적이지 않은 소수 사례가 결과를 오도할 수 있고 일반화하기 어렵다 ② 상관 연구 – 처치를 가해야 해서 윤리 문제가 잦다 ③ 실험 – 변인을 통제하지 않아 인과를 검증하지 못한다 ④ 사회조사 – 표본 수만 크면 대표성 문제는 없다\n{/quiz}\n{answer}\n'''①'''. ② 상관 연구는 처치가 '''없다'''. ③ 실험은 정반대로 변인을 '''통제'''해 인과를 검증한다(약점은 일반화·윤리). ④ 표본이 커도 대표성이 없으면 바람직한 표본이 아니다([[무선 표집]]). (bank ch1 MC, 1장 p.18·21·25)\n{/answer}\n\n== 다른 장에서 만나는 연구 방법 ==\n* 3장 [[횡단 연구]]·[[종단 연구]] — 발달을 '''관찰'''하는 설계(처치 없음).\n* 2장 [[손상법]] — 뇌의 특정 부위 손상과 기능 저하의 관계(인과 추론 가능하지만 인간에게 일부러 할 수 없음 = 실험의 윤리적 한계).\n* 서막 [[쌍둥이 연구]] — 유전과 환경의 영향을 비교하는 방법.\n\n== 관련 문서 ==\n* [[사례 연구]] · [[자연 관찰]] · [[사회조사]] · [[상관]] · [[실험법]] · [[무선 할당]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.17, p.25"
 },
 "사례 연구": {
  "title": "사례 연구 (Case Study)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "연구 방법"
  ],
  "body": "'''사례 연구'''(Case Study)는 [[연구 방법 비교|기술적 방법]] 세 가지 중 첫째로, '''몇 사람(또는 한 집단)을 아주 깊게 파고드는''' 연구 방법이다. 깊이는 최고지만 넓이(일반화)가 약점이다.\n\n{def}\n'''설명''': 소수의 개인이나 집단을 집중적으로 관찰하고 심층 분석하는 기법 (1장 p.18)\n'''명칭''': [[사례 연구]] (Case Study)\n{/def}\n\n{def}\n'''사례형 설명''': 연구자가 특정 뇌 부위를 다친 환자 한 명을 수년간 면담·검사하며 그의 기억 변화를 상세히 기록했다. 결과는 흥미로웠지만 다른 사람에게도 똑같이 적용된다고 말하기는 어려웠다.\n'''명칭''': [[사례 연구]]\n{/def}\n\n[[img:L1-18.png|1장 p.18 — 사례 연구의 예시: 돋보기로 소수의 사람을 깊이 들여다본다('깊이 있는 이해')|medium]]\n\n{analogy}\n사례 연구는 '''맛집 한 곳의 리뷰 100줄'''이다. 그 집에 대해서는 메뉴, 사장님 성격, 화장실 위치까지 다 알 수 있다. 하지만 그 리뷰로 \"한국 식당은 다 이렇다\"고 말할 수는 없다. 게다가 그 집이 특이한 집이었다면 리뷰는 오히려 '''오해'''를 만든다.\n{/analogy}\n\n== 슬라이드 내용 (p.18) ==\n* 소수의 개인이나 집단을 집중적으로 관찰하고 심층 분석하는 기법.\n* 실제로 참인 원리를 밝혀낼 것이라는 기대 하에 수행됨.\n* 후속 연구의 '''방향성을 설정하는 기반'''이 될 수 있으며, 어느 정도 설득력이 있는 결과를 얻을 수 있음.\n* '''대표적이지 않은 개별 사례는 결과를 오도'''할 수 있음.\n* '''소수의 사례를 통해 얻은 결과를 일반화하기 어려움'''.\n\n교수(🎙 9/1): 처음부터 다수를 대상으로 하기 어려울 때 소수 심층 분석으로 시작한다. 노트: 극적인 이야기·경험이 일반화에 자주 오용된다(→ [[가용성 어림법]], 강력한 사례의 가용성).\n\n== 비교 ==\n{| class=\"table\"\n! 구분 || 사례 연구 || [[자연 관찰]] || [[사회조사]]\n|-\n| 대상 수 || '''소수''' (깊게) || 소규모 ~ 빅데이터 || 많은 사례 (넓게)\n|-\n| 방법 || 집중 관찰·심층 분석 || 자연 상태 행동 기록 || 설문·인터뷰 자기보고\n|-\n| 대표 약점 || '''일반화 곤란''', 특이 사례가 오도 || 요인 통제 안 함 || 응답 위장, 말표현 효과\n|-\n| 공통 || '''처치 없음 · 설명(인과) 불가''' || '''처치 없음 · 설명(인과) 불가''' || '''처치 없음 · 설명(인과) 불가'''\n|}\n\n{warn}\nbank 정답 보기: \"사례 연구 – 대표적이지 않은 소수의 사례가 결과를 오도할 수 있고 '''일반화하기 어렵다'''\". 사례 연구의 약점을 \"응답 위장\"(사회조사의 약점)이나 \"윤리 문제\"(실험의 약점)와 바꿔 낸 보기를 조심.\n{/warn}\n\n== 관련 문서 ==\n* [[연구 방법 비교]] · [[자연 관찰]] · [[사회조사]]\n* 사례 연구의 유명한 예: 6장 [[기억상실증]](환자 H.M), 2장 [[편도체]](환자 S.M)\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.18"
 },
 "자연 관찰": {
  "title": "자연 관찰 (Natural Observation)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "연구 방법"
  ],
  "body": "'''자연 관찰'''(Natural Observation)은 [[연구 방법 비교|기술적 방법]] 둘째로, '''아무것도 건드리지 않고 사람들이 평소 하는 행동을 그대로 기록'''하는 방법이다. 요즘은 SNS·리뷰 같은 빅데이터 덕분에 \"거대 과학\"이 되었다.\n\n{def}\n'''설명''': 자연 활동에서의 행동을 기록하는 방법(예: 아동에 대한 행동 관찰). 행동에 영향을 미칠 수 있는 요인은 통제하지 않고 진행 (1장 p.19)\n'''명칭''': [[자연 관찰]] (Natural Observation)\n{/def}\n\n{def}\n'''사례형 설명''': 연구자가 놀이터 한쪽에 앉아 아이들이 언제, 누구와, 얼마나 자주 다투는지 아무 개입 없이 기록했다.\n'''명칭''': [[자연 관찰]]\n{/def}\n\n[[img:L1-19.png|1장 p.19 — 시간대에 따른 트위터 용어 사용 추세(Golder & Macy, 2011): 하루 동안 긍정 단어 비율이 출렁이는 곡선들|medium]]\n\n{analogy}\n자연 관찰은 '''야생 다큐멘터리 촬영팀'''이다. 사자 무리 옆에 카메라를 숨겨 두고 몇 달 동안 찍기만 한다. 먹이를 던져 주거나 무리를 나누지 않는다(통제 없음). 그래서 \"사자는 해 질 녘에 사냥한다\"는 '''현상'''은 확실히 보여 주지만, \"왜 해 질 녘인가\"는 화면만으로 알 수 없다.\n{/analogy}\n\n== 슬라이드 내용 (p.19) ==\n* 자연 활동에서의 행동을 기록하는 방법(ex. 아동에 대한 행동 관찰).\n* [[사례 연구]]와 유사하게 '''현상에 대한 설명은 어려우나, 현상 자체를 명확하게 제시'''함.\n* 본래는 소규모 집단·개인을 대상으로 한 방법이나(Provine, 2012), 현재에는 '''빅 데이터에 기반한 대규모 연구'''가 가능.\n** SNS, 리뷰 등 다양한 개인의 활동이 모여 하나의 거대한 데이터를 이루고, 이는 곧 인간 행동의 흐름과 연관.\n** 자연 관찰을 하나의 '''거대 과학'''으로 변모시킴.\n* '''행동에 영향을 미칠 수 있는 요인은 통제하지 않고 진행.'''\n\n그림 해설(Golder & Macy, 2011, \"시간대에 따른 트위터 용어 사용 추세\"): 그래프 주석대로 '''토요일 늦은 밤에 긍정 단어 게시가 가장 높았고, 화요일 오후에 가장 낮았다'''. 요일별 곡선 모두 오전에 높고 낮~오후에 떨어졌다가 밤에 다시 오른다. 하지만 '''왜''' 그런지는 이 데이터만으로 알 수 없다 — 이것이 기술적 방법의 한계다.\n\n== 비교 ==\n{| class=\"table\"\n! 구분 || 자연 관찰 || [[실험법]]\n|-\n| 개입 || 없음 (있는 그대로 기록) || 처치(조작) + 통제\n|-\n| 장면 || 자연 상태 → 현실성 높음 || 통제된 인위적 상황 → 일반화 한계\n|-\n| 알 수 있는 것 || 무엇이 일어나는가 || 무엇이 원인인가\n|}\n\n{warn}\n\"자연 관찰은 빅데이터를 쓰니 인과를 밝힐 수 있다\"는 ✗. 데이터가 아무리 커도 '''처치·통제가 없으면''' 여전히 기술적 방법이다. 교수: 통제·조작을 가하는 방법은 [[실험법]] 하나뿐(🎙 9/1 1:17:18).\n{/warn}\n\n== 관련 문서 ==\n* [[연구 방법 비교]] · [[사례 연구]] · [[사회조사]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.19"
 },

  "body": "'''사회조사'''(Survey, 슬라이드 표기 \"사회조사와 인터뷰\")는 [[연구 방법 비교|기술적 방법]] 셋째로, '''설문지·인터뷰로 사람들에게 직접 물어보는''' 방법이다. 많이, 싸게, 빨리 모을 수 있지만 \"사람은 묻는 대로, 보이고 싶은 대로 답한다\"는 두 가지 약점이 있다.\n\n{def}\n'''설명''': 설문지, 인터뷰 등을 통한 자기보고식 연구 방법. 사람들에게 자기 행동이나 견해를 보고하도록 요구 (1장 p.20)\n'''명칭''': [[사회조사]] (Survey)\n{/def}\n\n[[img:L1-20.png|1장 p.20 — 설문을 통한 사회조사와 말표현 효과: 찬성을 유도하는 어휘 vs 반대를 유도하는 어휘|medium]]\n\n{analogy}\n사회조사는 '''식당 계산대 앞의 \"맛있게 드셨어요?\"'''다. 수백 명에게 1초 만에 물을 수 있다(간편·대량). 하지만 사장님 앞에서 \"별로였어요\"라고 답하는 손님은 드물다(사회적 바람직성 위장). 게다가 \"오늘 특제 소스 어떠셨어요?\"라고 물으면 \"맛없었어요?\"라고 물을 때보다 좋은 답이 나온다(말표현 효과).\n{/analogy}\n\n== 슬라이드 내용 (p.20–21) ==\n* 설문지, 인터뷰 등을 통한 '''자기보고식''' 연구 방법 — 많은 사례를 데이터로서 수집하며, 수집이 간편함.\n* 약점 ①: 응답자는 자신의 응답을 '''사회적으로 바람직한 방향으로 위장'''할 수 있음.\n* 약점 ②: 질문 구성 방식에 따른 '''[[말표현 효과]]'''의 영향 가능성 — 문항을 구성하는 어휘에 따라 참가자의 응답이 달라지는 효과.\n* p.21: '''[[무선 표집]]'''된 표본에서 데이터 수집 — 모집단의 인원이 동등하게 참여할 기회를 지니도록 표집, 표본 수가 많아도 대표성이 없으면 바람직한 표본이 될 수 없음.\n\n교수(🎙 9/1 1:18:18–1:19:57): 위장의 예 — 흡연량·음주량을 실제보다 적게 답한다. 그래서 탐지 문항 등을 넣어 대응한다. 자기보고의 한계는 서막의 [[내성법]]과 닮았다.\n\n<pre class=\"ascii\">\n  모집단 ──[[무선 표집]]──→ 표본 ──설문/인터뷰──→ 자기보고 응답 ──→ 데이터\n                  ▲                      ▲                ▲\n            대표성이 핵심          [[말표현 효과]]      사회적 바람직성(위장)\n       (크기보다 대표성!)        (어휘가 응답 유도)    (보이고 싶은 대로 답함)\n<\/pre>\n\n{exam}\n교수(🎙 9/1 1:23:51): 「'''표본 수가 큰 것보다 대표성을 띠는 표본이 더 중요'''」 — 사회조사의 중요한 원칙. bank 오답 보기 \"사회조사 – 표본 수만 충분히 크면 대표성 문제는 발생하지 않는다\"(✗).\n{/exam}\n\n== 비교 ==\n{| class=\"table\"\n! 약점 || 사회조사 || [[사례 연구]] || [[실험법|실험]]\n|-\n| 대표 약점 || 응답 위장, 말표현 효과 || 일반화 곤란, 특이 사례 오도 || 일반화 한계, 윤리적 제약\n|}\n\n== 관련 문서 ==\n* [[말표현 효과]] · [[무선 표집]] · [[연구 방법 비교]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.20–21"
 },
 "말표현 효과": {
  "title": "말표현 효과 (Wording Effect)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "용어"
  ],
  "body": "'''말표현 효과'''(Wording Effect)는 [[사회조사]]의 약점 중 하나로, '''같은 내용을 물어도 어떤 단어로 묻느냐에 따라 답이 달라지는''' 현상이다. bank 단답형 정답이며, 슬라이드의 번역어 '''\"말표현 효과\"''' 그대로 써야 한다(단답형 채점 기준).\n\n{def}\n'''설명''': 문항을 구성하는 어휘에 따라 참가자의 응답이 달라지는 효과 (1장 p.20)\n'''명칭''': [[말표현 효과]] (Wording Effect)\n{/def}\n\n{def}\n'''사례형 설명''': 같은 정책을 두고 설문에서 「극빈자 지원」이라고 물었을 때는 찬성 응답이 많았고 「복지」라고 물었을 때는 반대 응답이 많았다.\n'''명칭''': [[말표현 효과]]\n{/def}\n\n[[img:L1-20.png|1장 p.20 — 설문을 통한 사회조사와 말표현 효과: 왼쪽 열은 찬성을 유도, 오른쪽 열은 반대를 유도하는 어휘|medium]]\n\n{analogy}\n말표현 효과는 '''메뉴판 작명'''이다. \"냉동 생선 튀김\"과 \"대서양 직송 바삭 피시 앤 칩스\"는 같은 음식인데 주문 수가 다르다. 설문 문항도 메뉴판처럼 단어 하나가 응답자의 손을 '''찬성 쪽으로, 혹은 반대 쪽으로''' 민다.\n{/analogy}\n\n== 슬라이드 어휘 쌍 (p.20) ==\n{| class=\"table\"\n! 찬성을 유도 || 반대를 유도\n|-\n| 극빈자 지원 || 복지\n|-\n| 차별 철폐 조치 || 우선적 조치\n|-\n| 허가증이 없는 노동자 || 불법 체류자\n|-\n| 총기 안전법 || 총기 통제법\n|-\n| 예산 증가 || 세금\n|-\n| 선전적 심문 || 고문\n|}\n\n같은 대상인데 왼쪽은 '''돕는다·안전·증가'''처럼 긍정 프레임, 오른쪽은 '''통제·세금·불법·고문'''처럼 부정 프레임이다. 핵심은 \"어휘가 프레임을 만들어 응답을 바꾼다\".\n\n{quiz}\n설문에서 \"총기 '''통제'''법에 찬성하십니까?\"보다 \"총기 '''안전'''법에 찬성하십니까?\"에 찬성 응답이 더 많았다. 이 효과의 명칭은?\n{/quiz}\n{answer}\n'''말표현 효과'''(Wording Effect). 문항 어휘가 응답을 유도했다. 사회조사의 또 다른 약점(응답을 사회적으로 바람직하게 위장)과 구분할 것. (bank ch1 SA, 1장 p.20)\n{/answer}\n\n{warn}\n사회조사의 약점 두 가지를 섞지 말 것: '''응답 위장'''은 '''응답자'''가 좋아 보이려고 답을 바꾸는 것, '''말표현 효과'''는 '''질문(어휘)'''이 답을 바꾸는 것. 원인이 응답자 쪽이냐 문항 쪽이냐.\n{/warn}\n\n== 관련 문서 ==\n* [[사회조사]] · [[무선 표집]] · [[연구 방법 비교]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.20"
 },
 "무선 표집": {
  "title": "무선 표집 (Random Sampling)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "연구 방법"
  ],
  "body": "'''무선 표집'''(Random Sampling)은 '''모집단의 모든 구성원이 똑같은 확률로 뽑히도록''' 표본을 고르는 원칙이다. 목적은 표본이 모집단을 축소판처럼 닮게 하는 것, 즉 '''대표성'''. 이름이 비슷한 [[무선 할당]]과 단골로 바꿔치기되어 출제된다.\n\n{def}\n'''설명''': 모집단의 인원이 동등하게 참여할 기회를 지니도록 표집을 수행하는 것. 표본 수가 많아도 대표성이 없으면 바람직한 표본이 될 수 없음 (1장 p.21)\n'''명칭''': [[무선 표집]] (Random Sampling)\n{/def}\n\n[[img:L1-21.png|1장 p.21 — 무선 표집의 원칙: ① 모집단(전체 구성원, 동등하게 표집될 기회) → ② 무선 표집 과정(추첨기) → ③ 표본(사회조사 참여자)|medium]]\n\n{analogy}\n무선 표집은 '''국 간 보기'''다. 큰 냄비 국을 '''잘 저은 뒤''' 한 숟가락만 떠 먹어 보면 전체 맛을 안다 — 숟가락이 작아도 된다. 반대로 젓지 않고 위에 뜬 기름만 열 국자 떠 먹으면, 아무리 많이 먹어도 국 맛을 모른다. '''표본은 크기보다 대표성'''이란 말이 바로 이것.\n{/analogy}\n\n== 슬라이드 내용 (p.21) ==\n* 무선 표집된 표본에서 데이터 수집.\n* 모집단의 인원이 '''동등하게 참여할 기회'''를 지니도록 표집 수행.\n* '''표본 수가 많아도 대표성이 없으면 바람직한 표본이 될 수 없음.'''\n* 사회 조사뿐만 아니라 '''실험 모집에서도 동일하게 적용''' 가능.\n\n{exam}\n교수(🎙 9/1 1:23:51): 「'''표본 수가 큰 것보다 대표성을 띠는 표본이 더 중요'''하다」. bank 오답 보기 \"표본 수가 충분히 크면 무선 표집을 하지 않아도 대표성이 보장된다\"(✗).\n{/exam}\n\n[[anim:experiment_design|맨 처음 모집단 점들 중 몇 개가 골고루 뽑혀 나오는 장면이 무선 표집이다 — 그 다음 동전 던지기(무선 할당)와 무엇이 다른지 비교해 볼 것]]\n\n== 무선 표집 vs 무선 할당 ⭐⭐⭐ ==\n{| class=\"table\"\n! 구분 || 무선 표집 (Random Sampling) || [[무선 할당]] (Random Assignment)\n|-\n| 언제 || 참가자를 '''뽑을''' 때 || 뽑힌 참가자를 '''조건에 나눌''' 때\n|-\n| 방향 || 모집단 → 표본 || 표본 → 실험 조건 / 통제 조건\n|-\n| 목적 || '''대표성''' (결과를 모집단에 일반화) || '''개인차의 영향 최소화''' (인과 추론)\n|-\n| 쓰이는 곳 || [[사회조사]], 실험 모집 || [[실험법]]\n|-\n| 슬라이드 || p.21 || p.23\n|}\n\n<pre class=\"ascii\">\n  모집단  ● ● ● ● ● ● ● ● ● ●\n          ● ● ● ● ● ● ● ● ● ●\n              │ '''무선 표집''' (누가 연구에 들어오나 → 대표성)\n              ▼\n  표본    ● ● ● ● ● ●\n              │ '''[[무선 할당]]''' (들어온 사람을 어디에 넣나 → 개인차 균등)\n        ┌─────┴─────┐\n  실험 조건 ● ● ●   통제 조건 ● ● ●\n<\/pre>\n\n{quiz}\n\"무선 표집은 모집된 참가자를 실험 조건과 통제 조건에 무작위로 배정하는 절차이다.\" 옳은가?\n{/quiz}\n{answer}\n'''틀렸다.''' 그건 '''무선 할당'''의 정의다. 무선 표집은 모집단에서 표본을 뽑는 절차(대표성), 무선 할당은 뽑힌 표본을 조건에 배정하는 절차(개인차 최소화). bank는 두 정의를 '''서로 바꿔 놓은''' 보기 두 개를 함정으로 냈다. (bank ch1 MC, 1장 p.21·23)\n{/answer}\n\n== 관련 문서 ==\n* [[무선 할당]] · [[사회조사]] · [[실험법]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.21"
 },
