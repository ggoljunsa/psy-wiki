<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>심리위키 — 심리학으로의 여행 중간고사 Wiki</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f5f5f5;
    --paper: #ffffff;
    --text: #222;
    --muted: #777;
    --link: #1d65b3;
    --link-visited: #6a4fa3;
    --header: #2a3b5a;
    --header-text: #fff;
    --border: #d8d8d8;
    --code-bg: #f3f3f3;
    --info-bg: #fff8d8;
    --info-border: #e0c060;
    --warn-bg: #ffe9e9;
    --warn-border: #d68080;
    --tip-bg: #e8f3ff;
    --tip-border: #80a8d6;
    --analogy-bg: #f0ecff;
    --analogy-border: #8a74d8;
    --def-bg: #e9f8ea;
    --def-border: #62b36a;
    --quiz-bg: #fff2e0;
    --quiz-border: #e09a40;
    --exam-bg: #ffe4ea;
    --exam-border: #d6465f;
    --table-head: #ecf0f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.65;
    overflow-wrap: break-word;
  }
  header.top {
    background: var(--header);
    color: var(--header-text);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 3px solid #1c2840;
  }
  header.top .logo {
    font-weight: 700;
    font-size: 18px;
    cursor: pointer;
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
  }
  header.top .logo span { color: #ffd75e; }
  header.top .search { flex: 1; min-width: 160px; max-width: 420px; }
  header.top .search input {
    width: 100%;
    padding: 6px 10px;
    border-radius: 3px;
    border: 1px solid #1c2840;
    background: #fff;
    color: #222;
    font-size: 14px;
  }
  .nav-toggle {
    display: none; background: #1c2840; color: #fff; border: 1px solid #3a4a6a;
    border-radius: 3px; padding: 5px 9px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  header.top .tagline {
    margin-left: auto;
    color: #c8d4e6;
    font-size: 12px;
  }

  .layout {
    display: grid;
    grid-template-columns: 220px 1fr 220px;
    gap: 18px;
    max-width: 1280px;
    margin: 16px auto;
    padding: 0 16px;
  }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 200px 1fr; }
    .toc-side { display: none; }
  }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; gap: 12px; padding: 0 12px; }
    /* 폰에서는 문서 목록을 기본 접고 ☰ 버튼으로 연다 (aside.nav-side 규칙보다 우선하도록 선택자 명시) */
    aside.nav-side { display: none; position: static; max-height: 60vh; }
    body.nav-open aside.nav-side { display: block; }
    .nav-toggle { display: inline-block; }
    header.top { padding: 8px 12px; gap: 8px; }
    header.top .tagline { display: none; }
    main.article { padding: 16px 14px 40px; }
    main h1 { font-size: 22px; }
    main h2 { font-size: 17px; }
  }

  aside.nav-side, aside.toc-side {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px;
    font-size: 13px;
    align-self: start;
    position: sticky;
    top: 70px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
  }
  aside h3 {
    margin: 0 0 8px;
    font-size: 13px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  aside ul { list-style: none; padding: 0; margin: 0; }
  aside ul li { padding: 3px 0; }
  aside ul li a {
    color: var(--link);
    text-decoration: none;
    display: block;
    padding: 2px 4px;
    border-radius: 3px;
  }
  aside ul li a:hover { background: #f0f4fa; text-decoration: underline; }
  aside ul li a.active { background: var(--header); color: #fff; font-weight: 600; }
  aside .cat { color: var(--muted); font-size: 11px; margin-top: 10px; }
  aside.toc-side .toc-item { padding-left: 0; }
  aside.toc-side .toc-item.l2 { padding-left: 12px; }
  aside.toc-side .toc-item.l3 { padding-left: 24px; }
  aside.toc-side .toc-item a { font-size: 12px; }

  main.article {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 24px 32px 60px;
    min-height: 70vh;
    min-width: 0;
  }
  main h1 {
    margin: 0 0 4px;
    font-size: 28px;
    border-bottom: 2px solid var(--header);
    padding-bottom: 8px;
  }
  main .meta { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  main h2 {
    margin-top: 28px;
    font-size: 20px;
    background: #f0f4fa;
    padding: 6px 10px;
    border-left: 4px solid var(--header);
  }
  main h3 {
    margin-top: 18px;
    font-size: 16px;
    color: #34466b;
    border-bottom: 1px dashed #ccc;
    padding-bottom: 4px;
  }
  main h4 { margin-top: 14px; font-size: 14px; color: #34466b; }
  main p { margin: 8px 0; }
  main a { color: var(--link); text-decoration: none; }
  main a:hover { text-decoration: underline; }
  main a.wiki { font-weight: 500; }
  main a.wiki-stub { color: #888; font-style: italic; }
  main ul, main ol { padding-left: 22px; }
  main li { margin: 3px 0; }
  main ul ul { margin: 3px 0; }

  main hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }

  main code {
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  main pre {
    background: #2b2b2b;
    color: #d0d4d8;
    padding: 12px 14px;
    border-radius: 4px;
    overflow-x: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
  }
  main pre.c, main pre.asm, main pre.sh, main pre.txt {
    background: #2b2b2b;
    color: #d0d4d8;
  }
  main pre.ascii {
    background: #f8f8f4;
    color: #222;
    border: 1px solid var(--border);
  }

  main table {
    border-collapse: collapse;
    margin: 10px 0;
    width: 100%;
    font-size: 14px;
  }
  main table th, main table td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
    vertical-align: top;
  }
  main table th { background: var(--table-head); font-weight: 600; }

  .info, .warn, .tip, .analogy, .def, .quiz, .exam {
    border-left: 4px solid;
    padding: 10px 14px;
    margin: 12px 0;
    border-radius: 0 4px 4px 0;
    font-size: 14px;
  }
  .info { background: var(--info-bg); border-color: var(--info-border); }
  .warn { background: var(--warn-bg); border-color: var(--warn-border); }
  .tip  { background: var(--tip-bg);  border-color: var(--tip-border); }
  .info::before { content: "📝 참고  "; font-weight: 700; }
  .warn::before { content: "⚠ 주의  "; font-weight: 700; }
  .tip::before  { content: "💡 팁  "; font-weight: 700; }

  .analogy { background: var(--analogy-bg); border-color: var(--analogy-border); }
  .analogy::before { content: "🎭 비유  "; font-weight: 700; color: #5b45a8; }
  .def { background: var(--def-bg); border-color: var(--def-border); }
  .def::before { content: "📖 정의  "; font-weight: 700; color: #2f7a38; }
  .quiz { background: var(--quiz-bg); border-color: var(--quiz-border); }
  .quiz::before { content: "❓ 예상문제  "; font-weight: 700; color: #a8650c; }
  .exam {
    background: var(--exam-bg);
    border-color: var(--exam-border);
    border-left-width: 6px;
    border-top: 1px solid var(--exam-border);
    border-right: 1px solid var(--exam-border);
    border-bottom: 1px solid var(--exam-border);
    box-shadow: 0 1px 3px rgba(214,70,95,0.18);
  }
  .exam::before { content: "🎯 출제 포인트  "; font-weight: 700; color: #b32741; }

  /* 박스 안에 표·목록 같은 블록이 오면 본문이 renderWikiText 로 재귀 렌더된다.
     첫 문단만 inline 으로 두어 "📝 참고" 라벨과 같은 줄에 붙게 한다. */
  .info > p:first-child, .warn > p:first-child, .tip > p:first-child,
  .joke > p:first-child, .analogy > p:first-child, .def > p:first-child,
  .quiz > p:first-child, .exam > p:first-child { display: inline; }
  .info > :last-child, .warn > :last-child, .tip > :last-child,
  .joke > :last-child, .analogy > :last-child, .def > :last-child,
  .quiz > :last-child, .exam > :last-child { margin-bottom: 0; }
  .info > table, .warn > table, .tip > table, .joke > table,
  .analogy > table, .def > table, .quiz > table, .exam > table { background: #fff; }

  details.answer {
    background: #f4f4f4;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 12px;
    margin: 4px 0 14px;
    font-size: 14px;
  }
  details.answer > summary {
    cursor: pointer;
    font-weight: 700;
    color: #2f6d33;
    list-style: none;
    user-select: none;
  }
  details.answer > summary::-webkit-details-marker { display: none; }
  details.answer > summary::before { content: "▸ "; }
  details.answer[open] > summary::before { content: "▾ "; }
  details.answer[open] > summary { margin-bottom: 6px; border-bottom: 1px dashed #bbb; }

  .joke {
    background: #f5e8ff;
    border-left: 4px solid #a466d6;
    padding: 8px 14px;
    margin: 12px 0;
    font-size: 13px;
    color: #555;
    border-radius: 0 4px 4px 0;
  }
  .joke::before { content: "💬 여담  "; font-weight: 700; color: #7440a8; }

  .footnote {
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: 24px;
  }
  .footnote-ref { font-size: 10px; vertical-align: super; color: var(--link); cursor: pointer; }

  .categories {
    margin-top: 30px;
    padding-top: 14px;
    border-top: 2px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  .categories .cat-tag, main .meta .cat-tag {
    display: inline-block;
    background: #e8e8e8;
    color: #444;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 6px;
    font-size: 12px;
  }

  .diagram {
    background: #fafafa;
    border: 1px solid var(--border);
    padding: 10px;
    margin: 12px 0;
    text-align: center;
    border-radius: 4px;
  }
  .diagram .caption { color: var(--muted); font-size: 12px; margin-top: 6px; }
  figure.pdf-img {
    margin: 16px auto;
    text-align: center;
    background: #fafafa;
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 4px;
    max-width: 100%;
  }
  figure.pdf-img img { width: auto; max-width: 100%; height: auto; border: 1px solid #ddd; background: white; }
  figure.pdf-img figcaption { color: var(--muted); font-size: 12px; margin-top: 8px; font-style: italic; }
  /* 크기 옵션은 상한만 정한다 — 본문 칸보다 넓어지지 않도록 100% 와 min() */
  figure.pdf-img.small img  { max-width: min(400px, 100%); }
  figure.pdf-img.medium img { max-width: min(600px, 100%); }
  figure.pdf-img.large img  { max-width: min(850px, 100%); }
  /* grid 자식이 내용물 폭에 끌려 늘어나지 않게 */
  main.article { min-width: 0; overflow-x: hidden; }
  main.article .sim { max-width: 100%; }
  /* 표는 칸보다 넓어지면 가로 스크롤 (폰) */
  .tablewrap { overflow-x: auto; max-width: 100%; margin: 10px 0; }
  .tablewrap table { margin: 0; }

  .stub-banner {
    background: #fff3cd;
    border: 1px dashed #d4a017;
    padding: 8px 12px;
    color: #6a5000;
    font-size: 13px;
    border-radius: 4px;
    margin-bottom: 12px;
  }

  .breadcrumb { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .breadcrumb a { color: var(--link); text-decoration: none; }

  footer.page { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }

  /* ============================================================
     SimEngine — 단계별 시뮬레이터
     ============================================================ */
  .sim {
    border: 2px solid #3a5480;
    border-radius: 6px;
    background: #fbfcfe;
    margin: 18px 0;
    padding: 0;
    overflow: hidden;
  }
  .sim:focus { outline: 2px solid #ffd75e; }
  .sim .sim-head {
    background: #3a5480;
    color: #fff;
    padding: 8px 12px;
  }
  .sim .sim-head .sim-title { font-weight: 700; font-size: 15px; }
  .sim .sim-head .sim-title::before { content: "🧪 "; }
  .sim .sim-head .sim-subtitle { font-size: 12px; color: #d3ddec; margin-top: 2px; }

  .sim .sim-body { padding: 10px 12px 14px; }

  .sim .sim-opts {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--border);
    margin-bottom: 8px;
  }
  .sim .sim-opt { font-size: 12px; color: #34466b; }
  .sim .sim-opt label { font-weight: 600; margin-right: 5px; }
  .sim select {
    font-size: 12px;
    padding: 3px 5px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: #fff;
    color: #222;
    max-width: 100%;
  }

  .sim .sim-ctrl {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin-bottom: 10px;
  }
  .sim .sim-btn {
    font-size: 14px;
    line-height: 1;
    padding: 6px 10px;
    border: 1px solid #3a5480;
    background: #fff;
    color: #2a3b5a;
    border-radius: 4px;
    cursor: pointer;
    min-width: 36px;
  }
  .sim .sim-btn:hover:not(:disabled) { background: #eef2f8; }
  .sim .sim-btn:disabled { opacity: 0.35; cursor: default; }
  .sim .sim-btn.playing { background: #3a5480; color: #fff; }
  .sim .sim-range { flex: 1; min-width: 100px; accent-color: #3a5480; }
  .sim .sim-count {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    color: #34466b;
    white-space: nowrap;
    min-width: 62px;
    text-align: right;
  }

  .sim .sim-panels {
    display: flex;
    gap: 10px;
    align-items: stretch;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .sim .sim-panel {
    flex: 1 1 260px;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    display: flex;
    flex-direction: column;
  }
  .sim .sim-panel-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    background: #eef2f8;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    color: #34466b;
  }
  .sim .sim-badge {
    margin-left: auto;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 9px;
    background: #ddd;
    color: #444;
    white-space: nowrap;
  }
  .sim .sim-badge.running { background: #cdefd2; color: #1d6b2a; }
  .sim .sim-badge.ready { background: #fdeec2; color: #8a6000; }
  .sim .sim-badge.spinning { background: #ffd9d9; color: #a52f2f; }
  .sim .sim-badge.blocked, .sim .sim-badge.parked, .sim .sim-badge.sleeping { background: #dcdcf2; color: #3c3c88; }
  .sim .sim-badge.done, .sim .sim-badge.finished { background: #d8d8d8; color: #555; }

  .sim .sim-code {
    position: relative;
    min-width: 0; max-width: 100%;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.55;
    padding: 6px 0;
    overflow: auto;
    max-height: 280px;
  }
  .sim .sim-line { display: flex; padding: 0 8px; white-space: pre; }
  .sim .sim-line .sim-ln {
    color: #aaa;
    width: 2.4em;
    flex: 0 0 auto;
    text-align: right;
    margin-right: 8px;
    user-select: none;
  }
  .sim .sim-line .sim-mark { width: 1.1em; flex: 0 0 auto; color: #c0392b; font-weight: 700; }
  .sim .sim-line .sim-src { flex: 1 1 auto; }
  .sim .sim-line.cur { background: #fff3bf; }
  .sim .sim-line.cur .sim-src { font-weight: 700; color: #6b4a00; }

  .sim .sim-vars { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 10px; }
  .sim .sim-vars th, .sim .sim-vars td {
    border: 1px solid var(--border);
    padding: 3px 8px;
    text-align: left;
  }
  .sim .sim-vars th { background: #eef2f8; font-weight: 600; width: 40%; }
  .sim .sim-vars tr.sim-group th {
    background: #dde5f0;
    color: #34466b;
    font-size: 11px;
    letter-spacing: 0.03em;
  }
  .sim .sim-vars td {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    background: #fff;
  }
  .sim .sim-vars td.changed { background: #fff3bf; font-weight: 700; }
  .sim .sim-vars td .sim-prev { font-size: 10px; color: #9a7b1f; font-weight: 400; margin-right: 4px; }

  .sim .sim-descbox {
    background: #eef4fb;
    border-left: 4px solid #3a5480;
    padding: 8px 12px;
    font-size: 13.5px;
    border-radius: 0 4px 4px 0;
    margin-bottom: 8px;
  }
  .sim .sim-descbox .sim-stepno { font-weight: 700; color: #3a5480; margin-right: 6px; }
  .sim .sim-note {
    background: var(--warn-bg);
    border-left: 4px solid var(--warn-border);
    padding: 8px 12px;
    font-size: 13px;
    border-radius: 0 4px 4px 0;
    margin-bottom: 8px;
  }
  .sim .sim-note::before { content: "⚠ "; font-weight: 700; }
  .sim .sim-svgbox { text-align: center; overflow-x: auto; margin-top: 4px; }
  .sim .sim-svgbox svg { max-width: 100%; height: auto; }
  .sim .sim-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }

  .sim-missing {
    border: 2px dashed #d6465f;
    background: #ffe4ea;
    color: #b32741;
    padding: 12px;
    border-radius: 4px;
    margin: 14px 0;
    font-weight: 700;
    font-size: 14px;
  }

  @media (max-width: 720px) {
    .sim .sim-panels { flex-direction: column; }
    .sim .sim-panel { flex: 1 1 auto; width: 100%; max-width: 100%; }
    .sim .sim-code { max-height: 220px; }
  }

  /* ---------- 움직이는 그림 (AnimEngine, [[anim:]]) ---------- */
  main.article .anim { max-width: 100%; }
  .anim {
    border: 1px solid #b9c4d8;
    border-left: 5px solid #d6465f;
    border-radius: 6px;
    background: #fff;
    margin: 16px 0;
    overflow: hidden;
    font-size: 13px;
  }
  .anim .anim-head {
    background: #3b2f4a;
    color: #fff;
    padding: 8px 12px;
  }
  .anim .anim-head .anim-title { font-weight: 700; font-size: 15px; }
  .anim .anim-head .anim-title::before { content: "🎞 "; }
  .anim .anim-head .anim-subtitle { font-size: 12px; color: #dcd3ea; margin-top: 2px; }
  .anim .anim-head a { color: #ffd75e; }
  .anim .anim-head code { background: rgba(255,255,255,0.14); color: #ffe9a8; }
  .anim .anim-stage {
    padding: 10px 12px 4px;
    text-align: center;
    background: #fbfbfd;
    overflow-x: auto;
  }
  .anim .anim-stage svg {
    width: 100%;
    max-width: 760px;
    height: auto;
    display: block;
    margin: 0 auto;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .anim .anim-stage.anim-missing { color: #b32741; font-weight: 700; padding: 14px; }

  "body": "'''심리위키'''에 오신 것을 환영합니다. 이 위키는 DGIST 교양 '''심리학으로의 여행'''(Prof. 이소영, 교재 마이어스 심리학 개론 13판) 중간고사 범위 — '''서막부터 6장까지''' — 를 나무위키 스타일로 정리한 문서 모음이다. 강의는 한국어로 진행되므로 본문도 한국어이고, 슬라이드에 영어가 병기된 용어는 영어를 함께 적었다.\n\n{tip}이 위키의 존재 이유는 딱 두 가지다. '''① 설명을 보고 명칭이 바로 떠오르게 한다''' — 중간고사 단답형 5문항은 \"명칭 쓰기\"만 나온다. 그래서 모든 사전 문서의 📖 정의 박스는 \"이런 현상을 무엇이라 하는가 → '''명칭'''\" 방향으로 썼다. '''② 용어를 까먹으면 클릭한다''' — 본문의 [[하향 처리]], [[부적 강화]], [[작업 기억]] 같은 파란 글씨는 전부 그 용어를 설명하는 사전 문서로 이어진다. 거기에 더해, 실험 절차와 모형은 ▶ 버튼으로 돌아가는 '''움직이는 그림'''과 값이 한 단계씩 바뀌는 '''시뮬레이터'''로 넣었다.{/tip}\n\n{warn}'''중간고사: 2026-10-13(화) 14:30–16:00, E1-101 컨벤션홀 A구역'''(평소 강의실 아님). 객관식 25 + 단답형 5 = 30문항, 범위 서막–6장('''1장은 슬라이드 29번 IRB까지''', 30번 통계부터 제외). 빨간 펜·연필·샤프 금지 → 검은 볼펜. 자세한 것은 [[시험 정보]].{/warn}\n\n== 빠른 시작 ==\n\n처음 방문했다면 [[읽는 순서]]를 따라가면 된다. 일곱 장을 한 줄씩 요약하면:\n\n# [[서막 심리학 이야기]] — 심리학은 \"행동과 심적 과정의 과학\". [[구조주의]] → [[기능주의]] → [[행동주의]] → [[인지혁명]]으로 이어진 역사와, 어느 하나로는 설명하지 않는다는 [[생물심리사회적 접근법]]\n# [[1장 심리과학을 비판적으로 생각하기]] — [[후견 편향]]·[[과신]] 때문에 직관을 믿으면 안 되는 이유, [[연구 방법 비교|연구 방법 다섯 가지]], '''[[상관]]은 인과가 아니다''', 조작·통제가 되는 건 [[실험법]]뿐, [[기관 생명 윤리 위원회|IRB]]\n# [[2장 마음의 생물학과 의식]] — [[뉴런]]의 [[활동 전위]]와 [[실무율]], [[신경전달물질]], [[뇌전도|EEG]]·[[fMRI]] 같은 뇌 연구 기법, [[시상]]·[[편도체]]·[[해마]]·[[소뇌]]가 하는 일, [[분할 뇌]], [[선택적 주의]]와 [[변화맹]]\n# [[3장 일생에 걸친 발달]] — [[피아제의 인지 발달 단계]]([[대상 영속성]]·[[보존 개념]]), [[비고츠키]]의 [[도약대]], [[마음 이론]], [[애착]]과 [[각인]], [[권위적·권위주의적·허용적 양육]], [[콜버그의 도덕성 발달 단계]], [[에릭슨의 심리사회적 발달 단계]], [[성공적 노화]]\n# [[4장 감각과 지각]] — [[상향 처리와 하향 처리]], [[절대 역치]]와 [[차이 역치]]([[베버의 법칙]]), [[신호 탐지 이론]], [[감각 순응]], [[지각 갖춤새]], [[원추체와 간상체]], [[게슈탈트 심리학]], [[양안 단서]]([[망막 부등]])\n# [[5장 학습]] — [[고전적 조건화]]([[파블로프]]: NS·US·UR·CS·CR, [[소거]]와 [[자발적 회복]]), [[조작적 조건화]]([[스키너]]: [[정적 강화와 부적 강화]], [[처벌]], [[강화 계획]], [[행동 조성]]), [[관찰 학습]]과 [[거울 뉴런]]\n# [[6장 기억]] — [[앳킨슨-시프린 모형]], [[작업 기억]]([[중앙 집행기]]·[[음운 루프]]), [[청크화]], [[간격두기 효과]]·[[검증 효과]], [[계열 위치 효과]], [[순행 간섭]]·[[역행 간섭]], [[오정보 효과]]\n\n{info}시험 24시간 전이라면 [[명칭 암기표]] → [[자주 틀리는 함정 모음]] → [[모의고사 복기]] 세 문서만 보자. 단답형 후보 명칭 전부, 교수가 \"많이 헷갈린다\"고 짚은 쌍, 모의고사 104문항이 어느 문서에 대응되는지가 거기 있다.{/info}\n\n[[anim:psych_history_timeline|서막 p.8–15 — 심리학이 130년 동안 어떤 학파를 거쳐 왔는지 10초로 본다. 각 카드의 이름(구조주의·기능주의·행동주의·인지혁명)과 \"무엇을 연구했나\" 한 줄을 눈에 익힌 뒤 서막 메인 문서로 가자]]\n\n[[img:L0-23.png|서막 p.23 — 생물심리사회적 접근법. 생물학적·심리적·사회문화적 세 수준이 \"행동 및 심적 과정\" 하나에 모인다. 교수가 \"어느 하나의 요인만으로는 설명할 수 없다\"고 거듭 강조한 그림이다|medium]]\n\n== 움직이는 그림·시뮬레이터 모음 ==\n\n각 문서 안에 박혀 있지만, 한 번에 찾고 싶을 때:\n\n{|\n! 주제 || 어디에 있나 || 무엇을 보여주나\n|-\n| 심리학사 연표 || [[서막 심리학 이야기]], 대문 || 분트 실험실에서 인지혁명까지 학파 카드\n|-\n| 생물심리사회적 접근 || [[생물심리사회적 접근법]], [[분석 수준]] || \"분노\" 하나를 세 수준이 함께 설명하는 벤 다이어그램\n|-\n| 상관 ≠ 인과 || [[상관]], [[제3의 변인]], [[착각 상관]] || 아이스크림과 식중독 산점도 위로 \"기온\"이 내려오는 장면\n|-\n| 실험 설계 || [[실험법]], [[무선 할당]], [[이중 은폐]], [[가짜약 효과]] || 무선 표집 → 무선 할당 → 처치·가짜약·통제 조건 → 이중 은폐\n|-\n| 연구 방법 판정 (sim) || [[연구 방법 비교]], [[실험법]], [[상관]] || 같은 질문을 다섯 방법으로 시도하며 \"인과 추론 가능?\"이 바뀌는 표\n|-\n| 뉴런 발화·시냅스 || [[뉴런]], [[활동 전위]], [[실무율]], [[신경전달물질]] || 역치를 넘으면 같은 크기 펄스, 강한 자극은 발화율만 ↑, 종말에서 신경전달물질 방출·재흡수\n|-\n| 활동 전위 (sim) || [[활동 전위]], [[실무율]], [[역치]] || 자극 강도를 올려도 스파이크 크기는 그대로, 발화율만 바뀌는 표\n|-\n| 뇌 구조 || [[뇌간]], [[시상]], [[소뇌]], [[변연계]], [[대뇌 피질]] || 측단면에서 구조가 차례로 켜지며 한 줄 기능 — 후각만 시상을 우회\n|-\n| 분할 뇌 || [[분할 뇌]], [[뇌량]] || 좌시야→우반구, 우시야→좌반구, 뇌량을 자르면 말과 손이 다른 답\n|-\n| 선택적 주의 || [[선택적 주의]], [[칵테일 파티 효과]], [[부주의적 맹시]], [[변화맹]] || 내 이름만 들리는 파티, 고릴라를 못 보는 실험, 바뀐 장면을 못 알아채는 실험\n|-\n| 대상 영속성 || [[대상 영속성]], [[감각 운동 단계]] || 천으로 가린 장난감을 찾는 아기 / 못 찾는 아기, 불가능한 사건 응시 시간\n|-\n| 피아제 단계 (sim) || [[피아제의 인지 발달 단계]], [[보존 개념]] || 4개월 → 13세로 나이를 올리며 대상 영속성·보존·자기중심성·가설 추리가 ✗→✓\n|-\n| 하향 처리 얼굴 13개 || [[하향 처리]], [[지각 갖춤새]] || 풍경 속 얼굴이 기대가 생기자 하나씩 떠오르는 장면\n|-\n| 시각 변환 경로 || [[변환]], [[눈의 구조]], [[원추체와 간상체]] || 빛 → 수정체 → 망막(원추체/간상체) → 시신경 → 시상 → 후두엽\n|-\n| 신호 탐지 이론 (sim) || [[신호 탐지 이론]] || 기준선 c 를 오른쪽으로 옮기면 Hit·FA 가 함께 줄고 d′ 는 그대로\n|-\n| 베버의 법칙 (sim) || [[베버의 법칙]], [[차이 역치]] || 100kg → 110 → 121 — \"+10kg\"이 아니라 \"×1.1\"\n|-\n| 게슈탈트 집단화 || [[게슈탈트 심리학]], [[집단화]], [[전경-배경]] || 꽃병/얼굴 반전, 근접성·연속성·폐쇄\n|-\n| 양안 단서 || [[양안 단서]], [[망막 부등]], [[깊이 지각]] || 물체가 가까워질수록 망막 상 차이와 수렴각이 커진다\n|-\n| 파블로프의 개 || [[고전적 조건화]], [[소거]], [[자발적 회복]] || 획득 ↑ → 소거 ↓ → 휴지 → 자발적 회복(부분) 곡선\n|-\n| 고전적 조건화 (sim) || [[고전적 조건화]], [[고차 조건형성]] || trial 단위 NS/US/CS/CR, 역행 조건형성·고차 조건형성 옵션\n|-\n| 스키너 상자 || [[스키너 상자]], [[정적 강화와 부적 강화]], [[처벌]] || 제시/제거 × 보상/혐오 2×2 가 차례로 켜지는 그림\n|-\n| 강화·처벌 판정 (sim) || [[정적 강화와 부적 강화]], [[부적 강화]], [[처벌]], [[부적 처벌]] || 사례마다 세 질문으로 2×2 칸에 배치 — \"부적 강화 ≠ 처벌\"\n|-\n| 강화 계획 (sim) || [[강화 계획]] || FR/VR/FI/VI 누적 반응 계단 그래프\n|-\n| 관찰 학습 || [[관찰 학습]], [[오뚝이 실험]] || 어른이 인형을 때리는 걸 본 아이가 같은 동작을 모방\n|-\n| 앳킨슨-시프린 || [[앳킨슨-시프린 모형]], [[감각 기억]], [[단기 기억]] || 감각 기억 → 주의 → 단기/작업 기억(되뇌기) → 부호화 → 장기 기억 → 인출\n|-\n| 작업 기억 || [[작업 기억]], [[중앙 집행기]], [[음운 루프]] || 중앙 집행기가 음운 루프·시공간 잡기장에 지시\n|-\n| 기억 폭·청크화 (sim) || [[매직 넘버 7]], [[청크화]], [[단기 기억]] || 숫자 폭 과제, 8자리를 3청크로 묶기\n|-\n| 계열 위치 (sim) || [[계열 위치 효과]] || 즉시 회상 U자 곡선, 지연 회상에서 최신 효과만 사라짐\n|-\n| 간섭 || [[순행 간섭]], [[역행 간섭]] || 옛 기억이 앞에서, 새 기억이 뒤에서 끼어드는 방향\n|-\n| 오정보 효과 || [[오정보 효과]], [[재응고화]] || \"접촉\" vs \"충돌\" 질문이 속도 추정을 바꾸는 로프터스 실험\n|}\n\n== 분류별 문서 ==\n\n=== 시험 대비 ===\n* [[시험 정보]] · [[명칭 암기표]] · [[자주 틀리는 함정 모음]] · [[모의고사 복기]] · [[읽는 순서]]\n\n=== 서막 ===\n* [[서막 심리학 이야기]] · [[심리학]] · [[빌헬름 분트]] · [[구조주의]] · [[내성법]] · [[기능주의]] · [[윌리엄 제임스]] · [[행동주의]] · [[정신분석]] · [[프로이트]] · [[인본주의 심리학]] · [[인지혁명]] · [[컴퓨터 메타포]] · [[인지심리학]] · [[인지신경과학]]\n* [[선천성-후천성 논제]] · [[자연선택]] · [[진화심리학]] · [[행동유전학]] · [[쌍둥이 연구]] · [[비교문화심리학]] · [[에크만의 기본 감정]] · [[생물심리사회적 접근법]] · [[분석 수준]] · [[이론적 조망]] · [[심리학의 하위 분야]] · [[상담심리학]]\n\n=== 1장 ===\n* [[1장 심리과학을 비판적으로 생각하기]] · [[후견 편향]] · [[과신]] · [[메타인지]] · [[무선적 사건에서의 질서 지각]] · [[탈진실]] · [[탈진실의 취약성 요인]] · [[가용성 어림법]] · [[인지적 구두쇠]] · [[확증 편향]]\n* [[과학적 방법]] · [[이론]] · [[가설]] · [[조작적 정의]] · [[연구 방법 비교]] · [[사례 연구]] · [[자연 관찰]] · [[사회조사]] · [[말표현 효과]] · [[무선 표집]] · [[상관]] · [[착각 상관]] · [[평균으로의 회귀]] · [[제3의 변인]] · [[실험법]] · [[무선 할당]] · [[가짜약 효과]] · [[이중 은폐]] · [[고지된 동의]] · [[디브리핑]] · [[기관 생명 윤리 위원회]]\n\n=== 2장 ===\n* [[2장 마음의 생물학과 의식]] · [[신경 가소성]] · [[뉴런]] · [   "body": "처음부터 끝까지 읽으면 일곱 장 수업 전체가 이해되도록 짠 순서다. 각 단계는 \"이 문서를 읽고 나면 다음 문서의 용어를 알게 된다\"는 의존 관계로 이어진다. 움직이는 그림(▶)과 시뮬레이터는 건너뛰지 말 것 — 글로 읽은 정의와 눈앞에서 값이 바뀌는 것은 기억에 남는 정도가 다르다([[검증 효과]]와 [[처리 수준]]이 그 이유를 설명한다).\n\n{analogy}이 순서는 박물관 동선과 같다. 서막은 입구 안내판(심리학이 뭔지, 어떤 학파가 있었는지), 1장은 \"전시물을 어떻게 믿을지\"를 가르치는 방법론 방, 2장은 하드웨어 전시실(뇌), 3장은 시간순 갤러리(발달), 4장은 입력 장치관(감각·지각), 5장은 행동이 바뀌는 과정관(학습), 6장은 그것이 저장되는 수장고(기억)다. 순서대로 돌아야 다음 방의 설명문이 읽힌다.{/analogy}\n\n[[img:L1-25.png|1장 p.25 — 연구 방법 간 비교. 기술적 방법·상관 연구·실험 중 \"처치\"가 있는 것은 실험뿐이다. 이 표 한 장이 1장의 결론이고, 2장 이후의 모든 \"실험\"이 어떤 자격으로 인과를 말하는지의 근거다|medium]]\n\n== 전체 코스 (약 9시간) ==\n\n=== 1단계 — 심리학이 뭔지 (서막, 1시간) ===\n# [[서막 심리학 이야기]] — 전부 읽기. 연표 애니메이션을 두 번 돌려 [[구조주의]]·[[기능주의]]·[[행동주의]]·[[정신분석]]·[[인본주의 심리학]]·[[인지혁명]] 여섯 카드의 \"누가, 무엇을 연구했나\"를 말할 수 있으면 통과.\n# [[생물심리사회적 접근법]] → [[분석 수준]] → [[이론적 조망]] — 교수가 가장 자주 반복한 \"어느 하나의 요인만으로는 설명하지 않는다\".\n# [[선천성-후천성 논제]] → [[진화심리학]] vs [[행동유전학]] → [[쌍둥이 연구]] — 비교표를 손으로 한 번 그려 볼 것.\n# [[컴퓨터 메타포]] — SSD=장기 기억, RAM=작업 기억. 6장에서 다시 나온다.\n\n=== 2단계 — 믿을 수 있는 심리학 (1장, 1.5시간) ⭐ ===\n# [[1장 심리과학을 비판적으로 생각하기]] — p.1–29까지(p.30 이후 통계는 시험 범위 밖).\n# [[후견 편향]] · [[과신]] · [[무선적 사건에서의 질서 지각]] — 직관을 못 믿는 세 이유. 그다음 [[확증 편향]]·[[가용성 어림법]]·[[탈진실]].\n# [[연구 방법 비교]] — research_methods 시뮬레이터를 두 질문 옵션으로 모두 돌려 \"인과 추론 ✓\"가 [[실험법]]에서만 켜지는 것을 확인. [[사례 연구]]·[[자연 관찰]]·[[사회조사]]([[무선 표집]]·[[말표현 효과]]) 순서대로.\n# [[상관]] → [[착각 상관]] → [[제3의 변인]] → [[평균으로의 회귀]] — '''상관은 인과가 아니다'''. 애니메이션에서 \"기온\"이 내려오는 장면.\n# [[실험법]] → [[무선 할당]] → [[가짜약 효과]] → [[이중 은폐]] — [[무선 표집]]과 [[무선 할당]]을 구분할 수 있으면 통과.\n# [[고지된 동의]] · [[디브리핑]] · [[기관 생명 윤리 위원회]] — 범위의 마지막 슬라이드(29번).\n\n=== 3단계 — 뇌와 의식 (2장, 1.5시간) ===\n# [[2장 마음의 생물학과 의식]] — 전부.\n# [[뉴런]] → [[활동 전위]] → [[역치]] → [[실무율]] — action_potential 시뮬레이터로 \"자극이 세져도 스파이크 크기는 같고 발화율만 는다\"를 눈으로. 이어서 [[신경전달물질]]·[[재흡수]]·[[도파민]]·[[세로토닌]].\n# [[신경계]] — 중추/말초, 체신경/자율신경, 교감/부교감 표.\n# [[손상법]] · [[뇌전도]] · [[사건 관련 전위]] · [[fMRI]] · [[확산 스펙트럼 영상]] — 비교표(시간 해상도·공간 해상도·인과 추론 가능 여부).\n# [[뇌간]] → [[시상]] → [[소뇌]] → [[변연계]]([[편도체]]·[[시상하부]]·[[해마]]) → [[대뇌 피질]] → [[연합 영역]] — brain_regions 애니메이션. \"후각만 시상을 거치지 않는다\".\n# [[뇌량]] → [[분할 뇌]] — 좌시야→우반구. 4장 p.25 슬라이드 오류 주의.\n# [[선택적 주의]] → [[칵테일 파티 효과]] · [[부주의적 맹시]] · [[변화맹]] → [[이중 처리]] → [[수면과 꿈]].\n\n=== 4단계 — 발달 (3장, 1.5시간) ⭐ ===\n# [[3장 일생에 걸친 발달]] — 전부. 먼저 [[횡단 연구]] vs [[종단 연구]], [[테라토겐]], [[습관화]].\n# [[피아제의 인지 발달 단계]] — piaget_stages 시뮬레이터로 4개월→13세. [[스키마]]·[[동화]]·[[조절]] → [[감각 운동 단계]]([[대상 영속성]]) → [[전조작 단계]]([[보존 개념]]·[[자기중심성]]) → [[구체적 조작 단계]] → [[형식적 조작 단계]].\n# [[비고츠키]] · [[도약대]] — \"피아제는 물리적 환경, 비고츠키는 사회적 환경\". 그다음 [[마음 이론]] — 마음 이론이 발달해야 사회성.\n# [[애착]] → [[할로우의 대리모 실험]] → [[각인]] → [[안정 애착과 불안정 애착]] → [[기본 신뢰감]].\n# [[권위적·권위주의적·허용적 양육]] — '''용어 혼동 주의'''(교수가 직접 경고). 양육↔자녀 특성은 상관.\n# [[자기 개념]](거울 실험 15–18개월) → [[콜버그의 도덕성 발달 단계]] · [[도덕 직관]] → [[에릭슨의 심리사회적 발달 단계]] · [[정체성]] → [[설단 현상]] · [[사회적 시계]] · [[성공적 노화]](세 요인 모두 필요).\n\n=== 5단계 — 감각과 지각 (4장, 1.5시간) ⭐⭐ ===\n# [[4장 감각과 지각]] — 전부.\n# [[감각과 지각의 구분]] → [[상향 처리와 하향 처리]] — top_down_faces 애니메이션(얼굴 13개). [[상향 처리]]·[[하향 처리]] 각각의 정의 박스.\n# [[변환]] → [[절대 역치]] → [[점화]] → [[신호 탐지 이론]] — signal_detection 시뮬레이터에서 기준선을 오른쪽으로 옮기며 Hit·FA 가 같이 줄고 d′ 는 안 변하는 것을 확인.\n# [[차이 역치]] → [[베버의 법칙]] — weber_law 시뮬레이터: 100 → 110 → '''121'''. \"+10\"이 아니라 \"×1.1\".\n# [[감각 순응]] → [[지각 갖춤새]] → [[음소 복원 효과]] → [[맥락·동기·정서와 지각]] — 전부 하향 처리의 예.\n# [[눈의 구조]] → [[원추체와 간상체]] → [[자질 탐지기]] → [[방추상 얼굴 영역]] → [[병렬 처리]] — transduction_vision 애니메이션.\n# [[게슈탈트 심리학]] → [[전경-배경]] → [[집단화]] → [[역투사의 문제]] — '''게슈탈트는 타고난 상향 처리 쪽'''(\"많이 헷갈리는 부분\").\n# [[깊이 지각]] → [[양안 단서]]([[망막 부등]]) vs [[단안 단서]] → [[모양 항등성]]. 끝으로 [[맥거크 효과]] · [[체화 인지]] · [[공감각]] · [[초감각지각]].\n\n=== 6단계 — 학습 (5장, 1.5시간) ⭐⭐ ===\n# [[5장 학습]] — 전부. [[학습]] · [[민감화]] · [[습관화]]부터.\n# [[고전적 조건화]] — pavlov_dog 애니메이션 → classical_conditioning 시뮬레이터(획득→소거→자발적 회복, 역행·고차 옵션). [[파블로프]] · [[중성 자극]] · [[무조건 자극]] · [[조건 자극]] · [[무조건 반응]] · [[조건 반응]] 여섯 용어 표를 손으로 쓰기. '''NS 먼저, US 나중.'''\n# [[고차 조건형성]] → [[소거]] → [[자발적 회복]] → [[일반화]] → [[변별]] — '''소거는 제거가 아니라 억압''', 자발적 회복이 그 증거.\n# [[조작적 조건화]] → [[효과의 법칙]] → [[스키너]] · [[스키너 상자]] → [[강화]] → [[행동 조성]] · [[계기적 근사법]].\n# [[정적 강화와 부적 강화]] — skinner_box 애니메이션 → operant_quadrant 시뮬레이터 두 세트. [[정적 강화]] · [[부적 강화]] · [[처벌]] · [[부적 처벌]]. '''부적 강화 ≠ 처벌''', 약물 중독 = 금단 제거에 의한 부적 강화.\n# [[조건 강화물]] → [[강화 계획]] — reinforcement_schedules 시뮬레이터 FR/VR/FI/VI.\n# [[고전적 조건화와 조작적 조건화 비교]] → [[관찰 학습]] → [[오뚝이 실험]] → [[거울 뉴런]].\n\n=== 7단계 — 기억 (6장, 1.5시간) ⭐ ===\n# [[6장 기억]] — 전부. 10/6 수업 전이라 슬라이드 기준.\n# [[회상]] vs [[재인]] → [[망각 곡선]] → [[앳킨슨-시프린 모형]] — atkinson_shiffrin 애니메이션. [[감각 기억]]([[스펄링 실험]]) → [[단기 기억]]([[피터슨과 피터슨 실험]]·[[매직 넘버 7]]) → [[작업 기억]]([[중앙 집행기]]·[[음운 루프]]).\n# [[자동 처리와 통제 처리]] → [[암묵 기억]] vs [[외현 기억]].\n# [[청크화]](working_memory_span 시뮬레이터) → [[간격두기 효과]] → [[검증 효과]] → [[처리 수준]] → [[자기참조 효과]] → [[기억 응고화]] · [[섬광 기억]] — 교수가 추천한 공부법이 여기 있다.\n# [[인출 단서]] → [[부호화 명세성 원리]] → [[맥락 의존 기억과 상태 의존 기억]] → [[계열 위치 효과]](serial_position 시뮬레이터, 즉시/지연).\n# [[기억상실증]] → [[순행 간섭]] · [[역행 간섭]](interference 애니메이션) → [[재응고화]] → [[오정보 효과]] → [[출처 기억상실]].\n\n=== 8단계 — 마무리 (1시간) ===\n# [[명칭 암기표]] — 설명을 가리고 명칭을 쓰는 연습. 단답형 5문항이 여기서 나온다.\n# [[자주 틀리는 함정 모음]] — 교수가 \"헷갈린다\"고 한 쌍과 모의고사 오답 보기.\n# [[모의고사 복기]] — 실전형 1–3회를 풀고 틀린 문항을 대응 문서로 되돌아가 읽기.\n# [[시험 정보]] — 일시·장소·필기구 확인.\n\n== 시험 직전 2시간 코스 ==\n# [[명칭 암기표]] 최우선 30개 (30분)\n# [[자주 틀리는 함정 모음]] (30분)\n# 장 메인 문서 7개의 `시험 대비 핵심 요약` 절만 (40분): [[서막 심리학 이야기]] · [[1장 심리과학을 비판적으로 생각하기]] · [[2장 마음의 생물학과 의식]] · [[3장 일생에 걸친 발달]] · [[4장 감각과 지각]] · [[5장 학습]] · [[6장 기억]]\n# [[모의고사 복기]]에서 ⚠ 표시 문항만 (20분)\n\n== 단답형 대비 코스 (명칭 쓰기만 나온다) ==\n{tip}단답형은 \"심리 기제·접근법·모델의 이름을 쓰라\"는 문제만 나온다(0929 녹음). 그러니 각 사전 문서의 📖 정의 박스를 '''아래 명칭을 가리고 설명만 읽은 뒤''' 명칭을 소리 내어 말해 보는 것이 가장 효율적인 연습이다. 통합요약이 꼽은 최우선 후보: [[생물심리사회적 접근법]] · [[후견 편향]] · [[착각 상관]] · [[가짜약 효과]] · [[신경 가소성]] · [[칵테일 파티 효과]] · [[변화맹]] · [[이중 처리]] · [[대상 영속성]] · [[마음 이론]] · [[각인]] · [[하향 처리]] · [[베버의 법칙]] · [[감각 순응]] · [[지각 갖춤새]] · [[소거]] · [[자발적 회복]] · [[효과의 법칙]] · [[행동 조성]] · [[계기적 근사법]] · [[부적 강화]] · [[관찰 학습]] · [[거울 뉴런]] · [[작업 기억]] · [[청크화]] · [[간격두기 효과]] · [[검증 효과]] · [[오정보 효과]].{/tip}"
 },

  "body": "심리학으로의 여행 중간고사에 관한 사실은 이 문서가 기준이다(원본: 과목 폴더의 `_시험정보.md`, 최종 갱신 2026-09-29). 출처끼리 충돌하면 '''더 최근에 교수가 직접 말한 것'''이 우선하고, 어느 쪽을 택했는지와 날짜를 기록한다.\n\n{analogy}시험 정보는 여행의 항공권과 같다. 아무리 공부(짐)를 잘 챙겨도 날짜·장소·반입 금지 물품(빨간 펜·연필)을 틀리면 탑승을 못 한다. 이 문서는 딱 한 번, 시험 전날 다시 읽으면 된다.{/analogy}\n\n== 성적 구성 ==\n\n[[img:L0-04.png|서막 p.4 — 평가 내역. 중간·기말 각 35점(객관식 및 단답형 지필평가), 레포트 15점, 출석 15점. 0825 녹음 06:26–10:39에서 교수가 설명했다|medium]]\n\n{|\n! 항목 || 배점 || 비고\n|-\n| 중간고사 || 35 || 대면 지필. 객관식 + 단답형\n|-\n| 기말고사 || 35 || 대면 지필\n|-\n| 레포트 || 15 || 1회. 일상·사회 현상을 수업에서 배운 심리 기제로 해석(소재 자유). 세부 안내는 '''중간고사 이후'''\n|-\n| 출석 || 15 || 9/1부터 매 수업 호명. 1/3 이상 결석 시 F(\"5회 이상이면 처리\"). 공결은 이메일로 사안별 판단\n|}\n\n== 중간고사 ==\n\n{|\n! 항목 || 내용 || 출처\n|-\n| 일시 || '''2026-10-13(화) 14:30–16:00 (90분)''' || 공지, 0922 녹음 2:09:48\n|-\n| 장소 || '''E1-101 컨벤션홀 A구역''' (평소 강의실 아님) || 공지, 0922 녹음 2:10:21, 0929 녹음 01:36\n|-\n| 구성 || '''객관식 25 + 단답형 5 = 30문항''' || 0922 녹음 2:10:21\n|-\n| 단답형 || 심리 기제·접근법·모델 이름 등 '''명칭 쓰기만''' 나옴. 개념 특성을 서술하는 장문형은 없음 || 0929 녹음 00:00\n|-\n| 범위 || 서막–6장 (1–7주차) || 공지, 0922 녹음\n|-\n| 1장 범위 || '''29번 슬라이드([[기관 생명 윤리 위원회|IRB]] 연구 승인 절차)까지.''' 30번(통계적 추리)부터 제외. 통계는 기말에 연구설계 주차와 합쳐 출제 || 0922 녹음 2:12:52 ⟵ 채택\n|-\n| 필기구 || '''빨간 펜·연필·샤프 금지''' → 검은 볼펜(지워지지 않는 펜) || 0922 녹음 2:13:47, 0929 녹음 00:56\n|-\n| 변경 공지 || LMS 공지사항에 올림. 매주 확인할 것 || 0922 녹음 2:12:52\n|}\n\n{warn}'''범위 충돌 기록''': 교수 공지문은 \"1장 슬라이드 30번 이후 제외\"라고 적어 30번이 포함되는지 애매했다. 교수는 0922 녹음 2:12:52에서 \"30번 슬라이드부터 배제, 29번까지만 포함\"이라고 직접 말했다. '''녹음을 채택'''한다(2026-09-29 기록).{/warn}\n\n== 출제 경향 예측 (확정 아님) ==\n\n* 단답형 5문항은 장당 하나 이하일 가능성이 크다. 개념·이론·효과 명칭(예: [[대상 영속성]], [[부적 강화]], [[검증 효과]], [[하향 처리]], [[생물심리사회적 접근법]])이 학자 이름보다 나올 가능성이 높다. 전체 후보는 [[명칭 암기표]].\n* 객관식 25문항은 장당 3–4문항꼴이다. 비슷한 개념 구분, 사례↔개념 연결, 학자↔실험 연결이 주를 이룰 것으로 본다. 모의고사 104문항이 이 형식으로 만들어져 있다 → [[모의고사 복기]].\n\n{exam}교수가 녹음에서 여러 번 강조한 것: [[상관]]≠인과 · 표본은 크기보다 대표성([[무선 표집]]) · 조작·통제가 가능한 건 [[실험법]]뿐 · [[생물심리사회적 접근법]] · [[권위적·권위주의적·허용적 양육|권위적 vs 권위주의적]] 양육(용어 혼동 주의) · [[마음 이론]]→사회성 · [[성공적 노화]]의 세 요인 · [[하향 처리]](얼굴 13개 그림) · [[부적 강화]](약물 금단) · [[소거]]는 제거가 아니라 억제([[자발적 회복]]). 전부 [[자주 틀리는 함정 모음]]에 정리돼 있다.{/exam}\n\n{info}교수가 9/29 수업 후반에 '''서막–3장 중요 포인트'''를, 10/6 수업 끝에 '''4–6장 중요 포인트'''를 정리해 주겠다고 했다. 이 녹음이 사실상 가장 강한 출제 힌트다. 9/29 후반부(5장 p.20 이후 + 서막–3장 정리)와 10/6 녹음은 아직 폴더에 없다 — 도착하면 각 장 메인 문서의 🎙 절과 이 문서를 갱신한다.{/info}\n\n== 대비 자료 ==\n* 이 위키: [[읽는 순서]] → 장 메인 문서 7개 → [[명칭 암기표]] · [[자주 틀리는 함정 모음]] · [[모의고사 복기]]\n* 과목 폴더: 통합 요약 `중간고사/정리본/중간고사_통합요약.md`, 장별 정리본 `중간고사/정리본/`, 모의고사 실전형 1–3회 + 전체 `중간고사/문제풀이/중간고사_모의/`(풀고 나면 틀린 문항을 `중간고사_모의_v1_틀린것들.md`에 적는다), 기내학습 오프라인 앱·Anki `중간고사/기내학습/`."

 "서막 심리학 이야기": {
  "title": "서막. 심리학 이야기",

   "메인"
  ],
  "body": "'''서막. 심리학 이야기'''는 이 과목의 첫 장으로, \"'''눈에 보이지 않는 마음을 어떻게 과학으로 연구하게 되었는가?'''\"라는 질문 하나를 따라간다. [[빌헬름 분트]]의 실험실(1879)에서 출발해 [[구조주의]] → [[기능주의]] → [[행동주의]]·[[정신분석]]·[[인본주의 심리학]] → [[인지혁명]]으로 이어지는 역사를 훑고, 이어서 [[선천성-후천성 논제]], [[생물심리사회적 접근법]], [[이론적 조망]], [[심리학의 하위 분야]]까지 심리학이라는 학문의 '''지도'''를 그린다.\n\n시험(→ [[시험 정보]])에서는 단답형이 '''명칭 쓰기'''만 나오므로, 서막은 \"'''설명을 보고 학파·접근법·분야 이름을 쓰는'''\" 문제가 가장 많이 나올 장이다. 특히 [[생물심리사회적 접근법]]은 통합요약 최우선 명칭이다.\n\n{analogy}\n서막의 역사는 '''잠긴 금고(마음) 안을 알아내려는 탐정들의 세대교체'''다.\n* 1세대 [[구조주의]]: \"금고 주인에게 안에 뭐가 들었는지 '''직접 말하게''' 하자\"([[내성법]]) → 사람마다 말이 달라 못 믿겠다.\n* 2세대 [[기능주의]]: \"안에 뭐가 들었는지보다 이 금고가 '''무슨 쓸모'''가 있는지 보자.\"\n* 3세대 [[행동주의]]: \"금고는 못 연다. '''넣은 것(자극)과 나온 것(행동)'''만 기록하자.\"\n* 4세대 [[인지혁명]]: \"컴퓨터를 보니 금고도 '''입력 → 처리 → 산출''' 기계일지 모른다. 다시 안을 연구하자.\"\n* 5세대 [[인지신경과학]]: \"이제 '''X선(뇌영상)'''으로 금고 내부를 직접 찍어 보자.\"\n{/analogy}\n\n{info}\n슬라이드 p.1–4 는 표지·강의자 소개·교재·평가 내역(중간/기말 각 35, 레포트 15, 출석 15)이라 시험 출제 대상이 아니다 → [[시험 정보]] 문서에서 다룬다. 본문 페이지 번호는 '''인쇄 슬라이드 번호'''(총 28장, 숨김 슬라이드 없음)다.\n{/info}\n\n== 0. 이 장이 다른 장과 이어지는 곳 ==\n서막은 뒤의 여섯 장에서 본격적으로 다룰 개념을 '''예고편'''처럼 한 줄씩 꺼내 놓는다. 서막에서 이름만 듣고 지나간 것이 어디서 다시 나오는지 미리 알아 두면, 뒤 장을 읽을 때 \"아 그거!\" 하고 연결된다.\n\n{| class=\"table\"\n! 서막에서 처음 나온 것 (p.) || 다시 본격적으로 나오는 곳 || 연결 포인트\n|-\n| [[과학적 방법|심리학 = 심리과학]] (p.7) || [[1장 심리과학을 비판적으로 생각하기]] || 보이지 않는 마음을 객관적·정량적으로 연구하는 '''방법'''이 1장 전체\n|-\n| [[행동주의]]의 [[고전적 조건화]]·[[조작적 조건화]] (p.11) || [[5장 학습]] || 교수: \"5장 학습에서 다시 다룬다\"(🎙 8/25). [[파블로프]]·[[스키너]]\n|-\n| [[인지신경과학]]의 뇌전도·뇌영상 (p.15) || [[2장 마음의 생물학과 의식]] || [[뇌전도]], [[fMRI]] 등 뇌 연구 기법\n|-\n| [[프로이트]]의 무의식 (p.12) || [[수면과 꿈]] (2장 p.38) || 꿈의 소망충족 이론\n|-\n| [[컴퓨터 메타포]]의 RAM·SSD (p.14) || [[6장 기억]] || RAM = [[작업 기억]], SSD = [[앳킨슨-시프린 모형|장기 기억]]\n|-\n| [[기능주의]]의 의식 (p.10) || [[2장 마음의 생물학과 의식]] (p.31) || 의식 = 무언가를 자각할 수 있는 상태\n|-\n| [[선천성-후천성 논제]] (p.16–21) || [[3장 일생에 걸친 발달]] || 발달은 유전과 환경의 상호작용\n|-\n| 학습법: [[검증 효과]]·[[간격두기 효과|분산 학습]] (p.28) || [[6장 기억]] (p.22–23) || 9/29 교수: 공부 방법은 6장 기억에 더 연결\n|}\n\n== p.5–6 — 심리학이란? ⭐ ==\n{def}\n'''설명''': 마음이 어떻게 작동하고 행동으로 나타나는가를 연구하는 학문. 행동과 심적 과정의 과학 (서막 p.6)\n'''명칭''': [[심리학]] (Psychology)\n{/def}\n\n슬라이드는 두 개의 질문을 던진다. '''질문 1''': 마음을 어떻게 정의할 수 있는가? '''질문 2''': 보이지 않는 마음이라는 것을 어떻게 관찰할 수 있는가? 서막의 역사 파트는 사실상 '''질문 2에 대한 답의 변천사'''다.\n\n심리의 영역은 '''인지'''(기억, 주의…), '''정서'''(기쁨, 슬픔…), '''성격'''(우울, 불안…) 등으로 나뉜다. 교수는 강의실에 오는 과정 하나에도 회상(어느 강의실이었지?) → 지각 → 계획·결정 → 행동이 모두 들어 있다며, 이것이 전부 \"마음의 작동\"이라고 설명했다(🎙 8/25).\n\n== p.7 — 심리학 = 심리과학 ⭐ ==\n[[img:L0-07.png|p.7 과학으로서의 심리학 — 질문하기 → 가설 세우기 → 연구 설계·자료 수집 → 자료 분석 → 결론 도출 → 지식 축적·공유의 순환|medium]]\n\n심리학은 '''과학적 연구방법'''을 추구한다. 보이지 않는 마음을 '''객관적으로, 정량적으로''' 연구하기 위해 다양한 연구 방법을 적용하고, 사람을 대상으로 데이터를 수집해 정립된 통계 분석으로 결과를 도출한다. 마음이 안 보인다고 탐구 방식까지 추상적인 것은 아니다 — 예컨대 우울 설문 점수가 내면의 우울을 반영한다고 '''가정'''하고 분석한다. 그림의 순환 구조는 [[1장 심리과학을 비판적으로 생각하기|1장]]의 [[과학적 방법]]으로 그대로 이어진다.\n\n슬라이드 마지막 줄 \"심리과학이 성립할 때까지의 여정은 어떠하였는가?\"가 다음 절부터의 역사로 넘어가는 다리다.\n\n[[anim:psych_history_timeline|1879 분트 실험실부터 인지신경과학까지 학파 카드가 연표 위에 차례로 뜹니다. 각 카드의 \"핵심 한 줄\"을 소리 내어 읽고, 끝에 나오는 요점 \"마음 → 행동 → 다시 마음(+뇌)\"을 기억한 뒤 아래 p.8부터 읽으세요.]]\n\n== p.8 — 심리과학의 태동: 빌헬름 분트 ⭐⭐ ==\n[[img:L0-08.png|p.8 빌헬름 분트(Wilhelm Wundt) — 1879년 최초 실험실, 공이 소리 반응 실험(0.1초 vs 0.2초)|medium]]\n\n[[빌헬름 분트]]가 '''1879년 최초의 심리학 실험실'''(라이프치히)을 세우면서 과학으로서의 심리학이 시작됐다. 같은 해 그가 한 '''심적 과정 측정 실험'''(공이치기 실험, Hunt, 1993)은 다음과 같다.\n\n<pre class=\"ascii\">\n 실험 1:  [공이가 플랫폼을 침: \"딱!\"] ──듣자마자──────────────▶ [전신기 버튼] ≈ 0.1초\n 실험 2:  [공이가 플랫폼을 침: \"딱!\"] ──듣고 → \"들었다\"고 자각──▶ [전신기 버튼] ≈ 0.2초\n                                         └─ 추가 0.1초 = '''자각'''이라는 심적 과정\n<\/pre>\n\n자각이라는 추가 과정이 시간이 더 걸릴 것이라는 가설을 '''계량적으로''' 확인했다는 점이 핵심이다. 교수: \"심리학이 과학으로 측정될 수 있음을 보인 첫 사례\"(🎙 8/25).\n\n{warn}\n'''0.1초 / 0.2초 순서 바꾸기 함정''': 즉시 누르기 = 약 '''0.1초''', 자각 후 누르기 = 약 '''0.2초'''. \"즉시 조건이 더 오래 걸렸다\"는 보기는 순서를 뒤집은 오답이다. 또 이 실험은 '''반응 시간'''을 잰 실험이지 참가자가 자유롭게 서술한 내용을 분석한 실험이 아니다.\n{/warn}\n\n== p.9 — 구조주의와 내성법 ⭐⭐⭐ ==\n[[img:L0-09.png|p.9 구조주의가 바라본 심리와 내성법 — 마음을 퍼즐 조각(감각 요소)으로 분해, 소리를 듣고 \"색깔·밝기·형태\"를 보고|medium]]\n\n[[구조주의]](Structuralism)의 주요 학자는 [[빌헬름 분트]]와 그의 제자 [[구조주의|에드워드 브래드퍼드 티치너]]다. 마음은 '''여러 하위 구성 요소'''로 이루어져 있고, 마음을 과학적으로 탐구하려면 이 구성 요소들을 하나씩 분리해야 한다고 봤다. 교수의 비유: 물 분자를 수소 2 + 산소 1로 쪼갤 수 있듯 마음도 쪼갤 수 있다(🎙 8/25).\n\n방법은 [[내성법]](introspection) — 자신의 내면을 스스로 들여다보면서 '''엄격하게''' 보고한다. 자유 기술이 아니라 기준·가이드라인으로 '''훈련'''시킨 통제된 보고법이다(🎙 8/25 \"분석적 내성법\"). 한계는 '''사람마다 보고 결과가 달라 신뢰도가 떨어진다'''는 것.\n\n{exam}\n통합요약 출제 예상: \"마음을 감각 요소의 복합체로 보고 분해하려 한 학파 → '''구조주의'''\", \"자신의 경험을 지정된 기준에 따라 스스로 보고하는 방법 → '''내성법'''\". bank 단답형 1번이 바로 구조주의(물 분자 비유 지문).\n{/exam}\n\n== p.10 — 기능주의 ⭐⭐⭐ ==\n[[img:L0-10.png|p.10 기능주의가 바라본 심리 — 환경(위험) → 마음 → 생존을 위한 행동, 아래엔 진화 화살표|medium]]\n\n[[기능주의]]의 주요 학자는 [[윌리엄 제임스]]. 내적 사고와 감정의 기능 = '''생존을 위한 적응적 기능'''이라고 봤고, [[자연선택|다윈의 진화론]]의 영향을 받았다. 모든 생명체는 생존을 목표로 하며 인간도 예외가 아니므로, 마음이라는 능력은 조상의 생존에 기여한 적응적 기능이다.\n\n'''의식의 기능''': 과거를 회상하고, 현재에 적응하고, 미래를 계획한다. 의식 = 무언가를 자각할 수 있는 상태(→ [[2장 마음의 생물학과 의식]]).\n\n{| class=\"table\"\n! 구분 || [[구조주의]] || [[기능주의]]\n|-\n| 핵심 질문 || 마음은 '''무엇으로''' 이루어졌나 || 마음은 '''무슨 일을''' 하나\n|-\n| 학자 || [[빌헬름 분트]], 티치너 || [[윌리엄 제임스]]\n|-\n| 방법·배경 || [[내성법]] || 다윈의 진화론\n|-\n| 비유 || 시계를 분해해 부품 목록 만들기 || 시계가 \"시간을 알려 준다\"는 쓸모 보기\n|}\n\n== p.11 — 행동주의 ⭐⭐⭐ ==\n[[img:L0-11.png|p.11 행동주의의 관점 — 자극(종·전구) → 머릿속은 ✗ → 행동. 강조 표시 '관찰 가능한'|medium]]\n\n[[행동주의]]의 대두([[행동주의|존 B. 왓슨]], [[스키너|B.F. 스키너]]). 행동주의는 구조주의와 기능주의의 '''공통점'''을 공격했다 — 둘 다 사람 '''안에서''' 작동하는 요소(내부 감각, 심상, 감정)를 주로 탐구했다는 것. 심적 과정 자체는 관찰이 불가능하지만 행동은 '''관찰이 가능'''하므로, 심리학은 \"관찰 가능한\" 행동 과학이 되어야 한다.\n\n{| class=\"table\"\n! 구분 || [[고전적 조건화]] || [[조작적 조건화]]\n|-\n| 슬라이드 정의 || [[중성 자극|중립 자극]]을 [[무조건 자극]]과 연합하여 [[조건 자극]]으로 발전시키는 것 || [[강화]]/[[처벌]]에 대한 조작을 통해 행동의 빈도를 조절하는 것\n|-\n| 무엇과 무엇을 연합 || 자극 + 자극 || '''자신의 행동''' + 그 결과\n|-\n| 대표 학자·예 || [[파블로프]]의 개(종소리 → 침) || [[스키너]]\n|}\n\n{exam}\n교수 강조(🎙 8/25 45:11): \"'''중요한 거는 고전적·조작적 조건화 모두 자극과 행동 반응에만 중점을 둔다'''\" — 그 사이의 내적 정보 처리는 관심 밖이다. 행동주의는 미국 심리학계 주류가 되어 내면 과정이 30–40년간 연구에서 배제됐다.\n{/exam}\n\n{quiz}\n고전적 조건화와 조작적 조건화에 대한 설명으로 '''옳지 않은''' 것은?\n① 고전적 조건화는 중립 자극을 무조건 자극과 연합하여 조건 자극으로 만드는 것이다\n② 두 조건화는 학습 과정 안에서 일어나는 내적 정보 처리를 밝히는 데 중점을 둔다\n③ 조작적 조건화는 강화와 처벌을 조작하여 행동의 빈도를 조절하는 것이다\n④ 행동주의자는 학습도 행동의 변화로 관찰할 수 있으므로 행동의 연장선으로 본다\n{/quiz}\n{answer}\n'''②'''. 행동주의의 두 조건화는 자극과 행동 반응에만 중점을 두고 내적 처리에는 관심을 두지 않는다(🎙 8/25). 내적 정보 처리를 다시 연구하자고 한 것은 [[인지혁명]]이다.\n{/answer}\n\n== p.12 — 정신분석과 인본주의 심리학 ⭐⭐ ==\n[[img:L0-12.png|p.12 정신분석이 바라본 마음 — 빙산: 수면 위 의식, 경계의 전의식, 수면 아래 무의식(억압된 기억·욕망·충동)이 행동을 유도|medium]]\n\n[[정신분석]]([[프로이트]] 심리학)은 '''아동기 경험에 대한 무의식적 사고'''가 행동에 미치는 영향력을 강조하고, 다양한 [[정신분석|방어 기제]]를 제시했다. 슬라이드 그림의 빙산처럼 행동의 진짜 원인은 수면 아래(무의식)에 있다고 본다.\n\n[[인본주의 심리학]]([[인본주의 심리학|칼 로저스]], [[인본주의 심리학|에이브러햄 매슬로우]])은 정신분석과 행동주의가 '''인간에 대해 너무 제한적인 인식'''을 지녔다고 비판했다. 인간을 보다 '''주체적이고 자아실현을 추구하는 존재'''로 보고, 아동기 기억이나 조건 반응의 학습보다는 '''현재의 환경'''이 성장 잠재력을 촉진하는 방식에 집중한다.\n\n{| class=\"table\"\n! 학파 || 인간관 || 행동의 원인은 어디에?\n|-\n| [[정신분석]] || 무의식에 좌우되는 존재 || 과거(아동기)의 무의식\n|-\n| [[행동주의]] || 자극에 반응하는 존재 || 바깥의 자극·강화\n|-\n| [[인본주의 심리학]] || '''주체적''', 자아실현 추구 || 현재 환경 속 성장 잠재력\n|}\n\n{warn}\n\"방어 기제 = 인본주의\", \"자아실현 = 정신분석\"처럼 '''학파와 주장을 엇갈려 놓는''' 보기가 bank 단골이다. 방어 기제·무의식 = 정신분석, 자아실현·주체성 = 인본주의.\n{/warn}\n\n== p.13–14 — 인지혁명과 컴퓨터 메타포 ⭐⭐⭐ ==\n[[img:L0-13.png|p.13 인지혁명 — 마음으로의 회귀: 자극 → 마음(빛나는 하트) → 행동|medium]]\n\n[[인지혁명]](1960년대)은 \"심적 과정에 대한 심리학의 초기 관심사를 되돌리고 '''과학적 연구 방법'''론의 적용을 주장한 '''패러다임의 전환'''\"이다. 계기는 '''컴퓨터의 개발 및 도입''' — 컴퓨터의 작동 메커니즘이 사람의 마음이 움직이는 방식과 유사하다는 의견이 제기됐다('''정보 처리 접근'''). p.11 행동주의 그림에서 ✗ 표시됐던 머릿속이 p.13 그림에선 '''다시 빛난다'''는 대비를 눈여겨볼 것.\n\n[[img:L0-14.png|p.14 컴퓨터 메타포 — 입력(키보드) → 처리(본체) → 산출(모니터·스피커) ↔ 외부 정보 입력(눈·귀) → 뇌(기억·주의·계획) → 행동 반응. 가운데 노란 화살표: Insight·기술 제공 / 심리 데이터·기제|large]]\n\n[[컴퓨터 메타포]]의 대응표(🎙 8/25):\n{| class=\"table\"\n! 컴퓨터 || 사람\n|-\n| 입력 장치(키보드) || 눈·귀 등 '''감각 기관'''(외부 정보 입력)\n|-\n| CPU(처리) || 뇌 전반(주의·계획)\n|-\n| '''RAM''' || '''단기/[[작업 기억]]'''\n|-\n| '''SSD''' || '''[[앳킨슨-시프린 모형|장기 기억]]'''\n|-\n| 모니터·스피커(산출) || '''행동 반응'''\n|}\n\n{warn}\n\"장기 기억 = RAM\", \"감각 기관 = CPU\", \"행동 반응 = 입력 장치\"는 전부 오답(bank MC). '''오래 저장 = SSD = 장기 기억''', '''잠깐 들고 작업 = RAM = 작업 기억'''으로 외울 것.\n{/warn}\n\n== p.15 — 인지심리학과 인지신경과학 ⭐⭐ ==\n[[img:L0-15.png|p.15 인지심리학/인지신경과학 — 외부 정보 입력(시각·청각·촉각·후각/미각) → 뇌의 정보 처리 → 지각·기억·사고·감정·행동, 아래 신경 활동과 피드백·학습|medium]]\n\n[[인지심리학]]은 인간의 지각, 정보 처리 등의 심적 과정을 과학적으로 탐구하는 학문이다. 뇌과학·신경과학과 융합하면서 [[인지신경과학]]으로 발전했다 — 인간의 사고와 인지 체계에 대한 '''생물학적 접근법'''이고, '''뇌전도, 뇌영상, 신경 조절''' 등으로 연구한다(→ [[뇌전도]], [[fMRI]]).\n\n'''현대의 심리학 = 사람 마음에 대한 과학''': 감각·사고 등의 심적 과정을 '''행동으로부터 추론'''하고, 다양한 학문 분야의 영향을 받아 다각적 관점을 추구한다.\n\n== p.16–17 — 선천성-후천성 논제, 진화심리학과 행동유전학 ⭐⭐⭐ ==\n[[img:L0-16.png|p.16 선천성(DNA·아기·지문) VS 후천성(가족·학교·자연·도시)|medium]]\n\n[[선천성-후천성 논제]](Nature-Nurture Issue)는 인간 심리의 기원이 '''타고난 것'''인가 '''외부 환경으로부터의 학습'''인가, 생물학적 특성과 환경의 상대적 영향력에 대한 논의다. 그 배경에 [[자연선택|다윈의 진화론]]이 있다 — 「종의 기원」(1859)에서 '''자연 선택설'''을 제안했고, 우연한 변이 가운데 유기체가 환경에 따라 가장 잘 생존할 수 있는 특질이 선택된다는 것이 핵심이다. 이것을 인간 심리에 적용하려 한 것이 [[기능주의]]다.\n\np.17은 \"생물학적 특성과 환경의 '''상호작용'''\"으로 정리한다. 전 인류 공통 요소(생득-선천적)와 환경마다의 차이(환경-후천적)를 묻는 것이 두 분야의 핵심 논제다.\n\n{| class=\"table\"\n! 구분 || [[진화심리학]] || [[행동유전학]]\n|-\n| 슬라이드 정의 || 공통적인 생물학적 특성과 진화 과정이 사람들의 '''보편성'''에 미친 영향 || 상이한 유전자와 환경으로 인하여 발생하는 '''차이점'''\n|-\n| 키워드 || 같음(보편성) || 다름(개인차)\n|-\n| p.25 연구 질문 || (진화론) 특질의 자연선택은 어떻게 유전자의 생존을 촉진시키는가? || 유전자와 환경은 어떻게 '''개인차'''에 영향을 미치는가?\n|}\n\n{exam}\n교수(🎙 8/25 1:28:35): \"결론적으로 타고나는 거든 나중에 배운 것이든 '''둘 다 중요하다'''라는 게 선천성-후천성 문제의 결론\". 통합요약 §0-1에도 그대로 올라 있다.\n{/exam}\n\n== p.18 — 일란성·이란성 쌍둥이 ⭐⭐ ==\n[[img:L0-18.png|p.18 일란성 쌍둥이(왼쪽 두 사람)와 이란성 쌍둥이(오른쪽 남녀)|medium]]\n\n[[쌍둥이 연구]]: [[쌍둥이 연구|일란성 쌍둥이]]는 유전 특성이 동일해 기질 및 여러 특질에서 유전과 환경의 상호작용을 탐구하기 적합하다. 쌍둥이의 보편성(유전에 의한 선천성)과 차이점(환경·경험에 의한 후천성)이 인간 심리 기제에 대한 중요한 시사점을 준다. 결론은 역시 '''선천성·후천성 모두의 중요성'''.\n\n== p.19 — 비교문화심리학 ⭐⭐ ==\n[[img:L0-19.png|p.19 미소의 보편성 — 문화권이 달라도 미소는 같다|medium]]\n\n[[비교문화심리학]]에서 '''문화''' = 한 세대에서 다음 세대로 전달되는 공유한 생각과 행동. 문화에 따라 사고·행동에 차이가 있지만 그 기저에는 '''보편성'''이 있다. 외로움의 정도는 문화권마다 다르지만(Lykes & Kemmelmeier, 2014), 수줍음·낮은 자존감·독신 생활이 외로움을 증폭시킨다는 것은 공통이다(Rokach et al., 2002). 교수는 일본의 '''메이와쿠'''(남에게 폐를 끼치지 않기) 문화와 다테마에/혼네를 예로 들었다(🎙 8/25).\n\n== p.20–21 — 선천성 예시(기본 감정) vs 후천성 예시(색 지각) ⭐⭐⭐ ==\n[[img:L0-20.png|p.20 폴 에크만의 6가지 기본 감정 — 기쁨·공포·혐오·분노·놀람·슬픔|medium]]\n\n[[에크만의 기본 감정]]: 문화권과 상관없이 전 인류가 공유하는 '''6개'''의 감정 — '''기쁨, 슬픔, 분노, 공포, 혐오, 놀람'''. 기본 감정의 식별은 문화·인종과 무관하게 이루어지므로 '''선천성의 예시'''다.\n\n[[img:L0-21.png|p.21 몽골인과 중국인의 색 지각 차이 비교 연구(He et al., 2019) — 파랑·녹색 스펙트럼|medium]]\n\n반면 [[선천성-후천성 논제|문화에 따른 색 지각 차이]]는 '''후천성의 예시'''다. 삼원색(RGB) 같은 기본 색상 지각은 문화와 무관하지만, 같은 색상 안의 채도 차이를 표현하는 방식은 문화마다 다르다 — '''몽골어는 녹색·파란색 계통이 세분화''', '''중국어는 하나로 통일'''. 색상 표현의 차이가 실제 색 지각·분류 체계에 영향을 준다. 슬라이드는 이것을 '''문화사회심리학'''의 주요 연구 주제로 소개한다.\n\n{| class=\"table\"\n! 구분 || 선천성 예시 || 후천성 예시\n|-\n| 슬라이드 || p.20 [[에크만의 기본 감정]] || p.21 몽골어/중국어 색 지각\n|-\n| 왜? || 문화·인종과 무관하게 식별 || 언어(환경)에 따라 분류가 달라짐\n|}\n\n{quiz}\n선천성과 후천성의 예시를 옳게 짝지은 것은?\n① 선천성: 에크만의 6가지 기본 감정 식별 / 후천성: 몽골어·중국어 화자의 색 지각 차이\n② 선천성: 몽골어·중국어 화자의 색 지각 차이 / 후천성: 에크만의 6가지 기본 감정 식별\n③ 둘 다 에크만의 기본 감정\n④ 둘 다 몽골어·중국어 색 지각\n{/quiz}\n{answer}\n'''①'''. 기본 감정 = 문화 무관 = 선천성, 색 지각 = 언어 환경 따라 다름 = 후천성. ②는 순서를 뒤집은 함정.\n{/answer}\n\n== p.22–23 — 생물심리사회적 접근법과 분석 수준 ⭐⭐⭐ ==\n[[img:L0-22.png|p.22–23 심리학의 생물심리사회적 접근법 — 생물학적 수준(유전자·자연선택·적응적 특질), 심리적 수준(정서적 반응·인지적 해석·학습된 공포·기대), 사회문화적 수준(타인의 존재·문화/가족의 기대·소속 집단·주목을 끄는 모델)이 가운데 '행동 및 심적 과정'으로 모인다|large]]\n\n{def}\n'''설명''': 인간의 심적 과정과 행동이 생물학적, 심리적, 사회문화적 수준의 통합된 결과물이라고 보는 접근 (서막 p.22)\n'''명칭''': [[생물심리사회적 접근법]] (Biopsychosocial Approach)\n{/def}\n\n세 [[분석 수준]]:\n{| class=\"table\"\n! 수준 || 무엇을 중점으로 보나 (슬라이드) || 핵심\n|-\n| '''생물학적 수준''' || 유전자, 자연선택, 적응적 특질 || 생물, [[진화심리학]], 신경과학\n|-\n| '''심리적 수준''' || 정서, 인지 처리 및 해석, 개인 내면의 기대 || 개인의 '''내면'''에서 발생하는 기제\n|-\n| '''사회문화적 수준''' || 타인의 기대, 소속 집단, 대중 매체의 모델 || 개인의 '''외부'''에 존재하는 환경 요인\n|}\n\n[[anim:biopsychosocial|가운데 '분노'에 생물학적·심리적·사회문화적 화살표가 하나씩 꽂히고 세 원이 겹칩니다. 마지막 자막 \"어느 하나의 요인만으로는 설명할 수 없다\"를 소리 내어 읽으세요.]]\n\n{exam}\n교수(🎙 8/25 1:44:27): \"동일한 행동이라 하더라도 '''어느 하나의 요인만으로는 설명을 하지 않는다''' 라는 게 이제 '''가장 중요한 포인트'''\". 슬라이드 p.23 마지막 줄 \"중점의 차이일 뿐, 사람의 심리를 설명하는데 어느 하나의 요인만으로는 설명할 수 없음\". '''통합요약 최우선 명칭 = 생물심리사회적 접근법'''. bank 단답형은 \"시험 불안 민수\" 사례(유전 기질 + 부정적 기대 + 가족·학교 문화)로 출제.\n{/exam}\n\n== p.24–25 — 다양한 이론적 조망 ⭐⭐⭐ ==\n[[img:L0-24.png|p.24 다양한 심리 이론적 조망 — 신경과학적·진화론적·행동주의적·인지적·사회문화적 조망이 하나의 뇌를 둘러쌈|medium]]\n\n[[생물심리사회적 접근법]]을 기반으로 심리학의 세부 하위 분야가 발전했다. 같은 현상이라도 '''어떤 [[이론적 조망|조망]]을 취하느냐에 따라 연구 방법과 설명 방식이 달라진다'''. 슬라이드의 '''분노''' 예시:\n\n{| class=\"table\"\n! 조망 || 분노에 대한 접근 (p.24)\n|-\n| 신경과학 || 흥분 상태를 유발하는 두뇌 회로 탐구\n|-\n| 진화론 || 유전자가 분노를 어떻게 촉진시켰는가 ('''Fight or Flight''' 반응)\n|-\n| 정신역동 || '''무의식적 적대감'''의 방출\n|-\n| 인지 || '''상황의 해석'''이 분노에 미치는 영향력\n|-\n| 사회문화 || 문화 맥락에 따라 분노의 '''표현'''이 어떻게 달라지는가\n|}\n\np.25 표 전체(7개 조망 × 주요 연구 질문 × 관련 하위 분야)는 [[이론적 조망]] 문서에 그대로 옮겨 두었다. 외울 때는 '''연구 질문 → 조망 이름''' 방향으로.\n\n{quiz}\n「유전자와 환경은 어떻게 개인차에 영향을 미치는가?」를 주요 연구 질문으로 삼는 이론적 조망은? ① 진화론 ② 정신역동 ③ 사회문화 ④ 행동유전학\n{/quiz}\n{answer}\n'''④ [[행동유전학]]'''(관련 분야: 성격, 발달, 법). ① 진화론은 개인차가 아니라 '''자연선택과 유전자의 생존'''(보편성)을 묻는다 — \"유전자\"라는 단어에 낚이지 말 것.\n{/answer}\n\n== p.26 — 심리학의 세부 하위 분야 ⭐⭐⭐ ==\n[[img:L0-26.png|p.26 심리학의 세부 하위 분야 — 기초 학문 5개, 응용 학문 4개|medium]]\n\n[[심리학의 하위 분야]]는 '''기초 학문'''(특정 현상·기제의 원리 탐구, 지식 기반 형성)과 '''응용 학문'''(기초 학문의 원리를 실생활에 적용하는 방법 개발)으로 나뉜다.\n* 기초: 생물심리학/신경과학, 발달심리학, 인지심리학, 성격심리학, 사회심리학\n* 응용: 산업조직심리학, [[상담심리학]], 임상심리학, 정신의학('''약물 치료 병행''')\n\n{exam}\n통합요약 출제 예상 단답형: \"학업·직업·대인관계 등으로 인한 개인의 위기 상황 대처 능력을 지원하는 응용 분야 → '''[[상담심리학]]'''\". 임상심리학(장애의 평가·치료)·정신의학(약물 병행)과 구별할 것.\n{/exam}\n\n== p.27–28 — 심리학을 통한 성장, 학습과 심리학 ⭐ ==\np.27: 심리학은 타인뿐 아니라 '''자신의 이해'''를 추구하는 학문이다. 임상·상담에서 강조하는 것 중 하나가 자신의 감정과 사고에 대한 이해도를 높여 '''대안적 관점'''을 갖는 것. 일상 적용: 숙면을 위한 시간 관리, 운동 시간 확보, 매일의 목표 + 장기적 목표, 대인 관계에 우선권.\n\n[[img:L0-28.png|p.28 심리학과 학습 — 검증 효과(Testing effect)와 분산 학습(Spacing effect)|medium]]\n\np.28: 인간의 학습 기제는 심리학의 주요 주제다.\n* [[검증 효과]](Testing effect): 배운 내용을 단순 반복하는 것보다 예시 문제를 '''기출해서 풀어보는''' 것이 더 오래 기억에 남는 현상. 정보에 대한 능동적·적극적 처리가 필요(Cho et al., 2018; Trumbo et al., 2016).\n* [[간격두기 효과|분산 학습]](Spacing effect): 한 번에 몰아서 학습하는 것보다 공부 시간을 '''분산'''시킬 때 더 오래 기억에 남는 현상.\n\n{tip}\n이 위키의 `{quiz}` 박스를 눌러 보기 전에 답을 먼저 써 보는 것이 곧 검증 효과다. 그리고 하루에 다 읽지 말고 장별로 나눠 읽는 것이 분산 학습. 둘 다 [[6장 기억]]에서 다시 나온다.\n{/tip}\n\n{joke}\n교수: \"여러분의 이번 학기 가장 중요한 목표는 무엇이겠습니까? 학점을 잘 받는 거죠. 현실적으로.\"(🎙 8/25 마무리) — 그래서 서막 마지막 슬라이드가 공부법이다.\n{/joke}\n\n== 🎙 실제 수업 기록 (8/25 화, 녹음본 기준) ==\n* 1회차(약 135분). 앞 10분은 강의 소개·평가 안내(35/35/15/15, 대면 지필, 1/3 결석 F). '''출석은 9/1부터 호명'''.\n* 정의(17:49–21:00): \"마음을 과학적으로 연구하는 학문\". 마음은 하나의 영역으로 설명하기 어려운 개념이고, 강의실에 오는 과정(회상 → 지각 → 계획·결정 → 행동)이 모두 마음의 작동.\n* 분트(27:35–32:47): 라이프치히 1879 → \"심리학이 과학으로 측정될 수 있음을 보인 첫 사례\". 0.1초/0.2초, \"사람의 인지 체계는 매우 빠르다\". 구조주의는 '''물 분자 비유'''.\n* 분석적 내성법(33:48–36:20): 자유 기술이 아니라 기준과 가이드라인으로 훈련시킨 엄격한 보고. 그래도 주관적이라는 비판.\n* 행동주의(40:35–51:16): 구조·기능주의가 둘 다 \"내면\"을 다뤘다고 강하게 반발. 파블로프(종 = 중립 자극 → 조건 자극), 스키너. '''\"고전적·조작적 조건화 모두 자극과 행동 반응에만 중점\"'''(45:11). 내면 과정 30–40년 배제.\n* 정신분석(48:52)·인본주의(49:41): 프로이트는 8장 동기에서 재론. 로저스·매슬로우.\n* 인지혁명(52:19–58:18): 에니악 1946, 디지털 컴퓨터 1950년대 중반 → 정보 처리 접근 → \"초기 관심사를 되돌리고 과학적 연구 방법론을 적용하는 '''패러다임의 전환'''\". 컴퓨터 메타포: 입력 = 감각 기관, 뇌 = CPU, '''SSD = 장기 기억, RAM = 단기(작업) 기억'''.\n* 선천성-후천성(1:27:37–1:29:33): 플라톤(생득)·아리스토텔레스(학습), 데카르트·로크. '''\"둘 다 중요하다\"'''(1:28:35). 일란성 쌍둥이 = 하나의 수정란에서 분할.\n* 문화(1:30:32–1:38:32): 메이와쿠·다테마에/혼네, 에크만 기본 감정(감정 식별 단서는 '''눈'''), 몽골어·중국어 색 명칭.\n* 분석 수준(1:41:30–1:44:27): '''\"어느 하나의 요인만으로는 설명하지 않는다 — 가장 중요한 포인트\"'''. 분노 예시(1:45:36–1:48:16): 진화론에서 공포 = 도주, 분노 = 맞서기.\n* 하위 분야(1:49:15–1:57:34): 기초 vs 응용, '''소비자 심리학'''을 구두로 추가(슬라이드엔 없음).\n* 마무리(2:09:58–2:12:44): \"시험에는 수업 내용이 나온다\", 검증 효과·분산 학습.\n\n== 시험 대비 핵심 요약 ==\n# [[심리학]] = '''행동과 심적 과정의 과학'''. 과학 심리학의 출발 = '''[[빌헬름 분트]], 1879, 최초 실험실''' (반응 0.1초 vs 자각 후 0.2초).\n# [[구조주의]](분트·티치너): 마음 = 하위 구성 요소, 방법 = '''[[내성법]]''', 한계 = 신뢰도.\n# [[기능주의]]([[윌리엄 제임스]]): 다윈 진화론 영향, 마음·의식 = '''생존을 위한 적응적 기능'''.\n# [[행동주의]](왓슨·스키너): '''관찰 가능한''' 행동만. 고전적(중립 자극 + 무조건 자극 → 조건 자극) / 조작적(강화·처벌로 행동 빈도 조절). 둘 다 자극과 반응에만 중점.\n# [[정신분석]]([[프로이트]]): 아동기 무의식·방어 기제. [[인본주의 심리학]](로저스·매슬로우): 주체적·'''자아실현''', 앞의 둘이 \"너무 제한적\"이라고 비판.\n# [[인지혁명]](1960년대): 컴퓨터 → 정보 처리 접근, '''패러다임의 전환''', 마음으로의 회귀. [[컴퓨터 메타포]]: '''SSD = 장기 기억, RAM = 작업 기억''', 감각 기관 = 입력, 행동 = 산출.\n# [[인지심리학]] + 뇌과학·신경과학 → '''[[인지신경과학]]'''(뇌전도·뇌영상·신경 조절).\n# '''[[선천성-후천성 논제]]''': 결론 = 둘 다 중요. [[진화심리학]] = 보편성, [[행동유전학]] = 개인차. [[자연선택]] = 「종의 기원」(1859).\n# 선천성 예시 = '''[[에크만의 기본 감정]] 6개'''(기쁨·슬픔·분노·공포·혐오·놀람), 후천성 예시 = 몽골어(세분화)/중국어(통일) 색 지각.\n# '''[[생물심리사회적 접근법]]''' ⭐ 최우선: 생물학적·심리적·사회문화적 [[분석 수준]]의 통합 — \"어느 하나의 요인만으로는 설명할 수 없다\".\n# [[이론적 조망]] 7개(신경과학·진화론·행동유전학·정신역동·행동주의·인지심리학·사회문화) — 분노 예시와 연구 질문으로 매칭.\n# [[심리학의 하위 분야]]: 기초 5(생물/신경·발달·인지·성격·사회) vs 응용 4(산업조직·'''[[상담심리학]]'''·임상·정신의학=약물 병행).\n# 학습법: [[검증 효과]](문제 풀기), [[간격두기 효과|분산 학습]](시간 분산) → 6장.\n\n== 관련 문서 ==\n* 서막 사전: [[심리학]] · [[빌헬름 분트]] · [[구조주의]] · [[내성법]] · [[기능주의]] · [[윌리엄 제임스]] · [[행동주의]] · [[정신분석]] · [[프로이트]] · [[인본주의 심리학]] · [[인지혁명]] · [[컴퓨터 메타포]] · [[인지심리학]] · [[인지신경과학]]\n* 서막 사전(계속): [[선천성-후천성 논제]] · [[자연선택]] · [[진화심리학]] · [[행동유전학]] · [[쌍둥이 연구]] · [[비교문화심리학]] · [[에크만의 기본 감정]] · [[생물심리사회적 접근법]] · [[분석 수준]] · [[이론적 조망]] · [[심리학의 하위 분야]] · [[상담심리학]]\n* 다음 장: [[1장 심리과학을 비판적으로 생각하기]]\n* 시험 대비: [[명칭 암기표]] · [[자주 틀리는 함정 모음]] · [[모의고사 복기]] · [[시험 정보]]"

  "body": "'''심리학'''(Psychology)은 \"마음이 어떻게 작동하고 행동으로 나타나는가를 연구하는 학문\", 한 줄로 줄이면 '''행동과 심적 과정의 과학'''이다. 서막 p.6–7 에서 정의되고, 이 위키 전체가 이 정의의 각론이다.\n\n{def}\n'''설명''': 마음이 어떻게 작동하고 행동으로 나타나는가를 연구하는 학문 — 행동과 심적 과정의 과학 (서막 p.6)\n'''명칭''': [[심리학]] (Psychology)\n{/def}\n\n{analogy}\n심리학은 '''스마트폰 앱의 소스 코드를 못 보는 사용자가 앱을 연구하는 일'''과 비슷하다. 코드(마음)는 안 보이지만, 어떤 입력에 어떤 화면(행동)이 뜨는지는 관찰할 수 있다. 그래서 \"입력과 출력을 잘 설계해 관찰하면 코드 구조를 추론할 수 있다\"는 것이 심리'''과학'''의 전략이다.\n{/analogy}\n\n== 두 개의 질문 (p.6) ==\n# 마음을 어떻게 '''정의'''할 수 있는가?\n# 보이지 않는 마음이라는 것을 어떻게 '''관찰'''할 수 있는가?\n두 번째 질문에 대한 답이 바뀌어 온 역사가 곧 학파의 역사다(→ [[서막 심리학 이야기]] p.8–15, [[구조주의]] → [[행동주의]] → [[인지혁명]]).\n\n== 다양한 심리의 영역 (p.6) ==\n{| class=\"table\"\n! 영역 || 슬라이드 예시 || 주로 다루는 장\n|-\n| 인지 || 기억, 주의… || [[6장 기억]], [[선택적 주의]]\n|-\n| 정서 || 기쁨, 슬픔… || [[에크만의 기본 감정]]\n|-\n| 성격 || 우울, 불안… || (교과서 후반부)\n|}\n정리본 노트: 마음 = 인지·정서·신경활동·성격 등 내면의 심적 과정과 행동을 총괄하는 시스템.\n\n== 심리학 = 심리과학 (p.7) ==\n[[img:L0-07.png|p.7 과학으로서의 심리학 — 질문 → 가설 → 연구 설계·자료 수집 → 자료 분석 → 결론 → 지식 축적·공유, 아래에 객관성·체계성·검증 가능성·반복 가능성·설명력&예측력|medium]]\n\n심리학은 '''과학적 연구방법'''을 추구한다. 보이지 않는 마음을 '''객관적으로, 정량적으로''' 연구하기 위해 다양한 연구 방법을 적용하고, 사람을 대상으로 데이터를 수집해 정립된 통계 분석으로 결과를 도출한다. 이 방법론은 [[과학적 방법]]과 [[1장 심리과학을 비판적으로 생각하기|1장]] 전체에서 자세히 다룬다.\n\n{tip}\n교수 예시(🎙 8/25): 강의실에 오는 과정 — \"몇 호였지?\"(회상) → 표지판을 봄(지각) → 어느 길로 갈지 정함(계획·결정) → 걸어감(행동). 이 전부가 심리학의 연구 대상인 \"마음의 작동\"이다.\n{/tip}\n\n== 관련 문서 ==\n* [[서막 심리학 이야기]] — 장 메인\n* [[빌헬름 분트]] — 심리학이 과학이 된 출발점\n* [[생물심리사회적 접근법]] — 현대 심리학이 마음을 설명하는 틀\n* [[심리학의 하위 분야]]\n\n근거: 서막 p.6–7"
 },
 "빌헬름 분트": {
  "title": "빌헬름 분트 (Wilhelm Wundt, 1832–1920)",
  "category": [
   "서막 심리학 이야기",
   "학자"
  ],
  "body": "'''빌헬름 분트'''(Wilhelm Wundt)는 '''1879년 최초의 심리학 실험실'''을 세워 심리학을 철학에서 독립된 '''실험 과학'''으로 만든 인물이다. [[구조주의]]의 주요 학자이기도 하다.\n\n{def}\n'''설명''': 1879년 최초의 심리학 실험실을 설립하고, 심적 과정을 측정하는 실험을 수행한 학자 (서막 p.8)\n'''명칭''': [[빌헬름 분트]] (Wilhelm Wundt)\n{/def}\n\n== 인물 카드 ==\n[[img:L0-08.png|서막 p.8 빌헬름 분트 — 최초 실험실 설립(1879)과 심적 과정 측정 실험|medium]]\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 이름(원어) || 빌헬름 분트 (Wilhelm Wundt)\n|-\n| 학파·분야 || [[구조주의]] (제자 티치너와 함께), 실험심리학의 시작\n|-\n| 핵심 업적 || '''1879년 최초의 심리학 실험실''' 설립(라이프치히, 🎙 8/25) → 심리과학의 태동\n|-\n| 대표 실험 || 심적 과정 측정 실험(1879; Hunt, 1993) — 공이 소리를 듣고 전신기 버튼 누르기\n|-\n| 방법 || [[내성법]] (훈련된 엄격한 자기보고)\n|-\n| 시험에 나오는 한 줄 || \"1879년 최초의 심리학 실험실을 세운 학자 → '''빌헬름 분트'''\"\n|}\n\n== 공이치기 실험: 0.1초 vs 0.2초 ==\n<pre class=\"ascii\">\n  조건            과제                                       반응 시간\n  ─────────────────────────────────────────────────────────────────\n  실험 1   소리를 듣자마자 바로 버튼                          ≈ 0.1초\n  실험 2   소리를 듣고, \"들었다\"고 '''자각'''할 때 버튼        ≈ 0.2초\n  ─────────────────────────────────────────────────────────────────\n  차이 0.1초 = 자각이라는 '''추가 심적 과정'''에 걸린 시간\n<\/pre>\n이 실험의 의미는 결과 숫자보다 '''\"보이지 않는 마음의 과정도 시간으로 잴 수 있다\"'''는 데 있다. 교수: \"심리학이 과학으로 측정될 수 있음을 보인 첫 사례\"(🎙 8/25). 교수는 덧붙여 색·획 같은 물리적 속성은 0.1–0.2초 안에 자동 처리될 만큼 사람의 인지 체계는 매우 빠르다고 했다.\n\n{analogy}\n분트의 실험은 '''스톱워치로 생각의 길이를 잰 것'''이다. \"버튼을 누른다\"는 출력은 같지만 중간에 \"자각한다\"는 단계를 하나 끼워 넣으니 0.1초가 늘었다 — 코드에 함수 호출 하나를 추가하고 실행 시간이 늘어난 만큼을 그 함수의 비용으로 보는 프로파일링과 같은 발상이다.\n{/analogy}\n\n{warn}\nbank 오답 보기 정리: ① \"두 조건 모두 약 1초로 같았다\" ✗ ② \"즉시 누르기가 더 오래 걸렸다\" ✗(순서 반대) ③ \"자유롭게 서술한 경험을 분석해 구성 요소를 찾았다\" ✗ — 이 실험은 '''반응 시간 측정'''이고, 분트의 [[내성법]]조차 자유 서술이 아닌 지정된 내용만 보고하는 방식이었다.\n{/warn}\n\n{quiz}\n\"즉각 반응 약 0.1초, 자각 후 반응 약 0.2초\"라는 결과로 심적 과정의 계량화를 처음 보인 학자의 이름은?\n{/quiz}\n{answer}\n'''빌헬름 분트'''. 같은 해(1879) 최초의 심리학 실험실을 세웠다.\n{/answer}\n\n== 관련 문서 ==\n* [[구조주의]] · [[내성법]] — 분트의 학파와 방법\n* [[윌리엄 제임스]] — 다음 세대(기능주의)\n* [[서막 심리학 이야기]]\n\n근거: 서막 p.8–9"
 },
 "구조주의": {
  "title": "구조주의 (Structuralism)",
  "category": [
   "서막 심리학 이야기",
   "이론"
  ],
  "body": "'''구조주의'''(Structuralism)는 \"마음은 '''무엇으로''' 이루어져 있는가?\"를 물은 최초의 심리학 학파다. 마음을 여러 하위 구성 요소의 복합체로 보고, [[내성법]]으로 그 요소를 하나씩 분리하려 했다. 주요 학자는 [[빌헬름 분트]]와 그의 제자 에드워드 브래드퍼드 티치너.\n\n{def}\n'''설명''': 마음은 여러 하위 구성 요소로 이루어져 있으며, 마음을 과학적으로 탐구하려면 이 구성 요소들을 하나씩 분리해야 한다고 본 관점 (서막 p.9)\n'''명칭''': [[구조주의]] (Structuralism)\n{/def}\n{def}\n'''사례형 설명''': 분트와 그의 제자가 제안한 이 관점은 물 분자를 수소와 산소로 쪼갤 수 있듯 마음도 감각 요소로 분해할 수 있다고 가정하고, 참가자가 지정된 지침에 따라 자신의 경험을 스스로 보고하게 하여 그 요소를 찾으려 했다.\n'''명칭''': [[구조주의]] (bank 단답형 1번)\n{/def}\n\n[[img:L0-09.png|서막 p.9 구조주의가 바라본 심리와 내성법 — 머리 안을 퍼즐 조각(시각·청각·후각·촉각·정서·언어·심상)으로 분해, 소리 자극 후 \"색깔·밝기·형태\"를 보고|medium]]\n\n{analogy}\n구조주의는 '''화학자의 주기율표 만들기'''다. 교수의 비유 그대로 물(H₂O)을 수소 2 + 산소 1로 쪼개듯(🎙 8/25), 마음을 더 나눌 수 없는 \"감각의 원자\"까지 분해해 목록을 만들려 했다. 문제는 화학자는 시험관을 보지만 구조주의자는 '''참가자의 말'''만 볼 수 있었다는 것.\n{/analogy}\n\n[[anim:psych_history_timeline|연표 맨 왼쪽 1879 카드가 구조주의입니다. 이어서 등장하는 기능주의 카드와 \"무엇으로 vs 무슨 일\" 대비를 확인하세요.]]\n\n== 핵심 내용 (p.9) ==\n* 주요 학자: [[빌헬름 분트]], 에드워드 브래드퍼드 티치너\n* 마음 = 여러 하위 구성 요소의 복합체 → 하나씩 '''분리'''해야 과학적 탐구가 가능\n* 방법: 자신의 내면을 스스로 들여다보며 '''엄격하게''' 보고하는 [[내성법]](introspection)\n* 한계: 사람마다 보고된 결과가 달라 '''신뢰도'''가 떨어짐 → 이후 [[행동주의]]의 강한 비판\n\n=== 티치너 ===\n{def}\n'''설명''': 분트의 제자로, 분트와 함께 구조주의의 주요 학자로 꼽히는 인물 (서막 p.9)\n'''명칭''': 에드워드 브래드퍼드 '''티치너''' (Edward Bradford Titchener)\n{/def}\n슬라이드에는 이름만 나온다. 시험에서는 \"구조주의 학자 두 명\"(분트·티치너)을 [[윌리엄 제임스]](기능주의)와 바꿔치기하는 함정으로 쓰일 수 있다.\n\n== 비교: 구조주의 vs 기능주의 ==\n{| class=\"table\"\n! 구분 || 구조주의 || [[기능주의]]\n|-\n| 핵심 질문 || 마음은 무엇으로 이루어졌나 (구성 요소) || 마음은 무슨 일을 하나 (적응적 기능)\n|-\n| 학자 || 분트, 티치너 || 윌리엄 제임스\n|-\n| 방법·배경 || [[내성법]] || 다윈의 진화론([[자연선택]])\n|-\n| 한계·비판 || 자기보고 → 신뢰도 낮음 || (둘 다) 관찰 불가능한 내부를 다룸 → [[행동주의]]의 비판\n|}\n\n{warn}\n\"구조주의 = 윌리엄 제임스\", \"기능주의 = 내성법\"처럼 '''학자와 방법을 서로 바꿔 놓는''' 보기가 통합요약 객관식 포인트 1순위다.\n{/warn}\n\n== 관련 문서 ==\n* [[내성법]] — 구조주의의 방법\n* [[기능주의]] — 바로 다음 학파이자 대비 짝\n* [[행동주의]] — 구조주의·기능주의를 함께 비판\n* [[게슈탈트 심리학]] — 4장에서 \"전체는 부분의 합 이상\"이라며 요소 분해와 반대 방향\n\n근거: 서막 p.9"
 },

   "연구 방법"
  ],
  "body": "'''내성법'''(Introspection)은 [[구조주의]]가 쓴 연구 방법으로, 참가자가 '''자신의 내면을 스스로 들여다보면서 엄격하게 보고'''하게 하여 마음의 구성 요소를 찾으려 한 것이다.\n\n{def}\n'''설명''': 자신의 내면을 스스로 들여다보면서 엄격하게 보고하는 방법. 눈으로 관찰할 수 없는 마음에 대해 참가자가 스스로 보고하게 하여 마음의 구성 요소를 찾고자 한 것 (서막 p.9)\n'''명칭''': [[내성법]] (Introspection)\n{/def}\n\n[[img:L0-09.png|서막 p.9 아래 그림 — 소리·화면 자극을 받은 참가자가 \"색깔: 빨강 / 밝기: 중간 / 형태: 원형\"처럼 정해진 항목으로 보고|medium]]\n\n{analogy}\n내성법은 '''와인 소믈리에 시음 노트'''다. \"맛있다\" 같은 자유 감상이 아니라 산도·탄닌·향 등 '''정해진 항목'''을 훈련받은 대로 기록한다. 그래도 같은 와인을 두고 소믈리에마다 점수가 다르게 나오듯, 내성법 보고도 사람마다 달라 '''신뢰도'''가 떨어졌다.\n{/analogy}\n\n== 특징 ==\n* '''엄격하고 통제된''' 보고: 정리본 노트·🎙 8/25 — 자유 기술이 아니라 기준과 가이드라인으로 '''훈련'''시킨 \"분석적 내성법\". 예: 소리를 듣고 정확한 화음 말하기, 소리를 자각하기까지 걸린 시간 보고하기.\n* 교수: 마음을 직접 볼 수 없으니 \"'''기술력과 과학성 사이의 현실적 타협안'''\"이었다(🎙 8/25).\n* '''한계''': 사람마다 보고된 결과의 차이가 발생해 '''신뢰도가 떨어짐''' — 자기보고라 주관적.\n\n<pre class=\"ascii\">\n  [자극: 소리]  →  참가자의 내면  →  \"훈련된 항목\"으로 보고  →  연구자가 요소 목록화\n                     (안 보임)          색깔·밝기·형태 …\n                                          ▲\n                                 사람마다 다르게 보고 → 신뢰도 ↓\n<\/pre>\n\n{warn}\n\"내성법 = 자유롭게 떠오르는 생각을 말하는 것\"은 오답. 슬라이드 표현은 '''엄격하게''' 보고하는 방법이고, 정리본·bank 해설 모두 \"지정된 내용만 보고하는 엄격한 방식\"을 강조한다. 또 \"내성법 = 기능주의의 방법\"도 오답 — '''구조주의'''의 방법이다.\n{/warn}\n\n== 비교: 내성법 vs 행동 관찰 ==\n{| class=\"table\"\n! 구분 || 내성법 ([[구조주의]]) || 행동 관찰 ([[행동주의]])\n|-\n| 데이터 || 참가자의 '''자기보고''' || '''관찰 가능한''' 행동\n|-\n| 장점 || 마음 내부를 직접 묻는다 || 객관적, 누가 봐도 같음\n|-\n| 약점 || 사람마다 달라 신뢰도 ↓ || 내부 과정은 다루지 못함\n|}\n\n== 관련 문서 ==\n* [[구조주의]] · [[빌헬름 분트]]\n* [[행동주의]] — 내성법의 주관성을 비판\n* [[사회조사]] — 1장의 자기보고식 방법(현대판 자기보고)\n\n근거: 서막 p.9"
 },
 "기능주의": {
  "title": "기능주의 (Functionalism)",
  "category": [
   "서막 심리학 이야기",
   "이론"
  ],
  "body": "'''기능주의'''(Functionalism)는 마음이 '''무엇으로 이루어졌는지'''가 아니라 '''무슨 일을 하는지(기능)'''를 물은 학파다. 주요 학자는 [[윌리엄 제임스]]이고, [[자연선택|다윈의 진화론]]의 영향을 받아 내적 사고와 감정의 기능을 '''생존을 위한 적응적 기능'''으로 보았다.\n\n{def}\n'''설명''': 내적 사고와 감정의 기능을 생존을 위한 적응적 기능으로 보고, 다윈의 진화론의 영향을 받은 학파 (서막 p.10)\n'''명칭''': [[기능주의]] (Functionalism)\n{/def}\n\n[[img:L0-10.png|서막 p.10 기능주의가 바라본 심리 — 환경·위험 신호 → 마음 → 달아나기·도구 쓰기·안전(✓)·성장, 아래 유인원 → 인간 진화 화살표|medium]]\n\n{analogy}\n구조주의가 '''심장을 해부해 심방·심실 개수를 세는''' 해부학이라면, 기능주의는 '''\"심장은 피를 돌려 몸을 살린다\"'''를 묻는 생리학이다. 기능주의자에게 마음은 \"생존을 돕는 장기\" — 위험을 기억하고(과거), 지금 피하고(현재), 다음을 대비하는(미래) 도구다.\n{/analogy}\n\n[[anim:psych_history_timeline|구조주의 다음에 등장하는 제임스(기능주의) 카드의 키워드 \"다윈 영향·적응\"을 확인하세요.]]\n\n== 핵심 내용 (p.10) ==\n* 주요 학자: [[윌리엄 제임스]]\n* 내적 사고와 감정의 기능 = '''생존을 위한 적응적 기능'''\n** 다윈의 진화론의 영향을 받음\n** 모든 생명체는 생존을 목표로 하며, 인간 역시 예외가 아님\n** 인간이 지니게 된 마음이라는 능력은 '''조상의 생존에 기여한 적응적 기능'''\n* '''의식의 기능''': 과거를 회상하고, 현재에 적응하고, 미래를 계획\n** 의식 = 무언가를 자각할 수 있는 상태 (→ [[2장 마음의 생물학과 의식]])\n\np.16 에서도 다윈의 자연 선택설을 \"인간의 심리에도 적용하고자 함('''기능주의''')\"이라고 다시 연결한다(→ [[선천성-후천성 논제]]).\n\n== 비교 ==\n{| class=\"table\"\n! 구분 || [[구조주의]] || 기능주의 || [[진화심리학]]\n|-\n| 질문 || 무엇으로 이루어졌나 || 무슨 일을 하나 || 공통 특성이 어떻게 보편성을 만들었나\n|-\n| 시대 || 1879~ || 구조주의 직후 || 현대(서막 p.17)\n|-\n| 다윈과의 관계 || 없음 || '''진화론의 영향''' || 진화론을 직접 이론으로 사용\n|}\n\n{warn}\nbank MC 함정: \"윌리엄 제임스 – 정신분석 – 자아실현\", \"행동주의 – 무의식\" 같은 보기. 정답 짝은 '''기능주의 – 의식은 생존에 도움이 되는 적응적 기능, 다윈의 진화론 영향'''. 또 \"기능주의가 의식의 기능을 무시했다\"는 행동주의 비판 보기도 오답 — 기능주의는 오히려 의식의 기능을 정면으로 다뤘다.\n{/warn}\n\n{quiz}\n마음과 의식의 '''적응적 기능'''을 강조하며 진화론의 영향을 받은 학파의 이름은?\n{/quiz}\n{answer}\n'''기능주의'''(윌리엄 제임스). \"구성 요소\" 키워드면 구조주의, \"적응·생존·기능\" 키워드면 기능주의.\n{/answer}\n\n== 관련 문서 ==\n* [[윌리엄 제임스]] · [[구조주의]]\n* [[자연선택]] — 다윈의 진화론\n* [[행동주의]] — 기능주의도 \"내면\"을 다뤘다며 비판\n\n근거: 서막 p.10, p.16"
 },
 "윌리엄 제임스": {
  "title": "윌리엄 제임스 (William James, 1842–1910)",
  "category": [
   "서막 심리학 이야기",
   "학자"
  ],
  "body": "'''윌리엄 제임스'''(William James)는 [[기능주의]]의 주요 학자다. [[빌헬름 분트]]가 마음의 '''구성 요소'''를 찾으려 했다면, 제임스는 마음과 의식이 생존에 어떤 '''기능'''을 하는지를 물었다.\n\n{def}\n'''설명''': 내적 사고와 감정의 기능을 생존을 위한 적응적 기능으로 본 기능주의의 주요 학자 (서막 p.10)\n'''명칭''': [[윌리엄 제임스]] (William James)\n{/def}\n\n== 인물 카드 ==\n[[img:L0-10.png|서막 p.10 기능주의 — 주요 학자 윌리엄 제임스|medium]]\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 이름(원어) || 윌리엄 제임스 (William James)\n|-\n| 학파·분야 || [[기능주의]] (Functionalism)\n|-\n| 핵심 주장 || 내적 사고와 감정의 기능 = 생존을 위한 적응적 기능. 의식의 기능 = 과거 회상·현재 적응·미래 계획\n|-\n| 영향 || 다윈의 진화론([[자연선택]])\n|-\n| 시험에 나오는 한 줄 || \"윌리엄 제임스 – '''기능주의''' – 의식은 적응적 기능, 진화론 영향\" (bank MC 정답 짝)\n|}\n\n{analogy}\n분트가 '''시계를 분해해 톱니 개수를 세는 수리공'''이었다면, 제임스는 '''\"이 시계 덕분에 기차를 안 놓쳤다\"고 말하는 사용자'''다. 같은 시계(마음)를 보는데 질문이 \"무엇으로?\"에서 \"무엇을 위해?\"로 바뀌었다.\n{/analogy}\n\n== 분트와 비교 ==\n{| class=\"table\"\n! 구분 || [[빌헬름 분트]] || 윌리엄 제임스\n|-\n| 학파 || [[구조주의]] || [[기능주의]]\n|-\n| 질문 || 마음은 무엇으로 이루어졌나 || 마음은 무슨 일을 하나\n|-\n| 방법·배경 || 실험실, [[내성법]] || 다윈의 진화론\n|-\n| 서막 슬라이드 || p.8–9 || p.10\n|}\n\n{warn}\n학자-학파 바꿔치기 함정: 제임스는 '''정신분석·인본주의·행동주의가 아니다'''. 정신분석 = [[프로이트]], 인본주의 = 로저스·매슬로우, 행동주의 = 왓슨·[[스키너]].\n{/warn}\n\n== 관련 문서 ==\n* [[기능주의]] · [[빌헬름 분트]]\n* [[자연선택]]\n* [[서막 심리학 이야기]]\n\n근거: 서막 p.10"
 },
 "행동주의": {
  "title": "행동주의 (Behaviorism)",
  "category": [
   "서막 심리학 이야기",
   "이론"
  ],
  "body": "'''행동주의'''(Behaviorism)는 \"심리학은 '''관찰 가능한''' 행동의 과학이 되어야 한다\"고 주장한 학파다. 존 B. 왓슨과 [[스키너|B.F. 스키너]]가 대표 학자이고, [[고전적 조건화]]와 [[조작적 조건화]]로 행동을 설명했다. 1940년대 말까지 미국 심리학계의 주류였고, 그동안 마음 내부의 과정은 연구 대상에서 빠졌다.\n\n{def}\n'''설명''': 심적 과정 자체는 관찰이 불가하나 행동은 관찰이 가능하므로, 심리학은 '관찰 가능한' 행동 과학의 연구가 되어야 한다는 관점 (서막 p.11)\n'''명칭''': [[행동주의]] (Behaviorism)\n{/def}\n\n[[img:L0-11.png|서막 p.11 행동주의의 관점 — 자극(전구·종) → 머릿속에 ✗ → 행동(버튼·달리기·말). '관찰 가능한'에 형광 강조|medium]]\n\n{analogy}\n행동주의자는 '''자판기 연구자'''다. 동전(자극)을 넣으면 캔(행동)이 나온다는 것만 기록하고, 자판기 내부 회로(마음)는 \"열어 볼 수 없으니 과학의 대상이 아니다\"라며 덮어 둔다. 그림 속 머리에 그어진 빨간 ✗가 바로 그 태도다.\n{/analogy}\n\n[[anim:psych_history_timeline|연표 가운데 왓슨·스키너 카드 \"관찰 가능한 행동만\"을 보고, 그 뒤 인지혁명에서 머릿속이 다시 열리는 대비를 확인하세요.]]\n\n== 무엇을 비판했나 (p.11) ==\n[[구조주의]]와 [[기능주의]]의 '''공통점''' = 사람의 '''안에서''' 작동하는 요소(내부 감각, 심상, 감정)를 주로 탐구했다는 것. 행동주의는 여기에 강하게 반발했다(🎙 8/25). 구조주의의 [[내성법]]이 사람마다 달라 신뢰도가 낮다는 점도 같은 맥락의 비판이다.\n\n== 고전적 조건화 vs 조작적 조건화 ==\n{| class=\"table\"\n! 구분 || [[고전적 조건화]] || [[조작적 조건화]]\n|-\n| 슬라이드 정의 (p.11) || [[중성 자극|중립 자극]]을 [[무조건 자극]]과 연합하여 [[조건 자극]]으로 발전시키는 것 || [[강화]]/[[처벌]]에 대한 조작을 통해 행동의 빈도를 조절하는 것\n|-\n| 연합 || 자극 ↔ 자극 || 자신의 행동 ↔ 그 결과\n|-\n| 대표 || [[파블로프]]의 개(종소리 → 침) || [[스키너]] ([[스키너 상자]])\n|-\n| 자세히 || [[5장 학습]] p.6–16 || [[5장 학습]] p.17–29\n|}\n\n{exam}\n교수(🎙 8/25 45:11): \"'''중요한 거는 고전적·조작적 조건화 모두 자극과 행동 반응에만 중점을 둔다'''.\" 행동주의자에게는 학습조차 \"행동의 연장선\"(행동 변화로 관찰). 내면 과정은 30–40년간 배제(51:16).\n{/exam}\n\n=== 존 왓슨 ===\n{def}\n'''설명''': B.F. 스키너와 함께 행동주의의 대두를 이끈 학자 — 심리학은 관찰 가능한 행동의 과학이어야 한다고 주장 (서막 p.11)\n'''명칭''': 존 B. '''왓슨''' (John B. Watson)\n{/def}\n슬라이드에는 \"행동주의의 대두(존 B 왓슨, B.F 스키너)\"로 이름만 나온다. 스키너는 [[스키너]] 문서(5장)에서 자세히.\n\n== 행동주의 이후 ==\n* [[인본주의 심리학]]: 행동주의와 정신분석이 인간을 '''너무 제한적'''으로 본다고 비판(p.12).\n* [[인지혁명]](1960년대): 행동주의가 배제했던 심적 과정을 다시 연구 대상으로 되돌림(p.13).\n* 그래도 행동주의는 [[이론적 조망]] 7개 중 하나로 남아 있다 — 연구 질문 \"관찰 가능한 반응을 어떻게 학습하는가?\", 관련 분야 임상·상담·산업조직(p.25).\n\n{warn}\nbank 함정: \"행동주의 – 아동기 경험에 대한 무의식적 사고 강조\" ✗(정신분석), \"행동주의자가 초기 심리학을 비판한 이유 = 진화론을 적용하지 않아서 / 실험실이 없어서\" ✗ → 정답은 '''관찰할 수 없는 내부 요소(감각·심상·감정)를 탐구해 객관성이 부족'''했기 때문.\n{/warn}\n\n== 관련 문서 ==\n* [[고전적 조건화]] · [[조작적 조건화]] · [[스키너]] · [[파블로프]]\n* [[구조주의]] · [[기능주의]] — 비판 대상\n* [[인지혁명]] — 행동주의 이후의 패러다임 전환\n\n근거: 서막 p.11, p.25; 5장 p.6"
 },
 "정신분석": {
  "title": "정신분석 (Psychoanalysis)",
  "category": [
   "서막 심리학 이야기",
   "이론"
  ],
  "body": "'''정신분석'''(Psychoanalysis, 프로이트 심리학)은 [[프로이트]]가 세운 관점으로, '''아동기 경험에 대한 무의식적 사고'''가 행동에 미치는 영향력을 강조하고 다양한 '''방어 기제'''를 제시했다. [[이론적 조망]] 표에서는 '''정신역동'''이라는 이름으로 등장한다.\n\n{def}\n'''설명''': 아동기 경험에 대한 무의식적 사고가 행동에 미치는 영향력을 강조하고, 다양한 방어 기제에 대한 의견을 제시한 관점 (서막 p.12)\n'''명칭''': [[정신분석]] (Psychoanalysis, 프로이트 심리학)\n{/def}\n\n[[img:L0-12.png|서막 p.12 정신분석이 바라본 마음 — 빙산: 수면 위 의식(현재 인식하는 생각·감정·욕구), 경계의 전의식(의식화될 수 있는 기억·경험), 수면 아래 무의식(억압된 기억·욕망·충동·본능). 무의식적 동기가 의식 밖에서 행동을 유도|medium]]\n\n{analogy}\n정신분석의 마음은 '''빙산'''이다(슬라이드 그림 그대로). 바다 위로 보이는 부분(의식)은 작고, 배를 침몰시키는 것은 물 아래 거대한 덩어리(무의식)다. 행동주의가 \"물 위만 보자\"고 했다면, 정신분석은 \"진짜 원인은 물 밑, 그것도 '''어린 시절에 가라앉은 것'''\"이라고 본다.\n{/analogy}\n\n== 핵심 내용 (p.12) ==\n* 아동기 경험에 대한 '''무의식적 사고'''가 행동에 미치는 영향력 강조\n* 다양한 '''방어 기제'''에 대한 의견 제시\n* 교수: 프로이트는 8장 동기에서 다시 다룬다(🎙 8/25). 꿈 이론 중 '''소망충족 이론'''은 [[수면과 꿈]](2장 p.38)에 나온다.\n\n=== 방어 기제 ===\n{def}\n'''설명''': 정신분석(프로이트)이 제시한 것으로, 무의식이 불안을 다루기 위해 쓰는 다양한 심리적 장치 (서막 p.12)\n'''명칭''': '''방어 기제''' (Defense Mechanism)\n{/def}\n슬라이드는 \"다양한 방어 기제에 대한 의견 제시\"까지만 쓴다. 투사·전이 등 개별 기제는 서막 범위 밖(정리본 노트: 후속 장).\n\n=== 정신역동 ===\n{def}\n'''설명''': 이론적 조망 중 \"무의식적 추동과 갈등이 어떻게 행동을 유도하는가?\"를 묻는 조망. 분노를 '무의식적 적대감의 방출'로 본다 (서막 p.24–25)\n'''명칭''': '''정신역동''' (Psychodynamic) 조망\n{/def}\n관련 하위 분야: '''임상, 상담, 성격'''(p.25). 정신분석의 현대적 이름이라고 생각하면 된다.\n\n== 비교: 세 학파의 인간관 ==\n{| class=\"table\"\n! 학파 || 인간관 || 행동의 원인\n|-\n| 정신분석 || 무의식에 좌우되는 존재 || 과거(아동기)의 무의식적 사고\n|-\n| [[행동주의]] || 자극에 반응하는 존재 || 바깥 자극과 강화·처벌\n|-\n| [[인본주의 심리학]] || 주체적, 자아실현 추구 || 현재 환경의 성장 잠재력\n|}\n\n{warn}\nbank 함정: \"인본주의 – 다양한 방어 기제를 제시\" ✗, \"행동주의 – 아동기 무의식\" ✗ → '''방어 기제·무의식·아동기 = 정신분석'''. 분노 예시 함정: \"무의식적 적대감의 방출 – 인지심리학\" ✗ → '''정신역동'''.\n{/warn}\n\n== 관련 문서 ==\n* [[프로이트]]\n* [[인본주의 심리학]] — 정신분석을 \"제한적\"이라 비판\n* [[이론적 조망]] — 정신역동 조망\n* [[수면과 꿈]] — 꿈의 소망충족 이론\n\n근거: 서막 p.12, p.24–25"
 },
 "프로이트": {
  "title": "지그문트 프로이트 (Sigmund Freud, 1856–1939)",
  "category": [
   "서막 심리학 이야기",
   "학자"
  ],
  "body": "'''지그문트 프로이트'''(Sigmund Freud)는 [[정신분석]]의 창시자다. 슬라이드는 정신분석을 아예 \"'''프로이트 심리학'''\"이라고 부른다. 서막에서는 아동기 무의식과 방어 기제로, 2장에서는 꿈의 소망충족 이론으로 다시 나온다.\n\n{def}\n'''설명''': 아동기 경험에 대한 무의식적 사고가 행동에 미치는 영향력을 강조하고, 다양한 방어 기제를 제시한 정신분석의 창시자 (서막 p.12)\n'''명칭''': [[프로이트]] (Sigmund Freud)\n{/def}\n\n== 인물 카드 ==\n[[img:L0-12.png|서막 p.12 정신분석(프로이트 심리학) — 의식·전의식·무의식 빙산|medium]]\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 이름(원어) || 지그문트 프로이트 (Sigmund Freud)\n|-\n| 학파·분야 || [[정신분석]] (현대 조망 이름: 정신역동)\n|-\n| 핵심 주장 || 아동기 경험에 대한 '''무의식적 사고'''가 행동을 좌우. 다양한 '''방어 기제'''\n|-\n| 다른 장 등장 || 2장 p.38 꿈 이론 — 꿈은 무의식적 소망의 충족(→ [[수면과 꿈]]); 8장 동기(범위 밖)\n|-\n| 시험에 나오는 한 줄 || \"아동기 무의식·방어 기제 → '''정신분석(프로이트)'''\"\n|}\n\n{analogy}\n프로이트는 '''심리학계의 고고학자'''다. 지금의 행동(지표면의 유물)을 보고, 그 밑에 묻힌 어린 시절의 무의식층을 발굴해 원인을 찾는다. 반면 [[인본주의 심리학|로저스·매슬로우]]는 \"땅을 파지 말고 지금 이 땅에 뭘 심을지 보자\"는 정원사였다.\n{/analogy}\n\n== 누구와 헷갈리나 ==\n{| class=\"table\"\n! 인물 || 학파 || 키워드\n|-\n| 프로이트 || [[정신분석]] || 무의식, 아동기, 방어 기제\n|-\n| 칼 로저스 · 매슬로우 || [[인본주의 심리학]] || 주체적, 자아실현\n|-\n| 왓슨 · [[스키너]] || [[행동주의]] || 관찰 가능한 행동, 조건화\n|-\n| [[윌리엄 제임스]] || [[기능주의]] || 적응적 기능\n|}\n\n{warn}\n\"인간은 자아실현을 추구하는 주체적 존재 – 프로이트\" ✗. 인본주의는 오히려 프로이트(정신분석)와 행동주의를 '''인간에 대해 너무 제한적인 인식'''이라고 비판했다.\n{/warn}\n\n== 관련 문서 ==\n* [[정신분석]]\n* [[수면과 꿈]] — 소망충족 이론\n* [[인본주의 심리학]]\n\n근거: 서막 p.12; 2장 p.38"
 },
 "인본주의 심리학": {
  "title": "인본주의 심리학 (Humanistic Psychology)",
  "category": [
   "서막 심리학 이야기",
   "이론"
  ],
  "body": "'''인본주의 심리학'''(Humanistic Psychology)은 칼 로저스와 에이브러햄 매슬로우가 이끈 관점으로, [[정신분석]]과 [[행동주의]]가 '''인간에 대해 너무 제한적인 인식'''을 지녔다고 비판하고, 인간을 '''주체적이고 자아실현을 추구하는 존재'''로 보았다.\n\n{def}\n'''설명''': 정신분석과 행동주의를 비판하며, 인간을 보다 주체적이고 자아실현을 추구하는 존재로 설정하고, 현재의 환경이 사람들의 성장 잠재력을 촉진하는 방식에 집중한 관점 (서막 p.12)\n'''명칭''': [[인본주의 심리학]] (Humanistic Psychology)\n{/def}\n\n[[img:L0-12.png|서막 p.12 오른쪽 아래 — 인본주의 심리학(칼 로저스, 에이브러햄 매슬로우)|medium]]\n\n{analogy}\n같은 사람을 두고 세 학파가 하는 말:\n* 정신분석: \"당신은 '''어린 시절 무의식의 꼭두각시'''입니다.\"\n* 행동주의: \"당신은 '''보상과 벌로 길든''' 존재입니다.\"\n* 인본주의: \"당신은 '''스스로 자라나려는 씨앗'''입니다. 햇빛과 물(현재 환경)만 맞으면 꽃(자아실현)을 피웁니다.\"\n{/analogy}\n\n== 핵심 내용 (p.12) ==\n* 학자: 칼 로저스(Carl Rogers), 에이브러햄 매슬로우(Abraham Maslow)\n* '''정신분석과 행동주의에 대한 비판''' — 인간에 대해서 너무 제한적인 인식을 지니고 있음\n* 인간 = 보다 '''주체적'''이고 '''자아실현'''을 추구하는 존재\n* 아동기 기억(정신분석)·조건 반응의 학습(행동주의)보다는 '''현재의 환경'''이 성장 잠재력을 촉진하는 방식에 집중\n\n=== 칼 로저스 ===\n{def}\n'''설명''': 매슬로우와 함께 인본주의 심리학을 이끈 학자. 인간을 주체적이고 자아실현을 추구하는 존재로 봄 (서막 p.12)\n'''명칭''': '''칼 로저스''' (Carl Rogers)\n{/def}\n교수: 상담에서 말하는 \"무조건적 긍정\"의 기반이 된 인물(🎙 8/25, 정리본).\n\n=== 매슬로 ===\n{def}\n'''설명''': 로저스와 함께 인본주의 심리학을 이끈 학자. 인간이 자아실현을 추구한다고 봄 (서막 p.12)\n'''명칭''': 에이브러햄 '''매슬로우''' (Abraham Maslow) — 표기 \"매슬로\"도 같은 인물\n{/def}\n교수는 욕구위계 피라미드(최상위 = 자아실현)를 언급만 하고 8장 동기에서 다룬다고 했다(🎙 8/25). 단계별 내용은 중간고사 범위 밖.\n\n== 비교 ==\n{| class=\"table\"\n! 구분 || [[정신분석]] || [[행동주의]] || 인본주의 심리학\n|-\n| 학자 || [[프로이트]] || 왓슨, [[스키너]] || 로저스, 매슬로우\n|-\n| 인간관 || 무의식에 좌우 || 자극에 반응 || '''주체적''', 자아실현\n|-\n| 초점 시점 || 과거(아동기) || 학습 이력 || '''현재'''의 환경\n|-\n| 관계 || ← 비판받음 || ← 비판받음 || 둘 다 \"제한적\"이라 비판\n|}\n\n{warn}\n\"인본주의 – 다양한 방어 기제를 제시\" ✗(정신분석), \"정신분석 – 자아실현을 추구하는 주체적 존재\" ✗(인본주의). bank MC 첫 문항의 오답 보기 ①·④가 정확히 이 바꿔치기다.\n{/warn}\n\n{quiz}\n인간을 자아실현을 추구하는 주체적 존재로 보고, 정신분석과 행동주의가 인간을 너무 제한적으로 본다고 비판한 관점의 이름은?\n{/quiz}\n{answer}\n'''인본주의 심리학''' (칼 로저스, 에이브러햄 매슬로우)\n{/answer}\n\n== 관련 문서 ==\n* [[정신분석]] · [[행동주의]] — 비판 대상\n* [[상담심리학]] — 인본주의가 영향을 준 응용 분야\n* [[서막 심리학 이야기]]\n\n근거: 서막 p.12"
 },

  "body": "'''인지혁명'''(Cognitive Revolution)은 1960년대, [[행동주의]]가 30–40년간 덮어 두었던 '''심적 과정'''을 다시 심리학의 연구 대상으로 되돌리고, 거기에 '''과학적 연구 방법'''론을 적용하자고 주장한 '''패러다임의 전환'''이다. 슬라이드 그림 캡션은 \"'''인지혁명 — 마음으로의 회귀'''\".\n\n{def}\n'''설명''': 심적 과정에 대한 심리학의 초기 관심사를 되돌리고 과학적 연구 방법론의 적용을 주장한 1960년대의 패러다임의 전환 (서막 p.13)\n'''명칭''': [[인지혁명]] (Cognitive Revolution)\n{/def}\n\n[[img:L0-13.png|서막 p.13 인지혁명 — 마음으로의 회귀: 자극(종·전구·소리) → 마음(빛나는 하트) → 행동(달리기·말·클릭)|medium]]\n\n{analogy}\n행동주의 시대의 심리학은 '''블랙박스 앞에서 입력과 출력만 적는 사람'''이었다. 1960년대에 컴퓨터가 등장하자 사람들은 깨달았다: \"컴퓨터도 겉으로는 입력·출력뿐이지만, 안에서 일어나는 '''처리'''를 우리는 설계도로 설명할 수 있잖아? 마음도 그렇게 연구하면 되겠다.\" — 블랙박스 뚜껑을 다시 연 사건이 인지혁명이다.\n{/analogy}\n\n[[anim:psych_history_timeline|행동주의 카드 뒤에 1960년대 인지혁명 카드가 뜨며 \"입력 → 처리 → 산출\" 도식이 나오는 순간을 보세요.]]\n\n== 핵심 내용 (p.13) ==\n* 시기: '''1960년대'''\n* 성격: 심적 과정에 대한 '''초기 관심사'''(분트·제임스 시절)를 되돌리고 '''과학적 연구 방법'''론의 적용을 주장한 '''패러다임의 전환'''\n* 계기: '''컴퓨터의 개발 및 도입''' — 컴퓨터의 작동 메커니즘이 사람의 마음이 움직이는 방식과 유사하다는 의견 제기 = '''정보 처리 접근'''\n* 교수(🎙 8/25): 에니악 1946, 디지털 컴퓨터 1950년대 중반 → 정보 처리 접근법 → 인지혁명. \"행동주의 이전 때처럼 되돌리고 과학적 연구 방법론을 적용하여 본격적으로 탐구해 보자\"\n* 결과: [[컴퓨터 메타포]] → [[인지심리학]] → [[인지신경과학]]\n\n{warn}\n\"마음으로의 회귀\"라고 해서 '''구조주의의 내성법으로 돌아간 것'''이 아니다. 관심사(심적 과정)만 되돌리고, 방법은 '''과학적 연구 방법'''이다 — 슬라이드에서 \"과학적 연구 방법\"이 빨간색으로 강조되어 있다.\n{/warn}\n\n== 행동주의 → 인지혁명 비교 ==\n{| class=\"table\"\n! 구분 || [[행동주의]] || 인지혁명 이후\n|-\n| 연구 대상 || 관찰 가능한 행동만 || 심적 과정(지각·기억·주의·사고)도\n|-\n| 마음에 대한 태도 || 블랙박스 — 연구 불가 || 정보 처리 시스템 — 모형화 가능\n|-\n| 비유 || 자판기 || 컴퓨터 ([[컴퓨터 메타포]])\n|-\n| 슬라이드 그림 || 머리에 빨간 ✗ (p.11) || 머리 속 하트가 빛남 (p.13)\n|}\n\n{exam}\nbank 단답형: \"1960년대, 행동주의가 배제했던 심적 과정을 다시 심리학의 연구 대상으로 되돌리고 과학적 연구 방법의 적용을 주장한 패러다임의 전환\" → '''인지혁명'''. 키워드 \"1960년대 · 패러다임의 전환 · 컴퓨터 · 정보 처리 접근\" 중 하나만 보여도 인지혁명.\n{/exam}\n\n== 관련 문서 ==\n* [[컴퓨터 메타포]] — 인지혁명의 대표 비유\n* [[인지심리학]] · [[인지신경과학]] — 인지혁명이 낳은 분야\n* [[행동주의]] — 인지혁명이 넘어선 패러다임\n\n근거: 서막 p.13"
 },
 "컴퓨터 메타포": {
  "title": "컴퓨터 메타포 (Computer Metaphor)",
  "category": [
   "서막 심리학 이야기",
   "용어"
  ],
  "body": "'''컴퓨터 메타포'''(Computer Metaphor)는 [[인지혁명]]이 마음을 설명하려고 가져온 비유로, 사람의 마음을 컴퓨터처럼 '''입력 → 처리 → 산출'''하는 정보 처리 시스템으로 본다. 서막 p.14 한 장짜리 도식이 전부지만, 교수가 부품 하나하나를 마음에 대응시켜 설명해서 객관식 단골이 됐다.\n\n{def}\n'''설명''': 컴퓨터의 작동에서 영감을 받아, 사람의 마음을 입력-처리-산출의 정보 처리 과정으로 보는 비유 (서막 p.13–14)\n'''명칭''': [[컴퓨터 메타포]] (Computer Metaphor)\n{/def}\n\n[[img:L0-14.png|서막 p.14 컴퓨터 메타포 — 왼쪽 컴퓨터: 입력(키보드) → 처리(본체: RAM·CPU·그래픽카드·SSD) → 산출(모니터·스피커). 오른쪽 사람: 외부 정보 입력(눈·귀) → 뇌(기억(작업·장기)·주의·계획) → 행동 반응. 가운데 노란 화살표: 컴퓨터→심리 \"Insight, 기술 제공\", 심리→컴퓨터 \"심리 데이터, 기제\"|large]]\n\n== 대응표 (🎙 8/25) ==\n{| class=\"table\"\n! 컴퓨터 부품 || 사람의 마음 || 이어지는 장\n|-\n| 입력 장치(키보드) || 눈·귀·코 등 '''감각 기관''' (외부 정보 입력) || [[4장 감각과 지각]]\n|-\n| CPU || 뇌 전반 — 주의·계획 || [[2장 마음의 생물학과 의식]]\n|-\n| '''RAM''' (작업 메모리) || '''단기/[[작업 기억]]''' — 잠깐 들고 작업 || [[6장 기억]] p.6–10\n|-\n| '''SSD''' (저장 장치) || '''[[앳킨슨-시프린 모형|장기 기억]]''' — 반영구 저장 || [[6장 기억]]\n|-\n| 모니터·스피커 (산출) || '''행동 반응''' || —\n|}\n\n{analogy}\n공대생 버전 암기법: 노트북 전원을 끄면 '''RAM 내용은 날아가고 SSD는 남는다'''. 전화번호를 외워 누르고 나면 잊는 것(작업 기억 = RAM), 초등학교 친구 이름을 아직 기억하는 것(장기 기억 = SSD). 키보드 없이 컴퓨터에 아무것도 못 넣듯, 감각 기관 없이는 마음에 정보가 못 들어온다.\n{/analogy}\n\n== 양방향 화살표: 컴퓨터 ↔ 심리학 ==\np.14 가운데 노란 화살표 두 개는 영향이 한쪽으로만 가지 않는다는 뜻이다.\n* 컴퓨터 → 심리학: \"'''Insight, 기술 제공'''\" — 정보 처리 모형이라는 사고방식\n* 심리학 → 컴퓨터: \"'''심리 데이터, 기제'''\" — AI 연구에 심리학 이론이 쓰임(정리본)\n\n== 한계 ==\n교수의 대학원 면접 에피소드(🎙 8/25): \"컴퓨터 메타포는 앞으로도 주류일까?\" — 컴퓨터는 부품과 역할을 우리가 '''다 알지만''', 마음은 아직 밝혀지지 않은 부분이 많다. 비유는 출발점일 뿐 마음 = 컴퓨터는 아니다.\n\n{warn}\nbank MC 오답 보기: \"장기 기억 = RAM\" ✗, \"감각 기관 = CPU\" ✗(감각 기관은 '''입력''', CPU는 처리), \"행동 반응 = 입력 장치\" ✗(행동은 '''산출'''). 정답: '''장기 기억 = SSD'''.\n{/warn}\n\n{quiz}\n컴퓨터 메타포에서 '''일시적으로 정보를 유지하며 연산에 쓰는''' 기억은 어떤 부품에 대응되는가? 그 기억의 이름은?\n{/quiz}\n{answer}\n'''RAM''' — '''작업(단기) 기억'''. 반영구 저장은 SSD = 장기 기억.\n{/answer}\n\n== 관련 문서 ==\n* [[인지혁명]] — 이 비유가 등장한 배경\n* [[작업 기억]] · [[앳킨슨-시프린 모형]] — RAM·SSD의 실체\n* [[인지심리학]]\n\n근거: 서막 p.13–14"
 },
 "인지심리학": {
  "title": "인지심리학 (Cognitive Psychology)",
  "category": [

  ],
  "body": "'''인지심리학'''(Cognitive Psychology)은 인간의 '''지각, 정보 처리 등의 심적 과정을 과학적으로 탐구'''하는 학문이다. [[인지혁명]]이 낳은 분야이고, 뇌과학·신경과학과 융합하면서 [[인지신경과학]]으로 발전했다. 서막에서는 세 번 등장한다 — 오늘날의 심리학(p.15), 이론적 조망(p.25), 기초 하위 분야(p.26).\n\n{def}\n'''설명''': 인간의 지각, 정보 처리 등의 심적 과정을 과학적으로 탐구하는 학문 (서막 p.15)\n'''명칭''': [[인지심리학]] (Cognitive Psychology)\n{/def}\n\n[[img:L0-15.png|서막 p.15 인지심리학/인지신경과학 — 외부 정보 입력(시각·청각·촉각·후각/미각) → 뇌의 정보 처리 → 지각·기억·사고·감정·행동, 아래 신경 활동, 피드백과 학습 순환|medium]]\n\n{analogy}\n인지심리학자는 '''소프트웨어 엔지니어'''다. 하드웨어(뉴런)가 어떻게 생겼는지보다 '''프로그램이 정보를 어떤 순서로 처리하는지'''(부호화 → 저장 → 인출)를 반응 시간·정답률 같은 행동 데이터로 역설계한다. 거기에 오실로스코프(뇌전도)와 X선(뇌영상)까지 들고 오면 [[인지신경과학]]이 된다.\n{/analogy}\n\n== 서막에서의 세 얼굴 ==\n{| class=\"table\"\n! 위치 || 어떤 맥락 || 내용\n|-\n| p.15 오늘날의 심리학 || 학문 정의 || 지각·정보 처리 등 심적 과정을 과학적으로 탐구 → 인지신경과학으로 발전\n|-\n| p.24–25 [[이론적 조망]] || 조망 || 연구 질문 \"정보의 '''부호화 및 처리, 저장, 인출'''은 어떻게 이루어지는가?\" / 관련 분야: 인지신경과학, 임상, 상담, 산업조직. 분노 예시: '''상황의 해석'''이 분노에 미치는 영향력\n|-\n| p.26 [[심리학의 하위 분야]] || 기초 학문 || 지각, 사고, 정보 처리 등에 대한 '''실험적 접근'''\n|}\n\n\"부호화·저장·인출\"은 그대로 [[6장 기억]]의 [[앳킨슨-시프린 모형]] 세 단계다.\n\n== 현대 심리학 (p.15 아래) ==\n* 현대의 심리학 = 사람 마음에 대한 과학\n* 감각, 사고 등의 심적 과정을 '''행동으로부터 추론'''\n* 다양한 학문 분야의 영향을 받아 다각적 관점 추구\n\n{warn}\n분노 예시 함정: \"상황의 해석이 분노에 미치는 영향 – 정신역동\" ✗ → '''인지'''. \"무의식적 적대감 – 인지심리학\" ✗ → '''정신역동'''. (bank MC)\n{/warn}\n\n== 비교: 인지심리학 vs 인지신경과학 ==\n{| class=\"table\"\n! 구분 || 인지심리학 || [[인지신경과학]]\n|-\n| 질문 || 어떤 단계에서 어떤 정보 처리가 일어나나 || + 어느 '''뇌 영역'''이 그 기능에 관여하나\n|-\n| 주 데이터 || 행동(반응 시간, 정답률) || 행동 + 뇌전도·뇌영상·신경 조절\n|-\n| 관계 || 출발점 || 인지심리학 + 뇌과학·신경과학 융합\n|}\n\n== 관련 문서 ==\n* [[인지혁명]] · [[컴퓨터 메타포]]\n* [[인지신경과학]]\n* [[이론적 조망]]\n\n근거: 서막 p.15, p.25–26"
 },

  "body": "'''인지신경과학'''(Cognitive Neuroscience)은 [[인지심리학]]이 '''뇌과학·신경과학과 융합'''해 발전한 분야로, 인간의 사고와 인지 체계에 대한 '''생물학적 접근법'''이다. '''뇌전도, 뇌영상, 신경 조절''' 등 다양한 방법을 활용해 연구한다.\n\n{def}\n'''설명''': 인지심리학이 뇌과학·신경 과학과 융합하여 발전한 것으로, 인간의 사고와 인지 체계에 대한 생물학적 접근법. 뇌전도, 뇌영상, 신경 조절 등 다양한 방법을 활용하여 연구 (서막 p.15)\n'''명칭''': [[인지신경과학]] (Cognitive Neuroscience)\n{/def}\n\n[[img:L0-15.png|서막 p.15 인지심리학/인지신경과학 — 뇌의 정보 처리와 아래쪽 '신경 활동(뉴런 간 신호 전달)'|medium]]\n\n{analogy}\n[[인지심리학]]이 '''프로그램의 실행 결과만 보고 알고리즘을 추론'''했다면, 인지신경과학은 거기에 '''디버거와 전력 측정기'''를 붙인 것이다. \"이 함수(기억)가 실행될 때 어느 칩(해마)이 뜨거워지는가?\"를 직접 본다.\n{/analogy}\n\n== 두 개의 질문 (🎙 8/25) ==\n# 어느 '''단계'''에서 어떤 정보 처리가 일어나는가?\n# 어느 '''뇌 영역'''이 특정 기능에 관여하는가?\n\n== 연구 방법 (p.15 → 2장) ==\n{| class=\"table\"\n! 슬라이드 표현 || 구체적 기법 || 자세히\n|-\n| 뇌전도 || EEG, ERP(N400/P600) || [[뇌전도]], [[사건 관련 전위]]\n|-\n| 뇌영상 || fMRI, DSI || [[fMRI]], [[확산 스펙트럼 영상]]\n|-\n| 신경 조절 || 뇌 활동을 직접 조절하는 방법 (서막은 이름만) || [[2장 마음의 생물학과 의식]] 뇌 연구 기법 비교표\n|}\n\n{exam}\n통합요약 단답형 출제 예상: \"인지심리학과 뇌과학이 융합해 뇌전도·뇌영상을 쓰는 분야 → '''인지신경과학'''\". 키워드는 '''융합 + 생물학적 접근 + 뇌전도·뇌영상'''.\n{/exam}\n\n{warn}\n'''생물심리학/신경과학'''(p.26 기초 분야: 두뇌·신경 활동과 심적 과정의 연관성)과 이름이 비슷하다. 서막 p.15 의 \"인지심리학이 융합해 발전한\" 쪽은 '''인지신경과학'''이고, p.25 표에서도 인지심리학의 관련 하위 분야로 '''인지신경과학'''이 적혀 있다.\n{/warn}\n\n== 관련 문서 ==\n* [[인지심리학]] — 출발점\n* [[뇌전도]] · [[fMRI]] — 대표 연구 기법(2장)\n* [[인지혁명]]\n\n근거: 서막 p.15"
 },
 "선천성-후천성 논제": {
  "title": "선천성-후천성 논제 (Nature-Nurture Issue)",
  "category": [
   "서막 심리학 이야기",
   "이론"
  ],
  "body": "'''선천성-후천성 논제'''(Nature-Nurture Issue)는 인간 심리의 기원이 '''타고난 것'''인가, '''외부 환경으로부터의 학습'''인가를 묻는 오래된 논쟁이다. 슬라이드 p.16–21 여섯 장이 모두 이 제목을 달고 있고, 결론은 교수 말 그대로 \"'''둘 다 중요하다'''\".\n\n{def}\n'''설명''': 인간의 심리에 대한 기원이 타고난 것인지 외부 환경으로부터의 학습인지, 생물학적 특성과 환경의 상대적 영향력에 대한 논의 (서막 p.16)\n'''명칭''': [[선천성-후천성 논제]] (Nature-Nurture Issue)\n{/def}\n\n[[img:L0-16.png|서막 p.16–17 선천성(DNA·신생아·지문) VS 후천성(가족·학교·자연·도시)|medium]]\n\n{analogy}\n사람의 마음은 '''씨앗과 밭'''이다. 같은 볍씨(유전자)라도 논이 기름지냐 메마르냐(환경)에 따라 수확이 다르고, 아무리 좋은 논이라도 콩을 심으면 벼가 나지 않는다. \"씨앗이냐 밭이냐?\"는 질문 자체가 반쯤 틀렸고, 답은 '''둘의 상호작용'''이다.\n{/analogy}\n\n== 슬라이드 흐름 (p.16–21) ==\n{| class=\"table\"\n! p. || 내용 || 사전 문서\n|-\n| 16 || 논제 정의 + 다윈의 진화론(「종의 기원」 1859, 자연 선택설) → 인간 심리에 적용(기능주의) || [[자연선택]], [[기능주의]]\n|-\n| 17 || 생물학적 특성과 환경의 '''상호작용''' — 진화심리학(보편성) / 행동유전학(차이점) || [[진화심리학]], [[행동유전학]]\n|-\n| 18 || 일란성·이란성 쌍둥이 — 대부분 선천성·후천성 모두 중요 || [[쌍둥이 연구]]\n|-\n| 19 || 비교문화심리학 — 문화의 정의, 차이 속 보편성(외로움 연구) || [[비교문화심리학]]\n|-\n| 20 || '''선천성''' 심리 기제 — 에크만의 6가지 기본 감정 || [[에크만의 기본 감정]]\n|-\n| 21 || '''후천성''' 심리 기제 — 문화에 따른 색 지각 차이 || (이 문서 아래)\n|}\n\n{exam}\n교수(🎙 8/25 1:28:35): \"결론적으로 타고나는 거든 나중에 배운 것이든 '''둘 다 중요하다'''라는 게 선천성-후천성 문제의 결론\". 통합요약 §0-1 서막 강조 문장.\n{/exam}\n\n정리본 노트 — 철학적 뿌리(🎙 8/25): 플라톤 = 생득론, 아리스토텔레스 = 학습된 것 / 데카르트 = 생득적(대륙 합리론), 존 로크 = 학습론(영국 경험론). 심리학은 철학에서 파생된 비교적 젊은 학문이다.\n\n=== 문화에 따른 색 지각 차이 ===\n[[img:L0-21.png|서막 p.21 몽골인과 중국인의 색 지각 차이 비교 연구(He et al., 2019) — 파랑색·녹색 스펙트럼|medium]]\n\n{def}\n'''설명''': 삼원색 같은 기본 색상 지각은 문화와 무관하지만, 동일 색상 내 채도 차이의 표현은 문화권마다 달라(몽골어는 녹색·파란색 계통 세분화, 중국어는 하나로 통일) 실제 색 지각·분류 체계에 영향을 주는 현상 — 후천성 심리 기제의 예 (서막 p.21)\n'''명칭''': '''문화에 따른 색 지각 차이''' (He et al., 2019)\n{/def}\n* 삼원색(RGB) 같은 기본 색상 → 문화권과 '''무관'''하게 지각\n* 동일 색상 내 채도 차이의 표현 → 문화권마다 '''다름'''\n* '''몽골어''': 녹색과 파란색 계통이 '''세분화''' / '''중국어''': 녹색과 파란색 계통이 '''하나로 통일'''\n* 색상 표현의 차이가 실제 색 지각 및 분류 체계에 영향 → 슬라이드: '''문화사회심리학'''의 주요 연구 주제\n* 교수: 한국어도 몽골어처럼 색 명칭이 세분화된 편(🎙 8/25)\n\n== 선천성 예시 vs 후천성 예시 ==\n{| class=\"table\"\n! 구분 || 선천성 (p.20) || 후천성 (p.21)\n|-\n| 예시 || [[에크만의 기본 감정]] 6개 식별 || 몽골어/중국어 화자의 색 지각 차이\n|-\n| 근거 || 문화·인종과 무관하게 식별 → 유전적으로 타고났을 수 있음 || 언어(환경)에 따라 분류 체계가 달라짐\n|-\n| 관련 분야 || [[진화심리학]] || [[비교문화심리학]], 문화사회심리학\n|}\n\n{warn}\nbank MC 오답 ②: \"선천성 = 색 지각 차이, 후천성 = 기본 감정\" — '''순서를 뒤집은''' 함정. ③④처럼 두 예시를 한쪽으로 몰아넣는 보기도 오답. 또 \"결론 = 선천성이 더 중요\" 같은 보기는 교수 결론(\"둘 다 중요\")과 어긋난다.\n{/warn}\n\n== 관련 문서 ==\n* [[진화심리학]] · [[행동유전학]] — 이 논제의 두 핵심 분야\n* [[쌍둥이 연구]] — 대표 연구 방법\n* [[3장 일생에 걸친 발달]] — 발달도 유전과 환경의 상호작용\n* [[생물심리사회적 접근법]] — \"하나로는 설명 못 함\"의 확장판\n\n근거: 서막 p.16–21"
 },
 "자연선택": {
  "title": "자연선택 (Natural Selection) — 다윈의 진화론",
  "category": [
   "서막 심리학 이야기",
   "이론"
  ],
  "body": "'''자연선택'''(Natural Selection, 자연 선택설)은 찰스 다윈이 「'''종의 기원'''」('''1859''')에서 제안한 진화의 핵심 원리다. 우연한 변이 가운데 유기체가 환경에 따라 '''가장 잘 생존할 수 있는 특질이 선택'''된다는 것. 심리학에서는 [[기능주의]]가 이것을 인간 심리에 적용했고, 오늘날 [[진화심리학]]과 진화론 [[이론적 조망]]의 바탕이 된다.\n\n{def}\n'''설명''': 우연한 변이 가운데, 유기체가 환경에 따라 가장 잘 생존할 수 있는 특질을 선택한다는 것이 핵심인 다윈의 이론 — 「종의 기원」(1859)에서 제안 (서막 p.16)\n'''명칭''': [[자연선택]] (자연 선택설, Natural Selection)\n{/def}\n\n[[img:L0-16.png|서막 p.16 선천성-후천성 논제 — 다윈의 진화론: 종의 기원(1859)에서 자연 선택설을 제안|medium]]\n\n{analogy}\n자연선택은 '''수만 개의 랜덤 시드로 돌리는 유전 알고리즘'''이다. 매 세대 조금씩 무작위로 바뀐 개체(우연한 변이) 중 환경이라는 평가 함수에서 점수가 높은 것만 다음 세대로 복사된다. 아무도 설계하지 않았는데 결과물은 마치 설계된 것처럼 환경에 딱 맞는다 — 기능주의자는 '''마음도 그렇게 만들어진 \"적응적 기능\"'''이라고 봤다.\n{/analogy}\n\n== 서막에서 자연선택이 나오는 곳 ==\n{| class=\"table\"\n! p. || 맥락 || 내용\n|-\n| 10 || [[기능주의]] || \"다윈의 진화론의 영향을 받음\" — 마음 = 조상의 생존에 기여한 적응적 기능\n|-\n| 16 || [[선천성-후천성 논제]] || 「종의 기원」(1859), 자연 선택설, \"인간의 심리에도 적용하고자 함(기능주의)\"\n|-\n| 17 || 상호작용 || \"모든 생명체는 생존에 유리한 방향으로 진화(자연선택)\"\n|-\n| 22 || [[분석 수준|생물학적 수준]] || 유전자, '''자연선택''', 적응적 특질 등을 중점으로\n|-\n| 25 || [[이론적 조망|진화론]] 조망 || \"특질의 자연선택은 어떻게 유전자의 생존을 촉진시키는가?\"\n|}\n\n=== 다윈의 진화론 ===\n{def}\n'''설명''': 기능주의에 영향을 준 이론으로, 「종의 기원」(1859)에서 자연 선택설을 제안한 이론 (서막 p.10, p.16)\n'''명칭''': '''다윈의 진화론'''\n{/def}\n\n=== 「종의 기원」 ===\n{def}\n'''설명''': 다윈이 자연 선택설을 제안한 책 (1859) (서막 p.16)\n'''명칭''': 「'''종의 기원'''」 (On the Origin of Species, 1859)\n{/def}\n\n{warn}\n'''연도 함정''': 「종의 기원」은 '''1859''', 분트의 실험실은 '''1879'''. 20년 차이 — 숫자 끝자리 9가 같아 바꿔치기하기 좋다. 순서로 기억: 진화론(1859)이 먼저 → 실험 심리학(1879)이 나중.\n{/warn}\n\n== 관련 문서 ==\n* [[기능주의]] — 진화론의 영향을 받은 학파\n* [[진화심리학]] — 자연선택으로 보편성을 설명\n* [[선천성-후천성 논제]]\n\n근거: 서막 p.16–17 (+p.10, p.22, p.25)"
 },
 "진화심리학": {
