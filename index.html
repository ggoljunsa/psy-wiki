  "body": "'''기억 응고화'''(Memory Consolidation)는 '''학습 내용을 보다 강건한 형태로 변환하는 과정'''이다. 갓 들어온 기억은 젖은 시멘트처럼 무르고, 응고화를 거쳐야 단단해진다. 6장에서 두 번 나온다 — p.22 에서는 [[간격두기 효과]]가 왜 효과적인지의 이유로, p.27 에서는 '''[[해마]]가 외현 기억을 저장하는 과정'''의 이름으로. 그리고 '''수면'''이 응고화를 지원한다.\n\n{def}\n'''설명''': 학습 내용을 보다 강건한 형태로 변환하는 과정. 해마가 외현 기억을 저장하는 과정이며 수면이 이를 지원한다 (6장 p.22, p.27)\n'''명칭''': [[기억 응고화]] (Memory Consolidation)\n{/def}\n\n{analogy}\n응고화는 '''워드 파일 \"저장\" 버튼'''이다. 타이핑한 내용(학습)은 처음엔 화면(작업 기억)에만 있다. 저장 버튼(해마)을 눌러야 하드디스크(장기 기억)에 단단히 기록된다. 그리고 컴퓨터가 쉬는 밤사이(수면) 백업이 돌아간다. 정리본 노트도 해마를 \"저장 버튼을 눌러 하드디스크로 보내는 역할\"로 설명한다 — '''해마 = 버튼이지 하드디스크가 아니다.'''\n{/analogy}\n\n[[img:L6-27.png|6장 p.27 — 외현 기억 시스템: 전두엽과 해마. \"해마는 외현 기억의 저장을 담당하며 저장 과정은 기억 응고화(memory consolidation)\", \"수면이 기억 응고화를 지원(Peigneux et al., 2004) = 간격두기 효과 발생\"|medium]]\n\n== 응고화가 나오는 세 곳 ==\n\n{| class=\"table\"\n! 슬라이드 || 맥락 || 문장\n|-\n| p.22 || [[간격두기 효과]] || 기억의 응고화 과정(Consolidation)과 관련. 응고화: 학습 내용을 보다 강건한 형태로 변환하는 과정\n|-\n| p.27 || [[해마]] || 해마는 외현 기억의 저장을 담당하며 저장 과정은 기억 응고화. 수면이 응고화를 지원(Peigneux et al., 2004) = 간격두기 효과 발생\n|-\n| p.41 || 기억 증진법 || 충분한 수면 취하기 — 수면 부족은 장기 기억의 응고화를 방해(Lo et al., 2016)\n|}\n\n== 응고화 vs 재응고화 ==\n\n{| class=\"table\"\n! || 기억 응고화 || [[재응고화]]\n|-\n| 언제 || '''처음''' 저장할 때 || '''인출한 뒤''' 다시 저장할 때\n|-\n| 하는 일 || 무른 기억 → 강건한 형태로 || 인출 직후 취약해진 기억을 재부호화해 다시 저장\n|-\n| 결과 || 안정화 || 변형 위험 (소문 와전, 목격자 진술)\n|-\n| 관련 || [[해마]], 수면, [[간격두기 효과]] || [[오정보 효과]]\n|}\n\n{exam}\n수면 관련 함정 두 개를 구분하자(통합요약 객관식 포인트):\n* 수면 → '''응고화 지원''' (Peigneux et al., 2004; 수면 부족은 응고화 방해, Lo et al., 2016)\n* 수면 → '''역행 간섭 감소''' (Jenkins & Dallenbach, 1924 → [[역행 간섭]])\n둘 다 \"자고 나면 더 잘 기억한다\"지만 '''이유가 다르다'''. 서막 p.27 에서도 교수가 숙면이 기억의 응고화에 영향을 준다고 언급했다.\n{/exam}\n\n{warn}\n\"해마는 모든 장기 기억이 영구적으로 저장되는 장소\" → ✘ (bank 객관식 정답 보기). 해마는 '''형성·응고화'''를 담당할 뿐, 해마가 손상돼도 [[암묵 기억]]은 정상 작동한다.\n{/warn}\n\n{quiz}\n\"학습 내용을 보다 강건한 형태로 변환하는 과정으로, 해마가 외현 기억을 저장하는 과정이며 수면이 이를 돕는다.\" 명칭은?\n{/quiz}\n{answer}\n'''기억 응고화'''(consolidation). 인출 뒤 다시 저장하는 것은 '''재응고화'''.\n{/answer}\n\n== 관련 문서 ==\n* [[해마]] · [[간격두기 효과]] · [[재응고화]]\n* [[수면과 꿈]](수면의 목적) · [[외현 기억]] · [[6장 기억]]\n\n근거: 6장 p.22, p.27, p.41"
 },
 "처리 수준": {
  "title": "처리 수준 (Levels of Processing) — 얕은 처리·깊은 처리",
  "category": [
   "6장 기억",
   "이론"
  ],
  "body": "'''처리 수준'''은 정보를 '''얼마나 깊게 처리했느냐'''가 기억을 좌우한다는 생각이다. 글자 모양·소리만 보는 '''얕은 처리'''보다 '''의미'''를 생각하는 '''깊은 처리'''를 할수록 파지가 우수하다(Craik & Tulving, 1975). 슬라이드 예시 단어는 '''\"다과\"''' — ① 고딕체인가?(형태) ② '의성어'와 운율이 같은가?(소리) ③ \"소녀가 ___를 먹었다\"에 맞는가?(의미). ③을 물은 경우 나중에 가장 잘 기억한다.\n\n{def}\n'''설명''': 정보를 형태·소리 수준이 아니라 의미에 기반하여 처리할수록(처리 수준이 깊을수록) 파지가 우수하다는 이론적 틀 (Craik & Tulving, 1975) (6장 p.24)\n'''명칭''': [[처리 수준]] (깊은 처리)\n{/def}\n\n{analogy}\n처리 수준은 '''책을 대하는 세 가지 태도'''다. ① 표지 글꼴만 본다(형태) ② 제목을 소리 내 읽어 본다(소리) ③ 내용을 읽고 \"이게 내 전공이랑 무슨 상관이지?\" 생각한다(의미). 한 달 뒤 그 책이 기억나는 건 ③뿐이다. 같은 시간을 써도 '''삽을 얼마나 깊이 넣었느냐'''가 다르다.\n{/analogy}\n\n[[img:L6-24.png|6장 p.24 — 정보의 처리수준. 빨간 박스: 예시 단어 '다과' — ① 이 단어의 활자가 고딕체인가? ② 이 단어는 '의성어'와 운율이 같은가? ③ 단어가 다음 문장에 적합한가? \"소녀가 ___를 먹었다\" (1. 형태, 2. 소리, 3. 의미 / Craik & Tulving, 1975)|large]]\n\n== 얕은 처리 vs 깊은 처리 ==\n\n=== 얕은 처리 ===\n{def}\n'''설명''': 언어를 기준으로 글자, 형태 등 아주 기초적인 수준의 정보를 처리하고 부호화하는 것 (6장 p.24)\n'''명칭''': [[처리 수준|얕은 처리]] (Shallow Processing)\n{/def}\n\n=== 깊은 처리 ===\n{def}\n'''설명''': 의미에 기반하여 정보를 처리하고 부호화하여 파지하는 것 (6장 p.24)\n'''명칭''': [[처리 수준|깊은 처리]] (Deep Processing)\n{/def}\n\n{| class=\"table\"\n! 질문 (단어 '다과') || 처리하는 것 || 수준 || 파지 (p.24)\n|-\n| ① 활자가 고딕체인가? || '''형태''' || 얕음 || 얕은 처리 → 상대적으로 불리\n|-\n| ② '의성어'와 운율이 같은가? || '''소리''' || 얕음 || 얕은 처리 → 상대적으로 불리\n|-\n| ③ \"소녀가 ___를 먹었다\"에 적합한가? || '''의미''' || '''깊음''' || '''깊을수록 파지 우수'''\n|}\n\n슬라이드(p.24)는 형태·소리·의미를 예시로 들 뿐 회상을 3단계로 순위 매기지 않는다 — '''얕음 / 깊음''' 두 단계, \"처리 수준이 깊을수록 파지가 우수\".\n\n<pre class=\"ascii\">\n  형태 (고딕체?)  ──▶  소리 (운율?)  ──▶  의미 (문장에 맞나?)\n  얕음 ──────────────────────────────────────────▶ 깊음\n  파지     불리                     깊을수록 파지 우수\n<\/pre>\n\n* 처리 수준이 깊을수록 파지가 우수.\n* 어떤 정보를 유지하는 데 의미가 부여되면 유리 — '''조직화, 체제화와 유사'''([[청크화]]·위계 구성).\n* 통상적으로 깊은 수준의 처리를 할수록 기억 회상 증가(Craik & Tulving, 1975).\n\n{info}\n정리본 노트: 처리 수준 이론의 비판 — \"무엇이 깊은 처리인가\"를 독립적으로 정의하지 못해, \"잘 기억됐으니 깊게 처리한 것이고, 깊게 처리했으니 잘 기억된다\"는 '''순환적 추론'''의 위험이 있다(통합요약 객관식 포인트).\n{/info}\n\n{warn}\nbank 객관식: Craik & Tulving 연구에서 가장 잘 회상할 조건은? → '''단어가 문장에 적합한지 판단(의미 처리)'''. 형태(고딕체)·소리(운율) 처리는 '''얕은 처리'''라 오답. 또 [[계열 위치 효과]](초두·최신)를 처리 수준으로 설명하는 보기도 오답 — 슬라이드는 되뇌기 여유와 단기 기억으로 설명한다.\n{/warn}\n\n{quiz}\n\"단어를 형태·소리보다 의미 위주로 처리할수록 잘 기억한다\"는 이론적 틀의 명칭은? 그리고 의미 위주 처리를 뭐라 부르나?\n{/quiz}\n{answer}\n'''처리 수준''' (Craik & Tulving, 1975). 의미 위주 처리는 '''깊은 처리''', 형태·소리 처리는 '''얕은 처리'''.\n{/answer}\n\n== 관련 문서 ==\n* [[자기참조 효과]](같은 '정보의 처리수준' 단원 p.25 — 나와 연결) · [[검증 효과]] · [[청크화]]\n* [[간격두기 효과]](공부법 비교표) · [[6장 기억]]\n\n근거: 6장 p.24"
 },
 "자기참조 효과": {
  "title": "자기참조 효과 (Self-reference Effect)",
  "category": [
   "6장 기억",
   "용어"
  ],
  "body": "'''자기참조 효과'''(Self-reference Effect)는 '''새로운 정보를 자신과 의미 있게 연관시킬 수 있을 경우 회상이 올라가는''' 현상이다(Taylor & Garry, 2019 — 슬라이드 표기 \"Tayleor\"). 슬라이드 단원 이름은 \"개인적으로 의미 있는 것으로 만들기\". [[처리 수준]]과 같은 '''정보의 처리수준''' 단원에 있다 — 의미를 붙이는 것 중에서도 '''\"나\"와 연결하는 것'''이 강력하다는 것.\n\n{def}\n'''설명''': 새로운 정보를 자신과 의미 있게 연관시킬 수 있을 경우, 회상이 올라가는 현상 (6장 p.25)\n'''명칭''': [[자기참조 효과]] (Self-reference Effect)\n{/def}\n\n{def}\n'''설명(사례형)''': 성격 형용사 목록을 보며 \"이 단어가 나를 잘 묘사하는가?\"를 판단한 집단이 \"이 단어가 일반적인 단어인가?\"를 판단한 집단보다 나중에 단어를 더 잘 회상했다. 이 현상은?\n'''명칭''': [[자기참조 효과]]\n{/def}\n\n{analogy}\n자기참조 효과는 '''단체 사진에서 내 얼굴 찾기'''다. 50명이 찍힌 사진을 1초만 봐도 내가 어디 있는지는 정확히 기억한다. 남의 얼굴은 흐릿해도 \"나\"가 들어간 정보는 따로 형광펜이 칠해진다. 공부할 때도 \"[[부적 강화]]? 아, 내가 두통약 먹는 거네\" 하고 나에게 끌어오면 형광펜이 칠해진다.\n{/analogy}\n\n[[img:L6-25.png|6장 p.25 — 자기참조 효과 양상. 자신과 관련된 정보(예: 자신을 기술하는 단어 'Happy') vs 자신과 관련이 없는 정보(예: 일반적인 단어 'Chair') → 기억 수행 막대: 자신과 관련된 단어가 훨씬 높다|medium]]\n\n== 문화에 따른 차이 (p.25) ==\n\n{| class=\"table\"\n! 문화권 || 자기참조 효과가 미치는 범위 || 출처\n|-\n| '''개인주의''' 문화권 || '''자신과 관련된 정보'''에 국한 || Sparks et al., 2016\n|-\n| '''집단주의''' 문화권 || 자기 관련 정보와 '''가족 관련 정보'''를 '''동일하게''' 잘 기억 || Sparks et al., 2016\n|}\n\n→ 서막 [[비교문화심리학]]과 연결되는 지점. \"자기\"의 경계가 문화마다 다르다.\n\n{info}\np.25 마지막 줄: \"[[칵테일 파티 효과]]에서도 자신과 관련된 정보가 나올 경우, 주의가 집중되는 것과 유사.\" 시끄러운 파티에서 내 이름만 귀에 꽂히는 것(2장)과, 나와 관련된 단어가 더 잘 기억되는 것(6장)은 같은 원리 — '''\"나\" 관련 정보는 우선 처리된다'''.\n{/info}\n\n== 비교: 의미를 붙이는 전략들 ==\n\n{| class=\"table\"\n! 전략 || 무엇과 연결하나 || 슬라이드\n|-\n| [[처리 수준|깊은 처리]] || '''의미''' (문장에 맞나?) || p.24\n|-\n| '''자기참조 효과''' || '''나 자신''' (+ 집단주의는 가족) || p.25\n|-\n| [[청크화]] / 위계 구성 || '''다른 정보와의 구조''' || p.19, p.21\n|}\n\n{warn}\n\"자기참조 효과는 모든 문화권에서 자신과 관련된 정보에만 국한된다\" → ✘. '''집단주의 문화권은 가족 관련 정보도''' 동일하게 잘 기억한다(통합요약 객관식 포인트).\n{/warn}\n\n{quiz}\n\"자신과 연관 지어 정보를 처리할 때 회상이 향상되는 현상\"의 명칭은?\n{/quiz}\n{answer}\n'''자기참조 효과'''(Self-reference Effect). 통합요약 단답형 예상 12번.\n{/answer}\n\n== 관련 문서 ==\n* [[처리 수준]] · [[칵테일 파티 효과]] · [[비교문화심리학]]\n* [[간격두기 효과]](공부법 비교표) · [[6장 기억]]\n\n근거: 6장 p.25"
 },
 "섬광 기억": {
  "title": "섬광 기억 (Flashbulb Memory)",
  "category": [
   "6장 기억",
   "용어"
  ],
  "body": "'''섬광 기억'''(Flashbulb Memory)은 '''정서적으로 중대한 순간이나 사건에 대한 선명한 기억'''이다. 카메라 플래시가 터진 듯 그 순간이 사진처럼 박혀 있다는 데서 붙은 이름. 담당 영역은 '''[[편도체]]'''(Amygdala). 정서가 스트레스 호르몬 분비를 촉발하고, 자극된 편도체가 전두엽과 기저신경절의 기억 흔적을 활성화해 '''보다 강력하고 신뢰할 수 있는 기억'''이 만들어진다.\n\n{def}\n'''설명''': 정서적으로 중대한 순간이나 사건에 대한 선명한 기억 (6장 p.29)\n'''명칭''': [[섬광 기억]] (Flashbulb Memory)\n{/def}\n\n{def}\n'''설명(사례형)''': 수능 성적표를 처음 받아 든 순간 어디에 서 있었는지, 누가 옆에 있었는지까지 몇 년이 지나도 선명하게 기억난다. 이런 기억의 명칭은?\n'''명칭''': [[섬광 기억]]\n{/def}\n\n{analogy}\n섬광 기억은 '''블랙박스 충격 감지 녹화'''다. 평소 블랙박스는 영상을 덮어쓰며 지우지만, 충격(강한 정서)이 감지되면 그 앞뒤 장면을 '''별도 폴더에 잠금 저장'''한다. 편도체가 바로 그 충격 센서다. 단, 잠금 폴더 영상을 자꾸 돌려 보며(되뇌기) \"확실히 이랬어\"라고 믿게 되는 것이지 — 영상 자체가 완벽하다는 보장은 없다.\n{/analogy}\n\n[[img:L6-29.png|6장 p.29 — 정서 관련 기억. 뇌 단면도(전두엽·해마·기저신경절·소뇌)에서 빨간 박스로 강조된 '편도체'|medium]]\n\n== 정서가 기억을 강하게 만드는 경로 (p.29) ==\n\n<pre class=\"ascii\">\n 정서적으로 중대한 사건\n        │\n        ▼\n 스트레스 호르몬 분비 촉발\n        │\n        ▼\n [[편도체]] 자극 ──▶ 전두엽 · 기저신경절의 기억 흔적 활성화 (Buchanan, 2007)\n        │\n        ▼\n 보다 강력하고 신뢰할 수 있는 기억 형성 (맥고프, 2003)  →  섬광 기억\n<\/pre>\n\n{info}\n'''확신도가 높은 이유''': 섬광 기억이 확신도에서 주목할 만한 이유는 '''부분적으로 그 기억을 되뇌기 때문'''(Hirst & Phelps, 2016). 큰 사건일수록 여러 번 이야기하고 떠올린다 → 그런데 인출할 때마다 [[재응고화]]가 일어나므로, '''확신이 높다고 정확하다는 뜻은 아니다'''.\n{/info}\n\n== 기억과 뇌 영역 정리 (p.26–29) ==\n\n{| class=\"table\"\n! 영역 || 담당 || 기억 유형\n|-\n| [[해마]] || 외현 기억 형성·[[기억 응고화]] || [[외현 기억]]\n|-\n| 전전두엽 || 작업 기억 유지 || [[작업 기억]]\n|-\n| [[소뇌]] || 파블로프 조건 형성 || [[암묵 기억]]\n|-\n| 기저 신경절 || 절차 기억 형성 || [[암묵 기억]]\n|-\n| '''[[편도체]]''' || '''정서 관련 기억''' || '''섬광 기억'''\n|}\n\n{warn}\n* 섬광 기억 담당은 [[해마]]가 아니라 '''편도체'''(p.29). \n* 섬광 기억의 높은 확신도 = \"되뇌기\" 때문(부분적). \"정서 기억은 절대 변형되지 않는다\"는 과장.\n{/warn}\n\n{quiz}\n\"정서적으로 중대한 사건에 대한 선명하고 확신도 높은 기억\"의 명칭과 담당 뇌 영역은?\n{/quiz}\n{answer}\n'''섬광 기억''' — '''편도체'''. 통합요약 단답형 예상 13번.\n{/answer}\n\n== 관련 문서 ==\n* [[편도체]](2장) · [[재응고화]] · [[해마]]\n* [[외현 기억]] · [[6장 기억]](기억의 신경학)\n\n근거: 6장 p.29"
 },
 "인출 단서": {
  "title": "인출 단서 (Retrieval Cue)",
  "category": [
   "6장 기억",
   "용어"
  ],
  "body": "'''인출 단서'''(Retrieval Cue)는 '''기억의 인출 과정을 용이하게 하는 추가 자극'''이다. 단서 하나로 기억이 줄줄이 딸려 나오는 것은, 지식과 기억이 '''파편화되어 있지 않고 상호 연결된 네트워크'''로 구성되어 있기 때문이다. 그리고 '''최선의 인출 단서는 부호화할 때 형성된 연합'''(환경, 맥락, 정서 등)이다 — 이 마지막 문장이 [[부호화 명세성 원리]]와 [[맥락 의존 기억과 상태 의존 기억]]으로 이어진다.\n\n{def}\n'''설명''': 기억의 인출 과정을 용이하게 하는 추가 자극 (6장 p.30)\n'''명칭''': [[인출 단서]] (Retrieval Cue)\n{/def}\n\n{analogy}\n인출 단서는 '''포도송이의 꼭지'''다. 포도알(기억) 하나하나를 손가락으로 집으려면 힘들지만, 꼭지(단서)를 잡아 올리면 송이 전체가 딸려 올라온다. 기억이 낱알이 아니라 '''송이(네트워크)'''로 매달려 있기 때문이다. 그리고 가장 잘 잡히는 꼭지는 '''포도가 처음 열린 그 자리''' — 부호화할 때의 맥락이다.\n{/analogy}\n\n[[img:L6-30.png|6장 p.30 — 점화의 예시. 병원 → 약국(의미적으로 연결), 병원 → 학원(발음만 비슷). '병원'이 '약국'을 더 쉽게 활성화한다|medium]]\n\n== 인출 단서가 말해 주는 것 (p.30) ==\n\n* 지식 및 기억이 '''파편화되어 있지 않고 상호 연결'''되어 있다는 점을 함의.\n* 기억을 비롯한 지식은 '''네트워크 형태의 망'''으로 구성됨.\n* '''최선의 인출 단서는 부호화할 때 형성된 연합'''(환경, 맥락, 정서 등).\n\n<pre class=\"ascii\">\n              [약국]\n                │  (의미 연결: 강함)\n   [의사] ── [병원] ── [주사]\n                ┆  (발음만 비슷: 약함)\n              [학원]\n   \"병원\"을 보면 연결된 노드가 함께 켜진다 = 인출 단서 / 점화\n<\/pre>\n\n== 점화 ==\n\np.30 의 두 번째 항목은 '''[[점화]]'''(Priming) — 무의식적이고 자각할 수 없는 특정 연합의 활성화로, '''[[암묵 기억]]의 한 종류'''다. 의미·공통 속성·관련성 등 다양한 요인을 통해 개념 간 연결 상태를 탐구할 수 있다. 4장 p.5 의 차폐 점화 어휘 판단 과제와 같은 개념이다.\n\n{| class=\"table\"\n! || 인출 단서 || [[점화]]\n|-\n| 의식 || 의식적으로 써도 됨 (힌트) || '''무의식적·자각 불가'''\n|-\n| 기억 유형 || 외현·암묵 모두 || '''암묵 기억'''\n|-\n| 예 || \"ㅅ으로 시작하는 과일\" → 사과 || '병원'을 본 뒤 '약국'을 더 빨리 알아봄\n|}\n\n== 단서를 쓰는 다른 곳 ==\n\n{| class=\"table\"\n! 개념 || 단서의 역할 || 문서\n|-\n| 단서 회상 과제 || 단서를 주고 떠올리게 함 || [[회상]]\n|-\n| 기억술 || \"단서의 제공은 특정 기억 인출을 촉진\" (p.20) || [[6장 기억|기억술]]\n|-\n| 위계 구성 || 범주가 인출 효율 증가 (p.21) || [[6장 기억|위계 구성]]\n|-\n| 기억 증진법 || 내용 간 연합을 형성하여 '''인출 단서망''' 구성 (p.41) || [[6장 기억|기억 증진법]]\n|}\n\n{exam}\n(🎙 9/29, 5장) 교수는 학습 상황과 기억이 연합된다는 내용을 \"다음 주 기억 챕터에서 한 번 더 다룰 것\"이라고 예고했다 → p.30–31 인출 단서·맥락/상태 의존 기억 ⭐.\n{/exam}\n\n{warn}\n\"최선의 인출 단서는 '''인출할 때''' 새로 만든 연상\" ✘ → '''부호화할 때''' 형성된 연합이다.\n{/warn}\n\n{quiz}\n\"기억의 인출 과정을 용이하게 하는 추가 자극\"의 명칭은? 최선의 그것은 언제 형성된 연합인가?\n{/quiz}\n{answer}\n'''인출 단서'''. 최선은 '''부호화할 때''' 형성된 연합(환경·맥락·정서).\n{/answer}\n\n== 관련 문서 ==\n* [[부호화 명세성 원리]] · [[맥락 의존 기억과 상태 의존 기억]] · [[점화]]\n* [[회상]](단서 회상) · [[6장 기억]]\n\n근거: 6장 p.30"
 },
 "부호화 명세성 원리": {
  "title": "부호화 명세성 원리 (Encoding Specificity Principle)",
  "category": [
   "6장 기억",
   "이론"
  ],
  "body": "'''부호화 명세성 원리'''(Encoding Specificity Principle)는 '''특정 기억에 국한된 단서와 맥락이 그 기억의 회상에 가장 효과적'''이라는 생각이다. 쉽게 말해, '''외울 때 함께 있던 것이 꺼낼 때 최고의 열쇠'''다. p.30 의 \"최선의 인출 단서는 부호화할 때 형성된 연합\"을 원리로 정리한 것이고, [[맥락 의존 기억과 상태 의존 기억]]이 그 구체적인 두 사례다. 슬라이드 출처 표기는 \"Godden & Baddely, 1945\"인데 '''슬라이드 오기'''다 — 실제 출처는 '''Godden & Baddeley, 1975'''.\n\n{def}\n'''설명''': 특정 기억에 국한된 단서와 맥락이 기억 회상에 가장 효과적이라는 생각 (6장 p.31)\n'''명칭''': [[부호화 명세성 원리]] (Encoding Specificity Principle)\n{/def}\n\n{def}\n'''설명(사례형)''': 도서관 3층 창가 자리에서만 공부한 학생이 시험 직전 그 자리에 다시 앉아 보니 외운 내용이 술술 떠올랐다. 부호화할 때의 맥락이 가장 좋은 인출 단서라는 이 원리는?\n'''명칭''': [[부호화 명세성 원리]]\n{/def}\n\n{analogy}\n부호화 명세성 원리는 '''열쇠와 자물쇠'''다. 기억을 잠글(부호화) 때 쓴 열쇠는 그 순간의 장소·기분·냄새로 깎여 있다. 나중에 아무 열쇠나 들이밀면 안 열리고, '''잠글 때 쓴 바로 그 열쇠'''(같은 맥락)가 가장 잘 맞는다. \"명세성(specificity)\" = 그 기억 '''전용''' 열쇠라는 뜻.\n{/analogy}\n\n[[img:L6-31.png|6장 p.31 — 맥락 의존 + 상태 의존 기억. 만화 속 두 사람: \"우리가 무엇을 가지고 언쟁을 벌이고 있었는지 기억이 안 나네. 계속 소리 질러봅시다. 다시 기억이 날지도 모를 테니.\"(같은 상태를 재현하면 기억이 돌아온다는 농담)|medium]]\n\n== 원리 → 두 사례 ==\n\n{| class=\"table\"\n! || 부호화 명세성 원리 || [[맥락 의존 기억과 상태 의존 기억|맥락 의존 기억]] || [[맥락 의존 기억과 상태 의존 기억|상태 의존 기억]]\n|-\n| 성격 || '''원리''' (일반 법칙) || 사례: 외부 '''환경''' || 사례: 내적 '''상태·기분'''\n|-\n| 핵심 문장 || 특정 기억에 국한된 단서·맥락이 가장 효과적 || 특정 상황에서 형성된 기억은 유사한 조건에서 더 잘 활성화 || 현재 기분과 일관된 기억을 회상 (기분 부합 기억)\n|-\n| 예 || 외울 때 열쇠 = 꺼낼 때 열쇠 || 공부한 강의실에서 시험 || 슬플 때 슬픈 기억이 떠오름\n|}\n\n{tip}\n공부법으로 바꾸면: '''시험과 비슷한 조건에서 공부하라.''' 시험 시간(화요일 오후 2:30)에, 책상에 앉아, 휴대폰 없이 모의고사를 풀면 부호화 맥락이 실전 맥락과 겹친다. 정리본 노트가 말하는 [[검증 효과|모의고사]]의 부가 효과(\"시험 맥락 정보까지 같이 학습\")가 바로 이것.\n{/tip}\n\n{warn}\n* 부호화 명세성 원리는 '''원리''', 맥락·상태 의존 기억은 그 '''현상'''. 단답형에서 \"특정 기억에 국한된 단서와 맥락이 가장 효과적이라는 '''원리'''\" → 부호화 명세성 원리.\n* 출처 표기: 슬라이드의 \"Godden & Baddely, 1945\"는 '''슬라이드 오기'''다. 1975 가 맞음(Godden & Baddeley, 1975 — 잠수부 수중/지상 학습 실험). 정답으로 외우지 말 것.\n{/warn}\n\n{quiz}\n\"특정 기억에 국한된 단서·맥락이 회상에 가장 효과적이라는 원리\"의 명칭은?\n{/quiz}\n{answer}\n'''부호화 명세성 원리'''(encoding specificity principle). 통합요약 단답형 예상 14번.\n{/answer}\n\n== 관련 문서 ==\n* [[인출 단서]] · [[맥락 의존 기억과 상태 의존 기억]] · [[검증 효과]]\n* [[6장 기억]]\n\n근거: 6장 p.31 (+ p.30)"
 },

   "용어"
  ],
  "body": "'''맥락 의존 기억'''과 '''상태 의존 기억'''은 [[부호화 명세성 원리]]가 실제로 나타나는 두 모습이다. '''특정 상황 혹은 상태에서 형성된 기억은 유사한 조건 속에서 더 잘 활성화'''된다. 외부 '''환경'''(장소·상황)이 같으면 맥락 의존, 내부 '''상태'''(기분)가 같으면 상태 의존. 슬라이드는 상태 의존 기억을 '''기분 부합 기억'''이라고도 부른다.\n\n{def}\n'''설명''': 특정 상황 혹은 상태에서 형성된 기억은 유사한 조건 속에서 더 잘 활성화된다 (6장 p.31)\n'''명칭''': [[맥락 의존 기억과 상태 의존 기억|맥락/상태 의존 기억]] (Context/State-dependent Memory)\n{/def}\n\n== 기분 부합 기억 ==\n{def}\n'''설명''': 현재의 좋은 혹은 나쁜 기분과 일관성을 유지하는 기억을 회상하는 경향 (Gaddy & Ingram, 2014) (6장 p.31)\n'''명칭''': 상태 의존 기억 = [[맥락 의존 기억과 상태 의존 기억|기분 부합 기억]] (Mood-congruent Memory)\n{/def}\n\n{def}\n'''설명(사례형)''': 슬픈 기분일 때 과거의 슬펐던 일들이 더 잘 떠오르는 경향\n'''명칭''': [[맥락 의존 기억과 상태 의존 기억|상태 의존 기억(기분 부합 기억)]]\n{/def}\n\n{analogy}\n맥락 의존 기억은 '''고향 냄새'''다. 할머니 집 골목에 들어서는 순간 잊고 있던 어릴 적 일들이 한꺼번에 떠오른다(같은 장소). 상태 의존 기억은 '''플레이리스트 셔플'''이다. 우울할 때 셔플을 누르면 이상하게 슬픈 노래만 나오는 것 같다 — 기분이 \"지금 기분과 비슷한 노래(기억)\"만 골라 틀어 준다.\n{/analogy}\n\n[[img:L6-31.png|6장 p.31 — 맥락 의존 + 상태 의존 기억. 소리를 지르던 상태를 재현하면 다툼의 이유가 다시 기억날지 모른다는 만화|medium]]\n\n== 맥락 의존 vs 상태 의존 ==\n\n{| class=\"table\"\n! || 맥락 의존 기억 || 상태 의존 기억 (= 기분 부합 기억)\n|-\n| 일치해야 하는 것 || 외부 '''환경·상황''' || 내적 '''상태·기분'''\n|-\n| 예 || 공부한 강의실에서 시험 볼 때 더 잘 기억 || 슬플 때 슬픈 기억, 기쁠 때 기쁜 기억\n|-\n| 출처 (슬라이드) || 부호화 명세성 원리 (슬라이드 표기 \"Godden & Baddely, 1945\" — 슬라이드 오기, 실제 Godden & Baddeley, 1975) || Gaddy & Ingram, 2014\n|-\n| 상위 원리 || [[부호화 명세성 원리]] || [[부호화 명세성 원리]]\n|}\n\n{warn}\nbank 객관식 \"슬픈 기분일 때 과거 슬펐던 일이 더 잘 떠오르는 경향\" 의 오답 보기:\n* '''맥락 의존 기억''' ✘ — 외부 '''환경''' 기준이지 기분 기준이 아님.\n* '''[[점화]]''' ✘ — 무의식적 연합 활성화.\n* '''[[섬광 기억]]''' ✘ — 정서적으로 중대한 '''사건'''의 선명한 기억.\n→ 정답: '''상태 의존 기억(기분 부합 기억)'''.\n{/warn}\n\n{exam}\n(🎙 9/29, 5장) 교수가 \"학습 상황과 기억이 연합되는 것은 다음 주 기억 챕터에서 한 번 더 다룬다\"고 예고. 통합요약 헷갈리는 쌍: '''맥락(환경) vs 상태(기분)'''.\n{/exam}\n\n{quiz}\n시험을 공부했던 강의실에서 그대로 시험을 보면 더 잘 기억나는 현상과, 우울할 때 우울한 기억이 더 잘 떠오르는 현상을 각각 무엇이라 하나?\n{/quiz}\n{answer}\n앞은 '''맥락 의존 기억''', 뒤는 '''상태 의존 기억(기분 부합 기억)'''. 둘을 묶는 원리는 '''부호화 명세성 원리'''.\n{/answer}\n\n== 관련 문서 ==\n* [[부호화 명세성 원리]] · [[인출 단서]] · [[섬광 기억]]\n* [[6장 기억]]\n\n근거: 6장 p.31"
 },
 "계열 위치 효과": {
  "title": "계열 위치 효과 (Serial Position Effect) — 초두 효과·최신 효과",
  "category": [
   "6장 기억",
   "이론"
  ],
  "body": "'''계열 위치 효과'''(Serial Position Effect)는 단어 목록을 순서대로 외운 뒤 회상하면 '''처음'''과 '''마지막''' 부분은 잘 기억하고 '''가운데'''는 잘 잊는 현상이다. 위치별 회상률을 그리면 '''U자 곡선'''이 된다. 앞쪽이 높은 것이 '''초두 효과'''(Primacy Effect), 뒤쪽이 높은 것이 '''최신 효과'''(Recency Effect). 두 효과는 '''원인이 다르다''' — 그게 시험 포인트다.\n\n{def}\n'''설명''': 학습한 목록에서 위치에 따라 회상률이 달라져, 초반 부분과 마지막 부분을 더 잘 기억하는 현상 (초두 효과 + 최신 효과) (6장 p.32)\n'''명칭''': [[계열 위치 효과]] (Serial Position Effect)\n{/def}\n\n{analogy}\n계열 위치 효과는 '''소개팅 자리 열 번'''이다. 첫 번째 사람은 마음의 여유가 있어서 대화를 곱씹을 시간이 많았고 비교 대상도 없었다(초두 효과 — 되뇌기 여유, 간섭 적음). 마지막 사람은 방금 만나서 아직 머릿속에 남아 있다(최신 효과 — 단기 기억). 그런데 일주일 뒤 물어보면? 첫 번째 사람은 여전히 기억나지만, 마지막 사람의 \"방금 본 효과\"는 사라졌다.\n{/analogy}\n\n[[img:L6-32.png|6장 p.32 — 초두 효과와 최신 효과 예시. 가로축 목록에서 단어의 위치(1~12), 세로축 회상한 단어의 비율. 즉시 회상(주황): 마지막 항목들의 회상이 가장 우수(최신 효과). 지연 회상(파랑): 처음에 제시된 항목들만 잘 회상됨(초두 효과)|large]]\n\n[[anim:atkinson_shiffrin|초두 효과는 되뇌기를 거쳐 장기 기억에 들어간 앞쪽 단어, 최신 효과는 아직 단기/작업 기억 상자에 남은 뒤쪽 단어라는 점을 그림 위치로 확인하자]]\n\n== 초두 효과 ==\n{def}\n'''설명''': 학습한 목록 중에서 초반 부분을 더 잘 기억하는 현상. 초반부는 되뇌기를 할 여유가 많고 다른 내용의 간접 영향력이 적기 때문 (6장 p.32)\n'''명칭''': [[계열 위치 효과|초두 효과]] (Primacy Effect)\n{/def}\n\n== 최신 효과 ==\n{def}\n'''설명''': 학습한 목록 중 마지막 부분을 더 잘 기억하는 현상. 단기/작업 기억의 영역에 가까우며, 일정 시간이 지나면 쇠퇴하여 사라짐 (6장 p.32)\n'''명칭''': [[계열 위치 효과|최신 효과]] (Recency Effect)\n{/def}\n\n== 초두 vs 최신 ⭐⭐⭐ ==\n\n{| class=\"table\"\n! || 초두 효과 (Primacy) || 최신 효과 (Recency)\n|-\n| 무엇을 || 목록 '''초반''' || 목록 '''마지막'''\n|-\n| 이유 || '''되뇌기 여유'''가 많음, 다른 내용의 간섭 적음 || 아직 '''단기/작업 기억'''에 남아 있음\n|-\n| 관련 저장고 || 장기 기억 (되뇌기 → 부호화) || [[단기 기억]] / [[작업 기억]]\n|-\n| 시간이 지나면 (지연 회상) || '''유지''' || '''쇠퇴하여 사라짐'''\n|-\n| p.32 그래프 || 지연 회상(파랑)에서도 앞쪽이 높음 || 즉시 회상(주황)에서만 뒤쪽이 높음\n|}\n\n[[sim:serial_position]]\n\n시뮬레이터 `delay` 옵션을 immediate → delayed(30초 암산 후)로 바꿔 보자. 8–10번 위치의 회상 확률만 뚝 떨어지고 1–3번은 그대로다 — '''초두 효과 유지, 최신 효과 소멸'''.\n\n{exam}\nbank 객관식이 정확히 이 장면이다: \"목록 학습 후 30초간 암산을 하게 하고 회상시켰더니 '''마지막 부분 단어의 회상률만''' 크게 떨어졌다. 가장 잘 설명하는 것은?\" → '''최신 효과는 단기/작업 기억에 남은 정보에 의존하므로 일정 시간이 지나면 사라지기 때문'''.\n{/exam}\n\n{warn}\n오답 보기 해부:\n* \"초두 효과는 단기 기억에, 최신 효과는 장기 기억에 의존\" ✘ — '''반대'''.\n* \"최신 효과는 되뇌기 여유가 많아서\" ✘ — 되뇌기 여유는 '''초두''' 효과의 이유.\n* \"둘 다 처리 수준이 얕아서\" ✘ — 슬라이드는 [[처리 수준]]으로 설명하지 않는다.\n{/warn}\n\n{quiz}\n\"학습한 목록 중 마지막 부분을 더 잘 기억하지만, 일정 시간이 지나면 쇠퇴하여 사라지는 현상\"의 명칭은?\n{/quiz}\n{answer}\n'''최신 효과'''(Recency Effect). 초반 부분을 잘 기억하는 것은 '''초두 효과'''. 둘을 합쳐 '''계열 위치 효과'''.\n{/answer}\n\n== 관련 문서 ==\n* [[단기 기억]] · [[앳킨슨-시프린 모형]] · [[피터슨과 피터슨 실험]](되뇌기 차단)\n* [[순행 간섭]](초반부는 다른 내용의 간섭이 적다) · [[6장 기억]]\n\n근거: 6장 p.32"
 },
 "기억상실증": {
  "title": "기억상실증 (Amnesia) — 순행성·역행성",
  "category": [
   "6장 기억",
   "용어"
  ],
  "body": "'''기억상실증'''(Amnesia)은 방향에 따라 두 가지다. '''순행성'''(anterograde)은 '''새로운 의식적 기억을 형성할 수 없는''' 증상이고, '''역행성'''(retrograde)은 '''장기 기억에 저장된 옛 정보를 인출할 수 없는''' 증상이다. 대표 사례는 간질 발작 치료를 위해 '''[[해마]]를 제거'''한 '''환자 H.M.''' — 순행성 기억상실. 그런데 H.M. 같은 사람도 '''절차 기억 같은 [[암묵 기억]]은 형성할 수 있다'''(Xu & Corkin, 2001).\n\n{def}\n'''설명''': 새로운 의식적 기억을 형성할 수 없는 증상 (6장 p.33)\n'''명칭''': [[기억상실증|순행성 기억상실증]] (Anterograde Amnesia)\n{/def}\n\n{def}\n'''설명''': 장기 기억에 저장된 옛 정보를 인출할 수 없는 증상 (6장 p.33)\n'''명칭''': [[기억상실증|역행성 기억상실증]] (Retrograde Amnesia)\n{/def}\n\n{analogy}\n기억을 '''일기장'''으로 보자. '''순행성'''은 '''펜을 잃어버린''' 것 — 지난 일기는 다 읽을 수 있는데 오늘부터 새로 쓸 수가 없다. '''역행성'''은 '''지난 페이지가 찢겨 나간''' 것 — 오늘부터 새로 쓸 수는 있는데 과거가 안 읽힌다. 방향 외우기: '''순'''행성 = 앞으로(미래) 쓰기 불가, '''역'''행성 = 뒤로(과거) 읽기 불가.\n{/analogy}\n\n[[img:L6-33.png|6장 p.33 — 기억의 부호화/인출 과정과 망각. 감각기억 → 작업/단기기억 → 장기 저장소 → 장기기억으로부터 인출, 각 단계에서 정보량(점)이 줄어든다. \"망각은 기억의 부호화 및 인출 과정에서 모두 발생\"|medium]]\n\n== 순행성 vs 역행성 ⭐⭐⭐ ==\n\n{| class=\"table\"\n! || 순행성 기억상실증 || 역행성 기억상실증\n|-\n| 원어 || anterograde || retrograde\n|-\n| 못 하는 것 || '''새''' 의식적 기억 '''형성''' || '''옛''' 정보 '''인출'''\n|-\n| 문제가 생긴 과정 || [[앳킨슨-시프린 모형|부호화]] (새 정보를 장기 기억에 못 넣음) || [[앳킨슨-시프린 모형|인출]] (저장된 걸 못 꺼냄)\n|-\n| 사례 || '''환자 H.M.''' (간질 → 해마 제거), 영화 「메멘토」 || 영화 「제이슨 본」\n|-\n| 암묵 기억 || 형성 '''가능''' (Xu & Corkin, 2001) || —\n|}\n\n{exam}\n(🎙 9/8, 2장 해마 파트 2부 15:08–18:59) 교수가 해마 손상에 따른 기억 상실 두 유형을 영화로 설명했다 — '''역행성 = 「제이슨 본」'''(손상·충격 '''이전''' 기억을 못 떠올림), '''순행성 = 「메멘토」'''(손상 '''이후''' 새 기억 형성 불가). 그리고 \"빈도상 '''순행성이 더 일반적'''\". 6장 p.33 에서 같은 내용이 슬라이드 정의로 다시 나온다.\n{/exam}\n\n== 환자 H.M. ==\n{def}\n'''설명''': 간질 발작을 치료하기 위해 해마를 제거한 뒤 새로운 의식적 기억을 형성하지 못하게 된 환자 (순행성 기억상실증의 대표 사례) (6장 p.33)\n'''명칭''': [[기억상실증|환자 H.M.]]\n{/def}\n\n{warn}\nbank 객관식 \"기억상실증에 대한 설명으로 '''옳지 않은''' 것\"의 정답 보기: \"H.M.처럼 외현 기억을 형성하지 못하는 사람은 '''절차 기억 같은 암묵 기억도 전혀 형성할 수 없다'''\" → ✘. 외현 기억을 못 만들어도 암묵 기억은 만들 수 있다. 해마는 [[외현 기억]] 형성 담당이고, 절차 기억은 기저 신경절·[[소뇌]] 담당이기 때문.\n{/warn}\n\n{warn}\n'''이름이 비슷한 짝 혼동''': 순행/역행 '''간섭'''([[순행 간섭]] 옛→새 방해, [[역행 간섭]] 새→옛 방해)은 '''건강한 사람'''의 인출 실패이고, 순행성/역행성 '''기억상실증'''은 '''뇌 손상'''으로 인한 증상이다. 방향 감각은 같다 — \"순\"은 앞(새 것)이 피해, \"역\"은 뒤(옛 것)가 피해.\n{/warn}\n\n{quiz}\n\"해마 제거 수술 후 새로운 의식적 기억을 형성하지 못하는 증상\"의 명칭은?\n{/quiz}\n{answer}\n'''순행성 기억상실증'''. 대표 사례 환자 H.M. 통합요약 단답형 예상 18번.\n{/answer}\n\n== 관련 문서 ==\n* [[해마]] · [[암묵 기억]] · [[외현 기억]]\n* [[순행 간섭]] · [[역행 간섭]] · [[6장 기억]](망각의 발생 시점)\n\n근거: 6장 p.33; 2장 p.24 (🎙 9/8)"
 },
 "순행 간섭": {
  "title": "순행 간섭 (Proactive Interference)",
  "category": [
   "6장 기억",
   "용어"
  ],
  "body": "'''순행 간섭'''(Proactive Interference)은 '''기존 학습 내용이 새로운 정보의 회상을 방해'''하는 현상이다. 먼저 배운 것(옛)이 '''앞에서(pro-)''' 끼어들어 나중 것(새)을 막는다. 망각의 세 원인 중 '''인출 실패'''의 한 형태이고, 반대 방향은 [[역행 간섭]]이다. 간섭은 기억의 내용을 정리하는 과정에서 발생하는 '''옛 정보와 새 정보 간의 상호작용'''이다.\n\n{def}\n'''설명''': 기존 학습 내용이 새로운 정보의 회상을 방해하는 현상 (6장 p.36)\n'''명칭''': [[순행 간섭]] (Proactive Interference)\n{/def}\n\n{def}\n'''설명(사례형)''': 유학을 위해 영어를 배우던 민수는 예전에 배운 일본어 단어가 자꾸 떠올라 새 영어 단어가 잘 외워지지 않았다.\n'''명칭''': [[순행 간섭]]\n{/def}\n\n{analogy}\n순행 간섭은 '''이사 후 옛 집 비밀번호'''다. 새 집 현관 앞에서 손가락이 자꾸 옛 집 비밀번호를 누른다. 먼저 손에 밴 옛 번호(기존 학습)가 새 번호(새 정보)를 꺼내는 길을 막고 있다. 방향 외우기: '''옛 → 새''' 를 방해하면 '''순'''서대로 = 순행.\n{/analogy}\n\n[[img:L6-36.png|6장 p.36 — 순행 간섭과 역행 간섭. 아래 (b) Proactive interference: Study history(older) → Study psychology(newer) → Take psychology test 에서 옛 history 공부가 앞으로 화살표를 그으며 새 psychology 회상을 ✘ 로 막는다|medium]]\n\n[[anim:interference|①번 장면에서 옛 일본어 단어가 앞에서 끼어들어 새 영어 단어를 막는 화살표 방향(→)을 보고, ②번 역행 간섭의 화살표(←)와 비교하자]]\n\n== 순행 간섭 vs 역행 간섭 ⭐⭐⭐ ==\n\n{| class=\"table\"\n! || 순행 간섭 (Proactive) || [[역행 간섭]] (Retroactive)\n|-\n| 누가 방해하나 || '''옛''' 학습 || '''새''' 학습\n|-\n| 누가 피해 보나 || '''새''' 정보 회상 || '''옛''' 정보 회상\n|-\n| 화살표 || 옛 ──▶ 새 (앞으로) || 옛 ◀── 새 (뒤로)\n|-\n| 예 || 일본어 때문에 새 영어 단어가 안 외워짐 (bank) || 새 휴대폰 번호 외운 뒤 옛 번호가 안 떠오름 (bank)\n|-\n| 수면의 효과 || — || 학습 직후 수면 → 역행 간섭 감소 (Jenkins & Dallenbach, 1924)\n|}\n\n<pre class=\"ascii\">\n 순행 간섭:   [옛: 일본어] ───간섭───▶ [새: 영어]  ✘ 영어가 안 떠오름\n 역행 간섭:   [옛: 옛 번호] ◀───간섭─── [새: 새 번호] ✘ 옛 번호가 안 떠오름\n<\/pre>\n\n== 망각의 세 원인 속 위치 ==\n\n{| class=\"table\"\n! 원인 || 무엇이 실패 || 슬라이드\n|-\n| [[6장 기억|부호화 실패]] || 애초에 장기 기억에 못 들어감 || p.34\n|-\n| [[6장 기억|저장 소멸]] || 기억 흔적 자체가 서서히 사라짐 ([[망각 곡선]]) || p.35\n|-\n| [[6장 기억|인출 실패]] || 저장은 됐는데 간섭으로 못 꺼냄 → '''순행 간섭''' · [[역행 간섭]] || p.36–37\n|}\n\n{warn}\nbank 객관식(일본어 → 영어) 오답 보기:\n* [[재응고화]] ✘ — 인출 직후 취약해진 기억이 재부호화되어 다시 저장되는 과정.\n* 저장 소멸 ✘ — 흔적 자체가 사라지는 것. 간섭과 다름.\n* 부호화 실패 ✘ — 애초에 장기 기억으로 못 들어간 경우.\n{/warn}\n\n{tip}\np.41 기억 증진법: \"순행 간섭과 역행 간섭의 최소화 — 서로 간섭할 가능성이 큰 주제를 병행하지 말기(비슷한 테마의 학습 내용).\" 시험 기간에 [[순행 간섭]]·[[역행 간섭]] 둘 다 줄이려면 '''심리학 다음에 사회학''' 말고 '''심리학 다음에 물리'''를 공부하자.\n{/tip}\n\n{quiz}\n\"기존 학습 내용이 새로운 정보의 회상을 방해하는 현상\"의 명칭은?\n{/quiz}\n{answer}\n'''순행 간섭'''(proactive interference). 새 학습이 옛 정보를 방해하면 '''역행 간섭'''.\n{/answer}\n\n== 관련 문서 ==\n* [[역행 간섭]] · [[기억상실증]](순행성 ≠ 순행 간섭)\n* [[망각 곡선]] · [[6장 기억]](망각의 세 원인·기억 증진법)\n\n근거: 6장 p.36 (+ p.41)"
 },
 "역행 간섭": {
  "title": "역행 간섭 (Retroactive Interference)",
  "category": [
   "6장 기억",
   "용어"
  ],
  "body": "'''역행 간섭'''(Retroactive Interference)은 '''새로운 학습이 기존 정보의 회상을 방해'''하는 현상이다. 나중에 배운 것(새)이 '''거슬러 올라가(retro-)''' 먼저 것(옛)을 막는다. '''bank 단답형 정답'''이다. 이 현상의 대표 증거가 '''Jenkins & Dallenbach(1924)''' 수면 실험 — 학습 직후 바로 잠든 집단이 깨어 있던 집단보다 더 잘 기억했다. 잠자는 동안에는 '''새 정보가 들어오지 않아''' 역행 간섭이 생길 소지가 낮기 때문이다.\n\n{def}\n'''설명''': 새로운 학습이 기존 정보의 회상을 방해하는 현상 (6장 p.36)\n'''명칭''': [[역행 간섭]] (Retroactive Interference)\n{/def}\n\n{def}\n'''설명(사례형)''': 영희는 새 휴대전화 번호를 외운 뒤부터, 예전에 잘 알던 옛 번호가 도무지 떠오르지 않게 되었다.\n'''명칭''': [[역행 간섭]]\n{/def}\n\n{analogy}\n역행 간섭은 '''화이트보드 덧쓰기'''다. 어제 쓴 내용(옛) 위에 오늘 새 내용(새)을 겹쳐 쓰면, 어제 내용을 읽으려 할 때 오늘 글씨가 가린다. 그런데 어제 쓰고 바로 '''회의실 문을 잠가 버리면'''(수면) 아무도 덧쓰지 못해 어제 내용이 깨끗이 남는다 — Jenkins & Dallenbach 가 본 게 이것.\n{/analogy}\n\n[[img:L6-36.png|6장 p.36 — 위 (a) Retroactive interference: Study psychology(older) → Study history(newer) → Take psychology test 에서 새 history 공부가 뒤로 화살표를 그으며 옛 psychology 회상을 ✘ 로 막는다|medium]]\n\n[[anim:interference|②번 장면의 '뒤에서 거슬러 오는' 화살표(←)와 ③번 수면 집단 vs 각성 집단 막대를 보고, 왜 잠이 역행 간섭을 막는지 한 문장으로 말해 보자]]\n\n== Jenkins & Dallenbach (1924) ==\n\n{| class=\"table\"\n! 실험 카드 || \n|-\n| 연구자(연도) || Jenkins & Dallenbach (1924)\n|-\n| 질문 || 망각은 단지 시간이 지나 흔적이 사라지는 것뿐인가?\n|-\n| 절차 || 철자를 학습한 뒤 ① 즉시 '''수면'''을 취한 집단 ② 깨어 있던('''기상 후''') 집단의 회상률을 학습 후 경과 시간(그래프 가로축 1~8)에 따라 비교\n|-\n| 결과 || 수면 집단의 회상률이 '''유의미하게 높음''' (그래프: 취침 후 ≈ 55% 근처 유지, 기상 후는 계속 하락)\n|-\n| 결론 || 수면 시 추가 정보의 유입이 없어 '''역행 간섭''' 발생 소지가 낮다 → 망각은 '''소멸뿐 아니라 새 정보에 의한 간섭·억제의 결과'''\n|-\n| 함정 || 이 실험은 '''역행''' 간섭 감소의 증거. 순행 간섭이 아님. 또 수면의 \"응고화 지원\"(Peigneux)과는 다른 설명\n|}\n\n<pre class=\"ascii\">\n 학습 ──▶ [ 수면 ]  (새 정보 유입 ✘) ──▶ 회상률 높게 유지\n 학습 ──▶ [ 깨어 있음 ] 새 정보 계속 유입 ──간섭──▶ 회상률 계속 하락\n<\/pre>\n\n[[img:L6-37.png|6장 p.37 — 수면 직전에 제시된 정보의 역행 간섭 차이(Jenkins & Dallenbach, 1924). 가로축 철자 학습 후 경과 시간(1~8), 빨강 '취침 후'는 약 55% 근처에서 유지(\"간섭이 없을 때 회상이 더 우수하다\"), 파랑 '기상 후'는 계속 떨어진다|medium]]\n\n== 순행 vs 역행 ==\n\n{| class=\"table\"\n! || [[순행 간섭]] || 역행 간섭\n|-\n| 방해 방향 || '''옛 → 새''' || '''새 → 옛'''\n|-\n| 피해자 || 새 정보 회상 || 옛 정보 회상\n|-\n| 예 || 일본어 때문에 영어 단어가 안 외워짐 || 새 번호 외운 뒤 옛 번호가 안 떠오름\n|-\n| 줄이는 법 || 비슷한 주제 병행 금지 (p.41) || 학습 직후 수면 (p.37) + 비슷한 주제 병행 금지\n|}\n\n{exam}\n* bank 단답형 정답 = '''역행 간섭'''(허용: 역행간섭, retroactive interference). 통합요약 단답형 예상 15번.\n* 수면 관련 함정 두 개: 수면 → '''역행 간섭 감소'''(Jenkins & Dallenbach) / 수면 → '''응고화 지원'''([[기억 응고화]], Peigneux; 수면 부족은 응고화 방해, Lo). 둘 다 맞는 말이지만 \"Jenkins & Dallenbach 가 보여 준 것\" 은 '''역행 간섭'''.\n{/exam}\n\n{quiz}\n학습 직후 잠을 잔 집단이 깨어 있던 집단보다 회상률이 높았다. 이 결과는 어떤 간섭이 줄었기 때문이며, 그 이유는?\n{/quiz}\n{answer}\n'''역행 간섭'''. 수면 중에는 '''추가 정보의 유입이 없어''' 새 학습이 옛 정보를 방해할 일이 적다. (Jenkins & Dallenbach, 1924)\n{/answer}\n\n== 관련 문서 ==\n* [[순행 간섭]] · [[기억 응고화]](수면의 다른 이점) · [[수면과 꿈]]\n* [[망각 곡선]] · [[6장 기억]]\n\n근거: 6장 p.36–37"
 },
 "재응고화": {
  "title": "재응고화 (Reconsolidation)",
  "category": [
   "6장 기억",
   "용어"
  ],
  "body": "'''재응고화'''(Reconsolidation)는 '''과거에 저장한 기억이 인출 후에 다시 저장되는 과정'''이다. 기억은 꺼낼 때마다 잠깐 '''녹았다가 다시 굳는다'''. 문제는 인출 직후의 기억이 '''매우 취약한 상태'''라서 '''변형되기 쉽다'''는 것 — 인출될 때마다 원래의 기억은 '''조금씩 수정된 기억으로 대치될 가능성이 높다'''. 그래서 슬라이드는 이것을 '''\"기억 구성 오류\"'''로 분류하고, '''소문이 와전되는 이유'''와 '''목격자 진술의 신빙성 문제'''를 예로 든다.\n\n{def}\n'''설명''': 과거에 저장한 기억이 인출 후에 다시 저장되는 과정. 인출 직후의 기억은 매우 취약하여 변형되기 쉽다 (6장 p.34, p.38)\n'''명칭''': [[재응고화]] (Reconsolidation)\n{/def}\n\n{def}\n'''설명(사례형)''': 친구들 사이에 같은 이야기가 여러 번 전해질수록 내용이 조금씩 부풀려지고, 처음 이야기한 사람조차 바뀐 버전을 진짜로 기억하게 되었다. 인출 후 다시 저장되는 과정에서 기억이 변형되는 이 현상은?\n'''명칭''': [[재응고화]]\n{/def}\n\n{analogy}\n재응고화는 '''구글 문서의 \"편집 모드\"'''다. 저장된 문서(장기 기억)를 열면(인출) 자동으로 편집 모드가 된다. 읽기만 하려고 열었는데 그 사이 누군가 댓글로 \"이거 '충돌'이었지?\"(오정보)라고 달면, 그 수정이 '''자동 저장'''되어 버린다. 다음에 열 때는 수정본이 원본인 척 뜬다. '''열 때마다 버전이 바뀐다''' — 그래서 \"확신\"은 \"정확\"이 아니다.\n{/analogy}\n\n[[img:L6-38.png|6장 p.38 — 재응고화의 과정(인출과 부호화의 반복). 외부 사건 → 감각기억 → (주의) → 작업/단기기억 → 부호화 → 장기기억, 그리고 장기기억에서 인출된 기억이 다시 작업/단기기억을 거쳐 재부호화되는 고리가 두 번 반복된다|medium]]\n\n[[anim:misinformation_effect|원본 기억 아이콘이 인출 직후 '녹았다가' 질문 속 정보로 조금 바뀐 채 다시 저장되는 순간을 보자 — 그게 재응고화다]]\n\n<pre class=\"ascii\">\n 장기 기억(원본 v1) ──인출──▶ 작업 기억 (취약·변형 쉬움) ──재부호화──▶ 장기 기억(v2)\n          ▲                         ▲ 오정보·상상·남의 말                         │\n          └─────────────────────────────────── 다음 인출 ─────────────────────────┘\n   인출될 때마다 v1 → v2 → v3 … 조금씩 수정된 기억으로 대치\n<\/pre>\n\n== 응고화 vs 재응고화 ==\n\n{| class=\"table\"\n! || [[기억 응고화]] || 재응고화\n|-\n| 언제 || '''처음''' 저장 || '''인출 후''' 다시 저장\n|-\n| 상태 || 무른 기억을 강건하게 || 인출 직후 '''매우 취약''', 변형 쉬움\n|-\n| 결과 || 안정화 (수면이 지원) || 조금씩 수정된 기억으로 '''대치'''\n|-\n| 관련 || [[해마]], [[간격두기 효과]] || [[오정보 효과]], 소문 와전, 목격자 진술\n|}\n\n== p.34 와 p.38 ==\n\n* p.34 (망각): \"재응고화와 망각 — 인출 직후의 기억은 매우 취약한 상태이며, '''재부호화'''를 거쳐서 장기 기억에 다시 저장.\"\n* p.38 (기억 구성 오류): 정의 + 취약·변형 + 대치 가능성 + 소문 와전·목격자 진술.\n\n{warn}\n* \"재응고화 = 처음 학습한 내용을 단단히 만드는 과정\" ✘ → 그건 '''응고화'''. '''재'''가 붙으면 '''인출 후'''.\n* bank: 일본어 → 영어 간섭 사례에 \"재응고화\" 보기는 ✘ (그건 [[순행 간섭]]).\n{/warn}\n\n{quiz}\n\"인출 후 기억이 다시 저장되는 과정에서 변형되기 쉬운 현상\"의 명칭은?\n{/quiz}\n{answer}\n'''재응고화'''(reconsolidation). 통합요약 단답형 예상 16번.\n{/answer}\n\n== 관련 문서 ==\n* [[오정보 효과]] · [[기억 응고화]] · [[출처 기억상실]]\n* [[섬광 기억]](되뇌기 → 확신↑) · [[6장 기억]]\n\n근거: 6장 p.34, p.38"
 },
 "오정보 효과": {
  "title": "오정보 효과 (Misinformation Effect) — 로프터스 & 파머 (Loftus & Palmer, 1974)",
  "category": [
   "6장 기억",
   "이론"
  ],
  "body": "'''오정보 효과'''(Misinformation Effect)는 '''사실에 대한 잘못된 정보를 제공할 때, 원래 자신이 목격한 것과 다름에도 맞다고 보고하는 현상'''이다(Anglada-Tort et al., 2019). 대표 연구가 '''Loftus & Palmer(1974)''' — 같은 교통사고 장면을 보여 주고도 '''질문의 방식'''(\"접촉 사고\" vs \"충돌 사고\")에 따라 참가자의 보고 양상이 달라졌다. '''bank 단답형 정답'''이고, 6장 마지막 \"기억 구성 오류\" 묶음([[재응고화]] · 오정보 효과 · 상상력 효과 · [[출처 기억상실]])의 중심이다.\n\n{def}\n'''설명''': 사실에 대한 잘못된 정보를 제공할 때, 원래 자신이 목격한 것과 다름에도 맞다고 보고하는 현상 (6장 p.39)\n'''명칭''': [[오정보 효과]] (Misinformation Effect)\n{/def}\n\n{def}\n'''설명(사례형)''': 교통사고 영상을 본 참가자들에게 두 차가 「충돌했을 때」 속도를 물었더니, 「접촉했을 때」라고 물은 집단보다 더 빠른 속도를 보고했다(Loftus & Palmer, 1974).\n'''명칭''': [[오정보 효과]]\n{/def}\n\n{analogy}\n오정보 효과는 '''사진 보정 앱'''이다. 원본 사진(목격한 장면)을 열었는데, 누군가 \"여기 좀 더 찌그러졌었지?\"라며 필터(질문 속 단어)를 살짝 씌운다. 저장 버튼을 누르면([[재응고화]]) 필터 씌운 버전이 원본 자리를 차지한다. 나중에 사진첩을 열면 나는 원래부터 차가 그렇게 찌그러져 있었다고 '''확신'''한다.\n{/analogy}\n\n[[img:L6-39.png|6장 p.39 — 기억 구성과 오정보. 유도 질문: \"저렇게 두 대가 정면으로 충돌했을 때, 얼마나 빠르게 달리고 있었나요?\" 왼쪽 '실제 사건'(가볍게 부딪힘) → 오른쪽 '기억 구성'(크게 찌그러진 충돌)|large]]\n\n[[anim:misinformation_effect|같은 장면을 본 두 집단에 '접촉' vs '충돌' 질문이 들어간 뒤, 어느 쪽 보고가 더 과장되는지와 원본 기억 아이콘이 어떻게 변하는지 끝까지 보자]]\n\n{| class=\"table\"\n! 실험 카드 || \n|-\n| 연구자(연도) || Loftus & Palmer (1974)\n|-\n| 질문 || 질문의 표현만 바꿔도 목격 기억이 바뀌나?\n|-\n| 절차 || 교통사고 장면 제시 → 집단별로 질문 단어만 다르게: \"'''접촉'''했을 때\" vs \"'''충돌'''했을 때\" 속도는?\n|-\n| 결과 || 사건에 대한 '''질문의 방식에 따라''' 참가자의 보고 양상이 변화 — '충돌' 질문 집단이 더 과장되게 보고\n|-\n| 결론 || 사후에 주어진 (잘못된) 정보가 원래 기억에 섞여 들어간다 = 오정보 효과\n|-\n| 함정 || 슬라이드에 없는 구체 수치(속도 km/h 등)는 외울 필요 없음. 핵심은 '''\"접촉 VS 충돌\"'''\n|}\n\n<pre class=\"ascii\">\n 같은 사고 장면 ─┬─▶ 집단 A: \"두 차가 '접촉'했을 때 속도는?\"  ──▶ 덜 빠르게 보고\n                 └─▶ 집단 B: \"두 차가 '충돌'했을 때 속도는?\"  ──▶ 더 빠르게 보고 (과장)\n                       └ 질문 속 단어(오정보)가 인출·[[재응고화]] 때 기억에 섞임\n<\/pre>\n\n== p.39 의 나머지 ==\n\n* '''절반 정도'''의 사람은 오정보 효과에 취약 (Brewin & Andrews, 2017).\n* 거짓 암시를 줄 경우, '''추후 행동에도''' 영향을 줄 수 있음 (Geraerts et al., 2008).\n* 정리본 노트: 목격자 진술이 물적 증거보다 증명력이 약한 이유.\n\n== 상상력 효과 ==\n{def}\n'''설명''': 잘못된 정보를 기반으로 반복적 상상을 통해 실제로 발생했다고 믿는 현상 (6장 p.40)\n'''명칭''': [[오정보 효과|상상력 효과]] (Imagination Inflation)\n{/def}\n\n오정보 효과와 상상력 효과가 생기는 이유: '''상상하는 뇌 영역과 실제 지각을 하는 뇌 영역이 중첩'''되기 때문(Wade et al., 2018). 뇌 입장에서는 \"생생하게 상상한 것\"과 \"실제로 본 것\"의 흔적이 비슷하다.\n\n== 로프터스 & 파머 ==\n{def}\n'''설명''': 교통사고 장면을 보여 준 뒤 \"접촉\" vs \"충돌\"처럼 질문 표현만 바꿔 목격 보고가 달라지는 것을 보인 연구자들 (1974) (6장 p.39)\n'''명칭''': [[오정보 효과|로프터스 & 파머]] (Loftus & Palmer)\n{/def}\n\n== 기억 구성 오류 4종 비교 ==\n\n{| class=\"table\"\n! 오류 || 무엇이 기억을 바꾸나 || 슬라이드\n|-\n| [[재응고화]] || 인출 후 다시 저장되는 과정 자체 (취약·변형) || p.34, p.38\n|-\n| '''오정보 효과''' || '''외부'''에서 주어진 잘못된 정보 (질문 방식) || p.39\n|-\n| '''상상력 효과''' || '''스스로''' 반복한 상상 || p.40\n|-\n| [[출처 기억상실]] || 정보의 '''출처·시점'''을 잘못 기억 (오귀인) || p.40\n|}\n\n{warn}\n'''오정보(외부 정보 주입) vs 상상력(자기 상상 반복)''' — 통합요약 헷갈리는 쌍. \"질문\", \"유도\", \"남이 알려 준\" 이 보이면 오정보 효과, \"반복적으로 상상\" 이 보이면 상상력 효과.\n{/warn}\n\n{quiz}\n\"질문 방식 등으로 잘못된 정보가 주어질 때 자신이 본 것과 다르게 기억하는 현상\"의 명칭은?\n{/quiz}\n{answer}\n'''오정보 효과'''(misinformation effect). bank SA 정답, 통합요약 단답형 예상 17번.\n{/answer}\n\n== 관련 문서 ==\n* [[재응고화]] · [[출처 기억상실]] · [[말표현 효과]](1장 — 질문 단어가 응답을 바꾼다는 같은 뿌리)\n* [[6장 기억]]\n\n근거: 6장 p.39–40"
 },
 "출처 기억상실": {
  "title": "출처 기억상실 (Source Amnesia)",
  "category": [
   "6장 기억",
   "용어"
  ],
  "body": "'''출처 기억상실'''(Source Amnesia)은 '''정보를 획득한 시점·출처에 대한 잘못된 기억'''이다. 내용은 기억하는데 '''\"그걸 어디서, 언제 알았는지\"'''를 틀리게 기억한다. 슬라이드는 괄호 안에 '''(오귀인)'''이라고 적었다 — 출처를 엉뚱한 곳에 '''잘못 귀속'''시킨다는 뜻. 6장 \"기억 구성 오류\"의 마지막 항목이다.\n\n{def}\n'''설명''': 정보를 획득한 시점, 출처에 대한 잘못된 기억 (오귀인) (6장 p.40)\n'''명칭''': [[출처 기억상실]] (Source Amnesia)\n{/def}\n\n{def}\n'''설명(사례형)''': 민지는 \"기억은 인출할 때마다 바뀐다\"는 내용을 교수님이 수업에서 말씀하신 것으로 확신했지만, 사실은 친구가 보낸 유튜브 영상에서 본 것이었다. 내용은 맞게 기억하지만 출처를 잘못 기억하는 이 현상은?\n'''명칭''': [[출처 기억상실]]\n{/def}\n\n{analogy}\n출처 기억상실은 '''라벨이 떨어진 반찬통'''이다. 냉장고 속 김치(정보)는 그대로 있는데, \"엄마가 담근 것\"이라고 붙여 둔 라벨(출처)이 떨어졌다. 그래서 편의점 김치를 엄마 김치라고 믿고 꺼낸다. '''내용물은 멀쩡, 라벨만 바뀌었다.'''\n{/analogy}\n\n[[img:L6-40.png|6장 p.40 — 기억 구성 오류: 상상력 효과와 출처 기억상실(오귀인). 왼쪽 그림은 p.39 와 같은 '실제 사건 vs 기억 구성' 자동차 사고|medium]]\n\n== 오귀인 ==\n{def}\n'''설명''': 정보를 획득한 시점이나 출처를 잘못된 곳에 귀속시키는 것 — 출처 기억상실의 다른 표현 (6장 p.40)\n'''명칭''': [[출처 기억상실|오귀인]] (Misattribution)\n{/def}\n\n== 기억 구성 오류 비교 ==\n\n{| class=\"table\"\n! 오류 || 틀리는 것 || 원인 || 예\n|-\n| [[재응고화]] || 내용이 조금씩 변형 || 인출 후 다시 저장할 때 취약 || 소문 와전\n|-\n| [[오정보 효과]] || 내용이 외부 정보로 바뀜 || 사후의 잘못된 정보 || \"충돌\" 질문 → 과장 보고\n|-\n| [[오정보 효과|상상력 효과]] || 일어나지 않은 일을 실제로 믿음 || 반복적 상상 || 상상과 지각의 뇌 영역 중첩\n|-\n| '''출처 기억상실''' || 내용은 맞고 '''출처·시점'''이 틀림 || 오귀인 || 친구한테 들은 걸 교수님 말로 기억\n|}\n\n{info}\n출처 기억상실은 [[오정보 효과]]의 연료가 되기도 한다. 사고 후 누군가에게 들은 \"충돌했대\"라는 말을, 나중에는 '''내 눈으로 본 것'''으로 착각하면 — 출처(남의 말)를 잊고 내용(충돌)만 내 목격 기억에 붙인 것이다.\n{/info}\n\n{warn}\n'''기억상실증과 이름만 비슷하다.''' [[기억상실증]](순행성·역행성)은 뇌 손상으로 기억을 만들거나 꺼내지 못하는 '''증상'''이고, 출처 기억상실은 건강한 사람에게도 흔한 '''기억 구성 오류'''다.\n{/warn}\n\n{quiz}\n\"정보를 얻은 시점·출처를 잘못 기억하는 현상\"의 명칭은? 괄호 속 다른 표현은?\n{/quiz}\n{answer}\n'''출처 기억상실'''(source amnesia), 다른 표현 '''오귀인'''. 통합요약 단답형 예상 19번.\n{/answer}\n\n== 관련 문서 ==\n* [[오정보 효과]](상상력 효과) · [[재응고화]] · [[기억상실증]]\n* [[6장 기억]]\n\n근거: 6장 p.40"
 },
 "자주 틀리는 함정 모음": {
  "title": "자주 틀리는 함정 모음",
  "category": [
   "시험 대비",
   "시험"
  ],
  "body": "{warn}⏰ '''시험 24시간 전이라면 이 문서와 [[명칭 암기표]]만 봐라.''' 각 행은 '''✗ 틀리기 쉬운 생각 → ✓ 맞는 것 → 문서''' 형식이다. 출처는 ① 통합요약(`../정리본/중간고사_통합요약.md`) 장별 \"헷갈리는 개념 대비\" 표 전부 ② 모의고사 bank 객관식의 '''오답 보기'''와 해설(\"…라고 생각한 오답\") ③ 교수가 녹음에서 \"헷갈린다\" 고 짚은 것 ④ 알려진 슬라이드 오류 3건이다.{/warn}\n\n{analogy}\n객관식 오답 보기는 '''거울에 비친 글자'''다. 모양은 정답과 똑같은데 좌우만 뒤집혀 있다 — 무선 '''표집'''↔무선 '''할당''', '''순행'''↔'''역행''' 간섭, 좌시야→'''우'''반구↔'''좌'''반구, '''권위적'''↔'''권위주의적'''. 한쪽만 외워 두고 나머지를 \"반대겠지\" 로 추론하면 거울 글자에 그대로 걸린다. 그래서 아래 표는 '''항상 양쪽을 나란히''' 적었다.\n{/analogy}\n\n== 🎯 교수가 직접 \"헷갈린다\" 고 한 다섯 가지 ==\n{exam}\n'''이 다섯 개는 녹음에서 교수가 직접 혼동을 경고했다 — 객관식 함정 1순위.'''\n# '''[[권위적·권위주의적·허용적 양육|권위적(authoritative) vs 권위주의적(authoritarian)]]''' — \"번역 용어가 겹쳐 헷갈리니 구분할 것\". 요구 + '''타협''' = 권위적(자존감↑), 강압 + '''복종''' = 권위주의적(자존감↓). 그리고 양육 방식과 자녀 특성은 '''상관이지 인과가 아니다'''. (🎙 9/15)\n# '''[[게슈탈트 심리학]] = 타고난 [[상향 처리]] 쪽''' — \"많이 헷갈리는 부분이라 깊게 설명\". 얼핏 경험(하향) 같지만 '''내재된 원리'''이고 부분 → 전체로 진행한다. (🎙 9/22)\n# '''[[부적 강화]] ≠ [[처벌]]''' — \"부적\" 은 '''빼 준다''', \"강화\" 는 '''행동이 늘어난다'''. 행동이 늘면 강화, 줄면 처벌. 약물 중독 = 금단 증상 제거에 의한 부적 강화. (🎙 9/29)\n# '''[[소거]] ≠ 제거''' — 소거는 조건 반응을 지우는 게 아니라 '''일시적으로 억압'''하는 것. 증거 = 휴지기 뒤 [[자발적 회복]]. (🎙 9/29)\n# '''[[상관]] ≠ 인과''' — \"굉장히 중요한 사안\". 아이스크림–식중독의 진짜 원인은 [[제3의 변인]](기온). 인과를 검증할 수 있는 건 [[실험법]] 하나뿐. (🎙 9/1)\n{/exam}\n\n== ⚠ 슬라이드 오류 3건 (슬라이드를 그대로 외우면 틀린다) ==\n{warn}\n'''1. 4장 p.25''' — 슬라이드: \"우시야의 입력 정보는 '''우반구'''로\" → 올바른 내용: 우시야 → '''좌반구''', 좌시야 → '''우반구''' (2장 p.29 와 일치). 모의고사 2장 MC10 도 이 방향으로 채점된다. → [[분할 뇌]]\n\n'''2. 6장 p.18''' — PPTX 표기: 단기 기억 용량 \"'''72개'''\" → 올바른 내용: '''7±2개''' (조지 밀러의 매직 넘버 7). 숫자 \"72\" 를 보기에서 보면 의심하자. → [[매직 넘버 7]]\n\n'''3. 5장 p.4 · p.17''' — 슬라이드: \"'''Operational''' Conditioning\" → 올바른 원어: '''Operant Conditioning'''(조작적 조건화). 영어를 쓰는 문항이면 operant. 또 1장의 [[조작적 정의]](operational definition)와 이름이 겹치니 주의. → [[조작적 조건화]]\n{/warn}\n\n== 서막 심리학 이야기 ==\n{|\n! 함정(틀리기 쉬운 생각) || 맞는 것 || 문서\n|-\n| 분트 = 기능주의, 제임스 = 구조주의 || '''분트·티치너 = 구조주의'''(마음은 무엇으로 이루어졌나, 내성법) / '''제임스 = 기능주의'''(마음은 무슨 일을 하나, 다윈의 진화론) || [[구조주의]] · [[기능주의]]\n|-\n| 내성법 = 떠오르는 대로 자유롭게 서술 || 지정된 지침에 따른 '''훈련된 엄격한 자기보고'''. 그래도 자기보고라 신뢰도 한계 || [[내성법]]\n|-\n| 분트 실험: 즉시 누르기 0.2초, 자각 후 0.1초 || '''즉시 약 0.1초, 자각 후 약 0.2초''' → 자각에 추가 과정이 걸린다 = 심적 과정의 계량화 || [[빌헬름 분트]]\n|-\n| 행동주의가 비판한 대상은 정신분석 || 행동주의는 구조주의·기능주의가 '''관찰 불가한 내부 요소'''를 탐구한 것을 비판. 정신분석·행동주의를 \"인간을 제한적으로 본다\" 고 비판한 쪽은 '''인본주의''' || [[행동주의]] · [[인본주의 심리학]]\n|-\n| 두 조건화는 학습 중 일어나는 내적 정보 처리를 밝힌다 || 고전적·조작적 조건화 모두 '''자극과 행동 반응에만''' 중점, 내적 과정엔 관심 없음 (🎙 8/25) || [[행동주의]]\n|-\n| 고전적 조건화 = 행동과 결과의 연합 || 고전적 = '''중립 자극 + 무조건 자극'''(파블로프) / 조작적 = '''행동 + 결과(강화·처벌)'''(스키너) || [[고전적 조건화와 조작적 조건화 비교]]\n|-\n| 장기 기억 = RAM, 감각 기관 = CPU || '''장기 기억 = SSD''', 작업(단기) 기억 = RAM, 감각 기관 = 입력, 뇌 = CPU, 행동 = 출력 || [[컴퓨터 메타포]]\n|-\n| 진화심리학 = 개인차, 행동유전학 = 보편성 || '''진화심리학 = 공통 특성·보편성''' / '''행동유전학 = 유전자·환경 차이로 인한 개인차''' || [[진화심리학]] · [[행동유전학]]\n|-\n| \"개인차에 유전·환경이 어떻게?\" = 진화론 조망 || 그 질문은 '''행동유전학''' 조망. 진화론은 \"특질의 자연선택이 유전자 생존을 어떻게 촉진하나\" || [[이론적 조망]]\n|-\n| 에크만 기본 감정에 불안·수치심도 포함 || 6개뿐: '''기쁨·슬픔·분노·공포·혐오·놀람''' || [[에크만의 기본 감정]]\n|-\n| 몽골어·중국어 색 지각 차이 = 선천성 예시 || 언어(환경)에 따른 차이 = '''후천성''' 예시. 몽골어는 녹·청 세분, 중국어는 통일. 에크만 감정이 '''선천성''' 예시 || [[선천성-후천성 논제]]\n|-\n| 선천성-후천성 논쟁은 한쪽이 이겼다 || 결론은 '''둘 다 중요''' (🎙 8/25). 쌍둥이 연구도 같은 결론 || [[쌍둥이 연구]]\n|-\n| 사회문화적 수준 = 개인 내면의 기제 || 사회문화적 = 개인 '''외부'''(타인 기대·집단·매체) / 심리적 = 개인 '''내면'''(정서·인지·기대) || [[분석 수준]]\n|-\n| 한 행동은 가장 중요한 한 요인으로 설명된다 || \"어느 하나의 요인만으로는 설명하지 않는다\" — 가장 중요한 포인트 (🎙 8/25) || [[생물심리사회적 접근법]]\n|-\n| 분노의 \"무의식적 적대감\" = 인지심리학, \"상황 해석\" = 정신역동 || 무의식적 적대감 = '''정신역동''', 상황 해석 = '''인지심리학''', 문화별 표현 = '''사회문화''', Fight or Flight = '''진화론''' || [[이론적 조망]]\n|-\n| 상담심리학·임상심리학도 약물 치료 || 약물 치료를 병행하는 것은 '''정신의학'''뿐 || [[심리학의 하위 분야]]\n|}\n\n== 1장 심리과학을 비판적으로 생각하기 ==\n{|\n! 함정(틀리기 쉬운 생각) || 맞는 것 || 문서\n|-\n| 기술적 방법이나 상관 연구로도 원인을 밝힐 수 있다 || 기술적 방법 = 현상 기술, 상관 = 예측. '''인과는 실험만''' — \"조작·통제가 가능한 방법은 실험법 딱 하나\" (🎙 9/1) || [[연구 방법 비교]] · [[실험법]]\n|-\n| 상관 연구도 참가자에게 처치를 가한다 || 기술적 방법·상관 연구는 '''처치 없음'''. 처치(독립변인)가 있는 건 실험 || [[연구 방법 비교]]\n|-\n| 실험의 약점 = 인과를 검증 못 함 || 실험의 약점은 '''일반화 어려움·윤리적 제약'''. 사례 연구 = 일반화 곤란·사례가 오도, 사회조사 = 응답 위장·말표현 효과 || [[연구 방법 비교]]\n|-\n| 상관이 높으면 한쪽이 원인이다 || '''상관 ≠ 인과'''. 두 변인을 함께 움직이는 제3의 변인(기온)이 있을 수 있다 || [[상관]] · [[제3의 변인]]\n|-\n| 무선 표집으로 뽑았으면 그 상관으로 인과를 확정할 수 있다 || 인과 검증은 표집이 아니라 '''처치와 통제(실험)''' 로 || [[무선 표집]]\n|-\n| 표본만 크면 대표성은 보장된다 || \"표본 수가 큰 것보다 '''대표성'''을 띠는 표본이 더 중요\" (🎙 9/1) || [[무선 표집]]\n|-\n| 무선 표집 = 참가자를 조건에 무작위 배정 || 무선 '''표집''' = 모집단 → 표본(대표성) / 무선 '''할당''' = 뽑힌 참가자 → 실험·통제 조건(개인차 최소화) || [[무선 할당]]\n|-\n| 착각 상관 = 평균으로의 회귀 || 착각 상관 = '''없는 관계를 있다고''' 지각 / 평균으로의 회귀 = '''극단 뒤 평균 쪽으로 복귀'''(비난 뒤 호전) / 후견 편향 = 결과 안 뒤 \"예측할 수 있었다\" (콜럼버스의 달걀) || [[착각 상관]] · [[평균으로의 회귀]] · [[후견 편향]]\n|-\n| 비난 뒤 성적이 좋아졌으니 비난이 효과 있다 || 대패는 극단값 → 다음엔 '''평균으로 회귀'''. 비난과 무관할 수 있다 || [[평균으로의 회귀]]\n|-\n| 과신 = 후견 편향 || 과신 = 결과를 '''모르는 상태에서''' 실제보다 더 안다고 믿음 / 후견 편향 = 결과를 '''안 뒤에''' 알았다고 믿음 || [[과신]]\n|-\n| 전문가는 지식이 많아 과신하지 않는다 / 슈퍼 예측자가 다수 || 테틀록: '''80% 확신 → 적중 40% 이하'''. 슈퍼 예측자는 '''극소수'''(약 2%) || [[과신]]\n|-\n| 이론 = 검증 가능한 개별 예측, 가설 = 통합적 설명 || '''이론''' = 관찰을 체제화하고 예측하는 통합적 설명 / '''가설''' = 이론에서 도출한 검증 가능한 예측 || [[이론]] · [[가설]]\n|-\n| 가설이 지지되지 않으면 이론을 반드시 폐기 || 결과는 기존 이론을 '''지지·반박·확장'''한다 || [[이론]]\n|-\n| 조작적 정의 = 조작적 조건화와 같은 \"조작\" || 조작적 정의(operational definition) = 개념을 '''측정 가능한 형태'''로 진술. 5장의 조작적 조건화(operant)와 '''무관''' || [[조작적 정의]]\n|-\n| 가짜약 조건 = 처치를 안 받았다고 알려 주는 조건 || 처치를 '''받았다고 착각하게''' 하는 조건 → \"처치 인지\" 효과와 실제 처치 효과를 분리 || [[가짜약 효과]]\n|-\n| 참가자만 조건을 모르면 이중 은폐 || 그건 단일 은폐. '''이중 은폐 = 참가자와 실험자 모두''' 모름 || [[이중 은폐]]\n|-\n| 지하철 사고를 겪고 지하철이 더 위험하다고 믿음 = 반복 / 집단 정체성 || '''강력한 사례의 가용성'''(→ 가용성 어림법). 반복 = 같은 말을 되풀이해 들어 믿음, 집단 정체성 = 같은 편끼리 → 확증 편향 || [[탈진실의 취약성 요인]] · [[가용성 어림법]]\n|-\n| IRB 승인을 기다리며 참가자를 미리 모집해도 된다 || 승인 '''전''' 모집은 위반. 승인 인원 초과도 안 되고 증원은 '''변경 심의'''. 보상은 금액과 '''재원'''까지 || [[기관 생명 윤리 위원회]]\n|-\n| 참가자가 피곤하다고 해도 자료를 위해 끝까지 진행 || 그만두고 싶다고 하면 이유 불문 '''즉시 중단''' (🎙 9/1) || [[고지된 동의]] · [[디브리핑]]\n|-\n| 통계(평균·표준편차·p-value)도 공부해야 한다 || 1장은 '''p.29(IRB)까지'''. p.30–34 통계는 범위 밖 — 보기로도 안 나온다 || [[시험 정보]]\n|}\n\n== 2장 마음의 생물학과 의식 ==\n{|\n! 함정(틀리기 쉬운 생각) || 맞는 것 || 문서\n|-\n| 자극이 강하면 활동 전위가 더 크다 || 크기는 '''항상 같다'''(실무율). 강한 자극 = '''발화율↑''' (🎙 9/8) || [[활동 전위]] · [[실무율]]\n|-\n| 안정 전위에서 내부 +, 외부 − / 활동 전위 직후 바로 재발화 || 안정 전위는 '''외부 +, 내부 −'''. 직후엔 '''불응기''' || [[활동 전위]]\n|-\n| 시상은 후각을 포함한 모든 감각의 관문 || '''후각만 제외''' (🎙 9/8) || [[시상]]\n|-\n| 시상은 변연계의 일부 || 변연계 = '''시상하부·뇌하수체·편도체·해마'''. 시상(감각 관문)은 아님 — 이름이 비슷한 시상하부와 혼동 주의 || [[변연계]]\n|-\n| 공포를 못 느낌 = 해마 손상, 새 기억 못 함 = 편도체 손상 || 공포 = '''편도체'''(환자 S.M), 새 의식적 기억 = '''해마''' || [[편도체]] · [[해마]]\n|-\n| 연수 = 움직임·수면, 뇌교 = 심장·호흡 || '''연수 = 심장·호흡''', 뇌교 = 움직임·수면 || [[뇌간]]\n|-\n| 소뇌 = 심장·호흡 || 소뇌 = '''정교한 운동·협응·비언어적 학습''' || [[소뇌]]\n|-\n| 체신경계가 분비선·내장 근육을 제어 || 그건 '''자율 신경계'''. 체신경계 = 감각 수용 + 골격근 자발 제어 || [[신경계]]\n|-\n| 교감 = 이완, 부교감 = 각성 || '''교감 = 각성'''(심박↑·소화 억제), 부교감 = 이완 || [[신경계]]\n|-\n| 글루타메이트 = 억제성 || 글루타메이트 = '''흥분성''', '''GABA = 억제성''' || [[신경전달물질]]\n|-\n| 알츠하이머 = 도파민 / 파킨슨 = 세로토닌 || 알츠하이머 = '''ACh''' 뉴런 퇴화, 파킨슨 = '''도파민 부족'''(과잉 = 조현병), 우울증 = '''세로토닌 부족''' || [[도파민]] · [[세로토닌]]\n|-\n| 다발성 경화증 = 신경전달물질 문제 || '''수초''' 퇴화·손상 || [[뉴런]]\n|-\n| EEG는 공간 해상도가 높다 || EEG/ERP = '''시간↑ 공간↓''', MEG = 둘 다 높음, fMRI = 공간 매우 높음 || [[뇌전도]] · [[사건 관련 전위]]\n|-\n| MRI로 신경 활동을 촬영한다 || MRI = '''구조''', 활동(BOLD) = '''fMRI''' || [[fMRI]]\n|-\n| fMRI = 백질, DSI = 회질 || '''fMRI = 회질 BOLD''', '''DSI = 백질''' 물 분자 확산(연결 구조) || [[확산 스펙트럼 영상]]\n|-\n| PET = 자기장으로 원자 재정렬 || PET = '''방사성 포도당 → 감마선'''. 자기장 재정렬은 MRI || [[2장 마음의 생물학과 의식]]\n|-\n| 손상법은 상관만 보여 준다 || '''가장 오래된''' 방법이며 '''인과 추론이 가능''' (🎙 9/8) || [[손상법]]\n|-\n| 연합 영역은 관찰 가능한 반응을 낸다 / 전두엽에만 있다 || 가장 중요한 특징 = '''관찰 가능한 반응을 산출하지 않음''' (🎙 9/8). 전 영역에 존재 || [[연합 영역]]\n|-\n| 호문쿨루스 = 연합 영역 지도 || '''운동·체감각 피질'''의 담당 크기 지도 || [[대뇌 피질]]\n|-\n| 분할 뇌: 좌시야 단어를 말로 보고 || 말로 보고하는 건 '''우시야'''(→ 좌반구 언어). 좌시야(→ 우반구)는 왼손으로 가리킴 || [[분할 뇌]]\n|-\n| 변화맹과 부주의적 맹시는 별개 현상 || 변화맹은 부주의적 맹시의 '''한 유형''' (장면 변화 미지각 vs 주의 안 준 자극 미지각) || [[변화맹]] · [[부주의적 맹시]]\n|-\n| 이중 처리: 의식 = 병렬, 무의식 = 계열 || 의식적 경로 = '''계열·신중''', 무의식적 경로 = '''병렬·자동''' || [[이중 처리]]\n|-\n| REM 수면엔 근육 신호 차단 → 심장·호흡도 느려짐 || 심장 박동·호흡은 오히려 '''빨라짐'''. 겉으로 이완, 안으로 각성. 파형은 N1과 유사 || [[수면과 꿈]]\n|-\n| 꿈 = 기억 공고화는 프로이트, 표출·잠재 내용은 정보 처리 이론 || 표출·잠재 내용 = '''프로이트 소망충족''', 사건 분류·기억 공고화 = '''정보 처리''', 무작위 활성화를 이야기로 = '''활성화-종합''' || [[수면과 꿈]] · [[프로이트]]\n|-\n| 역행성 기억상실 = 「메멘토」 || 「메멘토」 = '''순행성'''(새 기억 형성 불가), 「제이슨 본」 = '''역행성'''(옛 기억 인출 불가) || [[기억상실증]]\n|}\n\n== 3장 일생에 걸친 발달 ==\n{|\n! 함정(틀리기 쉬운 생각) || 맞는 것 || 문서\n|-\n| 횡단 연구 = 같은 집단을 시간에 따라 추적 || 횡단 = '''다른 집단을 동시에''' 비교 / 종단 = '''같은 집단을 장기 추적''' || [[횡단 연구]] · [[종단 연구]]\n|-\n| 종단 연구는 몇 년 단위만, 중도 이탈 걱정 없음 || '''며칠 간격 짧은 기간'''에도 가능 (🎙 9/15). 단점이 바로 '''중도 이탈''' || [[종단 연구]]\n|-\n| 고양이를 보고 \"멍멍이\" 범주를 새로 고침 = 동화 || 기존 틀로 해석 = '''동화''' / 틀 자체를 바꿈 = '''조절''' || [[동화]] · [[조절]]\n|-\n| 보존 개념 결여 = 구체적 조작 단계 || 보존 결여 = '''전조작(2–6세)''', 보존 이해 시작 = 구체적 조작(7–11세) || [[보존 개념]]\n|-\n| 대상 영속성·낯가림 = 전조작 단계 || 둘 다 '''감각 운동 단계(0–2세)'''. 대상 영속성은 6개월 이후 || [[대상 영속성]] · [[감각 운동 단계]]\n|-\n| 가설적 명제 추리 = 구체적 조작 || 추상·가설 추리 = '''형식적 조작(12세~)''' || [[형식적 조작 단계]]\n|-\n| 피아제 = 사회적 환경, 비고츠키 = 물리적 환경 || '''피아제 = 물리적 환경·심적 조작''' / '''비고츠키 = 사회적 환경·도약대·속내말''' (🎙 9/15) || [[비고츠키]] · [[피아제의 인지 발달 단계]]\n|-\n| 피아제 단계는 0/1 계단식으로 딱 끊긴다 || 현대 연구: 발달은 '''더 연속적''', 능력이 '''더 일찍''' 발현(유아 물리학·수학, 가상 놀이) || [[피아제의 인지 발달 단계]]\n|-\n| 마음 이론은 3세면 완성 || '''4–5세''' 를 기점으로 급발달 (반창고 상자 과제). 마음 이론이 발달해야 공감·사회성 (🎙 9/15) || [[마음 이론]]\n|-\n| 각인 = 신체 접촉 기반 애착 || 각인(오리) = '''친숙성''' 기반 / 신체 접촉(온기) 기반 = '''할로우의 대리모 실험''' || [[각인]] · [[할로우의 대리모 실험]]\n|-\n| 회피 애착 = 인정을 갈망하고 배척 신호에 민감 || 그건 '''불안 애착'''. 회피 애착 = 긴밀한 관계가 불편해 '''거리 유지''' || [[안정 애착과 불안정 애착]]\n|-\n| 안정 애착 아동은 부모가 사라져도 불안하지 않다 / 애착은 전적으로 기질 || 안정 애착도 부모가 사라지면 '''불안해하다 재회 시 접촉'''. 차이는 '''부모의 적절한 반응'''이 결정 || [[안정 애착과 불안정 애착]]\n|-\n| 불안정 애착이 가장 큰 위험 || 진짜 위험은 '''애착 박탈'''(루마니아 아동). 불안·회피 성향은 위험 탐지에 '''도움'''이 될 수도 || [[애착]]\n|-\n| 기본 신뢰감은 타고난다 || '''안정 애착을 통해''' 후천적으로 형성 || [[기본 신뢰감]]\n|-\n| 권위적 = 강압·복종 요구 || 권위적(authoritative) = '''요구 + 타협''' / 권위주의적(authoritarian) = '''강압·복종''' || [[권위적·권위주의적·허용적 양육]]\n|-\n| 허용적 부모의 자녀 = 사회적 기술·자존감 저하 || 그건 '''권위주의적''' 자녀. 허용적 자녀 = 공격적·미숙, 방임적 자녀 = 학업·사회 관계 낮음 || [[권위적·권위주의적·허용적 양육]]\n|-\n| 양육 방식이 자녀 특성의 원인 || '''상관이지 인과가 아님''' (🎙 9/15) || [[권위적·권위주의적·허용적 양육]] · [[상관]]\n|-\n| 인습적 단계 = 보편 권리·윤리 원칙 || 인습적 = '''사회적 인정·질서''' / 후인습적 = '''보편 원리''' / 전인습적 = '''처벌 회피·보상''' || [[콜버그의 도덕성 발달 단계]]\n|-\n| 태도가 먼저 있어야 도덕 행동이 가능 || '''행동 → 태도''' 도 가능 (법원 행동 프로그램 이수 명령) || [[도덕 직관]]\n|-\n| 유아기 = 자율성 대 수치감, 중년기 = 친밀감 대 소외감 || 유아기 = '''신뢰 대 불신''', 걸음마기 = 자율성, 청소년기 = '''정체성 대 역할 혼미''', 성인 초기 = 친밀감, 중년 = '''생산성''', 노년 = 통합감 || [[에릭슨의 심리사회적 발달 단계]] · [[정체성]]\n|-\n| 노화하면 재인이 크게 떨어진다 || '''회상은 하락, 재인은 유지''' (🎙 9/15). 설단 현상은 늘어남. 기억 개인차는 '''커짐''' || [[설단 현상]] · [[재인]]\n|-\n| 40대 중년 위기는 대부분이 겪는다 || 연구상 '''지지되지 않음''' (Hunter & Sundel) || [[사회적 시계]]\n|-\n| 성공적 노화는 한 요인만 갖추면 된다 || 낙관적 관점·지속적 대인 관계·생물학적 영향 '''세 요인 모두''' (🎙 9/15) || [[성공적 노화]]\n|}\n\n== 4장 감각과 지각 ==\n{|\n! 함정(틀리기 쉬운 생각) || 맞는 것 || 문서\n|-\n| 절대 역치 = 두 자극의 차이를 탐지하는 지점 || 절대 역치 = 자극 '''유무''' 탐지율 0.5 / 차이 역치(JND) = 두 자극 '''차이''' 탐지율 0.5 || [[절대 역치]] · [[차이 역치]]\n|-\n| 역치가 낮을수록 언제나 좋다 || 항상은 아님 — 정신적 자원 한계 (🎙 9/22) || [[절대 역치]]\n|-\n| 역치하 자극은 의식 못 하니 영향도 없다 || 의식하지 못해도 '''영향을 줄 수 있다''' — 증거가 점화 || [[점화]]\n|-\n| 기준선을 엄격하게 옮기면 민감도가 오른다 / 적중↑ 오경보↓ || 기준선은 '''편향성'''일 뿐 d′ 불변. 엄격(오른쪽) → 적중·오경보 '''둘 다↓''', 관대(왼쪽) → 둘 다↑ || [[신호 탐지 이론]]\n|-\n| 100kg → 110kg 다음은 120kg || '''121kg'''. 현재 무게의 '''일정 비율'''(10%) || [[베버의 법칙]]\n|-\n| 감각 순응 = 암순응 || 감각 순응 = 반복 자극에 '''민감도 감소'''(후각이 가장 빠름) / 암순응 = 어둠에 적응해 형체 식별(간상체) || [[감각 순응]] · [[원추체와 간상체]]\n|-\n| 원추체가 더 많고 주변부에 분포, 간상체가 색 담당 || '''원추체 600만·중앙·색·세부·핫라인''' / '''간상체 1억 2천만·주변·밝기·약한 빛·합산''' || [[원추체와 간상체]]\n|-\n| 근시 = 망막 뒤에 상, 볼록렌즈 || '''근시 = 굴절력 강함·망막 앞·오목렌즈''' / 원시 = 약함·망막 뒤·볼록렌즈 || [[눈의 구조]]\n|-\n| 밝은 방에서 동공 수축 = 하향 처리 || 물리적 자극 강도에 의한 반응(상향). 갈증 → 물병이 가깝게, 부상병 통증↓, 슬픈 음악 → Pain 부정적 = 하향 || [[하향 처리]]\n|-\n| 얼굴 13개 그림 = 상향 처리 || \"얼굴이 있다\" 는 기대로 찾아냄 = '''하향 처리''' (🎙 9/22) || [[하향 처리]]\n|-\n| 통증의 직접 경로 모형 = 기대·주의가 핵심 || 직접 경로 모형 = '''상향 중심''', 부상병 관찰(Beecher)이 '''반박'''. VR 게임 주의 분산 → 화상 통증 '''감소''' || [[지각 갖춤새]]\n|-\n| 게슈탈트 = 경험으로 생긴 하향 처리 || '''타고난 상향''' 처리 중심 (🎙 9/22 \"많이 헷갈림\") || [[게슈탈트 심리학]] · [[상향 처리]]\n|-\n| 게슈탈트도 구조주의처럼 부분의 합 = 전체 || 구조주의 = 부분의 통합 = 전체 / '''게슈탈트 = 전체 > 부분의 합''' || [[게슈탈트 심리학]]\n|-\n| 전경–배경은 고정되어 바뀌지 않는다 || '''가역적''', 주의에 따라 반전 || [[전경-배경]]\n|-\n| 오륜기 = 폐쇄 || 부드럽게 이어진 선 = '''연속성'''. 폐쇄 = 끊어진 틈을 메움 || [[집단화]]\n|-\n| 수렴 = 단안 단서 / 상대적 크기·중첩 = 양안 단서 || 양안(2) = '''망막 부등·수렴''' / 단안(5) = '''중첩·상대적 운동·상대적 높이·선형 조망·상대적 크기''' (🎙 9/22 \"잘 구분\") || [[양안 단서]] · [[단안 단서]]\n|-\n| PPA = 얼굴, FFA = 장소 || '''FFA = 얼굴'''(손상 → 얼굴실인증), '''PPA = 장소''' || [[방추상 얼굴 영역]]\n|-\n| 시각 절벽 = 성인 대상, 깊이 지각은 학습 || '''6–14개월 유아''', 동물 새끼도 회피 → '''선천성''' 시사 || [[깊이 지각]]\n|-\n| 따뜻한 커피 → 우호적 평가 = 공감각 || 신체 감각과 인지 회로의 상호작용 = '''체화 인지'''. 공감각 = 한 감각이 다른 감각 경험을 일으킴(숫자 → 색) || [[체화 인지]] · [[공감각]]\n|-\n| 린드버그 예지몽 = ESP 증거 || 1300명 중 5%, 4명 → '''우연의 일치''' || [[초감각지각]]\n|}\n\n== 5장 학습 ==\n{|\n! 함정(틀리기 쉬운 생각) || 맞는 것 || 문서\n|-\n| 부적 강화 = 처벌 (부적 = 나쁜 것) || '''부적 = 제거''', '''강화 = 행동 증가'''. 혐오 자극 제거 → 행동↑ = 부적 강화 (🎙 9/29) || [[부적 강화]] · [[정적 강화와 부적 강화]]\n|-\n| 정적 처벌 = 보상을 빼앗음 || 정적 처벌 = 혐오 자극 '''제시''' → 행동↓ / 부적 처벌 = 보상 '''철회''' → 행동↓ (타임 아웃) || [[처벌]] · [[부적 처벌]]\n|-\n| 약물 중독은 쾌감(정적 강화)만으로 설명 / 두 강화는 동시에 못 일어난다 || 금단 증상 제거 = '''부적 강화의 강력한 예''', 정적·부적 강화는 '''동시에''' 가능 (🎙 9/29) || [[부적 강화]]\n|-\n| 소거 = 조건 반응의 영구 삭제 || '''억압'''. 휴지 후 부분 회복(자발적 회복)이 증거 (🎙 9/29) || [[소거]] · [[자발적 회복]]\n|-\n| 소거 = CS와 US를 계속 같이 제시 || 소거 = '''US 없이 CS만''' 반복 제시 || [[소거]]\n|-\n| 순서는 상관없다 / US 먼저 NS 나중 || '''NS 먼저, US 나중'''. US가 먼저면 조건형성이 거의 안 됨 (🎙 9/29) || [[고전적 조건화]]\n|-\n| UR과 CR은 같은 것 || 겉보기 행동(침)은 같아도 '''유발 자극이 다르다''' — US → UR, CS → CR || [[무조건 반응]] · [[조건 반응]]\n|-\n| 오토바이 소리 = 무조건 자극 || 학습된 자극이므로 '''조건 자극'''. 피자 = US || [[조건 자극]] · [[무조건 자극]]\n|-\n| 벌 → 날벌레 공포 = 변별 || 유사 자극에도 반응 = '''일반화'''. 변별 = 무관한 자극을 구분해 반응 안 함 || [[일반화]] · [[변별]]\n|-\n| 둔감화(습관화) = 연합 학습 || 반복 노출로 반응↓ = '''비연합 학습'''(반대는 민감화). 학습은 비연합·연합·인지(관찰)의 세 양상 || [[학습]] · [[민감화]] · [[습관화]]\n|-\n| 효과의 법칙 = 스키너 / 개 침 실험 = 스키너 || 효과의 법칙 = '''손다이크'''(고양이 상자), 개 침 = '''파블로프'''. 스키너는 행동 공학·행동 조성 || [[효과의 법칙]] · [[스키너]]\n|-\n| 효과의 법칙: 보상 뒤 행동↓ 처벌 뒤 행동↑ || '''보상 뒤 증가, 처벌 뒤 감소''' || [[효과의 법칙]]\n|-\n| 스키너 상자의 레버 누르기 = 고전적 조건화 || 행동 ↔ 결과 연합 = '''조작적 조건화''' || [[스키너 상자]]\n|-\n| 행동 조성 = 계기적 근사법 (같은 말) || 행동 조성(shaping) = 원하는 방향으로 유도하는 큰 틀 / '''계기적 근사법''' = 그 구체적 방법(단계별 보상) || [[행동 조성]] · [[계기적 근사법]]\n|-\n| 부분 강화는 학습도 빠르고 소거도 쉽다 || 학습은 '''느리지만''' 소거 저항은 '''높다''' || [[강화 계획]]\n|-\n| SNS 좋아요 = 변동비율, 슬롯머신 = 변동간격 || SNS 알림 = '''변동간격'''(느리지만 꾸준) / 슬롯머신·낚시 = '''변동비율'''(소거 잘 안 됨) / 정기 할인 = 고정간격(시점 직전 급증) / 커피 쿠폰 = 고정비율 || [[강화 계획]]\n|-\n| 고전적 = 자발적, 조작적 = 비자발적 || '''고전적 = 비자발적·자동적''', 제어 불가 사건 간 연합 / '''조작적 = 자발적''', 행동–결과 연합 || [[고전적 조건화와 조작적 조건화 비교]]\n|-\n| 일반화·변별은 고전적 조건화에만 있다 || 획득·소거·자발적 회복·일반화·변별 모두 '''두 조건화 공통''' || [[고전적 조건화와 조작적 조건화 비교]]\n|-\n| 처벌하면 행동이 잊힌다 / 체벌이 공격성을 낮춘다 || 처벌은 '''억제'''일 뿐이고 부모의 처벌은 '''부적으로 강화'''됨. 체벌은 공격성 '''증대''' (APA 2019) || [[처벌]]\n|-\n| 중형의 위협이 범죄율을 가장 낮춘다 || '''신속하고 확실한''' 처벌(검거율) || [[처벌]]\n|-\n| 타임 아웃 = 정적 처벌 || 관심(강화물)을 철회 = '''부적 처벌''' || [[부적 처벌]]\n|-\n| 거울 뉴런 = 후두엽, 시각 자극에만 반응 || '''전두엽''' 뉴런, 행동 수행·관찰 모두 활성화 (리졸라티) → 모방·공감·마음 이론의 기반 || [[거울 뉴런]]\n|-\n| 폭력적 게임과 폭력 행동은 강한 상관 || 출간 편향을 교정한 메타분석에서 상관은 '''낮음''' || [[5장 학습]]\n|}\n\n== 6장 기억 ==\n{|\n! 함정(틀리기 쉬운 생각) || 맞는 것 || 문서\n|-\n| 순행 간섭 = 새 것이 옛 것을 방해 || '''순행 = 옛 → 새''' 방해 (일본어 → 영어) / '''역행 = 새 → 옛''' 방해 (새 번호 → 옛 번호) || [[순행 간섭]] · [[역행 간섭]]\n|-\n| 순행성 기억상실 = 옛 기억을 못 꺼냄 || '''순행성 = 새 기억 형성 불가'''(H.M.) / 역행성 = 저장된 옛 기억 인출 불가 || [[기억상실증]]\n|-\n| 회상 = 본 적 있는지 확인, 재인 = 직접 생성 || '''회상 = 직접 생성'''(어려움) / '''재인 = 확인'''(쉬움) || [[회상]] · [[재인]]\n|-\n| 에빙하우스 파지 곡선 = 재인 정답률 || '''재학습 시간(절약)''' 기반 || [[망각 곡선]]\n|-\n| 간격두기 효과 = 퀴즈로 인출 연습 || 간격두기 = 학습 '''시점'''을 분산 / 검증 효과 = '''인출 연습'''. 둘은 '''병행'''하라 (p.41) || [[간격두기 효과]] · [[검증 효과]]\n|-\n| 몰아서 공부(벼락치기)가 오래 간다 || 분산할수록 '''응고화'''가 잘 돼 오래 간다 || [[간격두기 효과]] · [[기억 응고화]]\n|-\n| 맥락 의존 = 기분 일치, 상태 의존 = 환경 일치 || '''맥락 = 외부 환경''' 일치 / '''상태 = 내적 기분''' 일치(기분 부합 기억) || [[맥락 의존 기억과 상태 의존 기억]]\n|-\n| 응고화 = 재응고화 || 응고화 = '''최초''' 저장 안정화(해마·수면) / 재응고화 = '''인출 후 다시''' 저장, 변형 위험 || [[기억 응고화]] · [[재응고화]]\n|-\n| 단기 기억 0.5–1초, 감각 기억 약 12초 || '''감각 기억 0.5–1초·3–4개''' / '''단기 기억 약 12초·7±2''' || [[감각 기억]] · [[단기 기억]]\n|-\n| 스펄링 전체 보고에서 9개 대부분 회상 / 지연하면 수행 향상 || 전체 보고 '''약 4개''', 부분 보고 → 지정 줄 '''3개 모두''', 단서 '''지연 → 저하''' || [[스펄링 실험]]\n|-\n| 피터슨 실험의 3씩 빼기 = 청크화 유도 || '''되뇌기 방지''' → 단기 기억의 순수 유지 시간(약 12초) 측정 || [[피터슨과 피터슨 실험]]\n|-\n| 초두 효과 = 단기 기억, 최신 효과 = 되뇌기 여유 || '''최신 = 단기/작업 기억'''(시간 지나면 소멸) / '''초두 = 되뇌기 여유'''(장기 기억) || [[계열 위치 효과]]\n|-\n| 단기 기억 = 작업 기억 (같은 말) || 단기 = 정보 '''저장''' 초점 / 작업 = 저장 + '''적극적 처리''', 중앙 집행기·시공간 잡기장·음운 루프 || [[작업 기억]]\n|-\n| 음운 루프 = 시각 심상 유지 / N-Back = 구성 요소 || 시각 심상 = '''시공간 잡기장''', 음운 루프 = 음운 저장소 + 조음 되뇌기. N-Back = 작업 기억 '''측정 과제''' || [[음운 루프]] · [[작업 기억]]\n|-\n| 해마 = 모든 장기 기억의 영구 저장소 || 해마는 외현 기억의 '''형성·응고화'''(\"저장 버튼\"). 절차 기억 = '''기저 신경절''', 조건형성 = '''소뇌''', 정서 기억 = '''편도체''', 작업 기억 유지 = '''전전두엽''' || [[해마]] · [[암묵 기억]]\n|-\n| H.M.처럼 외현 기억을 못 만들면 암묵 기억도 못 만든다 || '''절차 기억 같은 암묵 기억은 형성''' 가능 || [[기억상실증]] · [[암묵 기억]]\n|-\n| 단어 모양·운율 판단 = 깊은 처리 || 형태·소리 = '''얕은''' 처리, '''의미''' = 깊은 처리 → 회상 최고 (Craik & Tulving) || [[처리 수준]]\n|-\n| 오정보 효과 = 상상력 효과 || 오정보 = '''외부'''에서 잘못된 정보(질문 표현) / 상상력 효과 = '''스스로 반복 상상''' || [[오정보 효과]]\n|-\n| 학습 후 수면이 좋은 건 뇌가 쉬어서 || Jenkins & Dallenbach: 새 정보 유입이 없어 '''역행 간섭 감소''' + 수면은 '''응고화''' 지원 || [[역행 간섭]]\n|-\n| 단기 기억 용량 = 72개 (슬라이드 표기) || '''7±2''' — PPTX 오기 || [[매직 넘버 7]]\n|}\n\n== 관련 문서 ==\n* [[모의고사 복기]] — 이 함정들이 실제로 어떤 문항으로 나왔는지 (⚠ 표시)\n* [[명칭 암기표]] — 단답형 5문항 대비\n* [[시험 정보]] · [[읽는 순서]] · [[main]]"

  "body": "'''중간고사 모의고사 v1''' 문제은행 '''104문항'''(단답형 27 · 객관식 77)을 한 줄씩 위키 문서에 대응시킨 표다. 문제를 풀고 채점한 뒤, 틀린 문항의 '''위키 문서''' 칸을 눌러 개념부터 다시 읽는 용도다. 실제 시험은 '''객관식 25 + 단답형 5 = 30문항'''이고 단답형은 '''명칭 쓰기만''' 나온다 → [[시험 정보]].\n\n{info}\n'''문제지 위치''' — `../문제풀이/중간고사_모의/` (위키 폴더 기준. 2학기 루트에서는 `심리학으로의여행/중간고사/문제풀이/중간고사_모의/`)\n* `중간고사_모의_v1_1회.html / .pdf` — 실전형 1회 (객관식 25 + 단답형 5)\n* `중간고사_모의_v1_2회.html / .pdf` — 실전형 2회\n* `중간고사_모의_v1_3회.html / .pdf` — 실전형 3회\n* `중간고사_모의_v1_전체.html / .pdf` — 전체 문제은행 104문항 (해설 포함)\n* 원본 문항은 `bank_ch0.py … bank_ch6.py`, 생성기는 `_midterm_mock_gen.py` (`PYTHONIOENCODING=utf-8 python -B _midterm_mock_gen.py`)\n{/info}\n\n== 실전형 1–3회는 어떻게 짜였나 ==\n생성기는 서막→6장 순으로 이어 붙인 문항을 '''번호 % 3''' 으로 세 회차에 나눈다. 그래서 회차마다 장 비율이 비슷하다.\n{|\n! 구분 || 객관식 || 단답형 || 비고\n|-\n| 실전형 1회 || 25 || 5 || 장 순서로 0·3·6…번째 문항\n|-\n| 실전형 2회 || 25 || 5 || 1·4·7…번째 문항\n|-\n| 실전형 3회 || 25 || 5 || 2·5·8…번째 문항\n|-\n| 전체 문제은행에만 있음 || 2 || 12 || 아래 표의 # 칸에 '''전체''' 라고 적힌 문항 (회차 몫에서 남거나, 같은 회차 객관식 보기에 정답이 드러나서 빠진 단답형)\n|}\n단답형 회차 배정은 \"같은 회차의 객관식 보기에 단답형 정답이 그대로 나오면 건너뛴다\" 는 규칙을 따른다. 그래서 2·5·6장 단답형 상당수가 '''전체에만''' 있다 — 실전형 3회분을 다 풀었더라도 '''전체 문제은행의 단답형 12개는 따로''' 풀어야 한다.\n\n{analogy}\n모의고사 104문항은 '''건강검진 문진표'''다. 점수 자체보다 \"어느 칸에 체크했는가\" 가 중요하다. 틀린 문항은 증상이고, 표의 '''위키 문서''' 칸이 진료과다. 증상(문항)만 외우면 같은 병이 다른 증상(다른 사례 지문)으로 나왔을 때 또 놓친다 — 반드시 진료과(개념 문서)에 가서 원인을 고치자.\n{/analogy}\n\n{tip}\n'''틀린 문항 적는 칸''' — `../문제풀이/중간고사_모의/중간고사_모의_v1_틀린것들.md` 를 만들어 회차·문항 번호·고른 답·왜 틀렸는지(한 줄)·다시 읽은 위키 문서를 적는다. 시험 전날에는 그 파일과 [[자주 틀리는 함정 모음]] 만 본다. 퀴즈로 인출 연습을 하는 것 자체가 [[검증 효과]]이고, 하루 간격을 두고 다시 푸는 것이 [[간격두기 효과]]다.\n{/tip}\n\n'''표 읽는 법''': # 칸의 `SA` = 단답형, `MC` = 객관식, 번호는 장 안의 번호, 뒤의 `1회/2회/3회/전체` 는 실린 문제지. '''⚠''' = 오답 보기가 교묘해서 틀리기 쉬운 문항(맨 아래 '''⚠ 문항 다시 풀기''' 절에 8개 재구성). 근거 p. 는 그 장의 '''인쇄 슬라이드 번호'''.\n\n== 서막 심리학 이야기 (SA 3 · MC 8) ==\n{|\n! # || 문항 요지(한 줄) || 정답 || 근거 p. || 위키 문서\n|-\n| SA1 · 1회 || 분트·티치너, 마음을 감각 요소로 쪼개 자기보고로 찾은 학파 || '''구조주의''' || 서막 p.9 || [[구조주의]]\n|-\n| SA2 · 2회 || 1960년대 심적 과정 복귀 + 정보 처리 접근이 나온 패러다임 전환 || '''인지혁명''' || 서막 p.13 || [[인지혁명]]\n|-\n| SA3 · 3회 || 시험 불안을 유전·기대·가족 문화가 함께 만든 결과로 설명 || '''생물심리사회적 접근법''' || 서막 p.22–23 || [[생물심리사회적 접근법]]\n|-\n| MC1 · 1회 || 윌리엄 제임스의 학파와 주장 짝 || ③ 기능주의 – 적응적 기능, 다윈 영향 || 서막 p.10 || [[기능주의]]\n|-\n| MC2 · 2회 ⚠ || 분트 공이치기 실험 결과 || ① 자각 후 누르기(0.2초)가 즉시 누르기(0.1초)보다 오래 || 서막 p.8 || [[빌헬름 분트]]\n|-\n| MC3 · 3회 || 행동주의가 분트·제임스를 비판한 이유 || ④ 관찰 불가한 내부 요소를 탐구해 객관성 부족 || 서막 p.11 || [[행동주의]]\n|-\n| MC4 · 1회 ⚠ || 두 조건화 설명 중 '''틀린''' 것 || ② \"내적 정보 처리를 밝히는 데 중점\" (실제는 자극–반응에만 중점) || 서막 p.11 || [[행동주의]]\n|-\n| MC5 · 2회 || 컴퓨터 메타포의 대응 || ③ 장기 기억 = SSD || 서막 p.14 || [[컴퓨터 메타포]]\n|-\n| MC6 · 3회 || 선천성·후천성 예시 짝 || ① 선천 = 에크만 기본 감정 / 후천 = 몽골어·중국어 색 지각 || 서막 p.20–21 || [[선천성-후천성 논제]]\n|-\n| MC7 · 1회 ⚠ || \"유전자와 환경이 '''개인차'''에 어떻게?\" 를 묻는 조망 || ④ 행동유전학 (진화론 아님) || 서막 p.24–25 || [[행동유전학]]\n|-\n| MC8 · 2회 || 분노 설명과 조망 짝 || ② Fight or Flight – 진화론 || 서막 p.24 || [[이론적 조망]]\n|}\n\n== 1장 심리과학을 비판적으로 생각하기 (SA 4 · MC 10) ==\n{|\n! # || 문항 요지(한 줄) || 정답 || 근거 p. || 위키 문서\n|-\n| SA1 · 1회 || 경기 끝난 뒤 \"그럴 줄 알았다니까\" || '''후견 편향''' || 1장 p.5 || [[후견 편향]]\n|-\n| SA2 · 2회 ⚠ || 스트레스 = 척도 30점 이상처럼 측정 가능하게 진술 || '''조작적 정의''' || 1장 p.16 || [[조작적 정의]]\n|-\n| SA3 · 3회 || \"극빈자 지원\" 은 찬성, \"복지\" 는 반대 || '''말표현 효과''' || 1장 p.20 || [[말표현 효과]]\n|-\n| SA4 · 1회 || 연구 전 윤리 적합성을 사전 승인하는 기구 (영문 3글자) || '''기관 생명 윤리 위원회 (IRB)''' || 1장 p.27 || [[기관 생명 윤리 위원회]]\n|-\n| MC1 · 3회 || 테틀록의 전문가 예측 연구 || ② 80% 확신 사건의 적중률 40% 이하 || 1장 p.6 || [[과신]]\n|-\n| MC2 · 1회 || 지하철 사고를 겪고 지하철이 더 위험하다고 믿음 || ④ 강력한 사례의 가용성 || 1장 p.14 || [[탈진실의 취약성 요인]]\n|-\n| MC3 · 2회 || 연구 방법과 약점 짝 || ① 사례 연구 – 소수 사례가 오도, 일반화 어려움 || 1장 p.18, 21, 25 || [[연구 방법 비교]]\n|-\n| MC4 · 3회 ⚠ || 대패 뒤 비난 → 다음 경기 호전, 간과한 것 || ③ 평균으로의 회귀 || 1장 p.22 || [[평균으로의 회귀]]\n|-\n| MC5 · 1회 || 아이스크림 소비–식중독 정적 상관 해석 || ② 제3의 변인(기온) 가능, 인과 아님 || 1장 p.22 || [[제3의 변인]]\n|-\n| MC6 · 2회 ⚠ || 무선 표집 vs 무선 할당 || ④ 무선 할당 = 개인차가 한 조건에 몰리는 것 방지 || 1장 p.21, 23 || [[무선 할당]]\n|-\n| MC7 · 3회 || 가짜약 조건과 이중 은폐 || ① 참가자와 실험자 '''모두''' 모름 || 1장 p.24 || [[이중 은폐]]\n|-\n| MC  5장 p.17–18 || [[효과의 법칙]]\n|-\n| MC9 · 3회 || SNS 좋아요 알림 확인 || ④ 변동간격 계획 || 5장 p.22–23 || [[강화 계획]]\n|-\n| MC10 · 1회 || 처벌과 교육 (APA, 2019) || ① 처벌은 망각이 아니라 억제, 부모의 처벌은 부적으로 강화됨 || 5장 p.24–26 || [[처벌]]\n|-\n| MC11 · 2회 || 거울 뉴런 || ② 수행·관찰 때 모두 활성화되는 전두엽 뉴런 || 5장 p.33, 35 || [[거울 뉴런]]\n|-\n| MC12 · 3회 ⚠ || 고전적 vs 조작적 조건화 비교 || ③ 제어 불가 사건 간 연합 vs 행동–결과 연합 || 5장 p.30 || [[고전적 조건화와 조작적 조건화 비교]]\n|}\n\n== 6장 기억 (SA 4 · MC 11) ==\n{|\n! # || 문항 요지(한 줄) || 정답 || 근거 p. || 위키 문서\n|-\n| SA1 · 3회 || 교재를 덮고 예상 문제를 풀며 떠올리는 연습이 더 오래 감 || '''검증 효과''' || 6장 p.23 || [[검증 효과]]\n|-\n| SA2 · 전체 ⚠ || 새 휴대전화 번호를 외운 뒤 옛 번호가 안 떠오름 || '''역행 간섭''' || 6장 p.36 || [[역행 간섭]]\n|-\n| SA3 · 전체 || 작업 기억에서 주의 분배·하위 시스템 조정 || '''중앙 집행기''' || 6장 p.8 || [[중앙 집행기]]\n|-\n| SA4 · 전체 || 「충돌했을 때」 질문 집단이 더 빠른 속도 보고 || '''오정보 효과''' || 6장 p.39 || [[오정보 효과]]\n|-\n| MC1 · 1회 || 스펄링(1960) 결과 || ③ 감각 기억 3–4개, 0.5–1초 || 6장 p.14–15 || [[스펄링 실험]]\n|-\n| MC2 · 2회 || 피터슨 & 피터슨의 3씩 빼기 이유 || ① 되뇌기(통제 처리) 방지 || 6장 p.16–17 || [[피터슨과 피터슨 실험]]\n|-\n| MC3 · 3회 ⚠ || 기억 관련 뇌 영역 중 '''틀린''' 것 || ④ \"해마가 모든 장기 기억의 영구 저장소\" || 6장 p.26–29 || [[해마]]\n|-\n| MC4 · 1회 ⚠ || 기억 측정 방법 || ③ 재학습 = 다시 배울 때 얼마나 빨라지나 || 6장 p.3–4 || [[망각 곡선]]\n|-\n| MC5 · 2회 ⚠ || 30초 암산 뒤 마지막 단어만 회상률 급락 || ② 최신 효과는 단기/작업 기억 의존 || 6장 p.32 || [[계열 위치 효과]]\n|-\n| MC6 · 3회 ⚠ || 옛 일본어 단어가 새 영어 단어를 방해 || ① 순행 간섭 || 6장 p.34–36 || [[순행 간섭]]\n|-\n| MC7 · 1회 || 기억상실증 중 '''틀린''' 것 || ④ \"H.M.은 암묵 기억도 전혀 못 만든다\" (절차 기억은 형성) || 6장 p.33 || [[기억상실증]]\n|-\n| MC8 · 2회 || 슬플 때 슬펐던 일이 잘 떠오름 || ② 상태 의존 기억(기분 부합 기억) || 6장 p.30–31 || [[맥락 의존 기억과 상태 의존 기억]]\n|-\n| MC9 · 3회 || 간격두기 효과 || ③ 응고화와 관련, 벼락치기가 비효율적인 이유 || 6장 p.22–23, 41 || [[간격두기 효과]]\n|-\n| MC10 · 전체 || Craik & Tulving: 가장 잘 회상할 조건 || ① 문장에 맞는지 판단(의미 처리) || 6장 p.24 || [[처리 수준]]\n|-\n| MC11 · 전체 || 전화번호를 속으로 되뇌며 유지 || ② 음운 루프 – 음운 저장소 + 조음 되뇌기 || 6장 p.8, 10 || [[음운 루프]]\n|}\n\n합계: 서막 11 · 1장 14 · 2장 16 · 3장 16 · 4장 16 · 5장 16 · 6장 15 = '''104문항''' (단답형 27 · 객관식 77).\n\n== ⚠ 문항 다시 풀기 ==\n위 표의 ⚠ 문항 중 8개를 '''지문을 바꿔''' 재구성했다. 같은 함정이 다른 사례로 나와도 걸리지 않는지 확인하자.\n\n{quiz}\n'''1.''' (4장 · 베버의 법칙) 어떤 사람은 200g 봉지에서 5%가 늘어야 무거워졌다고 느낀다. 210g 봉지를 들고 있을 때 \"또 무거워졌다\" 고 느끼려면 최소 몇 g이어야 하는가? ① 215g ② 220g ③ 220.5g ④ 225g\n{/quiz}\n{answer}\n'''③ 220.5g.''' 210g의 5% = 10.5g → 220.5g. ② 220g은 \"처음처럼 10g만 더하면 된다\" 는 '''절대량''' 오답이다. [[베버의 법칙]]은 차이 역치가 '''현재 자극의 일정 비율'''이라는 법칙이다(교수 예시 100kg → 110 → '''121'''). → [[차이 역치]]\n{/answer}\n\n{quiz}\n'''2.''' (4장 · 신호 탐지 이론) 공항 보안 요원이 \"조금이라도 의심되면 가방을 연다\" 로 방침을 바꿨다(기준선을 '''왼쪽, 관대하게''' 이동). 예상되는 변화는? ① 적중↑ 오경보↓ ② 적중↑ 오경보↑ ③ 민감도 d′↑ ④ 적중↓ 오경보↓\n{/quiz}\n{answer}\n'''② 적중↑ 오경보↑.''' \"있다\" 고 답하는 경우 자체가 늘어 진짜 위험물도, 멀쩡한 가방도 더 많이 연다. 민감도(d′)는 두 분포 사이 거리라서 기준선 이동과 '''무관'''하다(③ 오답). 모의고사 MC는 반대 방향(엄격 → 둘 다 감소)을 물었다. → [[신호 탐지 이론]]\n{/answer}\n\n{quiz}\n'''3.''' (2장 · 분할 뇌) 뇌량 절단 환자의 '''우시야'''에 「컵」, '''좌시야'''에 「모자」를 보여 주었다. \"무엇을 보았나요?\" 에 말로 답하면? 왼손으로 집으라고 하면?\n{/quiz}\n{answer}\n'''말로는 「컵」, 왼손으로는 「모자」.''' 우시야 → '''좌반구'''(언어) → 말로 보고. 좌시야 → '''우반구''' → 왼손을 통제. 뇌량이 끊겨 두 반구가 정보를 공유하지 못한다. ⚠ 4장 p.25 슬라이드의 \"우시야 → 우반구\" 는 '''오기'''다. → [[분할 뇌]] · [[뇌량]]\n{/answer}\n\n{quiz}\n'''4.''' (5장 · 부적 강화) 운전 중 안전벨트를 매면 귀에 거슬리는 경고음이 멈춘다. 그 뒤로 차에 타자마자 벨트를 매는 행동이 늘었다. 이 원리의 명칭을 쓰시오.\n{/quiz}\n{answer}\n'''부적 강화.''' 혐오 자극(경고음)이 '''제거'''되어(= 부적) 행동이 '''증가'''했다(= 강화). \"부적\" 이라는 말 때문에 처벌로 쓰면 오답 — '''행동이 늘면 강화, 줄면 처벌'''(🎙 9/29). → [[부적 강화]] · [[정적 강화와 부적 강화]]\n{/answer}\n\n{quiz}\n'''5.''' (4장 · 게슈탈트) 다음 중 옳은 것은? ① 게슈탈트 집단화 원리는 경험으로 익힌 기대이므로 하향 처리다 ② 전체는 부분의 합과 같다 ③ 집단화 원리는 타고난 것이며 상향 처리 쪽을 더 강조한다 ④ 전경–배경은 한 번 정해지면 바뀌지 않는다\n{/quiz}\n{answer}\n'''③.''' 교수가 \"많이 헷갈리는 부분\" 이라며 깊게 설명한 지점(🎙 9/22): 게슈탈트는 얼핏 하향 처리 같지만 '''경험이 아니라 내재된 원리'''이고 부분에서 전체로 가는 '''상향''' 중심이다. ② 는 \"전체는 부분의 합 '''이상'''\" 과 반대, ④ 전경–배경은 '''가역적'''. → [[게슈탈트 심리학]] · [[상향 처리]]\n{/answer}\n\n{quiz}\n'''6.''' (6장 · 간섭) 이번 학기 새 수강 과목의 비밀번호를 만든 뒤로, 지난 학기 쓰던 비밀번호를 떠올리려 하면 새것만 떠오른다. 이 현상의 명칭은? 반대로 지난 학기 비밀번호가 자꾸 떠올라 새것이 안 외워진다면?\n{/quiz}\n{answer}\n앞의 경우 '''역행 간섭'''(새 것 → 옛 것 방해, 화살표가 '''뒤로'''), 뒤의 경우 '''순행 간섭'''(옛 것 → 새 것 방해, 화살표가 '''앞으로'''). 모의고사에서는 새 전화번호(역행)와 일본어→영어(순행)로 나왔다. → [[역행 간섭]] · [[순행 간섭]]\n{/answer}\n\n{quiz}\n'''7.''' (3장 · 양육 방식) 어머니 B는 \"규칙은 무조건 따라야 한다, 이유는 묻지 마라\" 고 한다. 이 양육 방식의 이름과 자녀에게 흔히 보고되는 특성은?\n{/quiz}\n{answer}\n'''권위주의적(authoritarian) 부모''' — 강압적으로 복종을 요구, 자녀의 사회적 기술·자존감 저하 위험. 요구하되 '''타협'''하는 쪽이 '''권위적(authoritative)'''(높은 자존감·자율성). 교수: \"번역 용어가 겹쳐 헷갈리니 구분할 것\", 그리고 양육 방식과 자녀 특성은 '''상관이지 인과가 아님'''(🎙 9/15). → [[권위적·권위주의적·허용적 양육]]\n{/answer}\n\n{quiz}\n'''8.''' (6장 · 계열 위치 효과) 단어 15개를 듣고 '''즉시''' 회상하면 처음과 끝 단어를 잘 기억한다. 30초 동안 암산을 시킨 뒤 회상하면 어느 쪽 효과가 사라지는가? 그 이유는?\n{/quiz}\n{answer}\n'''최신 효과'''가 사라진다. 마지막 단어들은 아직 '''단기/작업 기억'''에 남아 있던 것이라 시간이 지나면 쇠퇴한다. '''초두 효과'''는 초반 단어에 되뇌기 여유가 많아 장기 기억으로 넘어간 덕분이라 유지된다. \"초두 = 단기 기억\" 으로 뒤집는 보기가 함정. → [[계열 위치 효과]]\n{/answer}\n\n== 관련 문서 ==\n* [[자주 틀리는 함정 모음]] — 이 표의 ⚠ 문항이 왜 틀리기 쉬운지 장별로 정리\n* [[명칭 암기표]] — 단답형 5문항 대비, 설명 → 명칭 전체 사전\n* [[시험 정보]] · [[읽는 순서]] · [[main]]"
 },
