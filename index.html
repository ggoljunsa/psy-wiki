  "body": "중간고사 '''단답형 5문항은 명칭 쓰기만''' 나온다(🎙 9/29 \"장문 서술형은 없다\"). 즉 시험지는 '''설명 → 명칭''' 방향으로 묻는다. 이 문서는 서막–6장에서 나온 명칭을 '''설명을 먼저, 명칭을 뒤에''' 놓은 사전이다 — 족보가 없는 과목이라 이것이 족보 대용이다.\n\n{info}\n'''출처''': ① 통합요약 §0-1 장별 최우선 명칭 + 장별 \"출제 예상 (단답형 명칭)\" ② 각 장 정리본(`../정리본/{N}주차_{장}_정리.md`)의 「명칭 암기표」 ③ 모의고사 bank 단답형 정답 27개 ④ 위키에서 다른 문서에 흡수된 하위 명칭 전부. 여러 장에 나오는 명칭은 '''처음 본격적으로 다룬 장'''에 한 번만 실었다(예: 신경 가소성 → 2장, 마음 이론 → 3장, 고전적 조건화 → 5장, 검증 효과 → 6장).\n\n'''표시''': '''굵게''' = 통합요약 §0-1 최우선 명칭 · ✎ = 모의고사 단답형 정답 · 설명 칸은 슬라이드·정리본 정의 문장을 거의 그대로 옮겼다(시험이 슬라이드 문장으로 나올 가능성이 크다).\n\n'''철자 주의''': 채점은 '''교수·슬라이드 번역어'''로 된다. `지각 갖춤새`(지각 세트 ✗), `계기적 근사법`, `이중 은폐`(이중맹목은 다른 이름), `말표현 효과`, `오뚝이 실험`(보보 인형은 다른 이름) 그대로 쓰자.\n{/info}\n\n{analogy}\n명칭 암기는 '''사람 이름 외우기'''와 같다. \"저 사람 얼굴은 아는데 이름이…\" 가 바로 [[설단 현상]]이고, 단답형은 '''얼굴(설명)을 보여 주고 이름(명칭)을 쓰라'''는 시험이다. 이름표(명칭)만 보며 \"아 그거\" 하는 것은 [[재인]] 연습일 뿐이다 — 시험은 [[회상]]을 요구한다. 그래서 이 표는 '''명칭 칸을 손으로 가리고''' 설명만 보며 이름을 소리 내어 말하는 용도로 쓴다.\n{/analogy}\n\n== 최우선 30개 (시험 직전 10분용) ==\n통합요약 §0-1 에서 굵게 강조된 명칭 + 모의고사 단답형 정답 중 장별 비율을 맞춰 30개를 골랐다. '''이것만은 설명을 듣자마자 튀어나와야 한다.'''\n{|\n! # || 설명 || 명칭 || 장 · 문서\n|-\n| 1 || 생물학적·심리적·사회문화적 수준을 통합해 행동을 설명 — 어느 하나만으로는 설명 못 함 || '''생물심리사회적 접근법''' ✎ || 서막 · [[생물심리사회적 접근법]]\n|-\n| 2 || 분트·티치너, 마음을 감각 요소의 복합체로 보고 내성법으로 분해 || '''구조주의''' ✎ || 서막 · [[구조주의]]\n|-\n| 3 || 1960년대 심적 과정을 다시 연구 대상으로, 정보 처리 접근의 계기 || '''인지혁명''' ✎ || 서막 · [[인지혁명]]\n|-\n| 4 || 결과를 알고 난 뒤 자신이 그 결과를 예측할 수 있었다고 믿는 경향 || '''후견 편향''' ✎ || 1장 · [[후견 편향]]\n|-\n| 5 || 실제로 아는 것보다 더 많이 안다고 믿는 경향 || '''과신''' || 1장 · [[과신]]\n|-\n| 6 || 실제로는 관계가 없는데 관계가 있다고 지각 || '''착각 상관''' || 1장 · [[착각 상관]]\n|-\n| 7 || 처치를 받았다는 기대(인지)만으로 나타나는 효과 || '''가짜약 효과''' || 1장 · [[가짜약 효과]]\n|-\n| 8 || 연구 개념·절차를 측정 가능한 형태로 정확히 진술 || '''조작적 정의''' ✎ || 1장 · [[조작적 정의]]\n|-\n| 9 || 손상 후 재조직하거나 경험으로 새 신경 통로를 만들어 뇌가 변하는 능력 || '''신경 가소성''' ✎ || 2장 · [[신경 가소성]]\n|-\n| 10 || 여러 말소리 중 하나에만 주의, 내 이름은 바로 알아챔 || '''칵테일 파티 효과''' ✎ || 2장 · [[칵테일 파티 효과]]\n|-\n| 11 || 장면에 변화가 일어나도 눈치채지 못함 (부주의적 맹시의 한 유형) || '''변화맹''' ✎ || 2장 · [[변화맹]]\n|-\n| 12 || 의식적(계열·신중) 경로와 무의식적(병렬·자동) 경로가 함께 개입 || '''이중 처리''' ✎ || 2장 · [[이중 처리]]\n|-\n| 13 || 물리적으로 지각되지 않아도 대상이 계속 존재함을 앎 || '''대상 영속성''' ✎ || 3장 · [[대상 영속성]]\n|-\n| 14 || 타인과 자신의 심적 상태(감정·지각·사고)를 추론하는 능력, 4–5세 급발달 || '''마음 이론''' ✎ || 3장 · [[마음 이론]]\n|-\n| 15 || 새끼 오리가 처음 본 움직이는 대상을 따름 — 친숙성 기반 애착 || '''각인''' ✎ || 3장 · [[각인]]\n|-\n| 16 || 새 정보를 수용하려고 기존 스키마 자체를 바꿈 || '''조절''' ✎ || 3장 · [[조절]]\n|-\n| 17 || 경험·기대가 감각 입력을 체계화 (얼굴 13개 찾기) || '''하향 처리''' || 4장 · [[하향 처리]]\n|-\n| 18 || 감각 수용기에서 고차 인지로 올라가는 처리 || '''상향 처리''' || 4장 · [[상향 처리]]\n|-\n| 19 || 차이를 지각하려면 현재 자극의 일정 '''비율'''만큼 변해야 한다 (100 → 110 → 121kg) || '''베버의 법칙''' || 4장 · [[베버의 법칙]]\n|-\n| 20 || 같은 자극이 반복되면 수용 기관의 민감도가 감소 || '''감각 순응''' ✎ || 4장 · [[감각 순응]]\n|-\n| 21 || 경험에 근거해 특정 지각에 대해 형성되는 기대 || '''지각 갖춤새''' ✎ || 4장 · [[지각 갖춤새]]\n|-\n| 22 || 무조건 자극 없이 조건 자극만 반복 → 조건 반응 감소 (제거가 아니라 억압) || '''소거''' || 5장 · [[소거]]\n|-\n| 23 || 휴지 기간 뒤 소거된 조건 반응이 부분적으로 다시 나타남 || '''자발적 회복''' ✎ || 5장 · [[자발적 회복]]\n|-\n| 24 || 최종 목표 행동에 이르는 이전 단계 행동에 차례로 보상 || '''계기적 근사법''' ✎ || 5장 · [[계기적 근사법]]\n|-\n| 25 || 혐오 자극을 제거해 행동 빈도를 증가 (처벌 아님) || '''부적 강화''' ✎ || 5장 · [[부적 강화]]\n|-\n| 26 || 행동을 할 때도, 남이 하는 걸 볼 때도 활성화되는 전두엽 뉴런 || '''거울 뉴런''' || 5장 · [[거울 뉴런]]\n|-\n| 27 || 저장만이 아니라 정보를 적극적으로 처리하는 확장된 단기 기억 (배들리) || '''작업 기억''' || 6장 · [[작업 기억]]\n|-\n| 28 || 퀴즈·모의고사처럼 인출을 연습하면 단순 반복보다 오래 기억 || '''검증 효과''' ✎ || 6장 · [[검증 효과]]\n|-\n| 29 || 학습 시점을 나누어 분산하면 기억이 오래 유지 || '''간격두기 효과''' || 6장 · [[간격두기 효과]]\n|-\n| 30 || 질문 표현 등 잘못된 정보 때문에 실제 본 것과 다르게 기억·보고 || '''오정보 효과''' ✎ || 6장 · [[오정보 효과]]\n|}\n'''다음 순위 (모의고사 단답형 정답)''': [[말표현 효과]] · [[기관 생명 윤리 위원회]] · [[망막 부등]] · [[맥거크 효과]] · [[고차 조건형성]] · [[역행 간섭]] · [[중앙 집행기]].\n\n== 서막 심리학 이야기 ==\n{|\n! 설명(슬라이드 문장) || 명칭 || 영어 || 문서\n|-\n| 행동과 심적 과정의 과학. 마음이 어떻게 작동하고 행동으로 나타나는가를 연구 || 심리학 || Psychology || [[심리학]]\n|-\n| 인지·정서·신경활동·성격 등을 총괄하는 시스템 || 마음 || mind || [[심리학]]\n|-\n| 과학적 연구 방법을 추구하는 심리학 || 심리과학 || psychological science || [[심리학]]\n|-\n| 1879년 라이프치히에 최초의 심리학 실험실을 세운 학자 || 빌헬름 분트 || Wilhelm Wundt || [[빌헬름 분트]]\n|-\n| 소리를 듣자마자(약 0.1초) vs 자각하고(약 0.2초) 버튼을 누르게 해 심적 과정을 계량한 실험 || 공이치기 실험 || — || [[빌헬름 분트]]\n|-\n| 마음을 더 이상 나눌 수 없는 감각 요소의 복합체로 보고 구성 요소로 분해하려 한 학파 || '''구조주의''' ✎ || Structuralism || [[구조주의]]\n|-\n| 분트의 제자로 구조주의를 함께 이끈 학자 || 티치너 || Edward Titchener || [[구조주의|티치너]]\n|-\n| 자신의 경험을 지정된 지침에 따라 스스로 보고하는 방법 (신뢰도 한계) || '''내성법''' || Introspection || [[내성법]]\n|-\n| 마음·의식이 생존에 하는 적응적 기능(과거 회상·현재 적응·미래 계획)을 강조, 다윈의 영향 || '''기능주의''' || Functionalism || [[기능주의]]\n|-\n| 기능주의의 대표 학자 || 윌리엄 제임스 || William James || [[윌리엄 제임스]]\n|-\n| 관찰 가능한 행동만 연구해야 하며 심성 개념은 폐기해야 한다는 관점 || '''행동주의''' || Behaviorism || [[행동주의]]\n|-\n| 행동주의를 선언한 학자 || 존 왓슨 || John B. Watson || [[행동주의|존 왓슨]]\n|-\n| 아동기 경험에 대한 무의식적 사고가 행동에 미치는 영향을 강조 || 정신분석 || Psychoanalysis || [[정신분석]]\n|-\n| 정신분석의 창시자, 꿈의 소망충족 이론 || 프로이트 || Sigmund Freud || [[프로이트]]\n|-\n| 프로이트가 제시한 투사·전이 등 무의식적 보호 장치 || 방어 기제 || defense mechanism || [[정신분석|방어 기제]]\n|-\n| 무의식적 추동과 갈등이 행동을 어떻게 유도하는가를 묻는 조망 || 정신역동 || psychodynamic || [[정신분석|정신역동]]\n|-\n| 인간은 자아실현을 추구하는 주체적 존재라는 관점 || '''인본주의 심리학''' || Humanistic Psychology || [[인본주의 심리학]]\n|-\n| 인본주의를 대표하는 두 학자 || 칼 로저스 · 매슬로 || Carl Rogers · Abraham Maslow || [[인본주의 심리학|칼 로저스·매슬로]]\n|-\n| 인본주의가 본 인간의 지향점 || 자아실현 || self-actualization || [[인본주의 심리학]]\n|-\n| 심적 과정에 대한 초기 관심사를 되돌리고 과학적 연구 방법을 적용한 1960년대 패러다임 전환 || '''인지혁명''' ✎ || Cognitive Revolution || [[인지혁명]]\n|-\n| 컴퓨터의 작동 메커니즘이 마음의 작동 방식과 유사하다는 접근 || 정보 처리 접근 || information processing approach || [[인지혁명]]\n|-\n| 마음을 입력 → 처리 → 산출로 보는 비유 (RAM = 작업 기억, SSD = 장기 기억) || 컴퓨터 메타포 || Computer Metaphor || [[컴퓨터 메타포]]\n|-\n| 지각·기억·정보 처리 등 심적 과정을 탐구하는 분야 || 인지심리학 || Cognitive Psychology || [[인지심리학]]\n|-\n| 인지심리학과 뇌과학의 융합, 뇌전도·뇌영상·신경 조절을 사용 || 인지신경과학 || Cognitive Neuroscience || [[인지신경과학]]\n|-\n| 심리의 기원이 타고난 것인가 환경에서 학습한 것인가의 논쟁 (결론: 둘 다 중요) || '''선천성-후천성 논제''' || Nature-Nurture Issue || [[선천성-후천성 논제]]\n|-\n| 생존·번식에 유리한 특질이 다음 세대로 전해진다는 다윈의 이론 (「종의 기원」, 1859) || 자연선택 (다윈의 진화론) || Natural Selection || [[자연선택]]\n|-\n| 인류 공통의 생물학적 특성·보편성을 연구 || 진화심리학 || Evolutionary Psychology || [[진화심리학]]\n|-\n| 유전자와 환경의 차이가 개인차에 미치는 영향을 연구 || 행동유전학 || Behavior Genetics || [[행동유전학]]\n|-\n| 유전자가 같은 쌍둥이 / 비교 기준점이 되는 쌍둥이 || 일란성 쌍둥이 / 이란성 쌍둥이 || identical / fraternal twins || [[쌍둥이 연구|일란성·이란성 쌍둥이]]\n|-\n| 문화에 따른 차이와 보편성을 연구 || 비교문화심리학 || Cross-cultural Psychology || [[비교문화심리학]]\n|-\n| 한 집단이 공유하고 세대 간 전달되는 생각·가치·행동 || 문화 || culture || [[비교문화심리학|문화]]\n|-\n| 남에게 폐를 끼치지 않는 것을 중시하는 일본 문화 (다테마에·혼네) || 메이와쿠 || — || [[비교문화심리학]]\n|-\n| 몽골어(녹·청 세분화) vs 중국어(통일) 화자의 색 분류 차이 — 후천성 예 || 문화에 따른 색 지각 차이 || — || [[선천성-후천성 논제|문화에 따른 색 지각 차이]]\n|-\n| 문화와 무관하게 보편적인 6가지 감정(기쁨·슬픔·분노·공포·혐오·놀람) — 선천성 예 || 에크만의 기본 감정 || Basic Emotions (Paul Ekman) || [[에크만의 기본 감정]]\n|-\n| 인간의 마음과 행동을 세 분석 수준의 통합된 결과물로 보는 접근 || '''생물심리사회적 접근법''' ✎ || Biopsychosocial Approach || [[생물심리사회적 접근법]]\n|-\n| 유전자·자연선택 / 정서·인지·기대 같은 내면 기제 / 타인 기대·집단·매체 같은 외부 요인 || 생물학적 수준 · 심리적 수준 · 사회문화적 수준 || levels of analysis || [[분석 수준]]\n|-\n| 신경과학·진화론·행동유전학·정신역동·행동주의·인지심리학·사회문화의 7가지 관점 || 이론적 조망 || Theoretical Perspectives || [[이론적 조망]]\n|-\n| 위협에 맞서 싸우거나 도망치는 반응 — 분노의 진화론적 설명 || Fight or Flight 반응 || fight or flight || [[이론적 조망]]\n|-\n| 원리를 탐구하는 분야 / 실생활 문제에 적용하는 분야 || 기초 학문 · 응용 학문 || basic / applied || [[심리학의 하위 분야|기초 학문·응용 학문]]\n|-\n| 심적 위기 상황에 처한 개인의 대처를 지원하는 응용 분야 || 상담심리학 || Counseling Psychology || [[상담심리학]]\n|-\n| 심리 장애를 평가·치료하는 응용 분야 || 임상심리학 || Clinical Psychology || [[심리학의 하위 분야|임상심리학]]\n|-\n| 약물 치료를 병행하는 의학 분야 || 정신의학 || Psychiatry || [[심리학의 하위 분야|정신의학]]\n|}\n\n== 1장 심리과학을 비판적으로 생각하기 (p.1–29) ==\n{|\n! 설명(슬라이드 문장) || 명칭 || 영어 || 문서\n|-\n| 결과를 알고 난 뒤, 자신이 그 결과를 예측할 수 있었다고 믿는 경향 (콜럼버스의 달걀) || '''후견 편향''' ✎ || Hindsight Bias || [[후견 편향]]\n|-\n| 실제로 아는 것보다 더 많이 안다고 믿는 경향 || '''과신''' || Overconfidence || [[과신]]\n|-\n| 전문가 예측을 수집해 80% 확신 사건의 적중률이 40% 이하임을 보인 연구자 || 테틀록 || Philip Tetlock || [[과신|테틀록]]\n|-\n| 사건을 정확하게 예측하는 극소수의 사람 || 슈퍼 예측자 || superforecaster || [[과신|슈퍼 예측자]]\n|-\n| 인지에 대한 인지, 자신의 사고 과정을 아는 능력 (Flavell) || '''메타인지''' || Metacognition || [[메타인지]]\n|-\n| 무선적인 배열을 무선적이지 않다고(패턴이 있다고) 인식 || 무선적 사건에서의 질서 지각 || perceiving order in random events || [[무선적 사건에서의 질서 지각]]\n|-\n| 개인의 신념이 객관적 사실보다 여론 형성에 더 큰 영향을 미치는 현상 || 탈진실 || Post-truth || [[탈진실]]\n|-\n| 정치 성향과 무관하게 지지 정당에 유리하도록 사실과 반대로 인식 || 정당 편향성 || partisan bias || [[탈진실]]\n|-\n| 진실보다 더 멀리, 더 빠르게 퍼지는 거짓 정보 || 가짜뉴스 (거짓뉴스) || fake news || [[탈진실의 취약성 요인|가짜뉴스]]\n|-\n| 같은 진술을 되풀이해 들을수록 진실이라 믿게 됨 (삼인성호) || 반복 || repetition || [[탈진실의 취약성 요인|반복(삼인성호)]]\n|-\n| 강렬하고 자극적인 사례가 쉽게 떠올라 위험성을 과대 추정 || 강력한 사례의 가용성 || availability of vivid cases || [[탈진실의 취약성 요인|강력한 사례의 가용성]]\n|-\n| 같은 생각을 가진 사람끼리 어울림 → 내집단/외집단 편향 || 집단 정체성 || group identity || [[탈진실의 취약성 요인|집단 정체성]]\n|-\n| 우리 편은 좋게, 다른 편은 나쁘게 보는 경향 || 내집단/외집단 편향 || ingroup/outgroup bias || [[탈진실의 취약성 요인|내집단/외집단 편향]]\n|-\n| 떠올리기 쉬운 강한 사례를 중심으로 판단하는 사고 방식 || 가용성 어림법 || Availability Heuristic || [[가용성 어림법]]\n|-\n| 인간은 정신 자원의 소모를 최소화하려 한다는 입장 || 인지적 구두쇠 || Cognitive Miser || [[인지적 구두쇠]]\n|-\n| 자신의 견해에 맞는 정보만 선택적으로 취득하는 경향 || 확증 편향 || Confirmation Bias || [[확증 편향]]\n|-\n| 이론 → 가설 → 연구 설계 → 분석 → 결과 공유의 연구 과정 || 과학적 방법 || scientific method || [[과학적 방법]]\n|-\n| 관찰을 체제화하고 행동·사건을 예측하는 원리의 통합적 설명 || 이론 || Theory || [[이론]]\n|-\n| 이론에서 도출한 검증 가능한 예측 || 가설 || Hypothesis || [[가설]]\n|-\n| 연구에서 사용하는 개념·절차를 측정 가능하게 정확히 진술 || '''조작적 정의''' ✎ || Operational Definition || [[조작적 정의]]\n|-\n| 사례 연구·자연 관찰·사회조사처럼 현상을 기술하는 방법 || 기술적 방법 || descriptive methods || [[연구 방법 비교|기술적 방법]]\n|-\n| 소수의 개인·집단을 집중 관찰하고 심층 분석 (일반화 어려움) || '''사례 연구''' || Case Study || [[사례 연구]]\n|-\n| 자연 상태의 행동을 관찰·기록, 빅데이터로 확장 || '''자연 관찰''' || Natural Observation || [[자연 관찰]]\n|-\n| 설문·인터뷰 등 자기보고식으로 많은 사람의 태도·행동을 조사 || '''사회조사''' || Survey || [[사회조사]]\n|-\n| 문항을 구성하는 어휘에 따라 응답이 달라지는 효과 || 말표현 효과 ✎ || Wording Effect || [[말표현 효과]]\n|-\n| 모집단의 구성원이 표본에 뽑힐 동등한 기회를 갖도록 뽑는 원칙 (대표성) || '''무선 표집''' || Random Sampling || [[무선 표집]]\n|-\n| 연구 대상 전체 / 실제로 자료를 수집하는 대상 || 모집단 · 표본 || population · sample || [[무선 표집]]\n|-\n| 두 변인이 함께 변하는 정도 (−1 ~ +1), 예측은 하되 인과는 아님 || 상관 || Correlation || [[상관]]\n|-\n| 실제로는 관계가 없는데 관계가 있다고 지각하는 현상 || '''착각 상관''' || Illusory Correlation || [[착각 상관]]\n|-\n| 극단적인 결과 뒤에는 평균 쪽으로 되돌아오는 경향 || 평균으로의 회귀 || Regression toward the Mean || [[평균으로의 회귀]]\n|-\n| 두 변인 모두에 영향을 주어 가짜 상관을 만드는 변인 (아이스크림–식중독의 기온) || '''제3의 변인''' || third variable || [[제3의 변인]]\n|-\n| 변인을 처치·통제해 원인과 결과를 검증하는 유일한 방법 || 실험법 || Experiment || [[실험법]]\n|-\n| 처치를 받는 집단 / 처치를 받지 않는 집단 || 실험 조건 · 통제 조건 || experimental · control condition || [[실험법|실험 조건·통제 조건]]\n|-\n| 실험에서 연구자가 조작(처치)하는 변인 || 독립변인 || independent variable || [[실험법|독립변인]]\n|-\n| 모집된 참가자를 확률에 따라 실험·통제 조건에 배정해 개인차 영향을 최소화 || '''무선 할당''' || Random Assignment || [[무선 할당]]\n|-\n| 처치를 받았다고 착각하게 만드는 조건 / 그 기대만으로 나타나는 효과 (디카페인 커피) || 가짜약 조건 · '''가짜약 효과''' (위약 효과) || Placebo Effect || [[가짜약 효과]]\n|-\n| 참가자와 실험자 모두 누가 가짜약 조건인지 모르는 절차 || '''이중 은폐''' (이중맹목) || Double-blind Procedure || [[이중 은폐]]\n|-\n| 참가 전에 연구 내용을 충분히 설명하고 동의를 받는 것 || '''고지된 동의''' || Informed Consent || [[고지된 동의]]\n|-\n| 실험 종료 후 목적·기만 여부를 상세히 설명하는 것 || '''디브리핑''' || Debriefing || [[디브리핑]]\n|-\n| 인간·동물 대상 연구의 윤리적 적합성을 사전에 검토·승인하는 기구 (영문 3글자) || '''기관 생명 윤리 위원회 (IRB)''' ✎ || Institutional Review Board || [[기관 생명 윤리 위원회]]\n|-\n| 연구 윤리의 국제 지침 (벨몬트 = 터스키기 실험 이후) || 뉘른베르크 강령 · 헬싱키 선언 · 벨몬트 보고서 || Nuremberg Code · Declaration of Helsinki · Belmont Report || [[기관 생명 윤리 위원회|연구 윤리 지침]]\n|}\n\n== 2장 마음의 생물학과 의식 ==\n{|\n! 설명(슬라이드 문장) || 명칭 || 영어 || 문서\n|-\n| 두개골의 돌출부로 심적 능력·성격을 알 수 있다는 주장 (프란츠 갈) || 골상학 || phrenology || [[2장 마음의 생물학과 의식|골상학]]\n|-\n| 뇌의 각 영역이 특정 기능을 담당한다는 생각 || 기능의 국재화 || localization of function || [[2장 마음의 생물학과 의식|기능의 국재화]]\n|-\n| 손상 후 신경망을 재조직하거나 경험으로 새 통로를 구축해 뇌가 변하는 능력 (런던 택시 운전사 해마) || '''신경 가소성''' ✎ || Neuroplasticity || [[신경 가소성]]\n|-\n| 신경 정보 시스템의 근간이 되는 세포 || 뉴런 || Neuron || [[뉴런]]\n|-\n| 생명 기전 / 신호 수신 / 전기 신호 경로 / 신호 발신 || 세포체 · 수상돌기 · 축색 · 축색 종말 || cell body · dendrite · axon · axon terminal || [[뉴런]]\n|-\n| 축색을 감싸 전달 효율을 유지하는 막 / 그것이 손상되는 질병 || 수초 / 다발성 경화증 || myelin sheath / multiple sclerosis || [[뉴런]]\n|-\n| 뉴런 안에서 축색을 따라 이동하는 전기 신호 || '''활동 전위''' || Action Potential || [[활동 전위]]\n|-\n| 휴지 상태의 뉴런, 외부 (+) 내부 (−) || 안정 전위 || resting potential || [[활동 전위|안정 전위]]\n|-\n| 양전하가 뉴런 안으로 들어와 내외부 전위차가 사라지는 현상 || 탈분극화 || depolarization || [[활동 전위|탈분극화]]\n|-\n| 활동 전위 직후 다시 발화하지 못하는 휴지기 || 불응기 || refractory period || [[활동 전위|불응기]]\n|-\n| 활동 전위를 촉발하는 최소 자극 강도 (4장: 감각 반응을 일으키는 최소 강도) || '''역치''' || Threshold || [[역치]]\n|-\n| 역치를 넘으면 완전히, 넘지 못하면 전혀 발생하지 않는 성질 || '''실무율''' || All-or-None || [[실무율]]\n|-\n| 뇌가 자극 강도를 표상하는 방식 — 강할수록 발화 횟수 증가 || 발화율 || firing rate || [[활동 전위]]\n|-\n| 뉴런 사이 간극에서 신호를 전달하는 화학 물질 || '''신경전달물질''' || Neurotransmitter || [[신경전달물질]]\n|-\n| 뉴런과 뉴런 사이의 간극 || 시냅스 || synapse || [[신경전달물질|시냅스]]\n|-\n| 과도한 신경전달물질이 방출한 뉴런으로 되돌아가는 과정 || 재흡수 || Reuptake || [[재흡수]]\n|-\n| 근육 운동·학습·기억, 퇴화하면 알츠하이머 || 아세틸콜린 (ACh) || acetylcholine || [[신경전달물질|아세틸콜린]]\n|-\n| 움직임·학습·주의·정서; 과잉 = 조현병, 부족 = 파킨슨병 || 도파민 || Dopamine || [[도파민]]\n|-\n| 기분·수면·배고픔; 부족 = 우울증 || 세로토닌 || Serotonin || [[세로토닌]]\n|-\n| 각성 제어 || 노르에피네프린 || norepinephrine || [[신경전달물질|노르에피네프린]]\n|-\n| 1차적인 흥분성 신경전달물질 || 글루타메이트 || glutamate || [[신경전달물질|글루타메이트]]\n|-\n| 대표적인 억제성 신경전달물질 (부족 = 경련·떨림·불면) || GABA || GABA || [[신경전달물질|GABA]]\n|-\n| 통증·쾌감 지각에 관여 || 엔도르핀 || endorphin || [[신경전달물질|엔도르핀]]\n|-\n| 뇌 + 척수 / 체신경계 + 자율 신경계 || 중추 신경계 · 말초 신경계 || central · peripheral nervous system || [[신경계|중추·말초 신경계]]\n|-\n| 감각 수용과 골격근의 자발적 제어 || 체신경계 || somatic nervous system || [[신경계|체신경계]]\n|-\n| 분비선과 내장 근육 제어 || 자율 신경계 || autonomic nervous system || [[신경계|자율 신경계]]\n|-\n| 각성(심박↑·소화 억제) / 이완(심박↓·소화 촉진) || 교감 신경 · 부교감 신경 || sympathetic · parasympathetic || [[신경계|교감·부교감 신경]]\n|-\n| 감각 정보를 전달 / 명령을 근육·분비선에 전달 / 둘 사이 소통 || 감각 뉴런 · 운동 뉴런 · 간뉴런 || sensory · motor · interneuron || [[신경계|감각·운동·간뉴런]]\n|-\n| 척수가 담당하는 자동적 반응 || 반사 || reflex || [[신경계|반사]]\n|-\n| 뇌의 특정 부위를 손상시켜 기능을 보는 가장 오래된 방법, 인과 추론 가능 || 손상법 || Lesion || [[손상법]]\n|-\n| 두피에서 전기 신호를 증폭·측정, 시간 해상도↑ 공간 해상도↓ || 뇌전도 (EEG) || Electroencephalogram || [[뇌전도]]\n|-\n| 전기 신호가 만든 자기장을 측정, 시간·공간 해상도 모두 높음 || 뇌자도 (MEG) || Magnetoencephalography || [[뇌전도|MEG(뇌자도)]]\n|-\n| 자극 시점을 기준으로 두피 전위 변화를 평균한 것 (N400 = 의미, P600 = 문법) || 사건 관련 전위 (ERP) || Event-Related Potential || [[사건 관련 전위]]\n|-\n| 방사성 포도당을 주입해 감마선으로 활동 핫스팟을 촬영 || PET (양전자 방출 단층촬영법) || Positron Emission Tomography || [[2장 마음의 생물학과 의식|PET]]\n|-\n| 강한 자기장으로 뇌 구조를 촬영 (활동 관찰은 어려움) || MRI (자기공명 영상) || Magnetic Resonance Imaging || [[fMRI|MRI]]\n|-\n| 혈중 산소 농도 의존(BOLD) 신호로 기능적 활동을 촬영 || fMRI (기능적 자기공명 영상) · BOLD || functional MRI || [[fMRI]]\n|-\n| 백질의 물 분자 확산으로 신경 섬유 연결 구조를 촬영 || 확산 스펙트럼 영상 (DSI) || Diffusion Spectrum Imaging || [[확산 스펙트럼 영상]]\n|-\n| 뇌에서 가장 오래된 부분, 연수 + 뇌교 || 뇌간 || Brainstem || [[뇌간]]\n|-\n| 심장 활동과 호흡 조절 / 움직임 조절·수면 제어 / 자극 필터링·각성 || 연수 · 뇌교 · 망상체 || medulla · pons · reticular formation || [[뇌간|연수·뇌교·망상체]]\n|-\n| 후각을 제외한 감각 정보를 받아 대뇌 각 감각 피질로 전달하는 관문 || '''시상''' || Thalamus || [[시상]]\n|-\n| 정교한 신체 운동·협응, 비언어적 학습·기억 || '''소뇌''' || Cerebellum || [[소뇌]]\n|-\n| 정서와 추동을 담당하는 시스템 (시상하부·뇌하수체·편도체·해마) || 변연계 || Limbic System || [[변연계]]\n|-\n| 결핍을 해결하도록 행동을 일으키는 동기적 힘 || 추동 || drive || [[변연계|추동]]\n|-\n| 공격·공포·분노 (환자 S.M) || '''편도체''' || Amygdala || [[편도체]]\n|-\n| 항상성 유지, 섭식 조절 || '''시상하부''' || Hypothalamus || [[시상하부]]\n|-\n| 신체 내적 상태를 일정하게 유지 || 항상성 || homeostasis || [[시상하부|항상성]]\n|-\n| 호르몬 분비, 변연계 구성원 || 뇌하수체 || pituitary gland || [[변연계]]\n|-\n| 의식적·명시적 기억 형성 (손상 시 새 정보 기억 곤란) || '''해마''' || Hippocampus || [[해마]]\n|-\n| 대뇌 표면, 전두엽·두정엽·측두엽·후두엽 4엽 || 대뇌 피질 || Cerebral Cortex || [[대뇌 피질]]\n|-\n| 운동·전전두 / 체감각·수학 / 청각·얼굴 / 시각 || 전두엽 · 두정엽 · 측두엽 · 후두엽 || frontal · parietal · temporal · occipital lobe || [[대뇌 피질|4엽]]\n|-\n| 전두엽 뒷부분의 운동 담당 영역 / 두정엽 앞부분의 촉감 담당 영역 || 운동 피질 · 체감각 피질 || motor · somatosensory cortex || [[대뇌 피질|운동·체감각 피질]]\n|-\n| 피질 담당 영역의 크기에 따라 그린 신체 지도 || 호문쿨루스 || homunculus || [[대뇌 피질|호문쿨루스]]\n|-\n| 감각·운동 영역을 제외한 대뇌 영역, 관찰 가능한 반응을 직접 산출하지 않음 || '''연합 영역''' || Association Area || [[연합 영역]]\n|-\n| 판단·계획·억제·사회성 (작업 기억 유지) || 전전두엽 || prefrontal cortex || [[연합 영역|전전두엽]]\n|-\n| 좌우 반구를 연결하는 신경 섬유 다리 || '''뇌량''' || Corpus Callosum || [[뇌량]]\n|-\n| 뇌량이 절단되어 두 반구가 정보를 공유하지 못하는 상태 || '''분할 뇌''' || Split Brain || [[분할 뇌]]\n|-\n| 분할 뇌 연구자 / 좌우 반구의 기능 차이 || 가자니가 / 기능의 편재화 || Gazzaniga / lateralization || [[분할 뇌|가자니가·기능의 편재화]]\n|-\n| 자기 자신과 환경에 대한 주관적 자각 || 의식 || consciousness || [[2장 마음의 생물학과 의식|의식]]\n|-\n| 자극의 일부에만 의식적 초점을 맞추는 것 || '''선택적 주의''' || Selective Attention || [[선택적 주의]]\n|-\n| 여러 말소리 중 하나의 목소리에만 주의, 자신과 관련된 정보는 걸러 들음 || '''칵테일 파티 효과''' ✎ || Cocktail Party Effect || [[칵테일 파티 효과]]\n|-\n| 주의를 기울이지 않은 시각 자극을 인지하지 못함 (Neisser & Cervone) || 부주의적 맹시 || Inattentional Blindness || [[부주의적 맹시]]\n|-\n| 장면에서 일어난 변화를 눈치채지 못함 (영화 옥의 티) || '''변화맹''' ✎ || Change Blindness || [[변화맹]]\n|-\n| 의식적(계열·신중) 경로와 무의식적(병렬·자동) 경로가 함께 개입 || '''이중 처리''' ✎ || Dual Processing || [[이중 처리]]\n|-\n| 자극을 하나씩 차례로 처리 (병렬 처리의 반대) || 계열 처리 || serial processing || [[이중 처리|계열 처리]]\n|-\n| 약 24시간 주기의 신체 리듬 || 일주기 리듬 || circadian rhythm || [[수면과 꿈|일주기 리듬]]\n|-\n| 수면의 단계 (N3 = 델타파의 깊은 수면) || N1 · N2 · N3 수면 || NREM stages || [[수면과 꿈|수면 단계]]\n|-\n| 빠른 안구 운동, 선명한 꿈, 겉은 이완·속은 각성 || REM 수면 || Rapid Eye Movement sleep || [[수면과 꿈|REM 수면]]\n|-\n| REM 수면을 박탈하면 다음 수면에서 더 빨리 REM으로 돌아감 || REM 반동 || REM rebound || [[수면과 꿈|REM 반동]]\n|-\n| 표출·잠재 내용 / 기억 공고화 / 신경 통로 유지 / 무작위 활성화를 이야기로 / 지식 반영 || 꿈 이론: 소망충족 · 정보 처리 · 생리적 기능 · 활성화-종합 · 인지 발달 || dream theories || [[수면과 꿈|꿈 이론]]\n|}\n뇌 연구 기법의 시간·공간 해상도 비교표는 [[2장 마음의 생물학과 의식|2장 메인 문서의 뇌 연구 기법 비교]]에 있다.\n\n== 3장 일생에 걸친 발달 ==\n{|\n! 설명(슬라이드 문장) || 명칭 || 영어 || 문서\n|-\n| 일생에 걸친 신체·인지·사회성 발달을 탐구하는 분야 || 발달심리학 || developmental psychology || [[3장 일생에 걸친 발달|발달심리학]]\n|-\n| 선천성과 후천성 / 연속성과 단계 / 안정성과 변화 || 발달심리학의 세 논제 || three issues || [[3장 일생에 걸친 발달|발달심리학의 세 논제]]\n|-\n| 동일 시간대에 서로 다른 연령 집단을 비교하는 연구 || 횡단 연구 || Cross-sectional Study || [[횡단 연구]]\n|-\n| 동일 집단을 시간 경과에 따라 추적하는 연구 (며칠 단위도 가능) || 종단 연구 || Longitudinal Study || [[종단 연구]]\n|-\n| 출생 이전 발달 순서 || 접합자 → 배아 → 태아 || zygote → embryo → fetus || [[3장 일생에 걸친 발달]]\n|-\n| 태아에게 해를 끼칠 수 있는 모든 물질 (알코올·니코틴·바이러스) || 테라토겐 || Teratogen || [[테라토겐]]\n|-\n| 임신 중 알코올 노출로 생기는 장애 || 태아 알코올 증후군 || fetal alcohol syndrome || [[테라토겐]]\n|-\n| 반복 자극에 대한 반응이 줄어드는 현상 (신생아 기억 연구의 창) || 습관화 || Habituation || [[습관화]]\n|-\n| 인지 발달을 감각 운동–전조작–구체적 조작–형식적 조작 4단계로 본 학자 || 피아제 || Jean Piaget || [[피아제의 인지 발달 단계|피아제]]\n|-\n| 정보를 체제화하고 해석하는 틀 || 스키마 || Schema || [[스키마]]\n|-\n| 새로운 경험을 기존 스키마로 해석 || '''동화''' || Assimilation || [[동화]]\n|-\n| 새 정보를 수용하기 위해 스키마 자체를 변화·적응 || '''조절''' ✎ || Accommodation || [[조절]]\n|-\n| 출생~2세, 감각과 행동으로 세상을 이해 || 감각 운동 단계 || Sensorimotor Stage || [[감각 운동 단계]]\n|-\n| 대상이 물리적으로 지각되지 않아도 존재함을 아는 것 (6개월 이후) || '''대상 영속성''' ✎ (대상영속성) || Object Permanence || [[대상 영속성]]\n|-\n| 위배 사건 / 개수 불일치에 더 오래 응시하는 영아의 능력 (캐런 윈) || 유아 물리학 · 유아 수학 || infant physics · math || [[감각 운동 단계|유아 물리학·유아 수학]]\n|-\n| 2~6세, 단어·이미지로 표상하지만 심적 조작은 불가 || 전조작 단계 || Preoperational Stage || [[전조작 단계]]\n|-\n| 행동 과정을 머릿속에서 상상하고 거꾸로 되돌리는 것 || 심적 조작 || mental operation || [[전조작 단계]]\n|-\n| 모양이 바뀌어도 양은 같다는 이해 (전조작기에는 결여) || '''보존 개념''' || Conservation || [[보존 개념]]\n|-\n| 타인도 자신과 같은 것을 보고 생각한다고 여기는 경향 || '''자기중심성''' || Egocentrism || [[자기중심성]]\n|-\n| 모형으로 상징적 사고를 하는 놀이 (주디 들로치) || 가상 놀이 || pretend play || [[전조작 단계|가상 놀이]]\n|-\n| 7~11세, 구체적 대상에 대한 논리적 조작·보존 이해 || 구체적 조작 단계 || Concrete Operational Stage || [[구체적 조작 단계]]\n|-\n| 12세~, 추상적·가설적 추리 || 형식적 조작 단계 || Formal Operational Stage || [[형식적 조작 단계]]\n|-\n| 아동의 마음은 사회적 환경과의 상호작용으로 성장한다고 본 학자 || 비고츠키 || Lev Vygotsky || [[비고츠키]]\n|-\n| 아동이 더 높은 수준으로 발달하도록 일시적으로 제공되는 지지틀 || '''도약대''' || Scaffolding || [[도약대]]\n|-\n| 언어를 내면화해 문제 해결에 쓰는 것 || 속내말 || inner speech || [[비고츠키|속내말]]\n|-\n| 타인과 자신의 심적 상태를 추론하는 능력, 4~5세 급발달 || '''마음 이론''' ✎ || Theory of Mind || [[마음 이론]]\n|-\n| 반창고 상자 속 연필 — 틀린 믿음 과제 (1996) || 젠킨스 & 애스팅턴 실험 || Jenkins & Astington || [[마음 이론|젠킨스 & 애스팅턴 실험]]\n|-\n| 타인과의 정서적 유대 || '''애착''' || Attachment || [[애착]]\n|-\n| 익숙한 사람과 낯선 사람을 구분해 반응 — 애착의 시작 || 낯가림 || stranger anxiety || [[애착|낯가림]]\n|-\n| 애착 대상을 잃은 아동의 지능·두뇌 발달 저하, ADHD (루마니아 아동) || 애착 박탈 || attachment deprivation || [[애착|애착 박탈]]\n|-\n| 적절한 역경을 겪은 뒤 높아지는 회복력 || 회복 탄력성 || resilience || [[애착]]\n|-\n| 아기 원숭이가 먹이 주는 철사 엄마보다 부드러운 헝겊 엄마에게 매달림 — 신체 접촉 기반 애착 || 할로우의 대리모 실험 || Harlow (1971) || [[할로우의 대리모 실험]]\n|-\n| 새끼 오리가 처음 본 움직이는 대상을 따름 — 친숙성 기반 애착 || '''각인''' ✎ || Imprinting || [[각인]]\n|-\n| 애착·인지 기능이 형성되는 민감한 시기 || 결정적 시기 || critical period || [[각인|결정적 시기]]\n|-\n| 부모와 있으면 편안, 사라지면 불안, 재회 시 접촉 시도 / 그렇지 않은 유형 || '''안정 애착 · 불안정 애착''' || secure · insecure attachment || [[안정 애착과 불안정 애착]]\n|-\n| 끊임없이 인정을 갈망, 배척 신호에 민감 || 불안 애착 || anxious attachment || [[안정 애착과 불안정 애착|불안 애착]]\n|-\n| 긴밀한 관계가 불편해 거리를 유지 || 회피 애착 || avoidant attachment || [[안정 애착과 불안정 애착|회피 애착]]\n|-\n| 부모를 훈련해 안정 애착 비율을 높인 개입 || 감수성 훈련 || sensitivity training || [[안정 애착과 불안정 애착]]\n|-\n| 세상은 예측할 수 있고 믿을 만하다는 느낌 (안정 애착을 통해 형성) || 기본 신뢰감 || Basic Trust || [[기본 신뢰감]]\n|-\n| 자녀에게 요구하되 타협으로 자녀의 의견도 수용 (높은 자존감·자율성) || '''권위적 부모''' || authoritative || [[권위적·권위주의적·허용적 양육|권위적 부모]]\n|-\n| 강압적으로 복종을 요구 (사회적 기술·자존감 저하 위험) || '''권위주의적 부모''' || authoritarian || [[권위적·권위주의적·허용적 양육|권위주의적 부모]]\n|-\n| 요구 없이 무조건 허용 (공격적·미숙) || '''허용적 부모''' || permissive || [[권위적·권위주의적·허용적 양육|허용적 부모]]\n|-\n| 요구도 반응도 없는 무관심 || 방임적 부모 || neglectful || [[권위적·권위주의적·허용적 양육|방임적 부모]]\n|-\n| 나는 누구인가에 대한 이해, 15~18개월 거울 속 빨간 점 실험 || 자기 개념 || Self-concept || [[자기 개념]]\n|-\n| 도덕 추리를 전인습–인습–후인습 수준으로 본 이론 || 콜버그의 도덕성 발달 단계 || Kohlberg || [[콜버그의 도덕성 발달 단계]]\n|-\n| 옳고 그름을 따지는 사고 || 도덕 추리 || moral reasoning || [[콜버그의 도덕성 발달 단계|도덕 추리]]\n|-\n| 처벌 회피·구체적 보상이 핵심 (9세 이전) || '''전인습적 단계''' || preconventional || [[콜버그의 도덕성 발달 단계|전인습적 단계]]\n|-\n| 사회적 인정·질서 유지가 핵심 || 인습적 단계 || conventional || [[콜버그의 도덕성 발달 단계|인습적 단계]]\n|-\n| 보편적 권리·스스로 규정한 윤리 원칙 (청소년기 이후) || 후인습적 단계 || postconventional || [[콜버그의 도덕성 발달 단계|후인습적 단계]]\n|-\n| 도덕성의 상당 부분은 이성보다 직관과 정서에 기반 (하이트) || 도덕 직관 || Moral Intuition || [[도덕 직관]]\n|-\n| 레버를 돌리는 경우 vs 직접 밀치는 경우의 판단 차이 || 트롤리 딜레마 || trolley dilemma || [[도덕 직관|트롤리 딜레마]]\n|-\n| 도덕 직관을 주장한 학자 || 하이트 || Jonathan Haidt || [[도덕 직관|하이트]]\n|-\n| 도덕적 행동을 통해 도덕적 태도를 함양 || 도덕 행위 || moral action || [[도덕 직관|도덕 행위]]\n|-\n| 일생의 단계마다 심리사회적 위기가 있다고 본 이론 || 에릭슨의 심리사회적 발달 단계 || Erikson || [[에릭슨의 심리사회적 발달 단계]]\n|-\n| 청소년기에 수립하는 자기 통합 (가장 중요한 요소 = 차별성) || 정체성 || Identity || [[정체성]]\n|-\n| 유아기(0–1세)의 위기 || 신뢰감 대 불신감 || trust vs mistrust || [[에릭슨의 심리사회적 발달 단계]]\n|-\n| 걸음마기(1–2세)의 위기 || 자율성 대 수치감·자기의심 || autonomy vs shame and doubt || [[에릭슨의 심리사회적 발달 단계]]\n|-\n| 학령 전기(3–6세)의 위기 || 선도성 대 죄책감 || initiative vs guilt || [[에릭슨의 심리사회적 발달 단계]]\n|-\n| 청소년기의 위기 || '''정체성 대 역할 혼미''' || identity vs role confusion || [[정체성|역할 혼미]]\n|-\n| 성인 초기의 위기 || 친밀감 대 소외감 || intimacy vs isolation || [[에릭슨의 심리사회적 발달 단계]]\n|-\n| 중년기의 위기 || 생산성 대 침체감 || generativity vs stagnation || [[에릭슨의 심리사회적 발달 단계]]\n|-\n| 노년기의 위기 || 통합감 대 절망감 || integrity vs despair || [[에릭슨의 심리사회적 발달 단계]]\n|-\n| 성인기의 두 측면 — 사랑 / 직업 || 친밀감 · 생산성 || intimacy · generativity || [[3장 일생에 걸친 발달|친밀감·생산성]]\n|-\n| 혀끝에서 단어가 맴돌며 떠오르지 않는 현상 (노년에 증가) || 설단 현상 || Tip-of-the-tongue || [[설단 현상]]\n|-\n| 뇌 손상으로 생기는 인지 기능 장애 / 그 대표 질환 || 신경인지장애 · 알츠하이머 || neurocognitive disorder · Alzheimer's || [[3장 일생에 걸친 발달|신경인지장애·알츠하이머]]\n|-\n| 결혼·은퇴 등 사회적 사건에 대해 문화적으로 선호되는 타이밍 || '''사회적 시계''' || Social Clock || [[사회적 시계]]\n|-\n| 낙관적 관점·지속적 대인 관계·생물학적 영향 세 요인이 모두 필요 (🎙 9/15) || 성공적 노화 || Successful Aging || [[성공적 노화]]\n|}\n\n== 4장 감각과 지각 ==\n{|\n! 설명(슬라이드 문장) || 명칭 || 영어 || 문서\n|-\n| 감각 기관이 외부 정보를 수용·표상 / 그 정보를 체제화·해석 || 감각 · 지각 || Sensation · Perception || [[감각과 지각의 구분]]\n|-\n| 감각 수용기에서 시작해 고차 인지로 올라가는 처리 || '''상향 처리''' || Bottom-up Processing || [[상향 처리]]\n|-\n| 경험과 기대를 바탕으로 감각 입력을 체계화하는 처리 || '''하향 처리''' || Top-down Processing || [[하향 처리]]\n|-\n| 풍경 그림 속 숨은 얼굴 찾기 — 정답 13개, 하향 처리의 강력한 예 || 얼굴 13개 그림 || — || [[하향 처리|얼굴 13개 그림]]\n|-\n| 감각 에너지를 뇌가 이해하는 신경 신호로 바꾸는 과정 (수용 → 변환 → 전달) || '''변환''' || Transduction || [[변환]]\n|-\n| 특정 자극을 탐지하는 비율이 0.5가 되는 자극 강도 || '''절대 역치''' || Absolute Threshold || [[절대 역치]]\n|-\n| 탐지율 0.5 미만의 강도로 제시되어 의식하지 못하는 자극 || 역치하 자극 || subliminal stimulus || [[절대 역치|역치하 자극]]\n|-\n| 앞선 자극이 관련 개념을 미리 활성화해 뒤 자극 처리에 영향 || '''점화''' || Priming || [[점화]]\n|-\n| 점화 자극을 의식하지 못하게 가리는 자극 / 점화 자극과 표적 사이 시간 간격 || 차폐 자극 · 자극 개시 비동기 (SOA) || mask · SOA || [[점화]]\n|-\n| 신호와 노이즈를 구별하는 능력과 판단 기준을 계산하는 이론 || '''신호 탐지 이론''' || Signal Detection Theory || [[신호 탐지 이론]]\n|-\n| 신호가 있을 때 \"있다\" / \"없다\" || 적중 · 놓침 || Hit · Miss || [[신호 탐지 이론|적중·놓침]]\n|-\n| 신호가 없을 때 \"있다\" / \"없다\" || 오경보 · 정기각 || False Alarm · Correct Rejection || [[신호 탐지 이론|오경보·정기각]]\n|-\n| 신호와 노이즈를 구별하는 능력 (두 분포 피크 사이 거리) || 민감도 (d′) || sensitivity || [[신호 탐지 이론|민감도]]\n|-\n| 신호라고 판단하는 기준선 (엄격 ↔ 관대) || 기준선 (편향성) || response bias || [[신호 탐지 이론|기준선(편향성)]]\n|-\n| 두 자극의 차이를 탐지할 확률이 0.5가 되는 최소 차이 || '''차이 역치''' (최소식별차이, JND) || Difference Threshold || [[차이 역치]]\n|-\n| 차이를 지각하려면 현재 자극의 일정 비율만큼 변해야 한다 (100 → 110 → 121kg) || '''베버의 법칙''' || Weber's Law || [[베버의 법칙]]\n|-\n| 같은 자극이 반복되면 수용 기관의 민감도가 감소 (후각이 가장 빠름) || '''감각 순응''' ✎ || Sensory Adaptation || [[감각 순응]]\n|-\n| 경험에 근거해 특정 지각에 대해 형성되는 기대 (로고 봉투 감자튀김) || '''지각 갖춤새''' ✎ || Perceptual Set || [[지각 갖춤새]]\n|-\n| 연속된 말소리에서 단어의 시작과 끝을 구분하는 능력 || 말 분절 || speech segmentation || [[지각 갖춤새|말 분절]]\n|-\n| 앞에 본 그림(귀부인/할머니)에 따라 다르게 해석되는 그림 || 중의적 그림 || ambiguous figure || [[지각 갖춤새|중의적 그림]]\n|-\n| 기대·주의에 따라 통증이 달라짐 (부상병, VR 게임) || 통증 지각 || pain perception || [[지각 갖춤새|통증 지각]]\n|-\n| 감각 정보가 대뇌로 직접 전달된다는 상향 중심의 통증 모형 (부상병 관찰이 반박) || 직접 경로 모형 || direct pathway model || [[지각 갖춤새]]\n|-\n| 누락된 소리를 문장 맥락으로 복원해 듣는 현상 (eel is on the wagon) || 음소 복원 효과 || Phonemic Restoration || [[음소 복원 효과]]\n|-\n| 문화·동기(갈증)·정서(슬픈 음악)에 따라 같은 자극이 다르게 지각됨 || 맥락·동기·정서와 지각 || context · motivation · emotion || [[맥락·동기·정서와 지각]]\n|-\n| 빛이 통과하는 구멍 / 동공 크기를 조절하는 근육 || 동공 · 홍채 || pupil · iris || [[눈의 구조|동공·홍채]]\n|-\n| 빛의 굴절을 조절하는 렌즈 || 수정체 || lens || [[눈의 구조|수정체]]\n|-\n| 상이 맺히고 간상체·원추체가 있는 막 / 상이 가장 선명한 곳 || 망막 · 중심와 || retina · fovea || [[눈의 구조|망막·중심와]]\n|-\n| 시신경이 빠져나가 상이 맺히지 않는 곳 / 신경 신호를 대뇌로 보내는 신경 || 맹점 · 시신경 || blind spot · optic nerve || [[눈의 구조|맹점·시신경]]\n|-\n| 굴절력이 약해 상이 망막 뒤에 / 강해서 망막 앞에 || 원시 · 근시 || hyperopia · myopia || [[눈의 구조|원시·근시]]\n|-\n| 색·세부 탐지, 망막 중앙, 약 600만 개, 두뇌로 가는 핫라인 || 원추체 || Cone || [[원추체와 간상체]]\n|-\n| 약한 빛에서 밝기 탐지, 망막 주변, 약 1억 2천만 개, 신호 합산 || 간상체 || Rod || [[원추체와 간상체]]\n|-\n| 광수용기 신호를 시신경 쪽으로 전달하는 세포 || 양극세포 || bipolar cell || [[원추체와 간상체|양극세포]]\n|-\n| 어둠에 적응해 형체를 식별하게 되는 것 (간상체) || 암순응 || dark adaptation || [[원추체와 간상체|암순응]]\n|-\n| 후두엽에서 시각 정보를 처리하는 영역 || 시각 피질 || visual cortex || [[대뇌 피질|시각 피질]]\n|-\n| 각도·움직임 등 특정 자질에만 반응하는 뉴런 || '''자질 탐지기''' || Feature Detector || [[자질 탐지기]]\n|-\n| 얼굴 재인을 담당하는 측두엽 영역 || 방추상 얼굴 영역 (FFA) || Fusiform Face Area || [[방추상 얼굴 영역]]\n|-\n| 얼굴을 알아보지 못하는 증상 (FFA 손상) || 얼굴실인증 || prosopagnosia || [[방추상 얼굴 영역|얼굴실인증]]\n|-\n| 장소·공간 이미지에 반응하는 영역 || 해마곁 장소 영역 (PPA) || Parahippocampal Place Area || [[방추상 얼굴 영역|PPA]]\n|-\n| 특정 뇌 영역에 자기장 자극을 주어 기능을 일시 방해 (FFA → 얼굴 재인 저하) || 경두개 자기장 자극술 (TMS) || Transcranial Magnetic Stimulation || [[방추상 얼굴 영역]]\n|-\n| 색·운동·형태·깊이 등 여러 하위 차원을 동시에 처리 || 병렬 처리 || Parallel Processing || [[병렬 처리]]\n|-\n| 하나의 대상을 여러 영역이 합작해 표상 || 분산 표상 || distributed representation || [[병렬 처리]]\n|-\n| 전체는 부분의 합 이상 — 타고난 조직화 원리 (Wertheimer) || '''게슈탈트 심리학''' || Gestalt Psychology || [[게슈탈트 심리학]]\n|-\n| 두 가지 방향으로 번갈아 보이는 정육면체 선 그림 || 네커 육면체 || Necker cube || [[게슈탈트 심리학|네커 육면체]]\n|-\n| 대상(전경)을 주변(배경)과 분리해 지각, 가역적 || 전경-배경 || Figure-Ground || [[전경-배경]]\n|-\n| 전경을 의미 있는 형태로 조직화하는 원리 || 집단화 || Grouping || [[집단화]]\n|-\n| 가까이 있는 것끼리 묶어 지각 || 근접성 || proximity || [[집단화|근접성]]\n|-\n| 부드럽게 이어진 패턴을 하나로 지각 (오륜기) || 연속성 || continuity || [[집단화|연속성]]\n|-\n| 끊어진 부분을 메워 완전한 형태로 지각 || 폐쇄 || closure || [[집단화|폐쇄]]\n|-\n| 2차원 망막 상을 만든 3차원 근원 물체가 여럿일 수 있다는 문제 || 역투사의 문제 || Inverse Projection Problem || [[역투사의 문제]]\n|-\n| 2차원 상에서 3차원 거리를 지각 || 깊이 지각 || Depth Perception || [[깊이 지각]]\n|-\n| 6–14개월 유아가 유리판 아래 낭떠러지를 건너지 않음 (깁슨 & 워크, 1960) || 시각 절벽 || visual cliff || [[깊이 지각|시각 절벽]]\n|-\n| 두 눈이 있어야 쓸 수 있는 깊이 단서 (망막 부등·수렴) || '''양안 단서''' || Binocular Cue || [[양안 단서]]\n|-\n| 두 망막에 맺힌 상의 차이 — 클수록 가깝다 (볼펜 끝 맞추기) || '''망막 부등''' ✎ || Retinal Disparity || [[망막 부등]]\n|-\n| 가까운 물체를 볼 때 두 눈이 이루는 내각 || '''수렴''' || convergence || [[양안 단서|수렴]]\n|-\n| 한 눈만으로도 쓸 수 있는 깊이 단서 || 단안 단서 || Monocular Cue || [[단안 단서]]\n|-\n| 가리는 쪽이 가깝다 / 가까울수록 빨리 움직인다 / 높이 있을수록 멀다 || 중첩 · 상대적 운동 · 상대적 높이 || interposition · relative motion · relative height || [[단안 단서|중첩·상대적 운동·상대적 높이]]\n|-\n| 평행선이 멀리서 한 점으로 모인다 / 작은 상이 더 멀다 || 선형 조망 · 상대적 크기 || linear perspective · relative size || [[단안 단서|선형 조망·상대적 크기]]\n|-\n| 움직임에 따라 투영 모양이 바뀌어도 같은 사물로 지각 || 모양 항등성 || Shape Constancy || [[모양 항등성]]\n|-\n| 수평선 근처의 달이 더 크게 보임 / 정지 영상에서 움직임을 지각 || 달 착시 · 움직임 지각 || moon illusion · motion perception || [[4장 감각과 지각|달 착시·움직임 지각]]\n|-\n| 한 감각이 다른 감각에 영향을 줌 (미각–후각) || 감각 상호작용 || sensory interaction || [[맥거크 효과|감각 상호작용]]\n|-\n| 입모양(시각)과 소리(청각)가 다를 때 제3의 소리를 지각 (가 + 바 → 다) || 맥거크 효과 ✎ || McGurk Effect || [[맥거크 효과]]\n|-\n| 신체 감각 회로와 인지 회로의 상호작용 (따뜻한 커피 → 우호적 평가) || 체화 인지 || Embodied Cognition || [[체화 인지]]\n|-\n| 한 감각 자극이 다른 감각 경험을 함께 일으킴 (숫자 → 색) || '''공감각''' || Synesthesia || [[공감각]]\n|-\n| 감각 입력 없이 지각이 일어난다는 주장 (텔레파시·천리안·예지) || '''초감각지각 (ESP)''' || Extrasensory Perception || [[초감각지각]]\n|}\n\n== 5장 학습 ==\n{|\n! 설명(슬라이드 문장) || 명칭 || 영어 || 문서\n|-\n| 경험에 따른 유기체 행동의 영속적 변화 || 학습 || Learning || [[학습]]\n|-\n| 연합을 쓰지 않는 학습 (민감화·둔감화) / 두 사건을 연결하는 학습 (조건화) / 관찰·언어로 배우는 학습 || 비연합 학습 · 연합 학습 · 인지 학습 || non-associative · associative · cognitive learning || [[학습|비연합·연합·인지 학습]]\n|-\n| 두 사건·자극을 서로 연결 || 연합 || association || [[학습|연합]]\n|-\n| 자극에 대한 행동 반응 빈도가 증대 || '''민감화''' || Sensitization || [[민감화]]\n|-\n| 같은 자극에 반복 노출되어 반응 빈도가 감소 (5장 슬라이드 표기) || '''둔감화''' || Habituation || [[습관화|둔감화]]\n|-\n| 무관한 두 자극을 연합해 미래 사건을 예측하는 학습 || '''고전적 조건화''' || Classical Conditioning || [[고전적 조건화]]\n|-\n| 개의 먹이–종소리 실험으로 고전적 조건화를 밝힌 학자 || 파블로프 || Ivan Pavlov || [[파블로프]]\n|-\n| 조건형성 전에는 반응을 유발하지 않는 자극 || '''중성 자극 (NS)''' || Neutral Stimulus || [[중성 자극]]\n|-\n| 학습 없이 자연스럽고 자동적인 반응을 촉발하는 자극 || '''무조건 자극 (US)''' || Unconditioned Stimulus || [[무조건 자극]]\n|-\n| 중성 자극이 무조건 자극과 연합되어 반응을 일으키게 된 자극 || '''조건 자극 (CS)''' || Conditioned Stimulus || [[조건 자극]]\n|-\n| 무조건 자극에 대한 자연스러운 반응 || '''무조건 반응 (UR)''' || Unconditioned Response || [[무조건 반응]]\n|-\n| 조건 자극에 대해 학습으로 나타나는 반응 || '''조건 반응 (CR)''' || Conditioned Response || [[조건 반응]]\n|-\n| NS와 US를 연합해 조건 반응을 형성하는 단계 || 획득 || acquisition || [[고전적 조건화|획득]]\n|-\n| 이미 형성된 조건 자극을 다른 중성 자극과 연합해 조건화 || 고차 조건형성 ✎ || Higher-order Conditioning || [[고차 조건형성]]\n|-\n| 무조건 자극 없이 조건 자극만 반복 → 조건 반응 감소 (억압) || '''소거''' || Extinction || [[소거]]\n|-\n| 휴지 기간 후 소거된 조건 반응이 부분적으로 다시 나타남 || '''자발적 회복''' ✎ || Spontaneous Recovery || [[자발적 회복]]\n|-\n| 조건 자극과 유사한 자극에도 조건 반응 (자라 보고 놀란 가슴) || '''일반화''' || Generalization || [[일반화]]\n|-\n| 조건 자극과 무관한 자극을 구분해 반응하지 않음 || '''변별''' || Discrimination || [[변별]]\n|-\n| 공포 상황에 반복 노출해 소거 기제로 치료 / 단서·맥락을 바꿔 중독 갈망을 치료 || 반복 노출 치료법 · 갈망 치료 || exposure therapy · craving treatment || [[고전적 조건화|반복 노출 치료법]]\n|-\n| 반응을 그 결과(강화·처벌)와 연합하는 학습 (슬라이드 \"Operational\" 은 오기) || 조작적 조건화 || Operant Conditioning || [[조작적 조건화]]\n|-\n| 보상이 뒤따르는 행동은 증가, 처벌이 뒤따르는 행동은 감소 || '''효과의 법칙''' || Law of Effect || [[효과의 법칙]]\n|-\n| 고양이 문제상자에서 탈출 시간이 줄어듦을 보인 학자 (1898) || 손다이크 · 고양이 상자 || Thorndike · puzzle box || [[효과의 법칙|손다이크·고양이 상자]]\n|-\n| 효과의 법칙을 행동 공학으로 발전시킨 학자 || 스키너 || B. F. Skinner || [[스키너]]\n|-\n| 쥐가 레버를 누르면 먹이가 나오는 실험 장치 || 스키너 상자 || Skinner Box || [[스키너 상자]]\n|-\n| 행동을 강력하게(더 자주) 만드는 사건·자극 || 강화 || Reinforcement || [[강화]]\n|-\n| 보상·처벌로 행동을 원하는 방향으로 유도 || '''행동 조성''' || Shaping || [[행동 조성]]\n|-\n| 최종 목표 행동에 이르는 이전 단계 행동들에 적절한 보상을 주며 목표에 다가가게 함 || '''계기적 근사법''' ✎ || Successive Approximation || [[계기적 근사법]]\n|-\n| 보상을 제공해 행동 빈도를 증가 || '''정적 강화''' || Positive Reinforcement || [[정적 강화]]\n|-\n| 혐오 자극을 제거해 행동 빈도를 증가 (약물 금단 제거) || '''부적 강화''' ✎ || Negative Reinforcement || [[부적 강화]]\n|-\n| 생물학적 욕구를 충족하는 생득적 강화물 (음식·물) || 1차 강화물 || primary reinforcer || [[조건 강화물|1차 강화물]]\n|-\n| 1차 강화물과 연합되어 강화력을 획득한 자극 (돈·칭찬) || 조건 강화물 (이차 강화물) || conditioned reinforcer || [[조건 강화물]]\n|-\n| 행동 직후 제공 / 일정 시간 뒤 제공 || 즉시 강화물 · 지연 강화물 || immediate · delayed reinforcer || [[조건 강화물|즉시·지연 강화물]]\n|-\n| 만족 지연 능력이 추후 성취와 관련됨을 보인 실험 (Mischel) || 마쉬멜로 실험 || marshmallow test || [[조건 강화물|마쉬멜로 실험]]\n|-\n| 언제·얼마나 자주 강화하는가의 규칙 || 강화 계획 || Reinforcement Schedule || [[강화 계획]]\n|-\n| 반응할 때마다 강화 / 일부 반응에만 강화 (학습 느림·소거 저항↑) || 연속 강화계획 · 부분(간헐적) 강화계획 || continuous · partial || [[강화 계획|연속·부분 강화계획]]\n|-\n| 고정된 수의 반응 후 강화 (커피 쿠폰 10회 1잔) || 고정비율 계획 || fixed-ratio || [[강화 계획|고정비율]]\n|-\n| 랜덤한 수의 반응 후 강화, 소거가 잘 안 됨 (슬롯머신·낚시) || 변동비율 계획 || variable-ratio || [[강화 계획|변동비율]]\n|-\n| 고정된 시간 경과 후 강화, 시점 직전 반응 급증 (정기 할인) || 고정간격 계획 || fixed-interval || [[강화 계획|고정간격]]\n|-\n| 가변적인 시간 경과 후 강화, 느리지만 꾸준 (SNS 좋아요 알림) || 변동간격 계획 || variable-interval || [[강화 계획|변동간격]]\n|-\n| 행동 빈도를 감소시키는 기제 || 처벌 || Punishment || [[처벌]]\n|-\n| 혐오 자극을 가해 행동을 감소 || '''정적 처벌''' (제1유형) || positive punishment || [[처벌|정적 처벌]]\n|-\n| 보상을 철회해 행동을 감소 || '''부적 처벌''' (제2유형) || negative punishment || [[부적 처벌]]\n|-\n| 관심(강화물)에서 잠시 배제해 문제 행동을 줄임 || 타임 아웃 || time-out || [[부적 처벌|타임 아웃]]\n|-\n| 다른 개체의 행동을 관찰·모방해 학습 (사회학습) || '''관찰 학습''' || Observational Learning || [[관찰 학습]]\n|-\n| 타인의 행동을 보고 따라 함 || 모델링 || modeling || [[관찰 학습|모델링]]\n|-\n| 관찰 대상이 받는 강화·처벌을 보고 행동이 늘거나 줆 || 대리 강화 · 대리 처벌 || vicarious reinforcement · punishment || [[관찰 학습|대리 강화·대리 처벌]]\n|-\n| 친사회적 행동의 모방 / 반사회적 행동의 모방 || 친사회적 영향 · 반사회적 영향 || prosocial · antisocial effects || [[관찰 학습|친사회적·반사회적 영향]]\n|-\n| 어른의 불필요한 행동까지 따라 함 || 과잉 모방 || over-imitation || [[관찰 학습]]\n|-\n| 성인 모델이 인형을 때리는 것을 본 아동이 그대로 모방 (Bandura et al., 1961) || 오뚝이 실험 (보보 인형 실험) || Bobo doll experiment || [[오뚝이 실험]]\n|-\n| 오뚝이 실험의 연구자 || 반두라 || Albert Bandura || [[오뚝이 실험|반두라]]\n|-\n| 행동을 수행할 때뿐 아니라 타인의 같은 행동을 관찰할 때도 활성화되는 전두엽 뉴런 || '''거울 뉴런''' || Mirror Neuron || [[거울 뉴런]]\n|-\n| 원숭이 거울 뉴런을 발견한 연구자 || 리졸라티 || Giacomo Rizzolatti || [[거울 뉴런|리졸라티]]\n|-\n| 긍정적 결과만 출판되어 메타분석이 왜곡되는 현상 (게임–폭력 상관) || 출간 편향 || publication bias || [[5장 학습]]\n|}\n\n== 6장 기억 ==\n{|\n! 설명(슬라이드 문장) || 명칭 || 영어 || 문서\n|-\n| 시간이 지나도 지속되는 학습·저장·인출된 정보 || 기억 || Memory || [[6장 기억|기억]]\n|-\n| 이전에 학습한 항목을 직접 생성해 떠올림 (단서 없이 / 단서를 주고) || 회상 (자유 회상 · 단서 회상) || Recall || [[회상]]\n|-\n| 이전에 학습한 항목인지 확인 (신/구 반응) || 재인 || Recognition || [[재인]]\n|-\n| 같은 내용을 다시 배울 때 습득이 얼마나 빨라지는지(절약)로 기억 측정 || 재학습 · 절약 || relearning · savings || [[망각 곡선|재학습]]\n|-\n| 재학습 시간을 기반으로 그린 기억 감소 곡선 (에빙하우스) || 망각 곡선 (파지 곡선) || forgetting curve || [[망각 곡선]]\n|-\n| 감각 → 단기/작업 → 장기의 3단계로 기억을 설명한 모형 (1968) || '''앳킨슨-시프린 모형''' (다중 저장고 모형 · 정보처리 모형) || Atkinson-Shiffrin Model || [[앳킨슨-시프린 모형]]\n|-\n| 정보를 넣기 / 유지하기 / 꺼내기 || 부호화 · 저장 · 인출 || encoding · storage · retrieval || [[앳킨슨-시프린 모형|부호화·저장·인출]]\n|-\n| 매우 짧은 감각 기록 — 0.5~1초, 3~4개 || 감각 기억 || Sensory Memory || [[감각 기억]]\n|-\n| 청각 감각 기억 || 반향 기억 || echoic memory || [[감각 기억|반향 기억]]\n|-\n| 정보를 짧게 유지 — 약 12초, 7±2 || 단기 기억 || Short-term Memory || [[단기 기억]]\n|-\n| 반영속적 저장소 || 장기 기억 || Long-term Memory || [[앳킨슨-시프린 모형|장기 기억]]\n|-\n| 정보를 저장할 뿐 아니라 적극적으로 처리하는 확장된 단기 기억 (Baddeley & Hitch, 1974) || '''작업 기억''' || Working Memory || [[작업 기억]]\n|-\n| 주의 분배, 장기 기억 인출, 하위 시스템 조정 || '''중앙 집행기''' ✎ || Central Executive || [[중앙 집행기]]\n|-\n| 시각 심상을 기반으로 정보를 유지 || '''시공간 잡기장''' || Visuospatial Sketchpad || [[작업 기억|시공간 잡기장]]\n|-\n| 음운 저장소 + 조음 되뇌기로 소리 정보 유지 || '''음운 루프''' || Phonological Loop || [[음운 루프]]\n|-\n| 소리 정보 보관 / 속으로 되뇌어 쇠잔 방지 || 음운 저장소 · 조음 되뇌기 || phonological store · articulatory rehearsal || [[음운 루프|음운 저장소·조음 되뇌기]]\n|-\n| 현재 자극이 N번 전 자극과 같은지 판단해 작업 기억을 측정 || N-Back 과제 || N-back task || [[작업 기억|N-Back 과제]]\n|-\n| 작업 기억 모형을 제안한 연구자 || 배들리 || Alan Baddeley || [[작업 기억|배들리]]\n|-\n| 의식적 자각 없이 자동으로 일어나는 부호화 / 주의·자각이 필요한 부호화 || 자동 처리 · 통제 처리 || automatic · controlled processing || [[자동 처리와 통제 처리]]\n|-\n| 의식 없이 처리되어 말로 기술하기 어려운 기억 || '''암묵 기억''' || Implicit Memory || [[암묵 기억]]\n|-\n| 자전거 타기처럼 행동 수행 과정에 대한 기억 (기저 신경절) || 절차 기억 || procedural memory || [[암묵 기억|절차 기억]]\n|-\n| 의식적으로 자각하고 말로 서술할 수 있는 기억 || '''외현 기억''' || Explicit Memory || [[외현 기억]]\n|-\n| 개인적 경험·사건의 기억 / 지식 정보의 기억 || 일화 기억 · 의미 기억 || episodic · semantic memory || [[외현 기억|일화·의미 기억]]\n|-\n| 3×3 글자를 잠깐 보여 주고 소리 단서로 한 줄만 보고하게 한 실험 (1960) || 스펄링 실험 || Sperling || [[스펄링 실험]]\n|-\n| 9개 전부 / 소리 단서로 지정한 한 줄 / 단서를 늦게 줌 || 전체 보고법 · 부분 보고법 · 지연 보고법 || whole · partial · delayed report || [[스펄링 실험|전체·부분·지연 보고법]]\n|-\n| 철자 3개 외운 뒤 3씩 빼기로 되뇌기를 막아 단기 기억 유지 시간(약 12초) 측정 (1959) || 피터슨과 피터슨 실험 || Peterson & Peterson || [[피터슨과 피터슨 실험]]\n|-\n| 단기 기억 용량은 7±2개 (슬라이드 \"72개\" 는 오기) || '''매직 넘버 7''' || Magical Number Seven || [[매직 넘버 7]]\n|-\n| 매직 넘버 7을 제안한 학자 (1956) / 단기 기억 용량을 재는 과제 || 조지 밀러 · 숫자 폭 과제 || George Miller · digit span || [[매직 넘버 7|조지 밀러·숫자 폭 과제]]\n|-\n| 정보를 의미 있는 단위로 묶어 단기 기억 용량보다 많이 저장 || '''청크화''' || Chunking || [[청크화]]\n|-\n| 보조 수단을 활용한 암기법 / 구체어가 추상어보다 잘 기억됨 / 층위별로 분류해 저장 || 기억술 · 구체성 효과 · 위계 구성 || mnemonics · concreteness · hierarchies || [[6장 기억|기억술·위계 구성]]\n|-\n| 학습 시점을 나누어 분산하면 기억이 오래 유지 || '''간격두기 효과''' || Spacing Effect || [[간격두기 효과]]\n|-\n| 공부 시간을 몰지 말고 나누어 하는 학습법 (서막 p.28 학습 팁) || 분산 학습 || distributed practice || [[간격두기 효과|분산 학습]]\n|-\n| 퀴즈·모의고사처럼 인출을 연습하면 단순 반복보다 기억이 오래 유지 || '''검증 효과''' ✎ || Testing Effect || [[검증 효과]]\n|-\n| 학습한 내용을 강건한 장기 기억 형태로 변환 (해마, 수면) || 기억 응고화 || Memory Consolidation || [[기억 응고화]]\n|-\n| 형태·소리 위주 처리 / 의미 위주 처리 — 깊을수록 잘 기억 (Craik & Tulving) || 처리 수준 (얕은 처리 · 깊은 처리) || levels of processing || [[처리 수준]]\n|-\n| 자신과 연관 지어 처리하면 회상이 향상 || '''자기참조 효과''' || Self-reference Effect || [[자기참조 효과]]\n|-\n| 기억은 한 곳이 아니라 여러 영역에 분산된다고 본 학자 (1950) || 래슐리 || Karl Lashley || [[6장 기억|래슐리]]\n|-\n| 절차 기억 형성을 담당하는 뇌 구조 || 기저 신경절 || basal ganglia || [[암묵 기억]]\n|-\n| 정서적으로 중대한 사건에 대한 선명하고 확신도 높은 기억 (편도체) || 섬광 기억 || Flashbulb Memory || [[섬광 기억]]\n|-\n| 인출을 돕는 추가 자극 || 인출 단서 || Retrieval Cue || [[인출 단서]]\n|-\n| 특정 기억에 국한된 단서·맥락이 회상에 가장 효과적 || 부호화 명세성 원리 || Encoding Specificity Principle || [[부호화 명세성 원리]]\n|-\n| 부호화 때와 비슷한 외부 환경에서 더 잘 인출 (물속 학습–물속 회상) || 맥락 의존 기억 || context-dependent memory || [[맥락 의존 기억과 상태 의존 기억]]\n|-\n| 현재 기분과 일치하는 기억을 더 잘 회상 || 상태 의존 기억 (기분 부합 기억) || state-dependent · mood-congruent || [[맥락 의존 기억과 상태 의존 기억|상태 의존 기억]]\n|-\n| 목록의 처음과 끝을 잘 기억하는 U자 패턴 || '''계열 위치 효과''' || Serial Position Effect || [[계열 위치 효과]]\n|-\n| 목록 초반을 잘 기억 (되뇌기 여유) / 목록 마지막을 잘 기억 (단기/작업 기억) || '''초두 효과 · 최신 효 // ===== SimEngine =====
// ============================================================
// SimEngine — 단계별 시뮬레이터 공용 실행기 (CONTRACT §6)
// 순수 DOM. 외부 라이브러리 없음.
// 각 sim 파일은 SIMS["이름"] = { title, desc, options, build(opts) } 만 제공.
// ============================================================
(function (global) {
  "use strict";

  global.SIMS = global.SIMS || {};

  var SPEEDS = [
    { value: "500", label: "0.5초" },
    { value: "1000", label: "1초" },
    { value: "2000", label: "2초" }
  ];

  // 마지막으로 클릭/포커스된 sim 인스턴스 (키보드 ← → 대상)
  var focused = null;
  var keyboardBound = false;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  function fmtValue(v) {
    if (v === null || v === undefined) return "–";
    if (Array.isArray(v)) return "[" + v.map(fmtValue).join(", ") + "]";
    if (typeof v === "boolean") return v ? "true" : "false";
    return String(v);
  }

  function sameValue(a, b) {
    return fmtValue(a) === fmtValue(b);
  }

  // 설명 문자열을 인라인 위키 문법으로 렌더 (renderer.js 의 inlineFormat 재사용)
  function fmtDesc(s) {
    if (s === undefined || s === null) s = "";
    if (typeof global.inlineFormat === "function") {
      try { return global.inlineFormat(String(s)); } catch (e) { /* fall through */ }
    }
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function bindKeyboard() {
    if (keyboardBound) return;
    keyboardBound = true;
    document.addEventListener("keydown", function (e) {
      if (!focused || !focused.root || !focused.root.isConnected) return;
      var t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) {
        if (t.className !== "sim-range") return;
      }
      if (e.key === "ArrowLeft") { focused.go(focused.idx - 1); e.preventDefault(); }
      else if (e.key === "ArrowRight") { focused.go(focused.idx + 1); e.preventDefault(); }
    });
  }

  // ------------------------------------------------------------
  // 인스턴스
  // ------------------------------------------------------------
  function Sim(root, name, spec) {
    this.root = root;
    this.name = name;
    this.spec = spec;
    this.opts = {};
    this.idx = 0;
    this.trace = null;
    this.timer = null;
    this.speed = 1000;
    this.lineNodes = {};   // panelId -> [lineEl]
    this.panelNodes = {};  // panelId -> { wrap, code, badge }
  }

  Sim.prototype.defaultOpts = function () {
    var o = {};
    (this.spec.options || []).forEach(function (opt) {
      if (opt.values && opt.values.length) o[opt.key] = opt.values[0].value;
    });
    return o;
  };

  Sim.prototype.render = function () {
    var self = this;
    var spec = this.spec;
    var root = this.root;
    root.innerHTML = "";
    root.classList.add("sim");
    if (!root.hasAttribute("tabindex")) root.setAttribute("tabindex", "0");

    root.addEventListener("mousedown", function () { focused = self; });
    root.addEventListener("focusin", function () { focused = self; });

    // 헤더
    var head = el("div", "sim-head");
    head.appendChild(el("div", "sim-title", spec.title || this.name));
    if (spec.desc) {
      var sub = el("div", "sim-subtitle");
      sub.innerHTML = fmtDesc(spec.desc);   // [[링크]] 등 인라인 위키 문법 허용
      head.appendChild(sub);
    }
    root.appendChild(head);

    var body = el("div", "sim-body");
    root.appendChild(body);

    // 옵션
    if (spec.options && spec.options.length) {
      var optBar = el("div", "sim-opts");
      spec.options.forEach(function (opt) {
        var wrap = el("span", "sim-opt");
        var lab = el("label", null, opt.label || opt.key);
        lab.setAttribute("for", "");
        wrap.appendChild(lab);
        var sel = el("select");
        (opt.values || []).forEach(function (v) {
          var o = el("option", null, v.label !== undefined ? v.label : v.value);
          o.value = v.value;
          sel.appendChild(o);
        });
        sel.value = self.opts[opt.key];
        sel.addEventListener("change", function () {
          self.opts[opt.key] = sel.value;
          self.stop();
          self.rebuild();
          self.go(0);
        });
        wrap.appendChild(sel);
        optBar.appendChild(wrap);
      });
      body.appendChild(optBar);
    }

    // 컨트롤
    var ctrl = el("div", "sim-ctrl");
    this.btnFirst = el("button", "sim-btn", "⏮");
    this.btnPrev = el("button", "sim-btn", "◀");
    this.btnNext = el("button", "sim-btn", "▶");
    this.btnLast = el("button", "sim-btn", "⏭");
    this.btnPlay = el("button", "sim-btn", "▶ 자동");
    [this.btnFirst, this.btnPrev, this.btnNext, this.btnLast, this.btnPlay].forEach(function (b) {
      b.type = "button";
      ctrl.appendChild(b);
    });
    this.btnFirst.title = "처음";
    this.btnPrev.title = "이전 (←)";
    this.btnNext.title = "다음 (→)";
    this.btnLast.title = "마지막";

    var speedSel = el("select", "sim-speed");
    SPEEDS.forEach(function (s) {
      var o = el("option", null, s.label);
      o.value = s.value;
      speedSel.appendChild(o);
    });
    speedSel.value = String(this.speed);
    speedSel.addEventListener("change", function () {
      self.speed = parseInt(speedSel.value, 10) || 1000;
      if (self.timer) { self.stop(); self.play(); }
    });
    ctrl.appendChild(speedSel);

    this.range = el("input", "sim-range");
    this.range.type = "range";
    this.range.min = "0";
    this.range.step = "1";
    this.range.addEventListener("input", function () {
      self.stop();
      self.go(parseInt(self.range.value, 10) || 0);
    });
    ctrl.appendChild(this.range);

    this.counter = el("span", "sim-count", "0 / 0");
    ctrl.appendChild(this.counter);
    body.appendChild(ctrl);

    this.btnFirst.addEventListener("click", function () { self.stop(); self.go(0); });
    this.btnPrev.addEventListener("click", function () { self.stop(); self.go(self.idx - 1); });
    this.btnNext.addEventListener("click", function () { self.stop(); self.go(self.idx + 1); });
    this.btnLast.addEventListener("click", function () { self.stop(); self.go(self.trace.steps.length - 1); });
    this.btnPlay.addEventListener("click", function () { self.timer ? self.stop() : self.play(); });

    // 동적 영역
    this.panelsBox = el("div", "sim-panels");
    body.appendChild(this.panelsBox);
    this.varsBox = el("div", "sim-varsbox");
    body.appendChild(this.varsBox);
    this.descBox = el("div", "sim-descbox");
    body.appendChild(this.descBox);
    this.noteBox = el("div", "sim-note");
    this.noteBox.style.display = "none";
    body.appendChild(this.noteBox);
    this.svgBox = el("div", "sim-svgbox");
    body.appendChild(this.svgBox);
    var hint = el("div", "sim-hint", "클릭 후 ← → 키로 단계 이동");
    body.appendChild(hint);
  };

  Sim.prototype.rebuild = function () {
    this.trace = this.spec.build(JSON.parse(JSON.stringify(this.opts))) || { panels: [], vars: [], steps: [] };
    this.trace.panels = this.trace.panels || [];
    this.trace.vars = this.trace.vars || [];
    this.trace.steps = this.trace.steps || [];
    this.buildPanels();
    this.buildVars();
    this.range.max = String(Math.max(0, this.trace.steps.length - 1));
  };

  Sim.prototype.buildPanels = function () {
    var self = this;
    this.panelsBox.innerHTML = "";
    this.lineNodes = {};
    this.panelNodes = {};
    this.trace.panels.forEach(function (p) {
      var wrap = el("div", "sim-panel");
      var ph = el("div", "sim-panel-head");
      ph.appendChild(el("span", null, p.title || p.id));
      var badge = el("span", "sim-badge", "");
      badge.style.display = "none";
      ph.appendChild(badge);
      wrap.appendChild(ph);

      var code = el("div", "sim-code");
      var nodes = [];
      (p.lines || []).forEach(function (src, i) {
        var ln = el("div", "sim-line");
        var mark = el("span", "sim-mark", " ");
        var num = el("span", "sim-ln", String(i + 1));
        var txt = el("span", "sim-src", src);
        ln.appendChild(mark);
        ln.appendChild(num);
        ln.appendChild(txt);
        code.appendChild(ln);
        nodes.push(ln);
      });
      wrap.appendChild(code);
      self.panelsBox.appendChild(wrap);
      self.lineNodes[p.id] = nodes;
      self.panelNodes[p.id] = { wrap: wrap, code: code, badge: badge };
    });
  };

  Sim.prototype.buildVars = function () {
    var self = this;
    this.varsBox.innerHTML = "";
    if (!this.trace.vars.length) return;
    var table = el("table", "sim-vars");
    var lastGroup = null;
    this.varCells = {};
    this.trace.vars.forEach(function (v) {
      var g = v.group || "";
      if (g !== lastGroup) {
        lastGroup = g;
        if (g) {
          var gr = el("tr", "sim-group");
          var gth = el("th", null, g);
          gth.colSpan = 2;
          gr.appendChild(gth);
          table.appendChild(gr);
        }
      }
      var tr = el("tr");
      tr.appendChild(el("th", null, v.label || v.name));
      var td = el("td");
      tr.appendChild(td);
      table.appendChild(tr);
      self.varCells[v.name] = td;
    });
    this.varsBox.appendChild(table);
  };

  Sim.prototype.go = function (i) {
    var steps = this.trace.steps;
    if (!steps.length) return;
    if (i < 0) i = 0;
    if (i > steps.length - 1) i = steps.length - 1;
    this.idx = i;
    this.paint();
  };

  Sim.prototype.paint = function () {
    var self = this;
    var steps = this.trace.steps;
    var step = steps[this.idx] || {};
    var prev = this.idx > 0 ? steps[this.idx - 1] : null;

    // 코드 패널
    this.trace.panels.forEach(function (p) {
      var nodes = self.lineNodes[p.id] || [];
      var pc = step.pc ? step.pc[p.id] : null;
      nodes.forEach(function (n, i) {
        var isCur = (pc !== null && pc !== undefined && i === pc - 1);
        n.classList.toggle("cur", isCur);
        n.querySelector(".sim-mark").textContent = isCur ? "▶" : " ";
      });
      if (pc !== null && pc !== undefined && nodes[pc - 1]) {
        var box = self.panelNodes[p.id].code;
        var node = nodes[pc - 1];
        var top = node.offsetTop - box.clientHeight / 2 + node.offsetHeight / 2;
        box.scrollTop = Math.max(0, top);
      }
      var badge = self.panelNodes[p.id].badge;
      var st = step.status ? step.status[p.id] : null;
      if (st) {
        badge.style.display = "";
        badge.textContent = st;
        badge.className = "sim-badge " + String(st).toLowerCase().replace(/[^a-z0-9]+/g, "-");
      } else {
        badge.style.display = "none";
      }
    });

    // 변수표
    if (this.varCells) {
      this.trace.vars.forEach(function (v) {
        var td = self.varCells[v.name];
        if (!td) return;
        var cur = step.vars ? step.vars[v.name] : undefined;
        var old = prev && prev.vars ? prev.vars[v.name] : undefined;
        td.innerHTML = "";
        var changed = prev && !sameValue(cur, old);
        td.classList.toggle("changed", !!changed);
        if (changed) {
          var p = el("span", "sim-prev", fmtValue(old) + "→");
          td.appendChild(p);
        }
        td.appendChild(document.createTextNode(fmtValue(cur)));
      });
    }

    // 설명
    this.descBox.innerHTML =
      '<span class="sim-stepno">' + (this.idx + 1) + ".</span>" + fmtDesc(step.desc);

    // note
    if (step.note) {
      this.noteBox.style.display = "";
      this.noteBox.innerHTML = fmtDesc(step.note);
    } else {
      this.noteBox.style.display = "none";
      this.noteBox.innerHTML = "";
    }

    // svg
    var svg = step.svg;
    if (typeof svg === "function") {
      try { svg = svg(step, this.idx, this.trace); } catch (e) { svg = null; }
    }
    this.svgBox.innerHTML = svg ? String(svg) : "";

    // 컨트롤 상태
    this.counter.textContent = (this.idx + 1) + " / " + steps.length;
    this.range.value = String(this.idx);
    this.btnFirst.disabled = this.btnPrev.disabled = (this.idx === 0);
    this.btnNext.disabled = this.btnLast.disabled = (this.idx === steps.length - 1);
  };

  Sim.prototype.play = function () {
    var self = this;
    if (this.timer) return;
    if (this.idx >= this.trace.steps.length - 1) this.go(0);
    this.btnPlay.classList.add("playing");
    this.btnPlay.textContent = "⏸ 정지";
    this.timer = setInterval(function () {
      if (self.idx >= self.trace.steps.length - 1) { self.stop(); return; }
      self.go(self.idx + 1);
    }, this.speed);
  };

  Sim.prototype.stop = function () {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    if (this.btnPlay) {
      this.btnPlay.classList.remove("playing");
      this.btnPlay.textContent = "▶ 자동";
    }
  };

  // ------------------------------------------------------------
  // public
  // ------------------------------------------------------------
  var SimEngine = {
    mount: function (container, name) {
      var spec = global.SIMS[name];
      if (!spec || typeof spec.build !== "function") {
        container.className = "sim-missing";
        container.textContent = "시뮬레이터 없음: " + name;
        return null;
      }
      var sim = new Sim(container, name, spec);
      sim.opts = sim.defaultOpts();
      sim.render();
      sim.rebuild();
      sim.go(0);
      bindKeyboard();
      return sim;
    },
    mountAll: function (scope) {
      var out = [];
      (scope || document).querySelectorAll(".sim[data-sim]").forEach(function (node) {
        out.push(SimEngine.mount(node, node.getAttribute("data-sim")));
      });
      return out;
    }
  };

  global.SimEngine = SimEngine;
})(typeof window !== "undefined" ? window : globalThis);

// ===== sims/action_potential.js =====
// action_potential — 2장 p.6–7 활동 전위 · 역치 · 실무율 · 불응기 · 발화율
// 슬라이드에는 mV 수치가 없다 → 안정 −70 / 역치 −55 / 정점 +40mV 는 교과서 일반값(표시용).
// 기대(intensity): 역치 이상에서 스파이크 크기 항상 +40, 강도↑ → 발화율만↑ (실무율)
(function (global) {
  "use strict";
  global.SIMS = global.SIMS || {};

  var REST = -70, THR = -55, PEAK = 40;
  var FONT = "font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif";

        "'''5세''' — 아직 전조작 단계. '''보존 개념이 결여''' — 시각(수면 높이)에 초점을 맞춘다. 반면 4~5세를 기점으로 [[마음 이론]]이 급격히 발전해 \"반창고\" 라고 답한다(젠킨스 & 애스팅턴, 1996).",
        "'''8세''' — [[구체적 조작 단계]]. 구체적 물질에 대한 '''보존'''을 이해하고, 수학적 변형(거꾸로 붓기)을 머릿속으로 할 수 있다. 하지만 7세 아동은 명제에 대한 추론은 아직 못 한다(Suppes, 1982).",
        "'''13세''' — [[형식적 조작 단계]]. 추상적 사고가 확장되어 '''과학자처럼''' 가설적 명제에서 결론을 끌어내고 체계적으로 추리한다."
      ];
      AGES.forEach(function (a, i) {
        var res = TASK[taskKey].res[i];
        steps.push({
          desc: DESC[i] + " ▶ 과제: " + res,
          pc: { proc: i + 2 }, status: { proc: STAGES[a.stage].name },
          vars: v(a, res), svg: drawSvg(i, taskKey, res)
        });
      });
      var lastA = AGES[AGES.length - 1];
      steps.push({
        desc: "정리. 4개월 대상 영속성 ✗ → 1세 ✓ / 5세 보존 ✗ → 8세 ✓ / 13세 가설 추리 ✓. 피아제는 아동이 수동적 수용자가 아니라 '''적극적으로 상호작용'''하는 존재임을 보여 주었고, 발달의 인지적 이정표를 제공했다 (p.16).",
        pc: { proc: 8 }, status: { proc: "재고찰" },
        vars: v(lastA, TASK[taskKey].res[AGES.length - 1]),
        note: "재고찰할 점(p.16): 현대 연구에서는 발달이 '''훨씬 더 연속적'''으로 진행되고, 각 유형의 사고가 '''더 이른 시기'''에 발현되기도 한다. 예: 대상 영속성은 단계적이기보다 점진적·연속적 (Wang et al., 2004, p.10), 유아는 대상 영속성을 위배한 사물을 더 오래 응시 (p.11).",
        svg: drawSvg(AGES.length - 1, taskKey, TASK[taskKey].res[AGES.length - 1])
      });
      return {
        panels: [{ id: "proc", title: "연령별 관찰", lang: "txt", lines: lines }],
        vars: [
          { name: "연령", group: "아이" }, { name: "단계", group: "아이" },
          { name: "대상 영속성", group: "능력" }, { name: "보존", group: "능력" }, { name: "자기중심성", group: "능력" },
          { name: "가상 놀이", group: "능력" }, { name: "마음 이론", group: "능력" }, { name: "추상·가설 추리", group: "능력" },
          { name: "과제 결과", group: "과제" }
        ],
        steps: steps
      };
    }
  };
})(typeof window !== "undefined" ? window : this);

// ===== sims/reinforcement_schedules.js =====
// reinforcement_schedules — 5장 p.22–23 강화 계획 (연속 vs 부분, 고정/변동 × 비율/간격)
// 기대: FR·VR 반응 50 → 강화 5, CRF 반응 50 → 강화 50, FI 가리비(보상 직전 몰림), VI 느리지만 꾸준
(function (global) {
  "use strict";
  global.SIMS = global.SIMS || {};

  var FONT = "font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
  var N = 50;

  var INFO = {
    FR: { name: "고정 비율(FR 10)", ex: "커피 쿠폰: 10번 사면 1잔 무료", ratio: true },
    VR: { name: "변동 비율(VR 평균 10)", ex: "슬롯 머신 · 낚시꾼", ratio: true, gaps: [7, 13, 9, 11, 10] },
    FI: { name: "고정 간격(FI 10틱)", ex: "정기 할인 행사", ratio: false },
    VI: { name: "변동 간격(VI 평균 10틱)", ex: "SNS 좋아요 알람 확인하기", ratio: false, gaps: [6, 14, 9, 11, 10] },
    CRF: { name: "연속 강화(CRF)", ex: "반응할 때마다 매번 보상", ratio: true }
  };

  // FI 한 주기(10틱) 안 위치별 반응 수: 보상 직후 쉬고, 보상 시점이 가까워질수록 급증 (표시용 예시값)
  var FI_CYCLE = [0, 0, 0, 1, 0, 1, 1, 2, 3, 4];

  function drawSvg(rec, sched, upto) {
    // rec: [{t, cum, rein}] 길이 N (0..N-1 은 step 1..N)
    var W = 640, H = 260, L = 48, R = 620, T = 28, B = 214;
    var maxCum = 0;
    rec.forEach(function (p) { if (p.cum > maxCum) maxCum = p.cum; });
    var ymax = Math.max(10, Math.ceil(maxCum / 10) * 10);
    function X(t) { return (L + t / N * (R - L)).toFixed(1); }
    function Y(c) { return (B - c / ymax * (B - T)).toFixed(1); }
    var o = [];
    o.push('<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:' + W + 'px;' + FONT + '">');
    o.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#ffffff"/>');
    o.push('<text x="' + L + '" y="16" font-size="12" font-weight="bold" fill="#334">누적 반응 기록 — ' + INFO[sched].name + '  (▼ = 강화)</text>');
    for (var g = 0; g <= ymax; g += (ymax > 40 ? 20 : 10)) {
      o.push('<line x1="' + L + '" y1="' + Y(g) + '" x2="' + R + '" y2="' + Y(g) + '" stroke="#ccd3de" stroke-opacity="0.6"/>');
      o.push('<text x="' + (L - 6) + '" y="' + (+Y(g) + 4) + '" font-size="11" fill="#667" text-anchor="end">' + g + '</text>');
    }
    for (var t = 0; t <= N; t += 10) {
      o.push('<text x="' + X(t) + '" y="' + (B + 16) + '" font-size="11" fill="#667" text-anchor="middle">' + t + '</text>');
    }
    o.push('<text x="' + R + '" y="' + (B + 32) + '" font-size="11" fill="#667" text-anchor="end">' + (INFO[sched].ratio ? "반응 번호(1회 = 1틱) →" : "경과 시간(틱) →") + '</text>');
    o.push('<text x="' + (L - 6) + '" y="' + (T - 10) + '" font-size="11" fill="#667" text-anchor="end">누적 반응</text>');
    // 계단
    var d = "M" + X(0) + "," + Y(0);
    var prev = 0;
    for (var i = 0; i <= upto && i < rec.length; i++) {
      var p = rec[i];
      d += " L" + X(p.t) + "," + Y(prev) + " L" + X(p.t) + "," + Y(p.cum);
      prev = p.cum;
    }
    o.push('<path d="' + d + '" fill="none" stroke="#223" stroke-width="2"/>');
    for (var j = 0; j <= upto && j < rec.length; j++) {
      if (rec[j].rein && (sched !== "CRF" || j % 5 === 4 || j === upto)) {
        o.push('<text x="' + X(rec[j].t) + '" y="' + (+Y(rec[j].cum) - 4) + '" font-size="' + (sched === "CRF" ? 10 : 13) + '" fill="#d23f4c" text-anchor="middle">▼</text>');
      }
    }
    if (sched === "CRF") o.push('<text x="' + L + '" y="' + (B + 32) + '" font-size="11" fill="#d23f4c">(매 반응 강화 — ▼는 5회마다만 표시)</text>');
    o.push('<line x1="' + L + '" y1="' + B + '" x2="' + R + '" y2="' + B + '" stroke="#555"/>');
    o.push('</svg>');
    return o.join("");
  }

  global.SIMS["reinforcement_schedules"] = {
    title: "강화 계획: 언제 보상을 줄까?",
    desc: "같은 50번(또는 50틱) 동안 보상을 주는 규칙만 바꿔 본다. 비율 계획은 '''반응 수''', 간격 계획은 '''시간''' 기준이고, 고정/변동은 그 기준이 일정한지 무작위인지다 (5장 p.22–23). [[강화 계획]]",
    options: [
      { key: "schedule", label: "강화 계획", values: [
        { value: "FR", label: "고정 비율 FR 10 (커피 쿠폰)" },
        { value: "VR", label: "변동 비율 VR 10 (슬롯 머신)" },
        { value: "FI", label: "고정 간격 FI 10 (정기 할인)" },
        { value: "VI", label: "변동 간격 VI 10 (SNS 좋아요)" },
        { value: "CRF", label: "연속 강화 CRF" }
      ] }
    ],
    build: function (opts) {
      var sched = INFO[opts.schedule] ? opts.schedule : "FR";
      var info = INFO[sched];
      var steps = [], rec = [];
      var cum = 0, rein = 0, since = 0, lines, vars;

      if (info.ratio) {
        lines = sched === "CRF" ? [
          "1. 규칙: 반응할 때마다 매번 강화 (연속 강화계획)",
          "2. 반응 1회 발생 → 누적 반응 + 1",
          "3. 강화 제공 (매번)",
          "4. 정리: 학습은 빠르지만, 보상이 끊기면 소거도 빠르다"
        ] : [
          "1. 규칙: " + (sched === "FR" ? "정확히 10번 반응할 때마다 강화" : "평균 10번, 매번 다른(무작위) 반응 수 후 강화"),
          "2. 반응 1회 발생 → 누적 반응 + 1, 마지막 강화 후 반응 + 1",
          "3. 마지막 강화 후 반응 수가 목표에 도달? → 아니면 2번으로",
          "4. 도달 → 강화 제공, 카운트 0 으로, 다음 목표 설정",
          "5. 정리: 부분 강화 = 학습 느림 · 소거 저항 높음"
        ];
        vars = [
          { name: "계획", group: "규칙" }, { name: "이번 목표(반응 수)", group: "규칙" },
          { name: "누적 반응", group: "기록" }, { name: "누적 강화", group: "기록" },
          { name: "마지막 강화 후 반응 수", group: "기록" }
        ];
        var gi = 0;
        function target() { return sched === "CRF" ? 1 : (sched === "FR" ? 10 : info.gaps[gi % info.gaps.length]); }
        function snap(tg) {
          return { "계획": info.name, "이번 목표(반응 수)": tg, "누적 반응": cum, "누적 강화": rein, "마지막 강화 후 반응 수": since };
        }
        steps.push({
          desc: info.name + " — 예: " + info.ex + ". " + (sched === "VR" ? "목표 반응 수는 7·13·9·11·10 처럼 바뀌지만 평균은 10이다. 다음 보상이 언제 올지 모른다." : sched === "FR" ? "10번째 반응마다 보상이 나온다." : "반응할 때마다 보상이 나온다."),
          pc: { proc: 1 }, vars: snap(target()), status: { proc: sched },
          note: sched === "VR" ? "VR 간격 7·13·9·11·10 은 재현을 위한 고정 시드(표시용)." : undefined,
          svg: drawSvg(rec, sched, -1)
        });
        for (var i = 1; i <= N; i++) {
          var tg = target();
          cum++; since++;
          var hit = since >= tg;
          var desc, pc;
          if (hit) {
            rein++;
            desc = (sched === "CRF")
              ? "반응 " + cum + "회 → '''바로 강화''' (누적 강화 " + rein + ")."
              : "반응 " + cum + "회 — 마지막 강화 후 " + since + "번째 반응이 목표 " + tg + " 에 도달 → '''강화 ▼''' (누적 강화 " + rein + ").";
            pc = sched === "CRF" ? 3 : 4;
            rec.push({ t: i, cum: cum, rein: true });
            var sn = snap(tg); sn["마지막 강화 후 반응 수"] = since;
            since = 0; gi++;
            steps.push({ desc: desc, pc: { proc: pc }, vars: sn, status: { proc: "강화" }, svg: drawSvg(rec.slice(), sched, rec.length - 1) });
          } else {
            desc = "반응 " + cum + "회. 마지막 강화 후 " + since + "번 / 목표 " + tg + " — 아직 보상 없음.";
            rec.push({ t: i, cum: cum, rein: false });
            steps.push({ desc: desc, pc: { proc: sched === "CRF" ? 2 : (since === 1 ? 2 : 3) }, vars: snap(tg), status: { proc: "반응" }, svg: drawSvg(rec.slice(), sched, rec.length - 1) });
          }
        }
      } else {
        lines = [
          "1. 규칙: " + (sched === "FI" ? "강화 후 정확히 10틱이 지난 뒤 첫 반응에 강화" : "강화 후 매번 다른(평균 10틱) 시간이 지난 뒤 첫 반응에 강화"),
          "2. 1틱 경과 → 이번 틱의 반응 수 기록",
          "3. 정해진 시간이 지났고 반응이 있었나? → 아니면 2번으로",
          "4. 그렇다 → 강화 제공, 시계 0 으로",
          "5. 정리: 부분 강화 = 학습 느림 · 소거 저항 높음"
        ];
        vars = [
          { name: "계획", group: "규칙" }, { name: "이번 간격(틱)", group: "규칙" },
          { name: "경과 시간(틱)", group: "기록" }, { name: "이번 틱 반응", group: "기록" },
          { name: "누적 반응", group: "기록" }, { name: "누적 강화", group: "기록" },
          { name: "마지막 강화 후 경과 시간", group: "기록" }
        ];
        var gj = 0;
        function interval() { return sched === "FI" ? 10 : info.gaps[gj % info.gaps.length]; }
        function snap2(t, now, iv) {
          return { "계획": info.name, "이번 간격(틱)": iv, "경과 시간(틱)": t, "이번 틱 반응": now, "누적 반응": cum, "누적 강화": rein, "마지막 강화 후 경과 시간": since };
        }
        steps.push({
          desc: info.name + " — 예: " + info.ex + ". " + (sched === "FI" ? "보상 시점이 정해져 있으므로, 그 시점이 가까워질수록 반응이 몰린다." : "간격 6·14·9·11·10 틱처럼 언제 보상이 올지 모르므로, 느리지만 꾸준히 확인한다."),
          pc: { proc: 1 }, vars: snap2(0, 0, interval()), status: { proc: sched },
          note: (sched === "FI" ? "틱당 반응 수(가리비 모양)는 표시용 예시값." : "VI 간격 6·14·9·11·10 과 틱당 반응 1회는 표시용 예시값(고정 시드)."),
          svg: drawSvg(rec, sched, -1)
        });
        for (var t = 1; t <= N; t++) {
          var iv = interval();
          since++;
          var now = sched === "FI" ? FI_CYCLE[(since - 1) % 10] : 1;
          cum += now;
          var hit2 = since >= iv && now > 0;
          var d2;
          if (hit2) {
            rein++;
            d2 = t + "틱: 간격 " + iv + "틱이 지났고 반응이 " + now + "번 있었다 → '''강화 ▼''' (누적 강화 " + rein + ").";
            var s2 = snap2(t, now, iv);
            rec.push({ t: t, cum: cum, rein: true });
            steps.push({ desc: d2, pc: { proc: 4 }, vars: s2, status: { proc: "강화" }, svg: drawSvg(rec.slice(), sched, rec.length - 1) });
            since = 0; gj++;
          } else {
            d2 = t + "틱: 이번 틱 반응 " + now + "번 (누적 " + cum + "). " +
              (sched === "FI" ? (since <= 3 ? "보상 직후라 거의 반응하지 않는다." : since >= 8 ? "보상 시점이 다가오자 반응이 '''급증'''한다." : "조금씩 반응이 늘어난다.") : "언제 올지 모르니 일정하게 확인한다.");
            rec.push({ t: t, cum: cum, rein: false });
            steps.push({ desc: d2, pc: { proc: since === 1 ? 2 : 3 }, vars: snap2(t, now, iv), status: { proc: "대기" }, svg: drawSvg(rec.slice(), sched, rec.length - 1) });
          }
        }
      }

      var last = steps[steps.length - 1];
      var summary = {
        FR: "반응 50회 → 강화 '''5회'''. 10번마다 정확히 한 번씩 계단처럼 보상이 나왔다.",
        VR: "반응 50회 → 강화 '''5회''' (FR 과 같은 수). 하지만 언제 나올지 몰라 계속 반응하게 되므로 '''소거가 잘 이루어지지 않는다''' — 슬롯 머신.",
        FI: "50틱 동안 강화 '''5회''', 반응 " + cum + "회. 보상 직후에는 쉬다가 보상 시점이 가까워질수록 빠르게 반응 — 그래프가 '''가리비(급증) 모양'''이다.",
        VI: "50틱 동안 강화 '''5회''', 반응 " + cum + "회. 그래프가 '''완만하지만 일정한 직선''' — 느리지만 매우 꾸준한 반응.",
        CRF: "반응 50회 → 강화 '''50회'''. 매번 보상하므로 학습은 가장 빠르다."
      }[sched];
      steps.push({
        desc: "정리. " + summary,
        pc: { proc: lines.length }, vars: JSON.parse(JSON.stringify(last.vars)), status: { proc: sched },
        note: sched === "CRF"
          ? "연속 강화계획은 학습이 빠르지만, 보상이 끊기면 소거도 빠르다. 부분(간헐적) 강화 = 학습은 느리지만 '''소거 저항도가 높음''' (p.22)."
          : "부분(간헐적) 강화계획: 연속 계획에 비해 '''학습이 느리지만 소거 저항도가 높다''' (p.22).",
        svg: drawSvg(rec.slice(), sched, rec.length - 1)
      });
      return {
        panels: [{ id: "proc", title: "절차", lang: "txt", lines: lines }],
        vars: vars,
        steps: steps
      };
    }
  };
})(typeof window !== "undefined" ? window : this);

// research_methods — 1장 p.17–25 연구 방법 (기술적 방법 · 상관 · 실험) 비교
// 같은 연구 질문을 사례 연구 → 자연 관찰 → 사회조사 → 상관 연구 → 실험법 순으로 시도.

(function (global) {

  var FONT = "font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif";

  var METHODS = [

      weak: "사회적 바람직성 위장 · 말표현 효과 · 대표성 없는 표본", page: "p.20–21" },
    { name: "상관 연구", key: "상관", kind: "상관 연구", goal: "예측", treat: "✗", ctrl: "✗", ra: "✗", cause: "✗",
      weak: "원인과 결과를 명세하지 못함 (제3의 변인)", page: "p.22" },
    { name: "실험법", key: "실험법", kind: "실험", goal: "인과 (원인과 결과 탐색)", treat: "✓", ctrl: "✓", ra: "✓", cause: "✓",

  ];

  var Q = {
    icecream: {
      q: "아이스크림을 많이 먹으면 식중독에 잘 걸리나?",
      d: [
        "식중독으로 입원한 환자 한 명을 깊이 면담했더니 전날 아이스크림을 세 개 먹었다고 한다. 흥미로운 단서지만 '''이 한 사람'''이 대표적인지 알 수 없다.",
        "여름 해수욕장에서 사람들이 무엇을 먹고 언제 배탈이 나는지 개입 없이 기록한다. 아이스크림을 먹는 사람이 많고 배탈 환자도 많다는 '''현상'''은 보이지만, 기온·위생 같은 요인을 통제하지 않았다.",
        "무선 표집한 1,000명에게 \"하루 아이스크림 몇 개?\", \"올해 식중독 경험?\" 을 묻는다. 데이터는 많이 모았지만 자기보고라 정확하지 않을 수 있다.",
        "월별 아이스크림 판매량과 식중독 환자 수의 [[상관]]을 계산하니 강한 '''정적 상관'''. 판매량으로 환자 수를 '''예측'''은 할 수 있다. 그러나 둘 다 '''기온'''이 오를 때 같이 늘어난다 — [[제3의 변인]].",
        "참가자를 [[무선 할당]]으로 두 집단에 나눠, 실험 집단은 아이스크림을 먹고 통제 집단은 먹지 않게 하고 '''기온·음식 위생·다른 음식'''은 똑같이 유지한다. 이제 두 집단 차이는 '''아이스크림(처치)''' 때문이라고 인과적으로 말할 수 있다."
      ],
      corrNote: "아이스크림 ↔ 식중독 상관은 '''예측은 되지만 설명은 못 한다'''. 기온(제3의 변인)이 둘 다 올린다. 상관 ≠ 인과."
    },
    memory: {
      q: "기억력 훈련 프로그램이 시험 성적을 올리나?",
      d: [
        "훈련 후 성적이 크게 오른 학생 한 명을 심층 분석한다. 설득력 있는 이야기지만, 그 학생만 특별했을 수 있다 — 일반화가 어렵다.",
        "학원 자습실에서 훈련 앱을 쓰는 학생과 안 쓰는 학생의 행동을 그대로 관찰·기록한다. 현상은 보이지만 동기·공부 시간 같은 요인을 통제하지 않았다.",
        "무선 표집한 학생 500명에게 \"훈련 앱을 쓰나요?\", \"성적은?\" 을 설문한다. 성적을 좋게 보고하려는 경향(사회적 바람직성)이 섞일 수 있다.",
        "훈련 시간과 성적의 [[상관]]이 정적으로 나온다. 훈련 시간으로 성적을 '''예측'''은 할 수 있지만, '''원래 성실한 학생'''이 훈련도 많이 하고 성적도 높을 수 있다 — [[제3의 변인]].",
        "지원한 학생들을 [[무선 할당]]으로 훈련 집단(실험 조건)과 비훈련 집단(통제 조건)에 나누고, 공부 시간·시험은 똑같이 맞춘다. 무선 할당으로 기존 개인차(성실성)가 두 집단에 고르게 퍼지므로, 성적 차이를 '''훈련의 효과'''라고 인과적으로 결론 낼 수 있다."
      ],
      corrNote: "훈련 시간 ↔ 성적 상관은 '''예측은 되지만 설명은 못 한다'''. 성실성(제3의 변인)이 둘 다 올릴 수 있다. 상관 ≠ 인과."
    }
  };

  function drawSvg(upto) {
    var W = 640, H = 236, L = 10, T = 30, RH = 34;
    var cols = [
      { t: "방법", w: 120 }, { t: "목적", w: 108 }, { t: "처치", w: 64 }, { t: "통제", w: 64 },
      { t: "무선 할당", w: 92 }, { t: "인과", w: 64 }
    ];
    var o = [];
    o.push('<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:' + W + 'px;' + FONT + '">');
    o.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#ffffff"/>');
    var x = L + 6;
    cols.forEach(function (c) {
      o.push('<text x="' + (x + c.w / 2) + '" y="' + (T - 10) + '" font-size="12" font-weight="bold" fill="#334" text-anchor="middle">' + c.t + '</text>');
      x += c.w;
    });
    var kindColor = { "기술적 방법": "#3a6fd8", "상관 연구": "#e08a3c", "실험": "#2f9e6b" };
    METHODS.forEach(function (m, i) {
      var y = T + i * RH;
      var on = i <= upto, cur = i === upto;
      o.push('<rect x="' + L + '" y="' + y + '" width="' + (W - 2 * L) + '" height="' + (RH - 4) + '" rx="4" fill="' + kindColor[m.kind] + '" fill-opacity="' + (cur ? 0.25 : on ? 0.08 : 0.03) + '" stroke="' + (cur ? kindColor[m.kind] : "none") + '" stroke-width="2"/>');
      var cells = [m.name, m.goal.split(" ")[0], m.treat, m.ctrl, m.ra.split(" ")[0], m.cause];
      var xx = L + 6;
      cells.forEach(function (c, k) {
        var col = !on ? "#c4cad4" : (c === "✓" ? "#2f9e6b" : c === "✗" ? "#d23f4c" : "#223");
        o.push('<text x="' + (xx + cols[k].w / 2) + '" y="' + (y + 20) + '" font-size="' + (k === 0 ? 13 : (c.length === 1 ? 16 : 12)) + '" font-weight="' + (k === 0 || cur ? "bold" : "normal") + '" fill="' + col + '" text-anchor="middle">' + (on || k === 0 ? c : "?") + '</text>');
        xx += cols[k].w;
      });
      o.push('<text x="' + (W - L - 8) + '" y="' + (y + 20) + '" font-size="11" fill="' + kindColor[m.kind] + '" text-anchor="end">' + m.kind + '</text>');

    o.push('</svg>');
    return o.join("");
  }

  global.SIMS["research_methods"] = {
    title: "연구 방법 사다리: 기술 → 예측 → 인과",
    desc: "같은 연구 질문을 다섯 가지 방법으로 차례로 시도한다. 처치·변인 통제·무선 할당을 모두 갖춘 [[실험법]]만 '''인과'''를 말할 수 있다 (1장 p.17–25). [[연구 방법 비교]]",
    options: [
      { key: "question", label: "연구 질문", values: [
        { value: "icecream", label: "아이스크림과 식중독" },
        { value: "memory", label: "기억력 훈련과 성적" }
      ] }
    ],
    build: function (opts) {
      var qk = Q[opts.question] ? opts.question : "icecream";
      var qq = Q[qk];
      var lines = [
        "0. 연구 질문: " + qq.q,
        "1. 사례 연구: 소수의 개인을 집중 관찰·심층 분석",
        "2. 자연 관찰: 자연 상황의 행동을 개입 없이 기록",
        "3. 사회조사: 무선 표집한 표본에 설문·인터뷰 (자기보고)",
        "4. 상관 연구: 두 변인을 측정해 함께 변하는 정도(−1~1) 계산",
        "5. 실험법: 독립변인 처치 + 다른 변인 통제 + 무선 할당 → 집단 비교",
        "6. 정리: 기술(기술적 방법) → 예측(상관) → 인과(실험)"
      ];
      var steps = [];
      function v(m) {
        if (!m) return { "방법": "–", "분류": "–", "목적": "–", "처치(조작)": "–", "변인 통제": "–", "무선 할당": "–", "인과 추론": "–", "약점": "–" };
        return { "방법": m.name, "분류": m.kind, "목적": m.goal, "처치(조작)": m.treat, "변인 통제": m.ctrl, "무선 할당": m.ra, "인과 추론": m.cause, "약점": m.weak };
      }
      steps.push({
        desc: "연구 질문: '''" + qq.q + "''' 이 질문에 다섯 가지 방법으로 답해 보며, 각 방법이 무엇까지 말해 줄 수 있는지 본다.",
        pc: { proc: 1 }, vars: v(null), svg: drawSvg(-1)
      });
      METHODS.forEach(function (m, i) {
        var note;
        if (i === 2) note = "함정: 사회조사의 '''[[무선 표집]]'''(모집단에서 표본을 고르게 뽑기)과 실험법의 '''[[무선 할당]]'''(참가자를 조건에 무작위 배정)은 다른 개념이다. 표본 수가 많아도 대표성이 없으면 좋은 표본이 아니다 (p.21).";
        else if (i === 3) note = qq.corrNote + " (p.22)";
        else note = undefined;
        steps.push({
          desc: "'''" + (m.key ? "[[" + m.key + "|" + m.name + "]]" : m.name) + "''' (" + m.kind + ", " + m.page + "). " + qq.d[i],
          pc: { proc: i + 2 }, status: { proc: m.kind },
          vars: v(m), note: note, svg: drawSvg(i)
        });
      });
      var last = METHODS[METHODS.length - 1];
      steps.push({
        desc: "정리. 기술적 방법(사례 연구·자연 관찰·사회조사)은 현상을 '''기술''', 상관 연구는 '''예측''', 실험은 '''원인과 결과'''를 탐색한다. 처치 ✓·통제 ✓·무선 할당 ✓·인과 ✓ 가 모두 나온 것은 '''실험법뿐'''이다.",
        pc: { proc: 7 }, status: { proc: "실험" }, vars: v(last),
        note: "실험법의 약점도 기억할 것(p.25): 결과를 다른 상황에 일반화하지 못할 수 있고, 윤리적 문제로 특정 변인에는 처치할 수 없다.",
        svg: drawSvg(METHODS.length - 1)
      });
      return {
        panels: [{ id: "proc", title: "연구 절차", lang: "txt", lines: lines }],
        vars: [
          { name: "방법", group: "현재 방법" }, { name: "분류", group: "현재 방법" }, { name: "목적", group: "현재 방법" },
          { name: "처치(조작)", group: "설계" }, { name: "변인 통제", group: "설계" }, { name: "무선 할당", group: "설계" },
          { name: "인과 추론", group: "결론" }, { name: "약점", group: "결론" }
        ],
        steps: steps
      };
    }
  };
})(typeof window !== "undefined" ? window : this);

// ===== sims/serial_position.js =====
// serial_position — 6장 p.32 계열 위치 효과 (초두 효과 · 최신 효과)
// 표시용 예시값 즉시: .80 .70 .55 .45 .40 .40 .45 .60 .75 .85 (U자)
// delayed(30초 암산): 1–7번 동일, 8–10번 ≈ .40 → 초두 효과 유지·최신 효과 소멸
(function (global) {
  "use strict";
  global.SIMS = global.SIMS || {};

  var FONT = "font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
  var WORDS = ["사과", "의자", "구름", "연필", "바다", "시계", "우산", "호랑이", "편지", "나무"];
  var IMM = [0.80, 0.70, 0.55, 0.45, 0.40, 0.40, 0.45, 0.60, 0.75, 0.85];
  var DEL = [0.80, 0.70, 0.55, 0.45, 0.40, 0.40, 0.45, 0.40, 0.40, 0.40];
  // 되뇌기 상한: 앞 단어일수록 되뇌기 여유가 많다 (표시용)
  var REH_CAP = [5, 4, 3, 2, 1, 1, 1, 1, 1, 1];

  function f2(p) { return p.toFixed(2).replace(/^0\./, "."); }
  function region(i) { return i < 3 ? "초두" : (i >= 7 ? "최신" : "중간"); }
  function avg(a, s, e) { var t = 0; for (var i = s; i < e; i++) t += a[i]; return t / (e - s); }

  // mode: "present"(되뇌기 막대, upto 까지 제시) / "recall"(회상 곡선, upto 까지 공개)
  function drawSvg(mode, upto, reh, probs, delayed) {
    var W = 640, H = 270, L = 48, R = 620, T = 30, B = 214;
    var cw = (R - L) / 10;
    function Xc(i) { return L + cw * (i + 0.5); }
    var o = [];
    o.push('<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:' + W + 'px;' + FONT + '">');
    o.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#ffffff"/>');
    // 구간 배경
    o.push('<rect x="' + L + '" y="' + T + '" width="' + (cw * 3) + '" height="' + (B - T) + '" fill="#2f9e6b" fill-opacity="0.07"/>');
    o.push('<rect x="' + (L + cw * 7) + '" y="' + T + '" width="' + (cw * 3) + '" height="' + (B - T) + '" fill="#3a6fd8" fill-opacity="0.07"/>');
    o.push('<text x="' + (L + cw * 1.5) + '" y="' + (T + 14) + '" font-size="12" fill="#2f9e6b" text-anchor="middle">초두(1–3)</text>');
    o.push('<text x="' + (L + cw * 8.5) + '" y="' + (T + 14) + '" font-size="12" fill="#3a6fd8" text-anchor="middle">최신(8–10)</text>');
    for (var i = 0; i < 10; i++) {
      var on = i <= upto;
      o.push('<text x="' + Xc(i).toFixed(1) + '" y="' + (B + 16) + '" font-size="12" fill="' + (on ? "#223" : "#b4bcc8") + '" text-anchor="middle">' + WORDS[i] + '</text>');
      o.push('<text x="' + Xc(i).toFixed(1) + '" y="' + (B + 30) + '" font-size="10" fill="#8b95a5" text-anchor="middle">' + (i + 1) + '</text>');
    }
    if (mode === "present") {
      o.push('<text x="' + L + '" y="16" font-size="12" font-weight="bold" fill="#334">제시 단계 — 단어별 되뇌기 누적 횟수 (표시용)</text>');
      var ym = 6;
      function Yr(v) { return B - v / ym * (B - T - 22); }
      for (var j = 0; j <= upto && j < 10; j++) {
        var h = B - Yr(reh[j]);
        o.push('<rect x="' + (Xc(j) - 16).toFixed(1) + '" y="' + Yr(reh[j]).toFixed(1) + '" width="32" height="' + h.toFixed(1) + '" fill="' + (j === upto ? "#e08a3c" : "#9fb3d6") + '"/>');
        o.push('<text x="' + Xc(j).toFixed(1) + '" y="' + (Yr(reh[j]) - 4).toFixed(1) + '" font-size="12" fill="#223" text-anchor="middle">' + reh[j] + '</text>');
      }
    } else {
      o.push('<text x="' + L + '" y="16" font-size="12" font-weight="bold" fill="#334">회상 단계 — 위치별 회상 확률 (표시용 예시값)' + (delayed ? " · 30초 암산 후" : " · 즉시 회상") + '</text>');
      function Y(p) { return (B - p * (B - T - 22)).toFixed(1); }
      [0, 0.5, 1].forEach(function (g) {
        o.push('<line x1="' + L + '" y1="' + Y(g) + '" x2="' + R + '" y2="' + Y(g) + '" stroke="#ccd3de" stroke-opacity="0.6"/>');
        o.push('<text x="' + (L - 6) + '" y="' + (+Y(g) + 4) + '" font-size="11" fill="#667" text-anchor="end">' + (g === 0 ? "0" : g === 1 ? "1" : ".5") + '</text>');
      });
      if (delayed) {
        // 비교용 즉시 회상 곡선(점선)
        o.push('<polyline points="' + IMM.map(function (p, k) { return Xc(k).toFixed(1) + "," + Y(p); }).join(" ") + '" fill="none" stroke="#8b95a5" stroke-dasharray="4,4"/>');
        o.push('<text x="' + (R - 4) + '" y="' + (+Y(IMM[9]) - 6) + '" font-size="11" fill="#8b95a5" text-anchor="end">즉시 회상</text>');
      }

// ===== anims/interference.js =====

// ============================================================
window.ANIMS = window.ANIMS || {};
ANIMS["interference"] = {
  title: "간섭 — 옛 것과 새 것이 서로 회상을 막는다 14초",

  duration: 14,
  build: function () {
    var C = {
      a: "#1d65b3", aL: "#dbe8f7", b: "#2e9e4f", bL: "#dff3e4",
      c: "#e09a40", cL: "#fdeec2", n: "#3b2f4a", nL: "#efe9f6",
      r: "#d6465f", rL: "#fbe0e5", m: "#777"

    }
    function show(from, to, dur) {
      return '<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;' + (from / dur) + ';' + (from / dur + 0.02) + ';' + (to / dur) + ';' + Math.min(1, to / dur + 0.02) + ';1" dur="' + dur + 's" fill="freeze"/>';

    // ---- 단계 자막 ----
    var caps = [
      [0, 2, "인출 실패의 원인, 간섭: 옛 정보와 새 정보 간의 상호작용"],
      [2, 5.5, "① 순행 간섭: 기존 학습 내용이 새로운 정보의 회상을 방해 (→ 방향)"],
      [5.5, 9, "② 역행 간섭: 새로운 학습이 기존 정보의 회상을 방해 (← 방향)"],
      [9, 12, "③ Jenkins &amp; Dallenbach(1924): 학습 후 바로 잔 집단의 회상률이 더 높음"],
      [12, 14, "수면 중엔 추가 정보 유입이 없어 역행 간섭이 적다 → 망각 = 소멸 + 간섭"]
    ];
    caps.forEach(function (c) {
      s += '<g opacity="0">' + txt(380, 26, c[2], 14, "#222", ' font-weight="700"') + show(c[0], c[1], D) + '</g>';

    // ---- 두 줄: 순행 / 역행 ----
    function row(y, title, ink, t0, target, pro) {
      var g = '<g opacity="0.35">';
      g += box(14, y, 456, 116, "#fff", ink);
      g += txt(26, y + 109, title, 13, ink, ' font-weight="700" text-anchor="start"');
      g += '<line x1="236" y1="' + (y + 104) + '" x2="450" y2="' + (y + 104) + '" stroke="#bbb" stroke-width="1.5" marker-end="url(#if_arrowG)"/>';

      // 방해 화살표
      var a = pro

    s += row(170, "② 역행 간섭 (Retroactive)", C.r, 5.5, "옛 것(일본어)?", false);

    // ---- 오른쪽: Jenkins & Dallenbach ----
    s += '<g opacity="0.35">' + box(482, 44, 264, 242, "#fff", "#ccc") + lit(9, D) + '</g>';

    function line(pts, col, t0) {

      return '<path d="' + d + '" pathLength="100" fill="none" stroke="' + col + '" stroke-width="4" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" begin="' + t0 + 's" dur="1.5s" fill="freeze"/></path>';

    function show(from, to, dur) {

    function from(t, dur) {

    }
    function car(x, y, col, flip) {

      g += '<rect x="' + (x + (flip ? 6 : 14)) + '" y="' + (y - 9) + '" width="24" height="11" rx="4" fill="' + col + '"/>';
      g += '<circle cx="' + (x + 10) + '" cy="' + (y + 18) + '" r="5" fill="#333"/><circle cx="' + (x + 34) + '" cy="' + (y + 18) + '" r="5" fill="#333"/>';
      return g;
    }
    function spark(x, y, k) {
      k = k || 1;
      var p = [];

        var ang = i * Math.PI / 8, r = (i % 2 ? 7 : 16) * k;

//   → 6 종(CS)만→침(CR) → 7.5 소거(CS만 반복) → 9.5 휴지기간 → 10.5 자발적 회복(부분) → 12.5 정리 → 14

window.ANIMS = window.ANIMS || {};

  title: "파블로프의 개 — 종소리가 침을 부르기까지 14초",
  desc: "[[무조건 자극]](먹이) → [[무조건 반응]](침). [[중성 자극]](종)을 '''먼저''', 먹이를 '''나중'''에 반복 제시하면 종이 [[조건 자극]]이 되어 [[조건 반응]]을 부른다. 먹이 없이 종만 반복하면 [[소거]], 휴지기간 뒤엔 [[자발적 회복]](부분) — 소거는 제거가 아니라 억압",

      a: "#1d65b3", aL: "#dbe8f7", b: "#2e9e4f", bL: "#dff3e4",

    }
    function txt(x, y, s, size, fill, extra) {
      return '<text x="' + x + '" y="' + y + '" font-size="' + (size || 13) + '" fill="' + (fill || "#222") + '"' + (/text-anchor/.test(extra || "") ? "" : ' text-anchor="middle"') + (extra || "") + '>' + s + '</text>';
    }
    function show(from, to, dur) {
      return '<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;' + (from / dur) + ';' + (from / dur + 0.02) + ';' + (to / dur) + ';' + Math.min(1, to / dur + 0.02) + ';1" dur="' + dur + 's" fill="freeze"/>';
