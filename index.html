  "body": "'''6장 기억'''은 중간고사 범위의 마지막 장이다. 핵심 질문은 하나 — '''정보는 어떻게 뇌에 들어가(부호화), 머물고(저장), 다시 나오는가(인출), 그리고 왜 사라지거나(망각) 바뀌는가(기억 구성 오류)?''' 슬라이드 41장이 이 순서로 흘러간다: 기억을 재는 법(p.2–4) → 기억 모형(p.5–13) → 저장고별 용량·시간 실험(p.14–18) → 통제 처리 전략·공부법(p.19–25) → 기억의 뇌(p.26–29) → 인출 단서(p.30–32) → 망각과 기억 구성 오류(p.33–40) → 기억 증진법(p.41).\n\n이 장은 '''공부법 그 자체'''라서 특히 중요하다. 교수는 첫 수업(🎙 8/25)부터 [[검증 효과]]와 [[간격두기 효과|분산 학습]]을 공부법으로 권했고, 5장 도입(🎙 9/29)에서 \"공부 잘하는 방법은 '''다음 주 기억 챕터'''에 더 연결된다\"고 예고했다. → '''p.19–25 와 p.41 은 ⭐ 가중'''.\n\n{info}\n페이지 번호 = 인쇄 슬라이드 번호(총 41장, 숨김 슬라이드 없음). 6장은 '''10/6 수업 전'''이라 녹음이 없다 — 이 문서의 교수 강조는 '''다른 장 녹음(8/25 · 9/8 · 9/15 · 9/29)'''에서 6장을 예고한 부분만 쓴다. 슬라이드 기준.\n{/info}\n\n{analogy}\n6장 전체는 '''도서관 하나'''다. 책이 들어오면(감각 입력) 반납대(감각 기억)에 잠깐 쌓였다가, 사서가 눈여겨본(주의) 책만 분류 카트(단기/작업 기억, 7±2권, 12초)에 오르고, 등록 번호를 붙여(부호화·응고화) 서가(장기 기억)에 꽂힌다. 찾을 때는 색인 카드(인출 단서)를 쓴다. 책을 못 찾는 이유는 셋 — 애초에 등록 안 됨(부호화 실패), 책이 낡아 바스러짐(저장 소멸), 비슷한 책 사이에 끼어 안 보임(인출 실패·간섭). 그리고 꺼냈다 다시 꽂을 때 누가 몰래 페이지를 바꿔 끼우면(재응고화·오정보) 그 책은 영영 바뀐 채로 남는다.\n{/analogy}\n\n== 0. 이 장이 다른 장과 이어지는 곳 ==\n\n{| class=\"table\"\n! 앞 장에서 배운 것 || 6장에서 쓰이는 곳\n|-\n| 서막 [[컴퓨터 메타포]] (🎙 8/25: RAM = 작업 기억, SSD = 장기 기억) || [[앳킨슨-시프린 모형|정보처리 모형]] (p.5) — 입력·처리·저장\n|-\n| 서막 p.28 학습법: 검증 효과 · 분산 학습 || [[검증 효과]] (p.23) · [[간격두기 효과]] (p.22) · 기억 증진법 (p.41)\n|-\n| 서막 [[선천성-후천성 논제]] — \"둘 다 중요\" || 작업 기억은 선천성과 후천성을 모두 지님 (p.9)\n|-\n| 1장 [[말표현 효과]] — 질문 단어가 응답을 바꿈 || [[오정보 효과]] (p.39) — \"접촉 vs 충돌\"\n|-\n| 2장 [[해마]] · [[소뇌]] · [[편도체]] (🎙 9/8: 「제이슨 본」=역행성, 「메멘토」=순행성) || 기억의 신경학 (p.26–29), [[기억상실증]] (p.33)\n|-\n| 2장 [[칵테일 파티 효과]] · [[이중 처리]] · [[수면과 꿈]] || [[자기참조 효과]] (p.25) · [[자동 처리와 통제 처리|이중 궤적 기억]] (p.11) · 수면과 응고화 (p.27, p.37)\n|-\n| 3장 [[설단 현상]] · 노화 (🎙 9/15: 노인은 회상↓, 재인 유지) || [[회상]] · [[재인]] (p.3–4), 알츠하이머 (p.2)\n|-\n| 4장 [[점화]] (차폐 점화) || 점화 = 암묵 기억의 한 종류 (p.30)\n|-\n| 5장 [[고전적 조건화]] (🎙 9/29: 학습 상황과 기억의 연합은 기억 챕터에서) || [[암묵 기억]]의 하위 유형 (p.12), [[소뇌]] (p.28), [[맥락 의존 기억과 상태 의존 기억]] (p.31)\n|}\n\n== p.2 — 기억의 정의, 기억과 두뇌 ⭐ ==\n\n{def}\n'''설명''': 시간이 경과하여도 지속되는 학습 및 저장, 인출이 가능한 정보. 다양한 유형이 존재하며 기억 별로 역할이 다름 (6장 p.2)\n'''명칭''': 기억 (Memory)\n{/def}\n\n[[img:L6-02.png|6장 p.2 — 정상 두뇌와 알츠하이머 환자의 두뇌. 중증 알츠하이머병의 뇌는 밀도·부피가 크게 줄어 있다|medium]]\n\n'''알츠하이머''' 환자는 정상인 대비 뇌의 밀도 및 부피가 줄어든다. 이것은 기억 문제의 '''양방향성'''을 보여 준다 — ① 새로운 정보를 저장하지 못하는 것('''부호화''' 문제) ② 기존 정보를 불러오지 못하는 것('''인출''' 문제). 이 두 방향이 p.33 의 [[기억상실증|순행성·역행성 기억상실증]]으로 다시 나온다. 3장(🎙 9/15)에서 교수가 알츠하이머(신경성 치매)와 경도 인지 장애를 언급하며 \"기억 챕터에서 다시 다룬다\"고 했다 → [[3장 일생에 걸친 발달]].\n\n== p.3–4 — 기억을 측정하는 법: 회상 · 재인 · 재학습 ⭐⭐ ==\n\n[[img:L6-04.png|6장 p.4 — 회상과 재인의 측정 차이. 회상 과제(직접 재생성, 주관식) vs 재인 과제(이전 내용 확인, 선택형: 봤다/안 봤다)|medium]]\n\n{| class=\"table\"\n! 측정법 || 슬라이드 정의 || 과제 || 문서\n|-\n| '''[[회상]]''' (Recall) || 이전에 학습한 내용을 인출하여 그 항목을 '''직접 생성''' || 자유 회상 · 단서 회상 || [[회상]]\n|-\n| '''[[재인]]''' (Recognition) || 이전에 학습한 항목을 '''확인'''하는 절차 || 단어 재인 과제, 신/구(New/Old) 반응 || [[재인]]\n|-\n| '''재학습''' (Relearning) || 동일 내용을 다시 학습할 때 습득이 '''더 신속'''한지 측정 || 절약(Savings) || [[망각 곡선]]\n|}\n\n[[img:L6-03.png|6장 p.3 — 에빙하우스의 파지 곡선(Baddeley, 1982). 첫째 날 되뇌기 횟수가 늘수록 둘째 날 재학습 시간이 줄어든다|small]]\n\n'''에빙하우스의 파지(망각) 곡선'''은 '''재학습 시간의 변화'''를 기반으로 기억을 측정한 방식이다. 되뇌기가 이루어지지 않으면 초반에 재학습 시간의 감소폭('''절약''')이 급격하게 감소한다 → [[망각 곡선]].\n\n{warn}\n'''생성 = 회상, 확인 = 재인.''' 둘을 뒤바꾼 보기와 \"파지 곡선은 재인 정답률 기반\" 보기는 bank 오답이다. 파지 곡선은 '''재학습(절약)''' 기반.\n{/warn}\n\n== p.5–6 — 기억 모형: 정보처리 모형(다중 저장고 모형) ⭐⭐⭐ ==\n\n[[img:L6-05.png|6장 p.5 — 정보처리 모형(앳킨슨 & 시프린, 1968, 2016). 외부 사건 → 감각기억 → (주의) 부호화 → 작업/단기기억(유지 되뇌기) → 부호화 → 장기기억, 장기기억 → 인출 → 작업/단기기억. 맨 위는 '자동처리 과정'|large]]\n\n[[앳킨슨-시프린 모형|정보처리 모형]](앳킨슨 & 시프린, 1968)은 세 단계로 구성된 기억 기반 정보 처리 모형('''=다중 저장고 모형''')이며, '''부호화 · 저장 · 인출''' 과정을 통해 정보 처리를 수행한다.\n\n{| class=\"table\"\n! 과정 || 정의 (p.5) || 방향\n|-\n| '''부호화''' || 두뇌에 정보를 집어넣는 과정 || 감각 → 작업/단기, 작업/단기 → 장기\n|-\n| '''저장''' || 부호화된 정보를 오랫동안 파지하는 과정 || —\n|-\n| '''인출''' || 저장된 정보를 불러오는 과정 || 장기 → 단기/작업\n|}\n\n{| class=\"table\"\n! 저장고 (p.6) || 정의 || 용량 · 시간 || 문서\n|-\n| '''감각 기억''' || 감각 정보를 매우 짧은 시간 동안 기록 || 3~4개 · 0.5~1초 || [[감각 기억]]\n|-\n| '''단기 기억''' || 감각 기억에서 부호화된 정보가 짧게 유지 || 7±2 · 약 12초 || [[단기 기억]]\n|-\n| '''작업 기억''' || 단기 기억을 확장(Baddeley et al., 2002), 입력 정보와 장기 기억 인출 정보의 '''적극적 처리''' || — || [[작업 기억]]\n|-\n| '''장기 기억''' || 의미·사건·지식 등을 '''반영속적'''으로 저장, 인출로 일부가 단기/작업으로 소환 || — || [[앳킨슨-시프린 모형|장기 기억]]\n|}\n\n[[anim:atkinson_shiffrin|감각 입력 점들이 감각 기억 → 단기/작업 기억 → 장기 기억으로 가며 얼마나 줄어드는지, 그리고 인출 화살표가 어느 방향으로 돌아오는지 끝까지 보자]]\n\n== p.7–10 — 작업 기억 모형 ⭐⭐⭐ ==\n\n단기 기억은 '''정보의 저장'''에 주안점을 둔 개념이라, 저장만으로는 인간이 계산하고 판단해 출력값을 내는 활동을 설명하기 어렵다(p.7). 그래서 '''Baddeley 가 작업 기억을 제안'''했다 → [[작업 기억]].\n\n[[img:L6-08.png|6장 p.8 — Baddeley & Hitch(1974)의 작업기억 모형. 위 '주의 할당/조율', 가운데 '중앙집행기', 왼쪽 '음운 루프(언어와 청각 정보)', 오른쪽 '시공간 잡기장(시각과 공간 정보)'|medium]]\n\n{| class=\"table\"\n! 구성 요소 (p.8) || 하는 일 || 문서\n|-\n| '''[[중앙 집행기]]''' (Central Executive) || 장기 기억으로부터 정보 인출, 과제 수행의 집중 및 주의 분배, 두 하위 시스템 조정 || [[중앙 집행기]]\n|-\n| '''시공간 잡기장''' (Visuospatial sketch pad) || 시각 심상 기반 기억 정보 유지 || [[작업 기억|시공간 잡기장]]\n|-\n| '''[[음운 루프]]''' (Phonological loop) || 음운 저장소(정보 유지) + 조음 되뇌기 처리(쇠잔 방지) || [[음운 루프]]\n|}\n\n[[anim:working_memory|중앙 집행기가 음운 루프와 시공간 잡기장에 일을 나눠 주고 장기 기억에서 정보를 끌어오는 장면 — '저장만이 아니라 처리하는 기억'이라는 요점을 확인하자]]\n\n* '''p.9 특성''': 작업 기억은 '''선천성과 후천성'''을 모두 지닌다. 유전적 요인이 절반 정도 설명(Knowles et al., 2014), 스트레스에 노출된 아동은 후에 저하(Goodman et al., 2019), 일시적 심리적 피로로 감소(Garrison et al., 2019).\n* '''p.10 번외 — [[작업 기억|N-Back 과제]]''': 현재 자극이 N회 이전 자극과 같은지 판단. 정보의 '''유지와 조작'''을 모두 요구 → 작업 기억 측정. 1~3 Back.\n\n{exam}\nbank 단답형 = '''[[중앙 집행기]]'''. 통합요약 단답형 예상: 주의 분배·조정 → 중앙 집행기 / 조음 되뇌기로 소리 정보 유지 → 음운 루프 / N회 전 자극과 비교 → N-Back 과제.\n{/exam}\n\n== p.11 — 이중 궤적 기억: 자동 처리 / 통제 처리 ⭐⭐ ==\n\n[[img:L6-11.png|6장 p.11 — 기억의 이중 처리 과정. 자동 처리 과정(무의식적: 빠름, 노력 불필요) → 암묵기억 / 통제 처리 과정(의식적: 주의 집중 필요, 노력 소모) → 외현기억|medium]]\n\n다중 저장고 모형은 외현 기억의 처리에 초점을 맞췄지만, 일부 기억은 '''무의식적 과정을 거쳐 직접 장기 기억으로''' 부호화된다.\n\n{| class=\"table\"\n! || [[자동 처리와 통제 처리|자동 처리]] || [[자동 처리와 통제 처리|통제 처리]]\n|-\n| 정의 || 의식적 자각 '''없이''' 발생하는 부호화 || 주의와 의식적 자각이 '''필요'''한 부호화\n|-\n| 연관 기억 || [[암묵 기억]] || [[외현 기억]]\n|}\n\n== p.12–13 — 암묵 기억과 외현 기억 ⭐⭐ ==\n\n[[img:L6-12.png|6장 p.12 — 외현 기억과 암묵 기억의 하위 분류(Long-term storage → Explicit: Episodic·Semantic / Implicit: Classical conditioning·Procedural)|medium]]\n\n{| class=\"table\"\n! || [[외현 기억]] (explicit) || [[암묵 기억]] (implicit)\n|-\n| 정의 || 의식적 자각을 통해 '''서술할 수 있는''' 기억 || 의식적 노력 없이 처리되거나 '''기술하기 어려운''' 정보\n|-\n| 하위 || '''일화 기억'''(경험·사건) · '''의미 기억'''(지식) || '''절차 기억'''(행동 수행 과정) · '''[[고전적 조건화]]'''(사건 간 연합)\n|-\n| 뇌 (p.27–28) || [[해마]] · 전전두엽 || [[소뇌]] · 기저 신경절\n|}\n\n* 공간·시간·사건의 빈도는 의식적 노력 없이 '''자동적 처리''' 가능 → 덕분에 다른 필요한 부분에 의식적 노력을 기울일 수 있다(p.12).\n* 어떤 정보 처리가 자동화되기 전에는 '''외현 기억 단계를 우선''' 거친다(p.13).\n\n== p.14–15 — 감각 기억: Sperling(1960) ⭐⭐⭐ ==\n\n[[img:L6-14.png|6장 p.14 — Sperling(1960)의 실험 자극(3×3 글자 K Z R / Q B T / S G N)과 소리 단서|small]]\n[[img:L6-15.png|6장 p.15 — 결과: 전체 보고법 낮음 / 부분 보고법(지연 없음) 높음 / 부분 보고법(지연 있음) 다시 낮음|medium]]\n\n[[스펄링 실험]]: 50ms 동안 9개 글자 → ① '''전체 보고법'''(약 4개) ② '''부분 보고법'''(소리 단서로 지정된 한 줄 3개 전부) ③ '''지연 보고법'''(단서를 0.5~1초 지연 → 저하). 결론: [[감각 기억]] 용량 '''3~4개''', 유지 '''0.5~1초'''. 청각 '''반향 기억'''도 유사(Cowan, 1988).\n\n== p.16–18 — 단기 기억의 유지 시간과 용량 ⭐⭐⭐ ==\n\n[[img:L6-17.png|6장 p.17 — Peterson & Peterson(1959) 결과. 회상 비율이 3~18초에 걸쳐 급감, 약 12초 후 10% 미만|medium]]\n\n* '''유지 시간''' — [[피터슨과 피터슨 실험]](1959): 철자 3개 → 3씩 빼는 암산(되뇌기 = '''통제 처리''' 방지) → 3~18초 뒤 회상. '''약 12초'''면 10% 미만.\n* '''용량''' — [[매직 넘버 7]](조지 밀러, 1956): '''7±2개'''. 철자·단어는 5~6개(Baddeley et al., 1985). 작업 기억 용량은 젊은 성인 > 아동·노인(Bopp & Verhaeghen, 2020), 과제 전환 시 효율 감소(Steyvers et al., 2019).\n\n[[img:L6-18.png|6장 p.18 — 숫자 폭 과제 예시: 2148 · 37542 · 84301 · 629758 · 91430985|medium]]\n\n{warn}\n'''슬라이드 오류''': PPTX p.18 의 \"단기 기억의 용량은 '''72개''' 항목\" 은 '''7±2개'''의 오기다(± 누락). 정답은 7±2. → [[매직 넘버 7]]\n{/warn}\n\n[[sim:working_memory_span]]\n\n== p.19–21 — 통제 처리 전략: 청크 · 기억술 · 위계 구성 ⭐⭐⭐ ==\n\n[[img:L6-19.png|6장 p.19 — 청크 조직화의 예시(낱자 → 글자 묶음 → 단어 → 문장 → 구)|small]]\n\n[[청크화]](Chunking, p.19): 정보를 '''의미 있는 단위로 체제화''' → 기존 단기 기억 용량보다 더 많은 정보 저장(전화번호, 계좌번호).\n\n=== 기억술 ===\n{def}\n'''설명''': 보조수단을 활용하여 기억 유지를 돕고, 단서의 제공으로 특정 기억 인출을 촉진하는 통제 처리 전략 (예: My Very Educated Mother Just Served Us Noodles) (6장 p.20)\n'''명칭''': [[6장 기억|기억술]] (Mnemonics)\n{/def}\n\n=== 구체성 효과 ===\n{def}\n'''설명''': 추상어(사랑)보다 구체어(사과)가 기억하기 더 용이한 현상 (Akpinar & Berger, 2015) (6장 p.20)\n'''명칭''': [[6장 기억|단어의 구체성 효과]] (Concreteness Effect)\n{/def}\n\n[[img:L6-20.png|6장 p.20 — 구체어 '사과'와 추상어 '사랑'(위), 기억 보조수단을 활용한 행성 순서 외우기 \"My Very Educated Mother Just Served Us Noodles\"(Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune)(아래)|medium]]\n\n=== 위계 구성 ===\n{def}\n'''설명''': 특정 정보를 층위에 따라 분류하여 기억하는 방식. 소수의 광의적 개념이 협의적 개념으로 분할되며 지식 구조 형성과 연관되고 인출 효율을 높인다 (6장 p.21)\n'''명칭''': [[6장 기억|위계 구성]] (Hierarchies)\n{/def}\n\n[[img:L6-21.png|6장 p.21 — 범주를 통한 위계 구성 예시: 동물 → 포유류(사자·호랑이·고래) / 조류(카나리아·독수리·타조)|small]]\n\n예: 단어 범주를 설정하여 그 구성 요소를 기억하기, 강의 자료나 교재의 대제목·소제목 구분. 이 위키의 장 → 메인 → 사전 문서 구조도 위계 구성이다.\n\n{| class=\"table\"\n! 통제 처리 전략 || 핵심 || 예\n|-\n| [[청크화]] || 의미 단위로 '''묶기''' || 010-1234-5678\n|-\n| 기억술 || '''보조수단·단서''' 활용, 구체어가 유리 || My Very Educated Mother…\n|-\n| 위계 구성 || '''층위'''로 분류 || 동물 > 포유류 > 사자\n|}\n\n== p.22–23 — 분산 훈련: 간격두기 효과 · 검증 효과 ⭐⭐⭐ ==\n\n[[img:L6-22.png|6장 p.22 — 간격두기 효과. 간격 학습(적당한 간격) → 기억 유지율 높음 / 집중 학습(짧은 간격) → 빨리 잊힘|medium]]\n\n* '''[[간격두기 효과]]'''(Spacing Effect): 학습 시점 간에 일정한 간격을 두고 공부/연습할 때 기억의 유지가 오래가는 현상. 기억의 '''[[기억 응고화|응고화]]'''(학습 내용을 보다 강건한 형태로 변환하는 과정)와 관련. '''벼락치기가 그다지 효율적이지 않은 이유''', 심리학에서 가장 신뢰할 수 있는 결과 중 하나(Stafford & Dewar, 2014).\n* '''[[검증 효과]]'''(Testing Effect): 반복적 자기 검증을 통한 학습의 분산 방법 중 하나. 학습 내용에 대한 '''인출을 연습'''하여 기억 유지를 장기화. 단순 반복보다 '''퀴즈·모의고사'''가 더 효과적 — 정보에 대한 적극적 처리가 수반되기 때문.\n\n[[img:L6-23.png|6장 p.23 — 검증 효과. 단순 반복 학습(다시 읽고 반복) → 기억 유지 낮음 / 예비 시험 문제 풀이(스스로 회상하며 학습) → 기억 유지 높음|medium]]\n\n{exam}\n* (🎙 8/25, 서막 마무리) 교수가 \"시험에는 수업 내용이 나온다\"며 '''검증 효과(테스팅 임팩트)'''와 '''분산 학습(스페이싱 이펙트)'''을 공부법으로 직접 권함(서막 p.28).\n* (🎙 9/29, 5장 도입) \"공부 잘하는 방법은 다음 주 '''기억 챕터'''에 더 연결된다.\"\n* bank 단답형 = '''검증 효과'''. 통합요약 단답형 예상 9·10번 = 간격두기 효과 · 검증 효과.\n{/exam}\n\n{warn}\n'''시점 분산 = 간격두기, 인출 연습 = 검증'''. 그리고 둘은 상쇄되지 않는다 — p.41 은 '''병행'''하라고 한다(bank 오답 \"병행하지 않는 것이 좋다\").\n{/warn}\n\n== p.24–25 — 정보의 처리 수준, 자기참조 효과 ⭐⭐⭐ ==\n\n[[img:L6-24.png|6장 p.24 — 예시 단어 '다과': ① 고딕체인가?(형태) ② '의성어'와 운율이 같은가?(소리) ③ \"소녀가 ___를 먹었다\"에 적합한가?(의미) (Craik & Tulving, 1975)|medium]]\n\n* '''[[처리 수준]]''': '''얕은 처리'''(글자·형태 등 기초 수준) vs '''깊은 처리'''(의미 기반). 처리 수준이 깊을수록 파지가 우수 — 의미가 부여되면 유리(조직화·체제화와 유사). Craik & Tulving(1975).\n* '''[[자기참조 효과]]''': 새 정보를 '''자신과 의미 있게 연관'''시키면 회상이 올라감. 개인주의 문화권은 자신 관련 정보에 국한, '''집단주의 문화권은 가족 관련 정보도 동일하게''' 잘 기억(Sparks et al., 2016). [[칵테일 파티 효과]]와 유사.\n\n== p.26–29 — 기억의 저장과 인출: 기억의 신경학 ⭐⭐⭐ ==\n\n[[img:L6-26.png|6장 p.26 — 기억에 관여하는 두뇌 영역: 전전두피질 · 두정엽 · 해마 · 편도체|medium]]\n\n=== 래슐리 ===\n{def}\n'''설명''': 쥐의 뇌 특정 영역이 손상되어도 기억이 부분적으로 유지됨을 보여, 기억 기전이 여러 영역에 분산된 기능임을 시사한 연구자 (1950) (6장 p.26)\n'''명칭''': [[6장 기억|래슐리]] (Lashley)\n{/def}\n\n래슐리(1950)의 결론: 기억은 한 곳에 저장되는 것이 아니라 '''여러 영역에 분산'''되어 있고, '''기억 유형에 따라 상이한 뇌 영역'''이 개입할 수 있다. 그 유형별 영역이 p.27–29 다.\n\n{| class=\"table\"\n! 영역 || 담당 (슬라이드) || 기억 유형\n|-\n| '''[[해마]]''' || 외현 기억의 저장 — 그 과정 = '''[[기억 응고화]]''', 수면이 지원(Peigneux et al., 2004) || [[외현 기억]] (p.27)\n|-\n| '''전전두엽''' || 인출된 일화/의미 기억을 받아 '''작업 기억 유지''' (de Chastelaine et al., 2016) || [[작업 기억]] (p.27)\n|-\n| '''[[소뇌]]''' || '''파블로프 조건 형성''' (Green & Woodruff-Pak, 2000) || [[암묵 기억]] (p.28)\n|-\n| '''기저 신경절''' || 기술·행동의 '''절차 기억''' 형성 촉진 || [[암묵 기억]] (p.28)\n|-\n| '''[[편도체]]''' || '''정서 관련 기억''' — 스트레스 호르몬 → 전두엽·기저신경절 기억 흔적 활성화 || [[섬광 기억]] (p.29)\n|}\n\n[[img:L6-29.png|6장 p.29 — 정서 관련 기억: 담당 영역 편도체(빨간 박스)|small]]\n\n* 해마와 전두엽이 손상되어도 '''암묵 기억 체계는 정상 작동'''(p.28).\n* '''[[섬광 기억]]''': 정서적으로 중대한 순간·사건의 선명한 기억. 확신도가 높은 이유는 부분적으로 '''되뇌기''' 때문(Hirst & Phelps, 2016).\n\n{warn}\nbank 객관식 \"기억과 관련된 뇌 영역의 설명으로 '''옳지 않은''' 것\" 의 정답: \"해마는 '''모든 장기 기억이 영구적으로 저장되는 장소'''이므로 해마가 손상되면 모든 종류의 기억을 형성할 수 없다\" ✘. 해마는 형성·응고화 담당이고, 암묵 기억은 해마 없이도 형성된다.\n{/warn}\n\n== p.30–31 — 인출 단서, 점화, 맥락/상태 의존 기억 ⭐⭐⭐ ==\n\n[[img:L6-30.png|6장 p.30 — 점화의 예시: 병원 → 약국 / 병원 → 학원|small]]\n\n* '''[[인출 단서]]''': 인출 과정을 용이하게 하는 추가 자극. 지식이 '''네트워크'''로 연결되어 있음을 함의. '''최선의 인출 단서는 부호화할 때 형성된 연합'''(환경·맥락·정서).\n* '''[[점화]]''': 무의식적이고 자각할 수 없는 특정 연합의 활성화 — '''암묵 기억의 한 종류'''.\n* '''[[맥락 의존 기억과 상태 의존 기억|맥락/상태 의존 기억]]''': 특정 상황·상태에서 형성된 기억은 유사한 조건에서 더 잘 활성화. 상태 의존 기억 = '''기분 부합 기억'''(Gaddy & Ingram, 2014).\n* '''[[부호화 명세성 원리]]''': 특정 기억에 국한된 단서와 맥락이 회상에 가장 효과적이라는 생각(슬라이드 표기 \"Godden & Baddely, 1945\" — 슬라이드 오기, 1975 가 맞음: Godden & Baddeley, 1975).\n\n[[img:L6-31.png|6장 p.31 — 맥락 의존 + 상태 의존 기억: \"계속 소리 질러봅시다. 다시 기억이 날지도 모를 테니.\"|small]]\n\n== p.32 — 계열 위치 효과 ⭐⭐⭐ ==\n\n[[img:L6-32.png|6장 p.32 — 초두 효과와 최신 효과 예시. 즉시 회상: 마지막 항목들의 회상이 가장 우수(최신 효과) / 지연 회상: 처음 제시된 항목들만 잘 회상(초두 효과)|medium]]\n\n{| class=\"table\"\n! || 초두 효과 (Primacy) || 최신 효과 (Recency)\n|-\n| 무엇을 || 목록 '''초반''' || 목록 '''마지막'''\n|-\n| 이유 || 되뇌기 여유 많음, 다른 내용의 간섭 적음 || 단기/작업 기억에 가까움\n|-\n| 시간이 지나면 || 유지 || '''쇠퇴하여 사라짐'''\n|}\n\n[[sim:serial_position]]\n\n→ [[계열 위치 효과]]. bank 객관식: 30초 암산 후 '''마지막 부분 회상률만''' 떨어짐 = 최신 효과가 단기/작업 기억에 의존하기 때문.\n\n== p.33–37 — 망각: 발생 시점, 기억상실증, 망각의 세 원인 ⭐⭐⭐ ==\n\n[[img:L6-33.png|6장 p.33 — 기억의 부호화/인출 과정과 망각. 감각기억 → 작업/단기기억 → 장기 저장소 → 인출, 단계마다 정보량이 줄어든다|small]]\n\n'''망각은 기억의 부호화 및 인출 과정에서 모두 발생'''한다(p.33).\n\n'''[[기억상실증]]''' (p.33):\n* '''순행성''': 새로운 의식적 기억을 형성할 수 없는 증상 — '''환자 H.M.'''(간질 발작 치료로 해마 제거).\n* '''역행성''': 장기 기억에 저장된 옛 정보를 인출할 수 없는 증상.\n* 외현 기억을 형성할 수 없는 사람이라도 '''절차 기억 같은 암묵 기억은 형성 가능'''(Xu & Corkin, 2001).\n\n=== 부호화 실패 ===\n{def}\n'''설명''': 주의를 받지 못한 정보가 유실되거나 장기 기억으로의 부호화 과정이 실패하여 생기는 망각. 그 과정을 기억할 수 없으며, 노령층의 기억 저하와 연관된다(Grady et al., 1995) (6장 p.34)\n'''명칭''': [[6장 기억|부호화 실패]] (Encoding Failure)\n{/def}\n\np.34 에는 '''재응고화와 망각'''도 함께 나온다 — 인출 직후의 기억은 매우 취약하며 재부호화를 거쳐 장기 기억에 다시 저장된다 → [[재응고화]].\n\n=== 저장 소멸 ===\n{def}\n'''설명''': 이미 부호화되어 저장된 정보도 물리적 기억 흔적이 서서히 소멸하면서 장기 기억 상에서 차츰 사라지는 망각. 학습 직후 급격히 하락하나 시간이 지나면 점차 안정된다 (6장 p.35)\n'''명칭''': [[6장 기억|저장 소멸]] (Storage Decay)\n{/def}\n\n[[img:L6-35.png|6장 p.35 — 에빙하우스(1885)의 망각곡선(위)과 Bahrick(1984)의 스페인어 망각 곡선(아래). 둘 다 초반 급락 → 이후 안정|medium]]\n\n=== 인출 실패 ===\n{def}\n'''설명''': 저장된 정보를 간섭 때문에 꺼내지 못하는 망각 — 순행 간섭과 역행 간섭. 간섭은 기억의 내용을 정리하는 과정에서 발생하는 옛 정보와 새 정보 간의 상호작용 (6장 p.36)\n'''명칭''': [[6장 기억|인출 실패]] (Retrieval Failure)\n{/def}\n\n[[img:L6-36.png|6장 p.36 — 순행 간섭과 역행 간섭. (a) Retroactive: 새 history 공부가 옛 psychology 시험을 방해 / (b) Proactive: 옛 history 공부가 새 psychology 시험을 방해|medium]]\n\n{| class=\"table\"\n! || [[순행 간섭]] (proactive) || [[역행 간섭]] (retroactive)\n|-\n| 방향 || '''기존 학습 → 새 정보''' 회상 방해 || '''새 학습 → 기존 정보''' 회상 방해\n|-\n| 예 (bank) || 옛 일본어 때문에 새 영어 단어가 안 외워짐 || 새 휴대폰 번호 외운 뒤 옛 번호가 안 떠오름\n|}\n\n[[anim:interference|순행 간섭(→)과 역행 간섭(←)의 화살표 방향을 비교하고, 마지막 Jenkins & Dallenbach 막대에서 수면 집단이 왜 높은지 확인하자]]\n\n'''Jenkins & Dallenbach(1924)''' (p.37): 학습 후 '''즉시 수면'''을 취한 집단의 회상률이 유의미하게 높음 → 수면 시 추가 정보 유입이 없어 '''역행 간섭''' 발생 소지가 낮다. 결론: 망각은 '''소멸뿐 아니라 새 정보에 의한 간섭·억제의 결과'''.\n\n[[img:L6-37.png|6장 p.37 — 수면 직전에 제시된 정보의 역행 간섭 차이(Jenkins & Dallenbach, 1924): 취침 후 회상이 기상 후보다 높게 유지|small]]\n\n{| class=\"table\"\n! 망각의 원인 || 무엇이 실패 || 증거 · 예 || 슬라이드\n|-\n| '''부호화 실패''' || 애초에 장기 기억에 못 들어감 || 주의를 못 받은 정보, 노령층 기억 저하 || p.34\n|-\n| '''저장 소멸''' || 저장된 흔적이 서서히 사라짐 || [[망각 곡선]] (에빙하우스·Bahrick) || p.35\n|-\n| '''인출 실패''' || 저장은 됐는데 못 꺼냄 || [[순행 간섭]] · [[역행 간섭]], Jenkins & Dallenbach || p.36–37\n|}\n\n== p.38–40 — 기억 구성 오류 ⭐⭐⭐ ==\n\n[[img:L6-38.png|6장 p.38 — 재응고화의 과정(인출과 부호화의 반복)|small]]\n\n* '''[[재응고화]]'''(Reconsolidation, p.38): 과거에 저장한 기억이 '''인출 후에 다시 저장'''되는 과정. 인출 직후 매우 취약해 변형되기 쉽고, 인출될 때마다 '''조금씩 수정된 기억으로 대치'''될 가능성. '소문이 와전되는 이유', 목격자 진술의 신빙성 문제.\n* '''[[오정보 효과]]'''(p.39): 잘못된 정보를 제공하면 원래 목격한 것과 달라도 맞다고 보고(Anglada-Tort et al., 2019). '''Loftus & Palmer(1974)''': 질문 방식(\"접촉 사고 VS 충돌 사고\")에 따라 보고 변화. 절반 정도가 취약(Brewin & Andrews, 2017), 거짓 암시는 추후 행동에도 영향(Geraerts et al., 2008).\n* '''[[오정보 효과|상상력 효과]]'''(p.40): 잘못된 정보를 기반으로 '''반복적 상상'''을 통해 실제로 발생했다고 믿는 현상. 상상하는 뇌 영역과 실제 지각하는 뇌 영역이 중첩되기 때문(Wade et al., 2018).\n* '''[[출처 기억상실]]'''(p.40): 정보 획득 시점·출처에 대한 잘못된 기억('''오귀인''').\n\n[[img:L6-39.png|6장 p.39 — 기억 구성과 오정보. 유도 질문 \"저렇게 두 대가 정면으로 충돌했을 때, 얼마나 빠르게 달리고 있었나요?\" → 실제 사건(가벼운 접촉)이 기억 구성(크게 찌그러진 충돌)으로 바뀜|medium]]\n\n[[anim:misinformation_effect|'접촉' 질문 집단과 '충돌' 질문 집단의 보고 차이, 그리고 인출 직후 원본 기억이 질문 정보로 덮어써지는 재응고화 장면을 보자]]\n\n{exam}\nbank 단답형 = '''[[오정보 효과]]'''(Loftus & Palmer). 통합요약 단답형 예상: 인출 후 재저장 시 변형 → '''재응고화''' / 질문 방식으로 다르게 기억 → '''오정보 효과''' / 출처를 잘못 기억 → '''출처 기억상실'''.\n{/exam}\n\n{warn}\n'''오정보 효과(외부 정보 주입) vs 상상력 효과(자기 상상 반복)''', '''응고화(최초 저장) vs 재응고화(인출 후 재저장)''' — 통합요약 헷갈리는 쌍.\n{/warn}\n\n== p.41 — 기억 증진법 ⭐⭐⭐ ==\n\n=== 기억 증진법 ===\n{def}\n'''설명''': 간격두기와 테스트 병행, 의미 있는 내용으로 조직화, 기억술 도구 활용, 순행·역행 간섭의 최소화, 충분한 수면 취하기 — 6장을 공부법으로 정리한 다섯 가지 방법 (6장 p.41)\n'''명칭''': [[6장 기억|기억 증진법]]\n{/def}\n\n{| class=\"table\"\n! # || 방법 (p.41) || 슬라이드 설명 || 근거 문서\n|-\n| 1 || '''반복과 테스트''' || 일정한 간격을 둔 학습(간격두기 효과)과 테스트(검증 효과)를 '''병행''' || [[간격두기 효과]] · [[검증 효과]]\n|-\n| 2 || '''의미 있는 내용으로 조직화''' || 단순 암기보다 내용 간 연합을 형성하여 '''인출 단서망''' 구성 || [[인출 단서]] · [[처리 수준]]\n|-\n| 3 || '''기억술 도구 활용''' || 개념에 대한 선명한 이미지와 조직화('''청크화''')를 통한 기억술 || [[청크화]] · 기억술\n|-\n| 4 || '''순행·역행 간섭의 최소화''' || 서로 간섭할 가능성이 큰 주제(비슷한 테마)를 병행하지 말기 || [[순행 간섭]] · [[역행 간섭]]\n|-\n| 5 || '''충분한 수면''' || 수면 부족은 장기 기억의 응고화를 방해 (Lo et al., 2016) || [[기억 응고화]]\n|}\n\n{tip}\n시험 D-8 기준으로 이 표를 그대로 쓰면: ① 오늘 이 문서를 읽고 → 내일 [[모의고사 복기]]로 '''인출 연습''' → 모레 다시(간격) ② [[명칭 암기표]]를 장별·주제별로 '''위계'''로 보기 ③ 헷갈리는 짝은 [[자주 틀리는 함정 모음]]의 표로 '''청크''' ④ 5장 학습과 6장 기억을 같은 날 연달아 보지 말기(둘 다 \"효과\" 투성이라 '''간섭'''이 크다) ⑤ 시험 전날 밤샘 금지.\n{/tip}\n\n{joke}\n6장을 시험 전날 밤 벼락치기로 공부하는 것은, 6장 내용 자체를 정면으로 위반하는 일이다. 교수님이 채점하시다가 웃으실지도 모른다.\n{/joke}\n\n== 🎙 실제 수업 기록 ==\n\n{info}\n'''녹음 전(슬라이드 기준)''' — 6장 수업은 '''10/6(화)''' 예정이며, '''🎙 10/6 수업 후 갱신 예정'''이다. 수업 끝에 교수가 4–6장 중요 포인트를 정리할 것으로 예고되어 있다. 녹음이 도착하면 이 절에 교수의 실제 용어·강조(\"꼭 기억하라\")·학생 질의·시험 힌트를 날짜와 함께 적고, 본문 ⭐ 를 조정한다.\n{/info}\n\n지금까지 다른 장 녹음에서 6장을 '''미리''' 언급한 것(추측이 아니라 실제 발언):\n\n{| class=\"table\"\n! 날짜 || 맥락 || 내용\n|-\n| 🎙 8/25 (서막 마무리 2:09:58–2:12:44) || 학습법 조언 || \"시험에는 수업 내용이 나온다\" + '''검증 효과(테스팅 임팩트)''' · '''분산 학습(스페이싱 이펙트)''' → [[검증 효과]] · [[간격두기 효과]]\n|-\n| 🎙 8/25 (서막 컴퓨터 메타포) || 인지혁명 || 입력 = 감각 기관, 뇌 = CPU, '''SSD = 장기 기억, RAM = 단기(작업) 기억''' → [[컴퓨터 메타포]]\n|-\n| 🎙 9/8 (2장 해마) || 기억 상실 유형 || '''역행성 = 「제이슨 본」, 순행성 = 「메멘토」''', 순행성이 더 일반적 → [[기억상실증]]\n|-\n| 🎙 9/15 (3장 노화) || 인지노화 || 노인은 '''회상↓ 재인 유지''', 알츠하이머·경도 인지 장애 → \"기억 챕터에서 다시\" → [[회상]] · [[재인]]\n|-\n| 🎙 9/29 (5장 도입) || 예고 || \"공부 잘하는 방법은 학습 장보다 '''기억 챕터'''에 더 연결\", 학습 상황과 기억의 연합도 기억 챕터에서 → p.19–25, p.30–31, p.41\n|}\n\n{exam}\n위 예고를 종합하면 6장 출제 무게는 '''공부법(p.19–25, p.41)''' + '''모형·용량 수치(p.5–18)''' + '''망각·오류 방향 구분(p.33–40)'''. 10/6 수업에서 교수가 짚는 부분이 생기면 그것이 최우선이다.\n{/exam}\n\n== 시험 대비 핵심 요약 ==\n\n# '''기억 측정''': [[회상]](직접 생성; 자유·단서 회상) / [[재인]](확인; 신/구 반응) / 재학습(절약). 파지 곡선 = '''재학습''' 기반(에빙하우스). 노인은 회상↓ 재인 유지(🎙 9/15).\n# '''[[앳킨슨-시프린 모형|다중 저장고 모형]]'''(= 정보처리 모형, 1968): 감각 → 단기/작업 → 장기. '''부호화·저장·인출'''. 인출 방향 = 장기 → 단기/작업.\n# '''수치''': [[감각 기억]] 3~4개 · 0.5~1초([[스펄링 실험]]) / [[단기 기억]] 약 12초([[피터슨과 피터슨 실험]], 암산 = 되뇌기 방지) · '''7±2'''([[매직 넘버 7]], 조지 밀러). PPTX \"72개\" 는 오기.\n# '''[[작업 기억]]'''(Baddeley & Hitch, 1974): '''[[중앙 집행기]]'''(주의 분배·조정·인출) + 시공간 잡기장(시각 심상) + '''[[음운 루프]]'''(음운 저장소 + 조음 되뇌기). 측정 = N-Back 과제.\n# '''[[자동 처리와 통제 처리|자동 처리 → 암묵]]''', '''통제 처리 → 외현'''. [[암묵 기억]] = 절차 기억·고전적 조건화(·점화), [[외현 기억]] = 일화·의미 기억.\n# '''공부법''': [[청크화]] · 기억술(구체성 효과) · 위계 구성 · '''[[간격두기 효과]]'''(시점 분산, 응고화) · '''[[검증 효과]]'''(인출 연습) · '''[[처리 수준|깊은 처리]]'''(의미, Craik & Tulving) · [[자기참조 효과]](집단주의는 가족도).\n# '''뇌''': [[해마]] = 외현 기억 형성·[[기억 응고화]](저장 장소 아님, 수면 지원) / 전전두엽 = 작업 기억 유지 / [[소뇌]] = 조건 형성 / 기저 신경절 = 절차 기억 / [[편도체]] = 정서·[[섬광 기억]]. 래슐리 = 분산.\n# '''인출''': [[인출 단서]](최선은 부호화 때 연합) · [[점화]](암묵) · [[맥락 의존 기억과 상태 의존 기억|맥락(환경) / 상태(기분 부합)]] · [[부호화 명세성 원리]].\n# '''[[계열 위치 효과]]''': 초두(되뇌기 여유, 유지) / 최신(단기·작업, 시간 지나면 소멸).\n# '''망각 3원인''': 부호화 실패 · 저장 소멸([[망각 곡선]]) · 인출 실패([[순행 간섭]] 옛→새, '''[[역행 간섭]]''' 새→옛). 수면 = 역행 간섭↓(Jenkins & Dallenbach).\n# '''[[기억상실증]]''': 순행성(새 기억 형성 불가, H.M.) / 역행성(옛 기억 인출 불가). H.M. 도 암묵 기억은 형성.\n# '''기억 구성 오류''': [[재응고화]](인출 후 재저장·변형) · '''[[오정보 효과]]'''(Loftus & Palmer 접촉 vs 충돌) · 상상력 효과(뇌 영역 중첩) · [[출처 기억상실]](오귀인).\n# '''기억 증진법''': 간격 + 테스트 병행, 의미 조직화, 기억술·청크, 간섭 최소화, 충분한 수면.\n# '''bank 단답형 4개''': 검증 효과 · 역행 간섭 · 중앙 집행기 · 오정보 효과.\n\n== 관련 문서 ==\n* 모형: [[앳킨슨-시프린 모형]] · [[감각 기억]] · [[단기 기억]] · [[작업 기억]] · [[중앙 집행기]] · [[음운 루프]] · [[자동 처리와 통제 처리]] · [[암묵 기억]] · [[외현 기억]]\n* 측정·실험: [[회상]] · [[재인]] · [[망각 곡선]] · [[스펄링 실험]] · [[피터슨과 피터슨 실험]] · [[매직 넘버 7]]\n* 공부법: [[청크화]] · [[간격두기 효과]] · [[검증 효과]] · [[기억 응고화]] · [[처리 수준]] · [[자기참조 효과]]\n* 뇌·인출: [[섬광 기억]] · [[인출 단서]] · [[부호화 명세성 원리]] · [[맥락 의존 기억과 상태 의존 기억]] · [[계열 위치 효과]]\n* 망각·오류: [[기억상실증]] · [[순행 간섭]] · [[역행 간섭]] · [[재응고화]] · [[오정보 효과]] · [[출처 기억상실]]\n* 다른 장: [[서막 심리학 이야기]] · [[2장 마음의 생물학과 의식]] · [[3장 일생에 걸친 발달]] · [[5장 학습]]\n* 시험: [[명칭 암기표]] · [[자주 틀리는 함정 모음]] · [[모의고사 복기]] · [[시험 정보]]"

  "body": "'''회상'''(Recall)은 [[6장 기억]]에서 기억을 '''재는''' 세 가지 방법(회상·[[재인]]·[[망각 곡선|재학습]]) 중 하나로, '''이전에 학습한 내용을 인출하여 그 항목을 직접 생성하는 것'''이다. 시험으로 치면 '''주관식'''이다. 머릿속에서 답을 처음부터 끄집어내야 하므로 셋 중 가장 어렵다.\n\n{def}\n'''설명''': 이전에 학습한 내용을 인출하여, 그 항목을 직접 생성하는 것 (6장 p.3)\n'''명칭''': [[회상]] (Recall)\n{/def}\n\n{def}\n'''설명(사례형)''': 실험 참가자가 앞에서 본 단어 목록을 보고, 잠시 뒤 아무 힌트 없이 \"기억나는 단어를 모두 적으세요\"라는 요청에 단어를 하나씩 써 내려갔다. 이 기억 측정 방법은?\n'''명칭''': [[회상]] — 그중에서도 '''자유 회상 과제'''\n{/def}\n\n{analogy}\n회상은 '''빈 종이에 친구 전화번호를 처음부터 쓰는 것'''이고, [[재인]]은 '''휴대폰에 뜬 번호를 보고 \"아, 이거 걔 번호 맞아\" 하고 알아보는 것'''이다. 알아보는 건 쉬운데 처음부터 쓰라면 막힌다 — 그 차이가 회상과 재인의 난이도 차이다.\n{/analogy}\n\n[[img:L6-04.png|6장 p.4 — 회상과 재인의 측정 차이. 같은 학습 세션(apple·chair·river…) 뒤 회상 과제는 직접 써 내고(주관식), 재인 과제는 제시된 apple 을 \"봤다/안 봤다\"로 고른다(선택형)|medium]]\n\n== 회상 과제의 두 종류 (p.4) ==\n\n=== 자유 회상 ===\n{def}\n'''설명''': 이전에 학습한 내용을 (단서 없이) 자유롭게 떠올리게 하는 회상 과제 (6장 p.4)\n'''명칭''': [[회상|자유 회상]] 과제 (Free Recall)\n{/def}\n\n=== 단서 회상 ===\n{def}\n'''설명''': 이전에 학습한 내용을 일정한 단서를 제공하여 떠올리게 하는 회상 과제 (6장 p.4)\n'''명칭''': [[회상|단서 회상]] 과제 (Cued Recall)\n{/def}\n\n단서 회상은 [[인출 단서]]가 실제로 인출을 돕는다는 것을 그대로 보여 주는 과제다. \"ㅅ으로 시작하는 과일이었는데…\" 하는 순간 \"사과!\"가 튀어나오는 것이 단서 회상.\n\n== 회상 vs 재인 vs 재학습 ==\n\n{| class=\"table\"\n! 측정법 || 하는 일 || 비유 || 난이도 || 슬라이드 정의\n|-\n| '''회상''' (Recall) || 항목을 '''직접 생성''' || 주관식 || 가장 어려움 || 이전에 학습한 내용을 인출하여 그 항목을 직접 생성 (p.3)\n|-\n| '''[[재인]]''' (Recognition) || 학습한 항목인지 '''확인''' || 객관식 · O/X || 쉬움 || 이전에 학습한 항목을 확인하는 절차 (p.3)\n|-\n| '''[[망각 곡선|재학습]]''' (Relearning) || 다시 배울 때 '''얼마나 빨라지나''' || 두 번째 공부가 덜 걸림 || 가장 민감 || 동일 내용을 다시 학습할 때 습득이 더 신속한지 측정 (p.3)\n|}\n\n{warn}\n'''회상과 재인의 정의를 뒤바꾼 보기'''가 객관식 단골 함정이다. \"재인은 학습한 항목을 직접 생성하는 방법이다\", \"회상은 학습한 항목인지 확인하는 절차이다\" → '''둘 다 틀림'''. '''생성 = 회상, 확인 = 재인'''으로 동사 하나만 붙잡아 두자.\n{/warn}\n\n== 노화와 회상 ==\n\n{exam}\n(🎙 9/15, 3장 노화 파트) 교수는 '''노인은 회상 과제에서 수행이 뚜렷이 떨어지지만, 재인 과제에서는 노화에 따른 저하가 거의 없다'''고 설명했고, 이 내용을 \"기억 챕터에서 다시 다룬다\"고 했다. 3장 [[설단 현상]](혀끝에서 맴도는 현상)도 '''생성(회상)이 막히는''' 인출 문제다.\n{/exam}\n\n{quiz}\n\"이전에 학습한 항목을 단서 없이 직접 생성해 떠올리는 기억 측정법\"의 명칭은?\n{/quiz}\n{answer}\n'''회상'''(Recall). 단서가 없으니 '''자유 회상'''까지 쓰면 더 정확하다. 확인만 하는 것이면 [[재인]], 다시 배우는 시간으로 재면 [[망각 곡선|재학습]].\n{/answer}\n\n== 관련 문서 ==\n* [[재인]] · [[망각 곡선]](재학습·절약) · [[인출 단서]]\n* [[설단 현상]] · [[앳킨슨-시프린 모형]](인출) · [[6장 기억]]\n\n근거: 6장 p.3–4; 3장 p.35 (🎙 9/15)"
 },
 "재인": {
  "title": "재인 (Recognition)",
  "category": [
   "6장 기억",
   "용어"
  ],
  "body": "'''재인'''(Recognition)은 '''이전에 학습한 항목을 확인하는 절차''' — 즉 \"이거 전에 본 거야, 안 본 거야?\"를 판단하는 기억 측정법이다. [[회상]]이 주관식이라면 재인은 '''객관식·O/X'''다. 이미 답이 눈앞에 있으니 회상보다 쉽다.\n\n{def}\n'''설명''': 이전에 학습한 항목을 확인하는 절차 / 과거에 학습한 내용인지 여부를 확인하는 것 (6장 p.3–4)\n'''명칭''': [[재인]] (Recognition)\n{/def}\n\n{def}\n'''설명(사례형)''': 단어 목록을 외운 뒤, 화면에 단어가 하나씩 뜰 때마다 \"앞에서 본 단어면 '예', 아니면 '아니오'\"라고 답하게 하고 정답률을 기록했다. 이 기억 측정법은?\n'''명칭''': [[재인]] — 단어 재인 과제, '''신/구(New/Old) 반응''' 기록\n{/def}\n\n{analogy}\n재인은 '''경찰서 용의자 대질'''이다. 범인 얼굴을 몽타주로 처음부터 그리라면(→ [[회상]]) 막막하지만, 줄 세운 다섯 명 중 \"저 사람이에요\"를 고르는 건(→ 재인) 훨씬 쉽다. 단, 고르기가 쉬운 만큼 '''비슷한 얼굴에 속기도''' 쉽다.\n{/analogy}\n\n[[img:L6-04.png|6장 p.4 — 아래쪽 '재인 과제(이전 내용 확인)': 제시된 apple 을 보고 '봤다/안 봤다'를 고른다. 위쪽 회상 과제(직접 재생성)와 비교|medium]]\n\n== 단어 재인 과제와 신/구 반응 (p.4) ==\n\n<pre class=\"ascii\">\n [학습 단계]  apple · chair · river · …          ← 외우기\n        │\n        ▼\n [검사 단계]  화면에 단어 1개씩 제시\n        apple   →  \"본 적 있다\"(Old) ✔ 적중\n        piano   →  \"본 적 있다\"(Old) ✘ 오답 (새 단어=New)\n        river   →  \"처음 본다\"(New)  ✘ 오답\n        │\n        ▼\n 신/구(New/Old) 반응의 '''정답률''' = 기억 점수\n<\/pre>\n\n== 회상 vs 재인 ==\n\n{| class=\"table\"\n! || [[회상]] || 재인\n|-\n| 하는 일 || 항목을 '''직접 생성''' || 학습한 항목인지 '''확인'''\n|-\n| 시험 형태 || 주관식, 빈칸 쓰기 || 객관식, O/X\n|-\n| 과제 || 자유 회상 · 단서 회상 || 단어 재인 과제 (신/구 반응)\n|-\n| 난이도 || 어렵다 || 쉽다\n|-\n| 노화의 영향 (🎙 9/15) || '''뚜렷이 저하''' || '''거의 유지'''\n|}\n\n{exam}\n(🎙 9/15) \"노인은 회상 과제에서 떨어지지만 '''재인 과제에서는 노화에 따른 저하가 거의 없다'''.\" 3장 [[설단 현상]]과 묶어 나올 수 있다. 객관식에서 \"노화로 재인이 크게 떨어진다\"는 보기는 틀림.\n{/exam}\n\n{warn}\n'''\"재인 = 직접 생성\"'''은 오답. 재인은 '''확인(identify)'''이고, 생성은 [[회상]]. bank 객관식이 정확히 이 두 정의를 뒤바꿔 오답 보기 두 개를 만들었다.\n{/warn}\n\n{joke}\n단답형 시험은 회상, 객관식 시험은 재인이다. 이 과목 중간고사가 객관식 25 + 단답형 5인 걸 보면 교수님은 '''재인 25문제 + 회상 5문제'''를 내신 셈이다. 단답형 5문제가 무서운 이유가 여기 있다 → [[명칭 암기표]].\n{/joke}\n\n== 관련 문서 ==\n* [[회상]] · [[망각 곡선]](재학습) · [[설단 현상]]\n* [[6장 기억]] · [[3장 일생에 걸친 발달]](노화)\n\n근거: 6장 p.3–4; 3장 p.35 (🎙 9/15)"
 },
 "망각 곡선": {
  "title": "망각 곡선 (에빙하우스의 파지 곡선, Forgetting Curve)",
  "category": [
   "6장 기억",
   "이론"
  ],
  "body": "'''망각 곡선'''(파지 곡선)은 '''에빙하우스'''(Ebbinghaus)가 '''재학습 시간의 변화(절약)'''를 기반으로 기억이 시간에 따라 어떻게 줄어드는지를 그린 곡선이다. 6장에서 두 번 나온다 — p.3 에서는 '''기억을 재는 방법(재학습)'''의 예로, p.35 에서는 '''망각의 원인 중 저장 소멸'''의 증거로. 모양은 한 문장: '''학습 직후 급격히 떨어지고, 시간이 지나면 점차 안정된다.'''\n\n{def}\n'''설명''': 재학습 시간의 변화를 기반으로 기억을 측정한 곡선. 학습 직후에 급격한 하락세가 보이나 시간이 지남에 따라 점차 안정된다 (6장 p.3, p.35)\n'''명칭''': [[망각 곡선|에빙하우스의 파지(망각) 곡선]]\n{/def}\n\n{analogy}\n망각 곡선은 '''갓 끓인 라면의 온도 그래프'''다. 불에서 내린 직후 몇 분 동안은 뚝뚝 식다가, 어느 정도 미지근해지면 그 뒤로는 거의 그대로 머문다. 기억도 배운 직후 몇 시간·며칠 사이에 가장 많이 날아가고, 살아남은 부분은 오래 버틴다. 그래서 '''복습은 식기 시작할 때(직후) 한 번''' 해 주는 게 가장 남는 장사다 → [[간격두기 효과]].\n{/analogy}\n\n{| class=\"table\"\n! 인물 카드 || \n|-\n| 이름 || 헤르만 에빙하우스 (Ebbinghaus)\n|-\n| 분야 || 기억 연구 (기억의 정량 측정)\n|-\n| 핵심 업적 || 재학습에 드는 시간이 얼마나 '''절약'''되는지로 기억을 수치화 → 파지(망각) 곡선\n|-\n| 슬라이드 표기 || 에빙하우스(1885)의 망각곡선 (p.35), 에빙하우스의 파지 곡선(Baddeley, 1982) (p.3)\n|-\n| 시험 포인트 || 파지 곡선은 '''재학습 기반'''이다 (재인·회상 기반 아님)\n|}\n\n== 재학습과 절약 (p.3) ==\n\n=== 재학습 ===\n{def}\n'''설명''': 동일한 내용을 다시 학습할 때, 그 습득이 더 신속하게 이루어지는지 여부를 측정하는 기억 측정법 (6장 p.3)\n'''명칭''': [[망각 곡선|재학습]] (Relearning)\n{/def}\n\n=== 절약 ===\n{def}\n'''설명''': 두 번째 학습에서 처음보다 줄어든 학습 시간(감소폭). 되뇌기가 이루어지지 않으면 초반에 이것이 급격히 감소한다 (6장 p.3)\n'''명칭''': [[망각 곡선|절약]] (Savings)\n{/def}\n\n[[img:L6-03.png|6장 p.3 — 에빙하우스의 파지 곡선(Baddeley, 1982). 가로축 '첫째 날 되뇌기한 횟수', 세로축 '둘째 날의 재학습 시간'. 첫날 많이 되뇌일수록 다음 날 재학습 시간이 줄어든다(=절약이 크다)|medium]]\n\np.3 그래프를 읽는 법: 첫째 날 되뇌기(반복)를 많이 할수록 둘째 날 다시 외우는 데 걸리는 시간이 줄어든다. 반대로 '''되뇌기를 하지 않으면 절약이 초반에 급격히 줄어든다''' — 이것이 아래 망각 곡선의 급락 구간이다.\n\n== 저장 소멸의 증거 (p.35) ==\n\n[[img:L6-35.png|6장 p.35 — 위: 에빙하우스(1885)의 망각곡선(무의미 철자 파지 비율). 아래: Bahrick(1984)의 스페인어 망각 곡선(학교에서 배운 스페인어 단어 파지율). 둘 다 '처음에 급감 → 이후 안정 상태 유지'|medium]]\n\n{| class=\"table\"\n! 곡선 || 무엇을 || 모양\n|-\n| '''에빙하우스(1885)''' || 무의미 철자 목록, 학습 후 경과 시간(일) || 처음 며칠 급감 → 이후 안정\n|-\n| '''Bahrick(1984)''' || 학교에서 배운 '''스페인어''' 단어, 수강 후 경과 시간(년) || 처음 몇 년 급감 → 수십 년 안정\n|}\n\n이 두 곡선이 보여 주는 것은 [[6장 기억|저장 소멸]] — '''이미 부호화되어 저장된 정보도 물리적 기억 흔적이 서서히 소멸하면서''' 장기 기억에서 차츰 사라진다는 것이다.\n\n{warn}\n* \"에빙하우스의 파지 곡선은 '''재인 정답률'''을 기반으로 기억을 측정했다\" → '''틀림'''. '''재학습 시간(절약)''' 기반이다. (bank 객관식 오답 보기)\n* 망각 곡선은 '''일정한 속도로 직선처럼''' 떨어지지 않는다. '''초반 급락 → 이후 완만'''.\n{/warn}\n\n{quiz}\n\"동일한 내용을 다시 학습할 때 습득이 얼마나 더 빨라지는지로 기억을 측정하는 방법\"의 명칭은? 그리고 이 방법으로 그린 대표 곡선은?\n{/quiz}\n{answer}\n'''재학습'''(Relearning). 줄어든 시간이 '''절약'''이고, 이를 시간에 따라 그린 것이 '''에빙하우스의 파지(망각) 곡선'''이다.\n{/answer}\n\n== 관련 문서 ==\n* [[회상]] · [[재인]] · [[간격두기 효과]](급락 구간에 복습)\n* [[6장 기억]](망각의 세 원인 — 저장 소멸) · [[역행 간섭]]\n\n근거: 6장 p.3, p.35"
 },

  "title": "앳킨슨-시프린 모형 (정보처리 모형 = 다중 저장고 모형, Atkinson & Shiffrin, 1968)",

  "body": "'''앳킨슨-시프린 모형'''은 6장 전체의 '''뼈대'''다. 기억을 '''감각 기억 → 단기/작업 기억 → 장기 기억'''이라는 세 개의 저장고로 나누고, 정보가 그 사이를 '''부호화·저장·인출'''이라는 세 과정으로 오간다고 본다. 슬라이드 표기는 '''정보처리 모형(앳킨슨 & 시프린, 1968, 2016)''', 괄호 안 다른 이름이 '''다중 저장고 모형'''이다. 서막의 [[컴퓨터 메타포]](입력 → 처리 → 산출)를 기억에 그대로 옮긴 모형이라고 보면 된다.\n\n{def}\n'''설명''': 세 단계(감각 → 단기/작업 → 장기)로 구성된 기억 기반 정보 처리 모형으로, 부호화·저장·인출 과정을 통해 정보 처리를 수행한다 (6장 p.5)\n'''명칭''': [[앳킨슨-시프린 모형|정보처리 모형]] = '''다중 저장고 모형''' (앳킨슨 & 시프린, 1968)\n{/def}\n\n{analogy}\n다중 저장고 모형은 '''택배 물류'''다. 트럭에서 쏟아진 상자들(감각 입력)은 하차장(감각 기억)에 잠깐 놓였다가 대부분 버려지고, 송장을 확인한(주의를 받은) 상자만 분류대(단기/작업 기억)에 올라간다. 분류대는 좁아서 7±2 개밖에 못 올리고, 계속 손으로 만지지(되뇌기) 않으면 12초 안에 떨어진다. 분류가 끝난 상자는 창고(장기 기억)로 '''입고(부호화)'''되어 오래 '''보관(저장)'''되고, 주문이 들어오면 다시 분류대로 '''출고(인출)'''된다.\n{/analogy}\n\n[[img:L6-05.png|6장 p.5 — 정보처리 모형. 외부 사건 → 감각 입력 → 감각기억 → (중요하거나 새로운 정보에 주의) 부호화 → 작업/단기기억(유지 되뇌기) → 부호화 → 장기기억, 장기기억 → 인출 → 작업/단기기억. 맨 위 '자동처리 과정' 화살표는 감각기억에서 장기기억으로 바로 간다|large]]\n\n[[anim:atkinson_shiffrin|감각 입력 점들이 어디서 사라지고 어디까지 살아남는지 끝까지 본 뒤, 부호화·저장·인출 화살표가 각각 어느 방향인지 손가락으로 따라가 보자]]\n\n== 세 과정: 부호화 · 저장 · 인출 (p.5) ==\n\n{| class=\"table\"\n! 과정 || 슬라이드 정의 || 방향\n|-\n| '''부호화''' (Encoding) || 두뇌에 정보를 집어넣는 과정 || 감각 → 작업/단기, 작업/단기 → 장기\n|-\n| '''저장''' (Storage) || 부호화된 정보를 오랫동안 파지하는 과정 || (장기 기억 안에서 유지)\n|-\n| '''인출''' (Retrieval) || 저장된 정보를 불러오는 과정 || 장기 → 단기/작업\n|}\n\n=== 부호화 ===\n{def}\n'''설명''': 두뇌에 정보를 집어넣는 과정 (감각 → 작업/단기, 작업/단기 → 장기) (6장 p.5)\n'''명칭''': [[앳킨슨-시프린 모형|부호화]] (Encoding)\n{/def}\n\n=== 저장 ===\n{def}\n'''설명''': 부호화된 정보를 오랫동안 파지하는 과정 (6장 p.5)\n'''명칭''': [[앳킨슨-시프린 모형|저장]] (Storage)\n{/def}\n\n=== 인출 ===\n{def}\n'''설명''': 저장된 정보를 불러오는 과정 (장기 → 단기/작업) (6장 p.5)\n'''명칭''': [[앳킨슨-시프린 모형|인출]] (Retrieval)\n{/def}\n\n{warn}\n'''인출의 방향'''은 장기 기억 → '''단기/작업 기억'''이다. 장기 기억에서 꺼낸 정보는 \"의식의 작업대\"인 단기/작업 기억으로 올라와야 쓸 수 있다. \"인출 = 단기 → 장기\"는 부호화와 뒤바뀐 오답.\n{/warn}\n\n== 세 저장고 비교 (p.6, p.14–18) ==\n\n{| class=\"table\"\n! 저장고 || 슬라이드 정의 (p.6) || 용량 || 유지 시간 || 근거 실험\n|-\n| '''[[감각 기억]]''' || 감각 정보를 매우 짧은 시간 동안 기록한 기억 || 3~4개 || 0.5~1초 || [[스펄링 실험]] (1960)\n|-\n| '''[[단기 기억]]''' / [[작업 기억]] || 부호화된 감각 기억이 일시적으로 등록된 기억 || '''7±2''' || 약 '''12초''' (되뇌기 없을 때) || [[매직 넘버 7]] (1956), [[피터슨과 피터슨 실험]] (1959)\n|-\n| '''장기 기억''' || 의미·사건·지식 등 다양한 정보를 '''반영속적'''으로 저장 || 사실상 무한 || 반영속 || [[외현 기억]] / [[암묵 기억]]\n|}\n\n=== 장기 기억 ===\n{def}\n'''설명''': 의미, 사건, 지식 등을 포함한 다양한 정보를 반영속적으로 저장한 기억. 인출 과정을 통해 정보의 일부가 단기/작업 기억으로 소환된다 (6장 p.6)\n'''명칭''': [[앳킨슨-시프린 모형|장기 기억]] (Long-term Memory)\n{/def}\n\n장기 기억은 다시 의식적으로 서술할 수 있는 [[외현 기억]](일화·의미)과 그렇지 않은 [[암묵 기억]](절차 기억·고전적 조건화·점화)으로 나뉜다(p.12–13).\n\n[[img:L6-06.png|6장 p.6 — 같은 모형 그림 아래에 감각 / 단기·작업 / 장기 기억의 정의. 작업 기억은 단기 기억을 확장한 것(Baddeley et al., 2002)|medium]]\n\n== 모형의 한계 → 두 가지 확장 ==\n\n{| class=\"table\"\n! 한계 || 확장 || 문서\n|-\n| 단기 기억을 '''저장'''만 하는 곳으로 봄 → 인간의 출력(계산·판단)을 설명 못 함 || '''작업 기억''' (Baddeley & Hitch, 1974) || [[작업 기억]]\n|-\n| '''외현 기억'''의 처리(의식적 부호화)에만 초점 || '''이중 궤적 기억''' — 자동 처리는 감각에서 장기로 직행 || [[자동 처리와 통제 처리]]\n|}\n\np.5 그림 맨 위의 '''\"자동처리 과정\"''' 화살표가 바로 두 번째 확장의 단서다. 감각 기억의 일부는 단기 기억을 거치지 않고 무의식적으로 장기 기억에 들어간다.\n\n{exam}\n통합요약 §0-1 의 6장 최우선 명칭 첫 줄이 '''앳킨슨-시프린 모형'''이다. 단답형 예상: \"감각 → 단기/작업 → 장기의 세 단계로 기억을 설명한 앳킨슨 & 시프린의 모형\" → '''다중 저장고 모형(정보처리 모형)'''. 둘 다 정답으로 쓸 수 있게 외워 두자.\n{/exam}\n\n== 관련 문서 ==\n* [[감각 기억]] · [[단기 기억]] · [[작업 기억]] · [[자동 처리와 통제 처리]]\n* [[컴퓨터 메타포]](RAM = 작업 기억, SSD = 장기 기억 — 🎙 8/25) · [[6장 기억]]\n\n근거: 6장 p.5–6"
 },
 "감각 기억": {
  "title": "감각 기억 (Sensory Memory)",
  "category": [

  "body": "'''감각 기억'''(Sensory Memory)은 [[앳킨슨-시프린 모형|다중 저장고 모형]]의 첫 번째 칸으로, '''기억 시스템에 감각 정보를 매우 짧은 시간 동안 기록한 기억'''이다. 눈·귀로 들어온 것이 거의 통째로 찍히지만, '''0.5~1초'''면 사라지고 한 번에 보고할 수 있는 건 '''3~4개'''가 상한이다. 이 숫자는 [[스펄링 실험]](1960)에서 나왔다.\n\n{def}\n'''설명''': 기억 시스템에 감각 정보를 매우 짧은 시간 동안 기록한 기억 (6장 p.6)\n'''명칭''': [[감각 기억]] (Sensory Memory)\n{/def}\n\n{def}\n'''설명(수치형)''': 용량은 3~4개로 상한선이 있고, 유지 시간은 0.5~1초 가량인 매우 짧은 기억 (6장 p.15)\n'''명칭''': [[감각 기억]]\n{/def}\n\n{analogy}\n감각 기억은 '''불꽃놀이 잔상'''이다. 폭죽이 터진 직후 눈을 감아도 그 모양이 1초쯤 망막에 남아 있다 — 그 순간에는 거의 전부가 \"찍혀\" 있지만, 무엇을 봤는지 말로 다 꺼내기도 전에 지워진다. 그래서 '''전부 말해 보라'''(전체 보고)면 4개쯤에서 막히지만, '''윗줄만 말해 보라'''(부분 보고)면 그 줄은 다 맞힌다.\n{/analogy}\n\n[[img:L6-15.png|6장 p.15 — Sperling(1960)의 실험 결과. 회상률: 전체 보고법(파랑, 낮음) / 부분 보고법·지연 없음(초록, 높음) / 부분 보고법·지연 있음(노랑, 다시 낮음)|medium]]\n\n[[anim:atkinson_shiffrin|맨 왼쪽 '감각 기억' 상자에 들어온 점들 중 대부분이 1초 안에 사라지고 주의를 받은 몇 개만 오른쪽으로 넘어가는 장면을 보자]]\n\n== 반향 기억 ==\n{def}\n'''설명''': 시각뿐 아니라 '''청각'''에 대해서도 매우 유사하게 유지되는 감각 기억 (Cowan, 1988) (6장 p.15)\n'''명칭''': [[감각 기억|반향 기억]] (Echoic Memory)\n{/def}\n\n친구가 말을 걸었을 때 \"응? 뭐라고?\" 하고 되묻는 순간, 방금 들은 문장이 귀에서 '''메아리처럼''' 다시 재생되어 대답할 수 있는 경험 — 그것이 반향 기억이다.\n\n== 세 저장고 수치 비교 ==\n\n{| class=\"table\"\n! || 감각 기억 || [[단기 기억]] || [[앳킨슨-시프린 모형|장기 기억]]\n|-\n| 정의 (p.6) || 감각 정보를 매우 짧게 기록 || 부호화된 정보가 짧게 유지 || 반영속적 저장\n|-\n| 용량 || '''3~4개''' || '''7±2개''' || 사실상 무한\n|-\n| 유지 시간 || '''0.5~1초''' || 약 '''12초''' (되뇌기 없이) || 반영속\n|-\n| 근거 || [[스펄링 실험]](1960), Cowan(1988) || [[매직 넘버 7]](1956), [[피터슨과 피터슨 실험]](1959) || —\n|-\n| 다음으로 넘어가는 조건 || '''주의'''(중요하거나 새로운 정보) || '''부호화'''(되뇌기·깊은 처리) || 인출 시 단기/작업으로 소환\n|}\n\n{warn}\n'''숫자 섞기 함정''': 감각 기억 = '''3~4개 · 0.5~1초''', 단기 기억 = '''7±2개 · 12초'''. \"감각 기억의 용량은 7±2\" 나 \"단기 기억은 0.5~1초 유지\" 같은 보기는 두 저장고의 수치를 뒤섞은 오답이다(통합요약 객관식 함정 1번).\n{/warn}\n\n{quiz}\nSperling 실험에서 전체 보고법으로는 9개 중 약 4개만 보고했는데, 부분 보고법으로는 어느 줄을 지정해도 3개를 전부 보고했다. 이 두 결과를 합치면 감각 기억에 대해 무엇을 알 수 있나?\n{/quiz}\n{answer}\n지정될 줄을 미리 몰랐는데도 어느 줄이든 3개를 다 맞혔으니, 제시 직후에는 '''9개 대부분이 감각 기억에 순간적으로 남아 있었다'''는 뜻이다. 다만 보고하는 동안 빠르게 사라져서 전체 보고로는 4개 정도밖에 못 꺼낸다. 단서를 0.5~1초 늦추면(지연 보고) 부분 보고 수행도 떨어지므로 '''유지 시간은 0.5~1초'''.\n{/answer}\n\n== 관련 문서 ==\n* [[스펄링 실험]] · [[단기 기억]] · [[앳킨슨-시프린 모형]]\n* [[선택적 주의]](무엇이 단기 기억으로 넘어가나) · [[6장 기억]]\n\n근거: 6장 p.6, p.14–15"
 },

  "body": "'''스펄링 실험'''은 [[감각 기억]]의 '''용량과 유지 시간'''을 알아보기 위해 Sperling(1960)이 고안한 실험이다. 3×3 으로 배열된 글자 9개를 '''50ms'''(0.05초) 동안 번쩍 보여 주고, 세 가지 방식으로 보고하게 했다. 결론은 \"감각 기억은 '''3~4개''', '''0.5~1초'''\".\n\n{def}\n'''설명''': 50ms 동안 제시된 9개 글자를 전체 보고·부분 보고(소리 단서)·지연 보고 방식으로 보고하게 하여 감각 기억의 용량과 유지 시간을 알아본 실험 (6장 p.14–15)\n'''명칭''': [[스펄링 실험]] (Sperling, 1960)\n{/def}\n\n{analogy}\n스펄링 실험은 '''사진을 찍자마자 사진이 타 들어가는 폴라로이드'''다. \"사진 전체를 설명해 봐\"라고 하면 말하는 동안 사진이 타 버려서 네 개쯤밖에 못 말한다(전체 보고). 그런데 사진이 뜨자마자 \"윗줄만!\"이라고 외쳐 주면, 윗줄이 타기 전에 다 읽는다(부분 보고). \"윗줄만!\"을 1초 늦게 외치면 이미 다 타 버렸다(지연 보고).\n{/analogy}\n\n{| class=\"table\"\n! 실험 카드 || \n|-\n| 연구자(연도) || Sperling (1960)\n|-\n| 질문 || 감각 기억에는 몇 개나, 얼마 동안 남아 있나?\n|-\n| 자극 || 3×3 글자 9개 (K Z R / Q B T / S G N), '''50ms''' 제시\n|-\n| 절차 || ① '''전체 보고법''': 9개를 최대한 많이 보고 ② '''부분 보고법''': 소리 단서로 지정된 '''한 줄의 3개'''만 보고 ③ '''지연 보고법''': 부분 보고법에서 단서 소리를 '''0.5~1초''' 지연시켰다가 제시\n|-\n| 결과 || ① 9개 중 '''약 4개''' ② 어느 줄을 지정하든 '''3개 전부''' ③ 부분 보고인데도 '''수행 저하'''\n|-\n| 결론 || 감각 기억의 용량은 '''3~4개'''로 상한, 유지 시간은 '''0.5~1초''' 가량. 청각(반향 기억)도 유사(Cowan, 1988)\n|-\n| 함정 || 전체 보고에서 \"대부분 회상\" ✘ / 부분 보고에서 \"3개를 거의 못 함\" ✘ / 지연시키면 \"향상\" ✘\n|}\n\n<pre class=\"ascii\">\n t=0        50ms           소리 단서               보고\n ┌───────┐   ┌──────┐\n │ K Z R │   │      │  ① 전체 보고: (단서 없음) ──→ \"K, Z, Q, B…\"  → 약 4/9\n │ Q B T │ → │ 공백 │  ② 부분 보고: ♪ 단서 (즉시) ──→ \"K Z R\"        → 3/3\n │ S G N │   │      │  ③ 지연 보고: …0.5~1초… ♪   ──→ \"K…?\"          → ↓ 저하\n └───────┘   └──────┘\n      ↑ 감각 기억에 거의 다 찍힘 → 0.5~1초 안에 사라짐\n<\/pre>\n\n[[img:L6-14.png|6장 p.14 — Sperling(1960)의 실험 자극(3×3 글자)과 스피커 아이콘(소리 단서)|medium]]\n[[img:L6-15.png|6장 p.15 — 실험 결과 막대그래프: 전체 보고법 낮음 / 부분 보고법(지연 없음) 높음 / 부분 보고법(지연 있음) 다시 낮음|medium]]\n\n== 세 보고법 이름 정리 ==\n\n=== 전체 보고법 ===\n{def}\n'''설명''': 50ms 동안 제시된 9개 글자를 최대한 많이 보고하게 하는 방법 (6장 p.14)\n'''명칭''': [[스펄링 실험|전체 보고법]] (Whole Report)\n{/def}\n\n=== 부분 보고법 ===\n{def}\n'''설명''': 9개의 글자 중 한 줄에 있는 3개만 보고하게 하는 방법 (소리를 단서로 제시) (6장 p.14)\n'''명칭''': [[스펄링 실험|부분 보고법]] (Partial Report)\n{/def}\n\n=== 지연 보고법 ===\n{def}\n'''설명''': 부분 보고법에서 단서 소리를 0.5~1초 정도 지연시켰다가 제시하는 방법 (6장 p.14)\n'''명칭''': [[스펄링 실험|지연 보고법]] (Delayed Partial Report)\n{/def}\n\n{warn}\nbank 객관식 오답 보기 세 개가 그대로 함정이다.\n* \"전체 보고법에서 9개 중 대부분을 정확히 회상\" → ✘ '''약 4개'''\n* \"부분 보고법에서는 지정된 줄의 3개를 거의 회상 못 함\" → ✘ '''3개 전부'''\n* \"단서를 지연시키면 부분 보고 수행이 향상\" → ✘ '''저하'''\n{/warn}\n\n{quiz}\n부분 보고법의 결과(어느 줄이든 3개 전부)가 전체 보고법의 결과(약 4개)보다 감각 기억의 용량을 더 정확히 보여 주는 이유는?\n{/quiz}\n{answer}\n참가자는 '''어느 줄이 지정될지 미리 몰랐다'''. 그런데도 어느 줄이든 3개를 다 맞혔다는 것은 제시 직후 '''모든 줄'''이 감각 기억에 있었다는 뜻이다. 전체 보고는 \"말하는 시간\" 동안 흔적이 사라져서 실제보다 적게 나온다. 단, 슬라이드 결론의 수치는 '''3~4개 상한, 0.5~1초'''로 외운다.\n{/answer}\n\n== 관련 문서 ==\n* [[감각 기억]](반향 기억) · [[앳킨슨-시프린 모형]]\n* [[피터슨과 피터슨 실험]](다음 칸, 단기 기억의 유지 시간) · [[6장 기억]]\n\n근거: 6장 p.14–15"
 },
 "단기 기억": {
  "title": "단기 기억 (Short-term Memory)",
  "category": [
   "6장 기억",
   "용어"
  ],
  "body": "'''단기 기억'''(Short-term Memory)은 [[감각 기억]]에서 '''부호화된 정보가 짧게 유지되는 기억'''이다. [[앳킨슨-시프린 모형|다중 저장고 모형]]의 가운데 칸이고, 수치 두 개로 기억하면 된다 — '''유지 시간 약 12초'''([[피터슨과 피터슨 실험]], 1959), '''용량 7±2개'''([[매직 넘버 7]], 조지 밀러, 1956). 이 칸을 \"저장만 하는 곳\"에서 \"처리도 하는 작업대\"로 확장한 것이 [[작업 기억]]이다.\n\n{def}\n'''설명''': 감각 기억에서 부호화된 정보가 짧게 유지되는 기억 (6장 p.6)\n'''명칭''': [[단기 기억]] (Short-term Memory)\n{/def}\n\n{def}\n'''설명(수치형)''': 되뇌기를 수행하지 못할 경우 유지 시간이 약 12초 가량이고, 용량은 7±2개 항목 정도인 기억 (6장 p.17–18)\n'''명칭''': [[단기 기억]]\n{/def}\n\n{analogy}\n단기 기억은 '''편의점 계산대 위'''다. 물건을 올려놓을 자리가 7개 남짓(7±2)이고, 계속 손으로 붙잡고 있지 않으면(되뇌기) 12초쯤 뒤 바닥으로 굴러떨어진다. 더 많이 올리고 싶으면 '''봉지에 묶어서''' 올리면 된다 — 그게 [[청크화]].\n{/analogy}\n\n[[img:L6-17.png|6장 p.17 — Peterson & Peterson(1959) 결과. 철자를 회상한 비율이 3초 → 18초로 갈수록 급감하고, 약 12초 이후 10% 미만. \"되뇌기를 하지 못하면 신속히 소멸함\"|medium]]\n\n[[anim:atkinson_shiffrin|가운데 '단기/작업 기억' 상자에서 되뇌기 원형 화살표가 돌 때는 정보가 남고, 멈추면 약 12초 뒤 사라지는 장면에 주목]]\n\n== 단기 기억의 두 숫자 ==\n\n{| class=\"table\"\n! 무엇을 || 값 || 실험 || 핵심 조작\n|-\n| '''유지 시간''' || 약 '''12초''' (12초 후 회상률 10% 미만) || [[피터슨과 피터슨 실험]] (1959) || 3씩 빼는 암산으로 '''되뇌기 차단'''\n|-\n| '''용량''' || '''7±2개''' (철자·단어는 5~6개) || [[매직 넘버 7]] (조지 밀러, 1956) || 숫자 폭 과제\n|-\n| '''용량 늘리기''' || 7±2 '''청크''' || [[청크화]] (p.19) || 의미 단위로 묶기\n|}\n\n[[sim:working_memory_span]]\n\n== 단기 기억 vs 작업 기억 ==\n\n{| class=\"table\"\n! || 단기 기억 || [[작업 기억]]\n|-\n| 초점 (p.7) || 정보의 '''저장''' || 저장 + '''적극적 처리'''(출력값 생성)\n|-\n| 구성 || (단일 저장고) || [[중앙 집행기]] · 시공간 잡기장 · [[음운 루프]]\n|-\n| 제안 || 앳킨슨 & 시프린 (1968) || Baddeley & Hitch (1974)\n|-\n| 비유 || 계산대 위 물건 || 계산대 + 계산원(물건을 찍고 합계를 낸다)\n|}\n\n{warn}\n* 단기 기억 '''12초'''와 감각 기억 '''0.5~1초'''를 바꾼 보기, 단기 기억 '''7±2'''와 감각 기억 '''3~4개'''를 바꾼 보기는 오답.\n* 12초는 '''되뇌기를 못 하게 막았을 때'''의 값이다. 계속 되뇌면 더 오래 유지된다.\n* [[계열 위치 효과|최신 효과]]는 단기/작업 기억에 남은 정보 덕분이라 '''시간이 지나면 사라진다'''(p.32).\n{/warn}\n\n{quiz}\n\"감각 기억에서 부호화된 정보가 짧게 유지되며, 되뇌기를 못 하면 약 12초 뒤 거의 사라지는 기억\"의 명칭은?\n{/quiz}\n{answer}\n'''단기 기억'''. 이를 적극적 처리까지 하는 기억으로 확장한 것은 [[작업 기억]](Baddeley).\n{/answer}\n\n== 관련 문서 ==\n* [[피터슨과 피터슨 실험]] · [[매직 넘버 7]] · [[청크화]] · [[작업 기억]]\n* [[감각 기억]] · [[앳킨슨-시프린 모형]] · [[계열 위치 효과]]\n\n근거: 6장 p.6, p.16–18"
 },
 "피터슨과 피터슨 실험": {
  "title": "피터슨과 피터슨 실험 (Peterson & Peterson, 1959)",
  "category": [
   "6장 기억",
   "실험"
  ],
  "body": "'''피터슨과 피터슨 실험'''은 [[단기 기억]]이 '''되뇌기 없이 얼마나 버티는지'''를 잰 실험이다. 철자 3개를 보여 준 직후 '''숫자에서 3씩 거꾸로 빼는 암산'''을 시켜 속으로 되뇌지 못하게 막고, 3~18초 뒤 철자를 회상하게 했다. 결과: 시간이 길어질수록 회상률이 떨어져 '''약 12초'''가 지나면 '''10% 미만'''.\n\n{def}\n'''설명''': 철자 3개를 제시한 뒤 숫자에서 3씩 차감하는 암산을 시켜 되뇌기를 막고, 3~18초 간격 후 철자를 회상하게 하여 단기 기억의 유지 시간(약 12초)을 밝힌 실험 (6장 p.16–17)\n'''명칭''': [[피터슨과 피터슨 실험]] (Peterson & Peterson, 1959)\n{/def}\n\n{analogy}\n이 실험은 '''전화번호를 외우는 친구 옆에서 계속 말 시키기'''다. 번호를 들은 친구는 원래 속으로 \"공일공, 일이삼사…\"를 중얼거리며(되뇌기) 버틴다. 그런데 옆에서 \"100에서 3씩 빼 봐! 97, 94, …\" 하고 입과 머리를 묶어 버리면, 12초 뒤엔 번호가 거의 남지 않는다. 암산은 '''되뇌기 방해꾼'''이다.\n{/analogy}\n\n{| class=\"table\"\n! 실험 카드 || \n|-\n| 연구자(연도) || Peterson & Peterson (1959)\n|-\n| 질문 || 되뇌기를 못 하면 단기 기억은 얼마나 유지되나?\n|-\n| 절차 || ① 영어 철자 3개 제시 (CHJ, AFT, EYX, LIR, OSM…) ② 이어서 숫자 제시 (29, 46, 31…) ③ 그 숫자에서 '''3씩 순차적으로 차감하는 암산''' ④ 일정 시간 간격('''3~18초''') 후 회상 요청 → 철자 3개 회상\n|-\n| 결과 || 간격이 길수록 회상률 감소. '''약 12초''' 후 회상률 '''10% 미만'''\n|-\n| 결론 || 되뇌기를 하지 못하면 단기 기억의 유지 시간은 '''약 12초'''\n|-\n| 함정 || 암산의 목적은 '''되뇌기(통제 처리) 방지'''. 청크화 유도·감각 기억 용량 증가·장기 기억 이동 극대화가 '''아님'''\n|}\n\n<pre class=\"ascii\">\n [CHJ] 제시 → [29] 제시 → \"29, 26, 23, 20, …\" (3씩 빼기 = 되뇌기 차단)\n                              │\n              3초 ─ 6초 ─ 9초 ─ 12초 ─ 15초 ─ 18초 후 \"철자는?\"\n 회상률:      높음 ───────────────▶ 12초 ≈ 10% 미만 ──▶ 바닥\n<\/pre>\n\n[[img:L6-16.png|6장 p.16 — Peterson & Peterson(1959)의 실험 패러다임. 왼쪽 검은 상자의 철자 3개(CHJ·AFT·EYX·LIR·OSM)와 오른쪽 숫자(29·46·31·55·62)|medium]]\n[[img:L6-17.png|6장 p.17 — 실험 결과. 자음을 회상한 비율이 시간(3~18초)에 따라 급감. 그래프 안 메모 \"되뇌기를 하지 못하면 신속히 소멸함\"|medium]]\n\n{exam}\nbank 객관식이 그대로 이 질문이다 — \"철자 3개를 외운 뒤 3씩 빼는 암산을 하게 한 이유는?\" → '''되뇌기와 같은 통제 처리를 막아 단기 기억의 순수한 유지 시간을 알아보기 위해'''. 슬라이드 문장: \"숫자 암산을 수행한 이유는 단기 기억에서 발생한 '''통제 처리'''를 방지하기 위함\"(p.17). → [[자동 처리와 통제 처리]]\n{/exam}\n\n{warn}\n오답 보기 해부:\n* \"감각 기억 용량을 늘리려고\" ✘ — 감각 기억과 무관.\n* \"청크화를 유도하려고\" ✘ — 오히려 유지를 '''방해'''하는 과제다.\n* \"장기 기억으로 가는 정보량을 최대화하려고\" ✘ — 되뇌기를 막으면 장기 기억 이동은 '''줄어든다'''.\n{/warn}\n\n== 비교: 감각 기억 실험 vs 단기 기억 실험 ==\n\n{| class=\"table\"\n! || [[스펄링 실험]] (1960) || 피터슨과 피터슨 (1959)\n|-\n| 대상 || [[감각 기억]] || [[단기 기억]]\n|-\n| 핵심 조작 || 소리 단서의 '''유무·지연''' || 암산으로 '''되뇌기 차단''' + 시간 간격\n|-\n| 결론 수치 || 3~4개, 0.5~1초 || 약 12초 (10% 미만)\n|}\n\n== 관련 문서 ==\n* [[단기 기억]] · [[매직 넘버 7]](용량) · [[자동 처리와 통제 처리]](통제 처리)\n* [[스펄링 실험]] · [[6장 기억]]\n\n근거: 6장 p.16–17"
 },
 "매직 넘버 7": {
  "title": "매직 넘버 7 (조지 밀러, 1956) — 7±2",

  "body": "'''매직 넘버 7'''은 [[단기 기억]]의 '''용량이 7±2개 항목 정도'''라는 조지 밀러(George Miller, 1956)의 제안이다. 한 번에 머릿속에 붙잡아 둘 수 있는 덩어리가 대략 5~9개라는 뜻이다. 단, 철자나 단어는 보통 '''5~6개''' 정도라는 후속 제안(Baddeley et al., 1985)도 있어 '''정보 유형에 따라 다소 차이'''가 있다.\n\n{def}\n'''설명''': 단기 기억의 용량은 7±2개 항목 정도라는 조지 밀러(1956)의 제안 (6장 p.18)\n'''명칭''': [[매직 넘버 7]] (Magic Number 7)\n{/def}\n\n{warn}\n'''슬라이드 오류 주의''': 원본 PPTX p.18 에는 \"단기 기억의 용량은 '''72개''' 항목 정도\"로 보이는 표기가 있다. 이는 '''7±2개'''의 ± 기호가 빠진 오기다. 단기 기억이 72개를 담을 리 없다 — 정답은 '''7±2''' (5~9개). (위키 캡처본 PDF 에는 7±2 로 제대로 렌더링되어 있다.)\n{/warn}\n\n{analogy}\n매직 넘버 7은 '''한 손에 쥘 수 있는 구슬 개수'''다. 구슬 낱개로는 7개쯤에서 손가락 사이로 흘러내린다. 그런데 구슬을 '''작은 주머니'''에 나눠 담으면 주머니 7개를 쥘 수 있다 — 주머니 하나에 구슬이 몇 개 들었든. 이 주머니가 [[청크화|청크]]다. 그래서 7±2 는 '''낱개 7개'''가 아니라 '''덩어리 7개'''다.\n{/analogy}\n\n{| class=\"table\"\n! 인물 카드 || \n|-\n| 이름 || 조지 밀러 (George Miller)\n|-\n| 분야 || 인지심리학 (단기 기억 용량)\n|-\n| 핵심 주장 || 단기 기억 용량 = '''7±2개 항목''' (매직 넘버 7)\n|-\n| 슬라이드 표기 || 매직 넘버 7 (조지 밀러, 1956) (p.18)\n|-\n| 시험 포인트 || 7±2 ↔ 감각 기억 3~4개 혼동 금지, \"72개\" 오기\n|}\n\n[[img:L6-18.png|6장 p.18 — 숫자 폭 과제 예시. 위: 1개(7) → 2개(4 9) → 3개(3 8 1) → 4개(6 2 9 5) … 5개(1 7 4 9 2)를 듣고 같은 순서로 회상. 아래: 2148 · 37542 · 84301 · 629758 · 91430985|medium]]\n\n== 조지 밀러 ==\n{def}\n'''설명''': 단기 기억의 용량이 7±2개 항목 정도라는 '매직 넘버 7'을 제안한 학자 (1956) (6장 p.18)\n'''명칭''': [[매직 넘버 7|조지 밀러]] (George Miller)\n{/def}\n\n== 숫자 폭 과제 ==\n{def}\n'''설명''': 점점 길어지는 숫자열(2148 → 37542 → … → 91430985)을 듣고 같은 순서로 회상하게 하여 단기 기억 용량을 측정하는 과제 (6장 p.18 그림)\n'''명칭''': [[매직 넘버 7|숫자 폭 과제]] (Digit Span Task)\n{/def}\n\n[[sim:working_memory_span]]\n\n시뮬레이터에서 `chunk = off` 로 두면 8자리 91430985 는 7±2 의 '''경계''', `chunk = on` 으로 914·309·85 처럼 끊으면 '''3청크'''로 여유 있게 들어간다.\n\n== p.18 의 나머지 내용 ==\n\n{| class=\"table\"\n! 내용 || 출처 (슬라이드 표기)\n|-\n| 단기 기억 용량 '''7±2개''' 항목 || 조지 밀러, 1956\n|-\n| 철자나 단어는 보통 '''5~6개''' — 정보 유형에 따라 차이 || Baddeley et al., 1985\n|-\n| 작업 기억 용량은 '''젊은 성인 > 아동·노인''' || Bopp & Verhaeghen, 2020\n|-\n| 여러 과제를 번갈아 하면 '''전환에 따른 효율 감소''' || Steyvers et al., 2019\n|}\n\n{tip}\n'''전환 비용'''은 공부법으로 바로 쓸 수 있다. 심리학 단어장 보다가 카톡 확인하고 다시 돌아오면 그때마다 작업 기억이 \"짐을 다시 싸는\" 비용을 낸다. 한 번에 한 과제.\n{/tip}\n\n{quiz}\n\"단기 기억의 용량은 7±2개 항목 정도\"라고 제안한 학자와 그 개념의 명칭은?\n{/quiz}\n{answer}\n'''조지 밀러'''(1956), '''매직 넘버 7'''. 감각 기억(3~4개)이 아니라 '''단기 기억'''의 용량이다.\n{/answer}\n\n== 관련 문서 ==\n* [[청크화]] · [[단기 기억]] · [[작업 기억]]\n* [[감각 기억]](3~4개와 비교) · [[자주 틀리는 함정 모음]] · [[6장 기억]]\n\n근거: 6장 p.18"
 },
 "작업 기억": {
  "title": "작업 기억 (Working Memory) — 배들리 & 히치 (Baddeley & Hitch, 1974)",
  "category": [
   "6장 기억",
   "이론"
  ],
  "body": "'''작업 기억'''(Working Memory)은 [[단기 기억]]을 확장한 개념으로, '''입력된 감각 정보와 장기 기억에서 인출된 정보의 적극적 처리를 수반하는 기억'''이다. 단기 기억이 \"잠깐 담아 두는 그릇\"이라면 작업 기억은 \"담아 둔 걸 '''가지고 일하는''' 작업대\"다. Baddeley 가 제안했고, 모형은 '''Baddeley & Hitch(1974)''' — [[중앙 집행기]] + '''시공간 잡기장''' + [[음운 루프]].\n\n{def}\n'''설명''': 단기 기억을 확장하여, 입력된 감각 정보와 장기 기억에서 인출된 정보의 적극적 처리를 수반하는 기억 (6장 p.6)\n'''명칭''': [[작업 기억]] (Working Memory)\n{/def}\n\n{def}\n'''설명(사례형)''': 머릿속으로 \"37 × 4\"를 계산할 때, 중간값 148을 붙잡아 둔 채 계산을 이어 가는 기억 체계\n'''명칭''': [[작업 기억]]\n{/def}\n\n{analogy}\n작업 기억은 '''주방의 조리대와 셰프'''다. 냉장고(장기 기억)에서 재료를 꺼내(인출) 조리대에 올려놓고, 셰프(중앙 집행기)가 \"이건 썰고 저건 볶아\"라며 두 보조 요리사 — '''말로 레시피를 중얼거리며 외우는 보조'''(음운 루프)와 '''접시 배치를 머릿속에 그리는 보조'''(시공간 잡기장) — 에게 일을 나눠 준다. 단기 기억은 조리대 '''크기'''만 말했지만, 작업 기억은 그 위에서 '''요리가 만들어지는 과정'''까지 설명한다.\n{/analogy}\n\n[[img:L6-08.png|6장 p.8 — Baddeley & Hitch(1974)의 작업기억 모형. 위 초록 화살표 '주의 할당/조율', 가운데 원 '중앙집행기', 왼쪽 '음운 루프(언어와 청각 정보)', 오른쪽 '시공간 잡기장(시각과 공간 정보)'|large]]\n\n[[anim:working_memory|가운데 중앙 집행기가 좌우로 일을 나눠 주는 화살표를 보고, 음운 루프의 '쇠잔 막대'가 되뇌기 때마다 다시 차오르는 순간을 확인하자]]\n\n== 왜 단기 기억을 확장했나 (p.7) ==\n\n[[img:L6-07.png|6장 p.7 — 단기 기억(정보의 저장에 초점을 둔 개념: 사과·책·강을 상자에 담음) → 작업 기억(정보의 저장에서 확장하여 정보의 조작 및 활용에 초점: 조작·저장·활용)|medium]]\n\n* 단기 기억은 '''정보의 저장'''에 주안점을 둔 개념이다.\n* 그러나 저장이라는 기제만으로는 인간의 활동을 설명하는 데 한계가 있다 — [[앳킨슨-시프린 모형|다중 저장고 모형]]에서 인간의 특정 반응·출력값은 단기 기억의 활동을 기반으로 수행되기 때문.\n* 그래서 일련의 '''출력값을 만들어 낼 수 있는 적극적인 기제'''로 확장할 필요 → '''Baddeley 가 작업 기억을 제안'''.\n\n== 구성 요소 3개 (p.8) ⭐⭐⭐ ==\n\n{| class=\"table\"\n! 구성 요소 || 원어 || 하는 일 || 예\n|-\n| '''[[중앙 집행기]]''' || Central Executive || 장기 기억으로부터 정보 인출, 과제 수행의 집중 및 '''주의 분배''', 두 하위 시스템의 활동 '''조정''' || \"지금은 지도를 보고, 다음엔 번호를 외워\"\n|-\n| '''시공간 잡기장''' || Visuospatial sketch pad || '''시각 심상'''에 기반한 기억 정보 유지 || 길 찾을 때 머릿속 지도\n|-\n| '''[[음운 루프]]''' || Phonological loop || '''음운 저장소'''(정보 유지) + '''조음 되뇌기 처리'''(정보의 쇠잔 방지) || 전화번호를 속으로 되뇌기\n|}\n\n=== 시공간 잡기장 ===\n{def}\n'''설명''': 작업 기억 모형에서 시각 심상에 기반한 기억 정보를 유지하는 구성 요소 (6장 p.8)\n'''명칭''': [[작업 기억|시공간 잡기장]] (Visuospatial Sketch Pad)\n{/def}\n\n=== 배들리 ===\n{def}\n'''설명''': 단기 기억의 저장 개념을 확장하여 작업 기억을 제안하고, 히치와 함께 중앙 집행기·시공간 잡기장·음운 루프 모형(1974)을 만든 학자 (6장 p.7–8)\n'''명칭''': [[작업 기억|배들리]] (Alan Baddeley)\n{/def}\n\n== 작업 기억의 특성 (p.9, p.18) ==\n\n{| class=\"table\"\n! 특성 || 내용 || 출처 (슬라이드 표기)\n|-\n| 개인차 || 특정 개인은 더 우수한 작업 기억 보유 가능 || Balaban et al., 2019\n|-\n| '''선천성''' || 유전적 요인이 '''절반 정도''' 설명 || Knowles et al., 2014\n|-\n| '''후천성''' || 스트레스에 노출된 아동은 후에 작업 기억 역량 저하 || Goodman et al., 2019\n|-\n| 일시적 요인 || 일시적 심리적 '''피로'''로 감소 || Garrison et al., 2019\n|-\n| 연령 || 젊은 성인 > 아동·노인 || Bopp & Verhaeghen, 2020\n|}\n\n→ \"작업 기억은 '''선천성과 후천성을 모두''' 지니고 있다\" — 서막 [[선천성-후천성 논제]]의 결론(\"둘 다 중요\")이 여기서도 반복된다.\n\n== N-Back 과제 (p.10, 번외) ==\n{def}\n'''설명''': 현재 제시된 자극이 N회 이전에 제시된 자극과 동일한지 여부를 판단하게 하여, 정보의 유지와 조작을 모두 요구함으로써 작업 기억을 측정하는 과제 (1~3 Back) (6장 p.10)\n'''명칭''': [[작업 기억|N-Back 과제]]\n{/def}\n\n[[img:L6-10.png|6장 p.10 — N-Back 과제 절차도식. 1 → 3 → 1 → 1 → 5 가 차례로 제시. 2-Back 이면 세 번째 '1'이 두 개 전 '1'과 같으므로 '같다'|medium]]\n\n<pre class=\"ascii\">\n 제시 순서:   1     3     1     1     5\n 1-Back:      -   (1?)✘ (3?)✘ (1?)✔ (1?)✘     ← 바로 앞과 비교\n 2-Back:      -     -   (1?)✔ (3?)✘ (1?)✘     ← 두 개 앞과 비교\n              └ 유지(N개 붙잡기) + 조작(지금 것과 비교) = 작업 기억\n<\/pre>\n\n{warn}\n* '''N-Back 과제는 작업 기억의 구성 요소가 아니다''' — 작업 기억을 '''측정'''하는 과제다(bank 오답 보기).\n* 시각 심상 유지는 '''시공간 잡기장''', 소리 되뇌기는 '''음운 루프'''. \"음운 루프: 시각 심상을 기반으로 위치 정보 유지\"는 이름과 기능을 엇갈린 오답.\n* 단기 기억 = 저장, 작업 기억 = 저장 + '''처리'''. 둘을 같다고 하는 보기 주의.\n{/warn}\n\n{exam}\n통합요약 단답형 예상 4·5·6번이 전부 여기다: 주의 분배·하위 시스템 조정 → '''중앙 집행기''' (bank SA 정답), 조음 되뇌기로 소리 정보 유지 → '''음운 루프''', N회 전 자극과 같은지 판단 → '''N-Back 과제'''.\n{/exam}\n\n== 관련 문서 ==\n* [[중앙 집행기]] · [[음운 루프]] · [[단기 기억]] · [[매직 넘버 7]]\n* [[앳킨슨-시프린 모형]] · [[컴퓨터 메타포]](RAM = 작업 기억) · [[6장 기억]]\n\n근거: 6장 p.6–10, p.18"
 },

  "body": "'''중앙 집행기'''(Central Executive)는 Baddeley & Hitch(1974)의 [[작업 기억]] 모형 한가운데 있는 '''관제탑'''이다. 스스로 정보를 담아 두기보다는 '''장기 기억에서 정보를 인출'''하고, 과제 수행에 '''주의를 집중·분배'''하며, 양옆의 '''시공간 잡기장과 [[음운 루프]]의 활동을 조정'''한다. 슬라이드 그림 위의 초록 양방향 화살표 '''\"주의 할당/조율\"'''이 이 녀석의 직함이다. '''bank 단답형 정답'''이다.\n\n{def}\n'''설명''': 작업 기억 모형에서 장기 기억으로부터 정보를 인출하고, 과제 수행의 집중 및 주의를 분배하며, 시공간 잡기장과 음운 루프의 활동을 조정하는 구성 요소 (6장 p.8)\n'''명칭''': [[중앙 집행기]] (Central Executive)\n{/def}\n\n{def}\n'''설명(사례형)''': 운전하면서 내비 음성 안내(소리)와 도로 지도(그림)를 동시에 처리할 때, 어느 쪽에 주의를 얼마나 줄지 나누고 두 처리를 조율하는 작업 기억의 구성 요소\n'''명칭''': [[중앙 집행기]]\n{/def}\n\n{analogy}\n중앙 집행기는 '''오케스트라 지휘자'''다. 지휘자는 직접 악기를 연주하지 않는다. 대신 \"지금은 현악(음운 루프) 크게, 관악(시공간 잡기장)은 쉬고\", \"악보 창고(장기 기억)에서 2악장 가져와\"라고 지시한다. 지휘자가 지치면(피로·스트레스) 연주 전체가 엉망이 된다 — 작업 기억이 피로에 약한 이유다(p.9).\n{/analogy}\n\n[[img:L6-08.png|6장 p.8 — 가운데 원이 '중앙집행기'. 그 위 초록 화살표 '주의 할당/조율'이 양옆 음운 루프·시공간 잡기장으로 뻗는다|medium]]\n\n[[anim:working_memory|가운데 중앙 집행기에서 좌우로 뻗는 지시 화살표, 그리고 장기 기억에서 정보를 끌어오는 화살표 세 개를 세어 보자]]\n\n== 세 가지 일 (p.8) ==\n\n{| class=\"table\"\n! 일 || 슬라이드 문장 || 비유\n|-\n| ① 인출 || 장기 기억으로부터 정보 인출 || 창고에서 악보 꺼내 오기\n|-\n| ② 주의 || 과제 수행의 집중 및 주의 분배 || 어느 파트를 크게 할지\n|-\n| ③ 조정 || 시공간 잡기장과 음운 루프의 활동 조정 || 두 파트 박자 맞추기\n|}\n\n== 세 구성 요소 비교 ==\n\n{| class=\"table\"\n! || 중앙 집행기 || 시공간 잡기장 || [[음운 루프]]\n|-\n| 역할 || '''주의 할당/조율''', 인출, 조정 || '''시각 심상''' 기반 정보 유지 || 음운 저장소 + '''조음 되뇌기'''\n|-\n| 그림 위치 || 가운데 원 || 오른쪽 (시각과 공간 정보) || 왼쪽 (언어와 청각 정보)\n|-\n| 단서 단어 || \"분배\", \"조정\", \"통제\" || \"그림\", \"지도\", \"위치\" || \"소리\", \"되뇌기\", \"쇠잔\"\n|}\n\n{warn}\n\"주의 분배\" 와 \"조정\" 이 나오면 무조건 '''중앙 집행기'''. 시공간 잡기장이나 음운 루프는 '''유지'''만 한다. 또 슬라이드에서 중앙 집행기가 하는 '''인출'''은 [[앳킨슨-시프린 모형]]의 인출(장기 → 단기/작업)과 같은 방향이다.\n{/warn}\n\n{quiz}\nBaddeley & Hitch(1974)의 작업 기억 모형에서 장기 기억으로부터 정보를 인출하고 주의를 분배하며 두 하위 시스템의 활동을 조정하는 구성 요소의 명칭은?\n{/quiz}\n{answer}\n'''중앙 집행기'''(Central Executive). 허용 표기: 중앙집행기. (bank 단답형 그대로)\n{/answer}\n\n== 관련 문서 ==\n* [[작업 기억]] · [[음운 루프]] · [[선택적 주의]](주의 분배)\n* [[6장 기억]]\n\n근거: 6장 p.8"
 },
 "음운 루프": {
  "title": "음운 루프 (Phonological Loop)",
  "category": [
   "6장 기억",
   "용어"
  ],
  "body": "'''음운 루프'''(Phonological Loop)는 [[작업 기억]]에서 '''언어와 청각 정보'''를 맡는 하위 시스템이다. 두 부품으로 되어 있다 — 정보를 담아 두는 '''음운 저장소'''와, 그 정보가 사라지지 않게 속으로 계속 되풀이하는 '''조음 되뇌기 처리'''. 이름 그대로 소리가 '''고리(loop)'''를 돌며 유지된다.\n\n{def}\n'''설명''': 작업 기억 모형에서 음운 저장소(정보 유지)와 조음 되뇌기 처리(정보의 쇠잔 방지)로 언어·청각 정보를 유지하는 구성 요소 (6장 p.8)\n'''명칭''': [[음운 루프]] (Phonological Loop)\n{/def}\n\n{def}\n'''설명(사례형)''': 지영은 전화번호를 외울 때 속으로 소리 내어 계속 되뇌며 유지한다. 이때 주로 작동하는 작업 기억 구성 요소\n'''명칭''': [[음운 루프]]\n{/def}\n\n{analogy}\n음운 루프는 '''회전초밥 레일'''이다. 접시(소리 정보)는 레일 위(음운 저장소)에 놓여 있지만 가만두면 말라 버린다(쇠잔). 그래서 레일이 계속 돌며 접시를 다시 앞으로 가져온다(조음 되뇌기). 레일을 멈추게 하면 — 예를 들어 [[피터슨과 피터슨 실험]]처럼 입으로 \"97, 94, 91…\"을 시키면 — 접시는 12초 안에 다 말라 버린다.\n{/analogy}\n\n[[img:L6-08.png|6장 p.8 — 왼쪽 상자 '음운 루프: 언어와 청각 정보'. 오른쪽은 시공간 잡기장, 가운데는 중앙집행기|medium]]\n\n[[anim:working_memory|왼쪽 음운 루프에서 전화번호가 고리를 돌 때마다 '쇠잔 막대'가 다시 가득 차는 장면을 보고, 되뇌기가 멈추면 어떻게 되는지 확인하자]]\n\n== 두 부품 ==\n\n=== 음운 저장소 ===\n{def}\n'''설명''': 음운 루프에서 정보 유지를 담당하는 부분 (6장 p.8)\n'''명칭''': [[음운 루프|음운 저장소]] (Phonological Store)\n{/def}\n\n=== 조음 되뇌기 ===\n{def}\n'''설명''': 음운 루프에서 정보의 쇠잔(decay)을 방지하는 처리 — 속으로 되풀이해 말하기 (6장 p.8)\n'''명칭''': [[음운 루프|조음 되뇌기]] 처리 (Articulatory Rehearsal)\n{/def}\n\n<pre class=\"ascii\">\n       ┌──────────── 조음 되뇌기 (쇠잔 방지) ────────────┐\n       │                                                  ▼\n  \"010-1234\" ──▶ [ 음운 저장소 (유지) ] ──(가만두면)──▶ 쇠잔 … 사라짐\n       ▲                                                  │\n       └────────────── 다시 앞으로 ◀─────────────────────┘\n<\/pre>\n\n== 음운 루프 vs 시공간 잡기장 ==\n\n{| class=\"table\"\n! || 음운 루프 || [[작업 기억|시공간 잡기장]]\n|-\n| 다루는 정보 || '''언어와 청각''' 정보 || '''시각과 공간''' 정보\n|-\n| 하는 일 || 음운 저장소 + 조음 되뇌기 || 시각 심상 기반 유지\n|-\n| 예 || 전화번호 속으로 되뇌기, 단어 목록 외우기 || 머릿속 지도, 방 배치 떠올리기\n|-\n| 조율자 || [[중앙 집행기]] || [[중앙 집행기]]\n|}\n\n{warn}\nbank 객관식 오답 보기: \"'''음운 루프''': 시각 심상을 기반으로 위치 정보를 유지한다\" — 이름은 음운 루프인데 설명은 '''시공간 잡기장'''이다. 이름·기능 짝을 끝까지 확인할 것. 또 \"N-Back 과제: 작업 기억의 하위 구성 요소\" 도 오답(측정 과제일 뿐).\n{/warn}\n\n{quiz}\n속으로 소리 내어 되뇌어 정보가 사라지는 것을 막는, 음운 루프 안의 처리 이름은?\n{/quiz}\n{answer}\n'''조음 되뇌기''' 처리. 정보를 담아 두는 쪽은 '''음운 저장소'''. 둘을 합친 구성 요소가 '''음운 루프'''.\n{/answer}\n\n== 관련 문서 ==\n* [[작업 기억]] · [[중앙 집행기]] · [[피터슨과 피터슨 실험]](되뇌기 차단)\n* [[단기 기억]] · [[6장 기억]]\n\n근거: 6장 p.8"
 },
 "자동 처리와 통제 처리": {
  "title": "자동 처리와 통제 처리 (Automatic & Controlled Processing) — 이중 궤적 기억",
  "category": [
   "6장 기억",
   "이론"
  ],
  "body": "'''이중 궤적 기억'''은 기억이 만들어지는 길(궤적)이 '''두 갈래'''라는 생각이다. [[앳킨슨-시프린 모형|다중 저장고 모형]]은 의식적으로 주의를 기울여 부호화하는 [[외현 기억]]의 처리에 초점을 맞췄지만, 실제로는 '''무의식적 과정을 거쳐 직접 장기 기억으로 부호화'''되는 기억도 있다. 그 무의식적 길이 '''자동 처리''', 의식적 길이 '''통제 처리'''다. 2장 [[이중 처리]](의식·무의식 두 궤도)를 기억에 적용한 것.\n\n{def}\n'''설명''': 의식적 자각 없이 발생하는 부호화 과정. 암묵 기억 형성과 밀접한 연관 (6장 p.11)\n'''명칭''': [[자동 처리와 통제 처리|자동 처리]] (Automatic Processing)\n{/def}\n\n{def}\n'''설명''': 주의와 의식적 자각이 필요한 부호화 과정. 외현 기억 형성과 밀접한 연관 (6장 p.11)\n'''명칭''': [[자동 처리와 통제 처리|통제 처리]] (Controlled Processing)\n{/def}\n\n{analogy}\n자동 처리는 '''자동 결제(정기 구독)''', 통제 처리는 '''직접 결제'''다. 넷플릭스 구독료는 내가 신경 쓰지 않아도 매달 알아서 빠져나간다(빠르고 노력 불필요). 반면 처음 보는 쇼핑몰 결제는 카드 번호를 직접 확인하고 인증해야 한다(주의 집중, 노력 소모). 오늘 점심을 몇 시에 먹었는지(시간), 강의실 어디에 앉았는지(공간)는 자동 결제로 저장되고, 시험 범위 명칭은 직접 결제로만 저장된다.\n{/analogy}\n\n[[img:L6-11.png|6장 p.11 — 기억의 이중 처리 과정. 정보 입력 → 위: 자동 처리 과정(무의식적: 빠름, 노력 불필요) → 암묵기억(비의식적 기억) / 아래: 통제 처리 과정(의식적: 주의 집중 필요, 노력 소모) → 외현기억(의식적 기억)|large]]\n\n== 두 궤적 비교 (p.11) ==\n\n{| class=\"table\"\n! || 자동 처리 || 통제 처리\n|-\n| 원어 || automatic processing || controlled processing\n|-\n| 의식적 자각 || '''없이''' 발생 || 주의와 의식적 자각 '''필요'''\n|-\n| 속도·노력 (그림) || 빠름, 노력 불필요 || 주의 집중 필요, 노력 소모\n|-\n| 형성하는 기억 || '''[[암묵 기억]]''' || '''[[외현 기억]]'''\n|-\n| 예 || 공간·시간·사건의 빈도 (p.12) || 강의 내용 외우기, 되뇌기\n|-\n| 다중 저장고 모형에서 || 감각 → 장기 '''직행''' (p.5 '자동처리 과정' 화살표) || 감각 → 단기/작업 → 장기\n|}\n\n{info}\np.12: 공간, 시간, 사건의 빈도 등은 의식적 노력 없이 '''자동적 처리'''가 가능하다. 세부 사항을 자동으로 처리해 주는 덕분에 '''다른 필요한 부분에 의식적 노력을 기울일 수 있다'''. 그리고 p.13: 어떤 정보 처리가 자동화되기 '''전에는''' 외현 기억(통제 처리) 단계를 우선 거친다 — 처음 운전 배울 때는 하나하나 의식하다가 나중에 자동이 되는 것처럼.\n{/info}\n\n{exam}\n[[피터슨과 피터슨 실험]]에서 3씩 빼는 암산을 시킨 이유가 \"단기 기억에서 발생한 '''통제 처리'''(되뇌기)를 방지하기 위함\"(p.17)이다. 통제 처리 = 되뇌기처럼 '''의도적으로 붙잡는''' 처리. 그리고 p.19–21 의 청크·기억술·위계 구성은 슬라이드 제목부터 '''\"통제 처리 전략\"'''이다.\n{/exam}\n\n{warn}\n* 자동 처리 → '''암묵''', 통제 처리 → '''외현'''. 짝을 뒤집은 보기 주의.\n* \"모든 기억은 단기 기억을 거쳐야 장기 기억이 된다\" → ✘. 자동 처리는 감각 기억에서 장기 기억으로 바로 간다(p.5, p.11).\n{/warn}\n\n{quiz}\n\"의식적 자각 없이 발생하며 암묵 기억 형성과 밀접하게 연관된 부호화 과정\"의 명칭은?\n{/quiz}\n{answer}\n'''자동 처리'''(automatic processing). 통합요약 단답형 예상 7번.\n{/answer}\n\n== 관련 문서 ==\n* [[암묵 기억]] · [[외현 기억]] · [[이중 처리]](2장)\n* [[앳킨슨-시프린 모형]] · [[청크화]](통제 처리 전략) · [[6장 기억]]\n\n근거: 6장 p.11 (+ p.5, p.12–13, p.17)"
 },
 "암묵 기억": {

   "용어"
  ],
  "body": "'''암묵 기억'''(Implicit Memory)은 '''의식적 노력 없이 처리되거나 기술하기 어려운 정보'''의 기억이다. \"어떻게 하는지는 아는데 말로는 설명 못 하는\" 기억 — 자전거 타기, 피아노 치기, 치과 드릴 소리만 들어도 몸이 굳는 것. 하위 분류는 '''절차 기억'''과 '''[[고전적 조건화]]'''(p.12 그림), 그리고 p.30 에서 '''[[점화]]'''도 \"암묵 기억의 한 종류\"로 소개된다. 뇌에서는 '''[[소뇌]]와 기저 신경절'''이 담당하며, [[해마]]가 손상되어도 멀쩡하다.\n\n{def}\n'''설명''': 의식적 노력 없이 처리되거나 기술하기 어려운 정보에 대한 기억 (6장 p.12)\n'''명칭''': [[암묵 기억]] (Implicit Memory)\n{/def}\n\n{def}\n'''설명(사례형)''': 해마를 제거해 새로운 의식적 기억을 만들지 못하는 환자라도, 반복 연습한 운동 기술은 형성될 수 있다(Xu & Corkin, 2001). 이처럼 해마 손상 뒤에도 보존되는 기억 유형\n'''명칭''': [[암묵 기억]] (그중 절차 기억)\n{/def}\n\n{analogy}\n암묵 기억은 '''손에 밴 타자 실력'''이다. 키보드를 안 보고 빠르게 치는 사람에게 \"'ㅎ'은 어느 손가락으로 쳐?\"라고 물으면 잠깐 허공에 손을 움직여 봐야 대답한다 — 손은 아는데 입은 모른다. 반대로 [[외현 기억]]은 '''타자 연습 교재의 설명문'''이다. 말로 줄줄 읽을 수 있다.\n{/analogy}\n\n[[img:L6-12.png|6장 p.12 — 외현 기억과 암묵 기억의 하위 분류. 빨간 박스: Implicit memory(의식적 노력 불필요, 말로 기술하기 어려움) → Classical conditioning(치과 드릴 예) / Procedural memory(Motor skills and habits: 피아노 연주)|medium]]\n\n== 하위 분류 ==\n\n=== 절차 기억 ===\n{def}\n'''설명''': 특정 행동을 수행하는 과정에 대한 정보의 기억 (암묵 기억의 하위 유형) — 기저 신경절이 형성을 촉진 (6장 p.12, p.28)\n'''명칭''': [[암묵 기억|절차 기억]] (Procedural Memory)\n{/def}\n\n{| class=\"table\"\n! 하위 유형 || 슬라이드 설명 || 예 (p.12 그림) || 담당 뇌 영역 (p.28)\n|-\n| '''절차 기억''' || 특정 행동을 수행하는 과정에 대한 정보 || 피아노를 칠 수 있다 (Motor skills and habits) || '''기저 신경절'''\n|-\n| '''[[고전적 조건화]]''' || 특정 사건 간의 연합 || 치과 드릴 소리 → 아픔 → 다음에 치과가 무섭다 || '''[[소뇌]]''' (파블로프 조건 형성)\n|-\n| '''[[점화]]''' (p.30) || 무의식적이고 자각할 수 없는 특정 연합의 활성화 || 병원 → 약국 || —\n|}\n\n== 뇌: 소뇌와 기저 신경절 (p.28) ==\n\n[[img:L6-28.png|6장 p.28 — 암묵 기억 체계: 소뇌와 기저 신경절. 뇌 단면도(전두엽·해마·기저신경절·편도체·소뇌)와 Implicit memory 박스|medium]]\n\n* 해마와 전두엽이 손상되어도 암묵 기억 체계는 '''정상적으로 작동 가능'''(자동 처리 기반).\n* '''[[소뇌]]''': 파블로프 조건 형성 담당 (Green & Woodruff-Pak, 2000)\n* '''기저 신경절''': 기술이나 행동에 대한 '''절차 기억'''의 형성 촉진 (Mishikin et al., 1997 — 슬라이드 표기)\n\n{exam}\np.33 + bank 객관식: \"외현 기억을 형성할 수 없는 사람이라도 '''절차 기억과 같은 암묵 기억은 형성할 수 있다'''\"(Xu & Corkin, 2001). '''환자 H.M.'''([[기억상실증]])이 대표 사례. \"H.M. 처럼 외현 기억을 못 만드는 사람은 암묵 기억도 전혀 못 만든다\" → ✘.\n{/exam}\n\n== 외현 vs 암묵 ==\n\n{| class=\"table\"\n! || [[외현 기억]] (explicit) || 암묵 기억 (implicit)\n|-\n| 정의 || 의식적 자각을 통해 '''서술할 수 있는''' 기억 || 의식적 노력 없이 처리되거나 '''기술하기 어려운''' 정보\n|-\n| 부호화 || [[자동 처리와 통제 처리|통제 처리]] || [[자동 처리와 통제 처리|자동 처리]]\n|-\n| 하위 || 일화 기억 · 의미 기억 || 절차 기억 · 고전적 조건화 (· 점화)\n|-\n| 뇌 || [[해마]] · 전(전)두엽 || [[소뇌]] · 기저 신경절\n|-\n| 해마 손상 시 || 새로 형성 불가 || '''정상 작동'''\n|}\n\n{warn}\n* 절차 기억은 '''해마'''가 아니라 '''기저 신경절'''. \n* [[점화]]는 외현이 아니라 '''암묵''' 기억의 한 종류(p.30).\n{/warn}\n\n== 관련 문서 ==\n* [[외현 기억]] · [[자동 처리와 통제 처리]] · [[기억상실증]](H.M.)\n* [[소뇌]] · [[고전적 조건화]] · [[점화]] · [[6장 기억]]\n\n근거: 6장 p.12, p.28 (+ p.30, p.33)"
 },
 "외현 기억": {
  "title": "외현 기억 (Explicit Memory)",
  "category": [
   "6장 기억",
   "용어"
  ],
  "body": "'''외현 기억'''(Explicit Memory)은 '''의식적 자각을 통해 서술할 수 있는 기억'''이다. \"말로 꺼낼 수 있는\" 기억 — 지난 생일에 뭘 받았는지(일화 기억), 토마토가 과일이라는 것(의미 기억). [[자동 처리와 통제 처리|통제 처리]]를 거쳐 형성되고, 뇌에서는 '''[[해마]]'''가 형성(응고화)을, '''전(전)두엽'''이 인출된 기억을 작업 기억에 유지하는 일을 맡는다.\n\n{def}\n'''설명''': 의식적 자각을 통해 서술할 수 있는 기억. 하위에 일화 기억과 의미 기억이 있다 (6장 p.13)\n'''명칭''': [[외현 기억]] (Explicit Memory)\n{/def}\n\n{analogy}\n외현 기억은 '''내 휴대폰의 사진첩과 메모장'''이다. 사진첩(일화 기억)에는 \"2026년 8월 25일, 첫 심리학 수업\" 처럼 '''언제·어디서'''가 찍혀 있고, 메모장(의미 기억)에는 \"작업 기억 = 중앙 집행기 + 음운 루프 + 시공간 잡기장\" 처럼 '''날짜 없는 지식'''이 적혀 있다. 둘 다 열어서 남에게 보여 줄(서술할) 수 있다. [[암묵 기억]]은 사진첩이 아니라 '''손가락에 밴 잠금 패턴'''이다.\n{/analogy}\n\n[[img:L6-13.png|6장 p.13 — 외현 기억과 암묵 기억의 하위 분류. 빨간 박스: Explicit memory → Episodic memory(개인이 경험한 사건: 지난 생일에 선물을 받았다) / Semantic memory(사실과 지식: 토마토는 채소가 아니라 과일)|medium]]\n\n== 하위 분류 (p.13) ==\n\n=== 일화 기억 ===\n{def}\n'''설명''': 어떤 경험 혹은 사건에 대한 기억 (외현 기억의 하위 유형) (6장 p.13)\n'''명칭''': [[외현 기억|일화 기억]] (Episodic Memory)\n{/def}\n\n=== 의미 기억 ===\n{def}\n'''설명''': 특정 지식에 대한 정보의 기억 (외현 기억의 하위 유형) (6장 p.13)\n'''명칭''': [[외현 기억|의미 기억]] (Semantic Memory)\n{/def}\n\n{| class=\"table\"\n! || 일화 기억 || 의미 기억 || 절차 기억\n|-\n| 분류 || 외현 || 외현 || '''암묵'''\n|-\n| 내용 || 경험·사건 || 지식 || 행동 수행 과정\n|-\n| 예 || 어제 점심에 뭘 먹었는지 || 프랑스의 수도는 파리 || 자전거 타기\n|-\n| 뇌 || [[해마]](형성) || [[해마]](형성) || 기저 신경절\n|}\n\n* 어떤 정보 처리가 자동화되기 '''전에는''' 외현 기억 단계를 우선 거치게 된다(p.13). 운전을 처음 배울 땐 \"깜빡이 켜고, 백미러 보고…\"를 말로 외우다가(외현), 익숙해지면 몸이 알아서 한다(암묵).\n\n== 뇌: 전두엽과 해마 (p.27) ==\n\n[[img:L6-27.png|6장 p.27 — 외현 기억 시스템: 전두엽과 해마. 위: 해마의 위치(뇌 속 노란 구조). 아래: 빨간 박스로 묶인 Explicit memory(Episodic·Semantic)|medium]]\n\n* '''[[해마]]'''는 외현 기억의 저장을 담당하며, 그 저장 과정이 '''[[기억 응고화]]'''(memory consolidation)다.\n* 수면이 기억 응고화를 지원한다(Peigneux et al., 2004) — 간격두기 효과가 생기는 이유와 연결.\n* 인출된 일화/의미 기억은 작업 기억 영역으로 보내지는데, 작업 기억 유지를 담당하는 것은 '''전전두엽'''(de Chastelaine et al., 2016). → [[연합 영역|전전두엽]]\n\n{warn}\n해마는 외현 기억을 '''형성(응고화)'''하는 곳이지 '''모든 장기 기억이 영구 저장되는 장소'''가 아니다(bank 객관식 정답이 바로 이 문장을 틀렸다고 고르는 문제). 해마가 망가져도 [[암묵 기억]]은 정상 작동한다.\n{/warn}\n\n{quiz}\n\"프랑스의 수도는 파리이다\"처럼 특정 지식에 대한 정보를 담는 외현 기억의 하위 유형은?\n{/quiz}\n{answer}\n'''의미 기억'''(Semantic Memory). \"어제 파리에 다녀왔다\"처럼 경험·사건이면 '''일화 기억'''.\n{/answer}\n\n== 관련 문서 ==\n* [[암묵 기억]] · [[해마]] · [[기억 응고화]] · [[자동 처리와 통제 처리]]\n* [[기억상실증]] · [[6장 기억]]\n\n근거: 6장 p.13, p.27"
 },
 "청크화": {
  "title": "청크화 (Chunking, 청크 만들기)",
  "category": [
   "6장 기억",
   "용어"
  ],
  "body": "'''청크화'''(Chunking)는 정보를 '''의미 있는 단위(청크)로 체제화'''해 기억하는 [[자동 처리와 통제 처리|통제 처리]] 전략이다. [[단기 기억]]의 용량은 [[매직 넘버 7|7±2]] 인데, 이 7은 '''낱개'''가 아니라 '''덩어리''' 7개다. 그래서 묶기만 잘하면 기존에 알려진 단기 기억 용량보다 '''더 많은 양의 정보를 저장'''할 수 있다. 예: 전화번호, 계좌번호.\n\n{def}\n'''설명''': 전체 정보에서 일부를 추출한 부분 집합(청크)으로, 의미 있는 단위로 체제화하여 단기 기억 용량보다 더 많은 정보를 저장할 수 있게 하는 통제 처리 전략 (6장 p.19)\n'''명칭''': [[청크화]] (Chunking)\n{/def}\n\n{def}\n'''설명(사례형)''': 01012345678 을 그대로 외우면 11자리라 버겁지만, 010-1234-5678 로 끊으면 세 덩어리라 쉽게 외워진다. 이 기억 전략은?\n'''명칭''': [[청크화]]\n{/def}\n\n{analogy}\n청크화는 '''이삿짐 박스 싸기'''다. 숟가락·젓가락·접시·컵을 낱개로 트럭에 실으면 칸이 금방 찬다. 하지만 \"주방\" 박스 하나에 다 넣으면 트럭 칸 하나만 쓴다. 트럭 칸 수(7±2)는 그대로인데, 박스 안에 든 물건 수는 훨씬 많아진다. '''칸을 늘리는 게 아니라 박스를 크게 만드는 것'''이 청크화다.\n{/analogy}\n\n[[img:L6-19.png|6장 p.19 — 청크 조직화의 예시(낱자 → 글자 묶음 → 단어 → 문장 → 구). 같은 글자들이 무의미한 낱자 → 단어 → 'WELL BEGUN IS HALF DONE / EVERY CLOUD HAS A SILVER LINING / TWO WRONGS DONT MAKE A RIGHT' 같은 속담으로 묶이면 기억하기 쉬워진다|medium]]\n\n[[sim:working_memory_span]]\n\n시뮬레이터에서 `chunk` 옵션을 on 으로 바꿔 보자. 8자리 91430985 가 914·309·85 의 '''3청크'''가 되면서 7±2 경계에서 \"여유\" 로 바뀐다.\n\n== 청크 조직화의 단계 (p.19 그림) ==\n\n<pre class=\"ascii\">\n 낱자          M  G  V  S  R  M  T …           ← 항목 수 많음 (용량 초과)\n   ▼\n 글자 묶음     WGV  SRMT …\n   ▼\n 단어          WELL · BEGUN · IS · HALF · DONE\n   ▼\n 문장/구       \"WELL BEGUN IS HALF DONE\"        ← 1 청크\n<\/pre>\n\n== 다른 통제 처리 전략과 비교 (p.19–21) ==\n\n{| class=\"table\"\n! 전략 || 하는 일 || 예 || 문서\n|-\n| '''청크화''' || 의미 있는 '''덩어리'''로 묶어 용량 확장 || 전화번호 010-1234-5678 || 이 문서\n|-\n| '''기억술''' (Mnemonics) || '''보조수단'''·단서 활용 || My Very Educated Mother Just Served Us Noodles (행성 순서) || [[6장 기억|기억술]]\n|-\n| '''위계 구성''' || '''층위'''(광의 → 협의)로 분류 || 동물 → 포유류(사자·호랑이·고래) / 조류 || [[6장 기억|위계 구성]]\n|}\n\n{tip}\n이 위키의 [[명칭 암기표]]가 장별·주제별로 나뉜 것도 청크화 + 위계 구성이다. \"6장 → 작업 기억 → {중앙 집행기, 음운 루프, 시공간 잡기장}\" 처럼 묶어서 외우면 낱개 30개보다 훨씬 덜 무겁다. p.41 기억 증진법에도 \"개념에 대한 선명한 이미지와 조직화(청크화)를 통한 기억술 활용\"이 들어 있다.\n{/tip}\n\n{warn}\n청크화는 단기 기억의 '''칸 수(7±2)'''를 늘리는 게 아니라 '''한 칸에 담는 양'''을 늘린다. \"청크화하면 단기 기억 용량이 20개로 늘어난다\" 같은 서술은 부정확. 또 [[피터슨과 피터슨 실험]]의 암산은 청크화를 '''유도'''하려는 것이 아니다(bank 오답).\n{/warn}\n\n{quiz}\n\"정보를 의미 있는 단위로 묶어 단기 기억 용량보다 많이 저장하는 전략\"의 명칭은?\n{/quiz}\n{answer}\n'''청크화'''(chunking, 청크 만들기). 통합요약 단답형 예상 8번.\n{/answer}\n\n== 관련 문서 ==\n* [[매직 넘버 7]] · [[단기 기억]] · [[자동 처리와 통제 처리]](통제 처리 전략)\n* [[6장 기억]](기억술·위계 구성·기억 증진법) · [[처리 수준]]\n\n근거: 6장 p.19 (+ p.18, p.41)"
 },

  "body": "'''간격두기 효과'''(Spacing Effect)는 '''학습 시점 간에 일정한 간격을 두고 공부·연습할 때 기억의 유지가 오래가는 현상'''이다. 한 번에 몰아서(집중 학습) 하는 것보다 학습 시점을 '''분산'''시키는 것이 더 효율적이다. 슬라이드 제목이 '''\"분산 훈련\"''', 서막 p.28 에서는 '''분산 학습'''이라고 불렀다. 왜 효과가 있나? '''[[기억 응고화|응고화]]'''(학습 내용을 더 강건한 형태로 변환하는 과정)와 관련되기 때문. 심리학에서 '''가장 신뢰할 수 있는 결과 중 하나'''(Stafford & Dewar, 2014)이고, '''벼락치기가 그다지 효율적이지 않은 이유'''다.\n\n{def}\n'''설명''': 학습 시점 간에 일정한 간격을 두고 공부/연습을 수행할 때, 기억의 유지가 오래가는 현상 (6장 p.22)\n'''명칭''': [[간격두기 효과]] (Spacing Effect)\n{/def}\n\n{def}\n'''설명(사례형)''': 같은 6시간을 공부하더라도 시험 전날 밤 6시간 몰아서 하는 것보다 일주일 동안 매일 1시간씩 나눠 한 학생이 더 오래 기억했다. 이 현상은?\n'''명칭''': [[간격두기 효과]] (= 분산 학습)\n{/def}\n\n{analogy}\n간격두기 효과는 '''시멘트 바르기'''다. 벽돌을 한꺼번에 열 장 쌓으면 아래 시멘트가 굳기 전에 무너진다(벼락치기). 한 층 쌓고 '''굳을 시간(응고화)'''을 준 다음 또 한 층 쌓아야 튼튼한 벽이 된다. 그 \"굳는 시간\"을 밤잠이 도와준다(p.27 수면이 응고화 지원).\n{/analogy}\n\n[[img:L6-22.png|6장 p.22 — 간격두기 효과. 위: 간격 학습(간격을 둔 학습) 1·2·3회차 사이에 '적당한 간격' → 기억 유지율 막대가 점점 높아짐(더 오래 기억하고 효과가 높음). 아래: 집중 학습(연속 학습) 1·2·3회차가 '짧은 간격'으로 붙어 있음 → 막대가 낮게 유지(빨리 잊히고 효과가 낮음)|large]]\n\n== 분산 학습 ==\n{def}\n'''설명''': 한 번에 몰아서 하지 않고 공부 시간을 분산시킬 때 더 오래 기억한다는 학습법 (서막 p.28) — 6장의 간격두기 효과와 같은 것\n'''명칭''': [[간격두기 효과|분산 학습]] (Spacing Effect / Distributed Practice)\n{/def}\n\n{exam}\n교수는 이 내용을 '''두 번''' 학습법으로 직접 권했다.\n* (🎙 8/25, 첫 수업 마무리 2:09:58–2:12:44) \"시험에는 수업 내용이 나온다\" + '''검증 효과(테스팅 임팩트)'''와 '''분산 학습(스페이싱 이펙트)'''을 공부법으로 조언. 서막 p.28.\n* (🎙 9/29, 5장 도입) \"공부 잘하는 방법은 학습 장보다 '''다음 주 기억 챕터'''에 더 연결된다.\"\n→ 통합요약 단답형 예상 9번: \"공부 시점을 나눠 하면 기억이 오래 유지되는 현상\" → '''간격두기 효과'''.\n{/exam}\n\n== 공부법 비교표: 간격두기 vs 검증 vs 깊은 처리 ==\n\n{| class=\"table\"\n! 공부법 || 핵심 || 왜 효과적 (슬라이드) || 반대(비효율)\n|-\n| '''간격두기 효과''' (p.22) || 학습 '''시점'''을 분산 || 응고화 과정과 관련 || 벼락치기(집중 학습)\n|-\n| '''[[검증 효과]]''' (p.23) || '''인출 연습'''(퀴즈·모의고사) || 정보에 대한 적극적 처리 수반 || 단순 반복(다시 읽기)\n|-\n| '''[[처리 수준|깊은 처리]]''' (p.24) || '''의미'''로 처리 || 처리 수준이 깊을수록 파지 우수 || 형태·소리만 보기\n|-\n| '''[[자기참조 효과]]''' (p.25) || '''나'''와 연관 || 자신과 의미 있게 연관 → 회상↑ || 남 일처럼 외우기\n|-\n| '''[[청크화]]''' (p.19) || '''덩어리'''로 묶기 || 단기 기억 용량보다 많이 저장 || 낱개로 외우기\n|}\n\n{info}\np.23 에서 검증 효과는 \"반복적 자기 검증을 통한 '''학습의 분산 방법 중 하나'''\"로 소개된다 — 즉 검증 효과는 간격두기의 한 방법으로 묶여 있다. p.41 기억 증진법 1번도 \"일정한 간격을 둔 학습(간격두기 효과)과 테스트(검증 효과)를 '''병행'''\". 두 효과는 서로 상쇄되지 않고 '''같이 쓰는 것'''이다.\n{/info}\n\n{warn}\nbank 객관식 오답 보기들:\n* \"한 번에 몰아서 공부할 때 기억이 가장 오래 유지된다는 현상\" ✘\n* \"학습 시점을 분산하는 것보다 같은 내용을 반복해서 읽는 것이 항상 더 효과적\" ✘\n* \"퀴즈·모의고사 같은 인출 연습과 함께 쓰면 효과가 상쇄되므로 병행하지 않는 것이 좋다\" ✘ (p.41 병행하라)\n* '''간격두기(시점 분산) ≠ 검증 효과(인출 연습)''' — 단답형에서 둘을 바꿔 쓰지 말 것.\n{/warn}\n\n{joke}\n이 문서를 시험 전날 밤에 처음 읽고 있다면… 이미 늦었다는 것이 이 문서의 내용이다. 그래도 지금이라도 [[검증 효과]]는 쓸 수 있다 → [[모의고사 복기]].\n{/joke}\n\n== 관련 문서 ==\n* [[검증 효과]] · [[기억 응고화]] · [[망각 곡선]](급락 구간에 복습)\n* [[서막 심리학 이야기]](p.28 학습법) · [[6장 기억]](기억 증진법)\n\n근거: 6장 p.22, p.27, p.41; 서막 p.28 (🎙 8/25, 9/29)"
 },
 "검증 효과": {
  "title": "검증 효과 (Testing Effect)",

  "body": "'''검증 효과'''(Testing Effect)는 '''학습 내용에 대한 인출을 연습하여 기억의 유지를 장기화시키는 현상'''이다. 교재를 여러 번 다시 읽는 것(단순 반복)보다 '''퀴즈·모의고사'''를 풀며 답을 스스로 떠올리는 것이 더 효과적이다. 이유는 정보에 대한 '''적극적인 처리'''가 수반되기 때문. 슬라이드는 이것을 \"반복적 자기 검증을 통한 학습의 분산 방법 중 하나\"로 소개한다. '''bank 단답형 정답'''이고, 교수가 첫 수업부터 공부법으로 권한 효과다.\n\n{def}\n'''설명''': 학습 내용에 대한 인출을 연습하여 기억의 유지를 장기화시키는 현상. 단순 반복보다 '퀴즈', '모의고사'를 수행하는 것이 더욱 효과적 (6장 p.23)\n'''명칭''': [[검증 효과]] (Testing Effect)\n{/def}\n\n{def}\n'''설명(사례형)''': 철수는 시험을 앞두고 교재를 여러 번 다시 읽는 대신, 교재를 덮고 예상 문제를 스스로 풀며 답을 떠올리는 연습을 했다. 그 결과 단순히 반복해서 읽은 친구보다 더 오래 기억했다. 이 현상은?\n'''명칭''': [[검증 효과]]\n{/def}\n\n{analogy}\n검증 효과는 '''길을 외우는 두 가지 방법'''이다. 조수석에 앉아 같은 길을 열 번 구경하는 것(다시 읽기)보다, 직접 운전대를 잡고 '''한 번 헤매 보며''' 길을 찾아가는 것(인출 연습)이 훨씬 오래 남는다. 헤매는 그 순간이 바로 \"적극적인 처리\"다. 그리고 \"모의고사\"는 실전과 같은 길을 미리 달려 보는 것이라 [[부호화 명세성 원리|맥락]]까지 같이 익는다.\n{/analogy}\n\n[[img:L6-23.png|6장 p.23 — 검증 효과. 위: 단순 반복 학습(다시 읽고 반복) 1·2·3회차 → 기억 유지율 막대가 낮음(기억 유지가 낮음). 아래: 예비 시험 문제 풀이(스스로 회상하며 학습) 1·2·3회차 → 막대가 높음(기억 유지가 높음)|large]]\n\n== 단순 반복 vs 인출 연습 ==\n\n{| class=\"table\"\n! || 단순 반복 학습 || 예비 시험 문제 풀이 (인출 연습)\n|-\n| 하는 일 || 다시 읽고 반복 || 스스로 회상하며 학습\n|-\n| 처리 || 수동적 (눈으로 훑기) || '''적극적''' 처리\n|-\n| 기억 유지 (p.23 그림) || 낮음 || '''높음'''\n|-\n| 기억 측정법으로 치면 || [[재인]]에 가까움 (\"아 이거 본 적 있어\") || '''[[회상]]''' (직접 생성)\n|}\n\n{exam}\n* (🎙 8/25, 첫 수업 마무리) 교수가 \"시험에는 수업 내용이 나온다\"고 하면서 '''검증 효과(테스팅 임팩트)'''와 분산 학습을 공부법으로 권함. 서막 p.28: \"단순 반복보다 '''예시 문제를 직접 출제해 풀어 보는 것'''이 오래 기억에 남음 → 능동적·적극적 처리 필요.\"\n* (🎙 9/29) \"공부 방법은 다음 주 기억 챕터에 더 연결\" → p.19–25, p.41 ⭐ 가중.\n* bank 단답형 정답 = '''검증 효과''' (허용: 검증효과, testing effect, 테스트 효과).\n{/exam}\n\n{info}\n정리본 노트: 모의고사는 '''시험 맥락 정보'''(문제 형식·시간 압박)까지 같이 학습되어 실전에서 인출이 쉬워지는 부가 효과가 있다 → [[부호화 명세성 원리]]. 이 위키의 모든 `{quiz}` 박스와 [[모의고사 복기]]가 검증 효과를 쓰라고 있는 것이다.\n{/info}\n\n== 검증 효과 vs 간격두기 효과 ==\n\n{| class=\"table\"\n! || 검증 효과 (p.23) || [[간격두기 효과]] (p.22)\n|-\n| 핵심 변수 || '''무엇을''' 하나 — 인출 연습 || '''언제''' 하나 — 학습 시점 분산\n|-\n| 반대 || 단순 반복(다시 읽기) || 벼락치기(집중 학습)\n|-\n| 이유 || 적극적 처리 수반 || 응고화와 관련\n|-\n| 관계 || \"학습의 분산 방법 중 하나\" — p.41 에서 '''병행'''하라고 함 ||\n|}\n\n{warn}\n'''검증(Testing) ≠ 간격두기(Spacing)'''. 단답형에서 \"퀴즈·모의고사로 인출 연습\" 이 나오면 검증 효과, \"공부 시점을 나눔\" 이 나오면 간격두기 효과. 또 \"검증\"을 \"검정\"(통계)으로 쓰지 말 것 — 슬라이드 표기는 '''검증 효과'''.\n{/warn}\n\n{quiz}\n\"퀴즈·모의고사처럼 인출을 연습하면 단순 반복보다 기억이 오래 가는 현상\"의 명칭은?\n{/quiz}\n{answer}\n'''검증 효과'''(Testing Effect). 통합요약 단답형 예상 10번, bank SA.\n{/answer}\n\n== 관련 문서 ==\n* [[간격두기 효과]] · [[회상]] · [[처리 수준]](적극적·깊은 처리)\n* [[서막 심리학 이야기]](p.28) · [[모의고사 복기]] · [[6장 기억]]\n\n근거: 6장 p.23, p.41; 서막 p.28 (🎙 8/25, 9/29)"
 },
