  "body": "'''감각'''(Sensation)과 '''지각'''(Perception)은 4장의 첫 슬라이드(p.2)에서 바로 갈라 놓는 한 쌍이다. 감각은 \"받아들이기\", 지각은 \"의미 붙이기\". 이 둘을 구분하지 못하면 이후의 [[상향 처리]]·[[하향 처리]] 논의가 전부 흐려진다.\n\n{def}\n'''설명''': 외부 환경에서 입력된 정보를 감각 기관이 수용하고 표상하는 과정 (4장 p.2)\n'''명칭''': 감각 (Sensation)\n{/def}\n\n{def}\n'''설명''': 감각 정보를 체제화하고 해석하는 과정 (4장 p.2)\n'''명칭''': 지각 (Perception)\n{/def}\n\n[[img:L4-02.png|p.2 감각 프로세스(아래: 외부 자극 → 감각 기관 → 신경 신호 → 1차 감각 피질)와 지각 프로세스(가운데: 의미 부여)|medium]]\n\n== 비교 ==\n{| class=\"table\"\n! || 감각 || 지각\n|-\n| 정의 || 수용하고 '''표상''' || '''체제화'''하고 '''해석'''\n|-\n| 하는 일 || 에너지를 신경 신호로 [[변환]] || 신호에 형태·의미 부여\n|-\n| 관련 처리 || 주로 [[상향 처리]] || 상향 + [[하향 처리]] 모두\n|-\n| 개인차 || 상대적으로 작다 || 크다 (기대·맥락·동기·정서)\n|-\n| 4장 대표 개념 || [[절대 역치]], [[차이 역치]], [[감각 순응]] || [[지각 갖춤새]], [[게슈탈트 심리학]], [[깊이 지각]]\n|}\n\n교수 (🎙 9/22): 지각은 \"'''경험'''\"이고 인지심리학적으로 '''주관적'''이다. 슬라이드의 검은 글씨를 모두가 \"검은색\"이라 부르는 건 '''합의'''일 뿐, 각자에게 실제로 어떻게 전달됐는지는 아무도 모른다.\n\n{analogy}\n감각은 '''카메라 센서''', 지각은 '''사진 보정 앱'''. 센서는 들어온 빛을 픽셀 값으로 기록할 뿐이고(감각), 앱이 \"이건 얼굴이니 피부톤 보정, 이건 하늘이니 채도 업\"을 결정한다(지각). 같은 RAW 파일도 보정하는 사람에 따라 전혀 다른 사진이 된다.\n{/analogy}\n\n{warn}\n\"감각 = 상향, 지각 = 하향\"으로 1:1 대응시키면 틀린다. 지각에도 [[상향 처리]]는 반드시 들어간다(입력이 대뇌까지 올라와야 뭐든 해석한다). 지각은 '''둘 다'''의 영향을 받는다.\n{/warn}\n\n== 관련 문서 ==\n* [[상향 처리와 하향 처리]] — 같은 슬라이드의 두 번째 짝\n* [[변환]] — 감각의 첫 단계\n* [[4장 감각과 지각]]\n\n근거: 4장 p.2"
 },
 "상향 처리와 하향 처리": {
  "title": "상향 처리와 하향 처리 (Bottom-up vs Top-down Processing)",
  "category": [
   "4장 감각과 지각",
   "이론"
  ],
  "body": "지각이 어디서 출발하느냐에 따라 나눈 두 방향의 정보 처리. [[상향 처리]]는 '''감각 입력(데이터)에서 위로''', [[하향 처리]]는 '''경험·기대(지식)에서 아래로''' 흐른다. 교수는 4장을 \"p.8 까지는 상향 처리, p.9 부터는 하향 처리\"로 나눠 진행했다(🎙 9/22 29:03).\n\n{def}\n'''설명''': 감각 수용기 → 고차 인지 기능으로 이어지는 처리 (4장 p.2)\n'''명칭''': [[상향 처리]] (Bottom-up processing)\n{/def}\n\n{def}\n'''설명''': 경험과 기대에 기반하여 감각 입력을 체계화 (4장 p.2)\n'''명칭''': [[하향 처리]] (Top-down processing)\n{/def}\n\n[[img:L4-02.png|p.2 가운데 지각 프로세스로 아래에서 올라오는 화살표(상향 처리)와 위 고차 인지 기능(주의·기대·기억·계획)에서 내려오는 화살표(하향 처리)|medium]]\n\n== 비교표 ==\n{| class=\"table\"\n! || [[상향 처리]] (Bottom-up) || [[하향 처리]] (Top-down)\n|-\n| 출발점 || 감각 수용기 (물리적 자극) || 경험·기대·지식·주의\n|-\n| 방향 || 부분 → 전체, 감각 → 고차 || 전체(가설) → 부분, 고차 → 감각\n|-\n| 4장 예시 || [[절대 역치]], [[감각 순응]], [[자질 탐지기]](해석 — 슬라이드는 상향/하향 분류를 명시하지 않음), [[게슈탈트 심리학|게슈탈트 집단화]](타고남) || [[지각 갖춤새]], 중의적 그림, 얼굴 13개, [[가짜약 효과]], 통증, [[음소 복원 효과]], 맥락·동기·정서\n|-\n| 경험 개입 || 없음 (또는 적음) || '''핵심'''\n|-\n| 빠지면? || 아무것도 못 본다 || 모호한 자극을 해석 못 한다\n|}\n\n지각은 '''둘 다'''의 영향을 받는다. 상향/하향은 지각뿐 아니라 기억·주의 등 다른 인지 기능에도 적용되는 일반적 기전이다.\n\n[[anim:top_down_faces|처음 몇 초는 상향 처리만 하는 상태(풍경만 보임), \"얼굴을 찾아라\" 자막 이후가 하향 처리. 두 상태의 차이를 비교할 것]]\n\n{analogy}\n'''퍼즐 맞추기'''. 상향 처리는 상자 그림 없이 조각 모양만 보고 하나씩 맞춰 가는 것, 하향 처리는 상자 뚜껑의 완성 그림을 보면서 \"이 파란 조각은 하늘 쪽이겠지\" 하고 넣는 것. 상자 그림이 있으면 빨라지지만, 그림이 실제 퍼즐과 다르면 엉뚱한 곳에 조각을 넣는다.\n{/analogy}\n\n{exam}\n교수가 \"'''많이 헷갈리기 좋은 부분'''\"이라고 직접 강조한 함정 (🎙 9/22 1:26:56): [[게슈탈트 심리학]]은 해석을 가미한다는 점 때문에 하향처럼 보이지만, 집단화 원리가 '''타고난''' 것이고 '''부분 → 전체'''로 진행되므로 '''상향 처리'''를 더 강조하는 입장이다.\n{/exam}\n\n{quiz}\n다음 중 하향 처리의 예로 보기 '''어려운''' 것은? ① 갈증 상태에서 물병이 더 가깝게 보인다 ② 중상을 입은 부상병이 통증을 덜 보고한다 ③ 밝은 방에 들어가면 빛의 세기에 따라 동공이 수축한다 ④ 슬픈 음악을 들은 뒤 Pain 을 더 부정적으로 지각한다\n{/quiz}\n{answer}\n'''③'''. 물리적 빛의 세기에 따른 반사적 반응이다. ①은 동기, ②는 기대·주의, ④는 정서 → 모두 하향 처리. (단, 홍채는 밝은 공간을 '''상상'''만 해도 조절된다는 연구가 있어 교수는 이를 예외적 하향 영향으로 소개했다.)\n{/answer}\n\n== 관련 문서 ==\n* [[상향 처리]] · [[하향 처리]] — 각각의 단답형 명칭 문서\n* [[감각과 지각의 구분]]\n* [[지각 갖춤새]]\n\n근거: 4장 p.2 (+ p.9–19, p.28–30)"
 },
 "상향 처리": {
  "title": "상향 처리 (Bottom-up Processing)",
  "category": [
   "4장 감각과 지각",
   "용어"
  ],
  "body": "'''상향 처리'''는 감각 수용기에서 들어온 신호가 아래에서 위로, 즉 고차 인지 기능 쪽으로 올라가며 지각이 만들어지는 처리다. 반대 방향인 [[하향 처리]]와 짝을 이루며, 둘을 한 표로 비교한 문서는 [[상향 처리와 하향 처리]].\n\n{def}\n'''설명''': 감각 수용기 → 고차 인지 기능으로 이어지는 처리 (4장 p.2)\n'''명칭''': 상향 처리 (Bottom-up processing)\n'''사례형''': 아무런 기대 없이 처음 보는 무늬를 볼 때, 감각 수용기에서 들어온 신호만으로 부분부터 차례로 처리되어 형태가 지각된다. (해석: 이 과정에 두뇌의 각 신경세포(시각 피질)인 [[자질 탐지기]]가 관여한다고 볼 수 있으나, 4장 p.26은 자질 탐지를 상향/하향으로 분류하지 않는다.)\n{/def}\n\n== 4장에서 상향 처리로 분류되는 것 ==\n* p.3–8 의 감각 단계 전부: [[변환]], [[절대 역치]], [[차이 역치]], [[감각 순응]]. 교수: \"지금까지는 상향 처리\" (🎙 9/22 29:03)\n* (해석) p.26 [[자질 탐지기]] — \"상위세포 군집일수록 보다 복잡한 패턴에 반응\". 슬라이드가 상향 처리라고 명시하지는 않는다.\n* p.28–30 '''[[게슈탈트 심리학]]의 집단화 원리''' — 교수가 따로 강조한 함정\n\n[[img:L4-30.png|p.30 집단화의 세 원리 — 근접성·연속성·폐쇄. 게슈탈트는 이 원리가 \"내재된, 타고난 것\"(Wertheimer, 1912)이라 보므로 상향 처리 쪽|medium]]\n\n{exam}\n교수 (🎙 9/22 1:26:56~1:28:47): \"게슈탈트 심리학은 지각 과정을 설명하는 데 있어서 '''하향 처리보다는 상향 처리의 영향력을 더 강조하는 쪽'''이에요.\" 이유: ① 집단화 원리는 경험이 아니라 '''원래부터 내재''', ② 가장 '''하위 차원(부분)에서 시작해 상위(전체)'''로 이어진다. \"많이 헷갈리기 좋은 부분이라 깊게 설명했다.\"\n{/exam}\n\n{analogy}\n상향 처리는 '''레고를 설명서 없이 블록부터 쌓는 것'''이다. 손에 잡히는 블록(감각 입력)을 하나씩 끼워서 형태가 위로 올라간다. 게슈탈트의 집단화는 \"가까운 블록은 같은 덩어리\"라는 규칙이 '''공장 출고 때부터''' 손에 내장돼 있는 것 — 설명서(경험)를 본 적이 없어도 작동한다.\n{/analogy}\n\n{warn}\n게슈탈트가 \"전체는 부분의 합 이상\", \"해석을 가미\"라고 말한다고 해서 하향 처리라고 고르면 오답. 하향 처리의 핵심은 '''경험의 개입'''인데, 게슈탈트 원리는 경험에 의해 형성된 것이 아니라 타고난 것이다(유아도 사용, Gallace & Spence, 2011).\n{/warn}\n\n== 관련 문서 ==\n* [[상향 처리와 하향 처리]]\n* [[하향 처리]]\n* [[게슈탈트 심리학]]\n\n근거: 4장 p.2, p.28–30"
 },
 "하향 처리": {
  "title": "하향 처리 (Top-down Processing)",
  "category": [
   "4장 감각과 지각",
   "용어"
  ],
  "body": "'''하향 처리'''는 경험·기대·맥락 같은 머릿속 지식이 위에서 내려와 감각 입력을 체계화하는 처리다. 4장 p.9–19 전체가 이 개념의 사례 모음이고, 교수가 가장 강조한 시연(풍경 속 얼굴 13개)도 여기 속한다. ⭐⭐⭐\n\n{def}\n'''설명''': 경험과 기대에 기반하여 감각 입력을 체계화 (4장 p.2)\n'''명칭''': 하향 처리 (Top-down processing)\n'''사례형''': \"이 그림에서 얼굴을 찾아라\"라는 안내를 들은 뒤, 처음엔 바위와 나무로만 보이던 풍경에서 얼굴이 하나둘 보이기 시작한다.\n{/def}\n\n[[anim:top_down_faces|\"얼굴이 몇 개?\" 자막 뒤로 얼굴 윤곽이 하나씩 떠오르며 카운터가 13까지 오르는 것을 보고, 이어지는 중의적 그림에서 먼저 본 그림이 해석을 바꾸는 것까지 볼 것]]\n\n== 4장의 하향 처리 사례 ==\n{| class=\"table\"\n! 슬라이드 || 사례 || 무엇이 위에서 내려오나\n|-\n| p.9 || 가로로 B, 세로로 13 || 맥락 (A-C / 12-14)\n|-\n| p.10 || 귀부인/할머니 중의적 그림 || 먼저 본 그림 = 기대\n|-\n| p.11 || 로고 봉투 감자튀김, 원효대사 해골물, [[지각 갖춤새|말 분절]] || 브랜드 기대, 모국어 지식\n|-\n| p.12 || [[가짜약 효과]] (디카페인 커피) || 처치를 받았다는 기대\n|-\n| p.13 || 통증 지각 (부상병, VR 화상 치료) || 주의·기대 — '''가장 극적인 예'''\n|-\n| p.14 || eel → wheel / peel, [[음소 복원 효과]] || 문장 맥락\n|-\n| p.15–17 || 문화·동기·정서 || [[맥락·동기·정서와 지각]]\n|-\n| p.18–19 || '''풍경 속 얼굴 13개''' || \"얼굴을 찾아라\"는 안내\n|}\n\n=== 얼굴 13개 그림 (풍경 속 얼굴 찾기) ===\n{def}\n'''설명''': 풍경 그림에서 얼굴처럼 보이는 자극을 찾게 하는 시연. \"얼굴을 찾아라\"라는 안내 하나가 기대를 만들어, 처음엔 안 보이던 얼굴이 보이게 된다. 정답 13개 (4장 p.18–19)\n'''명칭''': [[하향 처리]]의 시연 (얼굴 13개 그림)\n{/def}\n\n[[img:L4-18.png|p.18 (텍스트 없음) 계곡 풍경 — 말 탄 사람 한 명(짐 실은 말을 끌고 감)과 바위·나무·물살|large]]\n\n[[img:L4-19.png|p.19 정답: 13개 — 빨간 사각형이 바위·나무·물살 속에 숨은 얼굴 위치|large]]\n\n교수 (🎙 9/22 55:08~58:49): \"정답은 몇 개냐면요. 총 13개입니다. 근데 솔직히 '''아직도 저는 모르겠어요'''.\" 교수 본인도 10개 정도, 오전 인지심리학 수강생들도 다 못 찾았다. 처음에 \"얼굴처럼 보이는 자극을 찾아라\"라고 한 '''안내 하나가 기대치를 만들고''', 그 기대가 하향 처리를 작동시킨다. 못 봤던 얼굴도 주의를 다시 기울이면 얼굴로 조직화된다.\n\n{exam}\n통합요약 §0-1 교수 강조: '''얼굴 13개 그림 = 하향 처리'''. 그리고 '''통증은 하향 처리의 극적인 예'''(🎙 9/22 39:45, \"그걸 더 극적으로 보여준 게 저 통증 관련 연구\"). 둘 다 \"상향 처리\"로 고르면 오답.\n{/exam}\n\n{analogy}\n하향 처리는 '''숨은그림찾기 책의 \"찾을 물건 목록\"'''이다. 목록에 \"우산\"이 없으면 그림 속 우산 모양 나뭇가지는 그냥 나뭇가지다. 목록에 \"우산\"이 적혀 있는 순간 갑자기 우산이 튀어나온다. 그림(감각 입력)은 하나도 안 바뀌었는데 '''찾는 사람의 기대'''가 바뀌었을 뿐이다.\n{/analogy}\n\n{joke}\n교수도 13개를 다 못 찾았다고 고백했으니, 이 그림을 보고 13개를 다 찾았다면 당신의 하향 처리는 교수님보다 강력하다. 시험 문제엔 개수가 아니라 \"'''어떤 처리'''\"가 나온다.\n{/joke}\n\n== 관련 문서 ==\n* [[상향 처리와 하향 처리]] — 비교표\n* [[지각 갖춤새]] — 하향 처리의 대표적 예시\n* [[상향 처리]]\n* [[맥락·동기·정서와 지각]]\n\n근거: 4장 p.2, p.9–13, p.18–19"
 },
 "변환": {
  "title": "변환 (Transduction) — 에너지의 변환",
  "category": [
   "4장 감각과 지각",
   "용어"
  ],
  "body": "'''변환'''(Transduction)은 빛·소리 같은 물리 에너지를 뇌가 읽을 수 있는 '''신경 신호'''로 바꾸는 과정이다. [[감각과 지각의 구분|감각]]의 첫 관문이며, 이게 없으면 눈에 빛이 아무리 들어와도 뇌 입장에서는 \"아무 일도 없다\".\n\n{def}\n'''설명''': 각 감각 정보는 특정 형태의 에너지(시각-빛, 소리-공기 진동)로 구성되므로, 두뇌가 이해할 수 있는 형태로 바꾸는 과정 (4장 p.3)\n'''명칭''': 에너지의 변환 (Transduction)\n{/def}\n\n[[img:L4-03.png|p.3 감각 및 지각이 발생하는 과정 — 상대 얼굴에서 반사된 빛 → 망막에서 전기·화학 신호로 → 뇌의 시각 영역|medium]]\n\n== 세 단계 (p.3) ==\n<pre class=\"ascii\">\n [에너지]          ① 수용              ② 전환                     ③ 전달\n 빛 / 공기 진동 → 전문화된 수용기 → 신경 활동(전기/화학) → 두뇌\n                   (망막 광수용기)    ([[원추체와 간상체|원추체·간상체]] → [[원추체와 간상체|양극세포]])   ([[눈의 구조|시신경]] → 후두엽 시각 피질)\n<\/pre>\n\n# 전문화된 '''수용기'''가 감각 자극을 수용\n# 수용된 감각 자극이 '''신경 활동으로 전환'''(전기/화학)\n# 신경 정보가 '''두뇌로 전달'''\n\n시각의 경우 망막의 광수용기 세포가 빛을 바꾸고([[눈의 구조]] p.22 \"광수용기 세포가 신경 신호로 변환\"), 후두엽 시각 피질에 도달해야 비로소 \"봤다\"고 할 수 있다. 교수: 양극세포가 시신경으로 전달하는 시점부터 전기·화학 신호로 다뤄진다 (🎙 9/22).\n\n[[anim:transduction_vision|빛 → 수정체 → 망막(거꾸로 맺힌 상) → 원추체/간상체 → 양극세포 → 시신경 → 시각 피질. 어느 지점에서 \"빛\"이 \"신호\"로 바뀌는지 짚어 볼 것]]\n\n{analogy}\n변환은 '''통역사'''다. 바깥 세계는 \"빛어\", \"진동어\"로 말하는데 뇌는 \"전기·화학어\"만 알아듣는다. 눈과 귀의 수용기는 각자 한 언어 전담 통역사라서, 귀의 통역사에게 빛을 보내면 아무 말도 전달되지 않는다.\n{/analogy}\n\n{tip}\n\"변환\"이라는 이름 자체가 단답형 후보다. 문제에서 \"에너지를 신경 신호로 바꾸는 과정\"이 보이면 '''변환(Transduction)'''.\n{/tip}\n\n== 관련 문서 ==\n* [[감각과 지각의 구분]]\n* [[눈의 구조]] · [[원추체와 간상체]] — 시각의 변환 현장\n* [[활동 전위]] — 변환된 신호의 정체(2장)\n\n근거: 4장 p.3 (+ p.22–23)"
 },
 "절대 역치": {
  "title": "절대 역치 (Absolute Threshold)",
  "category": [
   "4장 감각과 지각",
   "용어"
  ],
  "body": "'''절대 역치'''는 어떤 자극이 \"있다/없다\"를 가르는 문턱이다. 4장은 이 문턱을 '''확률 0.5'''로 정의한다는 점이 핵심이다. 2장의 [[역치]](뉴런이 발화하는 최소 강도)와 같은 단어지만, 여기서는 '''감각 탐지''' 쪽 의미다. ⭐⭐⭐\n\n{def}\n'''설명''': 특정 자극의 탐지 비율이 0.5가 되는 지점 (4장 p.4)\n'''명칭''': 절대 역치 (Absolute Threshold)\n'''사례형''': 청력 검사에서 아주 작은 \"삐\" 소리를 여러 번 들려줬을 때, 정확히 절반은 들었다고 하고 절반은 못 들었다고 하는 소리 크기.\n{/def}\n\n[[img:L4-04.png|p.4 자극 강도에 따른 탐지율과 절대 역치 — S자 곡선이 50% 를 지나는 강도가 절대 역치, 그 왼쪽 음영이 역치하 영역|medium]]\n\n== 슬라이드 내용 (p.4) ==\n* '''[[역치]]''': 생물체가 반응을 일으키는 데 필요한 자극의 최소 강도.\n* 절대 역치는 단순히 '''자극 강도'''뿐 아니라 '''개인의 심리 상태'''에도 영향을 받는다. (청력 검사 때 온 신경을 기울이면 역치가 낮아진다 — 🎙 9/22)\n* \"효율적 기능을 위해서는 절대 역치가 낮은 것이 유리\" ← '''교수가 정정''' (아래 exam).\n\n=== 역치하 자극 ===\n{def}\n'''설명''': 탐지율 0.5 미만의 강도로 제시된 자극. 의식적 지각을 하지 못하더라도 심리 기제에 영향을 줄 수 있음 (4장 p.4)\n'''명칭''': [[절대 역치|역치하 자극]] (Subliminal stimulus)\n{/def}\n역치하 자극이 정말 영향을 주는지는 p.5 [[점화]] 연구(차폐 점화)로 확인한다.\n\n{exam}\n교수 (🎙 9/22 12:07): \"기능주의 차원에서 본다면 역치가 낮은 게 아무래도 좋겠죠 … 근데 반대로 생각해 보면 '''낮은 게 언제나 좋은 건 아니에요'''.\" 모든 미세 자극을 다 받아들이면 정신적 자원(mental resource)에 하중이 걸려 정말 필요한 정보를 처리하지 못할 수 있다. 통합요약 §0-1 4장 교수 강조 1번.\n{/exam}\n\n{warn}\nbank 함정 보기: \"역치하 자극은 의식적으로 지각되지 않으므로 심리 기제에 '''어떤 영향도 줄 수 없다'''.\" → '''틀림'''. 슬라이드는 \"영향을 줄 수 있음\"이라고 했고, 점화 연구가 그 증거다.\n{/warn}\n\n== 비교: 절대 역치 vs 차이 역치 ==\n{| class=\"table\"\n! || 절대 역치 || [[차이 역치]]\n|-\n| 질문 || 자극이 '''있나 없나'''? || 두 자극이 '''다른가 같은가'''?\n|-\n| 기준 || 탐지율 0.5 인 '''자극 강도''' || 차이 탐지 확률 0.5 인 '''최소 차이값'''\n|-\n| 다른 이름 || — || 최소식별차이 (JND)\n|-\n| 관련 법칙 || [[신호 탐지 이론]] (판단 기준선) || [[베버의 법칙]] (일정 비율)\n|}\n\n{analogy}\n절대 역치는 '''현관 센서등'''의 감도다. 감도를 너무 높이면(역치가 낮으면) 고양이가 지나가도, 바람에 낙엽이 날려도 불이 켜져서 오히려 정신없다. 교수가 \"낮은 게 언제나 좋은 건 아니다\"라고 한 이유가 이것이다.\n{/analogy}\n\n== 관련 문서 ==\n* [[역치]] — 2장, 뉴런 쪽 의미\n* [[점화]] — 역치하 자극의 영향을 보는 패러다임\n* [[차이 역치]] · [[신호 탐지 이론]]\n\n근거: 4장 p.4"
 },

  "body": "'''점화'''는 먼저 본 자극이 머릿속의 관련 개념에 \"불을 붙여\" 두어, 뒤에 오는 자극의 처리가 빨라지거나 달라지는 현상이다. 4장에서는 [[절대 역치|역치하 자극]]이 정말 영향을 주는지 확인하는 실험 패러다임으로 나오고, 5장(p.14)·6장(p.30, [[인출 단서]]·[[암묵 기억]])에서 다시 등장한다.\n\n{def}\n'''설명''': 특정 자극을 제시하여 어떤 개념을 미리 활성화시키는 것. 점화 자극에 의해 활성화된 속성이 나중에 제시된 자극의 정보 처리에 영향을 줌 (4장 p.5)\n'''명칭''': 점화 (Priming)\n'''사례형''': 화면에 \"사과\"를 아주 짧게 보여준 뒤 \"배\"가 단어인지 판단하게 하면, \"하늘\"을 판단할 때보다 반응이 빠르다.\n{/def}\n\n[[img:L4-05.png|p.5 차폐 점화 어휘 판단 과제 예시 — + → 커피 → #### → 원두. 아래 타임라인: 커피 50ms, #### 50ms, 원두 1500ms, 점화어 시작~표적 시작 = SOA|medium]]\n\n== 차폐 점화 어휘 판단 과제 (p.5) ==\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 질문 || 의식하지 못한 자극도 뒤의 처리에 영향을 주는가?\n|-\n| 절차 || 점화어 '''커피'''(50ms) → 차폐 자극 '''####'''(50ms) → 표적 '''원두'''(1500ms) → \"단어인가?\" 판단\n|-\n| 핵심 조작 || 점화 자극의 '''제시 시간'''을 짧게 + '''차폐 자극'''으로 가림 → [[절대 역치|역치하 자극]]으로 만든다\n|-\n| 결과 || 관련 단어(커피→원두)가 앞에 오면 판단이 빨라짐\n|-\n| 결론 || 의식적 지각 없이도 심리 기제에 영향 (p.4 와 연결)\n|-\n| 용어 || '''SOA''' (Stimulus Onset Asynchrony) = 점화 자극 시작부터 표적 시작까지의 시간 간격\n|}\n\n<pre class=\"ascii\">\n  [커피] 50ms → [####] 50ms → [원두] 1500ms → \"단어다!\" (빨라짐)\n  |←────── SOA ──────→|\n  점화어가 너무 짧고 바로 가려져서 \"커피\"를 봤다는 의식은 없다\n<\/pre>\n\n교수 (🎙 9/22 13:32~18:14): 제시 시간이 길어지면 다른 인지 처리가 끼어들어 \"순수한 점화 효과\"라 하기 어려우므로 '''약 43~50ms''' 로 짧게 제시하는 것을 권장한다(논문 리뷰어가 지적하는 부분). 소리 자극은 짧게 제시하기 어렵다는 한계도 언급.\n\n{analogy}\n점화는 '''검색창 자동완성'''이다. 방금 \"커피\"를 검색했다면 다음에 \"원\"만 쳐도 \"원두\"가 먼저 뜬다. 내가 \"커피\"를 검색했다는 사실을 잊어버렸어도(역치하) 자동완성 목록은 이미 바뀌어 있다.\n{/analogy}\n\n{warn}\n점화 vs [[가짜약 효과]]: 점화는 '''앞선 자극'''이 관련 개념을 활성화해 뒤 처리를 촉진하는 것, 가짜약 효과는 '''처치를 받았다는 기대'''에 의한 효과. 정리본 \"헷갈리는 쌍\"에 올라 있다.\n{/warn}\n\n== 관련 문서 ==\n* [[절대 역치]] — 역치하 자극\n* [[인출 단서]] — 6장에서 점화가 다시 나오는 곳\n* [[하향 처리]]\n\n근거: 4장 p.5; 5장 p.14; 6장 p.30"
 },
 "신호 탐지 이론": {
  "title": "신호 탐지 이론 (Signal Detection Theory)",
  "category": [
   "4장 감각과 지각",
   "이론"
  ],
  "body": "'''신호 탐지 이론'''은 \"사람이 자극을 탐지했다\"는 결과를 '''구별 능력'''([[신호 탐지 이론|민감도]])과 '''판단 기준'''(편향성)이라는 두 성분으로 쪼개서 보는 이론이다. [[절대 역치]]가 사람·상태마다 흔들리는 이유를 설명해 준다. ⭐⭐⭐\n\n{def}\n'''설명''': 특정 자극과 노이즈에 대한 개인의 분별력을 계산하는 이론. 적중·놓침·오경보·정기각 4가지 요인으로 구성 (4장 p.6)\n'''명칭''': 신호 탐지 이론 (Signal Detection Theory)\n{/def}\n\n[[img:L4-06.png|p.6 신호 탐지 이론 그래프 예시 — 파란 노이즈 분포(정기각/오경보)와 빨간 신호 분포(놓침/적중), 가운데 판단 기준선. 아래 2×2 표|large]]\n\n== 4가지 반응 (2×2) ==\n{| class=\"table\"\n! || 신호 '''있음''' || 신호 '''없음''' (노이즈)\n|-\n| \"있다\" 반응 || '''적중''' (Hit) || '''오경보''' (False Alarm)\n|-\n| \"없다\" 반응 || '''놓침''' (Miss) || '''정기각''' (Correct Rejection)\n|}\n\n=== 적중 ===\n{def}\n'''설명''': 신호가 실제로 있을 때 \"있다\"고 반응한 경우 (4장 p.6)\n'''명칭''': [[신호 탐지 이론|적중]] (Hit)\n{/def}\n\n=== 놓침 ===\n{def}\n'''설명''': 신호가 실제로 있는데 \"없다\"고 반응한 경우 (4장 p.6)\n'''명칭''': [[신호 탐지 이론|놓침]] (Miss)\n{/def}\n\n=== 오경보 ===\n{def}\n'''설명''': 신호가 없는데(노이즈뿐인데) \"있다\"고 반응한 경우 (4장 p.6)\n'''명칭''': [[신호 탐지 이론|오경보]] (False Alarm)\n{/def}\n\n=== 정기각 ===\n{def}\n'''설명''': 신호가 없을 때 \"없다\"고 올바르게 반응한 경우 (4장 p.6)\n'''명칭''': [[신호 탐지 이론|정기각]] (Correct Rejection)\n{/def}\n\n=== 민감도(d′) ===\n{def}\n'''설명''': 실제 신호와 노이즈를 구별할 수 있는 능력. 그래프에서 두 분포 피크 사이의 거리 (4장 p.6)\n'''명칭''': [[신호 탐지 이론|민감도]] (d′, d-prime)\n{/def}\n\n=== 기준선(편향성) ===\n{def}\n'''설명''': 신호가 있다고 판단하는 개인의 기준선. 우측에 있을수록 엄격, 좌측에 있을수록 관대 (4장 p.6)\n'''명칭''': [[신호 탐지 이론|편향성]] (반응 편향, criterion — 기준선)\n{/def}\n\n== 민감도 vs 편향성 ==\n{| class=\"table\"\n! || 민감도 (d′) || 편향성 (기준선)\n|-\n| 무엇 || 신호/노이즈 '''구별 능력''' || \"있다\"고 말하는 '''판단 기준'''\n|-\n| 그래프에서 || 두 분포 '''피크 사이 거리''' || 세로 '''판단선의 위치'''\n|-\n| 바뀌면 || 거리↑ → 적중↑ 오경보↓ (동시에 좋아짐) || 오른쪽(엄격) → 적중↓ 오경보↓ / 왼쪽(관대) → 적중↑ 오경보↑\n|-\n| 영향 요인 || 감각 능력, 자극 세기 || 경험·기대·각성 상태, 오경보·놓침의 대가\n|}\n\n[[sim:signal_detection]]\n\n{warn}\nbank 함정 (4장 p.6): 기준선을 '''오른쪽(엄격)'''으로 옮기면? → '''적중과 오경보가 모두 감소'''. \"적중은 증가하고 오경보는 감소\"는 틀림(그건 민감도가 올라갈 때), \"민감도가 증가\"도 틀림(기준선 이동은 d′ 와 무관), \"둘 다 증가\"는 왼쪽(관대) 이동.\n{/warn}\n\n{quiz}\n청력 검사에서 수험자가 \"소리를 놓치면 재검사를 받는다\"는 말을 듣고 조금만 애매해도 \"들렸어요\"라고 답했다. 신호 탐지 이론에서 무엇이 바뀐 것이고, 적중·오경보는 어떻게 되나?\n{/quiz}\n{answer}\n'''편향성(기준선)'''이 '''왼쪽(관대)'''으로 이동. 적중↑ 오경보↑. 귀가 좋아진 게 아니므로 '''민감도는 그대로'''. 슬라이드의 \"경험, 기대, 각성 상태 등에 따라 변동\"이 바로 이것.\n{/answer}\n\n{analogy}\n신호 탐지 이론은 '''공항 보안 검색대 요원'''이다. 민감도는 요원의 '''눈썰미'''(엑스레이에서 칼과 열쇠를 구별하는 능력), 기준선은 '''오늘의 지침'''. \"테러 경보 발령, 조금만 수상해도 열어 봐라\"(관대) 하면 진짜 칼도 잘 잡지만(적중↑) 멀쩡한 가방도 많이 연다(오경보↑). 지침이 바뀌어도 요원의 눈썰미는 그대로다.\n{/analogy}\n\n교수 (🎙 9/22 18:14~22:45): 그래프에서 '''두 피크 사이 거리 = 민감도''', 판단선이 오른쪽이면 엄격 / 왼쪽이면 관대. 청력 검사에서 활용 가능. (계산식 d′ = z(H) − z(FA) 는 정리본 노트에만 있고 수업에서는 다루지 않았다.)\n\n== 관련 문서 ==\n* [[절대 역치]] — 신호 탐지 이론이 보완하는 개념\n* [[차이 역치]]\n* [[4장 감각과 지각]]\n\n근거: 4장 p.6"
 },
 "차이 역치": {
  "title": "차이 역치 (Difference Threshold) — 최소식별차이",
  "category": [
   "4장 감각과 지각",
   "용어"
  ],
  "body": "'''차이 역치'''는 \"두 자극이 다르다\"는 걸 알아채는 데 필요한 최소한의 차이다. [[절대 역치]]가 \"있다/없다\"의 문턱이라면 차이 역치는 \"같다/다르다\"의 문턱. 이 문턱이 자극 크기에 '''비례'''한다는 것이 [[베버의 법칙]]이다. ⭐⭐⭐\n\n{def}\n'''설명''': 두 자극이 다르다는 것을 탐지할 확률이 0.5가 되는 최소 차이값 (4장 p.7)\n'''명칭''': 차이 역치 (Difference threshold)\n'''사례형''': 100g 짜리 추에 조금씩 무게를 더해 갈 때, \"어, 무거워졌다\"를 절반의 시행에서 알아채게 되는 최소 추가 무게.\n{/def}\n\n=== 최소식별차이 ===\n{def}\n'''설명''': 차이 역치의 다른 이름. 두 자극의 차이를 알아챌 수 있는 가장 작은 차이 (4장 p.7 \"최소식별차이라고도 명명\")\n'''명칭''': [[차이 역치|최소식별차이]] (Just Noticeable Difference, JND)\n{/def}\n\n[[img:L4-07.png|p.7 차이 역치 슬라이드 — 시편 23편 텍스트의 글자 크기가 줄마다 미세하게 다르다. 어느 줄부터 달라 보이는가가 JND|small]]\n\n== 절대 역치 vs 차이 역치 ==\n{| class=\"table\"\n! || [[절대 역치]] || 차이 역치\n|-\n| 묻는 것 || 자극이 '''있는가''' || 두 자극이 '''다른가'''\n|-\n| 0.5 기준 || 자극 '''탐지''' 비율 0.5 인 강도 || 차이 '''탐지''' 확률 0.5 인 최소 차이\n|-\n| 다른 이름 || — || '''최소식별차이'''\n|-\n| 짝 개념 || 역치하 자극, [[신호 탐지 이론]] || [[베버의 법칙]]\n|}\n\n[[sim:weber_law]]\n\n{analogy}\n차이 역치는 '''라면 물 조절'''이다. 물 500ml 에 한 숟가락 더 넣으면 싱거워진 걸 알아채지만, 3리터 들통 라면에 한 숟가락 더 넣으면 아무도 모른다. \"알아챌 만큼의 차이\"는 원래 양에 따라 달라진다 — 그게 바로 다음 문서 [[베버의 법칙]].\n{/analogy}\n\n{warn}\n절대 역치와 차이 역치는 둘 다 \"확률 0.5\"로 정의돼서 헷갈린다. '''무엇의''' 0.5 인지를 보라: 자극 자체의 탐지(절대) vs 두 자극 '''차이'''의 탐지(차이).\n{/warn}\n\n== 관련 문서 ==\n* [[베버의 법칙]] — 차이 역치가 비율로 커진다\n* [[절대 역치]]\n* [[4장 감각과 지각]]\n\n근거: 4장 p.7"
 },
 "베버의 법칙": {
  "title": "베버의 법칙 (Weber's Law)",
  "category": [
   "4장 감각과 지각",
   "이론"
  ],
  "body": "'''베버의 법칙'''은 [[차이 역치]]가 고정된 양이 아니라 '''원래 자극의 일정 비율'''이라는 법칙이다. 무거운 걸 들고 있을수록, 밝은 곳에 있을수록 \"더\"를 알아채려면 더 큰 변화가 필요하다. 교수의 100kg → 110 → 121kg 예시가 그대로 bank 객관식 정답이 됐다. ⭐⭐⭐\n\n{def}\n'''설명''': 두 자극의 차이를 지각하려면 절대적 양이 아닌, 일정 비율 단위로 변해야 한다는 법칙 (4장 p.7)\n'''명칭''': 베버의 법칙 (Weber's Law)\n'''사례형''': 조용한 방에서는 속삭임 하나도 크게 들리지만 시끄러운 공사장에서는 웬만큼 소리를 키워도 차이를 못 느낀다.\n{/def}\n\n식으로 쓰면 $\\Delta I / I = k$ — 알아챌 수 있는 최소 변화량($\\Delta I$, [[차이 역치|최소식별차이]])을 원래 자극 강도($I$)로 나눈 값이 일정($k$)하다.\n\n== 교수 예시: 100kg → 110 → 121 ==\n교수 (🎙 9/22 23:16~24:23): 어떤 사람이 100kg 가방에서 '''10%'''가 늘어야 무거워졌다고 느낀다면,\n{| class=\"table\"\n! 단계 || 현재 무게 || 필요한 증가분 (×10%) || \"더 무겁다\"고 느끼는 최소 무게\n|-\n| 1 || 100kg || 10kg || '''110kg'''\n|-\n| 2 || 110kg || 11kg || '''121kg'''\n|-\n| 3 || 121kg || 12.1kg || 133.1kg\n|}\n(녹음은 \"15의 원칙\"처럼 오인식됐지만 핵심은 \"'''일정 비율'''\".)\n\n[[sim:weber_law]]\n\n{quiz}\nk = 10% 인 사람이 110kg 가방을 들고 있다. \"더 무겁다\"고 느끼려면 최소 몇 kg? ① 111kg ② 115kg ③ 120kg ④ 121kg\n{/quiz}\n{answer}\n'''④ 121kg'''. 110 × 10% = 11kg. ③ 120kg 은 \"처음처럼 10kg 만 더하면 된다\"는 '''절대량''' 오답이다(bank ch4 MC). ①②는 증가분이 모자란다.\n{/answer}\n\n{warn}\n\"매번 같은 양(+10kg)만 더하면 된다\"는 것이 베버의 법칙의 정반대 오개념. 베버의 법칙의 키워드는 '''비율'''이다. sim 의 `absolute` 모드가 이 오답을 일부러 보여 준다.\n{/warn}\n\n{analogy}\n베버의 법칙은 '''월급 인상'''이다. 월급 200만 원인 사람에게 10만 원 인상은 \"오, 올랐네\"지만 월급 2000만 원인 사람에게 10만 원은 \"올랐어?\" 수준이다. 2000만 원 받는 사람이 같은 기쁨을 느끼려면 100만 원은 올려야 한다 — 같은 '''비율'''(5%)이니까.\n{/analogy}\n\n== 관련 문서 ==\n* [[차이 역치]] — 베버의 법칙이 설명하는 대상\n* [[절대 역치]]\n* [[4장 감각과 지각]]\n\n근거: 4장 p.7 (교수 예시 🎙 9/22)"
 },
 "감각 순응": {
  "title": "감각 순응 (Sensory Adaptation)",
  "category": [
   "4장 감각과 지각",
   "용어"
  ],
  "body": "'''감각 순응'''은 같은 자극이 계속되면 감각 기관이 그 자극에 둔해지는 현상이다. 고장이 아니라 '''기능'''이다 — 이미 아는 자극은 꺼 두고 새롭거나 중요한 것에 주의를 돌리기 위해서다. bank 단답형 정답. ⭐⭐⭐\n\n{def}\n'''설명''': 자극의 반복 노출로 인한 감각 기관의 민감도 감소 (4장 p.8)\n'''명칭''': 감각 순응 (Sensory adaptation)\n'''사례형''': 강한 디퓨저 향이 나는 사무실에 처음 들어갔을 땐 머리가 띵할 정도였는데, 30분쯤 지나자 냄새가 거의 느껴지지 않았다.\n{/def}\n\n[[img:L4-08.png|p.8 감각 순응의 예시(후각) — 1. 노출 초기(새로운 냄새): 반응 강도 막대 높음 → 2. 지속 노출 후: 막대 낮음. 아래는 자극 강도에 따른 뉴런 발화율(스파이크 간격)|medium]]\n\n== 슬라이드 내용 (p.8) ==\n* 왜? '''새롭거나 더 중요한 대상에 주의 집중''' → 외부 자극을 그대로 지각하는 게 아니라 '''개인의 필요성에 맞게''' 지각.\n* 신경 수준: 뉴런은 '''발화율'''의 변화로 자극 강도를 표상한다. 순응 → 민감도 감소 → '''발화율도 감소''' → 신경 표상이 안 되면 '''지각도 약화'''.\n\n교수 (🎙 9/22 25:27~28:20): 활동 전위의 '''크기'''는 고정이고(2장 [[실무율]]), 강도는 '''발화율'''로 표상한다. 오감 중 '''후각'''이 순응이 가장 빠르다(수용기 세포가 가장 빨리 피로해짐).\n\n{analogy}\n감각 순응은 '''스마트폰 알림 끄기'''다. 단톡방이 처음 울릴 땐 매번 확인하지만, 하루 종일 울리면 \"또 그 방이네\" 하고 알림을 꺼 버린다. 그래야 정말 중요한 전화(새로운 자극)가 왔을 때 알아챌 수 있다.\n{/analogy}\n\n== 헷갈리는 짝 ==\n{| class=\"table\"\n! || 감각 순응 || [[원추체와 간상체|암순응]] || [[습관화]] (3장)\n|-\n| 무엇 || 반복 자극 → 감각 기관 '''민감도 감소''' || 어둠에 적응해 '''형체 식별''' || 반복 자극 → 영아의 '''반응(주시) 감소'''\n|-\n| 방향 || 덜 느끼게 됨 || 더 잘 보게 됨 || 덜 반응하게 됨\n|-\n| 담당 || 모든 감각 (후각이 가장 빠름) || [[원추체와 간상체|간상체]] || 행동 수준\n|-\n| 근거 || 4장 p.8 || 4장 p.23 || 3장 p.6\n|}\n\n{warn}\n\"감각 순응\"과 \"암순응\"은 이름에 둘 다 '''순응'''이 들어가지만 방향이 반대다. 감각 순응은 '''민감도가 떨어지는''' 것, 암순응은 어둠 속에서 '''민감도가 올라가''' 형체가 보이게 되는 것.\n{/warn}\n\n== 관련 문서 ==\n* [[활동 전위]] — 발화율로 강도 표상 (2장)\n* [[습관화]] — 3장의 비슷한 현상\n* [[절대 역치]]\n\n근거: 4장 p.8"
 },
 "지각 갖춤새": {
  "title": "지각 갖춤새 (Perceptual Set)",
  "category": [
   "4장 감각과 지각",
   "용어"
  ],
  "body": "'''지각 갖춤새'''는 \"이건 이렇게 보일 거야\"라는 '''기대'''가 미리 세팅되어 실제 지각을 그쪽으로 끌고 가는 것이다. 슬라이드가 직접 \"'''하향 처리의 대표적 예시'''\"라고 못 박은 개념이고 bank 단답형 정답이다. 교과서·다른 번역어로는 \"지각 세트\", \"지각 태세\"라고도 하지만 '''시험 답은 슬라이드 표기 \"지각 갖춤새\"'''로 쓸 것. ⭐⭐⭐\n\n{def}\n'''설명''': 경험에 근거한 특정 지각에 대해 형성되는 기대. 사전에 제시된 환경적 맥락에 따라 지각 경험 양상이 달라질 수 있음 (4장 p.9)\n'''명칭''': 지각 갖춤새 (Perceptual set)\n'''사례형''': 똑같은 감자튀김을 흰 봉투와 유명 프랜차이즈 로고 봉투에 담아 주었더니, 아이들이 로고 봉투 쪽을 더 맛있다고 평가했다.\n{/def}\n\n[[img:L4-09.png|p.9 지각 갖춤새의 예시(가로 VS 세로) — 가운데 같은 글자가 가로(A □ C)로 읽으면 B, 세로(12 □ 14)로 읽으면 13|small]]\n\n[[anim:top_down_faces|마지막 장면의 중의적 그림에서, 앞에 어떤 그림을 봤느냐에 따라 같은 그림이 귀부인/할머니로 바뀌는 것을 볼 것]]\n\n=== 중의적 그림 ===\n{def}\n'''설명''': 두 가지 이상으로 해석될 수 있는 그림. 사전에 제시된 양상에 따라 시각 지각의 양상이 바뀔 수 있음 (4장 p.9–10)\n'''명칭''': [[지각 갖춤새|중의적 그림]] (Ambiguous figure)\n{/def}\n\n[[img:L4-10.png|p.10 지각갖춤새의 영향-중의적 그림 — 왼쪽은 젊은 귀부인이, 오른쪽은 할머니가 뚜렷하고, 가운데가 중의적 그림|large]]\n\n교수 (🎙 9/22 31:35~34:59): 왼쪽 명확한 '''젊은 귀부인''' → 가운데를 보면 귀부인으로, 오른쪽 명확한 '''할머니''' → 가운데를 보면 할머니로 지각. '''먼저 본 그림(사전 제시된 지식)'''이 해석을 결정한다.\n\n== 미각과 청각에도 (p.11) ==\n[[img:L4-11.png|p.11 로고가 새겨진 봉투의 감자튀김을 \"엄청 맛있다\"고 하는 아이 vs 흰 봉투 감자튀김. 오른쪽 아래 해골 = 원효대사 해골물|medium]]\n\n* '''미각''': 유명 프랜차이즈 로고 봉투의 감자튀김을 더 맛있다고 느낌(Robinson et al., 2008). 교수: 그래서 '''블라인드 테스트'''를 한다.\n* '''원효대사 해골물''': 모르고 마셨을 땐 시원했는데 해골물인 걸 알자 달라짐 → \"모든 건 마음먹기에 달렸다\"는 심리학적으로 꽤 맞는 말.\n\n=== 말 분절 ===\n{def}\n'''설명''': 연속된 말소리 안에서 단어의 시작과 끝을 구분할 수 있는 능력 (4장 p.11)\n'''명칭''': [[지각 갖춤새|말 분절]] (Speech Segmentation)\n{/def}\n모국어의 단어·문법 지식이 있어야 가능하므로 '''청각의 하향 처리''' 예시다. 교수: 모르는 러시아어는 어디서 단어가 끊기는지 들리지 않는다.\n\n== 가짜약 조건 (p.12) ==\n[[img:L4-12.png|p.12 플라시보 효과 예시(디카페인 커피 효과) — 디카페인인 걸 알고 마신 경우 vs 카페인 커피라고 믿고 마신 경우|medium]]\n\n[[가짜약 효과]](Placebo)는 '''기대치(Expectation)'''가 적용된 하향 처리의 대표 사례(디카페인 커피, Dawkins et al., 2011). 가짜약 조건 = 처치를 받았다고 참가자가 '''착각'''하게 만드는 조건 → '인지'의 효과인지 '처치'의 효과인지 비교 가능. (1장 실험 설계의 그 [[가짜약 효과]].)\n\n=== 통증 지각 ===\n{def}\n'''설명''': 개인의 기대나 주의가 통지각을 바꿀 수 있다는 결과. 과거에는 통증 지각이 상향 처리 중심(직접 경로 모형)이라 설명했으나 부상병 보고로 반박됨 (4장 p.13)\n'''명칭''': [[지각 갖춤새|통증 지각]] (통증과 통지각 — 하향 처리의 극적인 예)\n{/def}\n\n[[img:L4-13.png|p.13 인지 및 주의에 따른 촉각(통각) 경험 — 1. 모기에 물린 사실을 몰랐을 때(가려움 못 느낌) 2. 알아챘을 때 3. 가려움이 시작됨|medium]]\n\n{| class=\"table\"\n! 연구 || 내용 || 의미\n|-\n| Wiech et al. (2008) || 기대나 주의가 통지각을 바꿈 || 하향 영향\n|-\n| Beecher (1959) || 2차 대전 '''부상병''' 상당수가 중상인데도 통증을 못 느낌 || '''직접 경로 모형'''(상향 중심) 반박\n|-\n| Hoffman et al. (2008) || '''가상현실 게임'''으로 주의 분산 → '''화상 환자''' 통지각 '''감소''' || 주의의 힘\n|}\n\n{exam}\n교수 (🎙 9/22 39:45): 가짜약이 기대치에 따른 하향식 지각의 대표 사례이고 \"그걸 더 '''극적으로''' 보여준 게 저 '''통증''' 관련 연구\". 교수 예: 모기 물린 걸 알아챈 순간부터 가렵다, 예방접종 때 \"따끔해요\" 하며 시선을 돌리라고 하는 이유.\n{/exam}\n\n{warn}\nbank 함정 (4장 p.13): \"직접 경로 모형에 따르면 기대와 주의가 통증을 결정한다\" → '''틀림'''. 직접 경로 모형은 '''상향''' 처리 중심(더 다치면 더 아프다)이고, 기대·주의는 하향 관점. \"VR 게임으로 주의를 분산하면 통증이 '''증가'''\" → 틀림('''감소''').\n{/warn}\n\n{analogy}\n지각 갖춤새는 '''영화 예고편'''이다. \"올해 최고의 공포영화\"라는 예고편을 보고 들어가면 문 삐걱거리는 소리에도 소름이 돋고, 같은 장면을 \"코미디\"라는 예고편 뒤에 보면 웃긴다. 화면(감각 입력)은 같고, 예고편이 심어 둔 기대(갖춤새)가 다르다.\n{/analogy}\n\n== 관련 문서 ==\n* [[하향 처리]] — 지각 갖춤새가 대표하는 처리 방식\n* [[가짜약 효과]] — 1장, 실험 설계에서의 가짜약 조건\n* [[맥락·동기·정서와 지각]] — p.14–17 이어지는 하향 영향\n* [[음소 복원 효과]]\n\n근거: 4장 p.9–13"
 },
 "음소 복원 효과": {
  "title": "음소 복원 효과 (Phonemic Restoration)",
  "category": [
   "4장 감각과 지각",
   "용어"
  ],
  "body": "'''음소 복원 효과'''는 문장 속 소리 일부가 물리적으로 빠져 있어도, 뇌가 '''문장 맥락'''을 근거로 그 소리를 채워서 \"들었다\"고 지각하는 현상이다. 청각에서 일어나는 [[하향 처리]]의 깔끔한 예이고, 통합요약 단답형 출제 예상 목록에 올라 있다. ⭐⭐\n\n{def}\n'''설명''': 문장의 일부 소리를 물리적으로 누락해도, 맥락에 근거하여 사라진 소리를 복원해 듣는 현상 (4장 p.14)\n'''명칭''': 음소 복원 효과 (Phonemic restoration)\n'''사례형''': 기침 소리로 가려진 \"*eel is on the wagon\"을 들은 사람은 \"wheel\"을, \"*eel is on the orange\"를 들은 사람은 \"peel\"을 들었다고 보고한다.\n{/def}\n\n[[img:L4-14.png|p.14 맥락, 동기, 정서에 따른 지각 차이 — 맥락의 영향력. 'eel is on the wagon' ⇒ wheel, 'eel is on the orange' ⇒ peel, \"음소 복원 효과와 연관\"|medium]]\n\n== 예시 (Grossberg, 1995) ==\n{| class=\"table\"\n! 들려준 문장 (첫 소리 누락) || 뒤에 오는 맥락 단어 || 지각한 단어\n|-\n| *eel is on the '''wagon''' || 수레 || '''wheel''' (바퀴)\n|-\n| *eel is on the '''orange''' || 오렌지 || '''peel''' (껍질)\n|}\n\n<pre class=\"ascii\">\n  귀에 들어온 소리:  [기침] eel is on the wagon\n                        ↑\n  뇌: \"wagon 에 붙어 있는 eel? → wheel 이겠지\"   ← 맥락이 '''위에서''' 빈칸을 채움\n  지각:              wheel is on the wagon\n<\/pre>\n\n주목할 점: 결정적 단서(wagon/orange)는 빈칸 '''뒤에''' 나온다. 그런데도 사람들은 처음부터 wheel/peel 을 들었다고 느낀다 — 맥락이 지각을 거슬러 올라가 바꿔 놓는 것.\n\n{analogy}\n음소 복원 효과는 '''휴대폰 자동 수정'''이다. \"오늘 저녁에 치_ 먹자\"라고 치다가 한 글자를 빠뜨려도 받는 사람은 \"치킨\"으로 읽는다. 받는 사람은 빠진 글자가 있었는지도 모를 만큼 자연스럽게 채운다.\n{/analogy}\n\n{tip}\n\"말 분절\"(p.11)과 헷갈리지 말 것. [[지각 갖춤새|말 분절]]은 연속된 말소리에서 '''단어의 경계'''를 찾는 능력, 음소 복원 효과는 '''사라진 소리를 메우는''' 현상. 둘 다 청각의 하향 처리다.\n{/tip}\n\n== 관련 문서 ==\n* [[맥락·동기·정서와 지각]] — 같은 슬라이드 묶음(p.14–17)\n* [[하향 처리]]\n* [[지각 갖춤새]]\n\n근거: 4장 p.14"
 },
 "맥락·동기·정서와 지각": {
  "title": "맥락·동기·정서에 따른 지각 차이",
  "category": [

   "이론"

  "body": "4장 p.14–17 은 같은 제목 \"'''맥락, 동기, 정서에 따른 지각 차이'''\" 아래 네 슬라이드다. 상황·문화(맥락), 결핍·목표(동기), 기분(정서)이 같은 자극을 다르게 지각하게 만든다 — 전부 [[하향 처리]]다.\n\n{def}\n'''설명''': 상황 혹은 문화에 따라 다양한 맥락이 형성되어 지각에 영향. 과업 목표 혹은 결핍에 따라 추동에 의한 지각 차이가 발생할 수 있음. 개인의 정서에 따라 실제 자극을 다르게 지각 (4장 p.14–17)\n'''명칭''': 맥락·동기·정서에 따른 지각 차이 (하향 처리의 영향)\n{/def}\n\n== 한눈에 ==\n{| class=\"table\"\n! 요인 || 슬라이드 || 연구 || 예시\n|-\n| '''맥락 — 문장''' || p.14 || Grossberg (1995) || eel is on the wagon → wheel / orange → peel ([[음소 복원 효과]])\n|-\n| '''맥락 — 문화''' || p.15 || Gregory & Gombrich (1973) || 동아프리카: \"여성이 금속 상자를 머리에 이고 있다\" / 서구: \"여성이 창문 밑에 앉아 있다\"\n|-\n| '''동기''' || p.16 || Balcetis & Dunning (2010); Burrow et al. (2016) || '''갈증''' → 물병이 더 '''가깝게''' / '''무거운 배낭·피곤''' → 거리가 더 '''멀게'''\n|-\n| '''정서''' || p.17 || Halberstadt et al. (1995); Tay & Ng (2019) || '''슬픈 음악''' → Mourning/Morning, Dye/Die, Pane/Pain 을 더 '''부정적으로''' / 신나는 음악 → 행복한 단어 재인 촉진\n|}\n\n== p.14 맥락 ==\n[[img:L4-14.png|p.14 얼굴만 잘라 보면 울부짖는 듯한 표정이, 아래 팀 전체가 얼싸안는 장면 속에서는 우승의 기쁨으로 읽힌다|medium]]\n\n교수 추가 예시 (🎙 9/22 43:43): '''배구 선수 표정''' — 얼굴만 보면 모호한데 시상식(우승 축하) 전체 장면을 보면 정서가 분명해진다.\n\n== p.15 문화 ==\n[[img:L4-15.png|p.15 문화권에 따른 그림 해석의 차이(동아프리카 VS 서구) — 같은 실내 그림, 여성 머리 위 사각형이 상자인가 창문인가|medium]]\n\n이유: 아프리카에서는 물건을 '''머리에 이고 다니는 경험'''이 흔하고 서구는 드물다 → 경험이 다르면 같은 그림이 다르게 보인다. 교수 보충: '''장면 도식'''(scene schema, 슬라이드엔 없고 수업에서만) — 강의실에 에어프라이어가 있으면 이상해서 시선이 몰린다 → 아이트래킹으로 검증.\n\n== p.16 동기 ==\n[[img:L4-16.png|p.16 개인의 내적 상태에 따른 거리감 지각(Burrow et al., 2016) — 1. 피곤하지 않은 상태: 거리가 짧게 2. 피곤한 상태: 같은 길이 길게|medium]]\n\n과업 목표나 결핍에 따른 [[변연계|추동]]이 '''중립 자극 해석의 편향'''을 만든다. 교수 예: DGIST 정문에서 '''내려갈 때 vs 올라올 때''', '''중간고사 분량'''이 막막하게 느껴지는 것.\n\n== p.17 정서 ==\n[[img:L4-17.png|p.17 정서에 따른 단어 지각 차이(Halberstadt et al., 1995) — 슬픈 음악(파랑) vs 신나는 음악(주황)|small]]\n\n{analogy}\n맥락·동기·정서는 '''선글라스 세 겹'''이다. 문화라는 렌즈, 지금 목마른지·피곤한지라는 렌즈, 기분이라는 렌즈를 겹쳐 끼고 세상을 본다. 슬픈 날엔 파란 렌즈가 끼워져 \"morning\"도 \"mourning\"으로 보인다. 렌즈를 벗고 세상을 보는 사람은 없다.\n{/analogy}\n\n{warn}\n방향 함정: \"갈증 상태에서 물병이 더 '''멀게''' 지각\" → 틀림('''가깝게'''). \"무거운 배낭을 지면 거리가 '''가깝게'''\" → 틀림('''멀게'''). 방향을 바꿔 놓은 보기를 조심.\n{/warn}\n\n{joke}\n교수의 \"중간고사 분량이 막막하게 느껴지는 것도 내적 상태에 따른 지각 차이\" — 이 문서를 읽고 분량이 줄어 보인다면 그건 동기가 생긴 것이다. 실제 분량은 그대로다.\n{/joke}\n\n== 관련 문서 ==\n* [[음소 복원 효과]] — p.14 의 핵심 명칭\n* [[지각 갖춤새]] — p.9–13, 앞선 하향 처리 사례\n* [[하향 처리]]\n\n근거: 4장 p.14–17"
 },
 "눈의 구조": {
  "title": "눈의 구조 (동공·홍채·수정체·망막·중심와·맹점·시신경)",
  "category": [
   "4장 감각과 지각",
   "뇌 구조"
  ],
  "body": "4장 p.20–22 는 빛이 눈에 들어와 신경 신호가 되기까지 거치는 기관을 하나씩 짚는다. 기관 이름이 전부 단답형 후보이고, 특히 '''근시/원시'''의 방향과 '''중심와/맹점'''은 객관식 함정으로 나오기 좋다. ⭐⭐⭐\n\n[[img:L4-21.png|p.21 안구의 구조 — 앞쪽 각막·동공·홍채·수정체, 뒤쪽 망막 위 중심와(상이 가장 선명)와 시신경이 빠져나가는 맹점|medium]]\n\n== 빛 (p.20) ==\n[[img:L4-20.png|p.20 가시광선 대역 — 전자기 스펙트럼 중 아주 좁은 띠. 아래 파형: 파장 길이(색), 진폭 크기(밝기)|medium]]\n\n물체가 반사한 빛 에너지를 수용한다. '''파장 → 색상''', '''진폭 → 강도(밝기)'''.\n{| class=\"table\"\n! 빛의 특성 || 지각\n|-\n| 장파장 (= 저주파) || '''붉은색'''\n|-\n| 단파장 (= 고주파) || '''푸른색'''\n|-\n| 진폭이 크다 || 밝다\n|-\n| 진폭이 작다 || 어둡다\n|}\n\n== 기관별 정의 ==\n\n=== 동공 ===\n{def}\n'''설명''': 빛이 통과하는 구멍 (4장 p.21)\n'''명칭''': [[눈의 구조|동공]] (Pupil)\n{/def}\n\n=== 홍채 ===\n{def}\n'''설명''': 동공의 크기를 조절하는 기관. 상상을 통해서도 크기가 조절됨 (4장 p.21)\n'''명칭''': [[눈의 구조|홍채]] (Iris)\n{/def}\n밝으면 동공을 수축, 어두우면 확장. 교수 (🎙 9/22 1:00:52): 밝은/어두운 공간을 '''상상'''만 해도 조절된다(Laeng & Sulutvedt, 2014) → 지각 영역과 기억 영역의 연관.\n\n=== 망막 ===\n{def}\n'''설명''': 반사된 빛이 상을 형성하는 곳으로, 광수용기인 간상체와 원추체로 구성. 망막에 맺힌 상은 뒤집힌 형태로 존재 (4장 p.21)\n'''명칭''': [[눈의 구조|망막]] (Retina)\n{/def}\n교수: 상은 거꾸로 맺히지만 '''대뇌가 보정'''해 바로 선 형태로 지각한다 — 지각이 상향+하향 모두의 영향을 받는다는 증거.\n\n=== 중심와 ===\n{def}\n'''설명''': 망막에서 상이 가장 선명하게 맺히는 곳 (4장 p.21)\n'''명칭''': [[눈의 구조|중심와]] (Fovea)\n{/def}\n[[원추체와 간상체|원추체]]가 밀집한 망막 중앙.\n\n=== 맹점 ===\n{def}\n'''설명''': 시신경이 (빠져나가는 자리라 광수용기가) 존재하지 않아 상이 맺히지 않는 곳 (4장 p.21)\n'''명칭''': [[눈의 구조|맹점]] (Blind spot)\n{/def}\n\n=== 수정체 ===\n{def}\n'''설명''': 빛의 굴절 정도를 조절하여 망막에 상이 맺히도록 하는 렌즈 역할 기관. 굴절 수준에 따라 원시/근시가 결정 (4장 p.22)\n'''명칭''': [[눈의 구조|수정체]] (Lens)\n{/def}\n\n=== 원시 ===\n{def}\n'''설명''': 수정체의 굴절력이 약해서 상이 망막 뒤에 맺히는 상태 (4장 p.22)\n'''명칭''': [[눈의 구조|원시]] (Hyperopia)\n{/def}\n\n=== 근시 ===\n{def}\n'''설명''': 수정체의 굴절력이 강해서 상이 망막 앞에 맺히는 상태 (4장 p.22)\n'''명칭''': [[눈의 구조|근시]] (Myopia)\n{/def}\n\n=== 시신경 ===\n{def}\n'''설명''': 망막의 빛 에너지를 신경 신호로 변환하여 대뇌에 전달 (광수용기 세포가 신경 신호로 변환) (4장 p.22)\n'''명칭''': [[눈의 구조|시신경]] (Optic nerve)\n{/def}\n\n[[img:L4-22.png|p.22 안구의 구조 — 수정체(굴절 조절)와 시신경(대뇌로 전달)|small]]\n\n== 원시 vs 근시 ==\n{| class=\"table\"\n! || [[눈의 구조|원시]] || [[눈의 구조|근시]]\n|-\n| 수정체 굴절력 || '''약함''' || '''강함'''\n|-\n| 상이 맺히는 곳 || 망막 '''뒤''' || 망막 '''앞'''\n|-\n| 교정 렌즈 (🎙) || '''볼록'''렌즈 (돋보기) || '''오목'''렌즈 (빛을 퍼지게)\n|}\n\n[[anim:transduction_vision|빛이 수정체에서 꺾여 망막에 거꾸로 맺히는 장면에서 멈추고, 중심와(원추체 밀집)와 맹점(시신경 출구) 위치를 확인할 것]]\n\n<pre class=\"ascii\">\n 빛 → [각막] → [동공](홍채가 크기 조절) → [수정체](굴절) → [망막](상, 거꾸로)\n                                                         ├ 중심와: 가장 선명 (원추체 밀집)\n                                                         └ 맹점: 시신경 출구, 상 없음\n       → 광수용기(원추체·간상체) → 양극세포 → [시신경] → 시상 → 후두엽 시각 피질\n<\/pre>\n\n{analogy}\n눈은 '''카메라'''다. 동공 = 조리개 구멍, 홍채 = 조리개 날개(구멍 크기 조절), 수정체 = 초점 렌즈, 망막 = 이미지 센서, 중심와 = 센서 한가운데 고화소 구역, 맹점 = 센서에 케이블이 꽂힌 자리(그 부분은 픽셀이 없다), 시신경 = USB 케이블. 근시는 렌즈가 너무 강하게 꺾어서 '''센서 앞에서''' 초점이 맞아 버리는 카메라다.\n{/analogy}\n\n{warn}\n근시/원시 방향을 뒤집은 보기가 단골 함정이다. 외우는 법: '''근시 = 굴절력 강(强) = 앞(前)'''. 강하게 꺾으니 일찍(앞에서) 모인다.\n{/warn}\n\n== 관련 문서 ==\n* [[원추체와 간상체]] — 망막의 두 광수용기\n* [[변환]] — 빛이 신호가 되는 과정\n* [[4장 감각과 지각]]\n\n근거: 4장 p.20–22"
 },

  "body": "망막의 광수용기는 두 종류다. '''원추체'''(cone)는 색과 세부를 담당하는 소수 정예, '''간상체'''(rod)는 어둠 속 명암을 담당하는 대군. p.24 의 비교표 다섯 줄이 그대로 객관식 보기가 된다. ⭐⭐⭐\n\n=== 원추체 ===\n{def}\n'''설명''': 색상을 감지(세부사항 탐지 용이). 망막의 중심 영역에 주로 분포하며 낮 시간에 활동, 두뇌로 이어지는 핫라인 존재(개별 단위의 신호 전달) (4장 p.23)\n'''명칭''': [[원추체와 간상체|원추체]] (Cone)\n{/def}\n\n=== 간상체 ===\n{def}\n'''설명''': 빛의 밝기(명암)를 감지. 망막의 주변 영역에 주로 분포하며 석양 무렵에 활동, 핫라인 없음(여러 뉴런의 신호를 합산하여 전달), 암순응과 연관 (4장 p.23)\n'''명칭''': [[원추체와 간상체|간상체]] (Rod)\n{/def}\n\n[[img:L4-24.png|p.24 원추체와 간상체의 비교 — 개체 수 600만 vs 1억 2천만, 위치 중앙 vs 주변, 약한 빛 민감도 낮다 vs 높다, 색채·세부사항 민감도 높다 vs 낮다|medium]]\n\n== 비교표 (p.23–24) ==\n{| class=\"table\"\n! || 원추체 (cone) || 간상체 (rod)\n|-\n| 개체 수 || '''600만''' 개 || '''1억 2천만''' 개\n|-\n| 망막 상 위치 || '''중앙''' (중심와) || '''주변'''\n|-\n| 약한 빛 민감도 || 낮다 || '''높다'''\n|-\n| 색채 민감도 || '''높다''' || 낮다\n|-\n| 세부사항 민감도 || '''높다''' || 낮다\n|-\n| 활동 시간 || 낮 || 석양 무렵 (어두울 때)\n|-\n| 두뇌 연결 || '''핫라인''' 있음 — 개별 단위 신호 전달 || 핫라인 없음 — 여러 뉴런 신호 '''합산'''\n|-\n| 관련 현상 || 색·세부 지각 || '''암순응'''\n|}\n\n교수 (🎙 9/22 1:05:40): 원추체는 '''개수가 적어서''' 하나하나가 핫라인으로 직접 연결돼야 세부가 살아난다. 간상체는 수가 많아 여럿을 '''합산'''해 보내므로 약한 빛에는 강하지만 세부는 뭉개진다.\n\n=== 양극세포 ===\n{def}\n'''설명''': 원추체와 간상체에서 받은 신호를 시신경으로 전달하는 세포 (4장 p.23)\n'''명칭''': [[원추체와 간상체|양극세포]] (Bipolar cell)\n{/def}\n\n[[img:L4-23.png|p.23 망막 내 시신경 구조 — 빛이 망막 층을 통과해 뒤쪽 간상체·원추체에 닿고, 신호는 양극세포 → 신경절세포 → 시신경으로 앞쪽을 거쳐 나간다|medium]]\n\n<pre class=\"ascii\">\n 빛 →  간상체 ×여럿 ─┐\n                      ├→ 양극세포 (합산) → 신경절세포 → 시신경   (간상체: 핫라인 없음)\n 빛 →  원추체 ─────────→ 양극세포 (1:1)  → 신경절세포 → 시신경   (원추체: 핫라인)\n<\/pre>\n\n=== 암순응 ===\n{def}\n'''설명''': 어두운 곳에 들어가면 처음엔 안 보이다가 점차 형체가 식별되는 현상. 간상체와 연관 (4장 p.23)\n'''명칭''': [[원추체와 간상체|암순응]] (Dark adaptation)\n{/def}\n\n[[anim:transduction_vision|중심와의 원추체(색·세부, 핫라인)와 주변의 간상체(명암, 합산)가 각각 양극세포로 신호를 보내는 장면을 비교할 것]]\n\n{analogy}\n원추체는 '''고급 레스토랑 셰프''' — 수는 적지만(600만) 한 명씩 손님 테이블에 직통(핫라인)으로 연결돼 색과 디테일이 살아 있는 요리를 낸다. 단, 조명이 어두워지면(밤) 일을 못 한다. 간상체는 '''대형 급식실''' — 인원은 많고(1억 2천만) 여럿이 한 솥에 모아(합산) 퍼 주니 디테일은 뭉개지지만, 정전이 나도 손전등 하나로 밥은 나온다(약한 빛에 강함).\n{/analogy}\n\n{warn}\nbank 함정 (4장 p.23–24): \"원추체는 간상체보다 개체 수가 많고 주변부에 분포\" → 틀림(정반대). \"간상체는 색채와 세부사항 탐지에 특화\" → 틀림(원추체). \"원추체는 핫라인이 없어서 합산 전달\" → 틀림(합산은 간상체). 원추체=적고·중앙·색·세부·핫라인, 간상체=많고·주변·명암·합산·암순응 — 한 덩어리로 외울 것.\n{/warn}\n\n{tip}\n[[감각 순응]]과 '''암순응'''은 다르다. 감각 순응 = 반복 자극에 '''둔해짐''', 암순응 = 어둠 속에서 '''더 잘 보이게 됨'''.\n{/tip}\n\n== 관련 문서 ==\n* [[눈의 구조]] — 망막·중심와·시신경\n* [[변환]]\n* [[감각 순응]]\n\n근거: 4장 p.23–24"
 },
 "자질 탐지기": {
  "title": "자질 탐지기 (Feature Detector)",
  "category": [
   "4장 감각과 지각",
   "용어"
  ],
  "body": "'''자질 탐지기'''는 선의 기울기, 움직임 방향 같은 '''특정 물리적 특성 하나에만''' 반응하는 뇌의 신경세포다. 시각 피질은 이런 전문가 뉴런들의 발화 패턴을 종합해서 \"무엇을 봤는지\"를 조립한다. ⭐⭐\n\n{def}\n'''설명''': 물리적 특성(각도, 움직임 등)에 반응하는 두뇌의 각 신경세포. 자질 탐지기의 발화 패턴을 종합하여 지각을 수행 (4장 p.26)\n'''명칭''': 자질 탐지기 (Feature detector)\n'''사례형''': 고양이 시각 피질의 한 뉴런에 전극을 꽂고 여러 기울기의 막대를 보여주었더니, 특정 각도의 막대가 나올 때만 발화했다.\n{/def}\n\n[[img:L4-26.png|p.26 특정 자질에 반응하는 뉴런(상) — 고양이에게 막대를 보여주며 시각 피질 뉴런 반응을 기록. 얼굴 재인 영역의 반응 양상(하)|medium]]\n\n== 슬라이드 내용 (p.26) ==\n* 자질 탐지기 = 각도·움직임 등 '''물리적 특성'''에 반응하는 각 신경세포.\n* 자질 탐지기의 '''발화 패턴을 종합'''하여 지각을 수행.\n* '''상위세포 군집일수록 보다 복잡한 패턴에 반응'''.\n* Fusiform Face Area(FFA, [[방추상 얼굴 영역]])는 얼굴 자극의 재인을 담당(Gorno-Tempini & Price, 2001) — 손상 시 얼굴실인증 발생. (같은 슬라이드의 별도 항목)\n\n교수 (🎙 9/22 1:12:22): 고양이 단일 뉴런 실험 — 특정 기울기·방향에만 반응하는 뉴런을 보여 준 결과.\n\n<pre class=\"ascii\">\n  단순 자질             →   조합              →   복잡한 패턴\n  [ / ] [ — ] [ | ]        [모서리] [곡선]        [더 복잡한 패턴]\n  (하위 세포)                                     (상위 세포 군집)\n  ─────────────── (해석) 부분 → 전체 ───────────────→\n<\/pre>\n\n{analogy}\n자질 탐지기는 '''레고 부품 분류 담당 직원들'''이다. 한 명은 \"2×4 빨간 블록만\", 한 명은 \"바퀴만\" 집어 든다. 한 명 한 명은 단순하지만 위 층으로 갈수록 \"차 앞부분 조립 담당\", 맨 위에는 \"완성된 자동차 검수 담당\"이 있다. 지각은 이 조립 라인의 결과물이다.\n{/analogy}\n\n{tip}\n자질 탐지 → [[병렬 처리]] → 재인 순서가 p.27 \"지각의 발생 과정\" 그림 그대로다. 자질 탐지는 그중 '''③번 단계'''.\n{/tip}\n\n== 관련 문서 ==\n* [[방추상 얼굴 영역]] — 같은 슬라이드, 상위 세포 군집의 예\n* [[병렬 처리]] — 다음 단계\n* [[상향 처리]] — (해석) 슬라이드는 자질 탐지를 상향/하향으로 분류하지 않음\n\n근거: 4장 p.26"
 },
 "방추상 얼굴 영역": {
  "title": "방추상 얼굴 영역 (Fusiform Face Area, FFA)",
  "category": [
   "4장 감각과 지각",
   "뇌 구조"
  ],
  "body": "'''방추상 얼굴 영역'''(FFA)은 '''얼굴''' 재인을 전담하는 뇌 영역이다. 2장 [[연합 영역]]에서 이름만 나왔고, 4장 p.26 에서 손상·자극 연구와 함께 본격적으로 다룬다. 장소를 담당하는 짝꿍 영역 PPA 와 함께 외워 둘 것. ⭐⭐\n\n{def}\n'''설명''': 얼굴 자극의 재인을 담당하는 영역. 손상 시 얼굴실인증 발생 (4장 p.26, Gorno-Tempini & Price, 2001)\n'''명칭''': 방추상 얼굴 영역 (Fusiform Face Area, FFA)\n{/def}\n\n[[img:L4-26.png|p.26 아래: 측두엽 아래쪽 방추상회의 FFA 위치(파란 부분)와, 얼굴 사진에는 강하게·다른 사물에는 약하게 반응하는 막대그래프|medium]]\n\n=== 얼굴실인증 ===\n{def}\n'''설명''': FFA 손상 시 발생하는, 얼굴을 알아보지 못하는 증상 (4장 p.26)\n'''명칭''': [[방추상 얼굴 영역|얼굴실인증]] (Prosopagnosia)\n{/def}\n\n=== PPA ===\n{def}\n'''설명''': 장소나 공간을 지각하는 영역 (4장 p.26)\n'''명칭''': [[방추상 얼굴 영역|PPA]] (해마곁 장소 영역, parahippocampal place area)\n{/def}\n\n== FFA vs PPA ==\n{| class=\"table\"\n! || FFA (방추상 얼굴 영역) || PPA (해마곁 장소 영역)\n|-\n| 담당 || '''얼굴''' 재인 || '''장소·공간''' 지각\n|-\n| 손상 시 || '''얼굴실인증''' || —\n|-\n| 외부 자극 || '''TMS'''(경두개 자기장 자극술) 적용 → 얼굴 재인 능력 저하 (McKone et al., 2007) || —\n|-\n| 겹친 사진 실험 (🎙) || 얼굴에 '''주의''' → FFA 활성 || 장소에 '''주의''' → PPA 활성\n|}\n\n교수 (🎙 9/22 1:12:22~1:16:21): 얼굴과 장소 사진을 '''겹쳐''' 보여 주고 한쪽에 주의를 기울이게 하면, 주의를 둔 쪽 영역이 활성화된다 — 물리적 자극은 같아도 주의가 뇌 반응을 바꾼다.\n\n{warn}\nbank 함정 (4장 p.26): \"PPA 는 얼굴 자극에 특히 강하게 반응\" → 틀림(PPA=장소). \"FFA 는 장소·공간 이미지에 반응하고 얼굴엔 반응하지 않음\" → 틀림. \"겹친 사진에서 주의와 '''무관하게''' 항상 FFA 만 활성화\" → 틀림(주의에 따라 달라짐).\n{/warn}\n\n{analogy}\nFFA 는 뇌 속 '''연락처 앱의 얼굴 인식 기능'''이다. 이 기능이 고장 나면(얼굴실인증) 사진첩의 사람들이 다 \"알 수 없는 사람\"이 된다 — 목소리를 들으면 바로 알아보는데도. PPA 는 같은 앱의 '''위치 태그 기능'''이라 둘은 따로 고장 날 수 있다.\n{/analogy}\n\n{tip}\nFFA 는 [[자질 탐지기]] 이야기의 연장이다: \"'''상위 세포 군집일수록 보다 복잡한 패턴'''에 반응\" → 가장 복잡한 패턴 중 하나가 얼굴.\n{/tip}\n\n== 관련 문서 ==\n* [[자질 탐지기]] — 같은 슬라이드\n* [[연합 영역]] — 2장 p.28 에서 FFA 첫 등장\n* [[하향 처리]] — 얼굴 13개 그림(얼굴 찾기에 기대가 작용)\n\n근거: 4장 p.26; 2장 p.28"
 },
 "병렬 처리": {
  "title": "병렬 처리 (Parallel Processing)",
  "category": [
   "4장 감각과 지각",
   "용어"
  ],
  "body": "'''병렬 처리'''는 여러 작업을 '''동시에''' 수행하는 처리 방식이다. 시각에서는 한 장면의 움직임·형태·깊이·색을 각기 다른 뇌 영역이 한꺼번에 처리한 뒤 합친다. 2장 [[이중 처리]](계열 vs 병렬)에서 먼저 나왔고, 4장 p.27 에서 시각 지각에 적용된다. ⭐⭐\n\n{def}\n'''설명''': 여러 가지 작업을 동시에 수행하는 처리 방식. 시각 장면 분석을 위해 움직임, 형태, 깊이 등의 하위 차원을 동시에 처리 (4장 p.27)\n'''명칭''': 병렬 처리 (Parallel processing)\n'''사례형''': 날아오는 빨간 공을 볼 때 뇌는 \"빨갛다\", \"둥글다\", \"다가온다\", \"빠르다\"를 순서대로가 아니라 각 영역에서 한꺼번에 처리한 뒤 하나의 공으로 통합한다.\n{/def}\n\n[[img:L4-27.png|p.27 지각의 발생 과정 — ① 시각 입력 → ② 망막 처리 → ③ 자질 탐지 → ④ 병렬 처리 → ⑤ 재인|medium]]\n\n== 슬라이드 내용 (p.27) ==\n* 망막을 통해 각 두뇌 영역으로 전달된 정보가 '''담당 영역에 통합'''되어 시각 자극이 지각된다.\n* 시각 재인은 '''다양한 신경망의 협응'''을 통해 이루어진다(Ramot et al., 2019).\n\n교수 (🎙 9/22 1:16:35~1:18:07): \"지각 기전이라는 것 자체가 뇌 영역 차원에서 보면 '''조별 과제''' 같은 역할인 거죠.\" 한 영역이 손상되면 그 속성(예: 움직임)만 지각하지 못한다. 수업에서는 '''분산 표상'''(distributed representation — 복합적 지각은 여러 영역의 합작)도 함께 언급.\n\n== 계열 처리 vs 병렬 처리 ==\n{| class=\"table\"\n! || 계열 처리 (serial) || 병렬 처리 (parallel)\n|-\n| 방식 || 한 번에 하나씩, 순서대로 || 여러 개를 동시에\n|-\n| 2장 [[이중 처리]] || 의식적 처리 쪽 || 무의식적 처리 쪽\n|-\n| 4장 시각 || — || 움직임·형태·깊이·색을 각 영역이 동시에 → 통합\n|}\n\n{analogy}\n교수의 비유 그대로 '''조별 과제'''. 자료 조사 담당, PPT 담당, 발표 담당이 '''동시에''' 각자 파트를 하고 마지막에 합친다. 한 명이 잠수 타면(영역 손상) 그 파트만 통째로 빈다 — 다른 파트는 멀쩡한데도 발표는 이상해진다.\n{/analogy}\n\n== 관련 문서 ==\n* [[이중 처리]] — 2장, 계열 vs 병렬\n* [[자질 탐지기]] — 병렬 처리 직전 단계\n* [[4장 감각과 지각]]\n\n근거: 4장 p.27; 2장 p.34"
 },
 "게슈탈트 심리학": {
  "title": "게슈탈트 심리학 (Gestalt Psychology)",
  "category": [
   "4장 감각과 지각",
   "이론"
  ],
  "body": "'''게슈탈트 심리학'''은 \"'''전체는 단순한 부분의 총합 그 이상'''\"이라는 한 문장으로 요약되는 지각 이론이다. 게슈탈트(Gestalt)는 독일어로 \"모양, 전체\". 서막의 [[구조주의]]와 정반대 입장이고, 교수가 \"많이 헷갈리기 좋은 부분\"이라며 길게 설명한 '''상향 처리 함정'''의 주인공이다. ⭐⭐⭐\n\n{def}\n'''설명''': 전체는 단순한 부분의 총합 그 이상이라고 보는 접근. 입력된 정보를 단순히 표상하는 것이 아니라 그 이상의 해석을 가미하여 지각을 구성 (4장 p.28)\n'''명칭''': 게슈탈트 심리학 (Gestalt Psychology)\n{/def}\n\n[[img:L4-28.png|p.28 지각의 조직화 예시(네커 육면체) — 검은 Y자 조각들뿐인데 흰 정육면체가 떠 보인다|medium]]\n\n== 슬라이드 내용 (p.28) ==\n* [[구조주의]]의 영향력을 일부 받음 — 그러나 구조주의와 구별되는 차이점 존재.\n* 전체는 단순한 부분의 총합 그 이상.\n* '''[[선택적 주의]]'''에 따라 자극의 해석은 '''한 번에 하나만''' 볼 수 있음(Bradley et al., 1976).\n\n=== 네커 육면체 ===\n{def}\n'''설명''': 물리적으로는 선 몇 개뿐인데 정육면체로 지각되고, 앞면이 어느 쪽인지 해석이 번갈아 바뀌는 지각 조직화의 예시. 한 번에 하나의 해석만 볼 수 있음 (4장 p.28)\n'''명칭''': [[게슈탈트 심리학|네커 육면체]] (Necker cube)\n{/def}\n교수는 수업에서 \"데커 육면체\"로 발음했다 (🎙 9/22 1:18:07). 정식 명칭은 '''네커'''.\n\n== 구조주의 vs 게슈탈트 ==\n{| class=\"table\"\n! || [[구조주의]] ([[빌헬름 분트]]) || 게슈탈트 심리학\n|-\n| 핵심 주장 || 마음의 원자(요소)를 통합하면 '''곧 전체''' || 전체는 부분의 합 '''그 이상'''\n|-\n| 방법 || 요소로 분해 ([[내성법]]) || 전체 형태의 조직화 원리 탐구\n|-\n| 관계 || — || 구조주의의 영향을 일부 받았지만 결정적으로 다름\n|}\n\n== 형태 지각의 원리 ==\n* [[전경-배경]] (p.29): 대상을 배경에서 분리, 가역적\n* [[집단화]] (p.30): 근접성·연속성·폐쇄\n* 집단화 원리는 '''유아도''' 사용(Gallace & Spence, 2011), 게슈탈트 원리는 '''내재된, 타고난 것'''(Wertheimer, 1912)\n\n[[anim:gestalt_grouping|전경-배경 반전 → 근접성 → 연속성 → 폐쇄. 네 장면 모두 \"부분에는 없는 전체\"가 생겨나는 순간을 볼 것]]\n\n{exam}\n'''게슈탈트 = 타고난 상향 처리 쪽.''' 교수 (🎙 9/22 1:26:56): \"설명 방식만 봐서는 상당히 헷갈리실 수 있는 부분인데, 게슈탈트 심리학 같은 경우는 지각 과정을 설명하는 데 있어서 '''하향 처리보다는 상향 처리의 영향력을 더 강조'''하는 쪽이에요.\" ① 집단화 원리는 경험·후천적 환경이 아니라 '''원래부터 내재''' ② 정보 처리가 '''가장 하위 차원(부분)에서 시작해 전체'''로 → 상향. (게슈탈트 학자들도 경험의 영향은 인정하고, 현대 심리학자들은 경험의 영향을 주장하기도 한다.)\n{/exam}\n\n{quiz}\n게슈탈트 심리학에 대한 설명으로 옳은 것은? ① 부분 요소의 합이 곧 전체라고 본다 ② 집단화 원리는 후천적 경험과 학습으로 형성된다 ③ 집단화 원리는 타고난 것이며, 하향 처리보다 상향 처리를 더 강조한다 ④ 전경–배경 관계는 고정되어 주의를 어디에 두어도 바뀌지 않는다\n{/quiz}\n{answer}\n'''③'''. ①은 구조주의 입장(게슈탈트는 \"그 이상\"). ②는 \"타고난 것\"과 반대. ④ 전경–배경은 '''가역적'''이고 주의에 따라 바뀐다(p.29).\n{/answer}\n\n{analogy}\n게슈탈트는 '''점묘화'''다. 가까이서 보면 색 점(부분)밖에 없는데 한 발 물러서면 공원의 일요일 오후(전체)가 보인다. 점을 아무리 세어도 \"일요일 오후\"는 나오지 않는다 — 그게 \"부분의 합 이상\". 그리고 이 '''물러서서 보는 능력'''은 미술 수업을 들어서가 아니라 원래 갖고 태어난다는 게 게슈탈트의 주장(→ 상향).\n{/analogy}\n\n== 관련 문서 ==\n* [[전경-배경]] · [[집단화]] — 게슈탈트의 형태 지각 원리\n* [[구조주의]] — 대비되는 입장 (서막)\n* [[상향 처리]] — 교수 강조 함정\n\n근거: 4장 p.28 (+ p.29–31)"
 },
 "전경-배경": {
  "title": "전경-배경 (Figure-Ground)",
  "category": [
   "4장 감각과 지각",
   "용어"
  ],
  "body": "'''전경-배경 구분'''은 지각이 가장 먼저 하는 일 — 무엇이 \"대상\"이고 무엇이 \"바탕\"인지 가르는 것이다. [[게슈탈트 심리학]]이 제시한 형태 지각의 주요 요소 중 첫째이고, 관계가 '''뒤집힐 수 있다'''(가역적)는 점이 핵심이다. ⭐⭐⭐\n\n{def}\n'''설명''': 지각의 1차 과제로, 대상(전경)을 배경으로부터 분리하는 것. 전경-배경 관계는 바뀔 수 있으며, 주의를 어디에 기울이냐에 따라 변화 (4장 p.29)\n'''명칭''': 전경-배경 구분 (Figure-Ground)\n'''사례형''': 흑백 그림을 보다가 처음엔 가운데 흰 잔이 보였는데, 검은 부분에 주의를 옮기자 마주 보는 두 사람의 옆얼굴이 보였다.\n{/def}\n\n[[img:L4-29.png|p.29 가역적 전경과 배경 예시 — 검은 두 옆얼굴이 마주 보는 것인가, 가운데 흰 잔인가|medium]]\n\n== 슬라이드 내용 (p.29) ==\n* 지각의 '''1차 과제'''는 대상(전경)을 배경으로부터 분리.\n* 전경-배경 관계는 '''바뀔 수 있음''' — 주의를 어디에 기울이냐에 따라 변화.\n* '''시각 외에 청각'''에서도 동일한 원리 적용 가능 — 배경음에서 상대방의 말소리를 구분해 내는 것.\n\n교수 (🎙 9/22 1:21:07~1:23:04): 하얀 잔 / 마주 보는 두 얼굴. 청각의 예로 앞서(2장) 소개한 [[칵테일 파티 효과]]를 다시 언급.\n\n[[anim:gestalt_grouping|첫 장면의 꽃병↔두 얼굴 반전에서, 같은 그림의 어느 쪽이 \"전경\"이 되는지 주의 위치에 따라 바뀌는 것을 볼 것]]\n\n== 전경 vs 배경 ==\n{| class=\"table\"\n! || 전경 (figure) || 배경 (ground)\n|-\n| 지각 || 형태를 가진 \"대상\" || 형태 없이 뒤로 물러난 \"바탕\"\n|-\n| 위치감 || 앞으로 튀어나와 보임 || 뒤로 이어져 보임\n|-\n| 고정? || 아니다 — 주의에 따라 '''역전''' ||\n|-\n| 청각 예 || 대화 상대의 목소리 || 파티장 소음 ([[칵테일 파티 효과]])\n|}\n\n{analogy}\n전경-배경은 '''무대 조명'''이다. 핀 조명이 비추는 배우가 전경, 어둠 속 무대 장치가 배경. 조명 감독(주의)이 핀 조명을 옮기면 방금까지 배경이던 소품이 주인공이 된다. 무대 위의 물건은 하나도 안 바뀌었다.\n{/analogy}\n\n{warn}\n\"전경-배경 관계는 '''고정'''되어 주의를 어디에 두어도 바뀌지 않는다\" → bank 오답 보기(4장 p.28–30). 정답은 '''가역적'''.\n{/warn}\n\n== 관련 문서 ==\n* [[게슈탈트 심리학]] — 상위 이론\n* [[집단화]] — 다음 단계 (분리된 전경을 조직화)\n* [[칵테일 파티 효과]] — 청각의 전경-배경\n\n근거: 4장 p.29"
 },

  "body": "'''집단화'''는 배경에서 분리해 낸 전경 조각들을 \"의미 있는 덩어리\"로 묶는 게슈탈트의 조직화 원리다. 4장에서는 '''근접성·연속성·폐쇄''' 세 가지만 나온다(\"집단화의 세 원리\").세 이름 모두 단답형 후보이고, '''오륜기 = 연속성'''은 bank 객관식 정답이다. ⭐⭐⭐\n\n{def}\n'''설명''': 배경에서 분리된 전경을 의미 있는 형태로 조직화. 색깔·움직임 같은 기본 감각에 질서와 형태를 부여하는 것 (4장 p.30)\n'''명칭''': 집단화 (Grouping)\n{/def}\n\n[[img:L4-30.png|p.30 집단화의 세 가지 원리 — (a) 근접성: 세로선 6개가 3쌍으로 (b) 연속성: 곡선과 직선이 교차해도 매끈한 두 선으로 (c) 폐쇄: 끊긴 원 조각들 사이로 흰 삼각형|medium]]\n\n=== 근접성 ===\n{def}\n'''설명''': 가까이 있는 사물을 묶어서 지각 (4장 p.30)\n'''명칭''': [[집단화|근접성]] (Proximity)\n'''사례형''': 같은 간격이 아니라 둘씩 붙여 놓은 세로선 6개를 보면 \"선 6개\"가 아니라 \"세 쌍\"으로 보인다(교수 예: 젓가락 3세트).\n{/def}\n\n=== 연속성 ===\n{def}\n'''설명''': 부드럽게 연속된 패턴을 하나로 지각 (4장 p.30)\n'''명칭''': [[집단화|연속성]] (Continuity)\n'''사례형''': 올림픽 오륜기의 겹친 부분을 조각조각 나누지 않고 부드럽게 이어진 다섯 개의 원으로 본다.\n{/def}\n\n=== 폐쇄 ===\n{def}\n'''설명''': 완전한 형태 구성을 위해 끊어진 부분을 메꿈 (4장 p.30)\n'''명칭''': [[집단화|폐쇄]] (Closure)\n'''사례형''': 한쪽이 파인 원 세 개를 적당히 배치하면, 그려지지 않은 흰 삼각형이 원 위에 놓여 있는 것처럼 보인다.\n{/def}\n\n[[anim:gestalt_grouping|전경-배경(꽃병 ↔ 마주 보는 두 얼굴) → 근접성(같은 간격의 점 12개가 가로줄 세 묶음으로 모임) → 연속성(교차하는 물결 곡선과 직선 — 꺾인 네 조각이 아니라 이어진 두 선으로 지각) → 폐쇄(끊어진 호 네 개를 빈틈을 메꿔 원으로)를 차례로 보고, 각 장면의 자막 명칭을 따라 말해 볼 것]]\n\n== 세 원리 비교 ==\n{| class=\"table\"\n! 원리 || 묶는 기준 || 슬라이드 그림 || 교수 예시 (🎙 9/22 1:24:10)\n|-\n| [[집단화|근접성]] || '''거리'''가 가깝다 || 선 6개 → 3쌍 || 젓가락 3세트\n|-\n| [[집단화|연속성]] || '''매끄럽게 이어진다''' || 곡선+직선 교차 || '''올림픽 오륜기'''\n|-\n| [[집단화|폐쇄]] || '''빈틈을 메운다''' || 흰 삼각형 || 흰 삼각형\n|}\n\n* 색깔·움직임 같은 기본 요소는 '''즉각적이고 자동적으로''' 처리(Treisman, 1987)되고, 집단화는 그 기본 감각에 질서와 형태를 부여한다.\n* 집단화 원리는 '''유아들도''' 사용(Gallace & Spence, 2011). 게슈탈트 원리는 '''내재된, 타고난 것'''(Wertheimer, 1912) → 교수가 강조한 \"'''상향 처리''' 쪽\" 근거.\n\n[[img:L4-31.png|p.31 집단화 사진 — 목조 집 골격과 남자. 기둥의 앞뒤 관계가 불가능한 곳이 여럿인데, 집단화가 자동으로 \"보정\"해서 처음엔 이상함을 못 느낀다|medium]]\n\n{quiz}\n올림픽 오륜기를 볼 때 겹친 부분을 조각조각 나누지 않고 다섯 개의 원으로 지각한다. 가장 직접적으로 작용한 집단화 원리는? ① 연속성 ② 근접성 ③ 폐쇄 ④ 전경–배경 구분\n{/quiz}\n{answer}\n'''① 연속성'''. ③ 폐쇄는 '''끊어진 틈을 메우는''' 것인데 오륜기에는 메울 틈이 없다 — 헷갈리기 쉬운 오답. ④는 집단화가 아니라 그 '''이전''' 단계(대상과 배경 분리).\n{/answer}\n\n{analogy}\n집단화는 '''단톡방 자동 분류'''다. 같은 시간대에 몰려 온 메시지는 한 대화로 묶고(근접성), 답장 화살표로 이어진 메시지는 한 스레드로 보고(연속성), 중간에 몇 개 빠져 있어도 \"아 이 얘기였구나\" 하고 채운다(폐쇄). 이 분류 규칙은 설정에서 켠 게 아니라 '''기본 탑재'''다.\n{/analogy}\n\n{exam}\n통합요약 단답형 출제 예상: \"가까이 있는 사물을 묶어서 지각하는 원리 → '''근접성'''\", \"끊어진 부분을 메워 완전한 형태로 지각하는 원리 → '''폐쇄'''\". 그리고 \"게슈탈트 원리는 타고난 것 = 상향 처리 쪽\"(교수 강조 함정).\n{/exam}\n\n== 관련 문서 ==\n* [[게슈탈트 심리학]] — 상위 이론\n* [[전경-배경]] — 집단화 이전 단계\n* [[상향 처리]]\n\n근거: 4장 p.30–31"
 },
 "역투사의 문제": {
  "title": "역투사의 문제 (Inverse Projection Problem)",
  "category": [
   "4장 감각과 지각",
   "용어"
  ],
  "body": "'''역투사의 문제'''는 망막에 맺힌 '''2차원''' 상 하나를 만들어 낼 수 있는 '''3차원''' 물체가 여러 개라서, 뇌가 \"진짜 원인\"을 하나로 확정할 수 없다는 문제다. 시각 자극이 본질적으로 '''모호'''하다는 것, 그래서 지각에 보정과 추론이 필요하다는 것을 보여 준다. 통합요약 단답형 출제 예상. ⭐⭐⭐\n\n{def}\n'''설명''': 망막에 상을 투영한 물체는 단일 근원이 아닌, 여러 가지 가능성이 존재할 수 있다는 문제 (4장 p.32)\n'''명칭''': 역투사의 문제 (Inverse projection problem)\n'''사례형''': 바닥에 비친 삼각형 그림자 하나만 보고는, 그 위의 물체가 삼각기둥인지 원뿔인지 삼각뿔인지 알 수 없다.\n{/def}\n\n[[img:L4-32.png|p.32 위: 3차원 착시 현상 예시(도로 위 그림이 입체처럼 보임) / 아래: 삼각기둥·원뿔·삼각뿔이 모두 같은 삼각형 그림자를 만든다|medium]]\n\n== 투사와 역투사 ==\n<pre class=\"ascii\">\n   투사 (세계 → 눈)                     역투사 (눈 → 뇌의 추론)\n   3D 물체 ──→ 2D 망막 상               2D 망막 상 ──→ 3D 물체 = ?\n   삼각기둥 ┐                                         ┌ 삼각기둥?\n   원뿔     ├──→  △  (모두 같은 그림자)   △  ──→    ├ 원뿔?\n   삼각뿔   ┘                                         └ 삼각뿔?\n              정보가 줄어든다(3D→2D)            답이 여러 개 → \"문제\"\n<\/pre>\n\n== 슬라이드 내용 (p.32) ==\n* 망막에 맺히는 상을 통해 3차원 정보의 지각이 가능하다.\n* 그러나 망막에 맺힌 상은 '''2차원'''의 상.\n* '''여러 보정 작업'''을 거쳐서 3차원 정보를 지각할 수 있게 되는 것.\n* 망막에 상을 투영한 물체는 단일 근원이 아닌, 여러 가능성 → '''역투사의 문제'''.\n\n교수 (🎙 9/22 1:31:46~1:34:38): 삼각형 그림자 → 삼각기둥·원뿔·삼각뿔. 시각 자극은 본질적으로 모호하고, '''컴퓨터 인식 시스템'''이 오류가 잦은 이유이기도 하다. 사람은 이 문제를 [[깊이 지각]] 단서들([[양안 단서]], [[단안 단서]])로 푼다.\n\n{analogy}\n역투사의 문제는 '''그림자극 맞히기'''다. 손으로 만든 개 그림자, 진짜 개 그림자, 개 모양 종이 인형 그림자가 스크린에서는 똑같다. 스크린(망막)만 보고 \"진짜 개다\"라고 단정할 수 없으니, 관객은 다른 힌트(움직임, 크기, 배경)를 동원해 추리한다.\n{/analogy}\n\n{tip}\n\"역투사\"의 \"역(逆)\"은 '''거꾸로''' — 눈에서 세계 쪽으로 거꾸로 추론한다는 뜻이다. 이름만 보고 \"투사를 반대로 하는 문제\"라고 떠올리면 된다.\n{/tip}\n\n== 관련 문서 ==\n* [[깊이 지각]] — 역투사 문제를 푸는 단서들\n* [[모양 항등성]] — 망막 상이 바뀌어도 같은 사물로 보는 능력\n* [[게슈탈트 심리학]]\n\n근거: 4장 p.32"
 },
 "깊이 지각": {
  "title": "깊이 지각 (Depth Perception)",
  "category": [
   "4장 감각과 지각",
   "이론"
  ],
  "body": "'''깊이 지각'''은 2차원 망막 상에서 3차원 거리 정보를 뽑아내는 능력이다. 4장 p.33–36 은 ① 이 능력이 '''선천적'''이라는 증거(시각 절벽)와 ② 그 재료인 '''[[양안 단서]] 2개 + [[단안 단서]] 5개'''를 다룬다. 교수가 \"구분해 두라\"고 직접 말한 파트. ⭐⭐⭐\n\n{def}\n'''설명''': 망막에 맺힌 2차원 상으로부터 3차원(거리) 정보를 지각하는 것. 6~14개월 유아도 시각 절벽을 지각할 수 있어 선천성이 시사됨 (4장 p.33)\n'''명칭''': 깊이 지각 (Depth perception)\n{/def}\n\n=== 시각 절벽 ===\n{def}\n'''설명''': 유리판 아래로 바닥이 뚝 떨어지는 것처럼 보이게 만든 장치. 기어 다니기 시작한 6~14개월 유아가 엄마가 불러도 건너려 하지 않아 깊이 지각의 선천성을 보여 준 실험 (깁슨 & 워크, 1960; 4장 p.33)\n'''명칭''': [[깊이 지각|시각 절벽]] (Visual cliff)\n{/def}\n\n[[img:L4-33.png|p.33 유아의 시각 절벽 실험(깁슨 & 워크, 1960) — 유리판 아래 체크무늬 바닥이 꺼진 쪽에서 아기가 멈추고, 반대편에서 엄마가 부른다|medium]]\n\n== 실험 카드: 시각 절벽 ==\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 연구자(연도) || 깁슨 & 워크 (1960)\n|-\n| 질문 || 깊이 지각은 타고나는가, 배우는가?\n|-\n| 절차 || 두꺼운 유리판 한쪽 아래는 바로 체크무늬 바닥, 다른 쪽은 한참 아래 바닥(절벽처럼 보임). 유아를 가운데 두고 엄마가 절벽 쪽에서 부른다\n|-\n| 결과 || '''6~14개월''' 유아가 절벽 쪽으로 건너지 않음. 기어 다니기 시작한 유아는 시기와 무관하게 높이를 조심(Adolph et al., 2014). '''대부분의 동물 새끼'''도 건너지 않음\n|-\n| 결론 || 깊이 지각은 '''선천적''' 경향 — '''생존과 관련된 기제'''\n|-\n| 함정 || 대상은 성인이 아니라 '''유아'''. \"학습된 능력임을 보였다\"·\"엄마가 부르면 항상 건넜다\"·\"생후 며칠 된 신생아가 기어 다니며 회피\" 모두 오답\n|}\n\n<pre class=\"ascii\">\n   [엄마] \"이리 와~\"\n   ═══════════════════════════  ← 유리판 (실제로는 평평)\n   ▓▓▓▓▓▓▓▓▓▓▓▓│                 [아기] ▓▓▓▓▓▓▓▓▓▓▓\n               │  (깊어 보임)          얕은 쪽\n               ▓▓▓▓▓▓▓▓▓▓▓▓▓\n   결과: 아기는 \"절벽\" 앞에서 멈춘다 → 깊이를 이미 지각하고 있다\n<\/pre>\n\n교수 (🎙 9/22 1:34:38~1:39:20): 영상 시청. 영아 대상 실험이라 요즘이면 [[기관 생명 윤리 위원회|연구 승인]]이 매우 어려웠을 것. 3장 [[감각 운동 단계]] 시기와 연결.\n\n== 깊이 단서 ==\n{| class=\"table\"\n! [[양안 단서]] (두 눈 필요) — 2개 || [[단안 단서]] (한 눈으로 가능) — 5개\n|-\n| [[망막 부등]] — 두 망막 상의 차이, 클수록 가깝다 || 중첩 · 상대적 운동 · 상대적 높이\n|-\n| [[양안 단서|수렴]] — 두 눈의 내각, 가까울수록 크다 || 선형 조망 · 상대적 크기\n|}\n\n[[anim:binocular_cues|두 눈과 물체를 위에서 본 그림. 물체가 다가오면 망막 부등과 수렴이 함께 커지는 것을 보고, 한 눈을 감으면 왜 볼펜 맞추기가 어려운지 확인할 것]]\n\n{exam}\n교수 (🎙 9/22 1:47:42): \"'''양안 단서랑 단안 단서의 유형을 잘 구분을 해두시는 게 좋고요.'''\" 통합요약 §0-1 4장 교수 강조. 거리감 지각에서 가장 핵심적인 것은 양안 단서(망막 부등).\n{/exam}\n\n{analogy}\n깊이 지각은 '''3D 영화관'''이다. 스크린은 평평한 2D 인데 3D 안경(두 눈에 서로 다른 상 = 양안 단서)을 쓰면 튀어나온다. 안경을 벗어도 원근감이 완전히 사라지진 않는 건, 화면 안의 소실점·크기·가림(단안 단서)이 여전히 깊이를 말해 주기 때문이다.\n{/analogy}\n\n== 관련 문서 ==\n* [[양안 단서]] · [[망막 부등]] · [[단안 단서]]\n* [[역투사의 문제]] — 깊이 지각이 풀어야 하는 문제\n* [[감각 운동 단계]] — 시각 절벽 시기의 발달 단계 (3장)\n\n근거: 4장 p.33–36"
 },

  "body": "'''양안 단서'''는 '''두 눈을 모두 써야만''' 얻을 수 있는 깊이 단서다. 4장에 나오는 것은 딱 두 개 — [[망막 부등]]과 '''수렴'''. 나머지 다섯 개는 전부 [[단안 단서]]다. 이 2:5 분류가 교수가 \"구분해 두라\"고 한 그것. ⭐⭐⭐\n\n{def}\n'''설명''': 양안(두 눈) 사용에 의존하는 깊이 단서. 각 망막이 받아들이는 상에는 차이가 존재 (4장 p.34)\n'''명칭''': 양안 단서 (Binocular cue)\n'''사례형''': 볼펜 두 자루의 끝을 맞추는 과제가 두 눈을 뜨면 쉽고 한 눈을 감으면 어렵다.\n{/def}\n\n[[img:L4-34.png|p.34 양안 단서 효과의 예시-볼펜 맞추기. 아래 도식: 가까운 물체를 볼 때 왼쪽·오른쪽 눈의 시선이 모이며 생기는 각(수렴)|medium]]\n\n== 두 가지 양안 단서 ==\n{| class=\"table\"\n! 단서 || 정의 (p.34) || 거리와의 관계\n|-\n| '''[[망막 부등]]''' (Retinal disparity) || 두 망막의 이미지에 차이를 계산하여 깊이 정보 지각 || 차이가 '''클수록 가깝다'''\n|-\n| '''수렴''' (Convergence) || 가까운 사물에 초점을 맞추고 있는 두 눈의 '''내각''' || 가까울수록 시선을 모으려고 눈이 '''많이 움직인다'''(내각↑)\n|}\n\n=== 수렴 ===\n{def}\n'''설명''': 가까운 사물에 초점을 맞추고 있는 두 눈의 내각. 물체가 가까워질수록 시선을 모으기 위해 눈이 많이 움직임 (4장 p.34)\n'''명칭''': [[양안 단서|수렴]] (Convergence)\n'''사례형''': 손가락을 코끝으로 천천히 가져오면 두 눈이 점점 안쪽으로 몰리는 것이 느껴진다.\n{/def}\n\n[[anim:binocular_cues|물체가 가까워질 때 ① 두 망막 상 위치 차이(망막 부등)와 ② 두 시선의 내각(수렴)이 '''동시에''' 커지는 것을 보고, 마지막 한 눈 볼펜 맞추기 실패 장면까지 볼 것]]\n\n== 양안 단서 vs 단안 단서 ==\n{| class=\"table\"\n! || 양안 단서 || [[단안 단서]]\n|-\n| 필요한 눈 || '''두 눈''' || 한 눈으로도 가능\n|-\n| 개수 (4장) || '''2개''' || '''5개'''\n|-\n| 목록 || [[망막 부등]], 수렴 || 중첩, 상대적 운동, 상대적 높이, 선형 조망, 상대적 크기\n|-\n| 한 눈 감으면 || 사용 불가 → 볼펜 맞추기 실패 || 여전히 사용 가능\n|-\n| 그림·사진에서 || 못 씀 (평면) || 화가가 쓰는 원근법이 대부분 여기\n|}\n\n{exam}\n\"다음 중 '''단안 단서에 해당하지 않는''' 것은? ① 중첩 ② 상대적 운동 ③ 선형 조망 ④ 수렴\" → '''④ 수렴'''(양안). bank ch4 객관식. 교수 (🎙 9/22 1:47:42): \"양안 단서랑 단안 단서의 유형을 잘 구분을 해두시는 게 좋고요.\"\n{/exam}\n\n{warn}\n\"선형 조망\"의 설명에도 \"평행선이 한 점으로 '''수렴'''\"이라는 단어가 나온다. 이건 단서 이름이 아니라 설명 속 동사다. 단서로서의 '''수렴'''(두 눈의 내각)은 '''양안''' 단서, 선형 조망은 '''단안''' 단서.\n{/warn}\n\n{analogy}\n양안 단서는 '''측량 기사의 삼각 측량'''이다. 두 지점(두 눈)에서 같은 목표를 바라보고, 두 시선이 이루는 각(수렴)과 두 사진의 어긋남(망막 부등)으로 거리를 계산한다. 측량 장비 하나를 치우면(한 눈 감기) 삼각형이 안 만들어져서 계산이 안 된다.\n{/analogy}\n\n== 관련 문서 ==\n* [[망막 부등]] — 양안 단서의 대표 유형\n* [[단안 단서]] — 대비 대상\n* [[깊이 지각]]\n\n근거: 4장 p.34"
 },
 "망막 부등": {
  "title": "망막 부등 (Retinal Disparity)",
  "category": [
   "4장 감각과 지각",
   "용어"
  ],
  "body": "'''망막 부등'''은 왼눈과 오른눈의 망막에 맺힌 상이 '''서로 조금 다르다'''는 점을 이용해 거리를 계산하는 [[양안 단서]]다. 규칙은 하나: '''차이가 클수록 가깝다'''. bank 단답형 정답이고 통합요약 출제 예상 목록에도 있다. ⭐⭐⭐\n\n{def}\n'''설명''': 양안 단서의 한 유형으로, 두 망막의 이미지에 차이를 계산하여 깊이 정보를 지각(차이가 클수록 가까이 있는 사물) (4장 p.34)\n'''명칭''': 망막 부등 (Retinal disparity)\n'''사례형''': 볼펜 두 자루 끝 맞추기는 두 눈을 뜨면 쉽지만 한 눈을 감으면 어렵다. 좌·우 눈이 받아들이는 상의 차이를 계산하여, 그 차이가 클수록 대상이 가깝다고 판단하는 깊이 단서.\n{/def}\n\n[[img:L4-34.png|p.34 양안 단서 효과의 예시 — 볼펜 끝 맞추기. 두 눈이면 쉽고 한 눈이면 빗나간다|medium]]\n\n== 직접 해 보기 ==\n<pre class=\"ascii\">\n  손가락을 눈앞 20cm 에 세우고 왼눈·오른눈을 번갈아 감아 본다\n     왼눈만:   |   ·         오른눈만:        · |      → 손가락이 크게 \"점프\"\n  손가락을 팔 끝(60cm)으로 옮겨 다시 해 본다\n     왼눈만:    | ·          오른눈만:       · |       → 점프가 작다\n  ⇒ 두 상의 차이(부등)가 클수록 가깝다\n<\/pre>\n\n[[anim:binocular_cues|물체가 다가올수록 왼쪽·오른쪽 망막 위 점의 위치 차이가 벌어지는 부분에 집중할 것 — 그 차이가 망막 부등]]\n\n== 망막 부등 vs 수렴 ==\n{| class=\"table\"\n! || 망막 부등 || [[양안 단서|수렴]]\n|-\n| 무엇을 재나 || 두 망막 '''상의 차이''' || 두 눈 '''시선의 내각'''\n|-\n| 가까울수록 || 차이 '''↑''' || 내각 '''↑''' (눈이 많이 모임)\n|-\n| 공통점 || 둘 다 '''양안''' 단서 ||\n|}\n교수: 거리감 지각에서 가장 핵심적인 것은 양안 단서인 '''망막 부등''' (🎙 9/22 1:39:20).\n\n{analogy}\n망막 부등은 '''스테레오 카메라'''(듀얼 렌즈 폰의 인물 모드)다. 살짝 떨어진 두 렌즈로 같은 장면을 찍으면 가까운 물체일수록 두 사진에서 위치가 많이 어긋난다. 폰은 그 어긋남으로 배경과 인물을 분리해 배경을 흐리게 만든다 — 뇌도 같은 계산을 한다.\n{/analogy}\n\n{warn}\n방향 함정: \"차이가 '''작을수록''' 가깝다\"는 틀림. 그리고 망막 부등을 [[단안 단서]]라고 쓴 보기도 틀림 — \"망막\" 앞에 \"두\"가 숨어 있다고 기억할 것.\n{/warn}\n\n== 관련 문서 ==\n* [[양안 단서]] — 상위 분류, 수렴 포함\n* [[깊이 지각]]\n* [[단안 단서]] — 대비 대상\n\n근거: 4장 p.34"
 },
 "단안 단서": {
  "title": "단안 단서 (Monocular Cue)",
  "category": [
   "4장 감각과 지각",
   "용어"
  ],
  "body": "'''단안 단서'''는 '''한 눈만으로도''' 쓸 수 있는 깊이 단서다. 4장에는 다섯 개 — '''중첩, 상대적 운동, 상대적 높이, 선형 조망, 상대적 크기'''. 사진과 그림에서 원근감이 느껴지는 것도 이 단서들 덕분이다. 슬라이드 그림에 1~5 번호가 붙어 있으니 번호째 외우면 편하다. ⭐⭐⭐\n\n{def}\n'''설명''': 각 눈이 독자적으로 가용할 수 있는 깊이 단서 (4장 p.35–36)\n'''명칭''': 단안 단서 (Monocular cue)\n{/def}\n\n[[img:L4-35.png|p.35 단안 단서의 예시 1–3 — ① 중첩: 앞 사슴이 뒤 사슴을 가림 ② 상대적 운동: 기차 창밖 풍경 ③ 상대적 높이: 화면 위쪽 형태가 더 멀어 보임|medium]]\n\n[[img:L4-36.png|p.36 단안 단서의 예시 4–5 — ④ 선형 조망: 한 점으로 모이는 도로 ⑤ 상대적 크기: 가까운 큰 사람과 먼 작은 사람|medium]]\n\n=== 중첩 ===\n{def}\n'''설명''': 한 대상이 다른 대상을 부분적으로 가리면, 가리고 있는 대상을 더 가까운 것으로 지각 (4장 p.35)\n'''명칭''': [[단안 단서|중첩]] (Interposition)\n{/def}\n\n=== 상대적 운동 ===\n{def}\n'''설명''': 정지된 물체도 우리가 움직임에 따라 움직이며, 가까운 물체일수록 더 빨리 움직임 (4장 p.35)\n'''명칭''': [[단안 단서|상대적 운동]] (Relative motion)\n'''사례형''': 버스 창밖으로 보면 가드레일은 휙휙 지나가고 멀리 있는 산은 천천히 움직인다.\n{/def}\n\n=== 상대적 높이 ===\n{def}\n'''설명''': 더 높은 물체를 더 멀리 있다고 지각 (4장 p.35)\n'''명칭''': [[단안 단서|상대적 높이]] (Relative height)\n{/def}\n\n=== 선형 조망 ===\n{def}\n'''설명''': 평행선은 거리가 멀어짐에 따라 한 점으로 수렴. 수렴 정도가 클수록 지각된 거리도 증가 (4장 p.36)\n'''명칭''': [[단안 단서|선형 조망]] (Linear perspective)\n{/def}\n\n=== 상대적 크기 ===\n{def}\n'''설명''': 두 대상이 비슷한 크기라면, 더 작은 망막 상을 멀리 있는 것으로 지각 (4장 p.36)\n'''명칭''': [[단안 단서|상대적 크기]] (Relative size)\n{/def}\n\n== 다섯 단서 한 표 ==\n{| class=\"table\"\n! # || 단서 || 더 '''가깝다'''고 판단하는 쪽 || 더 '''멀다'''고 판단하는 쪽\n|-\n| 1 || 중첩 || '''가리는''' 쪽 || 가려진 쪽\n|-\n| 2 || 상대적 운동 || '''빨리''' 움직이는 쪽 || 천천히 움직이는 쪽\n|-\n| 3 || 상대적 높이 || 낮은 쪽 || '''높은''' 쪽\n|-\n| 4 || 선형 조망 || 평행선 간격이 넓은 쪽 || 한 점으로 '''수렴'''하는 쪽\n|-\n| 5 || 상대적 크기 || 망막 상이 큰 쪽 || 망막 상이 '''작은''' 쪽 (비슷한 크기일 때)\n|}\n\n== 단안 단서 vs 양안 단서 ==\n{| class=\"table\"\n! || 단안 단서 || [[양안 단서]]\n|-\n| 개수 || '''5개''' || '''2개''' ([[망막 부등]], 수렴)\n|-\n| 한 눈 감으면 || 그대로 사용 || 사용 불가\n|-\n| 사진·그림에서 || 사용 가능 || 불가능\n|}\n\n{exam}\n교수 (🎙 9/22 1:47:42): \"양안 단서랑 단안 단서의 유형을 잘 구분을 해두시는 게 좋고요.\" 통합요약: \"상대적 크기·높이·중첩은 '''단안'''.\" \"단안 단서가 '''아닌''' 것\" → '''수렴'''.\n{/exam}\n\n{analogy}\n단안 단서는 '''화가의 원근법 도구 상자'''다. 캔버스는 평평하니 두 눈 트릭(양안)은 못 쓴다. 대신 앞의 나무가 뒤의 집을 가리게 그리고(중첩), 먼 산은 화면 위쪽에(상대적 높이), 길은 소실점으로 모이게(선형 조망), 먼 사람은 작게(상대적 크기) 그린다. 영화 카메라가 옆으로 움직이면 가까운 나무가 휙 지나가는 것(상대적 운동)까지 더하면 도구 다섯 개 완성.\n{/analogy}\n\n{warn}\n'''수렴''' 함정: 선형 조망 설명 속 \"한 점으로 수렴\"은 단안 단서의 '''설명'''일 뿐이고, 단서 이름으로서의 수렴은 '''양안''' 단서다.\n{/warn}\n\n== 관련 문서 ==\n* [[양안 단서]] · [[망막 부등]] — 대비 대상\n* [[깊이 지각]]\n* [[4장 감각과 지각|움직임 지각]] — p.37, 크기와 거리의 상호작용\n\n근거: 4장 p.35–36"
 },

   "용어"
  ],
  "body": "'''모양 항등성'''은 보는 각도가 바뀌어 망막에 맺히는 모양이 달라져도 '''같은 사물'''로 지각하는 능력이다. 사람에겐 너무 당연해서 능력인 줄도 모르지만, 컴퓨터는 이걸 잘 못 한다 — 교수의 \"안면 인식 45도\" 예시. 통합요약 단답형 출제 예상. ⭐⭐⭐\n\n{def}\n'''설명''': 움직임에 따라 투영되는 모양이 바뀌어도 이전과 동일하게 지각하는 특성 (4장 p.38)\n'''명칭''': 모양 항등성 (Shape constancy)\n'''사례형''': 문이 열리면서 망막에 맺히는 상은 직사각형 → 사다리꼴 → 가는 띠로 바뀌지만, 우리는 계속 \"직사각형 문\"으로 본다.\n{/def}\n\n[[img:L4-38.png|p.38 움직임과 모양 항등성 — 닫힌 문, 반쯤 열린 문, 거의 다 열린 문. 망막 상의 모양은 달라도 같은 문|medium]]\n\n== 슬라이드 내용 (p.38) ==\n* '''움직임'''은 대상에 대한 '''관점의 변화'''를 유도한다.\n* 관점이 변화함에도 사람은 '''동일한 사물로서''' 지각 가능.\n* '''컴퓨터'''의 경우 각도 변화에 따른 동일 대상 판단 능력이 '''매우 떨어짐'''(O'Toole et al., 2007; Simonyan et al., 2013).\n* ⇒ 지각 과정이 단순한 사물의 투영이 아닌, '''감각 정보의 재조직화'''임을 시사.\n\n교수 (🎙 9/22 1:50:28~1:56:04): 출국 심사·은행 앱 '''안면 인식'''은 정면 사진에선 잘 되지만 '''45도만 돌려도''' 동일 인물로 판단하지 못한다 → 그래서 \"카메라를 정면으로 봐 주세요\"라고 한다. 사람은 이런 보정 능력을 선천적·경험적으로 갖췄다.\n\n<pre class=\"ascii\">\n   망막 상:   ┌──┐      ┌─╲        │╲\n              │  │  →   │  │   →   │ │      (모양이 계속 바뀜)\n              └──┘      └─╱        │╱\n   지각:      \"문\"      \"문\"       \"문\"     ← 모양 항등성\n   컴퓨터:    \"문\"      \"???\"      \"막대기?\" ← 각도 변화에 약함\n<\/pre>\n\n{analogy}\n모양 항등성은 '''친구 얼굴을 옆모습으로도 알아보는 것'''이다. 증명사진(정면)과 옆모습은 픽셀로 따지면 완전히 다른 그림인데, 우리는 1초 만에 \"어, 민수다\" 한다. 반면 휴대폰 얼굴 인식은 고개를 살짝만 돌려도 잠금이 안 풀린다 — 그게 교수의 45도 예시.\n{/analogy}\n\n{tip}\n같은 p.37–38 묶음(\"움직임과 모양 항등성\")에 있는 [[4장 감각과 지각|달 착시]]는 크기와 거리의 상호작용으로 생기는 '''착시'''이고, 모양 항등성은 관점이 바뀌어도 '''같게''' 보는 능력이다. 하나는 실패, 하나는 성공 사례.\n{/tip}\n\n== 관련 문서 ==\n* [[역투사의 문제]] — 2D 상만으로는 원인 물체가 하나로 정해지지 않는 문제\n* [[깊이 지각]]\n* [[4장 감각과 지각]] — 움직임 지각·달 착시(p.37)\n\n근거: 4장 p.37–38"
 },
 "맥거크 효과": {
  "title": "맥거크 효과 (McGurk Effect)",
  "category": [
   "4장 감각과 지각",
   "실험"
  ],
  "body": "'''맥거크 효과'''는 눈으로 본 입모양과 귀로 들은 소리가 서로 다를 때, 둘 중 어느 것도 아닌 '''제3의 소리'''를 듣게 되는 현상이다. \"듣기\"가 귀만의 일이 아니라는 것, 즉 감각끼리 서로 영향을 주는 '''감각 상호작용'''의 대표 예. bank 단답형 정답. ⭐⭐⭐\n\n{def}\n'''설명''': 입모양과 소리의 언어 정보가 다를 경우, 전혀 다른 제3의 언어 정보를 지각하는 현상 (4장 p.39, McGurk & MacDonald, 1976)\n'''명칭''': 맥거크 효과 (McGurk effect)\n'''사례형''': 화면 속 사람이 입으로는 「가」를 말하는 장면을 보면서 스피커로는 「바」를 들었더니, 「다」라는 소리를 들었다고 보고했다.\n{/def}\n\n[[img:L4-39.png|p.39 맥거크 효과의 예시(McGurk & MacDonald, 1976) — 입술 그림 「가」, 스피커 「바」, 사람에게 들리는 것은 「다」|medium]]\n\n== 실험 카드 ==\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 연구자(연도) || McGurk & MacDonald (1976)\n|-\n| 질문 || 시각 정보(입모양)가 청각 지각에 영향을 주는가?\n|-\n| 절차 || 「가」 입모양 영상 + 「바」 소리를 동시에 제시\n|-\n| 결과 || 「가」도 「바」도 아닌 '''「다」'''를 들음\n|-\n| 결론 || 사람의 '''입술 모양이 청각 정보 처리에 영향''' → 시각–청각 상호작용. '''독순술'''도 하나의 듣기 형태\n|-\n| 함정 || 들린 것은 입모양(가)도 소리(바)도 아닌 '''제3의''' 소리\n|}\n\n<pre class=\"ascii\">\n   눈:  입모양 「가」 ──┐\n                        ├──→ 뇌가 통합 ──→ 지각: 「다」   (제3의 소리)\n   귀:  소리   「바」 ──┘\n<\/pre>\n\n=== 감각 상호작용 ===\n{def}\n'''설명''': 한 감각이 다른 감각의 지각에 영향을 주는 것. 미각–후각 상호작용(코막힘 → 맛이 덜함), 시각–청각 상호작용(맥거크 효과) (4장 p.39)\n'''명칭''': [[맥거크 효과|감각 상호작용]] (Sensory interaction)\n{/def}\n\n{| class=\"table\"\n! 유형 || 예시 (p.39) || 교수 보충 (🎙 9/22 1:56:04)\n|-\n| '''미각–후각''' || 비염·감기로 코가 막히면 맛이 덜하게 느껴짐 || 와인 소믈리에가 시음 전에 향부터 맡는 이유\n|-\n| '''시각–청각''' || '''맥거크 효과''' || \"가\" + \"바\" → \"다\", 독순술\n|}\n\n{analogy}\n맥거크 효과는 '''더빙이 어긋난 외화'''를 볼 때의 위화감을 극단까지 밀어붙인 것이다. 보통은 \"입이랑 소리가 안 맞네\" 하고 끝나지만, 어긋남이 딱 적당하면 뇌가 둘을 억지로 합쳐서 '''아무도 말하지 않은 소리'''를 만들어 낸다. 뇌는 \"둘 중 하나\"를 고르는 심판이 아니라 \"둘을 섞는\" 믹서다.\n{/analogy}\n\n{tip}\n[[공감각]]과 구분: 맥거크 효과는 '''두 감각 입력이 실제로 다 들어왔을 때''' 서로 섞이는 것, 공감각은 '''한 감각만''' 들어왔는데 다른 감각 경험이 '''덤으로''' 생기는 것(숫자 4 → 빨강).\n{/tip}\n\n== 관련 문서 ==\n* [[체화 인지]] · [[공감각]] — 같은 \"감각 상호작용\" 단원(p.40)\n* [[하향 처리]]\n* [[4장 감각과 지각]]\n\n근거: 4장 p.39"
 },
 "체화 인지": {
  "title": "체화 인지 (Embodied Cognition)",
  "category": [
   "4장 감각과 지각",
   "이론"
  ],
  "body": "'''체화 인지'''는 몸이 느끼는 감각(따뜻함, 딱딱함)이 생각과 판단(호감, 엄정함)에 스며드는 현상이다. 슬라이드는 이것을 \"'''신체 감각의 두뇌 회로와 인지 두뇌 회로의 상호작용'''\"이라고 정의한다. '''따뜻한 커피''' 사례가 bank 객관식 정답. ⭐⭐⭐\n\n{def}\n'''설명''': 신체 감각의 두뇌 회로와 인지 두뇌 회로의 상호작용 (4장 p.40)\n'''명칭''': 체화 인지 (Embodied cognition)\n'''사례형''': 엘리베이터에서 잠깐 따뜻한 커피를 들어 준 참가자가 차가운 커피를 들었던 참가자보다 상대를 더 우호적으로 평가했다.\n{/def}\n\n[[img:L4-40.png|p.40 체화 인지의 양상 — 신체 감각 회로(빨강)와 인지 회로(파랑)가 화살표로 서로 이어지고, 손에 닿은 감각이 판단(?)으로 넘어간다|medium]]\n\n== 슬라이드 예시 (p.40) ==\n{| class=\"table\"\n! 신체 감각 || → 인지·판단 || 연구\n|-\n| 신체적 '''따뜻함''' || 사회적 '''따뜻함''' (더 우호적 평가) || Fetterman et al. (2018)\n|-\n| '''단단한''' 의자에 앉음 || 더 '''엄정한''' 평가 || Schaefer et al. (2018)\n|}\n\n교수 (🎙 9/22 1:58:05): 따뜻한 커피를 잠깐 들고 있던 사람이 더 우호적으로 평가한 엘리베이터 실험 예시.\n\n{joke}\n교수 농담: 면접 합격률을 높이려면 면접관 방에 '''히터를 틀고 푹신한 의자'''를 놓으면 되는 거 아닐까? (심리학적으로는 그럴듯하지만 실험 윤리상 권장하지 않는다.)\n{/joke}\n\n{quiz}\n엘리베이터에서 참가자에게 잠깐 따뜻한 커피를 들어 달라고 부탁한 뒤 설문을 했더니 차가운 커피를 든 참가자보다 더 우호적으로 평가했다. 가장 잘 설명하는 개념은? ① 베버의 법칙 ② 체화 인지 ③ 신호 탐지 이론 ④ 공감각\n{/quiz}\n{answer}\n'''② 체화 인지'''. ① [[베버의 법칙]]은 차이 지각의 비율 법칙, ③ [[신호 탐지 이론]]은 민감도·기준선으로 탐지를 설명하는 이론이라 무관. ④ [[공감각]]은 한 감각이 '''다른 감각 경험'''(숫자 → 색)을 일으키는 것이지, 감각이 '''태도 평가'''를 바꾸는 것이 아니다.\n{/answer}\n\n== 체화 인지 vs 공감각 ==\n{| class=\"table\"\n! || 체화 인지 || [[공감각]]\n|-\n| 무엇이 연결되나 || 신체 감각 → '''인지·판단''' || 한 감각 → '''다른 감각''' 경험\n|-\n| 예 || 따뜻한 컵 → 따뜻한 사람 평가 || 숫자 4 → 빨간색\n|-\n| 슬라이드 || p.40 첫 항목 || p.40 둘째 항목\n|}\n\n{analogy}\n체화 인지는 '''배고플 때 장 보기'''와 같다. 위장(몸)이 비어 있으면 머리(판단)는 \"이것도 필요하고 저것도 필요해\" 하고 카트를 채운다. 몸 상태가 생각 속으로 몰래 '''스며든다'''.\n{/analogy}\n\n== 관련 문서 ==\n* [[공감각]] — 같은 슬라이드의 다른 감각 상호작용\n* [[맥거크 효과]] — 감각 상호작용(p.39)\n* [[맥락·동기·정서와 지각]] — 몸 상태(피곤·갈증)가 지각을 바꾸는 p.16\n\n근거: 4장 p.40"
 },
 "공감각": {
  "title": "공감각 (Synesthesia)",
  "category": [
   "4장 감각과 지각",
   "용어"
  ],
  "body": "'''공감각'''은 하나의 감각을 경험할 때 '''다른 감각 경험이 함께''' 일어나는 현상이다. 숫자를 보면 색이 보이고, 소리를 들으면 맛이 느껴지는 식. 문학 시간의 \"푸른 종소리\" 같은 '''표현 기법'''이 아니라, 실제로 그렇게 '''지각'''하는 사람들이 있다는 게 연구 대상이다. ⭐⭐\n\n{def}\n'''설명''': 하나의 감각을 경험할 때 다른 감각 경험을 겪음 (4장 p.40, Ranzini & Girelli, 2019)\n'''명칭''': 공감각 (Synesthesia)\n'''사례형''': 어떤 사람은 흑백으로 인쇄된 숫자 4를 볼 때마다 빨간색을, 7을 볼 때마다 노란색을 경험한다.\n{/def}\n\n[[img:L4-40.png|p.40 감각 상호작용 — 체화 인지(그림)와 함께 \"공감각 경험\"이 같은 슬라이드에 나온다|small]]\n\n교수 (🎙 9/22 1:58:05~2:02:54): 숫자 4는 빨강, 7은 노랑처럼 지각하는 예. 문학의 공감각적 표현과 비슷해 보이지만 여기서는 '''실제 지각''' 현상.\n\n== 헷갈리는 짝 ==\n{| class=\"table\"\n! || 공감각 || [[맥거크 효과]] || [[체화 인지]]\n|-\n| 입력 || 감각 '''하나''' || 감각 '''둘'''(시각+청각)이 어긋남 || 신체 감각\n|-\n| 결과 || 다른 감각 경험이 '''덤으로''' || 제3의 소리로 '''융합''' || 판단·태도가 바뀜\n|-\n| 예 || 숫자 4 → 빨강 || 가 + 바 → 다 || 따뜻한 컵 → 우호적 평가\n|}\n\n{analogy}\n공감각은 '''음악 앱의 비주얼라이저'''가 머릿속에 기본 탑재된 것이다. 보통 사람은 노래를 들으면 소리만 듣지만, 공감각자는 노래를 틀면 화면에 색과 무늬가 저절로 떠오른다. 끄는 버튼은 없다.\n{/analogy}\n\n{warn}\nbank 함정 (4장 p.40): \"따뜻한 커피 → 우호적 평가\"를 공감각이라고 고르면 오답 — 그건 [[체화 인지]]. 공감각은 감각이 '''다른 감각'''을 부르는 것이지, '''평가'''를 바꾸는 것이 아니다.\n{/warn}\n\n== 관련 문서 ==\n* [[체화 인지]] — 같은 슬라이드\n* [[맥거크 효과]] — 감각 상호작용\n* [[초감각지각]] — 다음 슬라이드, \"감각 없는 지각\" 주장\n\n근거: 4장 p.40"
 },
 "초감각지각": {
  "title": "초감각지각 (Extrasensory Perception, ESP)",
  "category": [
   "4장 감각과 지각",

  ],
  "body": "'''초감각지각'''(ESP)은 '''감각 입력 없이''' 지각이 일어날 수 있다는 주장이다. 4장 내내 \"지각은 감각 입력에서 출발한다\"고 해 놓고 마지막 두 장에서 그 전제를 정면으로 뒤집는 주장을 꺼내, 과학적으로 어떻게 따져야 하는지를 보여 준다. 통합요약 단답형 출제 예상. ⭐⭐\n\n{def}\n'''설명''': 감각 입력 없이 지각이 일어날 수 있다는 주장. 텔레파시, 천리안, 예지 등을 포함 (4장 p.41)\n'''명칭''': 초감각지각 (Extrasensory perception, ESP)\n{/def}\n\n[[img:L4-41.png|p.41 초감각지각의 종류와 초심리학의 예시 — 천리안(지구 위의 눈), 예지(수정 구슬), 독심술(머리 사이의 신호)|medium]]\n\n== 슬라이드 내용 (p.41) ==\n* 감각 입력 없이 지각이 일어날 수 있다는 주장 — '''텔레파시, 천리안, 예지''' 등.\n* '''기억 회상을 통한 감각 경험과는 구분'''된다. (기억은 과거 감각 입력이 있었다.)\n* '''미국인의 절반'''은 ESP 가 가능하고 심령술을 믿음(Gecewicz, 2018; Kim et al., 2015).\n* '''의외로 과학적 검증이 시도되고 있는 영역'''(Cardena, 2018).\n\n교수 (🎙 9/22 2:02:54): 지각은 감각 입력이 있어야 성립한다는 심리학의 기본 전제를 뒤집는 주장. 기억 회상과도, (과거 경험에 기반한) 예측과도 다르다.\n\n== 예지몽과 린드버그 유괴사건 (p.42) ==\n{| class=\"table\"\n! 단계 || 인원 || 의미\n|-\n| 유괴당한 아동의 꿈을 꾸었다고 제보 || '''1300명''' || (Murray & Wheeler, 1937)\n|-\n| 그중 아이의 '''죽음'''과 관련된 꿈 || '''5%''' || 대부분은 빗나감\n|-\n| '''위치'''까지 맞춘 경우 || '''단 4명''' ||\n|-\n| 결론 || — || 수많은 표본 중에 '''우연의 일치'''는 발생할 수밖에 없음\n|}\n\n<pre class=\"ascii\">\n  1300명 ──→ 죽음 관련 꿈 5% (≈65명) ──→ 위치까지 적중 4명\n  \"4명이 맞혔다!\"  vs  \"1300명 중 4명이면 우연으로도 충분하다\"\n                       ↑ 1장 [[무선적 사건에서의 질서 지각]]과 같은 논리\n<\/pre>\n\n마지막 질문 \"그래서 심리학자 = 독심술사? 독심술을 과학적이고 실험적으로 검증해 볼 수 있는 방법은?\"은 열린 질문이다. 교수는 첫 수업의 \"심리학자는 독심술사?\" 질문이 왜 불쾌한 질문인지 다시 언급했다.\n\n{analogy}\n린드버그 사건의 4명은 '''로또 1등 당첨자'''와 같다. 매주 수백만 명이 사면 매주 누군가는 당첨된다. 당첨자에게 \"숫자를 예지했냐\"고 묻는 건 의미가 없다 — 표본이 크면 놀라운 우연은 '''반드시''' 나온다.\n{/analogy}\n\n{tip}\n1장의 [[무선적 사건에서의 질서 지각]]·[[착각 상관]]과 묶어서 기억하자. \"몇 명이 맞혔다\"는 사례 대신 '''전체 시도 대비 적중률'''을 봐야 한다는 비판적 사고의 연장이다.\n{/tip}\n\n== 관련 문서 ==\n* [[무선적 사건에서의 질서 지각]] — 우연의 일치를 패턴으로 착각 (1장)\n* [[감각과 지각의 구분]] — ESP 가 뒤집으려는 전제\n* [[공감각]]\n\n근거: 4장 p.41–42"
 },
