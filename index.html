  "body": "'''전조작 단계'''(preoperational stage)는 [[피아제의 인지 발달 단계]]의 두 번째 단계로, '''2~6세''' 아동이 해당한다. 단어·이미지로 대상을 '''표상'''할 수는 있지만 '''심적 조작'''(행동 과정을 머릿속으로 상상하거나 되돌리기)은 아직 못 한다. 그 결과가 [[보존 개념]]의 결여와 [[자기중심성]]이고, 한편으로 '''가상 놀이'''가 시작된다.\n\n{def}\n'''설명''': 대상을 단어나 이미지로 표상할 수 있으나 심적 조작(행동의 과정을 상상하거나 역전시키는 등)은 할 수 없는, 2~6세 아동이 해당하는 피아제의 인지 발달 단계 (3장 p.12)\n'''명칭''': [[전조작 단계]] (Preoperational Stage)\n{/def}\n\n{analogy}\n전조작기 아이의 머리는 '''사진은 잘 찍는데 되감기 버튼이 없는 카메라'''다. \"물을 길쭉한 컵에 옮겼다\"는 장면은 찍지만, 머릿속에서 \"다시 원래 컵에 부으면?\"을 재생(역전)하지 못한다. 그래서 지금 보이는 '''수면 높이'''만 믿는다.\n{/analogy}\n\n[[img:L3-12.png|3장 p.12 — 전조작 단계: 같은 양의 우유를 다른 모양의 컵에 옮기는 보존 과제|medium]]\n\n== 특징 (p.12, p.16) ==\n{| class=\"table\"\n! 특징 || 슬라이드 설명 || 예 (🎙 9/15)\n|-\n| 표상 ✓ || 대상을 단어나 이미지로 표상 || \"멍멍이\"라는 말로 강아지를 떠올림\n|-\n| 심적 조작 ✗ || 행동의 과정을 상상하거나 역전시키는 등은 할 수 없음 || —\n|-\n| [[보존 개념]] 결여 || 아직 '''시각'''에 초점을 맞추고 있어서 발생 || 좁고 긴 컵의 우유가 더 많다고 답함\n|-\n| [[자기중심성]] || 타인의 상황을 이해하지 못하고 자신과 동일할 것이라 여김 || 숨바꼭질에서 '''자기 눈만''' 가리고 숨었다고 생각\n|-\n| 직관 || 논리적 추리보다는 직관을 사용 (p.16) || —\n|-\n| 가상 놀이 ✓ || 3세 이후 (p.13) || 모형 방 → 실제 방\n|}\n\n=== 가상 놀이 ===\n[[img:L3-13.png|3장 p.13 — 가상 놀이: 모형에서 인형 숨기는 것을 관찰 → 실제 방에서 인형을 찾음|medium]]\n\n{def}\n'''설명''': 3세 이후 아동이 실제 방을 본뜬 모형에서 특정 장소에 숨긴 인형을 나중에 실제 방에서도 동일한 방식으로 찾는 것처럼, 모형이 방을 상징한다는 점을 이해하는 놀이 수행 (3장 p.13, 주디 들로치, 1987)\n'''명칭''': '''가상 놀이''' (Pretend Play)\n{/def}\n* 의미: 아동의 '''상징적 사고'''가 이른 시기에 발달함을 보여 주는 근거 → 피아제가 '''간과한''' 부분(사고가 더 이른 시기에 발현, p.16).\n\n{warn}\nbank 함정: \"구체적 조작 단계 — 자기중심성이 두드러지고 보존 개념이 결여\" ✗. 자기중심성·보존 결여·가상 놀이는 모두 '''전조작'''. 구체적 조작은 보존을 '''이해하기 시작'''하는 단계다.\n{/warn}\n\n{quiz}\n다섯 살 민수는 똑같은 양의 주스 중 하나를 좁고 긴 컵에 옮기는 걸 직접 보고도, 수면이 높은 쪽이 더 많다고 답했다. ① 구체적 조작·보존 결여 ② 전조작·보존 결여 ③ 감각 운동·낯가림 미발달 ④ 형식적 조작·추상 추리 결여 — 정답은?\n{/quiz}\n{answer}\n'''②'''. 2~6세 전조작 단계는 시각(수면 높이)에 초점을 맞춰 보존 개념이 결여된다.\n{/answer}\n\n== 관련 문서 ==\n* [[보존 개념]] · [[자기중심성]] — 전조작기의 두 한계\n* [[피아제의 인지 발달 단계]] — 이전 [[감각 운동 단계]], 다음 [[구체적 조작 단계]]\n* [[마음 이론]] — 4~5세, 자기중심성을 넘어 타인의 잘못된 믿음을 이해\n\n근거: 3장 p.12–13, p.16"
 },
 "보존 개념": {
  "title": "보존 개념 (Conservation)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''보존 개념'''(Conservation)은 '''모양·배열이 바뀌어도 양(부피·개수·질량)은 그대로'''라는 이해다. [[전조작 단계]](2~6세)에는 '''결여'''되어 있고, [[구체적 조작 단계]](7~11세)에서 '''이해하기 시작'''한다. \"보존이 있다/없다\"로 두 단계를 가르는 시험 단골 기준이다.\n\n{def}\n'''설명''': 눈에 보이는 형태가 바뀌어도 양은 같다는 이해. 전조작 단계 아동은 아직 시각에 초점을 맞추고 있어서 이것이 결여되어 있고, 구체적 조작 단계부터 구체적 물질에 대해 이해하기 시작한다 (3장 p.12, p.14)\n'''명칭''': [[보존 개념]] (Conservation)\n{/def}\n\n{analogy}\n보존 개념이 없는 아이는 '''피자를 8조각으로 자르면 4조각일 때보다 피자가 더 많다'''고 믿는 손님이다. 조각 수(보이는 것)가 늘었으니까. 보존 개념이 생기면 \"자르는 방식이 바뀌었을 뿐 피자는 한 판\"이라는 걸 안다 — 머릿속에서 조각을 다시 붙여 보는(역전) 심적 조작이 가능해졌기 때문이다.\n{/analogy}\n\n[[img:L3-12.png|3장 p.12 — 같은 양의 우유를 좁고 긴 컵에 옮겨 붓는 보존 과제|medium]]\n\n[[img:L3-14.png|3장 p.14 — 구체적 조작 단계: 수량 보존·형태 변형 과제를 이해하기 시작|medium]]\n\n== 단계별 보존 ==\n{| class=\"table\"\n! 단계 || 연령 || 보존 || 이유\n|-\n| [[전조작 단계]] || 2~6세 || '''결여''' || 아직 '''시각'''에 초점, 심적 조작(역전) 불가\n|-\n| [[구체적 조작 단계]] || 7~11세 || '''이해 시작''' || 구체적 물질에 대한 심적 조작 가능, 수학적 변형 이해\n|}\n\n🎙 9/15 교수 예시: 같은 양의 우유를 폭이 좁고 긴 컵에 옮기면 전조작기 아이는 '''수면 높이가 높은 쪽'''이 더 많다고 답한다.\n\n[[sim:piaget_stages]]\n\n{warn}\nbank 객관식(주스 컵, 5세 민수)의 오답 보기:\n* \"'''구체적 조작''' 단계의 아동으로, 보존 개념이 결여\" ✗ — 구체적 조작은 보존 '''이해 시작'''\n* \"형식적 조작 단계, 추상적 추리 결여\" ✗ — 12세 이후\n* \"감각 운동 단계, 낯가림 미발달\" ✗ — 출생~2세\n정답: '''전조작 단계 + 보존 개념 결여'''.\n{/warn}\n\n{quiz}\n일곱 살 지우가 동그랗게 뭉친 찰흙을 길게 늘인 것을 보고 \"모양만 바뀌었지 양은 똑같아. 다시 뭉치면 되잖아.\"라고 했다. 지우의 단계는?\n{/quiz}\n{answer}\n'''구체적 조작 단계'''(7~11세) — 보존 개념을 이해하고 심적 조작(역전)이 가능하다.\n{/answer}\n\n== 관련 문서 ==\n* [[전조작 단계]] · [[구체적 조작 단계]]\n* [[피아제의 인지 발달 단계]]\n* [[자기중심성]] — 전조작기의 또 다른 한계\n\n근거: 3장 p.12, p.14, p.16"
 },
 "자기중심성": {
  "title": "자기중심성 (Egocentrism)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''자기중심성'''(egocentrism)은 '''타인의 상황을 아직 이해할 수 없어서, 타인도 자신과 동일할 것이라고 여기는 경향성'''이다. [[전조작 단계]](2~6세)의 대표 특징인데, 3장 p.27에서 '''청소년기'''(10대 초기)에도 다른 모양으로 '''지속'''된다고 다시 나온다. \"이기적\"이라는 도덕적 뜻이 아니라 '''관점을 바꾸지 못하는''' 인지적 한계다.\n\n{def}\n'''설명''': 타인의 상황을 아직 이해할 수 없으며, 자신과 동일할 것이라고 여기는 경향성 (3장 p.12)\n'''명칭''': [[자기중심성]] (Egocentrism)\n{/def}\n\n{def}\n'''설명(사례형)''': 네 살 아이가 숨바꼭질을 하면서 자기 눈만 손으로 가리고는 \"나 안 보이지?\"라고 한다. (🎙 9/15 교수 예시)\n'''명칭''': [[자기중심성]]\n{/def}\n\n{analogy}\n자기중심성은 '''내 화면 공유가 켜져 있다고 착각하는 화상회의 참가자'''다. \"여기 보시면~\" 하고 자기 화면을 가리키지만 상대는 그 화면을 못 본다. 내 눈에 보이면 남 눈에도 보일 거라 믿는 것 — 관점 전환이 아직 안 되는 상태다.\n{/analogy}\n\n[[img:L3-27.png|3장 p.27 — 청소년기의 인지 발달: 자기중심성이 지속되며 추리가 자신에게 집중(10대 초기)|medium]]\n\n== 두 시기의 자기중심성 ==\n{| class=\"table\"\n! || 아동기 자기중심성 || 청소년기 자기중심성\n|-\n| 시기 || [[전조작 단계]] 2~6세 (p.12) || 10대 초기 (p.27)\n|-\n| 모습 || 타인도 자신과 같은 것을 보고 생각한다고 여김 || 추리가 '''자신한테 집중''' — \"대부분의 사람에게 발생하는 일이 '''자신에게는 일어나지 않을 것'''\"이라는 믿음\n|-\n| 🎙 예 || 숨바꼭질에서 자기 눈만 가림 / 칸막이에 가려진 장난감을 상대도 볼 거라 생각 || —\n|-\n| 극복 단서 || 4~5세 [[마음 이론]] (타인의 잘못된 믿음 이해) || [[형식적 조작 단계]]의 추상적 사고\n|}\n\n{tip}\np.16 요약표 전조작 단계 칸: \"'''자기중심성, 가상놀이'''\". 시험에서 \"자기중심성\"을 보면 일단 '''전조작'''을 떠올리고, 문제에 \"청소년·10대 초기\"가 있으면 p.27로 간다.\n{/tip}\n\n{warn}\nbank 오답: \"'''구체적 조작''' 단계 — 자기중심성이 두드러짐\" ✗. 또 자기중심성 ≠ 이기심. \"남을 배려하지 않는 성격\"으로 풀면 틀린다.\n{/warn}\n\n{quiz}\n\"나는 담배를 피워도 폐암에 안 걸릴 거야, 그건 다른 사람 얘기지.\" — 3장에서 이 믿음을 설명하는 시기와 개념은?\n{/quiz}\n{answer}\n'''청소년기(10대 초기)의 자기중심성''' — 대부분의 사람에게 일어나는 일이 자신에게는 일어나지 않을 것이라는 믿음(3장 p.27).\n{/answer}\n\n== 관련 문서 ==\n* [[전조작 단계]] — 원래 자리\n* [[마음 이론]] — 타인의 관점 이해\n* [[형식적 조작 단계]] — 청소년기와 중첩\n\n근거: 3장 p.12, p.16, p.27"
 },
 "구체적 조작 단계": {
  "title": "구체적 조작 단계 (Concrete Operational Stage)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''구체적 조작 단계'''(Concrete operational stage)는 [[피아제의 인지 발달 단계]]의 세 번째 단계로, '''만 7~11세''' 아동이 해당한다. 드디어 '''심적 조작'''이 가능해져 '''구체적 물질'''에 대한 [[보존 개념|보존]]과 수학적 변형을 이해한다. 단, \"구체적\"이라는 이름처럼 '''눈앞의 실제 사물·사건'''에 한해서다 — 추상적·가설적 추리는 다음 단계의 몫.\n\n{def}\n'''설명''': 구체적 물질에 대한 보존 등을 이해하기 시작하고, 어떤 물질에 대한 심적 조작을 수행할 수 있게 되는, 만 7~11세 아동이 해당하는 피아제의 인지 발달 단계 (3장 p.14)\n'''명칭''': [[구체적 조작 단계]] (Concrete Operational Stage)\n{/def}\n\n{analogy}\n구체적 조작기 아이는 '''실물 레고로는 뭐든 조립하지만, 설명서 없는 \"상상 속 레고\" 문제는 못 푸는 엔지니어'''다. 눈앞의 블록을 뜯었다 붙였다(역전) 하며 \"개수는 그대로\"를 안다. 그런데 \"만약 블록이 투명하다면?\" 같은 가정 문제는 아직 어렵다 — 그건 [[형식적 조작 단계]]의 일.\n{/analogy}\n\n[[img:L3-14.png|3장 p.14 — 구체적 조작 단계: 수량 보존·형태 변형 과제를 이해하기 시작|medium]]\n\n== 슬라이드 내용 (p.14, p.16) ==\n* 구체적 물질에 대한 '''보존''' 등을 이해하기 시작.\n* 만 7~11세.\n* 어떤 물질에 대한 '''심적 조작'''을 수행할 수 있게 됨 → 이 단계부터 '''수학적 변형과 보존'''을 이해할 수 있다고 제안.\n* p.16 요약표: 구체적 사건에 대한 논리적 사고 및 수리적 연산 수행 / 발달 현상 = '''보존 개념, 수학적 변환'''.\n\n== 앞뒤 단계와 비교 ==\n{| class=\"table\"\n! || [[전조작 단계]] (2~6) || '''구체적 조작''' (7~11) || [[형식적 조작 단계]] (12~)\n|-\n| 심적 조작 || ✗ || ✓ (구체적 물질) || ✓ (추상·가설)\n|-\n| 보존 || 결여 || '''이해 시작''' || ✓\n|-\n| 사고 대상 || 직관·겉모습 || 구체적 사건 || 가설적 명제\n|}\n\n{warn}\n\"구체적 조작 단계 — 보존 개념 결여\" ✗, \"구체적 조작 단계 — 자기중심성이 두드러짐\" ✗ (둘 다 전조작). bank 객관식에서 '''가장 많이 쓰인 오답 짝'''이다.\n{/warn}\n\n{quiz}\n피아제 단계 중 \"보존 개념, 수학적 변환\"이 발달 현상으로 적힌 단계와 그 연령은?\n{/quiz}\n{answer}\n'''구체적 조작 단계''', 만 '''7~11세''' (3장 p.16).\n{/answer}\n\n== 관련 문서 ==\n* [[보존 개념]]\n* [[피아제의 인지 발달 단계]] — 이전 [[전조작 단계]], 다음 [[형식적 조작 단계]]\n\n근거: 3장 p.14, p.16"
 },

  "body": "'''형식적 조작 단계'''(Formal operational stage)는 [[피아제의 인지 발달 단계]]의 마지막 단계로, '''12세 이후'''에 해당한다. 상상과 상징을 비롯한 '''추상적 사고'''가 확장되고, 사고가 '''과학자처럼''' 진행된다 — 가설적 명제를 세우고 결론을 도출하며 체계적으로 추리한다. 3장 p.27에서 청소년기와 '''중첩'''된다고 다시 나오고, 콜버그 [[콜버그의 도덕성 발달 단계|도덕 추리]]의 기반이 된다.\n\n{def}\n'''설명''': 상상과 상징을 비롯한 추상적 사고의 확장이 이루어지고, 아동의 사고방식이 과학자처럼 진행되어 가설적 명제와 결론 도출, 체계적 추리를 수행하는 12세 이후의 피아제 인지 발달 단계 (3장 p.15)\n'''명칭''': [[형식적 조작 단계]] (Formal Operational Stage)\n{/def}\n\n{analogy}\n형식적 조작기는 '''\"만약에(if)\" 문을 쓸 수 있게 된 프로그래머'''다. 구체적 조작기는 눈앞의 변수값만 다루지만, 이제 \"만약 모든 학교에 반 친구가 있다면 → 철수는 학교에 다닌다 → 철수에게는 반 친구가 있다\"처럼 '''실제로 본 적 없는 경우'''를 가정하고 결론을 낸다(p.15 그림: 조건 명제 제시 → 전건의 사실 제시 → 결론 도출).\n{/analogy}\n\n[[img:L3-15.png|3장 p.15 — 형식적 조작 단계: ① 조건 명제 제시 ② 전건의 사실 제시 ③ 결론 도출|medium]]\n\n== 슬라이드 내용 (p.15, p.16, p.27) ==\n* 상상과 상징을 비롯한 '''추상적 사고'''의 확장. 12세 이후~.\n* 사고방식이 과학자처럼 진행 — '''가설적 명제와 결론 도출, 체계적 추리'''.\n* 7세 아동은 명제에 대한 추론을 수행할 수 없음(Suppes, 1982).\n* p.16: 추상적 추리, '''성숙한 도덕 추리 잠재성'''.\n* p.27 청소년기: 형식적 조작 단계와 청소년기는 '''중첩'''. 추상적 개념에 대한 사고 본격화 → '''이상적인 모습과 불완전한 현실을 비교''', 타인의 추리에서 '''모순이나 위선'''을 밝혀냄(도덕성 발달과 연관; 사진: 총기 개혁 시위).\n\n{| class=\"table\"\n! || [[구체적 조작 단계]] || [[형식적 조작 단계]]\n|-\n| 연령 || 7~11세 || 12세~성인\n|-\n| 사고 재료 || 구체적 물질·사건 || '''가설적 명제''', 추상 개념\n|-\n| 대표 현상 || 보존, 수학적 변환 || 추상적 추리, 성숙한 도덕 추리 잠재성\n|}\n\n{tip}\n🎙 9/15: 선악·진실/거짓 같은 '''추상 개념'''을 이해해야 도덕 추리가 가능하다 → 형식적 조작 단계의 능력이 도덕 추리의 기반. 그래서 3장은 이 단계 직후 [[콜버그의 도덕성 발달 단계|콜버그]]로 넘어간다.\n{/tip}\n\n{warn}\nbank 오답: \"'''감각 운동''' 단계 — 가설적 명제에서 결론을 도출\" ✗, \"형식적 조작 단계 — 출생부터 만 2세\" ✗.\n{/warn}\n\n== 관련 문서 ==\n* [[피아제의 인지 발달 단계]] — 이전 [[구체적 조작 단계]]\n* [[자기중심성]] — 청소년기에도 지속\n* [[콜버그의 도덕성 발달 단계]] — 도덕 추리의 인지적 기반\n\n근거: 3장 p.15–16, p.27"
 },
 "비고츠키": {
  "title": "레프 비고츠키 (Lev Vygotsky)",
  "category": [
   "3장 일생에 걸친 발달",
   "학자"
  ],
  "body": "'''레프 비고츠키'''(Lev Vygotsky)는 3장 p.17에서 '''피아제 이론에 대한 대안적 견해'''로 등장하는 학자다. 슬라이드 제목은 \"'''비고츠키의 사회적 아동'''\". 피아제가 아이를 혼자 세상을 실험하는 '''꼬마 과학자'''로 봤다면, 비고츠키는 아이를 '''어른과 대화하며 크는 사회적 존재'''로 봤다.\n\n{| class=\"table\"\n! 인물 카드 || \n|-\n| 이름(원어) || 레프 비고츠키 (Lev Vygotsky, 1896–1934)\n|-\n| 학파·분야 || 발달심리학 — 인지 발달의 '''사회적''' 접근\n|-\n| 핵심 주장 || 아동의 마음은 '''사회적 환경'''과의 상호작용을 통해 성장. 부모·교사가 새로운 어휘로 성장의 [[도약대]] 제공. 언어가 사고의 토대 → '''속내말'''\n|-\n| 슬라이드 위치 || 3장 p.17 \"피아제 이론에 대한 대안적 견해\"\n|-\n| 시험 포인트 || '''피아제 = 물리적 환경 / 비고츠키 = 사회적 환경''' (슬라이드에 두 단어만 노란 형광펜). 단답형: 도약대, 속내말\n|}\n\n{def}\n'''설명''': 아동의 마음은 사회적 환경과의 상호작용을 통해 성장하며, 부모와 교사가 새로운 어휘 제공을 통해 성장의 도약대를 제공한다고 본 학자 (\"사회적 아동\") (3장 p.17)\n'''명칭''': [[비고츠키]] (Lev Vygotsky)\n{/def}\n\n{analogy}\n피아제의 아이가 '''혼자 레고 상자를 뒤지는 독학자'''라면, 비고츠키의 아이는 '''사수가 붙은 신입사원'''이다. 사수(부모·교사)가 새 용어를 알려 주고 처음엔 옆에서 받쳐 주다가(도약대), 나중엔 신입이 그 말을 '''혼잣말로 중얼거리며'''(속내말) 혼자 일을 해낸다.\n{/analogy}\n\n[[img:L3-17.png|3장 p.17 — 피아제 이론(물리적) vs 비고츠키의 사회적 아동(사회적)|large]]\n\n== 피아제 vs 비고츠키 ==\n{| class=\"table\"\n! || [[피아제의 인지 발달 단계|피아제]] || '''비고츠키'''\n|-\n| 아동의 마음이 성장하는 경로 || '''물리적''' 환경과의 상호작용 || '''사회적''' 환경과의 상호작용\n|-\n| 발달의 핵심 || 물리적 대상/환경 변화에 대한 '''심적 조작''' 과정 || 부모·교사가 새로운 어휘 제공 → 성장의 '''도약대'''\n|-\n| 언어의 역할 || (강조하지 않음) || 언어가 '''사고의 토대''' → 내면화 → '''속내말'''로 문제 해결\n|}\n\n=== 속내말 ===\n{def}\n'''설명''': 언어가 사고의 토대를 제공하고, 아동이 이를 내면화하여 문제 해결에 사용하는 것 (비고츠키) (3장 p.17)\n'''명칭''': '''속내말''' (Inner Speech)\n{/def}\n예: 신발 끈을 묶는 아이가 \"토끼 귀 만들고… 한 바퀴 돌리고…\"라고 '''엄마에게 들은 말'''을 속으로(혹은 소리 내어) 중얼거리며 해낸다.\n\n{exam}\n🎙 9/15 47:37–48:32 교수 강조: \"피아제는 '''물리적''' 환경, 비고츠키는 '''사회적''' 환경을 중시한다.\" 통합요약 §0-1 3장 첫 줄.\n{/exam}\n\n{warn}\nbank 오답 보기(학자 바꿔치기):\n* \"'''피아제'''는 언어를 내면화한 속내말로 문제를 해결한다고 보았다\" ✗ → 비고츠키\n* \"'''비고츠키'''는 물리적 대상·환경 변화에 대한 심적 조작을 핵심으로 보았다\" ✗ → 피아제\n* \"'''피아제'''는 부모·교사가 제공하는 도약대가 발달의 원동력\" ✗ → 비고츠키\n{/warn}\n\n== 관련 문서 ==\n* [[도약대]] — 비고츠키의 핵심 명칭\n* [[피아제의 인지 발달 단계]] — 대비 대상\n* [[마음 이론]] — 사회적 상호작용이 부족하면 마음 이론도 미숙(같은 '사회성' 맥락)\n\n근거: 3장 p.17, 🎙 9/15"
 },
 "도약대": {
  "title": "도약대 (Scaffolding)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''도약대'''(scaffolding)는 [[비고츠키]]의 핵심 개념으로, '''부모와 교사가 새로운 어휘 제공 등을 통해 아동의 성장에 제공하는 발판'''이다. 정리본 노트 표현으로는 \"아동이 더 높은 수준의 사고로 발달할 때 '''일시적으로''' 제공하는 지지틀\". 영어 scaffolding 은 원래 '''공사장 비계'''(건물 올릴 때 세웠다가 다 지으면 떼어 내는 임시 발판)라는 뜻이다.\n\n{def}\n'''설명''': 부모와 교사가 새로운 어휘 제공을 통해 아동에게 제공하는 성장의 발판 — 아동이 높은 수준으로 발달하도록 일시적으로 제공하는 지지 (비고츠키) (3장 p.17)\n'''명칭''': [[도약대]] (Scaffolding)\n{/def}\n\n{def}\n'''설명(사례형)''': 처음 두발자전거를 배우는 아이의 뒤를 아빠가 잡아 주며 \"페달 밟아, 앞을 봐\"라고 말해 주다가, 아이가 균형을 잡기 시작하자 조금씩 손을 놓았다. 비고츠키 이론에서 아빠의 이런 일시적 지지는?\n'''명칭''': [[도약대]]\n{/def}\n\n{analogy}\n도약대는 '''자전거 보조 바퀴'''다. 혼자서는 못 타는 높이(수준)를 보조 바퀴 덕에 타 볼 수 있고, 실력이 붙으면 '''떼어 낸다'''. 영원히 붙어 있으면 도약대가 아니라 그냥 세발자전거다. 핵심은 \"'''일시적'''\"과 \"'''다른 사람이 준다'''(사회적)\".\n{/analogy}\n\n[[img:L3-17.png|3장 p.17 — \"부모와 교사는 새로운 어휘 제공을 통해 성장의 도약대를 제공\"|medium]]\n\n== 비고츠키 이론에서의 위치 ==\n{| class=\"table\"\n! 비고츠키 개념 || 내용 (p.17)\n|-\n| 사회적 아동 || 아동의 마음은 '''사회적 환경'''과의 상호작용으로 성장\n|-\n| '''도약대''' || 부모와 교사가 '''새로운 어휘''' 제공을 통해 성장의 도약대 제공\n|-\n| [[비고츠키|속내말]] || 언어가 사고의 토대 → 내면화 → 속내말(inner speech)로 문제 해결\n|}\n\n{tip}\n번역어 주의: 교재·다른 책은 scaffolding 을 '''비계''', '''발판''', '''비계 설정''' 등으로도 옮긴다. 이 수업 슬라이드·채점 기준 명칭은 '''도약대'''다(통합요약 단답형 후보 12번: \"도약대(scaffolding)\").\n{/tip}\n\n{warn}\n\"도약대는 피아제의 개념\" ✗ — 피아제는 '''물리적''' 환경과 심적 조작. 도약대는 '''사회적''' 환경을 강조한 '''비고츠키'''.\n{/warn}\n\n== 관련 문서 ==\n* [[비고츠키]] — 주인\n* [[피아제의 인지 발달 단계]] — 대비\n* [[관찰 학습]] — 5장, 타인(모델)을 통해 배우는 또 다른 사회적 학습\n\n근거: 3장 p.17 (+ 정리본 노트)"
 },

  "body": "'''마음 이론'''(Theory of Mind)은 '''감정·지각·사고·행동 등을 포함한, 타인과 자신의 심적 상태에 대한 사람들의 생각'''이다. 쉽게 말해 \"저 사람 머릿속엔 나와 '''다른''' 생각이 들어 있을 수 있다\"는 걸 아는 능력. '''4~5세'''를 기점으로 급격히 발전하며, 🎙 교수 표현으로 \"마음 이론이 발전을 해야만 비로소 '''공감·사회성'''이 시작된다\". ⭐ 3장 bank 단답형 정답.\n\n{def}\n'''설명''': 감정, 지각, 사고, 행동 등을 포함한 타인과 자신의 심적 상태에 대한 사람들의 생각. 타인의 심적 상태를 추론하는 능력과 밀접하며, 4~5세를 기점으로 급격히 발전 (3장 p.18)\n'''명칭''': [[마음 이론]] (Theory of Mind)\n{/def}\n\n{def}\n'''설명(사례형)''': 반창고 상자를 열어 보니 연필이 들어 있었다. \"이 상자를 처음 보는 친구는 안에 뭐가 있다고 할까?\"라고 묻자 3세 아동은 \"연필\", 4~5세 아동은 \"반창고\"라고 답했다. 타인이 잘못된 인식을 지닐 수 있음을 이해하는 이 능력은?\n'''명칭''': [[마음 이론]]\n{/def}\n\n{analogy}\n마음 이론은 '''머릿속에 \"다른 사람 시점\" 카메라를 하나 더 설치하는 것'''이다. 3세는 카메라가 하나라서 \"내가 아는 것 = 모두가 아는 것\". 4~5세가 되면 친구 머리 위에 카메라를 하나 더 달아 \"저 친구 카메라엔 상자 겉면(반창고)만 찍혔겠네\"를 계산한다. 스포일러를 피해 주는 배려도, 깜짝 파티도, 거짓말도 이 두 번째 카메라가 있어야 가능하다.\n{/analogy}\n\n[[img:L3-18.png|3장 p.18 — 젠킨스 & 애스팅턴(1996) 실험: ① 교사가 구급 상자를 보여 줌 ② 상자 안엔 연필이 들어 있음|medium]]\n\n== 슬라이드 내용 (p.18) ==\n* 정의: 감정·지각·사고·행동 등을 포함한 '''타인과 자신의 심적 상태에 대한 사람들의 생각'''.\n* 타인의 심적 상태를 '''추론'''하는 능력과 밀접.\n** '''4~5세'''를 기점으로 급격한 발전.\n** '''타인이 잘못된 인식을 지닐 수 있다'''는 사실을 이해.\n* 타인에 대한 이해와 공감의 시작점.\n** 소통의 기회가 부족한 아동은 마음 이론의 미숙을 보임(Peterson & Siegal, 1999). [노트] 예: 청각 문제가 있는 아동.\n\n=== 젠킨스 & 애스팅턴 실험 ===\n{| class=\"table\"\n! 실험 카드 || \n|-\n| 연구자(연도) || 젠킨스 & 애스팅턴 (1996)\n|-\n| 질문 || 아동은 몇 살부터 '''타인의 잘못된 믿음'''을 이해하는가?\n|-\n| 절차 || 반창고(구급) 상자를 보여 줌 → 열어 보니 '''연필''' → 닫고 \"처음 보는 다른 아이는 안에 뭐가 있다고 할까?\"\n|-\n| 결과 || '''3세: 연필''' / '''4~5세: 반창고'''\n|-\n| 결론 || 4~5세에 마음 이론이 급격히 발달 — 남은 내가 본 것을 못 봤으니 다르게 믿을 것을 이해\n|-\n| 함정 || 3세의 \"연필\"은 거짓말·오답이 아니라 '''자기가 아는 대로''' 답한 것(→ [[자기중심성]])\n|}\n\n<pre class=\"ascii\">\n [반창고 상자 보여 주기] → [열기: 안에 연필!] → [닫기]\n        │\n        └─ Q. \"처음 보는 친구는 안에 뭐가 있다고 할까?\"\n              3세   → \"연필\"    (내가 아는 것 = 남도 앎)\n              4~5세 → \"반창고\"  ('''[[마음 이론]]''': 남은 잘못 믿을 수 있음)\n<\/pre>\n\n== 다른 장과의 연결 ==\n* 5장 p.35: 마음 이론 = 타인에게 공감하고 심적 상태를 추론하는 능력, '''[[거울 뉴런]]에 의한 공감 기제에 기반'''.\n* 3장 p.26 [[자기 개념]] 거울 실험에서 🎙 교수가 마음 이론·거울 뉴런을 함께 언급.\n\n{exam}\n🎙 9/15 52:27: \"마음 이론이 하 발전을 해야만 비로소 타인에 대한 이해와 공감이 시작된다 … 사회성과 관련된 측면에서 굉장히 중요한 능력.\" 통합요약 교수 강조 \"마음 이론 → 사회성\".\n{/exam}\n\n{warn}\n나이 함정: 마음 이론의 급발달은 '''4~5세'''. 대상 영속성(6개월 이후), 자기 개념(15~18개월)과 섞어 내는 보기 주의. 또 3세 = 연필 / 4~5세 = 반창고 순서를 뒤집은 보기도 오답.\n{/warn}\n\n== 관련 문서 ==\n* [[거울 뉴런]] — 5장, 공감의 신경 기반\n* [[자기중심성]] — 마음 이론 이전 상태\n* [[자기 개념]] · [[애착]] — 같은 아동기 사회성 발달\n* [[3장 일생에 걸친 발달]] — p.18 절\n\n근거: 3장 p.18; 5장 p.35"
 },
 "애착": {
  "title": "애착 (Attachment)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''애착'''(attachment)은 '''타인과의 정서적 유대'''다. 3장 p.19–24 여섯 장에 걸쳐 애착의 시작(낯가림) → 원천(신체 접촉·친숙성) → 유형(안정/불안정) → 요인(기질+양육) → 중요성(기본 신뢰감) → 박탈의 영향이 차례로 나온다.\n\n{def}\n'''설명''': 타인과의 정서적 유대 (3장 p.19)\n'''명칭''': [[애착]] (Attachment)\n{/def}\n\n{analogy}\n애착은 아기와 부모 사이의 '''와이파이 연결'''이다. 처음엔 아무 공유기에나 붙지만(신생아), '''낯가림'''이 생기면 \"우리 집 공유기\"만 신뢰한다. 연결이 안정적이면(안정 애착) 멀리 나가 놀아도 돌아올 곳이 있다는 '''기본 신뢰감'''이 생기고, 신호가 들쭉날쭉하면(불안정 애착) 계속 신호를 확인하거나(불안) 아예 와이파이를 끄고 산다(회피). 공유기 자체가 없는 게(애착 박탈) 가장 위험하다.\n{/analogy}\n\n[[img:L3-19.png|3장 p.19 — 할로우의 대리모 실험(1971): 애착의 원천은 신체 접촉|medium]]\n\n== 애착의 흐름 (p.19–24) ==\n{| class=\"table\"\n! 쪽 || 주제 || 핵심 || 사전 문서\n|-\n| p.19 || 형성의 시작 || '''낯가림'''의 발달 = 유아와 부모 간 애착 형성의 시작 || (이 문서)\n|-\n| p.19 || 원천 ① 신체 접촉 || 가장 기본적 요소. 온기·부드러움 || [[할로우의 대리모 실험]]\n|-\n| p.19 || 원천 ② 친숙성 || 오리의 각인, '''결정적 시기''' || [[각인]]\n|-\n| p.20 || 애착 → 인지 발달 || 접촉을 통한 애정 표현 → 두뇌 발달·인지 능력 증폭. 성숙하면 애착이 부모 외 다른 사람으로 이동 || —\n|-\n| p.21 || 유형 || 안정 / 불안정. 차이는 '''부모의 적절한 반응''' || [[안정 애착과 불안정 애착]]\n|-\n| p.22 || 요인 || '''선천적 기질 + 양육 방식''', 감수성 훈련 || [[안정 애착과 불안정 애착]]\n|-\n| p.23 || 중요성 || 안정 애착 → 기본 신뢰감, 성인기 대인 관계·학업 성공 || [[기본 신뢰감]]\n|-\n| p.24 || 박탈 || 지능·두뇌 저하, ADHD (루마니아 아동) || (이 문서)\n|}\n\n=== 낯가림 ===\n{def}\n'''설명''': 익숙한 자극과 익숙하지 않은 자극을 구분하여 낯선 사람을 경계하는 반응으로, 그 발달이 유아와 부모 간 애착 형성의 시작이 되는 것 (감각 운동 단계의 발달 현상) (3장 p.16, p.19)\n'''명칭''': '''낯가림'''\n{/def}\n🎙 9/15: 낯가림은 [[감각 운동 단계]]에 [[대상 영속성|대상영속성]]과 함께 발달 → 익숙/비익숙 구분 → 부모와의 애착 형성의 시작점.\n\n=== 애착 박탈 ===\n[[img:L3-24.png|3장 p.24 — 차우셰스쿠의 아이들(루마니아 보육원)|medium]]\n\n{def}\n'''설명''': 애착이 박탈된 아동들이 지능 및 두뇌 발달의 저하, 비정상적 스트레스 반응, ADHD 등을 보이는 것 — 루마니아 아동 대상 연구에서 보고됨 (3장 p.24)\n'''명칭''': '''애착 박탈''' (Attachment Deprivation)\n{/def}\n* 루마니아 아동 연구(Bick et al., 2015; Kennedy et al., 2016) — 사진 \"차우셰스쿠의 아이들\".\n* 극단적 아동기 외상(가정 폭력 등)은 두뇌에 영향 → 화난 얼굴에 대한 '''위협 탐지 영역'''이 과하게 활성화(Graham et al., 2013). 🎙 그 영역 = [[편도체]].\n* 그러나 '''적절한 수준의 역경'''을 겪은 아동은 '''회복 탄력성'''이 높다(Ellis et al., 2017).\n\n{exam}\n🎙 9/15 1:09:28–1:17:54: \"불안정 애착보다 '''진짜 위험한 것은 애착이 박탈된 경우'''.\" 불안·회피 경향은 오히려 위험 탐지에 도움이 될 수도 있다(p.23) — 객관식 예외 포인트.\n{/exam}\n\n{warn}\n\"애착의 가장 기본적인 요소 = '''먹이(수유)'''\" ✗ → '''신체 접촉'''(할로우). 또 \"애착은 전적으로 선천적 기질로 결정\" ✗ → 기질 + 양육 방식 '''모두'''(p.22).\n{/warn}\n\n{info}\n교재의 '''에인스워스 낯선 상황 실험'''은 슬라이드·수업에 나오지 않는다. 애착 유형은 p.21·p.23의 슬라이드 정의(안정 / 불안정 = 불안·회피)로만 공부할 것.\n{/info}\n\n== 관련 문서 ==\n* [[할로우의 대리모 실험]] · [[각인]] — 애착의 두 원천\n* [[안정 애착과 불안정 애착]] · [[기본 신뢰감]]\n* [[권위적·권위주의적·허용적 양육]] — 다음 슬라이드(p.25)\n* [[편도체]] — 위협 탐지 영역\n\n근거: 3장 p.16, p.19–24"
 },
 "할로우의 대리모 실험": {
  "title": "할로우의 대리모 실험 (Harlow, 1971)",
  "category": [
   "3장 일생에 걸친 발달",
   "실험"
  ],
  "body": "'''할로우의 대리모 실험'''은 새끼 원숭이에게 '''우유가 나오는 철사 엄마'''와 '''우유는 없지만 부드러운 천 엄마'''를 주고 누구 곁에 있는지 본 실험이다. 결과는 천 엄마의 압승 — '''애착의 가장 기본적인 요소는 먹이가 아니라 신체 접촉'''(온기·부드러움)임을 보여 줬다. 슬라이드 표기 연도는 '''1971'''.\n\n{| class=\"table\"\n! 인물 카드 || \n|-\n| 이름(원어) || 해리 할로우 (Harry Harlow, 1905–1981)\n|-\n| 학파·분야 || 비교·발달심리학 (원숭이 애착 연구)\n|-\n| 핵심 업적 || 대리모 실험 — 애착의 원천은 '''신체 접촉'''\n|-\n| 슬라이드 표기 || \"할로우의 대리모 실험(1971)\" (3장 p.19)\n|-\n| 시험 포인트 || 원숭이는 '''담요(천)가 있는 쪽'''을 선호 / 철사 엄마에게는 '''배고플 때만''' (🎙)\n|}\n\n{def}\n'''설명''': 새끼 원숭이가 우유병이 달린 철사 대리모보다 천으로 만든 부드러운 대리모 쪽을 선호함으로써, 애착 형성의 가장 기본적인 요소가 신체 접촉임을 보여 준 실험 (3장 p.19)\n'''명칭''': [[할로우의 대리모 실험]] (Harlow, 1971)\n{/def}\n\n{analogy}\n할로우의 원숭이는 '''편의점 vs 엄마 품'''을 고른 셈이다. 철사 엄마는 '''24시 편의점''' — 배고프면 가서 우유만 사 먹고 바로 나온다. 천 엄마는 '''집''' — 먹을 건 없지만 하루 대부분을 거기서 보내고, 무서우면 거기로 달려간다. 사랑은 먹이 공급 계약이 아니라 '''포근함'''에서 시작된다는 것.\n{/analogy}\n\n[[img:L3-19.png|3장 p.19 — 할로우의 대리모 실험(1971): 새끼 원숭이가 천 대리모에 매달린 채 철사 대리모 쪽으로 몸을 뻗고 있다|medium]]\n\n== 실험 카드 ==\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 연구자(연도) || 할로우 (1971, 슬라이드 표기)\n|-\n| 질문 || 애착은 '''먹이'''(생존 욕구) 때문인가, '''접촉'''(온기·부드러움) 때문인가?\n|-\n| 절차 || 새끼 원숭이에게 두 대리모: ① '''철사''' 뼈대 + 우유병 ② '''천'''으로 감싼 푹신한 몸 + 우유병 없음\n|-\n| 가설(🎙) || 생존이 중요하니 철사 대리모 곁에 더 오래 있거나 비슷할 것\n|-\n| 결과 || 원숭이는 '''담요(천)가 있는 쪽'''을 선호. 철사 대리모에게는 '''진짜 배고플 때만''' 감 (🎙 9/15)\n|-\n| 결론 || 애착 형성의 가장 기본적인 요소는 '''신체 접촉''' — 그 과정의 '''온기, 부드러움'''이 주요 요인\n|-\n| 함정 || \"먹이를 주는 쪽에 애착\" ✗. 또 친숙성 기반 애착의 사례는 할로우가 아니라 오리의 [[각인]]\n|}\n\n<pre class=\"ascii\">\n   [철사 대리모 + 우유병]          [천 대리모 (우유 없음)]\n           │                              │\n   배고플 때만 잠깐 ───────▶  하루 대부분을 여기서 보냄\n                                          │\n                    결론: 애착의 원천 = '''신체 접촉'''(온기·부드러움)\n<\/pre>\n\n== 애착의 두 원천 비교 ==\n{| class=\"table\"\n! 원천 || 사례 || 사전 문서\n|-\n| '''신체 접촉''' (가장 기본) || 할로우의 대리모 실험 (원숭이) || (이 문서)\n|-\n| '''친숙성''' || 오리의 각인 — 결정적 시기 || [[각인]]\n|}\n\n{quiz}\n할로우 실험에서 새끼 원숭이가 철사 대리모에게 가는 경우는? 그리고 이 실험이 보여 준 애착의 원천은?\n{/quiz}\n{answer}\n'''배고플 때만''' 간다(🎙). 애착의 원천 = '''신체 접촉'''(온기·부드러움).\n{/answer}\n\n== 관련 문서 ==\n* [[애착]] — 상위 개념\n* [[각인]] — 또 다른 원천(친숙성)\n* [[안정 애착과 불안정 애착]]\n\n근거: 3장 p.19, 🎙 9/15"
 },
 "각인": {
  "title": "각인 (Imprinting)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''각인'''(imprinting)은 갓 부화한 새끼 오리가 '''처음 본 움직이는 대상을 어미처럼 따라다니는''' 현상으로, 3장에서는 '''친숙성 기반 애착'''의 사례로 나온다. 애착도 인지 기능처럼 '''결정적 시기'''(critical period)에 형성된다는 증거이기도 하다. ⭐ 3장 bank 단답형 정답.\n\n{def}\n'''설명''': 오리가 생애 초기에 처음 본 대상에게 애착을 형성하는 것으로, 친숙성 기반 애착의 사례 (3장 p.19)\n'''명칭''': [[각인]] (Imprinting)\n{/def}\n\n{def}\n'''설명(사례형)''': 알에서 갓 깨어난 새끼 오리는 처음 눈에 띈 움직이는 대상을 어미처럼 졸졸 따라다닌다. 신체 접촉이 아니라 친숙성에 기반해 애착이 형성되는 이 현상은?\n'''명칭''': [[각인]]\n{/def}\n\n{analogy}\n각인은 '''스마트폰 첫 부팅 때 등록한 지문'''이다. 처음 켰을 때(결정적 시기) 손가락을 대면 그게 '''주인'''으로 박힌다. 엄마 손이든 연구자 장화든, 그때 등록된 걸 계속 따라간다. 등록 기간을 놓치면 나중에 바꾸기 어렵다.\n{/analogy}\n\n[[img:L3-19.png|3장 p.19 — 애착의 원천: 신체 접촉(대리모 실험)과 친숙성(오리의 각인, 결정적 시기)|medium]]\n\n== 슬라이드 내용 (p.19) ==\n* 친숙성 역시 애착의 요인 중 하나.\n** 애착도 인지 기능과 유사하게 '''결정적 시기'''(critical period)에 형성.\n** '''오리의 각인'''(imprinting)이 친숙성 기반 애착 사례.\n\n=== 결정적 시기 ===\n{def}\n'''설명''': 애착이나 인지 기능 등이 형성되는, 발달 초기의 특정한 민감한 시기 (3장 p.19; p.2 노트 — 신경 가소성의 변화와 관련)\n'''명칭''': '''결정적 시기''' (Critical Period)\n{/def}\n[노트] 정리본은 p.2 에서 \"신경 가소성의 변화도 발달과 관련(결정적 시기)\"이라고 적었다 → 2장 [[신경 가소성]]과 연결.\n\n== 애착의 두 원천 ==\n{| class=\"table\"\n! || 신체 접촉 || 친숙성\n|-\n| 사례 || [[할로우의 대리모 실험]] (원숭이) || '''각인''' (오리)\n|-\n| 핵심 || 온기·부드러움 || 처음 접한 대상에 대한 친숙함, '''결정적 시기'''\n|-\n| 슬라이드 순위 || \"가장 기본적인 요소\" || \"역시 요인 중 하나\"\n|}\n\n{warn}\nbank 해설 함정: \"각인 = 신체 접촉 기반 애착\" ✗ → '''친숙성''' 기반. 신체 접촉 기반은 할로우. 또 5장의 [[고전적 조건화]]처럼 '''반복 짝짓기'''로 생기는 학습이 아니다 — 결정적 시기의 첫 노출로 생긴다.\n{/warn}\n\n== 관련 문서 ==\n* [[애착]] · [[할로우의 대리모 실험]]\n* [[신경 가소성]] — 결정적 시기의 신경학적 배경\n* [[3장 일생에 걸친 발달]] — p.19–24 절\n\n근거: 3장 p.19 (+ p.2 노트)"
 },
 "안정 애착과 불안정 애착": {
  "title": "안정 애착과 불안정 애착 (불안·회피 애착)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''안정 애착과 불안정 애착'''은 3장 p.21–23의 애착 유형이다. '''안정 애착''' 아동은 부모 곁에서 편안하고, 떨어지면 불안해하다가 다시 만나면 '''신체 접촉'''을 시도한다. '''불안정 애착'''은 애착 자체나 신뢰할 만한 관계를 '''회피'''하며, p.23에서 '''불안 애착'''과 '''회피 애착''' 두 유형으로 나뉜다. 둘의 차이를 만드는 건 '''부모의 적절한 반응'''이다.\n\n{def}\n'''설명''': 부모와 있으면 편안함을 느끼고 사라지면 불안해하다가 다시 부모를 만나면 신체 접촉을 시도하는 애착 유형 (3장 p.21)\n'''명칭''': '''안정 애착''' (Secure Attachment)\n{/def}\n\n{def}\n'''설명''': 애착 자체를 회피하거나 신뢰할 만한 관계를 회피하는 애착 유형 (3장 p.21)\n'''명칭''': '''불안정 애착''' (Insecure Attachment)\n{/def}\n\n=== 불안 애착 ===\n{def}\n'''설명''': 불안정 애착의 영향 중 하나로, 끊임없이 인정을 갈망하며 배척 신호에 예민한 성향 (3장 p.23)\n'''명칭''': '''불안 애착''' (Anxious Attachment)\n{/def}\n\n=== 회피 애착 ===\n{def}\n'''설명''': 불안정 애착의 영향 중 하나로, 다른 사람과 긴밀한 관계가 형성될 때 불편함을 경험하며 거리 유지를 위한 회피 전략을 사용하는 성향 (3장 p.23)\n'''명칭''': '''회피 애착''' (Avoidant Attachment)\n{/def}\n\n{analogy}\n메신저 답장 스타일로 보면 쉽다. '''안정 애착'''은 답이 늦어도 \"바쁜가 보다\" 하고 기다렸다가 답이 오면 반갑게 대화한다. '''불안 애착'''은 읽씹 1분 만에 \"나한테 화났어?\"를 세 번 보낸다(인정 갈망·배척 신호 예민). '''회피 애착'''은 대화가 깊어지면 \"ㅇㅇ\" 하고 알림을 끈다(가까워지면 불편, 거리 유지).\n{/analogy}\n\n[[img:L3-21.png|3장 p.21 — 부모와의 격리에 대한 유아의 스트레스(Kagan, 1976): 연령에 따라 부모가 떠날 때 우는 비율|medium]]\n\n== 유형 비교 (p.21, p.23) ==\n{| class=\"table\"\n! || 안정 애착 || 불안 애착 || 회피 애착\n|-\n| 큰 분류 || 안정 || 불안정 || 불안정\n|-\n| 핵심 특징 || 부모와 있으면 편안, 사라지면 불안, '''다시 만나면 신체 접촉 시도''' || 끊임없이 '''인정을 갈망''', '''배척 신호에 예민''' || 긴밀한 관계가 '''불편''', '''거리 유지''' 회피 전략\n|-\n| 결과 || [[기본 신뢰감]], 성인기 대인 관계·사회/학업 성공 || (위험 탐지에 도움될 수도) || (위험 회피에 도움될 수도)\n|}\n\n== 무엇이 차이를 만드나 (p.21–22) ==\n* 안정/불안정의 차이는 '''적절한 부모의 반응'''에 따라 결정(De Wolff & Van IJzendoorn, 1997) → 아이의 행동에 대한 적절한 반응이 필수. 🎙 \"아이가 어떤 행동을 하면 부모의 적절한 리액션이 수반되어야.\"\n* p.22 애착 형성은 '''선천적 기질과 양육 방식 모두'''의 영향.\n** 부모의 긍정적 양육 개입은 애착의 안정성을 높임(Van Zeijl et al., 2006).\n** '''감수성 훈련''' 여부에 따라 기질적으로 변동성이 높은 아동들의 안정 애착 비율이 변화(판덴붐, 1994). 🎙 타고난 회피 성향이 있어도 달라진다 → 좋은 부모 교육의 필요성.\n\n[[img:L3-22.png|3장 p.22 — 아동의 애착 형성에 영향을 주는 요인: 부모의 양육 + 아동의 선천적 기질|small]]\n\n{tip}\n다만(p.23 ❖): 불안이나 회피적 경향성은 '''위험 탐지나 회피에 도움'''이 될 수 있다(Ein-Dor et al., 2010). 🎙 관계가 끊어질 때 충격을 덜 받는 측면. 객관식 \"불안정 애착은 어떤 이점도 없다\" → ✗.\n{/tip}\n\n{warn}\nbank 함정(가장 잘 나오는 뒤바꿈): \"'''회피''' 애착은 끊임없이 타인의 인정을 갈망한다\" ✗ → 그건 '''불안''' 애착. 또 \"안정 애착 아동은 부모가 사라져도 '''전혀''' 불안해하지 않는다\" ✗ — 안정 애착도 부모가 사라지면 '''불안해한다'''. \"안정/불안정 차이는 부모 반응과 무관하게 선천적 기질로 결정\" ✗.\n{/warn}\n\n{info}\n교재의 에인스워스 '''낯선 상황 실험'''은 슬라이드·수업 범위 밖이다(이 위키에서 다루지 않음).\n{/info}\n\n== 관련 문서 ==\n* [[애착]] — 상위 개념\n* [[기본 신뢰감]] — 안정 애착의 결과\n* [[권위적·권위주의적·허용적 양육]] — 양육 방식\n\n근거: 3장 p.21–23"
 },
 "기본 신뢰감": {
  "title": "기본 신뢰감 (Basic Trust)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''기본 신뢰감'''(basic trust)은 '''세상은 예측할 수 있고 믿을 만하다는 느낌'''이다. 3장에서 두 번 나온다: p.23 \"안정 애착을 지닌 아동은 기본 신뢰감을 형성\"(애착 쪽), p.34 에릭슨 유아기(0~1세) \"욕구가 신뢰할 만큼 충족되면 기본 신뢰감이 발달\"(에릭슨 쪽). 두 슬라이드가 같은 이야기를 서로 다른 이론으로 하고 있는 셈이다.\n\n{def}\n'''설명''': 세상은 예측할 수 있고 믿을 만하다는 느낌. 안정 애착을 지닌 아동이 형성하며, 생득적이기보다는 후천적으로 형성되는 것 (3장 p.23)\n'''명칭''': [[기본 신뢰감]] (Basic Trust)\n{/def}\n\n{def}\n'''설명(사례형)''': 배고프거나 기저귀가 젖어 울 때마다 부모가 일관되게 와서 돌봐 준 아기는 \"울면 누군가 온다, 세상은 믿을 만하다\"는 느낌을 갖게 된다. 에릭슨 유아기의 과제이기도 한 이 느낌은?\n'''명칭''': [[기본 신뢰감]]\n{/def}\n\n{analogy}\n기본 신뢰감은 '''세상이라는 앱에 대한 별점'''이다. 0~1세 동안 \"요청(울음)을 보내면 응답(돌봄)이 온다\"는 경험이 쌓이면 별점 5점 — \"이 앱은 믿고 써도 된다\". 응답이 들쭉날쭉하면 별점이 낮아져 평생 '''의심'''하며 쓴다(신뢰감 vs '''불신감''').\n{/analogy}\n\n[[img:L3-34.png|3장 p.34 — 에릭슨 유아기(0~1세): 신뢰감 vs 불신감 — 욕구가 신뢰할 만큼 충족되면 기본 신뢰감이 발달|medium]]\n\n== 두 슬라이드에서의 기본 신뢰감 ==\n{| class=\"table\"\n! || p.23 (애착) || p.34 (에릭슨)\n|-\n| 맥락 || 애착의 중요성 || 심리사회적 발달 단계 — 유아기(0~1세)\n|-\n| 원인 || '''안정 애착''' || 욕구가 '''신뢰할 만큼 충족'''\n|-\n| 위기·대립 || — || '''신뢰감 vs 불신감'''\n|-\n| 성질 || '''생득적이기보다는 후천적으로 형성''' || —\n|}\n\n🎙 9/15 1:46:31–1:51:23: 아이는 생존을 위해 생물학적 욕구·안전 욕구를 부모가 충족해 줘야 한다 → 안정 애착 → '''기본 신뢰감'''.\n\n{warn}\nbank 오답: \"기본 신뢰감은 '''생득적'''으로 타고나는 것이며 애착과는 무관\" ✗ — 안정 애착을 통해 '''후천적'''으로 형성(p.23).\n{/warn}\n\n{quiz}\n에릭슨의 첫 번째 심리사회적 위기와, 그 위기를 잘 넘겼을 때 발달하는 것은?\n{/quiz}\n{answer}\n'''신뢰감 vs 불신감'''(유아기 0~1세) → '''기본 신뢰감'''.\n{/answer}\n\n== 관련 문서 ==\n* [[안정 애착과 불안정 애착]] — p.23 쪽 원인\n* [[에릭슨의 심리사회적 발달 단계]] — p.34 쪽 원인\n* [[애착]]\n\n근거: 3장 p.23, p.34"
 },

  "body": "3장 p.25 \"'''양육 방식의 유형과 자기개념 발달에 미치는 영향'''\"은 부모의 양육 방식을 네 유형 — '''권위주의적'''(authoritarian)·'''허용적'''(permissive)·'''방임적'''(neglectful)·'''권위적'''(authoritative) — 으로 나누고 각 자녀의 특성을 짝지은 표다. ⭐⭐⭐ 교수가 직접 \"'''용어가 헷갈린다'''\"고 짚었고, 슬라이드 맨 아래 밑줄로 \"'''상관관계이지 인과성은 아님'''\"이 적혀 있다. 시험 포인트가 이 두 줄에 다 들어 있다.\n\n{def}\n'''설명''': 강압적이고 복종을 요구하는 부모. 자녀의 사회적 기술과 자존감 저하 위험성, 실수할 때 자녀의 두뇌가 과민반응 (3장 p.25)\n'''명칭''': '''권위주의적 부모''' (Authoritarian)\n{/def}\n\n{def}\n'''설명''': 제약을 가하지 않으며 모든 행동에 대해 무조건적으로 허용하는 부모. 자녀가 공격적이고 미숙하게 성장할 수 있음 (3장 p.25)\n'''명칭''': '''허용적 부모''' (Permissive)\n{/def}\n\n{def}\n'''설명''': 자녀에게 어떠한 주의도 기울이지 않는(관계 형성 포함) 부모. 자녀의 학업과 사회적 관계가 매우 낮을 수 있음 (3장 p.25)\n'''명칭''': '''방임적 부모''' (Neglectful)\n{/def}\n\n{def}\n'''설명''': 자녀에게 요구를 하지만 타협을 통해 자녀의 요구를 수용하는 부모. 자녀의 높은 자존감과 자기신뢰감, 자율성 (3장 p.25)\n'''명칭''': '''권위적 부모''' (Authoritative)\n{/def}\n\n{def}\n'''설명(사례형)''': 아버지 A는 \"이번 시험에서 성적을 올리면 원하는 걸 사 주겠다\"고 조건을 내걸고, 자녀가 조건이 비현실적이라고 하자 \"그럼 네 수정안을 내 봐\"라며 타협했다. (bank 객관식)\n'''명칭''': '''권위적 부모''' (→ 높은 자존감·자기신뢰감·자율성)\n{/def}\n\n{analogy}\n네 부모를 '''회사 팀장'''으로 바꿔 보자. '''권위주의적''' 팀장: \"토 달지 말고 시키는 대로 해.\" '''허용적''' 팀장: \"다 좋아요~ 하고 싶은 대로 하세요.\" '''방임적''' 팀장: 팀원이 있는지도 모름. '''권위적''' 팀장: \"이번 분기 목표는 이거야. 대신 일정이 무리면 대안을 가져와, 조율하자.\" 이 마지막 팀장 밑에서 팀원이 자율성과 자존감이 높을 '''가능성'''이 크다 — 단, '''가능성'''일 뿐이다(상관 ≠ 인과).\n{/analogy}\n\n[[img:L3-25.png|3장 p.25 — 양육 방식의 유형과 자기개념 발달에 미치는 영향. 아래 밑줄: \"단! 양육 방식과 자기개념 발달은 상관관계가 있는 것이지 인과성을 갖추지는 않음\"|large]]\n\n== 네 유형 (p.25 표 배치 그대로) ==\n{| class=\"table\"\n! || 왼쪽 || 오른쪽\n|-\n| '''위''' || '''권위주의적(authoritarian)''' — 강압적·복종 요구 → 사회적 기술·자존감 저하 위험, 실수할 때 두뇌 과민반응 || '''허용적(permissive)''' — 제약 없음·무조건 허용 → 공격적·미숙\n|-\n| '''아래''' || '''방임적(neglectful)''' — 어떠한 주의도 기울이지 않음(관계 형성 포함) → 학업·사회적 관계 매우 낮음 || '''권위적(authoritative)''' — 요구 + '''타협'''으로 자녀 요구 수용 → '''높은 자존감·자기신뢰감·자율성'''\n|}\n\n== 권위적 vs 권위주의적 — 한 글자 차이 ==\n{| class=\"table\"\n! || 권위'''주의'''적 (authorit'''arian''') || 권위적 (authorit'''ative''')\n|-\n| 요구 || 한다 (강압) || 한다\n|-\n| 자녀 의견 || 무시, '''복종''' 요구 || '''타협'''·협상, 수정안 허용\n|-\n| 자녀 특성 || 사회적 기술·'''자존감 저하''' 위험 || '''높은 자존감'''·자기신뢰감·자율성\n|-\n| 외우기 (🎙) || 「'''~주의'''」가 붙으면 강압 쪽 || 붙지 않으면 좋은 쪽\n|}\n\n{exam}\n🎙 9/15 1:19:03 교수: \"번역이 용어가 용어다 보니까 많이 겹치는 부분이 있죠. 둘 다 '''authority 에서 왔기 때문에''' 중간에 '''뭐가 더 붙냐 안 붙냐'''로 외우면 괜찮지 않을까.\" 그리고 1:19:59 \"부모님들의 양육 스타일과 아이들의 성향 관계는 어디까지나 '''상관관계'''이지 '''인과적으로 해석할 수 있는 건 아닙니다'''\" — 견보호자·호부견자(부모와 자식 성향이 정반대인 경우를 이르는 말)를 예로 들었다.\n{/exam}\n\n== 왜 \"상관이지 인과가 아님\"인가 ==\n1장 [[상관]]에서 배운 그대로다. 권위적 부모 밑에 자존감 높은 아이가 많다는 건 '''함께 나타난다'''는 것이지 \"권위적 양육 → 높은 자존감\"이 증명된 게 아니다. 예를 들어 순하고 자신감 있는 기질의 아이라서 부모가 '''타협하기 쉬웠을''' 수도 있고(방향 반대), 가정의 경제적 여유 같은 [[제3의 변인]]이 둘 다에 영향을 줬을 수도 있다.\n\n{warn}\nbank 오답 보기 재구성:\n* \"권위'''주의'''적 부모 — 높은 자존감·자기신뢰감·자율성\" ✗ → 권위적\n* \"허용적 부모 — 사회적 기술·자존감 저하 위험\" ✗ → 그건 권위주의적. 허용적은 '''공격적·미숙'''\n* \"방임적 부모 — 높은 자존감과 자율성\" ✗ → 학업·사회적 관계 매우 낮음\n* \"권위적 양육이 자녀의 높은 자존감을 '''일으킨다'''(인과)\" ✗ → 상관\n{/warn}\n\n{quiz}\n\"자녀에게 요구는 하되 타협으로 자녀의 요구를 수용하는 양육 방식\"의 명칭을 쓰시오. (영어 원어도)\n{/quiz}\n{answer}\n'''권위적'''(authoritative) 부모(양육). \"권위주의적(authoritarian)\"이라고 쓰면 오답.\n{/answer}\n\n== 관련 문서 ==\n* [[상관]] · [[제3의 변인]] — 1장, 상관 ≠ 인과\n* [[자기 개념]] — p.25 제목의 \"자기개념 발달\"\n* [[애착]] · [[안정 애착과 불안정 애착]] — 부모의 반응\n* [[자주 틀리는 함정 모음]]\n\n근거: 3장 p.25, 🎙 9/15"
 },
 "자기 개념": {
  "title": "자기 개념 (Self-concept)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''자기 개념'''(Self-concept)은 '''자기 자신에 대한 개념''' — \"나는 누구인가\"에 대한 생각이다. 3장 p.26은 이것을 '''아동기의 가장 중요한 사회적 성취'''라 부르고, '''15~18개월'''부터 형성된다고 한다. 증거가 그 유명한 '''코에 빨간 점 + 거울''' 실험이다.\n\n{def}\n'''설명''': 자기 자신에 대한 개념으로, 아동기의 가장 중요한 사회적 성취이며 15~18개월 때부터 형성됨 (코에 빨간 점을 찍고 거울을 보게 했을 때의 반응으로 확인) (3장 p.26)\n'''명칭''': [[자기 개념]] (Self-concept)\n{/def}\n\n{def}\n'''설명(사례형)''': 아기 몰래 코에 빨간 점을 찍고 거울 앞에 앉혔다. 6개월 아기는 거울 속 아기에게 손을 뻗었지만, 15개월 아기는 자기 코를 만졌다. 15개월 아기에게 생긴 것은?\n'''명칭''': [[자기 개념]]\n{/def}\n\n{analogy}\n거울 실험은 '''화상 통화 화면 속 내 얼굴을 \"나\"로 알아보는지''' 보는 테스트다. 화면 속 얼굴에 뭐가 묻었을 때, 화면을 닦으면(6개월) 아직 \"저건 다른 사람\"이고, 내 얼굴을 닦으면(15개월) \"저게 나구나\"를 아는 것이다.\n{/analogy}\n\n[[img:L3-26.png|3장 p.26 — 자기에 대한 인식: 거울 앞의 아기|small]]\n\n== 거울 실험 (Courage & Howe, 2002) ==\n{| class=\"table\"\n! 실험 카드 || \n|-\n| 연구자(연도) || Courage & Howe (2002) (슬라이드 표기)\n|-\n| 질문 || 아기는 언제부터 '''자기 자신'''을 알아보는가?\n|-\n| 절차 || 코에 '''빨간 점'''을 찍어 주고 거울을 보게 함 → 반응 비교\n|-\n| 결과 (🎙) || 6개월: 거울 속 상의 코에 손을 뻗음 / '''15개월쯤''': '''자기 코'''로 손을 뻗음\n|-\n| 결론 || 자기 개념은 '''15~18개월'''부터 형성\n|-\n| 함정 || 대상 영속성(6개월 이후), 마음 이론(4~5세)과 나이 혼동 주의\n|}\n\n<pre class=\"ascii\">\n  코에 빨간 점 ● → 거울 앞\n     6개월  : 손 → [거울 속 아기]   (저건 다른 아기)\n     15개월 : 손 → [내 코]          ('''[[자기 개념]]''' 형성, 15~18개월)\n<\/pre>\n\n== 학령기의 자기 개념 ==\n* 학령기 아동은 자기 개념이 보다 '''구체화'''된다 — 소속 집단, 심리적 특질, 타인과 자신 간의 유사성/차별성(Stipek, 1992).\n* 위 요소들을 반영해 스스로에 대한 '''이상적인 자기 개념'''을 형성.\n* 청소년기에는 이것이 [[정체성]] 확립으로 이어진다(p.31, 핵심 = 차별성).\n\n{exam}\n통합요약 교수 강조: \"거울 실험으로 자기 개념 확인('''15–18개월''')\". 🎙 9/15 1:20:46–1:22:53 — 이 자리에서 교수는 [[마음 이론]]·[[거울 뉴런]]도 함께 언급했다.\n{/exam}\n\n{warn}\n나이 정리: 대상 영속성 '''6개월 이후''' → 자기 개념 '''15~18개월''' → 가상 놀이 '''3세 이후''' → 마음 이론 '''4~5세'''. 보기에서 숫자를 바꿔치기한다.\n{/warn}\n\n== 관련 문서 ==\n* [[권위적·권위주의적·허용적 양육]] — 같은 \"자기개념 발달\" 맥락(p.25)\n* [[정체성]] — 청소년기의 자기\n* [[자기참조 효과]] — 6장, 자기와 관련지으면 잘 기억됨\n\n근거: 3장 p.26, 🎙 9/15"
 },
 "콜버그의 도덕성 발달 단계": {
  "title": "콜버그(Kohlberg)의 도덕성 발달 단계",
  "category": [
   "3장 일생에 걸친 발달",
   "이론"
  ],
  "body": "'''콜버그의 도덕성 발달 단계'''는 로렌스 콜버그(Lawrence Kohlberg)가 '''도덕적 딜레마에 대한 사고 양상'''이 나이에 따라 어떻게 변하는지 추적해 만든 3수준 — '''전인습적 → 인습적 → 후인습적''' — 이론이다. 슬라이드의 딜레마는 \"'''사랑하는 이를 위해 약을 훔쳐도 되는가?'''\". 중요한 건 '''훔친다/안 훔친다'''라는 결론이 아니라 '''그 이유'''로 수준을 나눈다는 점이다.\n\n{| class=\"table\"\n! 인물 카드 || \n|-\n| 이름(원어) || 로렌스 콜버그 (Lawrence Kohlberg, 1927–1987)\n|-\n| 학파·분야 || 발달심리학 — 도덕성 발달\n|-\n| 핵심 주장 || '''도덕 추리'''에 기반한 도덕성 발달 단계. 아동의 도덕적 판단은 '''인지 발달에 기초'''(피아제+콜버그)\n|-\n| 관련 자료(슬라이드) || 3장 p.28 도덕 추리·트롤리 딜레마, p.29 약 훔치기 딜레마 표\n|-\n| 시험 포인트 || 3수준 이름·연령·핵심 기제 매칭. 인습적 = 사회적 인정·질서 vs 후인습적 = 보편 권리·윤리 원칙\n|}\n\n{def}\n'''설명''': 옳고 그른 것을 따질 때 발생하는 사고의 과정(도덕 추리)에 기반하여, 도덕적 딜레마에 대한 사고 양상의 발달 변화를 추적해 제안된 단계 이론 (3장 p.28)\n'''명칭''': [[콜버그의 도덕성 발달 단계]]\n{/def}\n\n=== 도덕 추리 ===\n{def}\n'''설명''': 옳고 그른 것을 따질 때 발생하는 사고의 과정 (3장 p.28)\n'''명칭''': '''도덕 추리''' (Moral Reasoning)\n{/def}\n\n{analogy}\n같은 \"신호 무시하고 건널까?\"에 대한 세 수준의 답. '''전인습적''': \"단속 카메라 있으면 안 건너, 없으면 건너\"(처벌·보상). '''인습적''': \"다들 지키는 규칙이니까, 어기면 나쁜 사람이니까 안 건너\"(사회적 인정·질서). '''후인습적''': \"구급차가 응급 환자를 싣고 있다면, 생명이 규칙보다 우선이야\"(보편적 권리·자신의 윤리 원칙). 행동은 같아도 '''이유'''가 다르면 수준이 다르다.\n{/analogy}\n\n[[img:L3-29.png|3장 p.29 — 콜버그의 도덕적 사고 수준: \"사랑하는 이를 위해 약을 훔쳐도 되는가?\"|large]]\n\n== 3수준 (p.29 표) ==\n{| class=\"table\"\n! 수준(연령) || 초점 (핵심 기제) || 도덕 추리의 사례\n|-\n| '''전인습적 단계''' (9세 이전) || '''처벌'''을 피하거나 '''구체적 보상'''이 규칙 준수에 대한 핵심 기제 || \"약을 훔치면 교도소에 가니까 안 돼\" / \"잡히지 않을 수 있으니까 훔쳐도 돼\"\n|-\n| '''인습적 단계''' (청소년 초기) || '''사회적 인정'''을 얻거나 '''사회 질서의 유지'''가 법과 규칙 준수에 대한 핵심 기제 || \"아픈 딸을 위해 약을 훔칠 수 있다\" / \"법에 저촉되는 행위를 하면 나쁜 사람이니까 안 된다\"\n|-\n| '''후인습적 단계''' (청소년기와 그 이후) || 도덕적 행위는 '''보편적인 기본 권리'''와 자신이 규정한 '''윤리적 원칙'''에 대한 신념을 반영 || \"사람은 누구나 살 권리를 가지고 있기에 생명권 보장을 위해 약을 훔친다\"\n|}\n\n=== 전인습적 단계 ===\n{def}\n'''설명''': 처벌을 피하거나 구체적 보상이 규칙 준수에 대한 핵심 기제로 작용하는, 9세 이전의 도덕적 사고 수준 (3장 p.29)\n'''명칭''': '''전인습적 단계''' (Preconventional)\n{/def}\n\n=== 인습적 단계 ===\n{def}\n'''설명''': 사회적 인정을 얻거나 사회 질서의 유지가 법과 규칙 준수에 대한 핵심 기제인, 청소년 초기의 도덕적 사고 수준 (3장 p.29)\n'''명칭''': '''인습적 단계''' (Conventional)\n{/def}\n\n=== 후인습적 단계 ===\n{def}\n'''설명''': 도덕적 행위가 보편적인 기본 권리와 자신이 규정한 윤리적 원칙에 대한 신념을 반영하는, 청소년기와 그 이후의 도덕적 사고 수준 (3장 p.29)\n'''명칭''': '''후인습적 단계''' (Postconventional)\n{/def}\n[노트] 후인습 단계는 '''집단 목표보다 개인 목표를 우선시하는 문화권'''에서 발현되기 쉽다(정리본) → [[비교문화심리학]].\n\n{tip}\n\"인습(因習)\" = 사회의 관습·규칙. '''전'''인습 = 규칙을 아직 '''내 것으로 못 받아들인''' 단계(처벌·보상), 인습 = 규칙을 '''따르는''' 단계(인정·질서), '''후'''인습 = 규칙을 '''넘어선''' 단계(보편 원리). 🎙 인습적 = 사회적 인정·역할 기대·질서 유지.\n{/tip}\n\n== 인지 발달과의 관계 (p.28) ==\n* 아동의 도덕적 판단은 '''인지 발달에 기초'''(피아제+콜버그).\n* 🎙 선악·진실/거짓 같은 추상 개념의 이해가 선행 → [[형식적 조작 단계]]의 능력(p.16 \"성숙한 도덕 추리 잠재성\")이 도덕 추리의 기반.\n* 반론: 도덕성의 상당 부분은 이성이 아니라 직관·정서 → [[도덕 직관]](p.30, 하이트).\n\n[[img:L3-28.png|3장 p.28 — 트롤리 딜레마: 도덕적 딜레마에 대한 사고 양상의 발달 변화를 추적|small]]\n\n{warn}\nbank 오답 보기 재구성:\n* \"'''인습적''' 단계는 보편적 기본 권리와 스스로 규정한 윤리 원칙을 반영\" ✗ → 후인습적\n* \"후인습적 단계는 '''9세 이전''' 아동에게서 나타난다\" ✗ → 청소년기와 그 이후\n* \"콜버그의 단계는 아동의 '''인지 발달과 무관'''하게 제안\" ✗ → 인지 발달에 기초\n* \"아픈 딸을 위해 훔칠 수 있다\" 는 '''결론이 \"훔친다\"여도''' 후인습이 아니라 '''인습적'''(역할 기대)\n{/warn}\n\n{quiz}\n\"약을 훔치면 교도소에 가니까 훔치면 안 돼.\" — 이 추리의 수준 명칭은?\n{/quiz}\n{answer}\n'''전인습적 단계'''(처벌 회피, 9세 이전).\n{/answer}\n\n== 관련 문서 ==\n* [[도덕 직관]] — 이성 대신 직관·정서\n* [[형식적 조작 단계]] · [[피아제의 인지 발달 단계]] — 인지적 기반\n* [[에릭슨의 심리사회적 발달 단계]] — 🎙 총정리: 도덕성 = 콜버그, 사회성 = 에릭슨\n\n근거: 3장 p.28–29"
 },
 "도덕 직관": {
  "title": "도덕 직관 (Moral Intuition)",
  "category": [
   "3장 일생에 걸친 발달",
   "이론"
  ],
  "body": "'''도덕 직관'''(moral intuition)은 '''도덕성의 상당 부분이 이성보다는 직관과 정서에 기반하여 형성'''된다는 관점이다(하이트, 2012). [[콜버그의 도덕성 발달 단계|콜버그]]가 도덕을 \"따져 보는 '''추리'''\"로 봤다면, 하이트는 \"판단은 '''먼저 느낌'''으로 내려지고 이유는 나중에 붙는다\"고 본다. 같은 슬라이드(p.30)에 '''도덕 행위'''(행동 → 태도) 이야기도 함께 있다.\n\n{| class=\"table\"\n! 인물 카드 || \n|-\n| 이름(원어) || 조너선 하이트 (Jonathan Haidt) — 슬라이드 표기 \"하이트, 2012\"\n|-\n| 분야 || 사회·도덕 심리학\n|-\n| 핵심 주장 || 도덕성의 상당 부분은 '''이성보다 직관과 정서'''. 도덕적 판단이 '''자동적이고 신속'''\n|-\n| 관련 사례(슬라이드) || 트롤리 딜레마 (레버만 돌리기 vs 직접 사람 밀치기)\n|-\n| 시험 포인트 || \"도덕 = 직관·정서\" ↔ 콜버그 \"도덕 = 추리\". 행동으로 태도 함양 '''가능'''\n|}\n\n{def}\n'''설명''': 도덕성의 상당 부분은 이성보다는 직관과 정서에 기반하여 형성되며, 도덕적 판단이 자동적이고 신속하게 이루어진다는 것 (3장 p.30, 하이트 2012)\n'''명칭''': [[도덕 직관]] (Moral Intuition)\n{/def}\n\n{analogy}\n도덕 직관은 '''코가 먼저 판단하는 음식 맛'''이다. 상한 우유를 마시기 전에 냄새만 맡고 \"윽\" 하고 내려놓는다 — 성분표를 분석(추리)하기 전에 혐오감(정서)이 판결을 내린다. 이유(\"유통기한이 지났으니까\")는 나중에 갖다 붙인다. 하이트에 따르면 도덕 판단의 상당수가 이렇게 돌아간다.\n{/analogy}\n\n[[img:L3-30.png|3장 p.30 — 트롤리 딜레마: 레버만 돌리기 vs 직접 사람 하나를 밀쳐서 기차를 멈추게 하기|medium]]\n\n== 슬라이드 내용 (p.30) ==\n* '''도덕 직관''': 도덕성의 상당 부분은 이성보다는 직관과 정서에 기반하여 형성(하이트, 2012).\n** 도덕적 판단이 '''자동적이고 신속'''하게 이루어짐.\n** '''혐오감이나 기쁨''' 등의 정서가 도덕 추리 촉발(Chester & DeWall, 2016).\n** '''트롤리 딜레마'''에서 살펴볼 수 있음.\n* '''도덕 행위''': 도덕적 사고와 감정이 언행으로 이어지는 것이 일반적. 그러나 '''도덕적 행동을 통해서 도덕적 태도를 함양'''시키는 것도 가능(Heller, 2014; Piliavin, 2003).\n\n=== 트롤리 딜레마 ===\n{def}\n'''설명''': 레버만 돌려 기차의 방향을 바꾸는 경우와 직접 사람 하나를 밀쳐서 기차를 멈추게 하는 경우의 도덕적 판단을 비교하는 도덕적 딜레마 (3장 p.28, p.30)\n'''명칭''': '''트롤리 딜레마''' (Trolley Dilemma)\n{/def}\n두 경우 모두 \"1명 희생, 다수 구조\"로 '''계산 결과는 같은데''' 대부분 레버는 당기고 사람은 못 민다 — 계산(이성)이 아니라 '''직접 밀친다는 데서 오는 정서'''가 판단을 바꾼다는 것이 도덕 직관의 증거.\n\n=== 도덕 행위 ===\n{def}\n'''설명''': 도덕적 사고와 감정이 언행으로 이어지는 것. 반대로 도덕적 행동을 통해서 도덕적 태도를 함양시키는 것도 가능함 (3장 p.30)\n'''명칭''': '''도덕 행위''' (Moral Action)\n{/def}\n\n{exam}\n🎙 9/15 1:32:23–1:37:17: 도덕 추리 형성에는 '''정서가 상당 부분 개입''' — 엄벌주의도 응보적 정서와 관련. 법원이 '''행동(치료) 프로그램 이수 명령'''을 내리는 것은 '''행동 → 태도''' 형성을 인정하기 때문. bank 객관식 정답 = \"도덕적 행동을 통해 도덕적 태도를 함양하는 것은 '''불가능'''하다\"(옳지 않은 것).\n{/exam}\n\n== 콜버그 vs 하이트 ==\n{| class=\"table\"\n! || [[콜버그의 도덕성 발달 단계|콜버그]] (p.28–29) || 하이트의 [[도덕 직관]] (p.30)\n|-\n| 도덕의 기반 || '''도덕 추리'''(사고 과정) || '''직관과 정서'''\n|-\n| 판단 속도 || 따져 봄 || 자동적·신속\n|-\n| 사례 || 약 훔치기 딜레마 || 트롤리 딜레마, 혐오감\n|}\n\n{warn}\n\"태도가 먼저 형성되어야만 행동이 가능\" ✗ — 행동 → 태도도 가능. 이 방향은 5장 [[관찰 학습]]·행동 치료와도 통한다.\n{/warn}\n\n== 관련 문서 ==\n* [[콜버그의 도덕성 발달 단계]] — 대비되는 이성 중심 관점\n* [[이중 처리]] — 2장, 빠른 직관 처리 vs 느린 의식 처리\n* [[3장 일생에 걸친 발달]] — p.28–30 절\n\n근거: 3장 p.28, p.30, 🎙 9/15"
 },

  "body": "'''에릭슨의 심리사회적 발달 단계'''는 에릭 에릭슨(Erik Erikson)이 \"'''삶의 각 단계는 심리사회적 과제(위기)를 수반한다'''\"(1963)고 보고, 유아기부터 노년기까지 단계마다 '''A vs B''' 꼴의 위기를 짝지은 이론이다. 3장은 이 표를 두 장으로 쪼개 실었다 — p.34(유아~청소년기 4단계), p.39(성인~노년기 3단계). 🎙 교수 총정리: \"사회성 = '''에릭슨'''\".\n\n{| class=\"table\"\n! 인물 카드 || \n|-\n| 이름(원어) || 에릭 에릭슨 (Erik Erikson, 1902–1994)\n|-\n| 학파·분야 || 발달심리학 — 일생에 걸친 사회성(심리사회적) 발달\n|-\n| 핵심 주장 || 삶의 각 단계는 '''심리사회적 과제(위기)'''를 수반 (에릭슨, 1963). 청소년기 = '''정체성''' 확립\n|-\n| 슬라이드 || 3장 p.31(정체성), p.34(유아~청소년기 표), p.39(성인~노년기 표)\n|-\n| 시험 포인트 || 단계 ↔ 위기 쌍 매칭. 청소년 = 정체성 vs 역할 혼미, 성인 초기 = 친밀감, 중년 = 생산성, 노년 = 통합감\n|}\n\n{def}\n'''설명''': 삶의 각 단계가 심리사회적 과제(위기)를 수반하며, 유아기의 신뢰감 vs 불신감부터 노년기의 통합감 vs 절망감까지 단계별 위기를 해결하며 발달한다고 본 이론 (3장 p.31, p.34, p.39)\n'''명칭''': [[에릭슨의 심리사회적 발달 단계]]\n{/def}\n\n{analogy}\n에릭슨의 단계는 '''인생 RPG의 챕터별 보스전'''이다. 챕터 1 보스 \"불신감\"을 깨면 아이템 '''기본 신뢰감''' 획득, 챕터 4(청소년) 보스 \"역할 혼미\"를 깨면 '''정체성''', 마지막 챕터 보스 \"절망감\"을 깨면 엔딩 크레딧에서 \"잘 살았다\"('''통합감''')가 뜬다. 보스를 못 깨면 다음 챕터로 넘어가긴 하지만 디버프(불신·수치·죄책·혼란·고립·침체·절망)를 달고 간다.\n{/analogy}\n\n[[img:L3-34.png|3장 p.34 — 에릭슨의 심리사회적 발달 단계(유아~청소년기)|large]]\n\n[[img:L3-39.png|3장 p.39 — 에릭슨의 심리사회적 발달 단계(성인~노년기)|large]]\n\n== 단계표 (p.34 + p.39) ==\n{| class=\"table\"\n! 단계 (연령) || 심리사회적 위기 || 해결해야 할 과제\n|-\n| 유아기 (0~1세) || '''신뢰감 vs 불신감''' || 욕구가 신뢰할 만큼 충족되면 [[기본 신뢰감]]이 발달\n|-\n| 걸음마기 (1~2세) || '''자율성 vs 수치감+자기의심''' || 의지를 나타내고 스스로 행하는 방식을 학습 / 그렇지 않으면 자신의 능력을 의심\n|-\n| 학령 전기 (3~6세) || '''선도성 vs 죄책감''' || 과제를 스스로 하며 계획의 실행을 학습 / 이행하지 않을 시 노력의 부재에 대한 죄책감\n|-\n| 청소년기 (10~20대) || '''[[정체성]] vs 역할 혼미''' || 역할을 검증하여 자기감을 정교화하고 정체성 형성 / 잘 안되면 스스로에 대한 혼란\n|-\n| 성인 초기 (20~40대 초) || '''친밀감 vs 소외감''' || 밀접한 관계를 형성하고자 하며 사랑하는 사람을 찾음 / 그렇지 않으면 고립감\n|-\n| 중년기 (40~60대) || '''생산성 vs 침체감''' || 가족과 일을 통해 자신의 능력에 대한 자신감과 사회에 공헌한다는 느낌 / 그렇지 못하면 목표감 상실\n|-\n| 노년기 (60대 후반~) || '''통합감 vs 절망감''' || 자신의 삶을 되돌아볼 때 만족감 혹은 실패감을 겪게 됨\n|}\n\n{info}\n슬라이드에는 '''7단계'''만 실려 있다(학령기 단계는 슬라이드에 없음). 시험은 슬라이드 기준이므로 위 7행이 암기 대상이다. 슬라이드 표기 \"'''선도성'''\"(교재에 따라 '주도성')도 그대로 외운다.\n{/info}\n\n{tip}\n암기 주문 (정리본 핵심 요약 9번): '''신뢰 → 자율 → 선도 → 정체 → 친밀 → 생산 → 통합'''. 뒤에 붙는 짝은 전부 \"부정형\"(불신·수치·죄책·역할 혼미·소외·침체·절망)이라 앞 단어만 맞히면 된다. 성인기 두 측면(p.38) '''친밀감(사랑)·생산성(직업)'''이 그대로 성인 초기·중년기 위기 이름이 된다.\n{/tip}\n\n== 3장 다른 절과의 연결 ==\n* 유아기 → [[기본 신뢰감]] = p.23 '''안정 애착'''의 결과와 같은 말. 🎙 부모가 생존·안전 욕구를 충족 → 안정 애착 → 기본 신뢰감.\n* 청소년기 → [[정체성]] (p.31, 핵심 = 차별성).\n* 성인 초기·중년기 → p.38 '''친밀감'''·'''생산성''' (→ [[3장 일생에 걸친 발달]] p.38 절).\n* 노년기 → p.40 웰빙, [[성공적 노화]].\n\n{warn}\nbank 오답 보기 재구성:\n* \"유아기(0~1세) — 자율성 vs 수치감·자기의심\" ✗ → 신뢰감 vs 불신감 (자율성은 걸음마기 1~2세)\n* \"중년기 — 친밀감 vs 소외감\" ✗ → 생산성 vs 침체감 (친밀감은 성인 초기)\n* \"노년기 — 선도성 vs 죄책감\" ✗ → 통합감 vs 절망감 (선도성은 학령 전기 3~6세)\n정답 짝: '''청소년기 — 정체성 vs 역할 혼미'''.\n{/warn}\n\n{quiz}\n\"자신의 삶을 되돌아볼 때 만족감 혹은 실패감을 겪게 되는\" 시기의 위기 이름은?\n{/quiz}\n{answer}\n'''통합감 vs 절망감'''(노년기, 60대 후반~).\n{/answer}\n\n== 관련 문서 ==\n* [[정체성]] · [[기본 신뢰감]] — 표의 핵심 명칭\n* [[콜버그의 도덕성 발달 단계]] · [[피아제의 인지 발달 단계]] — 다른 두 단계 이론\n* [[성공적 노화]] — 노년기\n\n근거: 3장 p.31, p.34, p.39, 🎙 9/15"
 },
 "정체성": {

  "body": "'''정체성'''(identity)은 청소년이 '''다양한 상황 속의 '자기'를 시도하고 통합하여 사회적 정체성을 수립하고 자신을 정의'''하는 것이다. [[에릭슨의 심리사회적 발달 단계|에릭슨]]은 청소년기(10~20대)의 위기를 '''정체성 vs 역할 혼미'''로 불렀다. 🎙 교수: 정체성 수립에서 '''가장 중요한 요소는 차별성'''.\n\n{def}\n'''설명''': 청소년이 집·학교·온라인 등 다양한 상황에서의 '자기'를 시도하고, 그 자신을 통합함으로써 사회적 정체성을 수립하고 자신을 정의하는 것 (차별성 중심) (3장 p.31)\n'''명칭''': [[정체성]] (Identity)\n{/def}\n\n=== 역할 혼미 ===\n{def}\n'''설명''': 청소년기의 심리사회적 위기에서, 역할을 검증하여 자기감을 정교화하고 정체성을 형성하는 일이 잘 안될 때 초래되는 스스로에 대한 혼란 (3장 p.34)\n'''명칭''': '''역할 혼미''' (Role Confusion) — 위기 이름: '''정체성 vs 역할 혼미'''\n{/def}\n\n{analogy}\n정체성 확립은 '''여러 SNS 계정을 하나의 프로필로 정리하는 일'''이다. 집에서의 나(가족 단톡), 학교에서의 나(반 단톡), 온라인의 나(부계정)를 다 써 보다가, \"그래서 진짜 나는?\"을 '''한 줄 소개'''로 통합한다. 그 한 줄이 \"남들과 뭐가 다른지\"(차별성)를 담을 때 정체성이 선다. 끝내 계정마다 딴사람이면 — 역할 혼미.\n{/analogy}\n\n[[img:L3-31.png|3장 p.31 — 청소년기의 정체성 형성: 가족·친구·학교·사회문화 속의 \"나는 어떤 사람이고, 어떻게 살아가고 싶을까?\"|medium]]\n\n== 슬라이드 내용 (p.31–34) ==\n* 삶의 각 단계는 심리사회적 과제(위기)를 수반(에릭슨, 1963).\n* 청소년기의 '''정체성 확립''': 다양한 상황(집, 학교, 온라인)에서 '자기'를 시도 → 통합 → 사회적 정체성 수립·자신을 정의('''차별성 중심''').\n* 자신의 삶에 대한 만족감 형성: 대부분은 '''타인에게 휘둘리지 않는 자신만의 삶의 방식'''을 선호(Lyons, 2004), 개인적 성취 욕망 발달(Damon et al., 2003).\n* p.32 친밀감 발달을 통한 소속감 향상 — 문화권에 따라 차이(개인주의 문화권에서 또래 간 낭만적 관계, Li et al., 2010).\n* p.33 또래 영향력 증가, 그러나 부모와의 관계가 또래 관계에도 영향. SNS 좋아요 → 보상 처리 두뇌 영역 활성화(Sherman et al., 2016).\n* p.34 표: 청소년기(10~20대) '''정체성 vs 역할 혼미''' — 역할을 검증하여 자기감을 정교화하고 정체성 형성 / 잘 안되면 스스로에 대한 혼란.\n\n[[img:L3-33.png|3장 p.33 — 연령대별 부모와의 관계에 대한 인식 변화 — 세로축은 부모와의 '고품질 관계'를 보고하는 비율(초6→고1로 갈수록 감소)|small]]\n\n{exam}\n🎙 9/15 1:37:59–1:40:33: 정체성 확립에서 '''가장 중요한 요소는 차별성'''(남들과 다른 나). 개인주의/집단주의 문화권의 차이는 '''자기소개 방식'''에서 잘 드러난다 → [[비교문화심리학]]. bank 정답 짝: \"청소년기 — '''정체성 대 역할 혼미'''\".\n{/exam}\n\n{warn}\n\"정체성 vs 역할 혼미\"를 성인 초기에 붙이거나(✗ 친밀감 vs 소외감), \"통합감\"과 헷갈리지 말 것 — '''통합감'''(노년기)은 삶을 되돌아보는 만족, 정체성의 \"통합\"은 여러 상황의 자기를 '''하나로 묶는''' 것. 정리본 헷갈리는 쌍: \"정체성 위기 vs 통합감 위기\".\n{/warn}\n\n== 관련 문서 ==\n* [[에릭슨의 심리사회적 발달 단계]] — 전체 표\n* [[자기 개념]] — 아동기의 자기, 학령기 유사성/차별성\n* [[형식적 조작 단계]] — 같은 시기의 인지 발달\n\n근거: 3장 p.31–34, 🎙 9/15"
 },

  "body": "'''설단 현상'''(tip-of-the-tongue, 舌端 = 혀끝)은 '''아는 단어가 혀끝에서 맴돌기만 하고 떠오르지 않는''' 망각이다. 3장 p.35에서 \"'''노년층은 설단 현상 망각을 더 자주 경험'''\"(Ossher et al., 2012)으로 나온다. 같은 슬라이드의 핵심 짝은 \"노화하면 '''회상은 떨어지고 재인은 유지'''\" — 설단 현상이 바로 회상(꺼내기)의 실패라서 둘이 함께 묶인다.\n\n{def}\n'''설명''': 단어가 혀끝에서 맴돌며 떠오르지 않는 망각 현상으로, 노년층이 더 자주 경험함 (3장 p.35, Ossher et al., 2012)\n'''명칭''': [[설단 현상]] (Tip-of-the-tongue)\n{/def}\n\n{def}\n'''설명(사례형)''': 할머니가 \"그 왜, 그 배우 있잖아, ㅅ으로 시작하는… 드라마에 나온…\"이라며 이름이 입안에서 맴도는데 끝내 말하지 못하다가, 손주가 \"송강호?\" 하자 \"그래 맞아!\" 하고 바로 알아보셨다.\n'''명칭''': [[설단 현상]] (+ 보기를 듣자 바로 알아본 것 = [[재인]]은 유지)\n{/def}\n\n{analogy}\n설단 현상은 '''파일은 하드에 멀쩡히 있는데 검색창에 파일명이 안 떠오르는 상태'''다. 확장자(첫 글자)도, 대충 크기(음절 수)도 기억나는데 이름이 안 나온다. 누가 목록을 띄워 주면(재인) 바로 클릭한다 — 파일이 지워진 게(망각) 아니라 '''꺼내는 경로'''(회상)가 막힌 것이다.\n{/analogy}\n\n[[img:L3-35.png|3장 p.35 — 연령대별 회상 기억 능력(Crook & West, 1990, 좌), 연령대별 재인/회상 능력 변화(Schonfield & Robertson, 1966, 우): 회상은 하락, 재인은 거의 평평|large]]\n\n== 성인기의 인지 기능 — 발달과 노화 (p.35) ==\n* 노년층은 기억에 의한 문제를 최소화하기 위해 '''단서'''를 활용(Henry et al., 2004) → 6장 [[인출 단서]].\n* 기억력의 '''개인차는 나이가 들수록 점점 더 커짐'''.\n* 일부 인지 기능은 노화에 따른 저하가 나타나지 않음(Schonfield & Robertson, 1966):\n** '''재인 능력은 회상과 달리 노화에 따른 변화가 적음'''.\n** 노년층은 '''설단 현상''' 망각을 더 자주 경험(Ossher et al., 2012).\n\n== 회상 vs 재인 (노화) ==\n{| class=\"table\"\n! || [[회상]] (Recall) || [[재인]] (Recognition)\n|-\n| 과제 || 정보를 '''직접 산출'''(떠올려 말하기) || 본 적 있는지 '''판단'''(보기 중 고르기)\n|-\n| 예 || 주관식·단답형 || 객관식, 얼굴 알아보기\n|-\n| 노화의 영향 || '''하락''' || '''변화 적음'''(유지)\n|-\n| 설단 현상과의 관계 || 설단 현상 = 회상의 실패 || 단서·보기가 주어지면 해결\n|}\n\n{exam}\n🎙 9/15 1:52:33–1:54:06: \"회상 과제는 노화에 따라 하락하지만 '''재인 과제는 변화가 거의 없다'''.\" 노인이 단어를 못 말하는 건 '''기억이 지워진 게 아니라 직접 산출(생성)의 문제'''. 통합요약 교수 강조 \"노화하면 회상은 떨어지고 재인은 유지됨\".\n{/exam}\n\n{warn}\nbank 오답 보기 재구성:\n* \"회상과 재인이 '''같은 폭'''으로 하락\" ✗\n* \"'''재인'''은 크게 하락, 회상은 변화 없음\" ✗ (거꾸로)\n* \"기억력의 개인차는 나이가 들수록 '''줄어든다'''\" ✗ → 커진다\n{/warn}\n\n{joke}\n시험장에서 단답형 칸 앞에 앉아 \"그거… 그 '권위' 뭐시기…\"가 나오면 그게 바로 설단 현상이다. 해결책도 슬라이드에 있다 — '''단서를 활용'''하라. 이 위키 [[명칭 암기표]]가 그 단서다.\n{/joke}\n\n== 관련 문서 ==\n* [[회상]] · [[재인]] — 6장 p.3–4 원래 정의\n* [[인출 단서]] — 6장, 노년층이 활용하는 단서\n* [[성공적 노화]] — 같은 성인기 절\n\n근거: 3장 p.35, 🎙 9/15"
 },
 "사회적 시계": {
  "title": "사회적 시계 (Social Clock)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''사회적 시계'''(social clock)는 '''결혼, 은퇴 등 사회적 사건에 대해 문화적으로 선호하는 타이밍'''이다. \"몇 살엔 취업, 몇 살엔 결혼\"이라는 사회의 시간표. 핵심은 이 시계가 '''문화나 시대에 따라 항상 변화'''한다는 것. 같은 슬라이드(p.37)에서 '''중년기 위기론은 연구상 지지되지 않는다'''는 내용도 함께 나온다.\n\n{def}\n'''설명''': 결혼, 은퇴 등 사회적 사건에 대해 문화적으로 선호하는 타이밍 (3장 p.37)\n'''명칭''': [[사회적 시계]] (Social Clock)\n{/def}\n\n{def}\n'''설명(사례형)''': 부모 세대에는 \"20대 후반이면 결혼해야지\"가 상식이었지만 요즘은 30대 초반 결혼도 늦지 않다고 여긴다. 이처럼 시대에 따라 달라지는, 인생 사건에 대한 사회의 기대 시점은? (🎙 9/15 교수 예시)\n'''명칭''': [[사회적 시계]]\n{/def}\n\n{analogy}\n사회적 시계는 '''단체 여행의 일정표'''다. \"9시 조식, 10시 출발, 12시 점심\" — 따라가면 편하지만 늦으면 괜히 눈치 보인다. 그런데 이 일정표는 '''여행사(문화)·연도(시대)마다 다르다'''. 한국 2026년 패키지의 \"결혼 시각\"과 1990년 패키지의 시각은 다르다.\n{/analogy}\n\n[[img:L3-37.png|3장 p.37 — 중년기로의 전환 시점에서의 고민(승진·이직·은퇴 등 앞으로 어떤 선택을 할까)|medium]]\n\n== 슬라이드 내용 (p.37) ==\n* 성인기의 연령과 단계\n** '''사회적 시계''': 결혼, 은퇴 등 사회적 사건에 대해 문화적으로 선호하는 타이밍.\n** 사회적 시계는 '''문화나 시대에 따라 항상 변화'''함.\n* 중년기로의 전환(40대)\n** 통념적으로 중년기로의 전환은 많은 이에게 '''심리적 위기와 좌절감'''을 안겨 준다고 주장.\n** 그러나 '''40대에 그만한 사건이 자주 발생하지는 않음'''(Hunter & Sundel, 1989).\n\n🎙 9/15 1:59:00–2:02:19: 사회적 시계 예 — 입시 → 취업 → 결혼 → 이직·은퇴. 옛날 평균 결혼은 20대 후반, 요즘은 30대 초반도 늦지 않다.\n\n{| class=\"table\"\n! 통념 || 연구 (슬라이드)\n|-\n| 사회적 시계는 정해진 보편 시간표 || 문화나 시대에 따라 '''항상 변화'''\n|-\n| 40대 = 중년의 위기·좌절 || 40대에 그만한 사건이 '''자주 발생하지 않음''' (Hunter & Sundel, 1989)\n|}\n\n{warn}\nbank 객관식(옳지 않은 것): \"연구에 따르면 40대 중년기 전환기에는 심리적 위기를 일으키는 사건이 '''매우 자주''' 발생하므로 대부분이 큰 좌절을 겪는다\" ✗. 반대로 \"사회적 시계는 문화·시대에 따라 변한다\"는 '''맞는''' 보기.\n{/warn}\n\n{quiz}\n\"결혼·은퇴 같은 사회적 사건에 대해 문화적으로 선호하는 타이밍\"의 명칭은?\n{/quiz}\n{answer}\n'''사회적 시계'''(social clock). 통합요약 단답형 후보 19번.\n{/answer}\n\n== 관련 문서 ==\n* [[에릭슨의 심리사회적 발달 단계]] — 성인기 위기(친밀감·생산성)\n* [[비교문화심리학]] — 문화에 따라 달라지는 기준\n* [[3장 일생에 걸친 발달]] — p.37–38 절\n\n근거: 3장 p.37, 🎙 9/15"
 },
 "성공적 노화": {
  "title": "성공적 노화 (Successful Aging)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''성공적 노화'''(successful aging)는 3장 마지막 슬라이드(p.40) 아래 그림의 가운데 상자다. '''생물학적 영향·심리적 영향·사회문화적 영향''' 세 상자에서 화살표가 모여 \"성공적 노화\"를 가리킨다. 슬라이드 본문 글에는 이 명칭이 없고, 🎙 9/15 수업에서 교수가 그림을 짚으며 \"'''저 세 가지 요인이 다 갖춰져야 가능한 영역'''\"이라고 설명했다 — '''녹음 근거'''가 핵심인 문서다.\n\n{def}\n'''설명''': 낙관적 관점(심리적), 지속적인 대인 관계(사회문화적), 생물학적 영향의 세 가지 요인이 모두 갖춰져야 가능한, 노년기의 바람직한 적응 (3장 p.40 그림 + 🎙 9/15)\n'''명칭''': [[성공적 노화]] (Successful Aging)\n{/def}\n\n{analogy}\n성공적 노화는 '''세 다리 의자'''다. 한 다리는 몸(생물학적: 타고난 건강·영양), 한 다리는 마음(심리적: 낙관적 관점·활동적 생활), 한 다리는 사람(사회문화적: 가족·친구의 지지). 다리 하나만 짧아도 의자는 기우뚱한다 — 교수가 \"세 가지 '''다''' 갖춰져야\"를 강조한 이유. 서막의 [[생물심리사회적 접근법]]이 노년기 버전으로 다시 등장한 셈이다.\n{/analogy}\n\n[[img:L3-40.png|3장 p.40 — 위: 전날 다른 사람들과 함께 보낸 시간이 길수록 행복감(65세 이상이 18–29세보다 높음). 아래: 생물학적·심리적·사회문화적 영향 → 성공적 노화|large]]\n\n== p.40 그림의 세 영향 ==\n{| class=\"table\"\n! 영향 || 그림 속 항목 (p.40) || 🎙 교수 설명 (9/15 2:10–2:12)\n|-\n| '''생물학적''' || 인지적·신체적 조기 쇠퇴의 유전적 소인이 없음 · 적절한 영양 || \"상당히 '''타고나야''' 되는 부분\"\n|-\n| '''심리적''' || 낙관적 조망 · 신체적·심리적으로 활동적인 생활양식 || \"본인 스스로도 '''낙관적인 관점'''을 취할 수 있어야\"\n|-\n| '''사회문화적''' || 가족과 친구의 지지 · 노화에 대한 문화적 존중 · 안전한 삶의 조건 || \"홀로 있기보다 사람을 만나며 '''관계를 유지'''\" (경로당 예)\n|}\n\n<pre class=\"ascii\">\n   [생물학적 영향]          [심리적 영향]\n   유전적 소인 없음         낙관적 조망\n   적절한 영양              활동적 생활양식\n            ╲                ╱\n             ▶ '''[[성공적 노화]]''' ◀\n                    ▲\n          [사회문화적 영향]\n          가족·친구의 지지, 문화적 존중, 안전한 삶\n     → 셋 중 하나만으론 부족: '''모두''' 갖춰져야 (🎙)\n<\/pre>\n\n== 평생에 걸친 웰빙 (p.40 본문) ==\n* 사회적 관계에 의한 노년기의 행복:\n** 노인층은 '''애착 불안, 스트레스, 분노 등이 감소'''(Chopik et al., 2013).\n** 젊은 성인과 달리 '''삶의 좋은 일을 더 잘 기억'''(Addis et al., 2010).\n** 타인과의 관계에서 더 적은 문제를 보고하며 삶에 대한 만족감 보고(Crabtree, 2011).\n* 🎙 '이순(耳順, 60세)': 남들이 무슨 말을 해도 귀에 거슬리지 않는 나이 — 노년층 스트레스가 적다는 경험적 표현.\n\n{exam}\n🎙 9/15 2:10:27–2:11:30 교수: \"성공적인 노화라는 게 밑에 있는 그림처럼 '''저 세 가지 요인이 다 갖춰져야 가능한 영역'''.\" 통합요약 교수 강조 3장 마지막 항목. 정리본 표현: 세 요인 = '''낙관적 관점 · 지속적인 대인 관계 · 생물학적 영향'''.\n{/exam}\n\n{joke}\n🎙 교수가 들은 긍정심리학 교수님 말씀: \"75세까지 건강하게 지내는 건 '''노력'''으로 된다, 그 이상은 '''타고나야''' 한다. 그러니 일단 75세까지를 목표로.\" — 생물학적 영향이 \"타고나는 부분\"이라는 설명의 근거.\n{/joke}\n\n{warn}\n\"성공적 노화는 세 요인 중 '''하나만''' 충분하면 된다\" ✗. 또 \"노년층은 젊은 성인보다 스트레스·분노가 '''증가'''\" ✗ → 감소(p.40).\n{/warn}\n\n== 관련 문서 ==\n* [[생물심리사회적 접근법]] — 서막, 같은 세 수준 구조\n* [[에릭슨의 심리사회적 발달 단계]] — 노년기 통합감 vs 절망감\n* [[설단 현상]] — 같은 성인기의 인지 변화\n\n근거: 3장 p.40 그림 + 🎙 9/15 (정리본 4주차) — 명칭 자체는 슬라이드 본문이 아니라 그림·녹음 근거"
 },

   "메인"
  ],
  "body": "'''4장 감각과 지각'''은 \"'''우리가 본 것은 세상 그대로인가?'''\"라는 질문 하나로 42장의 슬라이드를 끌고 가는 장이다. 답은 '''아니다'''. 바깥 세계의 에너지를 받아들이는 [[감각과 지각의 구분|감각]](sensation) 위에, 그걸 체제화·해석하는 [[감각과 지각의 구분|지각]](perception)이 얹히고, 지각에는 감각 입력에서 출발하는 [[상향 처리]](bottom-up)와 경험·기대·맥락·동기·정서가 위에서 내려오는 [[하향 처리]](top-down)가 '''둘 다''' 끼어든다. 그래서 같은 자극도 사람과 상황에 따라 다르게 보이고, 들리고, 아프다.\n\n장의 흐름은 크게 넷이다.\n# '''감각의 문턱''' (p.2–8) — [[변환]], [[절대 역치]], [[점화]], [[신호 탐지 이론]], [[차이 역치]]와 [[베버의 법칙]], [[감각 순응]]. 여기까지가 \"상향 처리\" 파트.\n# '''기대가 지각을 바꾼다''' (p.9–19) — [[지각 갖춤새]], 가짜약·통증, [[음소 복원 효과]], [[맥락·동기·정서와 지각]], 그리고 풍경 속 얼굴 13개. 교수가 \"지금부터는 하향 처리\"라고 선을 그은 파트.\n# '''눈에서 뇌까지''' (p.20–27) — [[눈의 구조]], [[원추체와 간상체]], 분할 시야, [[자질 탐지기]], [[방추상 얼굴 영역]], [[병렬 처리]].\n# '''지각의 체제화와 감각 상호작용''' (p.28–42) — [[게슈탈트 심리학]], [[전경-배경]], [[집단화]], [[역투사의 문제]], [[깊이 지각]]([[양안 단서]]·[[단안 단서]]), 움직임 지각·[[모양 항등성]], [[맥거크 효과]], [[체화 인지]], [[공감각]], [[초감각지각]].\n\n페이지 번호는 '''인쇄 슬라이드 번호'''(총 42장, 숨김 슬라이드 없음)다. p.10·p.18·p.31 은 텍스트가 거의 없는 그림 슬라이드이고, p.18 은 아예 글자가 없다(풍경 속 얼굴 찾기). 수업은 9/22(화) 한 번에 42장을 다 나갔다.\n\n{analogy}\n4장 전체는 '''택배 물류센터'''로 보면 편하다. 트럭이 들고 오는 상자(빛·소리·냄새 = 에너지)를 하역장 직원(수용기)이 받아서 바코드(신경 신호)로 바꾸는 것이 [[변환|감각]]이고, 그 바코드를 보고 \"아, 이건 냉장식품이니 3번 라인\"이라고 분류·해석하는 것이 지각이다. 하역장에서 컨베이어를 타고 올라가는 흐름이 [[상향 처리]], 관리자가 \"오늘은 명절이라 선물세트가 많을 거야\"라는 '''예상'''을 갖고 분류 기준을 미리 바꿔 두는 것이 [[하향 처리]]다. 예상이 맞으면 일이 빨라지지만, 예상이 틀리면 엉뚱한 라인으로 보낸다 — 착시와 착각이 바로 그거다.\n{/analogy}\n\n{exam}\n통합요약 §0-1 의 '''4장 교수 강조''' 다섯 줄 (🎙 9/22). 시험 전날 이것만은 외우고 들어갈 것.\n# 역치가 낮다고 '''항상 좋은 건 아니다''' (슬라이드는 \"낮은 것이 유리\"라고 썼지만 교수가 정정) → [[절대 역치]]\n# 풍경 속 '''얼굴 13개''' 찾기 = '''하향 처리''' → [[하향 처리]]\n# '''통증'''은 하향 처리를 가장 '''극적으로''' 보여주는 예 → [[지각 갖춤새]]\n# '''게슈탈트는 타고난 상향 처리 쪽'''(\"많이 헷갈리기 좋은 부분\") → [[게슈탈트 심리학]], [[상향 처리]]\n# '''양안 단서(망막 부등·수렴) vs 단안 단서(5개)'''를 잘 구분해 둘 것 → [[양안 단서]], [[단안 단서]]\n{/exam}\n\n== 0. 이 장이 다른 장과 이어지는 곳 ==\n\n4장은 다른 장에서 배운 도구를 '''가장 많이 재활용'''하는 장이다. 반대로 4장에서 배운 개념이 5·6장에서 다시 나온다.\n\n{| class=\"table\"\n! 다른 장에서 배운 것 || 4장에서 쓰이는 곳\n|-\n| 서막 [[구조주의]] ([[빌헬름 분트]]: 부분의 합 = 전체) || p.28 [[게슈탈트 심리학]] \"전체는 부분의 합 '''이상'''\" — 정반대 입장으로 대비\n|-\n| 서막 [[기능주의]] (마음의 적응적 기능) || p.4 교수 해설 \"기능주의 차원에서 보면 역치가 낮은 게 좋겠죠… 근데 언제나 좋은 건 아니에요\"\n|-\n| 1장 [[가짜약 효과]] (가짜약 조건, 실험 설계) || p.12 가짜약 효과 = 기대가 적용된 '''하향 처리'''의 대표 사례\n|-\n| 2장 [[역치]]·[[활동 전위]]·[[실무율]] (발화율로 강도 표상) || p.4 [[절대 역치]](같은 단어 '역치'가 감각 쪽 의미로), p.8 [[감각 순응]] = 발화율 감소\n|-\n| 2장 [[분할 뇌]]·[[뇌량]] (좌시야→우반구) || p.25 분할 시야와 좌우반구 ('''⚠ 슬라이드 오타''')\n|-\n| 2장 [[연합 영역]]·[[이중 처리]] (FFA, 병렬 처리) || p.26 [[방추상 얼굴 영역]], p.27 [[병렬 처리]]\n|-\n| 2장 [[칵테일 파티 효과]]·[[선택적 주의]] || p.28 네커 육면체(한 번에 하나만), p.29 청각의 [[전경-배경]]\n|-\n| 3장 [[습관화]] (아기의 반복 자극 반응 감소) || p.8 [[감각 순응]]과 비슷한 현상 (단, 습관화는 '''행동''' 반응, 순응은 '''감각 기관''' 민감도)\n|-\n| 3장 [[감각 운동 단계]] (6~14개월 영아) || p.33 시각 절벽(깁슨 & 워크) — [[깊이 지각]]의 선천성\n|}\n\n{| class=\"table\"\n! 4장에서 배운 것 || 뒤 장에서 다시 나오는 곳\n|-\n| p.5 [[점화]] (먼저 본 자극이 뒤 처리를 바꿈) || 5장 p.14 · 6장 p.30 ([[인출 단서]]·[[암묵 기억]])\n|-\n| p.9 [[지각 갖춤새]] (기대) || 6장 [[오정보 효과]] — 질문이 기억을 바꾸는 것도 같은 하향 영향\n|-\n| p.8 [[감각 순응]] || 6장 [[감각 기억]] (감각 입력이 0.5~1초 머무는 곳)\n|}\n\n== p.1–2 — 감각 VS 지각, 상향 VS 하향 처리 ⭐⭐⭐ ==\n\n[[img:L4-02.png|p.2 감각 프로세스(아래) → 지각 프로세스(가운데) ← 고차 인지 기능(위). 아래→위 화살표가 상향 처리, 위→아래 화살표가 하향 처리|medium]]\n\n수업은 \"지각은 감각 정보를 기반으로 하지만 몇 가지가 더 개입하는 '''다채로운 인지 프로세스'''\"라는 말로 시작했다 (🎙 9/22).\n\n{| class=\"table\"\n! 구분 || 슬라이드 정의 (p.2) || 한 줄로\n|-\n| '''[[감각과 지각의 구분|감각]]''' (Sensation) || 외부 환경에서 입력된 정보를 감각 기관이 '''수용하고 표상'''하는 과정 || 받아들이기\n|-\n| '''[[감각과 지각의 구분|지각]]''' (Perception) || 감각 정보를 '''체제화하고 해석'''하는 과정 || 의미 붙이기 (= 경험)\n|-\n| '''[[상향 처리]]''' (Bottom-up) || 감각 수용기 → 고차 인지 기능으로 이어지는 처리 || 데이터에서 출발\n|-\n| '''[[하향 처리]]''' (Top-down) || '''경험과 기대'''에 기반하여 감각 입력을 체계화 || 머릿속 지식에서 출발\n|}\n\n지각은 '''두 처리 모두'''의 영향을 받는다. 상향 처리는 반드시 일어나야 하고(입력이 대뇌까지 올라와야 뭐든 본다), 해석 단계에서 관심사·기대·맥락이 경험을 바꾼다. 교수의 예: 슬라이드의 검은 글씨를 우리는 \"검은색\"이라고 '''합의'''할 뿐, 각자에게 실제로 어떻게 전달됐는지는 아무도 모른다. → 자세한 비교는 [[상향 처리와 하향 처리]].\n\n[[anim:top_down_faces|먼저 상향 처리만으로 풍경을 보고, \"얼굴을 찾아라\"는 기대가 생긴 뒤 얼굴이 하나씩 떠오르는 순간을 지켜볼 것. 마지막 중의적 그림까지 보고 p.9–10 으로]]\n\n== p.3 — 감각 정보의 변환 ⭐⭐ ==\n\n[[img:L4-03.png|p.3 감각 및 지각이 발생하는 과정 — 반사된 빛 → 망막의 전기·화학 신호 → 뇌의 시각 영역|medium]]\n\n[[변환]](Transduction) = 각 감각 에너지(시각=빛, 청각=공기 진동)를 '''두뇌가 이해할 수 있는 신경 신호'''로 바꾸는 것. 세 단계:\n# 전문화된 '''수용기'''가 감각 자극을 수용\n# 수용된 자극이 '''신경 활동'''(전기/화학)으로 전환\n# 신경 정보가 '''두뇌로 전달'''\n\n시각이라면 망막의 광수용기가 빛을 신호로 바꾸고, 후두엽 시각 피질까지 도달해야 비로소 \"봤다\"고 할 수 있다. 이 경로 전체는 p.20–25 에서 다시 풀린다.\n\n== p.4 — 역치와 절대 역치 ⭐⭐⭐ ==\n\n[[img:L4-04.png|p.4 자극 강도에 따른 탐지율 곡선 — 탐지율 50% 지점이 절대 역치, 그 아래 음영이 역치하 영역|medium]]\n\n* '''[[역치]]''': 생물체가 반응을 일으키는 데 필요한 자극의 '''최소 강도'''. (2장에서 뉴런 발화 쪽 의미로 먼저 나왔다.)\n* '''[[절대 역치]]''' (Absolute Threshold): 특정 자극의 '''탐지 비율이 0.5가 되는 지점'''. 자극 강도뿐 아니라 '''개인의 심리 상태'''에도 영향을 받는다(청력 검사 때 온 신경을 기울이면 역치가 낮아진다).\n* '''[[절대 역치|역치하 자극]]''' (subliminal): 탐지율 0.5 '''미만'''의 강도로 제시된 자극. 의식적으로 지각하지 못해도 '''심리 기제에 영향을 줄 수 있다''' → p.5 점화 연구가 증거.\n\n{exam}\n슬라이드: \"효율적 기능을 위해서는 절대 역치가 낮은 것이 유리\". 교수(🎙 9/22 12:07): \"'''낮은 게 언제나 좋은 건 아니에요.'''\" 모든 미세 자극을 다 받아들이면 정신적 자원(mental resource)에 하중이 걸려 정작 중요한 정보를 처리하지 못할 수 있다. OX·객관식 함정으로 나오기 좋다.\n{/exam}\n\n== p.5 — 점화 연구 ⭐⭐ ==\n\n[[img:L4-05.png|p.5 차폐 점화 어휘 판단 과제 — 커피(50ms) → ####(50ms) → 원두(1500ms), 점화어 시작부터 표적 시작까지가 SOA|medium]]\n\n[[점화]](Priming) = 특정 자극을 먼저 제시해 어떤 개념을 '''미리 활성화'''시키는 것. 의미·감각 등 다양한 속성으로 관련성이 생기고, 활성화된 속성이 '''나중 자극의 정보 처리'''에 영향을 준다(사과 → 배는 판단이 빠르고, 사과 → 하늘은 느림).\n\n점화 자극의 '''제시 시간'''을 짧게 하고 '''차폐 자극'''(####)으로 가리면 [[절대 역치|역치하 자극]]으로 만들 수 있다. 교수: 제시 시간이 길어지면 다른 인지 처리가 끼어들어 \"순수한 점화 효과\"라 하기 어려워서 '''약 43~50ms''' 로 짧게 제시하는 것을 권장한다 (🎙 9/22).\n\n== p.6 — 신호 탐지 이론 ⭐⭐⭐ ==\n\n[[img:L4-06.png|p.6 신호 탐지 이론 그래프 — 왼쪽 파란 노이즈 분포, 오른쪽 빨간 신호 분포, 가운데 세로선이 판단 기준선. 아래 2×2 표가 적중·놓침·오경보·정기각|large]]\n\n절대 역치가 사람과 상태마다 흔들린다면, \"그 사람은 '''어떤 기준'''으로 '있다'고 판단하는가\"를 따로 계산해야 한다. 그게 [[신호 탐지 이론]](Signal Detection Theory).\n\n{| class=\"table\"\n! || 신호 있음 || 신호 없음 (노이즈)\n|-\n| '''\"있다\"''' 반응 || [[신호 탐지 이론|적중]] (Hit) || [[신호 탐지 이론|오경보]] (False Alarm)\n|-\n| '''\"없다\"''' 반응 || [[신호 탐지 이론|놓침]] (Miss) || [[신호 탐지 이론|정기각]] (Correct Rejection)\n|}\n\n* '''[[신호 탐지 이론|민감도]](d′)''': 실제 신호와 노이즈를 '''구별할 수 있는 능력''' = 두 분포 피크 사이 거리.\n* '''편향성''': 신호가 있다고 판단하는 개인의 '''기준선''' — '''우측일수록 엄격, 좌측일수록 관대'''.\n* 청력 검사에서 활용, 경험·기대·각성 상태에 따라 변동.\n\n[[sim:signal_detection]]\n\n{warn}\n기준선을 오른쪽(엄격)으로 옮기면 '''적중과 오경보가 둘 다 줄어든다'''. \"적중은 늘고 오경보만 준다\"는 보기는 함정. 그리고 기준선을 아무리 움직여도 '''민감도(d′)는 그대로'''다 — 민감도는 두 분포 사이 거리이지 기준선 위치가 아니다.\n{/warn}\n\n== p.7 — 차이 역치와 베버의 법칙 ⭐⭐⭐ ==\n\n[[img:L4-07.png|p.7 차이 역치 — 글자 굵기·크기가 아주 조금씩 다른 시편 23편 텍스트. 어디서 달라지는지 알아채는 최소 차이가 JND|small]]\n\n* '''[[차이 역치]]''' (difference threshold) = '''[[차이 역치|최소식별차이]]''': 두 자극이 다르다는 것을 탐지할 확률이 '''0.5'''가 되는 '''최소 차이값'''.\n* '''[[베버의 법칙]]''' (Weber's Law): 두 자극의 차이를 지각하려면 '''절대적 양이 아닌, 일정 비율 단위'''로 변해야 한다. 식으로는 $\\Delta I / I = k$.\n\n교수 예시 (🎙 9/22 23:16): 100kg 가방이 10% 늘어야 무겁다고 느끼는 사람이라면 → '''110kg''', 그다음은 110의 10% = 11kg 더해서 '''121kg'''.\n\n[[sim:weber_law]]\n\n{quiz}\n110kg 가방을 든 사람(k = 10%)이 \"더 무겁다\"고 느끼려면 가방은 최소 몇 kg 이 되어야 하나? ① 111 ② 115 ③ 120 ④ 121\n{/quiz}\n{answer}\n'''④ 121kg'''. ③ 120kg 은 \"매번 10kg 씩\"이라는 '''절대량''' 오개념이다. 베버의 법칙은 '''비율'''이다.\n{/answer}\n\n== p.8 — 감각 순응 ⭐⭐⭐ ==\n\n[[img:L4-08.png|p.8 감각 순응의 예시(후각) — 노출 초기엔 냄새 반응 강도 막대가 높고, 지속 노출 후엔 낮다. 아래는 자극 강도에 따른 뉴런 발화율 차이|medium]]\n\n[[감각 순응]](Sensory adaptation) = 자극의 '''반복 노출'''로 인한 감각 기관의 '''민감도 감소'''. 목적은 새롭거나 더 중요한 대상에 주의를 집중하기 위함 → 외부 자극을 그대로가 아니라 '''개인의 필요성에 맞게''' 지각한다.\n\n신경 수준: 뉴런은 '''활동 전위 크기가 아니라 [[활동 전위|발화율]]'''의 변화로 자극 강도를 표상한다(2장 [[실무율]]). 순응하면 발화율이 줄고 → 신경 표상이 약해져 → 지각도 약해진다. 교수: 오감 중 '''후각'''이 순응이 가장 빠르다(디퓨저 냄새).\n\n== p.9–13 — 지각 갖춤새: 기대가 지각을 바꾼다 ⭐⭐⭐ ==\n\n교수 (🎙 9/22 29:03): \"'''지금까지는 상향 처리, 지금부터는 하향 처리.'''\"\n\n[[img:L4-09.png|p.9 지각 갖춤새의 예시(가로 VS 세로) — 가운데 글자가 가로로 읽으면 A-B-C 의 B, 세로로 읽으면 12-13-14 의 13|small]]\n\n[[지각 갖춤새]](Perceptual set) = '''경험에 근거한 특정 지각에 대해 형성되는 기대'''. 사전에 제시된 환경적 맥락에 따라 지각 경험이 달라지며, '''하향 처리의 대표적 예시'''다.\n\n[[img:L4-10.png|p.10 중의적 그림 3장 — 왼쪽(귀부인이 뚜렷)이나 오른쪽(할머니가 뚜렷)을 먼저 보면 가운데 같은 그림의 해석이 그쪽으로 기운다|large]]\n\np.10 은 [[지각 갖춤새|중의적 그림]]. 명확한 '''젊은 귀부인''' 그림을 먼저 보면 가운데 그림이 귀부인으로, '''할머니''' 그림을 먼저 보면 할머니로 보인다. 먼저 본 그림이 기대를 만든다 (🎙 9/22 31:35).\n\n[[img:L4-11.png|p.11 미각의 지각 갖춤새 — 프랜차이즈 로고 봉투의 감자튀김 vs 흰 봉투의 감자튀김, 그리고 '원효대사 해골물'의 해골|medium]]\n\n시각만이 아니다.\n* '''미각''': 유명 프랜차이즈 로고가 새겨진 봉투의 감자튀김을 더 맛있다고 느낌(Robinson et al., 2008) → '''블라인드 테스트'''를 하는 이유. \"원효대사 해골물\"도 같은 얘기.\n* '''청각''': '''[[지각 갖춤새|말 분절]]'''(Speech Segmentation) — 연속된 말소리 안에서 단어의 시작과 끝을 구분하는 능력. 모국어 지식이 있어야 가능한 하향 처리(러시아어는 분절이 안 된다).\n\n[[img:L4-12.png|p.12 플라시보 효과 예시(디카페인 커피) — 디카페인인 걸 알고 마신 경우 vs 카페인 커피라고 속고 마신 경우|medium]]\n\np.12 [[가짜약 효과]](Placebo) — 사람의 '''기대치(Expectation)'''가 적용된 하향 처리의 대표 사례(디카페인 커피, Dawkins et al., 2011). '''가짜약 조건''' = 처치를 받았다고 참가자가 착각하게 만드는 조건 → '인지' 효과인지 '처치' 효과인지 비교할 수 있다(1장 실험 설계와 연결).\n\n[[img:L4-13.png|p.13 인지 및 주의에 따른 촉각(통각) 경험 — 모기 물린 걸 모를 때 / 알아챘을 때 / 긁기 시작할 때|medium]]\n\np.13 '''[[지각 갖춤새|통증 지각]]'''. 기대나 주의가 통지각을 바꾼다(Wiech et al., 2008). 2차 세계대전 '''부상병'''들은 중상인데도 통증을 잘 못 느꼈다(Beecher, 1959) → 통증을 '''상향 처리''' 중심으로 설명하던 '''직접 경로 모형'''이 반박됐다. 가상현실 게임으로 주의를 분산하면 '''화상 환자'''의 통지각이 '''감소'''(Hoffman et al., 2008).\n\n{exam}\n교수 (🎙 9/22 39:45): 기대치에 따른 하향식 지각 경험의 대표 사례가 가짜약이고, \"그걸 더 '''극적으로''' 보여준 게 저 '''통증''' 관련 연구\". 예방접종 때 \"따끔해요\" 하면서 시선을 돌리라는 이유 = 주의가 쏠리면 더 아프다.\n{/exam}\n\n== p.14–17 — 맥락·동기·정서에 따른 지각 차이 ⭐⭐ ==\n\n[[img:L4-14.png|p.14 맥락의 영향력 — 얼굴만 잘라 보면 모호한 표정이, 우승 축하 장면 전체 맥락에서는 기쁨으로 읽힌다|medium]]\n\n* '''맥락''' (p.14): \"eel is on the wagon\" → '''wheel''', \"eel is on the orange\" → '''peel''' (Grossberg, 1995). 사라진 소리를 맥락으로 메워 듣는 [[음소 복원 효과]]와 연관.\n\n[[img:L4-15.png|p.15 문화권에 따른 그림 해석의 차이 — 동아프리카: 여성이 금속 상자를 머리에 이고 있다 / 서구: 여성이 창문 밑에 앉아 있다|medium]]\n\n* '''문화''' (p.15, Gregory & Gombrich, 1973): 같은 그림을 '''동아프리카'''는 \"여성이 금속 상자를 머리에 이고 있다\", '''서구권'''은 \"여성이 창문 밑에 앉아 있다\"로 해석.\n* '''동기''' (p.16): 과업 목표나 결핍에 따른 [[변연계|추동]]이 지각을 편향. '''갈증''' 상태면 물병이 더 '''가깝게'''(Balcetis & Dunning, 2010), '''무거운 배낭'''·'''피곤'''하면 거리가 더 '''멀게''' 지각(Burrow et al., 2016).\n* '''정서''' (p.17): '''슬픈 음악'''을 들으면 발음이 비슷한 단어를 더 부정적으로 — Mourning/Morning, Dye/Die, Pane/Pain (Halberstadt et al., 1995). 신나는 음악은 행복한 단어의 재인 촉진(Tay & Ng, 2019).\n\n[[img:L4-16.png|p.16 개인의 내적 상태에 따른 거리감 지각 — 피곤하지 않은 상태 vs 피곤한 상태에서 같은 언덕길이 다르게 느껴진다(Burrow et al., 2016)|small]]\n\n→ 네 가지 요인 전부를 한 문서로 묶은 것이 [[맥락·동기·정서와 지각]].\n\n{joke}\n교수 예시 (🎙 9/22): DGIST 정문에서 '''내려갈 때'''와 '''올라올 때''' 거리가 다르게 느껴지는 것, 그리고 '''중간고사 분량이 막막하게 느껴지는 것'''도 동기 상태에 따른 지각 차이. 이 위키를 읽는 지금 분량이 많아 보인다면, 그것도 하향 처리다.\n{/joke}\n\n== p.18–19 — 풍경 속 얼굴 찾기 (정답 13개) ⭐⭐ ==\n\n[[img:L4-18.png|p.18 (텍스트 없음) \"이 풍경 그림에서 얼굴처럼 보이는 것을 찾아보라\" — 처음엔 바위·나무·말 탄 사람만 보인다|large]]\n\n[[img:L4-19.png|p.19 정답: 13개 — 빨간 사각형이 숨은 얼굴의 위치. 바위·나무 줄기·물살 속에 얼굴이 있다|large]]\n\n교수의 시연: \"'''얼굴처럼 보이는 자극을 찾아라'''\"라는 안내 하나가 '''기대'''를 만들고, 그 기대가 [[하향 처리]]를 작동시킨다. 처음엔 안 보이던 얼굴도 주의를 다시 기울이면 얼굴로 조직화돼 보인다. 교수 본인도 \"10개 정도 찾았고 … '''솔직히 아직도 몇 개는 모르겠어요'''\" (🎙 9/22 56:43), 오전 인지심리학 수강생들도 다 못 찾았다.\n\n{exam}\n'''얼굴 13개 그림 = 하향 처리'''. \"풍경 그림에서 얼굴을 찾으라는 지시를 받은 뒤 얼굴이 보이기 시작했다 — 어떤 처리?\" → 하향 처리(지각 갖춤새). 상향 처리라고 쓰면 오답.\n{/exam}\n\n== p.20–22 — 빛과 눈의 구조 ⭐⭐⭐ ==\n\n[[img:L4-20.png|p.20 가시광선 대역 — 전자기 스펙트럼 중 아주 좁은 띠만 보인다. 아래 파형: 파장이 길고 짧음(색), 진폭이 크고 작음(밝기)|medium]]\n\n* 물체가 반사한 빛 에너지를 수용. '''파장 → 색상''', '''진폭 → 강도(밝기)'''.\n* '''장파장(=저주파) → 붉은색''', '''단파장(=고주파) → 푸른색'''. 진폭 크다 = 밝다, 작다 = 어둡다.\n\n[[img:L4-21.png|p.21 안구의 구조 — 각막·동공·홍채·수정체, 뒤쪽 망막의 중심와(상이 가장 선명)와 시신경이 나가는 맹점|medium]]\n\n[[눈의 구조]] 요약 (p.21–22):\n{| class=\"table\"\n! 기관 || 역할 || 기억 포인트\n|-\n| [[눈의 구조|동공]] || 빛이 통과하는 구멍 ||\n|-\n| [[눈의 구조|홍채]] || 동공의 크기를 조절 || 밝고 어두운 공간을 '''상상'''만 해도 조절됨(Laeng & Sulutvedt, 2014)\n|-\n| [[눈의 구조|망막]] || 반사된 빛이 상을 형성, 광수용기(간상체·원추체)로 구성 || 상은 '''뒤집혀''' 맺힌다 → 대뇌가 보정\n|-\n| [[눈의 구조|중심와]] || 상이 가장 선명하게 맺히는 곳 || 원추체 밀집\n|-\n| [[눈의 구조|맹점]] || 시신경이 나가는 자리라 상이 맺히지 않음 ||\n|-\n| [[눈의 구조|수정체]] || 굴절 정도를 조절해 망막에 상을 맺게 하는 렌즈 || 굴절력 약함 = '''[[눈의 구조|원시]]'''(망막 뒤), 강함 = '''[[눈의 구조|근시]]'''(망막 앞)\n|-\n| [[눈의 구조|시신경]] || 광수용기가 변환한 신경 신호를 대뇌로 전달 ||\n|}\n\n[[anim:transduction_vision|빛이 수정체에서 꺾여 망막에 거꾸로 맺히고, 원추체·간상체 → 양극세포 → 시신경 → 시각 피질로 가는 길을 끝까지 따라갈 것. 중심와와 맹점 위치도 확인]]\n\n== p.23–24 — 원추체와 간상체 ⭐⭐⭐ ==\n\n[[img:L4-23.png|p.23 망막 내 시신경 구조 — 빛은 망막 안쪽 층을 지나 맨 뒤의 간상체·원추체에 닿고, 신호는 양극세포 → 신경절세포 → 시신경으로 거꾸로 나온다|medium]]\n\n[[img:L4-24.png|p.24 원추체와 간상체의 비교 표 — 개체 수·망막 상 위치·약한 빛 민감도·색채 민감도·세부사항 민감도|medium]]\n\n{| class=\"table\"\n! || [[원추체와 간상체|원추체]] (cone) || [[원추체와 간상체|간상체]] (rod)\n|-\n| 개체 수 || '''600만''' 개 || '''1억 2천만''' 개\n|-\n| 망막 상 위치 || '''중앙''' || '''주변'''\n|-\n| 약한 빛 민감도 || 낮다 || '''높다'''\n|-\n| 색채 민감도 || '''높다''' || 낮다\n|-\n| 세부사항 민감도 || '''높다''' || 낮다\n|-\n| 활동 시간 (p.23) || 낮 || 석양 무렵\n|-\n| 두뇌 연결 (p.23) || '''핫라인''' 있음 (개별 신호 전달) || 핫라인 없음 (여러 뉴런 신호 '''합산''')\n|-\n| 관련 현상 || 색·세부 지각 || '''[[원추체와 간상체|암순응]]'''\n|}\n\n'''[[원추체와 간상체|양극세포]]'''(bipolar cell): 원추체·간상체에서 받은 신호를 시신경으로 전달한다.\n\n== p.25 — 분할 시야와 좌우반구 ⭐ ==\n\n[[img:L4-25.png|p.25 좌우시야의 대뇌 전달 과정 — 시신경이 시교차에서 일부 교차해 반대쪽 후두엽으로 간다|medium]]\n\n대뇌는 좌·우반구로 나뉘고 [[뇌량]]으로 연결. 뇌량이 끊어지면 각 시야 간 정보 의사소통이 원활하지 않다(2장 [[분할 뇌]]). 시각 정보는 '''후두엽의 시각 피질'''에서 처리된다.\n\n{warn}\n'''슬라이드 오류''': p.25 본문은 \"좌시야의 입력 정보는 우반구로, 우시야의 입력 정보는 '''우반구'''로 전달\"이라고 적혀 있다. '''틀렸다.''' 올바른 내용은 '''우시야 → 좌반구''' (2장 p.29 와 일치, 정리본·교수 설명도 좌반구). 교수는 3장 수업 때 분할뇌 실험을 다시 상기했다 — 우시야(좌반구)에 제시된 단어는 말로 보고, 좌시야(우반구)는 말은 못 하고 손으로 가리킨다.\n{/warn}\n\n== p.26–27 — 자질 탐지와 병렬 처리 ⭐⭐⭐ ==\n\n[[img:L4-26.png|p.26 위: 고양이 시각 피질에서 특정 기울기 막대에만 반응하는 뉴런 / 아래: 방추상 얼굴 영역(FFA)의 위치와, 얼굴에 강하고 다른 사물엔 약한 반응 막대|medium]]\n\n* '''[[자질 탐지기]]''': 물리적 특성(각도, 움직임 등)에 반응하는 두뇌의 각 신경세포. 발화 패턴을 종합해 지각을 수행하고, '''상위 세포 군집일수록 더 복잡한 패턴'''에 반응한다.\n* '''[[방추상 얼굴 영역]]'''(Fusiform Face Area, FFA): '''얼굴 자극의 재인'''(Gorno-Tempini & Price, 2001). 손상 시 '''[[방추상 얼굴 영역|얼굴실인증]]'''. FFA에 경두개 자기장 자극술(TMS)을 쓰면 얼굴 재인 저하(McKone et al., 2007). 장소·공간은 '''[[방추상 얼굴 영역|PPA]]'''(parahippocampal place area).\n\n[[img:L4-27.png|p.27 지각의 발생 과정 — ① 시각 입력 → ② 망막 처리 → ③ 자질 탐지 → ④ 병렬 처리 → ⑤ 재인|medium]]\n\n* '''[[병렬 처리]]'''(Parallel processing): 여러 작업을 '''동시에'''. 움직임·형태·깊이 등 하위 차원을 동시에 처리하고 담당 영역에서 통합 → 지각. 교수: \"뇌 영역 차원에서 보면 '''조별 과제'''\" (🎙 9/22 1:16:35).\n\n== p.28–31 — 지각의 체제화: 게슈탈트 ⭐⭐⭐ ==\n\n[[img:L4-28.png|p.28 지각의 조직화 예시(네커 육면체) — 검은 Y자 조각들만 있는데 흰 정육면체가 보인다|medium]]\n\n[[게슈탈트 심리학]](Gestalt Psychology): [[구조주의]]의 영향을 일부 받았지만 결정적으로 다르다 — '''전체는 단순한 부분의 총합 그 이상'''. 입력을 그대로 표상하는 게 아니라 그 이상의 해석을 가미해 지각을 구성한다. '''[[게슈탈트 심리학|네커 육면체]]'''는 선택적 주의에 따라 '''한 번에 하나의 해석만''' 볼 수 있다(Bradley et al., 1976).\n\n[[img:L4-29.png|p.29 가역적 전경과 배경 — 검은 두 얼굴이 마주 보는지, 가운데 흰 잔인지|small]]\n\n* '''[[전경-배경]]'''(Figure-Ground): 지각의 '''1차 과제'''는 대상(전경)을 배경에서 분리하는 것. 관계는 '''바뀔 수 있고''', 주의에 따라 변한다. 청각에서도(배경음 속 상대 말소리 = [[칵테일 파티 효과]]).\n\n[[img:L4-30.png|p.30 집단화의 세 가지 원리 — (a) 근접성: 선 6개가 3쌍 (b) 연속성: 곡선과 직선이 교차해도 두 선 (c) 폐쇄: 끊긴 원 조각들로 흰 삼각형|medium]]\n\n* '''[[집단화]]'''(Grouping): 배경에서 분리된 전경을 의미 있는 형태로 조직화. 세 원리:\n** '''[[집단화|근접성]]''': 가까이 있는 사물을 묶어서 지각\n** '''[[집단화|연속성]]''': 부드럽게 연속된 패턴을 하나로 지각 (올림픽 오륜기)\n** '''[[집단화|폐쇄]]''': 완전한 형태 구성을 위해 끊어진 부분을 메꿈\n* 집단화 원리는 '''유아도''' 사용(Gallace & Spence, 2011), 게슈탈트 원리는 '''내재된, 타고난 것'''(Wertheimer, 1912).\n\n[[anim:gestalt_grouping|꽃병↔두 얼굴 반전 → 근접성 → 연속성(오륜기) → 폐쇄 순서로 본 뒤, 마지막 요점 \"타고난 원리\"를 소리 내어 읽을 것]]\n\n[[img:L4-31.png|p.31 집단화 사진 — 언뜻 자연스러운 목조 집 골격 사진이지만, 기둥 앞뒤 관계가 말이 안 되는 곳이 여럿 있다|medium]]\n\np.31 은 이상한 사진 찾기. 처음엔 이상함을 못 느끼는데, 집단화·조직화가 '''자동으로 보정'''해 버리기 때문이다.\n\n{exam}\n교수 (🎙 9/22 1:26:56): \"설명 방식만 봐서는 상당히 '''헷갈리실 수 있는 부분'''인데, 게슈탈트 심리학은 지각 과정을 설명하는 데 있어서 '''하향 처리보다는 상향 처리'''의 영향력을 더 강조하는 쪽이에요.\" 이유 두 가지 — ① 집단화 원리는 경험·후천적 환경이 아니라 '''원래부터 내재'''된 것, ② 가장 하위 차원(부분)에서 시작해 전체로 이어진다. \"이건 많이 헷갈리기 좋은 부분이라 좀 더 깊게 설명했다.\"\n{/exam}\n\n== p.32 — 3차원 정보와 역투사의 문제 ⭐⭐⭐ ==\n\n[[img:L4-32.png|p.32 위: 3차원 착시 현상 예시(도로에 그린 횡단보도·사람) / 아래: 삼각기둥·원뿔·삼각뿔이 모두 같은 삼각형 그림자를 만든다|medium]]\n\n망막에 맺힌 상은 '''2차원'''이다. 여러 보정 작업을 거쳐 3차원으로 지각한다. 그런데 하나의 2차원 상을 만들 수 있는 근원 물체는 하나가 아니다 → '''[[역투사의 문제]]'''(inverse projection problem). 삼각형 그림자 하나 → 삼각기둥·원뿔·삼각뿔 모두 가능.\n\n== p.33–36 — 깊이 지각: 시각 절벽, 양안 단서, 단안 단서 ⭐⭐⭐ ==\n\n[[img:L4-33.png|p.33 유아의 시각 절벽 실험(깁슨 & 워크, 1960) — 유리판 아래 체크무늬가 뚝 떨어지는 쪽으로 아기가 기어가지 않는다|medium]]\n\n[[깊이 지각]](Depth perception)의 '''선천성''': '''[[깊이 지각|시각 절벽]]'''(깁슨 & 워크, 1960)에서 '''6~14개월''' 유아는 엄마가 불러도 절벽 쪽으로 건너지 않는다. 기어 다니기 시작한 유아는 시기와 무관하게 높이를 조심하고(Adolph et al., 2014), 대부분의 '''동물 새끼'''도 시각 절벽을 건너지 않는다 → '''생존과 관련된 기제'''.\n\n[[img:L4-34.png|p.34 양안 단서 효과의 예시 — 볼펜 끝 맞추기, 아래는 가까운 물체를 볼 때 두 눈이 안쪽으로 모이는 수렴|medium]]\n\n* '''[[양안 단서]]'''(Binocular cue): 양안 사용에 의존하는 깊이 단서.\n** '''[[망막 부등]]'''(Retinal disparity): 두 망막 이미지의 차이를 계산해 깊이 지각 — '''차이가 클수록 가까이'''.\n** '''[[양안 단서|수렴]]''': 가까운 사물에 초점을 맞출 때 두 눈의 '''내각''' — 가까울수록 눈이 많이 모인다.\n\n[[anim:binocular_cues|물체가 다가오면 두 망막 상의 차이와 두 시선의 내각이 함께 커지는 것을 보고, 마지막 \"한 눈 감고 볼펜 맞추기 실패\"까지 확인할 것]]\n\n[[img:L4-35.png|p.35 단안 단서의 예시 1–3 — ① 중첩(사슴이 서로 가림) ② 상대적 운동(기차 창밖) ③ 상대적 높이|medium]]\n\n[[img:L4-36.png|p.36 단안 단서의 예시 4–5 — ④ 선형 조망(한 점으로 모이는 도로) ⑤ 상대적 크기(가까운 사람 vs 먼 사람)|medium]]\n\n* '''[[단안 단서]]'''(Monocular cue): 각 눈이 독자적으로 쓸 수 있는 단서 '''5개''':\n{| class=\"table\"\n! 단서 || 내용 (p.35–36)\n|-\n| [[단안 단서|중첩]] || 한 대상이 다른 대상을 부분적으로 가리면, 가리는 쪽이 '''더 가깝다'''\n|-\n| [[단안 단서|상대적 운동]] || 우리가 움직이면 정지 물체도 움직이며, '''가까울수록 더 빨리''' 움직인다\n|-\n| [[단안 단서|상대적 높이]] || 더 높은 물체를 '''더 멀리''' 있다고 지각\n|-\n| [[단안 단서|선형 조망]] || 평행선이 멀어지면 한 점으로 수렴, '''수렴 정도가 클수록''' 지각된 거리 증가\n|-\n| [[단안 단서|상대적 크기]] || 비슷한 크기라면 '''더 작은 망막 상'''을 멀리 있는 것으로\n|}\n\n{exam}\n교수 (🎙 9/22 1:47:42): \"'''양안 단서랑 단안 단서의 유형을 잘 구분을 해두시는 게 좋고요.'''\" 양안 = '''망막 부등·수렴 (2개)''', 단안 = '''중첩·상대적 운동·상대적 높이·선형 조망·상대적 크기 (5개)'''. \"단안 단서가 아닌 것은?\" → '''수렴'''.\n{/exam}\n\n{warn}\n'''수렴'''이라는 단어가 두 번 나온다. p.34 양안 단서의 '''수렴'''(두 눈의 내각)과 p.36 선형 조망 설명 속 \"평행선이 한 점으로 '''수렴'''\". 앞의 것만 단서 이름이다. 선형 조망은 '''단안''' 단서.\n{/warn}\n\n== p.37 — 움직임 지각과 달 착시 ⭐⭐ ==\n\n[[img:L4-37.png|p.37 움직임과 모양 항등성 — 같은 속도로 움직여도 큰 차(버스)는 느려 보이고 작은 차는 빨라 보인다|medium]]\n\n=== 움직임 지각 ===\n{def}\n'''설명''': 지각에서 움직임 역시 하나의 중요 요소. 사물이 작아지면 멀어지고 커지면 다가온다고 지각하며, 동일한 속도로 움직일 때 큰 사물이 더 느린 것처럼 지각 (4장 p.37)\n'''명칭''': [[4장 감각과 지각|움직임 지각]] (Motion perception)\n{/def}\n* 사물이 '''작아지면 멀어지고''', '''커지면 다가온다'''고 지각.\n* '''동일한 속도'''로 움직일 때 '''큰 사물이 더 느린''' 것처럼 지각 (교수 예: 코끼리 vs 작은 동물).\n* 지각한 크기와 지각한 거리 간의 상호작용이 착시를 설명한다.\n\n=== 달 착시 ===\n{def}\n'''설명''': 달이 수평선에 가까이 있을 때 더 크게 보이는 현상 (4장 p.37)\n'''명칭''': [[4장 감각과 지각|달 착시]] (Moon illusion)\n{/def}\n지각한 크기와 지각한 거리의 상호작용으로 설명되는 대표적 착시. 망막에 맺히는 달의 크기는 하늘 꼭대기에 있을 때와 똑같은데, 지평선 근처에서는 \"멀리 있는 것\"으로 판단되어 더 크게 보정된다.\n\n== p.38 — 모양 항등성 ⭐⭐⭐ ==\n\n[[img:L4-38.png|p.38 움직임과 모양 항등성 — 닫힌 문, 반쯤 열린 문, 거의 다 열린 문. 망막 상은 직사각형 → 사다리꼴 → 가는 띠로 바뀌지만 우리는 같은 직사각형 문으로 본다|medium]]\n\n[[모양 항등성]](Shape constancy): 움직임에 따라 투영되는 모양이 바뀌어도 '''이전과 동일하게 지각'''하는 특성. 사람은 관점이 바뀌어도 같은 사물로 보지만, '''컴퓨터'''는 각도 변화에 따른 동일 대상 판단이 매우 약하다(O'Toole et al., 2007; Simonyan et al., 2013). 교수: 안면 인식은 '''45도만 돌려도''' 같은 사람으로 판단 못 한다 → 출국 심사 카메라를 정면으로 보라는 이유. 시사점: 지각은 단순한 사물의 투영이 아니라 '''감각 정보의 재조직화'''.\n\n== p.39–40 — 감각 상호작용, 체화 인지, 공감각 ⭐⭐⭐ ==\n\n[[img:L4-39.png|p.39 맥거크 효과의 예시(McGurk & MacDonald, 1976) — 입모양 「가」 + 소리 「바」 → 들리는 것은 「다」|medium]]\n\n=== 감각 상호작용 ===\n{def}\n'''설명''': 하나의 감각이 다른 감각에 영향을 주는 것. 예: 비염이나 감기로 코가 막히면 맛이 덜하게 느껴짐 (4장 p.39)\n'''명칭''': [[맥거크 효과|감각 상호작용]] (Sensory interaction)\n{/def}\n* '''미각–후각 상호작용''' (4장 메인 담당): 코막힘 → 맛이 덜함. 교수: 와인 소믈리에가 시음 전에 향부터 맡는 이유.\n* '''시각–청각 상호작용''': '''[[맥거크 효과]]'''(McGurk effect) — 입모양과 소리의 언어 정보가 다를 때 '''전혀 다른 제3의 언어 정보'''를 지각. 독순술도 하나의 듣기 형태.\n\n[[img:L4-40.png|p.40 체화 인지의 양상 — 신체 감각 회로와 인지 회로가 서로 화살표로 이어진다|small]]\n\n* '''[[체화 인지]]'''(Embodied cognition): 신체 감각의 두뇌 회로와 인지 두뇌 회로의 상호작용. 신체적 따뜻함 → 사회적 따뜻함(Fetterman et al., 2018), 단단한 의자 → 더 엄정한 평가(Schaefer et al., 2018).\n* '''[[공감각]]'''(synesthesia) 경험: 하나의 감각을 경험할 때 다른 감각 경험을 함께 겪음(Ranzini & Girelli, 2019). 예: 숫자 4는 빨강, 7은 노랑.\n\n== p.41–42 — 초감각지각 ⭐⭐ ==\n\n[[img:L4-41.png|p.41 초감각지각의 종류 — 천리안, 예지, 독심술(텔레파시)|small]]\n\n[[초감각지각]](Extrasensory perception, ESP): '''감각 입력 없이''' 지각이 일어날 수 있다는 주장. 텔레파시·천리안·예지. 기억 회상을 통한 감각 경험과는 구분. 미국인 절반이 믿음(Gecewicz, 2018). 의외로 과학적 검증이 시도되는 영역(Cardena, 2018).\n\np.42 '''린드버그 유괴사건''' 예지몽: 제보자 '''1300명''' → 아이의 죽음과 관련된 꿈 '''5%''' → 위치까지 맞춘 사람 '''단 4명'''(Murray & Wheeler, 1937). 수많은 표본 중에 '''우연의 일치'''는 발생할 수밖에 없다(1장 [[무선적 사건에서의 질서 지각]]과 같은 논리).\n\n== 🎙 실제 수업 기록 ==\n\n녹음: `심리학 여행 0922.txt` (9/22 화, 134분 47초). 지각 전반부 약 59분, 휴식 후 시각 후반부(1:00~), 시험 공지 2:09:48부터. 슬라이드 42장을 한 번에 다 나갔다.\n\n{| class=\"table\"\n! 시각 || 내용 || 문서\n|-\n| 00:36~07:22 || 감각/지각 구분, 상향·하향. \"지각은 경험이고 인지심리학적으로 주관적\" || [[감각과 지각의 구분]], [[상향 처리와 하향 처리]]\n|-\n| 12:07 || '''역치는 낮은 게 무조건 좋지 않다''' (슬라이드 정정) || [[절대 역치]]\n|-\n| 13:32~18:14 || 점화·역치하 자극, 사과–배, 43~50ms 제시 권장 || [[점화]]\n|-\n| 18:14~22:45 || 신호 탐지 이론: 피크 거리=민감도, 판단선 오른쪽=엄격/왼쪽=관대, 청력 검사 || [[신호 탐지 이론]]\n|-\n| 23:16~24:23 || 베버의 법칙 100 → 110 → 121kg || [[베버의 법칙]]\n|-\n| 25:27~28:20 || 감각 순응: 후각이 가장 빠름, 발화율로 강도 표상 || [[감각 순응]]\n|-\n| 29:03~34:59 || \"지금부터 하향 처리\" — 가로/세로 B·13, 귀부인·할머니 그림 || [[지각 갖춤새]]\n|-\n| 34:59~39:45 || 감자튀김 봉투, 블라인드 테스트, 원효대사 해골물, 말 분절(러시아어) || [[지각 갖춤새]]\n|-\n| 39:45~43:43 || '''통증 = 하향 처리의 극적인 예''', 부상병, 직접 경로 모형, 모기·예방접종 || [[지각 갖춤새]]\n|-\n| 43:43~51:03 || 배구 선수 표정, 음소 복원, 동아프리카 vs 서구, 장면 도식 + 아이트래킹 || [[음소 복원 효과]], [[맥락·동기·정서와 지각]]\n|-\n| 51:03~55:08 || 갈증-물병, 배낭·피곤, 학교 정문, 중간고사 분량, 슬픈 음악 || [[맥락·동기·정서와 지각]]\n|-\n| 55:08~58:49 || '''풍경 속 얼굴 13개''' 시연 — 교수도 10개 정도 || [[하향 처리]]\n|-\n| 1:00:52 || 홍채는 상상만으로도 조절된다 || [[눈의 구조]]\n|-\n| 1:02:51~1:05:40 || 뒤집힌 상의 보정, 원시/근시(볼록/오목렌즈) || [[눈의 구조]]\n|-\n| 1:05:40~1:09:28 || 원추체 핫라인, 간상체 합산·암순응, 양극세포 || [[원추체와 간상체]]\n|-\n| 1:10:18 || 분할 시야 실험 재소개 || [[분할 뇌]]\n|-\n| 1:12:22~1:16:21 || 고양이 단일 뉴런, FFA/PPA, 겹친 얼굴·장소 사진과 주의 || [[자질 탐지기]], [[방추상 얼굴 영역]]\n|-\n| 1:16:35~1:18:07 || 병렬 처리 \"조별 과제\", 분산 표상 || [[병렬 처리]]\n|-\n| 1:18:07~1:23:04 || 게슈탈트 vs 구조주의, 네커 육면체(\"데커\"로 발음), 잔/두 얼굴 || [[게슈탈트 심리학]], [[전경-배경]]\n|-\n| 1:24:10~1:28:47 || 집단화 3원리(젓가락·오륜기·흰 삼각형), '''게슈탈트 = 상향 중심''' || [[집단화]], [[상향 처리]]\n|-\n| 1:31:46~1:39:20 || 역투사 문제(삼각형 그림자), 시각 절벽 영상 || [[역투사의 문제]], [[깊이 지각]]\n|-\n| 1:39:20~1:47:42 || 양안 단서·볼펜 맞추기, 단안 단서 5개, '''\"구분해 두라\"''' || [[양안 단서]], [[단안 단서]]\n|-\n| 1:47:42~1:56:04 || 움직임 지각·달 착시, 모양 항등성·컴퓨터 안면 인식 45도 || [[모양 항등성]]\n|-\n| 1:56:04~2:02:54 || 소믈리에, 맥거크(\"가\"+\"바\"→\"다\"), 따뜻한 커피·단단한 의자, 공감각 || [[맥거크 효과]], [[체화 인지]], [[공감각]]\n|-\n| 2:02:54~2:07:36 || ESP, 린드버그 1300명/5%/4명 || [[초감각지각]]\n|-\n| 2:09:48~2:13:47 || '''중간고사 공지''' — 10/13(화) 14:30–16:00, E1-101 컨벤션홀 A구역, 객관식 25 + 단답형 5, 서막–6장(1장은 슬라이드 29까지), 빨간 펜·샤프·연필 자제 || [[시험 정보]]\n|}\n\n마무리 멘트 (2:08:33): 지각은 '''입력값을 만들어내는 과정'''이고, 기억·학습·계획 같은 고차 기능의 출발점이다 → 5장 [[5장 학습|학습]], 6장 [[6장 기억|기억]]으로 이어진다.\n\n== 시험 대비 핵심 요약 ==\n\n# '''감각 = 수용·표상, 지각 = 체제화·해석.''' [[상향 처리]](감각 수용기 → 고차) vs [[하향 처리]](경험·기대로 입력을 체계화). 지각은 둘 다 영향받는다.\n# [[변환]] 3단계: 수용기 수용 → 신경 활동 전환 → 두뇌 전달.\n# [[절대 역치]] = 탐지율 '''0.5''' 지점, 역치하 자극 = 0.5 미만이어도 영향 가능([[점화]]). '''역치가 낮다고 항상 좋지는 않다'''(교수).\n# [[신호 탐지 이론]]: 적중·놓침·오경보·정기각 → '''민감도 d′'''(구별 능력, 피크 거리) vs '''편향성'''(기준선, 우측=엄격·좌측=관대). 엄격해지면 적중·오경보 '''둘 다''' 감소.\n# [[차이 역치]](최소식별차이) + [[베버의 법칙]](일정 '''비율''') — 100 → 110 → '''121'''kg.\n# [[감각 순응]]: 반복 노출 → 민감도 감소, '''발화율''' 감소, 후각이 가장 빠름.\n# [[지각 갖춤새]] = 경험에 근거한 '''기대''' = 하향 처리의 대표 예. 중의적 그림, 감자튀김, 말 분절, 가짜약, '''통증(가장 극적)'''.\n# 맥락([[음소 복원 효과]], 문화) · 동기(갈증-물병, 배낭) · 정서(슬픈 음악 → Mourning) → [[맥락·동기·정서와 지각]].\n# '''얼굴 13개 = 하향 처리.'''\n# [[눈의 구조]]: 동공·홍채·수정체(근시=굴절력 강함=망막 앞, 원시=약함=망막 뒤)·망막(상은 뒤집힘)·중심와·맹점·시신경. 장파장=붉은색, 진폭=밝기.\n# [[원추체와 간상체]]: 원추체 600만·중앙·색·세부·핫라인 / 간상체 1억 2천만·주변·약한 빛·합산·암순응. 양극세포 → 시신경.\n# '''좌시야 → 우반구, 우시야 → 좌반구''' (p.25 \"우반구\" 오타 주의).\n# [[자질 탐지기]], [[방추상 얼굴 영역]](FFA, 손상 시 얼굴실인증 / PPA=장소), [[병렬 처리]](동시 처리 후 통합).\n# [[게슈탈트 심리학]]: 전체 > 부분의 합(구조주의와 대비), 네커 육면체. [[전경-배경]](가역적), [[집단화]](근접성·연속성(오륜기)·폐쇄). '''게슈탈트 = 타고난 상향 처리 중심.'''\n# [[역투사의 문제]]: 2D 상 → 3D 근원이 여럿. [[깊이 지각]] 선천성 = 시각 절벽(깁슨 & 워크, 1960, 6~14개월).\n# '''[[양안 단서]] 2개''' (망막 부등, 수렴) vs '''[[단안 단서]] 5개''' (중첩, 상대적 운동, 상대적 높이, 선형 조망, 상대적 크기).\n# 움직임 지각: 같은 속도면 큰 것이 느려 보임, '''달 착시'''. [[모양 항등성]](컴퓨터는 각도 변화에 약함).\n# 감각 상호작용: 미각–후각, [[맥거크 효과]](가+바→다). [[체화 인지]](따뜻한 커피), [[공감각]](4=빨강), [[초감각지각]](린드버그 1300/5%/4명 = 우연의 일치).\n\n== 관련 문서 ==\n\n* 같은 장 사전: [[감각과 지각의 구분]] · [[상향 처리와 하향 처리]] · [[상향 처리]] · [[하향 처리]] · [[변환]] · [[절대 역치]] · [[점화]] · [[신호 탐지 이론]] · [[차이 역치]] · [[베버의 법칙]] · [[감각 순응]] · [[지각 갖춤새]] · [[음소 복원 효과]] · [[맥락·동기·정서와 지각]] · [[눈의 구조]] · [[원추체와 간상체]] · [[자질 탐지기]] · [[방추상 얼굴 영역]] · [[병렬 처리]] · [[게슈탈트 심리학]] · [[전경-배경]] · [[집단화]] · [[역투사의 문제]] · [[깊이 지각]] · [[양안 단서]] · [[망막 부등]] · [[단안 단서]] · [[모양 항등성]] · [[맥거크 효과]] · [[체화 인지]] · [[공감각]] · [[초감각지각]]\n* 다른 장: [[역치]] · [[분할 뇌]] · [[뇌량]] · [[가짜약 효과]] · [[구조주의]] · [[칵테일 파티 효과]] · [[습관화]] · [[감각 운동 단계]]\n* 앞 장: [[3장 일생에 걸친 발달]] · 다음 장: [[5장 학습]]\n* 시험 대비: [[명칭 암기표]] · [[자주 틀리는 함정 모음]] · [[모의고사 복기]] · [[시험 정보]]"
