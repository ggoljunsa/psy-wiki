  "body": "'''5장 학습'''은 \"경험은 어떻게 행동을 '''영속적으로''' 바꾸는가?\"를 묻는 장이다. 출발점은 [[학습]]의 정의 — '''경험에 따른 유기체 행동의 영속적 변화''' — 이고, 학습을 세 갈래로 나눈다. ① 연합을 쓰지 않는 [[학습|비연합 학습]]([[민감화]]·둔감화), ② 두 사건을 묶는 [[학습|연합 학습]]([[고전적 조건화]]·[[조작적 조건화]]), ③ 보고 배우는 [[학습|인지 학습]]([[관찰 학습]]). 장 전체가 이 세 칸을 차례로 채워 가는 구조다.\n\n시험으로 보면 이 장은 '''명칭 밭'''이다. NS·US·CS·UR·CR, [[고차 조건형성]], [[소거]], [[자발적 회복]], [[일반화]], [[변별]], [[효과의 법칙]], [[행동 조성]], [[계기적 근사법]], [[부적 강화]], [[강화 계획]] 4종, [[부적 처벌]], [[거울 뉴런]] — 통합요약의 단답형 후보만 21개다. 그리고 객관식 함정은 거의 전부 '''\"부적 강화 ≠ 처벌\"''' 한 줄에서 나온다.\n\n페이지 번호 = 인쇄 슬라이드 번호(총 38장, 숨김 없음). '''9/29 녹음은 p.1–19(강화의 유형)까지만''' 있고 p.20–38 은 녹음이 없어 슬라이드 기준이다.\n\n{warn}\n'''슬라이드 오기''': p.4·p.17·p.18 제목의 \"'''Operational''' Conditioning\" 은 틀린 철자다. 올바른 원어는 '''Operant Conditioning'''(조작적 조건화). 영어 원어를 묻는 보기가 나오면 operant 를 고를 것. 또 1장의 [[조작적 정의]](Operational Definition)와는 전혀 다른 개념이다.\n{/warn}\n\n{analogy}\n5장 전체는 '''반려견 훈련 학원'''이다. ① 초인종 소리에 처음엔 놀라 짖다가 매일 들으니 무시하게 되는 것 = 둔감화(비연합). ② \"산책\" 소리만 들어도 꼬리를 흔드는 것 = [[고전적 조건화]](소리와 산책을 묶음). ③ \"앉아\" 하고 앉으면 간식 → 앉는 행동이 늘어남 = [[조작적 조건화]](행동과 결과를 묶음). ④ 형 강아지가 앉아서 간식 받는 걸 보고 동생 강아지가 따라 앉음 = [[관찰 학습]]. 이 장의 교수법은 결국 '''\"무엇과 무엇을 묶느냐\"'''의 차이다.\n{/analogy}\n\n== 0. 이 장이 다른 장과 이어지는 곳 ==\n\n{| class=\"table\"\n! 앞에서 배운 것 || 5장에서 쓰이는 곳\n|-\n| 서막 p.11 [[행동주의]](왓슨·[[스키너]], 관찰 가능한 행동만) || p.6 고전적 조건화의 등장 배경. 조건화는 '''행동주의를 대표하는 이론'''(🎙 9/29)\n|-\n| 서막 p.13 [[인지혁명]] || p.6 \"20세기 전반 미국 심리학의 주류(~인지혁명 전)\"\n|-\n| 2장 p.4 [[신경 가소성]] || p.2 \"학습에 따른 두뇌의 변화\" — 같은 정의가 다시 나온다\n|-\n| 2장 p.9 [[도파민]](보상) || p.19 약물 중독: 도파민 보상도 있지만 끊지 못하는 이유는 '''금단 제거 = 부적 강화'''\n|-\n| 3장 p.6 [[습관화]] || p.2 '''둔감화(Habituation)''' — 5장 슬라이드는 같은 영어를 \"둔감화\"로 번역\n|-\n| 3장 p.18 [[마음 이론]], p.28–29 [[콜버그의 도덕성 발달 단계]] || p.5·p.35 인지 학습의 기제, p.36 부모를 모델로 도덕성 학습\n|-\n| 4장 p.5 [[점화]] || p.14 의미 점화 = 연합 개념의 확장(병원-약국)\n|-\n| 1장 p.24 [[가짜약 효과]] || p.16 맛만으로 면역 반응 — 🎙 \"플라시보 효과가 다른 의미로 발현\"\n|-\n| 1장 p.22 [[상관]] || p.38 폭력적 게임과 공격성의 상관은 출간 편향을 교정하면 낮다\n|-\n| → 6장 [[6장 기억]] || 🎙 \"공부법은 학습 장이 아니라 다음 주 기억 장\" — [[간격두기 효과]]·[[검증 효과]]\n|}\n\n== p.1–3 학습이란? 비연합 학습과 연합 ⭐⭐⭐ ==\n\n[[img:L5-02.png|5장 p.2 — 학습의 유형 트리(Non-associative / Associative / Watching others)와 학습·민감화·둔감화·신경 가소성의 정의|large]]\n\n[[학습]] = '''경험에 따른 유기체 행동의 영속적 변화''', 주 목표는 '''외부 환경에 대한 적응'''. p.2 왼쪽 그림의 트리가 이 장의 지도다.\n\n{| class=\"table\"\n! 비연합 학습 (Non-associative) || 연합 학습 (Associative) || 인지 학습 (Watching others)\n|-\n| 연합을 쓰지 않음 || 두 정보 사이의 관계를 학습 || 다른 사람의 행동을 보고 학습\n|-\n| [[민감화]](반응 빈도 '''증대''') · 둔감화(반응 빈도 '''감소''' → [[습관화]]) || [[고전적 조건화]] · [[조작적 조건화]] || [[관찰 학습]] · 모델링 · 대리 강화\n|}\n\n{def}\n'''설명''': 자극에 대한 행동 반응 빈도가 증대되는 현상 (5장 p.2)\n'''명칭''': [[민감화]] (Sensitization)\n{/def}\n\n학습은 뇌도 바꾼다 — [[신경 가소성]](Neural Plasticity): 경험·학습 등에 따라 신경 회로가 유연하게 변하는 특성(p.2, 2장 p.4 와 같은 정의).\n\n[[img:L5-03.png|5장 p.3 — 연합 학습의 예시: 까마귀가 날자 배가 떨어지는 것을 보고 \"까마귀가 날면 배가 떨어지는구나!\"|medium]]\n\np.3 의 [[학습|연합]](Association)은 '''두 사건 혹은 자극을 서로 연결하는 것'''이다. 교수 예는 '''오비이락'''(까마귀 날자 배 떨어진다) — 우연이라도 묶어 버리면 연합이다. 연합이 반복되면 '''습관'''이 되고(Wood et al., 2014), 습관 형성에는 통상 '''약 2달'''(Lally et al., 2010)이 걸린다.\n\n{joke}\n교수: 정확히는 '''66일'''. \"운동을 꾸준히 못 하는 건 두 달을 못 채워서\"라는 뼈 있는 농담이 따라왔다. (🎙 9/29)\n{/joke}\n\n== p.4 연합 학습의 예시: 조건화 ⭐⭐⭐ ==\n\n[[img:L5-04.png|5장 p.4 — 위: 번개(자극1)+천둥(자극2) → 반복 후 번개만 봐도 움츠림(고전적) / 아래: 예의 바르게 부탁 → 과자 → 행동 강화(조작적)|large]]\n\n{| class=\"table\"\n! || [[고전적 조건화]] (Classical) || [[조작적 조건화]] (Operant)\n|-\n| 무엇을 묶나 || '''무관한 두 자극'''을 연합 → 미래 사건을 '''예측''' || '''반응(행동)을 그 결과'''와 연합\n|-\n| 반응 || 조건화된 자극에 대한 반응이 '''자동적'''으로 생성 || 보상·처벌 조작으로 행동 '''빈도'''를 조절\n|-\n| 교수 예 (🎙 9/29) || 번개 섬광 → 곧 천둥 → 섬광만 봐도 움츠림 || 아이가 예의 바르게 부탁 → 과자 → 부탁 행동↑\n|}\n\n== p.5 인지 학습 ⭐⭐ ==\n\n[[img:L5-05.png|5장 p.5 — 인지 학습의 예시: 다른 아이가 뜨거운 냄비에 데이는 것을 보고, 스스로 같은 상황에서 손을 멈춘다|medium]]\n\n'''인지 학습'''(Cognitive learning): 사건과 사람을 '''관찰'''하거나 '''언어'''를 기반으로 '''경험하지 못한 것'''을 학습하는 방식. 인간에게는 타인의 시점을 이해하고 공감하는 기제([[마음 이론]], [[거울 뉴런]])가 있고, 동물에게서도 일어난다(맹수의 사냥 방법 전수). 대표 예가 [[관찰 학습]](p.31–37).\n\n== p.6 고전적 조건화의 등장 배경: 행동주의 ⭐⭐ ==\n\n[[img:L5-06.png|5장 p.6 — 행동주의의 관점: 자극 → (머릿속은 ✗) → 행동|medium]]\n\n[[행동주의]]는 심리과학의 핵심을 '''환경·자극에 대한 반응(=행동)'''에 두고 '''심성 개념을 폐기'''했다. 20세기 전반부 미국 심리학의 주류(~[[인지혁명]] 전). 교수: 고전적·조작적 조건화는 '''행동주의를 대표하는 이론'''이다 — 학습은 행동 변화로 관찰·기록할 수 있으니 행동주의와 궁합이 맞는다.\n\n== p.7–9 고전적 조건화의 과정과 구성 요소 ⭐⭐⭐ ==\n\n[[img:L5-07.png|5장 p.7 — 파블로프의 조건화 실험 패러다임: 조건형성 전(US→UR, NS→무반응) · 조건형성 중(NS+US) · 조건형성 후(CS→CR)|large]]\n\n[[파블로프]]의 기본 절차(p.7):\n# [[무조건 자극]](US) 제시 → [[무조건 반응]](UR) 확인 (먹이 → 침)\n# [[중성 자극]](NS) 제시 → US 제시 → 반응 유발, '''이후 반복''' (종소리 → 먹이)\n# NS 가 US 와 관계가 형성되어 [[조건 자극]](CS)으로 발전 → CS 만으로 [[조건 반응]](CR)\n\n<pre class=\"ascii\">\n 조건형성 전   [US: 먹이] ──▶ UR(침)        [NS: 종] ──▶ (반응 없음)\n 조건형성 중   [NS: 종] → [US: 먹이] ──▶ UR(침)     × 반복   (NS 먼저, US 나중!)\n 조건형성 후   [CS: 종] ──────────────▶ CR(침)\n<\/pre>\n\n{| class=\"table\"\n! 구성 요소 || 슬라이드 정의 (p.8–9) || 파블로프 예\n|-\n| [[중성 자극]] NS || 조건 형성이 이루어지기 전에 조건 반응을 유발하지 않는 자극 || 처음의 종소리\n|-\n| [[무조건 자극]] US || 자연스럽고 자동적인 반응을 촉발시키는 자극 || 먹이\n|-\n| [[조건 자극]] CS || 중성 자극이 무조건자극과 반복 제시되면서 유기체가 둘을 연합시켜 형성된 자극 || 학습 후의 종소리\n|-\n| [[무조건 반응]] UR || 무조건자극에 대해 자연스럽게 나타나는 반응, 학습 여부와 무관 || 먹이를 보고 침\n|-\n| [[조건 반응]] CR || 조건 자극에 대해 발생하는 반응으로 연합 학습을 통해 발현 || 소리를 듣고 침\n|}\n\n{exam}\n교수 강조(🎙 9/29): '''UR 과 CR 은 겉으로는 같은 행동(침, 꼬리 흔들기)'''이다. 구분 기준은 행동이 아니라 '''\"어떤 자극에 반응하느냐\"'''. 사례형 객관식(피자 배달 오토바이 소리)에서 \"침 = 무조건 반응\"만 외운 사람이 함정에 빠진다.\n{/exam}\n\n[[anim:pavlov_dog|NS 먼저 → US 나중 순서와, 소거 후에도 CR 이 자발적 회복으로 되살아나는 그래프를 끝까지 보고 아래 시뮬레이터로 넘어가라]]\n\n== p.10 제시 순서와 고차 조건형성 ⭐⭐⭐ ==\n\n[[img:L5-10.png|5장 p.10 — 무조건자극이 중립 자극 이전에 제시되면 조건 형성은 거의 발생하지 않음 + 고차 조건형성|medium]]\n\n{exam}\n'''NS 가 먼저, US 가 나중.''' 무조건자극이 중립 자극 '''이전'''에 제시되면 조건형성은 '''거의 발생하지 않는다'''(p.10). 교수가 \"제시 순서가 상당히 중요하다\"고 따로 짚었다(🎙 9/29 28:08). 종이 \"곧 먹이가 온다\"는 '''예고'''가 되어야 하는데, 먹이가 먼저 와 버리면 종은 아무것도 예고하지 못한다.\n{/exam}\n\n[[고차 조건형성]]: 한 조건 자극을 다른 중성 자극과 연합하여 조건화시키는 방법. 1차 조건형성보다 '''약하게''' 형성되나 일생 삶에 영향을 줄 수 있다(교수 예: 종소리를 나팔 소리와 연합).\n\n== p.11 소거와 자발적 회복 ⭐⭐⭐ ==\n\n[[img:L5-11.png|5장 p.11 — 조건화의 소거와 자발적 회복 그래프: 획득(NS+US)↑ → 소거(CS만 제시)↓ → 휴지기간 → CR 의 자발적 회복(부분) → 다시 소거|large]]\n\n* [[소거]](Extinction): 조건 형성 이후 CS 를 US '''없이''' 반복 제시하면 CR 이 점차 감소.\n* [[자발적 회복]](Spontaneous Recovery): 일정한 '''휴지기간''' 후 CS 를 다시 제시하면 CR 이 '''부분적으로''' 회복.\n\n{exam}\n⭐⭐⭐ '''소거는 조건 반응을 제거하는 것이 아니라 억압하는 쪽에 가깝다'''(p.11). 그 증거가 자발적 회복이다(🎙 9/29 30:15). \"소거 = 영구적 완전 제거\" 보기는 무조건 오답.\n{/exam}\n\n[[sim:classical_conditioning]]\n\n== p.12 일반화와 변별 ⭐⭐⭐ ==\n\n[[img:L5-12.png|5장 p.12 — 일반화: 종소리에 조건화된 개가 비슷한 종소리·다른 모양의 종·트라이앵글·호루라기에도 침을 흘림|medium]]\n\n{| class=\"table\"\n! || [[일반화]] (Generalization) || [[변별]] (Discrimination)\n|-\n| 정의 || 조건화 자극과 '''유사한''' 속성을 지닌 자극에도 조건 반응을 보이는 현상 (Pavlov, 1927) || 조건 자극과 '''무관련''' 자극을 구분할 수 있는 능력\n|-\n| 방향 || 반응이 '''퍼짐''' || 반응을 '''좁힘'''\n|-\n| 예 || 벌 → 날벌레 공포, 「자라 보고 놀란 가슴 솥뚜껑 보고 놀란다」 || 종소리엔 침, 자동차 경적엔 무반응\n|-\n| 특징 || 혐오감도 일반화(Rozin, 1986), '''일반화된 공포는 쉽게 사라지지 않음'''(Stout, 2018) || 일반화와 더불어 대상 간 연관성을 학습하는 기제\n|}\n\n== p.13–14 고전적 조건화의 의의 ⭐⭐ ==\n\n교수가 꼽은 의의(🎙 9/29): ① 학습 과정을 '''객관적으로 연구'''할 방법 제공 ② 다양한 자극에 대한 다양한 반응이 여러 유기체에서 형성될 수 있음 ③ '''진화적 관점''': 혐오·공포 자극에 대한 연합 학습이 생존률을 높였다. 신경과학에서도 CS–US 연결 회로가 보고됐다(Harnett 2016).\n\np.14 — 연합 개념은 지식 구조에도 적용된다. [[점화]] 중 '''의미 점화'''는 두 대상의 관계성에 기반한다('병원'-'약국', '럭키'-'세븐').\n\n{joke}\n교수 평: 행동주의는 비판을 많이 받았지만 이렇게 보면 \"무의미하다고 할 수 없는 '''아이러니한 포지션'''\"이다.\n{/joke}\n\n== p.15–16 고전적 조건화의 응용 ⭐⭐⭐ ==\n\n[[img:L5-15.png|5장 p.15 — 갈망 치료: 음식 단서만 봐도 강한 갈망 → 음식 단서 + 불쾌한 자극을 반복 제시해 새 연합 → 갈망 반응 감소|medium]]\n\n{| class=\"table\"\n! 응용 || 내용 (슬라이드) || 조건화로 읽기\n|-\n| '''갈망 치료''' (p.15) || 약물을 쓰던 상황·맥락을 접하면 강하게 갈망. 조건 형성된 상황이나 대상을 '''제거'''하여 치료 시작(Siegel, 2005) || 맥락 = CS, 갈망 = CR\n|-\n| '''면역 반응''' (p.16) || 면역 약물에 특정한 맛을 첨가 → 맛만으로 면역 반응 (Ader & Cohen, 1985) || 맛 = CS. 🎙 \"[[가짜약 효과|플라시보 효과]]가 다른 의미로 발현\"\n|-\n| '''공포 치료''' (p.16) || 엘리베이터를 두려워하는 사람을 반복 탑승 → 위험이 없음을 새로 학습 (Ellis & Becker, 1982) || [[고전적 조건화|반복 노출 치료법]] = [[소거]] 기제 활용\n|}\n\n[[img:L5-16.png|5장 p.16 — 반복 노출 치료법: 공포의 조건화 형성 → 반복적 노출 → 소거 학습 → 증상 완화|medium]]\n\n{tip}\n교수 사례(🎙 9/29 44:17): '''마운자로·위고비''' — 약효로 포만감·메스꺼움이 오래 가면 그 '''불쾌한 신체 감각이 음식과 연합'''되어 섭식량이 줄어든다. 처음엔 약학적 효과, 나중엔 심리적 연합. (교수 본인이 맞고 있다며 \"너무 힘드니 여러분도 관리하라\")\n{/tip}\n\n== p.17 조작적 조건화와 효과의 법칙 ⭐⭐⭐ ==\n\n[[img:L5-17.png|5장 p.17 — 손다이크의 고양이 상자 실험과 탈출 소요 시간(Thorndike, 1898): 시행이 거듭될수록 240초 → 30초 안팎으로 감소|large]]\n\n[[조작적 조건화]]: 유기체가 '''자신의 행위를 결과와 연합'''하여 행동의 빈도를 조절하는 학습. 뿌리는 [[효과의 법칙|손다이크]]의 [[효과의 법칙]] — '''보상이 뒤따르는 행동은 증가(강화), 처벌자극이 뒤따르는 행동은 감소(처벌)'''. 고양이는 레버를 조작해야 문제 상자에서 탈출하고, 시행을 반복할수록 탈출 시간이 줄어든다(효율성 증대).\n\n== p.18 강화, 행동 조성, 계기적 근사법 ⭐⭐⭐ ==\n\n[[img:L5-18.png|5장 p.18 — 스키너 상자의 패러다임: 불빛·스피커·지렛대·먹이 제공 장치·물|medium]]\n\n* [[강화]](Reinforcement): 조작적 조건형성에서 행동을 강력하게 만드는 사건/자극. 상황에 따라 보상은 달라질 수 있다.\n* [[행동 조성]](Shaping): 보상 혹은 처벌을 통해 행동을 원하는 방향으로 유도. [[스키너]]가 손다이크의 효과의 법칙을 '''행동 공학'''으로 발전.\n* [[계기적 근사법]]: 최종 목표 행동을 학습시키기 위해 '''이전 단계의 행동'''에 적절한 보상을 제공하여 목표에 다가가도록 하는 방법.\n* [[스키너 상자]]: 쥐가 지렛대를 누르면 먹이 → 누르는 횟수 증가. 언어를 쓰지 못하는 동물의 지각 탐구에도 활용.\n\n{def}\n'''설명''': 최종 목표 행동을 학습시키기 위해 이전 단계의 행동에 적절한 보상을 제공하여 목표에 다가가도록 하는 방법 (5장 p.18)\n'''명칭''': [[계기적 근사법]] (Successive Approximation)\n{/def}\n\n[[anim:skinner_box|쥐가 레버를 누를 때 2×2 칸이 하나씩 켜진다 — 칸마다 \"제시/제거\"와 \"행동↑/↓\"를 소리 내어 읽어라]]\n\n== p.19 강화의 유형: 정적 강화와 부적 강화 ⭐⭐⭐ ==\n\n[[img:L5-19.png|5장 p.19 — 정적 강화의 예(숙제 끝 → 초콜릿 추가 → 행동 증가) / 부적 강화의 예(알람 끄면 소음 제거 → 행동 증가)|large]]\n\n{| class=\"table\"\n! || [[정적 강화]] (Positive reinforcement) || [[부적 강화]] (Negative reinforcement)\n|-\n| 정의 || '''보상을 제공'''하여 행동을 증가시키는 것 || '''혐오 자극을 제거'''하여 행동 빈도를 증가시키는 것\n|-\n| 슬라이드 그림 || 숙제 끝 → 초콜릿 || 알람 소리를 끄면 소음이 사라진다\n|-\n| 교수 예 || 시험 잘 보면 용돈 인상 || 내기에 지면 내야 할 저녁값 부담을 없애 줌, 청소 면제\n|}\n\n{exam}\n⭐⭐⭐ 교수 강조 세 줄 (🎙 9/29 56:43–1:02:36)\n# '''부적 강화는 처벌이 아니다.''' \"강화는 강화고 처벌은 처벌\" — 행동이 '''증가'''하면 강화, '''감소'''하면 처벌. 정적 = '''더하기''', 부적 = '''빼기'''.\n# '''약물 중독 = 부적 강화의 강력한 예'''(Baker et al., 2004). 도파민 보상도 있지만 끊지 못하는 진짜 이유는 '''금단 증상의 고통을 제거'''하려고 약물 사용이 늘기 때문.\n# '''두 강화는 동시에 발생할 수 있다''' — 시험을 망쳐 불안한 학생이 불안을 떨치려 공부량을 늘리고(부적), 성적이 올라 보상도 받는다(정적).\n{/exam}\n\n[[sim:operant_quadrant]]\n\n== p.20–21 강화물의 종류 ⭐⭐ (녹음 없음) ==\n\n[[img:L5-20.png|5장 p.20 — 1차 강화물(음식·물·수면·신체적 접촉) vs 조건 강화물(동전: 원래는 중립 자극 → 음식과 연합되어 강화의 힘 획득)|medium]]\n\n{| class=\"table\"\n! 기준 || 종류 || 정의 (슬라이드)\n|-\n| 직접성 (p.20) || [[조건 강화물|1차 강화물]] || 생물학적 욕구를 만족시키는 강화 자극. 학습된 것이 아니라 생득적\n|-\n| 직접성 (p.20) || [[조건 강화물]](이차 강화물) || 일차 강화물과 연합되어 강화의 힘을 획득한 자극 (돈·칭찬·토큰·점수)\n|-\n| 제시 간격 (p.21) || [[조건 강화물|즉시 강화물]] || 행동 수행 후 바로 제공. 지연은 학습을 감소시킴\n|-\n| 제시 간격 (p.21) || [[조건 강화물|지연 강화물]] || 행동 수행 후 일정 시간 뒤 제공. [[조건 강화물|마쉬멜로 실험]](Mischel, 2014)\n|}\n\n== p.22–23 강화 계획 ⭐⭐⭐ (녹음 없음) ==\n\n[[img:L5-22.png|5장 p.22 — 부분 강화 계획에 따른 행동 변화 양상(비둘기 누적 반응): 고정비율·변동비율은 가파름, 고정간격은 계단형, 변동간격은 느리지만 꾸준|large]]\n\n[[강화 계획]]: 원하는 반응을 얼마나 자주 강화할 것인지 정의하는 패턴. '''연속 강화계획'''(반응할 때마다) vs '''부분(간헐적) 강화계획'''(일부만) — 부분은 '''학습은 느리지만 소거 저항도가 높다'''.\n\n[[img:L5-23.png|5장 p.23 — 부분 강화계획 2×2 표: 비율/간격 × 고정/변동|large]]\n\n{| class=\"table\"\n! || 고정 (Fixed) || 변동 (Variable)\n|-\n| '''비율''' || [[강화 계획|고정비율]]: 고정된 수의 반응 후 강화. 커피 쿠폰(10회 1잔 무료) || [[강화 계획|변동비율]]: 랜덤 반응 수 산출 후 강화. '''소거가 잘 이루어지지 않음'''. 슬롯 머신, 낚시꾼\n|-\n| '''간격''' || [[강화 계획|고정간격]]: 고정된 시간 경과 후 강화. 보상 시점이 가까울수록 빠른 반응, '''급격한 증가 패턴'''. 정기 할인 행사 || [[강화 계획|변동간격]]: 가변적인 시간 경과 후 강화. '''느리지만 매우 꾸준한''' 반응. SNS 좋아요 알람 확인\n|}\n\n[[sim:reinforcement_schedules]]\n\n== p.24–27 처벌 ⭐⭐⭐ (녹음 없음) ==\n\n[[img:L5-24.png|5장 p.24 — 정적 처벌의 예(과속 → 벌금 부과, 불쾌한 자극 추가) / 부적 처벌의 예(과속 반복 → 면허 취소, 좋은 자극 제거)|large]]\n\n[[처벌]] = 행동을 '''감소'''시키는 기제.\n* '''정적 처벌(제1유형)''': 혐오 자극을 '''가하여''' 행동 감소 — 과속 벌금.\n* [[부적 처벌]](제2유형): 보상 자극을 '''철회'''하여 행동 감소 — 면허 취소, [[부적 처벌|타임 아웃]](p.27).\n\n{| class=\"table\"\n! || 자극 제시 (정적, +) || 자극 제거 (부적, −)\n|-\n| '''행동 증가 (강화)''' || [[정적 강화]] — 보상 제공 || [[부적 강화]] — 혐오 자극 제거\n|-\n| '''행동 감소 (처벌)''' || [[처벌|정적 처벌]] — 혐오 자극 제공 || [[부적 처벌]] — 보상 철회\n|}\n\n처벌의 효과(p.24–26): 범죄율 감소에 실질적인 것은 중형의 위협이 아닌 '''신속하고 확실한 처벌'''(검거율). APA(2019): 처벌받은 행동은 망각이 아니라 '''억제'''될 뿐이며 이 일시적 억제가 부모의 처벌 행위를 '''부적으로 강화'''한다 / 체벌은 적절한 행동의 방향을 주지 않는다 / 공포 학습·공격성 모델링.\n\n[[img:L5-27.png|5장 p.27 — 처벌(원하지 않는 행동을 줄이는 방법) vs 보상(바람직한 행동을 늘리는 방법)|medium]]\n\n== p.28–29 조작적 조건형성의 응용 ⭐ (녹음 없음) ==\n\n{| class=\"table\"\n! 분야 || 활용 방식 (p.28)\n|-\n| 학교 || 즉각적 피드백으로 행동 조성, 맞춤형 피드백(온라인 검사도구)\n|-\n| 스포츠 || 목표를 단계적으로 설정해 도전 거리 증가 ([[계기적 근사법]]의 실전판)\n|-\n| 컴퓨터 프로그램 || 강화 원리에 기반하여 인간의 학습을 모방하는 알고리즘 개발\n|-\n| 직장 || 구성원의 동기 함양·유지(조직심리학)\n|-\n| 가정교육 || 아동에 대한 적절한 교육방식, 부모-자녀 유대\n|-\n| 자기자신 || 스스로의 행동 수정을 위한 강화 원리 적용\n|}\n\np.29 스스로에게 적용하는 5단계: ① 현실적 목표를 측정 가능한 기간으로 ② 언제·어디서·어떻게 명시 ③ 행동 빈도 확인 ④ 바람직한 행동 강화('스스로를 위한 선물') ⑤ '''보상을 점진적으로 축소''' → 내적 동기로.\n\n{joke}\n공대생 독자라면 \"강화 원리에 기반한 알고리즘\"에서 바로 '''강화학습'''(Reinforcement Learning)을 떠올렸을 것이다. 보상 함수가 곧 스키너 상자의 먹이 제공 장치다.\n{/joke}\n\n== p.30 고전적 조건화 VS 조작적 조건화 ⭐⭐⭐ (녹음 없음) ==\n\n[[img:L5-30.png|5장 p.30 — 고전적 조건화 VS 조작적 조건화 비교표(기본 아이디어·반응·획득·소거·자발적 회복·일반화·변별)|large]]\n\n공통점: 둘 다 연합 학습이며 '''획득, 소거, 자발적 회복, 일반화, 변별''' 현상을 수반. 표 전체는 [[고전적 조건화와 조작적 조건화 비교]] 문서에.\n\n{exam}\nbank 객관식 단골: \"고전적 = '''제어할 수 없는 사건 간''' 연합, '''비자발적·자동적''' / 조작적 = '''행동과 결과 간''' 연합, '''자발적'''\". 반응 특성을 뒤바꾼 보기, \"일반화·변별은 고전적에서만\" 보기는 오답.\n{/exam}\n\n== p.31 관찰 학습과 오뚝이 실험 ⭐⭐⭐ (녹음 없음) ==\n\n[[img:L5-31.png|5장 p.31 — Bandura et al.(1961)의 오뚝이 실험: 위는 성인 모델, 아래는 같은 동작을 따라 하는 아동|large]]\n\n[[관찰 학습]](Observational learning = 사회학습): 타 개체의 행동을 관찰하고 모방하여 학습(모델링). 인지 기능이 지원하므로 '''인지 학습의 일환'''. 관찰 대상이 겪는 강화·처벌도 모델링된다 = [[관찰 학습|대리 강화와 대리 처벌]]. 대표 실험이 [[오뚝이 실험]](반두라, 1961, 보보 인형).\n\n[[anim:observational_learning|어른 모델 → 아이 관찰 → 혼자 남은 아이의 모방 순서를 보고, 보조 패널의 \"모델이 보상받는 장면 = 대리 강화\"를 확인하라]]\n\n== p.32–35 동물의 관찰 학습, 인간의 모방, 거울 뉴런 ⭐⭐⭐ (녹음 없음) ==\n\n[[img:L5-33.png|5장 p.32–33 — 동물의 사회학습 예시: 혹등고래의 꼬리치기 미끼몰이, 버빗원숭이의 먹이 관찰 + 거울 뉴런의 발견(리졸라티)|medium]]\n\n* 동물(p.32): 혹등고래의 꼬리치기 미끼몰이, 버빗원숭이의 부모-자녀 먹이 학습, 맹수의 사냥법 전수.\n* [[거울 뉴런]]의 발견(p.33, [[거울 뉴런|리졸라티]] 2002·2006): 원숭이가 땅콩을 먹으면 버저가 울리게 해 두었더니 '''다른 개체가 땅콩을 먹을 때도''' 버저가 울렸다.\n* 인간(p.34): 생후 '''8~16개월'''도 모방으로 행동 조성 가능, TV 모델도 모방, '''과잉 모방'''으로 어른의 부적절한 행동까지 → 모방 학습의 생득적 요인.\n\n[[img:L5-35.png|5장 p.35 — 실제 통증을 느낄 때와 그 고통을 상상(감정이입)할 때 겹쳐 활성화되는 뇌 영역|medium]]\n\n{def}\n'''설명''': 특정 행동을 수행하거나 타인이 그 행동을 할 때 관찰하면 활성화되는 전두엽 뉴런 (5장 p.35)\n'''명칭''': [[거울 뉴런]] (Mirror Neuron)\n{/def}\n\n[[마음 이론]](Theory of Mind) — 타인의 심적 상태를 추론하는 능력 — 은 거울 뉴런에 의한 공감 기제에 기반한다(p.35, 3장 p.18).\n\n== p.36–38 관찰 학습의 응용과 폭력적 게임 ⭐⭐ (녹음 없음) ==\n\n{| class=\"table\"\n! [[관찰 학습|친사회적 영향]] (p.36) || [[관찰 학습|반사회적 영향]] (p.37)\n|-\n| 친사회적 컨텐츠 노출 → 이타적 행동 증진 / 기업의 행동 모델링 교육(사수의 업무 전수) / 아동은 '''부모'''를 가장 강력한 모델로 도덕성 학습 || 가정 폭력 노출 아동의 공격성 / 증오 발언 반복 노출 → 편견 / 매체 폭력 → 폭력 시청 효과, '''모방 범죄'''\n|}\n\n[[img:L5-38.png|5장 p.38 — 폭력적 게임 → 공격적 사고·태도 증가 → 실제 폭력 행동 증가? (물음표)|medium]]\n\np.38 번외: 대중매체는 관찰 학습의 '''가장 강력한 원천'''(「분노의 질주」 개봉 주 딱지 급증). 폭력적 게임은 '''둔감화''' 과정을 통해 공격성을 높인다는 연구도 있지만, 메타 분석에서 '''출간 편향을 교정'''하면 폭력적 게임과 공격 행동의 [[상관]]은 '''낮다'''(Ferguson). 그림 끝의 '''\"?\"'''가 결론이다.\n\n== 🎙 실제 수업 기록 (9/29 화, 녹음본 기준) ==\n\n녹음 `심리학-1 260929_143411.txt`(62분 43초)는 '''p.1–19(강화의 유형)'''까지만 있고 \"잠깐 쉬었다가 후반 수업 진행\"([1:02:36])에서 끝난다. '''p.20–38 은 녹음 없음''' — 위 해당 절은 슬라이드 기준이다.\n\n* '''[00:00] 시험 안내 ⭐⭐⭐''': 객관식 + 단답형. 단답형은 '''심리 기제·접근법·모델 이름 등 명칭 쓰기만''', 장문 서술형 없음. '''통계 제외'''. '''빨간 펜·연필·샤프 사용 제한'''. 시험 장소는 이 강의실이 아니라 '''컨벤션홀 A구역(E1-101)''' → [[시험 정보]].\n* [02:56] 이 장의 \"학습\"은 '''공부법이 아니다''' — 공부 관련 정보 유지는 다음 주 [[6장 기억]].\n* [05:57] 민감화(소음에 더 예민) vs 둔감화(소음에 적응), 3장 [[습관화]]·[[신경 가소성]] 연결.\n* [09:50] 연합 = 두 사건을 묶는 것(까마귀-배), 습관 형성 66일.\n* [12:06] 고전 = 번개-천둥 '''예측''', 조작 = 예의 바른 부탁-과자.\n* [18:00] 고전·조작 조건화는 '''행동주의를 대표하는 이론'''.\n* [21:07] UR 과 CR 은 '''겉으로 같은 행동''', 무엇에 반응하느냐가 다르다.\n* '''[28:08] ⭐ 중립 자극이 먼저, 무조건 자극이 나중.'''\n* [29:08] 고차 조건형성: 종소리 → 나팔 소리, 1차보다 약함.\n* '''[30:15] ⭐ 소거는 제거가 아니라 일시적 억압''', 자발적 회복이 증거.\n* [33:50] 일반화(트라이앵글·실로폰, 솥뚜껑) vs 변별.\n* [44:17] 갈망 치료 — 마운자로·위고비. [48:01] 면역 = \"플라시보의 다른 발현\". [48:58] 엘리베이터 노출 치료.\n* [51:04] 손다이크 고양이 탈출 상자, '''효과의 법칙'''. 보상/처벌을 '''조작'''해서 \"조작적\" 조건화.\n* [53:42] 스키너 상자, 행동 조성, 계기적 근사법(목표를 단계로 쪼개 단계마다 보상).\n* '''[56:43] ⭐ 부적 강화 ≠ 처벌'''. 증가 = 강화, 감소 = 처벌, 더하기 = 정적, 빼기 = 부적.\n* '''[59:45] ⭐ 약물 중독 = 부적 강화'''(금단 제거), 두 강화는 '''동시에''' 가능(시험 망친 학생).\n\n== 시험 대비 핵심 요약 ==\n\n# [[학습]] = 경험에 따른 유기체 행동의 '''영속적''' 변화, 목표는 환경 적응. 세 양상: 비연합 / 연합 / 인지(관찰).\n# [[민감화]](빈도 증대) vs 둔감화(빈도 감소 = [[습관화]]) — 비연합 학습. 바탕은 [[신경 가소성]].\n# 고전적 조건화 5요소: [[중성 자극]]→[[조건 자극]], [[무조건 자극]], [[무조건 반응]], [[조건 반응]]. '''UR 과 CR 은 같은 행동, 다른 자극'''.\n# '''NS 먼저, US 나중''' — 반대면 조건형성 거의 안 됨.\n# [[고차 조건형성]] = CS 를 새 NS 와 연합(1차보다 약함).\n# [[소거]] = US 없이 CS 만 → CR 감소. '''제거가 아니라 억압''', 증거는 [[자발적 회복]](휴지기 후 부분 회복).\n# [[일반화]](유사 자극에도 반응, 공포 일반화는 잘 안 사라짐) vs [[변별]](무관련 자극 구분).\n# 응용: 갈망 치료(단서 제거), 면역 반응(맛), 반복 노출 치료법(소거 활용).\n# [[조작적 조건화]] = 행동–결과 연합. ⚠ 슬라이드 \"Operational\" 은 '''Operant''' 의 오기.\n# [[효과의 법칙]](손다이크, 고양이 상자, 1898) → [[스키너]]의 [[행동 조성]]·[[계기적 근사법]]·[[스키너 상자]].\n# 강화 = 행동↑, 처벌 = 행동↓ / 정적 = 제시, 부적 = 제거. '''[[부적 강화]] ≠ 처벌'''. '''약물 중독 = 부적 강화'''. 정적·부적 강화 '''동시''' 가능.\n# 1차 강화물(생득적) vs [[조건 강화물]](이차, 1차와 연합). 즉시 vs 지연(마쉬멜로 실험).\n# [[강화 계획]]: 연속 vs 부분(학습 느림·'''소거 저항↑'''). 고정비율(커피 쿠폰)·'''변동비율(슬롯머신, 소거 안 됨)'''·고정간격(정기 할인, 급증)·변동간격(SNS, 느리지만 꾸준).\n# 정적 처벌(제1유형, 혐오 자극 부여) vs [[부적 처벌]](제2유형, 보상 철회, 타임 아웃). 신속·확실한 처벌이 효과적, 체벌은 억제일 뿐.\n# [[고전적 조건화와 조작적 조건화 비교]]: 제어 불가 사건 간·비자발적 vs 행동–결과·자발적. 공통 5현상.\n# [[관찰 학습]](=사회학습): 모델링, 대리 강화/처벌, [[오뚝이 실험]](반두라 1961), [[거울 뉴런]](리졸라티, '''전두엽'''), [[마음 이론]], 과잉 모방, 친/반사회적 영향, 폭력적 게임 상관은 출간 편향 교정 시 낮음.\n\n== 관련 문서 ==\n* 학습의 틀: [[학습]] · [[민감화]] · [[습관화]] · [[신경 가소성]] · [[행동주의]]\n* 고전적 조건화: [[고전적 조건화]] · [[파블로프]] · [[중성 자극]] · [[무조건 자극]] · [[조건 자극]] · [[무조건 반응]] · [[조건 반응]] · [[고차 조건형성]] · [[소거]] · [[자발적 회복]] · [[일반화]] · [[변별]]\n* 조작적 조건화: [[조작적 조건화]] · [[효과의 법칙]] · [[스키너]] · [[스키너 상자]] · [[강화]] · [[행동 조성]] · [[계기적 근사법]] · [[정적 강화와 부적 강화]] · [[정적 강화]] · [[부적 강화]] · [[조건 강화물]] · [[강화 계획]] · [[처벌]] · [[부적 처벌]]\n* 비교·관찰: [[고전적 조건화와 조작적 조건화 비교]] · [[관찰 학습]] · [[오뚝이 실험]] · [[거울 뉴런]] · [[마음 이론]]\n* 시험: [[명칭 암기표]] · [[자주 틀리는 함정 모음]] · [[모의고사 복기]]"

  "body": "'''학습'''(Learning)은 '''경험에 따른 유기체 행동의 영속적 변화'''이며, 주 목표는 '''외부 환경에 대한 적응'''이다(5장 p.2). 교수가 첫머리에 못 박은 것: 여기서 말하는 학습은 '''공부법이 아니라''' 습관·행동 패턴이 바뀌는 것이다. 공부 내용을 오래 유지하는 법은 [[6장 기억]]에서 다룬다(🎙 9/29).\n\n{def}\n'''설명''': 경험에 따른 유기체 행동의 영속적 변화. 외부 환경에 대한 적응이 주 목표 (5장 p.2)\n'''명칭''': [[학습]] (Learning)\n{/def}\n\n{analogy}\n학습은 '''스마트폰의 자동 완성'''이다. 내가 자주 치는 단어(경험)가 쌓이면 키보드의 추천 순서(행동)가 '''계속''' 바뀐다. 한 번 오타 낸 것(일시적 변화)은 학습이 아니고, 쓰다 보니 영구적으로 바뀐 추천 목록이 학습이다.\n{/analogy}\n\n[[img:L5-02.png|5장 p.2 — 학습 방법의 유형 트리: 비연합(습관화·민감화) / 연합(고전적·조작적) / 관찰(관찰 학습·모델링·대리 조건화)|medium]]\n\n== 학습의 세 양상 ==\n\n{| class=\"table\"\n! 양상 || 정의 || 하위 유형 || 문서\n|-\n| '''비연합 학습''' || 연합을 활용하지 않는 학습. 하나의 자극에 대한 반응 자체가 변함 || [[민감화]](빈도 증대), 둔감화(빈도 감소) || [[민감화]], [[습관화]]\n|-\n| '''연합 학습''' || 두 사건(자극)의 관계를 학습 || [[고전적 조건화]], [[조작적 조건화]] || p.4, p.7–30\n|-\n| '''인지 학습''' || 사건과 사람을 관찰하거나 언어를 기반으로 경험하지 못한 것을 학습 || [[관찰 학습]] || p.5, p.31–38\n|}\n\n=== 비연합 학습 ===\n{def}\n'''설명''': 연합을 활용하지 않는 학습. 자극에 대한 반응 빈도가 증대(민감화)하거나 감소(둔감화)하는 것 (5장 p.2)\n'''명칭''': 비연합 학습 (Non-associative learning)\n{/def}\n\n=== 연합 ===\n{def}\n'''설명''': 두 사건 혹은 자극을 서로 연결하는 것. 반복되면 습관으로 이어짐 (5장 p.3)\n'''명칭''': 연합 (Association)\n{/def}\n\n교수 예: 까마귀가 날자 배가 떨어지는 것을 보면 우연이라도 둘을 묶어 생각한다(오비이락). 연합이 반복되면 '''습관'''이 되고(Wood et al., 2014), 유익한 습관은 자기제어력·실행력을 높이며(Galla & Duckworth, 2015), 습관은 두뇌 회로에도 표상된다(Graybiel & Smith, 2014). 습관 형성은 통상 '''약 2달'''(Lally et al., 2010) — 교수는 \"정확히는 66일\"(🎙 9/29).\n\n[[img:L5-03.png|5장 p.3 — 연합 학습의 예시: 까마귀가 날면 배가 떨어지는구나!|small]]\n\n=== 연합 학습 ===\n{def}\n'''설명''': 두 정보(자극과 자극, 또는 행동과 결과) 사이의 관계를 학습하는 것. 고전적 조건화와 조작적 조건화가 예 (5장 p.2, p.4)\n'''명칭''': 연합 학습 (Associative learning)\n{/def}\n\n=== 인지 학습 ===\n{def}\n'''설명''': 사건과 사람을 관찰하거나 언어를 기반으로 경험하지 못한 것을 학습하는 방식 (5장 p.5)\n'''명칭''': 인지 학습 (Cognitive learning)\n{/def}\n\n인간에게는 타인의 시점을 이해하고 공감하는 기제([[마음 이론]], [[거울 뉴런]])가 있어 타인의 경험을 보는 것만으로 흡수할 수 있다. 동물도 가능하다(맹수의 사냥 방법 전수, 침팬지의 사회적 행동). 대표 예가 [[관찰 학습]].\n\n{warn}\np.2 그림에는 세 번째 갈래가 \"Watching others(관찰)\"로, p.5 본문에는 \"인지학습\"으로 적혀 있다. 교수 정리: '''큰 범주가 인지 학습, 그 하위가 관찰 학습'''(🎙 9/29). 시험에서 \"세 양상\" 은 비연합 / 연합 / 인지(관찰).\n{/warn}\n\n{quiz}\n\"같은 자극에 계속 노출되자 그 자극에 대한 반응이 점차 줄어든 신생아\"는 세 양상 중 어디에 속하는가?\n{/quiz}\n{answer}\n'''비연합 학습'''(둔감화 = [[습관화]]). 두 자극을 묶지도(고전적), 행동과 결과를 묶지도(조작적), 남을 보지도(관찰) 않았다. 하나의 자극에 대한 반응만 변했다. (bank ch5 MC, 5장 p.2)\n{/answer}\n\n== 관련 문서 ==\n* [[5장 학습]] · [[민감화]] · [[습관화]] · [[신경 가소성]]\n* [[고전적 조건화]] · [[조작적 조건화]] · [[관찰 학습]]\n\n근거: 5장 p.2–5"
 },
 "민감화": {
  "title": "민감화 (Sensitization)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''민감화'''(Sensitization)는 '''자극에 대한 행동 반응 빈도가 증대되는 현상'''이다(5장 p.2). 둔감화(Habituation, → [[습관화]])와 함께 [[학습|비연합 학습]]의 두 축을 이룬다. 교수 예: 시끄러운 소음에 점점 적응하면 둔감화, 오히려 '''더 예민해지면''' 민감화(🎙 9/29).\n\n{def}\n'''설명''': 자극에 대한 행동 반응 빈도가 증대되는 현상 (5장 p.2)\n'''명칭''': [[민감화]] (Sensitization)\n'''사례형''': 층간소음을 몇 주 겪은 뒤로 윗집의 작은 발소리에도 깜짝 놀라 반응하는 일이 오히려 잦아졌다.\n{/def}\n\n{analogy}\n민감화는 '''화재 경보기 감도를 올리는 것''', 둔감화는 '''감도를 낮추는 것'''이다. 같은 연기(자극)인데 감도가 올라가면 더 자주 울리고(민감화), 내려가면 덜 울린다(둔감화). 연기와 다른 무언가를 '''묶는''' 과정이 없으니 '''비연합''' 학습이다.\n{/analogy}\n\n== 민감화 vs 둔감화 ==\n\n{| class=\"table\"\n! || '''민감화''' (Sensitization) || '''둔감화''' (Habituation)\n|-\n| 정의 (p.2) || 자극에 대한 행동 반응 빈도가 '''증대''' || 자극에 대한 행동 반응 빈도가 '''낮아짐'''\n|-\n| 예 || 소음에 점점 더 예민해짐 || 소음에 점점 적응해 신경 안 씀\n|-\n| 다른 장에서 || — || 3장 p.6 신생아 [[습관화]](같은 영어 Habituation)\n|-\n| 분류 || '''비연합 학습'''(연합 없음) || '''비연합 학습'''(연합 없음)\n|}\n\n{warn}\n'''둔감화 = 습관화'''. 5장 슬라이드는 Habituation 을 \"둔감화\"로, 3장은 \"습관화\"로 번역했다. 같은 개념이다. 또 4장 [[감각 순응]](감각 수용기 수준의 민감도 감소)과도 계열이 비슷하지만, 5장 맥락에서 '''행동 반응 빈도'''를 말하면 둔감화다.\n{/warn}\n\n교수 보충(🎙 9/29): 민감화·둔감화는 행동뿐 아니라 '''신경학적'''으로도 나타난다(뉴런 발화율 변화) → [[신경 가소성]].\n\np.38 에서도 둔감화가 다시 나온다: 폭력적 게임은 '''둔감화 과정'''을 통해 공격성을 높일 수 있다(Allen & Anderson, 2017) — 폭력 장면에 대한 반응이 무뎌지는 것.\n\n== 관련 문서 ==\n* [[습관화]] · [[학습]] · [[신경 가소성]] · [[감각 순응]]\n\n근거: 5장 p.2 (p.38)"
 },
 "고전적 조건화": {
  "title": "고전적 조건화 (Classical Conditioning)",
  "category": [
   "5장 학습",
   "이론"
  ],
  "body": "'''고전적 조건화'''(Classical Conditioning, 파블로프식 조건형성)는 '''무관한 두 자극을 연합하여 미래 사건을 예측'''하는 학습이다. 조건화된 자극에 대한 반응은 '''자동적'''으로 생성된다(5장 p.4). [[파블로프]]의 개 실험이 원형이며, [[행동주의]]를 대표하는 이론이다(🎙 9/29).\n\n{def}\n'''설명''': 무관한 두 자극을 연합하여 미래 사건을 예측하는 학습. 조건화된 자극에 대한 반응은 자동적으로 생성됨 (5장 p.4)\n'''명칭''': [[고전적 조건화]] (Classical Conditioning)\n'''사례형''': 번개 섬광 뒤에 곧 천둥이 온다는 것을 겪은 뒤로, 섬광만 봐도 몸을 움츠리게 되었다.\n{/def}\n\n{analogy}\n고전적 조건화는 '''카톡 알림음'''이다. 알림음(원래 무의미한 소리) 뒤에는 늘 '''친구의 메시지'''(반가움을 부르는 자극)가 왔다. 수백 번 반복되자 이제 남의 폰에서 같은 알림음만 울려도 심장이 반응한다. 내가 뭘 '''한''' 게 아니라 두 사건이 '''붙어서''' 왔을 뿐 — 그래서 반응이 자동적이다.\n{/analogy}\n\n[[img:L5-07.png|5장 p.7 — 파블로프의 조건화 실험 패러다임|large]]\n\n== 기본 절차 (p.7) ==\n\n<pre class=\"ascii\">\n 1) [[무조건 자극|US]](먹이) ─────────────▶ [[무조건 반응|UR]](침)      ← 자극-반응 확인\n 2) [[중성 자극|NS]](종) → US(먹이) ──────▶ UR(침)       × 반복   ★ NS 먼저, US 나중\n 3) [[조건 자극|CS]](종) ─────────────────▶ [[조건 반응|CR]](침)      ← 학습 완료\n 4) CS 만 반복 (US 없음) ───────▶ CR ↓        = '''[[소거]]'''\n 5) 휴지기간 → CS ───────────────▶ CR 일부 ↑   = '''[[자발적 회복]]'''\n<\/pre>\n\n[[anim:pavlov_dog|종과 먹이가 짝지어지는 순서(NS 먼저)와 오른쪽 CR 그래프의 획득→소거→자발적 회복을 따라가라]]\n\n[[sim:classical_conditioning]]\n\n== 고전적 조건화의 현상들 ==\n\n{| class=\"table\"\n! 현상 || 내용 || 문서\n|-\n| '''획득''' || NS 와 US 가 연합하여 조건화 (p.11 그래프 \"획득(NS+US)\", p.30) || 이 문서\n|-\n| 제시 순서 || US 가 NS 이전에 제시되면 조건형성 거의 발생하지 않음 (p.10) || [[중성 자극]]\n|-\n| 고차 조건형성 || CS 를 다른 NS 와 연합, 1차보다 약함 (p.10) || [[고차 조건형성]]\n|-\n| 소거 · 자발적 회복 || CS 만 반복 → CR 감소 / 휴지 후 부분 회복 (p.11) || [[소거]], [[자발적 회복]]\n|-\n| 일반화 · 변별 || 유사 자극에도 반응 / 무관련 자극 구분 (p.12) || [[일반화]], [[변별]]\n|}\n\n=== 획득 ===\n{def}\n'''설명''': 고전적 조건화에서 중립 자극과 무조건 자극이 연합하여 조건 반응이 형성·강해지는 단계 (5장 p.11 그래프, p.30)\n'''명칭''': 획득 (Acquisition)\n{/def}\n\n== 의의 (p.13–14) ==\n# 학습 과정을 '''객관적으로 연구'''할 수 있는 방법 제공 (심리학의 과학성 정립)\n# 다양한 자극에 대한 다양한 반응이 여러 유기체에서 형성될 수 있음\n# '''진화적 관점''': 혐오·공포 자극에 대한 연합 학습이 생존률을 높임\n# 신경과학에서 CS–US 연결 신경회로 보고 (Harnett 2016; Yau & McNally 2018)\n# 연합 개념은 지식 구조에도 적용 — [[점화|의미 점화]](병원-약국, 럭키-세븐)\n\n== 응용 (p.15–16) ==\n\n[[img:L5-16.png|5장 p.16 — 반복 노출 치료법 4단계: 공포의 조건화 형성 → 반복적 노출 → 소거 학습 → 증상 완화|medium]]\n\n{| class=\"table\"\n! 응용 || 슬라이드 || 원리\n|-\n| 갈망 치료 || 약물을 쓰던 상황·맥락 → 강한 갈망. 조건 형성된 상황·대상 '''제거'''로 치료 시작 (Siegel, 2005). 과체중인 사람의 음식 조건 반응 (Hill, 2007) || 맥락 = CS. 🎙 마운자로·위고비: 불쾌한 신체 감각과 음식의 연합\n|-\n| 면역 반응 || 면역 약물에 특정한 맛 첨가 → 맛만으로 면역 반응 (Ader & Cohen, 1985) || 맛 = CS. 🎙 \"[[가짜약 효과|플라시보]]의 다른 발현\"\n|-\n| 공포 치료 || 엘리베이터 반복 탑승 → 위험이 없음을 새로이 조건 학습 (Ellis & Becker, 1982) || '''반복 노출 치료법''' = [[소거]]\n|}\n\n=== 반복 노출 치료법 ===\n{def}\n'''설명''': 공포를 일으키는 대상에 반복적으로 노출시켜, 실제로는 위험이 발생하지 않음을 새로이 조건 학습하게 하여 증상을 완화하는 방법 (5장 p.16)\n'''명칭''': 반복 노출 치료법 (Exposure therapy)\n{/def}\n\n교수: '''일반화된 공포'''는 쉽게 지워지지 않기 때문에 노출로 치료한다(🎙 9/29).\n\n== 조작적 조건화와의 차이 ==\n간단히: 고전적 = '''자극–자극''' 연합(비자발적), [[조작적 조건화|조작적]] = '''행동–결과''' 연합(자발적). 전체 표는 [[고전적 조건화와 조작적 조건화 비교]].\n\n{exam}\n교수 강조(🎙 9/29): '''NS 가 먼저, US 가 나중'''. '''소거는 제거가 아니라 억압'''. '''UR 과 CR 은 같은 행동, 다른 자극'''. 서막 p.11 에서도 고전적 조건화는 행동주의의 대표 연구로 소개됐다.\n{/exam}\n\n== 관련 문서 ==\n* [[파블로프]] · [[중성 자극]] · [[무조건 자극]] · [[조건 자극]] · [[무조건 반응]] · [[조건 반응]]\n* [[소거]] · [[자발적 회복]] · [[고차 조건형성]] · [[일반화]] · [[변별]]\n* [[고전적 조건화와 조작적 조건화 비교]] · [[행동주의]]\n\n근거: 5장 p.4, p.6–16; 서막 p.11"
 },
 "파블로프": {
  "title": "이반 파블로프 (Ivan Pavlov)",
  "category": [

   "학자"
  ],
  "body": "'''이반 파블로프'''(Ivan Pavlov)는 개의 침 분비 실험으로 [[고전적 조건화]]의 패러다임을 세운 러시아 생리학자다. 5장 슬라이드 제목이 아예 \"고전적 조건화(파블로프식 조건형성)\"이고, p.12 일반화의 출처도 Pavlov(1927)다.\n\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 이름(원어) || 이반 파블로프 (Ivan Pavlov)\n|-\n| 학파·분야 || 생리학 → 학습 연구, [[행동주의]]의 토대\n|-\n| 핵심 주장·업적 || 무관한 두 자극(종소리·먹이)의 연합으로 새로운 반응이 학습됨 = [[고전적 조건화]]\n|-\n| 관련 실험·연도 || 개의 조건화 실험 패러다임(p.7–10), 일반화(Pavlov, 1927, p.12)\n|-\n| 시험 포인트 || NS·US·CS·UR·CR 구분, '''NS 먼저 US 나중''', 소거·자발적 회복. ⚠ \"개의 침 분비 실험 = [[스키너]]\" 는 오답\n|}\n\n{analogy}\n파블로프의 실험실은 '''입사 첫날 점심 종'''과 같다. 첫날엔 12시 종(NS)이 그냥 소리였는데, 매일 종 직후 점심(US)이 나오자 한 달 뒤엔 종만 울려도 배가 꼬르륵(CR). 파블로프는 이 \"꼬르륵\"을 '''침의 양'''으로 정확히 잰 사람이다.\n{/analogy}\n\n[[img:L5-07.png|5장 p.7 — 파블로프의 조건화 실험 장치(침 분비량 측정)와 조건형성 전·중·후 도식|large]]\n\n== 실험 카드 ==\n\n{| class=\"table\"\n! 연구자 || 질문 || 절차 || 결과 || 결론 || 함정\n|-\n| 파블로프 || 원래 침과 무관한 소리가 침을 부를 수 있나? || 먹이(US)→침(UR) 확인 → 종(NS) 직후 먹이를 반복 || 종(CS)만으로 침(CR) || 자극 간 '''연합 형성'''이 학습의 핵심 || 먹이를 먼저 주고 종을 나중에 치면 조건형성 거의 안 됨 (p.10)\n|}\n\n<pre class=\"ascii\">\n[NS:종] → [US:먹이] → UR(침)   × 반복   →   [CS:종] → CR(침)\n<\/pre>\n\n[[anim:pavlov_dog|파블로프 실험의 전 과정을 12초로 — 종이 NS 에서 CS 로 이름이 바뀌는 순간을 놓치지 마라]]\n\n{def}\n'''설명''': 종소리와 먹이를 짝지어 제시해 종소리만으로 개가 침을 흘리게 만든 실험으로, 고전적 조건화의 패러다임을 세운 학자 (5장 p.7)\n'''명칭''': [[파블로프]] (Ivan Pavlov)\n{/def}\n\n{joke}\n「파블로프의 개」는 이제 일상어가 됐다. 점심 메뉴 알림만 떠도 입에 침이 고이는 직장인, 알림음만 들어도 폰을 집는 우리 모두가 실험견이다. 다만 시험장에서는 '''누가 종이고 누가 먹이인지'''를 정확히 가려야 한다.\n{/joke}\n\n== 관련 문서 ==\n* [[고전적 조건화]] · [[조건 자극]] · [[조건 반응]] · [[일반화]]\n* 대비: [[스키너]](조작적), [[효과의 법칙|손다이크]](고양이 상자)\n\n근거: 5장 p.6–12"
 },
 "중성 자극": {
  "title": "중성(중립) 자극 (Neutral Stimulus, NS)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''중성 자극'''(Neutral Stimulus, NS) — 슬라이드에서는 \"중립 자극\"이라고도 쓴다 — 은 '''조건 형성이 이루어지기 전에 조건 반응을 유발하지 않는 자극'''이다(5장 p.8). 파블로프 실험의 '''처음''' 종소리. [[무조건 자극]]과 반복해서 짝지어지면 [[조건 자극]](CS)으로 \"승진\"한다.\n\n{def}\n'''설명''': 조건 형성이 이루어지기 전에 조건 반응을 유발하지 않는 자극 (5장 p.8)\n'''명칭''': [[중성 자극]] (Neutral Stimulus, NS) — 중립 자극\n'''사례형''': 처음에는 아무 반응도 일으키지 않던 피자 배달 오토바이 소리\n{/def}\n\n{analogy}\nNS 는 '''아직 아무 뜻도 없는 신입 사원의 이름'''이다. 처음엔 이름을 들어도 아무 감정이 없다. 그런데 그 이름이 불릴 때마다 꼭 '''야근 공지'''(US)가 따라오면, 몇 주 뒤엔 이름만 들어도 한숨이 나온다 — 그때부터 그 이름은 NS 가 아니라 CS 다.\n{/analogy}\n\n{| class=\"table\"\n! 기호 || 이름 || 슬라이드 정의 (5장 p.8–9) || 파블로프 예 || 오토바이 예 (bank)\n|-\n| NS || [[중성 자극]] || 조건 형성이 이루어지기 전에 조건 반응을 유발하지 않는 자극 || 처음의 종소리 || 처음의 배달 오토바이 소리\n|-\n| US || [[무조건 자극]] || 자연스럽고 자동적인 반응을 촉발시키는 자극 || 먹이 || 피자\n|-\n| UR || [[무조건 반응]] || 무조건자극에 대해 자연스럽게 나타나는 반응, 학습 여부와 무관 || 먹이에 침 || 피자에 침\n|-\n| CS || [[조건 자극]] || 중성 자극이 무조건자극과 반복 제시되면서 유기체가 둘을 연합시켜 형성된 자극 || 학습 후의 종소리 || 학습 후의 오토바이 소리\n|-\n| CR || [[조건 반응]] || 조건 자극에 대해 발생하는 반응으로 연합 학습을 통해 발현 || 종소리에 침 || 오토바이 소리에 침\n|}\n\n== 제시 순서: NS 가 먼저 ==\n\n<pre class=\"ascii\">\n ○  [NS:종] ──(직후)──▶ [US:먹이]   × 반복  →  종 = CS        (조건형성 O)\n ✗  [US:먹이] ──▶ [NS:종]           × 반복  →  종 ≈ 여전히 NS  (조건형성 거의 X, p.10)\n<\/pre>\n\n{exam}\n'''중립 자극이 먼저, 무조건 자극이 나중'''(🎙 9/29 28:08). 무조건자극이 중립 자극 '''이전'''에 제시되면 조건 형성은 '''거의 발생하지 않는다'''(p.10). NS 는 US 를 '''예고'''해야 의미를 얻는다.\n{/exam}\n\n[[anim:pavlov_dog|처음 장면에서 종(NS)에 개가 반응하지 않는 것을 확인하고, 먹이와 짝지어진 뒤 이름이 CS 로 바뀌는 순간을 보라]]\n\n{warn}\n\"중성 자극은 피자이고 무조건자극은 침이다\" 같은 보기: 침은 '''반응'''이지 자극이 아니고, 피자는 처음부터 침을 부르므로 '''US'''다. 중성 자극은 \"처음엔 반응을 못 부르던 것\"이다. (bank ch5 MC, p.8–9)\n{/warn}\n\n== 관련 문서 ==\n* [[조건 자극]] · [[무조건 자극]] · [[고전적 조건화]] · [[고차 조건형성]]\n\n근거: 5장 p.7–8, p.10"
 },
 "무조건 자극": {
  "title": "무조건 자극 (Unconditioned Stimulus, US)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''무조건 자극'''(Unconditioned Stimulus, US)은 '''자연스럽고 자동적인 반응을 촉발시키는 자극'''이다(5장 p.8). 학습이 필요 없다 — \"조건이 없는(un-conditioned)\" 자극. 파블로프 실험의 '''먹이'''.\n\n{def}\n'''설명''': 자연스럽고 자동적인 반응을 촉발시키는 자극 (5장 p.8)\n'''명칭''': [[무조건 자극]] (Unconditioned Stimulus, US) — 슬라이드 표기 \"무조건자극\"\n'''사례형''': 아무 학습 없이도 먹으면 침이 고이는 피자\n{/def}\n\n{analogy}\nUS 는 '''기본 내장 앱'''이다. 폰을 사자마자 설치 없이 바로 돌아가는 전화·카메라처럼, US 는 태어날 때부터 반응(UR)과 연결돼 있다. 고전적 조건화는 이 내장 앱에 '''새 바로가기 아이콘'''(CS)을 하나 만들어 붙이는 일이다.\n{/analogy}\n\n{| class=\"table\"\n! 기호 || 이름 || 슬라이드 정의 (5장 p.8–9) || 파블로프 예 || 오토바이 예 (bank)\n|-\n| NS || [[중성 자극]] || 조건 형성이 이루어지기 전에 조건 반응을 유발하지 않는 자극 || 처음의 종소리 || 처음의 배달 오토바이 소리\n|-\n| US || [[무조건 자극]] || 자연스럽고 자동적인 반응을 촉발시키는 자극 || 먹이 || 피자\n|-\n| UR || [[무조건 반응]] || 무조건자극에 대해 자연스럽게 나타나는 반응, 학습 여부와 무관 || 먹이에 침 || 피자에 침\n|-\n| CS || [[조건 자극]] || 중성 자극이 무조건자극과 반복 제시되면서 유기체가 둘을 연합시켜 형성된 자극 || 학습 후의 종소리 || 학습 후의 오토바이 소리\n|-\n| CR || [[조건 반응]] || 조건 자극에 대해 발생하는 반응으로 연합 학습을 통해 발현 || 종소리에 침 || 오토바이 소리에 침\n|}\n\n[[anim:pavlov_dog|먹이(US)가 등장할 때마다 침(UR)이 자동으로 나오는 장면 — 이 연결은 학습 전에도 이미 있다는 점을 보라]]\n\n== US 의 쓰임 ==\n* 획득: NS 와 US 가 연합하여 조건화(p.30). '''US 가 NS 보다 먼저 오면''' 조건형성 거의 안 됨(p.10).\n* 소거: US '''없이''' CS 만 반복 제시하면 CR 감소(p.11). 교수: 이때 다시 US 를 짝지어 주면 조건화가 강화·유지된다(🎙 9/29).\n* [[조건 강화물|1차 강화물]]과의 관계: p.20 은 \"고전적 조건화에서의 먹이\"를 1차 강화물의 예로 든다 — US 는 생득적으로 힘을 가진 자극이라는 점에서 같다.\n\n{warn}\n\"무조건자극은 오토바이 소리이고 조건반응은 침이다\" — 틀림. 오토바이 소리는 '''학습된''' 자극(CS)이다. 반응을 '''처음부터''' 부르는 것만 US 다. (bank ch5 MC, p.8–9)\n{/warn}\n\n== 관련 문서 ==\n* [[무조건 반응]] · [[중성 자극]] · [[조건 자극]] · [[고전적 조건화]]\n\n근거: 5장 p.8, p.10–11"
 },
 "조건 자극": {
  "title": "조건 자극 (Conditioned Stimulus, CS)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''조건 자극'''(Conditioned Stimulus, CS)은 '''중성 자극이 무조건자극과 반복되어 제시되면서, 유기체가 둘을 연합시켜 형성된 자극'''이다(5장 p.8). 즉 이전에 무관했던 [[중성 자극]]이 조건 자극으로 '''변한 것'''. 파블로프 실험에서 학습 '''후'''의 종소리.\n\n{def}\n'''설명''': 중성 자극이 무조건자극과 반복되어 제시되면서, 유기체가 둘을 연합시켜 형성된 자극. 이전에 무관한 중성 자극이 변하게 된 것 (5장 p.8)\n'''명칭''': [[조건 자극]] (Conditioned Stimulus, CS) — 슬라이드 표기 \"조건자극\"\n'''사례형''': 피자가 도착하기 직전마다 들리다 보니 이제는 그 소리만 들어도 침이 고이는 배달 오토바이 소리\n{/def}\n\n{analogy}\nCS 는 '''학교 종소리'''다. 원래는 그냥 \"딩동댕\"(NS)이었지만 매번 그 뒤에 쉬는 시간(US)이 오니, 이제 종소리만 들어도 몸이 먼저 일어선다. 같은 소리인데 '''역사(연합)'''가 생겨서 이름이 바뀐 것이다.\n{/analogy}\n\n{| class=\"table\"\n! 기호 || 이름 || 슬라이드 정의 (5장 p.8–9) || 파블로프 예 || 오토바이 예 (bank)\n|-\n| NS || [[중성 자극]] || 조건 형성이 이루어지기 전에 조건 반응을 유발하지 않는 자극 || 처음의 종소리 || 처음의 배달 오토바이 소리\n|-\n| US || [[무조건 자극]] || 자연스럽고 자동적인 반응을 촉발시키는 자극 || 먹이 || 피자\n|-\n| UR || [[무조건 반응]] || 무조건자극에 대해 자연스럽게 나타나는 반응, 학습 여부와 무관 || 먹이에 침 || 피자에 침\n|-\n| CS || [[조건 자극]] || 중성 자극이 무조건자극과 반복 제시되면서 유기체가 둘을 연합시켜 형성된 자극 || 학습 후의 종소리 || 학습 후의 오토바이 소리\n|-\n| CR || [[조건 반응]] || 조건 자극에 대해 발생하는 반응으로 연합 학습을 통해 발현 || 종소리에 침 || 오토바이 소리에 침\n|}\n\n[[anim:pavlov_dog|같은 종인데 라벨이 NS → CS 로 바뀌는 순간과, 그 뒤 CS 만 반복될 때 CR 그래프가 떨어지는 소거 구간을 보라]]\n\n== CS 가 겪는 일들 ==\n\n{| class=\"table\"\n! 상황 || 결과 || 문서\n|-\n| CS 와 유사한 자극 제시 || 그 자극에도 CR → 일반화 || [[일반화]]\n|-\n| CS 와 무관한 자극 제시 || 반응하지 않음 → 변별 || [[변별]]\n|-\n| CS 를 새 NS 와 짝지음 || 새 NS 도 CS 가 됨(약하게) → 고차 조건형성 || [[고차 조건형성]]\n|-\n| CS 만 반복 (US 없음) || CR 점차 감소 → 소거 || [[소거]]\n|-\n| 휴지기간 후 CS 재제시 || CR 부분 회복 → 자발적 회복 || [[자발적 회복]]\n|}\n\n== 관련 문서 ==\n* [[중성 자극]] · [[조건 반응]] · [[고전적 조건화]] · [[조건 강화물]](조작적 조건화 쪽의 \"학습된 힘\")\n\n근거: 5장 p.7–8, p.10–12"
 },
 "무조건 반응": {
  "title": "무조건 반응 (Unconditioned Response, UR)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''무조건 반응'''(Unconditioned Response, UR)은 '''무조건자극에 대해 자연스럽게 나타나는 반응'''으로, '''학습 여부와 무관하게 자동적으로 발생'''한다(5장 p.9). 예: 먹이를 보고 침 흘리기.\n\n{def}\n'''설명''': 무조건자극에 대해 자연스럽게 나타나는 반응. 학습 여부와 무관하게 자동적으로 발생 (먹이를 보고 침 흘리기) (5장 p.9)\n'''명칭''': [[무조건 반응]] (Unconditioned Response, UR) — 슬라이드 표기 \"무조건반응\"\n{/def}\n\n{analogy}\nUR 은 '''무릎 반사'''처럼 몸에 원래 깔린 반응이다. 뜨거운 냄비에 손이 닿으면 생각보다 먼저 손이 떨어진다. 아무도 가르쳐 주지 않았다 — 그래서 \"무조건\".\n{/analogy}\n\n{| class=\"table\"\n! 기호 || 이름 || 슬라이드 정의 (5장 p.8–9) || 파블로프 예 || 오토바이 예 (bank)\n|-\n| NS || [[중성 자극]] || 조건 형성이 이루어지기 전에 조건 반응을 유발하지 않는 자극 || 처음의 종소리 || 처음의 배달 오토바이 소리\n|-\n| US || [[무조건 자극]] || 자연스럽고 자동적인 반응을 촉발시키는 자극 || 먹이 || 피자\n|-\n| UR || [[무조건 반응]] || 무조건자극에 대해 자연스럽게 나타나는 반응, 학습 여부와 무관 || 먹이에 침 || 피자에 침\n|-\n| CS || [[조건 자극]] || 중성 자극이 무조건자극과 반복 제시되면서 유기체가 둘을 연합시켜 형성된 자극 || 학습 후의 종소리 || 학습 후의 오토바이 소리\n|-\n| CR || [[조건 반응]] || 조건 자극에 대해 발생하는 반응으로 연합 학습을 통해 발현 || 종소리에 침 || 오토바이 소리에 침\n|}\n\n== UR vs CR — 같은 행동, 다른 자극 ==\n\n{| class=\"table\"\n! || 무조건 반응 (UR) || [[조건 반응]] (CR)\n|-\n| 무엇에 대한 반응 || '''무조건 자극'''(먹이) || '''조건 자극'''(종소리)\n|-\n| 학습 필요 || 없음 (생득적) || 있음 (연합 학습)\n|-\n| 겉모습 || 침 || '''똑같이''' 침\n|}\n\n{exam}\n교수 강조(🎙 9/29 21:07): '''UR 과 CR 은 겉으로는 같은 행동'''(침, 꼬리 흔들기)이다. 관건은 '''\"어떤 자극에 반응을 보이는가\"'''. 중성 자극이 조건 자극으로 발전하듯 UR 이 CR 로 변화한다.\n{/exam}\n\n[[anim:pavlov_dog|먹이 앞에서 나오는 침(UR)과 종소리 앞에서 나오는 침(CR)이 같은 모양이라는 점에 주목하라]]\n\n{quiz}\n철수는 피자를 먹으면 침이 고인다. 피자 배달 오토바이 소리가 난 직후 피자가 도착하는 일이 반복되자 이제는 소리만 들어도 침이 고인다. '''피자를 먹을 때''' 나오는 침의 명칭은?\n{/quiz}\n{answer}\n'''무조건 반응(UR)'''. 소리를 듣고 나오는 침은 조건 반응(CR). 같은 침이라도 피자(US)에 대한 반응이면 UR 이다. (bank ch5 MC 정답 ②, p.8–9)\n{/answer}\n\n== 관련 문서 ==\n* [[조건 반응]] · [[무조건 자극]] · [[고전적 조건화]]\n\n근거: 5장 p.9"
 },
 "조건 반응": {
  "title": "조건 반응 (Conditioned Response, CR)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''조건 반응'''(Conditioned Response, CR)은 '''조건 자극에 대해 발생하는 반응으로, 연합 학습을 통해 발현'''된다(5장 p.9). 예: 소리를 듣고 침 흘리기. 이전의 무조건반응이 '''조건 자극에 한해서만 동일한 양상으로''' 발현되는 것.\n\n{def}\n'''설명''': 조건 자극에 대해 발생하는 반응으로 연합 학습을 통해 발현됨 (소리를 듣고 침 흘리기) (5장 p.9)\n'''명칭''': [[조건 반응]] (Conditioned Response, CR) — 슬라이드 표기 \"조건반응\"\n'''사례형''': 배달 오토바이 소리만 들어도 고이는 침\n{/def}\n\n{analogy}\nCR 은 '''치과 드릴 소리에 움찔하는 것'''이다. 소리 자체는 아프지 않은데, 그 소리 뒤엔 늘 시린 통증(US)이 따라왔다. 그래서 대기실에서 소리만 들어도 어깨가 굳는다. 몸은 통증 때와 '''똑같이''' 반응하지만, 반응의 방아쇠가 소리로 바뀌었다.\n{/analogy}\n\n[[img:L5-11.png|5장 p.11 — CR 의 강도 그래프: 획득(NS+US)에서 오르고, 소거(CS만 제시)에서 내려가고, 휴지기간 뒤 자발적 회복으로 일부 되살아남|medium]]\n\n{| class=\"table\"\n! 기호 || 이름 || 슬라이드 정의 (5장 p.8–9) || 파블로프 예 || 오토바이 예 (bank)\n|-\n| NS || [[중성 자극]] || 조건 형성이 이루어지기 전에 조건 반응을 유발하지 않는 자극 || 처음의 종소리 || 처음의 배달 오토바이 소리\n|-\n| US || [[무조건 자극]] || 자연스럽고 자동적인 반응을 촉발시키는 자극 || 먹이 || 피자\n|-\n| UR || [[무조건 반응]] || 무조건자극에 대해 자연스럽게 나타나는 반응, 학습 여부와 무관 || 먹이에 침 || 피자에 침\n|-\n| CS || [[조건 자극]] || 중성 자극이 무조건자극과 반복 제시되면서 유기체가 둘을 연합시켜 형성된 자극 || 학습 후의 종소리 || 학습 후의 오토바이 소리\n|-\n| CR || [[조건 반응]] || 조건 자극에 대해 발생하는 반응으로 연합 학습을 통해 발현 || 종소리에 침 || 오토바이 소리에 침\n|}\n\n== CR 의 일생 (p.11 그래프) ==\n\n<pre class=\"ascii\">\n CR 강도\n  강 │      ●●●\n     │    ●     ●                    ● (자발적 회복: 부분)\n     │  ●         ●                 ●  ●\n     │ ●            ●              ●     ●\n  약 │●                ●●    ┊     ┊        ●●\n     └──────────────────────┊─────┊──────────▶ 시간\n       획득(NS+US)   소거(CS만)  휴지기간   다시 소거\n<\/pre>\n\n[[anim:pavlov_dog|오른쪽 그래프에서 CR 강도가 획득↑ → 소거↓ → 자발적 회복(부분)으로 움직이는 것을 확인하라]]\n\n{warn}\n\"오토바이 소리에 나오는 침은 무조건반응\" — 틀림. '''학습된 자극(CS)에 대한''' 반응이므로 CR 이다. (bank ch5 MC, p.8–9)\n{/warn}\n\n== 관련 문서 ==\n* [[무조건 반응]] · [[조건 자극]] · [[소거]] · [[자발적 회복]]\n\n근거: 5장 p.9, p.11"
 },
 "고차 조건형성": {
  "title": "고차 조건형성 (Higher-order Conditioning)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''고차 조건형성'''(Higher-order Conditioning)은 '''한 조건 자극을 다른 중성 자극과 연합하여 조건화시키는 방법'''이다(5장 p.10). 이미 [[조건 자극]](CS)이 된 것이 이번엔 [[무조건 자극]] 역할을 대신해서, 새 [[중성 자극]]을 또 하나의 CS 로 만든다. '''1차 조건 형성보다는 약하게 형성되나, 일생 삶에 영향을 줄 수 있다.'''\n\n{def}\n'''설명''': 한 조건 자극을 다른 중성 자극과 연합하여 조건화시키는 방법. 1차 조건 형성보다 약하게 형성됨 (5장 p.10)\n'''명칭''': [[고차 조건형성]] (Higher-order Conditioning)\n'''사례형''': 종소리만 들어도 침을 흘리게 된 개에게 먹이 없이 종소리와 불빛을 반복해 짝지었더니, 불빛만 봐도 침을 흘리게 되었다. (bank ch5 SA)\n{/def}\n\n{analogy}\n고차 조건형성은 '''친구의 친구'''다. 나는 A(먹이)를 좋아하고, B(종)는 늘 A 와 같이 다녀서 좋아졌다. 이제 C(불빛)가 B 와 자주 붙어 다니니 C 도 어쩐지 호감이 간다 — 다만 '''직접 아는 사이(1차)보다는 덜''' 친하다.\n{/analogy}\n\n<pre class=\"ascii\">\n 1차 조건형성    [NS1:종] → [US:먹이]  × 반복   →  종 = '''CS1'''  → CR(침, 강함)\n 고차 조건형성   [NS2:불빛] → [CS1:종] × 반복   →  불빛 = '''CS2''' → CR(침, '''약함''')\n                 ↑ 먹이는 더 이상 안 나옴\n<\/pre>\n\n[[img:L5-10.png|5장 p.10 — 고차 조건 형성: 한 조건 자극을 다른 중성 자극과 연합하여 조건화시키는 방법|medium]]\n\n[[sim:classical_conditioning]]\n\n시뮬레이터 옵션 `scenario` 를 '''higher_order''' 로 바꾸면 종(CS1) 완성 후 불빛+종 → 불빛(CS2)의 CR 이 1차보다 낮게 나오는 것을 볼 수 있다.\n\n{| class=\"table\"\n! || 1차 조건형성 || 고차 조건형성\n|-\n| 짝짓는 상대 || NS + '''US''' || NS + '''기존 CS'''\n|-\n| 강도 || 강함 || 1차보다 '''약함'''\n|-\n| 예 || 종 + 먹이 || 나팔 소리 + 종 (🎙 9/29)\n|}\n\n일상 예(정리본 노트): 개에게 물린 적이 있는 사람이 개를 보기만 해도 무섭고, '''짖는 소리'''만 들어도 비슷한 공포가 생긴다. p.20 에서 [[조건 강화물]]에는 \"고전적 조건화에서 고차 조건 형성을 거친 자극들이 포함될 수 있다\"고 다시 연결된다.\n\n{warn}\n[[일반화]]와 헷갈리지 말 것. 일반화는 CS 와 '''비슷한''' 자극(트라이앵글 소리)에 '''별도 절차 없이''' 반응이 퍼지는 것, 고차 조건형성은 '''전혀 다른''' 자극(불빛)을 CS 와 '''짝지어 훈련'''하는 것이다. 교수: 속성이 많이 다르면 고차 조건형성이 필요하고, 비슷하면 일반화가 일어난다(🎙 9/29).\n{/warn}\n\n== 관련 문서 ==\n* [[조건 자극]] · [[일반화]] · [[조건 강화물]] · [[고전적 조건화]]\n\n근거: 5장 p.10"
 },
 "소거": {
  "title": "소거 (Extinction)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''소거'''(Extinction)는 조건 형성 이후, '''조건화된 자극을 무조건자극 없이 반복적으로 제시하면 조건화된 반응이 점차 감소'''하는 현상이다(5장 p.11). 그런데 이 장 최고의 함정이 여기 있다 — 소거는 반응을 '''지우는 것이 아니라 눌러 두는 것'''이다.\n\n{def}\n'''설명''': 조건 형성 이후, 조건 자극을 무조건자극 없이 반복적으로 제시하면 조건 반응이 점차 감소하는 현상 (5장 p.11)\n'''명칭''': [[소거]] (Extinction) — 조건화 소거\n'''사례형''': 종소리에 침을 흘리던 개에게 먹이 없이 종소리만 계속 들려주자 더 이상 침을 흘리지 않게 되었다.\n{/def}\n\n{exam}\n⭐⭐⭐ '''소거가 조건 반응을 제거하는 것이 아니라 억압하는 쪽에 가까움'''(p.11). 증거는 [[자발적 회복]] — 휴지기간 후 CS 를 다시 주면 CR 이 '''부분적으로''' 돌아온다(🎙 9/29 30:15). 통합요약 §0-1 교수 강조.\n{/exam}\n\n{analogy}\n소거는 '''휴지통'''이지 '''완전 삭제'''가 아니다. 파일(CR)을 휴지통에 넣으면 바탕화면에서는 안 보이지만, 며칠 뒤 열어 보면 그대로 있어 \"복원\"(자발적 회복)할 수 있다. 진짜 영구 삭제는 휴지통 비우기를 계속 해야 한다 — 교수 말로 \"계속 US 없이 두면 결국 완전히 사라진다.\"\n{/analogy}\n\n[[img:L5-11.png|5장 p.11 — 조건화의 소거와 자발적 회복 그래프: 소거(CS만 제시) 구간에서 CR 이 바닥까지 떨어졌다가 휴지기간 뒤 되살아남|large]]\n\n[[anim:pavlov_dog|소거 구간(CS만)에서 그래프가 바닥으로 내려간 뒤, 휴지기 다음에 다시 솟는 부분 — 이것이 \"억압이지 제거가 아니다\"의 그림이다]]\n\n[[sim:classical_conditioning]]\n\n== 고전적 vs 조작적 조건화의 소거 (p.30) ==\n\n{| class=\"table\"\n! || 고전적 조건화 || 조작적 조건화\n|-\n| 소거 || '''조건 자극만''' 제시되면 반응이 감소 || '''강화가 차단'''될 시 반응이 감소\n|-\n| 그 뒤 || 휴지기간 후 소거된 CR 재출현 || 휴지기간 후 소거된 반응 재출현\n|}\n\n[[강화 계획]]과도 연결된다: 부분 강화계획은 '''소거 저항도가 높고''', 특히 변동비율(슬롯머신)은 '''소거가 잘 이루어지지 않는다'''(p.22–23).\n\n== 응용: 반복 노출 치료법 ==\n엘리베이터 공포가 있는 사람을 반복 탑승시켜 \"아무 일도 안 일어난다\"를 새로 학습시키는 [[고전적 조건화|반복 노출 치료법]](p.16)은 소거 기제를 쓴 것이다. 슬라이드 그림(4단계: 공포의 조건화 형성 → 반복적 노출 → 소거 학습 → 증상 완화)의 3번째 단계 제목이 그대로 \"소거 학습\".\n\n{warn}\nbank 오답 보기 모음\n* \"소거는 조건 반응을 '''영구적으로 완전히 제거'''하는 과정\" → ✗ (휴지 후 재출현)\n* \"소거는 CS 와 US 를 '''계속 함께''' 제시할 때 일어난다\" → ✗ (그건 조건화 '''유지·강화''', 소거는 US '''없이''')\n* \"소거된 CR 은 새로운 중성 자극과 연합했을 때만 다시 나타난다\" → ✗ (휴지 후 CS 만 다시 줘도 재출현)\n{/warn}\n\n== 관련 문서 ==\n* [[자발적 회복]] · [[조건 반응]] · [[고전적 조건화]] · [[강화 계획]]\n\n근거: 5장 p.11, p.16, p.30"
 },
 "자발적 회복": {

   "용어"
  ],
  "body": "'''자발적 회복'''(Spontaneous Recovery)은 [[소거]] 이후 '''일정한 휴지기간을 거친 후, 다시 조건화 자극을 제시하면 부분적으로 조건화 반응의 빈도가 회복'''되는 현상이다(5장 p.11). 소거가 반응을 '''제거'''한 게 아니라 '''억압'''했을 뿐이라는 증거.\n\n{def}\n'''설명''': 소거 후 일정한 휴지기간을 거쳐 다시 조건 자극을 제시하면 조건 반응이 부분적으로 회복되는 현상 (5장 p.11)\n'''명칭''': [[자발적 회복]] (Spontaneous Recovery)\n'''사례형''': 먹이 없이 종소리만 들려주어 침을 흘리지 않게 된 개를 며칠 쉬게 한 뒤 다시 종소리를 들려주자 침을 조금 흘렸다. (bank ch5 SA)\n{/def}\n\n{analogy}\n자발적 회복은 '''전 애인 노래'''다. 헤어지고 한동안 그 노래를 들어도 무덤덤해졌다(소거). 그런데 몇 달 지나 카페에서 갑자기 그 노래가 나오면 가슴이 '''살짝''' 저릿하다. 완전히 처음만큼은 아니지만(부분 회복), 지워진 줄 알았던 반응이 아직 거기 있었다.\n{/analogy}\n\n[[img:L5-11.png|5장 p.11 — 휴지기간 뒤 \"CR 의 자발적 회복\" 지점: 획득 최고치보다는 낮고, 소거 최저치보다는 높다|medium]]\n\n== 핵심 세 단어 ==\n{| class=\"table\"\n! 키워드 || 의미 || 함정\n|-\n| '''휴지기간''' || CS 를 주지 않고 쉬는 시간 || 휴지기간 없이 바로 재제시하는 게 아님\n|-\n| '''부분적''' || 획득 때 최고치만큼은 아님 || \"완전히 원래대로\" ✗\n|-\n| '''억압의 증거''' || 소거 = 제거가 아니라 억압 || \"소거 = 영구 삭제\" ✗\n|}\n\n[[anim:pavlov_dog|그래프 오른쪽 끝 — 휴지기간 다음에 다시 솟는 짧은 봉우리가 자발적 회복이다]]\n\n[[sim:classical_conditioning]]\n\n시뮬레이터 표시용 예시값: 획득 최고 85 → 소거 최저 5 → 자발적 회복 40. '''5 < 40 < 85''' 가 \"부분 회복\"의 뜻이다.\n\n자발적 회복은 [[조작적 조건화]]에서도 나타난다: \"휴지기간 후, 소거된 반응이 재출현\"(p.30 비교표). 두 조건화의 공통 현상 5개(획득·소거·자발적 회복·일반화·변별) 중 하나.\n\n{exam}\n교수 강조(🎙 9/29 30:15): 소거는 CR 의 '''일시적 억압'''에 가깝고, '''자발적 회복이 그 증거'''다. 이때 US 를 다시 짝지어 주면 조건화가 강화·유지되고, 계속 US 없이 두면 결국 완전히 사라진다.\n{/exam}\n\n== 관련 문서 ==\n* [[소거]] · [[조건 반응]] · [[고전적 조건화와 조작적 조건화 비교]]\n\n근거: 5장 p.11, p.30"
 },
 "일반화": {
  "title": "일반화 (Generalization)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''일반화'''(Generalization)는 '''조건화 자극과 유사한 속성을 지닌 자극에도 조건 반응을 보이는 현상'''이다(Pavlov, 1927; 5장 p.12). 반응이 원래 CS 바깥으로 '''퍼지는''' 방향. 짝 개념은 [[변별]].\n\n{def}\n'''설명''': 조건화 자극과 유사한 속성을 지닌 자극에도 조건 반응을 보이는 현상 (5장 p.12)\n'''명칭''': [[일반화]] (Generalization)\n'''사례형''': 어릴 때 벌에 쏘여 벌을 무서워하게 된 영희가 이제는 파리나 나방 같은 날벌레만 봐도 공포를 느낀다. (bank ch5 MC)\n{/def}\n\n{analogy}\n일반화는 속담 그대로 '''「자라 보고 놀란 가슴 솥뚜껑 보고 놀란다」'''(🎙 9/29). 둥글고 납작하고 거무스름한 것(유사 속성)이면 일단 놀라고 본다. 몸 입장에선 \"혹시 자라면?\" 하고 한 번 더 피하는 게 생존에 이득이었다.\n{/analogy}\n\n[[img:L5-12.png|5장 p.12 — 종소리(조건 자극)에 침 분비(조건 반응) → 비슷한 종소리·다른 모양의 종·트라이앵글·호루라기에도 동일한 반응 = 일반화|large]]\n\n== 일반화 vs 변별 ==\n\n{| class=\"table\"\n! || '''일반화''' (Generalization) || '''[[변별]]''' (Discrimination)\n|-\n| 고전적 (p.12, p.30) || 조건 자극과 '''유사한''' 자극에 반응하는 경향 || 조건 자극과 '''다른''' 자극을 구분하는 학습\n|-\n| 조작적 (p.30) || 한 상황에서 학습한 반응이 '''유사 상황'''에서 발현 || 특정 반응만 강화되고 다른 반응은 그렇지 않은 학습\n|-\n| 반응 범위 || 넓어짐 || 좁아짐\n|-\n| 예 || 벌 → 날벌레, 종 → 트라이앵글 || 종엔 침, 자동차 경적엔 무반응\n|}\n\n== 슬라이드의 두 근거 ==\n* 혐오감의 일반화: 혐오감과 관련된 자극이 있으면 그와 유사한 자극에도 자연스럽게 혐오감이 형성(Rozin et al., 1986). 교수 예: 냄새가 비슷한 음식들을 모두 기피(🎙 9/29).\n* '''일반화된 공포는 쉽게 사라지지 않음'''(Stout et al., 2018) → 그래서 [[고전적 조건화|반복 노출 치료법]]으로 치료한다(p.16).\n\n{warn}\nbank 오답 보기: 벌→날벌레 사례에 \"[[소거]]\"(조건 반응 감소 절차인데 여기선 오히려 퍼짐), \"둔감화\"(같은 자극 반복 노출로 반응 감소 — 방향이 반대), \"변별\"(반대 개념). 반응이 '''비슷한 것으로 번지면''' 일반화다.\n{/warn}\n\n{tip}\n[[고차 조건형성]]과의 구분: 일반화는 '''비슷한''' 자극에 '''훈련 없이''' 퍼짐, 고차 조건형성은 '''다른''' 자극을 CS 와 '''짝지어 훈련'''.\n{/tip}\n\n== 관련 문서 ==\n* [[변별]] · [[조건 자극]] · [[고차 조건형성]] · [[고전적 조건화와 조작적 조건화 비교]]\n\n근거: 5장 p.12, p.30"
 },
 "변별": {
  "title": "변별 (Discrimination)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''변별'''(Discrimination)은 '''조건 자극과 무관련 자극을 구분할 수 있는 능력'''이다(5장 p.12). [[일반화]]와 더불어 특정 대상 간의 연관성을 학습할 수 있는 기제 — 일반화가 반응을 '''넓히는''' 쪽이면 변별은 '''좁히는''' 쪽이다.\n\n{def}\n'''설명''': 조건 자극과 무관련 자극을 구분할 수 있는 능력 (5장 p.12)\n'''명칭''': [[변별]] (Discrimination)\n'''사례형''': 종소리에는 침을 흘리지만, 같은 방에서 울리는 자동차 경적에는 반응하지 않는 개\n{/def}\n\n{analogy}\n변별은 '''내 폰 벨소리만 알아듣는 귀'''다. 지하철에서 비슷한 벨소리가 수십 번 울려도 처음엔 다 주머니를 만지다가(일반화), 점점 내 벨소리에만 반응하게 된다(변별). 진짜 연결된 것과 아닌 것을 가려내는 필터.\n{/analogy}\n\n{| class=\"table\"\n! || [[일반화]] || '''변별'''\n|-\n| 고전적 (p.30) || 조건 자극과 유사한 자극에 반응하는 경향 || 조건 자극과 '''다른 자극을 구분'''하는 학습\n|-\n| 조작적 (p.30) || 한 상황에서 학습한 반응이 유사 상황에서 발현 || '''특정 반응만 강화'''되고 다른 반응은 그렇지 않은 학습\n|-\n| 방향 || 반응이 퍼짐 || 반응이 좁아짐\n|}\n\n[[img:L5-30.png|5장 p.30 — 고전적 조건화 VS 조작적 조건화 표의 마지막 두 줄(일반화·변별)|medium]]\n\n변별은 처벌 이야기에도 다시 나온다: APA(2019)에 따르면 체벌은 '''상황 변별력'''을 줄 뿐 행동의 효과적 감소로 이어지지 않는다(p.25) — \"엄마 앞에서만 안 하면 된다\"를 가르칠 뿐이라는 뜻.\n\n{warn}\n\"변별 = 일반화의 반대이니 둘 중 하나만 일어난다\"는 생각은 틀렸다. 슬라이드는 두 개념을 '''함께''' 대상 간 연관성을 학습하는 기제로 소개하고, 고전적·조작적 조건화 '''모두'''에서 나타난다고 한다(p.30 공통점). \"일반화·변별은 고전적 조건화에서만\" 보기는 오답.\n{/warn}\n\n== 관련 문서 ==\n* [[일반화]] · [[고전적 조건화와 조작적 조건화 비교]] · [[처벌]]\n\n근거: 5장 p.12, p.25, p.30"
 },
 "조작적 조건화": {
  "title": "조작적 조건화 (Operant Conditioning)",
  "category": [
   "5장 학습",
   "이론"
  ],
  "body": "'''조작적 조건화'''(Operant Conditioning)는 '''유기체가 자신의 행위를 결과와 연합하여 행동의 빈도를 조절하는 학습 방법'''이다(5장 p.17). 행동 조절을 위해 환경에 일련의 '''조작(보상 및 처벌)'''을 가함으로써 빈도의 변화를 추구한다(p.4). 뿌리는 손다이크의 [[효과의 법칙]], 완성자는 [[스키너]].\n\n{warn}\n'''슬라이드 오기''': p.4·p.17·p.18 의 \"Operational Conditioning\" 은 틀린 표기다. 올바른 원어는 '''Operant Conditioning'''. 1장 [[조작적 정의]](Operational Definition)와 이름이 비슷하지만 '''전혀 다른 개념'''이다 — 조작적 정의는 변인을 측정 가능하게 정의하는 연구 방법, 조작적 조건화는 행동–결과 연합 학습.\n{/warn}\n\n{def}\n'''설명''': 유기체가 자신의 행위를 결과와 연합하여 행동의 빈도를 조절하는 학습 방법. 반응을 그 결과와 연합시키는 방식 (5장 p.4, p.17)\n'''명칭''': [[조작적 조건화]] (Operant Conditioning) — 조작적 조건형성\n'''사례형''': 아이가 \"과자 주세요\"를 예의 바르게 말했더니 과자를 받았고, 이후 예의 바르게 부탁하는 행동이 늘었다. (p.4 그림)\n{/def}\n\n{analogy}\n조작적 조건화는 '''게임의 업적 시스템'''이다. 특정 행동(퀘스트 완료)을 하면 보상(경험치·아이템)이 떨어지니 그 행동을 더 하게 되고, 특정 행동(팀킬)을 하면 패널티가 오니 덜 하게 된다. 고전적 조건화가 \"종 → 먹이\" 처럼 '''세상이 알아서''' 주는 순서를 배우는 거라면, 조작적 조건화는 '''내가 버튼을 눌러야''' 결과가 나온다.\n{/analogy}\n\n[[img:L5-04.png|5장 p.4 아래 — 조작적 조건화 예시: (a) 행동: 예의 바름 → (b) 결과: 과자를 얻는다 → (c) 행동이 강화된다|medium]]\n\n== 이름의 유래 ==\n교수(🎙 9/29 51:04): 보상과 처벌이라는 '''조작'''을 가해 행동 빈도를 바꾸므로 \"조작적\" 조건화. 효과의 법칙에서 \"이와 같은 보상/처벌에 대한 조작을 '''조작 행동'''으로 정의\"(p.17).\n\n== 계보 ==\n<pre class=\"ascii\">\n [[효과의 법칙|손다이크]] (1898, 고양이 문제 상자)       →   [[스키너]] (스키너 상자)\n   \"보상 뒤 행동↑, 처벌 뒤 행동↓\"                   \"효과의 법칙을 '''행동 공학'''으로\"\n   = '''[[효과의 법칙]]'''                                  = [[강화]] · [[행동 조성]] · [[계기적 근사법]]\n<\/pre>\n\n[[anim:skinner_box|레버를 누르는 쥐 옆에서 2×2 격자가 하나씩 켜진다 — 조작적 조건화의 네 가지 결과 조작을 한 번에 보라]]\n\n== 조작적 조건화의 도구 상자 ==\n\n{| class=\"table\"\n! 도구 || 행동 || 문서\n|-\n| 정적 강화 (보상 제공) || ↑ || [[정적 강화]]\n|-\n| 부적 강화 (혐오 자극 제거) || ↑ || [[부적 강화]]\n|-\n| 정적 처벌 (혐오 자극 제공) || ↓ || [[처벌]]\n|-\n| 부적 처벌 (보상 철회) || ↓ || [[부적 처벌]]\n|-\n| 강화물의 종류 (1차·조건, 즉시·지연) || — || [[조건 강화물]]\n|-\n| 강화 계획 (연속·부분, 비율·간격 × 고정·변동) || — || [[강화 계획]]\n|}\n\n== 응용 (p.28–29) ==\n학교(즉각 피드백), 스포츠(단계적 목표), 컴퓨터 프로그램(강화 원리 기반 알고리즘), 직장(조직심리학), 가정교육, 자기 행동 수정. 스스로에게 적용할 땐 ① 현실적·측정 가능한 목표 ② 언제·어디서·어떻게 ③ 빈도 확인 ④ 바람직한 행동 강화(\"스스로를 위한 선물\") ⑤ '''보상을 점진적으로 축소'''해 내적 동기로.\n\n{| class=\"table\"\n! || [[고전적 조건화]] || '''조작적 조건화'''\n|-\n| 연합 || 제어할 수 없는 사건 간 || 행동과 결과 간\n|-\n| 반응 || 비자발적, 자동적 || '''자발적''', 환경에 조작을 가함\n|}\n(전체 표 → [[고전적 조건화와 조작적 조건화 비교]])\n\n{quiz}\n스키너 상자에서 쥐가 레버를 누르는 횟수가 늘어나는 것은 고전적 조건화의 예인가?\n{/quiz}\n{answer}\n아니다. 행동(레버 누름)과 결과(먹이)를 연합하는 '''조작적 조건화'''의 예. (bank ch5 MC 오답 보기 ④, p.17–18)\n{/answer}\n\n== 관련 문서 ==\n* [[효과의 법칙]] · [[스키너]] · [[스키너 상자]] · [[강화]] · [[처벌]]\n* [[고전적 조건화와 조작적 조건화 비교]] · [[조작적 정의]](혼동 주의)\n\n근거: 5장 p.4, p.17–29"
 },

  "body": "'''효과의 법칙'''(Law of Effect)은 '''보상이 뒤따르는 행동은 증가(강화)하고 처벌자극이 뒤따르는 행동은 감소(처벌)'''한다는 법칙이다(5장 p.17). 손다이크(Thorndike)가 고양이 문제 상자 실험(1898)으로 제안했고, [[스키너]]가 이를 '''행동 공학'''으로 발전시켜 [[조작적 조건화]]를 완성했다.\n\n{def}\n'''설명''': 보상이 뒤따르는 행동은 증가(강화)하고, 처벌 자극이 뒤따르는 행동은 감소(처벌)한다는 법칙 (5장 p.17)\n'''명칭''': [[효과의 법칙]] (Law of Effect)\n{/def}\n\n{analogy}\n효과의 법칙은 '''맛집 재방문 법칙'''이다. 맛있었던 집(보상)은 또 가고, 배탈 난 집(처벌)은 다시 안 간다. 너무 당연해서 법칙 같지 않지만, 손다이크는 이걸 '''탈출 시간 그래프'''라는 숫자로 처음 보여 줬다.\n{/analogy}\n\n== 손다이크 ==\n\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 이름(원어) || 에드워드 손다이크 (Edward Thorndike)\n|-\n| 학파·분야 || 동물 학습 연구, 조작적 조건화의 선구\n|-\n| 핵심 주장·업적 || [[효과의 법칙]]: 결과가 행동의 빈도를 바꾼다\n|-\n| 관련 실험·연도 || 고양이 상자 실험과 탈출 소요 시간 (Thorndike, 1898) — p.17\n|-\n| 시험 포인트 || 실험을 '''먼저 제안한 것은 손다이크''', 발전시킨 것은 '''스키너'''(행동 공학·행동 조성). ⚠ \"개의 침 분비 실험으로 효과의 법칙 제안\" ✗(그건 파블로프)\n|}\n\n{def}\n'''설명''': 고양이 문제 상자 실험(1898)으로 효과의 법칙을 제안한 학자 (5장 p.17)\n'''명칭''': 손다이크 (Thorndike)\n{/def}\n\n== 고양이 상자 실험 ==\n\n[[img:L5-17.png|5장 p.17 — 손다이크의 고양이 상자와 탈출 소요 시간 그래프: 첫 시행 약 240초 → 20회 이후 수십 초|large]]\n\n{| class=\"table\"\n! 연구자 || 질문 || 절차 || 결과 || 결론 || 함정\n|-\n| 손다이크 (1898) || 결과가 행동을 바꾸는가? || 배고픈 고양이를 상자에 넣고, 레버를 조작해야 문이 열려 탈출(먹이) || 시행이 반복될수록 '''탈출 소요 시간 감소''' || 보상이 뒤따르는 행동이 강화된다 = 효과의 법칙 || 고양이가 \"깨달은\" 게 아니라 '''점진적으로''' 효율이 증대 (그래프가 들쭉날쭉하게 내려감)\n|}\n\n<pre class=\"ascii\">\n 고양이 갇힘 → 이것저것 해 봄 → 우연히 레버 조작 → 문 열림·탈출(보상)\n        ↑                                              │\n        └──────────── 다음 시행: 레버 조작이 더 빨리 ◀──┘\n 탈출 시간  240s ─▶ 180 ─▶ 120 ─▶ … ─▶ 30s   (\"시행의 반복에 따라 점차 효율성이 증대\")\n<\/pre>\n\n{quiz}\n\"손다이크의 효과의 법칙에 따르면 보상이 뒤따르는 행동은 감소하고 처벌이 뒤따르는 행동은 증가한다.\" 옳은가?\n{/quiz}\n{answer}\n틀림 — 방향이 정반대. 보상 뒤 행동은 '''증가(강화)''', 처벌 뒤 행동은 '''감소(처벌)'''. (bank ch5 MC 오답 ③, p.17)\n{/answer}\n\n== 관련 문서 ==\n* [[조작적 조건화]] · [[스키너]] · [[강화]] · [[처벌]]\n\n근거: 5장 p.17–18"
 },
 "스키너": {
  "title": "B. F. 스키너 (B. F. Skinner)",
  "category": [
   "5장 학습",
   "학자"
  ],
  "body": "'''B. F. 스키너'''(B. F. Skinner)는 손다이크의 [[효과의 법칙]]을 '''행동 공학'''으로 발전시켜 [[조작적 조건화]]를 체계화한 [[행동주의]] 심리학자다(5장 p.18). [[스키너 상자]], [[강화]], [[행동 조성]], [[계기적 근사법]]이 모두 그의 이름 아래 묶인다. 서막 p.11 에서도 왓슨과 함께 행동주의의 대표로 소개됐다.\n\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 이름(원어) || B. F. 스키너 (Burrhus Frederic Skinner)\n|-\n| 학파·분야 || [[행동주의]], 조작적 조건화\n|-\n| 핵심 주장·업적 || 효과의 법칙 → 행동 공학. 강화로 행동을 원하는 방향으로 유도(행동 조성)\n|-\n| 관련 실험·연도 || [[스키너 상자]] — 쥐가 레버를 누르면 먹이 (p.18)\n|-\n| 시험 포인트 || \"효과의 법칙을 '''처음 제안'''\" ✗(손다이크), \"효과의 법칙을 '''행동 공학으로 발전''', 행동 조성 제안\" ○\n|}\n\n{analogy}\n손다이크가 \"결과가 행동을 바꾼다\"는 '''현상을 발견한 탐험가'''라면, 스키너는 그 현상으로 '''기계를 설계한 엔지니어'''다. 레버·먹이 장치·불빛·스피커를 단 상자를 만들고, 보상을 언제 얼마나 줄지(강화 계획)를 설계도처럼 짰다.\n{/analogy}\n\n[[img:L5-18.png|5장 p.18 — 스키너 상자의 패러다임: 지렛대를 누르면 먹이 제공 장치에서 먹이가 나온다|medium]]\n\n{def}\n'''설명''': 손다이크의 효과의 법칙을 행동 공학으로 발전시키고, 스키너 상자로 강화와 행동 조성을 연구한 행동주의 학자 (5장 p.18)\n'''명칭''': [[스키너]] (B. F. Skinner)\n{/def}\n\n== 스키너의 유산 (5장 안에서) ==\n{| class=\"table\"\n! 개념 || 한 줄 || 문서\n|-\n| 스키너 상자 || 쥐가 레버를 누르면 먹이 → 누르는 빈도↑ || [[스키너 상자]]\n|-\n| 강화 || 행동을 강력하게 만드는 사건/자극 || [[강화]]\n|-\n| 행동 조성 || 보상·처벌로 행동을 원하는 방향으로 유도 || [[행동 조성]]\n|-\n| 계기적 근사법 || 이전 단계 행동에 보상하며 목표로 || [[계기적 근사법]]\n|-\n| 정적·부적 강화 || 보상 제공 / 혐오 자극 제거 || [[정적 강화와 부적 강화]]\n|}\n\n{joke}\n스키너 상자 그림(p.18)을 보면 쥐에게 물·먹이·불빛·스피커까지 다 갖춰져 있다. 원룸 옵션으로 치면 풀옵션인데, 월세 대신 '''레버 누르기'''로 낸다.\n{/joke}\n\n== 관련 문서 ==\n* [[스키너 상자]] · [[효과의 법칙]] · [[조작적 조건화]] · [[행동주의]]\n\n근거: 5장 p.18; 서막 p.11"
 },
 "스키너 상자": {
  "title": "스키너 상자 (Skinner Box)",
  "category": [
   "5장 학습",
   "실험"
  ],
  "body": "'''스키너 상자'''(Skinner Box)는 [[스키너]]가 [[조작적 조건화]]를 연구하려고 만든 실험 장치다(5장 p.18). 쥐가 '''지렛대를 누르면 먹이 제공 장치에서 먹이'''가 나오고, 그 결과 레버 누르는 횟수가 늘어난다 = [[강화]]. 슬라이드 그림에는 불빛·스피커·지렛대·먹이 제공 장치·물이 표시돼 있다.\n\n{def}\n'''설명''': 쥐가 지렛대를 누르면 먹이가 나오도록 만들어, 행동과 결과의 연합(강화)을 측정하는 조작적 조건화 실험 장치 (5장 p.18)\n'''명칭''': [[스키너 상자]] (Skinner Box)\n{/def}\n\n{analogy}\n스키너 상자는 '''자판기'''다. 버튼(레버)을 누르면 음료(먹이)가 나온다는 걸 한 번 알게 되면, 목마를 때마다 버튼을 누른다. 그런데 자판기가 '''가끔만''' 음료를 준다면? 그게 [[강화 계획]] 이야기다.\n{/analogy}\n\n[[img:L5-18.png|5장 p.18 — 스키너 상자의 패러다임: 불빛·스피커·지렛대·물·먹이 제공 장치|large]]\n\n== 실험 카드 ==\n{| class=\"table\"\n! 연구자 || 질문 || 절차 || 결과 || 결론 || 함정\n|-\n| 스키너 || 결과를 조작하면 행동 빈도를 설계할 수 있나? || 쥐가 레버를 누를 때 먹이 제공 || 레버 누르는 횟수 증가 || 강화 = 행동을 강력하게 만드는 자극 || 이건 '''조작적''' 조건화(행동→결과). 고전적 조건화 ✗\n|}\n\n<pre class=\"ascii\">\n [쥐 탐색] → (우연히) 레버 누름 → 먹이 ▼ → 레버 누름 ↑ → 먹이 ▼ → 레버 누름 ↑↑\n              '''행동'''               '''결과'''           = '''[[강화]]'''\n<\/pre>\n\n== 같은 상자, 네 가지 결과 ==\n스키너 상자에서 레버 누름 뒤에 무엇을 주거나 빼느냐에 따라 2×2 가 나온다(→ [[정적 강화와 부적 강화]], [[처벌]]).\n\n{| class=\"table\"\n! || 제시 || 제거\n|-\n| 보상 (먹이) || 먹이 제시 → 누름↑ = [[정적 강화]] || 먹이 철회 → 누름↓ = [[부적 처벌]]\n|-\n| 혐오 (전기 충격) || 전기 충격 제시 → 누름↓ = [[처벌|정적 처벌]] || 전기 충격 제거 → 누름↑ = [[부적 강화]]\n|}\n\n[[anim:skinner_box|레버 누름 뒤에 먹이 제시·충격 제거·충격 제시·먹이 철회가 차례로 붙는다. 칸마다 화살표가 ↑ 인지 ↓ 인지 보라]]\n\n* 교수 보충: 언어를 사용하지 못하는 '''동물의 지각 양상'''을 탐구하는 데도 활용 가능(p.18).\n* 정리본 노트: 스키너 상자에서는 보상이 몇 초 이상 지연되면 학습이 어렵다 → [[조건 강화물|즉시 강화물]](p.21).\n* p.22 그래프는 비둘기 실험(누적 반응 수) — 상자 안 동물이 쥐에서 비둘기로 바뀌어도 원리는 같다 → [[강화 계획]].\n\n== 관련 문서 ==\n* [[스키너]] · [[강화]] · [[정적 강화와 부적 강화]] · [[강화 계획]]\n\n근거: 5장 p.18 (p.21–22)"
 },
 "강화": {
  "title": "강화 (Reinforcement)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''강화'''(Reinforcement)는 '''조작적 조건형성에서 행동을 강력하게 만드는 사건/자극'''이다(5장 p.18). 핵심은 결과가 '''행동 빈도를 증가'''시킨다는 것. 무엇이 보상이 되는지는 '''상황에 따라 달라질 수 있다'''. 반대로 행동을 감소시키면 [[처벌]]이다.\n\n{def}\n'''설명''': 조작적 조건형성에서 행동을 강력하게 만드는(빈도를 증가시키는) 사건/자극 (5장 p.18)\n'''명칭''': [[강화]] (Reinforcement) — 슬라이드 철자 \"Reiforcement\" 는 오타\n{/def}\n\n{analogy}\n강화는 '''좋아요 버튼'''이다. 내가 올린 글에 좋아요(강화)가 많이 붙으면 그런 글을 더 쓰게 된다. 좋아요를 '''주든'''(정적), 악플을 '''치워 주든'''(부적) — 결과적으로 글 쓰는 횟수가 '''늘면''' 강화다.\n{/analogy}\n\n== 큰 그림: 강화 vs 처벌 ==\n\n{| class=\"table\"\n! || 자극 제시 (정적, +) || 자극 제거 (부적, −)\n|-\n| '''행동 증가 = 강화''' || [[정적 강화]]: 보상 제공 || [[부적 강화]]: 혐오 자극 제거\n|-\n| '''행동 감소 = 처벌''' || [[처벌|정적 처벌]]: 혐오 자극 제공 || [[부적 처벌]]: 보상 철회\n|}\n\n{exam}\n교수 판정법(🎙 9/29 56:43): '''\"어디까지나 강화는 강화고 처벌은 처벌\"'''. ① 행동 빈도가 '''증가'''하면 강화, '''감소'''하면 처벌 ② 무언가를 '''더하면''' 정적, '''빼면''' 부적. 이 두 질문만 순서대로 던지면 4칸이 정해진다.\n{/exam}\n\n[[img:L5-27.png|5장 p.27 — 처벌(원하지 않는 행동을 줄이는 방법) VS 보상(바람직한 행동을 늘리는 방법)|medium]]\n\n== 강화에 딸린 개념들 ==\n{| class=\"table\"\n! 질문 || 개념 || 문서\n|-\n| 무엇으로 강화하나? || 1차 강화물 vs 조건(이차) 강화물 || [[조건 강화물]]\n|-\n| 언제 강화하나? || 즉시 강화물 vs 지연 강화물 || [[조건 강화물]]\n|-\n| 얼마나 자주 강화하나? || 연속 vs 부분(고정·변동 × 비율·간격) || [[강화 계획]]\n|-\n| 목표 행동까지 어떻게? || 행동 조성, 계기적 근사법 || [[행동 조성]], [[계기적 근사법]]\n|-\n| 남이 강화받는 걸 보면? || 대리 강화 || [[관찰 학습]]\n|}\n\n{tip}\n\"상황에 따라 보상은 달라질 수 있음\"(p.18) — 같은 칭찬도 어떤 아이에겐 강화물, 어떤 아이에겐 무의미하다. 또 p.27 '''타임 아웃''': 잘못된 행동에 대한 부모의 '''관심'''조차 강화물로 작용할 수 있다.\n{/tip}\n\n== 관련 문서 ==\n* [[정적 강화와 부적 강화]] · [[처벌]] · [[강화 계획]] · [[조건 강화물]]\n\n근거: 5장 p.18–23, p.27"
 },
 "행동 조성": {
  "title": "행동 조성 (Shaping)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''행동 조성'''(Shaping)은 '''보상 혹은 처벌을 통해 행동을 원하는 방향으로 유도'''하는 것이다(5장 p.18). [[스키너]]가 손다이크의 [[효과의 법칙]]을 '''행동 공학'''으로 발전시킨 결과이며, 그 구체적 방법이 [[계기적 근사법]]이다.\n\n{def}\n'''설명''': 보상 혹은 처벌을 통해 행동을 원하는 방향으로 유도하는 것 (5장 p.18)\n'''명칭''': [[행동 조성]] (Shaping)\n{/def}\n\n{analogy}\n행동 조성은 '''조각'''이다(그래서 영어가 shaping). 돌덩이(아무렇게나 하는 행동)에서 원하는 모양(목표 행동)이 아닌 부분은 깎고(처벌·무보상), 맞는 부분은 남긴다(보상). 한 번에 완성품이 나오진 않고, 조금씩 다듬어 간다 — 그 \"조금씩\"이 [[계기적 근사법]].\n{/analogy}\n\n{| class=\"table\"\n! || '''행동 조성''' (Shaping) || '''[[계기적 근사법]]''' (Successive Approximation)\n|-\n| 층위 || 큰 목표·개념 || 구체적 방법(행동 조성 안에 포함)\n|-\n| 슬라이드 (p.18) || 보상 혹은 처벌을 통해 행동을 원하는 방향으로 유도 || 최종 목표 행동을 학습시키기 위해 이전 단계의 행동에 적절한 보상을 제공하여 목표에 다가가도록 하는 방법\n|-\n| 단답형 || \"원하는 방향으로 유도\" → 행동 조성 || \"이전 단계 행동에 보상, 단계별로\" → 계기적 근사법\n|}\n\n[[img:L5-18.png|5장 p.18 — 강화·행동 조성·계기적 근사법이 한 슬라이드에 함께 정의됨|medium]]\n\n== 응용 ==\n* 스포츠: 목표를 단계적으로 설정하여 점차 도전 거리를 증가, 점진적 성장을 통한 프로 선수 양성(p.28)\n* 학교: 학생들에게 '''즉각적으로 피드백'''을 제공하여 행동 조성(p.28)\n* 아동: 생후 8~16개월 아동도 '''모방을 통한''' 행동 조성이 가능(p.34) → [[관찰 학습]]\n\n{warn}\n\"행동 조성 = 스키너 상자\" 는 아니다. 스키너 상자는 '''장치''', 행동 조성은 그 장치로 하는 '''절차''', 계기적 근사법은 그 절차의 '''구체적 방법'''. 단답형에서 문장 끝 키워드(\"유도하는 것\"/\"다가가도록 하는 방법\")로 구분할 것.\n{/warn}\n\n== 관련 문서 ==\n* [[계기적 근사법]] · [[스키너]] · [[강화]] · [[효과의 법칙]]\n\n근거: 5장 p.18, p.28, p.34"
 },
 "계기적 근사법": {
  "title": "계기적 근사법 (Successive Approximation)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''계기적 근사법'''(Method of Successive Approximations)은 '''최종 목표 행동을 학습시키기 위해 이전 단계의 행동에 적절한 보상을 제공하여 목표에 다가가도록 하는 방법'''이다(5장 p.18). [[행동 조성]]에서 쓰는 구체적 방법. bank 단답형 정답이며, '''슬라이드 번역어 \"계기적 근사법\"'''으로 쓰는 것이 안전하다.\n\n{def}\n'''설명''': 최종 목표 행동을 학습시키기 위해 이전 단계의 행동에 적절한 보상을 제공하여 목표에 다가가도록 하는 방법 (5장 p.18)\n'''명칭''': [[계기적 근사법]] (Successive Approximation) — 다른 이름: 순차적 접근법, 연속적 접근법\n'''사례형''': 강아지에게 구르기를 가르치려고, 처음엔 엎드리기만 해도 간식 → 다음엔 옆으로 누워야 간식 → 마지막엔 완전히 한 바퀴 굴러야 간식. (bank ch5 SA)\n{/def}\n\n{analogy}\n계기적 근사법은 '''게임 튜토리얼'''이다. 처음부터 보스를 잡으라고 하지 않는다. 이동만 해도 \"잘했어요!\", 공격 한 번 해도 보상, 슬라임 잡으면 보상… 레벨마다 '''조금 더 어려운''' 행동에만 보상을 주다 보면 어느새 보스(최종 목표)를 잡고 있다.\n{/analogy}\n\n<pre class=\"ascii\">\n 목표: 한 바퀴 구르기\n 단계 1  엎드리기        → 🍖 보상    (이제 엎드리기만으론 보상 없음)\n 단계 2  옆으로 눕기     → 🍖 보상\n 단계 3  등 대고 뒤집기  → 🍖 보상\n 단계 4  한 바퀴 구르기  → 🍖 보상  ★ 최종 목표 도달\n → 각 단계 = 목표에 \"점점 가까워지는(approximation)\" 행동이 \"차례로(successive)\"\n<\/pre>\n\n교수 설명(🎙 9/29 55:57): 한 번에 바뀌기 어려운 행동은 최종 목표를 '''몇 단계로 나눠''' 단계별 목표를 달성할 때마다 보상한다.\n\n{| class=\"table\"\n! 헷갈리는 짝 || 차이\n|-\n| [[행동 조성]] || 행동 조성 = 원하는 방향으로 유도하는 큰 개념, 계기적 근사법 = 그 '''방법'''\n|-\n| [[고차 조건형성]] || 고차 조건형성은 '''고전적''' 조건화(자극–자극), 계기적 근사법은 '''조작적''' 조건화(행동–보상)\n|-\n| [[강화 계획]] || 강화 계획은 '''같은 행동'''을 얼마나 자주 강화하나, 계기적 근사법은 '''행동 자체'''를 단계마다 바꿔 감\n|}\n\n응용: 스포츠의 \"목표를 단계적으로 설정하여 점차 도전 거리를 증가\"(p.28), 자기 행동 수정의 \"장기적 목표는 중간에 제공되는 즉각적 보상을 통해 동력을 얻음\"(p.29).\n\n== 관련 문서 ==\n* [[행동 조성]] · [[스키너]] · [[강화]]\n\n근거: 5장 p.18 (p.28–29)"
 },
 "정적 강화와 부적 강화": {
  "title": "정적 강화와 부적 강화",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''정적 강화와 부적 강화'''는 [[강화]]의 두 유형이다(5장 p.19). 둘 다 행동을 '''증가'''시킨다. 다른 점은 '''무엇을 하느냐''' — 정적은 보상을 '''제공'''(+), 부적은 혐오 자극을 '''제거'''(−). 그리고 이 장 최대 함정: '''부적 강화는 처벌이 아니다.'''\n\n{def}\n'''설명''': 혐오 자극을 제거하여 행동 빈도를 증가시키는 것 — 처벌이 아님 (5장 p.19)\n'''명칭''': [[부적 강화]] (Negative reinforcement) ↔ 보상을 제공하여 행동을 증가시키는 것 = [[정적 강화]]\n{/def}\n\n{| class=\"table\"\n! || [[정적 강화]] (Positive reinforcement) || [[부적 강화]] (Negative reinforcement)\n|-\n| 정의 (p.19) || 보상을 제공하여 행동을 증가시키는 것 || 혐오 자극을 제거하여 행동 빈도를 증가시키는 것\n|-\n| 조작 || '''+''' 더하기 || '''−''' 빼기\n|-\n| 행동 || ↑ || ↑\n|-\n| 슬라이드 그림 || 숙제를 끝냈더니 초콜릿 → 숙제 행동↑ || 아침 알람 소리를 끄면 소음이 사라짐 → 끄는 행동↑\n|-\n| 교수·bank 예 || 시험 잘 보면 용돈↑, 발표 칭찬 || 숙제하면 청소 당번 면제, 두통에 진통제, '''약물 중독(금단 제거)'''\n|}\n\n{analogy}\n두 강화는 '''수학의 부호'''다. 정적(+) = 좋은 걸 '''더해 주기''', 부적(−) = 싫은 걸 '''빼 주기'''. 부호가 \"좋다/나쁘다\"를 뜻하지 않는다는 게 핵심. \"부적\" 이라는 말에 낚여 \"나쁜 것 = 처벌\"로 읽으면 시험에서 틀린다 — '''−'''는 그냥 '''빼기'''다.\n{/analogy}\n\n[[img:L5-19.png|5장 p.19 — 정적 강화의 예(초콜릿 추가) / 부적 강화의 예(소음 제거)|large]]\n\n[[anim:skinner_box|2×2 격자의 위쪽 두 칸(정적 강화·부적 강화)이 모두 ↑ 화살표라는 점, 아래 두 칸(처벌)은 ↓ 라는 점을 확인하라]]\n\n== 판정 3질문 ==\n<pre class=\"ascii\">\n Q1. 행동이 늘었나 줄었나?        늘었다 → 강화        줄었다 → [[처벌]]\n Q2. 자극을 줬나 뺐나?            줬다   → 정적(+)     뺐다   → 부적(−)\n Q3. (확인) 그 자극은?            보상 / 혐오\n     ───────────────────────────────────────────────\n     늘었다 + 줬다(보상)   = 정적 강화\n     늘었다 + 뺐다(혐오)   = '''부적 강화'''   ← 처벌 아님!\n     줄었다 + 줬다(혐오)   = 정적 처벌\n     줄었다 + 뺐다(보상)   = 부적 처벌\n<\/pre>\n\n[[sim:operant_quadrant]]\n\n== 두 강화는 동시에 일어날 수 있다 ==\n슬라이드 예: '''시험을 망쳐서 불안한 학생'''(p.19). 교수 설명(🎙 9/29):\n# 불안(혐오 자극)을 떨치려고 공부 시간을 늘림 → 공부하면 불안이 '''줄어든다''' = '''부적 강화'''\n# 공부했더니 성적이 올라 보상을 받음 = '''정적 강화'''\n같은 행동(공부)에 두 강화가 한꺼번에 붙는다.\n\n{exam}\n교수 강조 3종 세트(🎙 9/29 56:43–1:02:36, 통합요약 §0-1)\n* '''부적 강화 ≠ 처벌'''\n* '''약물 중독 = 금단 제거에 의한 부적 강화'''\n* '''정적·부적 강화는 동시에 일어날 수 있다'''\n{/exam}\n\n{quiz}\n혐오 자극이 제거되어 행동 빈도가 증가한 사례는? ① 지각생에게 벌점 → 지각↓ ② 숙제 안 한 아이 게임 시간 압수 → 숙제 안 하기↓ ③ 두통에 진통제를 먹고 통증이 사라지자 이후 두통마다 진통제 ④ 발표 칭찬 → 발표↑\n{/quiz}\n{answer}\n'''③ 부적 강화'''. ①은 정적 처벌(벌점 부여), ②는 부적 처벌(게임 시간 철회), ④는 정적 강화(칭찬 제공). (bank ch5 MC, p.19·p.24)\n{/answer}\n\n== 관련 문서 ==\n* [[정적 강화]] · [[부적 강화]] · [[처벌]] · [[부적 처벌]] · [[강화]]\n\n근거: 5장 p.19 (p.24)"
 },
 "정적 강화": {
  "title": "정적 강화 (Positive Reinforcement)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''정적 강화'''(Positive reinforcement)는 '''보상을 제공하여 행동을 증가시키는 것'''이다(5장 p.19). '''정적(+) = 더하기''', '''강화 = 행동 증가'''. 네 칸 중 가장 직관적인 칸이다.\n\n{def}\n'''설명''': 보상을 제공하여 행동을 증가시키는 것 (5장 p.19)\n'''명칭''': [[정적 강화]] (Positive reinforcement)\n'''사례형''': 발표를 잘해 칭찬을 받은 아이가 이후 발표를 더 자주 하게 되었다.\n{/def}\n\n{analogy}\n정적 강화는 '''카페 스탬프 도장'''이다. 커피를 살 때마다 도장(보상)이 '''하나씩 더해지니''' 그 카페를 더 자주 간다. 무언가가 '''생겨서''' 행동이 '''늘어난''' 경우.\n{/analogy}\n\n[[img:L5-19.png|5장 p.19 왼쪽 — 정적 강화의 예: 숙제를 끝냈더니 초콜릿을 먹는다 → 초콜릿(즐거움)이 추가되어 행동이 증가|medium]]\n\n{| class=\"table\"\n! || '''정적 강화''' || [[부적 강화]] || [[처벌|정적 처벌]]\n|-\n| 자극 || 보상 '''제공''' || 혐오 자극 '''제거''' || 혐오 자극 '''제공'''\n|-\n| 행동 || ↑ || ↑ || ↓\n|-\n| 공통점 || — || 정적 강화와 '''행동 증가'''가 같음 || 정적 강화와 '''\"제공(+)\"'''이 같음\n|}\n\n* 예: 숙제 끝 → 초콜릿(p.19 그림), 시험 잘 보면 용돈(🎙 9/29), 즉각적 칭찬·간식(p.21 즉시 강화물).\n* 응용: p.27 \"보상 중심의 피드백\"은 바람직한 행동 방향을 전달하고 반대 행동을 자연스럽게 감소시킨다.\n* 약물 중독에도 정적 강화 요소(도파민 보상)는 있지만, 교수는 끊지 못하는 핵심은 '''부적 강화'''라고 했다 → [[부적 강화]].\n\n== 관련 문서 ==\n* [[정적 강화와 부적 강화]] · [[부적 강화]] · [[강화]] · [[조건 강화물]]\n\n근거: 5장 p.19"
 },

  "body": "'''부적 강화'''(Negative reinforcement)는 '''혐오 자극을 제거하여 행동 빈도를 증가시키는 것'''이다(5장 p.19). 5장에서 가장 많이 틀리는 명칭이자 교수가 녹음에서 가장 길게 경고한 개념. 한 줄 요약: '''부적 강화는 처벌이 아니다'''(p.19, 밑줄까지 그어져 있다).\n\n{def}\n'''설명''': 혐오 자극을 제거하여 행동 빈도를 증가시키는 것 (5장 p.19)\n'''명칭''': [[부적 강화]] (Negative reinforcement)\n'''사례형''': 청소 당번이 정말 싫던 철수가, 숙제를 완벽히 해 오면 청소 당번이 면제된다는 것을 안 뒤로 숙제를 해 오는 행동이 크게 늘었다. (bank ch5 SA)\n{/def}\n\n{exam}\n⭐⭐⭐ 교수 강조(🎙 9/29 56:43–1:02:36)\n# '''\"어디까지나 강화는 강화고 처벌은 처벌\"''' — 부적 강화는 처벌과 헷갈리기 쉬우니 주의. 행동이 '''증가'''하면 강화.\n# '''약물 중독자는 부적 강화의 강력한 예'''(Baker et al., 2004). 도파민 같은 보상 기제도 있지만, 실질적으로 끊지 못하는 이유는 '''금단 증상의 고통을 제거'''하려고 약물 사용이 늘기 때문.\n# 정적 강화와 '''동시에''' 일어날 수 있다(시험 망친 학생).\n{/exam}\n\n{analogy}\n부적 강화는 '''우산'''이다. 비(혐오 자극)를 맞기 싫어서 우산을 편다 → 비가 '''사라진다''' → 다음에도 비 오면 우산을 편다(행동↑). 우산 펴는 게 벌 받는 건가? 아니다 — '''싫은 걸 없애 주니까''' 그 행동이 '''늘어난''' 것. 이게 부적 강화다.\n{/analogy}\n\n[[img:L5-19.png|5장 p.19 오른쪽 — 부적 강화의 예: 아침에 알람 소리를 꺼서 소음이 사라진다 → 소음(불쾌한 자극)이 제거되어 행동이 증가|medium]]\n\n== 부적 강화 vs 처벌 ==\n\n{| class=\"table\"\n! || '''부적 강화''' || [[처벌|정적 처벌]] || [[부적 처벌]]\n|-\n| 자극 조작 || 혐오 자극 '''제거''' || 혐오 자극 '''제공''' || 보상 '''철회'''\n|-\n| 행동 || '''↑ 증가''' || ↓ 감소 || ↓ 감소\n|-\n| 예 || 진통제 → 통증 사라짐 → 복용↑ || 과속 → 벌금 → 과속↓ || 과속 반복 → 면허 취소 → 과속↓\n|-\n| 헷갈리는 이유 || \"부적\" = 나쁜 것? → '''아니고 \"빼기\"''' || 혐오 자극이 나온다는 점만 같음 || \"부적\"(빼기)이라는 점만 같음\n|}\n\n[[anim:skinner_box|전기 충격이 '''사라지자''' 레버 누름이 '''늘어나는''' 칸(부적 강화)과, 전기 충격이 '''주어지자''' 줄어드는 칸(정적 처벌)을 나란히 비교하라]]\n\n[[sim:operant_quadrant]]\n\n== 약물 중독 = 부적 강화 ==\n<pre class=\"ascii\">\n 금단 증상(혐오) ──▶ 약물 복용 ──▶ 금단 증상 '''사라짐'''(제거) ──▶ 다음 금단 때 복용 ↑\n                                                       = '''부적 강화'''\n (+ 도파민 보상 = 정적 강화도 있음 → 두 강화 '''동시''' 발생 가능)\n<\/pre>\n\n{warn}\nbank 오답 보기\n* \"부적 강화는 행동 빈도를 '''감소'''시키는 기제이므로 약물 중독 설명에 쓰이지 않는다\" → ✗\n* \"약물 사용 반복은 쾌감(정적 강화)만으로 설명되며, 정적·부적 강화는 동시에 발생할 수 없다\" → ✗\n* \"약물 중독은 처벌로 행동이 감소하는 대표적 사례\" → ✗ (사용이 '''증가''')\n{/warn}\n\n그 밖의 예: 아침 알람 끄기(p.19 그림), 두통에 진통제, 숙제하면 청소 면제, 처벌로 아이가 잠시 조용해지면 '''부모의 처벌 행위가 부적으로 강화'''된다(APA 2019, p.25).\n\n== 관련 문서 ==\n* [[정적 강화와 부적 강화]] · [[처벌]] · [[부적 처벌]] · [[도파민]]\n\n근거: 5장 p.19 (p.25)"
 },
 "조건 강화물": {
  "title": "1차 강화물과 조건 강화물(이차 강화물)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''조건 강화물'''(Conditioned reinforcer, 이차 강화물)은 '''일차 강화물과 연합되어 강화의 힘을 획득한 자극'''이다(5장 p.20). 짝인 '''1차 강화물'''은 생물학적 욕구를 직접 만족시키는, 생득적인 강화 자극. 이 문서는 p.20(직접성)과 p.21(제시 간격)의 강화물 분류 넷을 함께 다룬다.\n\n{def}\n'''설명''': 일차 강화물과 연합되어 강화의 힘을 획득한 자극 (5장 p.20)\n'''명칭''': [[조건 강화물]] (Conditioned reinforcer) — 이차 강화물\n'''사례형''': 원래는 아무 의미 없던 동전이, 음식과 반복적으로 연합되면서 강화의 힘을 갖게 되었다. (p.20 그림)\n{/def}\n\n{analogy}\n1차 강화물은 '''밥''', 조건 강화물은 '''식권'''이다. 식권 자체는 종이일 뿐 배를 채우지 못하지만, 밥과 바꿀 수 있다는 걸 '''배운''' 뒤로는 식권만 받아도 기쁘다. 돈·칭찬·토큰·점수가 다 식권이다.\n{/analogy}\n\n[[img:L5-20.png|5장 p.20 — 1차 강화물(음식·물·수면·신체적 접촉) vs 조건 강화물(동전: 원래는 중립 자극 → 음식과 연합되어 강화의 힘 획득)|large]]\n\n== 직접성에 따른 구분 (p.20) ==\n\n=== 1차 강화물 ===\n{def}\n'''설명''': 생물학적 욕구를 만족시키는 강화 자극. 학습된 것이 아니며 생득적으로 강화 속성을 지님 (예: 고전적 조건화에서의 먹이) (5장 p.20)\n'''명칭''': 1차 강화물 (Primary reinforcer)\n{/def}\n\n{| class=\"table\"\n! || 1차 강화물 || 조건 강화물 (이차 강화물)\n|-\n| 정의 || 생물학적 욕구를 만족시키는 강화 자극 || 일차 강화물과 연합되어 강화의 힘을 획득한 자극\n|-\n| 학습 필요 || 없음 (생득적) || 있음 (연합)\n|-\n| 예 (p.20 그림) || 음식(배고픔), 물(갈증), 수면(피로), 신체적 접촉(안전감·애정) || 동전, 돈·칭찬·토큰·점수\n|-\n| 고전적 조건화와 연결 || [[무조건 자극]]처럼 원래 힘이 있음 || [[고차 조건형성]]을 거친 자극들이 포함될 수 있음\n|}\n\n== 제시 간격에 따른 구분 (p.21) ==\n\n[[img:L5-21.png|5장 p.21 — 즉시 강화물(숙제 완료 → 바로 칭찬·간식) vs 지연 강화물(꾸준히 공부 → 한 달 뒤 좋은 성적)|medium]]\n\n=== 즉시 강화물 ===\n{def}\n'''설명''': 행동 수행 후 바로 제공되는 강화물. 지연의 발생은 조작적 조건화의 학습을 감소시킴 (5장 p.21)\n'''명칭''': 즉시 강화물 (Immediate reinforcer)\n{/def}\n즉각적 피드백 퀴즈를 자주 하면 강의 학습이 원활(Healy et al., 2017) — [[검증 효과]]와 같은 방향.\n\n=== 지연 강화물 ===\n{def}\n'''설명''': 행동 수행 후 일정 시간 뒤에 제공되는 강화물 (5장 p.21)\n'''명칭''': 지연 강화물 (Delayed reinforcer)\n{/def}\n\n=== 마쉬멜로 실험 ===\n{def}\n'''설명''': 지연 보상을 기다리는 만족 지연이 가능한 아동이 추후 사회적으로 높은 성취를 보였다는 연구 (Mischel, 2014; 5장 p.21)\n'''명칭''': 마쉬멜로 실험 (Marshmallow test) — 만족 지연\n{/def}\n지연 보상을 위한 충동 제어 학습 능력은 추후 범죄행위에도 영향(Akerlund et al., 2016).\n\n{warn}\np.20 의 전제 \"(행동 빈도를 증가시킨다는 전제 하)\" — 강화물은 '''행동을 늘릴 때만''' 강화물이다. 동전을 받아도 행동이 안 늘면 그 상황에선 강화물이 아니다(p.18 \"상황에 따라 보상은 달라질 수 있음\").\n{/warn}\n\n== 관련 문서 ==\n* [[강화]] · [[고차 조건형성]] · [[강화 계획]] · [[정적 강화]]\n\n근거: 5장 p.20–21"
 },
 "강화 계획": {
  "title": "강화 계획 (Reinforcement Schedule)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''강화 계획'''(Reinforcement Schedule)은 '''원하는 반응을 얼마나 자주 강화할 것인지 정의하는 패턴'''이다(5장 p.22). 먼저 '''연속 vs 부분'''으로 나누고, 부분 강화계획을 다시 '''비율/간격 × 고정/변동''' 2×2 로 쪼갠다. 단답형 후보만 6개(연속·부분·고정비율·변동비율·고정간격·변동간격).\n\n{def}\n'''설명''': 원하는 반응을 얼마나 자주 강화할 것인지 정의하는 패턴 (5장 p.22)\n'''명칭''': [[강화 계획]] (Reinforcement Schedule)\n{/def}\n\n{analogy}\n강화 계획은 '''월급 체계'''다. 일할 때마다 즉시 돈 주기(연속), 10개 만들면 한 번(고정비율 = 성과급), 매달 25일(고정간격 = 월급날), 언제 터질지 모르는 보너스(변동간격), 몇 번 당기면 터질지 모르는 슬롯머신(변동비율). 사람은 '''예측이 안 될수록''' 손을 못 뗀다.\n{/analogy}\n\n== 연속 vs 부분 (p.22) ==\n\n=== 연속 강화계획 ===\n{def}\n'''설명''': 원하는 반응이 나타날 때마다 강화하는 계획 (5장 p.22)\n'''명칭''': 연속 강화계획 (Continuous reinforcement)\n{/def}\n\n=== 부분 강화계획 ===\n{def}\n'''설명''': 반응 행동의 일부에 대해서만 강화하는 계획. 연속 계획에 비해 학습이 느리지만 소거 저항도가 높음 (5장 p.22)\n'''명칭''': 부분(간헐적) 강화계획 (Partial / Intermittent reinforcement)\n{/def}\n\n{| class=\"table\"\n! || 연속 강화계획 || 부분(간헐적) 강화계획\n|-\n| 강화 빈도 || 반응할 때마다 || 일부 반응만\n|-\n| 학습 속도 || 빠름 || '''느림'''\n|-\n| 소거 저항도 || 낮음 (보상 끊기면 금방 그만둠) || '''높음'''\n|}\n\n[[img:L5-22.png|5장 p.22 — 부분 강화 계획에 따른 행동 변화 양상(비둘기 누적 반응 수): 고정비율·변동비율은 가파르게, 고정간격은 계단(보상 시간이 다가올수록 더 빠른 반응), 변동간격은 꾸준한 반응|large]]\n\n== 부분 강화계획 4유형 (p.23) ==\n\n[[img:L5-23.png|5장 p.23 — 비율/간격 × 고정/변동 표|medium]]\n\n{| class=\"table\"\n! || '''고정''' (Fixed) || '''변동''' (Variable)\n|-\n| '''비율''' (반응 수) || '''고정비율''': 고정된 수의 반응 후 강화. 예: 커피 쿠폰(10회 1잔 무료) || '''변동비율''': 랜덤 반응 수 산출 후 강화. '''소거가 잘 이루어지지 않음'''. 예: 슬롯 머신, 낚시꾼\n|-\n| '''간격''' (시간) || '''고정간격''': 고정된 시간 경과 후 강화. 보상 예상 시점이 가까워질수록 빠른 반응, 일정한 반응보다 '''급격한 증가 패턴'''. 예: 정기 할인 행사 || '''변동간격''': 가변적인 시간 경과 후 강화. '''느리지만 매우 꾸준한''' 반응. 예: SNS 좋아요 알람 확인하기\n|}\n\n=== 고정비율 ===\n{def}\n'''설명''': 고정된 수의 반응 후 강화하는 부분 강화계획 (커피 쿠폰 10회 1잔 무료) (5장 p.23)\n'''명칭''': 고정비율 계획 (Fixed-ratio)\n{/def}\n=== 변동비율 ===\n{def}\n'''설명''': 랜덤한 수의 반응 후 강화하며, 소거가 잘 이루어지지 않는 부분 강화계획 (슬롯 머신, 낚시꾼) (5장 p.23)\n'''명칭''': 변동비율 계획 (Variable-ratio)\n{/def}\n=== 고정간격 ===\n{def}\n'''설명''': 고정된 시간 경과 후 강화하며, 보상 예상 시점이 가까워질수록 반응이 급격히 증가하는 부분 강화계획 (정기 할인 행사) (5장 p.23)\n'''명칭''': 고정간격 계획 (Fixed-interval)\n{/def}\n=== 변동간격 ===\n{def}\n'''설명''': 가변적인 시간 경과 후 강화하며, 느리지만 매우 꾸준한 반응을 유도하는 부분 강화계획 (SNS 좋아요 알람 확인) (5장 p.23)\n'''명칭''': 변동간격 계획 (Variable-interval)\n{/def}\n\n[[sim:reinforcement_schedules]]\n\n옵션을 FR → VR → FI → VI → CRF 로 바꿔 보며 누적 반응 그래프의 모양을 비교하라. FI 는 강화 직전에 반응이 몰리는 계단, VI 는 완만한 직선이다.\n\n{tip}\n암기 요령: '''비율 = 횟수, 간격 = 시간'''. '''고정 = 예측 가능, 변동 = 예측 불가'''. 정리본 노트: 일반적으로 '''비율 계획이 간격 계획보다''' 반응률이 높고, '''변동 계획이 고정 계획보다''' 반응이 더 지속적이다.\n{/tip}\n\n{quiz}\nSNS 좋아요 알림이 언제 올지는 모르지만 가끔 시간이 지나면 온다. 그래서 사람들은 하루 종일 느리지만 꾸준히 알림을 확인한다. 어떤 계획인가?\n{/quiz}\n{answer}\n'''변동간격 계획'''. \"시간\"이 기준이고(간격), 언제인지 모름(변동). 커피 쿠폰은 고정비율, 슬롯머신은 변동비율, 정기 할인은 고정간격. (bank ch5 MC, p.22–23)\n{/answer}\n\n== 관련 문서 ==\n* [[강화]] · [[소거]] · [[스키너 상자]] · [[조건 강화물]]\n\n근거: 5장 p.22–23"
 },

  "body": "'''처벌'''(Punishment)은 '''행동을 감소시키는 기제'''다(5장 p.24). 자극을 '''가하면''' 정적 처벌(제1유형), '''철회하면''' [[부적 처벌]](제2유형). [[강화]]와 정반대로 행동 빈도를 '''줄인다''' — 그래서 '''[[부적 강화]]는 처벌이 아니다'''.\n\n{def}\n'''설명''': 행동을 감소시키는 기제 (5장 p.24)\n'''명칭''': [[처벌]] (Punishment)\n{/def}\n\n=== 정적 처벌 (제1유형) ===\n{def}\n'''설명''': 혐오 자극을 가하여 행동을 감소시키는 것 (5장 p.24)\n'''명칭''': 정적 처벌 (Positive punishment) — 제1유형 처벌\n'''사례형''': 과속하면 과속 딱지(벌금)를 부과한다 → 과속 행동이 줄어든다. (p.24 그림)\n{/def}\n\n{analogy}\n처벌은 '''브레이크''', 강화는 '''액셀'''이다. 브레이크를 밟는 방법이 둘 있다: 앞에 장애물을 '''놓거나'''(정적 처벌 — 벌금 고지서), 연료를 '''빼거나'''(부적 처벌 — 면허 압수). 어느 쪽이든 차(행동)는 '''느려진다'''. 반면 \"부적 강화\"는 사이드 브레이크를 '''풀어 주는''' 것 — 차가 더 잘 나간다.\n{/analogy}\n\n[[img:L5-24.png|5장 p.24 — 정적 처벌의 예(과속 → 벌금 부과, 불쾌한 자극 추가 → 과속 감소) / 부적 처벌의 예(과속 반복 → 운전면허 취소, 좋은 자극 제거 → 과속 감소)|large]]\n\n== 강화·처벌 2×2 ==\n{| class=\"table\"\n! || 자극 제시 (정적, +) || 자극 제거 (부적, −)\n|-\n| '''행동 증가 (강화)''' || [[정적 강화]] — 보상 제공 || [[부적 강화]] — 혐오 자극 제거\n|-\n| '''행동 감소 (처벌)''' || '''정적 처벌(제1유형)''' — 혐오 자극 제공 || [[부적 처벌]](제2유형) — 보상 철회\n|}\n\n[[anim:skinner_box|아래 두 칸(정적 처벌·부적 처벌)이 켜질 때 레버 누름 화살표가 ↓ 로 바뀌는 것을 보라]]\n\n[[sim:operant_quadrant]]\n\n{warn}\n'''과속 벌금은 정적 처벌'''이다(p.24 그림: \"불쾌한 자극 추가\"). \"돈을 빼앗기니 부적 처벌 아닌가?\" 하고 헷갈릴 수 있지만, 슬라이드는 벌금 '''고지서라는 불쾌한 자극이 추가'''된 것으로 분류했고, 부적 처벌의 예로는 '''면허 취소'''(좋은 자극 제거)를 들었다. 시험은 슬라이드 기준으로.\n{/warn}\n\n== 처벌의 효과 (p.24) ==\n범죄율 감소에 실질적인 영향을 주는 것은 '''중형의 위협이 아닌, 신속하고 확실한 처벌 자극'''(Darley & Alter, 2013). 범죄 예방에는 엄벌주의보다 '''검거율'''이 더 효과적.\n\n== 처벌과 교육 (APA, 2019; p.25–26) ==\n{| class=\"table\"\n! 문제점 || 내용\n|-\n| 억제일 뿐 || 처벌받은 행동은 '''망각되는 것이 아니라 억제'''되며, 이 일시적 상태가 부모의 처벌 행위를 '''부적으로 강화'''\n|-\n| 방향 없음 || 체벌은 적절한 행동의 방향을 제공하지 않음\n|-\n| 변별만 || 처벌은 상황 [[변별]]력을 줄 뿐 행동의 효과적 감소로 이어지지 않음\n|-\n| 공포 || 선생에 대한 공포를 학습하여 학교 기피(Gershoff et al., 2010). 유럽 대부분·미국 주 정부는 학교·아동보호기관 체벌 금지\n|-\n| 공격성 || 체벌은 공격을 '''시범''' 보임으로써 공격성 증대와 연계(MacKenzie et al., 2013) → 관찰을 통한 폭력 학습([[관찰 학습]])\n|}\n\n{quiz}\n아이가 떼를 쓸 때 부모가 소리를 지르자 아이가 잠시 조용해졌다. 이후 부모가 소리 지르는 행동이 늘었다. 부모의 행동 증가를 설명하는 원리는?\n{/quiz}\n{answer}\n'''부적 강화'''. 아이의 떼(부모에게 혐오 자극)가 '''제거'''되어 부모의 소리 지르기가 '''증가'''. 슬라이드: \"이러한 일시적 상태가 부모의 처벌 행위를 부적으로 강화\"(APA 2019, p.25). bank MC 정답 문장이기도 하다.\n{/answer}\n\n== 관련 문서 ==\n* [[부적 처벌]] · [[부적 강화]] · [[정적 강화와 부적 강화]] · [[강화]]\n\n근거: 5장 p.24–27"
 },
 "부적 처벌": {
  "title": "부적 처벌 (제2유형 처벌)",
  "category": [
   "5장 학습",
   "용어"
  ],
  "body": "'''부적 처벌'''(Negative punishment, 제2유형 처벌)은 '''보상 자극을 철회하여 행동을 감소'''시키는 것이다(5장 p.24). '''부적(−) = 빼기''', '''처벌 = 행동 감소'''. 자녀 교육의 '''타임 아웃'''(p.27)이 대표 예.\n\n{def}\n'''설명''': 보상 자극을 철회하여 행동을 감소시키는 것 (5장 p.24)\n'''명칭''': [[부적 처벌]] (Negative punishment) — 제2유형 처벌\n'''사례형''': 숙제를 하지 않은 아이의 게임 시간을 빼앗았더니 숙제를 하지 않는 행동이 줄었다. (bank ch5 MC 보기)\n{/def}\n\n{analogy}\n부적 처벌은 '''축구의 퇴장'''이다. 반칙(행동)을 하면 경기에 뛸 권리(좋은 것)를 '''빼앗는다'''. 벌로 무언가를 더 주는 게 아니라 '''가진 걸 뺏어서''' 반칙을 줄인다.\n{/analogy}\n\n[[img:L5-24.png|5장 p.24 오른쪽 — 부적 처벌의 예: 과속이 반복되면 운전면허를 취소(좋은 자극 제거) → 과속 행동이 줄어든다|medium]]\n\n== 타임 아웃 ==\n{def}\n'''설명''': 올바르지 못한 행동에 대한 부모의 관심(강화물)을 배제함으로써(부적 처벌) 자연스럽게 긍정적 행동으로 바꾸게 하는 방법 (Dadds & Tully, 2019; 5장 p.27)\n'''명칭''': 타임 아웃 (Time-out)\n{/def}\n\n슬라이드 제목은 \"정적 강화의 타임 아웃\" — 즉 '''정적 강화(관심)를 잠시 멈춘다'''는 뜻이다. 아이가 떼를 쓸 때 부모가 반응하면 그 '''관심'''이 강화물로 작용해 떼가 늘어난다. 그래서 관심을 '''빼서'''(부적 처벌) 떼를 줄인다.\n\n[[img:L5-27.png|5장 p.27 — 처벌 VS 보상: 처벌은 일시적 효과에 그칠 수 있으며 부정적 감정과 반발심을 유발할 수 있음|medium]]\n\n== 부적 처벌 vs 부적 강화 ==\n{| class=\"table\"\n! || '''부적 처벌''' || [[부적 강화]]\n|-\n| 무엇을 빼나 || '''보상'''(좋은 것) || '''혐오 자극'''(싫은 것)\n|-\n| 행동 || '''↓ 감소''' || '''↑ 증가'''\n|-\n| 예 || 면허 취소, 게임 시간 압수, 타임 아웃 || 진통제로 통증 제거, 알람 끄기, 청소 면제\n|-\n| 공통 || \"부적\" = '''빼기''' || \"부적\" = '''빼기'''\n|}\n\n{warn}\n\"부적\"만 보고 같은 칸에 넣지 말 것. '''빼는 게 좋은 것이면 처벌(↓), 싫은 것이면 강화(↑)'''. 결국 판정은 '''행동이 늘었나 줄었나'''로 끝난다.\n{/warn}\n\n[[sim:operant_quadrant]]\n\n== 관련 문서 ==\n* [[처벌]] · [[부적 강화]] · [[정적 강화와 부적 강화]]\n\n근거: 5장 p.24, p.27"
 },
 "고전적 조건화와 조작적 조건화 비교": {
  "title": "고전적 조건화 vs 조작적 조건화",
  "category": [
   "5장 학습",
   "이론"
  ],
  "body": "5장 p.30 은 두 조건화를 한 장의 표로 정리한다. 공통점은 '''연합 학습의 유형이며, 획득·소거·자발적 회복·일반화·변별 현상을 수반'''한다는 것. 차이는 '''무엇과 무엇을 묶느냐'''와 '''반응이 자발적이냐'''다. bank 객관식 정답 문장이 이 표에서 그대로 나왔다.\n\n{def}\n'''설명''': 유기체가 제어할 수 없는 사건 간 연합을 학습하며 반응이 비자발적·자동적인 조건화 / 유기체가 행동과 결과 간 연합을 학습하며 반응이 자발적인 조건화 (5장 p.30)\n'''명칭''': [[고전적 조건화]] / [[조작적 조건화]]\n{/def}\n\n{analogy}\n[[고전적 조건화]]는 '''일기 예보를 배우는 것''' — 먹구름(CS) 뒤엔 비(US)가 온다는 걸 배우면 먹구름만 봐도 몸이 움츠러든다. 내가 어쩔 수 없는 '''세상의 순서'''를 배운다. [[조작적 조건화]]는 '''우산 사용법을 배우는 것''' — 우산을 펴면(행동) 안 젖는다(결과). '''내 행동의 결과'''를 배운다.\n{/analogy}\n\n[[img:L5-30.png|5장 p.30 — 고전적 조건화 VS 조작적 조건화 비교표|large]]\n\n== p.30 비교표 ==\n{| class=\"table\"\n! || [[고전적 조건화]] || [[조작적 조건화]]\n|-\n| '''기본 아이디어''' || 유기체가 '''제어할 수 없는 사건 간''' 연합을 학습 || 유기체가 '''행동과 결과 간''' 연합을 학습\n|-\n| '''반응''' || '''비자발적, 자동적''' || '''자발적''', 환경에 조작을 가함\n|-\n| '''획득''' || 중립 자극과 무조건 자극이 연합하여 조건화 || 반응을 결과(강화물 or 처벌)와 연합\n|-\n| '''[[소거]]''' || 조건 자극만 제시되면 반응이 감소 || 강화가 차단될 시 반응이 감소\n|-\n| '''[[자발적 회복]]''' || 휴지기간 후, 소거된 CR 이 재출현 || 휴지기간 후, 소거된 반응이 재출현\n|-\n| '''[[일반화]]''' || 조건 자극과 유사한 자극에 반응하는 경향 || 한 상황에서 학습한 반응이 유사 상황에서 발현\n|-\n| '''[[변별]]''' || 조건 자극과 다른 자극을 구분하는 학습 || 특정 반응만 강화되고 다른 반응은 그렇지 않은 학습\n|}\n\n== 한눈에: 대표 실험 ==\n<pre class=\"ascii\">\n 고전적  [[파블로프]]   [CS:종] ──▶ CR(침)          자극 → 자극   (개는 아무것도 안 함)\n 조작적  [[스키너]]     레버 누름 ──▶ 먹이 → 누름↑   행동 → 결과   (쥐가 먼저 행동함)\n<\/pre>\n\n[[anim:pavlov_dog|고전적 조건화 쪽 — 개는 가만히 있고 자극 두 개가 짝지어진다]]\n\n[[anim:skinner_box|조작적 조건화 쪽 — 쥐가 먼저 레버를 누르고, 그 결과가 행동 빈도를 바꾼다]]\n\n{exam}\nbank 객관식 정답: \"고전적 조건화는 유기체가 '''제어할 수 없는 사건 간의 연합'''을, 조작적 조건화는 '''행동과 결과 간의 연합'''을 학습한다.\" 오답 보기 패턴:\n* 반응 특성을 '''뒤바꿈''' — \"고전적 = 자발적, 조작적 = 비자발적\" ✗\n* \"일반화·변별은 '''고전적에서만'''\" ✗ — 공통 현상 5개\n* \"조작적 조건화의 획득은 중립 자극과 무조건 자극의 연합\" ✗ — 그건 고전적의 획득\n{/exam}\n\n{quiz}\n두 조건화의 공통 현상 다섯 가지를 모두 쓰시오.\n{/quiz}\n{answer}\n'''획득, 소거, 자발적 회복, 일반화, 변별''' (5장 p.30 공통점). 고차 조건형성·강화 계획은 공통 목록에 없다.\n{/answer}\n\n== 관련 문서 ==\n* [[고전적 조건화]] · [[조작적 조건화]] · [[소거]] · [[일반화]] · [[변별]]\n\n근거: 5장 p.4, p.30"
 },

  "body": "'''관찰 학습'''(Observational learning, 사회학습)은 '''타 개체의 행동을 관찰하고 모방하여 학습을 수행'''하는 것(모델링)이다(5장 p.31). 인지 기능이 관찰학습을 지원하므로 [[학습|인지 학습]]의 일환에 해당한다. 직접 겪지 않아도, '''남이 하는 걸 보고''' 배운다.\n\n{def}\n'''설명''': 타 개체의 행동을 관찰하고 모방하여 학습을 수행하는 것. 인지학습의 일환 (5장 p.31)\n'''명칭''': [[관찰 학습]] (Observational learning) — 사회학습\n{/def}\n\n{analogy}\n관찰 학습은 '''유튜브 요리 영상'''이다. 칼질을 직접 수백 번 해 보지 않아도 셰프가 하는 걸 보고 따라 하면 꽤 그럴듯해진다. 셰프가 칭찬받는 장면까지 보면 \"저렇게 하면 좋은 결과가 오는구나\"(대리 강화)까지 같이 배운다.\n{/analogy}\n\n[[img:L5-31.png|5장 p.31 — 관찰과 모방, 대리 강화와 대리 처벌. 왼쪽은 Bandura et al.(1961)의 오뚝이 실험|large]]\n\n[[anim:observational_learning|어른 모델의 행동 → 아이의 관찰 → 혼자 남은 아이의 모방(모델링), 그리고 모델이 보상받는 장면(대리 강화)을 차례로 보라]]\n\n== 관찰과 모방 (p.31) ==\n\n=== 모델링 ===\n{def}\n'''설명''': 타 개체의 행동을 관찰하고 모방하여 학습을 수행하는 것 (5장 p.31)\n'''명칭''': 모델링 (Modeling)\n{/def}\n관찰 대상의 상태나 유형에 따라 아동들의 행동 양상이 크게 달라진다(Bandura, 2017). 대표 실험 → [[오뚝이 실험]].\n\n=== 대리 강화와 대리 처벌 ===\n{def}\n'''설명''': 대상 관찰을 통해 대상이 겪는 강화와 처벌 또한 모델링하는 것 (5장 p.31)\n'''명칭''': 대리 강화 (Vicarious reinforcement) / 대리 처벌 (Vicarious punishment)\n{/def}\n* 보상을 받는 사람을 관찰할 때 관찰자의 '''대뇌 보상 시스템이 활성화'''(Mobbs et al., 2009)\n* 타인이 위험 상황을 안전하게 통과하는 것을 관찰하면 '''학습된 공포가 사라짐'''(Golkar et al., 2013) — 관찰로 일어나는 [[소거]]\n\n== 동물과 인간 (p.32–35) ==\n{| class=\"table\"\n! 대상 || 내용 || 출처\n|-\n| 혹등고래 || 꼬리치기를 통한 미끼몰이 || Allen et al., 2013\n|-\n| 버빗원숭이 || 부모-자녀 먹이 학습 || Van de Waal et al., 2013\n|-\n| 맹수 || 어미가 새끼에게 사냥법 시연(범고래·치타·사자) || p.32\n|-\n| 원숭이 뇌 || [[거울 뉴런]] — 다른 개체가 땅콩을 먹을 때도 활성 || 리졸라티, 2002·2006\n|-\n| 인간 영아 || 생후 '''8~16개월'''도 모방으로 행동 조성. TV 모델도 모방 || Marshall & Meltzoff 2014; Meltzoff & Moore 1997\n|-\n| 과잉 모방 || 어른의 '''부적절한''' 행동조차 모방 → 모방 학습의 '''생득적''' 요인 || Lyons et al., 2007\n|}\n\n[[img:L5-34.png|5장 p.34 — 유아의 행동 모방(Meltzoff et al., 2009)|small]]\n\n== 응용: 친사회적 vs 반사회적 영향 (p.36–38) ==\n\n=== 친사회적 영향 ===\n{def}\n'''설명''': 친사회적 행동의 모방이 친사회적 영향력으로 이어지는 것. 친사회적 컨텐츠 노출이 이타적 행동을 증진 (5장 p.36)\n'''명칭''': 친사회적 영향 (Prosocial influence)\n{/def}\n기업의 행동 모델링 교육(사수의 업무 전수), 아동은 '''부모를 가장 강력한 모델'''로 도덕성 학습 → [[콜버그의 도덕성 발달 단계|3장 도덕성 발달]].\n\n=== 반사회적 영향 ===\n{def}\n'''설명''': 반사회적 행동의 모방이 발생할 위험. 반사회적 컨텐츠의 노출이 반사회적 행동으로 이어질 수 있음 (5장 p.37)\n'''명칭''': 반사회적 영향 (Antisocial influence)\n{/def}\n가정 폭력 노출 아동의 공격성(Hays & Carver, 2014), 증오 발언 반복 노출 → 편견(Soral et al., 2018), 매체 폭력 → 폭력 시청 효과(Anderson et al., 2017), '''모방 범죄'''.\n\n[[img:L5-38.png|5장 p.38 — 번외: 폭력적 게임 → 공격적 사고·태도 증가 → 실제 폭력 행동 증가?|medium]]\n\np.38 번외: 대중매체는 관찰학습의 '''가장 강력한 원천'''(「분노의 질주」 개봉 주간 딱지 급증, Jena 2018). 폭력적 게임은 '''둔감화'''를 통해 공격성을 높인다는 연구(Allen & Anderson, 2017)도 있지만, 메타 분석에서 '''출간 편향을 교정'''하면 폭력적 게임과 공격 행동 간 [[상관]]은 '''낮다'''(Ferguson, 2007a·b, 2015).\n\n{warn}\n체벌도 관찰 학습 문제다: 체벌은 공격을 '''시범''' 보여 아동의 공격성을 높인다(p.26, [[처벌]]). \"때리면서 때리지 말라고 가르치는\" 셈.\n{/warn}\n\n== 관련 문서 ==\n* [[오뚝이 실험]] · [[거울 뉴런]] · [[마음 이론]] · [[학습]]\n\n근거: 5장 p.5, p.31–38"
 },
 "오뚝이 실험": {
  "title": "오뚝이 실험 (Bandura et al., 1961; 보보 인형 실험)",
  "category": [
   "5장 학습",
   "실험"
  ],
  "body": "'''오뚝이 실험'''(Bandura et al., 1961)은 성인 모델이 오뚝이 인형을 때리는 모습을 본 아동이 그 공격 행동을 그대로 '''모방'''한다는 것을 보여 준, [[관찰 학습]]의 대표 실험이다. 슬라이드(5장 p.31)에는 사진과 캡션 \"Bandura et al. (1961)의 오뚝이 실험\"만 있고, 실험 절차·결과 서술은 (교재 보충)이다. 교재·다른 번역에서는 '''보보 인형 실험'''(Bobo doll)이라고 부른다 — 슬라이드 표기는 \"오뚝이 실험\".\n\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 이름(원어) || 앨버트 반두라 (Albert Bandura)\n|-\n| 학파·분야 || 사회학습(관찰 학습) 연구\n|-\n| 핵심 주장·업적 || 직접 강화 없이 '''관찰만으로''' 학습이 일어난다. 관찰 대상의 상태·유형이 아동 행동에 큰 영향(Bandura, 2017)\n|-\n| 관련 실험·연도 || '''Bandura et al. (1961)의 오뚝이 실험''' (p.31)\n|-\n| 시험 포인트 || 관찰 학습 = 사회학습 = 모델링. 인지 학습의 일환\n|}\n\n{def}\n'''설명''': 성인 모델이 인형을 공격하는 모습을 관찰한 아동이 이후 같은 공격 행동을 모방한 실험 (Bandura et al., 1961; 5장 p.31)\n'''명칭''': [[오뚝이 실험]] — 보보 인형 실험 (Bobo doll experiment)\n{/def}\n\n{def}\n'''설명''': 오뚝이 실험으로 관찰 학습(사회학습)을 보여 준 학자 (5장 p.31)\n'''명칭''': 반두라 (Bandura)\n{/def}\n\n{analogy}\n오뚝이 실험은 '''말버릇이 옮는 동생'''이다. 형이 게임하다 욕하는 걸 본 동생은, 아무도 \"욕해 봐\"라고 하지 않았고 욕해서 상을 받은 적도 없는데 어느 날 똑같은 억양으로 그 욕을 한다. '''본 것만으로''' 배웠다.\n{/analogy}\n\n[[img:L5-31.png|5장 p.31 — 캡션 \"Bandura et al. (1961)의 오뚝이 실험\". 사진: 위는 성인 모델, 아래는 아동이 오뚝이를 때리는 장면|large]]\n\n== 실험 카드 ==\n{| class=\"table\"\n! 연구자(연도) || 질문 || 절차 || 결과 || 결론 || 함정\n|-\n| Bandura et al. (1961) || 직접 보상 없이 보기만 해도 행동을 배우나? || (교재 보충) 아동이 성인 모델이 오뚝이를 때리는 장면을 관찰 → 이후 아동 혼자 오뚝이와 함께 남김 || (교재 보충) 아동이 모델의 공격 행동을 그대로 모방 || '''관찰과 모방(모델링)'''으로 학습 = 관찰 학습 || 조작적 조건화(직접 강화)도, 고전적 조건화도 아님\n|}\n\n<pre class=\"ascii\">\n (교재 보충 절차)\n 방 1  [성인 모델] ──때림──▶ (오뚝이)        [아동] 👀 관찰만\n 방 2  [아동 혼자] ──때림──▶ (오뚝이)        = 모방 ('''모델링''')\n<\/pre>\n\n같은 슬라이드의 '''별도 내용''' — \"대리 강화와 대리 처벌\" (오뚝이 실험의 절차가 아님):\n* 대상 관찰을 통해 대상이 겪는 강화와 처벌 또한 모델링.\n* 보상을 받는 사람을 관찰할 때, 관찰자의 대뇌의 보상 시스템이 활성화 됨(Mobbs et al., 2009 — 슬라이드 표기 \"Moobs\").\n* 반대로, 타인이 위험 상황을 안전하게 통과하는 것을 관찰하면 학습된 공포가 사라짐(Golkar et al., 2013).\n\n[[anim:observational_learning|방 1 의 관찰 → 방 2 의 모방(교재 보충 절차), 보조 패널은 별도 연구(Mobbs 2009)의 대리 강화]]\n\n슬라이드에는 유튜브 링크(실험 실제 영상)도 달려 있다: https://www.youtube.com/watch?v=dmBqwWlJg8U\n\n{joke}\n오뚝이 입장에선 억울하다. 쓰러뜨려도 다시 일어나도록 설계된 탓에, 몇 번이고 다시 맞았다. 심리학사에서 가장 많이 맞은 인형.\n{/joke}\n\n== 관련 문서 ==\n* [[관찰 학습]] · [[거울 뉴런]] · [[처벌]](체벌의 공격성 시범)\n\n근거: 5장 p.31 (p.26, p.37)"
 },
 "거울 뉴런": {
  "title": "거울 뉴런 (Mirror Neuron)",
  "category": [
   "5장 학습",
   "뇌 구조"
  ],
  "body": "'''거울 뉴런'''(Mirror Neuron)은 '''특정 행동을 수행하거나 타인이 그 행동을 하는 것을 관찰할 때 활성화되는 전두엽 뉴런'''이다(5장 p.35). 모방과 [[관찰 학습]]의 '''신경 토대'''를 제공하고, 언어 행동·공감에 영향을 주며, [[마음 이론]]의 공감 기제도 여기에 기반한다. 발견자는 리졸라티(Rizzolatti).\n\n{def}\n'''설명''': 특정 행동을 수행하거나, 타인이 그 행동을 하는 것을 관찰할 때 활성화되는 전두엽 뉴런 (5장 p.35)\n'''명칭''': [[거울 뉴런]] (Mirror Neuron)\n{/def}\n\n{analogy}\n거울 뉴런은 '''뇌 속 리플레이 버튼'''이다. 친구가 레몬을 깨무는 걸 보기만 해도 내 입에 침이 고이고 얼굴이 찡그려진다. 남의 행동을 보는 순간, 내 뇌가 그 행동을 '''조용히 같이 해 보는''' 것 — 그래서 따라 하기(모방)와 공감이 쉬워진다.\n{/analogy}\n\n== 리졸라티의 발견 (p.33) ==\n\n=== 리졸라티 ===\n{def}\n'''설명''': 원숭이 전두엽 연구로 거울 뉴런을 발견한 연구자 (2002, 2006; 5장 p.33)\n'''명칭''': 리졸라티 (Rizzolatti)\n{/def}\n\n{| class=\"table\"\n! 연구자(연도) || 절차 || 결과 || 결론\n|-\n| 리졸라티 (2002, 2006) || 원숭이의 전두엽에 전극을 삽입, 땅콩을 먹으면 버저가 울리도록 세팅 || '''다른 개체가 땅콩을 먹을 때도''' 버저가 울림. 인간 연구자가 아이스크림을 먹는 것을 관찰할 때도 유사(Blakeslee, 2006) || 행동 수행과 행동 관찰에 '''같은''' 뉴런이 반응 = 거울 뉴런\n|}\n\n<pre class=\"ascii\">\n 원숭이 A 가 땅콩을 먹음  ──▶ A 의 전두엽 뉴런 발화 ──▶ 🔔 버저\n 원숭이 B 가 땅콩을 먹음  ──▶ (A 는 보기만 함) A 의 '''같은''' 뉴런 발화 ──▶ 🔔 버저 !\n<\/pre>\n\n[[img:L5-33.png|5장 p.33 — 동물의 사회학습 예시와 거울 뉴런의 발견(리졸라티, 2002, 2006)|medium]]\n\n== 인간 뇌에서 (p.35) ==\n\n[[img:L5-35.png|5장 p.35 — (a) 실제 통증을 느낄 때 (b) 그 고통에 감정이입할 때 — 겹쳐 활성화되는 뇌 영역|large]]\n\n* 모방과 관찰 학습의 신경 토대 / 언어 행동, 공감에 영향\n* 단순히 '''소설을 읽는 것만으로도''' 두뇌 활동을 유발(Speer et al., 2009)\n* 실제 통증과 타인의 고통 상상(감정이입)에서 활성 영역이 겹친다\n* [[마음 이론]](타인의 심적 상태를 추론하는 능력)은 거울 뉴런에 의한 공감 기제에 기반 — 3장 p.18 과 연결\n* p.34: fMRI 를 통해 공감과 모방에 대한 신경 탐구 진행 → [[fMRI]]\n\n[[anim:observational_learning|아이가 모델을 관찰하는 순간 — 거울 뉴런이 \"보는 것\"을 \"하는 것\"으로 옮겨 주는 장면이라고 생각하며 보라]]\n\n{warn}\nbank 오답 보기: \"'''후두엽'''에 위치하며 시각 자극에만 반응\" ✗ ('''전두엽'''), \"CS–US 연합을 저장하는 뉴런\" ✗ (그건 고전적 조건화 신경회로, p.13), \"타인이 '''처벌받는 것을 볼 때만''' 활성화\" ✗ (행동 관찰 전반).\n{/warn}\n\n== 관련 문서 ==\n* [[관찰 학습]] · [[마음 이론]] · [[오뚝이 실험]] · [[뉴런]]\n\n근거: 5장 p.5, p.33–35"
 },
