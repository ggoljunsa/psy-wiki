  "body": "'''상관'''(Correlation)은 '''두 변인이 얼마나 함께 움직이는지'''를 −1부터 1까지의 숫자로 나타낸 측정치이고, 이를 이용하는 연구가 '''상관 연구'''다. 1장에서 교수가 가장 세게 강조한 문장이 여기서 나온다 — '''\"상관은 인과가 아니다.\"'''\n\n{def}\n'''설명''': 두 변인이 함께 변하는 정도에 대한 측정치(−1~1). 한 변인이 다른 변인을 얼마나 잘 예측할 수 있는지를 시사 (1장 p.22)\n'''명칭''': [[상관]] (Correlation)\n{/def}\n\n[[img:L1-22.png|1장 p.22 — 상관 구도의 유형: 완벽한 정적 상관(+1.00), 상관 없음(0.00), 완벽한 부적 상관(−1.00). 빨간 글씨 = \"인과성을 입증해주는 지표는 아님\", \"제 3의 변인이 존재할 수 있기 때문\"|medium]]\n\n{analogy}\n상관은 '''우산 판매량과 교통사고 건수'''의 관계다. 우산이 많이 팔리는 날 교통사고도 많다(정적 상관). 그래서 \"내일 우산이 많이 팔리면 사고도 많겠다\"는 '''예측'''은 맞는다. 하지만 우산을 판매 금지해도 사고는 줄지 않는다 — 둘 다 '''비'''라는 [[제3의 변인]]이 만든 그림자일 뿐이다. 상관은 그림자 두 개가 같이 움직인다는 걸 알려 줄 뿐, 누가 누구를 움직이는지는 말해 주지 않는다.\n{/analogy}\n\n== 슬라이드 내용 (p.22) ==\n* 두 변인이 함께 변하는 정도에 대한 측정치(−1~1).\n** 한 변인이 다른 변인을 얼마나 잘 예측할 수 있는지를 시사.\n** '''[[착각 상관]]''': 실제로는 관계가 없으나, 관계가 있다고 강하게 지각하는 현상.\n** '''[[평균으로의 회귀]]''': 극단적이거나 이례적인 사건은 평균 방향으로 되돌아오는 경향성.\n* 두 변인 간의 '''연관성을 보여 줄 수는 있으나 인과성을 입증해 주는 지표는 아님'''.\n** '''예측은 할 수 있지만, 설명을 할 수는 없음.'''\n** 두 변인에 영향을 줄 수 있는 '''[[제3의 변인]]'''이 존재할 수 있기 때문.\n\n== 상관의 세 유형 ==\n{| class=\"table\"\n! 유형 || 값 || 모양 || 예\n|-\n| '''정적 상관''' || 0 ~ +1 (완벽 +1.00) || 오른쪽 위로 올라가는 점들 || 아이스크림 소비↑ – 식중독↑\n|-\n| '''상관 없음''' || 0 근처 (0.00) || 흩어진 점들 || 신발 사이즈 – 시험 점수\n|-\n| '''부적 상관''' || −1 ~ 0 (완벽 −1.00) || 오른쪽 아래로 내려가는 점들 || 한쪽↑ 다른 쪽↓\n|}\n\n{warn}\n부호는 '''방향'''이고 절댓값이 '''강도'''다. −0.9는 +0.3보다 '''더 강한''' 상관이다. \"부적 상관 = 관계가 없다/약하다\"는 ✗.\n{/warn}\n\n[[anim:correlation_not_causation|산점도에 점이 쌓여 정적 상관이 되는 것을 본 뒤, \"아이스크림 → 식중독?\" 화살표에 ✗가 붙는 이유를 '기온' 상자로 설명해 볼 것]]\n\n{exam}\n교수(🎙 9/1 1:29:10): 「'''상관은 인과성을 입증하는 지표가 아니다 — 굉장히 중요한 사안'''」. 슬라이드에서도 이 문장만 '''빨간 글씨'''. 노트 예: 식중독 발병률과 아이스크림 소비율 → 제3의 변인 = 날씨·기온. 3장 [[권위적·권위주의적·허용적 양육]]에서도 교수는 \"양육 방식과 결과는 상관이지 인과가 아니다\"를 되풀이했다.\n{/exam}\n\n{quiz}\n여름철에 아이스크림 소비율과 식중독 발병률이 함께 증가하는 정적 상관이 관찰되었다. 가장 적절한 해석은? ① 아이스크림이 식중독의 원인이다 ② 기온 같은 제3의 변인이 두 변인 모두에 영향을 주었을 수 있으므로 인과로 해석하면 안 된다 ③ 부적 상관이다 ④ 무선 표집으로 뽑았다면 이 상관으로 인과를 확정할 수 있다\n{/quiz}\n{answer}\n'''②'''. ① 인과로 단정 ✗, ③ 함께 증가하므로 '''정적''' 상관, ④ 인과 검증은 무선 표집이 아니라 '''처치 + 통제 + [[무선 할당]]'''([[실험법]])으로만 가능. (bank ch1 MC, 1장 p.22)\n{/answer}\n\n[[sim:research_methods]]\n\n== 상관 연구 vs 실험 ==\n{| class=\"table\"\n! 구분 || 상관 연구 || [[실험법|실험]]\n|-\n| 기본 목적 || 한 변인이 다른 변인을 '''예측'''하는 정도 평가 || 원인과 결과 '''탐색'''\n|-\n| 처치 || 없음 (있는 그대로 두 변인 측정) || 하나 이상의 독립변인\n|-\n| 할 수 있는 말 || \"X가 높으면 Y도 높은 경향\" || \"X가 Y를 일으킨다\"\n|-\n| 약점 || 원인과 결과를 명세하지 못함 || 일반화 한계, 윤리적 제약\n|}\n\n== 관련 문서 ==\n* [[제3의 변인]] · [[착각 상관]] · [[평균으로의 회귀]] · [[실험법]] · [[연구 방법 비교]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.22, p.25"
 },
 "착각 상관": {
  "title": "착각 상관 (Illusory Correlation)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "용어"
  ],
  "body": "'''착각 상관'''(Illusory Correlation)은 '''실제로는 아무 관계가 없는 두 사건을 관계가 있다고 굳게 믿는''' 현상이다. p.8 [[무선적 사건에서의 질서 지각]]에서 처음 예고되고, p.22 [[상관]] 슬라이드에서 정의된다.\n\n{def}\n'''설명''': 실제로는 관계가 없으나, 관계가 있다고 강하게 지각하는 현상 (1장 p.22)\n'''명칭''': [[착각 상관]] (Illusory Correlation)\n{/def}\n\n{def}\n'''사례형 설명''': \"내가 응원하는 날만 우리 팀이 진다\"고 믿는 팬. 실제로 기록을 세어 보면 응원한 날과 안 한 날의 승률은 차이가 없다. 진 날만 유난히 기억에 남았을 뿐이다.\n'''명칭''': [[착각 상관]]\n{/def}\n\n[[img:L1-08.png|1장 p.8 — 우연히 벌어진 사건들 → \"뭔가 패턴이 있는 것 같은데?\" → 패턴처럼 인식. 슬라이드: \"그 패턴은 정말 실존하는 것일까? → '착각 상관'이나 '평균으로의 회귀'와 연관\"|medium]]\n\n{analogy}\n착각 상관은 '''\"세차하면 비 온다\"'''는 법칙이다. 세차한 다음 날 비가 온 기억은 억울해서 오래 남고, 세차했는데 맑았던 수십 번은 아무 일도 없었으니 잊힌다. 머릿속 장부에 한쪽 칸만 기록되니, 없는 관계가 생긴다.\n{/analogy}\n\n== 왜 생기나 ==\n* p.8: 사람은 무선적인 현상을 '''매우 불편하게''' 여기므로 무선 배열을 무선적이지 않은 것으로 인식한다. 그러나 무선 연속에서도 패턴은 우연히 충분히 반복된다.\n* \"같이 일어난\" 기억(세차 + 비)은 눈에 띄고, \"같이 안 일어난\" 경우는 기억되지 않는다.\n\n<pre class=\"ascii\">\n                   비 옴        비 안 옴\n   세차함        ★ 기억남!      (잊힘) × 많음\n   세차 안 함    (잊힘)         (잊힘)\n   → 네 칸을 다 세면 관계 없음.  ★ 한 칸만 보면 \"세차하면 비 온다\" = '''착각 상관'''\n<\/pre>\n\n[[anim:correlation_not_causation|진짜 상관(아이스크림-식중독)조차 인과가 아니라는 것을 보고 나면, 아예 상관이 없는데 있다고 믿는 착각 상관이 얼마나 더 위험한지 감이 온다]]\n\n== 헷갈리는 짝 ==\n{| class=\"table\"\n! 구분 || 착각 상관 || [[평균으로의 회귀]] || [[후견 편향]]\n|-\n| 핵심 || '''없는 관계'''를 있다고 지각 || 극단적 사건 뒤 '''평균 쪽으로 복귀''' || 결과를 안 뒤 '''예측할 수 있었다'''고 믿음\n|-\n| 예 || 우연의 일치에 의미 부여 || 야구팀 감독 비난 후 다음 경기 호전 || 콜럼버스의 달걀\n|-\n| 실제 관계 || 없음 || 통계적 현상 (원인 없음) || —\n|}\n\n{warn}\n착각 상관 vs [[상관]]: '''상관'''은 실제로 두 변인이 함께 변한다(단, 인과는 아님). '''착각 상관'''은 함께 변하지도 '''않는데''' 변한다고 믿는 것. 둘 다 인과를 입증하지 못하지만, 착각 상관은 예측조차 못 한다.\n{/warn}\n\n== 관련 문서 ==\n* [[상관]] · [[평균으로의 회귀]] · [[무선적 사건에서의 질서 지각]] · [[제3의 변인]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.8, p.22"
 },
 "평균으로의 회귀": {
  "title": "평균으로의 회귀 (Regression toward the Mean)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "용어"
  ],
  "body": "'''평균으로의 회귀'''(Regression toward the Mean)는 '''유난히 잘했거나 유난히 못한 다음에는 보통 수준으로 돌아오는''' 통계적 경향이다. 아무 원인도 없는데 사람들은 그 \"돌아옴\"에 원인을 붙인다 — 그게 함정이다.\n\n{def}\n'''설명''': 극단적이거나 이례적인 사건은 평균 방향으로 되돌아오는 경향성 (1장 p.22)\n'''명칭''': [[평균으로의 회귀]] (Regression toward the Mean)\n{/def}\n\n{def}\n'''사례형 설명''': 감독이 대패한 다음 날 선수들을 심하게 비난했더니 다음 경기 결과가 나아졌다. 감독은 \"비난이 효과가 있었다\"고 결론 내렸지만, 극단적 부진 뒤에는 원래 평균 쪽으로 돌아오기 마련이다.\n'''명칭''': [[평균으로의 회귀]]\n{/def}\n\n{analogy}\n평균으로의 회귀는 '''시험 점수의 운'''이다. 평소 70점대인 학생이 찍은 게 잘 맞아 95점을 받으면, 다음 시험은 아마 다시 70점대다. 공부를 덜 해서가 아니라 '''운이 평소대로 돌아왔기''' 때문이다. 반대로 컨디션 최악으로 40점 받은 다음 시험은, 학원을 끊든 말든 아마 오른다. 이때 \"학원을 끊었더니 올랐다\"고 하면 회귀를 원인으로 착각한 것.\n{/analogy}\n\n== 슬라이드·수업 내용 ==\n* p.8: 무선적 연속에서 보이는 패턴이 정말 실존하는가? → '''착각 상관'''이나 '''평균으로의 회귀'''와 연관.\n* p.22: 착각 상관 아래 하위 항목(✓)으로 \"평균으로의 회귀: 극단적이거나 이례적인 사건은 평균 방향으로 되돌아오는 경향성\".\n* 노트·🎙 9/1(1:26:12): 야구를 못하는 팀에게 비난을 하면 다음 경기는 좀 더 잘하더라 — 실제로는 '''평균으로 회귀한 것'''이다.\n\n<pre class=\"ascii\">\n 성적\n  ▲\n  │            평균 ─────────────────────────────\n  │   ●                    ●       ●\n  │        ●     ● (대패!)            ●\n  │                ╲  감독 비난\n  │                 ╲→ ● (다음 경기 호전)   ← 비난 덕? NO — 평균 쪽으로 돌아온 것\n  └──────────────────────────────────────────▶ 경기\n<\/pre>\n\n{quiz}\n감독이 대패한 다음 날 선수들을 심하게 비난했더니 다음 경기 결과가 나아졌다. 「비난이 효과가 있었다」고 결론 내릴 때 간과하고 있는 현상은? ① 과신 ② 확증 편향 ③ 평균으로의 회귀 ④ 가용성 어림법\n{/quiz}\n{answer}\n'''③ 평균으로의 회귀'''. 극단적 부진 뒤에는 비난과 무관하게 평균 방향으로 돌아온다. ① [[과신]]은 실제보다 더 안다고 믿는 것, ② [[확증 편향]]은 유리한 정보만 취하는 것, ④ [[가용성 어림법]]은 떠올리기 쉬운 사례로 판단하는 것. (bank ch1 MC, 1장 p.22)\n{/answer}\n\n== 헷갈리는 짝 ==\n{| class=\"table\"\n! 구분 || 평균으로의 회귀 || [[착각 상관]]\n|-\n| 무엇 || 극단 → 평균으로 돌아오는 '''실제 통계 현상''' || 없는 관계를 있다고 믿는 '''지각의 착각'''\n|-\n| 오류가 생기는 지점 || 돌아옴의 원인을 엉뚱한 데(비난·처방)로 돌림 || 우연히 겹친 사건을 관계로 묶음\n|-\n| 예 || 야구팀 감독 비난 || 세차하면 비 온다\n|}\n\n{tip}\n실험에서 이 함정을 피하는 방법이 [[실험법|통제 조건]]이다. \"비난받은 팀\"만 보지 말고, 똑같이 대패했지만 비난받지 않은 팀도 다음 경기에서 나아지는지 비교하면 회귀 효과를 걸러 낼 수 있다.\n{/tip}\n\n== 관련 문서 ==\n* [[착각 상관]] · [[상관]] · [[무선적 사건에서의 질서 지각]] · [[실험법]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.8, p.22"
 },

  "body": "'''제3의 변인'''(Third Variable, 슬라이드 표기 \"제 3의 변인\")은 '''두 변인 X와 Y에 동시에 영향을 주어, X와 Y 사이에 가짜 인과처럼 보이는 상관을 만드는 숨은 변인'''이다. \"[[상관]]은 인과가 아니다\"의 가장 대표적인 이유다.\n\n{def}\n'''설명''': 두 변인 간에 상관이 있어도 인과를 말할 수 없는 이유 — 두 변인에 영향을 줄 수 있는 또 다른 변인 (1장 p.22)\n'''명칭''': [[제3의 변인]] (Third Variable)\n{/def}\n\n{def}\n'''사례형 설명''': 아이스크림 소비율과 식중독 발병률이 함께 오르지만, 사실은 '''기온(여름)'''이 두 가지를 모두 끌어올린 것이었다.\n'''명칭''': [[제3의 변인]] (여기서는 기온·날씨)\n{/def}\n\n[[anim:correlation_not_causation|위에서 '기온(여름)' 상자가 내려와 두 변인으로 화살표를 뻗는 장면 — 그 상자가 바로 제3의 변인이다]]\n\n{analogy}\n제3의 변인은 '''인형극의 손'''이다. 무대 위에서 두 인형(아이스크림, 식중독)이 동시에 춤추니 한 인형이 다른 인형을 움직이는 것처럼 보인다. 하지만 막 뒤를 보면 '''한 사람의 두 손(기온)'''이 각각 인형을 들고 있다. 상관 연구는 무대만 보고, [[실험법|실험]]은 막을 걷어 본다.\n{/analogy}\n\n<pre class=\"ascii\">\n               '''기온(여름)'''  ← 제3의 변인\n               ╱          ╲\n              ▼            ▼\n     아이스크림 소비 ┄┄┄┄┄┄ 식중독 발병\n                  (정적 상관)\n          \"아이스크림 → 식중독\" ?  ✗  (인과 아님)\n<\/pre>\n\n== 슬라이드·수업 내용 ==\n* p.22 (빨간 글씨): 상관은 연관성을 보여 줄 수 있으나 인과성을 입증해 주는 지표는 아님 — 예측은 할 수 있지만 설명할 수는 없음 — '''두 변인에 영향을 줄 수 있는 제 3의 변인이 존재할 수 있기 때문'''.\n* 노트·🎙 9/1(1:29:10): 식중독 발병률과 아이스크림 소비율 → 제3의 변인 = 날씨·기온.\n\n{quiz}\n\"아이스크림 소비율과 식중독 발병률 사이에 정적 상관이 있으므로, 아이스크림 판매를 금지하면 식중독이 줄 것이다.\" 이 추론의 문제는?\n{/quiz}\n{answer}\n상관을 인과로 해석했다. 두 변인 모두 '''기온'''이라는 '''제3의 변인'''의 영향을 받았을 수 있으므로, 아이스크림을 금지해도 식중독은 줄지 않을 수 있다. 인과를 확인하려면 처치·통제·[[무선 할당]]이 있는 [[실험법]]이 필요하다. (bank ch1 MC 변형, 1장 p.22)\n{/answer}\n\n{tip}\n[[실험법]]이 제3의 변인을 이기는 방법: [[무선 할당]]으로 참가자를 나누면 기온·성격·체질 같은 숨은 변인이 두 조건에 '''골고루''' 퍼진다. 그러면 남는 차이는 처치뿐이다.\n{/tip}\n\n== 관련 문서 ==\n* [[상관]] · [[착각 상관]] · [[실험법]] · [[무선 할당]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.22"
 },
 "실험법": {
  "title": "실험법 (Experiment)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "연구 방법"
  ],
  "body": "'''실험법'''(Experiment)은 '''연구자가 원인으로 의심되는 변인을 직접 바꿔 보고(처치), 나머지는 똑같이 묶어 둔 채(통제) 결과를 비교'''하는 방법이다. 1장에 나오는 연구 방법 중 '''인과를 검증할 수 있는 유일한 방법'''이다.\n\n{def}\n'''설명''': 관심 변인에 대한 처치를 가하고, 다른 변인을 일정하게 유지하여 처치 변인의 효과를 인과적으로 검증하는 방법 (1장 p.23)\n'''명칭''': [[실험법]] (Experiment)\n{/def}\n\n{def}\n'''사례형 설명''': 새 토익 학습법의 효과를 알아보려고, 모집한 학생들을 무작위로 두 집단에 나눠 한쪽은 새 학습법, 다른 쪽은 기존 학습법으로 공부시킨 뒤 점수를 비교했다.\n'''명칭''': [[실험법]]\n{/def}\n\n[[img:L1-23.png|1장 p.23 — 실험법의 예시: 참가자 → 무선 할당 → 새 토익 학습법(실험 조건) VS 기존 학습법(통제 조건)|medium]]\n\n{analogy}\n실험법은 '''요리 블라인드 테스트에서 재료 하나만 바꾸기'''다. 같은 냄비, 같은 불, 같은 시간에 끓이되 소금만 다른 브랜드로 바꾼다(처치). 나머지는 전부 똑같이(통제). 그리고 누가 어느 그릇을 먹을지는 제비뽑기로 정한다([[무선 할당]]). 그래서 맛 차이가 나면 '''범인은 소금밖에 없다.'''\n{/analogy}\n\n== 슬라이드 내용 (p.23) ==\n* 관심 변인에 대한 '''처치'''를 가하고, '''다른 변인을 일정하게 유지'''하여 처치 변인의 효과를 '''인과적으로 검증'''하는 방법.\n* 변인을 지정하고 그 변인에 대한 조작을 가한 후 '''통제 조건과 비교'''.\n* 실험 참가자의 '''[[무선 할당]]'''이 필요 (슬라이드 빨간 글씨).\n\n=== 실험 조건 ===\n{def}\n'''설명''': 실험에서 실제 처치를 가하는 조건 혹은 집단 (1장 p.23)\n'''명칭''': [[실험법|실험 조건]] (실험 집단)\n{/def}\n\n=== 통제 조건 ===\n{def}\n'''설명''': 실험에서 실험 처치를 받지 않는 조건 혹은 집단 (1장 p.23)\n'''명칭''': [[실험법|통제 조건]] (통제 집단)\n{/def}\n\n=== 독립변인 ===\n{def}\n'''설명''': 실험에서 연구자가 처치(조작)를 가하는 변인. p.25 비교표에서 실험의 \"처치\" 칸 = \"하나 이상의 독립변인\" (1장 p.25)\n'''명칭''': [[실험법|독립변인]]\n{/def}\n교수(🎙 9/1): 독립변인이 여러 개인 요인 설계는 학기 말에 다룬다.\n\n[[anim:experiment_design|모집단 → 무선 표집 → 동전(무선 할당) → 실험·가짜약·통제 조건 → 눈가리개(이중 은폐) → 결과 막대. 각 단계가 무엇을 막아 주는지 말해 볼 것]]\n\n[[sim:research_methods]]\n\n== 실험법의 구성 요소 ==\n<pre class=\"ascii\">\n  참가자 ──'''[[무선 할당]]'''──┬──→ '''실험 조건''' : 새 학습법 (처치 = [[실험법|독립변인]])  ──→ 점수\n                         │\n                         └──→ '''통제 조건''' : 기존 학습법 (처치 없음)              ──→ 점수\n        나머지 변인(시간·교재·시험지)은 '''일정하게 유지'''  →  점수 차이 = 처치의 효과 (인과)\n<\/pre>\n\n교수 예시(🎙 9/1 1:34:42): 원래 토익 점수가 높은 학생들이 우연히 한쪽 집단에 몰리면 결과를 신뢰할 수 없다 → 그래서 [[무선 할당]]으로 개인차를 고르게 퍼뜨린다. 의약 연구에서는 여기에 '''[[가짜약 효과|가짜약 조건]]'''과 '''[[이중 은폐]]'''가 더해진다(p.24).\n\n{exam}\n교수(🎙 9/1 1:17:18): 「이 소개 범위에서 '''직접적인 통제나 조작을 가하는 연구 방법은 실험법 딱 하나'''」. 실험 = '''인과성을 검증하는 유일한 방법'''(1:46:01). 약점은 통제된 인위적 상황이라 '''일반화'''가 어렵고, 뇌를 일부러 손상시키는 것처럼 '''윤리적으로 처치할 수 없는''' 주제가 있다는 것.\n{/exam}\n\n== 세 방법 비교 (p.25) ==\n{| class=\"table\"\n! 구분 || [[연구 방법 비교|기술적 방법]] || [[상관|상관 연구]] || 실험\n|-\n| 기본 목적 || 행동 관찰·기록 || 예측 정도 평가 || '''원인과 결과 탐색'''\n|-\n| 처치 || 없음 || 없음 || 하나 이상의 독립변인\n|-\n| 약점 || 변인 통제 불가, 사례 오도 || 원인·결과 명세 불가 || 일반화 한계, 주제에 따라 사용 불가, 윤리적 문제\n|}\n\n{warn}\nbank 함정: \"실험은 변인을 통제하지 않으므로 인과를 전혀 검증하지 못한다\"(✗ — 정반대). 실험의 약점을 물으면 '''일반화'''와 '''윤리'''다. 또 \"무선 '''표집'''만 했으면 인과를 확정할 수 있다\"(✗) — 인과의 열쇠는 처치·통제·무선 '''할당'''.\n{/warn}\n\n== 관련 문서 ==\n* [[무선 할당]] · [[가짜약 효과]] · [[이중 은폐]] · [[연구 방법 비교]] · [[상관]]\n* 윤리: [[기관 생명 윤리 위원회]] · [[고지된 동의]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.23, p.25"
 },
 "무선 할당": {
  "title": "무선 할당 (Random Assignment)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "연구 방법"
  ],
  "body": "'''무선 할당'''(Random Assignment)은 '''이미 모집한 참가자를 제비뽑기처럼 무작위로 실험 조건과 통제 조건에 나누는''' 기법이다. [[실험법]]이 인과를 말할 수 있게 해 주는 핵심 장치이고, [[무선 표집]]과의 혼동이 최대 함정이다.\n\n{def}\n'''설명''': 모집된 실험 참가자를 실험 조건과 통제 조건에 확률을 기반으로 무작위 할당하여 기존에 존재하던 개인차의 영향을 최소화하는 기법 (1장 p.23)\n'''명칭''': [[무선 할당]] (Random Assignment)\n{/def}\n\n{def}\n'''사례형 설명''': 연구자가 모집한 학생 60명에게 번호를 매기고 난수표로 30명은 새 학습법, 30명은 기존 학습법 집단에 배정했다. 원래 실력 좋은 학생이 한쪽에 몰리지 않게 하기 위해서다.\n'''명칭''': [[무선 할당]]\n{/def}\n\n[[img:L1-23.png|1장 p.23 — 참가자 → 무선 할당 → 새 토익 학습법(실험 조건) VS 기존 학습법(통제 조건). 슬라이드 본문의 \"무선 할당이\"는 빨간 글씨|medium]]\n\n{analogy}\n무선 할당은 '''운동회 청백전 팀 나누기를 제비뽑기로 하는 것'''이다. 반장이 팀을 고르면 친한 친구, 잘 뛰는 애들이 한쪽에 몰려서 이겨도 \"작전이 좋아서\"인지 \"애초에 잘하는 애들이라서\"인지 알 수 없다. 제비뽑기로 나누면 달리기 실력이 양 팀에 '''고르게''' 섞이니, 결과 차이는 작전(처치) 덕이라고 말할 수 있다.\n{/analogy}\n\n[[anim:experiment_design|동전 아이콘이 참가자를 세 조건으로 갈라 보내는 순간이 무선 할당이다 — 그 앞의 '모집단 → 표본'(무선 표집)과 구별할 것]]\n\n== 왜 필요한가 ==\n* 참가자들은 원래부터 실력·성격·체질이 다르다('''기존 개인차''').\n* 이 차이가 한 조건에 몰리면 결과 차이가 처치 때문인지 개인차 때문인지 알 수 없다.\n* 무작위로 나누면 개인차가 두 조건에 '''고르게''' 퍼져 서로 상쇄 → 남는 차이 = 처치의 효과.\n* 교수 예시(🎙 9/1 1:34:42): 원래 토익 점수가 높은 학생들이 우연히 한 집단에 몰리면 결과를 신뢰할 수 없다. (반대로 개인차 자체를 일부러 변수로 지정해 비교하는 연구도 있다.)\n\n== 무선 할당 vs 무선 표집 ⭐⭐⭐ ==\n{| class=\"table\"\n! 구분 || [[무선 표집]] || 무선 할당\n|-\n| 단계 || 참가자를 '''뽑을''' 때 || 뽑힌 참가자를 '''나눌''' 때\n|-\n| 방향 || 모집단 → 표본 || 표본 → 실험 조건 / 통제 조건\n|-\n| 목적 || '''대표성''' || '''개인차 영향 최소화'''\n|-\n| 지켜 주는 것 || 결과를 모집단에 일반화할 수 있음 || 결과를 처치의 '''인과'''로 해석할 수 있음\n|-\n| 슬라이드 || p.21 || p.23\n|}\n\n{quiz}\n무선 표집과 무선 할당에 대한 설명으로 옳은 것은? ① 무선 표집은 모집된 참가자를 실험·통제 조건에 무작위로 배정한다 ② 무선 할당은 모집단 구성원이 동등한 기회를 갖도록 뽑아 대표성을 높인다 ③ 표본 수가 충분히 크면 무선 표집 없이도 대표성이 보장된다 ④ 무선 할당은 개인차가 특정 조건에 몰리는 것을 막아 개인차의 영향을 최소화한다\n{/quiz}\n{answer}\n'''④'''. ①과 ②는 두 정의를 '''서로 바꿔 놓은''' 오답, ③은 \"표본은 크기보다 대표성\"(🎙 9/1 1:23:51)에 어긋난다. (bank ch1 MC, 1장 p.21·23)\n{/answer}\n\n== 관련 문서 ==\n* [[무선 표집]] · [[실험법]] · [[제3의 변인]] · [[이중 은폐]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.23"
 },
 "가짜약 효과": {

   "용어"
  ],
  "body": "'''가짜약 효과'''(Placebo Effect, 위약 효과)는 '''실제로는 아무 효과 없는 처치인데, 처치를 받았다고 믿는 것만으로 나타나는 효과'''다. 실험에서는 이 효과를 걸러 내기 위해 '''가짜약 조건'''을 둔다. 통합요약 1장 최우선 명칭 목록에 굵게 올라 있다.\n\n{def}\n'''설명''': 실제 처치가 아니라 처치를 받았다는 '인지(믿음)'에 의해 나타나는 효과. 디카페인 커피, 우울·불안으로 인한 청각적 환각 완화 등 일상생활에서 다양하게 보고됨 (1장 p.24)\n'''명칭''': [[가짜약 효과]] (Placebo Effect, 위약 효과)\n{/def}\n\n{def}\n'''사례형 설명''': 카페인이 없는 디카페인 커피를 \"일반 커피\"라고 듣고 마신 사람들이 정신이 맑아지고 각성되었다고 보고했다.\n'''명칭''': [[가짜약 효과]] (위약 효과)\n{/def}\n\n[[img:L1-24.png|1장 p.24 — 신약 투여(실험 조건) VS 위약 투여(가짜약 조건, Placebo) VS 투여 없음|medium]]\n\n{analogy}\n가짜약 효과는 '''엄마 손은 약손'''이다. 배를 문질러 주는 손에 약효 성분은 없는데 진짜로 덜 아프다. 그래서 신약이 진짜 효과가 있는지 알려면 \"엄마 손\"보다 나은지 비교해야 한다 — 그게 가짜약 조건이다.\n{/analogy}\n\n=== 가짜약 조건 ===\n{def}\n'''설명''': 의약 개발, 심리치료법 개발에 활용되는 실험 조건으로, 특정 요인에 대한 처치를 참가자가 받았다고 착각하게 만드는 조건 (1장 p.24)\n'''명칭''': [[가짜약 효과|가짜약 조건]] (Placebo 조건, 위약 조건)\n{/def}\n* 처치를 받았다는 '''‘인지’'''에 의한 효과인지 아니면 정말 '''‘처치’'''의 효과인지 비교할 수 있음.\n* 참가자뿐만 아니라 실험자도 어떤 집단이 가짜약 조건인지 모른다면 '''[[이중 은폐]] 절차(Double-blind)'''를 적용한 것.\n* 신경 조절 연구에서 이와 같은 조건을 사용 — 교수(🎙 9/1 1:36:38~): 경두개 교류 자극(tACS)의 가짜 자극을 직접 경험한 이야기.\n\n=== 위약 효과 ===\n\"가짜약 효과\"의 다른 이름. 슬라이드 p.24에도 \"디카페인 커피에 대한 '''위약 효과'''(Dawkins et al., 2011)\"로 나온다. 단답형에서는 둘 다 통한다고 보되, 조건 이름은 \"가짜약 조건\", 효과 이름은 \"가짜약 효과(위약 효과)\"로 구분해서 쓰자.\n\n== 세 조건 논리 (교수 설명) ==\n<pre class=\"ascii\">\n  ┌ 신약 투여   (실험 조건)    →  효과 = 처치 + 믿음\n  ├ 위약 투여   (가짜약 조건)  →  효과 = 믿음만          ← 가짜약 효과\n  └ 투여 없음   (통제 조건)    →  효과 = 0 (기준선)\n\n  신약 > 위약 > 무투여  이면  →  신약의 '''실제''' 효과가 있다 (신약 − 위약)\n  신약 ≈ 위약 > 무투여  이면  →  신약 효과는 사실상 '''믿음'''의 효과\n<\/pre>\n\n[[anim:experiment_design|세 상자(실험·가짜약·통제)의 결과 막대를 비교하며, 가짜약 막대가 0이 아닌 이유를 말해 볼 것]]\n\n== 일상 사례 (p.24) ==\n* 디카페인 커피에 대한 위약 효과(Dawkins et al., 2011).\n* 우울·불안으로 인한 청각적 환각을 완화시키는 연구에서 보고됨(Dolfus et al., 2016; Kirsch, 2010).\n* 4장 연결: 기대가 지각을 바꾼다 — 통증 지각도 [[지각 갖춤새]]의 영향을 받는다(4장 p.12).\n\n{warn}\nbank 함정: \"가짜약 조건은 참가자가 처치를 받지 '''않았음을 분명히 알려 주는''' 조건\"(✗ — 받았다고 '''착각'''하게 만든다), \"가짜약 효과는 실험실 안에서만 나타난다\"(✗ — 일상에서 다양하게 보고됨).\n{/warn}\n\n== 관련 문서 ==\n* [[이중 은폐]] · [[실험법]] · [[지각 갖춤새]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.24 (; 4장 p.12)"
 },
 "이중 은폐": {
  "title": "이중 은폐 절차 (Double-blind Procedure)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "연구 방법"
  ],
  "body": "'''이중 은폐 절차'''(Double-blind Procedure)는 '''참가자도, 실험자도 누가 진짜 처치를 받고 누가 가짜약을 받는지 모르게''' 하는 실험 절차다. 슬라이드 번역어는 '''\"이중 은폐\"'''이고, 교재·타 번역어 '''이중맹목'''은 다른 이름으로만 병기한다.\n\n{def}\n'''설명''': 참가자뿐만 아니라 실험자도 어떤 집단이 가짜약 조건인지 모르게 하는 절차 (1장 p.24)\n'''명칭''': [[이중 은폐]] (Double-blind, 이중 은폐 절차)\n{/def}\n\n{def}\n'''사례형 설명''': 신약 임상시험에서 약통에 번호만 붙여 두고, 환자에게 약을 건네는 간호사도 어떤 번호가 진짜 약이고 어떤 번호가 위약인지 모르게 했다.\n'''명칭''': [[이중 은폐]]\n{/def}\n\n[[img:L1-24.png|1장 p.24 — 신약 투여 VS 위약 투여(가짜약 조건) VS 투여 없음. 참가자와 실험자 모두 어느 조건인지 모르면 이중 은폐|medium]]\n\n{analogy}\n이중 은폐는 '''오디션 프로그램의 블라인드 심사'''다. 참가자에게 \"당신은 1차 합격 확정자\"라고 귀띔하면 자신감이 올라 더 잘 부르고(참가자 기대), 심사위원이 누가 유명 기획사 소속인지 알면 점수가 후해진다(실험자 기대). 그래서 '''양쪽 다''' 가린다. 한쪽만 가리면 다른 쪽의 기대가 결과에 스며든다.\n{/analogy}\n\n=== 이중맹목 ===\n\"이중 은폐\"의 다른 번역어(double-blind). 단답형 정답은 슬라이드 표기 '''이중 은폐'''로 쓰는 것이 안전하다.\n\n[[anim:experiment_design|마지막에 참가자와 실험자 '''모두''' 눈가리개를 쓰는 장면이 이중 은폐 — 한쪽만 가리면 무엇이 새어 나오는지 생각해 볼 것]]\n\n== 단일 vs 이중 ==\n{| class=\"table\"\n! 구분 || 아무도 모르지 않음 || 단일 은폐 || '''이중 은폐'''\n|-\n| 참가자 || 안다 || '''모른다''' || '''모른다'''\n|-\n| 실험자 || 안다 || 안다 || '''모른다'''\n|-\n| 막아 주는 것 || — || 참가자의 기대(가짜약 효과) || 참가자의 기대 + '''실험자의 기대'''(무의식적 단서·편향된 측정)\n|}\n\n== 가짜약 조건 vs 이중 은폐 ==\n{| class=\"table\"\n! 구분 || [[가짜약 효과|가짜약(위약) 조건]] || 이중 은폐\n|-\n| 정체 || 실험 '''조건'''(집단)의 하나 || 실험 '''절차'''(누가 아는가)\n|-\n| 핵심 || 처치를 받았다고 '''착각'''하게 만드는 조건 || 참가자와 실험자 '''모두''' 조건을 모름\n|}\n\n{quiz}\n\"참가자만 자신이 어느 조건인지 모르고 실험자는 아는 절차를 이중 은폐라고 한다.\" 옳은가?\n{/quiz}\n{answer}\n'''틀렸다.''' 참가자만 모르는 것은 '''단일''' 은폐다. 이중 은폐는 '''참가자뿐 아니라 실험자도''' 모르는 것. (bank ch1 MC 오답 ④, 1장 p.24)\n{/answer}\n\n== 관련 문서 ==\n* [[가짜약 효과]] · [[실험법]] · [[무선 할당]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.24"
 },
 "고지된 동의": {
  "title": "고지된 동의 (Informed Consent)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "용어"
  ],
  "body": "'''고지된 동의'''(Informed Consent)는 '''연구가 시작되기 전에, 참가자에게 연구에 대해 충분히 알려 주고 스스로 참여하겠다는 동의를 받는 것'''이다. 연구 윤리의 첫 관문이며, 실험이 끝난 뒤의 [[디브리핑]]과 짝을 이룬다.\n\n{def}\n'''설명''': 연구 시작 전, 참가자들로부터 받아야 하는 동의. 참가자는 연구로부터 발생할 수 있는 모든 불편함과 상해로부터 보호받아야 함 (1장 p.27)\n'''명칭''': [[고지된 동의]] (Informed Consent)\n{/def}\n\n{def}\n'''사례형 설명''': 실험에 앞서 연구자가 참가자에게 과제 내용, 소요 시간, 예상되는 불편, 언제든 그만둘 수 있다는 권리를 설명하고 서명을 받았다.\n'''명칭''': [[고지된 동의]]\n{/def}\n\n[[img:L1-26.png|1장 p.26 — 심리학의 인간 대상 연구(면담·설문조사·인지 과제)와 동물 대상 연구. 사람을 대상으로 하기에 윤리 지침이 필요하다|medium]]\n\n{analogy}\n고지된 동의는 '''놀이기구 탑승 전 안내판'''이다. \"키 140cm 이상, 심장 질환자 탑승 금지, 탑승 중 하차 버튼 있음\" — 무엇이 일어날지 '''미리 알려 주고''', 그래도 타겠다는 사람만 태운다. 그리고 타다가 무서우면 '''언제든 내릴 수 있어야''' 한다.\n{/analogy}\n\n== 슬라이드·수업 내용 (p.27) ==\n* 심리과학 연구는 인간을 대상으로 하기 때문에 윤리적 기준을 준수할 필요 있음.\n* 연구 시작 전, 참가자들로부터 '''고지된 동의(informed consent)'''를 받아야 하며, 연구로부터 발생할 수 있는 '''모든 불편함과 상해로부터 보호'''받아야 함.\n* 교수(🎙 9/1 1:53:30–1:56:08): 피로도 같은 사소한 불편도 포함된다. 참가자가 그만두고 싶다고 하면 '''이유 불문 즉시 중단'''해야 한다.\n\n<pre class=\"ascii\">\n  [[기관 생명 윤리 위원회|IRB]] 사전 승인 ──→ '''고지된 동의''' ──→ 실험 진행 ──→ [[디브리핑]]\n     (기관이 허락)        (참가자가 허락)     (중단 요구 시      (끝난 뒤\n                                              즉시 중단)          상세 설명)\n<\/pre>\n\n{warn}\nbank 오답(옳지 않은 것): \"참가자가 피로 때문에 그만두고 싶다고 해도 자료 확보를 위해 실험은 끝까지 마쳐야 한다\" — '''✗'''. 교수 강조: 이유를 불문하고 중단.\n{/warn}\n\n== 고지된 동의 vs 디브리핑 ==\n{| class=\"table\"\n! 구분 || 고지된 동의 || [[디브리핑]]\n|-\n| 시점 || 연구 '''시작 전''' || 실험 '''종료 후'''\n|-\n| 내용 || 무엇을 할지 알리고 동의 받기 || 실험에 대한 상세한 설명 (기만이 있었다면 그 이유 포함)\n|-\n| 원어 || informed consent || debriefing\n|}\n\n== 관련 문서 ==\n* [[디브리핑]] · [[기관 생명 윤리 위원회]] · [[실험법]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.27 (p.26)"
 },
 "디브리핑": {
  "title": "디브리핑 (Debriefing)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "용어"
  ],
  "body": "'''디브리핑'''(Debriefing)은 '''실험이 끝난 뒤 참가자에게 그 실험이 무엇이었는지 상세히 설명해 주는 것'''이다. 특히 실험 목적을 숨기려고 참가자를 속였다면(기만) 반드시 해야 한다. [[고지된 동의]]의 \"끝맺음\"이다.\n\n{def}\n'''설명''': 실험 종료 후 참가자에게 실험에 대한 상세한 설명을 전달하는 것 (1장 p.27)\n'''명칭''': [[디브리핑]] (Debriefing)\n{/def}\n\n{def}\n'''사례형 설명''': 사회적 동조 실험이 끝난 뒤, 연구자가 참가자에게 \"앞에 답한 사람들은 사실 실험 협조자였고, 다수의 오답에 얼마나 따라가는지를 보려는 실험이었다\"고 설명하고 질문에 답해 주었다.\n'''명칭''': [[디브리핑]]\n{/def}\n\n{analogy}\n디브리핑은 '''몰래카메라의 \"몰래카메라였습니다!\" 순간'''이다. 속인 채로 그냥 보내면 그건 그냥 사기다. 끝나고 나서 무엇을 왜 했는지 밝히고, 놀란 마음을 풀어 주고, 원하면 촬영본을 지워 주는 데까지가 한 세트다.\n{/analogy}\n\n== 슬라이드·수업 내용 (p.27) ==\n* 참가자 개인 정보는 '''비밀'''에 붙여야 하며, 실험 종료 후 실험에 대한 '''상세한 설명(debriefing)'''을 전달할 필요가 있음.\n* 교수(🎙 9/1 1:53:30–1:56:08): 연구 의도를 숨기기 위해 '''기만'''(속임)을 사용했다면 끝난 후 반드시 디브리핑을 해야 한다.\n* p.27은 글자만 있는 슬라이드라 캡처 대신 아래 흐름도로 정리한다.\n\n<pre class=\"ascii\">\n  연구 전                 연구 중                    연구 후\n  ───────────────         ─────────────────          ─────────────────────\n  [[기관 생명 윤리 위원회|IRB]] 승인              불편·상해로부터 보호        '''디브리핑'''\n  [[고지된 동의]]             중단 요구 → 즉시 중단       (실험 목적·기만 설명)\n                          개인 정보 비밀 보장         개인 정보 계속 비밀\n<\/pre>\n\n== 헷갈리는 짝 ==\n{| class=\"table\"\n! 구분 || [[고지된 동의]] || 디브리핑\n|-\n| 시점 || 시작 '''전''' || 종료 '''후'''\n|-\n| 방향 || 참가자 → 연구자 (동의) || 연구자 → 참가자 (설명)\n|-\n| 키워드 || informed consent || debriefing, 기만 후 필수\n|}\n\n{warn}\n\"디브리핑은 연구 시작 전에 연구 목적을 설명하는 절차\"라는 보기는 ✗ — 그건 [[고지된 동의]]다. 기만이 들어간 실험은 시작 전에 진짜 목적을 다 말할 수 없으므로, 끝난 뒤의 디브리핑이 더 중요해진다.\n{/warn}\n\n== 관련 문서 ==\n* [[고지된 동의]] · [[기관 생명 윤리 위원회]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.27"
 },
 "기관 생명 윤리 위원회": {
  "title": "기관 생명 윤리 위원회 (Institutional Review Board, IRB)",
  "category": [
   "1장 심리과학을 비판적으로 생각하기",
   "용어"
  ],
  "body": "'''기관 생명 윤리 위원회'''(Institutional Review Board, '''IRB''')는 '''대학 등 연구 기관에서 사람이나 동물을 대상으로 하는 연구가 윤리적으로 괜찮은지 미리 심사하고 승인하는 기구'''다. 1장 시험 범위의 마지막(p.26–29)이고, bank 단답형 정답이다. 이 문서는 연구 윤리 전반(뉘른베르크 강령·헬싱키 선언·벨몬트 보고서)도 함께 담는다.\n\n{def}\n'''설명''': 대학 등의 연구 기관에서 인간 및 동물 대상 연구를 수행할 시, 그 윤리적 적합성을 검토하는 기구. 각 연구 기관에 배치되어 사전 연구 승인을 담당 (1장 p.27)\n'''명칭''': [[기관 생명 윤리 위원회]] (Institutional Review Board, IRB)\n{/def}\n\n{def}\n'''사례형 설명''': 이곳의 승인을 받기 전에 참가자를 모집하거나 실험을 진행하면 중대한 위반이 된다. 약칭은 영문 세 글자이다.\n'''명칭''': [[기관 생명 윤리 위원회]] (IRB)\n{/def}\n\n[[img:L1-28.png|1장 p.28 — 기관 생명 윤리 위원회(IRB) 연구 승인 절차: ① 연구 계획서 등 서류 제출 → ② 양식 검토 및 1차 수정 → ③ 본 심의 → ④ 2차 심의 → ⑤ 승인 결과 통보|medium]]\n\n{analogy}\nIRB는 '''건축 허가를 내주는 구청'''이다. 내 땅이라도 허가 없이 건물을 올리면 불법이고, 허가받은 설계도와 다르게 한 층을 더 올려도 불법이다. IRB도 똑같이 \"몇 명을, 무슨 근거로, 얼마를 주고, 어떤 위험이 있는지\"를 미리 심사하고, '''승인받은 인원을 넘겨 모집하면''' 위반이다. 증축하려면 다시 허가(변경 심의)를 받아야 한다.\n{/analogy}\n\n=== 연구 윤리 ===\n{def}\n'''설명''': 심리학은 인간 심리 기제 연구를 위해 인간과 동물을 대상으로 다양한 실험을 집행하므로, 세계 각국이 마련한 동물 및 인간 대상 윤리 지침을 준수해야 함 (1장 p.26)\n'''명칭''': [[기관 생명 윤리 위원회|연구 윤리]]\n{/def}\n[[img:L1-26.png|1장 p.26 — 심리학의 인간 대상 연구(면담·설문조사·인지 과제)와 동물 대상 연구(학습 행동·생리적 반응·행동 분석)|small]]\n* p.26 예시: 쥐를 활용한 '''[[편도체]] 실험''', '''뇌 손상 환자 연구''', 정상인 대상 사회적 상황에서의 의사결정 탐구 등.\n* p.27 연구 윤리 준수의 필요성: [[고지된 동의]] → 불편함·상해로부터 보호 → 개인 정보 비밀 → [[디브리핑]] → '''IRB 사전 연구 승인'''.\n\n=== 뉘른베르크 강령 · 헬싱키 선언 · 벨몬트 보고서 ===\n{def}\n'''설명''': 세계 각국이 동물 및 인간 대상 연구 윤리 지침을 마련할 때 따르는 취지가 된 세 문서 (1장 p.26)\n'''명칭''': [[기관 생명 윤리 위원회|뉘른베르크 강령, 헬싱키 선언, 벨몬트 보고서]]\n{/def}\n{| class=\"table\"\n! 문서 || 계기 (🎙 9/1 1:50:29–1:53:30)\n|-\n| 뉘른베르크 강령 || 나치 독일의 인체 실험·T4 프로그램(장애인 말살)\n|-\n| 헬싱키 선언 || 같은 맥락(전쟁 중 인체 실험; 교수는 일본 731부대도 언급)\n|-\n| 벨몬트 보고서 || '''1970년대''' 미국 '''터스키기 매독 실험''' — 매독 환자에게 알리지 않고 치료 없이 방치\n|}\n\n== IRB 주요 심의 내용 (p.28–29) ==\n{| class=\"table\"\n! # || 심의 항목 || 구체적 요구 || 슬라이드\n|-\n| 1 || 연구 내용 및 실험 방법 || 참가자가 수행할 과제의 상세 내용, 실험 도구, 데이터 분석안 등 || p.28\n|-\n| 2 || '''모집 표본 수(참가자 인원 수)''' || 모집할 인원 수와 그 근거 제시 — '''매우 객관적인 근거'''를 요구. '''승인받은 인원 수를 초과하여 모집하면 안 됨'''(증원 필요 시 반드시 변경 심의) || p.28 (빨간 글씨)\n|-\n| 3 || 참가자 보상 || 보상으로 받게 될 '''구체적인 금액 및 재원''' || p.29\n|-\n| 4 || 개인 정보 수집 범위 및 보호 방안 || 참가자 식별·논문 보고를 위한 정보 외의 나머지 정보는 '''수집 금지''', 구체적 보호 방안 요구 || p.29\n|-\n| 5 || 위험 요소 || 실험 참가 시 참가자에게 발생할 수 있는 위험 요소 || p.29\n|}\n\n{exam}\n교수(🎙 9/1 1:56:08–2:01:20): 「IRB의 '''승인 전에 참가자를 모집하거나 실험을 진행하면 연구 윤리 위반'''」. IRB는 보건복지부의 감독을 받는다. 붉은 글씨 항목 = IRB가 굉장히 중시하는 것 — '''모집 인원수와 그 객관적 근거'''(선행 논문, 통계 검정력 계산 프로그램 결과), 그리고 '''참가자 보상의 재원'''(실제로 지출할 예산·과제가 있는지 철저히 확인). 동의서를 전부 스캔해 제출하므로 초과 모집은 바로 드러난다.\n{/exam}\n\n{quiz}\n연구 승인 심의 절차에 대한 설명으로 옳은 것은? ① 승인 결과를 기다리는 동안 참가자를 미리 모집해 두면 권장된다 ② 모집 인원은 객관적 근거와 함께 제시해야 하며, 승인 인원을 초과하려면 변경 심의를 받아야 한다 ③ 보상은 재원과 무관하게 금액만 기재하면 된다 ④ 식별 정보 외에도 가능한 한 많은 개인 정보를 수집하도록 요구한다\n{/quiz}\n{answer}\n'''②'''. ① 승인 전 모집은 '''위반''', ③ 재원·예산 편성 여부를 철저히 확인, ④ 식별·논문 보고에 필요한 정보 외 수집은 '''금지'''. (bank ch1 MC, 1장 p.28–29)\n{/answer}\n\n{joke}\n시험지에 \"약칭은 영문 세 글자이다\"라는 힌트가 붙어 나온다면, IRB 대신 'IBM'이나 'BTS'를 쓰지 않도록 주의하자. 정식 명칭 \"기관 생명 윤리 위원회\"까지 쓰면 가장 안전하다.\n{/joke}\n\n== 관련 문서 ==\n* [[고지된 동의]] · [[디브리핑]] · [[실험법]](윤리적으로 처치할 수 없는 변인이 실험의 약점)\n* 다른 장의 연구 윤리 맥락: 2장 [[편도체]] · 2장 [[손상법]]\n* [[1장 심리과학을 비판적으로 생각하기]]\n\n근거: 1장 p.26–29"
 },
 "2장 마음의 생물학과 의식": {
  "title": "2장. 마음의 생물학과 의식",
  "category": [
   "2장 마음의 생물학과 의식",
   "메인"
  ],
  "body": "'''2장 마음의 생물학과 의식'''은 \"마음은 몸의 '''어디에서''', '''어떤 물리적 과정'''으로 일어나는가?\"를 묻는 장이다. 슬라이드 38장이 ① 뉴런의 전기·화학 신호(신경 소통) → ② [[신경계]]의 구성 → ③ 뇌를 들여다보는 연구 기법(손상법~DSI) → ④ 뇌의 세부 구조(뇌간~대뇌 피질) → ⑤ [[분할 뇌]] → ⑥ 의식([[선택적 주의]], [[이중 처리]]) → ⑦ [[수면과 꿈]] 순서로 흘러간다. 9/8 수업(1부 62분 + 2부 63분)에서 한 번에 끝냈다.\n\n이 장은 '''명칭 폭탄'''이다. 서막·1장이 \"생각하는 법\"이었다면 2장은 뇌 부위·물질·기법 이름이 50개 넘게 쏟아진다. 단답형이 \"명칭 쓰기\"로만 나오므로, 이 위키는 각 이름마다 사전 문서를 따로 두고 '''설명 → 명칭''' 방향의 정의 박스를 달았다. 이 문서는 지도 역할을 한다 — 전체 흐름을 잡고, 각 절에서 사전 문서로 뛰어가면 된다.\n\n{info}\n페이지 번호 = '''인쇄 슬라이드 번호''' (숨김 슬라이드 없음, 총 38쪽). 글자가 거의 없는 그림 슬라이드는 p.16(뇌파 실험실 사진)·p.20(해상도 비교 도식)·p.25(뇌 구조 종합 그림 — 구조 이름·기능 라벨만 있는 종합 그림, 텍스트 레이어 없음)이다. 9/8 녹음은 '''전문이 아니라 Clova AI 요약 메모만''' 남아 있어서, 🎙 표시는 그 요약 메모 기준이다.\n{/info}\n\n{analogy}\n2장 전체를 '''회사'''로 비유하면 이렇다. [[뉴런]]은 사원 한 명, [[활동 전위]]는 사원이 사내 전화로 거는 \"삐—\" 신호(크기는 늘 같고, 급하면 '''자주''' 건다), [[신경전달물질]]은 옆 부서에 넘기는 서류 봉투다. [[신경계]]는 본사(중추)와 지점망(말초)이고, [[시상]]은 모든 우편물이 거쳐 가는 우편실(단, 냄새 나는 택배=후각만 직배송), [[변연계]]는 감정·욕구 담당 부서, [[대뇌 피질]]은 임원 층, [[연합 영역]]은 겉으로 아무것도 출력하지 않지만 회사가 돌아가게 만드는 기획실이다. 연구 기법들(EEG, fMRI…)은 이 회사를 '''밖에서 감시하는 CCTV 종류''' — 어떤 건 \"언제\" 일했는지 초 단위로 찍고(시간 해상도), 어떤 건 \"어느 책상\"에서 일했는지 정밀하게 찍는다(공간 해상도).\n{/analogy}\n\n[[anim:brain_regions|먼저 이 그림으로 뇌 구조의 \"층\"을 훑어보고 → 아래 p.21–28 절에서 각 구조의 사전 문서로 들어가라]]\n\n== 0. 이 장이 다른 장과 이어지는 곳 ==\n\n{| class=\"table\"\n! 2장에서 배운 것 || 다시 쓰이는 곳\n|-\n| [[인지신경과학]]의 연구 기법(EEG·fMRI…) || 서막 p.15 \"뇌전도·뇌영상·신경 조절로 연구\" 의 실체가 바로 이 장 p.12–20\n|-\n| [[생물심리사회적 접근법]] || 🎙 p.28 연합 영역을 설명하며 \"행동은 여러 기제가 조합된 최종 결과물\" 이라고 서막 개념을 다시 꺼냄\n|-\n| [[신경 가소성]] || 5장 p.2 \"학습에 따른 두뇌의 변화\" — 학습 = 신경 회로가 바뀌는 것\n|-\n| [[역치]] || 4장 p.4 [[절대 역치]] — 같은 \"역치\"라는 말이 뉴런 수준과 감각 수준에서 다른 뜻으로 쓰인다\n|-\n| [[분할 뇌]]·[[뇌량]] || 4장 p.25 분할 시야 (⚠ 4장 슬라이드에 좌우 오기가 있음 → [[분할 뇌]] 문서)\n|-\n| [[연합 영역]]의 FFA || 4장 p.26 [[방추상 얼굴 영역]] · [[자질 탐지기]]\n|-\n| [[이중 처리]]의 병렬 처리 || 4장 p.27 [[병렬 처리]], 6장 p.11 [[자동 처리와 통제 처리]]\n|-\n| [[해마]] || 6장 p.27 [[외현 기억]]·[[기억 응고화]], p.33 [[기억상실증]](환자 H.M)\n|-\n| [[소뇌]] || 6장 p.28 [[암묵 기억]](파블로프 조건 형성 담당)\n|-\n| [[편도체]] || 6장 p.29 [[섬광 기억]](정서 관련 기억)\n|-\n| [[칵테일 파티 효과]] || 6장 p.25 [[자기참조 효과]] — \"자신과 관련된 정보에 주의 집중\"\n|-\n| [[수면과 꿈]]의 기억 공고화 || 6장 p.22·p.27 [[기억 응고화]], p.37 [[역행 간섭]](수면 집단)\n|}\n\n== p.2–3 — '머리'에 대한 접근: 골상학과 기능의 국재화 ⭐ ==\n\n[[img:L2-02.png|p.2 골상학 지도 — 두개골 돌출부마다 능력·성격 이름을 붙였다|medium]]\n\n=== 골상학 ===\n인간의 심리가 머리와 관련 있다는 생각은 고대부터 있었다. 근대에 이 생각을 가장 요란하게 밀어붙인 것이 '''프란츠 갈(Franz Gall)의 골상학(phrenology)'''이다.\n\n{def}\n'''설명''': 두개골의 돌출부가 심적 능력과 성격 특질과 연관이 있다고 가정한 접근. 한때 영국에서 매우 유행했다 (2장 p.2)\n'''명칭''': 골상학 (Phrenology) — 프란츠 갈\n{/def}\n\n골상학 자체는 과학적으로 틀렸다(머리뼈 혹은 성격과 상관없다). 그런데 슬라이드는 \"'''특이하게 기능 국재화를 가정한 점은 현대 인지신경과학과 유사'''\"하다고 짚는다. 🎙 교수도 \"뇌를 중심으로 찾아보려는 접근은 최근의 인식이 아니다\"라고 하며 이 장을 시작했다(9/8 1부 00:11).\n\n{joke}\n골상학 지도에는 \"자비심\", \"희망\", \"탐욕\" 같은 칸이 머리 위에 그려져 있다. 머리를 만져 보고 성격을 맞힌다는 발상이라, 당시엔 '''두상 감정 가게'''까지 성업했다. 21세기 버전은 MBTI 정도?\n{/joke}\n\n=== 기능의 국재화 ===\n[[img:L2-03.png|p.3 각 대뇌 영역별 기능 — 운동·시각·언어·감정 등이 영역마다 나뉘어 있다|medium]]\n\n{def}\n'''설명''': 각 두뇌 영역이 특정 기능을 담당하는 것. 여러 두뇌 영역 간의 상호작용을 통해 처리된 정보를 통합한다 (2장 p.3)\n'''명칭''': 기능의 국재화 (Localization of Function)\n{/def}\n\n* 인간의 심리는 생물적 기제, 특히 '''뇌의 활동'''과 밀접하다. 대뇌의 각 영역이 외부 정보를 인지·처리해 반응을 산출한다.\n* 정보는 대뇌를 구성하는 [[뉴런]]의 '''전기적 + 화학적 신호'''로 전달된다.\n* 🎙 \"사람의 마음은 어느 한 곳이 단독으로 작동해서 나오는 결과물이 아니라 '''조별 과제의 합산 결과물'''\" (9/8 1부 09:26).\n\n{warn}\n'''국재화 ≠ 한 부위가 혼자 다 한다.''' 슬라이드 문장 후반부 \"여러 두뇌 영역 간의 상호작용을 통해 통합\"까지가 정의다. \"각 기능은 한 영역만 단독으로 수행한다\" 같은 보기는 함정.\n{/warn}\n\n== p.4 — 신경 가소성 ⭐⭐ ==\n\n[[img:L2-04.png|p.4 신경 가소성의 특징 — 경험 전(연결 약함) → 반복 → 경험 후(연결 강화·새 회로)|medium]]\n\n대뇌 신경망은 '''경험을 통해 적응하고 구축'''된다. 이게 [[신경 가소성]](Neuroplasticity)이다. 대표 증거는 '''영국 택시 운전사 vs 버스 운전사''' — 택시 운전사의 [[해마]]가 더 크다(Maguire et al., 2006). 훈련에 따라 감각 영역도 변한다(Brodt et al., 2018).\n\n{exam}\n'''bank 단답형 정답''': 택시 운전사 해마 사례를 주고 \"이 능력의 명칭은?\" → '''신경 가소성'''. 통합요약 §0-1 2장 최우선 명칭에도 굵게 올라 있다.\n{/exam}\n\n== p.5 — 뉴런 ==\n\n[[img:L2-05.png|p.5 뉴런의 구조 — 수상돌기·세포체·축색·수초·축색 종말, 아래는 신경망 사진|medium]]\n\n[[뉴런]]은 신경정보 시스템의 근간을 이루는 세포다. 새로 생성되거나 사라질 수 있고, 정보의 수용·전달을 맡는다. 핵심 한 줄: '''뉴런 안에서는 전기, 뉴런 사이에서는 화학.'''\n\n{| class=\"table\"\n! 부위 || 역할 (🎙 9/8 1부 14:00)\n|-\n| 수상돌기 || 다른 세포로부터 정보를 받아들임 (수신기)\n|-\n| 세포체 || 세포의 생명 유지 중추\n|-\n| 축색 || 전기적 신호가 이동하는 경로\n|-\n| 수초 || 축색을 감싸 전달 효율(속도)을 유지 — 손상되면 '''다발성 경화증'''\n|-\n| 축색 종말 || 신호를 발신, 다른 세포와 연결망 형성\n|}\n\n== p.6–7 — 활동 전위와 실무율 ⭐⭐⭐ ==\n\n[[img:L2-06.png|p.6 활동 전위 발생 과정 — 나트륨 이온 유입(탈분극화) → 역치 −55mV 돌파 → 스파이크 → 불응기|large]]\n\n[[활동 전위]](Action Potential)는 감각 혹은 이웃 뉴런의 화학 신호에 의해 발생하는 '''뉴런 내 전기적 신호'''다. 과정은 다섯 단어로 외운다.\n\n<pre class=\"ascii\">\n [[활동 전위|안정 전위]]  ──▶  [[활동 전위|탈분극화]]  ──▶  [[역치]] 돌파  ──▶  활동 전위(스파이크)  ──▶  [[활동 전위|불응기]]\n 외부 + / 내부 −      양전하 유입,          최소 강도         크기는 늘 같다          안정 전위로 돌아가기\n                     전하 차이 사라짐        넘으면 발화       ([[실무율]])             전까지 재발화 불가\n<\/pre>\n\n* '''[[실무율]](All or None)''': 역치를 넘으면 완전히 발생, 못 넘으면 전혀 발생하지 않는다. 그래서 '''활동 전위의 크기는 동일'''하다.\n* 그럼 강한 자극과 약한 자극은 어떻게 구별하나? → p.7: '''자극이 강할수록 활동 전위의 발화율(빈도)이 상승'''한다. 뇌는 발화 횟수로 강도를 표상한다.\n* 슬라이드 덤: 활동 전위 연구는 '''인공 신경망''' 구축 연구의 발전으로 이어졌다.\n\n{exam}\n교수 강조(🎙 9/8 1부 23:38): \"활동 전위가 발생하면 전위 값은 '''일정하게 항상 유지'''된다. 뇌는 뉴런의 '''발화 횟수'''로 입력된 자극을 더 강하다/약하다로 표시한다.\" → 통합요약 §0-1 2장 교수 강조 1번. 객관식 단골 함정: \"자극이 강할수록 활동 전위의 '''크기'''가 커진다\" ✗.\n{/exam}\n\n[[anim:neuron_firing|자극 → 역치 → 같은 크기의 펄스가 축색을 달림 → 강한 자극이면 펄스가 촘촘해지는 것을 본 다음, 아래 시뮬레이터로 강도를 직접 올려 보라]]\n\n[[sim:action_potential]]\n\n== p.8–9 — 신경전달물질과 재흡수 ⭐⭐⭐ ==\n\n[[img:L2-08.png|p.8 신경전달물질 발생 과정 — 축색 종말에서 방출 → 시냅스 틈 → 수용기 결합 → 재흡수|medium]]\n\n[[신경전달물질]](Neurotransmitter)은 뉴런 사이의 [[신경전달물질|시냅스]]에서 작용하는 화학 물질이다. 활동 전위가 축색 종말에 도착하면 방출되고, 이웃 뉴런의 수용 돌기로 들어가 신호를 전달한다. 수용력 이상의 과도한 물질은 [[재흡수]](reuptake)되어 방출한 뉴런으로 되돌아간다. 🎙 세로토닌 재흡수를 방해하면 시냅스에 머무는 양이 늘어 '''우울 증상이 완화'''된다(9/8 1부 28:00).\n\n[[img:L2-09.png|p.9 주요 신경전달물질 7종의 기능과 오기능 표|large]]\n\n{| class=\"table\"\n! 물질 || 기능 || 오기능 (시험 포인트)\n|-\n| [[신경전달물질|아세틸콜린(ACh)]] || 근육 운동, 학습, 기억 || 알츠하이머 → ACh 생성 뉴런 퇴화\n|-\n| '''[[도파민]]''' || 움직임, 학습, 주의, 정서 || '''과잉 → 조현병''', '''부족 → 파킨슨병'''(떨림·동작 감소)\n|-\n| '''[[세로토닌]]''' || 기분, 배고픔, 수면, 각성 || '''부족 → 우울증'''\n|-\n| [[신경전달물질|노르에피네프린]] || 각성의 제어 || 부족 → 기분 저하\n|-\n| [[신경전달물질|글루타메이트]] || 기억에 관여하는 1차 '''흥분성''' 전달 물질 || 과잉 → 편두통·경련\n|-\n| [[신경전달물질|GABA]] || 대표적 '''억제성''' 전달 물질 || 부족 → 경련, 떨림, 불면증\n|-\n| [[신경전달물질|엔도르핀]] || 통증 및 쾌감의 지각 || 마약 복용이 자연적 엔도르핀 공급을 방해\n|}\n\n== p.10–11 — 신경계 ⭐⭐⭐ ==\n\n[[img:L2-10.png|p.10 신경계의 구성 종류 — 신경계 → 말초(자율: 교감·부교감 / 체신경) · 중추(뇌·척수)|medium]]\n\n[[신경계]]의 큰 그림은 트리 하나로 끝난다.\n\n<pre class=\"ascii\">\n신경계\n├─ [[신경계|중추 신경계]] : 신체의 전반적인 의사결정\n│    ├─ 두뇌 : 학습 등 고차원 기능\n│    └─ 척수 : 말초 신경계와 두뇌의 연결, '''반사(reflex)'''\n└─ [[신경계|말초 신경계]] : 정보 수집 + 중추 신경계의 신호 전달\n     ├─ [[신경계|체신경계]]   : 감각 수용 + '''골격근'''의 자발적 제어\n     └─ [[신경계|자율 신경계]] : '''분비선과 내장 근육'''의 제어\n          ├─ 교감 신경  → 각성\n          └─ 부교감 신경 → 이완\n<\/pre>\n\n[[img:L2-11.png|p.11 반사 반응의 작동 과정 — 촛불에 손 → 감각 뉴런 → 척수의 간뉴런 → 운동 뉴런 → 손을 뗌|medium]]\n\n뉴런의 세 유형(p.11): '''감각 뉴런'''(수용기 → 중추), '''운동 뉴런'''(중추 → 근육·내분비선), '''간뉴런'''(감각 입력과 운동 출력 사이의 소통). 반사는 척수에서 끝나기 때문에 뜨겁다고 '''느끼기 전에''' 손이 먼저 떨어진다.\n\n{warn}\nbank 함정: \"'''체신경계'''는 분비선과 내장 근육의 제어를 담당한다\" ✗ → 그건 '''자율''' 신경계. 체신경계는 골격근(내 맘대로 움직이는 근육).\n{/warn}\n\n== p.12–20 — 두뇌를 탐구하는 방법 (뇌 연구 기법) ⭐⭐⭐ ==\n\n🎙 교수는 뇌 연구를 두 갈래로 나눴다: 심리 기제가 '''어떤 순서·단계로''' 작동하는지 보는 '''시간적 접근'''과, '''어느 영역이''' 일했는지 보는 '''공간적 접근'''(9/8 1부 40:19). 그리고 2부 첫머리에서 \"뇌 영상 기법은 크게 시간적 해상도와 공간적 해상도에 따라 분류해 볼 수 있다\"고 정리했다. 그 결론이 p.20 그림이다.\n\n=== p.12 — 손상법 ===\n[[img:L2-12.png|p.12 손상법 — 뇌의 손상을 통한 증상의 탐구|small]]\n\n[[손상법]](Lesion): 뇌 기능을 탐구하기 위한 '''초기 연구법'''. 특정 영역·뉴런을 손상시켜 기능 변화를 본다(침습적, 동물 대상 — 쥐의 시상하부 제거). 이후 일시적으로 기능을 방해하는 '''비침습적''' 기법으로 발전.\n\n{exam}\n교수 강조(🎙 9/8 1부 32:22): \"손상법은 '''가장 초기'''에 사용했던 방법이고, 상당히 '''인과적인 설명'''을 내놓을 수 있는 방법.\" (통합요약 §0-1)\n{/exam}\n\n=== p.13 — 뇌전도(EEG)와 뇌자도(MEG) ===\n[[img:L2-13.png|p.13 EEG와 MEG 촬영 — 두피 전극(EEG) vs 자기장 측정 헬멧(MEG)|medium]]\n\n* [[뇌전도]](Electroencephalogram, EEG): 뉴런의 전기 신호를 증폭해 측정. '''시간 해상도 높음, 공간 해상도 낮음'''.\n* [[뇌전도|뇌자도]](MEG): 뇌 전기 신호가 만든 '''자기장'''을 측정. 시간 해상도 높고 공간 해상도도 '''상당히 높은 편'''. 🎙 코일 형태로 자기장을 형성해 측정, 뇌 심부 좌표까지 추적, 매우 비싸다.\n\n=== p.14–16 — (번외) 사건 관련 전위(ERP) ===\n[[img:L2-14.png|p.14 ERP 예시 (Kim et al., 2026) — 전극 배치도와 자극 제시 시점(0ms) 기준 평균 파형, P200·N400 구간|large]]\n\n[[사건 관련 전위]](Event-Related Potential, ERP): 특정 자극·사건으로 촉발되는 '''두피 전위 변화의 평균량'''. 자극 시점을 기준으로 반복 측정한 뇌파를 평균한다. 특정 시점의 ERP 성분을 '''컴포넌트'''라 하며, '''N400 = 의미 정보 처리 / P600 = 문법 정보 처리'''. 밀리초 단위 추적 → 시간 해상도 매우 우수, 공간 해상도는 저조(p.15 \"왜?\").\n\n[[img:L2-16.png|p.16 뇌파의 측정 — 실제 사례: 차폐실 안 피험자·모니터·증폭기, 밖에 실험 제시용·뇌파 기록용 컴퓨터 2대|medium]]\n\n🎙 p.16 실험실 사진은 교수가 후배에게 받아 넣은 것이다. 뇌파는 외부 전자기파에 민감해서 '''차폐 격벽'''을 세우고, 컴퓨터 두 대를 케이블로 동기화한다. \"참가비를 주니 단가 보고 지원해 보는 것도 나쁘지 않다 — 2시간 가만히 앉아 있어야 하지만\"(1부 55:54).\n\n=== p.17 — PET ===\n[[img:L2-17.png|p.17 PET 촬영 과정|small]]\n\n{def}\n'''설명''': 방사성 동위원소가 섞인 포도당을 주사해 뇌 혈관에서 포도당이 집중되는 양상을 추적하고, 특정 과제 수행 중 방사성 원소가 방출하는 감마선을 탐지해 촬영하는 기법(핫스팟 탐지) (2장 p.17)\n'''명칭''': 양전자 방출 단층촬영법 (Positron Emission Tomography, PET)\n{/def}\n\n=== p.18 — MRI와 fMRI ===\n[[img:L2-18.png|p.18 MRI로 촬영한 정상인과 조현병 환자 뇌 — 화살표는 확장된 뇌실|medium]]\n\n* [[fMRI|MRI]]: 강한 자기장을 쬐어 원자가 재정렬할 때의 신호로 '''구조'''를 촬영. MRI만으로는 신경 활동 관찰이 어렵다.\n* [[fMRI]]: 혈중 산소 농도(BOLD) 신호를 추적해 '''기능적 활동'''을 촬영. '''매우 높은 공간 해상도'''.\n\n=== p.19 — 확산 스펙트럼 영상(DSI) ===\n[[img:L2-19.png|p.19 DSI로 촬영한 신경 섬유 연결 지도|small]]\n\n[[확산 스펙트럼 영상]](Diffusion Spectrum Imaging, DSI): fMRI가 '''회질'''의 BOLD를 본다면, DSI는 '''백질''' 신경 섬유의 물 분자 확산으로 '''연결 구조(신경 통로 지도)'''를 촬영한다. 🎙 메모 \"확산 스펙트럼 / 확산 텐서\".\n\n=== p.20 — 시간·공간 해상도 비교 (뇌 연구 기법 비교표) ===\n[[img:L2-20.png|p.20 뇌 영상·신호 측정 기법의 시간적·공간적 해상도 비교 — fMRI/PET 좌상, MEG 우상, EEG/ERP 우하|large]]\n\n{| class=\"table\"\n! 기법 || 무엇을 재나 || 시간 해상도 || 공간 해상도 || 한 줄 특징\n|-\n| [[손상법]] || 손상 후 기능 변화 || — || — || 가장 오래됨, '''인과 추론''' 가능, 침습적\n|-\n| [[뇌전도|EEG]] || 두피 '''전기''' 신호(증폭) || '''높음''' || 낮음 || 언제(when)에 강함\n|-\n| [[사건 관련 전위|ERP]] || 자극 시점 기준 전위 '''평균''' || '''매우 높음'''(ms) || 낮음 || N400 의미 / P600 문법\n|-\n| [[뇌전도|MEG]] || 전기 신호가 만든 '''자기장''' || 높음 || '''상당히 높음''' || 둘 다 좋음, 비쌈\n|-\n| PET || 방사성 포도당 → 감마선 || 낮음 || 높음 || 핫스팟 탐지\n|-\n| [[fMRI|MRI]] || 자기장 속 원자 재정렬 신호 || — || 높음 || '''구조'''만, 활동 관찰 어려움\n|-\n| [[fMRI]] || '''BOLD'''(혈중 산소) || 낮음 || '''매우 높음''' || 어디(where)에 강함, 회질\n|-\n| [[확산 스펙트럼 영상|DSI]] || '''백질''' 물 분자 확산 || — || — || 신경 통로(연결) 지도\n|}\n\n{exam}\n교수 강조(🎙 9/8 1부 40:19–46:00): \"'''EEG·ERP는 시간적 흐름을 찾아가는 방법 — 시간 해상도가 높다'''.\" p.20 그림의 사분면 위치(fMRI/PET 좌상 · MEG 우상 · EEG/ERP 우하)를 그대로 그릴 수 있으면 객관식 매칭은 다 맞힌다.\n{/exam}\n\n{quiz}\n\"뇌의 전기 신호가 만든 자기장을 측정하며, 시간 해상도와 공간 해상도가 모두 높은 편인 기법\"의 명칭은?\n{/quiz}\n{answer}\n'''뇌자도(MEG)'''. EEG는 전기 신호 자체를 재고 공간 해상도가 낮다. fMRI는 공간 해상도는 매우 높지만 시간 해상도가 낮다(p.20).\n{/answer}\n\n== p.21–25 — 두뇌의 세부 구조 (뇌 구조별 기능표) ⭐⭐⭐ ==\n\n🎙 \"심부 구조는 뇌 영역 중에서도 '''옛날부터 있었던 영역'''이고, 전반적으로 '''생명 활동'''과 관련된 기능을 담당한다. 이 활동들 상당수는 '''의식적인 노력 없이''' 자연스럽게 일어난다\"(9/8 2부 03:46, 15:08).\n\n[[img:L2-21.png|p.21 뇌 심부 구조(시상~연수) — 시상·망상체·뇌교·연수|medium]]\n\n* [[뇌간]](Brainstem): [[뇌간|연수]]와 [[뇌간|뇌교]]로 이루어진 '''가장 오래된 부분'''. 연수 = 심장 활동·호흡 조절, 뇌교 = 움직임 조절·수면 제어.\n* [[시상]](Thalamus): 감각 제어 중추. '''후각을 제외한''' 모든 감각을 받아 대뇌 각 감각 피질에 전달(감각 정보의 관문). 두뇌의 명령을 연수·소뇌에 전달.\n* [[뇌간|망상체]](Reticular formation): 유입 자극에서 중요한 정보를 '''필터링''', '''각성(Arousal)''' 제어.\n\n{exam}\n교수 강조(🎙 9/8 2부 05:52): \"'''후각은 1차적으로 담당 영역으로 전달될 때 시상을 거치지 않는다.''' 시상은 후각만 제외 — 간단하고 깔끔하다 정도로 보면 된다.\" bank MC 오답 보기: \"후각을 포함한 모든 감각이 시상을 거친다\" ✗.\n{/exam}\n\n[[img:L2-22.png|p.22 소뇌와 척수|small]]\n\n* [[소뇌]](Cerebellum): 신체 운동(정교한 움직임 포함), '''비언어적 학습과 기억''', 정서·사회 운동 제어, 시간 판별, 소리·질감 구분, '''다양한 활동 간의 협응'''.\n\n[[img:L2-23.png|p.23 변연계의 구성원 및 구조 — 시상하부·뇌하수체·편도체·해마|medium]]\n\n* [[변연계]](Limbic System): '''정서 및 추동'''을 담당. [[변연계|추동]](Drive) = 결핍 상황의 해결을 위해 행동하게 하는 동기적 힘. 구성원: '''시상하부 · 뇌하수체 · 편도체 · 해마''' (시상은 아니다!).\n* [[편도체]](Amygdala): 공격·공포·분노에 대한 인지. 손상 환자는 위협 상황에서도 공포를 못 느낌('''환자 S.M'''). 부정적 사건 기억을 더 잘 유지.\n* [[시상하부]](Hypothalamus): '''항상성''' 유지를 위한 섭식 기능, 보상의 쾌감 정서(Olds, 1975). [[시상하부|항상성]](Homeostasis) = 인간의 내적 상태를 일정하게 유지하려는 것.\n* [[해마]](Hippocampus): '''의식적이고 명시적인 기억'''을 처리. 손상 환자는 새로운 정보를 기억하기 어렵다(Jayakar et al., 2015).\n\n{exam}\n🎙 해마 손상 → 기억 상실의 두 유형(9/8 2부 13:26–18:59): '''역행성''' = 손상·충격 '''이전''' 기억을 못 떠올림 → 영화 「'''제이슨 본'''」 / '''순행성''' = 손상 '''이후''' 새 기억 형성 불가 → 영화 「'''메멘토'''」. 빈도상 순행성이 더 일반적. 자세한 건 [[기억상실증]](6장 p.33).\n{/exam}\n\n[[img:L2-25.png|p.25 뇌의 심부 구조 및 변연계 + 대뇌 피질의 구조 — 한 장짜리 종합 지도(라벨만 있는 종합 그림, 텍스트 레이어 없음)|large]]\n\n{| class=\"table\"\n! 구조 || 소속 || 기능 (슬라이드 문장) || 손상·사례\n|-\n| [[뇌간|연수]] || 뇌간 || 심장 활동과 허파의 호흡 조절 || —\n|-\n| [[뇌간|뇌교]] || 뇌간 || 움직임 조절과 수면 제어 || —\n|-\n| [[뇌간|망상체]] || 뇌간 주변 || 중요한 정보 필터링, 각성 제어 || —\n|-\n| [[시상]] || 심부 || '''후각 제외''' 감각의 관문 || —\n|-\n| [[소뇌]] || 후뇌 || 정교한 운동, 비언어적 학습·기억, 협응 || 6장: 파블로프 조건 형성\n|-\n| [[편도체]] || 변연계 || 공격·공포·분노의 인지 || 환자 S.M\n|-\n| [[시상하부]] || 변연계 || 항상성(섭식), 보상 쾌감 || 쥐 시상하부 제거(손상법)\n|-\n| [[변연계|뇌하수체]] || 변연계 || 🎙 내분비선·호르몬 분비 || —\n|-\n| [[해마]] || 변연계 || 의식적·명시적 기억 || 택시 운전사, H.M\n|}\n\n== p.26–28 — 대뇌 피질과 연합 영역 ⭐⭐⭐ ==\n\n[[img:L2-26.png|p.26 대뇌 피질의 기본 4가지 구조 — 전두엽·두정엽·측두엽·후두엽, 오른쪽은 좌우 반구 단면|medium]]\n\n[[대뇌 피질]](cerebral cortex)을 기반으로 대뇌(Cerebrum)가 신체 통제·정보 처리를 수행한다. [[뇌량]]을 기준으로 좌/우반구, '''전두엽·후두엽·두정엽·측두엽''' 4영역.\n\n{| class=\"table\"\n! 기능 || 담당 피질 (p.27)\n|-\n| 운동 || '''전두엽의 가장 뒷부분'''의 운동 피질\n|-\n| 시각 || '''후두엽'''의 시각 피질\n|-\n| 청각 || '''측두엽'''의 청각 피질\n|-\n| 체감각 || '''두정엽'''의 체감각 피질\n|}\n\n[[대뇌 피질|호문쿨루스]]: 운동·체감각 피질의 담당 영역에 따라 그려낸 신체 부위 지도.\n\n[[img:L2-28.png|p.28 전전두엽 손상 예시 — 쇠막대가 관통한 두개골과 손상 부위 영상|medium]]\n\n[[연합 영역]](Association area): 감각·운동 영역을 '''제외한''' 나머지 광범위한 영역. 뇌 전 영역에 걸쳐 존재. [[연합 영역|전전두엽]](판단·계획·억제·사회적 상호작용), 측두엽(얼굴 재인 — [[방추상 얼굴 영역|FFA]]), 두정엽(수학·공간 추리, 자극 시 환상 운동 감각).\n\n{exam}\n교수 강조(🎙 9/8 2부 19:52): \"연합 영역의 '''가장 중요한 특징'''은 '''어떤 관찰할 수 있는 반응을 산출하지 않는다'''는 것\" — 슬라이드에도 밑줄. 그래서 반응이 없어도 벌어지는 심적 과정을 보려고 신경과학 기법(p.12–20)이 필요하다. 이어서 교수는 \"행동은 여러 기제가 조합된 최종 결과물\" 이라며 [[생물심리사회적 접근법]]을 다시 언급했다(2부 23:47).\n{/exam}\n\n== p.29–30 — 분할 뇌 ⭐⭐⭐ ==\n\n[[img:L2-29.png|p.29 좌우 시야와 대뇌 전달 — 왼쪽 시야(연필)는 우반구 시각영역, 오른쪽 시야(사과)는 좌반구 시각영역으로|medium]]\n\n[[뇌량]](Corpus Callosum)은 좌반구와 우반구를 연결하는 다리다. 손상되면 반구 간 정보 공유가 불가능하다. 그리고 '''좌시야 → 우뇌, 우시야 → 좌뇌'''.\n\n[[img:L2-30.png|p.30 Gazzaniga의 분할 뇌 실험 — HE•ART 를 보여 주면 말로는 \"ART\", 왼손으로는 \"HE\" 를 가리킨다|large]]\n\n[[분할 뇌]] 실험(Gazzaniga, 1967): 뇌량이 끊어진 사람에게 단어 철자를 잘라 좌·우 시야에 나눠 제시하면, \"무엇을 보았나?\"에는 '''우시야'''(좌뇌, 언어)의 단어만 보고하고, 가리키라고 하면 '''좌시야'''(우뇌)의 텍스트를 가리킨다 → 뇌량의 중요성 + '''[[분할 뇌|기능의 편재화]]'''. 좌반구 = 언어·수학 계산, 우반구 = 추론·자기 자각·의미 전달을 위한 말하기 조율.\n\n[[anim:split_brain|p.30 그림 그대로 — HE•ART 를 응시하면 좌시야 「HE」→ 우반구, 우시야 「ART」→ 좌반구로 간다. 뇌량이 잘리면 말로는 \"ART\", 왼손은 HE 를 가리키는 것을 확인하라(모의고사의 열쇠/연필 문제와 같은 구조)]]\n\n{warn}\n4장 p.25 슬라이드에는 \"우시야의 입력 정보는 '''우반구'''로\"라고 적혀 있는데 '''오기'''다. 맞는 것은 '''좌반구'''(이 장 p.29와 일치). 자세히는 [[분할 뇌]].\n{/warn}\n\n== p.31 — 의식의 정의 ⭐⭐ ==\n\n{def}\n'''설명''': 자기 자신과 환경에 대한 주관적 자각. 감각·정서·선택을 포함해 삶에 대한 이해를 증진하고, 목표를 설정·달성하게 하며, 배울 때 주의를 집중하게 하고, 변화에 대한 자각의 상이함을 인식하게 한다 (2장 p.31, Feinberg & Mallatt, 2016)\n'''명칭''': 의식 (Consciousness)\n{/def}\n\n[[인지신경과학]]은 '''특정 두뇌 상태를 의식 경험과 연관'''짓는다. 예: \"이번 월드컵을 회상해 보세요\" → 의식적인 기억 회상 → 뇌 특정 부위의 혈중 산소 농도 상승. 🎙 해마 뉴런이 장면 회상 때 몇 번 발화하는지 잰 연구들이 있다(2부 37:10).\n\n{joke}\n🎙 교수 여담: 인지심리학 중 주의(attention) 연구실 출신 선배들은 '''자동차 내비게이션 UI 개선''' 쪽으로 많이 진출했다고(2부 33:13). 순수 학문도 쓸 데가 있다.\n{/joke}\n\n== p.32–33 — 선택적 주의: 칵테일 파티 효과·부주의적 맹시·변화맹 ⭐⭐⭐ ==\n\n[[img:L2-32.png|p.32 Neisser & Cervone(1983)의 부주의적 맹시 실험 — 공 패스를 세는 사이 우산 쓴 여성이 지나간다|medium]]\n\n[[선택적 주의]](Selective Attention): 경험하는 모든 것 중 '''일부분에만 초점'''을 맞추게 하는 심리 기제. '''의식적 자각은 선택적 주의를 통해서 성립'''된다.\n\n* [[칵테일 파티 효과]]: 여러 말소리 중 하나의 목소리에만 주의를 기울이는 현상. 자신과 관련된 의미 있는 정보만 필터링.\n* [[부주의적 맹시]](inattentional blindness): 주의를 기울이지 않은 시각 자극을 인지하지 못하는 현상.\n* [[변화맹]](Change Blindness): 장면에 변화가 생겨도 눈치채지 못하는 현상 — '''부주의적 맹시의 한 유형'''. 영화의 '옥의 티'.\n\n[[img:L2-33.png|p.33 변화맹 실험 예시(Simons & Levin, 1998) — 길을 묻던 사람이 판자가 지나간 사이 다른 사람으로 바뀐다|medium]]\n\n[[anim:selective_attention|파티 소음 속 \"내 이름\" → 공 세기 중 지나가는 사람 → 바뀐 장면을 못 알아채는 순서로, 세 현상의 차이를 한 번에 보라]]\n\n{quiz}\n여러 사람이 동시에 떠드는 파티장에서 친구 목소리에만 집중하다가, 멀리서 누가 내 이름을 부르자 곧바로 알아차렸다. 이 현상의 명칭은?\n{/quiz}\n{answer}\n'''칵테일 파티 효과''' (cocktail party effect). 선택적 주의의 대표 예(p.32). bank 단답형 정답.\n{/answer}\n\n== p.34 — 이중 처리 ⭐⭐⭐ ==\n\n[[img:L2-34.png|p.34 이중 처리 과정 — 의식적/책략적 처리와 무의식적/자동적 처리가 함께 심리 기제(기억·사고·언어)로|medium]]\n\n[[이중 처리]](dual processing): 의식 경험에 대한 정보 처리에서 '''두 가지 경로가 동시에 개입'''한다는 원리.\n\n{| class=\"table\"\n! || 의식적 경로 || 무의식적 경로\n|-\n| 성격 || 회고적, 매우 신중 || 자동적, 신속\n|-\n| 처리 방식 || '''계열 처리''' (하나씩) || '''[[병렬 처리]]''' (여러 특성을 동시에)\n|-\n| 그림 속 이름 || 의식적/책략적 처리 || 무의식적/자동적 처리\n|}\n\n== p.35–38 — 수면과 꿈 ⭐⭐⭐ ==\n\n[[img:L2-35.png|p.35 수면과 비수면 상태에서의 뇌파 — 베타·알파·N1·N2·N3(델타파)·REM|medium]]\n\n[[수면과 꿈]] 문서에 전부 흡수돼 있다. 요점만:\n* [[수면과 꿈|일주기 리듬]](circadian rhythm): 24시간 주기로 발생하는 규칙적 신체 리듬.\n* 뇌파: '''베타파'''(각성) · '''알파파'''(자지 않는 이완) · N1 · N2 · '''N3(델타파, 매우 깊은 수면)''' · '''REM'''(빠른 안구운동, 선명한 꿈).\n\n[[img:L2-36.png|p.36 젊은 사람과 노인의 수면 주기 그래프 — 노인은 N3 진입이 거의 없고 N1·N2를 오간다|medium]]\n\n* REM 수면: 뇌간이 근육으로 가는 신호를 차단해 '''외적으로는 이완''', '''내적으로는 각성'''. 파형은 N1과 비슷하지만 '''심장 박동과 호흡이 빨라진다'''.\n* 🎙 젊은 사람은 N3까지 잘 들어가고 대개 N2에서 유지, 어르신은 N3 진입이 거의 없고 N2·N1을 왔다 갔다 한다 — 수면 주기가 짧아졌기 때문(2부 52:12).\n* 수면의 목적(p.37): 보호, 감염 치료·면역 회복(알츠하이머 유발 단백질 제거), 기억의 복원·재생, 창의적 사고 배양, 성장 호르몬 분비.\n\n[[img:L2-38.png|p.38 꿈에 대한 이론 5가지와 REM 반동|large]]\n\n꿈 이론 5개(p.38): '''프로이트의 소망충족'''(표출 내용 vs 잠재 내용 → [[프로이트]]) · '''정보 처리'''(사건 분류·기억 공고화) · '''생물학적 기능'''(신경 통로 발달·유지) · '''활성화-종합'''(무작위 신경활동을 뇌가 이야기로 엮음) · '''인지 발달'''(지식·이해를 반영해 실제를 시뮬레이션). REM을 박탈하면 더 빨리 REM으로 돌아간다 = '''REM 반동'''.\n\n{warn}\nbank 함정: \"REM 수면에서는 근육 신호가 차단되므로 심장 박동과 호흡도 '''느려진다'''\" ✗ → 오히려 '''빨라진다'''. 근육 차단은 겉모습만 이완시킬 뿐.\n{/warn}\n\n== 🎙 실제 수업 기록 ==\n\n'''9/8(화) — 1부 14:34~ (62분) · 2부 16:04~ (63분)'''. 이 회차는 전문이 없고 Clova AI '''타임스탬프 요약 메모만''' 있다(`0908_03_심리_1부/2부_타임스탬프.txt`). 아래는 그 메모 기준이며, 메모에 \"이건 시험에 나온다\"는 직접 발언 기록은 없다.\n\n{| class=\"table\"\n! 구간 || 다룬 슬라이드 || 교수 발언 요지\n|-\n| 1부 00:11–13:47 || p.2–4 || 뇌 중심 접근은 최근 것이 아님. 현대 인지신경과학의 전제 = 특정 영역이 특정 기능. 마음 = \"조별 과제의 합산 결과물\". 택시/버스 운전사 연구\n|-\n| 1부 14:00–22:44 || p.5–6 || 세포체(생명 기전)·수상돌기(수신)·축색(경로)·축색 종말(발신). 수초 손상 → 다발성 경화증. 양이온 유입 → 탈분극화 → 일정 수준 넘으면 활동 전위\n|-\n| 1부 23:38–31:15 || p.7–9 || 전위 값은 항상 일정, '''발화 횟수로 강도 표상'''. 세로토닌 재흡수 방해 → 우울 완화. 도파민 과잉=조현병, 세로토닌 부족=우울, GABA 부족=불면·경련\n|-\n| 1부 32:22–39:48 || p.10–12 || 중추(두뇌+척수)/말초(체신경+자율). 뉴런 세 유형. '''손상법 = 가장 초기, 인과적 설명'''. 편도체 손상 → 무서운 장면에도 공포 없음\n|-\n| 1부 40:19–55:04 || p.13–16 || 시간적 접근 vs 공간적 접근. '''EEG/ERP = 시간 해상도 높음'''. N400/P600. 채널 수↑ → 근원 추적. 차폐 격벽, 컴퓨터 2대 동기화\n|-\n| 1부 58:50–60:59 || p.13 || MEG: 코일로 자기장 측정, 뇌 심부 좌표 추적, 비쌈. (메모 1:02:06 「양전자 방출 단층 촬영법」 = 후반 시작)\n|-\n| 2부 00:00–02:44 || p.19–20 || DSI = 백질 축색 주변 물 분자 확산 → 신경 통로 지도. 기법은 시간/공간 해상도로 분류\n|-\n| 2부 03:46–18:59 || p.21–24 || 심부 구조 = 오래된 영역·생명 활동. '''시상: 후각만 거치지 않음'''. 변연계 4영역. 해마 손상 → '''역행성(제이슨 본) / 순행성(메멘토)''', 순행성이 더 흔함. 뇌하수체 = 호르몬\n|-\n| 2부 19:52–28:45 || p.27–28 || 호문쿨루스. '''연합 영역 = 관찰 가능한 반응을 산출하지 않음'''. 생물심리사회적 접근법. FFA, 두정엽\n|-\n| 2부 29:33–32:21 || p.29–30 || 뇌량 끊기면 공유 불가. 우반구는 언어를 1차 처리하지 않아 말로 보고는 못 해도 이미지로 가리킬 수 있음\n|-\n| 2부 33:13–47:07 || p.31–33 || 주의 연구실 → 내비 UI 진로 여담. 의식 = 두뇌 상태와 연관. 칵테일 파티 효과, 부주의적 맹시, 변화맹\n|-\n| 2부 48:03–62:30 || p.34–38 || 이중 처리(병렬). 수면 단계별 뇌파, 젊은이 vs 노인 수면 주기. 수면 기능, 꿈 이론. 마무리 요약\n|}\n\n== 시험 대비 핵심 요약 ==\n\n# '''[[신경 가소성]]''' — 경험·손상 후 뇌가 변하는 능력, 택시 운전사 해마 (단답형 최우선).\n# '''[[활동 전위]]''': 안정 전위 → 탈분극화 → [[역치]] → 발화 → 불응기. '''[[실무율]]'''이라 크기 동일, '''강도 = 발화율'''(교수 강조).\n# 뉴런 안 = 전기, 뉴런 사이 = 화학([[신경전달물질]]) → 남는 것은 [[재흡수]].\n# [[도파민]] 과잉 조현병 / 부족 파킨슨, [[세로토닌]] 부족 우울, ACh 알츠하이머, GABA 억제성, 글루타메이트 흥분성, 엔도르핀 통증·쾌감.\n# [[신경계]]: 중추(두뇌+척수·반사) / 말초(체신경=골격근, 자율=분비선·내장근; 교감 각성·부교감 이완). 뉴런 3유형 = 감각·운동·간뉴런.\n# 연구 기법: [[손상법]](최초·인과) / [[뇌전도|EEG]]·[[사건 관련 전위|ERP]](시간↑ 공간↓) / MEG(둘 다↑) / PET·[[fMRI]](공간↑ 시간↓, BOLD) / MRI(구조) / [[확산 스펙트럼 영상|DSI]](백질 연결).\n# [[시상]] = '''후각 제외''' 감각의 관문. [[뇌간]] = 연수(심장·호흡)+뇌교(움직임·수면). 망상체 = 필터링·각성. [[소뇌]] = 협응·정교한 운동·비언어적 기억.\n# [[변연계]] = 시상하부+뇌하수체+편도체+해마 (시상 ✗). [[편도체]] 공포(S.M), [[시상하부]] 항상성, [[해마]] 명시적 기억.\n# 역행성 = 「제이슨 본」, 순행성 = 「메멘토」 → [[기억상실증]].\n# [[대뇌 피질]] 4엽: 운동=전두엽 뒷부분, 시각=후두엽, 청각=측두엽, 체감각=두정엽. [[연합 영역]] = '''관찰 가능한 반응 없음'''(교수 강조).\n# [[분할 뇌]]: 우시야→좌뇌→'''말로''' 보고 / 좌시야→우뇌→'''가리키기'''. [[뇌량]], 기능의 편재화. 4장 p.25 오기 주의.\n# [[선택적 주의]] → [[칵테일 파티 효과]] / [[부주의적 맹시]] / [[변화맹]](부주의적 맹시의 한 유형).\n# [[이중 처리]]: 의식적=계열·신중 / 무의식적=병렬·자동.\n# [[수면과 꿈]]: 베타·알파·N1·N2·N3(델타)·REM, REM 반동, 꿈 이론 5개(소망충족·정보 처리·생물학적 기능·활성화-종합·인지 발달).\n\n== 관련 문서 ==\n\n* 신경 소통: [[뉴런]] · [[활동 전위]] · [[역치]] · [[실무율]] · [[신경전달물질]] · [[재흡수]] · [[도파민]] · [[세로토닌]] · [[신경계]] · [[신경 가소성]]\n* 연구 기법: [[손상법]] · [[뇌전도]] · [[사건 관련 전위]] · [[fMRI]] · [[확산 스펙트럼 영상]]\n* 뇌 구조: [[뇌간]] · [[시상]] · [[소뇌]] · [[변연계]] · [[편도체]] · [[시상하부]] · [[해마]] · [[대뇌 피질]] · [[연합 영역]] · [[뇌량]] · [[분할 뇌]]\n* 의식: [[선택적 주의]] · [[칵테일 파티 효과]] · [[부주의적 맹시]] · [[변화맹]] · [[이중 처리]] · [[수면과 꿈]]\n* 앞뒤 장: [[1장 심리과학을 비판적으로 생각하기]] ← → [[3장 일생에 걸친 발달]] · 시험: [[명칭 암기표]] · [[자주 틀리는 함정 모음]]"

  "body": "'''신경 가소성'''(Neuroplasticity)은 뇌가 '''경험에 따라 스스로 배선을 바꾸는 능력'''이다. [[2장 마음의 생물학과 의식|2장]] p.4에서 \"대뇌 신경망은 경험을 통해 적응하고 구축된다\"는 문장과 함께 나온다. 통합요약 §0-1 2장 최우선 명칭이고, 모의고사 bank 단답형 정답이다.\n\n{def}\n'''설명''': 신경망의 손상 후 재조직을 수행하는 과정이나, 경험을 통해 새로운 신경 통로를 구축하여 뇌가 변하는 능력 (2장 p.4)\n'''명칭''': [[신경 가소성]] (Neuroplasticity)\n{/def}\n\n{def}\n'''사례형 설명''': 런던의 택시 운전사들은 버스 운전사들보다 [[해마]]가 더 큰 것으로 나타났다. 길을 스스로 찾아다니는 경험으로 신경망이 새로 구축되어 뇌가 변한 것이다.\n'''명칭''': 신경 가소성\n{/def}\n\n{analogy}\n뇌는 '''잔디밭에 난 오솔길'''이다. 처음엔 풀이 무성해 지나가기 힘들지만(연결이 적고 약함), 같은 길로 자꾸 다니면 길이 단단히 다져지고(연결 강화), 새 지름길도 생긴다(새 회로). 공사로 길 하나가 막혀도(손상) 사람들이 옆으로 돌아 새 길을 낸다(재조직). 런던 택시 기사는 런던 시내 골목 오솔길을 매일 수백 번 밟는 사람이라, 길 지도를 보관하는 [[해마]]가 커질 수밖에 없다.\n{/analogy}\n\n[[img:L2-04.png|2장 p.4 신경 가소성의 특징 — ① 경험 전: 연결이 적고 약함 ② 반복으로 회로 활성화 ③ 경험 후: 새 연결 생성 + 기존 연결 강화|large]]\n\n== 슬라이드 근거 (p.4) ==\n* 대뇌 신경망은 경험을 통해 '''적응하고 구축'''된다.\n* '''영국 택시 운전사 vs 버스 운전사''': 택시 운전사의 해마가 더 큼 (Maguire et al., 2006).\n* 훈련에 따라 '''감각 영역'''의 변화가 발생 (Brodt et al., 2018).\n* 🎙 9/8 1부 09:26: 신경망을 \"조별 과제의 합산 결과물\"로 설명한 직후, 신경 가소성 연구의 예로 택시/버스 운전사 연구를 들었다.\n\n{exam}\n통합요약 §0-1 2장 '''최우선 명칭'''(굵게 표시) + 출제 예상 단답형 1번 \"손상 후 재조직·경험으로 뇌가 변하는 능력 → '''신경 가소성'''\". bank 단답형도 택시 운전사 사례로 이 명칭을 묻는다. 허용 표기: 신경가소성, neuroplasticity, 뇌 가소성.\n{/exam}\n\n== 두 가지 얼굴 ==\n{| class=\"table\"\n! 종류 || 무슨 일이 || 예\n|-\n| 경험에 의한 변화 || 반복 경험 → 시냅스 강화, 새 회로 형성 || 택시 운전사 해마, 훈련 후 감각 영역 변화\n|-\n| 손상 후 재조직 || 망가진 신경망을 다른 경로로 재구성 || 슬라이드 정의 앞부분 \"손상 후 재조직\"\n|}\n\n== 다른 장에서 ==\n5장 p.2 \"학습에 따른 두뇌의 변화\"에서 같은 개념이 '''신경 가소성(Neural Plasticity): 경험, 학습 등에 따라 신경 회로가 유연하게 변하는 특성'''으로 다시 나온다. 즉 [[학습]](경험에 따른 행동의 영속적 변화)의 생물학적 바탕이 신경 가소성이다.\n\n{warn}\n\"뉴런은 한 번 만들어지면 절대 바뀌지 않는다\"는 보기는 ✗. p.5 슬라이드도 \"뉴런은 새로이 생성되거나 사라질 수 있음\"이라고 적는다([[뉴런]]).\n{/warn}\n\n== 관련 문서 ==\n* [[해마]] — 택시 운전사 연구에서 커진 부위\n* [[뉴런]] — 바뀌는 연결의 주인공\n* [[학습]] — 5장에서 신경 가소성을 학습의 두뇌 변화로 연결\n* [[2장 마음의 생물학과 의식]]\n\n근거: 2장 p.4; 5장 p.2"
 },
 "뉴런": {
  "title": "뉴런 (Neuron)",
  "category": [
   "2장 마음의 생물학과 의식",
   "용어"
  ],
  "body": "'''뉴런'''(Neuron)은 '''신경정보 시스템의 근간을 이루는 세포''', 즉 신경세포다. 2장 p.5의 핵심 문장은 \"한 뉴런 내에서는 '''전기적''' 신호로, 타 뉴런에 신호를 전달할 때는 '''신경 화학 물질'''을 사용\"이다. 이 한 줄이 [[활동 전위]](전기)와 [[신경전달물질]](화학)으로 갈라지는 2장 전반부의 분기점이다.\n\n{def}\n'''설명''': 신경정보 시스템의 근간을 이루는 세포. 새로이 생성되거나 사라질 수 있으며, 정보의 수용 및 전달을 수행한다 (2장 p.5)\n'''명칭''': [[뉴런]] (Neuron)\n{/def}\n\n{def}\n'''설명''': 뉴런의 축색을 감싸는 수초가 퇴화하거나 손상되어 발생하는 신경성 질병. 근육 제어 및 인지 능력이 저하된다 (2장 p.5)\n'''명칭''': 다발성 경화증 (Multiple Sclerosis)\n{/def}\n\n{analogy}\n뉴런은 '''전선 달린 우체국'''이다. 수상돌기는 사방으로 뻗은 '''우편함'''(수신), 세포체는 '''본관'''(생명 유지), 축색은 본관에서 뻗어 나간 '''전선'''(전기 신호가 달리는 길), 수초는 전선의 '''절연 피복''', 축색 종말은 옆 우체국으로 '''편지 봉투'''(신경전달물질)를 던지는 발송 창구다. 피복(수초)이 벗겨지면 전기가 새서 신호가 제대로 안 간다 → 다발성 경화증.\n{/analogy}\n\n[[img:L2-05.png|2장 p.5 뉴런의 구조 및 신경망 — 수상돌기·세포체·축색·수초·축색 종말, 아래는 실제 신경망 현미경 사진|large]]\n\n== 구조 ==\n{| class=\"table\"\n! 부위 || 슬라이드 그림 설명 || 🎙 교수 한 줄 (9/8 1부 14:00–22:44)\n|-\n| '''수상돌기''' (수용 돌기) || 다른 세포로부터 정보를 받아들임 || 수신기\n|-\n| '''세포체''' || 세포의 생명 유지 중추 || 생명 기전 담당\n|-\n| '''축색''' || 세포체로부터 받은 정보를 다른 뉴런·근육·내분비선으로 전달 || 전기적 신호가 이동하는 경로\n|-\n| '''수초''' || 축색을 덮어 신경 충격의 속도를 증가 || 전달의 효율성 유지\n|-\n| '''축색 종말''' || 다른 세포와의 연결망 형성 || 신호를 발신하는 기관\n|}\n\n<pre class=\"ascii\">\n 수상돌기 ──▶ 세포체 ──▶ 축색(수초로 감쌈) ══▶ 축색 종말 ─ ─ ▶ (시냅스) ─ ─ ▶ 다음 뉴런 수상돌기\n  [받기]      [유지]       [[활동 전위|전기 신호]]로 달림          [[신경전달물질|화학 물질]] 방출\n<\/pre>\n\n== 뉴런 안 vs 뉴런 사이 ==\n{| class=\"table\"\n! 구간 || 신호 형태 || 담당 문서\n|-\n| 한 뉴런 '''내''' || 전기적 신호 || [[활동 전위]], [[실무율]], [[역치]]\n|-\n| 뉴런과 뉴런 '''사이''' || 신경 화학 물질 || [[신경전달물질]], [[재흡수]]\n|}\n\n== 뉴런의 세 유형 (p.11) ==\n감각 뉴런 · 운동 뉴런 · 간뉴런 — [[신경계]] 문서에 정리. 반사 회로(감각 → 간뉴런 → 운동)로 묶어서 외운다.\n\n[[anim:neuron_firing|수상돌기에서 축색 종말까지 신호가 전기 → 화학으로 바뀌는 지점을 확인하라]]\n\n{warn}\n\"뉴런 사이에서도 전기 신호가 그대로 건너간다\" ✗ → 뉴런 사이는 '''화학'''(신경전달물질). \"다발성 경화증 = 세포체 손상\" ✗ → '''수초''' 손상.\n{/warn}\n\n== 관련 문서 ==\n* [[활동 전위]] · [[신경전달물질]] · [[신경계]] · [[신경 가소성]]\n\n근거: 2장 p.5, p.11"
 },
 "활동 전위": {
  "title": "활동 전위 (Action Potential)",
  "category": [
   "2장 마음의 생물학과 의식",
   "용어"
  ],
  "body": "'''활동 전위'''(Action Potential)는 '''뉴런 안을 달리는 전기 신호'''다. 2장에서 객관식이 가장 많이 걸리는 개념 중 하나로, 안정 전위·탈분극화·역치·불응기·실무율·발화율이 한 세트로 나온다. 이 문서는 '''안정 전위·탈분극화·불응기'''를 흡수한 호스트 문서다.\n\n{def}\n'''설명''': 감각 혹은 이웃 뉴런의 화학 신호에 의해 발생하는 뉴런 내 전기적 신호 (2장 p.6)\n'''명칭''': [[활동 전위]] (Action Potential)\n{/def}\n\n{analogy}\n활동 전위는 '''도미노 줄'''이다. 첫 도미노를 살짝 건드리면(역치 미만) 안 넘어지고, 일정 힘 이상으로 밀면(역치 돌파) 끝까지 '''똑같은 크기로''' 쓰러진다 — 세게 밀었다고 도미노가 더 크게 쓰러지지는 않는다([[실무율]]). 한 번 쓰러진 줄은 다시 세워 놓기 전까지 또 쓰러뜨릴 수 없다(불응기). 그럼 \"세게 민 것\"은 어떻게 전하나? '''도미노 줄을 더 자주 쓰러뜨린다'''(발화율↑).\n{/analogy}\n\n[[img:L2-06.png|2장 p.6 활동 전위 발생 과정 — ① 나트륨 이온(Na+) 유입 ② 탈분극화가 다음 구간으로 ③ 축색을 따라 진행. 그래프: 안정 전위 약 −70mV, 역치 −55mV, 정점 약 +40mV|large]]\n\n== 발생 과정 (p.6) ==\n<pre class=\"ascii\">\n  ① 안정 전위         ② 탈분극화              ③ 역치 돌파            ④ 활동 전위          ⑤ 불응기\n  외부 (+)            양전하가 안으로 들어와    최소 강도를 넘으면      크기는 항상 같다      안정 전위로 돌아가기\n  내부 (−)            전하 차이가 사라짐        → 발화                 ([[실무율]])          전까지 재발화 불가\n<\/pre>\n\n=== 안정 전위 ===\n{def}\n'''설명''': 뉴런 외부가 양전하, 내부는 음전하인 상태 (2장 p.6)\n'''명칭''': 안정 전위 (Resting Potential)\n{/def}\n\n=== 탈분극화 ===\n{def}\n'''설명''': 신경 흥분으로 인해 양전하가 뉴런 내로 들어오면서 내외부의 전하 차이가 사라지는 현상 (2장 p.6)\n'''명칭''': 탈분극화 (Depolarization)\n{/def}\n🎙 \"축색 외부의 양이온이 내부로 들어오기 시작하면 내부와 외부의 전위차가 사라지기 시작 → 탈분극화 → 일정 수준 이상 넘어가면 본격적으로 활동 전위가 발생\"(9/8 1부 17:46). 여기서 \"일정 수준\"이 [[역치]]다.\n\n=== 불응기 ===\n{def}\n'''설명''': 활동 전위 발생 후의 휴지기. 안정 전위로 돌아가기 전까지 활동 전위가 발생하지 않는다 (2장 p.6)\n'''명칭''': 불응기 (Refractory Period)\n{/def}\n\n== 자극의 강도는 어떻게 표상되나 (p.7) ⭐⭐⭐ ==\n* 입력된 자극의 강도가 강할수록 활동 전위의 '''발화율'''이 상승한다 — '''활동 전위의 크기는 동일'''.\n* 이렇게 전기적 신호로 여러 자극의 강도가 식별되고, 감각 경험이 뇌에서 표상된다.\n\n{exam}\n교수 강조(🎙 9/8 1부 23:38): \"뇌는 뉴런의 '''발화 횟수'''로 입력된 자극을 더 강하다 아니면 약하다라고 표시한다.\" 통합요약 §0-1 2장 교수 강조 첫 줄.\n{/exam}\n\n{| class=\"table\"\n! 자극 || 활동 전위 크기 || 발화율(빈도)\n|-\n| 역치 미만 || 없음 || 0\n|-\n| 약한 자극(역치 이상) || 같음 || 낮음\n|-\n| 강한 자극 || '''같음''' || '''높음'''\n|}\n\n[[anim:neuron_firing|약한 자극과 강한 자극에서 펄스 크기는 같고 간격만 달라지는 것을 확인하라]]\n\n[[sim:action_potential]]\n\n{info}\n그래프의 −70mV·−55mV·+40mV는 p.6 그림(교재 그림)에 적힌 일반값이다. 슬라이드 본문은 수치를 요구하지 않으니 '''순서와 성질'''만 외우면 된다. 슬라이드 덤: 활동 전위 연구는 '''인공 신경망''' 구축 연구의 발전으로 이어졌다.\n{/info}\n\n{quiz}\n활동 전위에 대한 설명으로 옳은 것은? ① 자극이 강할수록 활동 전위의 크기가 커진다 ② 역치를 넘으면 자극 강도와 무관하게 같은 크기로 발생하고, 강한 자극은 발화율을 높인다 ③ 활동 전위 직후 불응기 없이 바로 재발화할 수 있다 ④ 안정 전위에서 내부가 양전하, 외부가 음전하다\n{/quiz}\n{answer}\n'''②'''. ① 크기가 아니라 발화율이 변한다. ③ 불응기가 있다. ④ 안정 전위는 '''외부 +, 내부 −''' — 반대로 써 놓은 함정.\n{/answer}\n\n== 관련 문서 ==\n* [[역치]] · [[실무율]] — 활동 전위의 두 규칙\n* [[뉴런]] — 신호가 달리는 몸체\n* [[신경전달물질]] — 축색 종말에 도착한 다음 단계\n\n근거: 2장 p.6–7"
 },

  "body": "'''역치'''(Threshold)는 \"'''여기를 넘어야 반응이 일어난다'''\"는 문턱값이다. 심리학 수업에서 이 단어는 '''두 번''' 나온다 — 2장 p.6에서는 뉴런이 [[활동 전위]]를 일으키는 문턱, 4장 p.4에서는 감각이 자극을 탐지하는 문턱([[절대 역치]]). 같은 단어, 다른 층위라서 헷갈리기 좋다.\n\n{def}\n'''설명''': 활동 전위가 촉발되기 위한 최소 강도 (2장 p.6)\n'''명칭''': [[역치]] (Threshold)\n{/def}\n\n{analogy}\n역치는 '''놀이공원 키 제한 막대'''다. 140cm 막대에 머리가 닿지 않으면(역치 미만) 아무리 졸라도 탑승 불가, 닿으면(역치 이상) 바로 탑승. 키가 190cm라고 롤러코스터를 '''더 크게''' 타는 건 아니다 — 탑승은 \"되느냐 마느냐\"뿐이다([[실무율]]).\n{/analogy}\n\n[[img:L2-06.png|2장 p.6 — 그래프의 빨간 점선이 역치(−55mV). 막전위가 이 선을 넘는 순간 활동 전위가 솟는다|medium]]\n\n== 활동 전위에서의 역치 ==\n* 양전하가 들어오며 [[활동 전위|탈분극화]]가 진행되다가 '''일정 수준'''(=역치)을 넘으면 본격적으로 활동 전위가 발생한다(🎙 9/8 1부 17:46).\n* 넘으면 완전히, 못 넘으면 전혀 → [[실무율]].\n* 역치를 넘은 뒤 자극을 더 세게 해도 크기는 그대로, '''발화율'''만 올라간다(p.7).\n\n[[sim:action_potential]]\n\n== 두 가지 \"역치\" 비교 ==\n{| class=\"table\"\n! || 2장 p.6 역치 || 4장 p.4 [[절대 역치]]\n|-\n| 층위 || 뉴런 한 개 || 사람(감각 체계) 전체\n|-\n| 정의 || 활동 전위가 촉발되기 위한 최소 강도 || 자극을 탐지하기 위한 최소 자극 강도(탐지율 50%)\n|-\n| 판정 || 발화 / 비발화 (실무율) || 탐지 확률(0.5 기준)\n|-\n| 관련 || [[실무율]], [[활동 전위]] || [[신호 탐지 이론]], [[차이 역치]]\n|}\n\n{warn}\n단답형에서 \"'''활동 전위가 촉발되기 위한 최소 강도'''\"면 답은 그냥 '''역치'''. \"절대 역치\"를 쓰면 4장 개념이라 오답 처리될 수 있다. 반대로 \"자극을 50% 탐지하는 최소 강도\"면 '''절대 역치'''.\n{/warn}\n\n== 관련 문서 ==\n* [[활동 전위]] · [[실무율]] · [[절대 역치]]\n\n근거: 2장 p.6; 4장 p.4"
 },
 "실무율": {
  "title": "실무율 (All-or-None)",
  "category": [
   "2장 마음의 생물학과 의식",
   "용어"
  ],
  "body": "'''실무율'''(All-or-None, 실무율 반응)은 [[활동 전위]]가 \"'''전부 아니면 전무'''\"로 일어난다는 원리다. [[역치]]를 넘으면 '''완전한 크기'''로 발생하고, 못 넘으면 '''전혀''' 발생하지 않는다. 통합요약 출제 예상 단답형 명칭 2번.\n\n{def}\n'''설명''': 활동 전위가 역치를 넘으면 완전히 발생하고, 넘지 못하면 전혀 발생하지 않는 반응. 그래서 활동 전위의 크기는 자극 강도와 관계없이 항상 동일하다 (2장 p.6–7)\n'''명칭''': [[실무율]] 반응 (All or None)\n{/def}\n\n{analogy}\n실무율은 '''전등 스위치'''다(밝기 조절 다이얼이 아니다). 스위치를 반쯤 누르면 안 켜지고, 끝까지 누르면 늘 같은 밝기로 켜진다. \"더 밝게\"를 표현하고 싶으면? 다이얼이 없으니 '''깜빡이는 횟수'''를 늘리는 수밖에 — 그게 [[활동 전위|발화율]]이다. 모스 부호도 점의 '''크기'''가 아니라 '''패턴과 빈도'''로 정보를 보낸다.\n{/analogy}\n\n[[anim:neuron_firing|역치 아래 자극은 아무 일도 없고, 역치 위 자극은 강도와 무관하게 같은 높이 펄스가 나가는 것을 보라]]\n\n== 실무율이 만드는 질문 — \"그럼 강도는?\" ==\n{| class=\"table\"\n! 바뀌는 것 || 바뀌지 않는 것\n|-\n| '''발화율'''(초당 발화 횟수) — 강할수록 ↑ || 활동 전위 한 개의 '''크기'''\n|}\np.7: \"입력된 자극의 강도가 강할수록 활동 전위의 발화율이 상승(활동 전위의 크기는 동일)\". 🎙 \"뇌는 뉴런의 발화 횟수로 자극이 더 강하다/약하다를 표시한다\"(9/8 1부 23:38).\n\n[[sim:action_potential]]\n\n{warn}\nbank 오답 보기 재구성: \"강한 자극일수록 '''더 큰''' 활동 전위가 생긴다\", \"약한 자극은 '''작은''' 활동 전위를 만든다\" → 둘 다 ✗. 크기는 고정, 빈도가 변수.\n{/warn}\n\n{joke}\n슬라이드가 덧붙인 한 줄 \"인공 신경망 구축 연구의 발전\" — 켜짐/꺼짐(0/1)으로 작동하는 뉴런 모형이 초창기 인공 신경망의 출발점이었다. 공대생에게 실무율은 사실상 '''계단 함수(step function)''' 활성화다.\n{/joke}\n\n== 관련 문서 ==\n* [[활동 전위]] · [[역치]] · [[뉴런]]\n\n근거: 2장 p.6–7"
 },
 "신경전달물질": {
  "title": "신경전달물질 (Neurotransmitter)",
  "category": [
   "2장 마음의 생물학과 의식",
   "용어"
  ],
  "body": "'''신경전달물질'''(Neurotransmitter)은 '''뉴런과 뉴런 사이의 틈(시냅스)을 건너가는 화학 물질'''이다. [[뉴런]] 안에서는 [[활동 전위|전기 신호]]로 달리던 정보가, 축색 종말에 도착하면 화학 물질로 바뀌어 다음 뉴런에 전달된다. p.9 표(7종)는 기능·오기능 매칭 객관식의 보물창고다. 이 문서는 아세틸콜린·노르에피네프린·글루타메이트·GABA·엔도르핀·시냅스를 흡수한다.\n\n{def}\n'''설명''': 뉴런 사이의 시냅스에서 작용하는 화학 물질. 활동 전위가 축색에 전달되면 축색 종말에서 방출되어 이웃 뉴런의 수용 돌기로 들어가 신호를 전달한다 (2장 p.8)\n'''명칭''': [[신경전달물질]] (Neurotransmitter)\n{/def}\n\n{analogy}\n시냅스는 '''강'''이고, 신경전달물질은 강 건너편으로 던지는 '''쪽지 묶은 공'''이다. 건너편 사람(수용기)은 자기 손 모양에 맞는 공만 받는다. 너무 많이 던져서 남은 공은 던진 사람이 다시 주워 간다([[재흡수]]). 공의 '''종류'''(도파민, 세로토닌…)마다 담긴 메시지가 다르다.\n{/analogy}\n\n[[img:L2-08.png|2장 p.8 신경전달물질 발생 과정 — 송신 뉴런 축색 종말에서 방출 → 시냅스 틈 → 수신 뉴런 수용기 → 남은 분자 재흡수(아래 오른쪽: 재흡수 차단제)|large]]\n\n== 전달 과정 (p.8) ==\n<pre class=\"ascii\">\n [[활동 전위]] 도착 ─▶ 축색 종말에서 방출 ─▶ 시냅스 틈 건넘 ─▶ 수용 돌기(수용기)에 결합 ─▶ 이웃 뉴런에 신호\n                                                   │\n                                     남은 과잉 분량 └─▶ [[재흡수]] : 방출한 뉴런으로 되돌아감\n<\/pre>\n\n=== 시냅스 ===\n{def}\n'''설명''': 뉴런과 뉴런 사이의 접합 부위(틈). 신경전달물질이 작용하는 곳 (2장 p.8)\n'''명칭''': 시냅스 (Synapse)\n{/def}\n\n== 주요 신경전달물질 7종 (p.9) ⭐⭐⭐ ==\n[[img:L2-09.png|2장 p.9 신경 전달 물질 표 — 기능 / 오기능|large]]\n\n{| class=\"table\"\n! 물질 || 기능 || 오기능 || 외우는 고리\n|-\n| '''아세틸콜린(ACh)''' || 근육 운동, 학습, 기억 || 알츠하이머에 걸리면 ACh 생성 뉴런의 퇴화 || \"아세틸 = 알츠\"\n|-\n| '''[[도파민]]''' || 움직임, 학습, 주의, 정서 || 공급 과잉 → 조현병 / 부족 → 파킨슨병 떨림·동작 감소 || 과잉·부족 양쪽 다 병\n|-\n| '''[[세로토닌]]''' || 기분, 배고픔, 수면, 각성 || 공급 부족 → 우울증 || 기분 물질\n|-\n| '''노르에피네프린''' || 각성의 제어 || 공급 부족 → 기분 저하 || 각성\n|-\n| '''글루타메이트''' || 기억에 관여하는 1차 '''흥분성''' 전달 물질 || 공급 과잉 → 과자극, 편두통·경련 || 액셀\n|-\n| '''GABA''' || 대표적 '''억제성''' 신경 전달물질 || 공급 부족 → 경련, 떨림, 불면증 || 브레이크\n|-\n| '''엔도르핀''' || 통증 및 쾌감의 지각 || 마약 복용은 신체의 자연적 엔도르핀 공급을 방해 || 천연 진통제\n|}\n\n=== 아세틸콜린 ===\n{def}\n'''설명''': 근육 운동·학습·기억에 관여하며, 알츠하이머에 걸리면 이것을 생성하는 뉴런이 퇴화하는 신경전달물질 (2장 p.9)\n'''명칭''': 아세틸콜린 (Acetylcholine, ACh)\n{/def}\n\n=== 노르에피네프린 ===\n{def}\n'''설명''': 각성의 제어에 관여하며, 공급이 부족하면 기분이 저하되는 신경전달물질 (2장 p.9)\n'''명칭''': 노르에피네프린 (Norepinephrine)\n{/def}\n\n=== 글루타메이트 ===\n{def}\n'''설명''': 기억에 관여하는 1차 흥분성 전달 물질. 공급 과잉 시 두뇌를 과하게 자극해 편두통이나 경련을 초래 (2장 p.9)\n'''명칭''': 글루타메이트 (Glutamate)\n{/def}\n\n=== GABA ===\n{def}\n'''설명''': 대표적 억제성 신경 전달물질. 공급 부족 시 경련, 떨림, 불면증 (2장 p.9)\n'''명칭''': GABA (가바)\n{/def}\n\n=== 엔도르핀 ===\n{def}\n'''설명''': 통증 및 쾌감의 지각에 관여하며, 마약 복용이 신체의 자연적 공급을 방해하는 신경전달물질 (2장 p.9)\n'''명칭''': 엔도르핀 (Endorphin)\n{/def}\n\n== 헷갈리는 짝 ==\n{| class=\"table\"\n! 짝 || 구분\n|-\n| 글루타메이트 vs GABA || '''흥분성''' vs '''억제성'''\n|-\n| 알츠하이머 vs 파킨슨병 || '''아세틸콜린''' 뉴런 퇴화 vs '''도파민''' 부족\n|-\n| 조현병 vs 우울증 || 도파민 '''과잉''' vs 세로토닌 '''부족'''\n|-\n| 경련·떨림이 나오는 물질 || GABA 부족(경련·떨림·불면) / 글루타메이트 과잉(편두통·경련) / 도파민 부족(파킨슨 떨림)\n|}\n\n🎙 교수는 \"도파민은 과하게 공급되면 조현병 증상, 세로토닌은 부족하면 우울증, 가바는 부족하면 불면증이나 경련\"을 직접 짚었다(9/8 1부 30:05). \"신경 전달 물질은 단일 유형으로 존재하지 않고 여러 유형이 있다\"(1부 28:00).\n\n[[anim:neuron_firing|마지막 장면에서 알갱이(신경전달물질)가 방출 → 결합 → 재흡수되는 흐름을 보라]]\n\n{warn}\n\"알츠하이머 = 도파민 부족\" ✗ → '''아세틸콜린'''. \"GABA = 대표적 흥분성\" ✗ → '''억제성'''.\n{/warn}\n\n== 관련 문서 ==\n* [[재흡수]] · [[도파민]] · [[세로토닌]] · [[뉴런]]\n\n근거: 2장 p.8–9"
 },
 "재흡수": {
  "title": "재흡수 (Reuptake)",
  "category": [
   "2장 마음의 생물학과 의식",
   "용어"
  ],
  "body": "'''재흡수'''(Reuptake)는 시냅스로 방출된 [[신경전달물질]] 중 '''남는 것을 보낸 뉴런이 다시 빨아들이는''' 과정이다. 통합요약 출제 예상 단답형 4번이다.\n\n{def}\n'''설명''': 수용력 이상의 과도한 신경전달물질이 방출된 뉴런으로 되돌아가는 과정 (2장 p.8)\n'''명칭''': [[재흡수]] (Reuptake)\n{/def}\n\n{analogy}\n재흡수는 '''뷔페 직원의 접시 회수'''다. 손님(수용기)이 다 못 먹은 음식(남은 신경전달물질)은 직원이 주방(송신 뉴런)으로 도로 가져간다. 그런데 직원 동선을 막아 버리면(재흡수 차단) 음식이 테이블(시냅스)에 오래 남아 손님이 더 오래 먹는다 → 효과가 길어진다.\n{/analogy}\n\n[[img:L2-08.png|2장 p.8 — 위 오른쪽 \"재흡수\" 화살표, 아래 오른쪽 칸은 세로토닌 재흡수를 막는 약물이 작용하는 모습|medium]]\n\n== 왜 중요한가 — 우울증 약 ==\n🎙 교수 설명(9/8 1부 28:00): \"세로토닌의 재흡수 과정을 방해하면 방출됐던 뉴런으로 돌아가지 못하고 '''시냅스 틈을 떠돌게''' 된다. 결과적으로 활용되는 [[세로토닌]]의 양이 증가하면서 '''우울 증상이 완화'''된다.\"\n\n<pre class=\"ascii\">\n 평소       : 방출 ─▶ 수용기 결합 ─▶ 남은 분량 [[재흡수]] ─▶ 시냅스 농도 정상\n 재흡수 차단 : 방출 ─▶ 수용기 결합 ─▶ 회수 막힘 ✗ ─▶ 시냅스에 오래 머묾 ─▶ 세로토닌 효과↑ ─▶ 우울 완화\n<\/pre>\n\n[[anim:neuron_firing|끝부분에서 남은 알갱이가 송신 뉴런으로 되돌아가는 장면이 재흡수다]]\n\n{| class=\"table\"\n! 헷갈리는 짝 || 재흡수 || 방출\n|-\n| 방향 || 시냅스 → '''송신''' 뉴런 || 송신 뉴런 → 시냅스\n|-\n| 대상 || 수용력 '''이상'''의 과도한 분량 || 활동 전위가 도착한 만큼\n|}\n\n{warn}\n\"재흡수 = 수신 뉴런이 흡수하는 것\" ✗. 슬라이드는 \"'''방출된 뉴런'''으로 되돌아감\", 즉 '''보낸 쪽'''으로 돌아간다.\n{/warn}\n\n== 관련 문서 ==\n* [[신경전달물질]] · [[세로토닌]] · [[뉴런]]\n\n근거: 2장 p.8"
 },
 "도파민": {
  "title": "도파민 (Dopamine)",
  "category": [
   "2장 마음의 생물학과 의식",
   "용어"
  ],
  "body": "'''도파민'''(Dopamine)은 움직임·학습·주의·정서에 관여하는 [[신경전달물질]]이다. p.9 표에서 유일하게 '''과잉과 부족 양쪽 모두''' 병명이 붙어 있어서 시험 출제 1순위다 — '''과잉 = 조현병, 부족 = 파킨슨병'''.\n\n{def}\n'''설명''': 움직임, 학습, 주의, 정서에 관여하며, 공급 과잉은 조현병과 관련되고 공급 부족 시 파킨슨병의 떨림과 동작 감소를 초래하는 신경전달물질 (2장 p.9)\n'''명칭''': [[도파민]] (Dopamine)\n{/def}\n\n{def}\n'''사례형 설명''': 한 환자가 손 떨림과 동작 감소를 보이며 파킨슨병으로 진단받았다. 공급이 부족한 신경전달물질은?\n'''명칭''': 도파민\n{/def}\n\n{analogy}\n도파민은 '''자동차 엔진의 연료 분사량'''이다. 너무 적으면 차가 덜덜 떨며 제대로 못 나가고(파킨슨: 떨림·동작 감소), 너무 많으면 엔진이 제멋대로 과열된다(조현병 관련). 적정량이어야 부드럽게 움직이고(움직임) 목표를 향해 간다(학습·주의·정서).\n{/analogy}\n\n[[img:L2-09.png|2장 p.9 — 둘째 줄 도파민: 움직임·학습·주의·정서 / 과잉 조현병·부족 파킨슨|medium]]\n\n== 과잉 vs 부족 ==\n{| class=\"table\"\n! 상태 || 결과 || 🎙\n|-\n| 공급 '''과잉''' || 조현병과 관련 || \"도파민은 과하게 공급되면 조현병과 관련된 증상\" (9/8 1부 30:05)\n|-\n| 공급 '''부족''' || 파킨슨병의 '''떨림'''과 '''동작 감소''' || —\n|}\n\n{quiz}\n손 떨림과 동작 감소를 보이는 파킨슨병과 가장 관련 깊은, 공급 부족 상태의 신경전달물질은? ① 세로토닌 ② GABA ③ 아세틸콜린 ④ 도파민\n{/quiz}\n{answer}\n'''④ 도파민'''. ① 세로토닌 부족 = 우울증. ② GABA 부족도 \"떨림\"이 있어 헷갈리지만 그건 경련·떨림·불면증 묶음이고 파킨슨병이라는 병명은 도파민에만 붙어 있다. ③ 아세틸콜린 = 알츠하이머.\n{/answer}\n\n{warn}\n\"도파민 '''부족''' = 조현병\" ✗ (방향 반대). \"알츠하이머 = 도파민\" ✗ (아세틸콜린).\n{/warn}\n\n== 관련 문서 ==\n* [[신경전달물질]] · [[세로토닌]] · [[재흡수]]\n\n근거: 2장 p.9"
 },
 "세로토닌": {
  "title": "세로토닌 (Serotonin)",
  "category": [
   "2장 마음의 생물학과 의식",
   "용어"
  ],
  "body": "'''세로토닌'''(Serotonin)은 기분·배고픔·수면·각성에 관여하는 [[신경전달물질]]이다. '''공급 부족 → 우울증'''. 2장에서 [[재흡수]]의 예시로 교수가 직접 든 물질이기도 하다.\n\n{def}\n'''설명''': 기분, 배고픔, 수면, 각성에 관여하며, 공급 부족 시 우울증이 발생하는 신경전달물질 (2장 p.9)\n'''명칭''': [[세로토닌]] (Serotonin)\n{/def}\n\n{analogy}\n세로토닌은 '''마음의 실내 조명 밝기'''다. 적당하면 기분·식욕·잠이 다 평온하게 돌아가는데, 조명이 어두워지면(부족) 방 전체가 가라앉는다(우울). 우울증 약은 전구를 새로 다는 게 아니라 '''불이 꺼지지 않게 스위치(재흡수)를 막는''' 방식이다.\n{/analogy}\n\n[[img:L2-09.png|2장 p.9 — 셋째 줄 세로토닌: 기분·배고픔·수면·각성 / 부족 시 우울증|medium]]\n\n== 재흡수 차단과 우울증 ==\n🎙 \"세로토닌의 재흡수 과정을 방해하면 시냅스 틈을 떠돌게 되고, 활용되는 세로토닌의 양이 증가하면서 우울 증상이 완화된다\"(9/8 1부 28:00). → [[재흡수]] 문서의 도식 참고.\n\n[[img:L2-08.png|2장 p.8 아래 오른쪽 — 세로토닌 재흡수를 차단하는 약물이 작용하는 모습|small]]\n\n== 비슷한 물질과 구분 ==\n{| class=\"table\"\n! 물질 || 기능 키워드 || 부족하면\n|-\n| '''세로토닌''' || 기분·배고픔·수면·각성 || '''우울증'''\n|-\n| 노르에피네프린 || 각성 제어 || 기분 저하\n|-\n| [[도파민]] || 움직임·학습·주의·정서 || 파킨슨병 (과잉은 조현병)\n|-\n| GABA || 억제성 || 경련·떨림·불면증\n|}\n\n{warn}\n\"우울증\"이 보이면 세로토닌, \"기분 '''저하'''\"는 노르에피네프린. 둘 다 기분 계열이라 객관식에서 섞인다. 슬라이드 단어 그대로 구분할 것.\n{/warn}\n\n== 관련 문서 ==\n* [[신경전달물질]] · [[재흡수]] · [[도파민]]\n\n근거: 2장 p.8–9"
 },
 "신경계": {
  "title": "신경계 (Nervous System)",
  "category": [
   "2장 마음의 생물학과 의식",
   "용어"
  ],
  "body": "'''신경계'''(Nervous System)는 몸 전체의 정보망이다. 2장 p.10–11은 이것을 '''계층 트리'''와 '''뉴런의 세 유형'''으로 정리한다. 이 문서는 중추 신경계·말초 신경계·체신경계·자율 신경계·교감/부교감 신경·감각 뉴런·운동 뉴런·간뉴런·반사를 모두 흡수한 호스트 문서다.\n\n{analogy}\n신경계는 '''회사 조직도'''다. '''중추 신경계'''는 본사(두뇌 = 임원실, 척수 = 본사와 지점을 잇는 간선 도로 + 긴급 상황은 도로에서 바로 처리하는 반사). '''말초 신경계'''는 전국 지점망이다. 지점 중 '''체신경계'''는 내가 직접 지시하는 영업팀(골격근, 자발적 제어), '''자율 신경계'''는 알아서 돌아가는 시설관리팀(분비선·내장 근육)인데, 그 안에 비상 출동조('''교감''' = 각성)와 휴식 담당('''부교감''' = 이완)이 있다.\n{/analogy}\n\n[[img:L2-10.png|2장 p.10 신경계의 구성 종류 — 신경계 → 말초(자율 신경계: 교감·부교감 / 체신경계: 감각 입력·운동 출력) · 중추(뇌·척수)|large]]\n\n== 신경계의 구성 (p.10) ⭐⭐⭐ ==\n<pre class=\"ascii\">\n신경계\n├─ 중추 신경계 (CNS) ── 신체의 전반적인 의사결정\n│    ├─ 두뇌 ── 학습 등 고차원 기능\n│    └─ 척수 ── 말초 신경계와 두뇌의 연결, 반사(reflex)\n└─ 말초 신경계 (PNS) ── 정보 수집 및 중추 신경계의 신호 전달\n     ├─ 체신경계   ── 감각 수용 및 '''골격근'''의 자발적 제어\n     └─ 자율 신경계 ── '''분비선과 내장 근육'''의 제어\n          ├─ 교감 신경   ── 각성\n          └─ 부교감 신경 ── 이완\n<\/pre>\n\n=== 중추 신경계 ===\n{def}\n'''설명''': 두뇌와 척수로 구성되며 신체의 전반적인 의사결정을 담당하는 신경계 (2장 p.10)\n'''명칭''': 중추 신경계 (Central Nervous System)\n{/def}\n\n=== 말초 신경계 ===\n{def}\n'''설명''': 정보를 수집하고 중추 신경계의 신호를 전달하는 신경계. 체신경계와 자율 신경계로 나뉜다 (2장 p.10)\n'''명칭''': 말초 신경계 (Peripheral Nervous System)\n{/def}\n🎙 \"중추 신경계를 제외한 나머지 — 손이나 발에 존재하는 여러 감각 수용·운동 신경계\"(9/8 1부 32:22).\n\n=== 체신경계 ===\n{def}\n'''설명''': 감각 수용 및 골격근의 자발적 제어를 담당하는 말초 신경계 (2장 p.10)\n'''명칭''': 체신경계 (Somatic Nervous System)\n{/def}\n\n=== 자율 신경계 ===\n{def}\n'''설명''': 분비선과 내장 근육을 제어하는 말초 신경계. 교감 신경(각성)과 부교감 신경(이완)으로 나뉜다 (2장 p.10)\n'''명칭''': 자율 신경계 (Autonomic Nervous System)\n{/def}\n\n=== 교감 신경 vs 부교감 신경 ===\n{| class=\"table\"\n! || 교감 신경 || 부교감 신경\n|-\n| 슬라이드 키워드 || '''각성''' || '''이완'''\n|-\n| 정리본 노트 || 심장 박동 증가, 소화 억제, 포도당 방출 || 심장 박동 완화, 소화 촉진\n|-\n| 장면 || 시험 시작 직전, 맹수와 마주침 || 밥 먹고 소파에 누움\n|}\n\n== 뉴런의 세 유형과 반사 (p.11) ⭐⭐ ==\n[[img:L2-11.png|2장 p.11 반사 반응의 작동 과정 — 피부 수용기 → 감각 뉴런 → 척수 간뉴런 → 운동 뉴런 → 근육. 반사는 척수에 국한되어 통증을 느끼기 전에 손을 뗀다|large]]\n\n{| class=\"table\"\n! 유형 || 방향 || 슬라이드 정의\n|-\n| '''감각 뉴런''' || 수용기 → 중추 || 감각 수용기로부터의 정보를 중추 신경계에 전달\n|-\n| '''운동 뉴런''' || 중추 → 근육·내분비선 || 중추 신경계의 명령을 근육 및 내분비선에 전달\n|-\n| '''간뉴런''' || 중추 안 || 감각 입력과 운동 출력 사이에서 소통 담당\n|}\n\n{def}\n'''설명''': 감각 입력과 운동 출력 사이에서 소통을 담당하는 뉴런 (2장 p.11)\n'''명칭''': 간뉴런 (Interneuron)\n{/def}\n\n{def}\n'''설명''': 척수가 담당하는, 뇌를 거치지 않고 감각 입력에 곧바로 운동 출력이 일어나는 반응 (2장 p.10–11)\n'''명칭''': 반사 (Reflex)\n{/def}\n\n<pre class=\"ascii\">\n 촛불(자극) ─▶ 피부 수용기 ─▶ 감각 뉴런 ─▶ [척수: 간뉴런] ─▶ 운동 뉴런 ─▶ 근육: 손을 뗌\n                                              │\n                                              └─▶ (나중에) 뇌로 ─▶ \"앗 뜨거!\" 를 느낌\n<\/pre>\n\n{warn}\nbank 오답 보기: \"'''체신경계'''는 분비선과 내장 근육의 제어를 담당한다\" ✗ → '''자율''' 신경계. 체신경계는 골격근의 '''자발적''' 제어. 반대로 \"척수는 말초 신경계와 두뇌를 연결하고 반사를 담당한다\" ○.\n{/warn}\n\n== 관련 문서 ==\n* [[뉴런]] · [[뇌간]] · [[2장 마음의 생물학과 의식]]\n\n근거: 2장 p.10–11"
 },
 "손상법": {
  "title": "손상법 (Lesion)",
  "category": [
   "2장 마음의 생물학과 의식",
   "연구 방법"
  ],
  "body": "'''손상법'''(Lesion)은 \"'''이 부위를 망가뜨리면 무엇이 안 되나?'''\"로 뇌 기능을 알아내는 방법이다. 2장 p.12의 첫 번째 뇌 연구 기법이며, 교수가 \"가장 초기의 방법이자 '''인과적인 설명'''을 내놓을 수 있는 방법\"이라고 강조했다.\n\n{def}\n'''설명''': 뇌의 기능을 탐구하기 위한 초기 연구법. 특정 뇌 영역 혹은 뉴런을 손상시켜 기능의 변화를 탐구하는 방식(침습적 방식) (2장 p.12)\n'''명칭''': [[손상법]] (Lesion)\n{/def}\n\n{analogy}\n손상법은 '''자동차 부품 하나씩 빼 보기'''다. 와이퍼 모터를 빼니 와이퍼가 멈췄다 → \"이 모터가 와이퍼를 움직인다\"는 '''원인-결과'''를 확실히 말할 수 있다. 대신 차를 망가뜨려야 하니(침습적) 사람 대상으로는 못 하고, 그래서 나중엔 부품을 '''잠깐만 꺼 보는''' 방식(비침습적 일시 방해)으로 발전했다.\n{/analogy}\n\n[[img:L2-12.png|2장 p.12 뇌의 손상을 통한 증상의 탐구법|medium]]\n\n== 슬라이드 내용 (p.12) ==\n* 뇌의 기능을 탐구하기 위한 '''초기''' 연구법.\n* 특정 영역·뉴런을 손상시켜 기능 변화를 탐구 — '''침습적'''.\n* '''동물 대상'''으로 시행 (예: 쥐의 [[시상하부]] 제거).\n* 뇌의 기능을 '''일시적으로 방해하는 비침습적 기법'''으로 발전.\n\n{exam}\n교수 강조(🎙 9/8 1부 32:22): \"신경계를 탐구하는 방법은 '''손상법이 가장 초기에''' 사용했던 방법이고 … 상당히 '''인과적인 설명'''을 내놓을 수 있는 방법이 손상법.\" (통합요약 §0-1 2장 교수 강조)\n{/exam}\n\n🎙 이어서 교수는 편도체가 손상된 쥐·사람이 무서운 장면을 봐도 공포가 산출되지 않는다는 예로 \"이렇게 [[편도체]]의 기능이 알려졌다\"고 설명했다(1부 37:35). 손상 사례 → 기능 추론의 전형.\n\n== 다른 기법과 비교 ==\n{| class=\"table\"\n! 기법 || 무엇을 보나 || 인과 추론 || 침습성\n|-\n| '''손상법''' || 없앴을 때의 기능 변화 || '''가능''' (원인을 직접 조작) || 침습적\n|-\n| [[뇌전도|EEG]]·[[사건 관련 전위|ERP]] || 활동의 '''시간''' 흐름 || 어려움 (함께 일어남을 관찰) || 비침습\n|-\n| [[fMRI]] || 활동의 '''위치''' || 어려움 || 비침습\n|}\n손상법이 인과적인 이유는 1장 [[실험법]]과 같다 — 연구자가 원인(뇌 부위)을 '''직접 조작'''하기 때문. 영상 기법은 \"이 부위가 활동할 때 이 행동이 나왔다\"는 [[상관]]적 관찰에 가깝다.\n\n{warn}\n\"손상법은 최신 비침습 기법이다\" ✗ → '''초기''' 연구법이며 '''침습적'''. \"비침습적 기법으로 발전했다\"는 것은 손상법의 '''후속''' 방향.\n{/warn}\n\n== 관련 문서 ==\n* [[2장 마음의 생물학과 의식]] (뇌 연구 기법 비교표) · [[편도체]] · [[시상하부]] · [[실험법]]\n\n근거: 2장 p.12"
 },
 "뇌전도": {

  "category": [

   "연구 방법"
  ],
  "body": "'''뇌전도'''(Electroencephalogram, EEG)는 두피에 전극을 붙여 '''뉴런의 전기 신호를 증폭'''해서 재는 방법이다. 2장 p.13. 특징은 단 하나로 외운다 — '''시간 해상도 높음, 공간 해상도 낮음'''. 이 문서는 같은 슬라이드의 '''뇌자도(MEG)'''를 흡수한다.\n\n{def}\n'''설명''': 뉴런에서 발생한 전기 신호를 증폭시켜 뇌의 활동을 탐구하는 방법. 시간적 해상도가 높아 활동 과정을 세밀하게 측정할 수 있지만 공간적 해상도는 낮아 영역별 활동 탐구는 어렵다 (2장 p.13)\n'''명칭''': [[뇌전도]] (EEG)\n{/def}\n\n{def}\n'''설명''': 뇌의 전기적 신호가 생성한 자기장을 기반으로 뇌의 활동을 탐구하는 방법. 시간적 해상도가 높고 공간적 해상도도 상당히 높은 편 (2장 p.13)\n'''명칭''': 뇌자도 (Magnetoencephalography, MEG)\n{/def}\n\n{analogy}\nEEG는 '''경기장 밖에서 듣는 함성 소리'''다. \"와!\" 하는 '''순간'''은 0.001초 단위로 정확히 알 수 있지만(시간 해상도↑), 벽 너머라 '''어느 구역''' 관중이 소리쳤는지는 모른다(공간 해상도↓). MEG는 소리 대신 관중석에서 나오는 '''자기장'''을 재는 고급 장비라, 언제와 어디를 둘 다 꽤 잘 잡는다 — 대신 엄청 비싸다.\n{/analogy}\n\n[[img:L2-13.png|2장 p.13 EEG와 MEG 촬영 — 왼쪽: 두피 전극 + 증폭기, 오른쪽: 자기장을 재는 헬멧형 장비|large]]\n\n== EEG vs MEG ==\n{| class=\"table\"\n! || '''EEG (뇌전도)''' || '''MEG (뇌자도)'''\n|-\n| 측정 대상 || 뉴런의 '''전기''' 신호를 증폭 || 전기 신호가 만든 '''자기장'''\n|-\n| 측정 방식 (🎙) || 두피에 전극을 직접 붙임 || 코일 형태로 자기장을 형성해 촬영\n|-\n| 시간 해상도 || '''높음''' || '''높음''' (인지 처리의 실시간 측정)\n|-\n| 공간 해상도 || '''낮음''' || '''상당히 높음''' (Memarian et al., 2012)\n|-\n| 기타 || 채널 수↑ → 근원 추적 분석 가능, 전자기파에 민감 || 뇌 심부 좌표까지 추적, 비쌈\n|}\n\n{exam}\n교수 강조(🎙 9/8 1부 40:19): 뇌 연구는 \"'''시간적 접근'''(작동 순서와 단계)\"과 \"'''공간적 접근'''(어느 영역)\"으로 나뉘며, \"'''뇌전도 접근법은 시간적인 흐름을 찾아가는 연구 방법'''\". 통합요약 §0-1: \"EEG·ERP는 시간 해상도가 높음.\"\n{/exam}\n\n[[img:L2-20.png|2장 p.20 시간·공간 해상도 비교 — EEG/ERP는 오른쪽 아래(시간↑ 공간↓), MEG는 오른쪽 위(둘 다↑)|medium]]\n\n== 실험 현장 (p.16, 🎙) ==\n[[img:L2-16.png|2장 p.16 뇌파 측정 실제 사례 — 차폐실 안 피험자·증폭기, 밖에 실험 제시용·뇌파 기록용 컴퓨터|medium]]\n* 뇌파는 전기 신호라 '''외부 전자기파에 굉장히 민감''' → 격벽으로 '''차폐''' 공간을 만든다.\n* 한 컴퓨터에서 두 프로그램을 돌리기 어려워 '''실험 제시용·뇌파 기록용''' 두 대를 케이블로 연결해 동기화.\n* 증폭기에서 증폭된 신호가 기록용 컴퓨터로 넘어간다.\n\nEEG 데이터를 자극 시점 기준으로 평균 내면 [[사건 관련 전위]](ERP)가 된다.\n\n{quiz}\n뇌전도(EEG)와 뇌자도(MEG)의 공통점과 차이점으로 옳은 것은? ① 둘 다 자기장을 측정한다 ② 둘 다 시간 해상도가 높지만, 공간 해상도는 MEG가 더 높다 ③ EEG는 공간 해상도가 매우 높다 ④ MEG는 방사성 포도당을 사용한다\n{/quiz}\n{answer}\n'''②'''. ① EEG는 전기 신호. ③ EEG는 공간 해상도가 낮다. ④ 방사성 포도당은 PET(p.17).\n{/answer}\n\n== 관련 문서 ==\n* [[사건 관련 전위]] · [[fMRI]] · [[손상법]] · [[2장 마음의 생물학과 의식]] (전체 비교표)\n\n근거: 2장 p.13, p.16, p.20"
 },
 "사건 관련 전위": {
  "title": "사건 관련 전위 (Event-Related Potential, ERP)",
  "category": [
   "2장 마음의 생물학과 의식",
   "연구 방법"
  ],
  "body": "'''사건 관련 전위'''(Event-Related Potential, ERP)는 [[뇌전도|EEG]]를 '''자극이 나온 순간에 맞춰 여러 번 겹쳐 평균'''한 파형이다. 슬라이드 제목에 \"'''번외'''\"가 붙어 있지만(p.14–15), 교수가 1부 40~50분대를 통째로 할애했고 통합요약 출제 예상 단답형 10번에 올라 있다.\n\n{def}\n'''설명''': 특정 자극 혹은 사건을 통해 촉발되는 두피 전위 변화의 평균량. 사건/자극 발생 시점을 기준으로 전위의 변화량을 기록하고, 두피에서 반복 측정된 뇌파 데이터를 종합·평균하여 산출한다 (2장 p.14)\n'''명칭''': [[사건 관련 전위]] (Event-Related Potential, ERP)\n{/def}\n\n{def}\n'''설명''': 특정 시점에 발생한 사건 관련 전위. 각각 알려진 기능이 있다 (예: 의미 정보 처리, 문법 정보 처리) (2장 p.14)\n'''명칭''': 컴포넌트 (Component) — N400 = 의미 정보 처리, P600 = 문법 정보 처리\n{/def}\n\n{analogy}\nERP는 '''장노출 사진 겹치기'''다. 시끄러운 거리에서 한 번 찍은 사진(EEG 한 번)은 잡음투성이다. 그런데 같은 장면(같은 자극)을 수십 번 찍어 '''셔터 순간을 맞춰''' 겹치면, 매번 다르게 움직이던 행인(잡음)은 흐려지고 늘 같은 자리에 있는 건물(자극에 대한 뇌 반응)만 또렷이 남는다. 그 또렷한 건물의 봉우리 하나하나가 '''컴포넌트'''다.\n{/analogy}\n\n[[img:L2-14.png|2장 p.14 ERP 예시 (Kim et al., 2026) — 위: 전극 배치도, 아래: 자극 시점 0ms 기준 평균 파형(P200, N400 구간 음영)|large]]\n\n== 슬라이드 내용 (p.14–15) ==\n* 특정 자극·사건으로 촉발되는 '''두피 전위 변화의 평균량'''.\n* 사건/자극 발생 '''시점을 기준'''으로 전위의 변화량을 기록.\n* '''컴포넌트''': 특정 시점에 발생한 ERP. 각 컴포넌트별로 알려진 기능이 있다 — '''N400 = 의미 정보 처리 / P600 = 문법 정보 처리'''.\n* 두피에서 '''반복 측정'''된 뇌파 데이터를 종합, '''평균'''하여 산출.\n* '''매우 우수한 시간적 해상도''': 밀리초(ms) 단위로 뇌파 변화 양상을 추적 → 뇌신경 활동의 시간적 변화 추적에 용이.\n* 반면 '''공간적 해상도는 저조''' — 슬라이드가 \"왜?\"라고 묻는다. 두피 바깥에서 재는 전기 신호라, 뇌 안 어디서 왔는지 역추적하기 어렵기 때문(→ [[뇌전도]]의 한계를 그대로 물려받음).\n\n<pre class=\"ascii\">\n 자극 제시 ──┬── 시행 1 파형 (잡음 많음)\n   (0ms)    ├── 시행 2 파형\n            ├── …           ──▶ 0ms 기준으로 정렬 후 평균 ──▶ ERP 파형\n            └── 시행 N 파형                                   ├─ N400 : 의미 처리\n                                                              └─ P600 : 문법 처리\n<\/pre>\n\n🎙 \"특정 시점에 자극 제시 이후 발생하는 전위들을 '''컴포넌트'''라고 표현. N400과 P600이라는 컴포넌트가 있다\"(9/8 1부 44:58). \"사건 관련 전위가 발생하는 것도 사람마다 차이가 있다\"(46:51).\n\n{info}\nN400의 \"N\"은 음(negative) 방향, \"400\"은 자극 후 약 400ms를 뜻하는 이름 붙이기 방식이다. 시험에서는 '''N400 = 의미, P600 = 문법''' 매칭만 알면 된다.\n{/info}\n\n== EEG와의 관계 ==\n{| class=\"table\"\n! || [[뇌전도|EEG]] || '''ERP'''\n|-\n| 정체 || 뇌의 전기 신호 원자료 || EEG를 자극 시점 기준으로 '''평균'''한 것\n|-\n| 시간 해상도 || 높음 || 매우 높음 (ms)\n|-\n| 공간 해상도 || 낮음 || 저조\n|-\n| 대표 결과 || 뇌파 리듬(베타·알파·델타…) || 컴포넌트(N400, P600)\n|}\n\n{warn}\n\"ERP = 단일 뉴런 하나의 [[활동 전위]]\" ✗. ERP는 두피에서 잰 '''수많은 뉴런 활동의 합을 여러 번 평균'''한 것. 또 \"ERP는 공간 해상도가 우수하다\" ✗.\n{/warn}\n\n== 관련 문서 ==\n* [[뇌전도]] · [[fMRI]] · [[2장 마음의 생물학과 의식]] (p.20 해상도 비교)\n\n근거: 2장 p.14–16, p.20"
 },
 "fMRI": {
  "title": "기능적 자기공명 영상 (fMRI)",
  "category": [
   "2장 마음의 생물학과 의식",
   "연구 방법"
  ],
  "body": "'''fMRI'''(functional Magnetic Resonance Imaging, 기능적 자기공명 영상)는 뇌의 '''혈중 산소 농도(BOLD) 신호'''로 \"어디가 일하고 있나\"를 찍는 기법이다. 같은 슬라이드(p.18)의 '''MRI'''와 짝으로 나오며, 이 문서는 MRI와 BOLD를 흡수한다. 핵심 구분: '''MRI = 구조, fMRI = 기능'''.\n\n{def}\n'''설명''': 뇌의 혈중 산소 농도(BOLD) 신호를 추적하여 뇌의 기능적 활동을 추적하는 기법. 매우 높은 공간적 해상도로 심리 기능의 담당 영역 탐구에 적합 (2장 p.18)\n'''명칭''': [[fMRI]] (기능적 자기공명 영상, functional Magnetic Resonance Imaging)\n{/def}\n\n{def}\n'''설명''': 두뇌에 강력한 자기장을 조사하여 뇌를 구성하는 원자들이 재정렬할 때 발생하는 신호를 촬영해 두뇌와 구성 조직의 구조를 촬영하는 기법. 이것만으로는 신경 활동 관찰이 어렵다 (2장 p.18)\n'''명칭''': 자기공명 영상법 (Magnetic Resonance Imaging, MRI)\n{/def}\n\n{def}\n'''설명''': fMRI가 뇌의 기능적 활동을 추적하는 데 쓰는, 혈중 산소 농도에 의존하는 신호 (2장 p.18)\n'''명칭''': BOLD 신호 (Blood Oxygen Level Dependent)\n{/def}\n\n{analogy}\nMRI는 '''건물 설계도''', fMRI는 '''야간에 불 켜진 창문 지도'''다. 설계도(MRI)만 보면 방이 어디 있는지는 정확히 알지만 지금 누가 일하는지는 모른다. 밤에 불 켜진 창문(일하는 뇌 부위는 산소 공급이 늘어 BOLD 신호↑)을 보면 '''어느 방'''에서 일하는지는 정확히 보이지만, 불이 켜지고 꺼지는 데 시간이 걸려 '''정확히 몇 초에''' 일을 시작했는지는 흐릿하다(시간 해상도↓).\n{/analogy}\n\n[[img:L2-18.png|2장 p.18 MRI로 촬영한 정상인과 조현병 환자 뇌 — 빨간 화살표가 가리키는 뇌실 크기 차이(구조 비교)|large]]\n\n== MRI vs fMRI ==\n{| class=\"table\"\n! || '''MRI''' (자기공명 영상법) || '''fMRI''' (기능적 자기공명 영상)\n|-\n| 원리 || 강력한 자기장 → 원자 재정렬 시 신호 || '''BOLD'''(혈중 산소 농도) 신호 추적\n|-\n| 보는 것 || 두뇌·조직의 '''구조''' || 뇌의 '''기능적 활동'''\n|-\n| 신경 활동 관찰 || '''어려움''' || 가능\n|-\n| 공간 해상도 || 높음 || '''매우 높음'''\n|-\n| 쓰임 || 정상인 vs 조현병 환자 뇌 구조 비교(p.18 그림) || 심리 기능의 '''담당 영역''' 탐구\n|}\n\n== 해상도 위치 (p.20) ==\n[[img:L2-20.png|2장 p.20 — fMRI/PET는 왼쪽 위: 높은 공간 해상도, 낮은 시간 해상도|medium]]\nfMRI는 [[뇌전도|EEG]]·[[사건 관련 전위|ERP]]와 정반대 자리다. \"어디(where)\"는 fMRI, \"언제(when)\"는 EEG/ERP.\n\n== fMRI vs DSI ==\n[[확산 스펙트럼 영상|DSI]] 슬라이드(p.19)가 직접 비교한다: fMRI는 '''회질'''에서 발생한 BOLD 신호의 활성화를 측정, DSI는 '''백질''' 신경 섬유의 물 분자 확산으로 연결 구조를 촬영.\n\n{warn}\nbank 오답 보기: \"MRI는 BOLD 신호로 신경 활동을 촬영한다\" ✗ → BOLD는 '''f'''MRI. \"fMRI는 백질의 물 분자 확산을 측정한다\" ✗ → 그건 DSI(뒤바꾼 함정).\n{/warn}\n\n== 관련 문서 ==\n* [[확산 스펙트럼 영상]] · [[뇌전도]] · [[사건 관련 전위]] · [[2장 마음의 생물학과 의식]] (PET 포함 비교표)\n\n근거: 2장 p.18–20"
 },
