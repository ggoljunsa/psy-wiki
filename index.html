   "연구 방법"
  ],
  "body": "'''확산 스펙트럼 영상'''(Diffusion Spectrum Imaging, DSI)은 뇌 속 '''배선도(신경 섬유 연결 지도)'''를 그리는 영상 기법이다. 2장 p.19. 통합요약 출제 예상 단답형 8번, bank 객관식(fMRI vs DSI)에 나온다.\n\n{def}\n'''설명''': 백질의 신경 섬유 주변 물 분자 확산을 토대로 신경 섬유의 연결 구조를 촬영하는 뇌 영상 기법. 두뇌 내에 존재하는 신경 통로의 지도를 그리는 데 활용 (2장 p.19)\n'''명칭''': [[확산 스펙트럼 영상]] (Diffusion Spectrum Imaging, DSI)\n{/def}\n\n{analogy}\nfMRI가 '''어느 동네에 불이 켜졌나'''(회질의 활동)를 본다면, DSI는 '''동네와 동네를 잇는 도로망'''(백질의 신경 섬유)을 그린다. 원리는 '''물이 흐르는 방향'''이다. 물 분자는 섬유 다발을 따라 길쭉하게 퍼지기 쉬워서, 퍼지는 방향을 이어 붙이면 \"어디서 어디로 연결돼 있나\"가 드러난다 — 마치 비 온 뒤 물길을 보고 배수로 지도를 그리는 것.\n{/analogy}\n\n[[img:L2-19.png|2장 p.19 DSI로 촬영한 신경 섬유 연결 지도 — 색깔은 섬유 방향|large]]\n\n== 슬라이드 내용 (p.19) ==\n* 뇌 영상 촬영 방식의 한 종류.\n* [[fMRI]]는 '''회질'''에서 발생한 BOLD 신호의 활성화를 측정.\n* 반면 DSI는 '''백질'''의 신경 섬유의 '''물 분자 확산'''을 토대로 신경 섬유의 '''연결 구조'''를 촬영.\n* 두뇌 내에 존재하는 '''신경 통로의 지도'''를 그리는 데 활용.\n* 🎙 \"백질에 분포된 축색 신경 섬유 주변에 물 분자가 확산돼 퍼지는 걸 기록 → 정보 흐름이 어디서 발생하고 어느 영역이 어디랑 연결돼 있는지, 신경 통로의 지도를 그릴 수 있다\"(9/8 2부 00:00–02:44). 메모: \"확산 스펙트럼 / 확산 텐서\".\n\n== fMRI vs DSI ==\n{| class=\"table\"\n! || [[fMRI]] || '''DSI'''\n|-\n| 어느 조직 || '''회질''' (신경세포체가 모인 곳) || '''백질''' (축색 섬유 다발)\n|-\n| 무엇을 재나 || BOLD 신호의 활성화 || 물 분자의 '''확산'''\n|-\n| 결과물 || 활동하는 '''영역''' || 영역 사이의 '''연결 구조'''(신경 통로 지도)\n|}\n\n{quiz}\nfMRI와 DSI의 비교로 옳은 것은? ① fMRI는 회질의 BOLD, DSI는 백질의 물 분자 확산 ② fMRI는 백질 확산, DSI는 회질 BOLD ③ 둘 다 방사성 포도당 주사 ④ DSI는 ms 단위 전기 활동 추적에 가장 적합\n{/quiz}\n{answer}\n'''①'''. ②는 뒤바꾼 함정. ③ 방사성 포도당은 PET. ④ ms 단위 추적은 EEG/ERP.\n{/answer}\n\n{joke}\np.29 분할 뇌 슬라이드 왼쪽의 알록달록한 뇌 사진도 이런 섬유 연결 영상이다. 가운데를 가로지르는 다발이 바로 [[뇌량]] — DSI는 뇌량 같은 \"다리\"를 보기에 딱이다.\n{/joke}\n\n== 관련 문서 ==\n* [[fMRI]] · [[뇌량]] · [[2장 마음의 생물학과 의식]]\n\n근거: 2장 p.19"
 },
 "뇌간": {
  "title": "뇌간 (Brainstem)",
  "category": [
   "2장 마음의 생물학과 의식",
   "뇌 구조"
  ],
  "body": "'''뇌간'''(Brainstem)은 척수 바로 위, 뇌의 '''가장 오래된 부분'''이다. 숨 쉬고 심장 뛰게 하는, 의식하지 않아도 돌아가는 생명 유지 장치가 여기 있다. 이 문서는 같은 슬라이드(p.21)의 '''연수·뇌교·망상체'''를 흡수한다.\n\n{def}\n'''설명''': 연수와 뇌교로 이루어진 뇌의 가장 오래된 부분 (2장 p.21)\n'''명칭''': [[뇌간]] (Brainstem)\n{/def}\n\n{analogy}\n뇌간은 건물의 '''지하 기계실'''이다. 보일러(호흡)·펌프(심장)를 돌리는 연수, 엘리베이터·조명 스케줄(움직임·수면)을 관리하는 뇌교, 그리고 1층 로비의 '''경비실'''(망상체)이 들어오는 사람 중 중요한 손님만 위층에 올려 보내고 건물 전체의 \"영업 중/영업 종료\"(각성) 스위치를 쥐고 있다. 사장(대뇌)이 신경 안 써도 알아서 돈다.\n{/analogy}\n\n[[img:L2-21.png|2장 p.21 뇌 심부 구조(시상~연수) — 위에서부터 시상, 망상체, 뇌교, 연수(뇌교+연수=뇌간)|large]]\n\n== 구성 ==\n{| class=\"table\"\n! 부위 || 기능 (p.21 문장) || 한 단어\n|-\n| '''연수''' (medulla) || 심장 활동과 허파의 호흡 조절 || 생명\n|-\n| '''뇌교''' (pons) || 움직임 조절과 수면 제어 || 움직임·수면\n|-\n| '''망상체''' (Reticular formation) || 유입된 자극에서 중요한 정보를 필터링, 각성(Arousal) 제어 || 필터·각성\n|}\n\n=== 연수 ===\n{def}\n'''설명''': 뇌간을 이루는 부분으로, 심장 활동과 허파의 호흡을 조절한다 (2장 p.21)\n'''명칭''': 연수 (Medulla)\n{/def}\n\n=== 뇌교 ===\n{def}\n'''설명''': 뇌간을 이루는 부분으로, 움직임 조절과 수면 제어를 담당한다 (2장 p.21)\n'''명칭''': 뇌교 (Pons)\n{/def}\n\n=== 망상체 ===\n{def}\n'''설명''': 유입된 자극에서 중요한 정보를 필터링하고, 각성(Arousal) 제어를 담당하는 구조 (2장 p.21)\n'''명칭''': 망상체 (Reticular Formation)\n{/def}\n\n== 뇌간과 다른 장면 ==\n* REM 수면 때 \"'''뇌간이 근육으로 가는 신호를 차단'''\"해서 겉으로는 이완된 상태가 된다(p.36 → [[수면과 꿈]]).\n* 🎙 \"심부 구조는 옛날부터 있었던 영역, 생명 활동 담당, '''의식적 노력 없이''' 자연스럽게 일어남\"(9/8 2부 03:46, 15:08).\n\n[[anim:brain_regions|첫 장면의 뇌간(연수: 심장·호흡) 하이라이트를 확인하라]]\n\n{warn}\n연수 vs 뇌교 뒤바꾸기 함정: '''심장·호흡 = 연수''', '''움직임·수면 = 뇌교'''. 그리고 \"심장 활동과 호흡 조절\"을 [[시상]]이나 [[소뇌]]에 붙인 보기는 ✗ (bank MC 오답 보기).\n{/warn}\n\n== 관련 문서 ==\n* [[시상]] · [[소뇌]] · [[수면과 꿈]]\n\n근거: 2장 p.21, p.25, p.36"
 },
 "시상": {
  "title": "시상 (Thalamus)",
  "category": [
   "2장 마음의 생물학과 의식",
   "뇌 구조"
  ],
  "body": "'''시상'''(Thalamus)은 감각 정보의 '''관문(중계소)'''이다. 눈·귀·피부로 들어온 신호는 시상을 거쳐 대뇌의 각 감각 피질로 간다 — '''단, 후각만 빼고'''. 이 \"후각 예외\"가 교수가 직접 짚은 시험 포인트다.\n\n{def}\n'''설명''': 두뇌의 감각 제어 중추. 후각을 제외한 모든 감각을 수용하여 대뇌의 각 감각 피질에 전달한다(감각 정보의 관문). 두뇌의 명령을 연수와 소뇌에 전달 (2장 p.21)\n'''명칭''': [[시상]] (Thalamus)\n{/def}\n\n{analogy}\n시상은 '''공항 입국 심사대'''다. 시각·청각·촉각 승객은 모두 이 심사대를 거쳐 각자의 도착 게이트(시각 피질, 청각 피질, 체감각 피질)로 간다. 그런데 '''후각만 VIP 전용 통로'''로 심사대를 건너뛰고 바로 들어간다. \"시상 = 후각 빼고 다\"로 외우면 끝.\n{/analogy}\n\n[[img:L2-21.png|2장 p.21 — 뇌 심부 구조 맨 위의 시상. 아래로 망상체·뇌교·연수|medium]]\n\n[[anim:brain_regions|시각·청각·촉각 화살표는 시상을 통과하고 후각 화살표만 우회하는 장면을 확인하라]]\n\n{exam}\n교수 강조(🎙 9/8 2부 05:52–08:29): \"시상은 감각 정보의 중추 역할. 후각을 제외한 나머지 감각은 1차적으로 감각 수용기를 통해 대뇌 피질로 전달된다. '''후각은 1차적으로 담당 영역으로 전달될 때 시상을 거치지 않음'''. 시상은 후각만 제외 — 간단하고 깔끔하다 정도로 보면 됨.\" (통합요약 §0-1 2장 교수 강조)\n{/exam}\n\n== 시상 vs 시상하부 ==\n이름이 비슷해서 단골 함정이다.\n{| class=\"table\"\n! || '''시상''' || [[시상하부]]\n|-\n| 역할 || 감각 정보의 '''관문'''(후각 제외) || '''항상성''' 유지를 위한 섭식, 보상 쾌감\n|-\n| [[변연계]] 소속? || '''아니다''' || '''맞다''' (시상하부·뇌하수체·편도체·해마)\n|-\n| 슬라이드 || p.21 || p.24\n|}\n\n{quiz}\n시상(thalamus)에 대한 설명으로 옳은 것은? ① 후각을 포함한 모든 감각을 예외 없이 시상을 거쳐 전달한다 ② 후각을 제외한 감각 정보를 받아 대뇌의 각 감각 피질에 전달하는 관문이다 ③ 심장 활동과 허파의 호흡을 조절한다 ④ 정교한 운동과 협응, 비언어적 학습·기억에 관여한다\n{/quiz}\n{answer}\n'''②'''. ① 후각 예외를 지운 함정. ③ 연수([[뇌간]]). ④ [[소뇌]].\n{/answer}\n\n{warn}\n\"변연계 구성원이 '''아닌''' 것은?\" 문제의 정답이 '''시상'''으로 나온다(bank MC). 시상하부와 헷갈리지 말 것.\n{/warn}\n\n== 관련 문서 ==\n* [[시상하부]] · [[변연계]] · [[뇌간]] · [[대뇌 피질]] (감각 피질)\n\n근거: 2장 p.21"
 },
 "소뇌": {
  "title": "소뇌 (Cerebellum)",
  "category": [
   "2장 마음의 생물학과 의식",
   "뇌 구조"
  ],
  "body": "'''소뇌'''(Cerebellum)는 뇌 뒤쪽 아래, 척수 위에 붙은 \"작은 뇌\"다. 정교한 움직임과 '''협응''', 그리고 말로 설명하기 어려운 '''비언어적 학습·기억'''을 맡는다. 6장에서는 [[암묵 기억]] 체계(파블로프 조건 형성)의 담당으로 다시 나온다.\n\n{def}\n'''설명''': 신체 운동(정교한 움직임 포함) 및 비언어적 학습과 기억에 관여하고, 정서와 사회 운동 제어에 기여하며, 시간 판별 및 소리/질감 구분, 다양한 활동 간의 협응을 주관하는 구조 (2장 p.22)\n'''명칭''': [[소뇌]] (Cerebellum)\n{/def}\n\n{analogy}\n소뇌는 '''오케스트라 지휘자'''다. 악기 하나하나(근육)를 직접 연주하진 않지만, 바이올린·첼로·드럼이 '''박자를 맞춰''' 함께 울리도록 조율한다(협응, 시간 판별). 자전거 타기처럼 \"어떻게 하는지 말로는 설명 못 하지만 몸이 아는\" 기억도 이 지휘자가 악보 없이 외우고 있다(비언어적 학습·기억).\n{/analogy}\n\n[[img:L2-22.png|2장 p.22 소뇌와 척수 — 대뇌 아래 뒤쪽의 주름진 구조|medium]]\n\n== 기능 정리 (p.22) ==\n{| class=\"table\"\n! 영역 || 내용\n|-\n| 운동 || 신체 운동(정교한 움직임 포함), '''다양한 활동 간의 협응'''\n|-\n| 학습·기억 || '''비언어적''' 학습과 기억\n|-\n| 기타 || 정서와 사회 운동 제어에 기여, 시간 판별, 소리/질감 구분\n|}\n\np.25 종합 그림의 설명: \"수의적 운동과 균형 조정, 그리고 그 운동과 균형의 학습과 기억을 지원\".\n\n== 다른 장에서 ==\n6장 p.28: [[암묵 기억]] 체계는 '''소뇌와 기저 신경절'''이 담당하며, 소뇌는 [[고전적 조건화|파블로프 조건 형성]]을 담당한다(Green & Woodruff-Pak, 2000). 해마가 손상돼도 암묵 기억은 정상 작동할 수 있다.\n\n{| class=\"table\"\n! 헷갈리는 짝 || 소뇌 || [[해마]]\n|-\n| 기억 종류 || '''비언어적'''·암묵 기억 (몸이 아는 것) || 의식적·'''명시적''' 기억 (말할 수 있는 것)\n|-\n| 예 || 자전거, 조건 반응 || 어제 점심 메뉴\n|}\n\n[[anim:brain_regions|소뇌(협응) 하이라이트 장면을 보라]]\n\n{warn}\nbank 오답 보기: \"정교한 신체 운동·협응·비언어적 학습\"을 [[시상]]이나 [[편도체]]에 붙이면 ✗ — 전부 소뇌. 반대로 \"위협 상황에서 공포를 못 느낌\"을 소뇌 손상으로 고르면 ✗(편도체).\n{/warn}\n\n== 관련 문서 ==\n* [[뇌간]] · [[암묵 기억]] · [[해마]]\n\n근거: 2장 p.22, p.25; 6장 p.28"
 },
 "변연계": {
  "title": "변연계 (Limbic System)",
  "category": [
   "2장 마음의 생물학과 의식",
   "뇌 구조"
  ],
  "body": "'''변연계'''(Limbic System)는 '''정서와 추동'''을 담당하는 뇌 구조들의 '''시스템'''이다. 구성원은 정확히 넷 — '''시상하부, 뇌하수체, 편도체, 해마'''. 🎙 교수는 \"변연계는 네 가지 영역을 포함한 일종의 시스템 체계에 가깝다\"고 했다(9/8 2부 08:29). 이 문서는 '''추동'''을 흡수한다.\n\n{def}\n'''설명''': 정서 및 추동을 담당하며, 시상하부·뇌하수체·편도체·해마가 하나의 시스템을 구성하는 뇌 구조 (2장 p.23)\n'''명칭''': [[변연계]] (Limbic System)\n{/def}\n\n=== 추동 ===\n{def}\n'''설명''': 결핍 상황에 대한 해결을 위해 행동하게 하는 동기적 힘 (2장 p.23)\n'''명칭''': 추동 (Drive)\n{/def}\n\n{analogy}\n변연계는 '''감정·욕구 4인 팀'''이다. '''편도체'''는 경보 담당(\"위험해! 무서워!\"), '''시상하부'''는 온도조절기·식욕 담당(\"배고프니 먹어라\" — 항상성), '''뇌하수체'''는 호르몬 방송실, '''해마'''는 오늘 있었던 일을 일기장에 옮겨 적는 기록원. 이 팀이 \"뭔가 부족하다 → 움직여라\"는 '''추동'''을 만든다. 배고픔이 냉장고 문을 열게 만드는 그 힘.\n{/analogy}\n\n[[img:L2-23.png|2장 p.23 변연계의 구성원 및 구조 — 시상하부·뇌하수체·편도체·해마|large]]\n\n== 구성원 4개 ==\n{| class=\"table\"\n! 구성원 || 기능 (p.24) || 사례\n|-\n| [[시상하부]] || 항상성 유지를 위한 섭식, 보상 쾌감 || Olds(1975), 쥐 시상하부 제거\n|-\n| 뇌하수체 || 🎙 호르몬 분비(내분비선) 관련 || p.25 그림: \"내분비선 제어\"\n|-\n| [[편도체]] || 공격·공포·분노의 인지 || 환자 S.M\n|-\n| [[해마]] || 의식적·명시적 기억 || 해마 손상 → 새 정보 기억 곤란\n|}\n\n{def}\n'''설명''': 변연계의 구성원으로, 호르몬 분비(내분비선 제어)와 관련된 구조 (2장 p.23, p.25)\n'''명칭''': 뇌하수체 (Pituitary Gland)\n{/def}\n\n{info}\n🎙 교수는 2부 15:08–18:59 구간에서 \"심부 구조 설명에서 '''뇌하수체를 빼먹었는데''', 내분비선·호르몬 분비와 관련된 기능을 담당한다\"고 덧붙였다. 슬라이드 본문(p.24)에는 뇌하수체 설명 칸이 없어서 빠뜨리기 쉽다.\n{/info}\n\n[[anim:brain_regions|변연계 장면에서 편도체(공포)·해마(새 기억)·시상하부(항상성)가 차례로 켜지는 것을 보라]]\n\n{quiz}\n다음 중 변연계를 구성하는 구조에 해당하지 '''않는''' 것은? ① 편도체 ② 해마 ③ 뇌하수체 ④ 시상\n{/quiz}\n{answer}\n'''④ 시상'''. 이름이 비슷한 '''시상하부'''는 변연계지만 '''[[시상]]'''은 감각 정보의 관문이다(bank MC).\n{/answer}\n\n== 관련 문서 ==\n* [[편도체]] · [[시상하부]] · [[해마]] · [[시상]]\n\n근거: 2장 p.23–25"
 },
 "편도체": {
  "title": "편도체 (Amygdala)",
  "category": [
   "2장 마음의 생물학과 의식",
   "뇌 구조"
  ],
  "body": "'''편도체'''(Amygdala)는 [[변연계]]의 '''경보기'''다. 공격·공포·분노를 인지하고, 부정적 사건을 더 잘 기억하게 만든다. 손상되면 위협 앞에서도 '''공포를 느끼지 못한다'''(환자 S.M). 6장에서는 [[섬광 기억]] 같은 정서 관련 기억의 담당 영역으로 다시 나온다.\n\n{def}\n'''설명''': 공격과 공포, 분노에 대한 인지를 담당하며, 부정적 사건에 대한 기억을 더 잘 유지시켜 주는 데 기여하는 변연계 구조. 손상 환자는 위협 상황에서 공포를 느끼지 못한다 (2장 p.24)\n'''명칭''': [[편도체]] (Amygdala)\n{/def}\n\n{def}\n'''사례형 설명''': 환자 A는 위협적인 장면을 보아도 공포를 느끼지 못한다. 손상되었을 가능성이 가장 높은 부위는?\n'''명칭''': 편도체 (환자 S.M 사례)\n{/def}\n\n{analogy}\n편도체는 집의 '''화재경보기'''다. 연기(위협)를 감지하면 \"삐삐삐!\"(공포·분노) 하고 온몸을 비상 모드로 만든다. 경보기가 떼어진 집(편도체 손상, 환자 S.M)은 불이 나도 조용하다 — 평온해 보이지만 사실 아주 위험하다. 그리고 한 번 크게 울렸던 날(부정적 사건)은 오래도록 기억에 남는다.\n{/analogy}\n\n[[img:L2-24.png|2장 p.24 변연계의 구성원 및 구조 — 편도체·시상하부·해마 설명|medium]]\n\n== 슬라이드 내용 (p.24) ==\n* 공격과 공포, 분노에 대한 인지를 담당.\n* 편도체 손상 환자는 위협 상황에서 공포를 느끼지 못함 ('''환자 S.M''').\n* 부정적 사건에 대한 기억을 더 잘 유지시켜 주는 데 기여.\n* 🎙 \"편도체는 공포 정서를 담당하는 걸로 알려져 있음. 인위적으로 편도체를 제거한 쥐를 탐구, 편도체가 손상된 분들이 굉장히 무서운 장면·위협적인 장면을 보더라도 공포감이 산출되지 않음\"(9/8 1부 37:35) → [[손상법]]으로 기능을 알아낸 대표 사례.\n\n== 6장과의 연결 ==\n6장 p.29 \"정서 관련 기억 — 담당 영역: 편도체\". 정서가 스트레스 호르몬 분비를 촉발하고, 자극된 편도체가 기억 흔적을 활성화해 더 강력한 기억을 만든다 → [[섬광 기억]](정서적으로 중대한 순간에 대한 선명한 기억).\n\n== 비슷한 이웃과 구분 ==\n{| class=\"table\"\n! 손상 증상 || 부위\n|-\n| 위협 상황에서 '''공포를 못 느낌''' || '''편도체'''\n|-\n| '''새로운 정보'''를 기억하기 어려움 || [[해마]]\n|-\n| 섭식·항상성 이상 || [[시상하부]]\n|-\n| 정교한 움직임·협응 곤란 || [[소뇌]]\n|}\n\n{warn}\nbank MC: \"A는 공포를 못 느끼고 B는 새 정보를 기억 못 한다 → (A, B)\" 정답은 '''(편도체, 해마)'''. 순서를 뒤바꾼 \"(해마, 편도체)\"가 오답 보기로 나온다.\n{/warn}\n\n[[anim:brain_regions|변연계 장면의 편도체(공포) 하이라이트를 보라]]\n\n== 관련 문서 ==\n* [[변연계]] · [[해마]] · [[섬광 기억]] · [[손상법]]\n\n근거: 2장 p.24; 6장 p.29"
 },
 "시상하부": {
  "title": "시상하부 (Hypothalamus)",
  "category": [
   "2장 마음의 생물학과 의식",
   "뇌 구조"
  ],
  "body": "'''시상하부'''(Hypothalamus)는 [[시상]] 바로 아래에 있는 작은 구조로, 몸의 내부 상태를 일정하게 지키는 '''항상성''' 유지(특히 섭식)를 맡는다. [[변연계]] 구성원이다. 이 문서는 '''항상성'''을 흡수한다.\n\n{def}\n'''설명''': 항상성 유지를 위한 섭식 기능을 담당하고, 보상에 대한 쾌감과 같은 정서에도 관여하는 변연계 구조 (2장 p.24, Olds, 1975)\n'''명칭''': [[시상하부]] (Hypothalamus)\n{/def}\n\n=== 항상성 ===\n{def}\n'''설명''': 인간의 내적 상태를 일정하게 유지하려는 것 (2장 p.24)\n'''명칭''': 항상성 (Homeostasis)\n{/def}\n\n{analogy}\n시상하부는 '''집의 온도조절기(서모스탯)'''다. 설정 온도(적정 상태)보다 내려가면 보일러를 켜고(배고프면 먹게 함), 올라가면 끈다(배부르면 멈춤). 이렇게 실내를 늘 일정하게 맞추는 게 '''항상성'''. 덤으로 \"잘했어!\" 하는 보상 쾌감 스위치도 이 근처에 있다(Olds, 1975).\n{/analogy}\n\n[[img:L2-24.png|2장 p.24 — 가운데 시상하부: 항상성 유지를 위한 섭식, 보상 쾌감|medium]]\n\n== 슬라이드 내용 (p.24) ==\n* '''항상성 유지를 위한 섭식 기능'''.\n* 보상에 대한 '''쾌감'''과 같은 정서에도 관여 (Olds, 1975).\n* p.25 종합 그림 설명: \"섭식과 같은 기능 유지, 통제, 내분비계 관장, 정서와 관련\".\n* [[손상법]] 예시(p.12): '''쥐의 시상하부 제거''' — 동물 대상 침습적 연구.\n* 🎙 \"시상하부는 항상성 유지를 위한 섭식 기능을 갖고 있음\"(9/8 2부 09:34).\n\n== 시상 vs 시상하부 ==\n{| class=\"table\"\n! || [[시상]] || '''시상하부'''\n|-\n| 위치 || 뇌 심부, 감각 중계 || 시상의 '''아래'''\n|-\n| 기능 || 감각 정보의 관문(후각 제외) || 항상성(섭식), 보상 쾌감\n|-\n| 변연계? || ✗ || ○\n|}\n\n{warn}\n\"시상하부 = 감각 정보의 관문\" ✗ (그건 시상). \"시상하부 = 새로운 기억 형성\" ✗ (해마). bank MC에서 \"시상하부, 해마\"는 \"공포 못 느낌 + 새 정보 기억 곤란\"의 오답 짝으로 쓰였다.\n{/warn}\n\n== 관련 문서 ==\n* [[변연계]] · [[시상]] · [[손상법]]\n\n근거: 2장 p.12, p.24–25"
 },
 "해마": {
  "title": "해마 (Hippocampus)",
  "category": [
   "2장 마음의 생물학과 의식",
   "뇌 구조"
  ],
  "body": "'''해마'''(Hippocampus)는 '''의식적이고 명시적인 기억'''을 처리하는 [[변연계]] 구조다. 2장에서 두 번(p.4 택시 운전사, p.24 기능) 나오고, 6장에서 [[외현 기억]]·[[기억 응고화]]·[[기억상실증]]의 주인공으로 다시 등장한다. 이름은 모양이 바닷속 해마(sea horse)를 닮아서.\n\n{def}\n'''설명''': 의식적이고 명시적인 기억을 처리하는 변연계 구조. 손상 환자는 새로운 정보를 기억하는 것이 어렵다 (2장 p.24, Jayakar et al., 2015)\n'''명칭''': [[해마]] (Hippocampus)\n{/def}\n\n{analogy}\n해마는 '''저장 버튼'''이다. 문서(오늘 겪은 일)를 작성하고 Ctrl+S를 눌러야 하드디스크(장기 기억)에 남는다. 해마가 망가지면 저장 버튼이 고장 난 것 — 지금 화면의 내용은 보이지만 창을 닫는 순간 사라진다(새 정보 기억 곤란). 이미 저장해 둔 옛 파일은 대체로 열린다. 이게 「메멘토」 주인공의 상태다.\n{/analogy}\n\n[[img:L2-24.png|2장 p.24 — 아래 해마: 의식적·명시적 기억 처리, 손상 시 새 정보 기억 곤란|medium]]\n\n== 2장에서의 등장 ==\n{| class=\"table\"\n! 슬라이드 || 내용\n|-\n| p.4 [[신경 가소성]] || 영국 '''택시 운전사'''의 해마가 버스 운전사보다 더 큼 (Maguire et al., 2006)\n|-\n| p.23 [[변연계]] || 시상하부·뇌하수체·편도체와 함께 변연계 구성\n|-\n| p.24 || 의식적·명시적 기억 처리, 손상 시 새 정보 기억 곤란\n|-\n| p.31 의식 || 🎙 장면을 회상시켰을 때 해마 뉴런이 몇 번 발화하는지 잰 연구 (2부 37:10)\n|}\n\n== 기억상실의 두 유형 (🎙 9/8) ⭐⭐⭐ ==\n교수는 해마 손상 이야기에서 바로 기억 상실 유형으로 넘어갔다(2부 13:26–18:59).\n\n{| class=\"table\"\n! || '''역행성''' 기억 상실 || '''순행성''' 기억 상실\n|-\n| 무엇을 잃나 || 손상·충격 '''이전'''의 기억을 떠올리지 못함 || 손상 '''이후''' 새 기억을 형성하지 못함\n|-\n| 영화 || 「'''제이슨 본'''」 시리즈 || 「'''메멘토'''」\n|-\n| 빈도 || 흔히 떠올리는 유형 || 🎙 빈도상 '''더 일반적'''\n|}\n\n{exam}\n통합요약 §0-1 2장 교수 강조: \"역행성 기억상실은 「제이슨 본」, 순행성은 「메멘토」.\" 6장 p.33에서 정식으로 다룬다 → [[기억상실증]] (환자 H.M은 해마 제거 후 순행성).\n{/exam}\n\n<pre class=\"ascii\">\n         손상 시점\n  과거 ─────●───── 미래\n  ◀── 역행성 ──┤├── 순행성 ──▶\n  옛 기억 인출 ✗     새 기억 형성 ✗\n  (제이슨 본)         (메멘토)\n<\/pre>\n\n== 6장과의 연결 ==\n* 6장 p.27: 외현 기억 시스템 = '''전두엽과 해마'''. 해마는 외현 기억의 저장을 담당하며 그 저장 과정이 [[기억 응고화]]. 수면이 응고화를 돕는다.\n* 6장 p.28: 해마·전두엽이 손상돼도 [[암묵 기억]] 체계(소뇌·기저 신경절)는 정상 작동 가능.\n\n{warn}\n\"해마 손상 → 공포를 못 느낌\" ✗ (편도체). \"해마 = 자전거 타기 같은 절차 기억 담당\" ✗ (소뇌·기저 신경절, 암묵 기억).\n{/warn}\n\n[[anim:brain_regions|변연계 장면에서 해마(새 기억) 하이라이트를 확인하라]]\n\n== 관련 문서 ==\n* [[기억상실증]] · [[외현 기억]] · [[신경 가소성]] · [[편도체]] · [[기억 응고화]]\n\n근거: 2장 p.4, p.23–24; 6장 p.27, p.33"
 },

  "body": "'''대뇌 피질'''(Cerebral Cortex)은 대뇌 표면의 주름진 층으로, 신체 통제와 정보 처리의 '''최고 중추'''다. [[뇌량]]을 기준으로 좌/우반구, 그리고 '''전두엽·두정엽·측두엽·후두엽''' 4엽으로 나뉜다. 이 문서는 4엽·운동 피질·체감각 피질·호문쿨루스를 흡수한다.\n\n{def}\n'''설명''': 대뇌(Cerebrum)에서 신체의 통제 및 정보 처리를 수행하는 기반 영역. 뇌량을 기준으로 좌/우반구로 나뉘며 전두엽·후두엽·두정엽·측두엽 4가지 영역으로 분류된다 (2장 p.26)\n'''명칭''': [[대뇌 피질]] (Cerebral Cortex)\n{/def}\n\n{analogy}\n대뇌 피질은 '''4개 부서가 있는 본사 꼭대기 층'''이다. 앞쪽 '''전두엽'''은 기획·실행부(맨 뒤 칸에 몸 움직이는 운동 피질), 정수리 '''두정엽'''은 촉감 접수·공간 계산부, 옆 '''측두엽'''은 소리·얼굴 담당부, 뒤통수 '''후두엽'''은 영상실(시각). 층 전체가 좌우 두 동(반구)으로 나뉘고, 두 동을 잇는 구름다리가 [[뇌량]]이다.\n{/analogy}\n\n[[img:L2-26.png|2장 p.26 대뇌 피질의 기본 4가지 구조 — 전두엽·두정엽·측두엽·후두엽, 오른쪽은 좌우 반구 단면|large]]\n\n== 4엽과 담당 기능 (p.26–28) ⭐⭐⭐ ==\n{| class=\"table\"\n! 엽 || 위치 || 1차 기능 (p.27) || 연합 기능 (p.28)\n|-\n| '''전두엽''' (Frontal) || 앞 || '''가장 뒷부분의 운동 피질''' → 운동 || 전전두엽: 판단·계획·억제·사회적 상호작용\n|-\n| '''두정엽''' (Parietal) || 정수리 || '''체감각 피질''' → 체감각 || 수학·공간 추리, 자극 시 환상 운동 감각\n|-\n| '''측두엽''' (Temporal) || 옆(귀 쪽) || '''청각 피질''' → 청각 || 얼굴 재인 (FFA)\n|-\n| '''후두엽''' (Occipital) || 뒤통수 || '''시각 피질''' → 시각 || —\n|}\n\n[[img:L2-27.png|2장 p.27 시각 및 청각 피질 — 뒤통수의 시각 피질, 옆머리의 청각 피질|medium]]\n\n=== 운동 피질 ===\n{def}\n'''설명''': 전두엽의 가장 뒷부분에 위치하여 운동 기능을 수행하는 피질 (2장 p.27)\n'''명칭''': 운동 피질 (Motor Cortex)\n{/def}\n\n=== 체감각 피질 ===\n{def}\n'''설명''': 두정엽에 위치하여 체감각 기능을 수행하는 피질 (2장 p.27)\n'''명칭''': 체감각 피질 (Somatosensory Cortex)\n{/def}\n\n=== 호문쿨루스 ===\n{def}\n'''설명''': 운동 및 체감각 피질의 담당 영역에 따라 그려낸 인간의 신체 부위 지도 (2장 p.27)\n'''명칭''': 호문쿨루스 (Homunculus)\n{/def}\n🎙 \"대뇌와 신체 감각 기관의 관계를 표준적으로 보여 주는 그림\"(9/8 2부 19:52). 손·입술처럼 섬세한 부위일수록 피질 담당 면적이 커서, 호문쿨루스는 손과 입이 거대한 기묘한 인형 모양이 된다.\n\n{joke}\n호문쿨루스(homunculus)는 라틴어로 \"작은 사람\". 피질 지도를 사람 모양으로 그리면 손이 대두만 하고 입술이 소시지만 한 캐릭터가 나온다. 키보드 치는 공대생 호문쿨루스는 손가락이 더 클지도.\n{/joke}\n\n[[anim:brain_regions|마지막 장면에서 4엽이 차례로 칠해지고 연합 영역으로 넘어가는 흐름을 보라]]\n\n{warn}\n위치 함정: \"운동 피질 = 두정엽\" ✗ → '''전두엽 가장 뒷부분'''. \"시각 = 측두엽\" ✗ → '''후두엽'''. \"호문쿨루스는 연합 영역의 크기에 따라 그린 지도\" ✗ → '''운동·체감각 피질''' (bank MC 오답 보기).\n{/warn}\n\n== 관련 문서 ==\n* [[연합 영역]] · [[뇌량]] · [[분할 뇌]] · [[시상]] (감각 피질로 가는 관문)\n\n근거: 2장 p.25–28"
 },
 "연합 영역": {
  "title": "연합 영역 (Association Area)",
  "category": [
   "2장 마음의 생물학과 의식",

  ],
  "body": "'''연합 영역'''(Association area)은 [[대뇌 피질]]에서 '''감각 영역과 운동 영역을 뺀 나머지 전부'''다. 뇌 전역에 퍼져 있고, 판단·계획·얼굴 재인·공간 추리 같은 고차 기능을 맡는다. 교수가 \"가장 중요한 특징\"이라며 짚은 문장 하나가 있다 — '''관찰할 수 있는 반응을 산출하지 않는다'''. 이 문서는 '''전전두엽'''을 흡수한다.\n\n{def}\n'''설명''': 감각 영역과 운동 영역을 제외한 나머지 광범위한 뇌의 영역. 그 활동은 어떤 관찰할 수 있는 반응을 산출하지 않으며, 뇌의 전 영역에 걸쳐 존재한다 (2장 p.28)\n'''명칭''': [[연합 영역]] (Association Area)\n{/def}\n\n{analogy}\n연합 영역은 회사의 '''기획실'''이다. 영업팀(운동 영역)처럼 물건을 팔지도, 접수처(감각 영역)처럼 손님을 받지도 않는다 — 밖에서 보면 '''아무것도 안 하는 것처럼''' 보인다(관찰 가능한 반응 없음). 하지만 접수된 정보를 엮어 전략을 짜고 영업팀에 무엇을 할지 알려 주는 곳이 여기다. 그래서 \"일하는지\" 확인하려면 출입 기록(EEG)이나 불 켜진 창문(fMRI)을 봐야 한다.\n{/analogy}\n\n[[img:L2-28.png|2장 p.28 전전두엽 손상 예시 — 쇠막대가 관통한 두개골 그림과 전두엽 손상 영상(빨간 상자)|large]]\n\n{exam}\n교수 강조(🎙 9/8 2부 19:52–22:48): \"연합 영역은 감각이랑 운동 영역을 제외한 나머지 영역. 연합 영역의 '''가장 중요한 특징은 어떤 관찰할 수 있는 반응을 산출하지 않는다는 것'''.\" 슬라이드에도 이 문장에 '''밑줄'''이 있다. 이어서 \"신경과학 기법을 활용하는 이유는 반응을 볼 수가 없기 때문\"(23:47). → 통합요약 §0-1 2장 교수 강조, 출제 예상 단답형 12번.\n{/exam}\n\n== 엽별 연합 기능 (p.28) ==\n{| class=\"table\"\n! 엽 || 연합 기능 || 연결 문서\n|-\n| '''전전두엽''' (prefrontal lobe) || 판단, 계획, 억제, 사회적 상호작용 || 그림: 전전두엽 손상 예시\n|-\n| '''측두엽''' (Temporal lobe) || 얼굴 재인 — Fusiform Face Area || [[방추상 얼굴 영역]] (4장 p.26)\n|-\n| '''두정엽''' (Parietal lobe) || 수학 및 공간 추리, 자극 시 환상 운동 감각 유발 || —\n|}\n\n=== 전전두엽 ===\n{def}\n'''설명''': 판단, 계획, 억제, 사회적 상호작용 등을 관할하는 연합 영역 (2장 p.28)\n'''명칭''': 전전두엽 (Prefrontal Lobe)\n{/def}\n\n== 왜 \"반응이 없다\"가 중요한가 ==\n🎙 교수는 여기서 서막의 [[생물심리사회적 접근법]]을 다시 꺼냈다: \"사람의 행동은 여러 기제가 조합된 '''최종 결과물'''이다 — 행동을 통합된 결과물로 이해하는 것이 맞다\"(2부 23:47). 행동만 봐서는 연합 영역 안에서 벌어지는 심적 과정이 보이지 않으니, p.12–20의 뇌 연구 기법이 필요하다는 논리다.\n\n{quiz}\n연합 영역에 대한 설명으로 옳은 것은? ① 감각·운동 영역을 제외한 광범위한 영역이며, 그 활동만으로는 관찰 가능한 반응을 산출하지 않는다 ② 전두엽에만 존재한다 ③ 얼굴 재인과 수학·공간 추리를 모두 전전두엽이 전담한다 ④ 호문쿨루스는 연합 영역의 크기에 따라 그린 지도다\n{/quiz}\n{answer}\n'''①'''. ② 뇌 전 영역에 존재. ③ 얼굴 재인은 측두엽(FFA), 수학·공간 추리는 두정엽. ④ 호문쿨루스는 운동·체감각 피질의 지도([[대뇌 피질]]).\n{/answer}\n\n== 관련 문서 ==\n* [[대뇌 피질]] · [[방추상 얼굴 영역]] · [[생물심리사회적 접근법]] · [[fMRI]]\n\n근거: 2장 p.28"
 },
 "뇌량": {

  "body": "'''뇌량'''(Corpus Callosum)은 대뇌의 '''좌반구와 우반구를 잇는 다리'''다. 축색 섬유 다발로 되어 있고, 이게 끊어지면 두 반구가 정보를 나눌 수 없다 → [[분할 뇌]]. 통합요약 출제 예상 단답형 13번.\n\n{def}\n'''설명''': 대뇌의 좌반구와 우반구를 연결하는 다리. 손상될 시 좌우반구 간의 정보 공유가 불가능하다 (2장 p.29)\n'''명칭''': [[뇌량]] (Corpus Callosum)\n{/def}\n\n{analogy}\n뇌량은 '''한강 다리'''다. 강북(좌반구)과 강남(우반구)은 각자 따로 돌아가는 동네지만, 다리를 통해 하루 종일 정보(차량)가 오간다. 다리가 모두 끊기면? 강북 사람은 강남에서 무슨 일이 있었는지 '''말로 전해 들을 길이 없다''' — 그게 분할 뇌 환자가 왼쪽 시야에 본 것을 말로 못 하는 이유다.\n{/analogy}\n\n[[img:L2-29.png|2장 p.29 — 왼쪽 섬유 연결 영상 가운데를 가로지르는 다발과 오른쪽 그림 아래 \"뇌량\"|large]]\n\n== 슬라이드 내용 (p.29) ==\n* 대뇌의 좌반구와 우반구를 연결하는 다리.\n* 뇌량이 손상될 시, '''좌우반구 간의 정보 공유가 불가'''.\n* 🎙 \"뇌량이 끊어지면 대뇌 좌우 반구 간의 정보 공유가 불가능 — 뇌량을 통해 정보 공유를 하지 않으면 '''온전한 정보 처리가 어려운''' 측면이 발생\"(9/8 2부 29:33).\n* p.25 종합 그림 설명: \"양 반구와 연결된 축색 섬유\".\n\n== 시야 → 반구 (교차) ==\n<pre class=\"ascii\">\n   좌시야(왼쪽 화면)            우시야(오른쪽 화면)\n          \\                        /\n           \\______        ______/\n                  \\  ✕  /          ← 시신경이 교차(시교차)\n                  /     \\\n       우반구 ◀──┘       └──▶ 좌반구 (언어)\n             └════ [[뇌량]] ════┘   ← 여기서 서로 정보 공유\n<\/pre>\n'''좌시야 → 우반구, 우시야 → 좌반구'''. 평소엔 뇌량이 두 반구 정보를 합쳐 주니까 아무 문제가 없다.\n\n[[anim:split_brain|뇌량에 가위가 들어가기 전과 후, 말 보고와 손 가리키기가 어떻게 달라지는지 보라]]\n\n{warn}\n4장 p.25 슬라이드에는 \"우시야의 입력 정보는 '''우반구'''로\"라고 잘못 적혀 있다. 맞는 것은 '''좌반구'''(2장 p.29). → [[분할 뇌]] 문서.\n{/warn}\n\n== 관련 문서 ==\n* [[분할 뇌]] · [[대뇌 피질]] · [[확산 스펙트럼 영상]] (섬유 연결 촬영)\n\n근거: 2장 p.25, p.29"
 },

  "body": "'''분할 뇌'''(Split Brain)는 [[뇌량]]이 끊어져 좌·우반구가 서로 정보를 나누지 못하는 상태, 그리고 그런 환자를 대상으로 한 '''가자니가(Gazzaniga)의 실험'''을 말한다. \"말하는 뇌(좌)\"와 \"보고도 말 못 하는 뇌(우)\"가 갈라지는 장면이 핵심이다. 이 문서는 '''가자니가'''와 '''기능의 편재화'''를 흡수한다.\n\n{def}\n'''설명''': 대뇌의 좌반구와 우반구를 연결하는 뇌량이 끊어져 좌우 반구 간 정보 공유가 불가능해진 뇌 (2장 p.29–30)\n'''명칭''': [[분할 뇌]] (Split Brain)\n{/def}\n\n{def}\n'''설명''': 분할 뇌 실험이 보여 준, 좌우 반구의 기능 상 차이가 있다는 것 (좌반구: 언어 정보 처리·수학 계산 / 우반구: 추론·자기 자각·의미 전달을 위한 말하기 조율) (2장 p.30)\n'''명칭''': 기능의 편재화 (Lateralization)\n{/def}\n\n{analogy}\n분할 뇌 환자는 '''통역사가 없는 2인 팀'''이다. 왼쪽 사람(좌반구)만 '''말을 할 줄''' 알고, 오른쪽 사람(우반구)은 말은 못 하지만 '''손짓(왼손)'''으로 가리킬 수 있다. 원래는 둘 사이 무전기(뇌량)로 다 공유했는데 무전기가 끊겼다. 그래서 오른쪽 사람만 본 것을 물으면 왼쪽 사람은 \"못 봤는데요?\"라고 말하고, 정작 오른쪽 사람의 왼손은 정답을 정확히 가리킨다.\n{/analogy}\n\n== 인물 카드 ==\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 이름(원어) || 마이클 가자니가 (Michael Gazzaniga)\n|-\n| 분야 || 인지신경과학 — 분할 뇌 연구\n|-\n| 핵심 업적 || 뇌량이 끊어진 환자에게 좌·우 시야에 따로 자극을 주어 두 반구의 기능 차이를 보여 줌\n|-\n| 슬라이드 표기 || 분할 뇌 실험(Gazzaniga, '''1967'''), 그림 캡션 Gazzaniga ('''1983''')의 분할 뇌 실험\n|-\n| 시험 포인트 || 우시야 → 좌뇌 → '''말로 보고''' / 좌시야 → 우뇌 → '''가리키기'''. 기능의 편재화\n|}\n\n== 실험 카드 (p.30) ==\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 연구자(연도) || Gazzaniga (1967)\n|-\n| 질문 || 뇌량이 끊어지면 좌·우반구는 각자 무엇을 할 수 있나?\n|-\n| 절차 || 뇌량이 끊어진 사람에게 화면 중앙 점을 응시하게 한 뒤, 단어의 철자를 잘라 좌·우 시야에 나눠 제시 (HE•ART → 좌시야 \"HE\", 우시야 \"ART\")\n|-\n| 결과 || \"어떤 단어를 보았나?\" → '''우시야'''에 제시된 단어(\"ART\")만 보고. 본 것을 '''가리키라'''고 하면 → '''좌시야'''의 텍스트(\"HE\")를 가리킴(왼손)\n|-\n| 결론 || 뇌량의 중요성 + 좌우반구의 기능 차이 = '''기능의 편재화'''\n|-\n| 함정 || 시야와 반구는 '''교차'''한다. \"좌시야 → 좌반구\"는 ✗. 4장 p.25 슬라이드 오기 주의\n|}\n\n<pre class=\"ascii\">\n  화면:   [ HE ] • [ ART ]          ← 가운데 • 응시\n           좌시야     우시야\n             │          │\n             ▼          ▼\n          우반구      좌반구(언어)\n             ║  ✂ [[뇌량]] 절단  ║\n             ▼          ▼\n   왼손으로 \"HE\" 가리킴    입으로 \"ART\" 라고 말함\n<\/pre>\n\n[[img:L2-30.png|2장 p.30 Gazzaniga (1983)의 분할 뇌 실험 — (a) 점 응시 (b) HE•ART 제시 (c) \"무슨 단어를 보았습니까?\" → \"ART\" / \"본 단어를 왼손으로 가리켜 보세요\" → HE|large]]\n\n[[img:L2-29.png|2장 p.29 좌우 시야와 분할 뇌 — 왼쪽 시야(연필)는 우반구 시각영역, 오른쪽 시야(사과)는 좌반구 시각영역|medium]]\n\n[[anim:split_brain|p.30 그림 그대로 — HE•ART 를 응시하면 좌시야 「HE」→ 우반구, 우시야 「ART」→ 좌반구. 뇌량이 잘리면 말(\"ART\")과 왼손(HE 가리킴)이 따로 노는 것을 확인하라. 아래 퀴즈의 열쇠/연필도 같은 구조다]]\n\n🎙 교수 설명(9/8 2부 31:25): \"좌반구에 언어 정보 처리가 기반이라 반응을 할 수 있음. 우반구로 들어가면 우반구에서는 언어를 직접적으로 1차적으로 처리하지 않음 — '''말로 보고는 할 수 없지만 어쨌든 본 건 맞으니까 이미지로 표현해서 주면 제대로 가리킬 수 있음'''.\"\n\n== 좌반구 vs 우반구 ==\n{| class=\"table\"\n! || 좌반구 || 우반구\n|-\n| 받는 시야 || '''우'''시야 || '''좌'''시야\n|-\n| 담당 (p.30) || '''언어 정보 처리''', 수학 계산 등 || 추론, 자기 자신에 대한 자각, 의미 전달을 위한 말하기 조율 등\n|-\n| 분할 뇌 실험 반응 || 말로 보고 가능 || 말로는 못 하지만 (왼손으로) 가리킬 수 있음\n|}\n\n{warn}\n'''⚠ 슬라이드 오류 — 4장 p.25''': \"좌시야의 입력 정보는 우반구로, '''우시야의 입력 정보는 우반구로''' 전달\"이라고 적혀 있다. 이것은 '''오기'''다. 올바른 내용은 '''우시야 → 좌반구''' (2장 p.29 \"좌시야에 나타난 물체는 우뇌로, 우시야에 나타난 이미지는 좌뇌로 전달됨\"과 일치). 시험에서 \"우시야 → 우반구\"를 정답으로 고르지 말 것.\n{/warn}\n\n{quiz}\n뇌량이 절단된 환자가 화면 중앙을 응시한 채 좌시야에 「열쇠」, 우시야에 「연필」을 보았다. 예상되는 반응은? ① 말로는 \"열쇠\", 가리키기는 「연필」 ② 말로 둘 다 정확히 답함 ③ 말로도 가리키기로도 아무것도 못 함 ④ 말로는 \"연필\", 가리키라고 하면 「열쇠」\n{/quiz}\n{answer}\n'''④'''. 우시야(연필) → 좌반구(언어) → 말로 보고. 좌시야(열쇠) → 우반구 → 말은 못 하지만 가리킬 수 있음. ①은 좌우를 뒤바꾼 함정, ②는 공유가 안 되므로 ✗, ③은 우반구도 본 것은 가리킬 수 있으므로 ✗.\n{/answer}\n\n== 관련 문서 ==\n* [[뇌량]] · [[대뇌 피질]] · [[4장 감각과 지각]] (p.25 분할 시야) · [[자주 틀리는 함정 모음]]\n\n근거: 2장 p.29–30; 4장 p.25"
 },
 "선택적 주의": {
  "title": "선택적 주의 (Selective Attention)",
  "category": [
   "2장 마음의 생물학과 의식",
   "용어"
  ],
  "body": "'''선택적 주의'''(Selective Attention)는 쏟아지는 모든 자극 중 '''일부분에만 스포트라이트를 비추는''' 마음의 기제다. 2장 p.32–33에서 이 개념 아래 세 현상 — [[칵테일 파티 효과]], [[부주의적 맹시]], [[변화맹]] — 이 줄줄이 달려 있다. 세 개 모두 단답형 명칭 후보라서, 이 문서는 '''세 현상을 구분하는 허브'''로 쓰면 된다.\n\n{def}\n'''설명''': 경험하는 모든 것 중 일부분에만 초점을 맞추게 하는 심리 기제. 의식적 자각은 이것을 통해서 성립된다 (2장 p.32)\n'''명칭''': [[선택적 주의]] (Selective Attention)\n{/def}\n\n{analogy}\n선택적 주의는 '''어두운 무대의 스포트라이트'''다. 무대(감각 입력) 위에는 배우가 수십 명 있지만 관객(의식)은 조명이 비추는 배우만 본다. 조명 밖 배우가 춤을 춰도(부주의적 맹시), 조명 밖에서 배우가 바뀌어도(변화맹) 모른다. 그런데 객석 어디선가 내 이름이 불리면 조명이 '''휙''' 그쪽으로 돈다(칵테일 파티 효과).\n{/analogy}\n\n[[img:L2-32.png|2장 p.32 Neisser & Cervone(1983)의 부주의적 맹시 실험 — 농구공 패스를 세는 동안 우산 쓴 여성이 지나간다|medium]]\n\n== 슬라이드 내용 (p.32–33) ==\n* 경험하는 모든 것 중 일부분에만 초점을 맞추게 하는 심리 기제.\n* '''의식적 자각은 선택적 주의를 통해서 성립'''된다 → [[2장 마음의 생물학과 의식|의식]](p.31)과 연결.\n* 🎙 \"선택적 주의를 기울이면 필요한 정보만 필터링할 수 있음. 주의를 기울이지 않는 정보는 누락됨\"(9/8 2부 40:11).\n\n== 세 현상 한눈에 ==\n{| class=\"table\"\n! 현상 || 슬라이드 정의 || 핵심 장면 || 감각\n|-\n| [[칵테일 파티 효과]] || 여러 말소리 중 하나의 목소리에만 주의를 기울이는 현상, 자신과 관련된 의미 있는 정보만 필터링 || 시끄러운 파티에서 내 이름 || 청각\n|-\n| [[부주의적 맹시]] || 주의를 기울이지 않은 시각 자극을 인지하지 못하는 현상 || 패스 세다가 지나가는 사람 못 봄 (Neisser & Cervone, 1983) || 시각\n|-\n| [[변화맹]] || 장면에서 어떤 변화가 발생해도 그 변화를 눈치채지 못하는 현상 ('''부주의적 맹시의 한 유형''') || 길 묻던 사람이 바뀌어도 모름 (Simons & Levin, 1998), 영화 옥의 티 || 시각\n|}\n\n[[img:L2-33.png|2장 p.33 변화맹 실험 예시(Simons & Levin, 1998)|medium]]\n\n[[anim:selective_attention|① 파티 소음 속 내 이름 ② 공 세기 중 지나가는 사람 ③ 바뀐 장면 — 세 장면을 순서대로 보고 각각의 명칭을 말해 보라]]\n\n{warn}\n위계 함정: '''변화맹 ⊂ 부주의적 맹시'''. \"변화맹과 부주의적 맹시는 서로 무관한 현상이다\" ✗. 또 선택적 주의는 상위 개념(기제)이고 나머지 셋이 그 현상들이다.\n{/warn}\n\n{joke}\n🎙 교수 여담: 주의 연구실 출신 선배들은 자동차 '''내비게이션 UI''' 개선 쪽으로 많이 진출했다(9/8 2부 33:13). 운전자의 스포트라이트를 어디 둬야 하는지가 곧 돈이 되는 분야. 또 교수는 \"부주의적 맹시는 주의 기제가 멀쩡히 있어도 생기는 것인데 '왜 그걸 못 봤냐'고 타박하는 모습에 불합리함을 느낀다\"고 했다(42:15).\n{/joke}\n\n== 관련 문서 ==\n* [[칵테일 파티 효과]] · [[부주의적 맹시]] · [[변화맹]] · [[이중 처리]]\n\n근거: 2장 p.31–33"
 },

  "body": "'''칵테일 파티 효과'''(Cocktail Party Effect)는 시끄러운 파티장에서도 '''한 목소리에만 귀를 기울이고''', 멀리서 '''내 이름'''이 들리면 바로 알아채는 현상이다. [[선택적 주의]]의 대표 예. 통합요약 §0-1 2장 최우선 명칭이자 bank 단답형 정답.\n\n{def}\n'''설명''': 여러 말소리 중 하나의 목소리에만 주의를 기울이는 현상. 자신과 관련된 의미 있는 정보만 필터링한다 (2장 p.32)\n'''명칭''': [[칵테일 파티 효과]] (Cocktail Party Effect)\n{/def}\n\n{def}\n'''사례형 설명''': 민지는 여러 사람이 동시에 떠드는 시끄러운 파티장에서도 친구 목소리에만 주의를 기울여 대화를 이어 간다. 그러다 멀리서 누군가 자기 이름을 부르자 곧바로 알아차렸다.\n'''명칭''': 칵테일 파티 효과\n{/def}\n\n{analogy}\n칵테일 파티 효과는 '''노이즈 캔슬링 이어폰 + 이름 알림 기능'''이다. 주변 소음은 꺼 버리고 지금 대화 상대 목소리만 통과시키는데(하나의 목소리에 주의), 누군가 \"민준아!\"라고 부르면 그 소리만은 필터를 뚫고 들어온다(자신과 관련된 의미 있는 정보). 카페에서 공부하다가 옆 테이블의 \"중간고사\" 소리에 귀가 쫑긋하는 것도 같은 원리.\n{/analogy}\n\n[[anim:selective_attention|첫 장면 — 여러 말풍선 소음 속에서 \"내 이름\" 말풍선만 밝아지는 순간을 보라]]\n\n[[img:L2-32.png|2장 p.32 — 오른쪽 본문 \"칵테일파티 효과\" 항목(왼쪽 그림은 부주의적 맹시 실험)|medium]]\n\n== 슬라이드 내용 (p.32) ==\n* [[선택적 주의]]의 하위 항목으로 제시.\n* 여러 말소리 중 '''하나의 목소리에만''' 주의를 기울이는 현상.\n* '''자신과 관련된 의미 있는 정보'''만 필터링.\n* 🎙 \"선택적 주의를 보여 주는 좋은 예시가 칵테일 파티 효과\"(9/8 2부 37:10).\n\n{exam}\n통합요약 §0-1 2장 '''최우선 명칭''' + 출제 예상 단답형 14번 \"여러 말소리 중 하나에만 주의를 기울이는 현상 → '''칵테일 파티 효과'''\". bank 단답형은 \"파티장 + 멀리서 내 이름\" 사례 지문으로 나온다.\n{/exam}\n\n== 6장과의 연결 ==\n6장 p.25 [[자기참조 효과]] 슬라이드에 \"'''칵테일 파티 효과에서도 자신과 관련된 정보가 나올 경우, 주의가 집중되는 것과 유사'''\"라는 문장이 있다. 자기와 관련된 정보는 주의도 잘 끌고(2장), 기억도 잘 된다(6장).\n\n== 비슷한 현상과 구분 ==\n{| class=\"table\"\n! || '''칵테일 파티 효과''' || [[부주의적 맹시]] || [[변화맹]]\n|-\n| 감각 || '''청각'''(말소리) || 시각 || 시각\n|-\n| 핵심 || 주의를 준 것은 '''듣고''', 나와 관련된 것은 '''뚫고 들어옴''' || 주의 안 준 것을 '''못 봄''' || 변화를 '''못 알아챔'''\n|}\n\n{warn}\n\"시각 자극을 못 보는 현상\" 설명에 칵테일 파티 효과를 쓰면 ✗. 이 효과는 '''여러 말소리''' 중 하나 — 청각 장면이다. 표기는 \"칵테일파티 효과\"(붙여 쓰기)도 정답으로 인정(bank).\n{/warn}\n\n== 관련 문서 ==\n* [[선택적 주의]] · [[자기참조 효과]] · [[부주의적 맹시]]\n\n근거: 2장 p.32; 6장 p.25"
 },
 "부주의적 맹시": {
  "title": "부주의적 맹시 (Inattentional Blindness)",
  "category": [
   "2장 마음의 생물학과 의식",
   "용어"
  ],
  "body": "'''부주의적 맹시'''(Inattentional Blindness)는 눈은 멀쩡히 뜨고 있는데, '''주의를 주지 않은 것은 아예 보지 못하는''' 현상이다. 슬라이드의 대표 실험은 Neisser & Cervone(1983)의 공 패스 세기 — 패스 횟수를 세는 동안 화면을 가로지르는 우산 쓴 여성을 많은 사람이 놓친다.\n\n{def}\n'''설명''': 주의를 기울이지 않은 시각 자극을 인지하지 못하는 현상 (2장 p.32)\n'''명칭''': [[부주의적 맹시]] (Inattentional Blindness)\n{/def}\n\n{analogy}\n부주의적 맹시는 '''휴대폰 보며 걷다가 전봇대에 부딪히는 것'''이다. 전봇대는 분명 시야 안에 있었다(눈은 봤다). 하지만 주의가 화면에 가 있었으니 의식에는 들어오지 않았다. \"못 본\" 게 아니라 \"'''안 보였다'''\"가 정확하다.\n{/analogy}\n\n[[img:L2-32.png|2장 p.32 Neisser & Cervone(1983)의 부주의적 맹시 실험 — 흰 옷 팀의 패스를 세는 동안 우산 쓴 여성이 화면을 가로지른다(겹쳐 찍힌 장면)|large]]\n\n== 실험 카드 ==\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 연구자(연도) || Neisser & Cervone (1983) (슬라이드 표기)\n|-\n| 질문 || 한 과제에 주의를 집중하면, 눈앞을 지나가는 뚜렷한 자극도 놓칠까?\n|-\n| 절차 || 두 팀이 농구공을 패스하는 영상을 보며 한 팀의 패스 횟수를 센다. 도중에 우산 쓴 여성이 화면을 가로지른다\n|-\n| 결과 || 상당수가 여성이 지나간 것을 알아채지 못함\n|-\n| 결론 || 주의를 기울이지 않은 시각 자극은 의식에 들어오지 않는다 → [[선택적 주의]]의 대가\n|-\n| 함정 || 시력·감각의 문제가 아니라 '''주의'''의 문제. \"변화를 못 알아챔\"이면 [[변화맹]]\n|}\n\n<pre class=\"ascii\">\n 과제: \"흰 팀 패스를 세라\"  ─▶  주의 = 공·흰 팀에 고정\n                                  │\n   우산 쓴 여성 등장 ─────────────┼──▶ 망막엔 맺힘 ─▶ 주의 밖 ─▶ 의식 ✗  = '''부주의적 맹시'''\n                                  │\n \"여성 봤어요?\"  ─────────────────┴──▶ \"무슨 여성요?\"\n<\/pre>\n\n슬라이드에 참고 영상 링크(부주의맹 참고 영상)가 붙어 있다.\n\n[[anim:selective_attention|두 번째 장면 — 공 패스를 세는 동안 사람이 지나가고 \"봤어?\" ✗ 가 뜨는 부분을 보라]]\n\n🎙 교수: \"부주의적 맹시는 주의를 기울이게 되면 '''의식 영역 밖에 있는 것들은 보지 못함'''\"(9/8 2부 42:15). 변화맹이 \"비슷한 현상\"으로 바로 이어진다.\n\n== 변화맹과의 관계 ==\n{| class=\"table\"\n! || '''부주의적 맹시''' || [[변화맹]]\n|-\n| 정의 || 주의를 기울이지 않은 시각 자극을 인지 못 함 || 장면의 '''변화'''를 눈치채지 못함\n|-\n| 관계 || '''상위''' 개념 || 부주의적 맹시의 '''한 유형'''\n|-\n| 예 || 공 세다가 지나가는 사람 못 봄 || 대화 상대가 바뀌어도 모름, 영화 옥의 티\n|}\n\n{warn}\n통합요약 \"헷갈리는 개념 대비\": '''부주의적 맹시 vs 변화맹''' — 주의 안 준 자극 미지각 vs 장면 변화 미지각(전자의 한 유형). \"새로 '''나타난''' 것을 못 봄\"이면 부주의적 맹시, \"'''바뀐''' 것을 못 알아챔\"이면 변화맹.\n{/warn}\n\n== 관련 문서 ==\n* [[선택적 주의]] · [[변화맹]] · [[칵테일 파티 효과]]\n\n근거: 2장 p.32–33"
 },
 "변화맹": {
  "title": "변화맹 (Change Blindness)",
  "category": [
   "2장 마음의 생물학과 의식",
   "용어"
  ],
  "body": "'''변화맹'''(Change Blindness)은 장면에서 무언가가 '''바뀌었는데도 눈치채지 못하는''' 현상이다. 슬라이드는 이것을 [[부주의적 맹시]]의 '''한 유형'''으로 분류하고, 예로 영화의 '''옥의 티'''를 든다. 통합요약 §0-1 2장 최우선 명칭이자 bank 단답형 정답.\n\n{def}\n'''설명''': 상황 혹은 장면 상에서 어떤 변화가 발생하여도 그 변화를 눈치채지 못하는 현상 (부주의적 맹시의 한 유형) (2장 p.33)\n'''명칭''': [[변화맹]] (Change Blindness)\n{/def}\n\n{def}\n'''사례형 설명''': 영화에서 주인공이 든 컵의 위치가 컷마다 바뀌어 있었지만 대부분의 관객은 눈치채지 못했다(영화의 옥의 티).\n'''명칭''': 변화맹\n{/def}\n\n{analogy}\n변화맹은 '''틀린 그림 찾기에서 왜 그렇게 오래 걸리는가'''에 대한 답이다. 두 그림을 나란히 놓고도 한참 걸리는데, 하물며 그림이 '''한 장씩 시간차로''' 지나가면? 우리 뇌는 장면의 모든 픽셀을 저장하지 않고 \"대충 이런 장면\"이라는 요약만 들고 있어서, 주의가 가 있지 않던 부분이 바뀌면 그대로 놓친다.\n{/analogy}\n\n[[img:L2-33.png|2장 p.33 변화맹 실험 예시(Simons & Levin, 1998) — (a) 길을 묻던 사람 (b) 판자가 사이로 지나감 (c) 판자 뒤에서 다른 사람으로 바뀌어 있다|large]]\n\n== 실험 카드 ==\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 연구자(연도) || Simons & Levin (1998) (슬라이드 표기)\n|-\n| 질문 || 대화 중인 상대가 바뀌면 알아챌까?\n|-\n| 절차 || (a) 실험자가 행인에게 길을 묻는다 → (b) 두 사람이 판자를 들고 그 사이를 지나가며 시야를 가린다 → (c) 그 틈에 길을 묻던 사람이 다른 사람으로 바뀐다\n|-\n| 결과 || 그림 (c)처럼 상대가 바뀐 상태로 대화가 이어진다 — 변화를 눈치채지 못하는 경우가 생긴다\n|-\n| 결론 || 장면의 변화를 놓치는 현상 = 변화맹, 부주의적 맹시의 한 유형\n|-\n| 함정 || \"새로 등장한 자극을 못 봄\"은 상위 개념 [[부주의적 맹시]]의 대표 예. 변화맹은 '''바뀐 것'''\n|}\n\n<pre class=\"ascii\">\n 장면 A (길 묻는 사람 1)  ──▶  [판자로 잠깐 가림]  ──▶  장면 B (길 묻는 사람 2)\n                                                          │\n                                       \"아까랑 같은 사람이죠?\" ──▶ \"네\" ✗  = '''변화맹'''\n<\/pre>\n\n[[anim:selective_attention|세 번째 장면 — 장면 A → 잠깐 가림 → 장면 B(한 요소가 바뀜)인데 \"같은 장면\" 이라고 답하는 부분을 보라]]\n\n🎙 교수 설명(9/8 2부 44:19): \"변화맹은 어떤 상황이나 장면이 벌어졌을 때 변화를 눈치채지 못하는 양상. 영화나 드라마에서 일어나는 '''사건들에 집중하고 있기 때문에''' 다른 세부적인 요소들을 놓치게 되는 것.\"\n\n{exam}\n통합요약 교수 강조(9/8 2부 44:19–47:07): \"변화맹 = 사건에 집중해 세부를 놓침.\" 출제 예상 단답형 15번 \"장면의 변화를 눈치채지 못하는 현상 → '''변화맹'''\". 허용 표기: 변화 맹, change blindness, 변화맹시(bank).\n{/exam}\n\n== 부주의적 맹시와의 관계 ==\n{| class=\"table\"\n! || [[부주의적 맹시]] || '''변화맹'''\n|-\n| 범위 || 상위 개념 || 그 '''한 유형'''\n|-\n| 놓치는 것 || 주의 안 준 시각 자극 || 장면의 '''변화'''\n|-\n| 슬라이드 예 || Neisser & Cervone(1983) 공 패스 || Simons & Levin(1998), 영화 옥의 티\n|}\n\n== 관련 문서 ==\n* [[부주의적 맹시]] · [[선택적 주의]] · [[칵테일 파티 효과]]\n\n근거: 2장 p.33"
 },

  "body": "'''이중 처리'''(dual processing, 이중 처리 과정)는 우리 마음이 정보를 처리할 때 '''느리고 신중한 의식적 경로'''와 '''빠르고 자동적인 무의식적 경로'''가 '''동시에''' 함께 일한다는 원리다. 통합요약 §0-1 2장 최우선 명칭이자 bank 단답형 정답.\n\n{def}\n'''설명''': 의식 경험에 대한 정보 처리 과정에서 두 가지 경로(의식적 경로와 무의식적 경로)가 동시에 개입한다는 원리 (2장 p.34)\n'''명칭''': [[이중 처리]] (Dual Processing) — 허용 표기: 이중처리, 이중 처리 과정\n{/def}\n\n{def}\n'''사례형 설명''': 회고적이고 신중하게 자극을 하나씩 다루는 경로와, 자동적이고 신속하게 여러 특성을 한꺼번에 다루는 경로가 함께 개입한다는 원리\n'''명칭''': 이중 처리\n{/def}\n\n{analogy}\n이중 처리는 '''운전'''이다. 초보 때는 \"깜빡이 켜고, 미러 보고, 핸들 돌리고…\"를 '''하나씩 신중하게''' 처리한다(의식적·계열). 숙련되면 노래 따라 부르면서도 차선 변경이 '''저절로 한꺼번에''' 된다(무의식적·병렬). 그런데 숙련자도 처음 가는 복잡한 교차로에선 노래를 끄고 신중 모드로 돌아간다 — 두 경로가 늘 함께 대기하며 섞여 일한다.\n{/analogy}\n\n[[img:L2-34.png|2장 p.34 이중 처리 과정 — \"의식적/책략적 처리\"와 \"무의식적/자동적 처리\" 두 화살표가 함께 \"심리 기제(기억, 사고, 언어)\"로 들어간다|large]]\n\n== 두 경로 비교 (p.34) ⭐⭐⭐ ==\n{| class=\"table\"\n! || '''의식적 경로''' || '''무의식적 경로'''\n|-\n| 그림 속 이름 || 의식적/책략적 처리 || 무의식적/자동적 처리\n|-\n| 성격 || '''회고적'''이며 매우 '''신중'''하게 정보를 처리 || '''자동적'''이고 '''신속'''하게 정보를 처리\n|-\n| 처리 방식 || 특정 자극이나 문제를 하나씩 처리하는 '''계열 처리''' || 여러 특성을 동시에 처리하는 '''[[병렬 처리]]'''\n|-\n| 적용 대상 || 기억, 사고, 언어 (심리 기제 전반) || 기억, 사고, 언어\n|}\n\n<pre class=\"ascii\">\n  의식적/책략적 처리  ── 회고적·신중·'''계열'''(하나씩) ──┐\n                                                         ├──▶  심리 기제 (기억, 사고, 언어)\n  무의식적/자동적 처리 ── 자동·신속·'''병렬'''(동시에) ──┘\n                       ↑ 두 경로가 '''동시에''' 개입\n<\/pre>\n\n🎙 \"사람들의 의식과 관련된 심리 기제 프로세스에 '''두 가지 경로가 개입'''한다는 접근법\"(9/8 2부 44:19), \"병렬적 구성을 취할 수 있는 것은 병렬 처리가 가능하다는 특성이 반영\"(48:03).\n\n{exam}\n통합요약 §0-1 2장 '''최우선 명칭'''. bank 단답형은 \"회고적·신중하게 하나씩 vs 자동적·신속하게 한꺼번에, 두 경로가 함께 개입\" 설명으로 명칭을 묻는다 → '''이중 처리'''.\n{/exam}\n\n== 다른 장과의 연결 ==\n* 4장 p.27 [[병렬 처리]] — 시각 정보(색·움직임·형태·깊이)를 동시에 처리. 무의식적 경로의 처리 방식과 같은 말.\n* 6장 p.11 [[자동 처리와 통제 처리]] — 기억 쪽의 \"이중 궤적\": 자동 처리(무의식) vs 통제 처리(의식적 노력).\n\n{warn}\n짝 뒤바꾸기 함정: \"의식적 경로 = '''병렬''' 처리\" ✗ / \"무의식적 경로 = 신중한 '''계열''' 처리\" ✗. '''의식 = 계열·신중, 무의식 = 병렬·자동'''. 또 \"두 경로 중 '''하나만''' 선택되어 작동한다\" ✗ → '''동시에''' 개입.\n{/warn}\n\n== 관련 문서 ==\n* [[병렬 처리]] · [[자동 처리와 통제 처리]] · [[선택적 주의]]\n\n근거: 2장 p.34"
 },
 "수면과 꿈": {
  "title": "수면과 꿈 (일주기 리듬·수면 단계·REM·꿈 이론)",
  "category": [
   "2장 마음의 생물학과 의식",
   "이론"
  ],
  "body": "'''수면과 꿈'''은 2장의 마지막 절(p.35–38)이다. 잠은 의식이 꺼지는 시간이 아니라 '''뇌파가 단계별로 바뀌며 주기적으로 반복되는''' 능동적 상태다. 이 문서는 일주기 리듬, 뇌파(베타·알파·델타), 수면 단계(N1·N2·N3), REM 수면, REM 반동, 수면의 목적, 꿈 이론 5개(소망충족·정보 처리·생물학적 기능·활성화-종합·인지 발달)를 모두 흡수한다.\n\n{analogy}\n하룻밤 잠은 '''엘리베이터를 타고 지하로 내려갔다 올라오기를 4~5번 반복하는 것'''이다. 1층(각성·베타파) → 로비 소파(이완·알파파) → 지하 1층(N1) → 지하 2층(N2) → 지하 3층 보일러실(N3·델타파, 가장 깊음) → 다시 올라오다 '''영화관 층'''(REM)에 들러 꿈이라는 영화를 본다. 영화관에선 관객이 의자에 묶인 듯 꼼짝 못 하지만(근육 신호 차단) 심장은 두근두근(심박·호흡↑). 나이가 들면 엘리베이터가 지하 3층까지 거의 안 내려가고 1~2층만 오르내린다.\n{/analogy}\n\n== 일주기 리듬 (p.35) ==\n{def}\n'''설명''': 24시간 주기로 발생하는 규칙적 신체 리듬 (2장 p.35)\n'''명칭''': 일주기 리듬 (Circadian Rhythm)\n{/def}\n\n== 수면 단계와 뇌파 (p.35) ⭐⭐⭐ ==\n[[img:L2-35.png|2장 p.35 수면과 비수면 상태에서의 뇌파 — 위에서부터 깨어 있을 때의 베타파·알파파, N1, N2, N3(델타파), REM|large]]\n\n{| class=\"table\"\n! 상태 || 뇌파 / 특징 (슬라이드 문장)\n|-\n| 각성 || '''베타파''': 각성 상태에서 관찰되는 파형\n|-\n| 이완 || '''알파파''': 자고 있지 않은 이완 상태에서 관찰됨\n|-\n| '''N1''' 수면 || REM 상태가 아닌 수면 상태에서 관찰됨\n|-\n| '''N2''' 수면 || N1 다음에 관찰되는 좀 더 깊은 수면 상태\n|-\n| '''N3''' 수면 || '''델타파''': 매우 깊게 잠든 상태\n|-\n| '''REM''' 수면 || 빠른 안구운동이 수반되는 수면 상태로 '''선명한 꿈'''이 나타나는 단계\n|}\n\n{def}\n'''설명''': 빠른 안구운동이 수반되며 선명한 꿈이 나타나는 수면 단계. 뇌간이 근육으로 가는 신호를 차단해 외적으로는 이완되어 있으나 내적으로는 각성된 상태 (2장 p.35–36)\n'''명칭''': REM 수면 (Rapid Eye Movement Sleep)\n{/def}\n\n== 수면 주기 (p.36) ==\n[[img:L2-36.png|2장 p.36 젊은 사람과 노인의 수면 주기 그래프 — 젊은 성인은 N3까지 깊이 내려가고 밤이 깊을수록 REM이 늘어난다, 노인은 N1·N2를 잦게 오간다|large]]\n\n* 슬라이드 문장: \"각성(베타 혹은 알파파) → REM 수면 → N1 → N2 → N3\", \"시간이 흐름에 따라 '''여러 수면 상태가 반복'''됨\".\n* 그래프로 보면 잠든 직후 N1→N2→N3로 내려갔다가 다시 올라와 REM이 나타나고, 이런 주기가 밤새 반복된다. 그래프 주석: \"밤이 깊어짐에 따라 REM 수면이 증가한다\".\n* 🎙 젊은 사람은 N3 깊은 수면 단계도 잘 들어가고 대체로 '''N2에서 유지'''. 어르신들은 N3로 가는 경우가 거의 없고 '''N2·N1을 왔다 갔다''' — 수면 주기가 짧아졌기 때문(9/8 2부 52:12).\n\n{info}\n슬라이드 문장의 화살표 순서(각성→REM→N1→N2→N3)와 그래프 모양이 한눈에 일치하지는 않는다. 시험 대비로는 ① 단계 이름과 뇌파 짝(베타·알파·N3=델타·REM=꿈) ② \"주기가 반복된다\" ③ 노인은 N3 진입이 거의 없다 — 이 세 가지를 확실히 해 두면 된다.\n{/info}\n\n=== REM 수면의 역설 ===\n{| class=\"table\"\n! 겉 (외적) || 속 (내적)\n|-\n| 뇌간이 근육으로 가는 신호를 차단 → '''이완''' || '''각성'''된 상황으로 볼 수 있음\n|-\n| 수면 파형 자체는 '''N1과 유사''' || 하지만 '''심장 박동과 호흡이 빨라짐'''\n|}\n\n{warn}\nbank 오답 보기: \"REM 수면에서는 근육 신호가 차단되므로 '''심장 박동과 호흡도 느려진다'''\" ✗ → 오히려 '''빨라진다'''. 근육 차단은 겉모습(이완)만 설명한다.\n{/warn}\n\n== 수면의 목적 (p.37) ==\n# '''보호 기능''' 제공: 야간에 수면을 취하는 것이 생존에 더 유리 (수면 양상은 동물종마다 다양, Siegel, 2009)\n# 감염의 치료 및 '''면역계의 회복''' (Dimitrov et al., 2019) — 알츠하이머병을 유발할 수 있는 단백질 제거\n# '''기억의 복원 및 재생''' (Paller & Oudiette, 2018) — 새 과제를 훈련한 뒤 수면을 취하면 수행이 더 우수 → 6장 [[기억 응고화]]\n# '''창의적 사고의 배양''' — 수면을 취한 사람이 새 정보 간 연계점을 더 잘 찾음\n# 신체 '''성장 호르몬''' 분비\n\n== 꿈 이론 5개 (p.38) ⭐⭐⭐ ==\n[[img:L2-38.png|2장 p.38 꿈에 대한 이론 표 — 프로이트의 소망충족·정보 처리·생물학적 기능·활성화-종합·인지 발달 + REM 반동|large]]\n\n{| class=\"table\"\n! 이론 || 설명 (슬라이드) || 키워드\n|-\n| '''[[프로이트]]의 소망충족''' || 꿈은 표출된(기억된) 내용과 깊은 곳의 '''잠재 내용'''(숨겨진 의미)을 담는다 || 표출 vs 잠재\n|-\n| '''정보 처리''' || 꿈은 그날의 사건을 '''분류'''하고 기억을 '''공고'''하게 만든다 (성적 우수 학생의 수면 시간이 더 길다, Wolfson & Carskadon, 1998) || 분류·공고화\n|-\n| '''생물학적 기능''' || REM 수면의 규칙적인 두뇌 자극을 통해 '''신경 통로가 발달하고 유지'''됨 (유아의 수면 시간이 긴 것과 연관) || 신경 통로\n|-\n| '''활성화-종합''' || REM 수면이 '''무작위적'''으로 시각 기억을 유발하는 신경활동을 촉발하고, 두뇌가 이것을 하나의 '''이야기로 엮는다''' (Antrobus, 1991; Hobson, 2003, 2009) || 무작위 → 이야기\n|-\n| '''인지 발달''' || 꿈의 내용은 꿈꾸는 사람의 '''지식과 이해를 반영'''하여 실제를 '''시뮬레이션''' || 지식 반영·시뮬레이션\n|}\n\n{def}\n'''설명''': REM 수면은 무작위적으로 시각 기억을 유발하는 신경활동을 촉발하며, 두뇌가 이것을 하나의 이야기로 엮는다는 꿈 이론 (2장 p.38)\n'''명칭''': 활성화-종합 이론 (Activation-Synthesis)\n{/def}\n\n{def}\n'''설명''': REM 수면은 꿈에 필수적인 요소이며, REM 수면을 인위적으로 박탈하면 더 빠르게 REM 수면 상태로 되돌아가는 현상 (2장 p.38)\n'''명칭''': REM 반동 (REM Rebound)\n{/def}\n\n{quiz}\n꿈에 대한 이론과 설명의 짝이 옳은 것은? ① 정보 처리 — 꿈은 표출 내용과 잠재 내용을 담는다 ② 프로이트의 소망충족 — 꿈은 그날의 사건을 분류하고 기억을 공고하게 만든다 ③ 활성화-종합 — REM 수면이 무작위로 시각 기억 신경활동을 촉발하고 뇌가 이를 이야기로 엮는다 ④ 생물학적 기능 — 꿈은 꿈꾸는 사람의 지식과 이해를 반영해 실제를 시뮬레이션한다\n{/quiz}\n{answer}\n'''③'''. ① 표출·잠재 내용은 '''프로이트'''. ② 분류·공고화는 '''정보 처리'''. ④ 지식 반영·시뮬레이션은 '''인지 발달''' — 생물학적 기능은 \"신경 통로 발달·유지\". (bank MC 재구성)\n{/answer}\n\n{joke}\nREM 반동 덕분에, 시험 전날 밤샘하고 다음 날 낮잠을 자면 유난히 생생하고 이상한 꿈을 꾼다는 경험담이 많다. 못 잔 REM을 몰아서 갚는 셈. (슬라이드는 \"박탈 → 더 빨리 REM 복귀\"까지만 말한다.)\n{/joke}\n\n== 관련 문서 ==\n* [[프로이트]] (소망충족) · [[뇌간]] (REM 때 근육 신호 차단) · [[기억 응고화]] · [[역행 간섭]] (수면 집단 회상률)\n\n근거: 2장 p.35–38"
 },

  "body": "'''3장 일생에 걸친 발달'''은 \"사람의 몸·생각·관계는 태아 때부터 노년까지 어떻게 바뀌는가?\"를 다루는 장이다. 출발점은 '''발달심리학'''(Developmental Psychology)의 세 논제와 두 연구 방법([[횡단 연구]]·[[종단 연구]])이고, 그 뒤로 출생 이전 → 신생아 → 유아·아동기([[피아제의 인지 발달 단계|피아제]]·[[비고츠키]]·[[마음 이론]]·[[애착]]·[[권위적·권위주의적·허용적 양육|양육 방식]]·[[자기 개념]]) → 청소년기([[콜버그의 도덕성 발달 단계|콜버그]]·[[도덕 직관]]·[[정체성]]·[[에릭슨의 심리사회적 발달 단계|에릭슨]]) → 성인·노년기([[설단 현상]]·알츠하이머·[[사회적 시계]]·[[성공적 노화]]) 순으로 '''인생 한 바퀴'''를 돈다.\n\n단답형이 '''명칭 쓰기'''만 나오므로 이 장의 승부처는 ① 단계 이름 + 연령, ② 학자–이론 짝(피아제=물리적 환경, 비고츠키=사회적 환경), ③ 비슷한 용어 구분(권위적 vs 권위주의적, 동화 vs 조절, 재인 vs 회상, 불안 vs 회피 애착)이다. 페이지 번호는 '''인쇄된 슬라이드 번호'''(p.1–40, 숨김 슬라이드 없음)다.\n\n{analogy}\n3장은 '''인생이라는 게임의 공략집'''이다. 피아제는 \"레벨(단계)마다 열리는 스킬\"을 정리한 사람이고(감각 운동 → 전조작 → 구체적 조작 → 형식적 조작), 에릭슨은 \"레벨마다 등장하는 보스(심리사회적 위기)\" 목록을 만든 사람이며(신뢰 vs 불신 … 통합 vs 절망), 콜버그는 \"도덕 퀘스트를 어떤 이유로 깨는가\"를 분류한 사람이다. 비고츠키는 \"혼자 깨지 말고 고수(부모·교사)가 옆에서 [[도약대|발판]]을 깔아 주면 더 빨리 큰다\"고 말한 공략 스트리머쯤 된다.\n{/analogy}\n\n{exam}\n교수 강조 총정리(통합요약 §0-1, 🎙 9/15): '''피아제는 물리적 환경, 비고츠키는 사회적 환경''' · 마음 이론이 발달해야 사회성(공감)이 생김 · '''권위적 vs 권위주의적 용어 혼동 주의''' · 양육 방식과 자녀 특성은 '''상관이지 인과가 아님''' · 거울 실험으로 자기 개념 확인('''15–18개월''') · 노화하면 '''회상은 떨어지고 재인은 유지''' · 성공적 노화는 '''세 요인이 모두''' 필요.\n{/exam}\n\n== 0. 이 장이 다른 장과 이어지는 곳 ==\n\n{| class=\"table\"\n! 다른 장에서 배운 것 || 3장에서 쓰이는 곳\n|-\n| 서막 [[선천성-후천성 논제]] (둘 다 중요) || p.2 발달심리학의 첫 번째 논제 \"선천성과 후천성\", p.22 애착 = 선천적 기질 + 양육 방식\n|-\n| 서막 [[생물심리사회적 접근법]] || 🎙 발달심리학 = 생물·심리·사회문화 세 수준 '''각각의 변화'''를 탐구. p.40 [[성공적 노화]] 그림도 생물학적·심리적·사회문화적 영향 세 상자\n|-\n| 1장 [[연구 방법 비교]] · [[사회조사]] · [[실험법]] || p.3 [[횡단 연구]] vs [[종단 연구]] — 발달 연구 전용 설계\n|-\n| 1장 [[상관]] (상관 ≠ 인과) || p.25 \"양육 방식과 자기개념 발달은 '''상관관계'''이지 인과가 아님\"\n|-\n| 2장 [[신경 가소성]] · [[편도체]] · [[신경전달물질|아세틸콜린]] || p.2 결정적 시기, p.24 학대 아동의 위협 탐지 영역(편도체) 과활성화, p.36 알츠하이머 = 아세틸콜린 생산 저하\n|-\n| 5장 [[민감화]] / 둔감화 → [[습관화]] || p.6 신생아의 습관화 (5장 p.2 의 \"둔감화(Habituation)\" 와 같은 것)\n|-\n| 5장 [[거울 뉴런]] · [[관찰 학습]] || p.18 [[마음 이론]](5장 p.35 가 거울 뉴런과 연결), p.26 거울 실험 🎙\n|-\n| 6장 [[회상]] · [[재인]] || p.35 노화하면 회상↓ 재인 유지, [[설단 현상]]\n|}\n\n== p.2 — 발달심리학의 목표: 세 가지 논제 ⭐⭐⭐ ==\n\n[[img:L3-02.png|p.2 발달 심리학의 주요 주제 — 선천성과 후천성 · 연속성과 단계 · 안정성과 변화|medium]]\n\n'''발달심리학'''(Developmental Psychology)은 '''일생에 걸친 신체, 인지, 사회성 발달을 탐구'''하는 분야다. 🎙 교수 설명으로는 [[생물심리사회적 접근법]]의 세 수준(생물·심리·사회) 각각이 나이에 따라 어떻게 변하는지를 보는 학문이다. 주로 탐구하는 논제는 세 가지.\n\n=== 발달심리학의 세 논제 ===\n{def}\n'''설명''': 발달심리학이 주로 탐구하는 세 가지 논제 — ① 유전과 경험의 상호작용이 발달에 미치는 영향 ② 발달이 점진적인가 계단식인가 ③ 일생 유지되는 특질과 변하는 것 (3장 p.2)\n'''명칭''': '''선천성과 후천성 · 연속성과 단계 · 안정성과 변화'''\n{/def}\n\n=== 연속성과 단계 ===\n{def}\n'''설명''': 발달 과정은 점진적인가(연속적) 아니면 계단식으로 발전하는가?(단계) 를 묻는 발달심리학의 논제 (3장 p.2)\n'''명칭''': '''연속성과 단계''' (Continuity vs Stages)\n{/def}\n피아제·에릭슨·콜버그는 모두 '''단계'''(stage) 이론이다. 그런데 이 장 곳곳에서 \"현대 연구는 더 '''연속적'''\"이라는 반론이 나온다(p.10 대상 영속성, p.16 재고찰할 점). 🎙 교수 표현: \"0과 1처럼 계단식이 아니라 점진적 변화\".\n\n=== 안정성과 변화 ===\n{def}\n'''설명''': 일생에 걸쳐 유지되는 성격 특질은 무엇이고, 나이를 먹음에 따라 변하는 것은 무엇인가를 묻는 발달심리학의 논제 (3장 p.2)\n'''명칭''': '''안정성과 변화''' (Stability vs Change)\n{/def}\n\n첫 번째 논제 '''선천성과 후천성'''은 서막의 [[선천성-후천성 논제]] 그대로다. [노트] 2장의 [[신경 가소성]]과 이어지는 '''결정적 시기'''(critical period) 개념도 여기서 출발한다 → [[각인|결정적 시기]].\n\n== p.3 — 횡단 연구 vs 종단 연구 ⭐⭐⭐ ==\n\n[[img:L3-03.png|p.3 횡단 연구와 종단 연구의 장점·단점 표|medium]]\n\n{| class=\"table\"\n! || [[횡단 연구]] (Cross-sectional Study) || [[종단 연구]] (Longitudinal Study)\n|-\n| 방식 || '''동일 시간대'''의 '''상이한 집단'''을 연구 || '''동일한 집단'''을 '''시간 경과'''에 따라 추적·조사\n|-\n| 장점 || 다량의 데이터 수집 용이 || 개인 혹은 집단의 '''변화 양상''' 추적 용이\n|-\n| 단점 || 한 집단의 변화 양상 추적 어려움 || '''중도 이탈'''의 가능성이 높음\n|}\n\n{exam}\n🎙 9/15 교수 강조: '''종단 연구의 기간은 꼭 몇 년 단위가 아니다''' — 며칠 간격으로 학습이 됐는지 테스트하는 짧은 연구도 종단 연구다. bank 객관식의 정답 보기가 바로 이 문장(\"추적 기간이 짧은 경우에도 적용할 수 있다\").\n{/exam}\n\n== p.4–5 — 출생 이전의 발달 ⭐ ==\n\n[[img:L3-04.png|p.4 태아의 발달 과정(접합자~태아)|medium]]\n\n* 태아는 '''접합자(수정란) → 배아 → 태아''' 순서로 발전하며, 배아 때부터 생물적 발달이 시작된다.\n* '''6개월''' 시점의 태아는 소리, 그중에서도 '''어머니의 목소리'''에 반응한다(Hepper, 2005). 신생아 울음소리에는 '''모국어의 억양'''이 반영된다(Mampe et al., 2009).\n* 슬라이드 결론: 외부 환경에 대한 '''지각'''을 수행할 수 있는 부분에서부터 발달이 시작된다.\n* p.5 → [[테라토겐]](teratogen): 태아에게 해를 끼칠 수 있는 '''모든 물질의 총칭'''(알코올, 니코틴, 바이러스 등). 후생유전적 특징을 남긴다(Liu et al., 2009). [노트] 예: 태아 알코올 증후군.\n\n== p.6–7 — 신생아의 능력 ⭐⭐ ==\n\n[[img:L3-06.png|p.6 신생아의 습관화 — 같은 공을 반복해서 보여 주면 반응이 점점 줄어든다|medium]]\n\n* 반사: 뺨에 촉각이 느껴지면 그쪽으로 고개를 돌리고, 입 근처에 닿으면 물려고 하고, 손에 닿으면 쥐려고 한다.\n* [[습관화]](Habituation): '''자극이 반복될 경우 반응이 줄어드는 현상'''. 신생아도 반복 자극에 반응 빈도를 낮춘다 → 유아가 '''무엇을 보고 기억하는지'''에 대한 안목을 제공. 🎙 습관화가 일어난다 = 이 자극을 전에 겪었는지 판별하는 기초 기억이 있다.\n* p.7 선호 반응: '''어머니와 관련된 자극'''을 태생적으로 선호(MacFarlane, 1978), 사람의 말소리·얼굴 그림에 더 많이 반응(Reid et al., 2018) → 유아의 사회적 반응이 어떻게 촉진되는지 보여 줌. 🎙 음악·풍경보다 사람 관련 자극에 더 오래 반응.\n\n[[img:L3-07.png|p.7 유아의 엄마에 대한 선호도(친숙한 자극에 대한 선호)|small]]\n\n== p.8–16 — 피아제의 인지 발달 단계 ⭐⭐⭐ ==\n\n[[img:L3-16.png|p.16 피아제 이론의 발달단계 요약 — 연령·단계·발달 현상·의의·재고찰할 점|large]]\n\n[[피아제의 인지 발달 단계|장 피아제]](Jean Piaget)는 '''특정 연령의 아동이 생성하는 오류가 유사하다'''는 점에 주목했다. 아동의 추론은 어른과 다르고 상당히 비논리적이다(Brainerd, 1996). 아동의 마음은 단순 반사에서 시작해 최종적으로 '''추상적 추리 능력'''에 도달하며, 그 사이를 '''연령에 따른 4단계'''로 나눴다.\n\n=== p.9 — 원동력: 스키마·동화·조절 ===\n경험을 이해하려는 노력이 인지 발달의 원동력이다. 어린이는 [[스키마]]를 만들고, 그 스키마에 대해 [[동화]]와 [[조절]]을 수행한다.\n\n{| class=\"table\"\n! 명칭 || 슬라이드 정의 (p.9) || 한 줄 예\n|-\n| [[스키마]] (Schema) || 정보를 체제화하고 해석하는 '''틀''' || \"네 발 달린 동물 = 멍멍이\"\n|-\n| [[동화]] (Assimilation) || 새로운 경험을 '''기존의 스키마로''' 해석 || 고양이를 보고 \"멍멍이!\"\n|-\n| [[조절]] (Accommodation) || 새로운 정보의 수용을 위해 '''스키마를 변화/적응'''시키는 것 || \"고양이\"라는 새 범주를 만든다\n|}\n\n=== 4단계 한눈에 ===\n{| class=\"table\"\n! 연령 || 단계 || 발달 현상 (p.16) || 사전 문서\n|-\n| 출생~2세 || '''감각 운동''' || 감각 행위를 통한 경험, '''대상영속성, 낯가림''' || [[감각 운동 단계]], [[대상 영속성]]\n|-\n| 2~6세 || '''전조작''' || 단어·이미지 표상, 논리보다 '''직관''', '''자기중심성, 가상놀이''', 보존 결여 || [[전조작 단계]], [[자기중심성]], [[보존 개념]]\n|-\n| 7~11세 || '''구체적 조작''' || 구체적 사건에 대한 논리적 사고·수리 연산, '''보존 개념, 수학적 변환''' || [[구체적 조작 단계]]\n|-\n| 12세~성인 || '''형식적 조작''' || '''추상적 추리''', 성숙한 도덕 추리 잠재성 || [[형식적 조작 단계]]\n|}\n\n[[anim:object_permanence|천으로 가린 장난감을 6개월 이전 아기와 이후 아기가 어떻게 대하는지 본 뒤, 아래 '유아 물리학' 응시 시간 막대를 확인하라]]\n\n=== p.10–11 — 감각 운동 단계 ===\n[[img:L3-10.png|p.10 감각 운동 단계 — 천으로 가린 장난감을 찾는 아기(대상영속성)|medium]]\n\n출생~만 2세. 신체 감각과 운동으로 세상을 받아들인다. 생후 '''6개월 이전'''에는 [[대상 영속성|대상영속성]](대상이 물리적으로 지각되지 않아도 존재함을 아는 것)이 없고 그 이후에 형성된다. 단, 현대 발달심리학은 이 발달이 '''점진적·연속적'''이라고 본다(Wang et al., 2004). p.11 [[감각 운동 단계|유아 물리학]](대상영속성을 위배한 사물을 더 오래 응시)·[[감각 운동 단계|유아 수학]](공 개수 불일치에 더 오래 응시, 캐런 윈 2008)은 피아제가 '''간과한''' 이른 추론 능력이다.\n\n=== p.12–13 — 전조작 단계 ===\n[[img:L3-12.png|p.12 전조작 단계 — 같은 양의 우유를 다른 모양의 컵에 옮기는 보존 과제|medium]]\n\n2~6세. 대상을 단어·이미지로 '''표상'''할 수는 있지만 '''심적 조작'''(행동 과정을 상상하거나 역전시키기)은 못 한다. 그래서 [[보존 개념]]이 결여되어 있고(시각에 초점 → 수면이 높은 컵이 더 많다), [[자기중심성]](타인도 자신과 동일할 것이라 여김)이 나타난다. p.13 [[전조작 단계|가상 놀이]](3세 이후, 주디 들로치 1987): 방 모형에 숨긴 인형 위치를 실제 방에서 찾는다 → 상징적 사고가 일찍 발달.\n\n=== p.14–15 — 구체적 조작 단계 · 형식적 조작 단계 ===\n[[img:L3-14.png|p.14 구체적 조작 단계 — 수량 보존·형태 변형 과제|medium]]\n\n* [[구체적 조작 단계]](만 7~11세): 구체적 물질에 대한 '''보존'''을 이해하기 시작, 심적 조작 가능, 수학적 변형 이해.\n* [[형식적 조작 단계]](12세 이후~): 상상·상징 등 '''추상적 사고'''의 확장, 아동의 사고가 '''과학자처럼''' 진행 — 가설적 명제와 결론 도출, 체계적 추리. 7세 아동은 명제 추론을 못 한다(Suppes, 1982).\n\n[[sim:piaget_stages]]\n\n=== p.16 — 의의와 재고찰할 점 ===\n{| class=\"table\"\n! 의의 (🎙 \"두 가지 공헌\") || 재고찰할 점\n|-\n| ① 아동의 발달 과정에 대한 '''인지적 이정표'''(milestone) 제공 || ① 발달 단계가 훨씬 더 '''연속적'''으로 진행\n|-\n| ② 아동이 수동적 수용자가 아닌 '''적극적 상호작용'''을 추구하는 존재임을 함의 || ② 각 유형의 사고가 '''더 이른 시기'''에 발현되기도 함 (유아 물리학·수학, 가상 놀이)\n|}\n\n{warn}\nbank 함정: \"자기중심성·보존 결여 = 구체적 조작 단계\" ✗ → '''전조작'''. \"가설적 명제 추리 = 감각 운동\" ✗ → '''형식적 조작'''. \"출생~2세 = 형식적 조작\" ✗ → '''감각 운동'''. 보존은 전조작에서 '''결여''', 구체적 조작에서 '''이해 시작'''.\n{/warn}\n\n== p.17 — 대안적 견해: 비고츠키의 사회적 아동 ⭐⭐⭐ ==\n\n[[img:L3-17.png|p.17 피아제 이론 vs 비고츠키의 사회적 아동 — 물리적 / 사회적 이 노란색으로 강조되어 있다|large]]\n\n{| class=\"table\"\n! || [[피아제의 인지 발달 단계|피아제]] || [[비고츠키]]의 사회적 아동\n|-\n| 아동의 마음이 성장하는 경로 || '''물리적''' 환경과의 상호작용 || '''사회적''' 환경과의 상호작용\n|-\n| 핵심 || 물리적 대상/환경 변화에 대한 '''심적 조작''' 과정 || 부모와 교사가 새로운 어휘를 제공해 성장의 [[도약대]](scaffolding)를 제공\n|-\n| 언어 || — || 언어가 사고의 토대 → 내면화하여 [[비고츠키|속내말]](inner speech)로 문제 해결\n|}\n\n{exam}\n🎙 9/15 47:37–48:32: \"피아제는 '''물리적''' 환경, 비고츠키는 '''사회적''' 환경.\" 슬라이드에서도 두 단어만 노란 형광펜. 객관식에서 두 학자의 내용을 '''맞바꾼''' 보기가 단골이다.\n{/exam}\n\n== p.18 — 마음 이론 ⭐⭐⭐ ==\n\n[[img:L3-18.png|p.18 젠킨스 & 애스팅턴(1996) 실험 — 반창고 상자 안에 연필|medium]]\n\n[[마음 이론]](Theory of Mind): 감정·지각·사고·행동 등을 포함한 '''타인과 자신의 심적 상태에 대한 사람들의 생각'''. 타인의 심적 상태를 추론하는 능력과 밀접하다. '''4~5세'''를 기점으로 급격히 발전하며, '''타인이 잘못된 인식을 지닐 수 있다'''는 사실을 이해하게 된다 → 타인에 대한 이해와 공감의 시작점. 소통 기회가 부족한 아동은 마음 이론이 미숙하다(Peterson & Siegal, 1999).\n\n젠킨스 & 애스팅턴(1996): 반창고 상자를 열면 연필 → \"다른 친구는 안에 뭐가 있다고 할까?\" → '''3세: 연필''' / '''4~5세: 반창고'''.\n\n{exam}\n🎙 9/15 52:27: \"마음 이론이 발전을 해야만 비로소 타인에 대한 이해와 공감이 시작된다\" → 사회성 측면에서 굉장히 중요한 능력.\n{/exam}\n\n== p.19–24 — 애착 ⭐⭐⭐ ==\n\n[[img:L3-19.png|p.19 할로우의 대리모 실험(1971) — 새끼 원숭이가 천 대리모에 매달려 있다|medium]]\n\n[[애착]](attachment) = '''타인과의 정서적 유대'''. '''낯가림'''의 발달이 유아와 부모 간 애착 형성의 시작이다.\n\n{| class=\"table\"\n! 애착의 원천 (p.19) || 근거 || 사전 문서\n|-\n| '''신체 접촉''' (온기·부드러움) — 가장 기본적인 요소 || 할로우의 대리모 실험: 원숭이는 담요(천)가 있는 쪽을 선호 || [[할로우의 대리모 실험]]\n|-\n| '''친숙성''' || 오리의 각인 = 친숙성 기반 애착, 애착도 '''결정적 시기'''(critical period)에 형성 || [[각인]]\n|}\n\n* p.20 접촉을 통한 애정 표현 → 애착 형성 → 두뇌 발달·인지 능력 증폭. 성숙하면 애착이 부모 외 다른 사람으로 이동.\n* p.21 [[안정 애착과 불안정 애착]]: 차이는 '''부모의 적절한 반응'''에 따라 결정(De Wolff & Van IJzendoorn, 1997).\n* p.22 애착 형성 = '''선천적 기질 + 양육 방식''' 둘 다. 감수성 훈련이 기질적으로 변동성이 높은 아동의 안정 애착 비율을 바꾼다(판덴붐, 1994).\n* p.23 안정 애착 → [[기본 신뢰감]](세상은 예측할 수 있고 믿을 만하다는 느낌, 후천적). 불안정 애착 = [[안정 애착과 불안정 애착|불안 애착]](인정 갈망·배척 신호 예민) / [[안정 애착과 불안정 애착|회피 애착]](긴밀한 관계가 불편, 거리 유지). 단 불안·회피 경향은 위험 탐지·회피에 도움이 될 수도(Ein-Dor et al., 2010).\n\n[[img:L3-24.png|p.24 차우셰스쿠의 아이들 — 루마니아 보육원의 애착 박탈|medium]]\n\n* p.24 [[애착|애착 박탈]]: 지능·두뇌 발달 저하, 비정상적 스트레스 반응, ADHD(루마니아 아동). 극단적 외상은 화난 얼굴에 대한 위협 탐지 영역(🎙 [[편도체]]) 과활성화. 그러나 '''적절한 수준의 역경'''은 회복 탄력성을 높인다. 🎙 \"불안정 애착보다 진짜 위험한 건 애착 '''박탈'''\".\n\n== p.25 — 양육 방식의 유형 ⭐⭐⭐ ==\n\n[[img:L3-25.png|p.25 양육 방식의 유형과 자기개념 발달에 미치는 영향 — 아래 밑줄: 상관이지 인과가 아님|large]]\n\n{| class=\"table\"\n! 유형 || 부모 || 자녀\n|-\n| '''권위주의적'''(authoritarian) || 강압적, '''복종'''을 요구 || 사회적 기술·자존감 저하 위험, 실수할 때 두뇌 과민반응\n|-\n| '''허용적'''(permissive) || 제약 없이 모든 행동 '''무조건 허용''' || 공격적·미숙\n|-\n| '''방임적'''(neglectful) || 어떠한 주의도 기울이지 않음(관계 형성 포함) || 학업·사회적 관계가 매우 낮을 수 있음\n|-\n| '''권위적'''(authoritative) || 요구를 하지만 '''타협'''으로 자녀의 요구를 수용 || '''높은 자존감·자기신뢰감·자율성'''\n|}\n\n→ 상세: [[권위적·권위주의적·허용적 양육]]\n\n{exam}\n🎙 9/15 1:19:03 \"둘 다 authority 에서 왔기 때문에 '''중간에 뭐가 더 붙냐 안 붙냐'''로 외우면 괜찮지 않을까\" — '''「~주의」가 붙으면 강압(나쁜 쪽)'''. 그리고 \"양육 스타일과 아이 성향은 '''상관관계'''이지 인과적으로 해석할 수 있는 건 아니다\"(견보호자·호부견자).\n{/exam}\n\n== p.26 — 자기 개념의 발달 ⭐⭐⭐ ==\n\n[[img:L3-26.png|p.26 자기에 대한 인식 — 거울 앞 아기|small]]\n\n[[자기 개념]](Self-concept)은 아동기의 '''가장 중요한 사회적 성취'''다. '''15~18개월'''부터 형성된다. 코에 빨간 점을 찍고 거울을 보여 주면(Courage & Howe, 2002) 🎙 6개월 아기는 거울 속 상으로 손을 뻗고, 15개월쯤 된 아기는 '''자기 코'''로 손을 뻗는다. 학령기에는 소속 집단·심리적 특질·타인과의 유사성/차별성이 구체화되어 이상적 자기 개념을 형성한다(Stipek, 1992).\n\n== p.27 — 청소년기의 인지 발달 ⭐⭐ ==\n\n[[img:L3-27.png|p.27 총기 개혁을 요구하는 학생들의 시위 — 타인의 추리에서 모순·위선을 밝혀냄|small]]\n\n* 10대 초기: [[자기중심성]]이 지속되어 추리가 자신에게 집중 — \"대부분의 사람에게 일어나는 일이 나에게는 일어나지 않을 것\"이라는 믿음.\n* 추리 능력: [[형식적 조작 단계]]와 청소년기가 '''중첩'''. 추상적 사고가 본격화 → 이상적인 모습과 불완전한 현실을 비교, 타인의 추리에서 '''모순이나 위선'''을 밝혀냄(도덕성 발달과 연관).\n\n== p.28–30 — 도덕성 발달 ⭐⭐⭐ ==\n\n[[img:L3-29.png|p.29 콜버그의 도덕적 사고 수준 — \"사랑하는 이를 위해 약을 훔쳐도 되는가?\"|large]]\n\n'''도덕 추리'''(moral reasoning) = 옳고 그른 것을 따질 때 발생하는 사고의 과정. 이에 기반해 [[콜버그의 도덕성 발달 단계]]가 제안되었고(도덕적 딜레마에 대한 사고 양상의 발달 변화를 추적), 아동의 도덕적 판단은 '''인지 발달에 기초'''한다(피아제+콜버그).\n\n{| class=\"table\"\n! 수준(연령) || 초점 || 약을 훔쳐도 되는가?\n|-\n| '''전인습적'''(9세 이전) || '''처벌'''을 피하거나 '''구체적 보상''' || \"교도소 가니까 안 돼\" / \"안 잡힐 수 있으니 훔쳐도 돼\"\n|-\n| '''인습적'''(청소년 초기) || '''사회적 인정''', '''사회 질서 유지''' || \"아픈 딸을 위해 훔칠 수 있다\" / \"법을 어기면 나쁜 사람이니 안 돼\"\n|-\n| '''후인습적'''(청소년기와 그 이후) || '''보편적 기본 권리''', 자신이 규정한 '''윤리적 원칙''' || \"누구나 살 권리가 있으니 생명권 보장을 위해 훔친다\"\n|}\n\n[[img:L3-30.png|p.30 트롤리 딜레마 — 레버만 돌리기 vs 직접 사람을 밀치기|small]]\n\np.30 [[도덕 직관]](하이트, 2012): 도덕성의 상당 부분은 '''이성보다는 직관과 정서'''에 기반 — 판단이 자동적·신속, 혐오감·기쁨 같은 정서가 도덕 추리를 촉발. 트롤리 딜레마에서 볼 수 있다. '''도덕 행위''': 보통 사고·감정 → 언행이지만, '''도덕적 행동을 통해 도덕적 태도를 함양'''하는 것도 가능. 🎙 법원의 행동(치료) 프로그램 이수 명령이 그 예.\n\n== p.31–34 — 청소년기의 사회성 · 에릭슨 (유아~청소년기) ⭐⭐⭐ ==\n\n[[img:L3-31.png|p.31 청소년기의 정체성 형성 — 가족·친구·학교·사회 속의 '나'를 통합|medium]]\n\n* p.31 [[에릭슨의 심리사회적 발달 단계|에릭슨]](1963): 삶의 각 단계는 '''심리사회적 과제(위기)'''를 수반. 청소년기 = [[정체성]](identity) 확립 — 집·학교·온라인 등 다양한 상황의 '자기'를 시도하고 '''통합'''하여 사회적 정체성 수립(🎙 가장 중요한 요소 = '''차별성'''). 자신만의 삶의 방식 선호(Lyons, 2004), 개인적 성취 욕망.\n* p.32 친밀감 발달을 통한 소속감 향상. 문화권에 따라 차이 — 개인주의 문화권에서 또래 간 낭만적 관계(Li et al., 2010). 🎙 개인주의/집단주의 차이는 '''자기소개 방식'''에서 드러남(→ [[비교문화심리학]]).\n* p.33 부모-또래 관계: 또래 영향력이 커지지만 부모와의 관계가 또래 관계에도 영향. SNS에서 좋아요가 많은 또래 사진 → '''보상 처리''' 두뇌 영역 활성화(Sherman et al., 2016).\n\n[[img:L3-34.png|p.34 에릭슨의 심리사회적 발달 단계(유아~청소년기)|large]]\n\n== p.35 — 성인기의 인지 기능: 발달과 노화 ⭐⭐⭐ ==\n\n[[img:L3-35.png|p.35 연령대별 회상 기억 능력(좌)과 재인/회상 능력 변화(우) — 회상 곡선은 내려가고 재인 곡선은 거의 평평|large]]\n\n* 노년층은 기억 문제를 줄이려 '''단서'''를 활용(Henry et al., 2004). 기억력의 '''개인차는 나이가 들수록 커진다'''.\n* 일부 인지 기능은 노화에 따른 저하가 나타나지 않는다(Schonfield & Robertson, 1966): '''[[재인]] 능력은 [[회상]]과 달리 변화가 적다'''.\n* 노년층은 [[설단 현상]] 망각을 더 자주 경험(Ossher et al., 2012).\n\n{exam}\n🎙 9/15 1:52:33–1:54:06: \"회상 과제는 노화에 따라 하락하지만 '''재인 과제는 변화가 거의 없다'''.\" 노인이 단어를 못 떠올리는 건 기억이 지워진 게 아니라 '''직접 산출'''의 문제. bank 정답 보기 = \"회상↓ 재인 변화 적음 + 설단 현상 증가\". 함정 = \"개인차는 나이 들수록 줄어든다\"(✗ 커진다).\n{/exam}\n\n== p.36 — 신경인지장애와 알츠하이머 ⭐⭐ ==\n\n[[img:L3-36.png|p.36 뇌영상을 통한 알츠하이머 예측|medium]]\n\n=== 신경인지장애 ===\n{def}\n'''설명''': 뇌졸중, 알코올 등에 의해 두뇌가 손상되면 발생하는 장애 (3장 p.36)\n'''명칭''': '''신경인지장애''' (Neurocognitive Disorder)\n{/def}\n\n=== 알츠하이머 ===\n{def}\n'''설명''': 아세틸콜린의 생산 저하와 밀접한 연관이 있고, 환자의 뉴런 상에 단백질 조각이 잔여물 형태로 남는 질환 (3장 p.36)\n'''명칭''': '''알츠하이머''' (Alzheimer's disease)\n{/def}\n\n* [[신경전달물질|아세틸콜린]] 생산 저하와 밀접(2장 p.9 표와 연결).\n* 알츠하이머 환자는 뉴런에 '''단백질 조각'''이 잔여물 형태로 남는다(De Meyer et al., 2010).\n* '''심신 활동을 지속적으로 유지'''하면 치매 발현을 지연시킬 수 있다(Horder et al., 2018). 🎙 예방·완치는 어렵더라도 증상 악화를 완화.\n\n== p.37 — 성인기의 사회성: 사회적 시계와 중년기 ⭐⭐⭐ ==\n\n[[img:L3-37.png|p.37 중년기로의 전환 시점에서의 고민|medium]]\n\n* [[사회적 시계]](social clock): 결혼, 은퇴 등 사회적 사건에 대해 '''문화적으로 선호하는 타이밍'''. 문화나 시대에 따라 '''항상 변화'''한다.\n* 중년기로의 전환(40대): 통념은 \"심리적 위기와 좌절감\"이라고 주장하지만 '''40대에 그만한 사건이 자주 발생하지는 않는다'''(Hunter & Sundel, 1989).\n\n== p.38 — 성인기의 두 측면: 친밀감과 생산성 ⭐⭐⭐ ==\n\n[[img:L3-38.png|p.38 성인기의 2가지 측면 — 친밀감(사랑)과 생산성(직업)|medium]]\n\n=== 친밀감 ===\n{def}\n'''설명''': 성인기의 두 측면 중 하나로, 관심사와 가치관·정서적 지원 등의 공유를 통해 유대 관계를 형성하는 것(사랑) (3장 p.38)\n'''명칭''': '''친밀감''' (Intimacy)\n{/def}\n* 결혼은 개인의 행복감, 신체 및 심리 건강을 예측. 혼전 동거는 더 높은 이혼율·파경을 보고(Jose et al., 2010).\n* 긍정적/부정적 상호작용 비율이 '''5:1'''은 되어야 성공적 결혼 생활 유지(고트만 & 고트만, 2018).\n\n=== 생산성 ===\n{def}\n'''설명''': 성인기의 두 측면 중 하나로, 자신의 흥미에 맞으며 유능감과 성취감을 제공해 주는 직업을 갖는 것이 행복과 연관된다는 측면(직업) (3장 p.38)\n'''명칭''': '''생산성''' (Generativity)\n{/def}\n* 높은 직무 만족은 곧 삶의 만족으로 귀결. 🎙 직무 만족을 연구하는 분야 = 조직 심리학(→ [[심리학의 하위 분야]]의 산업조직).\n\n== p.39 — 에릭슨의 심리사회적 발달 단계 (성인~노년기) ⭐⭐⭐ ==\n\n[[img:L3-39.png|p.39 에릭슨의 심리사회적 발달 단계(성인~노년기)|large]]\n\n{| class=\"table\"\n! 단계 || 심리사회적 위기 || 해결해야 할 과제 (p.34, p.39)\n|-\n| 유아기(0~1세) || '''신뢰감 vs 불신감''' || 욕구가 신뢰할 만큼 충족되면 [[기본 신뢰감]] 발달\n|-\n| 걸음마기(1~2세) || '''자율성 vs 수치감+자기의심''' || 의지를 나타내고 스스로 행하는 방식 학습 / 아니면 능력 의심\n|-\n| 학령 전기(3~6세) || '''선도성 vs 죄책감''' || 과제를 스스로 하며 계획 실행 학습 / 아니면 죄책감\n|-\n| 청소년기(10~20대) || '''[[정체성]] vs 역할 혼미''' || 역할을 검증해 자기감 정교화 / 아니면 자신에 대한 혼란\n|-\n| 성인 초기(20~40대 초) || '''친밀감 vs 소외감''' || 밀접한 관계·사랑하는 사람 / 아니면 고립감\n|-\n| 중년기(40~60대) || '''생산성 vs 침체감''' || 가족과 일을 통한 자신감·사회 공헌감 / 아니면 목표감 상실\n|-\n| 노년기(60대 후반~) || '''통합감 vs 절망감''' || 삶을 되돌아볼 때 만족감 혹은 실패감\n|}\n\n{info}\n슬라이드 두 장(p.34·p.39)에는 '''7개''' 단계만 실려 있다(학령기 단계는 슬라이드에 없음). 시험은 슬라이드 기준이므로 위 7행을 외운다.\n{/info}\n\n== p.40 — 평생에 걸친 웰빙과 성공적 노화 ⭐⭐ ==\n\n[[img:L3-40.png|p.40 평생에 걸친 웰빙 — 위: 전날 다른 사람과 보낸 시간과 행복감(65세 이상 vs 18–29세), 아래: 성공적 노화의 세 영향|medium]]\n\n* 노인층은 애착 불안·스트레스·분노가 '''감소'''(Chopik et al., 2013), 젊은 성인과 달리 '''삶의 좋은 일을 더 잘 기억'''(Addis et al., 2010), 대인 관계 문제를 적게 보고 → 삶의 만족감(Crabtree, 2011).\n* 🎙 '이순(耳順, 60세)': 남의 말이 귀에 거슬리지 않는 나이 — 노년층 스트레스가 적다는 경험적 표현.\n* [[성공적 노화]]: 그림의 '''세 영향'''(생물학적·심리적·사회문화적)이 '''모두 갖춰져야''' 가능. 🎙 낙관적 관점 + 지속적인 대인 관계 + 생물학적 영향(타고나는 부분).\n\n{joke}\n🎙 교수가 들은 긍정심리학 교수님의 명언: \"75세까지 건강한 건 '''노력'''으로 되고, 그 이상은 '''타고나야''' 한다. 그러니 일단 75세까지 행복하고 건강하게 사는 걸 목표로.\" — 시험 기간 밤샘은 이 목표에 반하는 행위임을 알린다.\n{/joke}\n\n== 🎙 실제 수업 기록 (9/15 화, 녹음본 기준) ==\n\n전체 약 134분. \"시험에 나온다\"는 직접 발언은 전문 검색에서 확인되지 않았다 — 아래는 강조·추가 설명.\n\n{| class=\"table\"\n! 시각 || 내용\n|-\n| 00:14–01:09 || 발달심리학 = 생물심리사회적 세 수준 전부의 변화. 세 논제\n|-\n| 04:06–07:22 || 횡단·종단. 흡연의 영향 = 종단. '''종단은 며칠 단위 짧은 기간에도 가능'''. 종단의 위험 = 중도 이탈\n|-\n| 15:16–19:34 || 신생아 반사, '''습관화''' = 반복 자극에 반응 감소(지루함), 사람 자극 선호\n|-\n| 19:59–25:33 || 피아제: 스키마 형성·변화로 발달, '''외부 물리적 환경과의 상호작용'''. 감각운동기 최대 능력 = 대상영속성\n|-\n| 28:25–31:33 || 인과 추론은 감각운동기부터 — 유아 물리학·유아 수학(응시 시간)\n|-\n| 32:36–35:29 || 전조작: 보존 결여(우유 수면 높이), 자기중심성(숨바꼭질에서 자기 눈만 가림)\n|-\n| 39:52–43:47 || 감각운동기 = 대상영속성 + '''낯가림'''(→ 애착의 시작). 피아제의 '''두 공헌''': 이정표, 아동의 능동성\n|-\n| 44:42–48:32 || 피아제의 한계(계단식 아닌 점진적). '''비고츠키 = 사회적 환경'''\n|-\n| 49:02–52:27 || 마음 이론(반창고/연필). '''마음 이론이 발전해야 공감·사회성 시작'''\n|-\n| 53:13–59:09 || 할로우 대리모: 철사 대리모에는 '''배고플 때만''' 감. 오리 각인\n|-\n| 1:00:07–1:17:54 || 부모의 적절한 리액션, 감수성 훈련, 불안·회피 애착, '''진짜 위험은 애착 박탈''', 회복 탄력성\n|-\n| 1:17:54–1:19:59 || 양육 4유형, '''권위적/권위주의적 구분 주의''', '''상관이지 인과 아님'''\n|-\n| 1:20:46–1:22:53 || 자기 개념: 15~18개월 거울 실험(6개월은 거울로, 15개월은 자기 코로 손)\n|-\n| 1:27:59–1:37:17 || 콜버그 3수준, 도덕 직관·정서, 엄벌주의, '''행동 → 태도'''\n|-\n| 1:37:59–1:51:23 || 정체성의 핵심 = '''차별성''', 자기소개 방식의 문화차, SNS 좋아요, 에릭슨 = 단계마다 위기\n|-\n| 1:52:33–1:59:00 || '''회상↓ 재인 유지''', 설단 현상, 알츠하이머(심신 활동으로 악화 완화)\n|-\n| 1:59:00–2:08:30 || 사회적 시계(입시→취업→결혼→은퇴), 중년 위기론 미지지, 5:1, 조직 심리학\n|-\n| 2:08:30–2:14:13 || 이순, '''성공적 노화 세 요인''', 75세 이야기. 총정리: 이론 = 피아제+비고츠키, 사회성 = 에릭슨, 도덕성 = 콜버그\n|}\n\n== 시험 대비 핵심 요약 ==\n# '''세 논제''': 선천성과 후천성 / 연속성과 단계 / 안정성과 변화. [[횡단 연구]](다른 집단 동시 비교, 다량 데이터) vs [[종단 연구]](같은 집단 추적, 중도 이탈; 짧은 기간도 가능).\n# [[테라토겐]] = 태아에게 해로운 모든 물질. [[습관화]] = 반복 자극에 반응 감소.\n# [[피아제의 인지 발달 단계|피아제]]: [[스키마]] · [[동화]](기존 틀로 해석) · [[조절]](틀을 바꿈). 4단계 = [[감각 운동 단계|감각 운동]](0~2, [[대상 영속성]]·낯가림) → [[전조작 단계|전조작]](2~6, [[보존 개념|보존]] 결여·[[자기중심성]]·가상 놀이) → [[구체적 조작 단계|구체적 조작]](7~11, 보존) → [[형식적 조작 단계|형식적 조작]](12~, 추상·가설 추리).\n# 피아제의 공헌 = 이정표 + 아동의 능동성 / 한계 = 더 연속적·더 이른 발현.\n# '''피아제 = 물리적 환경, [[비고츠키]] = 사회적 환경''' ([[도약대]], 속내말).\n# [[마음 이론]]: 4~5세, 잘못된 인식 이해 (3세 연필 / 4~5세 반창고) → 공감·사회성의 시작.\n# [[애착]]: 신체 접촉([[할로우의 대리모 실험|할로우]]) + 친숙성([[각인]], 결정적 시기). [[안정 애착과 불안정 애착|안정/불안정]](부모의 적절한 반응). 진짜 위험 = 애착 박탈. 안정 애착 → [[기본 신뢰감]].\n# [[권위적·권위주의적·허용적 양육|양육 4유형]]: 권위'''주의'''적 = 복종 강요 / 허용적 / 방임적 / 권위적 = 요구+타협(자존감↑). '''상관 ≠ 인과'''.\n# [[자기 개념]]: 15~18개월, 코에 빨간 점 거울 실험.\n# [[콜버그의 도덕성 발달 단계|콜버그]]: 전인습(처벌·보상) → 인습(인정·질서) → 후인습(보편 권리·윤리 원칙). [[도덕 직관]](하이트): 이성보다 직관·정서, 행동 → 태도.\n# [[에릭슨의 심리사회적 발달 단계|에릭슨]]: 신뢰/불신 → 자율/수치 → 선도/죄책 → '''[[정체성]]/역할 혼미''' → 친밀/소외 → 생산/침체 → 통합/절망.\n# 노화: '''회상↓ 재인 유지''', [[설단 현상]]↑, 개인차↑. 알츠하이머 = 아세틸콜린↓·단백질 조각, 심신 활동으로 지연.\n# [[사회적 시계]](문화·시대에 따라 변함), 중년 위기론 미지지, 친밀감(5:1)·생산성(직무 만족), [[성공적 노화]] = 세 요인 모두.\n\n== 관련 문서 ==\n* 사전: [[횡단 연구]] · [[종단 연구]] · [[테라토겐]] · [[습관화]] · [[피아제의 인지 발달 단계]] · [[스키마]] · [[동화]] · [[조절]] · [[감각 운동 단계]] · [[대상 영속성]] · [[전조작 단계]] · [[보존 개념]] · [[자기중심성]] · [[구체적 조작 단계]] · [[형식적 조작 단계]] · [[비고츠키]] · [[도약대]] · [[마음 이론]]\n* 사전: [[애착]] · [[할로우의 대리모 실험]] · [[각인]] · [[안정 애착과 불안정 애착]] · [[기본 신뢰감]] · [[권위적·권위주의적·허용적 양육]] · [[자기 개념]] · [[콜버그의 도덕성 발달 단계]] · [[도덕 직관]] · [[에릭슨의 심리사회적 발달 단계]] · [[정체성]] · [[설단 현상]] · [[사회적 시계]] · [[성공적 노화]]\n* 이전 장: [[2장 마음의 생물학과 의식]] · 다음 장: [[4장 감각과 지각]]\n* 시험 대비: [[명칭 암기표]] · [[자주 틀리는 함정 모음]] · [[모의고사 복기]] · [[시험 정보]]"

  "body": "'''횡단 연구'''(Cross-sectional Study)는 발달심리학의 두 연구 설계 중 하나로, '''같은 시점에 나이가 다른 여러 집단을 한꺼번에 비교'''하는 방법이다. 짝꿍은 [[종단 연구]]이고, 슬라이드는 \"횡단 연구와 종단 연구를 '''병행'''\"한다고 적었다(3장 p.3).\n\n{def}\n'''설명''': 동일 시간대의 상이한 집단을 연구하는 발달심리학의 연구 방법 (3장 p.3)\n'''명칭''': [[횡단 연구]] (Cross-sectional Study)\n{/def}\n\n{def}\n'''설명(사례형)''': 2026년 9월 한 달 동안 20대·40대·60대·80대 참가자를 각각 모집해 기억 검사를 한 번씩 실시하고, 연령대별 평균 점수를 비교했다.\n'''명칭''': [[횡단 연구]]\n{/def}\n\n{analogy}\n횡단 연구는 '''단체 사진 한 장'''이다. 졸업식 날 1학년부터 4학년까지 한 프레임에 세워 놓고 \"학년이 올라갈수록 키가 크네\"라고 말하는 것. 빠르고 사람도 많이 찍히지만, '''같은 사람이 어떻게 컸는지'''는 사진 한 장으로는 알 수 없다. 1학년과 4학년은 애초에 다른 사람들이니까.\n{/analogy}\n\n[[img:L3-03.png|3장 p.3 — 횡단 연구와 종단 연구의 장점·단점 표|medium]]\n\n== 장점과 단점 ==\n{| class=\"table\"\n! || [[횡단 연구]] || [[종단 연구]]\n|-\n| 대상 || '''상이한''' 집단 (예: 20대·60대) || '''동일한''' 집단\n|-\n| 시간 || '''동일 시간대''' 한 번 || '''시간 경과'''에 따라 추적\n|-\n| 장점 || '''다량의 데이터 수집 용이''' || 개인·집단의 '''변화 양상 추적 용이'''\n|-\n| 단점 || '''한 집단의 변화 양상 추적 어려움''' || '''중도 이탈''' 가능성 높음\n|}\n\n[노트] 정리본은 횡단 연구의 단점에 \"집단 간 동질성 문제\"를 덧붙인다 — 20대와 80대는 나이만 다른 게 아니라 자란 시대·교육 환경도 다르다.\n\n{warn}\nbank 함정: \"횡단 연구는 '''동일한 집단을 시간 경과에 따라 추적'''하는 방법이다\" ✗ → 그건 종단 연구. \"횡단 연구는 한 집단의 변화 양상 추적에 '''가장 적합'''\" ✗ → 오히려 그게 횡단의 '''단점'''이다. \"횡/종\"을 '''가로(동시)/세로(시간 축)'''로 기억하라.\n{/warn}\n\n{quiz}\n3장 p.35 왼쪽 그래프(Crook & West, 1990)는 18–39 / 40–49 / 50–59 / 60–69 / 70–90세 집단의 '''이름 회상 확률(한 번·두 번·세 번 소개한 후)'''을 같은 시점에 비교한다. 이처럼 여러 연령대를 동시에 검사하는 설계의 이름과 가장 큰 약점은?\n{/quiz}\n{answer}\n'''횡단 연구'''. 그래프는 나이 든 집단일수록 이름 회상 확률이 낮다는 '''연령대 간 차이'''를 보여 줄 뿐, 같은 사람이 나이 들며 어떻게 변했는지(변화 양상)는 직접 추적하지 못한다.\n{/answer}\n\n== 관련 문서 ==\n* [[종단 연구]] — 짝꿍\n* [[3장 일생에 걸친 발달]] — p.3 절\n* [[연구 방법 비교]] — 1장의 사례 연구·자연 관찰·사회조사·상관·실험\n* [[사회조사]] — 횡단 연구는 흔히 한 번의 조사로 이루어진다\n\n근거: 3장 p.3"
 },
 "종단 연구": {
  "title": "종단 연구 (Longitudinal Study)",
  "category": [
   "3장 일생에 걸친 발달",
   "연구 방법"
  ],
  "body": "'''종단 연구'''(Longitudinal Study)는 '''같은 사람들을 시간에 따라 계속 따라가며''' 변화를 재는 발달 연구 방법이다. [[횡단 연구]]가 못 하는 \"한 사람(집단)의 변화 양상\"을 볼 수 있다는 게 최대 장점이고, 오래 따라가는 만큼 사람들이 빠져나가는('''중도 이탈''') 게 최대 약점이다.\n\n{def}\n'''설명''': 동일한 집단을 시간 경과에 따라 추적 및 조사하는 발달심리학의 연구 방법 (3장 p.3)\n'''명칭''': [[종단 연구]] (Longitudinal Study)\n{/def}\n\n{def}\n'''설명(사례형)''': 흡연이 향후 건강에 미치는 영향을 알아보려고, 20세 흡연자·비흡연자 300명을 모집해 30년 동안 5년마다 건강 검진 결과를 추적했다. (🎙 9/15 교수 예시)\n'''명칭''': [[종단 연구]]\n{/def}\n\n{analogy}\n종단 연구는 '''아이 성장 앨범'''이다. 한 아이를 돌·세 살·초등 입학·졸업 때마다 찍어 두면 \"이 아이가 이렇게 컸구나\"가 한눈에 보인다. 대신 앨범이 길어질수록 이사·연락 두절로 '''중간에 사진이 끊기는 아이들'''이 생긴다 — 그게 중도 이탈이다.\n{/analogy}\n\n[[img:L3-03.png|3장 p.3 — 종단 연구의 장점(변화 양상 추적 용이)과 단점(중도 이탈 가능성 높음)|medium]]\n\n== 횡단 vs 종단 ==\n{| class=\"table\"\n! || [[횡단 연구]] || [[종단 연구]]\n|-\n| 한 줄 정의 || 동일 시간대의 상이한 집단 || 동일한 집단을 시간 경과에 따라\n|-\n| 장점 || 다량의 데이터 수집 용이 || '''개인 혹은 집단의 변화 양상 추적 용이'''\n|-\n| 단점 || 한 집단의 변화 양상 추적 어려움 || '''중도 이탈의 가능성이 높음'''\n|-\n| 기간 || 한 번 || 길 수도, 짧을 수도 (🎙 며칠 단위 가능)\n|}\n\n{exam}\n🎙 9/15 04:06–07:22 교수 강조: \"종단 연구의 기간이 꼭 몇 년 단위인 건 아니다. '''며칠 간격으로 학습이 이뤄졌는지 테스트'''하는 것도 종단 연구.\" bank 객관식 정답 문장 = \"종단 연구는 동일 집단을 추적하여 변화 양상을 확인하기 쉽고, '''추적 기간이 짧은 경우에도 적용할 수 있다'''.\"\n{/exam}\n\n{warn}\nbank 오답 보기: \"종단 연구는 참가자가 중간에 그만둘 가능성이 '''낮다'''는 장점\" ✗ — 중도 이탈 가능성이 '''높은''' 게 단점이다.\n{/warn}\n\n{quiz}\n\"종단 연구는 반드시 수년 이상 추적해야 성립한다.\" O/X?\n{/quiz}\n{answer}\n'''X'''. 핵심은 '''동일한 집단을 시간 경과에 따라''' 추적한다는 것이지 기간의 길이가 아니다(🎙 며칠 단위도 가능).\n{/answer}\n\n== 관련 문서 ==\n* [[횡단 연구]] — 짝꿍\n* [[3장 일생에 걸친 발달]] — p.3 절\n* [[연구 방법 비교]] — 1장 연구 방법 전체\n* [[망각 곡선]] — 같은 사람을 시간에 따라 재는 기억 연구(에빙하우스·Bahrick)도 종단 설계의 예\n\n근거: 3장 p.3, 🎙 9/15"
 },
 "테라토겐": {
  "title": "테라토겐 (Teratogen)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''테라토겐'''(teratogen)은 '''태아에게 해를 끼칠 수 있는 모든 물질의 총칭'''이다. 슬라이드 예시는 알코올·니코틴·바이러스. 출생 이전 발달(3장 p.4–5)에서 \"태아는 엄마 배 속에서도 바깥 환경의 영향을 받는다\"는 것을 보여 주는 대표 명칭이다.\n\n{def}\n'''설명''': 태아에게 해를 끼칠 수 있는 모든 물질의 총칭 (알코올, 니코틴, 바이러스 등) (3장 p.5)\n'''명칭''': [[테라토겐]] (Teratogen)\n{/def}\n\n{def}\n'''설명(사례형)''': 임신 중 지속적으로 술을 마신 산모의 아이가 태아 알코올 증후군을 갖고 태어났다. 이처럼 태반을 넘어 태아의 발달을 해치는 물질을 통틀어 부르는 말은?\n'''명칭''': [[테라토겐]]\n{/def}\n\n{analogy}\n태반은 태아를 지키는 '''정수기 필터'''인데, 테라토겐은 '''그 필터를 뚫고 들어오는 불순물'''이다. 알코올·니코틴·바이러스가 필터를 통과해 공사 중인 건물(태아)의 설계도에 얼룩을 남긴다 — 그 얼룩이 태어난 뒤에도 남는 '''후생유전적 특징'''이다.\n{/analogy}\n\n[[img:L3-05.png|3장 p.5 — 태아의 발달 과정(접합자~태아)과 테라토겐|medium]]\n\n== 슬라이드 내용 (p.4–5) ==\n* 태아는 '''접합자(수정란) → 배아 → 태아''' 과정으로 발전하며, 배아 때부터 생물적 발달이 시작된다.\n* 테라토겐과 같은 물질이 태아에 영향을 미친다.\n* 이러한 물질은 '''후생유전적인 특징'''을 태아에게 남긴다(Liu et al., 2009). [노트] 후생유전 = 태어난 뒤 유전자 상에 남는 특성. 예: '''태아 알코올 증후군'''.\n\n{| class=\"table\"\n! 테라토겐 예시 (p.5) || 비고\n|-\n| 알코올 || 태아 알코올 증후군(정리본 노트)\n|-\n| 니코틴 || 흡연\n|-\n| 바이러스 || 감염\n|}\n\n{tip}\n\"테라토(terato-)\"는 그리스어로 '괴물·기형'이라는 뜻이다. \"태아에 '''테러'''하는 물질\"로 외우면 단답형에서 바로 나온다.\n{/tip}\n\n{warn}\n\"[[습관화]]\"·\"[[각인]]\"처럼 태아·신생아 시기 명칭과 섞어 내는 보기가 가능하다. 테라토겐은 '''현상·능력이 아니라 물질'''의 총칭이다.\n{/warn}\n\n== 관련 문서 ==\n* [[3장 일생에 걸친 발달]] — p.4–5 출생 이전의 발달\n* [[선천성-후천성 논제]] — 배 속에서부터 환경(후천)이 작용한다는 예\n* [[습관화]] — 다음 시기(신생아)의 대표 명칭\n\n근거: 3장 p.5"
 },
 "습관화": {
  "title": "습관화 (Habituation)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''습관화'''(Habituation)는 '''같은 자극이 반복되면 그 자극에 대한 반응이 줄어드는 현상'''이다. 3장에서는 \"신생아도 이걸 한다 → 신생아에게도 '이거 전에 봤다'를 판별하는 기초 기억이 있다\"는 증거로 나오고, 5장에서는 비연합 학습의 한 종류로 '''둔감화'''(Habituation)라는 이름으로 다시 나온다. '''둘은 같은 개념'''이다.\n\n{def}\n'''설명''': 자극이 반복될 경우, 반응이 줄어드는 현상. 신생아 역시 반복된 자극에 대해서는 점차 반응의 빈도를 낮춘다 (3장 p.6)\n'''명칭''': [[습관화]] (Habituation)\n{/def}\n\n{def}\n'''설명(사례형)''': 기숙사 옆 공사장 소음에 처음엔 매번 깜짝 놀랐지만, 한 달쯤 지나자 같은 소리가 나도 거의 반응하지 않게 되었다.\n'''명칭''': [[습관화]] (5장 표기: 둔감화)\n{/def}\n\n{analogy}\n습관화는 '''스마트폰 알림 무시하기'''다. 처음 깐 앱의 알림은 울릴 때마다 확인하지만, 똑같은 광고 알림이 하루 열 번 오면 결국 진동이 울려도 손이 안 간다. 중요한 건 이게 '''\"이 알림은 아까 그거\"라고 알아본다'''는 뜻이라는 점 — 그래서 아기의 습관화는 아기의 '''기억'''을 엿보는 창이 된다.\n{/analogy}\n\n[[img:L3-06.png|3장 p.6 — 신생아의 습관화: 같은 공을 반복해서 보여 주면 반응(놀람)이 점점 줄어든다|medium]]\n\n== 3장에서의 의미 ==\n* 신생아도 성인과 비슷하게 자극에 반응한다(반사: 뺨 쪽으로 고개 돌림, 입에 닿으면 물기, 손에 닿으면 쥐기).\n* 습관화는 '''유아가 무엇을 보고 기억하는지에 대한 안목을 제공'''한다(p.6). 🎙 습관화가 일어난다 = 자극을 이전에 경험했는지 판별할 수 있다 = 기초적인 기억 능력.\n* 그래서 발달 연구는 \"익숙해진 자극 → 새 자극\" 을 보여 주고 반응이 '''다시 커지는지'''로 아기가 둘을 구별하는지 확인한다. 같은 논리가 [[감각 운동 단계|유아 물리학]]의 \"더 오래 응시\" 측정에도 깔려 있다.\n\n== 5장의 \"둔감화\"와 같은 말 ==\n{| class=\"table\"\n! || [[습관화]] (= 둔감화) || [[민감화]] (Sensitization)\n|-\n| 반복 자극에 대한 반응 || '''감소''' || '''증가'''\n|-\n| 장 || 3장 p.6 / 5장 p.2 \"둔감화(Habituation)\" || 5장 p.2\n|-\n| 종류 || 비연합 학습 || 비연합 학습\n|}\n\n{warn}\n'''습관화 vs [[감각 순응]]'''(4장 p.8) — 둘 다 \"반복되면 덜 느낀다\"처럼 보이지만, 감각 순응은 '''감각 수용기 수준'''에서 지속 자극에 대한 '''민감도'''가 떨어지는 것이고, 습관화는 자극을 '''알아보고''' '''반응(행동)'''을 줄이는 학습이다. 단답형에서 \"신생아 + 반복 자극 + 반응 빈도 감소\"가 나오면 '''습관화'''.\n{/warn}\n\n== 관련 문서 ==\n* [[민감화]] — 반대 방향의 비연합 학습\n* [[학습]] — 5장, 비연합 학습\n* [[감각 순응]] — 헷갈리는 짝\n* [[3장 일생에 걸친 발달]] — p.6–7 신생아의 능력\n\n근거: 3장 p.6; 5장 p.2(둔감화)"
 },
 "피아제의 인지 발달 단계": {
  "title": "피아제(Jean Piaget)의 인지 발달 단계",
  "category": [
   "3장 일생에 걸친 발달",
   "이론"
  ],
  "body": "'''피아제의 인지 발달 단계'''는 스위스 심리학자 '''장 피아제'''(Jean Piaget)가 제안한, 아동의 생각이 '''감각 운동 → 전조작 → 구체적 조작 → 형식적 조작'''의 네 계단을 밟아 어른의 사고에 도달한다는 이론이다. 3장 p.8–16 아홉 장을 통째로 차지하는, 이 장에서 가장 큰 덩어리다.\n\n{| class=\"table\"\n! 인물 카드 || \n|-\n| 이름(원어) || 장 피아제 (Jean Piaget, 1896–1980)\n|-\n| 학파·분야 || 발달심리학 — 인지 발달\n|-\n| 핵심 주장 || 특정 연령 아동의 '''오류가 유사'''하다는 데 주목. 아동은 [[스키마]]를 만들고 [[동화]]·[[조절]]하며 '''물리적 환경'''과 상호작용하여 4단계로 발달\n|-\n| 관련 연구(슬라이드 표기) || Brainerd(1996) 아동 추론의 비논리성 / 대상영속성·보존 과제\n|-\n| 시험 포인트 || 4단계 이름 + 연령 + 대표 현상, '''피아제 = 물리적 환경 vs [[비고츠키]] = 사회적 환경''', 공헌 2개·한계 2개\n|}\n\n{def}\n'''설명''': 특정 연령의 아동이 생성하는 오류가 유사한 점에 주목하여, 아동의 마음이 단순 반사에서 시작해 추상적 추리 능력에 이르기까지 연령에 따른 4가지 발달 단계를 거친다고 제안한 이론 (3장 p.8)\n'''명칭''': [[피아제의 인지 발달 단계]]\n{/def}\n\n{analogy}\n피아제의 4단계는 '''게임 캐릭터의 스킬 트리'''다. 레벨 1(감각 운동)은 \"눈에 안 보여도 아이템이 존재한다\"(대상 영속성) 패시브가 열리고, 레벨 2(전조작)는 \"말과 그림으로 물건을 대신하기\"(표상·가상 놀이)가 열리지만 \"되감기\"(심적 조작)는 아직 잠겨 있다. 레벨 3(구체적 조작)에서 되감기가 풀려 \"물을 다시 부으면 같은 양\"(보존)을 알고, 레벨 4(형식적 조작)에서 \"만약 ~라면\"(가설 추리) 궁극기가 열린다. 그런데 현대 연구 패치노트: \"스킬이 생각보다 '''일찍''', '''조금씩''' 열린다.\"\n{/analogy}\n\n[[img:L3-16.png|3장 p.16 — 피아제 이론의 발달단계 요약표(연령·단계·발달 현상·의의·재고찰할 점)|large]]\n\n== 발달의 원동력 (p.9) ==\n경험을 이해하려는 노력이 인지 발달의 원동력. 어린이는 '''[[스키마]]'''(정보를 체제화하고 해석하는 틀)를 만들고 그 스키마에 대해 '''[[동화]]'''(새 경험을 기존 스키마로 해석)와 '''[[조절]]'''(새 정보 수용을 위해 스키마를 변화/적응)을 수행한다. 🎙 \"스키마를 형성하고, 그 스키마를 변화시키는 방향으로 발달이 이루어진다.\"\n\n== 4단계 ==\n{| class=\"table\"\n! 연령 || 단계 || 단계별 기술 · 발달 현상 (p.16) || 할 수 없는 것\n|-\n| 출생~2세 || [[감각 운동 단계]] (Sensorimotor) || 감각 행위를 통한 경험 · '''[[대상 영속성|대상영속성]], 낯가림''' · [[감각 운동 단계|유아 물리학·유아 수학]] || 6개월 이전엔 대상영속성 없음\n|-\n| 2~6세 || [[전조작 단계]] (Preoperational) || 단어·이미지로 표상, 논리보다 '''직관''' · '''[[자기중심성]], [[전조작 단계|가상놀이]]''' || '''심적 조작''', '''[[보존 개념|보존]]'''\n|-\n| 7~11세 || [[구체적 조작 단계]] (Concrete operational) || 구체적 사건에 대한 논리적 사고·수리 연산 · '''보존 개념, 수학적 변환''' || 추상적·가설적 추리\n|-\n| 12세~성인 || [[형식적 조작 단계]] (Formal operational) || '''추상적 추리''' · 성숙한 도덕 추리 잠재성 || —\n|}\n\n[[anim:object_permanence|천으로 가린 장난감 → 6개월 전/후 아기 반응 → 유아 물리학 응시 시간. 다 보고 나서 아래 시뮬레이터로 연령을 올려 보라]]\n\n[[sim:piaget_stages]]\n\n== 의의와 재고찰할 점 (p.16) ==\n{| class=\"table\"\n! 의의 (🎙 \"두 가지 공헌\") || 재고찰할 점 (한계)\n|-\n| 아동의 발달 과정에 대한 '''인지적 이정표''' 제공 || 발달 단계가 훨씬 더 '''연속적'''으로 진행 (대상영속성도 점진적, Wang et al., 2004)\n|-\n| 아동이 수동적 수용자가 아닌 '''적극적 상호작용을 추구하는 존재'''임을 함의 || 각 유형의 사고가 '''더 이른 시기'''에 발현되기도 함 (유아 물리학·수학, 3세 가상 놀이)\n|}\n\n{exam}\n교수 강조(🎙 9/15): ① 피아제 이론의 핵심 = '''외부 물리적 환경과의 상호작용''' ↔ 비고츠키 = '''사회적 환경'''(p.17). ② 공헌 두 가지 = 이정표 + 아동의 능동성. ③ \"0과 1 같은 계단식이 아니라 점진적\" — 현대의 비판.\n{/exam}\n\n{warn}\nbank 오답 보기 재구성:\n* \"감각 운동 단계 — 가설적 명제에서 결론 도출\" ✗ → 형식적 조작\n* \"구체적 조작 단계 — 자기중심성이 두드러지고 보존 개념 결여\" ✗ → 전조작\n* \"형식적 조작 단계 — 출생부터 만 2세\" ✗ → 감각 운동\n* \"피아제는 언어를 내면화한 속내말로 문제를 해결한다고 보았다\" ✗ → 비고츠키\n{/warn}\n\n{quiz}\n다섯 살 민수가 같은 양의 주스를 좁고 긴 컵에 옮겨 부은 걸 보고 \"이쪽이 더 많아!\"라고 했다. 민수의 단계와 결여된 개념은?\n{/quiz}\n{answer}\n'''전조작 단계''', '''보존 개념''' 결여 (시각에 초점, 3장 p.12). \"구체적 조작 단계 + 보존 결여\"는 함정 — 구체적 조작은 보존을 '''이해하기 시작'''하는 단계다.\n{/answer}\n\n== 관련 문서 ==\n* 단계: [[감각 운동 단계]] · [[전조작 단계]] · [[구체적 조작 단계]] · [[형식적 조작 단계]]\n* 개념: [[스키마]] · [[동화]] · [[조절]] · [[대상 영속성]] · [[보존 개념]] · [[자기중심성]]\n* 대안: [[비고츠키]] — 사회적 환경\n* 연결: [[콜버그의 도덕성 발달 단계]] — \"아동의 도덕적 판단은 인지 발달에 기초(피아제+콜버그)\"\n\n근거: 3장 p.8–16"
 },
 "스키마": {
  "title": "스키마 (Schema)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''스키마'''(Schema)는 '''정보를 체제화하고 해석하는 틀'''이다. 피아제 이론에서 아이가 세상을 이해하는 '''머릿속 서랍장'''이며, 새 경험을 이 서랍에 그냥 넣으면 [[동화]], 서랍 자체를 새로 짜면 [[조절]]이다.\n\n{def}\n'''설명''': 정보를 체제화하고 해석하는 틀 (3장 p.9)\n'''명칭''': [[스키마]] (Schema)\n{/def}\n\n{def}\n'''설명(사례형)''': 두 살 아이의 머릿속에 \"털 있고 네 발로 걷고 짖는 것 = 멍멍이\"라는 틀이 생겨, 새로 보는 동물도 이 틀로 판단한다. 이 틀을 피아제는 무엇이라 불렀나?\n'''명칭''': [[스키마]]\n{/def}\n\n{analogy}\n스키마는 '''파일 탐색기의 폴더 구조'''다. 새 파일(경험)이 들어오면 기존 폴더에 끌어다 넣거나(동화), 들어갈 곳이 없으면 새 폴더를 만들고 구조를 바꾼다(조절). 폴더 구조가 점점 정교해지는 과정 = 인지 발달.\n{/analogy}\n\n[[img:L3-09.png|3장 p.9 — 스키마·동화·조절의 정의|medium]]\n\n== 피아제 이론에서의 위치 ==\n* \"경험을 이해하려는 노력이 인지 발달의 원동력\" → 어린이는 '''스키마를 형성'''하여 인지 발달이 이루어지며, 스키마에 대한 '''동화와 조절'''을 수행한다(p.9).\n* 🎙 9/15: \"피아제 이론의 골자는 스키마를 형성하고, 그 스키마를 변화시키는 방향으로 발달이 이루어진다는 것.\"\n\n{| class=\"table\"\n! 명칭 || 스키마에 무슨 일이? || 예\n|-\n| [[스키마]] || (틀 그 자체) || \"네 발 = 멍멍이\"\n|-\n| [[동화]] || 틀은 '''그대로''', 새 경험을 '''틀에 맞춰''' 해석 || 고양이 보고 \"멍멍이!\"\n|-\n| [[조절]] || 틀을 '''바꿈''' || \"고양이\"라는 새 범주 생성\n|}\n\n{tip}\n단답형 지문에 \"정보를 '''체제화'''하고 '''해석'''하는 '''틀'''\"이 보이면 바로 '''스키마'''. 스키마라는 말은 이 위키 범위(서막–6장 슬라이드)에서는 3장 p.9 에만 나온다.\n{/tip}\n\n== 관련 문서 ==\n* [[동화]] · [[조절]] — 스키마를 다루는 두 방식\n* [[피아제의 인지 발달 단계]] — 이론 전체\n* [[하향 처리]] — 기존 틀(지식·기대)이 지각을 이끈다는 4장의 비슷한 발상\n\n근거: 3장 p.9"
 },
 "동화": {
  "title": "동화 (Assimilation)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''동화'''(Assimilation)는 '''새로운 경험을 기존의 [[스키마]]로 해석'''하는 것이다. 틀은 그대로 두고 경험 쪽을 틀에 맞춘다. 짝꿍 [[조절]](틀을 바꿈)과 '''정반대 방향'''이라 시험에서 거의 항상 같이 나온다.\n\n{def}\n'''설명''': 새로운 경험을 기존의 스키마로 해석하는 것 (3장 p.9)\n'''명칭''': [[동화]] (Assimilation)\n{/def}\n\n{def}\n'''설명(사례형)''': 네 발 달린 동물은 모두 \"멍멍이\"라고 알던 세 살 아이가 처음 본 고양이를 가리키며 \"멍멍이!\"라고 불렀다.\n'''명칭''': [[동화]]\n{/def}\n\n{analogy}\n동화는 '''이미 아는 노래 가사로 외국 노래 따라 부르기'''다. 처음 듣는 팝송을 들으면서 아는 한국어 단어로 끼워 맞춰 흥얼거린다(\"몬데그린\"). 노래(경험)가 내 귀(스키마)에 맞게 바뀌어 들어올 뿐, 내 귀는 그대로다.\n{/analogy}\n\n[[img:L3-09.png|3장 p.9 — 동화(Assimilation): 새로운 경험을 기존의 스키마로 해석|medium]]\n\n== 동화 vs 조절 ==\n{| class=\"table\"\n! || [[동화]] (Assimilation) || [[조절]] (Accommodation)\n|-\n| 슬라이드 정의 || 새로운 경험을 '''기존의 스키마로''' 해석 || 새로운 정보의 수용을 위해 '''스키마를 변화/적응'''시키는 것\n|-\n| 바뀌는 쪽 || 경험(해석) || '''스키마'''\n|-\n| 고양이 사례 || \"멍멍이!\" || \"아, 고양이라는 게 따로 있구나\" — 새 범주\n|-\n| 외우기 || '''동'''일한 틀에 넣기 || 틀을 '''조'''정하기\n|}\n\n{warn}\nbank 해설 함정: 한 사례 안에 '''둘 다''' 들어 있을 수 있다. \"고양이를 멍멍이라 부른 것\"(동화) → \"엄마가 아니라고 해서 새 범주를 만든 것\"(조절). 문제가 '''어느 순간'''을 묻는지 읽어라. bank 단답형 정답은 '''조절'''이었다.\n{/warn}\n\n{quiz}\n피아노만 쳐 본 학생이 처음 신시사이저를 보고 \"건반이 있으니 피아노처럼 치면 되겠지\"라며 똑같이 쳤다. 이건 동화인가 조절인가?\n{/quiz}\n{answer}\n'''동화'''. 새 경험(신시사이저)을 기존 스키마(피아노)로 해석했다. 이후 음색 버튼·페달 차이를 알고 치는 법을 바꾸면 그게 조절이다.\n{/answer}\n\n== 관련 문서 ==\n* [[조절]] — 짝꿍\n* [[스키마]] — 동화의 대상\n* [[피아제의 인지 발달 단계]]\n\n근거: 3장 p.9"
 },

  "body": "'''조절'''(Accommodation)은 '''새로운 정보를 받아들이기 위해 [[스키마]]를 변화·적응시키는 것'''이다. 기존 틀로 도저히 설명이 안 될 때, 틀 자체를 고친다. ⭐ 3장 모의고사 bank 단답형의 정답 명칭이다.\n\n{def}\n'''설명''': 새로운 정보의 수용을 위해 스키마를 변화/적응시키는 것 (3장 p.9)\n'''명칭''': [[조절]] (Accommodation)\n{/def}\n\n{def}\n'''설명(사례형)''': 네 발 달린 동물은 모두 \"멍멍이\"라고 알던 아이가 고양이를 \"멍멍이\"라 불렀다가 엄마가 아니라고 알려 주자, \"고양이\"라는 새로운 범주를 만들어 기존 틀 자체를 고쳤다.\n'''명칭''': [[조절]]\n{/def}\n\n{analogy}\n조절은 '''내비게이션 지도 업데이트'''다. 새 도로가 뚫렸는데 옛 지도로는 계속 \"경로를 이탈했습니다\"만 나온다. 그때 지도 자체를 새 버전으로 갈아끼우는 것 = 조절. 옛 지도로 억지로 비슷한 길을 찾아 끼워 맞추는 건 [[동화]]다.\n{/analogy}\n\n[[img:L3-09.png|3장 p.9 — 조절(Accommodation): 새로운 정보의 수용을 위해 스키마를 변화/적응|medium]]\n\n== 동화와 조절의 비교 ==\n{| class=\"table\"\n! || [[동화]] || [[조절]]\n|-\n| 정의 || 새로운 경험을 기존의 스키마로 해석 || 새로운 정보 수용을 위해 스키마를 '''변화/적응'''\n|-\n| 스키마 || 그대로 || '''바뀜'''\n|-\n| 언제 || 새 경험이 기존 틀에 대충 맞을 때 || 기존 틀로 설명이 안 될 때\n|}\n\n{warn}\n'''이름 충돌 주의''' — \"조절\"은 다른 장에도 나온다. 4장 p.22 의 \"수정체: 빛의 굴절 정도를 '''조절'''\"(→ [[눈의 구조]])이나 일상어의 \"감정 조절\"과 혼동하지 말 것. 3장에서 \"'''스키마를 변화'''\"가 보이면 피아제의 조절. 또 5장의 [[조작적 조건화]], 1장의 [[조작적 정의]]의 \"조작\"과 3장 \"심적 조작\"도 서로 다른 말이다.\n{/warn}\n\n{quiz}\n\"새로운 경험을 기존의 스키마로 해석\" vs \"새로운 정보의 수용을 위해 스키마를 변화/적응\" — 각각의 명칭은?\n{/quiz}\n{answer}\n앞 = '''동화'''(Assimilation), 뒤 = '''조절'''(Accommodation).\n{/answer}\n\n== 관련 문서 ==\n* [[동화]] — 짝꿍\n* [[스키마]]\n* [[피아제의 인지 발달 단계]]\n\n근거: 3장 p.9"
 },
 "감각 운동 단계": {
  "title": "감각 운동 단계 (Sensorimotor Stage)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''감각 운동 단계'''(Sensorimotor stage)는 [[피아제의 인지 발달 단계]]의 첫 단계로, '''출생~만 2세''' 아기가 '''신체 감각과 운동을 통해''' 외부 세상을 받아들이는 시기다. 이 시기의 최대 성취는 [[대상 영속성|대상영속성]]이고(🎙 \"감각운동기의 가장 큰 능력\"), 또 하나의 발달 현상이 '''낯가림'''이다(p.16).\n\n{def}\n'''설명''': 신체 감각 및 운동을 통하여 외부 세상을 수용하는, 출생~만 2세까지에 해당하는 피아제의 첫 번째 인지 발달 단계 (3장 p.10)\n'''명칭''': [[감각 운동 단계]] (Sensorimotor Stage)\n{/def}\n\n{analogy}\n감각 운동기 아기는 '''손과 입으로 검색하는 브라우저'''다. 검색창(언어)이 아직 없어서 모든 걸 쥐어 보고, 빨아 보고, 떨어뜨려 보며 \"이게 뭐지\"를 알아낸다. 그러다 6개월쯤 \"탭을 닫아도(천으로 가려도) 페이지는 남아 있다\"는 걸 깨닫는다 — 대상영속성.\n{/analogy}\n\n[[img:L3-10.png|3장 p.10 — 감각 운동 단계: 천으로 덮인 장난감을 들춰 찾는 아기|medium]]\n\n== 슬라이드 내용 (p.10–11, p.16) ==\n* 신체 감각 및 운동을 통하여 외부 세상을 수용. 출생~만 2세.\n* 생후 6개월 이전에는 [[대상 영속성|대상영속성]]이 존재하지 않으나 그 이후에 형성. 현대 발달심리학은 이 발달이 단계적이기보다 '''점진적이고 연속적'''이라고 본다(Wang et al., 2004).\n* p.16 요약표: 감각 행위를 통한 경험 / 발달 현상 = '''대상영속성, 낯가림'''.\n* 🎙 낯가림 = 익숙한 자극과 익숙하지 않은 자극을 구분 → 부모와의 '''[[애착]] 형성의 시작'''.\n\n== 유아 물리학 · 유아 수학 (p.11) ==\n[[img:L3-11.png|3장 p.11 — 유아 물리학의 예시: 공이 사라지는 불가능한 사건을 더 오래 응시|medium]]\n\n=== 유아 물리학 ===\n{def}\n'''설명''': 유아가 대상영속성을 위배한 사물(갑자기 사라지는 물체 등)을 더 오래 응시한다는 연구 결과로, 유아의 검증·인과 추론 능력을 보여 주는 것 (3장 p.11, Shuarwairi & Johnson, 2013)\n'''명칭''': '''유아 물리학'''\n{/def}\n\n=== 유아 수학 ===\n{def}\n'''설명''': 유아가 직전에 본 공의 개수와 나중에 본 공의 개수가 불일치할 경우 더 오랜 응시 시간을 보인다는 연구 결과 (3장 p.11, 캐런 윈, 2008)\n'''명칭''': '''유아 수학'''\n{/def}\n\n* 개수 불일치에 대한 감각은 다양한 영역에 적용 가능(Libertus & Brannon, 2009).\n* 측정 원리: \"예상과 다르면 더 오래 본다\" — [[습관화]]가 풀리는 것과 같은 논리.\n* [노트] 두 결과는 '''피아제 이론이 간과한 부분''' → 추론 능력이 예상보다 '''일찍''' 발달. 🎙 \"추상적 추론은 나중이지만 '''인과 추론은 감각운동기부터'''.\"\n\n[[anim:object_permanence|가림 → 찾기 → 가능한/불가능한 사건 응시 시간 비교. 불가능한 사건 막대가 더 긴 이유를 말해 보라]]\n\n{warn}\n객관식 단골: \"낯가림·대상영속성 = '''감각운동기'''\". 보존 개념·가설 추리를 감각 운동 단계에 붙인 보기는 오답. 또 \"유아 물리학·유아 수학은 피아제 이론을 '''지지'''하는 근거\"라고 하면 ✗ — 피아제가 '''간과한''' 부분이다.\n{/warn}\n\n{quiz}\n생후 5개월 아기에게 인형 1개를 칸막이 뒤에 넣는 장면 → 1개 더 넣는 장면을 보여 준 뒤 칸막이를 치웠더니 인형이 1개뿐이었다. 아기는 2개일 때보다 더 오래 쳐다봤다. 이 연구 결과를 부르는 이름은?\n{/quiz}\n{answer}\n'''유아 수학'''(캐런 윈) — 개수 불일치에 더 오래 응시. 피아제가 간과한 이른 추론 능력.\n{/answer}\n\n== 관련 문서 ==\n* [[대상 영속성]] — 핵심 성취\n* [[피아제의 인지 발달 단계]] — 다음 단계: [[전조작 단계]]\n* [[애착]] — 낯가림이 애착 형성의 시작\n\n근거: 3장 p.10–11, p.16"
 },
 "대상 영속성": {
  "title": "대상 영속성 (Object Permanence)",
  "category": [
   "3장 일생에 걸친 발달",
   "용어"
  ],
  "body": "'''대상 영속성'''(object permanence, 슬라이드 표기 '''대상영속성''')은 '''대상이 물리적으로 지각되지 않아도 그 대상이 존재함을 아는 것'''이다. [[감각 운동 단계]]에서 '''생후 6개월 이후''' 형성된다. ⭐ 3장 모의고사 bank 단답형 정답이며 \"대상영속성\"(붙여 쓰기)도 정답 처리된다.\n\n{def}\n'''설명''': 대상이 물리적으로 지각되지 않아도 대상이 존재함을 아는 것 (3장 p.10)\n'''명칭''': [[대상 영속성]] (Object Permanence)\n{/def}\n\n{def}\n'''설명(사례형)''': 생후 4개월 아기는 좋아하는 딸랑이를 담요로 덮으면 사라진 것처럼 반응하지만, 생후 8개월 아기는 담요를 들춰 딸랑이를 찾아낸다. 눈에 보이지 않아도 계속 있다는 것을 아는 이 개념은?\n'''명칭''': [[대상 영속성]]\n{/def}\n\n{analogy}\n대상 영속성이 없는 아기에게 세상은 '''화면 밖으로 나가면 삭제되는 게임 오브젝트'''다. 카메라(눈)에 안 잡히면 메모리에서 지워진다. 대상 영속성이 생기면 \"화면 밖에도 맵은 계속 있다\"는 걸 안다 — 그래서 '''까꿍 놀이'''가 재밌어진다. 사라졌다가 '''돌아올 걸 아니까'''.\n{/analogy}\n\n[[img:L3-10.png|3장 p.10 — 장난감을 천으로 덮자 천을 들춰 찾는 아기(대상영속성 형성 후)|medium]]\n\n[[anim:object_permanence|6개월 이전 아기(시선을 돌림) vs 이후 아기(천을 들춤), 이어서 유아 물리학의 응시 시간 비교]]\n\n== 언제 생기나 ==\n{| class=\"table\"\n! 시기 || 반응 || 해석\n|-\n| 생후 6개월 '''이전''' || 장난감을 가리면 관심을 잃음 || 대상영속성 ✗\n|-\n| 생후 6개월 '''이후''' || 가린 천을 들춰 찾음 || 대상영속성 ✓\n|-\n| 현대 연구 (Wang et al., 2004) || 단계적이기보다 '''점진적·연속적'''으로 나타남 || 피아제 이론의 \"재고찰할 점\"\n|}\n\n* p.11 [[감각 운동 단계|유아 물리학]]: 유아는 '''대상영속성을 위배한 사물'''을 더 오래 응시 → 생각보다 일찍 무언가를 알고 있다는 증거.\n* 🎙 \"보이지 않는 부분 너머가 존재한다는 이해는 지각 체계에서 매우 중요하다.\" 감각운동기의 '''가장 큰 능력'''.\n\n[[sim:piaget_stages]]\n\n{warn}\n대상 영속성은 '''감각 운동 단계'''(출생~2세)의 성취다. \"전조작 단계에서 처음 형성\"·\"보존 개념과 같은 것\" 같은 보기는 오답. 또 6개월은 \"형성 시작\" 기준이지 \"2세\"가 아니다(2세는 감각 운동 단계의 끝).\n{/warn}\n\n{quiz}\n\"현대 발달심리학은 대상영속성이 특정 시점에 갑자기 생긴다고 본다.\" O/X?\n{/quiz}\n{answer}\n'''X'''. 단계적이기보다 '''점진적·연속적'''으로 나타난다(Wang et al., 2004, 3장 p.10).\n{/answer}\n\n== 관련 문서 ==\n* [[감각 운동 단계]] — 소속 단계\n* [[피아제의 인지 발달 단계]]\n* [[보존 개념]] — 다른 단계의 \"보이는 것에 속지 않기\" 능력\n\n근거: 3장 p.10–11, p.16"
 },
